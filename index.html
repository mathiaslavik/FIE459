ding carry the largest weights."],["X: profitability counts most","Financial viability is a condition, not the main driver."],["Neither","It applies to banks in general."],["Both score the same","The scorecard covers viability, real-economy focus and triple bottom line."]],"c":[0],"es":"Real-economy and triple-bottom-line lending drive the GABV score.","ed":"Financial viability matters but is a condition, consistent with SF 3.0. Qualitative factors (leadership, culture, products) can adjust the score.","kt":"Triple bottom line: people, planet and profit - social, environmental and financial results.","src":"Bok s. 304 (Table 10.4) · L11 slide 22"},{"id":"SB412","l":"L11","t":"Values-based banking","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Risk-based lending looks at return, risk and impact, while values-based banking looks only at return and risk.","o":[["True","Incorrect. It is the reverse: the risk-based approach is two-dimensional (return, risk); values-based banking adds impact as a third dimension (Figure 10.4)."],["False","Correct. It is the reverse: the risk-based approach is two-dimensional (return, risk); values-based banking adds impact as a third dimension (Figure 10.4)."]],"c":[1],"es":"False: values-based banking is three-dimensional (return, risk, impact).","ed":"In values-based banking, project proposals go to a credit committee that judges viability in an integrated way, considering impact and risk. VBBs lend for economic resilience (microfinance, inclusion), social empowerment (education, health care, housing) and environmental regeneration (renewables, efficiency, sustainable agriculture). Projects that meet minimum impact criteria form the eligible universe (principle of inclusion).","kt":"","src":"Bok s. 303 (10.5) · Bok s. 303 (Figure 10.4) · Bok s. 304 (10.5)"},{"id":"SB413","l":"L11","t":"Sustainable loans","f":"m","d":2,"p":"H","sc":"none","s":"How do green loans differ from sustainability-linked loans (SLLs)?","o":[["Green: projects; SLL: KPIs","Slides 24-25 make this distinction."],["Green: KPIs; SLL: projects","The definitions are reversed."],["SLLs are only for utilities","SLLs are spread across many sectors; green loans are concentrated in utilities."],["Both must fund renewables","SLL proceeds can be used for general purposes."]],"c":[0],"es":"Green loan = use-of-proceeds; SLL = general purpose with interest rate linked to sustainability performance.","ed":"The LMA/APLMA/LSTA have Green Loan Principles, Social Loan Principles and Sustainability-Linked Loan Principles. UN PRI data show rapid growth of ESG loans 2016-21, with SLLs the largest share by 2021 and spread across sectors, while green loans are concentrated in utilities. ING's 2017 €1bn Philips facility was an early SLL: if Philips' sustainability improves, the rate falls and vice versa.","kt":"","src":"L11 slide 23-25 · Bok s. 295 (Box 10.1)"},{"id":"SB414","l":"L11","t":"Sustainable loans","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In 2017 Philips got a €1bn credit line from 16 banks, with the interest rate linked to its sustainability performance. Which statement is correct?","o":[["It is a social impact bond","It is a revolving credit facility, not an SIB."],["The money can be used freely","Box 10.1 states the facility is for general corporate purposes."],["The rate is fixed","The rate is linked to sustainability performance."],["Philips checks itself","An independent provider, Sustainalytics, assessed and benchmarked performance."]],"c":[1],"es":"SLL: general purpose; margin ratchet tied to independently assessed sustainability performance.","ed":"The Philips facility incentivises the borrower to improve while ING reduces its risk. It followed Philips' \"Healthy People, Sustainable Planet\" programme (carbon neutrality and 100% renewable electricity by 2020; improving 3 billion lives a year by 2025). Credibility of SLLs depends on ambitious and material KPIs, independent verification, and a meaningful margin adjustment. Also true, but not offered as an option here: If Philips' sustainability performance improves, the rate falls; if it worsens, the rate rises.","kt":"","src":"Bok s. 295 (Box 10.1) · L11 slide 25"},{"id":"SB415","l":"L11","t":"Equator Principles","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the Equator Principles for project finance?","o":[["Independent review","Listed on slide 26."],["A guaranteed return","Not an Equator Principle."],["Mandatory green bonds","Not an Equator Principle."],["Shareholder votes on projects","Not an Equator Principle."]],"c":[0],"es":"EP: review and categorisation, E&S assessment, applicable standards, ESMS and action plan, stakeholder engagement, grievance mechanism, independent review, covenants, independent monitoring and reporting, reporting and transparency.","ed":"The Equator Principles help banks avoid a \"race to the bottom\" in project finance, where less responsible banks could undercut others by ignoring standards. Projects are categorised by E&S risk; risky projects need assessments, management systems, stakeholder engagement, grievance mechanisms and independent review; covenants require compliance with host country laws (IFC Performance Standards where regulation is weak). As of March 2021, 116 institutions in 37 countries had adopted them. Limitations: no monitoring of adherence; only about 5% of banks disclose everything required (Weber, 2017). Also true, but not offered as an option here: Grievance mechanism.","kt":"","src":"L11 slide 26 · Bok s. 297 (10.4.1) · Bok s. 298 (10.4.1)"},{"id":"SB416","l":"L11","t":"Equator Principles","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The Equator Principles have strong enforcement, and nearly all member banks disclose all required information.","o":[["True","Incorrect. There is no mechanism to monitor adherence, and Weber (2017) finds only about 5% of banks disclose all the information required."],["False","Correct. There is no mechanism to monitor adherence, and Weber (2017) finds only about 5% of banks disclose all the information required."]],"c":[1],"es":"False: no adherence monitoring; ~5% full disclosure.","ed":"The Equator Principles are a useful starting point covering over 70% of project finance, but they rely on self-regulation. Weber recommends standardisation and assurance of reporting. They also assess climate impact using scope 1 and 2 emissions only, while TCFD recommends scope 3 where appropriate. Project finance risks are inside-out (impact of projects), outside-in (weather, strikes, blockades) and reputational for financiers (e.g. the Dakota Access Pipeline, which several banks exited).","kt":"","src":"Bok s. 298 (10.4.1) · Bok s. 297 (10.4.1) · Bok s. 300 (Box 10.3)"},{"id":"SB417","l":"L11","t":"UN Principles for Responsible Banking","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the UN Principles for Responsible Banking?","o":[["Set impact targets","This is principle 2 on slide 29."],["Never lend to energy firms","The PRB do not prescribe sector bans."],["Keep impacts secret","Principle 6 calls for transparency and accountability."],["Maximise short-term returns","Not a PRB principle."]],"c":[0],"es":"PRB: 1 alignment (SDGs, Paris); 2 impact and target setting; 3 clients and customers; 4 stakeholders; 5 governance and culture; 6 transparency and accountability.","ed":"The PRB were launched by UNEP FI (consultation in 2018) and by the time of slide 28 had 247 signatories representing about 40% of global banking assets (about $65 trillion). They ask banks to align strategy with the SDGs and the Paris Agreement, set targets where impacts are most significant, work with clients, engage stakeholders, build governance and culture, and report on positive and negative impacts. The FT (slide 32) notes many banks have walked back climate commitments and increased fossil finance in 2024.","kt":"","src":"L11 slide 27-29 · L11 slide 32"},{"id":"SB418","l":"L11","t":"Banking regulation","f":"m","d":3,"p":"H","sc":"none","s":"What does the Green Asset Ratio (GAR) measure for a bank?","o":[["Emissions per employee","The GAR is about financed activities, not own emissions."],["Equity to green bonds","GAR concerns assets (exposures), not equity or bond issuance."],["Share of staff in sustainability jobs","Not what the GAR measures."],["Share of taxonomy-aligned loans","The GAR is based on the EU taxonomy."]],"c":[3],"es":"GAR = taxonomy-aligned exposures / covered assets; BTAR extends this to the banking book; also transition and physical risk exposure templates.","ed":"Four major EU ESG regulations affect banks: the EU Taxonomy, SFDR, CSRD and the EBA's Pillar 3 ITS. Listed banks disclose 10 quantitative and 3 qualitative templates: transition risk (exposures to carbon-related sectors, fossil fuel companies, real estate by energy performance), physical risk (exposures to chronic and acute climate events by sector and geography), mitigating actions, the Green Asset Ratio and the banking book taxonomy alignment ratio (BTAR), plus qualitative E, S and G risk disclosures.","kt":"","src":"L11 slide 30-31"},{"id":"SB419","l":"L11","t":"Banking regulation","f":"m","d":4,"p":"H","sc":"none","s":"Should bank capital rules be used to steer lending to green projects? The textbook says:","o":[["Central banks should pick technologies","Carney argues this is for governments, not central bankers."],["Never consider climate risk","It supports higher weights for brown assets and possible Pillar 2 add-ons when evidence suffices."],["Lower capital rules for all green loans","The textbook says green projects face technology and policy uncertainty."],["Raise rules for brown loans","The textbook prefers a brown penalising factor to a green supporting factor."]],"c":[3],"es":"No green discount (green is not safer); possible brown add-on (stranding risk); Carney warns against using prudential rules for other ends.","ed":"Schoenmaker and Van Tilburg propose using the capital framework to nudge lending; banks do reduce lending when capital requirements tighten. But green projects are uncertain (which technology wins, future carbon taxes), so there is no reason to lower their risk weights; brown assets' risk weights can rise because they may become stranded, creating a wedge. Carney (2015) argues prudential rules designed for financial stability should not be used for other ends; it is for governments to decide. Supervisors can still apply Pillar 2 add-ons for brown concentrations if evidence suffices.","kt":"","src":"Bok s. 301 (10.4.5) · Bok s. 302 (10.4.5)"},{"id":"SB420","l":"L11","t":"Banking regulation","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about lending regulation is correct?","o":[["China's policy hurt bank results","He finds two-way positive causality between financial and sustainability performance."],["It applies only to state banks","It is compulsory for all Chinese banks, including joint-stock banks and credit unions."],["Brazil bans environmental factors","Brazil requires integration of socio-environmental risk."],["China limits loans to polluters","Section 10.4.5."]],"c":[3],"es":"China: compulsory Green Credit Policy (2006); Brazil: central bank socio-environmental risk systems; both mandatory and coordinated.","ed":"China's Green Credit Policy (2006), overseen by environmental, central bank and banking regulators, demands restricted lending and higher rates for polluters and lower rates for green activities, and even withdrawal of loans after controversies; being compulsory for all banks, it limits free-riding. Weber finds Chinese banks' E&S performance improved 2009-13 with positive two-way causality to financial performance. Brazil, motivated by rainforest protection, built on a voluntary Green Protocol to require socio-environmental risk systems. Also true, but not offered as an option here: Brazil's central bank requires all banks to integrate socio-environmental risks alongside credit, market and operational risks.","kt":"","src":"Bok s. 298 (10.4.2) · Bok s. 299 (10.4.2) · Bok s. 302 (10.4.5) · Bok s. 303 (10.4.5)"},{"id":"SB421","l":"L11","t":"Evidence on sustainable lending","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Two firms with the same credit rating apply for unsecured loans. Firm A has serious environmental and social scandals; firm B does not. What should we expect?","o":[["A pays more","Lenders charge more for CSR concerns, more so without collateral."],["Both pay the same rate","Banks price ESG concerns beyond ratings."],["A pays less","Higher risk means higher spreads."],["B pays more","Lenders mainly worry about discretionary CSR at low-quality borrowers."]],"c":[0],"es":"ESG concerns → higher loan spreads, especially without collateral.","ed":"Goss and Roberts find CSR concerns raise loan spreads, and Chava finds higher rates for firms with environmental concerns and lower rates for green revenues. Banks act as delegated monitors that price ESG into credit risk.","kt":"Loan spread: the margin over the base rate that a borrower pays, reflecting credit risk and other costs.","src":"Bok s. 299 (10.4.3)"},{"id":"SB422","l":"L11","t":"Barriers and incentives","f":"m","d":3,"p":"M","sc":"none","s":"Which is a barrier to bringing sustainability into lending?","o":[["Loans are shorter than most E&S risks","Myopic bankers may ignore these risks."],["Banks know too little about borrowers","Banks have privileged information through monitoring."],["Pricing ESG is banned","Several regulators encourage or require it."],["Green loans are never profitable","VBB evidence shows stable profitability."]],"c":[0],"es":"Barriers: staff training and incentives, client status quo, short loan maturities vs long-term ESG risks.","ed":"Integrating ESG requires training many account managers and changing due diligence and pricing; frameworks are implemented top down. Existing clients may resist; banks often phase in requirements (BNP Paribas stopped new tobacco financing in 2017 but honoured existing contracts). Short loan maturities can make bankers myopic, but collateral like real estate is long-lived and firms can become unviable quickly if they fail to adapt. Also true, but not offered as an option here: Account managers are trained to grant loans whenever possible and may resist charging long-standing clients a higher premium.","kt":"","src":"Bok s. 300 (10.4.4) · Bok s. 300 (Box 10.3)"},{"id":"SB423","l":"L11","t":"Barriers and incentives","f":"m","d":3,"p":"H","sc":"short","s":"A bank charges a higher mortgage rate for homes with energy labels E-G than A-D. Why?","o":[["Nudging and safer collateral","Thaler and Sunstein's nudge; brown homes are expected to lose value."],["Regulators ban E-G mortgages","This is a pricing incentive, not a ban."],["Inefficient homes are cheaper to insure","The rationale is about collateral value and emissions, not insurance cost."],["Green homes default more","Lower pricing reflects lower collateral risk, not higher default."]],"c":[0],"es":"Base rate for green (default option), premium for brown; supports collateral values and household behaviour.","ed":"The nudging theory of change applies a base lending rate to projects with low ESG risk and a premium to those with ESG concerns, making the sustainable option the default. Buildings account for 40% of EU energy use and 36% of emissions; up to 60% of bank lending is mortgages. The European Mortgage Federation's energy-efficient mortgage initiative offers preferential rates for moving homes from the brown (E-G) to the green (A-D) zone. Energy-efficient homes are expected to retain collateral value while inefficient ones decline.","kt":"","src":"Bok s. 301 (10.4.5) · Bok s. 301 (Box 10.4) · Bok s. 291 (10.3)"},{"id":"SB424","l":"L11","t":"Circular economy financing","f":"m","d":4,"p":"M","sc":"none","s":"Why are circular (product-as-a-service) business models harder for banks to finance?","o":[["Banks may not lend to them","No such prohibition exists."],["They have no cash flows","They generate periodic lease or service payments."],["Lease income and unclear collateral","Linear models have clear collateral and sales cash flows; circular ones do not."],["Their products wear out faster","They have longer lifespans and higher residual values."]],"c":[2],"es":"Circular: longer payback, lease cash flows, ownership concentration risk, collateral issues → need new credit approaches.","ed":"In linear models, buildings, machines and inventories serve as collateral and loans are repaid from sales. In circular models the producer keeps ownership and earns lease payments over a longer horizon; bank loans typically cover 5-7 years. Legal issues arise (bricks cannot be separated from a house), and retained ownership creates concentration risk (diesel car write-downs). Oliver Wyman estimates 65% of Dutch circular businesses struggle to get finance. Solutions include materials passports, phased finance, isolating the least risky parts, client pre-financing and moving from historical financials to future cash flows.","kt":"","src":"Bok s. 305 (10.5.1) · Bok s. 306 (10.5.1) · Bok s. 307 (10.5.1)"},{"id":"SB425","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A savings bank lends only to projects with a clear social or environmental benefit, as long as they are financially viable. This is:","o":[["ESG risk integration (SF 2.0)","SF 2.0 adjusts risk premia; here impact drives selection."],["Exclusion (SF 1.0)","It goes beyond excluding harmful sectors."],["Finance as usual","Impact criteria change who gets loans."],["Value-based banking (SF 3.0)","Impact is the first criterion; viability is a constraint."]],"c":[3],"es":"Impact first, viability as constraint = SF 3.0.","ed":"GABV banks such as Triodos follow this model and show stable, if slightly lower, ROE with lower volatility. Risk-based approaches (SF 1.0-2.0) instead adjust exclusions and risk premia within conventional lending.","kt":"Value-based banking: lending primarily to projects with positive social or environmental impact, with financial viability as a condition (return, risk and impact).","src":"L11 slide 18 · L11 slide 22 · Bok s. 303 (10.5)"},{"id":"SB426","l":"L11","t":"Banking structure","f":"t","d":3,"p":"L","sc":"none","s":"True or false: The US Volcker Rule moves proprietary trading into a separate unit, while the EU Liikanen Report bans it outright.","o":[["True","Incorrect. It is the reverse: the Volcker Rule prohibits proprietary trading by deposit-taking banks; the Liikanen Report proposes assigning significant trading to a separate legal entity within the group."],["False","Correct. It is the reverse: the Volcker Rule prohibits proprietary trading by deposit-taking banks; the Liikanen Report proposes assigning significant trading to a separate legal entity within the group."]],"c":[1],"es":"False: Volcker = prohibition; Liikanen = separation into a separate entity.","ed":"After the crisis, reforms aimed to protect the core of deposit-taking banking from risky trading. The Volcker Rule bans proprietary trading (with exemptions for market-making, hedging and US government securities). Liikanen proposed ring-fencing trading above a threshold (e.g. 10% of business) into a separate legal entity, preserving Europe's universal banking model. These reforms aim at a more \"real economy\" focused banking system, similar to values-based banks' profile.","kt":"","src":"Bok s. 288 (10.2.1) · Bok s. 289 (10.2.1)"},{"id":"SB427","l":"L11","t":"Material issues","f":"m","d":3,"p":"L","sc":"extended_course_case","s":"Handelsbanken did well in the financial crisis. What stands out about its business culture?","o":[["No performance bonuses","This is listed under the bank's business culture."],["All lending decided at headquarters","Its topics stress local presence and responsible lending."],["Focus on quarterly returns","It sees shareholder value as achievable only through long-term value for customers and society."],["Bonuses for loan growth","Handelsbanken explicitly avoids volume-related bonuses."]],"c":[0],"es":"Handelsbanken: customers, community role, indirect impact, employer, business culture (no bonuses), the bank as an investment.","ed":"Handelsbanken's six topics are: the bank and its customers; its role in the community (local presence, taxpayer, not a burden on society); its indirect impact (responsible credits and investments); the bank as an employer; business culture (ethics, no performance- or volume-related bonuses, anti-money laundering); and the bank as an investment. Its strong, low-variance earnings illustrate that a long-term, stakeholder-oriented approach can coexist with profitability.","kt":"","src":"Bok s. 289 (10.2.2) · Bok s. 290 (10.2.2)"},{"id":"SB428","l":"L11","t":"Banking synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A Norwegian bank has a big, long-time shipping client with an old, inefficient fleet. The loans mature within five years. What is the best approach?","o":[["Price the risk; offer a KPI loan","Combines risk-based pricing, nudging via SLLs and a phased approach, preserving the relationship."],["End all loans at once","Banks typically honour existing contracts and phase in requirements."],["Ignore it","Short maturities can make bankers myopic, but collateral and viability can deteriorate quickly."],["Lower the client's risk weight","Banks cannot set regulatory weights; green exposures are not inherently safer."]],"c":[0],"es":"Risk-based pricing + engagement/nudging (SLL) + phased tightening, while monitoring collateral values.","ed":"The client's transition risk affects PD (regulation, fuel costs, charterers' requirements) and LGD (vessel collateral may lose value, like diesel cars). The textbook suggests reflecting ESG in the risk premium, using nudges (base rate for compliant, premium for non-compliant), and phasing in requirements for existing clients (BNP Paribas tobacco). SLLs tie margins to KPIs. Exit remains a last resort if the client refuses to adapt. EBA Pillar 3 disclosures make such exposures visible.","kt":"","src":"Bok s. 300 (10.4.4) · Bok s. 301 (10.4.5) · L11 slide 25 · L11 slide 31 · Bok s. 306 (10.5.1)"},{"id":"SB429","l":"L11","t":"Bank climate commitments","f":"m","d":4,"p":"M","sc":"short","s":"In 2024-25 the largest US banks left the Net-Zero Banking Alliance, and banks increased fossil fuel lending. What does this suggest about voluntary coalitions?","o":[["Banks do not affect emissions","Financing choices affect which projects get built."],["Regulation is not needed","The textbook sees regulation and coalitions as complements."],["Members can leave or free ride","Weak sanctions are a known weakness of coalitions (Ostrom criteria)."],["They always lead to binding cuts","The case shows commitments can be abandoned."]],"c":[2],"es":"Voluntary coalitions are fragile without monitoring and sanctions.","ed":"Chapter 4 argues effective coalitions need clear rules, monitoring and sanctions. Disclosure rules (EBA Pillar 3, CSRD) and supervisors can partly substitute for weak voluntary enforcement.","kt":"Free riding: enjoying the benefits of a coalition (reputation) without following its rules or costs.","src":"L11 slide 32 · Bok s. 113 (4.3.1)"},{"id":"SB430","l":"L11","t":"Sustainability and collateral","f":"m","d":3,"p":"M","sc":"none","s":"Why does sustainability matter for the collateral banks take?","o":[["Collateral values never change","Collateral values fluctuate with markets and regulation."],["Only unsecured loans are at risk","Secured loans are exposed through collateral values."],["Electric cars are risk-free collateral","The textbook flags lithium mining and disposal as dilemmas."],["Collateral can lose value","Energy efficiency is a key determinant of real estate's future value."]],"c":[3],"es":"Transition can strand collateral (inefficient real estate, diesel cars); sustainability dilemmas exist (EV batteries).","ed":"Since close to 60% of bank credit is mortgages, real estate energy efficiency is central. Cars with combustion engines may lose value while hybrids and EVs keep theirs, though mining and disposal of lithium for batteries pose land-system concerns - a sustainability dilemma. Banks should consider the full impact of sustainability on a borrower's business model and on collateral when approving loans.","kt":"","src":"Bok s. 291 (10.3) · Bok s. 292 (10.3)"},{"id":"SB431","l":"L11","t":"Competition in sustainable lending","f":"m","d":3,"p":"L","sc":"none","s":"Which three types of social and environmental risk arise in project finance (Weber, 2017)?","o":[["Scope 1, 2 and 3","These are emission categories."],["Interest rate, currency, liquidity","These are financial market risks."],["Adverse selection, moral hazard, verification","These are the monitoring problems banks address."],["Inside-out, outside-in, reputation","These are the three types in section 10.4.1."]],"c":[3],"es":"Inside-out (project impacts), outside-in (weather, strikes, blockades), reputation risk for financiers.","ed":"Big projects such as hydro dams or mines have large impacts on environment and society (inside-out); they can be hit by extreme weather, strikes, NGO blockades or permit delays (outside-in); and controversies can damage the reputation of the financiers too. Less responsible banks might undercut competitors by ignoring standards on child labour or land degradation; the Equator Principles were developed to avoid this race to the bottom.","kt":"","src":"Bok s. 297 (10.4.1)"},{"id":"TR50","l":"L11","t":"Information asymmetry in banking","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank charges every small firm the same rate because it cannot tell good from bad borrowers. What happens, and what should the bank do?","o":[["Safe firms leave; the bank must screen","This is adverse selection, the lending version of Akerlof's lemons."],["All firms borrow more","The pool worsens, so the bank does not become safer."],["Nothing happens","A uniform rate ignores the true risk of each borrower."],["Borrowers take more risk; raise deposit rates","Risk-taking after the contract is moral hazard, and deposit rates do not fix it."]],"c":[0],"es":"Pooling rates drive out good borrowers; screening fixes this.","ed":"Adverse selection happens before the contract (screening is the remedy); moral hazard after it (monitoring is the remedy). In the lemons example, buyers pay the average price, good sellers leave, and the market can collapse. Banks' size and expertise make screening and monitoring cheaper than for individual lenders.","kt":"Adverse selection: hidden information before a contract leads to bad types crowding out good ones (Akerlof's market for lemons).","src":"Opptak L11 ca. 8 min · Opptak L5 ca. 17 min"},{"id":"TR51","l":"L11","t":"Bank business model","f":"m","d":2,"p":"M","sc":"none","s":"On a bank's balance sheet, where are deposits and loans, and why does equity matter?","o":[["Both are assets","Deposits are owed to customers, so they are liabilities."],["Deposits: debts; loans: assets","Equity is the cushion when loans default, protecting depositors."],["Both are off the balance sheet","Loans and deposits are the core balance sheet items."],["Deposits: assets; loans: debts","This reverses assets and liabilities for a bank."]],"c":[1],"es":"Deposits = liabilities; loans = assets; equity = loss cushion.","ed":"If loan losses become known, depositors may run, creating liquidity risk. Capital requirements (Basel) force banks to hold enough equity. A proposed \"green asset ratio\" would add a target for the share of green assets.","kt":"","src":"Opptak L11 ca. 16 min · Opptak L11 ca. 48 min"},{"id":"TR52","l":"L11","t":"Sustainability approaches in banking","f":"m","d":3,"p":"H","sc":"short","s":"Triodos Bank lends only to viable projects with a positive social or environmental impact. This is:","o":[["Risk-based exclusion (SF 1.0)","Exclusion only avoids harmful borrowers; it does not require positive impact."],["Finance as usual","Positive impact is the bank's core goal."],["Value-based banking (SF 3.0)","Impact comes first, subject to financial viability."],["ESG integration (SF 2.0)","That prices ESG risk into loans rather than requiring impact."]],"c":[2],"es":"Lending for positive impact = value-based (SF 3.0).","ed":"Most banks use the risk-based approach: exclusion (1.0) or integrating ESG into credit scoring and the risk premium (2.0). Value-based banks earned a higher and more stable ROA than global banks in 2006-2015 in the textbook's table, though this is only descriptive.","kt":"","src":"Opptak L11 ca. 32 min · Opptak L11 ca. 40 min"},{"id":"TR53","l":"L11","t":"ESG in credit risk","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Adding sustainability risks to credit models improves predictions of how borrowers perform, suggesting these risks were not fully priced.","o":[["True","Correct. If ESG risks were already reflected, adding them would not improve predictions."],["False","Incorrect. If ESG risks were already reflected, adding them would not improve predictions."]],"c":[0],"es":"True: ESG information adds predictive power, so it was not fully priced.","ed":"This supports integrating ESG into banks' credit scoring: industry trends, typical paths in the sector, material issues for the firm, and a coherent weighting. It also links to the adaptive market hypothesis: new risks get priced gradually.","kt":"","src":"Opptak L11 ca. 38 min"},{"id":"CX091","l":"L12","t":"Asymmetric information","f":"m","d":2,"p":"H","sc":"none","s":"An insured homeowner who stops maintaining the house because the insurer will pay is an example of:","o":[["Moral hazard","Atferd endres etter avtalen."],["Protection gap","Det er uforsikrede tap."],["Adverse selection","Det er skjult informasjon før avtalen."],["Basis risk","Det gjelder parametrisk forsikring."]],"c":[0],"es":"Etter avtalen = moral hazard.","ed":"Forsikringsselskaper bruker egenandel (deductible) mot moral hazard, og screening mot adverse selection.","kt":"","src":"Bok s. 324 (11.1.4)","k":1},{"id":"CX092","l":"L12","t":"Insurance and climate","f":"m","d":2,"p":"H","sc":"none","s":"The insurance protection gap gets bigger when:","o":[["Disaster losses fall over time","Det minsker heller problemet."],["Premiums fall in safe areas","Det påvirker ikke gapet i risikoområder."],["More homeowners buy insurance","Det minsker gapet."],["Insurers exit high-risk areas","Flere tap blir uforsikret."]],"c":[3],"es":"Forsikring trekker seg ut → større protection gap.","ed":"Protection gap = andelen tap som ikke er forsikret. Eksempel: State Farm i California. Uforsikrede hus er vanskeligere å få lån på, så boligpriser og banker rammes også.","kt":"","src":"L12 slide 3 · Bok s. 337 (11.3.2.1)","k":1},{"id":"CX093","l":"L12","t":"Insurance business model","f":"m","d":2,"p":"H","sc":"none","s":"On an insurer's balance sheet, UNEXPECTED claims are covered by:","o":[["Equity","Egenkapitalen er bufferen for uventede tap."],["Technical provisions","De dekker forventede skader."],["The policyholders","Kundene skal nettopp slippe å bære tapet."],["Next year's premiums","De er ikke en buffer i balansen i dag."]],"c":[0],"es":"Uventet = equity. Forventet = technical provisions.","ed":"Ekstreme tap utover egenkapitalen dekkes av reinsurance, cat bonds eller staten.","kt":"","src":"L12 slide 8 · Bok s. 318 (Figure 11.1) · L12 slide 16","k":1},{"id":"CX094","l":"L12","t":"Material issues in insurance","f":"m","d":2,"p":"H","sc":"none","s":"Climate change can hit an insurer's balance sheet:","o":[["Nowhere, because risk is reinsured","Reinsurance fjerner ikke all risiko."],["Only on its assets (investments)","Erstatningene øker også."],["Only on its liabilities (the claims)","Investeringene kan også rammes."],["On both assets and liabilities","Flere erstatninger (liabilities) og tap på investeringer (assets)."]],"c":[3],"es":"Begge sider av balansen.","ed":"Samme klimahendelse kan både øke erstatningene og redusere verdien av investeringene. Derfor bør scenarioanalyse dekke begge sider.","kt":"","src":"L12 slide 10 · L12 slide 8","k":1},{"id":"CX095","l":"L12","t":"Insurance innovation","f":"t","d":2,"p":"H","sc":"none","s":"Does parametric insurance pay out based on a measured event, such as wind speed, rather than the actual loss?","o":[["Yes","Riktig. Fordelen er rask utbetaling. Ulempen er basis risk."],["No","Feil. Fordelen er rask utbetaling. Ulempen er basis risk."]],"c":[0],"es":"Ja: målt hendelse, ikke faktisk tap.","ed":"Basis risk: utbetalingen matcher ikke alltid skaden. Jamaica fikk ingenting etter orkanen Beryl fordi triggeren så vidt ikke ble utløst.","kt":"","src":"Opptak L12 ca. 27 min · Opptak L12 ca. 37 min","k":1},{"id":"CX096","l":"L12","t":"Risk sharing","f":"m","d":2,"p":"H","sc":"none","s":"If the specified disaster occurs, investors in a catastrophe bond:","o":[["The government repays them","Det er ingen statsgaranti."],["They receive double interest","Det er motsatt: de taper."],["They lose part or all of the principal","Pengene går til å dekke forsikringstapet."],["Nothing changes for the bond investors","Hele poenget er at investorene bærer risikoen."]],"c":[2],"es":"Katastrofe → cat bond-investorer taper.","ed":"Til gjengjeld får investorene høy rente når katastrofen ikke skjer. Slik flyttes ekstrem risiko fra forsikring til kapitalmarkedet.","kt":"","src":"L12 slide 18 · Bok s. 322 (11.1.3)","k":1},{"id":"SB432","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"H","sc":"short","s":"In 2023 State Farm stopped selling new home insurance in California because of wildfire risk. What is the most likely knock-on effect?","o":[["Stricter EU capital rules","California is not under Solvency II."],["A bigger protection gap","Uninsured homes are harder to finance and sell."],["No effect","Public schemes are limited and often costly."],["Less wildfire risk","Insurance withdrawal does not change the hazard."]],"c":[1],"es":"Insurance retreat → protection gap → lower property values and tighter mortgages.","ed":"The textbook describes this chain for coastal flood risk: annual insurance vs long mortgages creates \"technical default\" risk. Insurers act rationally on risk-based pricing; the social problem shifts to households, banks and governments.","kt":"Protection gap: the share of economic losses from disasters that is not insured.","src":"L12 slide 3 · Bok s. 337 (11.3.2.1)"},{"id":"SB433","l":"L12","t":"Insurance business model","f":"m","d":2,"p":"H","sc":"none","s":"On an insurer's balance sheet, technical provisions and equity cover:","o":[["Equity: expected claims; provisions: unexpected claims","The roles are reversed."],["Both are investment assets","Both are on the liability side."],["Provisions: expected claims; equity: unexpected claims","This mirrors expected loss versus unexpected loss in VaR (slide 16)."],["Provisions are the insurer's cash","They are liabilities for future claims, not cash."]],"c":[2],"es":"TP = expected claims (liability); E = buffer for unexpected claims; assets = investments (insurers as asset managers).","ed":"Insurers collect premiums P, invest them in assets A earning rA, set aside technical provisions TP for expected future claims, and hold equity E as a buffer for unexpected claims. The P&L is premium income + investment income − claims − expenses. The asset side makes insurers major long-term institutional investors, so their investment portfolios also carry material ESG issues (slide 10).","kt":"","src":"L12 slide 8 · Bok s. 318 (Figure 11.1) · L12 slide 16"},{"id":"SB434","l":"L12","t":"Insurance business model","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A non-life insurer with a combined ratio a bit above 100% can still make a profit, because it earns investment income before claims are paid.","o":[["True","Correct. Profit = (100 − combined ratio) + investment income; investment returns can offset a small underwriting loss."],["False","Incorrect. Profit = (100 − combined ratio) + investment income; investment returns can offset a small underwriting loss."]],"c":[0],"es":"True: investment income can offset a small underwriting loss.","ed":"This is why insurers are large investors and why climate risk matters on both sides of their balance sheet: rising claims (liabilities) and climate-exposed investments (assets).","kt":"Combined ratio: (claims + expenses) / premiums; below 100% means underwriting is profitable on its own.","src":"Bok s. 318 (11.1.1) · Bok s. 319 (11.1.1)"},{"id":"SB435","l":"L12","t":"Material issues in insurance","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: For a Norwegian non-life insurer, climate change matters only for claims, not for its investments.","o":[["True","Incorrect. Climate risk also affects the insurer's investments (transition and physical risk in bonds and equities); slide 10 explicitly adds investment-related material issues."],["False","Correct. Climate risk also affects the insurer's investments (transition and physical risk in bonds and equities); slide 10 explicitly adds investment-related material issues."]],"c":[1],"es":"False: climate is material on both sides.","ed":"A big storm can raise claims and simultaneously hit the value of real estate or utility investments, so risks correlate. Integrated scenario analysis across both sides is best practice.","kt":"Asset side vs liability side: an insurer's investments (assets) vs its obligations to pay claims (technical provisions).","src":"L12 slide 10 · L12 slide 8"},{"id":"SB436","l":"L12","t":"Material issues","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Swiss Re sees climate change as its most important material issue. Which is part of its climate strategy?","o":[["Measuring climate risk","Pillar 1; the others are products, awareness and its own footprint."],["Stopping all weather insurance","Swiss Re continues to cover weather risk while modelling it better."],["Ignoring its own emissions","Pillar 4 tackles its own footprint with annual reporting."],["Lobbying against climate policy","It advocates a worldwide policy framework."]],"c":[0],"es":"Swiss Re: (1) knowledge and integration in underwriting; (2) products to mitigate/adapt; (3) awareness and advocacy; (4) own footprint.","ed":"For a re-insurer, climate change raises the frequency and severity of floods, storms, rainfall and drought; combined with growing asset concentrations in exposed areas, losses rise steadily, and uncertainty makes pricing difficult. Swiss Re also advances renewable energy (risk covers for offshore wind) and food security (weather protection for 1.4 million African smallholders). Its materiality matrix distinguishes priority, management and exploration issues.","kt":"","src":"L12 slide 11 · Bok s. 326 (Box 11.2) · Bok s. 327 (11.2)"},{"id":"SB437","l":"L12","t":"Risk modelling","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Catastrophe modelling looks at good and bad outcomes for the whole insurer, while scenario analysis looks only at losses from natural disasters.","o":[["True","Incorrect. The definitions are swapped: scenario analysis evaluates a range of outcomes on risk exposure; catastrophe modelling estimates potential losses from catastrophic events."],["False","Correct. The definitions are swapped: scenario analysis evaluates a range of outcomes on risk exposure; catastrophe modelling estimates potential losses from catastrophic events."]],"c":[1],"es":"False: scenario analysis = range of outcomes; catastrophe modelling = losses from catastrophes.","ed":"Risk modelling uses mathematical models to estimate potential losses in various scenarios. Scenario analysis (e.g. NGFS scenarios; DNB's \"Waterproof\" study on Dutch home insurance) compares outcomes under different climate pathways. Catastrophe models estimate losses from specific perils using hazard, vulnerability, exposure, financial loss and platform components.","kt":"","src":"L12 slide 13-15"},{"id":"SB438","l":"L12","t":"Risk modelling","f":"m","d":3,"p":"M","sc":"none","s":"The Dutch central bank's \"Waterproof\" study estimates home insurance claims in 2085. What does it show?","o":[["Claims are the same in both","The 3.5°C scenario shows much larger increases."],["Claims fall in both","Claims increase in both scenarios."],["Claims rise, most at 3.5°C","Roughly +10-52% under 1.5°C versus +25-131% under 3.5°C."],["Claims rise only at 1.5°C","Physical claims rise more in the higher warming scenario."]],"c":[2],"es":"Rain, hail and storm claims: +10-52% (1.5°C) vs +25-131% (3.5°C) relative to 2016.","ed":"Scenario analysis makes climate physical risk concrete for insurers. Even under 1.5°C, claims rise; under higher warming they could more than double. Because home insurance is renewed annually, insurers can reprice, but rising premiums can make cover unaffordable and create protection gaps - with knock-on effects for mortgages and house prices.","kt":"","src":"L12 slide 14 · Bok s. 337 (11.3.2.1)"},{"id":"SB439","l":"L12","t":"Catastrophe modelling","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the five parts of a catastrophe model?","o":[["A tax part","Not one of the five components."],["A credit part","Not one of the five components."],["A vulnerability part","Component 2. of a catastrophe model."],["A dividend part","This is not part of a catastrophe model."]],"c":[2],"es":"Hazard, vulnerability, exposure, financial loss, platform.","ed":"(1) hazard - extent and intensity of the event (e.g. peak gust wind speeds); (2) vulnerability - damage functions linking hazard intensity to damage ratios; (3) exposure - building, contents and business interruption values; (4) financial loss - ground-up loss before insurance structures, and who pays; (5) platform - software integrating the components. The output is a loss distribution from which metrics like average annual loss, return period losses and VaR are derived. Also true, but not offered as an option here: Financial loss component: translates physical damage into monetary (ground-up) loss.","kt":"","src":"L12 slide 15 · Bok s. 331 (11.3.1) · Bok s. 332 (11.3.1)"},{"id":"SB440","l":"L12","t":"Catastrophe modelling","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A \"200-year flood\" cannot happen twice in ten years.","o":[["True","Incorrect. A return period is an average based on an annual probability (0.5%); such events can occur close together, and climate change can make them more frequent."],["False","Correct. A return period is an average based on an annual probability (0.5%); such events can occur close together, and climate change can make them more frequent."]],"c":[1],"es":"False: return periods are probabilities, not schedules.","ed":"Misreading return periods leads to underestimating tail risk. Climate change also shifts the distribution, so historical return periods can understate future frequency.","kt":"Return period: the inverse of the annual exceedance frequency; a 200-year event has about a 0.5% chance each year.","src":"Bok s. 332 (11.3.1) · Bok s. 333 (Table 11.3)"},{"id":"SB441","l":"L12","t":"Catastrophe modelling","f":"m","d":3,"p":"H","sc":"none","s":"In the loss distribution, what is the \"unexpected loss\", and what covers it?","o":[["Losses that never happen","Unexpected losses do occur and require capital."],["Above expected, covered by equity","Expected loss is covered by technical provisions; unexpected loss by capital."],["Extreme losses, covered by provisions","Tail losses beyond VaR are not covered by the capital calibration; provisions cover expected loss."],["The average loss, covered by premiums","The mean is the expected loss."]],"c":[1],"es":"EL (mean) → technical provisions; UL (EL to VaR quantile) → equity; beyond VaR → tail risk (re-insurance, cat bonds, government).","ed":"The expected loss is the mean of the distribution and is priced into premiums and technical provisions. The unexpected loss runs from the mean up to a confidence level (e.g. 99.5%) and is covered by capital. Losses in the tail beyond VaR are not covered by the calibration; insurers use re-insurance, cat bonds and government programmes for extreme events. Heavy-tailed distributions (Figure 11.2) and structural uncertainty (Weitzman) make tail estimation hard.","kt":"","src":"L12 slide 16 · L12 slide 8 · Bok s. 319 (11.1.2)"},{"id":"SB442","l":"L12","t":"Catastrophe risk","f":"t","d":3,"p":"M","sc":"none","s":"True or false: With enough policies, catastrophe losses become as predictable as small claims (law of large numbers).","o":[["True","Incorrect. Small claims have light tails and average out in large portfolios; large catastrophe claims have heavy tails, are estimated from few observations, and remain dangerous even in large portfolios."],["False","Correct. Small claims have light tails and average out in large portfolios; large catastrophe claims have heavy tails, are estimated from few observations, and remain dangerous even in large portfolios."]],"c":[1],"es":"False: heavy-tailed catastrophe losses do not average out like small claims.","ed":"Small claims (e.g. car accidents) follow light-tailed distributions, so average claims approach the expected value in a large portfolio. Catastrophes are low-probability, high-impact events from heavy-tailed distributions (e.g. log-normal), estimated from few extreme observations. Many policies may be hit by the same event (correlation), which is why catastrophe risk is shared across insurers, re-insurers, capital markets and governments.","kt":"","src":"Bok s. 319 (11.1.2) · L12 slide 15 · L12 slide 18"},{"id":"SB443","l":"L12","t":"Risk sharing","f":"m","d":3,"p":"H","sc":"short","s":"The 2025 Los Angeles wildfires caused huge insured losses. How can individual insurers survive such an event?","o":[["Reinsurance and cat bonds","Risk is layered across insurers, re-insurers and capital markets."],["The central bank pays","Central banks do not pay insurance claims."],["Each insurer holds enough cash itself","A single insurer's equity would be wiped out by extreme events."],["Customers pay themselves","Insured losses are paid by insurers (and their reinsurers)."]],"c":[0],"es":"Layered risk sharing: insurer → re-insurer → cat bond investors → government.","ed":"Cat bonds give investors high yields that are uncorrelated with markets, but they lose principal if a defined catastrophe occurs. Climate change raises frequency and severity, so pricing and capacity are under pressure.","kt":"Re-insurance: insurance for insurers; excess-of-loss contracts pay losses above a retention limit.","src":"L12 slide 18 · Bok s. 322 (11.1.3)"},{"id":"SB444","l":"L12","t":"Risk sharing","f":"m","d":3,"p":"M","sc":"none","s":"Why do investors buy catastrophe bonds?","o":[["They are risk-free","Investors bear the catastrophe risk."],["They move with stocks","Their attraction is low correlation, not hedging equities."],["High yield and low correlation","Cat bonds help investors diversify."],["They always pay their coupons","Payments can be skipped or deferred after a catastrophe."]],"c":[2],"es":"Cat bonds: high yield + low correlation → diversification; payments skipped/deferred after a trigger.","ed":"Cat bonds transfer insurance risk to capital markets. If a catastrophe exceeds a threshold, the issuer can skip or defer scheduled payments. Because natural disasters occur randomly, cat bonds have low correlation with stocks and other common factors. Climate change complicates pricing, as the hazard distribution shifts over time.","kt":"","src":"Bok s. 323 (11.1.3) · L12 slide 18"},{"id":"SB445","l":"L12","t":"Asymmetric information","f":"m","d":3,"p":"M","sc":"none","s":"How do Rothschild and Stiglitz (1976) solve adverse selection in insurance?","o":[["High-risk clients must take deductibles","It is the low-risk types who accept partial cover."],["Everyone buys full cover at one price","A pooled price drives low-risk types out - the adverse selection problem."],["Insurers see every risk directly","The problem arises because insurers cannot observe types ex ante."],["Clients pick contracts that reveal their risk","Low-risk clients reveal themselves by accepting a deductible or co-insurance."]],"c":[3],"es":"Adverse selection (ex ante) → self-selection via deductibles; moral hazard (ex post) → incomplete cover to keep incentives.","ed":"Adverse selection arises because the insured knows more about their risk; high-risk types are most eager to buy. Self-selecting contracts separate types. Moral hazard arises when behaviour affects outcomes but is costly to observe; complete coverage may not be attainable because efficient incentives require the insured to bear some consequences. Shiller notes missing markets even in rich countries (only about 10% of Californian homes have earthquake cover).","kt":"","src":"Bok s. 324 (11.1.4)"},{"id":"SB446","l":"L12","t":"Climate change and insurance","f":"m","d":3,"p":"M","sc":"none","s":"The IPCC rates its confidence in climate effects on natural hazards. Which statement is correct?","o":[["Worse droughts everywhere: very high confidence","Medium confidence in some regions, low elsewhere."],["River floods: high confidence","There is \"low confidence\" in riverine flood projections."],["More heavy rain: unlikely","It is \"likely\" to increase over many areas."],["Higher coastal water levels: very likely","Very likely (90-100%)."]],"c":[3],"es":"Heat extremes virtually certain; sea-level-driven high water very likely; heavy rainfall likely; intense cyclones more likely than not; drought medium; river floods low confidence.","ed":"The ocean absorbs over 90% of excess heat, raising sea levels and intensifying weather. IPCC likelihood terms: virtually certain 99-100%, very likely 90-100%, likely 66-90%, about as likely as not 33-66%. Landslides have high confidence links to heat, glacier retreat and rainfall. Under RCP2.6, mean sea-level rise in 2100 is 44 cm (28-60 cm). Insurers frequently update catastrophe models because climate change shifts frequency, severity and geography of hazards. Also true, but not offered as an option here: More warm extremes and fewer cold extremes globally are \"virtually certain\".","kt":"","src":"L12 slide 21 · Bok s. 333 (11.3.2) · Bok s. 334 (11.3.2) · Bok s. 335 (11.3.2)"},{"id":"SB447","l":"L12","t":"Climate change and insurance","f":"m","d":4,"p":"H","sc":"short","s":"A small sea-level rise can turn today's 100-year floods into events every few years. What does this mean for insurers?","o":[["It only matters after 2100","Effects grow over coming decades."],["Risk grows steadily, so past data are fine","The relation is exponential, not linear."],["Past losses understate risk","Small changes in sea level cause large increases in flood frequency."],["Insurers can ignore it","Repricing helps but creates protection gaps and affects property values."]],"c":[2],"es":"Non-linear flood risk → history underestimates future losses.","ed":"Catastrophe models must be updated for climate trends. Knock-on effects include insurance retreat, falling house prices and tighter mortgage lending in coastal areas.","kt":"Non-linear (exponential) risk: a small change in a driver causes a much larger change in outcomes.","src":"Bok s. 337 (Figure 11.7) · Bok s. 338 (Table 11.4) · Bok s. 337 (11.3.2.1)"},{"id":"SB448","l":"L12","t":"Climate change and insurance","f":"m","d":4,"p":"H","sc":"none","s":"If home insurance pulls out of flood areas or gets too expensive, what happens to banks?","o":[["Banks gain","House prices in areas where insurance retreats are likely to decline."],["Banks are not affected","Insurance is often a requirement for residential mortgages."],["Banks take over the insurance","Banks do not assume insurers' obligations."],["Banks lend less","The maturity mismatch (annual insurance vs long mortgages) worsens this."]],"c":[3],"es":"Insurance retreat → lower house prices, technical default risk, tighter mortgage terms → possible abandonment of coastal areas.","ed":"Residential insurance is renewed annually while mortgages last a decade or more. If insurers withdraw or premiums soar, homeowners may breach mortgage conditions (\"technical default\"), house prices fall, and infrastructure investment becomes harder to justify. Bankers may lend less, require more equity or shorten terms, so coastal areas may be abandoned before risks materialise. This connects physical risk in insurance with collateral risk in banking (Lecture 11).","kt":"","src":"Bok s. 337 (11.3.2.1) · Bok s. 338 (11.3.2.1) · L11 slide 31"},{"id":"SB449","l":"L12","t":"Climate change and insurance","f":"m","d":5,"p":"M","sc":"none","s":"What is Weitzman's (2009) key point about rare but extreme climate disasters?","o":[["Fat tails favour acting now","Uncertain parameters fatten predictive tails so much that catastrophe risk dominates."],["They are impossible","His point is precisely that catastrophe is theoretically possible."],["Learning removes all extreme risk","Even with Bayesian updating, uncertain structural parameters fatten the tails."],["Wait until everything is known","The fat-tail argument implies precaution rather than delay."]],"c":[0],"es":"Structural uncertainty → fattened tails → catastrophe risk can dominate discounting in climate economics.","ed":"When key parameters (e.g. climate sensitivity, damages at high temperatures) are uncertain, posterior-predictive distributions get fat tails that prior knowledge cannot bound. The expected cost of catastrophe can then outweigh the effects of discounting future damages - a strong argument for precautionary mitigation. For insurers, it means historical data and standard models can underestimate tail losses.","kt":"","src":"Bok s. 335 (11.3.2) · Bok s. 319 (11.1.2)"},{"id":"SB450","l":"L12","t":"Mitigation and adaptation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Insurance only moves the financial part of disaster risk, so it should be combined with risk reduction such as flood defences, not replace it.","o":[["True","Correct. Insurance does not save lives or prevent damage; risk reduction and adaptation should be prioritised, with insurance as a complement."],["False","Incorrect. Insurance does not save lives or prevent damage; risk reduction and adaptation should be prioritised, with insurance as a complement."]],"c":[0],"es":"True: insurance complements, not replaces, risk reduction.","ed":"Only a minority of disaster losses are insured, especially in developing countries. Insurance can also strengthen incentives for risk-reducing behaviour through pricing.","kt":"Adaptation: actions that help communities and ecosystems cope with a changing climate (e.g. flood defences, early warning).","src":"Bok s. 339 (11.3.3)"},{"id":"SB451","l":"L12","t":"Mitigation and adaptation","f":"m","d":4,"p":"L","sc":"none","s":"A global climate risk pool would only insure events well above the trend. Why?","o":[["A trend needs adaptation","The pool covers the shock part, not the expected climate trend."],["Smaller events are illegal to insure","There is no such law; it is an insurance design principle."],["Only rich countries have extreme events","Equatorial low- and middle-income countries are the most vulnerable."],["The pool wants to avoid paying","It is meant to pay for extreme shocks."]],"c":[0],"es":"Insure deviations above the climate trend (shocks), not the predictable trend itself.","ed":"Extreme weather can damage a large share of a vulnerable country's productive capacity, cut tax revenues and raise reconstruction spending, risking a fiscal and macroeconomic downward spiral. Protecting every country against the most extreme events is neither possible nor cost-efficient; a pool insuring events far above the trend (e.g. a storm surge of 11.3 m vs a trend of about 10 m) helps countries recover from the initial shock. Expected trend increases require adaptation investment instead.","kt":"","src":"Bok s. 340 (Box 11.3)"},{"id":"SB452","l":"L12","t":"Environmental and liability risk","f":"m","d":3,"p":"M","sc":"none","s":"DuPont's pollution ended up costing about a billion dollars (Shapira and Zingales, 2017). What do internal documents show?","o":[["Regulators caught it at once","Control mechanisms failed."],["It was an accident","They rule out ignorance and unexpected realisation."],["Its insurers forced it to pollute","Insurers played no such role."],["Low risk of being caught","The company controlled most of the information."]],"c":[3],"es":"DuPont case: pollution rational ex ante for the firm, harmful for society; deterrence failed because the firm controlled information.","ed":"Liability risks can grow dramatically over time - US asbestos losses are estimated at $85bn. Pollution insurance covers third-party liability from sudden accidental releases and clean-up costs. Tobacco firms paid large settlements, and oil companies might face similar climate liability, raising governance issues (ExxonMobil shareholders passed a climate risk disclosure resolution with 62%). These liabilities hit insurers to the extent they are covered by policies.","kt":"","src":"Bok s. 327 (11.2.1) · Bok s. 328 (11.2.1) · Bok s. 329 (11.2.3)"},{"id":"SB453","l":"L12","t":"Social issues in insurance","f":"t","d":2,"p":"L","sc":"none","s":"True or false: AIA Vitality rewards clients for healthy living, which can improve their health and lower the insurer's costs.","o":[["True","Correct. Section 11.2.2 describes AIA Vitality as a science-backed wellness programme where engaged clients have lower health-care costs."],["False","Incorrect. Section 11.2.2 describes AIA Vitality as a science-backed wellness programme where engaged clients have lower health-care costs."]],"c":[0],"es":"True: wellness incentives align client health and insurer costs.","ed":"Ageing populations raise health-care costs, and governments offload part of them to private insurers, who then have incentives to contain costs at providers and clients. Other social themes: supplementary income insurance (unemployment, disability) as welfare states shrink, terrorism risk, liability questions from driverless cars, data privacy and cyber security.","kt":"","src":"Bok s. 328 (11.2.2)"},{"id":"SB454","l":"L12","t":"Principles for Sustainable Insurance","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An insurer that has signed the PSI is asked to insure a new coal mine. Which response fits PSI principle 1?","o":[["Refuse all mining firms","PSI does not prescribe blanket bans."],["Insure it with no extra checks","That ignores ESG in underwriting."],["Insure it in secret","Principle 4 calls for transparency."],["Assess its ESG risks","Principle 1 embeds ESG issues in insurance decisions."]],"c":[3],"es":"Embed ESG in underwriting decisions.","ed":"Several European insurers (e.g. AXA, Swiss Re) restrict underwriting for new coal projects. Insurance is a lever: without cover, many projects cannot get financing.","kt":"Underwriting: assessing and pricing the risk of a client or project, and deciding whether to insure it.","src":"L12 slide 24"},{"id":"SB455","l":"L12","t":"Insurance regulation","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about EU insurance rules since August 2022 is correct?","o":[["The IDD sets capital rules","The IDD regulates product design and distribution; capital is in Solvency II."],["Solvency II bans fossil fuel shares","No such ban exists."],["Solvency II was replaced","Solvency II remains the core prudential framework."],["IDD: sustainability in advice","Stated on Lecture 12, slide 25."]],"c":[3],"es":"Solvency II (capital, risk management) and IDD (product governance, suitability) amended in 2022 to include sustainability.","ed":"Solvency II codifies and harmonises EU insurance regulation with a focus on capital requirements (99.5% VaR, a 1-in-200-year calibration). Since August 2022, delegated acts require insurers to integrate sustainability risks in risk management and product governance, and the IDD requires sustainability preferences in suitability assessments when advising clients. Insurers are also covered by SFDR (as financial market participants) and CSRD. Also true, but not offered as an option here: Solvency II delegated acts integrate sustainability risks into insurers' risk management, rules of conduct and product governance.","kt":"","src":"L12 slide 25 · L7 slide 20"},{"id":"SB456","l":"L12","t":"Microinsurance","f":"m","d":2,"p":"M","sc":"none","s":"How does microinsurance help poor people avoid the poverty trap?","o":[["It guarantees a fixed monthly income","It pays when insured events occur, not a fixed income."],["It is always very profitable","Microinsurance firms are difficult to sustain and make profitable."],["It gives large loans","That describes microcredit, not microinsurance."],["Small premiums replace big shocks","Risk pooling ex ante and shock absorption ex post reduce vulnerability."]],"c":[3],"es":"Microinsurance: low-priced cover for health and property risks; reduces vulnerability to shocks.","ed":"Microinsurance protects low-income people and micro-enterprises against health (illness, injury, death) and property (damage, loss) risks through crop, livestock, health, life, disability and disaster products. It improves access to health care and reduces catastrophic expenditures. Economically, providers are hard to sustain; catastrophe microinsurance often survives only with large subsidies (India's crop programme: farmers pay about 10% of the premium).","kt":"","src":"L12 slide 27 · Bok s. 340 (11.4) · Bok s. 341 (11.4)"},{"id":"SB457","l":"L12","t":"Microinsurance","f":"m","d":3,"p":"L","sc":"none","s":"What is the \"partner-agent model\" of microinsurance?","o":[["An insurer designs, a partner sells","It combines professional skills and diversification with local outreach."],["The government sells it","This is not the partner-agent model."],["A reinsurer lends money to clients","Re-insurers do not lend to clients in this model."],["Clients insure each other","That describes informal mutual insurance."]],"c":[0],"es":"Suppliers: commercial insurers, community-based schemes/mutuals, MFIs; partner-agent combines them.","ed":"Commercial insurers bring skills and diversification but struggle to reach the poorest; community-based schemes have local knowledge but lack professionalism and are vulnerable to common shocks; MFIs have networks and existing clients. Rwanda's community-based health insurance reached 84% enrolment and helped cut maternal mortality by 79% (1990-2015). For-profit and larger providers tend to be more efficient.","kt":"","src":"Bok s. 341 (11.4.1) · Bok s. 342 (11.4.1) · Bok s. 343 (11.4.2)"},{"id":"SB458","l":"L12","t":"Microinsurance","f":"m","d":4,"p":"M","sc":"short","s":"A Kenyan farmer has rainfall insurance that pays when a weather station 40 km away records too little rain. What risk does he face?","o":[["Interest rate risk","Unrelated to index insurance design."],["Basis risk","Large distances between the index location and the field make cover imprecise."],["Moral hazard","An objective index precisely limits moral hazard."],["Liquidity risk","Mobile money is the payout channel that makes the product feasible."]],"c":[1],"es":"Index insurance cuts costs and fraud but creates basis risk (index ≠ actual loss).","ed":"Parametric products use objective data (weather stations, satellite data) to pay claims automatically, lowering costs and enabling distribution via mobile phones - by 2016 over 1 million farmers in Kenya, Tanzania and Rwanda had bought crop and livestock index cover (ACRE). But basis risk - the gap between index-triggered payouts and actual losses - can make cover imprecise and undermine trust and renewals. Low understanding (illiteracy) and difficult claims processes also impede microinsurance.","kt":"","src":"Bok s. 343 (Box 11.4) · Bok s. 342 (11.4.1)"},{"id":"SB459","l":"L12","t":"Measuring disaster impact","f":"t","d":4,"p":"L","sc":"none","s":"True or false: Noy's (2016) life years index values lives equally across countries and scales money losses by income, so a dollar lost in a poor country counts more.","o":[["True","Correct. Box 11.1: the index converts losses into life-year units (losses / annual income) and treats the value of human life as equal everywhere."],["False","Incorrect. Box 11.1: the index converts losses into life-year units (losses / annual income) and treats the value of human life as equal everywhere."]],"c":[0],"es":"True: people-centric index, equal value of life, losses scaled by income.","ed":"The standard measure (losses + victims × years lost × annual income) values deaths more in rich countries. The life years index = losses/annual income + deaths × years lost + affected people × years to recover. It better captures how disasters affect people, supporting fairer allocation of disaster risk reduction resources. Insured-loss rankings (Table 11.1) are dominated by the US, Europe and Japan due to higher insurance density, while events like the 2004 Indian Ocean tsunami (220,000 deaths) barely appear.","kt":"","src":"Bok s. 321 (Box 11.1) · Bok s. 321 (11.1.2.1)"},{"id":"SB460","l":"L12","t":"Insurance synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A Nordic insurer sells home insurance in flood-prone coastal areas and owns many bonds in coastal property firms. What is the best assessment?","o":[["Cat bonds cover everything","Cat bonds and reinsurance cover parts of the risk, not everything."],["Yearly repricing removes the risk","Repricing helps but risks protection gaps, correlated asset losses and tail events."],["Only claims matter","Bonds of exposed issuers carry credit and physical/transition risk."],["Both claims and investments","Physical risk raises claims; the same hazards and transition can hit asset values - correlated risk."]],"c":[3],"es":"Correlated exposure: claims (liabilities) and investment losses (assets) from the same climate hazards → integrated scenario analysis.","ed":"SASB lists physical impacts of climate change as material for insurers, and slide 10 adds investment-related issues. A flood can raise claims while also lowering the value of coastal real estate bonds, so risks on both sides correlate. Tools: scenario analysis (DNB Waterproof), catastrophe models, VaR-based capital (Solvency II), reinsurance and cat bonds, and ESG in investments. Annual repricing limits liability-side exposure but can create protection gaps with knock-on effects for mortgages and property values.","kt":"","src":"L12 slide 8 · L12 slide 10 · L12 slide 13-18 · L12 slide 25 · Bok s. 337 (11.3.2.1)"},{"id":"SB461","l":"L12","t":"Sustainability risks in insurance","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Gatzert et al. (2020) conclude that climate change is the only sustainability risk that matters for insurers.","o":[["True","Incorrect. They conclude that while climate change is important, it is by far not the only factor; insurers should take a broader approach, and lack of data and knowledge are key barriers."],["False","Correct. They conclude that while climate change is important, it is by far not the only factor; insurers should take a broader approach, and lack of data and knowledge are key barriers."]],"c":[1],"es":"False: climate is important but not the only sustainability risk.","ed":"Sustainability risks and opportunities arise on the asset side (investments), the liability side (underwriting: pandemics, liability, cyber, demographics) and at corporate level (governance, reputation). AXA's matrix illustrates this breadth: financial instability, terrorism, demographic change, pandemics, cyber and data privacy alongside climate change. Lack of data and knowledge impedes transparency.","kt":"","src":"L12 slide 20 · Bok s. 325 (11.2)"},{"id":"SB462","l":"L12","t":"Catastrophe losses","f":"m","d":4,"p":"M","sc":"short","s":"Insured disaster losses have risen for decades. An analyst blames it all on climate change. What is missing?","o":[["Less insurance in rich countries","Insurance density is higher in rich countries."],["Falling coastal property values","Property values and asset concentrations have risen."],["More assets in risky places","Losses = hazard × exposure × vulnerability; exposure has grown fast."],["Nothing","Catastrophe models include exposure and vulnerability."]],"c":[2],"es":"Rising losses reflect both stronger hazards and growing exposure.","ed":"Swiss Re notes climate change combined with growing asset concentrations in exposed areas causes a steady rise in losses. Lloyd's estimates sea-level rise raised Sandy's surge losses by 30%. Separating drivers matters for pricing and adaptation.","kt":"Catastrophe model components: hazard, vulnerability, exposure, financial loss, platform.","src":"Bok s. 322 (Figure 11.3) · Bok s. 326 (Box 11.2) · L12 slide 15"},{"id":"TR54","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Climate claims rise much faster than the insurer expected, and premiums were too low. Who takes the loss first?","o":[["The central bank","There is no such automatic guarantee."],["The customers","Policyholders are not liable for the insurer's underpricing."],["Nobody","Provisions rest on models that may underestimate climate risk."],["The shareholders","When provisions are too small, equity must cover the gap."]],"c":[3],"es":"Underestimated claims eat into equity first.","ed":"Insurers respond by raising premiums or stopping cover for certain risks (which widens the protection gap), by buying reinsurance, via state-backed schemes funded by taxpayers, or by transferring risk to cat bond investors. The lecture notes models built on 30-40 years of \"stable\" data may misjudge a changing climate.","kt":"","src":"Opptak L11 ca. 58 min · Opptak L12 ca. 13 min · Opptak L12 ca. 35 min"},{"id":"TR55","l":"L12","t":"Insurance innovation","f":"m","d":3,"p":"H","sc":"short","s":"In 2024 Hurricane Beryl hit Jamaica hard, but just missed the trigger of its parametric insurance, so nothing was paid. What does this show?","o":[["It has basis risk","Payout depends on the index, not on the actual loss (basis risk)."],["It removes all risk","Basis risk remains: the index may not match the actual loss."],["It pays only after a damage check","It pays automatically when the parameter crosses a threshold."],["It always pays more than the loss","It can pay more or less, or nothing, depending on the trigger."]],"c":[0],"es":"Fast and cheap, but basis risk: no payout if the trigger is missed.","ed":"The lecturer stresses that \"everything has two sides\": the Lloyd's olive-farm cover (pay-out once temperatures hit 36°C) shows the simplicity and low cost, while the Beryl case shows the risk for buyers.","kt":"Parametric insurance: pays a preset amount when an objective measure (wind speed, rainfall, temperature) crosses a threshold.","src":"Opptak L12 ca. 27 min · Opptak L12 ca. 37 min"},{"id":"TR56","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"M","sc":"none","s":"Some insurers stop insuring coal companies. What concern does the lecturer raise?","o":[["Coal firms have no risk","They face substantial risks."],["Insurers must insure everyone","Insurers can choose which risks to underwrite."],["Exclusion always raises profits","Profit effects are not the concern raised."],["Insurers lose influence","This mirrors the washing machine argument against pure exclusion."]],"c":[3],"es":"Exclusion may lead to self-insurance and lost influence.","ed":"The lecture links this to Lecture 9: oil and gas firms are major green patent filers, and staying invested (or insured) can allow engagement. Whether exclusion or engagement is better remains open.","kt":"","src":"Opptak L11 ca. 52 min"},{"id":"TR57","l":"L12","t":"Reinsurance","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Since insurers can buy reinsurance, climate disasters cannot create systemic risk in insurance.","o":[["True","Incorrect. Reinsurance links insurers in a network; if a large player fails, losses can spread like dominoes."],["False","Correct. Reinsurance links insurers in a network; if a large player fails, losses can spread like dominoes."]],"c":[1],"es":"False: reinsurance spreads risk but also connects firms.","ed":"Reinsurance is often done within the same insurance group, where information asymmetry is lower (less adverse selection). It shares risk but does not remove it, which is why systemic risk management is a material issue for insurers.","kt":"","src":"Opptak L12 ca. 31 min · Opptak L12 ca. 32 min"},{"id":"TR58","l":"L12","t":"EU regulation","f":"t","d":2,"p":"H","sc":"none","s":"True or false: The EU Taxonomy classifies whole companies as sustainable or not.","o":[["True","Incorrect. It classifies economic activities, not entities: whether a specific activity, by whichever firm, counts as sustainable."],["False","Correct. It classifies economic activities, not entities: whether a specific activity, by whichever firm, counts as sustainable."]],"c":[1],"es":"False: the Taxonomy classifies activities, not companies.","ed":"One company can have both taxonomy-aligned and non-aligned activities (e.g. a utility with wind farms and gas plants). This is why firms report the share of turnover, capex and opex that is taxonomy-aligned. Solvency II and the IDD are the insurance-specific EU rules.","kt":"","src":"Opptak L12 ca. 44 min"},{"id":"TR59","l":"L12","t":"Insurance basics","f":"m","d":2,"p":"L","sc":"none","s":"What does D&O (directors and officers) insurance cover?","o":[["Damage to buildings","That is non-life property insurance."],["Bondholders against default","That would be credit insurance or a credit default swap."],["Directors' legal costs","It protects managers if they are sued, linked to fiduciary duties and the business judgment rule."],["Employees' pensions","That is life/pension insurance."]],"c":[2],"es":"D&O covers directors' personal liability from lawsuits.","ed":"Combined with the business judgment rule, D&O insurance means directors rarely pay personally for good-faith decisions, which is one reason lawyers saw the BRT statement as adding little in practice.","kt":"","src":"Opptak L11 ca. 56 min · Opptak L4 ca. 41 min"},{"id":"SB463","l":"GUEST","t":"Folketrygdfondet","f":"m","d":1,"p":"M","sc":"none","s":"What is the overall goal of Folketrygdfondet's management of the Government Pension Fund Norway?","o":[["Maximum SDG impact, even with lower returns","Impact is not the primary objective; responsible ownership serves long-term return."],["Copying the Oslo index exactly","The mandate is active, responsible and long-term, not pure index tracking."],["Supporting Norwegian jobs","Industrial policy goals are not part of the mandate."],["The highest return within risk limits","Stated repeatedly in the lecture (pages 5, 10 and 18)."]],"c":[3],"es":"Highest possible return over time, through active, responsible and long-term management.","ed":"Folketrygdfondet manages the GPFN (about NOK 429bn) and is the largest institutional investor on Oslo Børs (about 5% of OSEAX, 11% of OSEBX). Responsible investment and active ownership are tools to achieve the return objective, because returns depend on companies performing well over time and on well-functioning markets. Compare NBIM's near-index global mandate (Lecture 8).","kt":"","src":"Folketrygdfondet s. 3 · Folketrygdfondet s. 5 · Folketrygdfondet s. 10 · Folketrygdfondet s. 18"},{"id":"SB464","l":"GUEST","t":"Folketrygdfondet","f":"m","d":2,"p":"M","sc":"none","s":"Which is one of Folketrygdfondet's six active ownership tools?","o":[["Nomination committees","Listed with expectations, dialogue, voting, ethical exclusions and contributing to well-functioning markets."],["Buying ESG derivatives","Not one of the six tools."],["Short-selling weak ESG firms","Short-selling is not listed as an ownership tool."],["Appointing its own CEOs","It sits in nomination committees, not in management."]],"c":[0],"es":"Expectations, company dialogue, voting, nomination committees, ethical exclusions, contribution to well-functioning markets.","ed":"The six tools are integrated into management because returns depend on companies delivering good results and on efficient markets. Folketrygdfondet sits in 16 nomination committees (e.g. Equinor, Norsk Hydro, Yara, TOMRA) and is a top-3 owner in 52 Norwegian companies, giving it real influence - unlike widely diversified passive owners.","kt":"","src":"Folketrygdfondet s. 18 · Folketrygdfondet s. 21 · Folketrygdfondet s. 24"},{"id":"SB465","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Folketrygdfondet is a top-three owner in 52 Norwegian firms and sits on 16 nomination committees. Why does this give it more influence than NBIM has?","o":[["It only buys bonds","It is a large equity owner."],["It has veto rights by law","No such legal veto exists."],["It invests passively","It is an active, concentrated manager."],["Bigger stakes and nomination roles","Concentration makes engagement credible and effective."]],"c":[3],"es":"Concentrated stakes + nomination committees = real influence.","ed":"NBIM owns about 1-2% of thousands of firms (near-index), while Folketrygdfondet can shape boards. This illustrates the textbook's link between concentration and effective engagement (Lecture 8, condition 2-3).","kt":"Nomination committee: a shareholder-elected committee that proposes board members, common in Norway.","src":"Folketrygdfondet s. 21 · Folketrygdfondet s. 24 · Bok s. 186 (Box 7.1)"},{"id":"SB466","l":"GUEST","t":"Folketrygdfondet","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A survey shows that Norwegian practitioners adjust for weak environmental performance only through the discount rate, never through cash flows.","o":[["True","Incorrect. The survey shows adjustments through cash flows, through the discount rate, through both, and a share making no adjustment."],["False","Correct. The survey shows adjustments through cash flows, through the discount rate, through both, and a share making no adjustment."]],"c":[1],"es":"False: adjustments are made via cash flows, the discount rate, or both.","ed":"This mirrors the two channels in Lecture 9: the cash flow channel (revenues, costs, capex, stranded assets) and the cost of capital channel. Practice is mixed, and a sizeable share makes no adjustment at all, showing that ESG integration in valuation is still uneven.","kt":"","src":"Folketrygdfondet s. 16 · L9 slide 3"},{"id":"SB467","l":"GUEST","t":"Folketrygdfondet","f":"m","d":2,"p":"H","sc":"none","s":"Folketrygdfondet calls materiality a \"prerequisite for financial value creation\". What evidence does it cite?","o":[["Firms ignoring ESG earn the most","The cited evidence shows the opposite for material issues."],["The highest ESG scores always win","The point is materiality, not overall scores."],["Immaterial ESG drives growth","Immaterial investments do not drive outperformance."],["Material ESG investment pays","Quoted from Khan, Serafeim and Yoon (HBR): better stock returns, sales growth and margin growth."]],"c":[3],"es":"Material ESG investments → better risk-adjusted returns, sales growth and margin growth.","ed":"This is the same evidence as in Lectures 6 and 9: performance on material issues (SASB-defined) predicts outperformance, while performance on immaterial issues does not. For an active investor this is the rationale for qualitative company analysis focused on material issues.","kt":"","src":"Folketrygdfondet s. 15 · L6 slide 52"},{"id":"SB468","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"M","sc":"none","s":"Folketrygdfondet asks \"The end of ESG?\" and quotes: \"Considering long-term factors when valuing a company isn't ESG investing; it's investing.\" What does this mean
