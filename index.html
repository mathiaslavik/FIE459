function persistSes(){ try{ if(SES) localStorage.setItem(SESKEY, JSON.stringify(SES)); }catch(e){} }
function clearSes(){ try{ localStorage.removeItem(SESKEY); }catch(e){} }
function loadSes(){ try{ const s = JSON.parse(localStorage.getItem(SESKEY)); if(s && s.items && s.items.length && s.items.every(x=>BYID[x.id])) return s; }catch(e){} return null; }
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
function startSession(p, n){
  let list = shuffle(p);
  if(S.mode==='practice' && S.smart){ const w = q => { const r=DB.p[q.id]; return !r?1 : r.last<0?0 : 2; }; list.sort((a,b)=>w(a)-w(b)); }
  list = list.slice(0, n);
  SES = { exam:S.mode==='exam', i:0, t0:Date.now(), confirm:false,
    items: list.map(q => ({ id:q.id, order: q.f==='t' ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i)), chosen:[], done:false, ok:false })) };
  stopTimer(); timer = setInterval(tick, 1000);
  renderQuestion(); window.scrollTo(0,0);
}
function tick(){ const el=document.getElementById('clock'); if(el && SES) el.textContent = fmtTime(Math.floor((Date.now()-SES.t0)/1000)); }

function renderQuestion(){
  persistSes();
  setNav(''); app.replaceChildren();
  const it = SES.items[SES.i], q = BYID[it.id], ms = q.f==='s', N = SES.items.length;
  const answered = SES.items.filter(x=> SES.exam ? x.chosen.length : x.done).length;
  const correct = SES.items.filter(x=>x.done&&x.ok).length;
  const need = ms ? q.c.length : 1;

  const top = h('div',{class:'qtop'},
    h('span',{class:'pos',text:`${SES.i+1} / ${N}`}),
    h('span',{class:'track'}, h('i',{style:`width:${answered/N*100}%`})),
    h('span',{class:'stat'}, SES.exam ? '' : `${correct} correct · `, h('span',{id:'clock',text:fmtTime(Math.floor((Date.now()-SES.t0)/1000))})));

  const meta = h('div',{class:'meta'},
    h('span',{class:'lecid',text:q.l==='GUEST'?'Guest lecture':q.l+' · '+LECNAME[q.l]}),
    h('span',{text:q.t}), SCN[q.sc] ? h('span',{class:'tag',text:SCN[q.sc]}) : null, h('span',{class:'qid',text:q.id}));

  const opts = h('div',{class:'opts', role: ms?'group':'radiogroup'});
  it.order.forEach((oi, pos) => {
    const o = q.o[oi], sel = it.chosen.includes(oi);
    let cls = 'opt';
    const reveal = it.done && !SES.exam;
    if(reveal){ if(q.c.includes(oi)) cls+=' right'; else if(sel) cls+=' wrong'; }
    const showWhy = reveal && (sel || q.c.includes(oi));
    opts.append(h('button',{class:cls, id:`opt-${pos}`, 'aria-pressed':String(sel), disabled:reveal,
        on:{click:()=>choose(oi)}},
      h('span',{class:'key',text: keyFor(q,pos)}),
      h('span',null, q.f==='t' ? tfText(o) : o[0], showWhy ? h('span',{class:'why',text:o[1]}) : null)));
  });

  const card = h('div',{class:'card'}, meta, h('p',{class:'stem',text:q.s}), opts);
  if(it.done && !SES.exam) card.append(feedback(q, it));

  const acts = h('div',{class:'actions'});
  const left = h('div',{class:'left'},
    h('button',{class:'ghost flag', id:'flag', 'aria-pressed':String(FLAGS.has(q.id)), on:{click:()=>{ FLAGS.has(q.id)?FLAGS.delete(q.id):FLAGS.add(q.id); save(); renderQuestion(); }}, text: FLAGS.has(q.id)?'Flagged':'Flag'}),
    h('button',{class:'ghost', id:'quit', on:{click:()=> SES.exam ? finish() : (SES.items.some(x=>x.done) ? finish() : renderSetup())}, text:'Quit'}));
  let main;
  if(SES.exam){
    main = h('div',{class:'left'},
      SES.i>0 ? h('button',{class:'ghost', id:'prev', on:{click:()=>{SES.i--; renderQuestion();}}, text:'Back'}) : null,
      SES.i<N-1 ? h('button',{class:'primary', id:'next', on:{click:()=>{SES.i++; renderQuestion();}}, text:'Next'})
               : h('button',{class:'primary', id:'submit', on:{click:askSubmit}, text:'Submit'}));
  } else if(!it.done){
    main = h('button',{class:'primary', id:'answer', disabled: it.chosen.length!==need, on:{click:answer}, text:'Check answer'});
  } else {
    main = h('button',{class:'primary', id:'next', on:{click:next}, text: SES.i<N-1 ? 'Next' : 'See results'});
  }
  acts.append(left, main);

  app.append(top, card, acts);
  if(SES.exam){
    if(SES.confirm){ const un = SES.items.filter(x=>!x.chosen.length).length;
      app.append(h('div',{class:'confirm'}, h('span',{text: un ? `${un} questions unanswered. Submit anyway?` : 'Submit the exam?'}),
        h('div',{class:'left'}, h('button',{class:'ghost',id:'cancel-submit',on:{click:()=>{SES.confirm=false; renderQuestion();}},text:'Keep going'}), h('button',{class:'primary',id:'confirm-submit',on:{click:finish},text:'Submit'})))); }
    app.append(h('div',{class:'grid', 'aria-label':'Jump to question'}, SES.items.map((x,k)=> h('button',{
      class:[x.chosen.length?'ans':'', FLAGS.has(x.id)?'fl':'', k===SES.i?'cur':''].join(' '), id:'jump-'+k, 'aria-label':`Question ${k+1}`,
      on:{click:()=>{SES.i=k; renderQuestion();}}, text:String(k+1)}))));
  }
  app.append(h('p',{class:'kbd', text: q.f==='t' ? 'Keyboard: T/F or 1–2 to choose, Enter to continue.' : `Keyboard: 1–${q.o.length} or A–${String.fromCharCode(64+q.o.length)} to choose, Enter to continue.`}));
}
function explain(q){
  return [q.kt ? h('div',{class:'kt'}, h('b',{text:'Key terms: '}), q.kt) : null, h('p',{style:'margin:0',text:q.ed}), h('p',{class:'src',text:'Source: '+q.src})];
}
function feedback(q, it){
  const box = h('div',{style:'display:grid;gap:14px'},
    h('div',{class:'verdict '+(it.ok?'ok':'bad')}, h('span',{class:'vi', html: it.ok?ICON.ok:ICON.bad}), h('b',{text: it.ok ? 'Correct' : 'Not quite'}), h('span',{text:q.es})));
  box.append(h('details',{class:'deep', open: !it.ok}, h('summary',{text:'Full explanation'}), h('div',{class:'body'}, explain(q))));
  return box;
}
function choose(oi){
  const it = SES.items[SES.i], q = BYID[it.id];
  if(it.done && !SES.exam) return;
  if(q.f==='s'){ it.chosen = it.chosen.includes(oi) ? it.chosen.filter(x=>x!==oi) : (it.chosen.length < q.c.length ? [...it.chosen, oi] : it.chosen); }
  else it.chosen = [oi];
  renderQuestion();
}
function grade(it){ const q=BYID[it.id]; it.ok = sameSet(it.chosen, q.c); it.done = true; }
function answer(){ const it=SES.items[SES.i]; grade(it); rec(it.id, it.ok); renderQuestion(); }
function next(){ if(SES.i < SES.items.length-1){ SES.i++; renderQuestion(); window.scrollTo(0,0); } else finish(); }
function askSubmit(){ SES.confirm = true; renderQuestion(); }
function finish(){
  stopTimer();
  clearSes();
  if(SES.exam){ for(const it of SES.items){ grade(it); if(it.chosen.length) rec(it.id, it.ok); else it.skip=true; } }
  else SES.items = SES.items.filter(x=>x.done);
  renderResults();
}

// ---------- results ----------
function renderResults(){
  setNav(''); app.replaceChildren(); window.scrollTo(0,0);
  const done = SES.items.filter(x=>x.done && !x.skip), ok = done.filter(x=>x.ok), N = SES.items.length;
  const pct = done.length ? ok.length/done.length : 0;
  const secs = Math.floor((Date.now()-SES.t0)/1000);
  const byLec = {};
  for(const it of done){ const l=BYID[it.id].l; byLec[l]=byLec[l]||{n:0,k:0}; byLec[l].n++; if(it.ok) byLec[l].k++; }
  const wrong = SES.items.filter(x=>x.done && !x.ok);

  app.append(h('div',{class:'stack'},
    h('div',{class:'panel hero'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'correct'})))),
      h('div',null, h('p',{class:'label',text: SES.exam?'Exam submitted':'Round complete'}),
        h('h1',{text: pct>=.8?'Strong work':pct>=.6?'Good progress':'Keep going'}),
        h('p',{class:'of',text:`${ok.length} of ${done.length} correct${done.length<N?` · ${N-done.length} unanswered`:''} · ${fmtTime(secs)}`}))),
    Object.keys(byLec).length>1 ? block('By lecture', h('div',{class:'panel tablewrap'}, h('table',null,
      h('thead',null,h('tr',null,h('th',{text:'Lecture'}),h('th',{text:'Correct'}),h('th',{text:''}))),
      h('tbody',null, LECS.filter(([id])=>byLec[id]).map(([id,name])=>{ const b=byLec[id]; return h('tr',null,
        h('td',{text:lecLabel(id)+' '+name}), h('td',{class:'num',text:`${b.k}/${b.n}`}),
        h('td',null, bar(b.k, b.n-b.k, b.n))); })))) ) : null,
    block(wrong.length ? `Mistakes (${wrong.length})` : 'Review', wrong.length ? h('div',{class:'review'}, wrong.map(reviewItem)) : h('p',{class:'empty',text: SES.exam && !done.length ? 'No questions were answered.' : 'Everything correct this round.'})),
    h('div',{class:'row'},
      wrong.length ? h('button',{class:'primary', id:'retry-wrong', on:{click:()=>startSession(wrong.map(x=>BYID[x.id]), wrong.length)}, text:'Practise these mistakes'}) : null,
      h('button',{class:'ghost', id:'new-round', on:{click:renderSetup}, text:'New round'}))
  ));
}
function reviewItem(it){
  const q = BYID[it.id];
  return h('details',null,
    h('summary',null, h('span',{class:'m',text:q.id}), h('span',{text:q.s})),
    h('div',{class:'inner'},
      h('div',{class:'opts'}, it.order.map((oi,pos)=>{ const o=q.o[oi], sel=it.chosen.includes(oi), r=q.c.includes(oi);
        return h('div',{class:'opt'+(r?' right':sel?' wrong':'')}, h('span',{class:'key',text:keyFor(q,pos)}),
          h('span',null, q.f==='t'?tfText(o):o[0], (r||sel)?h('span',{class:'why',text:o[1]}):null)); })),
      h('div',{class:'verdict bad plain'}, h('span',{text:q.es})),
      explain(q)));
}

// ---------- progress ----------
let resetAsk = false;
function renderProgress(){
  setNav('progress'); stopTimer(); app.replaceChildren();
  const all = Object.values(DB.p), seen = all.length, lastOk = all.filter(r=>r.last>0).length;
  const pct = lastOk/BANK.length;
  app.append(h('div',{class:'stack'},
    h('div',{class:'panel hero'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'mastered'})))),
      h('div',null, h('h1',{text:'Progress'}),
        h('p',{class:'of',text:`${lastOk} of ${BANK.length} correct last time · ${seen} seen · ${FLAGS.size} flagged`}),
        h('p',{class:'of',style:'margin-top:6px;font-size:12.5px',text:'Saved on this device only. "Mastered" counts questions where your last answer was correct.'}))),
    block('By lecture', h('div',{class:'panel tablewrap'}, h('table',null,
      h('thead',null,h('tr',null,h('th',{text:'Lecture'}),h('th',{text:'Seen'}),h('th',{text:'Right'}),h('th',{text:'Wrong'}),h('th',{text:''}))),
      h('tbody',null, LECS.map(([id,name])=>{ const s=lecStats(id); return h('tr',null,
        h('td',{text:lecLabel(id)+' '+name}), h('td',{class:'num',text:`${s.seen}/${s.n}`}), h('td',{class:'num',text:String(s.k)}), h('td',{class:'num',text:String(s.w)}),
        h('td',null, bar(s.k, s.w, s.n))); }))))),
    block('Reset', resetAsk
      ? h('div',{class:'confirm'}, h('span',{text:'Delete all progress and flags?'}), h('div',{class:'left'},
          h('button',{class:'ghost',id:'reset-cancel',on:{click:()=>{resetAsk=false; renderProgress();}},text:'Cancel'}),
          h('button',{class:'primary',id:'reset-yes',on:{click:()=>{DB.p={}; FLAGS=new Set(); save(); resetAsk=false; renderProgress();}},text:'Delete'})))
      : h('div',null, h('button',{class:'ghost',id:'reset',on:{click:()=>{resetAsk=true; renderProgress();}},text:'Reset progress'})))
  ));
}

// ---------- keyboard & nav ----------
document.addEventListener('keydown', e => {
  if(!SES || !document.querySelector('.card') || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = SES.items[SES.i], q = BYID[it.id], k = e.key.toLowerCase();
  let pos = -1;
  if(/^[1-6]$/.test(k)) pos = +k-1;
  else if(q.f==='t' && (k==='t'||k==='f')) pos = k==='t'?0:1;
  else if(q.f!=='t' && /^[a-f]$/.test(k)) pos = k.charCodeAt(0)-97;
  if(pos>=0 && pos<it.order.length){ e.preventDefault(); choose(it.order[pos]); return; }
  if(e.key==='Enter'){ const b = document.getElementById('answer') || document.getElementById('next'); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
});
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => b.dataset.view==='progress' ? renderProgress() : renderSetup()));
document.getElementById('home').addEventListener('click', () => { if(!document.querySelector('.card')) renderSetup(); });
function boot(data){
  const saved = (data && data.SES) || loadSes();
  if(saved){ SES = saved; stopTimer(); timer = setInterval(tick, 1000); renderQuestion(); }
  else renderSetup();
}
if(window.claude && window.claude.hot){ try{ window.claude.hot.snapshot(() => ({SES: (document.querySelector('.card') ? SES : null)})); }catch(e){} }
if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(boot); } else { boot(window.claude && window.claude.hot ? window.claude.hot.data : null); }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
