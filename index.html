","f":"m","d":2,"p":"H","sc":"short","s":"Collateral consisting of polluted land mainly increases:","o":[["The dividend yield","Det er et aksjebegrep."],["The liquidity coverage ratio","Det er et bankregulatorisk mål, ikke et lån-parameter."],["Loss given default (LGD)","Forurenset tomt er verdt mindre som sikkerhet, så tapet ved mislighold øker."],["The risk-free rate","Den er lik for alle."]],"c":[2],"es":"Dårligere sikkerhet = høyere LGD.","ed":"Expected loss = PD × LGD × EAD. ESG-risiko kan øke både PD (sannsynlighet for mislighold) og LGD (tap hvis det skjer).","kt":"","src":"Bok s. 292 (10.4) · Bok s. 293 (Table 10.3) · Bok s. 294 (10.4) · Bok s. 291 (10.3)","k":1},{"id":"CX088","l":"L11","t":"Sustainability approaches in banking","f":"m","d":2,"p":"H","sc":"none","s":"A bank that lends only to viable projects with positive impact, like Triodos, is an example of:","o":[["Investment banking","Det handler om rådgivning og emisjoner."],["Risk-based banking (SF 1.0)","Risk-based bruker ESG til å prise risiko."],["Value-based banking (SF 3.0)","Impact først = value-based."],["Shadow banking","Det er noe helt annet."]],"c":[2],"es":"Impact-utlån = value-based = SF 3.0.","ed":"Risk-based banking (SF 1.0 og 2.0) bruker ESG til å prise risiko. Value-based banking låner ut for å skape positiv effekt.","kt":"","src":"Opptak L11 ca. 32 min · Opptak L11 ca. 40 min","k":1},{"id":"CX089","l":"L11","t":"Sustainable loans","f":"m","d":2,"p":"H","sc":"none","s":"A sustainability-linked loan differs from a green loan in that:","o":[["Only governments are allowed to take it","Selskaper tar SLL."],["It must be used for a green project","Det er green loan."],["It is interest-free for the borrower","SLL har vanlig rente."],["Its rate depends on the borrower's targets","SLL: renten følger KPI-er, pengene kan brukes fritt."]],"c":[3],"es":"SLL = KPI-knyttet rente.","ed":"Samme logikk som for obligasjoner: green loan = øremerket, SLL = knyttet til KPI-er.","kt":"","src":"L11 slide 23-25 · Bok s. 295 (Box 10.1)","k":1},{"id":"CX090","l":"L11","t":"Bank risks","f":"m","d":2,"p":"H","sc":"none","s":"Climate transition risk reaches a bank with low own emissions mainly:","o":[["It cannot affect a bank's balance sheet","Banker er sterkt eksponert via utlånene."],["Only through reputational damage","Hovedkanalen er kredittrisiko."],["Through the bank's own electricity bill","Det er en liten kostnad."],["Via borrowers' default risk and collateral","Låntakernes risiko blir bankens kredittrisiko."]],"c":[3],"es":"Kundenes klimarisiko = bankens kredittrisiko.","ed":"Store lån til olje og gass kan gi tap hvis strengere klimapolitikk gjør låntakerne mindre lønnsomme.","kt":"","src":"L11 slide 10 · L11 slide 14 · L11 slide 31","k":1},{"id":"SB397","l":"L11","t":"Bank business model","f":"m","d":3,"p":"M","sc":"short","s":"Silicon Valley Bank failed in 2023 after rising rates cut the value of its long-term bonds and depositors pulled out money fast. Which bank risks does this show?","o":[["Interest rate risk","Riktig: renterisiko."],["Insurance risk","Feil: SVB var en bank."],["Physical climate risk","Feil: ikke årsaken."],["Credit risk from emissions","Feil: årsaken var renter og uttak."]],"c":[0],"es":"Lange obligasjoner tapte verdi når renten steg, og kundene tok ut pengene raskt. Det er renterisiko.","ed":"Husk: lange eiendeler + korte innskudd = sårbart.","kt":"Maturity transformation: using short-term deposits to fund long-term loans or bonds; it creates interest rate and liquidity (run) risk.","src":"L11 slide 9 · L11 slide 10"},{"id":"SB398","l":"L11","t":"Role of banks","f":"m","d":2,"p":"H","sc":"none","s":"Which is part of a bank's monitoring role?","o":[["Voting at borrowers' AGMs","Feil: banken er långiver, ikke eier."],["Screening before lending","Riktig: screening."],["Issuing ESG ratings","Feil: det gjør ratingbyråer."],["Guaranteeing all deposits itself","Feil: innskuddsgaranti er offentlig."]],"c":[1],"es":"Screening før utlån er en del av bankens monitoring.","ed":"Husk: screen før, monitor under.","kt":"","src":"L11 slide 7 · Bok s. 285 (10.1.3) · Bok s. 286 (10.1.3)"},{"id":"SB399","l":"L11","t":"Role of banks","f":"m","d":3,"p":"M","sc":"none","s":"When do firms usually choose a bank loan over a bond?","o":[["When uncertainty is lowest","Feil: trygge firmaer bruker obligasjoner."],["When it wants no monitoring","Feil: banklån gir mer overvåking."],["When cash flows are uncertain","Riktig: usikker kontantstrøm."],["Only when it is large and listed","Feil: store firmaer bruker ofte obligasjoner."]],"c":[2],"es":"Banklån velges når kontantstrømmen er usikker og banken må overvåke.","ed":"Husk: mer usikkerhet → bank. Lite usikkerhet → obligasjon.","kt":"","src":"Bok s. 286 (10.1.3) · L11 slide 3 · Bok s. 291 (Figure 10.3)"},{"id":"SB400","l":"L11","t":"Bank business model","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank lends to a firm whose factory sits on polluted land. Under the risk-based approach, how should this affect the loan?","o":[["A higher deposit rate for the bank","Feil: innskuddsrenten settes ikke av én kunde."],["No change","Feil: forurensning gir kredittrisiko."],["A lower rate","Feil: dårligere sikkerhet gir høyere rente."],["A higher interest rate","Riktig: høyere rente."]],"c":[3],"es":"Forurenset tomt gir mer risiko, så renten blir høyere.","ed":"Husk: risk-based = høyere risiko, høyere pris.","kt":"Expected loss = probability of default (PD) × loss given default (LGD) × exposure; the risk premium must cover it.","src":"Bok s. 284 (10.1.1) · Bok s. 292 (10.4) · Bok s. 293 (Table 10.3)"},{"id":"SB401","l":"L11","t":"Bank risks","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: A bank with a small office footprint but big loans to oil and gas firms is still exposed to climate transition risk.","o":[["True","Riktig. Bankens kredittrisiko inkluderer risikoen kundene har, også transition risk."],["False","Feil. Bankens kredittrisiko inkluderer risikoen kundene har, også transition risk."]],"c":[0],"es":"Sant. Kundenes risiko blir bankens kredittrisiko.","ed":"Husk: bankens viktigste påvirkning er gjennom utlånene.","kt":"Financed emissions: emissions of the companies and projects a bank lends to or invests in (part of its scope 3).","src":"L11 slide 10 · L11 slide 14 · L11 slide 31"},{"id":"SB402","l":"L11","t":"Material issues in banking","f":"m","d":3,"p":"M","sc":"short","s":"Which event matches a SASB material issue for banks?","o":[["Office paper use - systemic risk","Feil: papir er ikke systemrisiko."],["Branch water use - a core issue","Feil: ikke material for banker."],["A cyber attack - affordability","Feil: det er data security."],["Fake accounts - business ethics","Riktig: business ethics."]],"c":[3],"es":"Falske kontoer = business ethics.","ed":"Husk: Wells Fargo-saken.","kt":"SASB commercial banks: data security, access and affordability, product design (ESG in credit), business ethics, systemic risk management.","src":"L11 slide 12"},{"id":"SB403","l":"L11","t":"Material issues","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"Deutsche Bank ranks data privacy and customer satisfaction highest, and climate change low, in its materiality matrix. What is the critique?","o":[["Climate does not matter for banks","Feil: klima er svært relevant via lån."],["Its biggest issues are in its loans","Riktig: utlånene."],["Data privacy is the only issue","Feil: ikke det eneste."],["Banks should not publish materiality matrices","Feil: poenget er hva som er material."]],"c":[1],"es":"De største problemene til banken ligger i utlånene, ikke på kontoret.","ed":"Husk: indirect material issues.","kt":"","src":"L11 slide 13-14 · Bok s. 289 (10.2.2) · L11 slide 31-32"},{"id":"SB404","l":"L11","t":"Banks and society","f":"m","d":3,"p":"L","sc":"short","s":"More bank branches in India led to better household health years later (Cramer). Why?","o":[["Branches reduce pollution","Feil: ikke mekanismen."],["Credit helps pay for care","Riktig: kreditt hjelper."],["Banks offer medical care","Feil: bankene gir ikke behandling."],["A government health programme","Feil: studien bruker filialutbyggingen."]],"c":[1],"es":"Tilgang på kreditt hjalp folk å betale for helsehjelp.","ed":"Husk: finansiell inkludering.","kt":"Financial inclusion: access to useful and affordable financial services (savings, credit, payments, insurance).","src":"L11 slide 15 · L11 slide 12"},{"id":"SB405","l":"L11","t":"Banks and society","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Norwegian savings banks in communities with high social capital were LESS likely to survive after deregulation.","o":[["True","Feil. Sparebanker i lokalsamfunn med høy social capital overlevde oftere."],["False","Riktig. Sparebanker i lokalsamfunn med høy social capital overlevde oftere."]],"c":[1],"es":"Usant. Høy social capital ga HØYERE overlevelse.","ed":"Husk: tillit hjelper.","kt":"","src":"L11 slide 16 · Bok s. 287 (10.2)"},{"id":"SB406","l":"L11","t":"Risk-based vs value-based banking","f":"m","d":2,"p":"H","sc":"none","s":"How do sustainable lending approaches fit the SF stages?","o":[["ESG integration is SF 3.0","Feil: integrering er SF 2.0."],["1.0-2.0 risk-based; 3.0 value-based","Riktig: 1.0–2.0 risk, 3.0 value."],["Exclusion is value-based","Feil: koblingen er snudd."],["All three are value-based","Feil: 1.0 og 2.0 er risk-based."]],"c":[1],"es":"SF 1.0–2.0 er risk-based. SF 3.0 er value-based.","ed":"Husk: risk-based = return + risk. Value-based = + impact.","kt":"","src":"L11 slide 18 · Bok s. 292 (Table 10.2) · Bok s. 292 (10.3.1)"},{"id":"SB407","l":"L11","t":"Risk-based lending","f":"m","d":3,"p":"H","sc":"short","s":"A chemicals firm's plant sits on polluted land. Which credit risk parameters can this affect?","o":[["Only the deposit rate","Feil: ikke innskuddsrenten."],["Only fee income","Feil: effekten går via tap."],["None","Feil: det påvirker kreditt."],["Both PD and LGD","Riktig: PD og LGD."]],"c":[3],"es":"Både PD og LGD kan påvirkes.","ed":"Husk: PD = sannsynlighet for mislighold. LGD = tap ved mislighold.","kt":"","src":"Bok s. 292 (10.4) · Bok s. 293 (Table 10.3) · Bok s. 294 (10.4) · Bok s. 291 (10.3)"},{"id":"SB408","l":"L11","t":"Risk-based lending","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Weber (2010) concludes that sustainability criteria cannot predict how a borrower will perform.","o":[["True","Feil. Weber finner at bærekraftskriterier kan forutsi låntakerens prestasjon."],["False","Riktig. Weber finner at bærekraftskriterier kan forutsi låntakerens prestasjon."]],"c":[1],"es":"Usant. Bærekraftskriterier forbedrer prediksjonen.","ed":"Husk: ESG gir info om kreditt.","kt":"","src":"L11 slide 20 · Bok s. 294 (10.4) · Bok s. 299 (10.4.3)"},{"id":"SB409","l":"L11","t":"Risk-based lending","f":"m","d":3,"p":"M","sc":"none","s":"The Sustainability Credit Score System models three paths for a firm. Which?","o":[["Start-up, growth, maturity","Feil: dette er livsløp."],["Business as usual, sustainable, future","Riktig: de tre veiene."],["Investment grade, high yield, default","Feil: kredittkategorier."],["Exclusion, integration, impact","Feil: SF-tilnærminger."]],"c":[1],"es":"Tre veier: business as usual, bærekraftig, fremtidig.","ed":"Husk: fremoverskuende vurdering.","kt":"","src":"L11 slide 19 · Bok s. 294 (10.4) · Bok s. 295 (Box 10.1)"},{"id":"SB410","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"H","sc":"none","s":"How do values-based banks compare with the biggest global banks (2006-15)?","o":[["The same returns and risk","Feil: volatiliteten er ulik."],["Lower returns and more debt","Feil: de har lavere gjeld."],["Much higher returns, but more risk","Feil: litt lavere ROE og mindre risiko."],["Similar returns, more stable","Riktig: lik avkastning, mer stabil."]],"c":[3],"es":"Values-based banks har lik avkastning, men er mer stabile.","ed":"Husk: VBB = stabil og realøkonomi.","kt":"","src":"L11 slide 22 · Bok s. 287 (10.2) · Bok s. 288 (Table 10.1)"},{"id":"SB411","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"Bank X is very profitable but lends mostly to speculation. Bank Y is less profitable but lends to renewables, social housing and small firms. Which scores higher on the GABV scorecard?","o":[["Y: real-economy lending","Riktig: Y låner til realøkonomien."],["X: profitability counts most","Feil: lønnsomhet er bare en betingelse."],["Neither","Feil: den gjelder banker."],["Both score the same","Feil: de scorer ulikt."]],"c":[0],"es":"Y, fordi utlån til realøkonomien veier tyngst.","ed":"Husk: GABV vekter impact.","kt":"Triple bottom line: people, planet and profit - social, environmental and financial results.","src":"Bok s. 304 (Table 10.4) · L11 slide 22"},{"id":"SB412","l":"L11","t":"Values-based banking","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Risk-based lending looks at return, risk and impact, while values-based banking looks only at return and risk.","o":[["True","Feil. Rollene er snudd: risk-based er to dimensjoner, values-based legger til impact."],["False","Riktig. Rollene er snudd: risk-based er to dimensjoner, values-based legger til impact."]],"c":[1],"es":"Usant. Det er motsatt: risk-based ser på avkastning og risiko, values-based legger til impact.","ed":"Husk: values-based = 3 dimensjoner.","kt":"","src":"Bok s. 303 (10.5) · Bok s. 303 (Figure 10.4) · Bok s. 304 (10.5)"},{"id":"SB413","l":"L11","t":"Sustainable loans","f":"m","d":2,"p":"H","sc":"none","s":"How do green loans differ from sustainability-linked loans (SLLs)?","o":[["Green: projects; SLL: KPIs","Riktig: prosjekt vs KPI."],["Green: KPIs; SLL: projects","Feil: koblingen er snudd."],["SLLs are only for utilities","Feil: mange sektorer."],["Both must fund renewables","Feil: SLL kan brukes fritt."]],"c":[0],"es":"Green loan = øremerket prosjekt. SLL = rente koblet til KPI.","ed":"Husk: samme som green bond vs SLB.","kt":"","src":"L11 slide 23-25 · Bok s. 295 (Box 10.1)"},{"id":"SB414","l":"L11","t":"Sustainable loans","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In 2017 Philips got a €1bn credit line from 16 banks, with the interest rate linked to its sustainability performance. Which statement is correct?","o":[["It is a social impact bond","Feil: det er en kredittlinje."],["The money can be used freely","Riktig: fritt bruk."],["The rate is fixed","Feil: renten er koblet."],["Philips checks itself","Feil: Sustainalytics vurderte."]],"c":[1],"es":"Philips kan bruke pengene fritt. Renten avhenger av bærekraft.","ed":"Husk: SLL.","kt":"","src":"Bok s. 295 (Box 10.1) · L11 slide 25"},{"id":"SB415","l":"L11","t":"Equator Principles","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the Equator Principles for project finance?","o":[["Independent review","Riktig: independent review."],["A guaranteed return","Feil: ikke et prinsipp."],["Mandatory green bonds","Feil: ikke et prinsipp."],["Shareholder votes on projects","Feil: ikke et prinsipp."]],"c":[0],"es":"Uavhengig gjennomgang er et Equator-prinsipp.","ed":"Husk: Equator = prosjektfinans.","kt":"","src":"L11 slide 26 · Bok s. 297 (10.4.1) · Bok s. 298 (10.4.1)"},{"id":"SB416","l":"L11","t":"Equator Principles","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The Equator Principles have strong enforcement, and nearly all member banks disclose all required information.","o":[["True","Feil. Det finnes ingen kontroll, og bare rundt 5 % av bankene rapporterer alt."],["False","Riktig. Det finnes ingen kontroll, og bare rundt 5 % av bankene rapporterer alt."]],"c":[1],"es":"Usant. Det er svak håndheving, og bare ca. 5 % rapporterer alt.","ed":"Husk: frivillig = svak.","kt":"","src":"Bok s. 298 (10.4.1) · Bok s. 297 (10.4.1) · Bok s. 300 (Box 10.3)"},{"id":"SB417","l":"L11","t":"UN Principles for Responsible Banking","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the UN Principles for Responsible Banking?","o":[["Set impact targets","Riktig: impact-mål."],["Never lend to energy firms","Feil: ingen sektorforbud."],["Keep impacts secret","Feil: prinsippene krever åpenhet."],["Maximise short-term returns","Feil: ikke et prinsipp."]],"c":[0],"es":"Sett impact-mål er et PRB-prinsipp.","ed":"Husk: PRB = mål + åpenhet.","kt":"","src":"L11 slide 27-29 · L11 slide 32"},{"id":"SB418","l":"L11","t":"Banking regulation","f":"m","d":3,"p":"H","sc":"none","s":"What does the Green Asset Ratio (GAR) measure for a bank?","o":[["Emissions per employee","Feil: det gjelder finansierte aktiviteter."],["Equity to green bonds","Feil: det gjelder eiendeler."],["Share of staff in sustainability jobs","Feil: ikke det."],["Share of taxonomy-aligned loans","Riktig: andel grønne lån."]],"c":[3],"es":"GAR = andel lån som er taxonomy-aligned.","ed":"Husk: GAR bygger på EU Taxonomy.","kt":"","src":"L11 slide 30-31"},{"id":"SB419","l":"L11","t":"Banking regulation","f":"m","d":4,"p":"H","sc":"none","s":"Should bank capital rules be used to steer lending to green projects? The textbook says:","o":[["Central banks should pick technologies","Feil: det er for myndighetene."],["Never consider climate risk","Feil: klimarisiko bør vurderes."],["Lower capital rules for all green loans","Feil: grønt har også risiko."],["Raise rules for brown loans","Riktig: høyere krav for brunt."]],"c":[3],"es":"Øk kapitalkravet for brune lån.","ed":"Husk: straff brunt, ikke belønn grønt.","kt":"","src":"Bok s. 301 (10.4.5) · Bok s. 302 (10.4.5)"},{"id":"SB420","l":"L11","t":"Banking regulation","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about lending regulation is correct?","o":[["China's policy hurt bank results","Feil: positiv effekt."],["It applies only to state banks","Feil: alle banker."],["Brazil bans environmental factors","Feil: Brasil krever integrering."],["China limits loans to polluters","Riktig: Kina begrenser slike lån."]],"c":[3],"es":"Kina begrenser lån til forurensere.","ed":"Husk: green credit policy.","kt":"","src":"Bok s. 298 (10.4.2) · Bok s. 299 (10.4.2) · Bok s. 302 (10.4.5) · Bok s. 303 (10.4.5)"},{"id":"SB421","l":"L11","t":"Evidence on sustainable lending","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Two firms with the same credit rating apply for unsecured loans. Firm A has serious environmental and social scandals; firm B does not. What should we expect?","o":[["A pays more","Riktig: A betaler mer."],["Both pay the same rate","Feil: banker priser ESG."],["A pays less","Feil: mer risiko = høyere rente."],["B pays more","Feil: B har mindre risiko."]],"c":[0],"es":"A betaler mer, fordi ESG-skandaler øker risikoen.","ed":"Husk: særlig uten sikkerhet.","kt":"Loan spread: the margin over the base rate that a borrower pays, reflecting credit risk and other costs.","src":"Bok s. 299 (10.4.3)"},{"id":"SB422","l":"L11","t":"Barriers and incentives","f":"m","d":3,"p":"M","sc":"none","s":"Which is a barrier to bringing sustainability into lending?","o":[["Loans are shorter than most E&S risks","Riktig: kort løpetid."],["Banks know too little about borrowers","Feil: banker har god info."],["Pricing ESG is banned","Feil: ikke forbudt."],["Green loans are never profitable","Feil: VBB er lønnsomme."]],"c":[0],"es":"Lånene er kortere enn E&S-risikoene.","ed":"Husk: myopic bankers.","kt":"","src":"Bok s. 300 (10.4.4) · Bok s. 300 (Box 10.3)"},{"id":"SB423","l":"L11","t":"Barriers and incentives","f":"m","d":3,"p":"H","sc":"short","s":"A bank charges a higher mortgage rate for homes with energy labels E-G than A-D. Why?","o":[["Nudging and safer collateral","Riktig: nudge og sikkerhet."],["Regulators ban E-G mortgages","Feil: ikke forbudt."],["Inefficient homes are cheaper to insure","Feil: ikke forsikring."],["Green homes default more","Feil: grønne hjem har lavere risiko."]],"c":[0],"es":"Høyere rente dytter mot energieffektivitet og gir tryggere sikkerhet.","ed":"Husk: nudging.","kt":"","src":"Bok s. 301 (10.4.5) · Bok s. 301 (Box 10.4) · Bok s. 291 (10.3)"},{"id":"SB424","l":"L11","t":"Circular economy financing","f":"m","d":4,"p":"M","sc":"none","s":"Why are circular (product-as-a-service) business models harder for banks to finance?","o":[["Banks may not lend to them","Feil: ikke forbudt."],["They have no cash flows","Feil: de har leieinntekter."],["Lease income and unclear collateral","Riktig: leie og uklar sikkerhet."],["Their products wear out faster","Feil: lengre levetid."]],"c":[2],"es":"Leieinntekter og uklar sikkerhet gjør det vanskelig.","ed":"Husk: sirkulær = eier produktet lenge.","kt":"","src":"Bok s. 305 (10.5.1) · Bok s. 306 (10.5.1) · Bok s. 307 (10.5.1)"},{"id":"SB425","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A savings bank lends only to projects with a clear social or environmental benefit, as long as they are financially viable. This is:","o":[["ESG risk integration (SF 2.0)","Feil: SF 2.0 justerer risikopremie."],["Exclusion (SF 1.0)","Feil: det går lenger."],["Finance as usual","Feil: impact endrer hvem som får lån."],["Value-based banking (SF 3.0)","Riktig: SF 3.0."]],"c":[3],"es":"Impact først, levedyktig som krav = value-based banking (SF 3.0).","ed":"Husk: impact styrer utvalget.","kt":"Value-based banking: lending primarily to projects with positive social or environmental impact, with financial viability as a condition (return, risk and impact).","src":"L11 slide 18 · L11 slide 22 · Bok s. 303 (10.5)"},{"id":"SB426","l":"L11","t":"Banking structure","f":"t","d":3,"p":"L","sc":"none","s":"True or false: The US Volcker Rule moves proprietary trading into a separate unit, while the EU Liikanen Report bans it outright.","o":[["True","Feil. Rollene er snudd: Volcker forbyr, Liikanen flytter til egen enhet."],["False","Riktig. Rollene er snudd: Volcker forbyr, Liikanen flytter til egen enhet."]],"c":[1],"es":"Usant. Det er motsatt: Volcker forbyr, Liikanen skiller ut.","ed":"Husk: Volcker = ban. Liikanen = separate.","kt":"","src":"Bok s. 288 (10.2.1) · Bok s. 289 (10.2.1)"},{"id":"SB427","l":"L11","t":"Material issues","f":"m","d":3,"p":"L","sc":"extended_course_case","s":"Handelsbanken did well in the financial crisis. What stands out about its business culture?","o":[["No performance bonuses","Riktig: ingen bonuser."],["All lending decided at headquarters","Feil: lokal tilstedeværelse."],["Focus on quarterly returns","Feil: langsiktig fokus."],["Bonuses for loan growth","Feil: de unngår volumbonuser."]],"c":[0],"es":"Handelsbanken har ingen prestasjonsbonuser.","ed":"Husk: langsiktig kultur.","kt":"","src":"Bok s. 289 (10.2.2) · Bok s. 290 (10.2.2)"},{"id":"SB428","l":"L11","t":"Banking synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A Norwegian bank has a big, long-time shipping client with an old, inefficient fleet. The loans mature within five years. What is the best approach?","o":[["Price the risk; offer a KPI loan","Riktig: pris og KPI-lån."],["End all loans at once","Feil: banker holder kontrakter."],["Ignore it","Feil: sikkerhet og levedyktighet betyr noe."],["Lower the client's risk weight","Feil: banken setter ikke vektene."]],"c":[0],"es":"Pris risikoen og tilby et KPI-lån.","ed":"Husk: nudge + gradvis.","kt":"","src":"Bok s. 300 (10.4.4) · Bok s. 301 (10.4.5) · L11 slide 25 · L11 slide 31 · Bok s. 306 (10.5.1)"},{"id":"SB429","l":"L11","t":"Bank climate commitments","f":"m","d":4,"p":"M","sc":"short","s":"In 2024-25 the largest US banks left the Net-Zero Banking Alliance, and banks increased fossil fuel lending. What does this suggest about voluntary coalitions?","o":[["Banks do not affect emissions","Feil: finansiering påvirker utslipp."],["Regulation is not needed","Feil: regulering og koalisjoner utfyller hverandre."],["Members can leave or free ride","Riktig: kan forlate."],["They always lead to binding cuts","Feil: løfter kan droppes."]],"c":[2],"es":"Medlemmer kan forlate eller snylte i frivillige koalisjoner.","ed":"Husk: svake sanksjoner.","kt":"Free riding: enjoying the benefits of a coalition (reputation) without following its rules or costs.","src":"L11 slide 32 · Bok s. 113 (4.3.1)"},{"id":"SB430","l":"L11","t":"Sustainability and collateral","f":"m","d":3,"p":"M","sc":"none","s":"Why does sustainability matter for the collateral banks take?","o":[["Collateral values never change","Feil: verdier svinger."],["Only unsecured loans are at risk","Feil: sikrede lån eksponeres via pantet."],["Electric cars are risk-free collateral","Feil: el-biler har også dilemmaer."],["Collateral can lose value","Riktig: kan tape verdi."]],"c":[3],"es":"Sikkerheten (pantet) kan tape verdi.","ed":"Husk: energieffektivitet styrer boligverdi.","kt":"","src":"Bok s. 291 (10.3) · Bok s. 292 (10.3)"},{"id":"SB431","l":"L11","t":"Competition in sustainable lending","f":"m","d":3,"p":"L","sc":"none","s":"Which three types of social and environmental risk arise in project finance (Weber, 2017)?","o":[["Scope 1, 2 and 3","Feil: utslippskategorier."],["Interest rate, currency, liquidity","Feil: finansiell risiko."],["Adverse selection, moral hazard, verification","Feil: overvåkingsproblemer."],["Inside-out, outside-in, reputation","Riktig: de tre typene."]],"c":[3],"es":"Inside-out, outside-in og omdømme.","ed":"Husk: tre typer risiko.","kt":"","src":"Bok s. 297 (10.4.1)"},{"id":"TR50","l":"L11","t":"Information asymmetry in banking","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank charges every small firm the same rate because it cannot tell good from bad borrowers. What happens, and what should the bank do?","o":[["Safe firms leave; the bank must screen","Riktig: adverse selection."],["All firms borrow more","Feil: poolen blir dårligere."],["Nothing happens","Feil: lik rente ignorerer risiko."],["Borrowers take more risk; raise deposit rates","Feil: det er moral hazard."]],"c":[0],"es":"Trygge firmaer forsvinner. Banken må screene (adverse selection).","ed":"Husk: lemons i utlån.","kt":"Adverse selection: hidden information before a contract leads to bad types crowding out good ones (Akerlof's market for lemons).","src":"Opptak L11 ca. 8 min · Opptak L5 ca. 17 min"},{"id":"TR51","l":"L11","t":"Bank business model","f":"m","d":2,"p":"M","sc":"none","s":"On a bank's balance sheet, where are deposits and loans, and why does equity matter?","o":[["Both are assets","Feil: innskudd er gjeld."],["Deposits: debts; loans: assets","Riktig: innskudd gjeld, lån eiendel."],["Both are off the balance sheet","Feil: de er i balansen."],["Deposits: assets; loans: debts","Feil: eiendel og gjeld er byttet."]],"c":[1],"es":"Innskudd = gjeld, lån = eiendeler. Egenkapital er bufferen.","ed":"Husk: for banken er innskudd gjeld.","kt":"","src":"Opptak L11 ca. 16 min · Opptak L11 ca. 48 min"},{"id":"TR52","l":"L11","t":"Sustainability approaches in banking","f":"m","d":3,"p":"H","sc":"short","s":"Triodos Bank lends only to viable projects with a positive social or environmental impact. This is:","o":[["Risk-based exclusion (SF 1.0)","Feil: exclusion krever ikke impact."],["Finance as usual","Feil: impact er målet."],["Value-based banking (SF 3.0)","Riktig: SF 3.0."],["ESG integration (SF 2.0)","Feil: integrering priser risiko."]],"c":[2],"es":"Impact først = value-based banking (SF 3.0).","ed":"Husk: Triodos.","kt":"","src":"Opptak L11 ca. 32 min · Opptak L11 ca. 40 min"},{"id":"TR53","l":"L11","t":"ESG in credit risk","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Adding sustainability risks to credit models improves predictions of how borrowers perform, suggesting these risks were not fully priced.","o":[["True","Riktig. Hvis risikoen var priset, ville ikke prediksjonen blitt bedre."],["False","Feil. Hvis risikoen var priset, ville ikke prediksjonen blitt bedre."]],"c":[0],"es":"Sant. Bedre prediksjon viser at risikoen ikke var priset.","ed":"Husk: ny info = forbedring.","kt":"","src":"Opptak L11 ca. 38 min"},{"id":"CX091","l":"L12","t":"Asymmetric information","f":"m","d":2,"p":"H","sc":"none","s":"An insured homeowner who stops maintaining the house because the insurer will pay is an example of:","o":[["Moral hazard","Atferd endres etter avtalen."],["Protection gap","Det er uforsikrede tap."],["Adverse selection","Det er skjult informasjon før avtalen."],["Basis risk","Det gjelder parametrisk forsikring."]],"c":[0],"es":"Etter avtalen = moral hazard.","ed":"Forsikringsselskaper bruker egenandel (deductible) mot moral hazard, og screening mot adverse selection.","kt":"","src":"Bok s. 324 (11.1.4)","k":1},{"id":"CX092","l":"L12","t":"Insurance and climate","f":"m","d":2,"p":"H","sc":"none","s":"The insurance protection gap gets bigger when:","o":[["Disaster losses fall over time","Det minsker heller problemet."],["Premiums fall in safe areas","Det påvirker ikke gapet i risikoområder."],["More homeowners buy insurance","Det minsker gapet."],["Insurers exit high-risk areas","Flere tap blir uforsikret."]],"c":[3],"es":"Forsikring trekker seg ut → større protection gap.","ed":"Protection gap = andelen tap som ikke er forsikret. Eksempel: State Farm i California. Uforsikrede hus er vanskeligere å få lån på, så boligpriser og banker rammes også.","kt":"","src":"L12 slide 3 · Bok s. 337 (11.3.2.1)","k":1},{"id":"CX093","l":"L12","t":"Insurance business model","f":"m","d":2,"p":"H","sc":"none","s":"On an insurer's balance sheet, UNEXPECTED claims are covered by:","o":[["Equity","Egenkapitalen er bufferen for uventede tap."],["Technical provisions","De dekker forventede skader."],["The policyholders","Kundene skal nettopp slippe å bære tapet."],["Next year's premiums","De er ikke en buffer i balansen i dag."]],"c":[0],"es":"Uventet = equity. Forventet = technical provisions.","ed":"Ekstreme tap utover egenkapitalen dekkes av reinsurance, cat bonds eller staten.","kt":"","src":"L12 slide 8 · Bok s. 318 (Figure 11.1) · L12 slide 16","k":1},{"id":"CX094","l":"L12","t":"Material issues in insurance","f":"m","d":2,"p":"H","sc":"none","s":"Climate change can hit an insurer's balance sheet:","o":[["Nowhere, because risk is reinsured","Reinsurance fjerner ikke all risiko."],["Only on its assets (investments)","Erstatningene øker også."],["Only on its liabilities (the claims)","Investeringene kan også rammes."],["On both assets and liabilities","Flere erstatninger (liabilities) og tap på investeringer (assets)."]],"c":[3],"es":"Begge sider av balansen.","ed":"Samme klimahendelse kan både øke erstatningene og redusere verdien av investeringene. Derfor bør scenarioanalyse dekke begge sider.","kt":"","src":"L12 slide 10 · L12 slide 8","k":1},{"id":"CX095","l":"L12","t":"Insurance innovation","f":"t","d":2,"p":"H","sc":"none","s":"Does parametric insurance pay out based on a measured event, such as wind speed, rather than the actual loss?","o":[["Yes","Riktig. Fordelen er rask utbetaling. Ulempen er basis risk."],["No","Feil. Fordelen er rask utbetaling. Ulempen er basis risk."]],"c":[0],"es":"Ja: målt hendelse, ikke faktisk tap.","ed":"Basis risk: utbetalingen matcher ikke alltid skaden. Jamaica fikk ingenting etter orkanen Beryl fordi triggeren så vidt ikke ble utløst.","kt":"","src":"Opptak L12 ca. 27 min · Opptak L12 ca. 37 min","k":1},{"id":"CX096","l":"L12","t":"Risk sharing","f":"m","d":2,"p":"H","sc":"none","s":"If the specified disaster occurs, investors in a catastrophe bond:","o":[["The government repays them","Det er ingen statsgaranti."],["They receive double interest","Det er motsatt: de taper."],["They lose part or all of the principal","Pengene går til å dekke forsikringstapet."],["Nothing changes for the bond investors","Hele poenget er at investorene bærer risikoen."]],"c":[2],"es":"Katastrofe → cat bond-investorer taper.","ed":"Til gjengjeld får investorene høy rente når katastrofen ikke skjer. Slik flyttes ekstrem risiko fra forsikring til kapitalmarkedet.","kt":"","src":"L12 slide 18 · Bok s. 322 (11.1.3)","k":1},{"id":"SB432","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"H","sc":"short","s":"In 2023 State Farm stopped selling new home insurance in California because of wildfire risk. What is the most likely knock-on effect?","o":[["Stricter EU capital rules","Feil: California har ikke Solvency II."],["A bigger protection gap","Riktig: større protection gap."],["No effect","Feil: offentlige ordninger er begrenset."],["Less wildfire risk","Feil: risikoen for brann endres ikke."]],"c":[1],"es":"Når forsikringen forsvinner, står flere hjem uten dekning = større protection gap.","ed":"Husk: protection gap = tap som ikke er forsikret.","kt":"Protection gap: the share of economic losses from disasters that is not insured.","src":"L12 slide 3 · Bok s. 337 (11.3.2.1)"},{"id":"SB433","l":"L12","t":"Insurance business model","f":"m","d":2,"p":"H","sc":"none","s":"On an insurer's balance sheet, technical provisions and equity cover:","o":[["Equity: expected claims; provisions: unexpected claims","Feil: rollene er snudd."],["Both are investment assets","Feil: begge er på gjeldssiden."],["Provisions: expected claims; equity: unexpected claims","Riktig: avsetning forventet, egenkapital uventet."],["Provisions are the insurer's cash","Feil: avsetninger er forpliktelser."]],"c":[2],"es":"Avsetninger dekker forventede krav. Egenkapital dekker uventede.","ed":"Husk: expected = provisions. Unexpected = equity.","kt":"","src":"L12 slide 8 · Bok s. 318 (Figure 11.1) · L12 slide 16"},{"id":"SB434","l":"L12","t":"Insurance business model","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A non-life insurer with a combined ratio a bit above 100% can still make a profit, because it earns investment income before claims are paid.","o":[["True","Riktig. Inntekt fra investeringer kan dekke et lite underskudd i forsikringsdriften."],["False","Feil. Inntekt fra investeringer kan dekke et lite underskudd i forsikringsdriften."]],"c":[0],"es":"Sant. Investeringsinntekt kan veie opp et lite tap på forsikringen.","ed":"Husk: profitt = (100 − combined ratio) + investering.","kt":"Combined ratio: (claims + expenses) / premiums; below 100% means underwriting is profitable on its own.","src":"Bok s. 318 (11.1.1) · Bok s. 319 (11.1.1)"},{"id":"SB435","l":"L12","t":"Material issues in insurance","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: For a Norwegian non-life insurer, climate change matters only for claims, not for its investments.","o":[["True","Feil. Klimarisiko rammer også forsikringsselskapets investeringer."],["False","Riktig. Klimarisiko rammer også forsikringsselskapets investeringer."]],"c":[1],"es":"Usant. Klima påvirker også investeringene.","ed":"Husk: begge sider av balansen.","kt":"Asset side vs liability side: an insurer's investments (assets) vs its obligations to pay claims (technical provisions).","src":"L12 slide 10 · L12 slide 8"},{"id":"SB436","l":"L12","t":"Material issues","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Swiss Re sees climate change as its most important material issue. Which is part of its climate strategy?","o":[["Measuring climate risk","Riktig: måle risiko."],["Stopping all weather insurance","Feil: de forsikrer fortsatt."],["Ignoring its own emissions","Feil: de jobber med eget fotavtrykk."],["Lobbying against climate policy","Feil: de støtter klimapolitikk."]],"c":[0],"es":"Å måle klimarisiko er en del av Swiss Re sin strategi.","ed":"Husk: mål, produkter, bevissthet, eget fotavtrykk.","kt":"","src":"L12 slide 11 · Bok s. 326 (Box 11.2) · Bok s. 327 (11.2)"},{"id":"SB437","l":"L12","t":"Risk modelling","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Catastrophe modelling looks at good and bad outcomes for the whole insurer, while scenario analysis looks only at losses from natural disasters.","o":[["True","Feil. Definisjonene er byttet om."],["False","Riktig. Definisjonene er byttet om."]],"c":[1],"es":"Usant. Det er motsatt: scenario analysis ser bredt, cat modelling ser på katastrofer.","ed":"Husk: cat model = naturkatastrofer.","kt":"","src":"L12 slide 13-15"},{"id":"SB438","l":"L12","t":"Risk modelling","f":"m","d":3,"p":"M","sc":"none","s":"The Dutch central bank's \"Waterproof\" study estimates home insurance claims in 2085. What does it show?","o":[["Claims are the same in both","Feil: 3,5 °C gir mye mer."],["Claims fall in both","Feil: kravene øker i begge."],["Claims rise, most at 3.5°C","Riktig: mest ved 3,5 °C."],["Claims rise only at 1.5°C","Feil: mer ved høy oppvarming."]],"c":[2],"es":"Kravene øker, mest ved 3,5 °C.","ed":"Husk: mer oppvarming = flere krav.","kt":"","src":"L12 slide 14 · Bok s. 337 (11.3.2.1)"},{"id":"SB439","l":"L12","t":"Catastrophe modelling","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the five parts of a catastrophe model?","o":[["A tax part","Feil: ikke en del."],["A credit part","Feil: ikke en del."],["A vulnerability part","Riktig: vulnerability."],["A dividend part","Feil: ikke en del."]],"c":[2],"es":"Vulnerability er en av de fem delene.","ed":"Husk: hazard, vulnerability, exposure, financial, ...","kt":"","src":"L12 slide 15 · Bok s. 331 (11.3.1) · Bok s. 332 (11.3.1)"},{"id":"SB440","l":"L12","t":"Catastrophe modelling","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A \"200-year flood\" cannot happen twice in ten years.","o":[["True","Feil. Det er en sannsynlighet per år. To slike flommer kan komme tett."],["False","Riktig. Det er en sannsynlighet per år. To slike flommer kan komme tett."]],"c":[1],"es":"Usant. \"200-års flom\" er bare et snitt (0,5 % per år). Den kan skje flere ganger.","ed":"Husk: return period ≠ timeplan.","kt":"Return period: the inverse of the annual exceedance frequency; a 200-year event has about a 0.5% chance each year.","src":"Bok s. 332 (11.3.1) · Bok s. 333 (Table 11.3)"},{"id":"SB441","l":"L12","t":"Catastrophe modelling","f":"m","d":3,"p":"H","sc":"none","s":"In the loss distribution, what is the \"unexpected loss\", and what covers it?","o":[["Losses that never happen","Feil: de skjer."],["Above expected, covered by equity","Riktig: over forventet, egenkapital."],["Extreme losses, covered by provisions","Feil: ekstreme tap dekkes ikke av avsetninger."],["The average loss, covered by premiums","Feil: snittet er expected loss."]],"c":[1],"es":"Unexpected loss = tap over det forventede, dekket av egenkapital.","ed":"Husk: expected → provisions. Unexpected → equity.","kt":"","src":"L12 slide 16 · L12 slide 8 · Bok s. 319 (11.1.2)"},{"id":"SB442","l":"L12","t":"Catastrophe risk","f":"t","d":3,"p":"M","sc":"none","s":"True or false: With enough policies, catastrophe losses become as predictable as small claims (law of large numbers).","o":[["True","Feil. Katastrofetap har tunge haler og rammer mange samtidig."],["False","Riktig. Katastrofetap har tunge haler og rammer mange samtidig."]],"c":[1],"es":"Usant. Katastrofer har fat tails og jevner seg ikke ut.","ed":"Husk: små krav jevner seg ut, katastrofer gjør ikke.","kt":"","src":"Bok s. 319 (11.1.2) · L12 slide 15 · L12 slide 18"},{"id":"SB443","l":"L12","t":"Risk sharing","f":"m","d":3,"p":"H","sc":"short","s":"The 2025 Los Angeles wildfires caused huge insured losses. How can individual insurers survive such an event?","o":[["Reinsurance and cat bonds","Riktig: reforsikring og cat bonds."],["The central bank pays","Feil: sentralbanken betaler ikke."],["Each insurer holds enough cash itself","Feil: egenkapitalen ville blitt borte."],["Customers pay themselves","Feil: forsikringen betaler."]],"c":[0],"es":"Reforsikring og cat bonds sprer risikoen.","ed":"Husk: risiko i lag.","kt":"Re-insurance: insurance for insurers; excess-of-loss contracts pay losses above a retention limit.","src":"L12 slide 18 · Bok s. 322 (11.1.3)"},{"id":"SB444","l":"L12","t":"Risk sharing","f":"m","d":3,"p":"M","sc":"none","s":"Why do investors buy catastrophe bonds?","o":[["They are risk-free","Feil: investorene bærer risikoen."],["They move with stocks","Feil: lav korrelasjon er poenget."],["High yield and low correlation","Riktig: høy rente og lav korrelasjon."],["They always pay their coupons","Feil: kan bortfalle etter katastrofe."]],"c":[2],"es":"Høy rente og lav korrelasjon med andre investeringer.","ed":"Husk: cat bonds = diversifisering.","kt":"","src":"Bok s. 323 (11.1.3) · L12 slide 18"},{"id":"SB445","l":"L12","t":"Asymmetric information","f":"m","d":3,"p":"M","sc":"none","s":"How do Rothschild and Stiglitz (1976) solve adverse selection in insurance?","o":[["High-risk clients must take deductibles","Feil: det er lavrisiko-kundene."],["Everyone buys full cover at one price","Feil: én pris driver ut lavrisiko."],["Insurers see every risk directly","Feil: forsikringen ser ikke typen."],["Clients pick contracts that reveal their risk","Riktig: selvseleksjon."]],"c":[3],"es":"Kundene velger kontrakter som avslører risikoen deres.","ed":"Husk: lavrisiko velger egenandel.","kt":"","src":"Bok s. 324 (11.1.4)"},{"id":"SB446","l":"L12","t":"Climate change and insurance","f":"m","d":3,"p":"M","sc":"none","s":"The IPCC rates its confidence in climate effects on natural hazards. Which statement is correct?","o":[["Worse droughts everywhere: very high confidence","Feil: medium eller lav."],["River floods: high confidence","Feil: lav confidence."],["More heavy rain: unlikely","Feil: det er likely."],["Higher coastal water levels: very likely","Riktig: very likely."]],"c":[3],"es":"Høyere havnivå ved kysten er very likely.","ed":"Husk: very likely = 90–100 %.","kt":"","src":"L12 slide 21 · Bok s. 333 (11.3.2) · Bok s. 334 (11.3.2) · Bok s. 335 (11.3.2)"},{"id":"SB447","l":"L12","t":"Climate change and insurance","f":"m","d":4,"p":"H","sc":"short","s":"A small sea-level rise can turn today's 100-year floods into events every few years. What does this mean for insurers?","o":[["It only matters after 2100","Feil: effekten kommer før."],["Risk grows steadily, so past data are fine","Feil: den er eksponentiell."],["Past losses understate risk","Riktig: fortiden undervurderer."],["Insurers can ignore it","Feil: protection gaps."]],"c":[2],"es":"Historiske tap undervurderer fremtidig risiko.","ed":"Husk: eksponentiell effekt.","kt":"Non-linear (exponential) risk: a small change in a driver causes a much larger change in outcomes.","src":"Bok s. 337 (Figure 11.7) · Bok s. 338 (Table 11.4) · Bok s. 337 (11.3.2.1)"},{"id":"SB448","l":"L12","t":"Climate change and insurance","f":"m","d":4,"p":"H","sc":"none","s":"If home insurance pulls out of flood areas or gets too expensive, what happens to banks?","o":[["Banks gain","Feil: boligprisene faller."],["Banks are not affected","Feil: forsikring er ofte krav."],["Banks take over the insurance","Feil: bankene overtar ikke."],["Banks lend less","Riktig: bankene låner mindre."]],"c":[3],"es":"Uten forsikring låner bankene ut mindre i flomområder.","ed":"Husk: forsikring er ofte krav for boliglån.","kt":"","src":"Bok s. 337 (11.3.2.1) · Bok s. 338 (11.3.2.1) · L11 slide 31"},{"id":"SB449","l":"L12","t":"Climate change and insurance","f":"m","d":5,"p":"M","sc":"none","s":"What is Weitzman's (2009) key point about rare but extreme climate disasters?","o":[["Fat tails favour acting now","Riktig: handle nå."],["They are impossible","Feil: katastrofe er mulig."],["Learning removes all extreme risk","Feil: usikkerheten består."],["Wait until everything is known","Feil: argumentet er føre-var."]],"c":[0],"es":"Fat tails gjør at vi bør handle nå.","ed":"Husk: Weitzman = føre-var.","kt":"","src":"Bok s. 335 (11.3.2) · Bok s. 319 (11.1.2)"},{"id":"SB450","l":"L12","t":"Mitigation and adaptation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Insurance only moves the financial part of disaster risk, so it should be combined with risk reduction such as flood defences, not replace it.","o":[["True","Riktig. Forsikring hindrer ikke skade, så det må kombineres med forebygging."],["False","Feil. Forsikring hindrer ikke skade, så det må kombineres med forebygging."]],"c":[0],"es":"Sant. Forsikring flytter bare penger. Man må også redusere risikoen.","ed":"Husk: forsikring + forebygging.","kt":"Adaptation: actions that help communities and ecosystems cope with a changing climate (e.g. flood defences, early warning).","src":"Bok s. 339 (11.3.3)"},{"id":"SB451","l":"L12","t":"Mitigation and adaptation","f":"m","d":4,"p":"L","sc":"none","s":"A global climate risk pool would only insure events well above the trend. Why?","o":[["A trend needs adaptation","Riktig: trend = tilpasning."],["Smaller events are illegal to insure","Feil: ingen slik lov."],["Only rich countries have extreme events","Feil: fattige land er mest utsatt."],["The pool wants to avoid paying","Feil: den skal betale for sjokk."]],"c":[0],"es":"En trend krever tilpasning, ikke forsikring.","ed":"Husk: forsikring for sjokk, ikke trend.","kt":"","src":"Bok s. 340 (Box 11.3)"},{"id":"SB452","l":"L12","t":"Environmental and liability risk","f":"m","d":3,"p":"M","sc":"none","s":"DuPont's pollution ended up costing about a billion dollars (Shapira and Zingales, 2017). What do internal documents show?","o":[["Regulators caught it at once","Feil: kontrollen feilet."],["It was an accident","Feil: det var ikke uhell."],["Its insurers forced it to pollute","Feil: forsikring spilte ingen rolle."],["Low risk of being caught","Riktig: lav risiko for å bli tatt."]],"c":[3],"es":"DuPont visste at risikoen for å bli tatt var lav.","ed":"Husk: informasjonsovertak.","kt":"","src":"Bok s. 327 (11.2.1) · Bok s. 328 (11.2.1) · Bok s. 329 (11.2.3)"},{"id":"SB453","l":"L12","t":"Social issues in insurance","f":"t","d":2,"p":"L","sc":"none","s":"True or false: AIA Vitality rewards clients for healthy living, which can improve their health and lower the insurer's costs.","o":[["True","Riktig. Sunnere kunder gir færre krav, så både kunde og forsikring vinner."],["False","Feil. Sunnere kunder gir færre krav, så både kunde og forsikring vinner."]],"c":[0],"es":"Sant. Sunnere kunder gir lavere kostnader.","ed":"Husk: win-win.","kt":"","src":"Bok s. 328 (11.2.2)"},{"id":"SB454","l":"L12","t":"Principles for Sustainable Insurance","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An insurer that has signed the PSI is asked to insure a new coal mine. Which response fits PSI principle 1?","o":[["Refuse all mining firms","Feil: ingen generelle forbud."],["Insure it with no extra checks","Feil: ESG må vurderes."],["Insure it in secret","Feil: PSI krever åpenhet."],["Assess its ESG risks","Riktig: vurder ESG."]],"c":[3],"es":"PSI prinsipp 1: vurder ESG-risiko.","ed":"Husk: PSI = ESG i forsikring.","kt":"Underwriting: assessing and pricing the risk of a client or project, and deciding whether to insure it.","src":"L12 slide 24"},{"id":"SB455","l":"L12","t":"Insurance regulation","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about EU insurance rules since August 2022 is correct?","o":[["The IDD sets capital rules","Feil: kapital er Solvency II."],["Solvency II bans fossil fuel shares","Feil: ingen slikt forbud."],["Solvency II was replaced","Feil: Solvency II gjelder."],["IDD: sustainability in advice","Riktig: IDD gjelder rådgivning."]],"c":[3],"es":"IDD: bærekraft skal inn i rådgivningen.","ed":"Husk: IDD = salg. Solvency II = kapital.","kt":"","src":"L12 slide 25 · L7 slide 20"},{"id":"SB456","l":"L12","t":"Microinsurance","f":"m","d":2,"p":"M","sc":"none","s":"How does microinsurance help poor people avoid the poverty trap?","o":[["It guarantees a fixed monthly income","Feil: det betaler ved hendelser."],["It is always very profitable","Feil: vanskelig å gjøre lønnsomt."],["It gives large loans","Feil: det er microcredit."],["Small premiums replace big shocks","Riktig: små premier."]],"c":[3],"es":"Små premier erstatter store sjokk.","ed":"Husk: microinsurance = små beløp, stor beskyttelse.","kt":"","src":"L12 slide 27 · Bok s. 340 (11.4) · Bok s. 341 (11.4)"},{"id":"SB457","l":"L12","t":"Microinsurance","f":"m","d":3,"p":"L","sc":"none","s":"What is the \"partner-agent model\" of microinsurance?","o":[["An insurer designs, a partner sells","Riktig: designer + selger."],["The government sells it","Feil: ikke modellen."],["A reinsurer lends money to clients","Feil: ikke modellen."],["Clients insure each other","Feil: det er uformell gjensidig forsikring."]],"c":[0],"es":"Forsikringen lager produktet, en lokal partner selger.","ed":"Husk: kompetanse + lokal tilgang.","kt":"","src":"Bok s. 341 (11.4.1) · Bok s. 342 (11.4.1) · Bok s. 343 (11.4.2)"},{"id":"SB458","l":"L12","t":"Microinsurance","f":"m","d":4,"p":"M","sc":"short","s":"A Kenyan farmer has rainfall insurance that pays when a weather station 40 km away records too little rain. What risk does he face?","o":[["Interest rate risk","Feil: ikke relevant."],["Basis risk","Riktig: basis risk."],["Moral hazard","Feil: indeks begrenser moral hazard."],["Liquidity risk","Feil: ikke problemet."]],"c":[1],"es":"Målestasjonen er 40 km unna, så den kan bomme = basis risk.","ed":"Husk: basis risk = indeks ≠ faktisk tap.","kt":"","src":"Bok s. 343 (Box 11.4) · Bok s. 342 (11.4.1)"},{"id":"SB459","l":"L12","t":"Measuring disaster impact","f":"t","d":4,"p":"L","sc":"none","s":"True or false: Noy's (2016) life years index values lives equally across countries and scales money losses by income, so a dollar lost in a poor country counts more.","o":[["True","Riktig. Indeksen deler tap på inntekt, så tap i fattige land veier mer."],["False","Feil. Indeksen deler tap på inntekt, så tap i fattige land veier mer."]],"c":[0],"es":"Sant. En dollar tapt i et fattig land teller mer.","ed":"Husk: tap / inntekt.","kt":"","src":"Bok s. 321 (Box 11.1) · Bok s. 321 (11.1.2.1)"},{"id":"SB460","l":"L12","t":"Insurance synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A Nordic insurer sells home insurance in flood-prone coastal areas and owns many bonds in coastal property firms. What is the best assessment?","o":[["Cat bonds cover everything","Feil: cat bonds dekker bare deler."],["Yearly repricing removes the risk","Feil: reprising løser ikke alt."],["Only claims matter","Feil: obligasjonene har også risiko."],["Both claims and investments","Riktig: både krav og investeringer."]],"c":[3],"es":"Risikoen rammer både krav og investeringer.","ed":"Husk: begge sider av balansen.","kt":"","src":"L12 slide 8 · L12 slide 10 · L12 slide 13-18 · L12 slide 25 · Bok s. 337 (11.3.2.1)"},{"id":"SB461","l":"L12","t":"Sustainability risks in insurance","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Gatzert et al. (2020) conclude that climate change is the only sustainability risk that matters for insurers.","o":[["True","Feil. De sier klima er viktig, men langt fra den eneste faktoren."],["False","Riktig. De sier klima er viktig, men langt fra den eneste faktoren."]],"c":[1],"es":"Usant. Klima er viktig, men ikke den eneste risikoen.","ed":"Husk: også andre ESG-risikoer.","kt":"","src":"L12 slide 20 · Bok s. 325 (11.2)"},{"id":"SB462","l":"L12","t":"Catastrophe losses","f":"m","d":4,"p":"M","sc":"short","s":"Insured disaster losses have risen for decades. An analyst blames it all on climate change. What is missing?","o":[["Less insurance in rich countries","Feil: rike land har mer forsikring."],["Falling coastal property values","Feil: verdiene har økt."],["More assets in risky places","Riktig: mer eksponering."],["Nothing","Feil: eksponering mangler."]],"c":[2],"es":"Flere verdier i utsatte områder øker tapene.","ed":"Husk: tap = hazard × exposure × vulnerability.","kt":"Catastrophe model components: hazard, vulnerability, exposure, financial loss, platform.","src":"Bok s. 322 (Figure 11.3) · Bok s. 326 (Box 11.2) · L12 slide 15"},{"id":"TR54","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Climate claims rise much faster than the insurer expected, and premiums were too low. Who takes the loss first?","o":[["The central bank","Feil: ingen automatisk garanti."],["The customers","Feil: kundene er ikke ansvarlige."],["Nobody","Feil: noen må ta tapet."],["The shareholders","Riktig: aksjonærene."]],"c":[3],"es":"Eierne tar tapet først.","ed":"Husk: egenkapital dekker uventede tap.","kt":"","src":"Opptak L11 ca. 58 min · Opptak L12 ca. 13 min · Opptak L12 ca. 35 min"},{"id":"TR55","l":"L12","t":"Insurance innovation","f":"m","d":3,"p":"H","sc":"short","s":"In 2024 Hurricane Beryl hit Jamaica hard, but just missed the trigger of its parametric insurance, so nothing was paid. What does this show?","o":[["It has basis risk","Riktig: basis risk."],["It removes all risk","Feil: basis risk finnes."],["It pays only after a damage check","Feil: den betaler automatisk."],["It always pays more than the loss","Feil: den kan betale ingenting."]],"c":[0],"es":"Indeksen ble ikke utløst selv om skaden var stor = basis risk.","ed":"Husk: parametric = betaler etter indeks.","kt":"Parametric insurance: pays a preset amount when an objective measure (wind speed, rainfall, temperature) crosses a threshold.","src":"Opptak L12 ca. 27 min · Opptak L12 ca. 37 min"},{"id":"TR56","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"M","sc":"none","s":"Some insurers stop insuring coal companies. What concern does the lecturer raise?","o":[["Coal firms have no risk","Feil: de har risiko."],["Insurers must insure everyone","Feil: forsikringer kan velge."],["Exclusion always raises profits","Feil: profitt er ikke bekymringen."],["Insurers lose influence","Riktig: mister innflytelse."]],"c":[3],"es":"Ved å utelukke mister forsikringen innflytelse.","ed":"Husk: som washing machine-argumentet.","kt":"","src":"Opptak L11 ca. 52 min"},{"id":"TR57","l":"L12","t":"Reinsurance","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Since insurers can buy reinsurance, climate disasters cannot create systemic risk in insurance.","o":[["True","Feil. Reforsikring lager et nettverk, så et stort fall kan spre seg som dominobrikker."],["False","Riktig. Reforsikring lager et nettverk, så et stort fall kan spre seg som dominobrikker."]],"c":[1],"es":"Usant. Reforsikring knytter selskapene sammen, så tap kan spre seg.","ed":"Husk: nettverk = systemrisiko.","kt":"","src":"Opptak L12 ca. 31 min · Opptak L12 ca. 32 min"},{"id":"TR58","l":"L12","t":"EU regulation","f":"t","d":2,"p":"H","sc":"none","s":"True or false: The EU Taxonomy classifies whole companies as sustainable or not.","o":[["True","Feil. Taxonomy vurderer aktiviteter, ikke hele firmaer."],["False","Riktig. Taxonomy vurderer aktiviteter, ikke hele firmaer."]],"c":[1],"es":"Usant. Taxonomy klassifiserer aktiviteter, ikke hele selskaper.","ed":"Husk: activity, ikke entity.","kt":"","src":"Opptak L12 ca. 44 min"},{"id":"TR59","l":"L12","t":"Insurance basics","f":"m","d":2,"p":"L","sc":"none","s":"What does D&O (directors and officers) insurance cover?","o":[["Damage to buildings","Feil: det er eiendomsforsikring."],["Bondholders against default","Feil: det er kredittforsikring."],["Directors' legal costs","Riktig: ledernes juridiske kostnader."],["Employees' pensions","Feil: det er pensjon."]],"c":[2],"es":"D&O dekker styremedlemmers og lederes juridiske kostnader.","ed":"Husk: directors and officers.","kt":"","src":"Opptak L11 ca. 56 min · Opptak L4 ca. 41 min"},{"id":"SB463","l":"GUEST","t":"Folketrygdfondet","f":"m","d":1,"p":"M","sc":"none","s":"What is the overall goal of Folketrygdfondet's management of the Government Pension Fund Norway?","o":[["Maximum SDG impact, even with lower returns","Feil: impact er ikke hovedmålet."],["Copying the Oslo index exactly","Feil: mandatet er aktivt."],["Supporting Norwegian jobs","Feil: industripolitikk er ikke med."],["The highest return within risk limits","Riktig: høyest avkastning innen risiko."]],"c":[3],"es":"Folketrygdfondet skal gi høyest mulig avkastning innenfor risikorammene.","ed":"Husk: ansvarlig eierskap støtter langsiktig avkastning.","kt":"","src":"Folketrygdfondet s. 3 · Folketrygdfondet s. 5 · Folketrygdfondet s. 10 · Folketrygdfondet s. 18"},{"id":"SB464","l":"GUEST","t":"Folketrygdfondet","f":"m","d":2,"p":"M","sc":"none","s":"Which is one of Folketrygdfondet's six active ownership tools?","o":[["Nomination committees","Riktig: valgkomiteer."],["Buying ESG derivatives","Feil: ikke et verktøy."],["Short-selling weak ESG firms","Feil: shorting er ikke med."],["Appointing its own CEOs","Feil: de sitter i valgkomiteer."]],"c":[0],"es":"Valgkomiteer er ett av de seks eierskapsverktøyene.","ed":"Husk: forventninger, dialog, stemmer, valgkomiteer, utelukkelse, kontakt.","kt":"","src":"Folketrygdfondet s. 18 · Folketrygdfondet s. 21 · Folketrygdfondet s. 24"},{"id":"SB465","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Folketrygdfondet is a top-three owner in 52 Norwegian firms and sits on 16 nomination committees. Why does this give it more influence than NBIM has?","o":[["It only buys bonds","Feil: de eier mye aksjer."],["It has veto rights by law","Feil: ingen vetorett."],["It invests passively","Feil: de er aktive."],["Bigger stakes and nomination roles","Riktig: store andeler og valgkomiteer."]],"c":[3],"es":"Store eierandeler og plass i valgkomiteer gir mer påvirkning.","ed":"Husk: konsentrert eierskap = troverdig engagement.","kt":"Nomination committee: a shareholder-elected committee that proposes board members, common in Norway.","src":"Folketrygdfondet s. 21 · Folketrygdfondet s. 24 · Bok s. 186 (Box 7.1)"},{"id":"SB466","l":"GUEST","t":"Folketrygdfondet","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A survey shows that Norwegian practitioners adjust for weak environmental performance only through the discount rate, never through cash flows.","o":[["True","Feil. Undersøkelsen viser justeringer både i kontantstrøm og diskonteringsrente."],["False","Riktig. Undersøkelsen viser justeringer både i kontantstrøm og diskonteringsrente."]],"c":[1],"es":"Usant. De justerer både i kontantstrøm, rente, begge, eller ingen.","ed":"Husk: ingen enkelt metode.","kt":"","src":"Folketrygdfondet s. 16 · L9 slide 3"},{"id":"SB467","l":"GUEST","t":"Folketrygdfondet","f":"m","d":2,"p":"H","sc":"none","s":"Folketrygdfondet calls materiality a \"prerequisite for financial value creation\". What evidence does it cite?","o":[["Firms ignoring ESG earn the most","Feil: det er motsatt."],["The highest ESG scores always win","Feil: poenget er materialitet."],["Immaterial ESG drives growth","Feil: immaterielle tiltak gir ikke meravkastning."],["Material ESG investment pays","Riktig: material ESG lønner seg."]],"c":[3],"es":"Investering i material ESG lønner seg.","ed":"Husk: Khan, Serafeim og Yoon.","kt":"","src":"Folketrygdfondet s. 15 · L6 slide 52"},{"id":"SB468","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"M","sc":"none","s":"Folketrygdfondet asks \"The end of ESG?\" and quotes: \"Considering long-term factors when valuing a company isn't ESG investing; it's investing.\" What does this mean?","o":[["Stop thinking about sustainability","Feil: poenget er integrering."],["ESG is part of normal analysis","Riktig: del av vanlig analyse."],["Only ESG funds should think long-term","Feil: alle bør tenke langsiktig."],["Leave ESG to rating agencies","Feil: analysen skal gjøres selv."]],"c":[1],"es":"ESG er en vanlig del av analysen, ikke en egen merkelapp.","ed":"Husk: \"it's investing\".","kt":"","src":"Folketrygdfondet s. 26 · Folketrygdfondet s. 27"},{"id":"SB469","l":"GUEST","t":"Folketrygdfondet","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Folketrygdfondet's expectations to companies cover only climate, since climate is the only material ESG topic for Norwegian firms.","o":[["True","Feil. Forventningene dekker mye mer enn klima, f.eks. korrupsjon og menneskerettigheter."],["False","Riktig. Forventningene dekker mye mer enn klima, f.eks. korrupsjon og menneskerettigheter."]],"c":[1],"es":"Usant. Forventningene dekker også korrupsjon, menneskerettigheter, natur osv.","ed":"Husk: mer enn klima.","kt":"","src":"Folketrygdfondet s. 19"},{"id":"SB470","l":"GUEST","t":"Fondsfinans","f":"m","d":2,"p":"H","sc":"none","s":"How does Melanie Brooks (Fondsfinans) separate \"ESG\" from \"sustainability\"?","o":[["ESG is product impact; sustainability is governance","Feil: definisjonene er snudd."],["ESG: how it runs; sustainability: what it sells","Riktig: drift vs produkt."],["Sustainability is relative; ESG is absolute","Feil: ESG er ofte relativt."],["They mean the same","Feil: de er ikke det samme."]],"c":[1],"es":"ESG = hvordan firmaet drives. Sustainability = hva firmaet selger.","ed":"Husk: alle firmaer har ESG, ikke alle er bærekraftige.","kt":"","src":"Fondsfinans s. 6 · Bok s. 212 (Table 8.1)"},{"id":"SB471","l":"GUEST","t":"Fondsfinans","f":"m","d":2,"p":"M","sc":"none","s":"Brooks describes a move from \"greenwashing\" to \"greenwishing\" and \"greenhushing\". Greenhushing means:","o":[["Firms say less","Riktig: sier mindre."],["Firms exaggerate green claims","Feil: det er greenwashing."],["Regulators ban green claims","Feil: det er en atferd hos firmaer."],["Firms set unrealistic goals","Feil: det er greenwishing."]],"c":[0],"es":"Greenhushing = firmaer sier mindre for å unngå kritikk.","ed":"Husk: washing = overdrive, wishing = urealistisk, hushing = stille.","kt":"","src":"Fondsfinans s. 9 · Fondsfinans s. 10 · L8 slide 26"},{"id":"SB472","l":"GUEST","t":"Fondsfinans","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: A manager whose mandate requires ESG integration but who ignores material ESG risks can face outflows, reputation damage and legal trouble, even with good returns.","o":[["True","Riktig. Brudd på mandatet kan gi uttak, omdømmetap og juridiske problemer."],["False","Feil. Brudd på mandatet kan gi uttak, omdømmetap og juridiske problemer."]],"c":[0],"es":"Sant. Å bryte mandatet gir risiko selv med god avkastning.","ed":"Husk: mandatet må følges.","kt":"Investment mandate: the contract setting the objectives, constraints and requirements an asset manager must follow for a client.","src":"Fondsfinans s. 12"},{"id":"SB473","l":"GUEST","t":"Fondsfinans","f":"t","d":3,"p":"M","sc":"none","s":"True or false: According to NBIM (quoted by Brooks), risk-based divestments since 2012 have cut equity returns by several percentage points.","o":[["True","Feil. NBIM rapporterer at salgene økte avkastningen, ikke senket den."],["False","Riktig. NBIM rapporterer at salgene økte avkastningen, ikke senket den."]],"c":[1],"es":"Usant. Risikobasert salg ØKTE avkastningen litt.","ed":"Husk: +0,64 prosentpoeng totalt.","kt":"","src":"Fondsfinans s. 15 · L9 slide 33"},{"id":"SB474","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"H","sc":"none","s":"Which weakness of \"off the shelf\" ESG ratings does Brooks highlight (\"Aggregate Confusion\")?","o":[["They favour small emerging market firms","Feil: de favoriserer store firmaer."],["They are audited and forward-looking","Feil: data er selvrapportert og bakoverskuende."],["They measure real outcomes precisely","Feil: koblingen er svak."],["Different providers disagree a lot","Riktig: stor uenighet."]],"c":[3],"es":"Ulike leverandører er svært uenige.","ed":"Husk: Aggregate Confusion.","kt":"","src":"Fondsfinans s. 16 · Fondsfinans s. 17 · L7 slide 37"},{"id":"SB475","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"H","sc":"short","s":"A chip maker uses lots of water in a drought area. Its water use harms local farmers today, and water shortages could stop its production later. Which concept fits?","o":[["Accounting materiality","Feil: ignorerer samfunnet."],["Not material","Feil: det er material."],["Only financial materiality","Feil: impact er også med."],["Double and dynamic","Riktig: double og dynamic."]],"c":[3],"es":"Påvirker både samfunnet og firmaet, og endrer seg over tid = double og dynamic.","ed":"Husk: double = begge veier. Dynamic = over tid.","kt":"","src":"Fondsfinans s. 19 · Fondsfinans s. 20 · L6 slide 53"},{"id":"SB476","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"M","sc":"none","s":"Which question should you ask before choosing active ownership as an ESG approach (Brooks)?","o":[["Can engagement replace knowledge of the firm?","Feil: krever kunnskap."],["Information or change?","Riktig: informasjon eller endring."],["Can you avoid managers?","Feil: tilgang til ledelsen trengs."],["Is the issue immaterial?","Feil: fokuser på material issues."]],"c":[1],"es":"Spør: vil du ha informasjon eller endring?","ed":"Husk: mål avgjør verktøy.","kt":"","src":"Fondsfinans s. 24 · Fondsfinans s. 22"},{"id":"SB477","l":"GUEST","t":"Fondsfinans","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Brooks says there is no one-size-fits-all ESG approach; investors should start by asking what they want to achieve and what resources they have.","o":[["True","Riktig. Brooks sier man må starte med mål og ressurser."],["False","Feil. Brooks sier man må starte med mål og ressurser."]],"c":[0],"es":"Sant. Start med hva du vil oppnå og hvilke ressurser du har.","ed":"Husk: no one-size-fits-all.","kt":"","src":"Fondsfinans s. 21 · L9 slide 29"},{"id":"SB478","l":"GUEST","t":"PwC","f":"m","d":2,"p":"H","sc":"none","s":"According to PwC, which principle decides what firms report under the CSRD and ESRS?","o":[["Only emissions","Feil: dekker E, S og G."],["Double materiality","Riktig: double materiality."],["Only financial materiality","Feil: impact er også med."],["Any framework the firm likes","Feil: ESRS er obligatorisk."]],"c":[1],"es":"CSRD bruker double materiality.","ed":"Husk: impacts, risks, opportunities (IROs).","kt":"","src":"PwC s. 29 · PwC s. 32"},{"id":"SB479","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"short","s":"94% of investors think corporate reports contain unsupported sustainability claims. Which CSRD feature addresses this most directly?","o":[["Only photos and stories","Feil: det er problemet."],["Free choice of framework","Feil: reduserer sammenlignbarhet."],["Mandatory external assurance","Riktig: ekstern assurance."],["No reporting for large firms","Feil: gir mindre info."]],"c":[2],"es":"Obligatorisk ekstern revisjon (assurance) gir tillit.","ed":"Husk: assurance = sjekk av påstander.","kt":"Assurance: independent third-party verification of reported information (limited or reasonable assurance).","src":"PwC s. 30 · PwC s. 38 · PwC s. 46"},{"id":"SB480","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"short","s":"The EU Omnibus package cuts the number of firms that must report under the CSRD. What is the trade-off for investors and banks?","o":[["No trade-off","Feil: det er en trade-off."],["It bans voluntary reporting","Feil: frivillig rapportering er lov."],["It raises costs for all firms","Feil: målet er lavere kostnader."],["Lower costs, less reliable data","Riktig: billigere, men dårligere data."]],"c":[3],"es":"Lavere kostnader, men mindre pålitelige data.","ed":"Husk: trade-off.","kt":"CSRD scope: the set of companies legally required to publish sustainability statements under ESRS.","src":"PwC s. 40 · PwC s. 41 · L11 slide 31"},{"id":"SB481","l":"GUEST","t":"PwC","f":"t","d":2,"p":"L","sc":"none","s":"True or false: PwC says sustainability reporting has a lower risk of errors than financial reporting, because its data come from mature IT systems.","o":[["True","Feil. Prosessene er umodne, så risikoen for feil er større."],["False","Riktig. Prosessene er umodne, så risikoen for feil er større."]],"c":[1],"es":"Usant. Bærekraftsdata har HØYERE risiko for feil, pga. umodne systemer.","ed":"Husk: manuelle regneark.","kt":"","src":"PwC s. 46 · PwC s. 47"},{"id":"SB482","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"none","s":"PwC says \"It's really not about the reporting...\" What is the main message?","o":[["Reports have no value","Feil: rapportering kan gi verdi."],["Reporting should support strategy","Riktig: støtte strategien."],["Only compliance matters","Feil: compliance er minimum."],["Keep sustainability out of strategy","Feil: bærekraft skal i strategien."]],"c":[1],"es":"Rapporteringen skal støtte strategien.","ed":"Husk: design → make it real → report.","kt":"","src":"PwC s. 13 · PwC s. 23 · PwC s. 24 · PwC s. 27"},{"id":"SB483","l":"GUEST","t":"PwC","f":"m","d":3,"p":"L","sc":"none","s":"Which statement does PwC call a climate MYTH?","o":[["\"Impacts can come through operations and supply chains\"","Feil: det er et faktum."],["\"Disaster losses were about $417bn in 2024\"","Feil: det er et faktum."],["\"A firm's carbon footprint decides its physical risk\"","Riktig: det er myten."],["\"Physical impacts will worsen for decades anyway\"","Feil: det er et faktum."]],"c":[2],"es":"Myten er at karbonavtrykket bestemmer physical risk.","ed":"Husk: physical risk avhenger av sted, ikke utslipp.","kt":"","src":"PwC s. 16 · Bok s. 223 (8.2.2)"},{"id":"SB484","l":"GUEST","t":"Guest lectures synthesis","f":"m","d":4,"p":"H","sc":"none","s":"What is the common thread across the Folketrygdfondet, Fondsfinans and PwC guest lectures?","o":[["ESG always beats the market","Feil: de advarer mot det."],["Material ESG beats labels","Riktig: material ESG > merkelapper."],["Reporting is just compliance","Feil: PwC sier det motsatte."],["ESG ratings are enough for decisions","Feil: ratinger har svakheter."]],"c":[1],"es":"Material ESG betyr mer enn merkelapper.","ed":"Husk: materialitet, integrering, datakvalitet.","kt":"","src":"Folketrygdfondet s. 26 · Fondsfinans s. 16 · Fondsfinans s. 21 · PwC s. 13"},{"id":"SB485","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A fund owns a solar equipment maker accused of forced labour in its supply chain. What should the manager do first (Brooks)?","o":[["Sell at once","Feil: salg velges etter vurdering."],["Praise the firm publicly","Feil: ikke risikostyring."],["Ignore it","Feil: grønt produkt fjerner ikke S-risiko."],["Assess how material it is","Riktig: vurder materialitet."]],"c":[3],"es":"Først: vurder hvor material saken er.","ed":"Husk: vurder, så velg: gjør ingenting, selg eller engasjer.","kt":"Desired outcome: what the investor wants to achieve - reduce financial risk, reduce reputational risk, or \"make a difference\" (MAD).","src":"Fondsfinans s. 23 · Fondsfinans s. 24"},{"id":"SB486","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"L","sc":"short","s":"Folketrygdfondet has beaten its benchmark over many years. Why does the long-run result matter more than one year for judging its ESG strategy?","o":[["One year proves skill","Feil: ett år er for kort."],["Change the benchmark every year","Feil: stabil benchmark gir sammenligning."],["One year is just noise","Riktig: ett år er støy."],["Excess returns do not matter","Feil: meravkastning er nøkkelen."]],"c":[2],"es":"Ett år er bare støy. Lang tid skiller ferdighet fra flaks.","ed":"Husk: skill vs luck.","kt":"Excess return (active return): portfolio return minus benchmark return.","src":"Folketrygdfondet s. 8 · Folketrygdfondet s. 11 · Bok s. 195 (7.3.5)"},{"id":"EX02","l":"L13","t":"Exam sample: backcasting","f":"t","d":2,"p":"H","sc":"none","s":"Does backcasting start from a desired future end-state and work backwards to define the pathway?","o":[["Yes","Riktig. Backcasting starter med målet (f.eks. netto null i 2050) og jobber bakover for å finne stegene dit."],["No","Feil. Backcasting starter med målet (f.eks. netto null i 2050) og jobber bakover for å finne stegene dit."]],"c":[0],"es":"Ja: start i ønsket fremtid, jobb bakover.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- Forecasting: start i dag og spå hva som skjer.\n- Backcasting: bestem hvor du vil være, og planlegg bakover hva som må skje.\nBackcasting er et verktøy i transition management (forelesning 13).","kt":"Backcasting: planlegging bakover fra et ønsket fremtidig mål.","src":"L13 slide 13-16 · Bok s. 354 (12.1.1) · Bok s. 359 (12.2) · Bok s. 361 (12.3)","k":1,"x":1},{"id":"CX097","l":"L13","t":"Coalitions","f":"m","d":2,"p":"H","sc":"none","s":"According to Ostrom, a coalition that governs a common resource well needs:","o":[["Monitoring and sanctions","Uten kontroll og konsekvenser blir det free riding."],["Full government ownership","Ostrom viser nettopp at fellesskap kan styre uten staten."],["No formal rules","Ostrom vektlegger klare regler."],["As many members as possible","Store koalisjoner er ofte mindre ambisiøse."]],"c":[0],"es":"Monitoring + sanctions mot free riding.","ed":"Ostroms prinsipper: klare grenser, medlemsregler, felles beslutninger, overvåking, sanksjoner, konfliktløsning. Mange klimakoalisjoner mangler håndheving.","kt":"","src":"L13 slide 6-7 · Bok s. 111 (4.3.1) · Bok s. 112 (Table 4.3) · Bok s. 113 (4.3.1)","k":1},{"id":"CX098","l":"L13","t":"Coalitions","f":"m","d":2,"p":"H","sc":"none","s":"In sustainable finance coalitions, size and ambition are related in that:","o":[["Larger ones tend to be less ambitious","Mange medlemmer krever lette krav."],["Only small ones have principles","Store koalisjoner har også prinsipper, bare svakere."],["Size and ambition are unrelated","Boka finner en tydelig sammenheng."],["Larger ones are more ambitious","Det er motsatt."]],"c":[0],"es":"Stor koalisjon = lavere ambisjon.","ed":"For å få med mange medlemmer må kravene være lette. GIIN og GABV er ambisiøse, men små.","kt":"","src":"L13 slide 3-9 · Bok s. 113 (4.3.1)","k":1},{"id":"CX099","l":"L13","t":"Role of players","f":"t","d":2,"p":"H","sc":"none","s":"Do short election cycles make it harder for governments to pursue long-term climate goals?","o":[["Yes","Riktig. Politikere må vinne valg om få år, mens klimatiltak virker over tiår."],["No","Feil. Politikere må vinne valg om få år, mens klimatiltak virker over tiår."]],"c":[0],"es":"Ja: valgsykluser = kort horisont.","ed":"Ligner tragedy of the horizon: kostnadene merkes nå, gevinstene kommer senere. Derfor trengs også investorer, banker og koalisjoner.","kt":"","src":"L13 slide 8-9 · Bok s. 84 (Table 3.1)","k":1},{"id":"CX100","l":"L13","t":"Government policy","f":"m","d":2,"p":"H","sc":"none","s":"The 'green premium' is:","o":[["The extra cost of going green","F.eks. at grønt stål koster 25 % mer enn vanlig stål."],["The lower yield on green bonds","Det er greenium, ikke green premium."],["A tax on fossil fuels","En karbonavgift kan krympe green premium, men er ikke det samme."],["A subsidy paid to green producers","Det er en subsidie."]],"c":[0],"es":"Green premium = merkostnad ved det grønne. Greenium = lavere yield på grønne obligasjoner.","ed":"En gradvis høyere karbonpris gjør det fossile dyrere og krymper green premium. Det kalles å 'level the playing field'.","kt":"","src":"L13 slide 11-12 · L3 slide 19","k":1},{"id":"CX101","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"none","s":"One motive for joining a sustainability coalition is:","o":[["Members no longer report emissions","Rapporteringsplikten gjelder fortsatt."],["Higher success in joint engagement","Når investorer engasjerer sammen, lykkes de oftere."],["Members are exempt from regulation","Medlemskap gir ikke unntak fra lover."],["Members pay lower corporate taxes","Medlemskap gir ingen skattefordel."]],"c":[1],"es":"Collective engagement er ett av seks motiver.","ed":"Seks motiver (slide 4):\n- Collective advocacy: lobbe sammen overfor myndighetene.\n- Reputation: bli sett som en leder.\n- Peer effect: konkurrentene er med.\n- Outside pressure: press fra kunder, investorer, NGO-er.\n- Risk avoidance: unngå stranded assets.\n- Collective engagement: høyere suksessrate i engagement.","kt":"","src":"L13 slide 4","k":1},{"id":"CX102","l":"L13","t":"Coordinated engagement","f":"m","d":2,"p":"H","sc":"none","s":"Dimson, Karakaş and Li (2020) find that an effective engagement strategy is:","o":[["Leaving dialogue to proxy advisors","Det er ikke strategien de studerer."],["Selling the shares before engaging","Da mister du stemmen din."],["Each investor engaging alone in secret","Studien handler nettopp om samarbeid."],["Lead investor plus supporters","To nivåer: én leder dialogen, de andre støtter."]],"c":[3],"es":"Lead investor + supporting investors = effektiv coordinated engagement.","ed":"Lead-rollen tas oftest av en investor med stor eierandel i et hjemlandsselskap. Suksessen er høyest når lederen er innenlandsk og støttespillerne er internasjonale.","kt":"","src":"L13 slide 5","k":1},{"id":"CX103","l":"L13","t":"Why government policies matter","f":"t","d":2,"p":"H","sc":"none","s":"Is a lack of information, trained staff or incentives an example of a non-market barrier to decarbonisation?","o":[["Yes","Riktig. Det er barrierer som ikke handler om pris, og der riktig politikk kan gjøre stor forskjell."],["No","Feil. Det er barrierer som ikke handler om pris, og der riktig politikk kan gjøre stor forskjell."]],"c":[0],"es":"Ja: non-market barriers.","ed":"Foreleserens liste over hvorfor politikk betyr noe: mind the investment gap, level the playing field, overcome non-market barriers, stay up to date, plan for a just transition, do the hard stuff too, work on technology, policy and markets at the same time.","kt":"","src":"L13 slide 11","k":1},{"id":"CX104","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"The three levers that must be pulled at the same time to get to zero are:","o":[["Equity, bonds and loans","Det er finansieringsformer."],["Environment, social and governance","Det er ESG, ikke de tre spakene."],["Taxes, subsidies and bans","Det er bare politikkverktøy."],["Technology, policy and markets","Alle tre må dras samtidig og i samme retning."]],"c":[3],"es":"Tre spaker: technology, policy, markets.","ed":"Poenget er at én spak alene ikke er nok: ny teknologi trenger politikk (f.eks. karbonpris) og markeder som tar den i bruk.","kt":"","src":"L13 slide 11-12","k":1},{"id":"CX105","l":"L13","t":"Government policy","f":"m","d":2,"p":"H","sc":"none","s":"Planning for a 'just transition' aims to:","o":[["Delay all climate policy until 2050","Just transition handler om hvordan, ikke om å utsette."],["Make polluters pay every cost at once","Det er ikke kjernen i just transition."],["Give tax breaks to oil companies","Det er motsatt av poenget."],["Support communities hit by the shift","F.eks. kullregioner som mister arbeidsplasser."]],"c":[3],"es":"Just transition = støtte til de som rammes av omstillingen.","ed":"Staten kan gi finansiering og teknisk hjelp, og koble sammen lokalsamfunn med like problemer så de kan dele det som virker.","kt":"","src":"L13 slide 12 · PwC s. 47","k":1},{"id":"SB487","l":"L13","t":"Institutional investors","f":"m","d":3,"p":"M","sc":"short","s":"Climate Action 100+ lets hundreds of investors engage the biggest emitters together. Why are such coalitions more effective than one investor alone?","o":[["No monitoring is needed","Feil: koalisjoner trenger overvåking."],["Single investors may not engage","Feil: enkeltinvestorer kan engasjere."],["Coalitions can force firms by law","Feil: de har påvirkning, ikke lovmakt."],["Pooled ownership gives leverage","Riktig: samlet eierskap gir makt."]],"c":[3],"es":"Samlet eierskap gir mer makt overfor firmaene.","ed":"Husk: sammen = mer leverage.","kt":"Collective engagement: several investors coordinating dialogue with a company to increase their influence.","src":"L13 slide 4-5 · Bok s. 111 (4.3.1) · Bok s. 104 (Table 4.1)"},{"id":"SB488","l":"L13","t":"System approach","f":"m","d":2,"p":"H","sc":"none","s":"How does Ostrom (1990) suggest governing shared resources such as the atmosphere?","o":[["Only through taxes","Feil: hun ser forbi skatt."],["Only through private property","Feil: hun ser forbi privat eiendom."],["Self-governing groups","Riktig: selvstyrte grupper."],["By letting markets fix it","Feil: markedet gir tragedy of the commons."]],"c":[2],"es":"Ostrom: grupper som styrer seg selv, med regler og sanksjoner.","ed":"Husk: ikke bare stat eller marked.","kt":"","src":"L13 slide 3-9 · Bok s. 104 (4.2) · Bok s. 105 (4.2)"},{"id":"SB489","l":"L13","t":"System approach","f":"m","d":3,"p":"H","sc":"none","s":"McElroy's sustainability quotient is SP = actual impact / normative impact. For carbon, when is a firm sustainable?","o":[["When SP ≤ 1","Riktig:
