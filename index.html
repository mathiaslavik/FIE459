makt."],["Ignore them","Feil: alle berørte skal med."],["Keep informed only","Feil: de har høy makt etter dommen."]],"c":[0],"es":"Høy interesse og høy makt = manage closely.","ed":"Husk: høy/høy = key players.","kt":"Interest-power matrix: classifies stakeholders by how much they care (interest) and can affect the project (power) to decide how to engage them.","src":"L6 slide 45 · L6 slide 46"},{"id":"SB214","l":"L6","t":"Stakeholder impact map","f":"m","d":4,"p":"H","sc":"none","s":"When reading a stakeholder impact map, what should an analyst look for?","o":[["Only positive impacts","Feil: negative effekter er viktige."],["Only shareholders","Feil: kartet skal se forbi eierne."],["Conflicts between goals and impacts","Riktig: konflikter."],["The total number of stakeholders","Feil: innholdet teller, ikke antallet."]],"c":[2],"es":"Se etter konflikter mellom mål og påvirkning.","ed":"Husk: friksjon = fremtidige problemer.","kt":"","src":"L6 slide 46-48 · Bok s. 136 (Table 5.2) · Bok s. 137 (Table 5.3)"},{"id":"SB215","l":"L6","t":"Materiality","f":"m","d":3,"p":"H","sc":"none","s":"How do SASB and GRI define materiality differently?","o":[["SASB: investors; GRI: also society","Riktig: SASB investorer, GRI samfunn."],["SASB: society; GRI: investors only","Feil: definisjonene er snudd."],["They use the same definition","Feil: de er forskjellige."],["Both use pure accounting materiality","Feil: ingen er rent regnskapsmessig."]],"c":[0],"es":"SASB: for investorer. GRI: også for samfunnet.","ed":"Husk: SASB = single. GRI = impact.","kt":"","src":"L6 slide 50-51 · L1 slide 36 · PwC s. 29"},{"id":"SB216","l":"L6","t":"Materiality","f":"m","d":3,"p":"H","sc":"none","s":"Khan, Serafeim and Yoon (2016) find that:","o":[["Doing well on immaterial issues pays most","Feil: immaterielle issues gir dårligere resultater."],["Material issues predict higher returns","Riktig: material issues gir meravkastning."],["Sustainability has no link to returns","Feil: det finnes en sammenheng."],["All sustainability work pays off equally","Feil: material vs immaterial er nøkkelen."]],"c":[1],"es":"Godt arbeid på material issues gir høyere avkastning.","ed":"Husk: material = betyr noe for verdien.","kt":"","src":"L6 slide 52 · Bok s. 129 (5.2.3.2) · Bok s. 130 (Box 5.4) · Folketrygdfondet s. 15"},{"id":"SB217","l":"L6","t":"Materiality","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about accounting, market and business materiality is correct?","o":[["Accounting materiality covers intangible resources","Feil: accounting materiality gjelder bare eiendeler."],["Business materiality is the same as SASB's","Feil: business materiality er bredere."],["Market materiality: anything that moves the price","Riktig: det som flytter kursen."],["The three types always match","Feil: de kan avvike."]],"c":[2],"es":"Market materiality = alt som flytter prisen.","ed":"Husk: accounting (balanse), market (pris), business (verdi bredt).","kt":"","src":"Bok s. 128 (5.2.3.2) · Bok s. 129 (Figure 5.5)"},{"id":"SB218","l":"L6","t":"Materiality","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Materiality differs even within an industry; for example, an iron ore miner in Australia faces fewer labour and community issues than a gold miner in Africa.","o":[["True","Riktig. Materialitet varierer med sted og forretningsmodell, også innen samme bransje."],["False","Feil. Materialitet varierer med sted og forretningsmodell, også innen samme bransje."]],"c":[0],"es":"Sant. Materialitet avhenger av bransje, modell og sted.","ed":"Husk: samme bransje kan ha ulike issues.","kt":"","src":"Bok s. 134 (5.3) · L6 slide 51"},{"id":"SB219","l":"L6","t":"Materiality matrix","f":"m","d":2,"p":"M","sc":"none","s":"What do the two axes of a typical materiality matrix show?","o":[["Stakeholder importance vs firm impact","Riktig: stakeholder vs firma."],["Share price vs book value","Feil: dette er verdsettelse."],["Default probability vs loss given default","Feil: dette er kredittrisiko."],["Revenue growth vs margin","Feil: dette er value drivers."]],"c":[0],"es":"Aksene: viktighet for stakeholders mot påvirkning på firmaet.","ed":"Husk: to akser, begge perspektiver.","kt":"","src":"L6 slide 55 · Bok s. 130 (Figure 5.6) · Bok s. 136 (5.3.5)"},{"id":"SB220","l":"L6","t":"Materiality","f":"m","d":4,"p":"M","sc":"none","s":"The main idea of Rogers and Serafeim's \"Pathways to Materiality\" is that:","o":[["Materiality is fixed by accounting rules","Feil: det endrer seg over tid."],["Only governance issues can be material","Feil: E og S er sentrale."],["Immaterial issues stay immaterial","Feil: artikkelen sier det motsatte."],["Issues can become material over time","Riktig: issues blir material over tid."]],"c":[3],"es":"Issues kan bli material over tid.","ed":"Husk: dynamic materiality.","kt":"","src":"L6 slide 53 · Fondsfinans s. 19 · L3 slide 17"},{"id":"SB221","l":"L6","t":"Materiality","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An analyst uses the SDGs to screen a fertiliser maker like Yara. Which link is most relevant?","o":[["SDG 16 (peace and justice)","Feil: ikke det mest relevante."],["SDG 4 (quality education)","Feil: utdanning er ikke kjernen."],["SDG 14 (life below water) is irrelevant","Feil: avrenning kan forurense vann."],["SDG 2 (zero hunger)","Riktig: gjødsel støtter matproduksjon."]],"c":[3],"es":"Gjødsel gir mer mat = SDG 2 (zero hunger).","ed":"Husk: koble SDG til kjernevirksomheten.","kt":"SDG exposure: whether a company's products and operations help (positive) or hinder (negative) progress on specific SDGs.","src":"L6 slide 54 · L6 slide 72"},{"id":"SB222","l":"L6","t":"Business sustainability typology","f":"m","d":3,"p":"M","sc":"none","s":"In Dyllick and Muff's typology, business sustainability 3.0:","o":[["uses the triple bottom line, still inside-out","Feil: det er BS 2.0."],["focuses on shareholder value","Feil: det er business as usual."],["maximises refined shareholder value","Feil: det er BS 1.0."],["starts from society's challenges (outside-in)","Riktig: outside-in."]],"c":[3],"es":"BS 3.0 starter med samfunnets problemer (outside-in).","ed":"Husk: 1.0 = refined shareholder, 2.0 = triple bottom line, 3.0 = outside-in.","kt":"","src":"Bok s. 118 (5.1) · Bok s. 119 (Table 5.1)"},{"id":"SB223","l":"L6","t":"Transformational change","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Boards should be diverse to avoid groupthink, which may help move the firm from an inside-out to an outside-in view.","o":[["True","Riktig. Mangfold i styret hindrer groupthink og hjelper firmaet å se utenfra."],["False","Feil. Mangfold i styret hindrer groupthink og hjelper firmaet å se utenfra."]],"c":[0],"es":"Sant. Mangfold i styret hindrer groupthink.","ed":"Husk: diversity → outside-in.","kt":"","src":"Bok s. 118 (5.1) · Bok s. 119 (5.1) · L5 slide 19"},{"id":"SB224","l":"L6","t":"Material ESG issues","f":"m","d":2,"p":"M","sc":"none","s":"Which issue is correctly classified?","o":[["Supply chains and innovation - other","Riktig: \"other\"."],["Emissions and water use - governance","Feil: utslipp og vann er E."],["Ownership and voting rules - environmental","Feil: eierskap er G."],["Worker safety - environmental","Feil: sikkerhet er S."]],"c":[0],"es":"Leverandørkjeder og innovasjon havner under \"other\".","ed":"Husk: emissions = E, safety = S, eierskap = G.","kt":"","src":"Bok s. 134 (5.3) · Bok s. 135 (5.3.2) · Bok s. 135 (5.3.3) · Bok s. 135 (5.3.4) · L6 slide 56-58"},{"id":"SB225","l":"L6","t":"Material ESG issues","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Corporate governance is unrelated to social and environmental performance, so strong G cannot help S and E.","o":[["True","Feil. God governance kan gi bedre sosial og miljømessig ytelse."],["False","Riktig. God governance kan gi bedre sosial og miljømessig ytelse."]],"c":[1],"es":"Usant. God governance kan drive bedre S og E.","ed":"Husk: G støtter E og S.","kt":"","src":"Bok s. 135 (5.3.3)"},{"id":"SB226","l":"L6","t":"Impact","f":"m","d":3,"p":"M","sc":"none","s":"Which question is part of assessing a firm's impact?","o":[["What was its share return last quarter?","Feil: kortsiktig avkastning er ikke impact."],["Which SDGs does it help or harm?","Riktig: SDG-er."],["How many analysts cover the stock?","Feil: analytikerdekning er ikke impact."],["What is its dividend payout ratio?","Feil: utbytte er ikke impact."]],"c":[1],"es":"Å spørre hvilke SDG-er firmaet hjelper eller skader er impact.","ed":"Husk: impact = effekten på verden.","kt":"","src":"L6 slide 68-72"},{"id":"SB227","l":"L6","t":"Circular business models","f":"m","d":3,"p":"M","sc":"none","s":"In the circular economy \"value hill\", the aim is to:","o":[["Sell throw-away products","Feil: sirkulær design forlenger bruken."],["Move products down the hill fast","Feil: det er lineær tankegang."],["Keep products at the top longer","Riktig: hold verdien lenge."],["Extract as many new raw materials as possible","Feil: sirkulær bruker mindre nye råvarer."]],"c":[2],"es":"Hold produktene på toppen av bakken lengst mulig.","ed":"Husk: reuse, repair, refurbish.","kt":"","src":"Bok s. 137 (5.4) · Bok s. 138 (Figure 5.8) · Bok s. 139 (Box 5.6) · L6 slide 39"},{"id":"SB228","l":"L6","t":"Circular business models","f":"t","d":4,"p":"L","sc":"none","s":"True or false: Zink and Geyer (2017) argue that circular economy activities always reduce total production.","o":[["True","Feil. De sier det motsatte: sirkulær økonomi kan øke total produksjon."],["False","Riktig. De sier det motsatte: sirkulær økonomi kan øke total produksjon."]],"c":[1],"es":"Usant. Sirkulære aktiviteter kan øke total produksjon (rebound).","ed":"Husk: circular economy rebound.","kt":"","src":"Bok s. 140 (5.4) · Bok s. 54 (2.3.2)"},{"id":"SB229","l":"L6","t":"Long-term value creation","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"A mining firm's $2bn desalination plant looks value-destroying in a simple NPV analysis, but value-creating in the correct one. What does the correct analysis do?","o":[["Adds only the value of the good publicity","Feil: nøkkelen er beskyttet kontantstrøm."],["Ignores the $2bn cost","Feil: kostnaden er med i begge."],["Uses a zero discount rate","Feil: renten er ikke forskjellen."],["Compares with and without the plant","Riktig: med vs uten anlegget."]],"c":[3],"es":"Sammenlign med og uten anlegget. Uten det kan gruva stoppe.","ed":"Husk: velg riktig counterfactual.","kt":"Counterfactual (with-and-without) analysis: valuing a project by comparing the firm's cash flows with and without it.","src":"Bok s. 144 (Table 5.4) · Bok s. 145 (Table 5.6)"},{"id":"SB230","l":"L6","t":"Long-term value creation","f":"m","d":4,"p":"M","sc":"none","s":"A board accepts \"sustainability projects\" even with negative NPV, and judges \"other projects\" normally. How does the textbook see this?","o":[["Sustainability belongs to the CSR team","Feil: bærekraft skal i alle funksjoner."],["It is greenwashing","Feil: det er ikke poenget."],["It is best practice for boards","Feil: læreboka vil heller verdsette effektene."],["It is not real integration","Riktig: ikke ekte integrering."]],"c":[3],"es":"Å ha egne regler for \"bærekraftsprosjekter\" er prioritering, ikke integrering.","ed":"Husk: ekte integrering = verdsett effektene i alle prosjekter.","kt":"","src":"Bok s. 143 (5.5.2.1) · Bok s. 144 (5.5.2.1) · Bok s. 142 (5.5.2)"},{"id":"SB231","l":"L6","t":"Long-term value creation","f":"m","d":3,"p":"H","sc":"none","s":"Which is a guideline for a firm pursuing long-term value creation (LTVC)?","o":[["Talk only to shareholders","Feil: snakk med alle stakeholders."],["Keep sustainability out of investment decisions","Feil: bærekraft skal inn i investeringer."],["Avoid investing in intangibles","Feil: bygg intangibles."],["Make purpose a key part of strategy","Riktig: purpose i strategien."]],"c":[3],"es":"Gjør purpose til en sentral del av strategien.","ed":"Husk: LTVC guideline 1.","kt":"","src":"Bok s. 142 (5.5.2) · Bok s. 143 (5.5.2) · Bok s. 142 (Box 5.8) · L6 slide 73-76"},{"id":"SB232","l":"L6","t":"Long-term value creation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In the KPN example, cutting marketing and network spending raises short-term returns, but soon hurts market share, and fixing it costs more than was saved.","o":[["True","Riktig. Kuttene gir rask gevinst, men tapt markedsandel koster mer å hente tilbake."],["False","Feil. Kuttene gir rask gevinst, men tapt markedsandel koster mer å hente tilbake."]],"c":[0],"es":"Sant. Kutt gir kortsiktig gevinst, men koster mer senere.","ed":"Husk: KPN = langsiktig over kortsiktig.","kt":"","src":"Bok s. 142 (Box 5.8) · Bok s. 143 (Figure 5.9)"},{"id":"SB233","l":"L6","t":"CCBJH materiality case","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Coca-Cola Bottlers Japan keeps reviewing the material issues it found in 2023. Which concept fits this?","o":[["A one-time assessment","Feil: de gjennomgår jevnlig."],["Accounting materiality","Feil: dette går forbi balansen."],["Dynamic materiality","Riktig: dynamic materiality."],["Exclusion of sin stocks","Feil: det er en investorstrategi."]],"c":[2],"es":"Å gjennomgå material issues jevnlig = dynamic materiality.","ed":"Husk: dynamic = endrer seg over tid.","kt":"","src":"L6 slide 62-67 · L6 slide 53 · Bok s. 118 (5.1)"},{"id":"SB234","l":"L6","t":"ESG integration in valuation","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A drinks company's most material issue is water scarcity, and it does worse than peers. What should an analyst do next?","o":[["Put water risk into the DCF","Riktig: integrer i DCF."],["Exclude the firm at once","Feil: exclusion er en annen strategi."],["Ignore it; water is free","Feil: vann kan bli priset."],["Only lower the firm's ESG score","Feil: integrering krever value drivers."]],"c":[0],"es":"Ta vannrisiko inn i DCF.","ed":"Husk: material issue → value drivers → verdi.","kt":"","src":"L6 slide 59-61 · L9 slide 7-10 · Bok s. 144 (5.5.2.1) · Bok s. 247 (Appendix)"},{"id":"SB235","l":"L6","t":"Competitive position","f":"m","d":2,"p":"L","sc":"none","s":"Which example shows \"networks/access\" as a competitive advantage?","o":[["A platform with network effects","Riktig: nettverk."],["A firm with superior R&D","Feil: det er knowledge."],["A firm with a strong culture","Feil: det er people/culture."],["A miner with the world's cheapest ore","Feil: det er resources."]],"c":[0],"es":"Plattform med nettverkseffekter = networks.","ed":"Husk: mer brukere = mer verdi.","kt":"","src":"Bok s. 123 (5.2.1.5) · Bok s. 124 (5.2.1.5) · L6 slide 12"},{"id":"TR27","l":"L6","t":"Free cash flow","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"After repeated extreme weather, a retailer holds much larger stocks of goods. Which part of free cash flow lowers its value?","o":[["Higher revenue from green consumers","Feil: det handler om lager."],["Lower depreciation of buildings","Feil: avskrivning er ikke relevant."],["A lower corporate tax rate on profits","Feil: lager endrer ikke skatten."],["Higher net working capital","Riktig: høyere NWC."]],"c":[3],"es":"Mer lager øker net working capital og senker FCF.","ed":"Husk: FCF = OCF − capex − Δ NWC.","kt":"","src":"Opptak L6 ca. 1 min · Opptak L6 ca. 3 min"},{"id":"TR28","l":"L6","t":"Competitive strategy","f":"m","d":3,"p":"H","sc":"extended_course_case","s":"Oatly grew with a differentiation strategy. Then big drinks firms entered with lower costs. What did this mean for Oatly?","o":[["Nothing changed","Feil: konkurrentene kom inn."],["It became the cost leader","Feil: Oatly var dyrere."],["It could raise prices","Feil: billige konkurrenter hindret prisøkning."],["It had to cut its costs","Riktig: kutte kostnader."]],"c":[3],"es":"Billigere konkurrenter tvang Oatly til å kutte kostnader.","ed":"Husk: differentiation er sårbart når andre kopierer.","kt":"","src":"Opptak L6 ca. 16 min · Opptak L6 ca. 17 min"},{"id":"TR29","l":"L6","t":"Intangibles","f":"m","d":2,"p":"M","sc":"none","s":"A buyer pays far more than book value for a firm with a strong brand and skilled staff. The extra amount is called:","o":[["A stranded asset","Feil: stranded = tap."],["Working capital","Feil: working capital er kortsiktig."],["Depreciation","Feil: avskrivning gjelder fysiske eiendeler."],["Goodwill","Riktig: goodwill."]],"c":[3],"es":"Ekstra betaling over bokført verdi = goodwill.","ed":"Husk: goodwill = premie ved oppkjøp.","kt":"","src":"Opptak L6 ca. 22 min"},{"id":"TR30","l":"L6","t":"Intangibles","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A firm spends a lot on a new low-carbon process that fails, and it cannot sell anything to get money back. This shows that intangibles have:","o":[["Synergies","Feil: synergier = forsterker hverandre."],["Scalability","Feil: scalability = billig å kopiere."],["Spillovers","Feil: spillovers = andre tjener på det."],["Sunk costs","Riktig: sunk costs."]],"c":[3],"es":"Pengene kan ikke hentes tilbake = sunk costs.","ed":"Husk: intangibles kan ikke selges videre.","kt":"","src":"Opptak L6 ca. 23 min"},{"id":"CX051","l":"L7","t":"Environmental metrics","f":"m","d":2,"p":"H","sc":"none","s":"Emissions from coal burned in a steel maker's own furnaces are:","o":[["Scope 3","Scope 3 er resten av verdikjeden."],["Not counted in any scope","Egne utslipp telles alltid."],["Scope 2","Scope 2 er innkjøpt strøm og varme."],["Scope 1","Direkte utslipp fra egne anlegg = scope 1."]],"c":[3],"es":"Egen pipe = scope 1.","ed":"Huskeregel: 1 = egen pipe, 2 = strømledningen inn, 3 = resten av verdikjeden (leverandører og kunders bruk).","kt":"","src":"Bok s. 153 (6.2.1) · Bok s. 154 (Box 6.1) · L7 slide 7","k":1},{"id":"CX052","l":"L7","t":"Environmental metrics","f":"m","d":2,"p":"H","sc":"none","s":"Emissions from a company's suppliers belong to:","o":[["Scope 1","Scope 1 er egne direkte utslipp."],["Scope 3","Verdikjeden utenfor egne anlegg = scope 3."],["No scope at all","De telles i scope 3."],["Scope 2","Scope 2 er innkjøpt strøm og varme."]],"c":[1],"es":"Leverandører = scope 3.","ed":"Scope 3 er ofte den største delen, men den vanskeligste å måle.","kt":"","src":"Bok s. 153 (6.2.1) · Bok s. 154 (Box 6.1) · L7 slide 7","k":1},{"id":"CX053","l":"L7","t":"TCFD","f":"m","d":2,"p":"H","sc":"none","s":"The framework that reports climate-related financial risk under four pillars is:","o":[["TCFD","Governance, strategy, risk management, metrics and targets."],["SASB","SASB er bransjespesifikk, ikke bygget på fire klimasøyler."],["EU Taxonomy","Taksonomien klassifiserer aktiviteter."],["GRI","GRI handler om impact for alle stakeholders."]],"c":[0],"es":"TCFD = klima → økonomi, fire søyler.","ed":"Fire søyler: governance, strategy (inkl. scenarioanalyse), risk management, metrics and targets. Bygget inn i ISSB (IFRS S2).","kt":"","src":"L7 slide 16-17 · Bok s. 173 (6.5)","k":1},{"id":"CX054","l":"L7","t":"Reporting frameworks","f":"m","d":2,"p":"H","sc":"none","s":"The reporting framework aimed at ALL stakeholders, not mainly investors, is:","o":[["TCFD","TCFD er for investorer."],["IFRS","IFRS er for investorer og kreditorer."],["SASB","SASB er for investorer."],["GRI","GRI = impact, alle stakeholders."]],"c":[3],"es":"GRI = alle stakeholders.","ed":"SASB, TCFD og IFRS er rettet mot investorer. GRI er rettet mot alle.","kt":"","src":"Bok s. 157 (6.3) · Bok s. 158 (Table 6.2) · Bok s. 162 (6.3.1.3)","k":1},{"id":"CX055","l":"L7","t":"Integrated reporting","f":"m","d":2,"p":"H","sc":"none","s":"In integrated reporting, a firm's patents and know-how are:","o":[["Human capital","Human capital er de ansattes ferdigheter og helse."],["Intellectual capital","Kunnskap og patenter = intellectual capital."],["Manufactured capital","Manufactured capital er bygg og maskiner."],["Social and relationship capital","Det er relasjoner og tillit."]],"c":[1],"es":"Patenter = intellectual.","ed":"Seks kapitaler: financial, manufactured, intellectual, human, social and relationship, natural.","kt":"","src":"L7 slide 10 · Bok s. 159 (6.3.1.1)","k":1},{"id":"CX056","l":"L7","t":"Mandatory reporting","f":"m","d":2,"p":"H","sc":"none","s":"The EU's CSRD requires:","o":[["Double materiality","CSRD krever at både impact og financial materiality vurderes."],["Financial materiality only","Det er ISSB-tilnærmingen, ikke CSRD."],["No materiality assessment","Materialitetsvurdering er kjernen i CSRD."],["Impact materiality only","CSRD krever begge retninger."]],"c":[0],"es":"CSRD = double materiality.","ed":"Rapporteringen følger ESRS. Et tema er rapporteringspliktig hvis det er vesentlig i minst én retning.","kt":"","src":"L7 slide 23-25 · PwC s. 29 · L6 slide 50","k":1},{"id":"CX057","l":"L7","t":"EU Taxonomy","f":"m","d":2,"p":"H","sc":"none","s":"The EU Taxonomy classifies:","o":[["Economic activities","Taksonomien klassifiserer aktiviteter, ikke selskaper."],["Countries and their governments","Taksonomien klassifiserer ikke land."],["Fund managers and their funds","Fond rapporterer under SFDR, men taksonomien klassifiserer aktiviteter."],["Whole companies","Et selskap kan ha både grønne og ikke-grønne aktiviteter."]],"c":[0],"es":"Taxonomy = aktiviteter.","ed":"Selskaper rapporterer hvor stor andel av omsetning og investeringer som er taxonomy-aligned. Et mål er å hindre greenwashing.","kt":"","src":"Opptak L12 ca. 44 min","k":1},{"id":"CX058","l":"L7","t":"ESG ratings","f":"m","d":2,"p":"H","sc":"none","s":"'Aggregate confusion' refers to:","o":[["Low agreement between ESG raters","Ulike leverandører gir svært ulike ratinger."],["Adding E, S and G into one score","Problemet er sprik mellom leverandører."],["Confusing ESG labels on funds","Det handler om ratinger, ikke fondsnavn."],["Investors ignoring ESG reports","Det er ikke begrepet."]],"c":[0],"es":"Aggregate confusion = ratingene spriker.","ed":"Eksempel: Tesla ble fjernet fra en ESG-indeks mens ExxonMobil ble værende, fordi ratingen målte ESG-risikostyring relativt til bransjen.","kt":"","src":"L7 slide 37 · Fondsfinans s. 6","k":1},{"id":"SB236","l":"L7","t":"Limits of financial reporting","f":"m","d":2,"p":"H","sc":"none","s":"A limitation of traditional financial reporting is that:","o":[["It has no auditing standards","Feil: regnskap har revisjonsstandarder."],["It puts all R&D spending on the balance sheet","Feil: R&D blir som regel kostnadsført, ikke balanseført."],["It reports too much non-financial data","Feil: kritikken er for lite ikke-finansiell info."],["It looks backward","Riktig: det ser bakover."]],"c":[3],"es":"Tradisjonelle regnskap ser bakover, ikke fremover.","ed":"Husk: backward-looking er hovedsvakheten.","kt":"","src":"Bok s. 151 (6.1.1) · Bok s. 152 (6.1.2)"},{"id":"SB237","l":"L7","t":"Limits of financial reporting","f":"m","d":3,"p":"M","sc":"none","s":"Why have reported earnings and book values become less useful (Lev and Zarowin, 1999)?","o":[["Firms put all intangibles on the balance sheet","Feil: problemet er at de ikke balanseføres."],["R&D costs come now, benefits later","Riktig: kost nå, gevinst senere."],["Auditors stopped checking R&D firms","Feil: det handler om regnskapsregler."],["Markets no longer need accounts","Feil: regnskapet viser ikke verdien godt nok."]],"c":[1],"es":"R&D koster nå, men gevinsten kommer senere. Da passer ikke kostnad og inntekt sammen.","ed":"Husk: matching-problemet.","kt":"","src":"Bok s. 152 (6.1.2) · Bok s. 153 (6.1.2)"},{"id":"SB238","l":"L7","t":"Sustainability reporting","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Hummel and Schlick (2016) find that weak sustainability performers publish the most detailed sustainability reports.","o":[["True","Feil. Det er motsatt: gode aktører lager gode rapporter for å signalisere."],["False","Riktig. Det er motsatt: gode aktører lager gode rapporter for å signalisere."]],"c":[1],"es":"Usant. De beste rapporterer best, for å signalisere at de er gode.","ed":"Husk: signalling.","kt":"","src":"Bok s. 153 (6.1.2) · Bok s. 155 (6.2.4) · Bok s. 170 (6.3.4)"},{"id":"SB239","l":"L7","t":"Environmental metrics","f":"m","d":2,"p":"H","sc":"short","s":"A car maker reports under the GHG Protocol. Emissions from customers driving its cars are:","o":[["Scope 3","Riktig: Scope 3."],["Scope 2","Feil: Scope 2 er kjøpt strøm og varme."],["Scope 4","Feil: Scope 4 er unngåtte utslipp."],["Scope 1","Feil: Scope 1 er egne direkte utslipp."]],"c":[0],"es":"Kundenes kjøring er indirekte utslipp i verdikjeden = Scope 3.","ed":"Husk: 1 = egne, 2 = kjøpt strøm, 3 = resten av kjeden.","kt":"","src":"Bok s. 153 (6.2.1) · Bok s. 154 (Box 6.1) · L7 slide 7"},{"id":"SB240","l":"L7","t":"Environmental metrics","f":"m","d":3,"p":"M","sc":"none","s":"Philips' emissions in 2017 (kilotons CO2e): scope 1 = 38, scope 2 = 58, scope 3 = 751, and 220 offset. Which reading is correct?","o":[["Scope 1 is the largest","Feil: Scope 1 (38) er minst."],["Scope 3 is the largest","Riktig: Scope 3 er størst."],["Scope 3 fell sharply","Feil: Scope 3 økte."],["Offsets are never deducted from the total","Feil: offsets trekkes fra i tabellen."]],"c":[1],"es":"Scope 3 (751) er størst.","ed":"Husk: Scope 3 er ofte størst.","kt":"","src":"Bok s. 154 (Table 6.1) · Bok s. 154 (6.2.1)"},{"id":"SB241","l":"L7","t":"Social and governance metrics","f":"m","d":2,"p":"M","sc":"none","s":"Which is a SOCIAL metric?","o":[["Scope 2 emissions per sale","Feil: utslipp er E."],["Board independence","Feil: styreuavhengighet er G."],["Management pay","Feil: lederlønn er G."],["Accident rates at mines","Riktig: ulykker er S."]],"c":[3],"es":"Ulykker i gruver er en sosial (S) indikator.","ed":"Husk: helse og sikkerhet = S.","kt":"","src":"Bok s. 155 (6.2.2) · Bok s. 155 (6.2.3)"},{"id":"SB242","l":"L7","t":"Metrics and value drivers","f":"m","d":3,"p":"H","sc":"none","s":"Value driver trees for Novozymes and a mining company show that:","o":[["Novozymes: people; miner: stakeholders","Riktig: ulike drivere."],["Both have exactly the same ESG drivers","Feil: poenget er at de er ulike."],["Novozymes: local stakeholders matter most","Feil: det er gruveselskapet."],["Miner: innovation matters most","Feil: det er Novozymes."]],"c":[0],"es":"Novozymes drives av folk og innovasjon. Gruveselskapet av lokale stakeholders.","ed":"Husk: ESG-driverne varierer med bransje.","kt":"","src":"Bok s. 155 (6.2.4) · Bok s. 156 (Figure 6.1) · Bok s. 156 (Figure 6.2)"},{"id":"SB243","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An investor asks a shipping firm how climate change could affect its finances, how the board oversees this, and how it does under a 2°C scenario. Which framework fits best?","o":[["A materiality matrix alone","Feil: en matrise gir ikke scenarioer."],["Integrated Reporting (<IR>)","Feil: <IR> dekker seks capitals, ikke spesifikt klima."],["TCFD","Riktig: dette er TCFD."],["GRI","Feil: GRI fokuserer på impact."]],"c":[2],"es":"Klima + styrets rolle + 2°C-scenario = TCFD.","ed":"Husk: TCFD = governance, strategy, risk management, metrics.","kt":"TCFD: climate-related financial disclosures in four pillars - governance, strategy, risk management, metrics and targets.","src":"L7 slide 4 · L7 slide 16-17"},{"id":"SB244","l":"L7","t":"Reporting frameworks","f":"m","d":2,"p":"M","sc":"none","s":"Where are TCFD and CDP disclosures made?","o":[["TCFD on the CDP website; CDP in the accounts","Feil: rollene er snudd."],["TCFD: annual report; CDP: own platform","Riktig: TCFD i årsrapporten, CDP egen plattform."],["Neither is public","Feil: begge er offentlige."],["Both only in separate CSR reports","Feil: TCFD skal i årsrapporten."]],"c":[1],"es":"TCFD i årsrapporten, CDP på egen plattform.","ed":"Husk: TCFD = annual report.","kt":"","src":"L7 slide 4 · L7 slide 18-19 · Bok s. 170 (6.4)"},{"id":"SB245","l":"L7","t":"TCFD","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the four TCFD areas?","o":[["Product pricing","Feil: ikke et TCFD-område."],["Governance","Riktig: governance."],["Employee diversity","Feil: TCFD gjelder bare klima."],["Dividend policy","Feil: ikke et TCFD-område."]],"c":[1],"es":"Governance er ett av fire TCFD-områder.","ed":"Husk: governance, strategy, risk management, metrics & targets.","kt":"","src":"L7 slide 16-17 · Bok s. 173 (6.5)"},{"id":"SB246","l":"L7","t":"Integrated reporting","f":"m","d":2,"p":"H","sc":"none","s":"The IIRC (2013) defines an integrated report as:","o":[["A short report on how the firm creates value","Riktig: kort om verdiskaping."],["A separate CSR report","Feil: det er silo-tilnærmingen IR erstatter."],["A mandatory EU taxonomy report","Feil: det er EU Taxonomy."],["All of the firm's data in one very long document","Feil: IR skal være kort."]],"c":[0],"es":"En kort rapport om hvordan firmaet skaper verdi.","ed":"Husk: integrated report = kort + verdiskaping.","kt":"","src":"L7 slide 8-9 · Bok s. 157 (6.3.1) · Bok s. 173 (Key concepts)"},{"id":"SB247","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A hospital group prepares an integrated report. Which item is correctly classified?","o":[["Nurses' skills - human capital","Riktig: human capital."],["Software patents - natural capital","Feil: patenter er intellectual."],["Hospital buildings - intellectual capital","Feil: bygninger er manufactured."],["Cash - social capital","Feil: kontanter er financial."]],"c":[0],"es":"Sykepleiernes kompetanse = human capital.","ed":"Husk: seks capitals: financial, manufactured, intellectual, human, social, natural.","kt":"Six capitals (IIRC): financial, manufactured, intellectual, human, social and relationship, natural.","src":"L7 slide 10 · Bok s. 159 (6.3.1.1)"},{"id":"SB248","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"Which is a guiding PRINCIPLE (not a content element) of integrated reporting?","o":[["Business model and value creation","Feil: content element."],["Outlook and uncertainties","Feil: content element."],["Connectivity of information","Riktig: guiding principle."],["Risks and opportunities","Feil: content element."]],"c":[2],"es":"Connectivity of information er et prinsipp. De andre er innholdselementer.","ed":"Husk: principles = hvordan. Content = hva.","kt":"","src":"L7 slide 11 · Bok s. 160 (6.3.1.2) · Bok s. 161 (6.3.1.2)"},{"id":"SB249","l":"L7","t":"Integrated reporting","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Philips' 2016 integrated report does NOT meet the principle of conciseness, because it is 226 pages long.","o":[["True","Riktig. Rapporten er for lang med 226 sider, så den bryter conciseness."],["False","Feil. Rapporten er for lang med 226 sider, så den bryter conciseness."]],"c":[0],"es":"Sant. 226 sider er ikke kort.","ed":"Husk: conciseness er et prinsipp.","kt":"","src":"Bok s. 164 (Table 6.3) · Bok s. 165 (Table 6.4)"},{"id":"SB250","l":"L7","t":"Six capitals balance sheet","f":"m","d":4,"p":"H","sc":"none","s":"For a mining firm, a six capitals balance sheet adds large negative natural capital. What happens to the picture of the firm?","o":[["Equity falls; risk rises","Riktig: lavere egenkapital, høyere risiko."],["Debt disappears from the balance sheet","Feil: gjelden blir værende."],["Nothing changes","Feil: bildet endres mye."],["Equity rises","Feil: egenkapitalen faller."]],"c":[0],"es":"Negativ natural capital senker egenkapitalen og øker risikoen.","ed":"Husk: skjulte miljøforpliktelser blir synlige.","kt":"Six capitals balance sheet: a balance sheet valuing financial, manufactured, intellectual, human, social and natural capital, including negative capital (e.g. environmental damage).","src":"Bok s. 166 (Figure 6.6) · Bok s. 167 (6.3.2.2)"},{"id":"SB251","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"H","sc":"none","s":"Which framework is aimed at ALL stakeholders, not mainly investors?","o":[["SASB","Feil: SASB er for investorer."],["IFRS","Feil: IFRS er for investorer."],["<IR>","Feil: <IR> er mest for kapitalgivere."],["GRI","Riktig: GRI er for alle stakeholders."]],"c":[3],"es":"GRI er for alle stakeholders.","ed":"Husk: GRI = alle. SASB/IFRS/<IR> = investorer.","kt":"","src":"Bok s. 157 (6.3) · Bok s. 158 (Table 6.2) · Bok s. 162 (6.3.1.3)"},{"id":"SB252","l":"L7","t":"Reporting frameworks","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The textbook calls the IIRC rules based, GRI principles based and SASB the same for all industries.","o":[["True","Feil. Det er motsatt: IIRC er principles based, GRI er rules based og SASB er bransjespesifikk."],["False","Riktig. Det er motsatt: IIRC er principles based, GRI er rules based og SASB er bransjespesifikk."]],"c":[1],"es":"Usant. IIRC er principles based, GRI rules based, SASB bransjespesifikk.","ed":"Husk: IIRC = prinsipper, GRI = regler, SASB = per bransje.","kt":"","src":"Bok s. 157 (6.3) · Bok s. 161 (6.3.1.3) · Bok s. 162 (6.3.1.4)"},{"id":"SB253","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"L","sc":"none","s":"Which is one of SASB's criteria for picking material topics?","o":[["Linked to at least three SDGs","Feil: ikke et SASB-kriterium."],["Relevant across an industry","Riktig: bransjerelevant."],["Approved by the auditor","Feil: ikke et kriterium."],["Relevant to society, even with no effect on the firm","Feil: det er GRI."]],"c":[1],"es":"SASB velger issues som er relevante for en hel bransje.","ed":"Husk: SASB = bransje + investor.","kt":"","src":"Bok s. 162 (6.3.1.4) · L6 slide 50-51"},{"id":"SB254","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"A study compares no ESG reporting, separate ESG reports, ESG in the annual report, and integrated reporting (<IR>). What does it find?","o":[["<IR> beats some forms, not all","Riktig: bedre enn noen."],["<IR> is the worst form","Feil: <IR> er bedre enn to av dem."],["Switching to <IR> always helps the firm","Feil: det hjelper ikke alltid."],["No ESG reporting is best","Feil: ingen rapportering er dårligere."]],"c":[0],"es":"<IR> er bedre enn noen former, men ikke alle.","ed":"Husk: ikke en garanti.","kt":"","src":"L7 slide 13 · Bok s. 163 (6.3.2)"},{"id":"SB255","l":"L7","t":"Mandatory vs voluntary reporting","f":"m","d":3,"p":"H","sc":"short","s":"In 2023 the US SEC fined DWS USD 19 million for false claims about its ESG investing. This shows that:","o":[["ESG claims never need to be checked","Feil: boten viser at de sjekkes."],["Enforcement of claims matters","Riktig: håndheving er viktig."],["Only small firms greenwash","Feil: DWS er stort."],["Regulators cannot act","Feil: SEC handlet."]],"c":[1],"es":"Myndighetene sjekker og straffer falske ESG-påstander.","ed":"Husk: enforcement betyr noe.","kt":"Greenwashing: making misleading claims about environmental or sustainability performance.","src":"L7 slide 26 · L8 slide 19 · PwC s. 30"},{"id":"SB256","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"Which is a BARRIER to adopting integrated reporting?","o":[["Status quo bias","Riktig: en barriere."],["A lower cost of capital","Feil: det er et incentiv."],["Attracting more long-term investors","Feil: det er et incentiv."],["Keeping up with peers","Feil: det er et incentiv."]],"c":[0],"es":"Status quo bias hindrer IR. De andre er grunner til å bruke det.","ed":"Husk: barriere vs incentiv.","kt":"","src":"Bok s. 167 (6.3.3) · Bok s. 168 (Table 6.5)"},{"id":"SB257","l":"L7","t":"Integrated reporting","f":"m","d":4,"p":"M","sc":"none","s":"Integrated reporting measures a firm's net impact, but not against system limits. Why is that a problem?","o":[["Eco-efficiency is stricter","Feil: eco-effectiveness er strengest."],["IR measures limits, not impact","Feil: rollene er snudd."],["Efficiency does not show it stays within limits","Riktig: effektivitet sier ikke noe om grenser."],["System limits are already in market prices","Feil: externalities er ikke priset."]],"c":[2],"es":"Effektivitet sier ikke om firmaet holder seg innenfor naturens grenser.","ed":"Husk: eco-efficiency ≠ eco-effectiveness.","kt":"","src":"Bok s. 168 (6.3.3)"},{"id":"SB258","l":"L7","t":"Integrated reporting","f":"m","d":4,"p":"M","sc":"none","s":"Why does Flower (2015) call the IIRC \"a story of failure\"?","o":[["It requires a money value for all six capitals","Feil: det finnes ikke et slikt krav."],["It focuses on value for investors","Riktig: investorfokus."],["It focuses too much on society","Feil: han mener det motsatte."],["It was started by NGOs","Feil: han sier regnskapsbransjen dominerer."]],"c":[1],"es":"Flower: IIRC fokuserer på verdi for investorer, ikke samfunnet.","ed":"Husk: investor focus er kritikken.","kt":"","src":"Bok s. 169 (6.3.4) · Bok s. 170 (6.3.4)"},{"id":"SB259","l":"L7","t":"Integrated reporting","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Churet and Eccles (2014) see integrated reporting as a good sign of high-quality management.","o":[["True","Riktig. De mener firmaer som kan forklare bærekraft for langsiktig suksess, har god ledelse."],["False","Feil. De mener firmaer som kan forklare bærekraft for langsiktig suksess, har god ledelse."]],"c":[0],"es":"Sant. IR viser at ledelsen forstår bærekraft for langsiktig suksess.","ed":"Husk: IR som signal på god ledelse.","kt":"","src":"Bok s. 169 (6.3.4)"},{"id":"SB260","l":"L7","t":"Mandatory reporting","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A Norwegian seafood firm under the CSRD harms wild salmon, but this barely affects its finances. Must it report on this?","o":[["Only if an NGO asks","Feil: kravet kommer fra loven."],["Yes, under double materiality","Riktig: double materiality."],["No: only financial issues count under CSRD","Feil: det er single materiality."],["No: only GRI covers this","Feil: ESRS krever impact også."]],"c":[1],"es":"Ja. Under double materiality er impact nok, selv uten finansiell effekt.","ed":"Husk: impact ELLER financial.","kt":"Double materiality: report an issue if it affects the company's value (financial materiality) or if the company significantly affects people or the environment (impact materiality).","src":"L7 slide 23-25 · PwC s. 29 · L6 slide 50"},{"id":"SB261","l":"L7","t":"Mandatory reporting","f":"m","d":2,"p":"H","sc":"none","s":"One goal of the EU Taxonomy is to:","o":[["Prevent greenwashing","Riktig: hindre greenwashing."],["Replace credit ratings","Feil: ikke et mål."],["Ban fossil fuel investment","Feil: det er en klassifisering, ikke et forbud."],["Set mandatory ESG ratings","Feil: den rater ikke firmaer."]],"c":[0],"es":"EU Taxonomy skal hindre greenwashing.","ed":"Husk: taxonomy = felles definisjon av grønt.","kt":"","src":"L7 slide 21-22 · PwC s. 32"},{"id":"SB262","l":"L7","t":"Effects of reporting","f":"m","d":3,"p":"H","sc":"none","s":"How can greenwashing best be prevented, according to the research in the course?","o":[["Ban all sustainability claims","Feil: ikke foreslått."],["Keep reporting fully voluntary","Feil: helt frivillig gir greenwashing."],["Let rating agencies check every claim","Feil: ratinger er upålitelige."],["Mix voluntary and mandatory rules","Riktig: blanding."]],"c":[3],"es":"En blanding av frivillige og obligatoriske regler.","ed":"Husk: helt frivillig gir greenwashing.","kt":"","src":"L7 slide 26 · L7 slide 30-31 · PwC s. 30"},{"id":"SB263","l":"L7","t":"Effects of reporting","f":"m","d":4,"p":"M","sc":"none","s":"Krueger et al. (2021) study mandatory ESG disclosure around the world. They find that it:","o":[["improves information","Riktig: bedre info."],["increases bad ESG events","Feil: negative hendelser går ned."],["has no effect on information","Feil: informasjonen blir bedre."],["matters only for firms that already report well","Feil: effekten er størst der info var dårligst."]],"c":[0],"es":"Obligatorisk rapportering gir bedre informasjon.","ed":"Husk: mandatory → bedre data, færre negative hendelser.","kt":"","src":"L7 slide 27-29"},{"id":"SB264","l":"L7","t":"Effects of reporting","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A retailer promises \"net zero by 2050\" with no interim targets, counts only its own stores' emissions, and buys cheap offsets. Its supply chain is 95% of emissions. What problems does this show?","o":[["Too much focus on developing countries","Feil: ikke problemet."],["Too strict definitions","Feil: definisjonene er for løse."],["Weak targets, hidden supply chain","Riktig: svake mål og skjult kjede."],["Too much auditing","Feil: problemet er motsatt."]],"c":[2],"es":"Svake mål og skjult Scope 3 (leverandørkjeden).","ed":"Husk: net zero uten delmål og uten Scope 3 er svakt.","kt":"Scope 3 emissions: indirect emissions across the value chain (suppliers and product use), often the largest share.","src":"L7 slide 30 · L7 slide 7 · PwC s. 24"},{"id":"SB265","l":"L7","t":"ESG ratings","f":"m","d":2,"p":"M","sc":"none","s":"Where do MSCI and Sustainalytics fit among ESG data providers?","o":[["Raw data on one topic","Feil: eksempel er Southpole."],["Ratings on one topic","Feil: eksempel er Equileap."],["Broad ratings","Riktig: brede ratinger."],["Broad raw data","Feil: eksempel er RepRisk."]],"c":[2],"es":"MSCI og Sustainalytics gir brede ratinger.","ed":"Husk: bred rating = alle temaer.","kt":"","src":"Bok s. 170 (6.4) · Bok s. 171 (Table 6.6) · L7 slide 32"},{"id":"SB266","l":"L7","t":"ESG ratings","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Two rating agencies have the same E, S and G scores for a firm. Agency 1 weights G most; agency 2 weights E most. The firm is strong on G but weak on E. What happens?","o":[["Agency 2 rates it higher","Feil: tung vekt på E senker scoren."],["Both give the same rating","Feil: vektene endrer scoren."],["Ratings differ only if data differ","Feil: metode skaper også forskjeller."],["Agency 1 rates it higher","Riktig: byrå 1."]],"c":[3],"es":"Byrå 1 vekter G mest, og firmaet er sterkt på G. Byrå 1 gir høyest.","ed":"Husk: vekter gir ulike ratinger.","kt":"Rating divergence: different ESG ratings for the same firm, driven by differences in scope, measurement and weights.","src":"Bok s. 171 (Figure 6.7) · L7 slide 36-37 · Fondsfinans s. 16"},{"id":"SB267","l":"L7","t":"ESG ratings","f":"m","d":3,"p":"H","sc":"none","s":"According to Kotsantonis (2019), how does disagreement among ESG data providers change with more public information?","o":[["It increases","Riktig: uenigheten øker."],["It disappears","Feil: mer info gir mer tolkning."],["It only exists with no data","Feil: den finnes og øker."],["It is unrelated","Feil: det er en positiv sammenheng."]],"c":[0],"es":"Mer info gir mer uenighet.","ed":"Husk: overraskende funn.","kt":"","src":"L7 slide 37 · Starks s. 1843"},{"id":"SB268","l":"L7","t":"ESG ratings","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"An oil firm gets a high ESG rating when compared with oil peers, and a low one when compared with all firms. This shows:","o":[["One provider made a mistake","Feil: begge kan være riktige."],["The peer group can drive the rating","Riktig: peer group."],["Ratings always measure absolute impact","Feil: bransjerelative ratinger."],["The firm is greenwashing","Feil: forskjellen kommer fra metode."]],"c":[1],"es":"Sammenligningsgruppen styrer ratingen.","ed":"Husk: best i bransjen ≠ bra totalt.","kt":"","src":"L7 slide 37 · L7 slide 36"},{"id":"SB269","l":"L7","t":"ESG ratings","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Many investors treat ESG ratings as the final answer instead of a starting point, and many follow proxy advisors' voting advice automatically.","o":[["True","Riktig. Læreboka advarer om at mange bruker ratinger og stemmeråd ukritisk."],["False","Feil. Læreboka advarer om at mange bruker ratinger og stemmeråd ukritisk."]],"c":[0],"es":"Sant. Mange bruker ratinger som fasit og følger stemmeråd blindt.","ed":"Husk: rating = start, ikke svar.","kt":"","src":"Bok s. 172 (6.4)"},{"id":"SB270","l":"L7","t":"ESG ratings","f":"t","d":3,"p":"L","sc":"none","s":"True or false: \"In strict ESG terms\", ESG ratings aim to reward firms for doing good for society, regardless of risk.","o":[["True","Feil. Målet er å vurdere risiko for firmaet, ikke å belønne godhet."],["False","Riktig. Målet er å vurdere risiko for firmaet, ikke å belønne godhet."]],"c":[1],"es":"Usant. ESG-ratinger måler risiko for firmaet, ikke godhet.","ed":"Husk: rating = risiko, ikke impact.","kt":"","src":"L7 slide 40"},{"id":"SB271","l":"L7","t":"ESG ratings","f":"t","d":4,"p":"H","sc":"short","s":"True or false: In 2022 Tesla was dropped from an ESG index while ExxonMobil stayed in. This fits the view that ESG ratings often measure ESG risk management relative to the industry, not positive impact.","o":[["True","Riktig. Ratinger måler ofte risiko relativt til bransjen, så et oljeselskap kan score høyt."],["False","Feil. Ratinger måler ofte risiko relativt til bransjen, så et oljeselskap kan score høyt."]],"c":[0],"es":"Sant. Ratinger måler risikostyring mot bransjen, ikke positiv impact.","ed":"Husk: Exxon best i olje, Tesla dårlig på governance.","kt":"Industry-relative (best-in-class) rating: scores a firm against its industry peers rather than across all industries.","src":"L7 slide 37 · Fondsfinans s. 6"},{"id":"SB272","l":"L7","t":"Reporting and materiality","f":"m","d":3,"p":"M","sc":"short","s":"A firm uses little water but operates where water is scarce. Under which framework should it still report on water?","o":[["None","Feil: GRI krever det."],["GRI","Riktig: GRI ser på impact."],["SASB","Feil: SASB er investorfokusert."],["IFRS","Feil: IFRS er finansielt."]],"c":[1],"es":"GRI krever rapportering på vann når firmaet påvirker et tørt område.","ed":"Husk: GRI = impact.","kt":"","src":"Bok s. 161 (6.3.1.3) · Bok s. 158 (Table 6.2)"},{"id":"SB273","l":"L7","t":"Integrated thinking","f":"m","d":3,"p":"M","sc":"none","s":"The IIRC says integrated reporting serves a deeper goal. That goal is:","o":[["Integrated thinking","Riktig: integrated thinking."],["Top ESG ratings for all","Feil: ratinger er ikke målet."],["As many ESG indicators as possible","Feil: IR skal være kort."],["Replacing financial statements","Feil: IR erstatter ikke regnskapet."]],"c":[0],"es":"Målet er integrated thinking.","ed":"Husk: rapporten er et middel til å tenke helhetlig.","kt":"","src":"Bok s. 158 (6.3.1.1) · Bok s. 159 (6.3.1.1) · Bok s. 157 (6.3.1)"},{"id":"SB274","l":"L7","t":"Reporting and value","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Airline A shows photos of tree planting. Airline B reports fuel use per passenger-km, a 2030 green fuel target and the cost impact. Which report helps investors more?","o":[["Neither","Feil: investorer bruker ESG-info."],["Both equally","Feil: kvaliteten er ulik."],["A: the photos show real commitment","Feil: bilder kan ikke sammenlignes."],["B: material data linked to costs","Riktig: B gir tall investorer kan bruke."]],"c":[3],"es":"B gir målbare tall koblet til kostnader.","ed":"Husk: material KPIs > bilder.","kt":"Decision-useful information: material, reliable, comparable and forward-looking data that can change an investor's assessment.","src":"L7 slide 14-15 · Bok s. 160 (6.3.1.2)"},{"id":"CX059","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"Excluding all tobacco and weapons stocks is an example of:","o":[["Negative screening","Utelukke bransjer = negative screening."],["Best-in-class screening","Best-in-class beholder alle bransjer."],["ESG integration","Integration handler om verdsettelse."],["Thematic investing","Tematisk velger et tema aktivt."]],"c":[0],"es":"Ekskludering = negative screening.","ed":"Negative screening er den enkleste SRI-strategien, og den vanligste i SF 1.0.","kt":"","src":"L8 slide 43 · L9 slide 35","k":1},{"id":"CX060","l":"L8","t":"SRI strategies","f":"t","d":2,"p":"H","sc":"none","s":"Does best-in-class screening exclude entire sectors such as oil and gas?","o":[["Yes","Feil. Best-in-class beholder alle bransjer, men velger de beste selskapene i hver."],["No","Riktig. Best-in-class beholder alle bransjer, men velger de beste selskapene i hver."]],"c":[1],"es":"Nei: best-in-class velger de beste innen hver bransje.","ed":"Å fjerne en hel bransje er negative screening. De to kan kombineres.","kt":"","src":"L8 slide 45-52 · Bok s. 189 (7.2.2)","k":1},{"id":"CX061","l":"L8","t":"ESG integration","f":"m","d":2,"p":"H","sc":"short","s":"Lowering a utility's forecast margins for expected carbon costs is an example of:","o":[["Thematic investing","Tematisk investering velger et tema, f.eks. rent vann."],["Negative screening","Ingen selskaper blir ekskludert."],["Impact investing","Målet er ikke å skape målbar positiv effekt."],["ESG integration","ESG-informasjon bygges inn i selve verdsettelsen."]],"c":[3],"es":"ESG i prognosene = ESG integration.","ed":"ESG integration: finn de vesentlige ESG-temaene og legg dem inn i salg, marginer, investeringer eller risiko.","kt":"","src":"Opptak L8 ca. 52 min","k":1},{"id":"CX062","l":"L8","t":"Impact investing","f":"t","d":2,"p":"H","sc":"none","s":"Does impact investing require an intention to create measurable positive impact?","o":[["Yes","Riktig. Intentionality og impact measurement er kjennetegn ved impact investing."],["No","Feil. Intentionality og impact measurement er kjennetegn ved impact investing."]],"c":[0],"es":"Ja: intensjon + måling.","ed":"GIIN: intentionality, return expectations, range of returns and asset classes, impact measurement.","kt":"","src":"L8 slide 61-65 · L8 slide 39","k":1},{"id":"CX063","l":"L8","t":"Impact investing","f":"m","d":2,"p":"H","sc":"none","s":"Impact investing belongs to:","o":[["SF 1.0","SF 1.0 er f.eks. ekskludering."],["Traditional finance","Tradisjonell finans ser bare på avkastning."],["SF 3.0","Impact først, med krav om minimum avkastning = SF 3.0."],["SF 2.0","SF 2.0 er integrated value, f.eks. ESG integration."]],"c":[2],"es":"Impact investing = SF 3.0.","ed":"Impact investing er fortsatt ikke veldedighet: det kreves en finansiell avkastning, men samfunns- og miljøeffekten kommer først.","kt":"","src":"Opptak L8 ca. 67 min · Opptak L9 ca. 85 min","k":1},{"id":"CX064","l":"L8","t":"SFDR","f":"m","d":2,"p":"H","sc":"none","s":"Under the EU's SFDR, the fund type with sustainable investment as its objective is:","o":[["An Article 8 fund","Artikkel 8 fremmer bare E/S-egenskaper (light green)."],["An Article 9 fund","Artikkel 9 = dark green."],["An Article 6 fund","Artikkel 6 har ingen bærekraftsmål."],["An Article 2 fund","Det er ikke en fondskategori."]],"c":[1],"es":"Artikkel 9 = dark green.","ed":"SFDR: artikkel 6 (ingen bærekraftsmål), artikkel 8 (fremmer E/S), artikkel 9 (bærekraftig investering er målet).","kt":"","src":"L8 slide 22-27","k":1},{"id":"CX065","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"short","s":"After years of failed dialogue with a firm, an investor's last step is:","o":[["Asking the miner for a sustainability report","Det er et tidlig steg i dialogen."],["Buying more shares quietly","Det er ikke eskalering."],["Divesting the shares (exit)","Når voice ikke virker, er exit det siste steget."],["Starting a first private meeting","Det er starten på engagement, ikke slutten."]],"c":[2],"es":"Voice først, exit til slutt.","ed":"Eksempel: LGIM og Glencore. Dialog fra 2016, aksjonærforslag i 2023, og salg fra noen fond i 2024.","kt":"","src":"L8 slide 56-58 · L8 slide 71","k":1},{"id":"CX066","l":"L8","t":"Investment industry","f":"m","d":2,"p":"H","sc":"none","s":"An example of an asset owner is:","o":[["A pension fund","Pensjonsfond eier pengene på vegne av sparerne."],["An asset manager hired to run money","Det er en forvalter, ikke en eier."],["An ESG rating agency","De lager ratinger, de eier ikke pengene."],["A proxy advisor","Proxy advisors gir stemmeråd."]],"c":[0],"es":"Pensjonsfond = asset owner.","ed":"Kjeden: sparere → asset owners (pensjonsfond, forsikringsselskaper) → asset managers → selskaper.","kt":"","src":"L8 slide 14 · Bok s. 185 (7.1.4) · Bok s. 185 (Figure 7.1)","k":1},{"id":"CX067","l":"L8","t":"Investment chains","f":"m","d":2,"p":"H","sc":"none","s":"Long investment chains tend to lead to:","o":[["More voting by end savers","Sparerne kommer lenger unna selskapene."],["More short-termism","Hvert ledd måles kortsiktig, og informasjon går tapt."],["Lower agency costs","Flere ledd gir flere agency problems."],["A longer-term focus","Det er motsatt."]],"c":[1],"es":"Lange kjeder = short-termism.","ed":"Boka anbefaler korte kjeder og langsiktige mandater for long-term value creation (LTVC).","kt":"","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 186 (7.1.4) · Bok s. 187 (7.1.4)","k":1},{"id":"EX06","l":"L8","t":"Exam sample: ESG integration","f":"m","d":2,"p":"H","sc":"none","s":"Full ESG integration means:","o":[["Adding an ESG logo to fund marketing","Det er markedsføring, i verste fall greenwashing."],["Building ESG issues into the fundamental analysis and valuation itself","ESG legges inn i selve analysen og verdsettelsen (kontantstrøm, vekst, marginer, risiko)."],["Voting at shareholder meetings","Det er voice/engagement, en annen strategi."],["Excluding all controversial sectors","Det er negative screening."]],"c":[1],"es":"ESG integration = ESG inn i analysen og verdsettelsen.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nSkill strategiene: negative screening (ekskludere), best-in-class (velge de beste per bransje), ESG integration (ESG i verdsettelsen), engagement (voice), impact investing (målbar positiv effekt).","kt":"","src":"Opptak L8 ca. 52 min","k":1,"x":1},{"id":"SB275","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":3,"p":"H","sc":"none","s":"How does the two-stock portfolio problem change when ESG is added?","o":[["The correlation is set to zero","Feil: korrelasjonen er en egenskap ved aksjene og endres ikke."],["The goal becomes minimising emissions only","Feil: avkastning maksimeres fortsatt."],["An emissions limit is added","Riktig: en utslippsgrense legges til."],["Emissions are added to returns","Feil: utslipp er en egen grense, ikke en del av avkastningen."]],"c":[2],"es":"ESG legges til som en egen grense for utslipp i porteføljen.","ed":"Husk: ESG = ekstra constraint, ikke ny avkastning.","kt":"","src":"L8 slide 4-7"},{"id":"SB276","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":4,"p":"M","sc":"none","s":"The \"ESG-efficient frontier\" (Pedersen, Fitzgibbons and Pomorski, 2021) shows:","o":[["that ESG scores say nothing about risk","Feil: ESG kan si noe om fremtiden."],["portfolios with zero emissions","Feil: den dekker alle ESG-nivåer."],["the best Sharpe ratio for each ESG score","Riktig: maks Sharpe per ESG-score."],["that higher ESG always means a higher Sharpe ratio","Feil: ved høyt ESG faller Sharpe."]],"c":[2],"es":"Den viser beste Sharpe ratio for hvert ESG-nivå.","ed":"Husk: for høy ESG-krav senker Sharpe.","kt":"","src":"L8 slide 8"},{"id":"SB277","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"Two stocks: A (10% return, 30 t emissions) and B (5% return, 20 t). An investor holding 50/50 sets a limit of at most 22 t. What happens?","o":[["Nothing changes","Feil: grensen tvinger frem endring."],["It moves toward A","Feil: A har mest utslipp, så du må ha mindre A."],["It moves toward B","Riktig: mer av B for å nå grensen."],["Return rises","Feil: B har lavere avkastning, så avkastningen faller."]],"c":[2],"es":"50/50 gir 25 t. For å nå 22 t må du ha mer B (lav utslipp, lav avkastning).","ed":"Husk: 30w + 20(1−w) ≤ 22 → w(A) ≤ 0,2.","kt":"Binding constraint: a limit that actually changes the optimal solution; its cost is the return given up.","src":"L8 slide 7 · L8 slide 8"},{"id":"SB278","l":"L8","t":"Investment industry","f":"m","d":2,"p":"H","sc":"none","s":"What is the difference between an asset owner and an asset manager?","o":[["The owner owns; the manager invests","Riktig: eier vs forvalter."],["The manager owns them; the owner advises","Feil: rollene er snudd."],["There is no difference","Feil: de er forskjellige ledd."],["Owners buy only bonds; managers buy only stocks","Feil: begge kan bruke alle aktivaklasser."]],"c":[0],"es":"Owner eier pengene, manager investerer for dem.","ed":"Husk: owner = principal, manager = agent.","kt":"","src":"L8 slide 14 · Bok s. 185 (7.1.4) · Bok s. 185 (Figure 7.1)"},{"id":"SB279","l":"L8","t":"Investment industry","f":"m","d":3,"p":"M","sc":"short","s":"Many asset managers launched ESG funds when demand surged in 2020-21, then dropped the label when US political backlash grew. Why?","o":[["Regulators required ESG funds","Feil: det fantes ikke et slikt krav."],["Labels do not affect money flows","Feil: merkelapper påvirker pengestrømmer."],["ESG funds pay no fees","Feil: ESG-fond tar gebyrer."],["Fees depend on assets under management","Riktig: gebyr følger AUM."]],"c":[3],"es":"Gebyrene avhenger av hvor mye penger de forvalter, så de følger kundenes penger.","ed":"Husk: AUM styrer produktvalg.","kt":"Assets under management (AUM): the value of assets a manager runs; most revenues are fees proportional to AUM.","src":"L8 slide 17 · L8 slide 36 · Fondsfinans s. 10"},{"id":"SB280","l":"L8","t":"Investment industry","f":"m","d":3,"p":"M","sc":"none","s":"Which is a material issue for asset managers (SASB)?","o":[["Systemic risk management","Riktig: systemrisiko."],["Tailings dam management","Feil: det er for gruveselskaper."],["Product safety recalls","Feil: ikke for forvaltere."],["Water management at production sites","Feil: ikke for forvalterens egen drift."]],"c":[0],"es":"Systemic risk management er material for forvaltere.","ed":"Husk: tenk på hva som er relevant for bransjen.","kt":"","src":"L8 slide 19-21"},{"id":"SB281","l":"L8","t":"SFDR","f":"m","d":2,"p":"H","sc":"none","s":"How do SFDR Article 8 and Article 9 funds differ?","o":[["Article 9 funds may not engage","Feil: Article 9-fond engasjerer ofte."],["Art. 9 has a sustainable goal; Art. 8 does not","Riktig: 9 har mål, 8 fremmer."],["Art. 9 promotes E/S; Art. 8 has impact goals","Feil: definisjonene er snudd."],["Art. 8 funds disclose nothing","Feil: Article 8 har krav om rapportering."]],"c":[1],"es":"Article 9 har et bærekraftig mål. Article 8 fremmer bare E/S.","ed":"Husk: 9 = mål, 8 = fremmer.","kt":"","src":"L8 slide 22-27"},{"id":"SB282","l":"L8","t":"SFDR","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Many funds were recently moved from Article 8 to Article 9 to use the stricter label for marketing.","o":[["True","Feil. Mange fond ble flyttet fra 9 til 8, for å unngå anklager om greenwashing."],["False","Riktig. Mange fond ble flyttet fra 9 til 8, for å unngå anklager om greenwashing."]],"c":[1],"es":"Usant. Det var motsatt: mange gikk fra Article 9 ned til Article 8.","ed":"Husk: nedgradering for å unngå greenwashing-anklager.","kt":"","src":"L8 slide 26 · L8 slide 19"},{"id":"SB283","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A church foundation will never own weapons or tobacco stocks, but otherwise wants market returns at low cost. Which strategy fits?","o":[["Impact investing","Feil: dyrere og mer enn kunden ba om."],["Active ESG integration","Feil: dyrere enn nødvendig."],["A clean-water theme fund","Feil: for konsentrert."],["Negative screening","Riktig: negative screening."]],"c":[3],"es":"Utelukke våpen og tobakk, ellers markedet billig = negative screening.","ed":"Husk: verdier + lav kostnad = exclusion.","kt":"Negative screening: excluding companies or sectors based on ethical or risk criteria.","src":"L8 slide 43 · L9 slide 35"},{"id":"SB284","l":"L8","t":"Drivers of responsible investment","f":"m","d":3,"p":"H","sc":"none","s":"What did Hartzmark and Sussman (2019) find when Morningstar introduced sustainability ratings?","o":[["Top-rated funds earned much more","Feil: de gjorde det ikke bedre."],["Money left top-rated funds","Feil: de fikk inn penger."],["Ratings had no effect","Feil: effekten var sterk."],["Money moved into top-rated funds","Riktig: penger inn i toppfond."]],"c":[3],"es":"Pengene strømmet inn i fond med høy rating.","ed":"Husk: merkelapper flytter penger, ikke avkastning.","kt":"","src":"L8 slide 36 · L8 slide 35"},{"id":"SB285","l":"L8","t":"Drivers of responsible investment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Riedl and Smeets (2017) find that investors hold SRI funds mainly because they expect higher returns.","o":[["True","Feil. Sosiale preferanser forklarer SRI. Investorene forventer faktisk lavere avkastning."],["False","Riktig. Sosiale preferanser forklarer SRI. Investorene forventer faktisk lavere avkastning."]],"c":[1],"es":"Usant. SRI-investorer har sosiale preferanser og forventer faktisk lavere avkastning.","ed":"Husk: values, ikke value.","kt":"","src":"L8 slide 35 · Starks s. 1838"},{"id":"SB286","l":"L8","t":"Investor motives","f":"m","d":3,"p":"M","sc":"short","s":"Most professionals use ESG information mainly because it is financially material. How should ESG information be presented to them?","o":[["Linked to risk and growth","Riktig: koblet til risiko og vekst."],["As moral arguments only","Feil: etikk er et mindre vanlig motiv."],["Without numbers","Feil: de vil ha tall."],["As long lists of indicators","Feil: lange lister er hovedklagen."]],"c":[0],"es":"Koble ESG til risiko og vekst.","ed":"Husk: profesjonelle vil ha finansiell relevans.","kt":"Financial materiality: the extent to which an ESG issue affects a company's cash flows, risk or cost of capital.","src":"L8 slide 37-38 · Bok s. 226 (8.3)"},{"id":"SB287","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"Negative (exclusionary) screening means:","o":[["Ruling out \"bad\" investments","Riktig: utelukke."],["Picking firms that gain from green trends","Feil: det er thematic."],["Picking the top ESG firms in each sector","Feil: det er best-in-class."],["Using votes and dialogue","Feil: det er engagement."]],"c":[0],"es":"Negative screening = utelukke \"dårlige\" investeringer.","ed":"Husk: negative = ut.","kt":"","src":"L8 slide 43-44 · Bok s. 189 (7.2.2) · Bok s. 194 (7.3.3)"},{"id":"SB288","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"H","sc":"short","s":"Fund 1 invests only in firms that gain from the clean water trend. Fund 2 keeps the top 30% ESG firms in each sector. Which labels fit?","o":[["Impact; ESG integration","Feil: ingen målt impact eller integrering."],["Thematic; best-in-class","Riktig: thematic og best-in-class."],["Best-in-class; thematic","Feil: paret er snudd."],["Both are negative screening","Feil: ingen av dem utelukker."]],"c":[1],"es":"Fond 1 følger et tema (thematic). Fond 2 velger de beste i hver sektor (best-in-class).","ed":"Husk: tema = thematic. Topp i sektor = best-in-class.","kt":"","src":"L8 slide 45-52 · Bok s. 189 (7.2.2)"},{"id":"SB289","l":"L8","t":"SRI strategies","f":"t","d":2,"p":"H","sc":"none","s":"True or false: ESG integration means finding material ESG information and using it in the analysis, for example in cash flow forecasts or the cost of capital.","o":[["True","Riktig. Dette er definisjonen: bruke material ESG-info i verdsettelsen."],["False","Feil. Dette er definisjonen: bruke material ESG-info i verdsettelsen."]],"c":[0],"es":"Sant. ESG integration = bruke material ESG-info i analysen.","ed":"Husk: inn i cash flow eller diskonteringsrente.","kt":"","src":"L8 slide 53-55 · Bok s. 189 (7.2.2) · L9 slide 7"},{"id":"SB290","l":"L8","t":"SRI strategies","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"LGIM engaged with Glencore on climate from 2016, filed a shareholder proposal in 2023, and sold Glencore from some funds in 2024. What does this show?","o":[["Moving from voice to exit","Riktig: voice til exit."],["Passive investing","Feil: LGIM var aktiv."],["Impact investing","Feil: Glencore er børsnotert."],["Negative screening from the start","Feil: exit kom først etter mange år."]],"c":[0],"es":"LGIM gikk fra dialog (voice) til salg (exit).","ed":"Husk: escalation: dialog → forslag → exit.","kt":"","src":"L8 slide 56-58 · L8 slide 71"},{"id":"SB291","l":"L8","t":"Active ownership","f":"m","d":4,"p":"H","sc":"none","s":"Dimson, Karakaş and Li (2015) find that:","o":[["engagement has no effect","Feil: det har effekt."],["successful engagement raises returns","Riktig: vellykket engagement gir avkastning."],["engagement only works for majority owners","Feil: små eiere kan lykkes."],["engagement destroys value","Feil: effekten er positiv."]],"c":[1],"es":"Vellykket engagement gir høyere avkastning.","ed":"Husk: Dimson et al. = positiv effekt.","kt":"","src":"L8 slide 60 · Bok s. 194 (7.3.4) · Bok s. 203 (7.4.3)"},{"id":"SB292","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"What makes impact investing different from the other SRI strategies?","o":[["It works only in listed stocks","Feil: ofte private equity."],["Planned, measured impact","Riktig: planlagt og målt."],["It always accepts a zero return","Feil: det søker også avkastning."],["It only excludes sin stocks","Feil: det er negative screening."]],"c":[1],"es":"Impact investing = planlagt og målt impact.","ed":"Husk: intention + measurement.","kt":"","src":"L8 slide 61-65 · L8 slide 39"},{"id":"SB293","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about SRI strategies is correct?","o":[["Thematic and best-in-class are the same","Feil: de er ulike."],["ESG integration excludes all below-average firms","Feil: integration utelukker ikke."],["Negative screening measures every impact","Feil: screening måler ikke impact."],["Impact investing measures impact most","Riktig: impact måler mest."]],"c":[3],"es":"Impact investing har mest fokus på å måle impact.","ed":"Husk: impact er mest ambisiøst.","kt":"","src":"L8 slide 39-42 · L8 slide 56 · L8 slide 65"},{"id":"SB294","l":"L8","t":"Barriers to integration","f":"m","d":3,"p":"H","sc":"none","s":"Why is the efficient market hypothesis a barrier to integrating sustainability?","o":[["EMH requires concentrated portfolios","Feil: EMH gir markedsporteføljen."],["EMH forbids using the share price","Feil: EMH gjør aksjekursen sentral."],["EMH proves green firms do worse","Feil: EMH sier ikke det."],["It makes passive investing seem best","Riktig: passiv virker best."]],"c":[3],"es":"EMH gjør passiv investering til det beste valget, så ingen analyserer bærekraft.","ed":"Husk: EMH → passiv.","kt":"","src":"L8 slide 66-68 · Bok s. 181 (7.1.1) · Bok s. 182 (7.1.1) · Bok s. 189 (7.3.1)"},{"id":"SB295","l":"L8","t":"Barriers to integration","f":"m","d":3,"p":"M","sc":"none","s":"An asset has an expected return below the security market line (α < 0). What happens in an efficient market?","o":[["It is overpriced, so its price falls","Riktig: overpriset, prisen faller."],["Investors buy it","Feil: negativ alfa er dårlig."],["Nothing happens","Feil: SML gjelder alle."],["It is underpriced, so its price rises","Feil: den er overpriset."]],"c":[0],"es":"Under SML = for lav avkastning for risikoen = overpriset. Prisen faller.","ed":"Husk: α < 0 = overpriset.","kt":"","src":"L8 slide 67 · Bok s. 182 (7.1.2) · Bok s. 183 (7.1.2)"},{"id":"SB296","l":"L8","t":"Market framework","f":"m","d":3,"p":"H","sc":"none","s":"Traditional investing (SF 1.0) vs investing for LTVC (SF 2.0). Which pairing is correct?","o":[["Portfolios: broad vs focused","Riktig: bred vs fokusert."],["Chains: short vs long","Feil: paret er snudd."],["Dialogue: deep vs limited","Feil: paret er snudd."],["Horizon: decades vs 12 months","Feil: paret er snudd."]],"c":[0],"es":"Tradisjonell = bred portefølje. LTVC = fokusert.","ed":"Husk: LTVC = fokusert, lang horisont, kort kjede, dyp dialog.","kt":"","src":"Bok s. 180 (Table 7.1) · L8 slide 74"},{"id":"SB297","l":"L8","t":"Adaptive markets hypothesis","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Under the adaptive markets hypothesis, how fast climate risks get priced depends on how many analysts study them and how well they learn.","o":[["True","Riktig. AMH sier at ny risiko prises etter hvert som flere analyserer den."],["False","Feil. AMH sier at ny risiko prises etter hvert som flere analyserer den."]],"c":[0],"es":"Sant. Under AMH avhenger prisingen av hvor mange som studerer risikoen.","ed":"Husk: AMH = markedet lærer.","kt":"","src":"Bok s. 189 (7.3.1) · Bok s. 190 (7.3.1) · Bok s. 192 (Figure 7.3)"},{"id":"SB298","l":"L8","t":"Performance measurement","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about fund performance measures is correct?","o":[["They capture social and environmental value","Feil: målene er rent finansielle."],["A beta below 1 means a defensive fund","Riktig: defensivt."],["Low tracking error means a big deviation from the index","Feil: lav tracking error = nær indeksen."],["The Sharpe ratio compares only with the index","Feil: Sharpe bruker risikofri rente."]],"c":[1],"es":"Beta under 1 = fondet svinger mindre enn markedet (defensivt).","ed":"Husk: beta = følsomhet for markedet.","kt":"Tracking error: volatility of a fund's returns relative to its benchmark; information ratio: excess return per unit of tracking error.","src":"Bok s. 183 (7.1.3) · Bok s. 184 (Table 7.2)"},{"id":"SB299","l":"L8","t":"Performance measurement","f":"m","d":3,"p":"H","sc":"extended_course_case","s":"Norway limits the oil fund's (NBIM's) tracking error to about 1%. What follows from this?","o":[["It can freely make impact investments","Feil: grensen hindrer store avvik."],["It is sure to beat its benchmark","Feil: det garanterer ingenting."],["Little room for active choices","Riktig: lite rom."],["It must hold about 100 stocks","Feil: det betyr mange aksjer."]],"c":[2],"es":"1 % tracking error gir lite rom for aktive valg.","ed":"Husk: lav TE = nær indeks.","kt":"","src":"Bok s. 186 (Box 7.1) · L8 slide 15 · L8 slide 72"},{"id":"SB300","l":"L8","t":"Voice vs exit","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: An index fund tracking the Oslo index can credibly threaten to sell a company's shares if it dislikes its climate strategy.","o":[["True","Feil. Et indeksfond må eie alle selskapene, så exit er ikke et troverdig verktøy."],["False","Riktig. Et indeksfond må eie alle selskapene, så exit er ikke et troverdig verktøy."]],"c":[1],"es":"Usant. Et indeksfond må eie alle i indeksen, så det kan ikke true med salg.","ed":"Husk: passiv = voice, ikke exit.","kt":"Exit (\"Wall Street walk\"): selling shares to signal dissatisfaction or pressure management.","src":"L8 slide 71 · Bok s. 194 (7.3.4)"},{"id":"SB301","l":"L8","t":"Investment chains","f":"m","d":3,"p":"H","sc":"none","s":"Why do long investment chains increase short-termism?","o":[["Managers must sell within 12 months","Feil: det finnes ikke et slikt krav."],["Savers want quarterly payouts","Feil: sparerne har lang horisont."],["Each link is judged short-term","Riktig: hvert ledd vurderes kortsiktig."],["They always include high-speed traders","Feil: problemet er delegering."]],"c":[2],"es":"Hvert ledd blir vurdert kortsiktig, så horisonten krymper.","ed":"Husk: lang kjede = kort horisont.","kt":"","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 186 (7.1.4) · Bok s. 187 (7.1.4)"},{"id":"SB302","l":"L8","t":"ESG ratings limitations","f":"m","d":3,"p":"H","sc":"none","s":"A design weakness of ESG ratings is that:","o":[["the big agencies always agree","Feil: de er lite enige."],["even coal firms can score well","Riktig: kull kan score høyt."],["they are far too expensive","Feil: problemet er for lite ressurser."],["they rely too much on site visits","Feil: de bruker rapporterte data."]],"c":[1],"es":"Selv kullselskaper kan få god rating.","ed":"Husk: ratinger måler risiko relativt.","kt":"","src":"L8 slide 73 · Bok s. 187 (7.2) · Bok s. 187 (7.2.1) · Bok s. 188 (7.2.1)"},{"id":"SB303","l":"L8","t":"ESG ratings limitations","f":"m","d":3,"p":"M","sc":"none","s":"How do investors' uses of ESG ratings fit the SF stages?","o":[["Positive screening is SF 2.0","Feil: det kalles SF 1.5."],["All rating-based strategies are SF 3.0","Feil: ratinger måler ikke impact."],["Exclusion 1.0, integration 2.0","Riktig: 1.0 og 2.0."],["Negative screening is SF 3.0","Feil: exclusion er SF 1.0."]],"c":[2],"es":"Exclusion = SF 1.0, integration = SF 2.0.","ed":"Husk: positive screening med ratinger ≈ SF 1.5.","kt":"","src":"Bok s. 189 (7.2.2) · L1 slide 30"},{"id":"SB304","l":"L8","t":"Active investment approach","f":"m","d":4,"p":"H","sc":"none","s":"Why is analysing a firm's transition readiness nearly impossible for passive and quant funds?","o":[["ESG ratings already capture it","Feil: ratinger fanger det dårlig."],["Quant always wins","Feil: quant er et supplement."],["It needs firm-specific judgement","Riktig: firmaspesifikt skjønn."],["They are not allowed to use ESG data","Feil: det finnes ikke et slikt forbud."]],"c":[2],"es":"Det krever skjønn om hvert enkelt firma.","ed":"Husk: fundamental analyse.","kt":"","src":"Bok s. 190 (7.3.2) · Bok s. 191 (Figure 7.2) · Bok s. 191 (7.3.2)"},{"id":"SB305","l":"L8","t":"Active investment approach","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A portfolio needs at least 1,000 stocks to remove most firm-specific risk, so concentrated portfolios are always poorly diversified.","o":[["True","Feil. 50–100 aksjer er nok til å fjerne det meste av firmaspesifikk risiko."],["False","Riktig. 50–100 aksjer er nok til å fjerne det meste av firmaspesifikk risiko."]],"c":[1],"es":"Usant. 50–100 aksjer fjerner det meste av firmarisikoen.","ed":"Husk: Statman = 50–100.","kt":"","src":"Bok s. 193 (7.3.3) · Bok s. 193 (Figure 7.4) · Bok s. 194 (7.3.3)"},{"id":"SB306","l":"L8","t":"Active investment approach","f":"m","d":2,"p":"M","sc":"none","s":"How does too much diversification create a free-rider problem?","o":[["They free-ride on the CAPM","Feil: det handler om overvåking."],["Tiny stakes mean nobody monitors","Riktig: ingen overvåker."],["They pay no tax on dividends","Feil: skatt er irrelevant."],["Index funds can borrow more cheaply","Feil: irrelevant."]],"c":[1],"es":"Små eierandeler gjør at ingen gidder å overvåke.","ed":"Husk: free rider = andre gjør jobben.","kt":"","src":"Bok s. 194 (7.3.3) · Bok s. 205 (Box 7.3) · L5 slide 9"},{"id":"SB307","l":"L8","t":"Alternative performance measures","f":"m","d":3,"p":"M","sc":"none","s":"Instead of one market benchmark, what does the textbook suggest for judging a fund?","o":[["The firms' earnings per share","Feil: EPS er tradisjonelt."],["Several sector indices","Riktig: sektorindekser."],["The number of trades","Feil: ikke et mål."],["Daily tracking error","Feil: det kritiseres."]],"c":[1],"es":"Bruk flere sektorindekser i stedet for én.","ed":"Husk: bedre sammenligning.","kt":"","src":"Bok s. 195 (7.3.5) · Bok s. 196 (Table 7.3) · Bok s. 196 (Table 7.4)"},{"id":"SB308","l":"L8","t":"Alternative performance measures","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"A mining firm sells its underground mines in a developing country, and its injury rate (LTIFR) falls sharply. What does this show?","o":[["Safety at the other mines clearly improved","Feil: forbedringen kom fra salget."],["It may reflect selling risky mines","Riktig: salg av risikable gruver."],["Safety KPIs do not matter","Feil: sikkerhet er viktig i gruvedrift."],["The number is fully reliable","Feil: KPI-er er vanskelige å sammenligne."]],"c":[1],"es":"Tallet falt fordi de solgte risikable gruver, ikke fordi sikkerheten ble bedre.","ed":"Husk: sjekk hvorfor en KPI endres.","kt":"","src":"Bok s. 197 (7.3.6.1) · Bok s. 198 (7.3.6.1)"},{"id":"SB309","l":"L8","t":"Alternative performance measures","f":"m","d":3,"p":"M","sc":"none","s":"KPMG's True Value method has three steps. Which order is correct?","o":[["SDG target → offsets → report","Feil: ikke stegene."],["True earnings → at risk → business cases","Riktig: de tre stegene."],["Beta → tracking error → information ratio","Feil: tradisjonelle mål."],["Exclude → rank → invest","Feil: screening."]],"c":[1],"es":"True earnings → earnings at risk → business cases.","ed":"Husk: KPMG True Value.","kt":"","src":"Bok s. 199 (Box 7.2) · Bok s. 198 (7.3.6.2) · L3 slide 17"},{"id":"SB310","l":"L8","t":"SDG tagging","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"A fund tags its holdings: a hospital (+SDG 3), a coal miner (−SDG 13) and a bank (neutral). What can it learn?","o":[["Nothing","Feil: det kobler firmaer til SDG-er."],["Each firm's exact impact","Feil: det er ikke presis måling."],["A rough SDG picture","Riktig: grovt bilde."],["The firms' credit ratings","Feil: det er ikke kredittrisiko."]],"c":[2],"es":"Tagging gir et grovt SDG-bilde.","ed":"Husk: tagging er kvalitativt.","kt":"SDG tagging: marking holdings as positive, neutral or negative for each SDG to estimate a portfolio's exposure.","src":"Bok s. 200 (7.3.6.3)"},{"id":"SB311","l":"L8","t":"Conditions for LTVC","f":"m","d":2,"p":"H","sc":"none","s":"Which is a condition for investing for long-term value creation (De Jong et al., 2017)?","o":[["Keep the investment chain short","Riktig: kort kjede."],["Leave engagement to proxy advisors","Feil: engagement bør gjøres selv."],["Stay close to the market index","Feil: tett mot indeks hindrer LTVC."],["Judge managers quarterly","Feil: vurder over lengre tid."]],"c":[0],"es":"Hold investeringskjeden kort.","ed":"Husk: kort kjede = lang horisont.","kt":"","src":"Bok s. 202 (7.4) · Bok s. 202 (Figure 7.6) · Bok s. 204 (7.4.5) · Bok s. 204 (7.4.6) · L8 slide 74"},{"id":"SB312","l":"L8","t":"Conditions for LTVC","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"Swedish pension fund Alecta holds about 104 stocks for 15-20 years, does its own analysis and engagement, and has costs of 0.09%. What does this show?","o":[["Long-term investors must outsource analysis","Feil: Alecta gjør egen analyse."],["104 stocks is not diversified enough","Feil: 50–100 aksjer er nok."],["Focused investing can be cheap","Riktig: fokusert og billig."],["Active management is always more expensive","Feil: Alecta er billig."]],"c":[2],"es":"Fokusert investering kan være billig.","ed":"Husk: Alecta = få aksjer, lang tid, lave kostnader.","kt":"","src":"Bok s. 205 (Box 7.3) · Bok s. 204 (7.4.6)"},{"id":"SB313","l":"L8","t":"Ideal investment chain","f":"m","d":4,"p":"M","sc":"none","s":"In the textbook's \"often observed\" investment chain, a typical company:","o":[["maximises EPS and has short-term pay","Riktig: EPS og kortsiktig lønn."],["hires many asset managers","Feil: det beskriver asset owner."],["maximises integrated value over decades","Feil: det er \"ideally\"."],["holds many small stakes","Feil: det beskriver asset manager."]],"c":[0],"es":"Typisk firma maksimerer EPS og har kortsiktig lønn.","ed":"Husk: \"often\" = kortsiktig, \"ideally\" = integrated value.","kt":"","src":"Bok s. 200 (7.3.7) · Bok s. 201 (Figure 7.5)"},{"id":"SB314","l":"L8","t":"UN PRI","f":"m","d":2,"p":"M","sc":"none","s":"Which is one of the six UN Principles for Responsible Investment (PRI)?","o":[["Guarantee returns above the market","Feil: PRI lover ikke avkastning."],["Invest only in Article 9 funds","Feil: SFDR er ikke del av PRI."],["Be active owners and use ESG","Riktig: aktive eiere."],["Sell all fossil fuel firms","Feil: PRI krever ikke salg."]],"c":[2],"es":"PRI: vær aktive eiere og bruk ESG.","ed":"Husk: PRI handler om å inkludere ESG.","kt":"","src":"L8 slide 75-76"},{"id":"SB315","l":"L8","t":"Integrated LTVC investing","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A pension fund tracks an ESG index closely, judges its manager quarterly and follows proxy advisors' votes. Which change moves it MOST towards long-term value creation?","o":[["A focused, engaged mandate","Riktig: fokusert og engasjert."],["A rating provider that gives higher scores","Feil: ny rating endrer lite."],["A tighter tracking error limit","Feil: det gjør porteføljen mer passiv."],["More external managers","Feil: det forlenger kjeden."]],"c":[0],"es":"Et fokusert, engasjert mandat flytter mest mot LTVC.","ed":"Husk: foku
