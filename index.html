g: han spør hva en person med god karakter ville gjort."],["Discourse ethics","Feil: discourse ethics ville samlet de berørte til dialog."],["Ethical relativism","Feil: relativism ville fulgt lokale normer."],["Act utilitarianism","Feil: act utilitarianism ville regnet nytte mot skade."]],"c":[0],"es":"\"Hva ville en ærlig og modig person gjort?\" er virtue ethics.","ed":"Husk: virtue = karakter.","kt":"","src":"L2 slide 10 · Crane s. 31 · Crane s. 32"},{"id":"SB049","l":"L2","t":"Alternative ethical theories","f":"t","d":3,"p":"M","sc":"none","s":"True or false: An ethic of care says that universal, impartial rules should always come before the needs of specific people.","o":[["True","Feil. Ethics of care prioriterer konkrete relasjoner, ikke upersonlige universelle regler."],["False","Riktig. Ethics of care prioriterer konkrete relasjoner, ikke upersonlige universelle regler."]],"c":[1],"es":"Usant. Ethics of care setter relasjoner og konkrete personer foran universelle regler.","ed":"Husk: care = nære relasjoner teller ekstra.","kt":"","src":"L2 slide 10 · Crane s. 35 · Crane s. 36"},{"id":"SB050","l":"L2","t":"Alternative ethical theories","f":"m","d":4,"p":"M","sc":"none","s":"According to Bauman's postmodern ethics, strict rules in large organisations can harm moral behaviour because:","o":[["People follow rules and lose sight of victims","Riktig: regler erstatter egen moral, og ofrene blir usynlige."],["Managers become too emotional","Feil: postmodern ethics ønsker følelser velkommen."],["Managers must weigh every pleasure and every pain","Feil: dette er kritikk av utilitarianism."],["Stakeholders get too much say","Feil: Bauman handler om individets moral, ikke stakeholders."]],"c":[0],"es":"Folk følger reglene og slutter å se ofrene.","ed":"Husk: Bauman = regler kveler den moralske impulsen.","kt":"","src":"L2 slide 10 · Crane s. 39 · Crane s. 84"},{"id":"SB051","l":"L2","t":"Ethical pluralism","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Crane et al. recommend choosing one best ethical theory and using it for every business problem.","o":[["True","Feil. Crane et al. anbefaler å kombinere teoriene, ikke velge én."],["False","Riktig. Crane et al. anbefaler å kombinere teoriene, ikke velge én."]],"c":[1],"es":"Usant. De anbefaler å bruke flere teorier sammen (en \"prism\", ikke én \"lens\").","ed":"Husk: pluralism = bruk flere teorier.","kt":"","src":"Crane s. 41 · Crane s. 42 · Crane s. 43"},{"id":"SB052","l":"L2","t":"Ethical pluralism","f":"m","d":3,"p":"H","sc":"none","s":"Crane et al. turn each theory into a question a manager might ask. Which pairing is correct?","o":[["\"What does my gut tell me?\" - rights","Feil: magefølelse er postmodern ethics."],["\"What if everybody did this?\" - duty","Riktig: dette er Kant sin test."],["\"Does this protect relationships?\" - utilitarianism","Feil: relasjoner er ethics of care."],["\"Am I treating everyone fairly?\" - egoism","Feil: rettferdighet er justice, ikke egoism."]],"c":[1],"es":"\"Hva hvis alle gjorde dette?\" = duty (Kant).","ed":"Husk: gut = postmodern, relasjoner = care, rettferdig = justice.","kt":"","src":"Crane s. 43 · L2 slide 9-10"},{"id":"SB053","l":"L2","t":"Ethical theories applied: Tesla case","f":"m","d":5,"p":"H","sc":"extended_course_case","s":"During COVID-19, Elon Musk reopened a Tesla factory against state orders. Which evaluation is correct?","o":[["Discourse ethics approves, since he announced it","Feil: discourse ethics krever dialog, ikke bare en kunngjøring."],["An ethic of care would look only at shareholders","Feil: care ser på relasjoner til de berørte, ikke bare eiere."],["Kant asks: could all firms do this?","Riktig: dette er Kant sin test."],["Relativism says it broke universal laws","Feil: relativism tror ikke på universelle lover."]],"c":[2],"es":"Kant spør: kan alle firmaer gjøre dette? Hvis ikke, er det galt.","ed":"Husk: Kant = universalisability-test.","kt":"","src":"L2 slide 2-3 · L2 slide 9-11 · L2 slide 22"},{"id":"SB054","l":"L2","t":"Ethical decision-making","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank employee sells complex products to elderly customers to hit targets, without seeing it as an ethical issue. Where does the decision process fail first?","o":[["Recognising the moral issue","Riktig: hun ser ikke at det er et etisk spørsmål."],["Moral judgement","Feil: judgement kommer etter at man har sett problemet."],["Establishing a moral intent to act","Feil: intent kommer enda senere."],["Moral behaviour","Feil: det svikter allerede i første steg."]],"c":[0],"es":"Hun ser ikke engang at det er et etisk problem. Første steg feiler.","ed":"Husk rekkefølgen: recognise → judge → intent → behaviour.","kt":"Ethical decision-making stages: recognise the issue → make a judgement → establish intent → act.","src":"L2 slide 14 · Crane s. 36"},{"id":"SB055","l":"L2","t":"Ethical decision-making model","f":"t","d":2,"p":"M","sc":"none","s":"True or false: In Schwartz (2016), the rationalist view stresses quick gut feelings, while the intuitionist view stresses careful logical reasoning.","o":[["True","Feil. Merkelappene er byttet om. Rationalist = logisk resonnering, intuitionist = rask magefølelse."],["False","Riktig. Merkelappene er byttet om. Rationalist = logisk resonnering, intuitionist = rask magefølelse."]],"c":[1],"es":"Usant. Det er motsatt: rationalist = logikk, intuitionist = magefølelse.","ed":"Husk: rational = regne, intuition = føle.","kt":"","src":"L2 slide 13"},{"id":"SB056","l":"L2","t":"Ethical decision-making","f":"m","d":3,"p":"M","sc":"short","s":"An analyst finds fake ESG data but says: \"Nothing I do will change anything; it is up to the bosses.\" This shows:","o":[["An external locus of control","Riktig: hun tror andre kontrollerer utfallet."],["High moral imagination","Feil: moral imagination ville hjulpet henne å se muligheter."],["An internal locus of control","Feil: internal betyr at man tror man kan påvirke."],["Strong personal integrity","Feil: integritet ville fått henne til å handle."]],"c":[0],"es":"\"Det er opp til sjefene\" = hun tror andre styrer utfallet. Det er external locus of control.","ed":"Husk: external = andre bestemmer. Internal = jeg kan påvirke.","kt":"Locus of control: the extent to which a person believes they control events in their life (internal) or that outside forces do (external).","src":"L2 slide 15"},{"id":"SB057","l":"L2","t":"Individual factors","f":"m","d":4,"p":"M","sc":"none","s":"What do Crane et al. find about individual factors in ethical decisions?","o":[["Locus of control has a strong, proven effect","Feil: locus of control har bare begrenset effekt."],["Values matter; age and gender unclear","Riktig: verdier påvirker, alder og kjønn er uklart."],["Gender is the strongest factor","Feil: studiene om kjønn spriker."],["Moral development has no effect","Feil: moral development har en liten effekt."]],"c":[1],"es":"Personlige verdier betyr noe. Alder og kjønn har uklar effekt.","ed":"Husk: values = tydelig effekt. Alder og kjønn = uklart.","kt":"","src":"Crane s. 61 · L2 slide 15"},{"id":"SB058","l":"L2","t":"Cognitive moral development","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An employee uses the office printer for private jobs and says: \"Everyone in my department does it.\" Which CMD level is this?","o":[["Conventional (fitting in with others)","Riktig: han følger det kollegene gjør."],["Post-conventional (social contract)","Feil: social contract handler om rettigheter og samfunnets avtale."],["Post-conventional (universal principles)","Feil: universelle prinsipper er egne prinsipper som rettferdighet."],["Pre-conventional (avoiding punishment)","Feil: pre-conventional handler om å unngå straff."]],"c":[0],"es":"\"Alle i avdelingen gjør det\" = følge gruppen. Det er conventional level.","ed":"Husk: pre = straff, conventional = andre, post = egne prinsipper.","kt":"","src":"L2 slide 16-17 · Crane s. 64 · Crane s. 65"},{"id":"SB059","l":"L2","t":"Cognitive moral development","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Since most people reason at the conventional level, the work context (peers, managers, culture) matters a lot for ethical decisions.","o":[["True","Riktig. De fleste er på conventional level og følger det kolleger og sjefer forventer."],["False","Feil. De fleste er på conventional level og følger det kolleger og sjefer forventer."]],"c":[0],"es":"Sant. De fleste følger omgivelsene, så arbeidsmiljøet betyr mye.","ed":"Husk: conventional = vi gjør som de rundt oss.","kt":"","src":"Crane s. 73 · Crane s. 67 · L2 slide 19"},{"id":"SB060","l":"L2","t":"Whistleblowing","f":"m","d":3,"p":"M","sc":"short","s":"In the Wirecard case, warnings came for years, but the regulator investigated journalists instead of the company. This shows:","o":[["Why whistleblowers need protection","Riktig: uten beskyttelse ble varslene ignorert."],["That auditors never miss fraud","Feil: revisoren oversåg svindelen i flere år."],["That short sellers are always wrong about accounting fraud","Feil: her hadde short sellers rett."],["That fraud only happens in emerging markets","Feil: Wirecard var et stort tysk selskap."]],"c":[0],"es":"Advarslene ble ignorert. Det viser hvorfor whistleblowers trenger beskyttelse.","ed":"Husk: Wirecard = tilsynet gikk etter varslerne, ikke firmaet.","kt":"Whistleblowing: disclosure by an insider of wrongdoing to people able to act on it; it often requires legal protection against retaliation.","src":"L2 slide 18"},{"id":"SB061","l":"L2","t":"Moral intensity","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of Jones' (1991) six factors of moral intensity?","o":[["Moral muteness","Feil: moral muteness handler om språk, ikke intensitet."],["Temporal immediacy","Riktig: hvor raskt skaden kommer."],["Locus of control","Feil: locus of control er en individfaktor."],["Return on equity","Feil: ROE er ikke en del av moral intensity."]],"c":[1],"es":"Temporal immediacy (hvor fort konsekvensene kommer) er en av de seks faktorene.","ed":"Husk: moral intensity = hvor alvorlig saken føles (størrelse, nærhet, tid osv.).","kt":"","src":"L2 slide 20 · Crane s. 76"},{"id":"SB062","l":"L2","t":"Moral intensity","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"The Rana Plaza collapse (2013) killed over 1,100 workers far from Western consumers. Why did it still feel so intense?","o":[["Small harm, but very likely","Feil: skaden var enorm, ikke liten."],["Big, sudden harm, made close by known brands","Riktig: stor og plutselig skade, gjort nær av kjente merker."],["Nobody agreed it was wrong","Feil: det var bred enighet om at det var galt."],["The harm was spread out and far in the future","Feil: skaden var samlet og skjedde med en gang."]],"c":[1],"es":"Stor, plutselig skade, og kjente merker gjorde den nær oss.","ed":"Husk: magnitude + immediacy + proximity = høy moral intensity.","kt":"","src":"Crane s. 77 · Bok s. 7 (Box 1.2) · L2 slide 20"},{"id":"SB063","l":"L2","t":"Moral framing","f":"m","d":3,"p":"H","sc":"none","s":"Managers often avoid moral language (\"moral muteness\"). One reason is a perceived threat to:","o":[["Harmony at work","Riktig: man frykter krangel og fingerpeking."],["The firm's credit rating","Feil: kredittrating er ikke en av truslene."],["The legality of decisions","Feil: lovlighet er ikke en av truslene."],["Shareholders' voting rights","Feil: stemmerett er ikke en del av dette."]],"c":[0],"es":"Moral snakk oppleves som å skape konflikt og ødelegge harmonien.","ed":"Husk: tre trusler: harmoni, effektivitet, eget image.","kt":"","src":"L2 slide 20 · Crane s. 78"},{"id":"SB064","l":"L2","t":"Moral framing","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An employee shops online during work hours and says: \"It is fine, I do lots of unpaid overtime.\" Which excuse is this?","o":[["Denial of victim","Feil: denial of victim sier at offeret fortjente det."],["Denial of injury","Feil: denial of injury sier at ingen ble skadet."],["Appeal to higher loyalties","Feil: higher loyalties viser til en viktigere sak."],["Metaphor of the ledger","Riktig: overtid gir \"kreditt\" til å shoppe."]],"c":[3],"es":"\"Jeg har opparbeidet meg kreditt\" = metaphor of the ledger.","ed":"Husk: ledger = regnskap. Gode gjerninger gir \"lov\" til dårlige.","kt":"","src":"L2 slide 21 · Crane s. 79"},{"id":"SB065","l":"L2","t":"Moral framing","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A firm accused of pollution says: \"Our critics have no right to judge us, and competitors pollute more.\" This is \"social weighting\".","o":[["True","Riktig. Å angripe kritikerne og vise til at andre er verre er social weighting."],["False","Feil. Å angripe kritikerne og vise til at andre er verre er social weighting."]],"c":[0],"es":"Sant. \"Dere har ingen rett\" + \"andre er verre\" = social weighting.","ed":"Husk: social weighting = angrip kritikeren og sammenlign deg med verre aktører.","kt":"","src":"L2 slide 21 · Crane s. 79"},{"id":"SB066","l":"L2","t":"Situational factors","f":"m","d":2,"p":"H","sc":"none","s":"Which of these is an issue-related (not context-related) factor in ethical decisions?","o":[["Reward systems","Feil: belønning er context."],["Authority of superiors","Feil: sjefens autoritet er context."],["Moral framing","Riktig: framing er issue-related."],["Organisational culture","Feil: kultur er context."]],"c":[2],"es":"Moral framing handler om selve saken. De andre handler om arbeidsplassen.","ed":"Husk: issue-related = moral intensity og moral framing. Resten er context.","kt":"","src":"L2 slide 19-21 · Crane s. 76"},{"id":"SB067","l":"L2","t":"Situational factors","f":"m","d":4,"p":"M","sc":"none","s":"What do Crane et al. mean by \"distancing\" in large organisations?","o":[["Staff stop asking if the goals are right","Feil: det er instrumental morality."],["A buyer never sees the workers she affects","Riktig: kjøperen ser aldri arbeiderne."],["Sales targets are rewarded no matter how they are met","Feil: det er rewards-faktoren."],["Customers become data in a database","Feil: det er denial of moral status."]],"c":[1],"es":"Distancing = de som bestemmer ser aldri de som rammes.","ed":"Husk: avstand gjør det lettere å ignorere konsekvensene.","kt":"","src":"Crane s. 84 · Crane s. 86"},{"id":"SB068","l":"L2","t":"Situational influences","f":"t","d":3,"p":"M","sc":"short","s":"True or false: In the Volkswagen emissions scandal, pressure from bosses to hit impossible targets does not help explain the misconduct.","o":[["True","Feil. Press fra sjefer og umulige mål er viktige context-faktorer i VW-saken."],["False","Riktig. Press fra sjefer og umulige mål er viktige context-faktorer i VW-saken."]],"c":[1],"es":"Usant. Press fra sjefer og umulige mål forklarer mye av VW-skandalen.","ed":"Husk: context (sjefer, belønning, kultur) betyr mye.","kt":"Situational (context-related) factors: rewards, authority, bureaucracy, work roles, group norms and culture that shape ethical choices.","src":"Crane s. 48 · L5 slide 14"},{"id":"SB069","l":"L2","t":"Situational factors","f":"m","d":4,"p":"M","sc":"none","s":"What lesson do Crane et al. draw from Bernard Madoff's fraud?","o":[["Madoff acted alone, so only character matters","Feil: det var bare første antagelse, som senere ble avvist."],["Rules always prevent fraud","Feil: regler og kontroller stoppet ikke svindelen."],["Helpers and the environment also mattered","Riktig: et nettverk av hjelpere og omgivelsene betydde mye."],["Descriptive ethics is irrelevant","Feil: caset brukes for å vise at descriptive ethics er nyttig."]],"c":[2],"es":"Madoff var ikke alene. Medhjelpere og omgivelsene spilte også en rolle.","ed":"Husk: ikke bare \"dårlig eple\", også \"dårlig tønne\".","kt":"","src":"Crane s. 53 · Bok s. 79 (Box 3.1)"},{"id":"SB070","l":"L2","t":"Theories of CSR","f":"m","d":3,"p":"H","sc":"none","s":"In Bénabou and Tirole (2010), managers spending other people's money on their own values is:","o":[["Shareholder primacy","Feil: ikke en av Bénabou og Tirole sine tre typer."],["Insider-led philanthropy","Riktig: ledelsen bruker eiernes penger på egne verdier."],["Delegated philanthropy","Feil: delegated betyr at firmaet handler på vegne av stakeholders."],["\"Win-win\" CSR","Feil: win-win gir både profitt og samfunnsnytte, uten konflikt."]],"c":[1],"es":"Ledere bruker andres penger på sine egne verdier = insider-led philanthropy.","ed":"Husk: insider-led = ledernes verdier. Delegated = eiernes/kundenes verdier.","kt":"","src":"L2 slide 25"},{"id":"SB071","l":"L2","t":"Theories of CSR","f":"t","d":5,"p":"M","sc":"none","s":"True or false: Bénabou and Tirole's \"delegated philanthropy\" is close to Hart and Zingales' idea: investors act on their social preferences through the firm.","o":[["True","Riktig. Delegated philanthropy betyr at investorer bruker firmaet til sine verdier, slik Hart og Zingales sier."],["False","Feil. Delegated philanthropy betyr at investorer bruker firmaet til sine verdier, slik Hart og Zingales sier."]],"c":[0],"es":"Sant. Begge sier at investorer bruker firmaet til å følge sine sosiale preferanser.","ed":"Husk: delegated philanthropy ≈ Hart og Zingales.","kt":"","src":"L2 slide 25 · L4 slide 31 · Hart & Zingales s. 3"},{"id":"SB072","l":"L2","t":"Telenor in Myanmar","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"After the 2021 coup, Telenor sold its Myanmar business to a buyer close to the military. Which statement is correct?","o":[["Utilitarianism ignores non-shareholders","Feil: utilitarianism teller alle som påvirkes."],["A good mission made every decision ethical","Feil: god intensjon løser ikke dilemmaet."],["Selling removed all responsibility for user data","Feil: kritikerne mente Telenor fortsatt hadde ansvar."],["Exit is not always ethical: the buyer mattered","Riktig: kjøperen sto militæret nær, så exit kunne gjøre skade."]],"c":[3],"es":"Å selge seg ut er ikke automatisk etisk. Hvem man selger til betyr noe.","ed":"Husk: irresponsible disengagement = dårlig måte å gå ut på.","kt":"","src":"L2 slide 27-29 · L2 slide 32-34 · Crane s. 21"},{"id":"SB073","l":"L2","t":"Business ethics","f":"m","d":2,"p":"H","sc":"short","s":"A company legally moves profits to a low-tax country. Critics call it unethical. The course frames this as:","o":[["Legal is not always ethical","Riktig: lovlig betyr ikke etisk."],["Ethics applies only to people","Feil: etikk gjelder også organisasjoner."],["If it is legal, it is by definition ethical","Feil: lov og etikk er ikke det samme."],["Transfer pricing is always illegal","Feil: oppgaven sier at det er lovlig."]],"c":[0],"es":"Noe kan være lovlig uten å være etisk.","ed":"Husk: lov og etikk overlapper, men er ikke det samme.","kt":"Business ethics: the study of business situations, activities and decisions where issues of right and wrong are addressed; it largely concerns grey areas beyond the law.","src":"L2 slide 4"},{"id":"SB074","l":"L2","t":"Ethical theories applied: Tesla case","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Which explanation of Musk's decision to reopen the Tesla factory uses descriptive (not normative) ethics?","o":[["It caused more pain than pleasure","Feil: dette er en normativ vurdering (utilitarianism)."],["A good CEO would have obeyed the law","Feil: dette er en normativ vurdering (virtue)."],["Ignoring the law cannot be a universal rule","Feil: dette er en normativ vurdering (Kant)."],["His personality and pressure from targets","Riktig: dette forklarer handlingen, uten å dømme den."]],"c":[3],"es":"Descriptive forklarer hvorfor han gjorde det (personlighet, press). Normative sier om det var riktig.","ed":"Husk: \"hvorfor gjorde han det\" = descriptive. \"Var det galt\" = normative.","kt":"","src":"L2 slide 3 · L2 slide 11 · L2 slide 15 · L2 slide 19"},{"id":"SB075","l":"L2","t":"Moral framing","f":"m","d":1,"p":"M","sc":"none","s":"Calling bribes \"facilitation payments\" or mass lay-offs \"restructuring\" is:","o":[["Moral framing","Riktig: språket får handlingen til å virke ufarlig."],["Moral imagination","Feil: moral imagination hjelper deg å se etiske problemer."],["Discourse ethics","Feil: discourse ethics handler om ærlig dialog."],["Post-conventional reasoning","Feil: post-conventional handler om modenhet i resonnering."]],"c":[0],"es":"Pene ord om stygge ting = moral framing.","ed":"Husk: framing = språket gjør noe galt til noe ufarlig.","kt":"","src":"L2 slide 20 · Crane s. 77 · Crane s. 79"},{"id":"SB076","l":"L2","t":"Ethical theories applied: child labour dilemma","f":"m","d":5,"p":"M","sc":"extended_course_case","s":"A manager can buy toys at a third of the cost from a supplier that uses child labour at home. How do the theories differ?","o":[["Act utilitarianism may approve; rights object","Riktig: total nytte kan si ja, barnas rettigheter sier nei."],["Rawls clearly supports the deal","Feil: barn som mister skole er de svakeste, så Rawls sier nei."],["All theories give the same answer","Feil: teoriene gir ulike svar."],["Postmodern ethics gives a clear rule that applies everywhere","Feil: postmodern ethics avviser universelle regler."]],"c":[0],"es":"Teoriene gir ulike svar: act utilitarianism kan si ja, rights-tenkning sier nei.","ed":"Husk: teoriene kan gi motstridende svar.","kt":"","src":"Crane s. 10 · Crane s. 16 · Crane s. 23 · Crane s. 27"},{"id":"TR04","l":"L2","t":"Ethical egoism","f":"t","d":3,"p":"H","sc":"none","s":"True or false: An ethical egoist CEO can choose to protect workers' health if seeing them suffer would make him feel bad.","o":[["True","Riktig. En egoist kan beskytte arbeiderne hvis det gjør at han selv føler seg bedre."],["False","Feil. En egoist kan beskytte arbeiderne hvis det gjør at han selv føler seg bedre."]],"c":[0],"es":"Sant. Egoisten maksimerer egen velferd, og det kan inkludere å slippe å føle seg dårlig.","ed":"Husk: egoism kan gi gode handlinger hvis det er i egen interesse.","kt":"Ethical egoism: an act is right if it maximises the decision-maker's own long-term interest or desires.","src":"Opptak L2 ca. 33 min"},{"id":"TR05","l":"L2","t":"Cognitive moral development","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Executives keep running a price cartel because they think they will not get caught. Which CMD stage is this?","o":[["Stage 4: living up to the expectations of society","Feil: stage 4 betyr å følge lover, og kartellet bryter loven."],["Stage 1: obedience and punishment","Riktig: de bryr seg bare om straff."],["Stage 6: universal ethical principles","Feil: stage 6 følger prinsipper uavhengig av straff."],["Stage 5: social contract and individual rights","Feil: stage 5 ville tenkt på forbrukernes rettigheter."]],"c":[1],"es":"Eneste tanke er om de blir tatt. Det er stage 1: straff.","ed":"Husk: stage 1 = unngå straff.","kt":"","src":"Opptak L2 ca. 52 min"},{"id":"CX019","l":"L3","t":"Definition of externalities","f":"t","d":2,"p":"H","sc":"none","s":"Is an externality reflected in the market price of the good?","o":[["Yes","Feil. En externality er nettopp en effekt som ikke er med i prisen."],["No","Riktig. En externality er nettopp en effekt som ikke er med i prisen."]],"c":[1],"es":"Nei: externality = upriset effekt.","ed":"Fordi kostnaden ikke er i prisen, tar ikke kjøper og selger hensyn til den. Det er en market failure.","kt":"","src":"L3 slide 6 · L3 slide 10 · Bok s. 44 (2.1.1)","k":1},{"id":"CX020","l":"L3","t":"Types of externalities","f":"m","d":2,"p":"H","sc":"none","s":"Passive smoking that harms people nearby is:","o":[["A negative consumption externality","Skaden kommer fra forbruket av produktet."],["A negative production externality","Production externality kommer fra måten produktet lages på."],["A positive consumption externality","Andre blir skadet, så den er negativ."],["It is not an externality","Tredjepart bærer en kostnad som ikke er i prisen."]],"c":[0],"es":"Skade fra bruk av produktet = consumption externality.","ed":"Spør: kommer effekten fra produksjonen (fabrikkutslipp) eller fra forbruket (røyking)? Og er den positiv eller negativ for andre?","kt":"","src":"L3 slide 13 · Bok s. 36 (2.1)","k":1},{"id":"CX021","l":"L3","t":"Market failure diagram","f":"m","d":2,"p":"H","sc":"none","s":"With a negative production externality and no regulation, the market produces:","o":[["More than the social optimum, at too low a price","Kostnaden for andre er ikke i prisen, så produktet blir for billig."],["Nothing, because firms avoid pollution","Firmaer produserer, fordi de ikke betaler for skaden."],["Less than the social optimum, at too high a price","Det er motsatt."],["Exactly the social optimum","Da ville det ikke vært en market failure."]],"c":[0],"es":"Negativ externality = overproduksjon og for lav pris.","ed":"Private kostnader er lavere enn samfunnets kostnader. Markedet stopper der private kostnader møter etterspørselen, altså for langt ut.","kt":"","src":"L3 slide 9-12","k":1},{"id":"CX022","l":"L3","t":"Government intervention","f":"t","d":2,"p":"H","sc":"none","s":"Does a Pigouvian tax aim to make polluters pay the cost they impose on others?","o":[["Yes","Riktig. Skatten settes lik den eksterne skaden, slik at den blir internalised."],["No","Feil. Skatten settes lik den eksterne skaden, slik at den blir internalised."]],"c":[0],"es":"Ja: Pigouvian tax = skatt lik skaden.","ed":"Karbonavgift er et eksempel. Firmaer som kan kutte billig, kutter. De andre betaler. Det gjør skatten kostnadseffektiv.","kt":"","src":"Bok s. 47 (2.2.1.1) · L3 slide 21","k":1},{"id":"CX023","l":"L3","t":"Limits to internalisation","f":"t","d":2,"p":"H","sc":"none","s":"Is carbon leakage when emissions fall because firms invest in cleaner technology?","o":[["Yes","Feil. Carbon leakage er når produksjonen og utslippene flytter til land med svakere klimaregler."],["No","Riktig. Carbon leakage er når produksjonen og utslippene flytter til land med svakere klimaregler."]],"c":[1],"es":"Nei: leakage = utslipp flytter, ikke forsvinner.","ed":"Grunnen er territoriality: regler gjelder bare innenfor et område. EU svarer med en karbontoll på import (CBAM).","kt":"","src":"L3 slide 23 · Bok s. 55 (2.3.2)","k":1},{"id":"CX024","l":"L3","t":"Climate risk","f":"m","d":2,"p":"H","sc":"none","s":"An example of physical climate risk is:","o":[["A flood damages a factory","Klimaet selv gjør skade = physical risk."],["Buyers switch to electric cars","Endret etterspørsel = transition risk."],["A new carbon tax is introduced","Politikk = transition risk."],["New coal plants are banned","Regulering = transition risk."]],"c":[0],"es":"Flom, tørke, hete = physical. Regler og markeder = transition.","ed":"Physical: klimaet selv gjør skade (flom, tørke, hete). Transition: overgangen til lavutslipp gjør skade (karbonavgift, nye regler, ny teknologi).","kt":"","src":"L3 slide 36-38 · Bok s. 49 (2.3)","k":1},{"id":"CX025","l":"L3","t":"Climate scenarios","f":"m","d":2,"p":"H","sc":"none","s":"The NGFS-type scenario with the HIGHEST transition risk is:","o":[["Orderly: early, gradual policy action","Tidlig og gradvis gir moderat transition risk."],["Disorderly: late, sudden policy","Når politikken kommer sent og brått, blir omstillingen dyr og kaotisk."],["Hot house world: current policies only","Her kommer ingen nye regler, så transition risk er lav."],["Business as usual with no new rules","Ingen nye regler gir lav transition risk."]],"c":[1],"es":"Sent og brått = disorderly = høyest transition risk.","ed":"- Orderly: tidlig, gradvis. Moderat transition, lav physical.\n- Disorderly: sent, brått. Høy transition.\n- Hot house: ingenting skjer. Lav transition, høy physical.","kt":"","src":"Opptak L3 ca. 59 min · Opptak L3 ca. 61 min","k":1},{"id":"CX026","l":"L3","t":"Stranded assets","f":"t","d":2,"p":"H","sc":"none","s":"Can coal power plants become stranded assets if strict carbon pricing is introduced?","o":[["Yes","Riktig. De kan miste verdien før tiden fordi de ikke lenger er lønnsomme."],["No","Feil. De kan miste verdien før tiden fordi de ikke lenger er lønnsomme."]],"c":[0],"es":"Ja: karbonpris kan gjøre fossile eiendeler verdiløse.","ed":"Stranded asset: en eiendel som taper verdi uventet tidlig, typisk på grunn av klimapolitikk eller billigere fornybar energi.","kt":"","src":"Bok s. 53 (2.3) · Bok s. 70 (Key concepts) · L9 slide 3","k":1},{"id":"CX027","l":"L3","t":"Integrated value approach","f":"m","d":2,"p":"H","sc":"short","s":"Process A has F = 10, S = -4, E = -4. Process B has F = 8, S = 0, E = -1. Which has the higher integrated value?","o":[["Process B (7 versus 2)","I = F + S + E. A: 10 - 4 - 4 = 2. B: 8 + 0 - 1 = 7."],["They are equal","A gir 2 og B gir 7."],["It cannot be calculated","Det kan regnes ut: I = F + S + E."],["Process A (10 versus 8)","Det er bare F. Integrated value tar med S og E."]],"c":[0],"es":"I = F + S + E. B vinner.","ed":"Poenget: en ren finansiell analyse velger A (høyest F). Integrated value viser at B er bedre totalt. Det er forskjellen mellom SF 1.0 og SF 2.0.","kt":"","src":"L3 slide 32 · Bok s. 50 (2.3) · Bok s. 51 (Figure 2.3)","k":1},{"id":"EX05","l":"L3","t":"Exam sample: stress testing","f":"m","d":2,"p":"H","sc":"none","s":"Stress-testing differs from scenario analysis in that stress-testing asks:","o":[["What the average outcome will be","Et gjennomsnitt er det motsatte av et ekstremt scenario."],["How a firm would be like in each scenario","Det er scenario analysis: se på flere mulige utfall."],["How the firm would be like if everything goes wrong in a drastic scenario","Stress testing ser på det verste, ekstreme tilfellet."],["How competitors will react in a drastic scenario","Stress testing handler om firmaet selv, ikke konkurrentene."]],"c":[2],"es":"Stress test = det verste tilfellet. Scenario analysis = flere mulige utfall.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- Scenario analysis: hvordan går det med firmaet i hvert av flere scenarioer (f.eks. orderly, disorderly, hot house)?\n- Stress testing: tål firmaet (eller banken) et ekstremt, drastisk scenario der alt går galt?","kt":"","src":"Bok s. 67 (2.4.4) · Bok s. 68 (Box 2.4)","k":1,"x":1},{"id":"SB077","l":"L3","t":"Definition of externalities","f":"m","d":1,"p":"H","sc":"none","s":"An externality is:","o":[["An extra benefit to shareholders on top of dividends","Feil: externalities rammer tredjeparter, ikke ekstra gevinst til eiere."],["A cost a firm pays abroad, like foreign taxes","Feil: utenlandsk skatt er en vanlig kostnad firmaet betaler selv."],["A cost that is fully included in the price","Feil: hvis kostnaden er i prisen, er den internalisert."],["An unpriced effect on people outside the deal","Riktig: upriset effekt på noen utenfor avtalen."]],"c":[3],"es":"Externality = en effekt på noen utenfor handelen, som ikke er med i prisen.","ed":"Husk: tredjepart + ikke priset.","kt":"","src":"L3 slide 6 · L3 slide 10 · Bok s. 44 (2.1.1)"},{"id":"SB078","l":"L3","t":"Two-firm externality example","f":"m","d":3,"p":"H","sc":"none","s":"Two firms each choose technology (1): revenue $100, cost $20, plus a $10 cost on the other firm; or technology (2): revenue $100, cost $25, no cost to others. If each maximises its own profit, what happens?","o":[["They choose different ones; welfare is $145","Feil: de har samme valg og incentiver, så de velger likt."],["Both choose (1); welfare is $140, not $150","Riktig: begge velger (1), og velferden blir 140 i stedet for 150."],["Both choose (1); welfare is $160","Feil: du må trekke fra 10 i skade på den andre for hvert firma."],["Both choose (2); welfare is $150","Feil: (2) gir bare 75 privat, så firmaene velger ikke den."]],"c":[1],"es":"Hver tjener 80 på (1) mot 75 på (2), så begge velger (1). Men da blir velferden 2×(80−10) = 140, mot 150 med (2).","ed":"Husk: privat valg ignorerer kostnaden på andre, så samfunnet taper.","kt":"","src":"L3 slide 6-7"},{"id":"SB079","l":"L3","t":"Internalisation","f":"t","d":2,"p":"H","sc":"none","s":"True or false: In the two-firm example, a tax on the polluting technology equal to the damage it causes makes each firm's own choice also the best choice for both.","o":[["True","Riktig. En skatt lik skaden gjør at firmaet selv betaler hele samfunnskostnaden."],["False","Feil. En skatt lik skaden gjør at firmaet selv betaler hele samfunnskostnaden."]],"c":[0],"es":"Sant. En skatt lik skaden gjør at firmaet betaler hele kostnaden, så privat og samfunnets valg blir likt.","ed":"Husk: Pigouvian tax = skatt lik skaden.","kt":"Pigouvian tax: a tax equal to the marginal external damage, which internalises a negative externality.","src":"L3 slide 9-10 · Bok s. 42 (2.2)"},{"id":"SB080","l":"L3","t":"Market failure diagram","f":"m","d":3,"p":"H","sc":"none","s":"With a negative production externality, compared with the social optimum, the free market gives:","o":[["too much, at too low a price","Riktig: for mye produksjon og for lav pris."],["too much, at too high a price","Feil: prisen blir lavere, ikke høyere, fordi skaden ikke betales."],["too little, at too high a price","Feil: for lite produksjon passer en positiv externality."],["the same quantity","Feil: mengden blir for høy."]],"c":[0],"es":"Produsentene betaler ikke skaden, så markedet lager for mye til for lav pris.","ed":"Husk: negativ externality = for mye, for billig.","kt":"","src":"L3 slide 9-12"},{"id":"SB081","l":"L3","t":"Externalities","f":"m","d":2,"p":"H","sc":"short","s":"Which example is correctly classified?","o":[["Vaccines that protect other people - negative","Feil: vaksine som beskytter andre er positiv."],["Factory pollution - negative production","Riktig: fabrikken lager en kostnad for andre."],["A bakery's nice smell - negative production","Feil: god lukt er en gevinst, altså positiv."],["Traffic jams - positive consumption","Feil: kø gir kostnad for andre, altså negativ."]],"c":[1],"es":"Forurensning fra en fabrikk = negative production externality.","ed":"Husk: positiv = gratis gevinst for andre. Negativ = gratis kostnad for andre.","kt":"Externality: a cost or benefit of an activity that falls on third parties and is not reflected in market prices.","src":"L3 slide 13 · Bok s. 36 (2.1)"},{"id":"SB082","l":"L3","t":"Enlarged production function","f":"m","d":3,"p":"H","sc":"none","s":"The textbook extends the production function Q = F(K, L) to q + w = F(K, L, N, S, H; r, e). The main point is that it:","o":[["proves waste is always zero","Feil: avfall er med som et eget output."],["replaces labour and capital with nature","Feil: K og L er fortsatt med."],["shows capital can always replace nature","Feil: læreboka sier natur ikke kan erstattes."],["adds nature, people, energy and waste","Riktig: den legger til natur, mennesker, energi og avfall."]],"c":[3],"es":"Den nye funksjonen legger til natur, mennesker, energi og avfall.","ed":"Husk: N = natur, S = sosialt, H = human, w = waste.","kt":"","src":"L3 slide 14 · Bok s. 40 (2.1) · Bok s. 41 (2.1)"},{"id":"SB083","l":"L3","t":"Enlarged production function","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Machines and labour can always replace natural resources, so a firm can make the same steel with less iron ore.","o":[["True","Feil. Naturressurser kan ikke erstattes av maskiner og arbeid. De er complements."],["False","Riktig. Naturressurser kan ikke erstattes av maskiner og arbeid. De er complements."]],"c":[1],"es":"Usant. Naturressurser er complements, ikke substitutes.","ed":"Husk: du kan ikke lage stål uten jernmalm.","kt":"","src":"Bok s. 41 (2.1)"},{"id":"SB084","l":"L3","t":"Natural resources","f":"m","d":3,"p":"L","sc":"none","s":"What makes a non-renewable resource run out fastest?","o":[["Switching to a renewable alternative","Feil: bytte til fornybart senker etterspørselen."],["Finding new reserves faster than demand grows","Feil: nye funn forlenger tiden."],["Rising demand and no new reserves","Riktig: økt bruk av en fast mengde tømmer den raskt."],["More recycling","Feil: mer resirkulering senker etterspørselen."]],"c":[2],"es":"Mer etterspørsel og ingen nye reserver gjør at ressursen tar slutt fortest.","ed":"Husk: tid igjen = reserver / bruk.","kt":"Depletion horizon: reserves divided by annual demand - the number of years a resource lasts at current use.","src":"Bok s. 39 (2.1.2)"},{"id":"SB085","l":"L3","t":"Internalisation of externalities","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Internalising an externality means making those who cause it bear its costs (or enjoy its benefits).","o":[["True","Riktig. Dette er definisjonen: den som skaper externalityen, bærer kostnaden."],["False","Feil. Dette er definisjonen: den som skaper externalityen, bærer kostnaden."]],"c":[0],"es":"Sant. Internalisere = den som lager effekten, betaler (eller får gevinsten).","ed":"Husk: forurenser betaler.","kt":"","src":"L3 slide 15 · L3 slide 17"},{"id":"SB086","l":"L3","t":"Internalisation","f":"m","d":3,"p":"H","sc":"short","s":"After the Rana Plaza collapse (2013), clothing brands signed a safety accord and faced consumer boycotts. Which mechanism made them act?","o":[["Bank capital rules","Feil: bankregler var ikke involvert."],["Higher interest rates","Feil: renter har ingenting med dette å gjøre."],["Damage to reputation","Riktig: omdømmeskade fikk merkene til å ta ansvar."],["A carbon tax on garment factories","Feil: det fantes ingen skatt her."]],"c":[2],"es":"Boikott og press fra kunder skadet omdømmet. Det tvang merkene til å handle.","ed":"Husk: reputation er en vei til internalisering uten lov.","kt":"Internalisation mechanisms: government (taxes, regulation), society/stakeholders (pressure, boycotts, litigation), and market/technology shifts.","src":"L3 slide 17 · Bok s. 52 (2.3.2)"},{"id":"SB087","l":"L3","t":"Internalisation mechanisms","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Competitors' innovation can force a firm to internalise its externalities, even without new laws.","o":[["True","Riktig. Konkurrenters innovasjon kan tvinge frem endring uten nye lover."],["False","Feil. Konkurrenters innovasjon kan tvinge frem endring uten nye lover."]],"c":[0],"es":"Sant. Hvis konkurrenten lager et renere produkt, må du følge etter.","ed":"Husk: innovation er en vei til internalisering uten lov.","kt":"","src":"L3 slide 17 · Bok s. 52 (2.3)"},{"id":"SB088","l":"L3","t":"Government intervention","f":"m","d":4,"p":"M","sc":"none","s":"When a planetary boundary is close to being crossed, why can quotas or bans be better than taxes?","o":[["Quotas let firms pollute more if they pay","Feil: å betale for å forurense er skatt."],["Quotas raise more tax money","Feil: inntekt er ikke argumentet."],["Taxes are not allowed for this under international law","Feil: mange land har carbon tax."],["Quotas give more certainty about limits","Riktig: kvoter gir sikkerhet om grensen."]],"c":[3],"es":"En quota setter et fast tak. En skatt gir usikker mengde.","ed":"Husk: tax = sikker pris. Quota = sikker mengde.","kt":"","src":"Bok s. 46 (2.2) · Bok s. 47 (2.2.1)"},{"id":"SB089","l":"L3","t":"Government intervention","f":"m","d":3,"p":"H","sc":"none","s":"Why is a Pigouvian tax a cost-effective way to cut emissions?","o":[["All firms must cut by the same percent","Feil: like kutt for alle ignorerer ulike kostnader."],["The government picks each firm's technology","Feil: det er command-and-control, ikke skatt."],["Firms that can cut cheaply cut; others pay","Riktig: kuttene skjer der de er billigst."],["It guarantees an exact level of emissions","Feil: skatt gir sikker pris, ikke sikker mengde."]],"c":[2],"es":"De som kan kutte billig, kutter. De andre betaler skatt. Totalkostnaden blir lavest.","ed":"Husk: tax = kutt der det er billigst.","kt":"","src":"Bok s. 47 (2.2.1.1) · L3 slide 21"},{"id":"SB090","l":"L3","t":"Carbon pricing","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"The EU carbon price rises sharply. Cement maker A emits much more CO2 per tonne than cement maker B. What happens?","o":[["A's margins fall more; B gains an advantage","Riktig: A taper mest, B vinner relativt."],["Neither is affected, since the ETS is voluntary.","Feil: EU ETS er obligatorisk."],["A gains, because it already has high emissions.","Feil: høye utslipp gir høye kostnader."],["Both are affected equally, since they sell the same product.","Feil: kostnaden avhenger av utslipp per tonn, ikke produktet."]],"c":[0],"es":"A slipper ut mest, så A får størst kostnadsøkning. B får fordel.","ed":"Husk: carbon price rammer de mest utslippsintensive hardest.","kt":"Carbon intensity: emissions per unit of output; it determines exposure to carbon prices.","src":"L3 slide 21-22 · Bok s. 46 (2.2.1)"},{"id":"SB091","l":"L3","t":"Government intervention","f":"m","d":3,"p":"M","sc":"none","s":"Why have most governments not introduced effective carbon prices?","o":[["Fossil fuels are already taxed enough","Feil: fossilt drivstoff får faktisk subsidier."],["Carbon taxes always hurt growth a lot","Feil: Sverige kuttet utslipp uten å skade veksten."],["Short horizons due to elections","Riktig: korte valgsykluser hindrer karbonpris."],["Carbon prices do not change behaviour","Feil: karbonpris endrer atferd, som i Skandinavia."]],"c":[2],"es":"Politikere tenker på neste valg, ikke langsiktige skatter.","ed":"Husk: short-termism i politikken.","kt":"","src":"Bok s. 48 (2.2.1.1) · Bok s. 49 (Box 2.2)"},{"id":"SB092","l":"L3","t":"Government intervention","f":"m","d":2,"p":"L","sc":"none","s":"What does the textbook conclude about fossil fuel subsidies?","o":[["They hold back clean investment","Riktig: subsidiene holder tilbake ren investering."],["They help poor households and should be expanded","Feil: læreboka kaller dem ineffektive."],["Renewables need even bigger subsidies","Feil: læreboka vil heller skattlegge fossilt."],["They are too small to matter","Feil: subsidiene er store."]],"c":[0],"es":"Fossile subsidier gjør det mindre lønnsomt å investere grønt.","ed":"Husk: fjern fossile subsidier, så trenger fornybart mindre støtte.","kt":"","src":"Bok s. 49 (2.2.1.1)"},{"id":"SB093","l":"L3","t":"Limits to internalisation","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"After the EU raises its carbon price, a cement maker moves production to a country without one and imports the cement back. This shows:","o":[["Lobbying","Feil: lobbying prøver å endre reglene."],["Carbon leakage","Riktig: produksjonen flyttes, utslippene fortsetter."],["The fallacy of composition","Feil: fallacy of composition handler om at mikro ikke summerer til makro."],["Greenwashing","Feil: greenwashing er villedende kommunikasjon."]],"c":[1],"es":"Flytte produksjonen dit det ikke er karbonpris = carbon leakage.","ed":"Husk: leakage = utslippene lekker til et annet land.","kt":"","src":"L3 slide 23 · Bok s. 55 (2.3.2)"},{"id":"SB094","l":"L3","t":"Limits to internalisation","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Duchin, Gao and Xu (2024) find that public firms often look greener by selling polluting assets to private firms, so the emissions do not disappear.","o":[["True","Riktig. Børsnoterte firmaer selger forurensende eiendeler, men utslippene fortsetter hos nye eiere."],["False","Feil. Børsnoterte firmaer selger forurensende eiendeler, men utslippene fortsetter hos nye eiere."]],"c":[0],"es":"Sant. Utslippene forsvinner ikke, de bare flyttes til en privat eier.","ed":"Husk: salg av skitne eiendeler = ser grønnere ut.","kt":"","src":"L3 slide 24-25"},{"id":"SB095","l":"L3","t":"Climate risk","f":"m","d":2,"p":"H","sc":"short","s":"Which climate risk is correctly classified?","o":[["Buyers switching to electric cars - physical","Feil: kunder som bytter er transition risk."],["A higher carbon tax - physical","Feil: ny skatt er transition risk."],["PG&E bankrupt after wildfires - physical","Riktig: skogbranner er physical risk."],["A heatwave hurting workers - transition","Feil: hetebølge er physical risk."]],"c":[2],"es":"Skogbrann som ødelegger = physical risk.","ed":"Husk: physical = vær og natur. Transition = politikk, teknologi, marked.","kt":"Physical risk: damage from climate events (acute) or gradual changes (chronic). Transition risk: losses from policy, technology, market or legal changes towards a low-carbon economy.","src":"L3 slide 36-38 · Bok s. 49 (2.3)"},{"id":"SB096","l":"L3","t":"Integrated value approach","f":"m","d":4,"p":"H","sc":"none","s":"Old process: F = 15, S = -3, E = -3. New process: F = 14, S = -1, E = -1. What does integrated value (I) show?","o":[["Both have the same I","Feil: 9 og 12 er ikke like."],["I rises (9 to 12), but F falls","Riktig: I øker fra 9 til 12, F faller fra 15 til 14."],["I is 21 for the old one and 16 for the new one","Feil: S og E er negative, så de skal trekkes fra."],["I falls from 15 to 14","Feil: det ser bare på F, ikke I."]],"c":[1],"es":"Gammel: 15 − 3 − 3 = 9. Ny: 14 − 1 − 1 = 12. I øker selv om F faller.","ed":"Husk: I = F + S + E. S og E er negative her.","kt":"","src":"L3 slide 32 · Bok s. 50 (2.3) · Bok s. 51 (Figure 2.3)"},{"id":"SB097","l":"L3","t":"Integrated value approach","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Conventional and sustainable roses from Kenya both cost about €0.70. What did the true price analysis find?","o":[["The conventional rose had the lower true price","Feil: den konvensjonelle hadde høyest true price."],["The sustainable rose had the lower true price","Riktig: den bærekraftige rosen var \"billigst\" totalt."],["Both true prices equalled the shop price","Feil: begge true prices var over butikkprisen."],["A living wage was only possible if owners paid all","Feil: kostnaden ble delt med handlere og butikker."]],"c":[1],"es":"Den bærekraftige rosen hadde lavest true price, mest pga. flyfrakt for den andre.","ed":"Husk: true price = butikkpris + skjulte kostnader.","kt":"","src":"Bok s. 52 (Box 2.3)"},{"id":"SB098","l":"L3","t":"Integrated value approach","f":"m","d":4,"p":"M","sc":"none","s":"A problem with putting a money value on externalities is that:","o":[["it automatically includes resilience","Feil: monetisering kan overse resilience."],["it makes financial and other values impossible to compare","Feil: hele poenget er å gjøre dem sammenlignbare."],["it needs no assumptions","Feil: det krever mange antagelser."],["it cannot capture human rights fully","Riktig: etiske ting som rettigheter er vanskelige å prise."]],"c":[3],"es":"Noen ting, som menneskerettigheter, kan ikke fullt ut måles i penger.","ed":"Husk: monetisering gjør ting sammenlignbare, men ikke alt kan prises.","kt":"","src":"Bok s. 53 (2.3.1) · Bok s. 54 (2.3.1)"},{"id":"SB099","l":"L3","t":"Insufficient private effort","f":"m","d":4,"p":"M","sc":"none","s":"Even if each firm internalises its externalities, planetary boundaries may still be crossed. This is called:","o":[["The fallacy of composition","Riktig: det som er bra for én, er ikke nok for helheten."],["Double materiality","Feil: double materiality er rapportering."],["The adaptive markets hypothesis (Lo)","Feil: AMH forklarer hvorfor ny risiko ikke prises."],["The tragedy of the horizon","Feil: tragedy of the horizon handler om tid."]],"c":[0],"es":"Hver for seg ok, men samlet over grensen = fallacy of composition.","ed":"Husk: summen av små forbedringer er ikke nok.","kt":"","src":"Bok s. 54 (2.3.2) · Bok s. 55 (2.3.2)"},{"id":"SB100","l":"L3","t":"Stranded assets","f":"m","d":2,"p":"H","sc":"none","s":"Which is a stranded asset?","o":[["Foreign cash that has gained value","Feil: den har økt i verdi."],["A fully rented new office building","Feil: ingen verditap fra regulering."],["A bond whose price falls a little when rates rise","Feil: vanlig renterisiko er ikke stranded asset."],["Oil reserves hit by a carbon price","Riktig: karbonpris gjør reservene mindre verdt."]],"c":[3],"es":"Stranded asset = eiendel som mister verdi pga. regulering eller ny teknologi.","ed":"Husk: oljereserver som ikke kan brukes pga. karbonpris.","kt":"","src":"Bok s. 53 (2.3) · Bok s. 70 (Key concepts) · L9 slide 3"},{"id":"SB101","l":"L3","t":"Internalisation uncertainty","f":"m","d":4,"p":"M","sc":"short","s":"In 2025 the EU delayed parts of its sustainability rules, and carbon prices kept moving up and down. What is the lesson for investors?","o":[["Internalisation always happens fast and fully","Feil: utsettelser viser at det ikke går raskt."],["Timing is uncertain, so use scenarios","Riktig: usikker timing gir behov for scenarioer."],["Externalities will never be priced","Feil: det er timingen som er usikker."],["Only physical risk matters now","Feil: transition risk finnes fortsatt."]],"c":[1],"es":"Politikk kan gå raskere eller tregere. Derfor bruker man scenarioer.","ed":"Husk: timingen er usikker, ikke om det skjer.","kt":"Scenario analysis: valuing a firm under several plausible futures (e.g. slow vs fast transition) instead of one forecast.","src":"L3 slide 21 · L3 slide 25 · PwC s. 41"},{"id":"SB102","l":"L3","t":"Sources of uncertainty","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The IEA's forecasts of solar power capacity were always too high compared with what was actually built.","o":[["True","Feil. Det ble bygget mer sol enn IEA spådde. Prognosene var for lave."],["False","Riktig. Det ble bygget mer sol enn IEA spådde. Prognosene var for lave."]],"c":[1],"es":"Usant. Faktisk bygget sol var høyere enn IEA trodde.","ed":"Husk: prognosene var for lave, ikke for høye.","kt":"","src":"Bok s. 57 (2.4.1.2) · Bok s. 58 (Figure 2.4)"},{"id":"SB103","l":"L3","t":"Scenario analysis","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"A coal-heavy utility is worth NOK 200 per share under slow transition (60%) and NOK 80 under fast transition (40%). What is the expected value?","o":[["NOK 140","Feil: det er bare snittet, uten vekter."],["NOK 200","Feil: det ignorerer det raske scenarioet."],["NOK 128","Feil: sannsynlighetene er byttet om."],["NOK 152","Riktig: 120 + 32 = 152."]],"c":[3],"es":"0,6 × 200 + 0,4 × 80 = 120 + 32 = 152.","ed":"Husk: forventet verdi = sannsynlighet × verdi, summert.","kt":"Probability-weighted (expected) value = Σ probability × value in each scenario.","src":"L3 slide 25 · Bok s. 144 (Table 5.6)"},{"id":"SB104","l":"L3","t":"Scenario analysis","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Scenario analysis looks only at what happens if everything goes wrong, while stress testing weights several scenarios by probability.","o":[["True","Feil. Rollene er byttet. Stress testing ser på verste fall, scenario analysis vekter flere scenarioer."],["False","Riktig. Rollene er byttet. Stress testing ser på verste fall, scenario analysis vekter flere scenarioer."]],"c":[1],"es":"Usant. Det er motsatt: stress testing = verste fall, scenario analysis = vektede scenarioer.","ed":"Husk: stress = \"hva om alt går galt\".","kt":"","src":"L3 slide 34 · Bok s. 66 (2.4.4)"},{"id":"SB105","l":"L3","t":"Scenario analysis","f":"m","d":4,"p":"M","sc":"none","s":"A $100 carbon price has never happened, so its historical probability is 0%. Why does the textbook reject this for valuation?","o":[["No historical data exist","Feil: data finnes, men reflekterer ikke fremtidig politikk."],["A 0% probability is always right for new events","Feil: det er nettopp den feilen læreboka advarer mot."],["Carbon prices do not affect value","Feil: karbonpris kan påvirke verdien mye."],["Past data come from a time without carbon prices","Riktig: fortiden hadde ikke karbonpris, så den er en dårlig guide."]],"c":[3],"es":"Historiske data kommer fra en tid uten karbonpris, så de sier lite om fremtiden.","ed":"Husk: fortiden er ikke lik fremtiden (ceteris non paribus).","kt":"","src":"Bok s. 61 (2.4.2) · Bok s. 62 (2.4.2)"},{"id":"SB106","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"H","sc":"none","s":"Compared with an early transition (\"soft landing\"), a late transition starting around 2030 (\"hard landing\") means:","o":[["Sudden policy and more stranded assets","Riktig: sent og brått gir mest stranded assets."],["A slow change that gives firms more time to adapt","Feil: det beskriver en tidlig, rolig overgang."],["The lowest risk for fossil fuel firms","Feil: fossilfirmaer får størst tap her."],["No physical or transition risk","Feil: den har både physical og transition risk."]],"c":[0],"es":"Sen overgang = brå politikk og flere stranded assets.","ed":"Husk: hard landing = sent og brått.","kt":"","src":"Bok s. 62 (2.4.3) · Bok s. 63 (Figure 2.8) · L3 slide 35-38"},{"id":"SB107","l":"L3","t":"Scenario analysis","f":"m","d":3,"p":"H","sc":"none","s":"The textbook values an oil company under four scenarios, from business as usual (high value) to a late, sudden transition (value near zero). What is the main lesson?","o":[["One forecast is enough","Feil: usikkerhet er grunnen til å bruke flere scenarioer."],["Timing does not affect value","Feil: timing gir store forskjeller i verdi."],["Value depends on transition timing","Riktig: verdien avhenger av timing."],["The firm is worthless in all four scenarios","Feil: business as usual gir høy verdi."]],"c":[2],"es":"Verdien avhenger av når overgangen skjer.","ed":"Husk: timing driver verdien.","kt":"Implied probability: the scenario weights that make the expected value equal to the observed market price.","src":"Bok s. 66 (Table 2.4) · L3 slide 25"},{"id":"SB108","l":"L3","t":"Climate scenarios","f":"t","d":5,"p":"M","sc":"none","s":"True or false: In the oil company example, a share price of about $126 implies the market gives about 60% probability to business as usual. An analyst who thinks this is too high would see the stock as overpriced.","o":[["True","Riktig. Prisen tilsvarer 60 % business as usual. Tror du det er for høyt, er aksjen overpriset."],["False","Feil. Prisen tilsvarer 60 % business as usual. Tror du det er for høyt, er aksjen overpriset."]],"c":[0],"es":"Sant. Tror du sannsynligheten for business as usual er lavere, er aksjen for dyr.","ed":"Husk: prisen viser markedets sannsynlighet.","kt":"","src":"Bok s. 66 (Table 2.4) · Bok s. 91 (3.4) · L5 slide 26"},{"id":"SB109","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"M","sc":"none","s":"The textbook's figure of EU emissions by sector shows that:","o":[["Finance is the most polluting sector","Feil: finans har lave direkte utslipp."],["Carbon taxes also hit transport and industry","Riktig: transport og industri har også store utslipp."],["Only power and gas would be hit","Feil: flere sektorer rammes."],["Sectors with high value added never pollute much","Feil: industri og transport har både høy verdiskaping og utslipp."]],"c":[1],"es":"Karbonskatt rammer også transport og industri, ikke bare kraft.","ed":"Husk: mange sektorer har store utslipp.","kt":"","src":"Bok s. 63 (2.4.3) · Bok s. 64 (Figure 2.9) · Bok s. 67 (2.4.4)"},{"id":"SB110","l":"L3","t":"Stress testing","f":"m","d":4,"p":"L","sc":"none","s":"What does the climate stress test by Battiston et al. (2017) find for euro-area financial firms?","o":[["Climate policy would always cause a financial collapse","Feil: tidlig politikk gir ikke kollaps."],["Lenders lose before shareholders","Feil: egenkapital tar tapet først."],["Banks mainly own risky oil shares","Feil: direkte fossil eksponering er liten."],["Direct fossil exposure is small; total is large","Riktig: liten direkte, stor total."]],"c":[3],"es":"Direkte fossil eksponering er liten, men samlet klimaeksponering er stor.","ed":"Husk: direkte liten, total stor.","kt":"","src":"Bok s. 67 (2.4.4) · Bok s. 68 (Box 2.4)"},{"id":"SB111","l":"L3","t":"Bank capital and climate","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Boot and Schoenmaker (2018) prefer lower capital rules for green loans over higher capital rules for brown loans, because green assets are proven to be safer.","o":[["True","Feil. De vil heller ha høyere kapitalkrav for brune lån, fordi grønt ikke er bevist tryggere."],["False","Riktig. De vil heller ha høyere kapitalkrav for brune lån, fordi grønt ikke er bevist tryggere."]],"c":[1],"es":"Usant. De foretrekker høyere krav på brune lån. Grønt er ikke bevist tryggere.","ed":"Husk: straff brunt, ikke belønn grønt.","kt":"","src":"Bok s. 68 (Box 2.4) · L11 slide 30-31"},{"id":"SB112","l":"L3","t":"Regulation","f":"m","d":3,"p":"M","sc":"short","s":"Why did the Montreal Protocol on the ozone layer succeed, while climate deals have struggled?","o":[["Trade sanctions punished free riders","Riktig: sanksjoner stoppet free riding."],["Ozone loss had no health effects","Feil: ozon ga hudkreft, så det hadde helseeffekter."],["Climate deals have never had any binding parts","Feil: klimaavtaler har hatt bindende deler."],["It relied only on voluntary pledges","Feil: det var en bindende avtale."]],"c":[0],"es":"Handelssanksjoner straffet free riders.","ed":"Husk: Montreal = global avtale med sanksjoner.","kt":"Free-rider problem: when each country benefits from others' cuts without cutting itself, global cooperation is hard.","src":"Bok s. 57 (2.4) · L3 slide 20"},{"id":"SB113","l":"L3","t":"Social externalities","f":"m","d":2,"p":"L","sc":"none","s":"How have rich countries mainly internalised social externalities since World War II?","o":[["Voluntary company codes","Feil: det var lover, ikke frivillige koder."],["Carbon taxes","Feil: karbonskatt er miljø, ikke arbeid."],["Laws on working hours and wages","Riktig: arbeidslover internaliserte sosiale kostnader."],["Banning trade with developing countries","Feil: ingen slikt forbud."]],"c":[2],"es":"Rike land brukte lover om arbeidstid og lønn.","ed":"Husk: sosiale externalities ble løst med lovgivning.","kt":"","src":"Bok s. 49 (2.2.2) · Bok s. 50 (2.2.2)"},{"id":"SB114","l":"L3","t":"Externality case: Velsicol","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Velsicol was sued for knowingly polluting water with cancer-causing pesticides. Which statement is correct?","o":[["The social cost shows in its income statement","Feil: externalities står ikke i regnskapet."],["Shareholders are not affected","Feil: erstatning og omdømmetap rammer eierne."],["A negative production externality","Riktig: produksjonen skadet andre."],["A consumption externality, so consumers should pay","Feil: skaden kommer fra produksjon, ikke forbruk."]],"c":[2],"es":"Forurensning fra produksjon = negative production externality.","ed":"Husk: søksmål tvinger forurenseren til å betale.","kt":"","src":"L3 slide 3-5 · L3 slide 16 · L3 slide 31 · Bok s. 81 (3.2.1)"},{"id":"SB115","l":"L3","t":"Air France-KLM case","f":"m","d":5,"p":"M","sc":"extended_course_case","s":"How should you assess the effect of a carbon price on the value of Air France-KLM?","o":[["Use only past earnings","Feil: historikk undervurderer fremtidig karbonpris."],["Assume today's carbon price lasts forever","Feil: én fast pris ignorerer usikkerheten."],["Use several carbon price scenarios","Riktig: flere scenarioer fanger usikkerheten."],["Ignore carbon prices","Feil: å ignorere risikoen er feil."]],"c":[2],"es":"Bruk flere karbonpris-scenarioer.","ed":"Husk: usikker fremtid = scenarioer.","kt":"","src":"L3 slide 39-42 · Bok s. 61 (Figure 2.7) · Bok s. 55 (2.3.2)"},{"id":"SB116","l":"L3","t":"Limits to internalisation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The UK advertising regulator approved Shell's ads because they showed that low-carbon energy was a big part of Shell's business.","o":[["True","Feil. ASA forbød reklamen fordi den utelot Shells mest forurensende virksomhet."],["False","Riktig. ASA forbød reklamen fordi den utelot Shells mest forurensende virksomhet."]],"c":[1],"es":"Usant. Reklamen ble forbudt fordi den skjulte Shells fossile virksomhet.","ed":"Husk: greenwashing = vise det grønne, skjule det skitne.","kt":"","src":"L3 slide 24-25 · PwC s. 30"},{"id":"SB117","l":"L3","t":"Integrated value approach","f":"m","d":1,"p":"M","sc":"none","s":"The four steps of the integrated value method are:","o":[["Beta, WACC, discount, compare with price","Feil: dette er en vanlig DCF uten S og E."],["Screen, rank, select, rebalance","Feil: dette er screening."],["Measure, add up to I, adapt, recalculate","Riktig: de fire stegene i integrated value."],["Find stakeholders, rank, engage, report","Feil: dette er stakeholder-analyse."]],"c":[2],"es":"Mål, summer til I, tilpass, regn ut på nytt.","ed":"Husk: integrated value = F + S + E.","kt":"","src":"Bok s. 50 (2.3) · L3 slide 32"},{"id":"TR06","l":"L3","t":"Types of externalities","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A chemical factory leaks toxins into a river while making a product households buy. How does the lecturer classify this?","o":[["No externality","Feil: kostnaden for folk nedstrøms er ikke priset."],["Negative production externality","Riktig: produksjonen lager skaden."],["Negative consumption externality","Feil: forbruket er ikke kilden."],["Positive production externality","Feil: jobber er en del av handelen, ikke en externality."]],"c":[1],"es":"Skaden kommer fra fabrikkens produksjon = negative production externality.","ed":"Husk: klassifiser etter hvor skaden kommer fra.","kt":"","src":"Opptak L3 ca. 7 min · Opptak L3 ca. 19 min"},{"id":"TR07","l":"L3","t":"Types of externalities","f":"m","d":3,"p":"M","sc":"none","s":"Vaccination also protects others. How do you find the social optimum in the diagram?","o":[["No shift is needed","Feil: gevinsten for andre er ikke priset."],["Shift demand up; the optimum is higher","Riktig: demand opp, høyere optimum."],["Shift supply up; the optimum is lower","Feil: det er tilfellet for forurensning."],["Shift demand down; the optimum is lower","Feil: det er røyking (negativ i forbruk)."]],"c":[1],"es":"Samfunnet får mer nytte enn kjøperen. Flytt demand opp, optimum blir høyere.","ed":"Husk: positiv externality = for lite i markedet.","kt":"","src":"Opptak L3 ca. 20 min"},{"id":"TR08","l":"L3","t":"Innovation externalities","f":"m","d":3,"p":"H","sc":"none","s":"Why might a firm hold back on developing cleaner technology, even if society would gain?","o":[["Rivals can copy it","Riktig: kopiering gir lav privat avkastning."],["Regulators forbid innovation","Feil: myndighetene forbyr ikke innovasjon."],["Green R&D never pays off for society","Feil: samfunnet kan tjene mye."],["Patents stop rivals from benefiting","Feil: spillover skjer fordi patentene ikke beskytter nok."]],"c":[0],"es":"Konkurrenter kan kopiere, så firmaet får ikke hele gevinsten.","ed":"Husk: R&D er en positiv externality.","kt":"Business stealing effect: competitors adopting the new technology capture market share from the original innovator.","src":"Opptak L3 ca. 34 min"},{"id":"TR09","l":"L3","t":"Limitations to internalisation","f":"m","d":3,"p":"H","sc":"short","s":"Listed firms often sell their most polluting plants to private firms, which report less. This shows:","o":[["Consumers cannot afford green products","Feil: forbrukerbudsjett er ikke relevant."],["A ban removes the pollution","Feil: et forbud ville stoppet forurensningen."],["No cleaner technology exists for these plants","Feil: fabrikkene selges, de legges ikke ned."],["It looks greener; emissions continue","Riktig: kun eieren endres."]],"c":[3],"es":"Firmaet ser grønnere ut, men utslippene fortsetter hos ny eier.","ed":"Husk: salg ≠ kutt.","kt":"","src":"Opptak L3 ca. 44 min · Opptak L3 ca. 47 min"},{"id":"TR10","l":"L3","t":"Internalisation through disclosure","f":"m","d":3,"p":"M","sc":"short","s":"In 2012 the US SEC required firms to check if their minerals came from Congo mines that funded armed groups. What happened?","o":[["Firms avoided risky suppliers","Riktig: firmaene unngikk risikable leverandører."],["The SEC banned mining in the region","Feil: SEC regulerer rapportering, ikke gruver."],["Firms paid a tax per tonne","Feil: det var et rapporteringskrav, ikke skatt."],["Nothing changed","Feil: det ble en tydelig endring."]],"c":[0],"es":"Krav om disclosure gjorde skjult skade synlig, så firmaene byttet leverandør.","ed":"Husk: transparency kan endre atferd.","kt":"","src":"Opptak L3 ca. 40 min · Opptak L4 ca. 62 min"},{"id":"TR11","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"H","sc":"none","s":"In a \"hot house world\" scenario (only current policies), which is true?","o":[["Physical risk is low and transition risk is high","Feil: det beskriver orderly scenario."],["Both physical and transition risk are low","Feil: du får alltid en av risikoene."],["Neither risk applies, because policy stays unchanged","Feil: oppvarmingen gir full physical risk."],["Physical risk is high and transition risk is low","Riktig: høy physical, lav transition."]],"c":[3],"es":"Ingen ny politikk = lav transition risk, men mye oppvarming = høy physical risk.","ed":"Husk: hot house = varmt (physical), men ingen ny politikk (transition).","kt":"Physical risk: damage from climate change itself; transition risk: costs from policy, technology and market changes on the way to low carbon.","src":"Opptak L3 ca. 59 min · Opptak L3 ca. 61 min"},{"id":"TR12","l":"L3","t":"Measuring internalisation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Stress testing means weighting several climate scenarios by probability and combining them into one expected value.","o":[["True","Feil. Å vekte scenarioer er scenario analysis. Stress testing ser bare på det verste tilfellet."],["False","Riktig. Å vekte scenarioer er scenario analysis. Stress testing ser bare på det verste tilfellet."]],"c":[1],"es":"Usant. Det beskriver scenario analysis. Stress testing ser på verste fall.","ed":"Husk: stress = verste fall. Scenario = vektet snitt.","kt":"","src":"Opptak L3 ca. 56 min · Opptak L3 ca. 59 min"},{"id":"CX028","l":"L4","t":"Shareholder theory","f":"m","d":2,"p":"H","sc":"none","s":"Friedman opposed managers spending company money on social causes because:","o":[["Employees would then get lower wages","Det var ikke argumentet."],["It spends the owners' money without consent","Lederne er ansatt av eierne. Eierne kan selv gi til gode formål."],["It always raises the firm's tax bill","Skatt var ikke argumentet."],["Social causes are illegal for firms","Det er ikke ulovlig."]],"c":[1],"es":"Friedman: maks profitt innenfor reglene, eierne gir selv.","ed":"Friedmans logikk: ledere er ansatt av eierne. Bruker de eiernes penger på egne samfunnsmål, er det nesten som en skatt på eierne.","kt":"","src":"L4 slide 5 · Hart & Zingales s. 2 · Bok s. 20 (1.4)","k":1},{"id":"CX029","l":"L4","t":"Stakeholder theory","f":"m","d":2,"p":"H","sc":"short","s":"A CEO who cancels a layoff to protect the local community, at some cost to profit, is acting in line with:","o":[["Stakeholder theory","Lokalsamfunnet er en stakeholder som skal tas hensyn til."],["Jensen's critique of stakeholder theory","Jensen kritiserer nettopp uklare mål som dette."],["Friedman's shareholder theory","Friedman ville prioritert profitt."],["Ethical egoism","Egoism ser på eget beste."]],"c":[0],"es":"Hensyn til flere enn eierne = stakeholder theory.","ed":"Stakeholder theory: firmaet skal skape verdi for alle som påvirkes. Kritikken (Jensen, Bebchuk) er at lederen da kan forsvare nesten alt.","kt":"","src":"Bok s. 82 (3.2.2) · Bok s. 83 (3.2.3) · L5 slide 27-28","k":1},{"id":"CX030","l":"L4","t":"Criticism of stakeholder theory","f":"m","d":2,"p":"H","sc":"none","s":"Instead of pure stakeholder theory, Jensen proposes:","o":[["Common good value","Det er målet i SF 3.0."],["Enlightened value maximisation","Ett mål (langsiktig verdi), men ta hensyn til stakeholders."],["Shareholder welfare maximisation","Det er Hart og Zingales."],["Growing the pie","Det er Edmans sitt begrep."]],"c":[1],"es":"Jensen = enlightened value maximisation.","ed":"Jensens løsning er enlightened value maximisation: ett mål (langsiktig verdi), men ta hensyn til stakeholders for å nå det.","kt":"","src":"L4 slide 20 · Bok s. 81 (3.2.2)","k":1},{"id":"CX031","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":2,"p":"H","sc":"none","s":"According to Hart and Zingales, a firm should choose a cleaner but slightly less profitable process:","o":[["When shareholders care more about the harm than the profit","Maksimer shareholder welfare, ikke bare market value."],["Never, because the firm's market value would then fall","Det er Friedmans syn, som HZ nyanserer."],["Always, whatever its shareholders want","Det er eiernes velferd som skal styre."],["Only when the law explicitly requires the cleaner process","HZ sier at eiernes preferanser også teller."]],"c":[0],"es":"HZ: følg det eierne faktisk bryr seg om.","ed":"Mange eiere er prosocial. Når skaden kommer fra selve produksjonen (non-separable), kan de ikke fikse den selv. Da bør firmaet gjøre det hvis eierne vil.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 2-3 · L4 slide 30-31","k":1},{"id":"CX032","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":2,"p":"H","sc":"none","s":"According to Hart and Zingales, Friedman is right when the social activity is:","o":[["required by the law","Lovkrav er ikke poenget."],["supported only by managers","Det er eiernes preferanser som teller."],["linked to the firm's own pollution","Det er non-separable: firmaet må handle."],["separable from the business, like charity","Eierne kan gjøre det selv, så firmaet trenger ikke."]],"c":[3],"es":"Separable = Friedman har rett.","ed":"Separable (f.eks. veldedighet): eierne kan gjøre det selv, så Friedman har rett. Non-separable (forurensning fra fabrikken): bare firmaet kan gjøre noe.","kt":"","src":"Hart & Zingales s. 3-4 · L4 slide 31","k":1},{"id":"CX033","l":"L4","t":"Grow the pie","f":"m","d":2,"p":"H","sc":"none","s":"Growing the pie, in Edmans' sense, means:","o":[["Training staff so productivity and pay rise","Total verdi øker, og flere får mer."],["Paying suppliers less than their production costs","Det flytter verdi fra leverandører til eiere."],["Raising prices without improving the product","Det flytter verdi fra kunder til eiere."],["Cutting wages to pay higher dividends","Det flytter verdi fra ansatte til eiere."]],"c":[0],"es":"Grow = mer verdi totalt. Split = flytte verdi.","ed":"Edmans: purpose og profitt kan gå sammen når firmaet øker kaken, ikke når det bare tar en større bit av den.","kt":"","src":"L4 slide 30-31","k":1},{"id":"CX034","l":"L4","t":"Business Roundtable statement","f":"m","d":2,"p":"H","sc":"none","s":"A main criticism of the 2019 Business Roundtable statement is that:","o":[["It forced firms to give up all profits","Den krevde ingenting slikt."],["It ignored customers and employees","Den nevnte nettopp alle stakeholders."],["It was imposed on firms by US law","Den var frivillig."],["It was non-binding and may be mostly PR","Ingen håndheving, og noen selskaper gjorde det motsatte rett etterpå."]],"c":[3],"es":"Frivillig = mulig PR.","ed":"Erklæringen signaliserte et skifte fra shareholder primacy til alle stakeholders. Kritikk: ingen håndheving, og noen selskaper gjorde det motsatte rett etterpå.","kt":"","src":"L4 slide 6-11 · L4 slide 14-16","k":1},{"id":"CX035","l":"L4","t":"Shareholder vs stakeholder","f":"m","d":2,"p":"H","sc":"none","s":"Engine No. 1 won three board seats at ExxonMobil with about 0.02% of the shares because:","o":[["Large index funds voted with it","BlackRock, Vanguard og State Street støttet forslaget."],["A court appointed its directors","Det var en avstemning."],["It bought a majority of the shares","Den eide bare ca. 0,02 %."],["Exxon's managers invited it in","Ledelsen var imot."]],"c":[0],"es":"Store indeksfond stemte med = voice virker.","ed":"Saken viser voice i praksis: eiere brukte stemmeretten til å presse frem en mer langsiktig klimastrategi.","kt":"","src":"L4 slide 31 · Hart & Zingales s. 2","k":1},{"id":"EX04","l":"L4","t":"Exam sample: Friedman","f":"m","d":2,"p":"H","sc":"none","s":"According to Milton Friedman (1970), the social responsibility of business is to:","o":[["Fund social programmes chosen by managers","Det var nettopp dette Friedman var imot: ledere som bruker eiernes penger på egne samfunnsmål."],["Maximize stakeholder welfare","Det er stakeholder theory, det motsatte synet."],["Eliminate all externalities","Friedman mente det er statens oppgave gjennom lover og regler."],["Increase its profits","Friedman: øk profitten innenfor spillets regler. Eierne kan selv gi til gode formål."]],"c":[3],"es":"Friedman = increase its profits (innenfor reglene).","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nFriedman (shareholder theory): ledere er ansatt av eierne og skal tjene penger for dem. Hart og Zingales nyanserer dette: når skaden er non-separable, bør firmaet ta hensyn til hva eierne bryr seg om.","kt":"","src":"L4 slide 5 · Hart & Zingales s. 2 · Bok s. 20 (1.4)","k":1,"x":1},{"id":"SB118","l":"L4","t":"Shareholder theory","f":"m","d":1,"p":"H","sc":"none","s":"Milton Friedman's (1970) view is that:","o":[["Firms should maximise shareholder welfare","Feil: det er Hart og Zingales sin oppdatering."],["Firms should set society's rules","Feil: Friedman sier staten lager reglene."],["Managers should balance all stakeholders equally","Feil: det er stakeholder-synet (Freeman)."],["Business should increase its profits","Riktig: Friedman = øk profitten."]],"c":[3],"es":"Friedman: business skal øke profitten (innenfor lovens rammer).","ed":"Husk: Friedman = profit. Hart og Zingales = shareholder welfare.","kt":"","src":"L4 slide 5 · Hart & Zingales s. 2 · Bok s. 20 (1.4)"},{"id":"SB119","l":"L4","t":"Stakeholder theory","f":"t","d":3,"p":"H","sc":"short","s":"True or false: Danone's CEO was ousted in 2021 after investors complained about weak returns. This shows that a stakeholder purpose removes the need for good financial results.","o":[["True","Feil. CEO-en ble kastet fordi avkastningen var svak. Purpose fjerner ikke kravet om resultater."],["False","Riktig. CEO-en ble kastet fordi avkastningen var svak. Purpose fjerner ikke kravet om resultater."]],"c":[1],"es":"Usant. Danone viser at eierne fortsatt krever god avkastning.","ed":"Husk: purpose uten resultater holder ikke.","kt":"Stakeholder theory (Freeman): firms should create value for all stakeholders (customers, employees, suppliers, communities, financiers), not only shareholders.","src":"L4 slide 9 · L4 slide 20"},{"id":"SB120","l":"L4","t":"Business Roundtable statement","f":"m","d":2,"p":"H","sc":"none","s":"The 2019 Business Roundtable statement, signed by about 200 US CEOs, represented:","o":[["A shift to all stakeholders","Riktig: CEO-ene lovet verdi for alle stakeholders."],["A promise to stop paying dividends for now","Feil: det sto ingenting om å stoppe utbytte."],["Support for Friedman's view","Feil: den ble sett som et brudd med Friedman."],["A new binding US law","Feil: den var frivillig, ikke lov."]],"c":[0],"es":"Business Roundtable 2019 = skifte mot alle stakeholders.","ed":"Husk: frivillig erklæring, ikke lov.","kt":"","src":"L4 slide 6-11 · L4 slide 14-16"},{"id":"SB121","l":"L4","t":"Criticism of stakeholder theory","f":"m","d":2,"p":"H","sc":"none","s":"Jensen's (2002) main criticism of stakeholder theory is that:","o":[["It makes firms too short-term","Feil: short-termism er en annen kritikk."],["It makes boards unnecessary","Feil: Jensen sier det gir mer agency-kostnader, ikke at styret blir unødvendig."],["It forces managers to ignore shareholders","Feil: poenget er målbarhet, ikke å ignorere eiere."],["It lets managers set vague goals","Riktig: vage mål gjør ledere uansvarlige."]],"c":[3],"es":"Jensen: stakeholder theory gir ledere vage mål, så de blir vanskelige å holde ansvarlige.","ed":"Husk: mange mål = ingen mål.","kt":"","src":"L4 slide 20 · Bok s. 81 (3.2.2)"},{"id":"SB122","l":"L4","t":"Criticism of stakeholder theory","f":"m","d":3,"p":"H","sc":"none","s":"Bebchuk and Tallarita (2020) criticise \"stakeholderists\" because:","o":[["No way to balance conflicting interests","Riktig: ingen måte å balansere konflikter."],["They claim interests never conflict","Feil: kritikken er at konfliktene overses, ikke at de påstås ikke å finnes."],["They want all profits paid as dividends","Feil: utbytte er ikke en del av kritikken."],["They want regulators to set stakeholder weights","Feil: kritikken er at lederne selv bestemmer vektene."]],"c":[0],"es":"Stakeholderists har ingen metode for å veie interesser som krasjer.","ed":"Husk: hvem vinner når ansatte og eiere vil ulike ting?","kt":"","src":"L4 slide 20-21"},{"id":"SB123","l":"L4","t":"Criticism of stakeholder theory","f":"t","d":3,"p":"M","sc":"none","s":"True or false: One view is that the Business Roundtable statement was unnecessary, because the business judgment rule already lets directors do what it says.","o":[["True","Riktig. Business judgment rule beskytter allerede styrets valg, så erklæringen endret lite."],["False","Feil. Business judgment rule beskytter allerede styrets valg, så erklæringen endret lite."]],"c":[0],"es":"Sant. Business judgment rule lar allerede styret ta hensyn til stakeholders.","ed":"Husk: domstolen overprøver sjelden styrets vurderinger.","kt":"","src":"L4 slide 23-25 · Bok s. 87 (3.3.2)"},{"id":"SB124","l":"L4","t":"Corporate governance models","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A US private equity firm buys a Norwegian company with 300 employees and wants only owner-appointed board members. What should it expect?","o":[["Foreign owners are banned from the board","Feil: utenlandske eiere er tillatt."],["Employees can take over the firm","Feil: ansatte får plasser, ikke kontroll."],["Nothing; Norway is like the US","Feil: Norge er ikke som USA her."],["Employees can demand board seats","Riktig: ansatte har rett til styreplasser."]],"c":[3],"es":"I Norge kan ansatte kreve styreplasser.","ed":"Husk: Norge har stakeholder-elementer i loven.","kt":"Stakeholder governance model: governance where groups beyond shareholders (e.g. employees) have formal influence, as in Norway and Germany.","src":"L4 slide 19 · Bok s. 362 (12.3.1)"},{"id":"SB125","l":"L4","t":"Shareholder vs stakeholder","f":"m","d":3,"p":"M","sc":"short","s":"In 2022 Patagonia's founder gave the company to a trust and a non-profit that uses the profits to fight climate change. This structure:","o":[["removes the need to make a profit","Feil: profitt trengs for å finansiere arbeidet."],["locks in the purpose","Riktig: purpose er låst."],["makes Patagonia state-owned","Feil: eierskapet er privat."],["maximises value for outside investors","Feil: det finnes ingen eksterne profittsøkende eiere."]],"c":[1],"es":"Trust-strukturen låser formålet fast. Profitten går til klima.","ed":"Husk: steward-ownership beskytter purpose.","kt":"Purpose: a company's reason for existing beyond profit; ownership structures (foundations, trusts) can protect it.","src":"L4 slide 31 · Hart & Zingales s. 8"},{"id":"SB126","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":2,"p":"H","sc":"none","s":"The central claim of Hart and Zingales (2017) is that:","o":[["Firms should maximise shareholder welfare","Riktig: dette er hovedpoenget."],["Firms should always maximise market value","Feil: de kritiserer nettopp market value-synet."],["Social issues should be left to the government","Feil: de stoler ikke helt på politikken."],["All stakeholders should count equally","Feil: de holder fast på eierne som mål."]],"c":[0],"es":"Hart og Zingales: maksimer shareholder welfare, ikke bare market value.","ed":"Husk: welfare = penger + eiernes verdier.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 2-3 · L4 slide 30-31"},{"id":"SB127","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":3,"p":"H","sc":"none","s":"According to Hart and Zingales, Friedman is right when:","o":[["the harm comes from production itself","Feil: der feiler Friedman, fordi eierne ikke kan fikse det selv."],["the activity is already banned","Feil: det er ikke deres betingelse."],["the activity is separate, like charity","Riktig: veldedighet kan eierne gjøre selv."],["shareholders care about society as well","Feil: sosiale preferanser betyr noe for non-separable."]],"c"
