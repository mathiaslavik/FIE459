kt":"","src":"L5 slide 3-6 · L5 slide 16-22 · L5 slide 24"},{"id":"SB165","l":"L5","t":"Finance as usual","f":"m","d":3,"p":"M","sc":"none","s":"Which forces push to keep the status quo instead of internalising externalities?","o":[["Integrated reporting and clawbacks","Incorrect: these are remedies against short-termism."],["Green bonds and impact investing","Incorrect: these push for change."],["Lobbying and agency problems","Correct: lobbying and agency problems keep the status quo."],["Climate lawsuits and carbon taxes","Incorrect: these push for change."]],"c":[2],"es":"Lobbying og agency problems holder på status quo.","ed":"Læreboka nevner krefter som bremser internalisering: lobbying (firmaer påvirker reglene), agency problems (ledere foretrekker et rolig liv) og ineffektive markeder. De holder på status quo. Søksmål, karbonskatt, green bonds og clawbacks presser derimot mot endring. Husk: lobbying + agency = bremser.","kt":"","src":"L5 slide 25 · Bok s. 78 (3.1.2)"},{"id":"SB166","l":"L5","t":"Market efficiency","f":"m","d":3,"p":"H","sc":"none","s":"Why can the adaptive markets hypothesis (AMH) explain that carbon risk is not yet fully priced?","o":[["Under EMH, regulators set prices","Incorrect: EMH is about information, not regulation."],["Efficiency depends on who studies the risk","Correct: if few people study a new risk, it is not priced yet."],["AMH assumes fully rational investors","Incorrect: AMH replaces the idea of fully rational investors."],["Under AMH, prices always include all information","Incorrect: that is the EMH claim."]],"c":[1],"es":"AMH: effisiens avhenger av hvor mange som studerer risikoen. Få studerer karbonrisiko, så den er ikke priset.","ed":"Efficient market hypothesis (EMH) sier at prisene alltid reflekterer all informasjon. Adaptive markets hypothesis (AMH, Lo) sier at markedet lærer over tid, og hvor effisient det er avhenger av hvor mange som analyserer en risiko. Karbonrisiko er ny, så få har studert den, og den er ikke fullt priset. Husk: AMH = markedet lærer gradvis.\n\nForkortelser: AMH = Adaptive Markets Hypothesis (markedet lærer gradvis, Lo); EMH = Efficient Market Hypothesis (prisene reflekterer all informasjon).","kt":"","src":"L5 slide 26 · Bok s. 90 (3.4) · Bok s. 91 (3.4)"},{"id":"SB167","l":"L5","t":"Market efficiency","f":"t","d":2,"p":"M","sc":"none","s":"True or false: If markets were fully efficient (EMH), active investors could not gain from better ESG insight, so everyone should invest passively.","o":[["True","Correct. Under EMH all information is already in prices, so better insight gives no gain."],["False","Incorrect. Under EMH all information is already in prices, so better insight gives no gain."]],"c":[0],"es":"Sant. Under EMH er alt priset, så bedre innsikt gir ingen gevinst.","ed":"Hvis markedet er fullt effisient, er all informasjon, også om ESG, allerede i prisen. Da kan ingen tjene på bedre analyse, og det beste er å investere passivt. Dette er en barriere for sustainable finance, fordi ingen gidder å analysere. Husk: EMH → passiv investering.\n\nForkortelser: EMH = Efficient Market Hypothesis (prisene reflekterer all informasjon).","kt":"","src":"L8 slide 68 · L5 slide 26 · Bok s. 95 (3.5)"},{"id":"SB168","l":"L5","t":"SF 1.0 and SF 2.0 governance challenges","f":"m","d":3,"p":"H","sc":"none","s":"Which challenge do both the refined shareholder model (SF 1.0) and the stakeholder model (SF 2.0) face?","o":[["Both assume externalities are priced","Incorrect: neither assumes externalities are priced."],["How to measure social and environmental value","Correct: both struggle to measure social and environmental value."],["The shareholder model has no challenges","Incorrect: the shareholder model has several challenges."],["Stakeholder models make managers easier to control","Incorrect: stakeholder models make managers harder to control."]],"c":[1],"es":"Begge modellene sliter med å måle sosial og miljømessig verdi.","ed":"Både refined shareholder model (SF 1.0) og stakeholder model (SF 2.0) må måle S og E. Det er vanskelig, fordi slike verdier ikke har markedspris og krever mange antagelser. Husk: måling er den felles utfordringen.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L5 slide 27-28 · L5 slide 45"},{"id":"SB169","l":"L5","t":"Sustainable governance guidelines","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An \"ESG\" fund pays its managers bonuses based only on one-year returns. Which principle does this go against?","o":[["Maximising diversification","Incorrect: diversification is not the issue."],["Excluding all sin stocks","Incorrect: the issue is incentives, not exclusion."],["Long-term pay incentives","Correct: pay should be long-term."],["Reporting in local currency","Incorrect: currency is irrelevant."]],"c":[2],"es":"Ettårige bonuser gir short-termism. Prinsippet er langsiktig lønn.","ed":"Et ESG-fond skal tenke langsiktig, men forvalterne får bonus basert på ett års avkastning. Det gir incentiver til short-termism. Prinsippet er at lønn og incentiver skal ha samme horisont som strategien. Husk: incentiver skal matche horisonten.","kt":"Long-term incentive alignment: pay and evaluation horizons that match the long-term goals of clients and beneficiaries.","src":"L5 slide 25 · Bok s. 187 (7.1.4)"},{"id":"SB170","l":"L5","t":"Short-termism","f":"t","d":2,"p":"H","sc":"none","s":"True or false: The \"tragedy of the horizon\" means that the costs of acting are paid now, while the benefits come in the future.","o":[["True","Correct. This is the definition: the cost of acting comes now; the benefit comes in the future."],["False","Incorrect. This is the definition: the cost of acting comes now; the benefit comes in the future."]],"c":[0],"es":"Sant. Kostnaden betales nå, gevinsten kommer senere.","ed":"Tragedy of the horizon (Mark Carney) beskriver at kostnaden ved klimatiltak kommer nå, mens gevinsten kommer langt frem i tid, ofte etter horisonten til politikere og investorer. Derfor gjøres det for lite. Husk: kost nå, nytte senere.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 98 (Key concepts) · L5 slide 29"},{"id":"SB171","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"Which practice increases short-termism?","o":[["Integrated reporting","Incorrect: integrated reporting aims for a longer horizon."],["Bonuses paid later, based on long-term results","Incorrect: deferred bonuses are a remedy."],["Buy-and-hold investing","Incorrect: buy-and-hold is long-term."],["Quarterly reporting","Correct: quarterly reporting pushes short-term thinking."]],"c":[3],"es":"Kvartalsrapportering presser ledere til å tenke kortsiktig.","ed":"Kvartalsrapportering gir press på ledere for å levere gode tall hvert kvartal. Det kan føre til kutt i langsiktige investeringer. Integrated reporting, utsatt bonus og buy-and-hold er tiltak mot short-termism. Husk: hyppig rapportering = mer short-termism.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 77 (Table 3.1)"},{"id":"SB172","l":"L5","t":"Short-termism","f":"m","d":3,"p":"M","sc":"none","s":"What is the trade-off of reporting less often (e.g. dropping quarterly reports)?","o":[["No trade-off; both improve","Incorrect: the market gets less information."],["Firms would not need to disclose anything","Incorrect: important news must still be published."],["Managers would face more pressure","Incorrect: pressure falls."],["Less pressure, but less information","Correct: less pressure, but less information."]],"c":[3],"es":"Mindre press på ledere, men markedet får mindre informasjon.","ed":"Sjeldnere rapportering reduserer presset på ledere for kortsiktige resultater, så de kan velge bedre langsiktige prosjekter. Ulempen er at investorene får mindre informasjon. Det er en trade-off. Husk: mindre press ↔ mindre info.","kt":"","src":"Bok s. 91 (3.4.1)"},{"id":"SB173","l":"L5","t":"Executive compensation","f":"m","d":3,"p":"H","sc":"none","s":"Which pay rule lets a firm take back money already paid to executives?","o":[["An annual cash bonus","Incorrect: an annual cash bonus causes short-termism."],["A clawback provision","Correct: a clawback takes back pay already paid."],["A longer vesting period","Incorrect: vesting delays selling but does not take pay back."],["A deferred reward","Incorrect: deferral delays payment but does not take it back."]],"c":[1],"es":"Clawback = firmaet kan kreve tilbake lønn som allerede er betalt.","ed":"En clawback gir firmaet rett til å kreve tilbake bonus som allerede er utbetalt, for eksempel hvis resultatene senere viser seg å være feil. Deferral og vesting utsetter utbetalingen, men tar ikke tilbake det som er betalt. Husk: clawback = ta tilbake, deferral = vent.","kt":"","src":"Bok s. 92 (3.4.2) · L5 slide 29"},{"id":"SB174","l":"L5","t":"ESG-linked executive pay","f":"m","d":3,"p":"H","sc":"none","s":"What does the course say about linking CEO pay to ESG goals?","o":[["The link to ESG results is weak","Correct: the link to ESG results is weak."],["It always cuts emissions a lot","Incorrect: the effect is weak."],["ESG pay goals are always clear and measurable","Incorrect: the goals are often vague."],["CEOs cannot affect sustainability","Incorrect: CEOs can affect sustainability."]],"c":[0],"es":"Koblingen mellom ESG-lønn og ESG-resultater er svak.","ed":"Forskningen finner bare en svak sammenheng mellom ESG-mål i lederlønn og faktiske ESG-resultater, og ingen bevist årsakssammenheng. Mange ESG-mål er vage og vurderes skjønnsmessig. Husk: korrelasjon, ikke kausalitet.","kt":"","src":"L5 slide 31-38 · Bok s. 87 (3.3.2)"},{"id":"SB175","l":"L5","t":"ESG-linked executive pay","f":"t","d":3,"p":"M","sc":"extended_course_case","s":"True or false: Starbucks moved sustainability from the annual bonus into a three-year part of executives' equity pay, making the incentive more long-term.","o":[["True","Correct. Starbucks moved the sustainability goal into three-year equity pay, which is more long-term."],["False","Incorrect. Starbucks moved the sustainability goal into three-year equity pay, which is more long-term."]],"c":[0],"es":"Sant. Starbucks flyttet målet fra årlig bonus til treårig aksjelønn.","ed":"Starbucks flyttet bærekraftsmålet fra den årlige bonusen til en treårig del av aksjebasert lønn. Lengre periode betyr at lederne belønnes for langsiktige resultater. Husk: lengre måleperiode = mindre short-termism.","kt":"","src":"L5 slide 39-44 · Bok s. 92 (3.4.2)"},{"id":"SB176","l":"L5","t":"Corporate governance models","f":"m","d":3,"p":"M","sc":"none","s":"Which governance problem is typical in European and Asian firms with a controlling shareholder?","o":[["Many small owners fail to monitor managers","Incorrect: that is typical of the US and UK."],["Tunnelling by the big owner","Correct: the big owner can take value from small owners (tunnelling)."],["Managers are replaced too quickly","Incorrect: managers are rarely replaced in these systems."],["Too much shareholder control","Incorrect: this is not the problem with controlling owners."]],"c":[1],"es":"Storeieren kan ta verdier fra småeierne = tunnelling.","ed":"I USA og UK er eierskapet spredt, og hovedproblemet er eier mot leder. I Europa og Asia har mange firmaer en kontrollerende eier. Da blir problemet at storeieren kan flytte verdier til seg selv på bekostning av småeierne, kalt tunnelling. Husk: spredt eierskap = eier vs leder; konsentrert = stor vs liten eier.","kt":"","src":"Bok s. 84 (3.3)"},{"id":"SB177","l":"L5","t":"Governance mechanisms for sustainability","f":"m","d":3,"p":"M","sc":"none","s":"Which governance tool can build sustainability into a firm?","o":[["A board sustainability committee","Correct: a board sustainability committee builds it in."],["Removing loan covenants","Incorrect: not proposed."],["Keeping long-term investors away","Incorrect: the book wants to attract long-term investors."],["Banning integrated reporting","Incorrect: integrated reporting is promoted."]],"c":[0],"es":"En sustainability committee i styret bygger bærekraft inn.","ed":"Læreboka foreslår flere governance-verktøy for å bygge inn bærekraft: en sustainability committee i styret, integrated reporting, langsiktige incentiver og å tiltrekke seg langsiktige investorer. Husk: styret må eie bærekraft.","kt":"","src":"Bok s. 87 (3.3.2) · Bok s. 88 (3.3.2)"},{"id":"SB178","l":"L5","t":"Organisational forms","f":"m","d":3,"p":"L","sc":"none","s":"A major drawback of a cooperative is that:","o":[["It must maximise value for outside owners","Incorrect: a cooperative works for its members."],["It can only raise equity from members","Correct: it can only raise equity from members."],["It cannot align with customers","Incorrect: aligning with customers is its strength."],["It is a private B Lab label","Incorrect: that describes B Corp."]],"c":[1],"es":"Et samvirke kan bare hente egenkapital fra medlemmene.","ed":"Et samvirke eies av medlemmene (kunder eller produsenter), og det er en styrke fordi interessene er samkjørte. Ulempen er at det bare kan hente egenkapital fra medlemmene, ikke fra eksterne investorer. Det kan begrense vekst. Husk: samvirke = begrenset kapitaltilgang.","kt":"","src":"Bok s. 88 (3.3.3) · Bok s. 89 (3.3.3)","e":1},{"id":"SB179","l":"L5","t":"Investor engagement","f":"t","d":3,"p":"H","sc":"short","s":"True or false: McCahery, Sautner and Starks (2016) find that long-term investors prefer to talk privately with managers before selling, and engage more than short-term investors.","o":[["True","Correct. The study finds long-term investors engage more and sell only as a last resort."],["False","Incorrect. The study finds long-term investors engage more and sell only as a last resort."]],"c":[0],"es":"Sant. Langsiktige investorer snakker med ledelsen før de selger.","ed":"McCahery, Sautner og Starks finner at mye engagement skjer i det stille, gjennom private samtaler med ledelsen. Langsiktige investorer engasjerer mer enn kortsiktige, og bruker exit som siste utvei. Husk: voice først, exit sist.","kt":"Voice vs exit: voice = engagement and voting to change a firm; exit = selling the shares (\"Wall Street walk\").","src":"Bok s. 199 (8.2.5) · L8 slide 58 · L8 slide 71"},{"id":"SB180","l":"L5","t":"Engagement","f":"m","d":3,"p":"H","sc":"none","s":"Why does divestment (exit) have less impact than engagement (voice)?","o":[["Sold shares are cancelled","Incorrect: sold shares are not cancelled."],["Someone else just buys the shares","Correct: someone else just buys the shares."],["Divestment is illegal for EU investors","Incorrect: divestment is legal."],["Engagement always works","Incorrect: engagement can also fail."]],"c":[1],"es":"Når du selger, kjøper noen andre. Firmaet endrer seg ikke.","ed":"Når du selger aksjer, kjøper en annen investor dem. Firmaet får de samme pengene og endrer seg ikke nødvendigvis. Med engagement beholder du eierskapet og kan påvirke ledelsen direkte. Husk: exit flytter bare eierskapet.","kt":"","src":"Bok s. 89 (3.3.4) · Bok s. 21 (1.4.1) · L8 slide 58 · L9 slide 32"},{"id":"SB181","l":"L5","t":"Marking-to-market","f":"m","d":4,"p":"L","sc":"none","s":"Marking-to-market does the most damage for which kind of assets (Plantin, Sapra and Shin, 2008)?","o":[["Long-term, illiquid bank loans","Correct: illiquid loans get distorted prices."],["Short-term, liquid assets like stocks","Incorrect: for liquid assets it works well."],["All assets equally","Incorrect: the effect differs by asset."],["Cash","Incorrect: cash has no such distortion."]],"c":[0],"es":"Mark-to-market skader mest for langsiktige, illikvide banklån.","ed":"Mark-to-market betyr å verdsette eiendeler til dagens markedspris. For likvide aksjer fungerer det godt. For langsiktige, illikvide banklån finnes det knapt markedspriser, og prisene kan svinge mye uten grunn. Det kan skape short-termism. Husk: illikvid = støyete priser.","kt":"","src":"Bok s. 93 (3.4.4) · Bok s. 94 (3.4.4)","e":1},{"id":"SB182","l":"L5","t":"Supervisory treatment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Higher capital rules for illiquid private investments than for listed assets can discourage long-term green projects like land restoration.","o":[["True","Correct. Illiquid private investments carry high capital charges, which discourages long-term projects."],["False","Incorrect. Illiquid private investments carry high capital charges, which discourages long-term projects."]],"c":[0],"es":"Sant. Høye kapitalkrav for illikvide investeringer gjør langsiktige grønne prosjekter dyrere.","ed":"Kapitalregler for forsikring og pensjon gir høyere kapitalkrav for illikvide, private investeringer enn for børsnoterte. Langsiktige grønne prosjekter, som restaurering av natur, er ofte illikvide og blir derfor dyrere å eie. Husk: regler kan straffe langsiktighet.","kt":"","src":"Bok s. 94 (3.4.5) · L5 slide 30"},{"id":"SB183","l":"L5","t":"Short-termism","f":"m","d":2,"p":"L","sc":"none","s":"What do Davies et al. (2014) find about UK and US stock prices?","o":[["Prices underweight the far future","Correct: prices give too little weight to the far future."],["Prices are perfectly long-term","Incorrect: the evidence shows myopia."],["Prices give too much weight to the future","Incorrect: that is the opposite."],["Short-termism exists only in emerging markets","Incorrect: the study is on UK and US stocks."]],"c":[0],"es":"Aksjeprisene vekter fjern fremtid for lite. Det er myopia.","ed":"Davies et al. finner at aksjeprisene i UK og USA vekter kontantstrømmer langt frem i tid for lite. Markedet er altså nærsynt (myopic). Det gjør langsiktige investeringer mindre attraktive. Husk: myopia = fremtiden undervurderes.","kt":"","src":"Bok s. 94 (3.4.5)","e":1},{"id":"SB184","l":"L5","t":"Behavioural biases","f":"m","d":2,"p":"L","sc":"none","s":"An example of collaborative consumption is:","o":[["Buying a car to impress neighbours","Incorrect: that is competitive consumption driven by status."],["Buying a new phone before the old one breaks","Incorrect: that is overconsumption."],["The sharing economy","Correct: the sharing economy is collaborative consumption."],["Expensive parties to show status","Incorrect: that is competitive consumption."]],"c":[2],"es":"Sharing economy er collaborative consumption.","ed":"Collaborative consumption betyr å dele tilgang til ting i stedet for at alle eier sitt eget, for eksempel bildeling. Competitive consumption er forbruk for status. Overconsumption er å kjøpe nytt før det gamle er utslitt. Husk: dele = collaborative.","kt":"","src":"Bok s. 75 (3.1.1) · Bok s. 76 (3.1.1)","e":1},{"id":"SB185","l":"L5","t":"Corporate scandals","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Scandals like Enron, Volkswagen and Olympus show that one regional governance model is better, since scandals only happen in Anglo-Saxon countries.","o":[["True","Incorrect. Scandals happened in the US (Enron), Germany (VW) and Japan (Olympus); no model is superior."],["False","Correct. Scandals happened in the US (Enron), Germany (VW) and Japan (Olympus); no model is superior."]],"c":[1],"es":"Usant. Skandaler skjer i alle regioner. Ingen modell er best.","ed":"Enron (USA), Volkswagen (Tyskland) og Olympus (Japan) viser at skandaler skjer under alle styringsmodeller. Læreboka konkluderer med at ingen regional modell er best. Hver har sine svakheter. Husk: skandaler overalt.","kt":"","src":"Bok s. 78 (3.1.2) · Bok s. 79 (Box 3.1)"},{"id":"SB186","l":"L5","t":"Players in sustainability","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about the time horizon of different players is correct?","o":[["Investors always think long-term","Incorrect: investors can be short-term."],["Governments: up to four years","Correct: governments have a horizon of up to four years."],["Households play no role","Incorrect: households steer through consumption."],["Firms have the shortest horizon","Incorrect: firms have medium to long horizons."]],"c":[1],"es":"Myndigheter har horisont på opptil fire år (valgperioden).","ed":"Læreboka viser tidshorisonten til ulike aktører. Myndigheter tenker opp til fire år, til neste valg. Investorer kan være kortsiktige på grunn av kvartalsvise målinger. Firmaer har medium til lang horisont. Husk: politikere = valgperioden.","kt":"","src":"Bok s. 77 (Table 3.1)"},{"id":"SB187","l":"L5","t":"Fiduciary duty","f":"m","d":3,"p":"M","sc":"none","s":"What does the EU expert group recommend about fiduciary duty?","o":[["Limit it to short-term returns only","Incorrect: the duty is widened."],["Make it include sustainability","Correct: fiduciary duty should include sustainability."],["Remove fiduciary duty","Incorrect: it is clarified, not removed."],["Apply it only to banks","Incorrect: it targets institutional investors."]],"c":[1],"es":"EU-gruppen vil at fiduciary duty skal inkludere bærekraft.","ed":"Fiduciary duty er forvalterens plikt til å handle i kundenes interesse. EU-ekspertgruppen anbefaler å klargjøre at denne plikten inkluderer bærekraftsfaktorer og kundenes preferanser. Husk: fiduciary duty utvides til bærekraft.","kt":"","src":"Bok s. 86 (3.3.1) · Bok s. 97 (Key concepts)"},{"id":"SB188","l":"L5","t":"Short-termism","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Fund managers should be judged over the same horizon as their strategy, e.g. three- or five-year averages instead of quarterly results.","o":[["True","Correct. Evaluation should match the strategy's horizon, e.g. three- or five-year averages."],["False","Incorrect. Evaluation should match the strategy's horizon, e.g. three- or five-year averages."]],"c":[0],"es":"Sant. Vurder forvaltere over samme horisont som strategien.","ed":"Hvis en forvalter har en langsiktig strategi, men vurderes hvert kvartal, får hun incentiver til å tenke kortsiktig. Læreboka anbefaler å måle over samme periode som strategien, for eksempel 3–5 år. Husk: langsiktig strategi = langsiktig måling.","kt":"","src":"Bok s. 92 (3.4.3) · Bok s. 93 (3.4.3)"},{"id":"SB189","l":"L5","t":"Governance summary","f":"m","d":4,"p":"H","sc":"none","s":"Which statement best sums up the governance lecture?","o":[["Stakeholder value always lowers agency costs","Incorrect: stakeholder value can raise agency costs."],["Governance is irrelevant to sustainability","Incorrect: governance is central."],["Stakeholder focus adds value but raises agency costs","Correct: stakeholder focus adds value but raises agency costs."],["Shareholder value already prices in all externalities","Incorrect: externalities are not internalised."]],"c":[2],"es":"Stakeholder-fokus kan gi verdi, men øker agency-kostnadene.","ed":"Hovedpoenget i governance-forelesningen: stakeholder-fokus kan gi langsiktig verdi, men flere mål gjør det lettere for ledere å unngå ansvar, så agency costs øker. God governance må balansere dette. Husk: stakeholder = verdi + agency-risiko.","kt":"","src":"L5 slide 45 · L5 slide 27-28"},{"id":"SB190","l":"L5","t":"Forces for change","f":"m","d":3,"p":"M","sc":"short","s":"Climate lawsuits such as Milieudefensie v Shell (2021) are increasing. What does this mean for investors?","o":[["Stop all engagement","Incorrect: the risk is a reason to engage."],["Inaction carries more legal risk","Correct: doing nothing carries more legal risk."],["All oil firms will soon go bankrupt","Incorrect: it does not mean sure bankruptcy."],["Courts cannot affect firms","Incorrect: courts can affect strategy and value."]],"c":[1],"es":"Søksmål gjør passivitet mer risikabelt juridisk.","ed":"Klimasøksmål som Milieudefensie mot Shell gjør at manglende klimatiltak kan få juridiske konsekvenser. Det gjør externalities og svak governance til en finansiell risiko for investorer. Husk: litigation gjør klima material.","kt":"Climate litigation: legal action against firms or governments over climate change, e.g. demanding emission cuts or damages.","src":"L5 slide 25"},{"id":"SB191","l":"L5","t":"Governance models","f":"m","d":3,"p":"M","sc":"none","s":"The textbook wants to \"combine the best of both worlds\". Which strength of a model is being combined?","o":[["The shareholder model's long horizon","Incorrect: the shareholder model is criticised for short-termism."],["The stakeholder model's broad view","Correct: the stakeholder model's strength is its broad view."],["The stakeholder model's takeover market","Incorrect: takeover discipline is weak in stakeholder systems."],["Takeover defences","Incorrect: takeover defences weaken discipline."]],"c":[1],"es":"Stakeholder-modellens styrke er det brede synet.","ed":"Læreboka vil kombinere styrkene: shareholder-modellen har tydelig disiplin (målbart mål, takeover-marked), mens stakeholder-modellen har et bredt syn på verdiskaping. Husk: shareholder = disiplin, stakeholder = bredde.","kt":"","src":"Bok s. 84 (3.3) · Bok s. 85 (3.3.1)"},{"id":"SB192","l":"L5","t":"Integrated reporting and investor base","f":"m","d":3,"p":"M","sc":"none","s":"How can firms attract long-term investors (Knauer and Serafeim, 2014)?","o":[["Through integrated thinking and reporting","Correct: integrated thinking and reporting attract long-term investors."],["By beating quarterly earnings forecasts","Incorrect: this attracts short-term investors."],["By big annual bonuses tied to the share price","Incorrect: this reinforces short-termism."],["By listing on many exchanges","Incorrect: not the mechanism."]],"c":[0],"es":"Integrated thinking og reporting tiltrekker langsiktige investorer.","ed":"Knauer og Serafeim viser at firmaer kan påvirke hvilke investorer de får. Integrated reporting, som kobler bærekraft til langsiktig strategi, tiltrekker langsiktige investorer. Fokus på kvartalstall tiltrekker kortsiktige. Husk: firmaet kan velge sine investorer.","kt":"","src":"Bok s. 92 (3.4.1) · Bok s. 87 (3.3.2)"},{"id":"SB193","l":"L5","t":"Governance of sustainability","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A mining firm wants its board to be accountable for cutting emissions over ten years, without greenwashing. What is the best measure?","o":[["Quarterly emission targets","Incorrect: quarterly targets are too short for a ten-year goal."],["A yearly bonus judged by the CEO herself","Incorrect: vague, self-judged targets invite greenwashing."],["Pay for audited multi-year cuts","Correct: pay for audited, multi-year emission cuts."],["Use only the share price","Incorrect: the share price does not capture externalities."]],"c":[2],"es":"Lønn for reviderte, flerårige kutt.","ed":"Gode ESG-incentiver er målbare, langsiktige og verifisert av en uavhengig part. Lønn knyttet til reviderte utslippskutt over flere år møter alle tre kravene. Vage mål som CEO-en vurderer selv, inviterer til greenwashing. Husk: målbart + langsiktig + revidert.","kt":"","src":"L5 slide 9 · L5 slide 19 · L5 slide 36-37 · L5 slide 44 · L7 slide 20 · Bok s. 87 (3.3.2)"},{"id":"TR20","l":"L5","t":"Agency problems with debt","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A heavily indebted firm skips a profitable energy-saving project because most of the gain would go to creditors. This is:","o":[["Adverse selection","Incorrect: the problem arises after the debt exists."],["Debt overhang (underinvestment)","Correct: debt overhang: owners skip good projects."],["Asset substitution (too much risk)","Incorrect: asset substitution is choosing more risk."],["The lemons problem","Incorrect: lemons is adverse selection."]],"c":[1],"es":"Gjelden tar mesteparten av gevinsten, så eierne dropper prosjektet = debt overhang.","ed":"Debt overhang (Myers): når firmaet har mye gjeld, går mye av gevinsten fra nye prosjekter til kreditorene. Eierne betaler kostnaden, men får lite igjen, så de dropper lønnsomme prosjekter. Det gir for lite investering, også i energisparing. Husk: debt overhang = for lite investering.","kt":"","src":"Opptak L5 ca. 22 min · Opptak L10 ca. 15 min"},{"id":"TR21","l":"L5","t":"Board monitoring","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"A firm's CEO also chairs the board. Investors fear the board cannot check for hidden supply chain abuse. What is the best fix?","o":[["Appoint an independent chair","Correct: an independent chair can check the CEO."],["Give the CEO a fixed salary","Incorrect: a fixed salary does not fix oversight."],["Remove independent directors","Incorrect: independence is what makes monitoring work."],["Give the CEO more votes","Incorrect: more power weakens oversight."]],"c":[0],"es":"CEO som også er styreleder kontrollerer seg selv. Velg en uavhengig styreleder.","ed":"CEO duality betyr at samme person er CEO og styreleder. Da overvåker CEO-en seg selv, og styret kan ikke kontrollere ordentlig, for eksempel risikoen for misbruk i leverandørkjeden. En uavhengig styreleder styrker kontrollen. Husk: skill rollene.","kt":"CEO duality: the CEO is also chair of the board, so management effectively monitors itself.","src":"Opptak L5 ca. 31 min"},{"id":"TR22","l":"L5","t":"Shareholder governance tools","f":"m","d":3,"p":"M","sc":"none","s":"A big shareholder threatens to sell unless the firm cleans up its cocoa supply chain. Why can this work before any shares are sold?","o":[["It gives a seat on the audit committee","Incorrect: exiting does not give board seats."],["A big sale would push the price down","Correct: a big sale would push the price down."],["US shareholder votes are always binding","Incorrect: US shareholder votes are often non-binding."],["A sale would remove the CEO","Incorrect: selling shares does not fire anyone."]],"c":[1],"es":"Et stort salg ville presset kursen ned. Trusselen alene virker.","ed":"Threat of exit virker før noe selges: hvis en stor eier selger, faller aksjekursen, og det skader lederne (aksjeopsjoner, omdømme, takeover-risiko). Derfor kan trusselen alene få ledelsen til å handle. Husk: trusselen er verktøyet.","kt":"","src":"Opptak L5 ca. 28 min"},{"id":"TR23","l":"L5","t":"ESG-linked executive pay","f":"m","d":3,"p":"H","sc":"short","s":"Which design of ESG-linked CEO pay is best?","o":[["A bonus for any revenue growth","Incorrect: revenue is financial, and annual cash adds short-termism."],["No performance conditions","Incorrect: no conditions means no incentive."],["Vague goals that the board judges each year","Incorrect: vague, self-judged goals are what critics warn about."],["Measurable targets paid over years","Correct: measurable targets paid over several years."]],"c":[3],"es":"Målbare mål betalt over flere år.","ed":"Kritikken mot ESG-lønn er at målene ofte er vage, vurderes av styret selv og er kortsiktige. Den beste utformingen er målbare mål, betalt ut over flere år. Husk: målbart + langsiktig.","kt":"","src":"Opptak L5 ca. 61 min · Opptak L5 ca. 65 min"},{"id":"TR24","l":"L5","t":"ESG-linked executive pay","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The study in the course shows that linking CEO pay to ESG causes better ESG ratings.","o":[["True","Incorrect. The study finds only a weak correlation; firms with good ratings may simply choose ESG pay."],["False","Correct. The study finds only a weak correlation; firms with good ratings may simply choose ESG pay."]],"c":[1],"es":"Usant. Det er bare en svak korrelasjon, ikke bevis for årsak.","ed":"Studien finner en svak positiv sammenheng, men ikke at ESG-lønn forårsaker bedre ratinger. Det kan være omvendt: firmaer som allerede er gode på ESG, velger oftere ESG-lønn (reverse causality). Husk: korrelasjon ≠ kausalitet.","kt":"","src":"Opptak L5 ca. 61 min"},{"id":"TR25","l":"L5","t":"Governance challenges by framework","f":"m","d":3,"p":"M","sc":"none","s":"Climate lawsuits have risen sharply, suggesting firms do not deal with climate risk. Which agency reason does the course give?","o":[["Creditors force too much green investment","Incorrect: this is not one of the obstacles."],["Shareholders cannot sue","Incorrect: lawsuits rise because people do sue."],["Climate risk is already priced","Incorrect: the lecture questions this."],["Managers prefer a quiet life","Correct: managers prefer a quiet life."]],"c":[3],"es":"Ledere foretrekker et rolig liv. Å endre strategi koster dem innsats.","ed":"Et agency problem er at ledere foretrekker et rolig liv (quiet life). Å endre strategi for å håndtere klimarisiko krever mye innsats og risiko for lederen personlig. Derfor utsettes det, og søksmålene øker. Husk: quiet life = agency problem.","kt":"","src":"Opptak L5 ca. 42 min"},{"id":"TR26","l":"L5","t":"Shareholder vs stakeholder conflicts","f":"m","d":3,"p":"M","sc":"short","s":"CEOs are less likely to close units or lay off workers near headquarters. This shows:","o":[["Layoffs near HQ always destroy value","Incorrect: the point is that value-adding cuts are skipped."],["A conflict with nearby workers","Correct: CEOs protect workers they know."],["Distance does not affect decisions","Incorrect: proximity does matter."],["Adverse selection","Incorrect: this is about managers' choices, not hidden information."]],"c":[1],"es":"CEO-er beskytter arbeidere de kjenner, selv om kutt kunne gitt verdi.","ed":"CEO-er unngår å kutte i enheter nær hovedkontoret, selv når det kunne økt verdien. De har personlige relasjoner til de ansatte der. Det er en agency-konflikt: lederens hensyn går foran eiernes interesse. Husk: nærhet påvirker beslutninger.","kt":"","src":"Opptak L5 ca. 48 min"},{"id":"CX044","l":"L6","t":"Business model","f":"t","d":2,"p":"H","sc":"none","s":"Does a business model describe how a firm creates, delivers and captures value?","o":[["Yes","Riktig. Dette er Osterwalder og Pigneurs definisjon."],["No","Feil. Dette er Osterwalder og Pigneurs definisjon."]],"c":[0],"es":"Ja: create, deliver, capture.","ed":"Tre deler (Johnson m.fl.): value proposition, profit formula, nøkkelressurser og prosesser.","kt":"","src":"L6 slide 9 · Bok s. 125 (5.2.2.1)","k":1},{"id":"CX045","l":"L6","t":"Materiality","f":"m","d":2,"p":"H","sc":"none","s":"Which standard looks at materiality from the investor's (financial) point of view:","o":[["The Equator Principles","Det er prinsipper for prosjektfinansiering i bank."],["SASB","SASB: hva som er finansielt vesentlig for investorer, per bransje."],["Ostrom's design principles","Det handler om styring av fellesressurser."],["GRI","GRI ser også på påvirkning på samfunn, for alle stakeholders."]],"c":[1],"es":"SASB = investorer. GRI = alle stakeholders.","ed":"SASB (outside-in) + GRI (inside-out) dekker til sammen double materiality.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders).","kt":"","src":"L6 slide 50-51 · L1 slide 36 · PwC s. 29","k":1},{"id":"CX046","l":"L6","t":"Materiality","f":"t","d":2,"p":"H","sc":"none","s":"Do Khan, Serafeim and Yoon find that good performance on immaterial ESG issues predicts higher stock returns?","o":[["Yes","Feil. Bare material issues gir meravkastning. Immaterial issues gjør det ikke."],["No","Riktig. Bare material issues gir meravkastning. Immaterial issues gjør det ikke."]],"c":[1],"es":"Nei: bare material issues teller.","ed":"Poenget: fokuser på ESG-temaene som faktisk er vesentlige for bransjen.","kt":"","src":"L6 slide 52 · Bok s. 129 (5.2.3.2) · Bok s. 130 (Box 5.4) · Folketrygdfondet s. 15","k":1},{"id":"CX047","l":"L6","t":"Materiality","f":"m","d":2,"p":"H","sc":"none","s":"The issue most likely to be material for a retail bank is:","o":[["Water use in production","En bank har knapt produksjon som bruker vann."],["Biodiversity at mine sites","Det er material for gruveselskaper."],["Fuel efficiency of its vehicle fleet","Det er material for transportselskaper."],["Data security and privacy","For en bank er kundedata og tillit sentralt."]],"c":[3],"es":"Materiality avhenger av bransjen.","ed":"Samme ESG-tema kan være avgjørende for én bransje og uvesentlig for en annen. SASB lager derfor bransjespesifikke standarder.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer).","kt":"","src":"Bok s. 134 (5.3) · L6 slide 51","k":1},{"id":"CX048","l":"L6","t":"Intangibles","f":"m","d":2,"p":"H","sc":"none","s":"Most intangible resources, such as employee skills, are found:","o":[["In the cash flow statement","Kontantstrømoppstillingen viser ikke slike ressurser."],["Under current liabilities","De er ikke gjeld."],["Among tangible fixed assets","De er per definisjon ikke fysiske."],["Off the balance sheet","De fleste står ikke i regnskapet."]],"c":[3],"es":"Intangibles = mest utenfor balansen.","ed":"Derfor sier regnskapet lite om verdien til kunnskapsbedrifter, og ESG-forhold som påvirker ansatte og kunder blir viktige.","kt":"","src":"L6 slide 20 · Bok s. 127 (Figure 5.3) · L6 slide 23","k":1},{"id":"CX049","l":"L6","t":"Oatly case","f":"m","d":2,"p":"H","sc":"none","s":"The main lesson from Oatly losing market share to big rivals is that:","o":[["Big firms cannot sell oat drinks","De gjorde nettopp det."],["ESG reporting hurt Oatly's sales","Rapportering var ikke problemet."],["Green products can never be profitable","Det er for bastant."],["Green products need a hard-to-copy edge","Uten konkurransefortrinn kan andre kopiere og presse prisen."]],"c":[3],"es":"Bærekraft + konkurransefortrinn.","ed":"Oatly vokste med havremelk, men store aktører kopierte produktet billigere, og Oatly måtte kutte kostnader.","kt":"","src":"L6 slide 5-18 · L6 slide 35-36 · L6 slide 75 · Bok s. 119 (5.1) · Bok s. 121 (5.2.1)","k":1},{"id":"CX050","l":"L6","t":"Value drivers","f":"m","d":2,"p":"H","sc":"none","s":"An energy-efficiency upgrade that cuts operating costs raises firm value mainly through:","o":[["Higher sales growth","Salget endres ikke direkte."],["Higher margins","Lavere kostnader per krone omsetning = høyere margin."],["A lower tax rate","Skattesatsen endres ikke."],["More shares outstanding","Det har ingenting med verdiskaping å gjøre."]],"c":[1],"es":"Lavere kostnader = høyere margin.","ed":"Value drivers: sales growth, margins, return on capital, cash flows. ESG påvirker verdien gjennom disse.","kt":"","src":"L6 slide 2 · L6 slide 32-34 · L9 slide 6","k":1},{"id":"SB194","l":"L6","t":"Business model","f":"m","d":1,"p":"H","sc":"none","s":"According to Osterwalder and Pigneur (2010), a business model describes:","o":[["The firm's legal structure","Incorrect: legal structure is a governance topic."],["The firm's material ESG issues","Incorrect: that is a materiality assessment."],["The firm's plan for the next five years","Incorrect: a five-year plan is closer to strategy."],["How a firm creates and captures value","Correct: a business model is how a firm creates and captures value."]],"c":[3],"es":"Business model = hvordan firmaet skaper og fanger verdi.","ed":"Osterwalder og Pigneur definerer en business model som hvordan en organisasjon skaper, leverer og fanger verdi. Det handler om hva firmaet tilbyr, til hvem, og hvordan det tjener penger. Strategi er planen for å utvikle modellen. Husk: create + capture value.","kt":"","src":"L6 slide 9 · Bok s. 125 (5.2.2.1)"},{"id":"SB195","l":"L6","t":"Business model","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the three parts of a successful business model (Johnson et al., 2008)?","o":[["A profit formula","Correct: a profit formula is one of the three parts."],["A dual-class share structure","Incorrect: share structure is governance."],["An investment-grade credit rating","Incorrect: a credit rating is not a business model part."],["A materiality matrix","Incorrect: materiality belongs to sustainability analysis."]],"c":[0],"es":"En profit formula er en av de tre delene.","ed":"Johnson et al. sier at en vellykket business model har tre deler: et customer value proposition (hva kunden får), en profit formula (hvordan firmaet tjener penger) og key resources and processes (hva som trengs for å levere). Husk: verdi for kunden, profitt, ressurser.","kt":"","src":"L6 slide 9 · Bok s. 125 (5.2.2.1) · Bok s. 126 (5.2.2.1)"},{"id":"SB196","l":"L6","t":"Business model","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Joyce and Paquin's triple-layered canvas adds a governance layer and a regulation layer to the original canvas.","o":[["True","Incorrect. The two added layers are an environmental layer and a social layer, not governance and regulation."],["False","Correct. The two added layers are an environmental layer and a social layer, not governance and regulation."]],"c":[1],"es":"Usant. De to nye lagene er miljø og sosialt.","ed":"Joyce og Paquin bygger på Osterwalders business model canvas, som er det økonomiske laget. De legger til to lag: et environmental layer (life-cycle perspective: hele livsløpet til produktet, fra råvarer til avfall) og et social layer (stakeholder perspective: ansatte, lokalsamfunn, kunder). Governance og regulering er ikke egne lag. Husk: triple = økonomisk + miljø + sosialt.","kt":"","src":"Bok s. 126 (5.2.2.1)"},{"id":"SB197","l":"L6","t":"Competitive position","f":"m","d":2,"p":"H","sc":"none","s":"The four broad sources of competitive advantage are:","o":[["Financial, manufactured, natural and social capital","Incorrect: these are some of the six capitals of integrated reporting."],["Sales growth, margins, capital, cash flows","Incorrect: these are value drivers."],["Cost, differentiation, focus, diversification","Incorrect: these resemble Porter's generic strategies."],["Resources, knowledge, people and culture, networks","Correct: resources, knowledge, people and culture, networks."]],"c":[3],"es":"Fire kilder: ressurser, kunnskap, mennesker og kultur, nettverk.","ed":"Læreboka grupperer konkurransefortrinn i fire: resources (f.eks. billige råvarer), knowledge (R&D, teknologi, patenter), people and culture (ansatte, ledelse) og networks/access (nettverkseffekter, kunderelasjoner). Fortrinnet viser seg i value drivers som vekst og margin. Husk: ressurser, kunnskap, folk, nettverk.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"","src":"L6 slide 12 · Bok s. 121 (5.2.1.1)"},{"id":"SB198","l":"L6","t":"Competitive position","f":"m","d":3,"p":"M","sc":"none","s":"Novozymes grows twice as fast as normal chemical firms by replacing chemicals with enzymes. Which source of advantage is this?","o":[["Knowledge (R&D and technology)","Correct: Novozymes wins through R&D and technology: knowledge."],["Networks and switching costs","Incorrect: there are no network effects."],["Regulatory protection of the market","Incorrect: no regulation is mentioned."],["Natural resources","Incorrect: natural resources is the Rio Tinto example."]],"c":[0],"es":"Novozymes vinner på R&D og teknologi = knowledge.","ed":"Novozymes lager enzymer som erstatter kjemikalier i industrien. Fortrinnet kommer fra forskning og teknologi som er vanskelig å kopiere, altså knowledge. Rio Tinto er eksempelet på resources (billig jernmalm). Husk: Novozymes = knowledge.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"","src":"Bok s. 122 (Box 5.2) · Bok s. 122 (Box 5.1) · Bok s. 124 (5.2.1.6)"},{"id":"SB199","l":"L6","t":"Competitive position","f":"t","d":3,"p":"M","sc":"short","s":"True or false: Kodak invented a digital camera in 1975 but stuck with its profitable film business. This shows that existing profits can block new business models.","o":[["True","Correct. Kodak stuck with profitable film; existing profits blocked the new digital model."],["False","Incorrect. Kodak stuck with profitable film; existing profits blocked the new digital model."]],"c":[0],"es":"Sant. Kodak ville ikke ødelegge sin lønnsomme filmforretning.","ed":"Kodak oppfant det digitale kameraet, men satset videre på film fordi det var så lønnsomt. Chesbrough forklarer at eksisterende investeringer og kontantstrømmer gjør firmaer motvillige til å kannibalisere seg selv. Det samme kan skje med fossile firmaer og grønne alternativer. Husk: dagens profitt kan blokkere fornyelse.","kt":"Business model innovation: changing how a firm creates, delivers and captures value, often requiring cannibalisation of existing profits.","src":"Bok s. 126 (5.2.2.2) · Bok s. 132 (5.2.4)"},{"id":"SB200","l":"L6","t":"Competitive position","f":"t","d":3,"p":"L","sc":"none","s":"True or false: High sales growth lasts much longer than high profit margins (Chan, Karceski and Lakonishok, 2003).","o":[["True","Incorrect. It is the reverse: high margins last much longer than high sales growth."],["False","Correct. It is the reverse: high margins last much longer than high sales growth."]],"c":[1],"es":"Usant. Høye marginer varer lenger enn høy vekst.","ed":"Chan, Karceski og Lakonishok finner at høy salgsvekst sjelden varer lenge, fordi markeder modnes og konkurrenter kommer inn. Høye marginer er mer stabile, fordi de ofte bygger på varige konkurransefortrinn. Husk: vekst forsvinner raskt, marginer varer.","kt":"","src":"Bok s. 124 (5.2.1.6)","e":1},{"id":"SB201","l":"L6","t":"Intangibles","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A software firm trades at 15 times book value. Its main assets are engineers, code and customers. Why are ESG issues like employee satisfaction relevant?","o":[["Most value is in intangibles","Correct: most of the value sits in intangibles like staff and customers."],["Physical assets are always overvalued","Incorrect: the point is where value comes from."],["ESG ratings are part of book value","Incorrect: ESG ratings are not book value."],["They are not relevant","Incorrect: they are very relevant."]],"c":[0],"es":"Mesteparten av verdien ligger i intangibles som ansatte og kunder.","ed":"Når et firma handles til 15 ganger bokført verdi, ligger det meste av verdien i ting som ikke står i balansen: ingeniører, kode, kunderelasjoner. Hvis ansatte er misfornøyde og slutter, forsvinner verdien. Derfor er ESG-forhold som trivsel material. Husk: intangibles = mesteparten av verdien.","kt":"Intangible resources: non-physical sources of value (human capital, know-how, brands, relationships); many are not recognised as accounting assets.","src":"L6 slide 20 · Bok s. 127 (Figure 5.3) · L6 slide 23"},{"id":"SB202","l":"L6","t":"Intangibles","f":"m","d":3,"p":"H","sc":"none","s":"What is the difference between intangible assets and intangible resources?","o":[["Only assets are on the balance sheet","Correct: only intangible assets are on the balance sheet."],["Resources cannot affect value","Incorrect: resources can affect value."],["Resources are narrower than assets","Incorrect: resources are broader, not narrower."],["Goodwill measures all resources exactly","Incorrect: goodwill does not measure everything."]],"c":[0],"es":"Bare intangible assets står i balansen. Intangible resources er bredere.","ed":"Intangible assets er de immaterielle eiendelene som oppfyller regnskapsdefinisjonen og kan balanseføres, som kjøpte patenter. Intangible resources er bredere og omfatter også kultur, kunnskap og relasjoner som ikke står i balansen. Husk: assets ⊂ resources.","kt":"","src":"L6 slide 21 · Bok s. 127 (5.2.3.1) · Bok s. 128 (5.2.3.1)"},{"id":"SB203","l":"L6","t":"Intangibles","f":"m","d":4,"p":"M","sc":"short","s":"A few platforms (e.g. Alphabet, Meta) take most of the profits in digital ads. Which features of intangibles explain this \"winner takes all\" result?","o":[["Scalability and synergies","Correct: code and data scale cheaply and reinforce each other."],["Intangibles are fully on the balance sheet","Incorrect: most intangibles are not on the balance sheet."],["No spillovers","Incorrect: intangibles often have spillovers."],["Low sunk costs","Incorrect: intangibles have high sunk costs."]],"c":[0],"es":"Kode og data er billig å skalere og forsterker hverandre.","ed":"Intangibles har fire egenskaper: scalability (kan kopieres nesten gratis), synergies (forsterker hverandre), spillovers (andre kan dra nytte) og sunk costs (kan ikke selges videre). Skalering og synergier gjør at én plattform kan ta nesten hele markedet. Husk: scalability + synergies = winner takes all.","kt":"Scalability: an asset can be used many times at little extra cost; synergies: intangibles become more valuable in combination.","src":"L6 slide 21 · Bok s. 131 (5.2.3.3)"},{"id":"SB204","l":"L6","t":"Intangibles","f":"m","d":3,"p":"M","sc":"none","s":"What happens when firms disclose too little about their intangibles (Lev, 2000)?","o":[["R&D-heavy firms are overvalued","Incorrect: R&D-heavy firms tend to be undervalued."],["Financial reports become more useful","Incorrect: reports become less useful."],["Higher cost of capital","Correct: too little information raises the cost of capital."],["A lower cost of capital","Incorrect: information gaps raise, not lower, the cost of capital."]],"c":[2],"es":"For lite info gir høyere kapitalkostnad.","ed":"Lev (2000) sier at når firmaer rapporterer lite om intangibles, får investorene for lite informasjon (information asymmetry). De krever da høyere avkastning, så cost of capital øker. Insidere kan også tjene på informasjonen. Husk: lite info → høyere kapitalkostnad.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"","src":"Bok s. 131 (5.2.3.4) · Bok s. 132 (5.2.3.4)"},{"id":"SB205","l":"L6","t":"Intangibles","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Edmans (2012) finds that firms with happier employees do worse on the stock market.","o":[["True","Incorrect. Edmans finds the opposite: firms with happier employees do better on the stock market."],["False","Correct. Edmans finds the opposite: firms with happier employees do better on the stock market."]],"c":[1],"es":"Usant. Firmaer med fornøyde ansatte gjør det bedre på børsen.","ed":"Edmans (2012) ser på \"100 Best Companies to Work For\" og finner at firmaer med fornøyde ansatte gir høyere aksjeavkastning over tid. Markedet ser ut til å undervurdere verdien av fornøyde ansatte. Husk: glade ansatte → bedre avkastning.","kt":"","src":"L6 slide 23 · Bok s. 135 (5.3.2)"},{"id":"SB206","l":"L6","t":"Strategy","f":"m","d":3,"p":"H","sc":"short","s":"From 2009 to 2019, DONG Energy (now Ørsted) sold its oil and gas business and became a leading offshore wind firm. Which strategy element changed most?","o":[["Nothing changed","Incorrect: its whole business changed."],["Arenas","Correct: it changed which markets it is in: arenas."],["Vehicles only","Incorrect: the main change was what it does, not how it grows."],["Staging only","Incorrect: it was much more than timing."]],"c":[1],"es":"Ørsted endret hvilke markeder de er i = arenas.","ed":"Strategi kan beskrives med fem elementer: arenas (hvor vi er aktive), vehicles (hvordan vi kommer dit), differentiators, staging (rekkefølge og tempo) og economic logic. DONG Energy gikk fra olje og gass til havvind, altså et helt nytt marked. Husk: arenas = hvilke markeder.","kt":"Strategy elements (Hambrick and Fredrickson): arenas (where), vehicles (how to get there), differentiators (how to win), staging (speed and sequence), economic logic (how returns are made).","src":"L6 slide 27 · Bok s. 132 (5.2.4)"},{"id":"SB207","l":"L6","t":"Strategy","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A car maker can build electric cars but waits, because they would hurt its profitable spare parts business. This shows:","o":[["Existing interests blocking change","Correct: existing interests block change."],["Adverse selection","Incorrect: this is internal resistance, not hidden information."],["The rebound effect of the circular economy","Incorrect: rebound is about the circular economy."],["A successful cost leadership strategy","Incorrect: failing to adapt can be a costly mistake."]],"c":[0],"es":"Lønnsom reservedelsforretning blokkerer endring.","ed":"Bilprodusenten tjener godt på reservedeler til fossilbiler, og elbiler trenger færre deler. Eksisterende interesser og inntekter gjør firmaet motvillig til å endre forretningsmodellen, som Kodak med film. Husk: lønnsom gammel modell bremser ny.","kt":"","src":"Bok s. 126 (5.2.2.2) · Bok s. 125 (Box 5.3) · Bok s. 132 (5.2.4)"},{"id":"SB208","l":"L6","t":"Value drivers","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Oatly's ROE fell sharply from 2021 to 2022, even though asset turnover improved. What caused the fall (DuPont)?","o":[["Higher leverage","Incorrect: leverage went up."],["Lower taxes","Incorrect: taxes are not the explanation."],["A worse profit margin","Correct: a worse profit margin caused the fall."],["Lower asset turnover","Incorrect: asset turnover improved."]],"c":[2],"es":"ROE falt fordi marginen kollapset.","ed":"DuPont deler ROE i tre: profit margin × asset turnover × leverage. Oatlys asset turnover og leverage økte, men marginen falt kraftig fordi tapene vokste. Derfor falt ROE. Husk: ROE = margin × turnover × leverage.\n\nForkortelser: ROE = Return on Equity (avkastning på egenkapital).","kt":"DuPont analysis: ROE = net profit margin × asset turnover × financial leverage; it shows which value driver explains changes in returns.","src":"L6 slide 34-35"},{"id":"SB209","l":"L6","t":"Value drivers","f":"m","d":1,"p":"H","sc":"none","s":"Which value drivers does the course use to judge a firm's ability to generate free cash flow?","o":[["Interest rate, inflation, GDP and FX","Incorrect: these are macro factors."],["Growth, margins, return on capital","Correct: growth, margins and return on capital."],["ESG rating, emissions, staff, market share","Incorrect: these can affect the drivers but are not the drivers."],["Board size, owners, share price, dividends","Incorrect: these are not value drivers."]],"c":[1],"es":"Value drivers: vekst, marginer, avkastning på kapital.","ed":"Value drivers er det som bestemmer free cash flow og dermed verdien: vekst i salg, marginer og avkastning på investert kapital (ROIC). ESG-forhold påvirker verdien gjennom disse driverne. Husk: growth, margin, ROIC.\n\nForkortelser: GDP = Gross Domestic Product (BNP); ROIC = Return on Invested Capital (avkastning på investert kapital).","kt":"","src":"L6 slide 2 · L6 slide 32-34 · L9 slide 6"},{"id":"SB210","l":"L6","t":"Value drivers","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Free cash flow is operating cash flow minus investment, so a fast-growing firm can have positive operating cash flow but negative free cash flow.","o":[["True","Correct. FCF = OCF minus investment, so heavy growth investment can make FCF negative."],["False","Incorrect. FCF = OCF minus investment, so heavy growth investment can make FCF negative."]],"c":[0],"es":"Sant. Store investeringer kan gjøre FCF negativ selv om OCF er positiv.","ed":"Free cash flow er operasjonell kontantstrøm minus investeringer. Et firma i rask vekst må investere mye, så FCF kan være negativ selv om driften gir positiv kontantstrøm. Husk: FCF = OCF − investering.\n\nForkortelser: FCF = Free Cash Flow (fri kontantstrøm); OCF = Operating Cash Flow (kontantstrøm fra drift).","kt":"","src":"L6 slide 33 · L9 slide 5"},{"id":"SB211","l":"L6","t":"Oatly case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Oatly lost market share when competition in oat milk grew. What is the lesson?","o":[["Lower impact means strong financial results","Incorrect: positive impact does not guarantee good results."],["Green products need a hard-to-copy edge","Correct: green products need an edge that is hard to copy."],["Firms with positive impact cannot lose market share","Incorrect: the case shows it can happen."],["A strong brand guarantees success","Incorrect: a brand is not enough."]],"c":[1],"es":"Grønne produkter trenger en fordel som er vanskelig å kopiere.","ed":"Oatly hadde et grønt produkt og et sterkt merke, men store konkurrenter kopierte havremelken og tok markedsandeler. Positiv impact er ikke nok: man trenger et konkurransefortrinn som er sjeldent og vanskelig å kopiere. Husk: impact ≠ konkurransefortrinn.","kt":"","src":"L6 slide 5-18 · L6 slide 35-36 · L6 slide 75 · Bok s. 119 (5.1) · Bok s. 121 (5.2.1)"},{"id":"SB212","l":"L6","t":"Company purpose","f":"m","d":3,"p":"M","sc":"none","s":"How does a firm's purpose relate to maximising integrated value (IV)?","o":[["Purpose replaces measuring value","Incorrect: IV must still be measured."],["Purpose first; IV puts it into practice","Correct: purpose comes first; IV puts it into practice."],["IV comes first; purpose is just marketing","Incorrect: the book says the reverse."],["They are unrelated","Incorrect: they are linked."]],"c":[1],"es":"Purpose kommer først. IV setter det ut i praksis.","ed":"Læreboka sier at purpose (hvorfor firmaet finnes) er mer grunnleggende enn integrated value. Å maksimere IV (F + S + E) er en god måte å sette purpose ut i praksis og måle det. Husk: purpose = hvorfor, IV = hvordan.\n\nForkortelser: IV = Integrated Value (F + S + E).","kt":"","src":"L6 slide 41-43 · Bok s. 141 (5.5) · Bok s. 142 (5.5.1)"},{"id":"SB213","l":"L6","t":"Stakeholder analysis","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A Norwegian wind farm developer analyses stakeholders. Sámi reindeer herders have high interest and, after the 2021 Fosen ruling, high power. How should they be treated?","o":[["Manage closely","Correct: high interest and high power means manage closely."],["Monitor only","Incorrect: they have both interest and power."],["Ignore them","Incorrect: all affected parties should be included."],["Keep informed only","Incorrect: the ruling gave them high power."]],"c":[0],"es":"Høy interesse og høy makt = manage closely.","ed":"En stakeholder-matrise har to akser: interest og power. Høy interesse og høy makt = key players, som må følges tett (manage closely). Etter Fosen-dommen har reindriftssamene både stor interesse og stor makt over vindkraftprosjekter. Husk: høy/høy = manage closely.","kt":"Interest-power matrix: classifies stakeholders by how much they care (interest) and can affect the project (power) to decide how to engage them.","src":"L6 slide 45 · L6 slide 46"},{"id":"SB214","l":"L6","t":"Stakeholder impact map","f":"m","d":4,"p":"H","sc":"none","s":"When reading a stakeholder impact map, what should an analyst look for?","o":[["Only positive impacts","Incorrect: negative impacts are important."],["Only shareholders","Incorrect: the map is meant to look beyond shareholders."],["Conflicts between goals and impacts","Correct: look for conflicts between goals and impacts."],["The total number of stakeholders","Incorrect: the content matters, not the count."]],"c":[2],"es":"Se etter konflikter mellom mål og påvirkning.","ed":"Et stakeholder impact map viser hva hver stakeholder ønsker, og hvordan firmaet faktisk påvirker dem. Der det er konflikt mellom mål og påvirkning, kan det komme fremtidige problemer (regulering, boikott, søksmål). Husk: friksjon = fremtidig risiko.","kt":"","src":"L6 slide 46-48 · Bok s. 136 (Table 5.2) · Bok s. 137 (Table 5.3)"},{"id":"SB215","l":"L6","t":"Materiality","f":"m","d":3,"p":"H","sc":"none","s":"How do SASB and GRI define materiality differently?","o":[["SASB: investors; GRI: also society","Correct: SASB is for investors; GRI also covers impact on society."],["SASB: society; GRI: investors only","Incorrect: the definitions are swapped."],["They use the same definition","Incorrect: they use different definitions."],["Both use pure accounting materiality","Incorrect: neither is pure accounting materiality."]],"c":[0],"es":"SASB: for investorer. GRI: også for samfunnet.","ed":"SASB definerer materialitet fra investorens perspektiv: hva påvirker firmaets verdi (financial materiality). GRI ser på hva firmaet påvirker i samfunn og miljø, for alle stakeholders (impact materiality). Sammen gir de double materiality. Husk: SASB = investor, GRI = samfunn.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders).","kt":"","src":"L6 slide 50-51 · L1 slide 36 · PwC s. 29"},{"id":"SB216","l":"L6","t":"Materiality","f":"m","d":3,"p":"H","sc":"none","s":"Khan, Serafeim and Yoon (2016) find that:","o":[["Doing well on immaterial issues pays most","Incorrect: doing well on immaterial issues is linked to weaker results."],["Material issues predict higher returns","Correct: doing well on material issues predicts higher returns."],["Sustainability has no link to returns","Incorrect: there is a link."],["All sustainability work pays off equally","Incorrect: material vs immaterial is the key."]],"c":[1],"es":"Godt arbeid på material issues gir høyere avkastning.","ed":"Khan, Serafeim og Yoon bruker SASB-kartet for hva som er material i hver bransje. Firmaer som er gode på material issues, gjør det bedre på børsen. Innsats på immaterielle issues gir ingen meravkastning. Husk: fokuser på det som er material.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer).","kt":"","src":"L6 slide 52 · Bok s. 129 (5.2.3.2) · Bok s. 130 (Box 5.4) · Folketrygdfondet s. 15"},{"id":"SB217","l":"L6","t":"Materiality","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about accounting, market and business materiality is correct?","o":[["Accounting materiality covers intangible resources","Incorrect: accounting materiality covers assets only."],["Business materiality is the same as SASB's","Incorrect: business materiality is broader than SASB."],["Market materiality: anything that moves the price","Correct: market materiality is anything that moves the price."],["The three types always match","Incorrect: the three types can differ."]],"c":[2],"es":"Market materiality = alt som flytter prisen.","ed":"Tre typer materialitet: accounting materiality (det som påvirker regnskapet), market materiality (det som flytter aksjekursen) og business materiality (det som påvirker firmaets langsiktige verdi, bredere). De kan overlappe, men trenger ikke. Husk: regnskap, kurs, verdi.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer).","kt":"","src":"Bok s. 128 (5.2.3.2) · Bok s. 129 (Figure 5.5)"},{"id":"SB218","l":"L6","t":"Materiality","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Materiality differs even within an industry; for example, an iron ore miner in Australia faces fewer labour and community issues than a gold miner in Africa.","o":[["True","Correct. Materiality depends on industry, business model and location, even within one industry."],["False","Incorrect. Materiality depends on industry, business model and location, even within one industry."]],"c":[0],"es":"Sant. Materialitet avhenger av bransje, modell og sted.","ed":"Materialitet varierer ikke bare mellom bransjer, men også innen samme bransje. En jernmalmgruve i Australia har andre risikoer enn en gullgruve i Afrika (arbeidsforhold, lokalsamfunn). Husk: sted og modell betyr noe.","kt":"","src":"Bok s. 134 (5.3) · L6 slide 51"},{"id":"SB219","l":"L6","t":"Materiality matrix","f":"m","d":2,"p":"M","sc":"none","s":"What do the two axes of a typical materiality matrix show?","o":[["Stakeholder importance vs firm impact","Correct: importance to stakeholders vs impact on the firm."],["Share price vs book value","Incorrect: these are valuation metrics."],["Default probability vs loss given default","Incorrect: these are credit risk measures."],["Revenue growth vs margin","Incorrect: these are value drivers."]],"c":[0],"es":"Aksene: viktighet for stakeholders mot påvirkning på firmaet.","ed":"En materiality matrix har to akser: hvor viktig saken er for stakeholders, og hvor stor påvirkning den har på firmaet. Saker høyt på begge er de mest material. Husk: stakeholder-viktighet × firma-påvirkning.","kt":"","src":"L6 slide 55 · Bok s. 130 (Figure 5.6) · Bok s. 136 (5.3.5)"},{"id":"SB220","l":"L6","t":"Materiality","f":"m","d":4,"p":"M","sc":"none","s":"The main idea of Rogers and Serafeim's \"Pathways to Materiality\" is that:","o":[["Materiality is fixed by accounting rules","Incorrect: it changes over time."],["Only governance issues can be material","Incorrect: E and S issues are central."],["Immaterial issues stay immaterial","Incorrect: the paper says the opposite."],["Issues can become material over time","Correct: issues can become material over time."]],"c":[3],"es":"Issues kan bli material over tid.","ed":"Rogers og Serafeim viser at saker som ikke er material i dag, kan bli det når samfunnet, reguleringen eller teknologien endres. For eksempel ble klima gradvis material for mange bransjer. Husk: dynamic materiality.","kt":"","src":"L6 slide 53 · Fondsfinans s. 19 · L3 slide 17"},{"id":"SB221","l":"L6","t":"Materiality","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An analyst uses the SDGs to screen a fertiliser maker like Yara. Which link is most relevant?","o":[["SDG 16 (peace and justice)","Incorrect: not the most relevant for this firm."],["SDG 4 (quality education)","Incorrect: education is not core here."],["SDG 14 (life below water) is irrelevant","Incorrect: runoff can pollute water."],["SDG 2 (zero hunger)","Correct: fertiliser helps food production: SDG 2."]],"c":[3],"es":"Gjødsel gir mer mat = SDG 2 (zero hunger).","ed":"SDG-ene kan brukes til å se hvilke globale mål et firma bidrar til eller skader. Gjødsel øker matproduksjonen, så Yara bidrar til SDG 2 (zero hunger). Samtidig kan avrenning skade SDG 14 (liv under vann). Husk: koble SDG til kjerneproduktet.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger).","kt":"SDG exposure: whether a company's products and operations help (positive) or hinder (negative) progress on specific SDGs.","src":"L6 slide 54 · L6 slide 72"},{"id":"SB222","l":"L6","t":"Business sustainability typology","f":"m","d":3,"p":"M","sc":"none","s":"In Dyllick and Muff's typology, business sustainability 3.0:","o":[["uses the triple bottom line, still inside-out","Incorrect: that is business sustainability 2.0."],["focuses on shareholder value","Incorrect: that is business as usual."],["maximises refined shareholder value","Incorrect: that is business sustainability 1.0."],["starts from society's challenges (outside-in)","Correct: it starts from society's challenges (outside-in)."]],"c":[3],"es":"BS 3.0 starter med samfunnets problemer (outside-in).","ed":"Dyllick og Muff har en trapp: BS 1.0 = refined shareholder value. BS 2.0 = triple bottom line, men fortsatt inside-out. BS 3.0 = starter med samfunnets utfordringer og spør hvordan firmaet kan bidra (outside-in). Husk: 3.0 = outside-in.\n\nForkortelser: BS = Business Sustainability (Dyllick og Muffs trinn 1.0/2.0/3.0).","kt":"","src":"Bok s. 118 (5.1) · Bok s. 119 (Table 5.1)"},{"id":"SB223","l":"L6","t":"Transformational change","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Boards should be diverse to avoid groupthink, which may help move the firm from an inside-out to an outside-in view.","o":[["True","Correct. A diverse board avoids groupthink, which helps the firm look from the outside in."],["False","Incorrect. A diverse board avoids groupthink, which helps the firm look from the outside in."]],"c":[0],"es":"Sant. Mangfold i styret hindrer groupthink.","ed":"Et styre der alle har lik bakgrunn, risikerer groupthink og ser bare firmaets eget perspektiv. Mangfold gir flere synsvinkler og hjelper firmaet å se samfunnets utfordringer (outside-in). Husk: diversity motvirker groupthink.","kt":"","src":"Bok s. 118 (5.1) · Bok s. 119 (5.1) · L5 slide 19"},{"id":"SB224","l":"L6","t":"Material ESG issues","f":"m","d":2,"p":"M","sc":"none","s":"Which issue is correctly classified?","o":[["Supply chains and innovation - other","Correct: supply chains and innovation fall under \"other\"."],["Emissions and water use - governance","Incorrect: emissions and water are environmental."],["Ownership and voting rules - environmental","Incorrect: ownership and voting are governance."],["Worker safety - environmental","Incorrect: worker safety is social."]],"c":[0],"es":"Leverandørkjeder og innovasjon havner under \"other\".","ed":"Læreboka deler issues i environmental (utslipp, vann), social (helse og sikkerhet, ansatte), governance (eierskap, styre, stemmerett) og \"other\" (innovasjon, leverandørkjeder) som ikke passer rent i én kategori. Husk: sjekk E, S, G og \"other\".","kt":"","src":"Bok s. 134 (5.3) · Bok s. 135 (5.3.2) · Bok s. 135 (5.3.3) · Bok s. 135 (5.3.4) · L6 slide 56-58"},{"id":"SB225","l":"L6","t":"Material ESG issues","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Corporate governance is unrelated to social and environmental performance, so strong G cannot help S and E.","o":[["True","Incorrect. Good governance can drive better social and environmental performance."],["False","Correct. Good governance can drive better social and environmental performance."]],"c":[1],"es":"Usant. God governance kan drive bedre S og E.","ed":"Shrivastava og Addas finner at god governance henger sammen med god sosial og miljømessig ytelse. Et godt styre følger med på risiko og setter langsiktige mål, og det løfter også E og S. Husk: G støtter E og S.","kt":"","src":"Bok s. 135 (5.3.3)"},{"id":"SB226","l":"L6","t":"Impact","f":"m","d":3,"p":"M","sc":"none","s":"Which question is part of assessing a firm's impact?","o":[["What was its share return last quarter?","Incorrect: short-term returns are not an impact measure."],["Which SDGs does it help or harm?","Correct: which SDGs it helps or harms is an impact question."],["How many analysts cover the stock?","Incorrect: analyst coverage is not impact."],["What is its dividend payout ratio?","Incorrect: payout is not impact."]],"c":[1],"es":"Å spørre hvilke SDG-er firmaet hjelper eller skader er impact.","ed":"Impact handler om firmaets effekt på samfunn og miljø. Å spørre hvilke SDG-er firmaet bidrar til eller skader, er en vanlig måte å vurdere impact på. Finansielle tall som avkastning eller utbytte måler ikke impact. Husk: impact = effekt på verden.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger).","kt":"","src":"L6 slide 68-72"},{"id":"SB227","l":"L6","t":"Circular business models","f":"m","d":3,"p":"M","sc":"none","s":"In the circular economy \"value hill\", the aim is to:","o":[["Sell throw-away products","Incorrect: circular design makes products last longer."],["Move products down the hill fast","Incorrect: that is the linear take-make-waste logic."],["Keep products at the top longer","Correct: keep products at the top of the hill longer."],["Extract as many new raw materials as possible","Incorrect: circular models use fewer new materials."]],"c":[2],"es":"Hold produktene på toppen av bakken lengst mulig.","ed":"Value hill viser hvordan et produkt får verdi når det lages (opp bakken) og mister verdi når det kastes (ned). I den sirkulære økonomien prøver man å holde produktet på toppen lengst mulig gjennom vedlikehold, gjenbruk og oppussing. Husk: reuse, repair, refurbish.","kt":"","src":"Bok s. 137 (5.4) · Bok s. 138 (Figure 5.8) · Bok s. 139 (Box 5.6) · L6 slide 39"},{"id":"SB228","l":"L6","t":"Circular business models","f":"t","d":4,"p":"L","sc":"none","s":"True or false: Zink and Geyer (2017) argue that circular economy activities always reduce total production.","o":[["True","Incorrect. They argue the reverse: circular activities can increase total production (rebound)."],["False","Correct. They argue the reverse: circular activities can increase total production (rebound)."]],"c":[1],"es":"Usant. Sirkulære aktiviteter kan øke total produksjon (rebound).","ed":"Zink og Geyer peker på circular economy rebound: gjenbruk og resirkulering kan gjøre produkter billigere, så folk kjøper mer. Da kan total produksjon øke, og noe av miljøgevinsten forsvinner. Husk: sirkulært er ikke automatisk mindre.","kt":"","src":"Bok s. 140 (5.4) · Bok s. 54 (2.3.2)","e":1},{"id":"SB229","l":"L6","t":"Long-term value creation","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"A mining firm's $2bn desalination plant looks value-destroying in a simple NPV analysis, but value-creating in the correct one. What does the correct analysis do?","o":[["Adds only the value of the good publicity","Incorrect: the key is the protected mine cash flows, not publicity."],["Ignores the $2bn cost","Incorrect: the cost is in both analyses."],["Uses a zero discount rate","Incorrect: the discount rate is not the difference."],["Compares with and without the plant","Correct: compare the firm with and without the plant."]],"c":[3],"es":"Sammenlign med og uten anlegget. Uten det kan gruva stoppe.","ed":"En enkel NPV ser bare på anlegget: $2 mrd i kostnad og lite inntekt. Den riktige analysen spør hva som skjer uten anlegget: gruva kan miste vanntilgang og tillatelser, og kontantstrømmen forsvinner. Anlegget beskytter gruvas verdi. Husk: velg riktig counterfactual.\n\nForkortelser: NPV = Net Present Value (nåverdi).","kt":"Counterfactual (with-and-without) analysis: valuing a project by comparing the firm's cash flows with and without it.","src":"Bok s. 144 (Table 5.4) · Bok s. 145 (Table 5.6)"},{"id":"SB230","l":"L6","t":"Long-term value creation","f":"m","d":4,"p":"M","sc":"none","s":"A board accepts \"sustainability projects\" even with negative NPV, and judges \"other projects\" normally. How does the textbook see this?","o":[["Sustainability belongs to the CSR team","Incorrect: sustainability belongs in all functions."],["It is greenwashing","Incorrect: this is not the point."],["It is best practice for boards","Incorrect: the book wants sustainability effects valued."],["It is not real integration","Correct: separate rules for \"green projects\" is not real integration."]],"c":[3],"es":"Å ha egne regler for \"bærekraftsprosjekter\" er prioritering, ikke integrering.","ed":"Å godta bærekraftsprosjekter med negativ NPV, men vurdere alt annet på vanlig måte, er prioritering, ikke integrering. Ekte integrering betyr at bærekraftseffekter verdsettes i alle prosjekter, som i avsaltingseksempelet. Husk: integrering = med i alle beslutninger.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar); NPV = Net Present Value (nåverdi).","kt":"","src":"Bok s. 143 (5.5.2.1) · Bok s. 144 (5.5.2.1) · Bok s. 142 (5.5.2)"},{"id":"SB231","l":"L6","t":"Long-term value creation","f":"m","d":3,"p":"H","sc":"none","s":"Which is a guideline for a firm pursuing long-term value creation (LTVC)?","o":[["Talk only to shareholders","Incorrect: talk with all stakeholders."],["Keep sustainability out of investment decisions","Incorrect: sustainability belongs in investment decisions."],["Avoid investing in intangibles","Incorrect: build long-term intangibles."],["Make purpose a key part of strategy","Correct: make purpose a key part of strategy."]],"c":[3],"es":"Gjør purpose til en sentral del av strategien.","ed":"Læreboka gir retningslinjer for long-term value creation: 1) gjør purpose sentralt i strategien, 2) integrer bærekraft i alle funksjoner, 3) kommuniser langsiktige mål med alle stakeholders, og 5) bygg viktige intangibles. Husk: purpose først.\n\nForkortelser: LTVC = Long-Term Value Creation (langsiktig verdiskaping).","kt":"","src":"Bok s. 142 (5.5.2) · Bok s. 143 (5.5.2) · Bok s. 142 (Box 5.8) · L6 slide 73-76"},{"id":"SB232","l":"L6","t":"Long-term value creation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In the KPN example, cutting marketing and network spending raises short-term returns, but soon hurts market share, and fixing it costs more than was saved.","o":[["True","Correct. Cuts give a quick gain, but lost market share costs more to win back."],["False","Incorrect. Cuts give a quick gain, but lost market share costs more to win back."]],"c":[0],"es":"Sant. Kutt gir kortsiktig gevinst, men koster mer senere.","ed":"KPN-eksempelet viser at kutt i markedsføring og nett gir bedre kortsiktige tall, men raskt fører til tap av kunder. Å vinne dem tilbake koster mer enn det man sparte. KPN styrer derfor etter KPI-er for flere stakeholders. Husk: kortsiktige kutt kan bli dyre.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall).","kt":"","src":"Bok s. 142 (Box 5.8) · Bok s. 143 (Figure 5.9)"},{"id":"SB233","l":"L6","t":"CCBJH materiality case","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Coca-Cola Bottlers Japan keeps reviewing the material issues it found in 2023. Which concept fits this?","o":[["A one-time assessment","Incorrect: the company keeps reviewing."],["Accounting materiality","Incorrect: this goes beyond the balance sheet."],["Dynamic materiality","Correct: this is dynamic materiality."],["Exclusion of sin stocks","Incorrect: exclusion is an investor strategy."]],"c":[2],"es":"Å gjennomgå material issues jevnlig = dynamic materiality.","ed":"Dynamic materiality betyr at hva som er material, endrer seg over tid. Coca-Cola Bottlers Japan gjennomgår sine material issues jevnlig og ser etter nye. Husk: materialitet må oppdateres.","kt":"","src":"L6 slide 62-67 · L6 slide 53 · Bok s. 118 (5.1)"},{"id":"SB234","l":"L6","t":"ESG integration in valuation","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A drinks company's most material issue is water scarcity, and it does worse than peers. What should an analyst do next?","o":[["Put water risk into the DCF","Correct: put water risk into the DCF through the value drivers."],["Exclude the firm at once","Incorrect: exclusion is a different strategy."],["Ignore it; water is free","Incorrect: water can become priced."],["Only lower the firm's ESG score","Incorrect: integration means using value drivers, not just a score."]],"c":[0],"es":"Ta vannrisiko inn i DCF.","ed":"Når et issue er material og firmaet er svakere enn konkurrentene, bør analytikeren vurdere hvordan det påvirker value drivers (vekst, margin, investeringer) og legge det inn i DCF-en. Bare å senke en ESG-score er ikke integrering. Husk: material issue → value driver → verdi.\n\nForkortelser: DCF = Discounted Cash Flow (verdsettelse ved å diskontere fremtidige kontantstrømmer).","kt":"","src":"L6 slide 59-61 · L9 slide 7-10 · Bok s. 144 (5.5.2.1) · Bok s. 247 (Appendix)"},{"id":"SB235","l":"L6","t":"Competitive position","f":"m","d":2,"p":"L","sc":"none","s":"Which example shows \"networks/access\" as a competitive advantage?","o":[["A platform with network effects","Correct: a platform with network effects shows networks/access."],["A firm with superior R&D","Incorrect: superior R&D is knowledge."],["A firm with a strong culture","Incorrect: culture is people and culture."],["A miner with the world's cheapest ore","Incorrect: cheap ore is resources."]],"c":[0],"es":"Plattform med nettverkseffekter = networks.","ed":"Networks/access som konkurransefortrinn betyr at verdien øker med antall brukere (nettverkseffekter), som LinkedIn. Jo flere som bruker plattformen, jo mer verdifull blir den, og jo vanskeligere er den å konkurrere med. Husk: flere brukere = mer verdi.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"","src":"Bok s. 123 (5.2.1.5) · Bok s. 124 (5.2.1.5) · L6 slide 12"},{"id":"TR27","l":"L6","t":"Free cash flow","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"After repeated extreme weather, a retailer holds much larger stocks of goods. Which part of free cash flow lowers its value?","o":[["Higher revenue from green consumers","Incorrect: the change is about stock, not demand."],["Lower depreciation of buildings","Incorrect: depreciation is not related."],["A lower corporate tax rate on profits","Incorrect: inventory does not change the tax rate."],["Higher net working capital","Correct: more inventory raises net working capital."]],"c":[3],"es":"Mer lager øker net working capital og senker FCF.","ed":"Free cash flow = driftsresultat etter skatt + avskrivninger − investeringer − økning i net working capital. Større lager binder mer kapital (høyere NWC), og det trekker ned FCF og verdien. Husk: mer lager = lavere FCF.\n\nForkortelser: FCF = Free Cash F
