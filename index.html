ition risk."],["Exclusion is the only consistent strategy","Incorrect: the evidence questions that view."]],"c":[1],"es":"Exclusion kan miste innovatørene.","ed":"Olje- og gasselskaper er blant de største på grønne patenter. Hvis ESG-fond utelukker dem, mister de muligheten til å påvirke og eie innovatører. Det støtter engagement og washing machine-tanken. Husk: exclusion kan miste innovatørene.","kt":"","src":"Opptak L9 ca. 82 min"},{"id":"CX077","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"A green bond is defined by the fact that:","o":[["It carries no credit risk","Samme kredittrisiko som utstederens andre obligasjoner."],["Its proceeds fund green projects","Use of proceeds øremerket grønne prosjekter."],["Its coupon depends on KPIs","Det er en sustainability-linked bond."],["Only governments may issue it","Selskaper utsteder også green bonds."]],"c":[1],"es":"Green bond = øremerket.","ed":"Foreleser sa at sustainability bonds helt sikkert kommer på eksamen. Fire typer:\n- Green bond: grønne prosjekter.\n- Social bond: sosiale prosjekter.\n- Sustainability bond: blanding av grønt og sosialt.\n- Sustainability-linked bond: fri bruk, kupong knyttet til KPI-er.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall).","kt":"","src":"L10 slide 9-10 · Bok s. 273 (9.4.1)","k":1},{"id":"CX078","l":"L10","t":"Social bonds","f":"m","d":2,"p":"H","sc":"none","s":"The project that fits a social bond best is:","o":[["A share buyback programme","Det er ikke et sosialt prosjekt."],["Building affordable housing","Sosialt formål = social bond."],["Building a wind farm","Det er et grønt prosjekt (green bond)."],["Any corporate purpose, with a KPI-linked coupon","Det er en sustainability-linked bond."]],"c":[1],"es":"Sosiale prosjekter = social bond.","ed":"Social bonds fungerer som green bonds (use of proceeds), men pengene går til boliger, helse, utdanning eller arbeidsplasser.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall).","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min","k":1},{"id":"CX079","l":"L10","t":"Sustainability bonds","f":"m","d":2,"p":"H","sc":"none","s":"A bond that finances a MIX of green and social projects is a:","o":[["Sustainability-linked bond","SLB har ingen øremerking, men KPI-kupong."],["Social bond","Social bond er bare sosialt."],["Green bond","Green bond er bare grønt."],["Sustainability bond","Grønt + sosialt, øremerket."]],"c":[3],"es":"Grønt + sosialt = sustainability bond.","ed":"Sustainability bond = øremerket (use of proceeds). Sustainability-linked bond = KPI-knyttet kupong.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLB = Sustainability-Linked Bond (obligasjon der kupongen avhenger av bærekraftsmål).","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min","k":1},{"id":"CX080","l":"L10","t":"Sustainability-linked bonds","f":"m","d":2,"p":"H","sc":"none","s":"If the issuer of a sustainability-linked bond misses its target, typically:","o":[["It turns into a green bond","Det skjer ikke."],["The bond must be repaid at once","Det skjer ikke."],["The coupon rises","Typisk step-up: renten øker, f.eks. 0,25 prosentpoeng."],["Nothing at all happens","Da ville det ikke vært noe insentiv."]],"c":[2],"es":"Bommer på målet → høyere kupong.","ed":"Eksempel: Enel (2019), første store SLB. Risiko: lette mål kan gi greenwashing.\n\nForkortelser: SLB = Sustainability-Linked Bond (obligasjon der kupongen avhenger av bærekraftsmål).","kt":"","src":"L10 slide 9 · L10 slide 24 · L11 slide 25","k":1},{"id":"CX081","l":"L10","t":"Sustainability-linked instruments","f":"m","d":2,"p":"H","sc":"none","s":"The key difference between a green bond and a sustainability-linked bond is:","o":[["Short maturity vs long maturity bonds","Løpetid er ikke forskjellen."],["Government issuer vs company issuer","Begge kan utstedes av både stater og selskaper."],["Fixed coupon vs no coupon","Begge betaler kupong."],["Use of proceeds vs KPI-linked terms","Green: hva pengene brukes til. SLB: om selskapet når målene."]],"c":[3],"es":"Green = øremerket. SLB = KPI.","ed":"SLB gir insentiv til å forbedre hele selskapet. Green bond finansierer bestemte prosjekter.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLB = Sustainability-Linked Bond (obligasjon der kupongen avhenger av bærekraftsmål).","kt":"","src":"L10 slide 9 · L10 slide 24","k":1},{"id":"CX082","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"Compared with a conventional bond from the same issuer, a green bond's credit risk is:","o":[["About the same","Hele selskapet står bak. Pengene er øremerket, ikke ring-fenced."],["Higher","Det er ingen grunn til høyere risiko."],["Lower","Det grønne prosjektet er ikke skilt ut fra resten."],["Zero, the project secures it","Selskapet kan fortsatt gå konkurs."]],"c":[0],"es":"Samme utsteder = samme kredittrisiko.","ed":"Earmarked ≠ ring-fenced. Går selskapet konkurs, taper du på green bonden akkurat som på en vanlig obligasjon.","kt":"","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)","k":1},{"id":"CX083","l":"L10","t":"Green bonds","f":"t","d":2,"p":"H","sc":"none","s":"Is the greenium mainly explained by green bonds being less risky?","o":[["Yes","Feil. Risikoen er den samme. Greenium skyldes at etterspørselen etter grønne obligasjoner er større enn tilbudet."],["No","Riktig. Risikoen er den samme. Greenium skyldes at etterspørselen etter grønne obligasjoner er større enn tilbudet."]],"c":[1],"es":"Nei: greenium = etterspørsel, ikke lavere risiko.","ed":"Greenium er som regel liten, noen få basispunkter.","kt":"","src":"Bok s. 275 (9.4.1) · L9 slide 14","k":1},{"id":"CX084","l":"L10","t":"Bonds vs equity","f":"m","d":2,"p":"H","sc":"none","s":"Bond investors focus mostly on downside ESG risk because:","o":[["ESG never causes defaults","ESG kan øke default risk."],["They vote at general meetings","Obligasjonseiere har normalt ikke stemmerett."],["Bonds have unlimited upside","Det er aksjer som har det."],["Their upside is capped","De får maks renter og hovedstol, men kan tape ved konkurs."]],"c":[3],"es":"Begrenset oppside → fokus på nedside.","ed":"Derfor bryr obligasjonseiere seg mest om nedsiden: ESG-risiko som kan føre til konkurs (default risk).","kt":"","src":"L10 slide 3 · Bok s. 258 (9.1.5) · Bok s. 259 (9.2)","k":1},{"id":"SB363","l":"L10","t":"Bonds vs equity","f":"m","d":2,"p":"H","sc":"none","s":"Looking at debt and equity payoffs, why do bond investors focus mainly on downside ESG risk?","o":[["Their upside is capped","Correct: their upside is capped at what they are promised."],["They get all the upside","Incorrect: that describes shareholders."],["Their payoff never depends on the firm's value","Incorrect: below D, bondholders' payoff falls with firm value."],["Their votes protect them from losses","Incorrect: bondholders usually have no votes."]],"c":[0],"es":"Obligasjonseiere får maks det de er lovet. De har lite oppside, så de bryr seg mest om nedsiden.","ed":"Obligasjonseiere får maks det de er lovet (renter og hovedstol), selv om firmaet går veldig bra. Men hvis firmaet går dårlig, kan de tape. De har altså lite oppside og mye nedside, så de fokuserer på ESG-risiko som kan gi mislighold. Husk: gjeld = begrenset oppside.","kt":"","src":"L10 slide 3 · Bok s. 258 (9.1.5) · Bok s. 259 (9.2)"},{"id":"SB364","l":"L10","t":"Bond valuation","f":"m","d":2,"p":"H","sc":"none","s":"Which is a driver of CORPORATE (not sovereign) bond value?","o":[["External debt","Incorrect: external debt is a sovereign bond driver."],["Loss given default","Correct: loss given default is a corporate bond driver."],["GDP per capita","Incorrect: GDP per capita is a sovereign driver."],["Default history of the country","Incorrect: a country's default history is a sovereign driver."]],"c":[1],"es":"Loss given default er en driver for selskapsobligasjoner.","ed":"Verdien av selskapsobligasjoner avhenger av sannsynligheten for mislighold (PD) og hvor mye man taper ved mislighold (loss given default). Statsobligasjoner avhenger av makrofaktorer som GDP per innbygger, utenlandsgjeld og landets historikk. Husk: selskap = PD og LGD.\n\nForkortelser: GDP = Gross Domestic Product (BNP); PD = Probability of Default (sannsynlighet for mislighold); LGD = Loss Given Default (tap ved mislighold).","kt":"","src":"L10 slide 4 · Bok s. 256 (9.1.3.1) · Bok s. 256 (9.1.3.2)"},{"id":"SB365","l":"L10","t":"Bond valuation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Longer bonds have higher duration and so react more to interest rate changes, which is one reason the yield curve usually slopes upwards.","o":[["True","Correct. Long bonds have higher duration and react more to rate changes, so investors want a higher yield."],["False","Incorrect. Long bonds have higher duration and react more to rate changes, so investors want a higher yield."]],"c":[0],"es":"Sant. Lange obligasjoner har høyere duration og er mer rentefølsomme.","ed":"Duration måler hvor følsom obligasjonsprisen er for renteendringer. Lange obligasjoner har mer av kontantstrømmen langt frem, så prisen svinger mer. Investorer krever betaling for denne risikoen, og derfor stiger rentekurven vanligvis med løpetiden. Husk: lang løpetid = høy duration.","kt":"","src":"Bok s. 254 (9.1.3) · Bok s. 256 (9.1.3)"},{"id":"SB366","l":"L10","t":"Bond valuation","f":"m","d":3,"p":"M","sc":"none","s":"Bond X has a higher yield to maturity than bond Z. What can you say about expected returns?","o":[["Bond Z must be close to default","Incorrect: a lower yield does not mean default."],["Both earn the risk-free rate","Incorrect: risky bonds have a spread."],["X always has the higher expected return","Incorrect: a higher YTM may just reflect more default risk."],["Not necessarily higher for X","Correct: X's expected return is not necessarily higher."]],"c":[3],"es":"Høyere YTM kan bare bety høyere risiko for mislighold. Forventet avkastning er ikke nødvendigvis høyere.","ed":"Yield to maturity er avkastningen hvis alle lovede betalinger kommer. Men hvis det er risiko for mislighold, er forventede betalinger lavere enn lovede. En høy YTM kan derfor bare vise høy risiko. Husk: lovet ≠ forventet.\n\nForkortelser: YTM = Yield To Maturity (effektiv rente til forfall).","kt":"","src":"Bok s. 257 (9.1.3.2)"},{"id":"SB367","l":"L10","t":"Credit ratings","f":"m","d":2,"p":"M","sc":"none","s":"How does S&P describe the role of ESG in its credit ratings?","o":[["ESG matters; the question is how","Correct: ESG matters; the question is how."],["ESG is 90% of every rating","Incorrect: there is no fixed 90% weight."],["ESG is excluded","Incorrect: ESG is included."],["ESG is used only for country ratings","Incorrect: ESG is also used for companies."]],"c":[0],"es":"S&P: ESG betyr noe. Spørsmålet er hvordan.","ed":"S&P sier at ESG-forhold er en del av kredittvurderingen, gjennom forretningsrisiko, finansiell risiko og ledelse. ESG har ingen fast vekt, men vurderes der det påvirker kredittverdigheten. Husk: ESG er integrert i kredittanalysen.\n\nForkortelser: S&P = Standard & Poor's (ratingbyrå og indeksleverandør).","kt":"","src":"L10 slide 5 · L10 slide 7 · Bok s. 257 (9.1.4) · Bok s. 271 (9.3.3) · Bok s. 272 (9.3.3)"},{"id":"SB368","l":"L10","t":"Credit ratings","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Attig et al. (2013) find that rating agencies give LOWER credit ratings to firms with good social performance.","o":[["True","Incorrect. They find that firms with good social performance get higher, not lower, credit ratings."],["False","Correct. They find that firms with good social performance get higher, not lower, credit ratings."]],"c":[1],"es":"Usant. God sosial ytelse gir HØYERE kredittrating.","ed":"Attig et al. finner at ratingbyråer gir høyere kredittrating til firmaer med god sosial ytelse. CSR gir ikke-finansiell informasjon som tyder på lavere risiko. Husk: god CSR → bedre rating.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar).","kt":"","src":"L10 slide 6 · Bok s. 263 (9.2.2) · Bok s. 264 (9.2.2)"},{"id":"SB369","l":"L10","t":"Relevance of sustainability to bonds","f":"m","d":3,"p":"H","sc":"none","s":"Which ESG factor matters MOSTLY for sovereign (country) bonds?","o":[["Climate change and pollution","Incorrect: climate and pollution matter for both."],["Corruption and rule of law","Correct: corruption and rule of law matter most for countries."],["Product stewardship","Incorrect: product stewardship is mainly corporate."],["Diversity and employee relations","Incorrect: diversity and staff relations are mainly corporate."]],"c":[1],"es":"Korrupsjon og rule of law er viktigst for land.","ed":"For statsobligasjoner er governance-faktorer viktigst: korrupsjon, rule of law, politisk stabilitet. Disse avgjør om landet kan og vil betale. Miljøfaktorer er relevante både for land og selskaper. Husk: land = governance.","kt":"","src":"L10 slide 8 · Bok s. 260 (Table 9.1) · Bok s. 261 (9.2)"},{"id":"SB370","l":"L10","t":"Sovereign bonds and ESG","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A country with an investment-grade rating sees more corruption, weaker rule of law and social unrest, while GDP growth is still fine. What should a bond analyst expect?","o":[["Only shareholders are affected","Incorrect: sovereign bondholders bear the default risk."],["Higher credit risk","Correct: credit risk rises."],["Lower spreads","Incorrect: instability raises spreads."],["No effect; only GDP matters","Incorrect: governance matters a lot."]],"c":[1],"es":"Korrupsjon og uro gir høyere kredittrisiko.","ed":"Korrupsjon, svak rettsstat og uro henger tett sammen med dårligere kredittrating for land. Selv om veksten er god nå, øker risikoen for at landet ikke betaler. Spreaden vil stige. Husk: svak governance = høyere landrisiko.\n\nForkortelser: GDP = Gross Domestic Product (BNP).","kt":"Sovereign credit risk: the risk that a government fails to pay its debt; driven by economic, fiscal and institutional (governance) factors.","src":"Bok s. 261 (9.2.1) · Bok s. 263 (9.2.1) · L10 slide 8"},{"id":"SB371","l":"L10","t":"Sovereign bonds and ESG","f":"t","d":3,"p":"L","sc":"short","s":"True or false: Country sustainability rankings give governance the largest weight, so they partly overlap with credit ratings.","o":[["True","Correct. Governance has the largest weight, and credit ratings also weigh institutions, so they overlap."],["False","Incorrect. Governance has the largest weight, and credit ratings also weigh institutions, so they overlap."]],"c":[0],"es":"Sant. Governance veier tyngst og overlapper med kredittrating.","ed":"Bærekraftsrangeringer av land gir governance størst vekt. Kredittratinger ser også på institusjoner, korrupsjon og politikk. Derfor overlapper de, og høy bærekraftsscore henger ofte sammen med god rating. Husk: G for land ≈ kredittrisiko.","kt":"Country sustainability ranking: a score of countries on environmental, social and governance indicators, used e.g. to tilt sovereign bond portfolios.","src":"Bok s. 265 (9.3.1) · Bok s. 267 (Table 9.2)","e":1},{"id":"SB372","l":"L10","t":"Sovereign bonds and ESG","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Promised pensions and health costs that may not be affordable (e.g. in Japan and Italy) are a sovereign credit risk.","o":[["True","Correct. Promised pensions and health costs that may be unaffordable are a credit risk for a country."],["False","Incorrect. Promised pensions and health costs that may be unaffordable are a credit risk for a country."]],"c":[0],"es":"Sant. Store pensjons- og helsekostnader er en risiko for land.","ed":"Land med aldrende befolkning har lovet store pensjons- og helseutgifter. Hvis staten ikke har råd, øker gjelden og risikoen for mislighold. Læreboka legger dette til som en egen faktor for statsobligasjoner. Husk: aldring = kredittrisiko.","kt":"","src":"Bok s. 261 (9.2) · Bok s. 267 (Table 9.2)","e":1},{"id":"SB373","l":"L10","t":"Corporate bonds and ESG","f":"m","d":4,"p":"M","sc":"none","s":"The link between environmental performance and bond yields gets weaker for higher-quality bonds (Schneider, 2011). Why?","o":[["They matter most near default","Correct: environmental liabilities matter most near default."],["Those investors do not read reports","Incorrect: the reason is the payoff structure."],["Good issuers have no liabilities","Incorrect: good issuers can have liabilities."],["Safe bonds are exempt from environmental rules","Incorrect: rules apply to everyone."]],"c":[0],"es":"Miljøforpliktelser betyr mest når firmaet er nær mislighold.","ed":"For en trygg obligasjon er det lite sannsynlig at miljøforpliktelser fører til mislighold, så de påvirker renten lite. For en risikabel obligasjon kan de avgjøre om firmaet klarer å betale. Husk: ESG betyr mest nær mislighold.","kt":"","src":"Bok s. 264 (9.2.2) · L10 slide 3"},{"id":"SB374","l":"L10","t":"Corporate bonds and ESG","f":"m","d":3,"p":"M","sc":"none","s":"How can ESG lower a firm's cost of debt?","o":[["Environmental claims never come first","Incorrect: clean-up claims can rank ahead of bondholders."],["Bondholders get all the upside","Incorrect: bondholders care mostly about the downside."],["Takeover defences protect bondholders","Incorrect: takeover defences raise the cost of debt."],["Better governance protects lenders","Correct: better governance protects lenders."]],"c":[3],"es":"Bedre governance beskytter långiverne og senker lånekostnaden.","ed":"God governance gir bedre kontroll, mindre risiko for misbruk og mer forutsigbare beslutninger. Det reduserer kredittrisikoen, så långiverne krever lavere rente. Husk: governance → lavere lånekostnad.","kt":"Cost of debt: the interest rate a company pays on borrowing, which rises with default risk and loss given default.","src":"Bok s. 264 (9.2.2) · Bok s. 265 (9.2.2) · L10 slide 3"},{"id":"SB375","l":"L10","t":"Sustainability-linked bonds","f":"m","d":3,"p":"H","sc":"short","s":"In 2019 Enel issued a bond for general purposes, but the coupon rises by 0.25% if it misses its renewable energy target. How does it differ from a green bond?","o":[["It is ring-fenced","Incorrect: neither type is ring-fenced."],["The money must go to renewable projects","Incorrect: that describes a green bond."],["The coupon depends on targets","Correct: the coupon depends on meeting targets."],["It has no link to sustainability","Incorrect: the coupon is linked to a target."]],"c":[2],"es":"Dette er en sustainability-linked bond: kupongen avhenger av mål, ikke bruken av pengene.","ed":"Enels obligasjon er en sustainability-linked bond (SLB): pengene kan brukes fritt, men kupongen øker hvis firmaet ikke når et bærekraftsmål. En green bond er motsatt: pengene øremerkes grønne prosjekter, men kupongen er fast. Husk: green bond = bruk av pengene, SLB = mål styrer kupongen.\n\nForkortelser: SLB = Sustainability-Linked Bond (obligasjon der kupongen avhenger av bærekraftsmål).","kt":"Sustainability-linked bond (SLB): a general-purpose bond whose financial terms (usually the coupon) change depending on whether the issuer meets sustainability performance targets.","src":"L10 slide 9 · L10 slide 24 · L11 slide 25"},{"id":"SB376","l":"L10","t":"ESG integration in bonds","f":"m","d":3,"p":"M","sc":"none","s":"Why is engagement harder for bond investors?","o":[["Firms are not allowed to talk to bondholders","Incorrect: there is no such ban."],["There is nothing to discuss","Incorrect: there is plenty to discuss."],["They are not owners","Correct: they are lenders, not owners."],["They have majority votes","Incorrect: they have no votes outside bankruptcy."]],"c":[2],"es":"Obligasjonseiere er ikke eiere, så de har mindre makt.","ed":"Obligasjonseiere er långivere, ikke eiere. De har ikke stemmer på generalforsamlingen og bryr seg mest om å få pengene tilbake. Det gir mindre makt og mindre interesse for oppsiden enn aksjonærer har. Husk: kreditor ≠ eier.","kt":"","src":"Bok s. 270 (Box 9.1) · Bok s. 271 (Box 9.1) · L10 slide 12"},{"id":"SB377","l":"L10","t":"Relevance of bonds to sustainability","f":"m","d":3,"p":"H","sc":"none","s":"Bondholders cannot vote. Which lever do they still have?","o":[["Bonds cannot be shorted","Incorrect: shorting bad bonds is one of the levers."],["Bond markets are small","Incorrect: bond markets are larger than stock markets."],["Firms must refinance often","Correct: firms must refinance often, which gives lenders influence."],["They can replace the board at any time","Incorrect: bondholders cannot replace the board."]],"c":[2],"es":"Firmaer må refinansiere ofte, så obligasjonseiere får innflytelse.","ed":"Selv uten stemmer har obligasjonseiere innflytelse: firmaer må stadig refinansiere gjeld, og da kan investorer kreve bedre vilkår eller la være å kjøpe. De kan også shorte dårlige obligasjoner. Husk: refinansiering = makt.","kt":"","src":"L10 slide 12 · Bok s. 253 (9.1)"},{"id":"SB378","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the four core parts of the Green Bond Principles?","o":[["A lower guaranteed coupon than normal bonds","Incorrect: pricing is not part of the principles."],["An AAA rating","Incorrect: an AAA rating is not required."],["Reporting on use of proceeds","Correct: reporting on use of proceeds is one of the four parts."],["ECB approval","Incorrect: ECB approval is not required."]],"c":[2],"es":"Rapportering om bruken av pengene er en del av Green Bond Principles.","ed":"Green Bond Principles har fire kjerneelementer: 1) use of proceeds (pengene går til grønne prosjekter), 2) process for project evaluation, 3) management of proceeds, 4) reporting. De er frivillige retningslinjer. Husk: bruk, vurdering, forvaltning, rapportering.","kt":"","src":"L10 slide 9-10 · Bok s. 273 (9.4.1)"},{"id":"SB379","l":"L10","t":"Green bonds","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Green bonds are ring-fenced, so repayment depends only on the green project's cash flows, not on the issuer's overall credit.","o":[["True","Incorrect. Green bonds are earmarked but not ring-fenced; repayment depends on the whole issuer."],["False","Correct. Green bonds are earmarked but not ring-fenced; repayment depends on the whole issuer."]],"c":[1],"es":"Usant. Green bonds er øremerket, men ikke ring-fenced. Risikoen er utstederens.","ed":"En green bond er øremerket: pengene skal gå til grønne prosjekter. Men den er ikke ring-fenced: tilbakebetalingen avhenger av hele utstederen, ikke bare prosjektet. Derfor har den samme kredittrisiko som utstederens andre obligasjoner. Husk: earmarked ≠ ring-fenced.","kt":"","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)"},{"id":"SB380","l":"L10","t":"Green bonds","f":"m","d":3,"p":"H","sc":"none","s":"Green bonds yield slightly less than similar normal bonds from the same issuer. Why?","o":[["They are less liquid","Incorrect: lower liquidity would raise the yield."],["Their issuers never default","Incorrect: same issuer, same default risk."],["Demand is higher than supply","Correct: demand is higher than supply."],["They are ring-fenced from the issuer","Incorrect: green bonds are not ring-fenced."]],"c":[2],"es":"Mer etterspørsel enn tilbud presser renten ned.","ed":"Green bonds og vanlige obligasjoner fra samme utsteder har samme kredittrisiko. Når den grønne likevel har litt lavere rente (greenium), er det fordi mange investorer vil ha grønne papirer og det er få av dem. Husk: greenium = etterspørsel.","kt":"Greenium: the yield discount on a green bond versus a comparable conventional bond.","src":"Bok s. 275 (9.4.1) · L9 slide 14"},{"id":"SB381","l":"L10","t":"Green bonds","f":"m","d":3,"p":"H","sc":"none","s":"What does Flammer (2021) find around green bond issues?","o":[["Prices rise; the environment improves","Correct: share prices rise and environmental performance improves."],["Share prices fall","Incorrect: share prices rise."],["Emissions rise","Incorrect: emissions fall."],["They mainly attract short-term hedge funds","Incorrect: long-term and green investors increase."]],"c":[0],"es":"Aksjekursen stiger og miljøet blir bedre.","ed":"Flammer finner at aksjekursen stiger når firmaer utsteder green bonds (særlig første gang og når de er sertifisert). Etterpå blir miljøytelsen bedre og flere langsiktige investorer kommer inn. Det tyder på at green bonds er et troverdig signal. Husk: signalling.","kt":"","src":"L10 slide 13"},{"id":"SB382","l":"L10","t":"Green bonds","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: If a green bond and a normal bond from the same issuer have the same terms, the default risk is the same, so a lower green yield is a price for the label.","o":[["True","Correct. Same issuer and same terms means the same risk, so the lower green yield is the price of the label."],["False","Incorrect. Same issuer and same terms means the same risk, so the lower green yield is the price of the label."]],"c":[0],"es":"Sant. Samme risiko, så lavere rente er prisen for merkelappen.","ed":"Når en green bond og en vanlig obligasjon fra samme utsteder har samme vilkår, har de lik kredittrisiko, fordi green bonds ikke er ring-fenced. Den lavere renten er derfor det investorene betaler for den grønne merkelappen. Husk: greenium.","kt":"Greenium: the lower yield (higher price) investors accept on a green bond versus a comparable conventional bond.","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)"},{"id":"SB383","l":"L10","t":"Green bonds","f":"m","d":3,"p":"M","sc":"short","s":"Poland gets about 80% of its energy from coal but issues a green bond. Which challenge does this show?","o":[["Coal countries cannot issue bonds","Incorrect: there is no such bar."],["Judging the issuer's credibility","Correct: the challenge is judging the issuer's credibility."],["Countries cannot issue green bonds","Incorrect: countries can issue green bonds."],["Country green bonds are always ring-fenced","Incorrect: they are earmarked, not ring-fenced."]],"c":[1],"es":"Det er vanskelig å vurdere om utstederen er troverdig.","ed":"Polen får ca. 80 % av energien fra kull, men utsteder grønne obligasjoner. Pengene kan gå til grønne prosjekter, men landets totale politikk er fortsatt brun. Investoren må vurdere om utstederen er troverdig grønn. Husk: grønn obligasjon ≠ grønn utsteder.","kt":"","src":"Bok s. 276 (9.4.2) · Bok s. 273 (9.4.1)"},{"id":"SB384","l":"L10","t":"Social bonds","f":"m","d":3,"p":"M","sc":"none","s":"How does a social impact bond (SIB) differ from a social bond?","o":[["A SIB is ring-fenced","Incorrect: not the difference."],["A SIB pays only if goals are met","Correct: a SIB pays only if social goals are met."],["A social bond is a donation, not a bond","Incorrect: the definitions are swapped."],["There is no difference","Incorrect: they are often confused but differ."]],"c":[1],"es":"SIB betaler bare hvis målene nås. Social bond er en vanlig obligasjon.","ed":"En social bond er en vanlig obligasjon der pengene øremerkes sosiale prosjekter, og den betaler som vanlig. En social impact bond (SIB) er egentlig ikke en obligasjon: investorene får bare betalt hvis sosiale mål nås (f.eks. færre tilbakefall til kriminalitet). Husk: SIB = betaling for resultater.\n\nForkortelser: SIB = Social Impact Bond (betaler bare hvis sosiale mål nås).","kt":"","src":"Bok s. 276 (9.4.3) · Bok s. 277 (9.4.3)"},{"id":"SB385","l":"L10","t":"Sustainability-linked instruments","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Like a green bond, a sustainability-linked bond must use its money only for green or social projects.","o":[["True","Incorrect. SLB money can be used for anything; it is the coupon that is tied to sustainability targets."],["False","Correct. SLB money can be used for anything; it is the coupon that is tied to sustainability targets."]],"c":[1],"es":"Usant. SLB kan brukes til hva som helst. Kupongen avhenger av mål.","ed":"En sustainability-linked bond er general purpose: firmaet kan bruke pengene fritt. Det som er koblet til bærekraft, er vilkårene, typisk at kupongen øker hvis firmaet ikke når KPI-målene. En green bond øremerker pengene. Husk: SLB = mål, ikke bruk.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLB = Sustainability-Linked Bond (obligasjon der kupongen avhenger av bærekraftsmål).","kt":"","src":"L10 slide 9 · L10 slide 24"},{"id":"SB386","l":"L10","t":"Non-equity asset classes","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A real estate fund owns offices with energy label F. The city will ban renting out buildings below C from 2030. What should the fund do?","o":[["Raise rents","Incorrect: tenants will avoid buildings that will become unlettable."],["Sell at any price now","Incorrect: upgrading may create more value than a fire sale."],["Plan upgrades","Correct: plan upgrades before the ban."],["Wait until 2030 and see","Incorrect: waiting raises stranding risk."]],"c":[2],"es":"Planlegg oppgraderinger før forbudet.","ed":"Fra 2030 kan bygg under energiklasse C ikke leies ut. Kontorbygg med klasse F risikerer å bli stranded assets. Fondet bør planlegge oppgraderinger nå og ta det med i verdsettelsen og salgsplanene. Husk: unngå stranded buildings.","kt":"Energy Performance Certificate (EPC): a rating of a building's energy efficiency; minimum standards can make low-rated buildings unlettable.","src":"L10 slide 18-19 · L10 slide 14"},{"id":"SB387","l":"L10","t":"Real estate","f":"m","d":3,"p":"M","sc":"none","s":"In which stage of the real estate cycle do you manage ESG for the building, use property managers and engage with tenants?","o":[["Investment decision","Incorrect: this stage presents issues to the investment committee."],["Deal sourcing","Incorrect: deal sourcing is about screening."],["Sale","Incorrect: the sale stage is about adding value at exit."],["Ownership","Correct: the ownership stage."]],"c":[3],"es":"Ownership-fasen: drift, eiendomsforvaltere og leietakere.","ed":"Eiendomssyklusen har fire faser: deal sourcing (finn material ESG-issues ved screening), investment decision (presenter for investeringskomiteen), ownership (driv bygget, bruk eiendomsforvaltere, samarbeid med leietakere) og sale (få verdien betalt ved salg). Husk: drift = ownership.","kt":"","src":"L10 slide 18-19"},{"id":"SB388","l":"L10","t":"Real estate","f":"t","d":3,"p":"M","sc":"none","s":"True or false: \"Split incentives\" in real estate: owners pay for energy upgrades but tenants get the lower bills, so too little is invested.","o":[["True","Correct. The owner pays for upgrades while tenants get lower bills, so too little is invested."],["False","Incorrect. The owner pays for upgrades while tenants get lower bills, so too little is invested."]],"c":[0],"es":"Sant. Eier betaler, leietaker sparer, så det investeres for lite.","ed":"Split incentives: eieren betaler for energioppgraderingen, men leietakeren får lavere strømregning. Da har eieren lite incentiv til å investere. Green leases, der gevinsten deles, kan løse problemet. Husk: den som betaler, får ikke gevinsten.","kt":"","src":"L10 slide 19-20 · L10 slide 17"},{"id":"SB389","l":"L10","t":"Credit ratings and ESG","f":"m","d":3,"p":"M","sc":"short","s":"After a short-seller report in 2023, Adani's bond prices fell sharply, and Adani cut investment and bought back bonds. Which bond market lever is this?","o":[["Green bond rules","Incorrect: the pressure came from market prices."],["Issuing new shares","Incorrect: the example is about bonds."],["Bondholders' votes at the AGM","Incorrect: bondholders do not vote at AGMs."],["Short selling and repricing","Correct: short selling and repricing pushed Adani."]],"c":[3],"es":"Short selling og prisfall presset Adani.","ed":"Etter short seller-rapporten falt Adanis obligasjonspriser, og det ble dyrere å låne. Adani måtte kutte investeringer og kjøpe tilbake obligasjoner. Obligasjonsmarkedet kan altså disiplinere gjennom pris og short selling. Husk: lavere pris = dyrere kapital.\n\nForkortelser: AGM = Annual General Meeting (generalforsamling).","kt":"Refinancing need: because bonds mature, issuers must return to investors, who can demand higher spreads or refuse to roll over debt.","src":"L10 slide 12 · Bok s. 265 (9.2.2)"},{"id":"SB390","l":"L10","t":"Derivatives","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"An EU aluminium producer fears rising carbon prices will squeeze margins. Which instrument hedges this best?","o":[["Buying carbon allowance futures","Correct: buying carbon allowance futures locks in the carbon cost."],["Buying cat bonds","Incorrect: cat bonds cover natural disasters."],["Buying green power certificates","Incorrect: green power certificates do not cover ETS costs."],["Issuing a social bond","Incorrect: a social bond does not hedge carbon prices."]],"c":[0],"es":"Kjøp futures på karbonkvoter for å låse prisen.","ed":"Aluminiumsprodusenten må kjøpe karbonkvoter i EU ETS. Ved å kjøpe futures på kvotene låser den prisen og sikrer seg mot at karbonprisen stiger. Husk: hedge = lås kostnaden med derivater.\n\nForkortelser: ETS = Emissions Trading System (EUs kvotemarked for CO2).","kt":"Emission allowance futures: contracts to buy EU ETS allowances at a fixed price in the future, hedging carbon cost risk.","src":"L10 slide 23"},{"id":"SB391","l":"L10","t":"Derivatives","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"SBM Offshore's 2019 interest rate swap with ING was linked to ESG. How?","o":[["The amount doubled if emissions rose","Incorrect: the spread changes, not the amount."],["The bank gave money to charity","Incorrect: that is the Siemens Gamesa swap."],["A rate linked to its ESG score","Correct: the rate is linked to its ESG score."],["The swap was cancelled if targets were missed","Incorrect: missing the target triggers a penalty spread."]],"c":[2],"es":"Renten i swappen var koblet til ESG-scoren.","ed":"SBM Offshore sin rentebytteavtale (swap) med ING hadde en rente som ble justert etter SBMs ESG-score. Bedre score gir lavere rente, dårligere gir høyere. Det er et ESG-linked derivative. Husk: også derivater kan kobles til ESG.","kt":"","src":"L10 slide 24"},{"id":"SB392","l":"L10","t":"Bonds and agency costs","f":"m","d":3,"p":"M","sc":"none","s":"What is the debt overhang (underinvestment) problem (Myers, 1977)?","o":[["Firms without debt cannot raise equity","Incorrect: not related."],["Bondholders block investments","Incorrect: bondholders usually have no votes."],["Too many safe projects","Incorrect: the problem is too little investment."],["Owners skip good projects","Correct: owners skip good projects."]],"c":[3],"es":"Eierne dropper gode prosjekter fordi gevinsten går til kreditorene.","ed":"Debt overhang (Myers, 1977): når et firma har mye gjeld, går mye av gevinsten fra nye prosjekter til kreditorene. Eierne betaler, men får lite igjen, så de dropper prosjekter med positiv NPV. Det gir for lite investering. Husk: debt overhang = underinvestering.\n\nForkortelser: NPV = Net Present Value (nåverdi).","kt":"","src":"Bok s. 258 (9.1.5) · Bok s. 259 (9.1.5)"},{"id":"SB393","l":"L10","t":"Commodities and supply chains","f":"t","d":3,"p":"L","sc":"short","s":"True or false: The EU Deforestation Regulation (postponed) will require firms selling cocoa, coffee, palm oil or soy in the EU to prove it is deforestation-free, so traceability matters for chocolate makers.","o":[["True","Correct. The regulation will require proof that the commodities are deforestation-free, so traceability matters."],["False","Incorrect. The regulation will require proof that the commodities are deforestation-free, so traceability matters."]],"c":[0],"es":"Sant. Firmaene må vise at råvarene ikke kommer fra avskoging.","ed":"EU Deforestation Regulation (utsatt) vil kreve at firmaer som selger kakao, kaffe, palmeolje og soya i EU, kan bevise at varene ikke kommer fra avskoging. Det gjør sporbarhet til et krav og avskoging til en finansiell risiko. Husk: traceability blir lov.","kt":"Supply-chain traceability: the ability to track a product's origin back to the farm or plot, needed to prove it is deforestation-free.","src":"L10 slide 22 · L3 slide 17"},{"id":"SB394","l":"L10","t":"Bonds synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A BBB chemicals firm with weak environmental management issues a normal and a green bond with the same terms; the green bond yields 8 bp less. An investor worries about clean-up costs. What is the best reasoning?","o":[["Same risk; check clean-up costs","Correct: both bonds have the same risk; check the clean-up costs."],["Ignore the environment","Incorrect: clean-up costs can cause default."],["Buy the green bond; it is safer","Incorrect: the green bond is not safer."],["Buy the normal bond; green bonds default more","Incorrect: the default risk is the same."]],"c":[0],"es":"Samme risiko på begge. Sjekk oppryddingskostnader.","ed":"Begge obligasjonene har samme utsteder og vilkår, så kredittrisikoen er lik. Green bonds er ikke ring-fenced. For en BBB-utsteder med svak miljøstyring kan oppryddingskostnader øke risikoen for mislighold. Investoren bør vurdere dette for begge. Husk: grønn merkelapp ≠ lavere risiko.","kt":"","src":"Bok s. 264 (9.2.2) · Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1) · L10 slide 3 · L10 slide 13"},{"id":"SB395","l":"L10","t":"Bonds basics","f":"m","d":1,"p":"L","sc":"none","s":"Which statement about bond types is correct?","o":[["Supranational bonds are issued by cities","Incorrect: supranationals are bodies like the World Bank."],["Unsecured bonds are repaid first","Incorrect: secured bonds have priority."],["Secured bonds have collateral","Correct: secured bonds have collateral."],["Bank loans trade on exchanges","Incorrect: bank loans are private debt."]],"c":[2],"es":"Secured bonds har sikkerhet (pant).","ed":"Obligasjonstyper: stat (sovereign), overnasjonal (supranational, f.eks. Verdensbanken), kommune, selskap. Secured bonds har pant i bestemte eiendeler og får betalt først fra dem. Unsecured har ingen pant. Husk: secured = pant.","kt":"","src":"Bok s. 254 (9.1.2) · Bok s. 254 (Figure 9.1) · Bok s. 255 (9.1.2)","e":1},{"id":"SB396","l":"L10","t":"Corporate bonds and ESG","f":"t","d":3,"p":"M","sc":"short","s":"True or false: Since bondholders do not share the upside, a sudden ESG scandal like Volkswagen's dieselgate does not matter to them unless the firm defaults at once.","o":[["True","Incorrect. Scandals raise default risk and spreads, so bond prices fall even without a default."],["False","Correct. Scandals raise default risk and spreads, so bond prices fall even without a default."]],"c":[1],"es":"Usant. Skandaler øker risikoen og senker obligasjonsprisen.","ed":"Selv om obligasjonseiere ikke får oppsiden, taper de når risikoen øker. Etter dieselgate steg VWs kredittspread kraftig, og obligasjonsprisene falt, selv om VW fortsatte å betale. Husk: høyere risiko = lavere obligasjonspris.\n\nForkortelser: CDS = Credit Default Swap (forsikring mot mislighold).","kt":"CDS spread: the price of insuring against a company's default; it rises when perceived credit risk rises.","src":"Bok s. 259 (9.2) · L10 slide 3"},{"id":"TR44","l":"L10","t":"Debt and equity payoffs","f":"m","d":3,"p":"H","sc":"none","s":"With debt D outstanding, the payoff to EQUITY holders looks like:","o":[["A risk-free bond","Incorrect: equity is the riskiest claim."],["A forward contract","Incorrect: a forward has symmetric payoffs."],["A put option","Incorrect: a put relates to debt."],["A call option","Correct: shareholders get max(V − D, 0): a call option."]],"c":[3],"es":"Eierne får max(V − D, 0) = en call option.","ed":"Aksjonærene får det som er igjen etter gjelden: max(V − D, 0). Hvis firmaverdien V er under gjelden D, får de null (limited liability). Hvis den er over, får de alt over D. Det er payoff-en til en call option med strike D. Husk: equity = call, debt = risikofri gjeld − put.","kt":"Debt as an option: debt payoff = min(V, D), i.e. a risk-free payment of D minus a put option on the firm's assets.","src":"Opptak L10 ca. 10 min · Opptak L10 ca. 13 min"},{"id":"TR45","l":"L10","t":"Bond risks","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A utility is downgraded after an ESG scandal but will still pay all coupons. Which bondholder loses most?","o":[["Shareholders only","Incorrect: downgrades reprice the bonds."],["Nobody","Incorrect: with fixed coupons the price must fall."],["One who sells early","Correct: an investor who sells early takes the loss."],["One who holds to maturity","Incorrect: if all is paid, a hold-to-maturity investor loses nothing."]],"c":[2],"es":"Den som selger før forfall tar tapet.","ed":"Ved nedgradering stiger kravet til avkastning, og siden kupongen er fast, faller prisen. Den som holder til forfall og får alt betalt, taper ingenting. Den som må selge før forfall, tar tapet. Husk: nedgradering = mark-to-market-tap.","kt":"","src":"Opptak L10 ca. 19 min"},{"id":"TR46","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A shipping firm's bond can fund anything, but the coupon rises by 0.25% if it fails to cut emissions by 30% by 2030. This is a:","o":[["Catastrophe bond","Incorrect: cat bonds transfer disaster risk."],["Social bond","Incorrect: a social bond earmarks money for social projects."],["Green bond","Incorrect: a green bond earmarks money for green projects."],["Sustainability-linked","Correct: a sustainability-linked bond."]],"c":[3],"es":"Fritt bruk, men kupongen avhenger av mål = sustainability-linked.","ed":"Pengene kan brukes fritt, men kupongen øker hvis firmaet ikke når et utslippsmål. Det er definisjonen på en sustainability-linked bond (SLB). Green og social bonds øremerker pengene. Husk: fritt bruk + KPI-mål = SLB.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLB = Sustainability-Linked Bond (obligasjon der kupongen avhenger av bærekraftsmål).","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min"},{"id":"TR47","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"M","sc":"none","s":"Why is there room for greenwashing in sustainability-linked bonds, and what limits it?","o":[["Green projects are rarely checked","Incorrect: SLB money is not earmarked at all."],["Firms set their own targets","Correct: firms set their own targets."],["Regulators set targets that are too strict","Incorrect: the issuer sets the targets."],["SLBs pay no coupon","Incorrect: SLBs pay coupons."]],"c":[1],"es":"Firmaene setter egne mål. Markedet og sertifisering begrenser det.","ed":"I en SLB velger firmaet selv KPI-ene og målene. Det gir rom for svake mål som er lette å nå (greenwashing). Markedet og ekstern sertifisering kan begrense det ved å kreve ambisiøse mål. Husk: egne mål = risiko for svake mål.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLB = Sustainability-Linked Bond (obligasjon der kupongen avhenger av bærekraftsmål).","kt":"","src":"Opptak L10 ca. 35 min"},{"id":"TR48","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"M","sc":"none","s":"After issuing green bonds, firms improve environmentally and attract more long-term investors. Which mechanism does this support?","o":[["Greenwashing","Incorrect: improvement after issuance argues against greenwashing."],["Signalling","Correct: green bonds work as a credible signal."],["Short-selling pressure","Incorrect: short selling is a different lever."],["Separate cash reserves","Incorrect: the finding is about performance and investors."]],"c":[1],"es":"Green bonds fungerer som et troverdig signal.","ed":"Hvis green bonds bare var greenwashing, ville ikke firmaene blitt bedre etterpå. At miljøytelsen forbedres og langsiktige investorer kommer inn, støtter at utstedelsen er et troverdig signal om grønn satsing. Husk: signalling.","kt":"","src":"Opptak L10 ca. 39 min · Opptak L10 ca. 41 min"},{"id":"TR49","l":"L10","t":"Blended finance","f":"m","d":3,"p":"M","sc":"none","s":"Private investors often avoid green infrastructure in developing countries. How does blended finance help?","o":[["Investors accept zero return","Incorrect: private investors still earn a return."],["Public money takes some risk","Correct: public money takes part of the risk."],["It only works in rich countries","Incorrect: it is mostly used in developing countries."],["It bans private investors","Incorrect: the aim is to attract private investors."]],"c":[1],"es":"Offentlige penger tar noe av risikoen.","ed":"Blended finance kombinerer offentlige og private penger. Offentlige aktører (f.eks. Norfund, utviklingsbanker) tar den mest risikable delen, slik at risikoen for private investorer blir lav nok. Da kommer mer privat kapital til grønne prosjekter i utviklingsland. Husk: offentlig tar risiko, privat følger.","kt":"","src":"Opptak L10 ca. 57 min"},{"id":"CX085","l":"L11","t":"Information asymmetry in banking","f":"m","d":2,"p":"H","sc":"short","s":"When a bank raises its rate for everyone because it cannot tell good from bad borrowers, the borrowers most likely to drop out are:","o":[["Only government borrowers","Det handler om bedriftslån."],["The riskiest borrowers","De har mest å tjene på å bli."],["The safest borrowers","De synes renten er for høy for deres lave risiko."],["None of them","Noen vil reagere på høyere rente."]],"c":[2],"es":"Adverse selection: de gode forsvinner, de dårlige blir.","ed":"Foreleser har sagt at adverse selection kommer på eksamen. Bankens løsning er screening før lånet gis.","kt":"","src":"Opptak L11 ca. 8 min · Opptak L5 ca. 17 min","k":1},{"id":"CX086","l":"L11","t":"Adverse selection","f":"t","d":2,"p":"H","sc":"none","s":"Is moral hazard a problem that arises before the contract is signed?","o":[["Yes","Feil. Moral hazard skjer etter avtalen. Adverse selection skjer før."],["No","Riktig. Moral hazard skjer etter avtalen. Adverse selection skjer før."]],"c":[1],"es":"Nei: moral hazard = etter avtalen.","ed":"Adverse selection: skjult informasjon før avtalen ('hvem er du?'). Moral hazard: skjult handling etter avtalen ('hva gjør du nå?').","kt":"","src":"L5 slide 10-13 · L11 slide 7","k":1},{"id":"CX087","l":"L11","t":"Risk-based lending","f":"m","d":2,"p":"H","sc":"short","s":"Collateral consisting of polluted land mainly increases:","o":[["The dividend yield","Det er et aksjebegrep."],["The liquidity coverage ratio","Det er et bankregulatorisk mål, ikke et lån-parameter."],["Loss given default (LGD)","Forurenset tomt er verdt mindre som sikkerhet, så tapet ved mislighold øker."],["The risk-free rate","Den er lik for alle."]],"c":[2],"es":"Dårligere sikkerhet = høyere LGD.","ed":"Expected loss = PD × LGD × EAD. ESG-risiko kan øke både PD (sannsynlighet for mislighold) og LGD (tap hvis det skjer).\n\nForkortelser: PD = Probability of Default (sannsynlighet for mislighold); LGD = Loss Given Default (tap ved mislighold); EAD = Exposure At Default (beløp utestående ved mislighold).","kt":"","src":"Bok s. 292 (10.4) · Bok s. 293 (Table 10.3) · Bok s. 294 (10.4) · Bok s. 291 (10.3)","k":1},{"id":"CX088","l":"L11","t":"Sustainability approaches in banking","f":"m","d":2,"p":"H","sc":"none","s":"A bank that lends only to viable projects with positive impact, like Triodos, is an example of:","o":[["Investment banking","Det handler om rådgivning og emisjoner."],["Risk-based banking (SF 1.0)","Risk-based bruker ESG til å prise risiko."],["Value-based banking (SF 3.0)","Impact først = value-based."],["Shadow banking","Det er noe helt annet."]],"c":[2],"es":"Impact-utlån = value-based = SF 3.0.","ed":"Risk-based banking (SF 1.0 og 2.0) bruker ESG til å prise risiko. Value-based banking låner ut for å skape positiv effekt.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Opptak L11 ca. 32 min · Opptak L11 ca. 40 min","k":1},{"id":"CX089","l":"L11","t":"Sustainable loans","f":"m","d":2,"p":"H","sc":"none","s":"A sustainability-linked loan differs from a green loan in that:","o":[["Only governments are allowed to take it","Selskaper tar SLL."],["It must be used for a green project","Det er green loan."],["It is interest-free for the borrower","SLL har vanlig rente."],["Its rate depends on the borrower's targets","SLL: renten følger KPI-er, pengene kan brukes fritt."]],"c":[3],"es":"SLL = KPI-knyttet rente.","ed":"Samme logikk som for obligasjoner: green loan = øremerket, SLL = knyttet til KPI-er.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLL = Sustainability-Linked Loan (lån der renten avhenger av bærekraftsmål).","kt":"","src":"L11 slide 23-25 · Bok s. 295 (Box 10.1)","k":1},{"id":"CX090","l":"L11","t":"Bank risks","f":"m","d":2,"p":"H","sc":"none","s":"Climate transition risk reaches a bank with low own emissions mainly:","o":[["It cannot affect a bank's balance sheet","Banker er sterkt eksponert via utlånene."],["Only through reputational damage","Hovedkanalen er kredittrisiko."],["Through the bank's own electricity bill","Det er en liten kostnad."],["Via borrowers' default risk and collateral","Låntakernes risiko blir bankens kredittrisiko."]],"c":[3],"es":"Kundenes klimarisiko = bankens kredittrisiko.","ed":"Store lån til olje og gass kan gi tap hvis strengere klimapolitikk gjør låntakerne mindre lønnsomme.","kt":"","src":"L11 slide 10 · L11 slide 14 · L11 slide 31","k":1},{"id":"SB397","l":"L11","t":"Bank business model","f":"m","d":3,"p":"M","sc":"short","s":"Silicon Valley Bank failed in 2023 after rising rates cut the value of its long-term bonds and depositors pulled out money fast. Which bank risks does this show?","o":[["Interest rate risk","Correct: long bonds lost value as rates rose, and deposits fled."],["Insurance risk","Incorrect: SVB was a bank, not an insurer."],["Physical climate risk","Incorrect: climate was not the cause."],["Credit risk from emissions","Incorrect: the trigger was rates and deposit flight, not defaults."]],"c":[0],"es":"Lange obligasjoner tapte verdi når renten steg, og kundene tok ut pengene raskt. Det er renterisiko.","ed":"SVB hadde investert innskudd i lange obligasjoner. Da renten steg, falt verdien av obligasjonene (renterisiko). Kundene ble redde og tok ut pengene raskt (liquidity risk / bank run). Det er klassisk banksvakhet: lange eiendeler finansiert med korte innskudd. Husk: maturity mismatch.\n\nForkortelser: SVB = Silicon Valley Bank.","kt":"Maturity transformation: using short-term deposits to fund long-term loans or bonds; it creates interest rate and liquidity (run) risk.","src":"L11 slide 9 · L11 slide 10"},{"id":"SB398","l":"L11","t":"Role of banks","f":"m","d":2,"p":"H","sc":"none","s":"Which is part of a bank's monitoring role?","o":[["Voting at borrowers' AGMs","Incorrect: banks monitor as lenders, not as voting owners."],["Screening before lending","Correct: screening before lending is part of monitoring."],["Issuing ESG ratings","Incorrect: ESG ratings come from rating agencies."],["Guaranteeing all deposits itself","Incorrect: deposit insurance is a public scheme."]],"c":[1],"es":"Screening før utlån er en del av bankens monitoring.","ed":"Banker har en monitoring-rolle: de screener låntakere før lånet (for å unngå adverse selection) og følger dem opp etterpå (for å unngå moral hazard). Det gjør banker gode på å vurdere risiko, også ESG-risiko. Husk: screen før, monitor etter.\n\nForkortelser: AGM = Annual General Meeting (generalforsamling).","kt":"","src":"L11 slide 7 · Bok s. 285 (10.1.3) · Bok s. 286 (10.1.3)"},{"id":"SB399","l":"L11","t":"Role of banks","f":"m","d":3,"p":"M","sc":"none","s":"When do firms usually choose a bank loan over a bond?","o":[["When uncertainty is lowest","Incorrect: the safest firms use bond markets."],["When it wants no monitoring","Incorrect: bank loans mean more monitoring."],["When cash flows are uncertain","Correct: firms use banks when cash flows are uncertain."],["Only when it is large and listed","Incorrect: large listed firms often use bonds."]],"c":[2],"es":"Banklån velges når kontantstrømmen er usikker og banken må overvåke.","ed":"Når informasjonsasymmetrien er liten (store, kjente firmaer), låner firmaer i obligasjonsmarkedet. Når usikkerheten er stor, trengs en bank som kan screene og overvåke tett. Derfor er småbedrifter og risikable firmaer avhengige av banker. Husk: mer usikkerhet → bank.","kt":"","src":"Bok s. 286 (10.1.3) · L11 slide 3 · Bok s. 291 (Figure 10.3)"},{"id":"SB400","l":"L11","t":"Bank business model","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank lends to a firm whose factory sits on polluted land. Under the risk-based approach, how should this affect the loan?","o":[["A higher deposit rate for the bank","Incorrect: deposit rates are not set by one borrower."],["No change","Incorrect: contamination is a credit risk."],["A lower rate","Incorrect: weaker collateral means a higher rate."],["A higher interest rate","Correct: a higher interest rate."]],"c":[3],"es":"Forurenset tomt gir mer risiko, så renten blir høyere.","ed":"Med risk-based lending skal renten gjenspeile risikoen. Forurenset grunn gir mulige oppryddingskostnader og søksmål (høyere sannsynlighet for mislighold) og lavere verdi på pantet (høyere tap ved mislighold). Begge gir høyere rente. Husk: mer risiko = høyere pris.\n\nForkortelser: PD = Probability of Default (sannsynlighet for mislighold); LGD = Loss Given Default (tap ved mislighold).","kt":"Expected loss = probability of default (PD) × loss given default (LGD) × exposure; the risk premium must cover it.","src":"Bok s. 284 (10.1.1) · Bok s. 292 (10.4) · Bok s. 293 (Table 10.3)"},{"id":"SB401","l":"L11","t":"Bank risks","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: A bank with a small office footprint but big loans to oil and gas firms is still exposed to climate transition risk.","o":[["True","Correct. A bank's credit risk includes its borrowers' risks, including transition risk."],["False","Incorrect. A bank's credit risk includes its borrowers' risks, including transition risk."]],"c":[0],"es":"Sant. Kundenes risiko blir bankens kredittrisiko.","ed":"Bankens egne utslipp er små, men den har stor eksponering gjennom utlånene. Hvis olje- og gasskunder rammes av transition risk og ikke kan betale, taper banken. Bankens viktigste klimarisiko og -påvirkning ligger i utlånsporteføljen. Husk: bankens risiko = kundenes risiko.","kt":"Financed emissions: emissions of the companies and projects a bank lends to or invests in (part of its scope 3).","src":"L11 slide 10 · L11 slide 14 · L11 slide 31"},{"id":"SB402","l":"L11","t":"Material issues in banking","f":"m","d":3,"p":"M","sc":"short","s":"Which event matches a SASB material issue for banks?","o":[["Office paper use - systemic risk","Incorrect: paper use is not systemic risk."],["Branch water use - a core issue","Incorrect: water use is not material for banks."],["A cyber attack - affordability","Incorrect: a cyber attack is data security."],["Fake accounts - business ethics","Correct: fake accounts are a business ethics issue."]],"c":[3],"es":"Falske kontoer = business ethics.","ed":"SASB lister material issues for banker: data security, financial inclusion, ESG i kredittanalysen, business ethics og systemic risk. Wells Fargo åpnet millioner av falske kontoer for å nå salgsmål, et klassisk business ethics-problem. Husk: tenk på hva banker faktisk gjør.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer).","kt":"SASB commercial banks: data security, access and affordability, product design (ESG in credit), business ethics, systemic risk management.","src":"L11 slide 12"},{"id":"SB403","l":"L11","t":"Material issues","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"Deutsche Bank ranks data privacy and customer satisfaction highest, and climate change low, in its materiality matrix. What is the critique?","o":[["Climate does not matter for banks","Incorrect: climate is highly relevant through loans."],["Its biggest issues are in its loans","Correct: the bank's biggest issues are in its loans."],["Data privacy is the only issue","Incorrect: data privacy is not the only issue."],["Banks should not publish materiality matrices","Incorrect: the point is what should count as material."]],"c":[1],"es":"De største problemene til banken ligger i utlånene, ikke på kontoret.","ed":"Deutsche Bank rangerer egne driftsforhold (personvern, kundetilfredshet) høyt og klima lavt. Kritikken er at bankens viktigste påvirkning er indirekte, gjennom lånene og investeringene den gjør. Der er klima svært material. Husk: bankens material issues ligger i utlånene.","kt":"","src":"L11 slide 13-14 · Bok s. 289 (10.2.2) · L11 slide 31-32"},{"id":"SB404","l":"L11","t":"Banks and society","f":"m","d":3,"p":"L","sc":"short","s":"More bank branches in India led to better household health years later (Cramer). Why?","o":[["Branches reduce pollution","Incorrect: not the mechanism."],["Credit helps pay for care","Correct: access to credit helps pay for health care."],["Banks offer medical care","Incorrect: banks give finance, not treatment."],["A government health programme","Incorrect: the study uses the branch expansion itself."]],"c":[1],"es":"Tilgang på kreditt hjalp folk å betale for helsehjelp.","ed":"Cramer finner at flere bankfilialer i India førte til bedre helse i husholdningene. Tilgang til kreditt og sparing gjorde at familier kunne betale for helsehjelp og tåle økonomiske sjokk. Husk: financial inclusion kan bedre helse.","kt":"Financial inclusion: access to useful and affordable financial services (savings, credit, payments, insurance).","src":"L11 slide 15 · L11 slide 12"},{"id":"SB405","l":"L11","t":"Banks and society","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Norwegian savings banks in communities with high social capital were LESS likely to survive after deregulation.","o":[["True","Incorrect. Savings banks in high social capital communities were more likely to survive."],["False","Correct. Savings banks in high social capital communities were more likely to survive."]],"c":[1],"es":"Usant. Høy social capital ga HØYERE overlevelse.","ed":"Studien av norske sparebanker etter dereguleringen finner at banker i lokalsamfunn med høy social capital (tillit, nettverk) oftere overlevde. Tillit forbedrer informasjon og reduserer risiko i utlån. Husk: tillit hjelper banker.","kt":"","src":"L11 slide 16 · Bok s. 287 (10.2)"},{"id":"SB406","l":"L11","t":"Risk-based vs value-based banking","f":"m","d":2,"p":"H","sc":"none","s":"How do sustainable lending approaches fit the SF stages?","o":[["ESG integration is SF 3.0","Incorrect: ESG integration is SF 2.0."],["1.0-2.0 risk-based; 3.0 value-based","Correct: SF 1.0–2.0 are risk-based; SF 3.0 is value-based."],["Exclusion is value-based","Incorrect: the mapping is reversed."],["All three are value-based","Incorrect: SF 1.0 and 2.0 are risk-based."]],"c":[1],"es":"SF 1.0–2.0 er risk-based. SF 3.0 er value-based.","ed":"Risk-based banking ser på avkastning og risiko. Exclusion (SF 1.0) og ESG-integrering i risikoprisingen (SF 2.0) er risk-based: målet er å unngå tap. Value-based banking (SF 3.0) legger til impact som første kriterium. Husk: risk-based = 1.0–2.0, value-based = 3.0.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L11 slide 18 · Bok s. 292 (Table 10.2) · Bok s. 292 (10.3.1)"},{"id":"SB407","l":"L11","t":"Risk-based lending","f":"m","d":3,"p":"H","sc":"short","s":"A chemicals firm's plant sits on polluted land. Which credit risk parameters can this affect?","o":[["Only the deposit rate","Incorrect: deposit rates are not driven by one borrower."],["Only fee income","Incorrect: the effect works through loan losses."],["None","Incorrect: it does affect credit risk."],["Both PD and LGD","Correct: both PD and LGD can be affected."]],"c":[3],"es":"Både PD og LGD kan påvirkes.","ed":"Kredittrisiko måles ofte med PD (probability of default) og LGD (loss given default). Forurenset grunn kan øke PD (oppryddingskostnader, søksmål) og øke LGD (pantet er mindre verdt). Husk: miljøproblemer rammer både PD og LGD.\n\nForkortelser: PD = Probability of Default (sannsynlighet for mislighold); LGD = Loss Given Default (tap ved mislighold).","kt":"","src":"Bok s. 292 (10.4) · Bok s. 293 (Table 10.3) · Bok s. 294 (10.4) · Bok s. 291 (10.3)"},{"id":"SB408","l":"L11","t":"Risk-based lending","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Weber (2010) concludes that sustainability criteria cannot predict how a borrower will perform.","o":[["True","Incorrect. Weber concludes that sustainability criteria do predict borrower performance and improve predictions."],["False","Correct. Weber concludes that sustainability criteria do predict borrower performance and improve predictions."]],"c":[1],"es":"Usant. Bærekraftskriterier forbedrer prediksjonen.","ed":"Weber (2010) finner at bærekraftskriterier forbedrer bankens prediksjon av hvordan låntakere vil gjøre det. Det betyr at ESG gir informasjon om kredittrisiko som ikke allerede er fanget opp. Husk: ESG gir kredittinfo.","kt":"","src":"L11 slide 20 · Bok s. 294 (10.4) · Bok s. 299 (10.4.3)"},{"id":"SB409","l":"L11","t":"Risk-based lending","f":"m","d":3,"p":"M","sc":"none","s":"The Sustainability Credit Score System models three paths for a firm. Which?","o":[["Start-up, growth, maturity","Incorrect: these are life-cycle stages."],["Business as usual, sustainable, future","Correct: business as usual, sustainable and future paths."],["Investment grade, high yield, default","Incorrect: these are credit rating categories."],["Exclusion, integration, impact","Incorrect: these are SF approaches."]],"c":[1],"es":"Tre veier: business as usual, bærekraftig, fremtidig.","ed":"Sustainability Credit Score System modellerer tre utviklingsveier for et firma: business as usual, en bærekraftig vei og en fremtidig vei. Det gir en fremoverskuende vurdering av hvordan bærekraft påvirker kredittrisikoen. Husk: tre veier fremover.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L11 slide 19 · Bok s. 294 (10.4) · Bok s. 295 (Box 10.1)"},{"id":"SB410","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"H","sc":"none","s":"How do values-based banks compare with the biggest global banks (2006-15)?","o":[["The same returns and risk","Incorrect: volatility differs a lot."],["Lower returns and more debt","Incorrect: they have higher ROA and lower leverage."],["Much higher returns, but more risk","Incorrect: ROE is slightly lower, with less volatility."],["Similar returns, more stable","Correct: similar returns, but more stable."]],"c":[3],"es":"Values-based banks har lik avkastning, men er mer stabile.","ed":"Values-based banks (GABV) har omtrent samme avkastning som de store globale bankene, men mye mer stabile resultater. De har lavere gjeldsgrad og låner mer til realøkonomien. Husk: VBB = lik avkastning, mindre risiko.\n\nForkortelser: ROE = Return on Equity (avkastning på egenkapital); ROA = Return on Assets (avkastning på totalkapital); GABV = Global Alliance for Banking on Values (nettverk av verdibaserte banker); VBB = Values-Based Bank (verdibasert bank).","kt":"","src":"L11 slide 22 · Bok s. 287 (10.2) · Bok s. 288 (Table 10.1)"},{"id":"SB411","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"Bank X is very profitable but lends mostly to speculation. Bank Y is less profitable but lends to renewables, social housing and small firms. Which scores higher on the GABV scorecard?","o":[["Y: real-economy lending","Correct: Y, because real-economy lending carries the most weight."],["X: profitability counts most","Incorrect: profitability is only a condition."],["Neither","Incorrect: the scorecard applies to all banks."],["Both score the same","Incorrect: they score differently."]],"c":[0],"es":"Y, fordi utlån til realøkonomien veier tyngst.","ed":"GABV-scorecard vekter mest hvor mye banken låner til realøkonomien og til prosjekter med impact. Lønnsomhet må være god nok, men er ikke hovedmålet. Bank Y, som låner til fornybart og sosiale boliger, scorer høyest. Husk: GABV = impact og realøkonomi.\n\nForkortelser: GABV = Global Alliance for Banking on Values (nettverk av verdibaserte banker).","kt":"Triple bottom line: people, planet and profit - social, environmental and financial results.","src":"Bok s. 304 (Table 10.4) · L11 slide 22"},{"id":"SB412","l":"L11","t":"Values-based banking","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Risk-based lending looks at return, risk and impact, while values-based banking looks only at return and risk.","o":[["True","Incorrect. It is the reverse: risk-based lending looks at return and risk; values-based banking adds impact."],["False","Correct. It is the reverse: risk-based lending looks at return and risk; values-based banking adds impact."]],"c":[1],"es":"Usant. Det er motsatt: risk-based ser på avkastning og risiko, values-based legger til impact.","ed":"Risk-based lending er todimensjonalt: avkastning og risiko. Values-based banking legger til en tredje dimensjon, impact, og setter den først. Påstanden har byttet om på dem. Husk: values-based = tre dimensjoner.","kt":"","src":"Bok s. 303 (10.5) · Bok s. 303 (Figure 10.4) · Bok s. 304 (10.5)"},{"id":"SB413","l":"L11","t":"Sustainable loans","f":"m","d":2,"p":"H","sc":"none","s":"How do green loans differ from sustainability-linked loans (SLLs)?","o":[["Green: projects; SLL: KPIs","Correct: green loans fund projects; SLLs are tied to KPIs."],["Green: KPIs; SLL: projects","Incorrect: the definitions are swapped."],["SLLs are only for utilities","Incorrect: SLLs are used in many sectors."],["Both must fund renewables","Incorrect: SLL money can be used freely."]],"c":[0],"es":"Green loan = øremerket prosjekt. SLL = rente koblet til KPI.","ed":"Samme logikk som for obligasjoner: et green loan er øremerket grønne prosjekter. Et sustainability-linked loan (SLL) kan brukes fritt, men renten avhenger av om firmaet når bærekraftsmål (KPI-er). Husk: green = prosjekt, SLL = KPI.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLL = Sustainability-Linked Loan (lån der renten avhenger av bærekraftsmål).","kt":"","src":"L11 slide 23-25 · Bok s. 295 (Box 10.1)"},{"id":"SB414","l":"L11","t":"Sustainable loans","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In 2017 Philips got a €1bn credit line from 16 banks, with the interest rate linked to its sustainability performance. Which statement is correct?","o":[["It is a social impact bond","Incorrect: it is a credit line, not a social impact bond."],["The money can be used freely","Correct: the money can be used for general purposes."],["The rate is fixed","Incorrect: the rate is linked to sustainability."],["Philips checks itself","Incorrect: Sustainalytics assessed the performance."]],"c":[1],"es":"Philips kan bruke pengene fritt. Renten avhenger av bærekraft.","ed":"Philips fikk en kredittlinje på €1 mrd fra 16 banker. Pengene kan brukes fritt, men renten justeres etter Philips sin bærekraftsscore, vurdert av Sustainalytics. Det er et sustainability-linked loan. Husk: fritt bruk + rente koblet til score.","kt":"","src":"Bok s. 295 (Box 10.1) · L11 slide 25"},{"id":"SB415","l":"L11","t":"Equator Principles","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the Equator Principles for project finance?","o":[["Independent review","Correct: independent review is an Equator Principle."],["A guaranteed return","Incorrect: not an Equator Principle."],["Mandatory green bonds","Incorrect: not an Equator Principle."],["Shareholder votes on projects","Incorrect: not an Equator Principle."]],"c":[0],"es":"Uavhengig gjennomgang er et Equator-prinsipp.","ed":"Equator Principles er frivillige retningslinjer for miljø- og sosial risiko i prosjektfinansiering. De krever blant annet kategorisering av risiko, miljøvurdering, dialog med berørte, uavhengig gjennomgang og rapportering. Husk: Equator = prosjektfinans.","kt":"","src":"L11 slide 26 · Bok s. 297 (10.4.1) · Bok s. 298 (10.4.1)"},{"id":"SB416","l":"L11","t":"Equator Principles","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The Equator Principles have strong enforcement, and nearly all member banks disclose all required information.","o":[["True","Incorrect. There is no system to check compliance, and only about 5% of banks disclose everything."],["False","Correct. There is no system to check compliance, and only about 5% of banks disclose everything."]],"c":[1],"es":"Usant. Det er svak håndheving, og bare ca. 5 % rapporterer alt.","ed":"Equator Principles er frivillige og har ingen kontrollmekanisme. Weber (2017) finner at bare ca. 5 % av bankene rapporterer all påkrevd informasjon. Husk: frivillig uten sanksjoner = svak håndheving.","kt":"","src":"Bok s. 298 (10.4.1) · Bok s. 297 (10.4.1) · Bok s. 300 (Box 10.3)"},{"id":"SB417","l":"L11","t":"UN Principles for Responsible Banking","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the UN Principles for Responsible Banking?","o":[["Set impact targets","Correct: setting impact targets is a PRB principle."],["Never lend to energy firms","Incorrect: PRB do not ban sectors."],["Keep impacts secret","Incorrect: PRB require transparency."],["Maximise short-term returns","Incorrect: not a PRB principle."]],"c":[0],"es":"Sett impact-mål er et PRB-prinsipp.","ed":"UN Principles for Responsible Banking har seks prinsipper, blant annet: tilpass strategien til SDG-ene og Paris (alignment), sett mål for impact, samarbeid med kunder og stakeholders, og vær åpen om resultater (transparency). Husk: PRB = mål + åpenhet.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger); PRB = UN Principles for Responsible Banking.","kt":"","src":"L11 slide 27-29 · L11 slide 32"},{"id":"SB418","l":"L11","t":"Banking regulation","f":"m","d":3,"p":"H","sc":"none","s":"What does the Green Asset Ratio (GAR) measure for a bank?","o":[["Emissions per employee","Incorrect: GAR is about financed activities."],["Equity to green bonds","Incorrect: GAR is about assets."],["Share of staff in sustainability jobs","Incorrect: not what GAR measures."],["Share of taxonomy-aligned loans","Correct: the share of taxonomy-aligned loans."]],"c":[3],"es":"GAR = andel lån som er taxonomy-aligned.","ed":"Green Asset Ratio viser hvor stor andel av bankens eiendeler (lån og investeringer) som er i aktiviteter som oppfyller EU Taxonomy. Det gjør det lettere å sammenligne hvor grønne bankene er. Husk: GAR = andel grønne lån.\n\nForkortelser: GAR = Green Asset Ratio (andel grønne lån etter EU Taxonomy).","kt":"","src":"L11 slide 30-31"},{"id":"SB419","l":"L11","t":"Banking regulation","f":"m","d":4,"p":"H","sc":"none","s":"Should bank capital rules be used to steer lending to green projects? The textbook says:","o":[["Central banks should pick technologies","Incorrect: Carney says picking technologies is for governments."],["Never consider climate risk","Incorrect: the book supports considering climate risk."],["Lower capital rules for all green loans","Incorrect: green projects also carry risk."],["Raise rules for brown loans","Correct: raise capital rules for brown loans."]],"c":[3],"es":"Øk kapitalkravet for brune lån.","ed":"Læreboka foretrekker en brown penalising factor: høyere kapitalkrav for brune lån, fordi de har reell ekstra risiko. En green supporting factor (lavere krav for grønne) er farlig, fordi grønne prosjekter også har teknologi- og politikkrisiko. Husk: straff brunt, ikke belønn grønt.","kt":"","src":"Bok s. 301 (10.4.5) · Bok s. 302 (10.4.5)"},{"id":"SB420","l":"L11","t":"Banking regulation","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about lending regulation is correct?","o":[["China's policy hurt bank results","Incorrect: the policy helped bank results."],["It applies only to state banks","Incorrect: it applies to all Chinese banks."],["Brazil bans environmental factors","Incorrect: Brazil requires environmental factors."],["China limits loans to polluters","Correct: China limits loans to polluters."]],"c":[3],"es":"Kina begrenser lån til forurensere.","ed":"Kinas green credit policy krever at alle banker begrenser lån til forurensende industri og prioriterer grønne prosjekter. Forskning finner positiv sammenheng mellom bankenes finansielle og bærekraftige resultater. Brasil krever også at banker integrerer miljørisiko. Husk: Kina = green credit policy.","kt":"","src":"Bok s. 298 (10.4.2) · Bok s. 299 (10.4.2) · Bok s. 302 (10.4.5) · Bok s. 303 (10.4.5)"},{"id":"SB421","l":"L11","t":"Evidence on sustainable lending","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Two firms with the same credit rating apply for unsecured loans. Firm A has serious environmental and social scandals; firm B does not. What should we expect?","o":[["A pays more","Correct: firm A pays more."],["Both pay the same rate","Incorrect: banks price ESG beyond ratings."],["A pays less","Incorrect: more risk means a higher spread."],["B pays more","Incorrect: B has less risk."]],"c":[0],"es":"A betaler mer, fordi ESG-skandaler øker risikoen.","ed":"Banker priser inn ESG-bekymringer utover kredittratingen. Firma A med alvorlige miljø- og sosiale skandaler har høyere risiko for søksmål og tap, så det får høyere rente. Effekten er sterkest for usikrede lån uten pant. Husk: ESG-skandaler gir dyrere lån.","kt":"Loan spread: the margin over the base rate that a borrower pays, reflecting credit risk and other costs.","src":"Bok s. 299 (10.4.3)","e":1},{"id":"SB422","l":"L11","t":"Barriers and incentives","f":"m","d":3,"p":"M","sc":"none","s":"Which is a barrier to bringing sustainability into lending?","o":[["Loans are shorter than most E&S risks","Correct: loans are shorter than most E&S risks."],["Banks know too little about borrowers","Incorrect: banks have good information."],["Pricing ESG is banned","Incorrect: pricing ESG is not banned."],["Green loans are never profitable","Incorrect: values-based banks are profitable."]],"c":[0],"es":"Lånene er kortere enn E&S-risikoene.","ed":"Mange lån har kortere løpetid enn tiden det tar før miljø- og sosiale risikoer slår inn. Bankfolk kan derfor tenke at risikoen ikke angår dem (myopia). Husk: kort lån, lang risiko.\n\nForkortelser: E&S = Environmental and Social (miljø og sosialt).","kt":"","src":"Bok s. 300 (10.4.4) · Bok s. 300 (Box 10.3)","e":1},{"id":"SB423","l":"L11","t":"Barriers and incentives","f":"m","d":3,"p":"H","sc":"short","s":"A bank charges a higher mortgage rate for homes with energy labels E-G than A-D. Why?","o":[["Nudging and safer collateral","Correct: it nudges people toward efficiency and gives safer collateral."],["Regulators ban E-G mortgages","Incorrect: this is pricing, not a ban."],["Inefficient homes are cheaper to insure","Incorrect: the reason is collateral and emissions."],["Green homes default more","Incorrect: green homes have lower risk."]],"c":[0],"es":"Høyere rente dytter mot energieffektivitet og gir tryggere sikkerhet.","ed":"Lavere rente for energieffektive boliger dytter (nudge) kundene mot grønne valg. I tillegg er energieffektive boliger tryggere pant, fordi ineffektive boliger kan tape verdi når kravene skjerpes. Husk: nudge + sikkerhet.","kt":"","src":"Bok s. 301 (10.4.5) · Bok s. 301 (Box 10.4) · Bok s. 291 (10.3)"},{"id":"SB424","l":"L11","t":"Circular economy financing","f":"m","d":4,"p":"M","sc":"none","s":"Why are circular (product-as-a-service) business models harder for banks to finance?","o":[["Banks may not lend to them","Incorrect: they are allowed to borrow."],["They have no cash flows","Incorrect: they earn lease payments."],["Lease income and unclear collateral","Correct: income comes as leases, and collateral is unclear."],["Their products wear out faster","Incorrect: their products last longer."]],"c":[2],"es":"Leieinntekter og uklar sikkerhet gjør det vanskelig.","ed":"I lineære modeller selger firmaet produktet og får betalt med en gang, og produktet er tydelig pant. I sirkulære modeller (product-as-a-service) eier firmaet produktet og får små leiebetalinger over tid. Det gir mer bundet kapital og uklart pant. Husk: sirkulært = vanskeligere å låne.","kt":"","src":"Bok s. 305 (10.5.1) · Bok s. 306 (10.5.1) · Bok s. 307 (10.5.1)","e":1},{"id":"SB425","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A savings bank lends only to projects with a clear social or environmental benefit, as long as they are financially viable. This is:","o":[["ESG risk integration (SF 2.0)","Incorrect: SF 2.0 adjusts risk premia."],["Exclusion (SF 1.0)","Incorrect: it goes beyond exclusion."],["Finance as usual","Incorrect: impact decides who gets loans."],["Value-based banking (SF 3.0)","Correct: value-based banking (SF 3.0)."]],"c":[3],"es":"Impact først, levedyktig som krav = value-based banking (SF 3.0).","ed":"Banken låner bare til prosjekter med tydelig sosial eller miljømessig nytte, så lenge de er økonomisk levedyktige. Impact kommer først, levedyktighet er et minstekrav. Det er value-based banking (SF 3.0). Husk: impact først = SF 3.0.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"Value-based banking: lending primarily to projects with positive social or environmental impact, with financial viability as a condition (return, risk and impact).","src":"L11 slide 18 · L11 slide 22 · Bok s. 303 (10.5)"},{"id":"SB426","l":"L11","t":"Banking structure","f":"t","d":3,"p":"L","sc":"none","s":"True or false: The US Volcker Rule moves proprietary trading into a separate unit, while the EU Liikanen Report bans it outright.","o":[["True","Incorrect. It is the reverse: the Volcker Rule bans proprietary trading; Liikanen moves it into a separate unit."],["False","Correct. It is the reverse: the Volcker Rule bans proprietary trading; Liikanen moves it into a separate unit."]],"c":[1],"es":"Usant. Det er motsatt: Volcker forbyr, Liikanen skiller ut.","ed":"Etter finanskrisen ville regulatorer skille risikabel handel fra vanlig bankdrift. Volcker Rule (USA) forbyr banker med innskudd å drive egenhandel. Liikanen-rapporten (EU) foreslår å flytte egenhandel til en separat enhet. Husk: Volcker = forbud, Liikanen = skille ut.","kt":"","src":"Bok s. 288 (10.2.1) · Bok s. 289 (10.2.1)","e":1},{"id":"SB427","l":"L11","t":"Material issues","f":"m","d":3,"p":"L","sc":"extended_course_case","s":"Handelsbanken did well in the financial crisis. What stands out about its business culture?","o":[["No performance bonuses","Correct: Handelsbanken pays no performance bonuses."],["All lending decided at headquarters","Incorrect: it stresses local decisions."],["Focus on quarterly returns","Incorrect: it focuses on the long term."],["Bonuses for loan growth","Incorrect: it avoids volume bonuses."]],"c":[0],"es":"Handelsbanken har ingen prestasjonsbonuser.","ed":"Handelsbanken klarte seg godt gjennom finanskrisen. Kulturen har ingen prestasjonsbonuser, lokal beslutningsmyndighet og langsiktig fokus. Det reduserer incentiver til å ta for mye risiko. Husk: ingen bonus = mindre risikojag.","kt":"","src":"Bok s. 289 (10.2.2) · Bok s. 290 (10.2.2)","e":1},{"id":"SB428","l":"L11","t":"Banking synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A Norwegian bank has a big, long-time shipping client with an old, inefficient fleet. The loans mature within five years. What is the best approach?","o":[["Price the risk; offer a KPI loan","Correct: price the risk and offer a KPI-linked loan."],["End all loans at once","Incorrect: banks honour existing contracts."],["Ignore it","Incorrect: collateral and viability matter."],["Lower the client's risk weight","Incorrect: banks cannot set risk weights."]],"c":[0],"es":"Pris risikoen og tilby et KPI-lån.","ed":"En gammel, ineffektiv flåte gir transition risk. Banken bør p
