ollier and Pouget (2014), cited on Lecture 9, slide 32, describe a \"washing machine\" strategy. What is it?","o":[["A fund relabels conventional products as ESG products (greenwashing).","The term refers to transforming companies, not relabelling funds."],["A bank channels illicit money through sustainability-linked loans.","Unrelated to the paper, which is about investor strategies and corporate behaviour."],["An activist buys irresponsible firms and reforms them for profit.","The quote on slide 32 states that a large activist can generate positive abnormal returns this way."],["An investor sells all brown stocks and buys green bonds to \"wash\" the portfolio.","That is divestment, not the washing machine idea."]],"c":[2],"es":"Buy the \"dirty\", engage to clean them, profit as their value rises.","ed":"If markets reward responsible behaviour, a large activist can buy irresponsible firms cheaply, push them to improve, and capture the revaluation. This is the logic of engagement as an alternative to exclusion: by divesting, responsible investors give up influence. Slide 33 adds Cohen, Gurun and Nguyen: low-ESG energy firms, often excluded by ESG funds, are key green innovators - questioning whether divestment is optimal.","kt":"","src":"L9 slide 32 · L9 slide 33"},{"id":"SB354","l":"L9","t":"Engagement and divestment","f":"t","d":4,"p":"H","sc":"none","s":"True or false: Cohen, Gurun and Nguyen (2020) find that oil, gas and energy firms with low ESG scores - often excluded by ESG funds - produce more and higher-quality green patents, raising doubts about whether divestment campaigns are optimal.","o":[["True","Correct. This is the \"ESG-innovation disconnect\" on slide 33."],["False","Incorrect. This is the \"ESG-innovation disconnect\" on slide 33."]],"c":[0],"es":"True: excluded energy firms are key green innovators.","ed":"The finding suggests that ESG scores and exclusion lists may penalise exactly the firms best placed to develop green technologies. If excluded, these firms lose access to engaged, sustainability-minded capital. Reward-based incentives or engagement might lead to more efficient innovation. Combined with the washing machine idea, this is an argument for engagement over blanket divestment, while divestment can still be credible as an escalation step (LGIM-Glencore, Lecture 8).","kt":"","src":"L9 slide 33 · L8 slide 58"},{"id":"SB355","l":"L9","t":"Impact investing","f":"m","d":2,"p":"H","sc":"none","s":"Which is among the Global Impact Investing Network's four characteristics of impact investing?","o":[["Only private equity qualifies as impact investing","Impact investing spans asset classes including public equity and fixed income."],["Commitment to impact measurement and reporting","This is GIIN characteristic 4."],["Returns must always be below market rates","Characteristic 3 allows a range of returns, above or below market."],["Investments must be rated AAA by ESG agencies","Not a GIIN criterion."]],"c":[1],"es":"GIIN: intentionality; return expectations; range of returns and asset classes; impact measurement.","ed":"Impact investing fits SF 3.0, with impact as the first criterion (max SEV s.t. FV_min). Research so far focuses on private equity impact funds (Barber, Morse and Yasuda: demand exceeds supply). Challenges: poor impact data, lack of scale (small projects vs pension funds' ticket sizes), institutional resistance to change, perception problems (assumed low returns) and complex investment chains. Also correct: Intentionality to generate positive social or environmental impact.","kt":"","src":"L9 slide 36 · Bok s. 235 (8.4) · Bok s. 236 (8.4) · Bok s. 237 (8.4.3)"},{"id":"SB356","l":"L9","t":"Impact investing","f":"m","d":4,"p":"M","sc":"none","s":"Why does the textbook expect listed equity impact investing to deliver at least market-rate financial returns?","o":[["Because governments guarantee the returns of impact companies through subsidies.","There are no such guarantees."],["SDG tailwinds help value drivers, and internalisation aligns impact and returns.","Schramade finds positive-impact stocks already have stronger value drivers."],["Because impact stocks are excluded from indices and therefore always cheap.","Not the argument made."],["Because impact investors accept higher risk and thus earn a risk premium.","The argument is about value drivers, not higher risk."]],"c":[1],"es":"Impact firms ride SDG tailwinds (growth, margins, lower risk) and internalisation will tighten the link.","ed":"In a universe of 15,000 stocks, the 2,300 with positive impact potential already show higher growth, higher cash flow return on investment and lower cost of capital, even within sectors (Schramade, 2018). Figure 8.5 sketches internalisation: tobacco (negative impact, positive return now) likely to deteriorate; solar (positive impact, weak return now) likely to improve. Impact can be assessed with the Impact Management Project's five dimensions (what, how much, who, contribution, risk) and impact criteria (material, intentional, transformational - Novozymes).","kt":"","src":"Bok s. 237 (8.4.2) · Bok s. 238 (Figure 8.5) · Bok s. 239 (8.4.4) · Bok s. 240 (Table 8.5)"},{"id":"SB357","l":"L9","t":"Impact investing","f":"m","d":3,"p":"L","sc":"none","s":"The Impact Management Project distinguishes five dimensions of impact. Which dimension asks how the effect compares with what would likely have happened anyway?","o":[["Contribution","Contribution concerns additionality versus the counterfactual."],["Who","\"Who\" asks who experiences the effect and how underserved they are."],["Risk","\"Risk\" concerns the likelihood that impact differs from expectations."],["How much (scale and duration)","\"How much\" concerns scale, depth and duration."]],"c":[0],"es":"What, how much, who, contribution (additionality), risk.","ed":"The five dimensions are: What (which outcomes, how important to people or planet); How much (scale, depth, duration); Who (stakeholders affected, how underserved); Contribution (compared with what would occur anyway - additionality); Risk (probability that impact differs from expectation). Contribution is central to the debate whether buying listed shares creates real-world impact, since secondary market trades may not change a firm's financing.","kt":"","src":"Bok s. 239 (8.4.4) · Bok s. 240 (Figure 8.6)"},{"id":"SB358","l":"L9","t":"ESG integration in valuation","f":"t","d":3,"p":"H","sc":"extended_course_case","s":"True or false: For Novozymes, whose enzymes cut customers' energy use and emissions, an analyst following the VDA approach would typically raise growth and margin assumptions above the chemicals industry average, because its competitive edge on a material issue drives its value drivers.","o":[["True","Correct. Novozymes grows about twice as fast as the chemicals industry at about twice the margin; VDA makes this explicit in value driver assumptions."],["False","Incorrect. Novozymes grows about twice as fast as the chemicals industry at about twice the margin; VDA makes this explicit in value driver assumptions."]],"c":[0],"es":"True: a material ESG edge → higher growth and margin assumptions.","ed":"Steps: identify material issues, assess performance versus peers, quantify the advantage in value drivers, and engage. Innovation edges usually adjust growth and margins; governance edges usually adjust the cost of capital.","kt":"Value driver adjustment (VDA): adjusting growth, margin or cost-of-capital assumptions to reflect a company's competitive (dis)advantage on material ESG issues.","src":"Bok s. 230 (8.3.1.1) · Bok s. 122 (Box 5.2)"},{"id":"SB359","l":"L9","t":"Barriers to ESG integration","f":"m","d":2,"p":"M","sc":"none","s":"According to the CFA Institute (2015), cited in the textbook, which is one of the most important reasons ESG issues receive insufficient consideration in investment cases?","o":[["ESG effects are long term, while many investors have short horizons.","One of the three reasons listed."],["ESG issues never affect financial performance.","The textbook shows they can make or break business models."],["ESG data are always audited and standardised, making them uninteresting.","The problem is that disclosures are limited, unverified and non-standardised."],["Regulators prohibit including ESG in valuations.","No such prohibition exists."]],"c":[0],"es":"Hard to monetise ESG; limited, unverified, non-standard disclosure; long-term effects vs short horizons.","ed":"The three reasons: (1) difficulty expressing sustainability effects in monetary terms and integrating them in quant models; (2) limited, unverified and non-standardised ESG disclosure; (3) long-term effects versus short-term investor horizons. Many \"integration\" approaches only use ESG scores to shrink the universe, which is not real integration under Eurosif's definition (explicit consideration of ESG alongside financial factors and its impact on financials).","kt":"","src":"Bok s. 227 (8.3) · Bok s. 228 (8.3.1.1)"},{"id":"SB360","l":"L9","t":"ESG integration synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: An analyst believes a utility's superior renewable portfolio gives it a durable cost advantage that the market ignores, and that higher carbon prices are coming. Consistent with Lecture 9, how should this view be expressed?","o":[["Lower the discount rate drastically because green stocks always have higher expected returns.","Theory implies lower expected returns for green assets; mixing this up confuses taste/risk premia with cash flows."],["Assume past green-minus-brown returns of 174% will repeat.","Pástor et al. show these returns came from unexpected concern shocks."],["Adjust value drivers and carbon scenarios; alpha comes only from repricing.","Fundamental integration via value drivers; mispricing yields alpha only when information gets priced (AMH)."],["Exclude the utility because all utilities are high emitters.","Exclusion ignores the firm-specific competitive advantage identified."]],"c":[2],"es":"Put the view in the value drivers and scenarios; profit comes from repricing, while green expected returns are lower in equilibrium.","ed":"Lecture 9 separates cash flows from discount rates. A firm-specific competitive edge on a material ESG issue belongs in value driver assumptions (VDA) and carbon price scenarios. If the market currently ignores it, the stock is underpriced (α > 0) and should outperform as information is priced (AMH, Pástor et al.'s unexpected shifts). In equilibrium, though, green assets carry lower expected returns (taste and hedge premia), so once the view is priced, future expected returns fall. Past green outperformance should not be extrapolated.","kt":"","src":"L9 slide 3-10 · L9 slide 14-18 · L9 slide 20 · Bok s. 230 (8.3.1.1)"},{"id":"SB361","l":"L9","t":"ESG integration synthesis","f":"m","d":3,"p":"L","sc":"none","s":"The NorSIF Guide to ESG Integration in Fundamental Equity Valuation (Lecture 9, slide 11) goes beyond the cash flow and cost of capital channels. Which additional element does it include?","o":[["Liabilities for past externalities (\"sins\")","Listed among the guide's chapters, together with scenarios, optionality and modified objective functions."],["A ban on using scenario analysis in valuation","Scenarios are one of the guide's chapters."],["A list of stocks NorSIF recommends buying","It is a methodological guide, not a stock list."],["A requirement to use P/E multiples only","The guide focuses on fundamental (DCF-type) valuation."]],"c":[0],"es":"NorSIF guide: cash flow channel, cost of capital channel, systematic risk adjustments, scenarios, optionality, past-externality liabilities, modified objective functions (purpose).","ed":"Beyond adjusting cash flows and discount rates, the guide covers systematic risk adjustments, scenarios (e.g. carbon price paths), optionality (e.g. the free option on carbon), liabilities for past externalities (clean-up, litigation for past harm - the \"sins\") and modified objective functions reflecting company purpose. These map onto the textbook's broader integrated value perspective.","kt":"","src":"L9 slide 11"},{"id":"SB362","l":"L9","t":"Equity basics","f":"m","d":2,"p":"M","sc":"none","s":"Why does the textbook argue that sustainability matters more to equity investors than to most other investors?","o":[["Because equity investors are legally liable for company debts.","Limited liability means shareholders can lose at most their investment."],["Because equity has a fixed return regardless of company performance.","That describes debt more than equity."],["As residual claimants, they gain and lose the most.","Equity holders are paid after debt holders and are most exposed to business model success or failure."],["Because only equity investors can read sustainability reports.","Not the argument."]],"c":[2],"es":"Equity = residual claim (an option on the firm): most exposed to material ESG issues that can make or break business models.","ed":"Equity holders receive income only after debt holders; in effect equity is an option on the company (Black and Scholes). Material sustainability issues can make or break business models, so equity holders have strong incentives to help firms achieve LTVC. Bondholders face asymmetric (mainly downside) exposure, which is why Lecture 10 focuses on downside ESG risks in bonds.","kt":"","src":"Bok s. 211 (Overview) · Bok s. 215 (8.1.2)"},{"id":"TR39","l":"L9","t":"ESG integration in valuation","f":"t","d":3,"p":"H","sc":"none","s":"True or false: The lecturer recommends integrating ESG mainly through forecast cash flows rather than by adjusting the WACC, because the evidence on ESG and the cost of capital is not settled.","o":[["True","Correct. She says ESG clearly affects cash flows, while academics and practitioners have not agreed on whether it lowers the cost of capital."],["False","Incorrect. She says ESG clearly affects cash flows, while academics and practitioners have not agreed on whether it lowers the cost of capital."]],"c":[0],"es":"True: adjust cash flows; leave WACC alone.","ed":"Cash flow effects: revenue (green demand, boycotts), margins, capex, taxes and stranded assets. On the cost of capital side, some studies find lower costs for better CSR firms, but the evidence conflicts. Adjusting both risks double counting.","kt":"","src":"Opptak L9 ca. 16 min · Opptak L9 ca. 36 min · Opptak L9 ca. 69 min"},{"id":"TR40","l":"L9","t":"Stranded assets","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A German coal plant built to run 40 years must close after 20 because of a new phase-out law. What kind of stranded asset is this?","o":[["Not stranded, as the plant still exists physically","Stranded means it has lost its economic value even if it still exists."],["A physical-risk stranded asset","Physical risk would be e.g. a plant destroyed by flooding."],["A gain, because the firm saves on fuel costs","Losing 20 years of expected cash flows is a value loss."],["A transition-risk stranded asset","Policy change cut the plant's useful life."]],"c":[3],"es":"Policy-driven early closure = transition-risk stranding.","ed":"Stranded assets lower forecast free cash flows. Physical example from the lecture: a plant in a flood-prone area that is flooded and unusable. Both types should be reflected in DCF assumptions and scenario analysis.","kt":"","src":"Opptak L9 ca. 10 min"},{"id":"TR41","l":"L9","t":"Relative valuation","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"An analyst values Oatly using the P/E multiple of Alpro, which sells soy, almond and oat drinks. Why does Lecture 9 question this from a sustainability angle?","o":[["Alpro is not a dairy-alternative producer","It is, which is why it seems a natural peer."],["Relative valuation never uses peer firms","Relative valuation is based on peers by definition."],["P/E ratios cannot be used for food companies","Multiples are widely used; the issue is peer choice."],["Alpro has different sustainability exposures","Peers must share material exposures for multiples to be comparable."]],"c":[3],"es":"Peers need similar material sustainability exposures.","ed":"Oatly's water claims scandal, for example, may not apply to soy milk. Relative valuation assumes similar risk and growth; sustainability issues add another dimension to check when choosing peers.","kt":"","src":"Opptak L9 ca. 14 min"},{"id":"TR42","l":"L9","t":"ESG as a risk factor","f":"m","d":4,"p":"H","sc":"none","s":"Why does the lecturer doubt that a risk such as child labour in supply chains can be a priced systematic risk factor, while she is less sure about climate change?","o":[["Factors only exist for bonds, not equities","Factor models (e.g. Fama-French) are mainly equity models."],["Child labour is a governance issue, and only E issues are priced","The argument is about diversifiability, not the E/S/G label."],["Child labour risk is diversifiable; climate risk may not be","Only non-diversifiable risks earn a risk premium."],["Climate change has no effect on asset prices","She suggests climate might be systematic, as all firms are exposed."]],"c":[2],"es":"Diversifiable = not a factor; climate may be systematic.","ed":"A proper factor should be grounded in literature, robust across definitions and robust across geographies. ESG scores fail the second test because ratings diverge. Research now studies specific measures, e.g. Bolton and Kacperczyk's carbon premium, though whether it is risk or mispricing is debated.","kt":"","src":"Opptak L9 ca. 59 min · Opptak L9 ca. 68 min"},{"id":"TR43","l":"L9","t":"Exclusion vs engagement","f":"m","d":3,"p":"M","sc":"none","s":"Research cited in Lecture 9 finds that oil and gas companies are among the largest filers of green patents. Which argument does this support?","o":[["Oil companies should be valued as pure green firms","Patents do not erase their large current emissions."],["Excluding brown firms may miss key green innovators","It supports engagement and the \"washing machine\" view over blanket exclusion."],["Green patents prove oil firms have no transition risk","They still face substantial transition risk."],["Exclusion is the only consistent SRI strategy","The evidence is used to question that view."]],"c":[1],"es":"Brown firms can be key green innovators, so exclusion has costs.","ed":"The washing machine idea (Gollier and Pouget): hold brown firms and push them to change, rather than leaving them \"dirty\" in someone else's portfolio. The lecturer leaves the debate open; there is no single right answer.","kt":"","src":"Opptak L9 ca. 82 min"},{"id":"SB363","l":"L10","t":"Bonds vs equity","f":"m","d":2,"p":"H","sc":"none","s":"Lecture 10 (slide 3) shows the payoffs of debt holders and equity holders as a function of the firm's asset value. Why does this make bond investors focus mainly on downside ESG risks?","o":[["Their payoff is capped, so they gain little upside but bear default losses.","Debt holders receive min(asset value, D); equity holders receive max(asset value − D, 0)."],["Bondholders receive all upside above the face value of debt.","That describes equity holders, whose payoff is like a call option."],["Bondholders' payoff does not depend on the firm's asset value at all, as coupons are fixed.","Below D, bondholders' payoff falls with asset value."],["Bondholders have voting rights that protect them from all losses.","Bondholders typically have no voting power except in bankruptcy."]],"c":[0],"es":"Debt payoff = min(V, D): limited upside, full downside → ESG matters as tail/default risk.","ed":"Owning equity is like a call option on the firm (Merton, 1974): unlimited upside, limited downside. Bondholders have limited upside and bear the downside. Hence equity holders may like volatility while bondholders suffer from it, creating agency conflicts (underinvestment/debt overhang, risk shifting). In fixed income ESG analysis the focus is therefore on risks (tail events that can trigger default or downgrades) rather than opportunities, except perhaps in high yield. VW's CDS spread jumped from 75.5 to 299.5 bps after dieselgate.","kt":"","src":"L10 slide 3 · Bok s. 258 (9.1.5) · Bok s. 259 (9.2)"},{"id":"SB364","l":"L10","t":"Bond valuation","f":"m","d":2,"p":"H","sc":"none","s":"Lecture 10 (slide 4) lists valuation drivers for sovereign and corporate bonds. Which is listed as a driver of CORPORATE bond valuation?","o":[["External debt","Listed under sovereign bonds."],["Loss given default","Listed under corporate bonds."],["GDP per capita","Listed under sovereign bonds."],["Default history of the country","Listed under sovereign bonds."]],"c":[1],"es":"Sovereign: GDP, growth, GDP per capita, inflation, external debt, default history. Corporate: default risk, LGD, liquidity, credit migration.","ed":"Cantor and Packer find sovereign ratings and borrowing costs are explained by per capita income, GDP growth, inflation, external debt, economic development and default history. Corporate bonds carry more default and liquidity risk; spreads reflect default probability, loss given default, liquidity and the risk of rating migration (Fisher; Cohan). ESG enters as an additional driver of these credit risk indicators (Figure 9.2: ESG factors → factors influencing creditworthiness → credit risk indicators). Also correct: Credit migration risk.","kt":"","src":"L10 slide 4 · Bok s. 256 (9.1.3.1) · Bok s. 256 (9.1.3.2)"},{"id":"SB365","l":"L10","t":"Bond valuation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: According to the textbook, longer-maturity bonds have a higher duration and are therefore more exposed to interest rate changes, which is one reason the yield curve typically slopes upwards.","o":[["True","Correct. Section 9.1.3: more of a long bond's cash flows lie far in the future, so its price is more sensitive to yields; this exposure carries a risk premium."],["False","Incorrect. Section 9.1.3: more of a long bond's cash flows lie far in the future, so its price is more sensitive to yields; this exposure carries a risk premium."]],"c":[0],"es":"True: longer maturity → higher duration → more rate risk → upward-sloping yield curve.","ed":"A bond's price is the present value of its coupons and face value; the yield to maturity is its IRR. Prices and yields move inversely, so bonds trade at a premium, at a discount or at par. Duration measures price sensitivity to rates. Insurers and pension funds hold large bond portfolios to hedge interest rate risk on long-term liabilities (Lecture 12).","kt":"","src":"Bok s. 254 (9.1.3) · Bok s. 256 (9.1.3)"},{"id":"SB366","l":"L10","t":"Bond valuation","f":"m","d":3,"p":"M","sc":"none","s":"Bond X has a higher yield to maturity than bond Z. According to the textbook, what can you conclude about their expected returns?","o":[["Bond Z must be in default or close to default.","Lower yield does not imply default."],["Both bonds have expected returns equal to the risk-free rate, since spreads cancel out.","Risky bonds carry spreads reflecting default and liquidity risk."],["Bond X always has the higher expected return.","A higher YTM may simply reflect higher default risk."],["A higher YTM alone does not show a higher expected return; expected default losses lower it.","Expected payments are lower than promised payments when default is possible."]],"c":[3],"es":"YTM = promised return; expected return < YTM when default is possible.","ed":"The credit spread (corporate yield minus Treasury yield) reflects default and liquidity risk. Fisher (1959) finds default risk is the prime determinant of spreads, liquidity the second. Because the YTM is calculated on promised payments, a higher YTM does not mean a higher expected return. ESG analysis can improve estimates of default probability and loss given default, the core of fixed income risk.","kt":"","src":"Bok s. 257 (9.1.3.2)"},{"id":"SB367","l":"L10","t":"Credit ratings","f":"m","d":2,"p":"M","sc":"none","s":"How does S&P describe the role of ESG in its credit ratings (Lecture 10, slide 7; textbook section 9.3.3)?","o":[["ESG does affect ratings; the question is how.","S&P considers ESG within business risk, financial risk and management and governance."],["ESG factors determine 90% of every rating.","ESG is integrated within the broader framework, not a fixed 90% weight."],["ESG factors are formally excluded from credit ratings.","S&P explicitly considers them within its rating factors."],["ESG is only used for sovereign ratings, never for corporates.","S&P considers ESG for corporates, e.g. climate risk in 717 rating cases."]],"c":[0],"es":"ESG enters ratings through business risk (competitive position), financial risk (cash flow/leverage) and management/governance.","ed":"S&P's corporate rating framework combines country and industry risk, competitive position, cash flow/leverage and modifiers (diversification, capital structure, financial policy, liquidity, management/governance). Wilkins (S&P) reports climate risk affected 717 rating cases over two years, mostly oil refining and utilities. Moody's says ESG is reflected holistically but impact is not always clear-cut. The textbook is sceptical: integration is still in its infancy and statements may be self-serving. Ratings are paid by issuers - a conflict of interest.","kt":"","src":"L10 slide 5 · L10 slide 7 · Bok s. 257 (9.1.4) · Bok s. 271 (9.3.3) · Bok s. 272 (9.3.3)"},{"id":"SB368","l":"L10","t":"Credit ratings","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Attig, El Ghoul, Guedhami and Suh (2013) find that credit rating agencies tend to award relatively LOWER ratings to firms with good social performance, because CSR spending reduces cash available to creditors.","o":[["True","Incorrect. They find agencies award relatively HIGH ratings to firms with good social performance; CSR conveys non-financial information used by rating agencies."],["False","Correct. They find agencies award relatively HIGH ratings to firms with good social performance; CSR conveys non-financial information used by rating agencies."]],"c":[1],"es":"False: good social performance → relatively higher credit ratings.","ed":"CSR strengths and concerns related to primary stakeholder management (community relations, diversity, employee relations, environmental performance, product characteristics) matter most for creditworthiness. Related: Polbennikov et al. find high-ESG corporate bonds have slightly lower spreads and modest outperformance; Bauer and Hann find good environmental management lowers spreads (up to 64 bp); Bauer, Derwall and Hann find employee relations explain 22-42% of spreads.","kt":"","src":"L10 slide 6 · Bok s. 263 (9.2.2) · Bok s. 264 (9.2.2)"},{"id":"SB369","l":"L10","t":"Relevance of sustainability to bonds","f":"m","d":3,"p":"H","sc":"none","s":"Table 9.1 (Lecture 10, slide 8) classifies ESG factors as relevant to corporate and sovereign bonds, mostly sovereign, or mostly corporate. Which is classified as MOSTLY SOVEREIGN?","o":[["Climate change and pollution (environmental)","These are relevant to both corporate and sovereign bonds."],["Corruption and rule of law (governance)","Listed under mostly sovereign governance factors."],["Product stewardship (environmental)","This is mostly corporate."],["Diversity and employee relations (social)","These are mostly corporate."]],"c":[1],"es":"Both: climate, biodiversity, pollution, human rights, health & safety, financial policy. Sovereign: disasters, political freedoms, demographics, corruption, rule of law. Corporate: product stewardship, diversity, shareholder rights, board.","ed":"Many factors, especially environmental ones, matter for both corporate and sovereign issuers. Sovereign-specific factors include natural disasters, land system change, political freedoms, demographic change, employment, poverty, trust, crime, food security, institutional strength, corruption, regime stability, rule of law and regulatory effectiveness. Corporate-specific ones include product stewardship, product responsibility, diversity, employee and community relations, shareholder rights, incentives, audit, board expertise and independent directors. The environmental side is better developed in data and impact products (green bonds) than the social side. Also correct: Demographic change and trust in society/institutions (social).","kt":"","src":"L10 slide 8 · Bok s. 260 (Table 9.1) · Bok s. 261 (9.2)"},{"id":"SB370","l":"L10","t":"Sovereign bonds and ESG","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A country with an investment-grade rating sees rising corruption, weakening rule of law and growing social unrest, while GDP growth is still fine. What should a sovereign bond analyst expect, based on the textbook?","o":[["Only equity investors are affected.","Sovereign bondholders bear default risk directly."],["Rising credit risk: governance is a key driver of sovereign ratings and spreads.","Corruption and weak institutions are strongly linked to worse ratings."],["Lower spreads, because unrest raises demand for bonds.","Instability raises risk premia."],["No effect, since only GDP growth matters for sovereign bonds.","Governance has driven sovereign credit for centuries."]],"c":[1],"es":"Weakening governance → higher sovereign credit risk.","ed":"Country ESG scores correlate strongly with credit ratings, and corruption was a key factor in the eurozone crisis. ESG rankings such as RobecoSAM's claim to pick up problems earlier than credit ratings, which is valuable for investors less dependent on agencies.","kt":"Sovereign credit risk: the risk that a government fails to pay its debt; driven by economic, fiscal and institutional (governance) factors.","src":"Bok s. 261 (9.2.1) · Bok s. 263 (9.2.1) · L10 slide 8"},{"id":"SB371","l":"L10","t":"Sovereign bonds and ESG","f":"t","d":3,"p":"L","sc":"short","s":"True or false: Because country sustainability rankings such as RobecoSAM's give governance by far the largest weight, they partly overlap with traditional credit ratings, which also focus on institutional quality.","o":[["True","Correct. Governance dominates the ranking, and credit ratings also weigh institutions, corruption and policy quality, so there is overlap; E and S add extra information."],["False","Incorrect. Governance dominates the ranking, and credit ratings also weigh institutions, corruption and policy quality, so there is overlap; E and S add extra information."]],"c":[0],"es":"True: governance-heavy rankings overlap with credit ratings.","ed":"The added value lies in environmental and social indicators and in faster updates. Nordic countries lead such rankings. Robeco uses ranking changes in a rules-based way to adjust sovereign bond weights.","kt":"Country sustainability ranking: a score of countries on environmental, social and governance indicators, used e.g. to tilt sovereign bond portfolios.","src":"Bok s. 265 (9.3.1) · Bok s. 267 (Table 9.2)"},{"id":"SB372","l":"L10","t":"Sovereign bonds and ESG","f":"t","d":3,"p":"L","sc":"none","s":"True or false: The textbook mentions implicit liabilities from social security - promised retirement incomes and health subsidies that may not be affordable - as a sovereign credit factor, citing high unfunded pension obligations in countries such as Japan and Italy.","o":[["True","Correct. Section 9.2 elaborates on this factor, which the authors added to Table 9.1."],["False","Incorrect. Section 9.2 elaborates on this factor, which the authors added to Table 9.1."]],"c":[0],"es":"True: unfunded social promises are a sovereign credit risk.","ed":"Implicit liabilities are promises by politicians that may not be sustainably affordable. High unfunded pension obligations (Japan, Italy, and to a lesser extent the US, France and Germany) can weaken creditworthiness. Demographic change (ageing) interacts with this, which is why RobecoSAM includes ageing (10%) and age-related policies.","kt":"","src":"Bok s. 261 (9.2) · Bok s. 267 (Table 9.2)"},{"id":"SB373","l":"L10","t":"Corporate bonds and ESG","f":"m","d":4,"p":"M","sc":"none","s":"Schneider (2011) finds that the relationship between environmental performance and bond yields fades as bond quality increases. Why?","o":[["Bond payoffs are non-linear, so liabilities matter near default.","For high-quality bonds, environmental liabilities rarely threaten repayment."],["Investors in high-quality bonds do not read environmental reports.","The explanation lies in payoff structure, not investor attention."],["High-quality issuers never have environmental liabilities.","They can, but liabilities are less likely to cause default."],["High-quality bonds are exempt from environmental regulation.","Regulation does not depend on bond ratings."]],"c":[0],"es":"Bondholders care about ESG mainly when it raises default risk, which matters most for weaker credits.","ed":"In chemicals and pulp and paper, poor environmental performers face future compliance and clean-up liabilities large enough to drive firms into bankruptcy, and bondholders' claims may be subordinated to environmental liabilities. Because bondholders only lose when the firm cannot pay, ESG risk is most relevant near default - consistent with the non-linear payoff on slide 3. The corporate bond market is also heavily exposed to carbon risk through energy, utilities and leveraged banks.","kt":"","src":"Bok s. 264 (9.2.2) · L10 slide 3"},{"id":"SB374","l":"L10","t":"Corporate bonds and ESG","f":"m","d":3,"p":"M","sc":"none","s":"Which mechanism explains why ESG factors can lower a company's cost of debt, according to the textbook?","o":[["Environmental liabilities never rank ahead of bondholders.","Clean-up liabilities can subordinate bondholders' claims."],["Bondholders gain from all upside, so ESG opportunities matter most.","Bondholders mainly care about downside risk."],["Anti-takeover defences protect bondholders, so they lower spreads.","The evidence links more anti-takeover mechanisms to a higher cost of debt."],["Stronger governance (e.g. more outside directors) reduces agency problems that hurt creditors.","Better monitoring lowers credit risk."]],"c":[3],"es":"Stable cash flows and good governance reduce default risk → lower spreads.","ed":"Bondholders care about the probability and severity of default. Employee relations, governance and environmental management all affect these. The effect is strongest for weaker credits because of the non-linear bond payoff. Also correct: Good employee relations make cash flows more stable and help firms get worker concessions in distress.","kt":"Cost of debt: the interest rate a company pays on borrowing, which rises with default risk and loss given default.","src":"Bok s. 264 (9.2.2) · Bok s. 265 (9.2.2) · L10 slide 3"},{"id":"SB375","l":"L10","t":"Sustainability-linked bonds","f":"m","d":3,"p":"H","sc":"short","s":"In 2019 Italian utility Enel issued the first major sustainability-linked bond: proceeds for general purposes, but the coupon rises by 25 bp if Enel misses its renewable capacity target. Compared with a green bond, what is the key difference?","o":[["The SLB is ring-fenced to the renewable assets.","Neither SLBs nor green bonds are ring-fenced."],["The SLB proceeds must go to renewable projects only.","That describes a green (use-of-proceeds) bond."],["The SLB ties the coupon to company KPIs, not use of proceeds.","Incentives work through pricing, not earmarking."],["The SLB has no link to sustainability at all.","The coupon depends on a sustainability target."]],"c":[2],"es":"SLB: KPI-linked coupon; green bond: earmarked proceeds.","ed":"SLBs let companies without enough green projects signal commitment at firm level. Credibility depends on ambitious, material KPIs and a meaningful penalty; critics note small step-ups and easy targets. Same logic as sustainability-linked loans and derivatives.","kt":"Sustainability-linked bond (SLB): a general-purpose bond whose financial terms (usually the coupon) change depending on whether the issuer meets sustainability performance targets.","src":"L10 slide 9 · L10 slide 24 · L11 slide 25"},{"id":"SB376","l":"L10","t":"ESG integration in bonds","f":"m","d":3,"p":"M","sc":"none","s":"In Box 9.1, a corporate bond portfolio manager explains why engagement is harder from the bond side. Which reason does she give?","o":[["Companies are legally forbidden to talk to bondholders.","No such prohibition exists."],["All bonds of an issuer are identical, so there is nothing to discuss.","Bonds are heterogeneous in maturity and seniority."],["Bondholders are not owners and do not share in value creation.","She stresses that it is all about downside risk and preserving capital."],["Bondholders always hold majority voting rights, creating conflicts with management.","Bondholders have no voting rights outside bankruptcy."]],"c":[2],"es":"Not owners, heterogeneous illiquid OTC instruments, hard to identify holders, engagement less institutionalised.","ed":"Bondholders focus on downside and capital preservation, creating conflicts with shareholders that ESG specialists often misunderstand. Bonds come in many maturities and seniorities with small, expensive-to-trade markets, so investors buy and hold. Engagement works best at (re)issuance, and \"the carrot works better than the stick\". She suggests tying management pay to bond metrics like CDS spreads. Slide 12 nevertheless lists the refinancing need as a lever for bond investors. Also correct: Bonds trade over the counter, so firms struggle to identify their bondholders after issuance.","kt":"","src":"Bok s. 270 (Box 9.1) · Bok s. 271 (Box 9.1) · L10 slide 12"},{"id":"SB377","l":"L10","t":"Relevance of bonds to sustainability","f":"m","d":3,"p":"H","sc":"none","s":"Lecture 10 (slide 12) argues bonds are relevant to sustainability despite the lack of voting rights. Which lever is listed?","o":[["Bonds cannot be shorted, which protects sustainable issuers.","The slide lists shorting \"bad\" bonds as a lever."],["Bond markets are much smaller than equity markets, so they are easier to coordinate.","Bond markets are larger than equity markets."],["Issuers must regularly refinance, giving investors leverage.","The need to refinance gives bond investors recurring influence."],["Bondholders can replace the board at any annual general meeting.","Bondholders have no voting rights at AGMs."]],"c":[2],"es":"Levers: refinancing need, market size (> equities), shorting \"bad\" bonds, engagement, signalling (green bonds).","ed":"Bonds mature, so issuers return to the market and must satisfy investors' conditions. The bond market ($92 trillion in 2016 vs $70 trillion listed equity) is larger than equity markets, so moving bond capital matters. Investors can short \"bad\" bonds (the Adani short-seller attack forced capex cuts and bond buybacks). Engagement is possible, especially pre-issuance, and green bonds allow firms to signal commitment (Flammer, 2021).","kt":"","src":"L10 slide 12 · Bok s. 253 (9.1)"},{"id":"SB378","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"Which is among the four core components of ICMA's Green Bond Principles?","o":[["A guaranteed coupon below that of conventional bonds","Pricing is not part of the principles."],["An AAA credit rating","Not required; most green bonds are investment grade but not necessarily AAA."],["Reporting on the use of proceeds","This is component 4 of the GBP."],["Mandatory approval by the European Central Bank","Not a component of the voluntary principles."]],"c":[2],"es":"1 use of proceeds; 2 project evaluation and selection; 3 management of proceeds; 4 reporting.","ed":"(1) proceeds exclusively for green projects, described in legal documentation; (2) the issuer communicates environmental objectives, how projects qualify and eligibility criteria; (3) net proceeds credited to a sub-account and tracked; (4) mandatory reporting on use of proceeds. ICMA also has Social Bond Principles (same four components), Sustainability Bond Guidelines and Sustainability-Linked Bond Principles; the EU has a regulated European Green Bond Standard. Also correct: Management of proceeds (credited to a sub-account, tracked and verified).","kt":"","src":"L10 slide 9-10 · Bok s. 273 (9.4.1)"},{"id":"SB379","l":"L10","t":"Green bonds","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Because green bond proceeds are earmarked for green projects, the bonds are ring-fenced: their repayment depends only on the cash flows of the financed green project, not on the issuer's overall creditworthiness.","o":[["True","Incorrect. Green bonds are earmarked but NOT ring-fenced; they carry the same credit risk as the issuer's other bonds with the same conditions."],["False","Correct. Green bonds are earmarked but NOT ring-fenced; they carry the same credit risk as the issuer's other bonds with the same conditions."]],"c":[1],"es":"False: earmarked, not ring-fenced → same credit risk as the issuer's conventional bonds.","ed":"Unless the project makes up all the issuer's assets, green bond payments are not tied to the project. In theory, there should therefore be no price difference with comparable conventional bonds. Morgan Stanley (121 bonds) finds similar spreads; Zerbib finds a small negative premium (\"greenium\") of about 8 bp, suggesting excess demand for green bonds. Social bonds share this feature.","kt":"","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)"},{"id":"SB380","l":"L10","t":"Green bonds","f":"m","d":3,"p":"H","sc":"none","s":"Studies such as Zerbib (2017) find green bonds yield slightly less than matched conventional bonds from the same issuer. What is the best interpretation?","o":[["Green bonds are less liquid, so they yield less.","Lower liquidity would raise, not lower, yields; the study controls for liquidity."],["Green bond issuers are always less likely to default.","Same issuer, same default risk."],["Investor demand for green bonds exceeds supply.","Credit risk is the same, so the lower yield reflects demand for the label."],["Green bonds are ring-fenced and therefore safer.","Green bonds are earmarked, not ring-fenced."]],"c":[2],"es":"The greenium is small and reflects demand, not lower risk.","ed":"Because the greenium is small, issuers gain modestly cheaper funding and investors give up little return. Other studies find similar spreads to conventional bonds once the market grows. Remember the sign and the reason, not the exact basis points.","kt":"Greenium: the yield discount on a green bond versus a comparable conventional bond.","src":"Bok s. 275 (9.4.1) · L9 slide 14"},{"id":"SB381","l":"L10","t":"Green bonds","f":"m","d":3,"p":"H","sc":"none","s":"Flammer (2021), \"Corporate green bonds\" (Lecture 10, slide 13), studies what happens around green bond issuance. Which finding is reported?","o":[["Positive stock reactions and better environmental performance afterwards.","Consistent with credible signalling of environmental commitment."],["Stock prices fall sharply, showing investors see green bonds as greenwashing.","Investors respond positively, especially to first-time and certified issues."],["Issuers' CO2 emissions rise after issuance.","Emissions fall and environmental ratings rise."],["Green bonds attract mainly short-term hedge funds.","Ownership by long-term and green investors increases."]],"c":[0],"es":"Positive announcement returns (esp. first-time, certified), better environmental performance, more long-term/green owners → signalling.","ed":"The stock market responds positively to green bond announcements, more so for first-time issuers and third-party certified bonds. After issuance, environmental ratings rise and CO2 emissions fall, and ownership by long-term and green investors increases. Flammer interprets this as signalling: issuing a (certified) green bond credibly signals commitment to the environment. It contrasts with the view that green bonds are mere relabelling.","kt":"","src":"L10 slide 13"},{"id":"SB382","l":"L10","t":"Green bonds","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: If a green bond and a conventional bond from the same issuer have identical terms, a bondholder bears the same default risk on both, so any lower yield on the green bond is a price paid for the label rather than compensation for lower risk.","o":[["True","Correct. Green bonds are earmarked but not ring-fenced, so credit risk is the same; the \"greenium\" reflects demand."],["False","Incorrect. Green bonds are earmarked but not ring-fenced, so credit risk is the same; the \"greenium\" reflects demand."]],"c":[0],"es":"True: same credit risk; the greenium reflects demand for the label.","ed":"Zerbib estimates a small greenium (about 8 bp). Investors may still prefer the green bond for impact reporting, signalling (Flammer) or mandate reasons, but should not think it is safer.","kt":"Greenium: the lower yield (higher price) investors accept on a green bond versus a comparable conventional bond.","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)"},{"id":"SB383","l":"L10","t":"Green bonds","f":"m","d":3,"p":"M","sc":"short","s":"Poland, which generates around 80% of its energy from coal, issues a sovereign green bond. Which challenge of the green bond market does this illustrate, according to the textbook?","o":[["Coal-dependent countries are legally barred from the bond market.","No such bar exists."],["Investors must judge the credibility of the issuer's wider ambitions.","The textbook calls this a dilemma for investors in sovereign green bonds."],["Green bonds cannot be issued by sovereigns under any standard.","Several sovereigns (Indonesia, Poland, France) have issued green bonds."],["Sovereign green bonds are always ring-fenced to the projects financed.","They are earmarked, not ring-fenced."]],"c":[1],"es":"Green label on projects vs brown overall profile → investors must assess credibility.","ed":"Challenges include the lack of agreement on what is green (Chinese guidelines are less strict than the GBP's 95% green proceeds), the need for better investor communication, unsuitability for complex transactions (Renewi used bank finance for its merger), and reputational risk (Unilever's £250m green bond was excluded from a green bond index). Sovereign issuers with coal-heavy energy systems raise credibility questions; the EU Green Bond Standard and taxonomy aim to tighten definitions.","kt":"","src":"Bok s. 276 (9.4.2) · Bok s. 273 (9.4.1)"},{"id":"SB384","l":"L10","t":"Social bonds","f":"m","d":3,"p":"M","sc":"none","s":"How does a social impact bond (SIB), such as the 2012 Peterborough SIB, differ from a social bond?","o":[["A SIB is ring-fenced, while a social bond is guaranteed by the government.","Neither statement is the distinction drawn."],["A SIB repays investors with a return only if outcomes are met.","The textbook notes SIBs are not really bonds."],["A SIB is a regular bond with proceeds earmarked for social projects, while a social bond is a donation.","This reverses the definitions; social bonds are regular bonds with earmarked proceeds."],["There is no difference; the terms are interchangeable.","The textbook warns they are often confused."]],"c":[1],"es":"Social bond = earmarked regular bond (SBP four components); SIB = outcome-based payment contract.","ed":"Social bonds finance eligible social projects (affordable infrastructure, access to essential services, affordable housing, employment, food security, socioeconomic advancement) for target populations (people below the poverty line, marginalised, vulnerable groups, unemployed). They follow the same four components as the GBP and carry the issuer's credit risk. SIBs pay investors back plus a return only if a social outcome is achieved (Peterborough: £5m to reduce reoffending). Social bonds are criticised as complex and bureaucratic, and social results are hard to measure.","kt":"","src":"Bok s. 276 (9.4.3) · Bok s. 277 (9.4.3)"},{"id":"SB385","l":"L10","t":"Sustainability-linked instruments","f":"t","d":3,"p":"H","sc":"none","s":"True or false: A sustainability-linked bond, like a green bond, must use its proceeds exclusively for eligible green or social projects; the only difference is that it pays a fixed coupon.","o":[["True","Incorrect. Sustainability-linked bonds are general-purpose: their terms (typically the coupon) change depending on whether the issuer meets predefined sustainability KPIs, rather than restricting use of proceeds."],["False","Correct. Sustainability-linked bonds are general-purpose: their terms (typically the coupon) change depending on whether the issuer meets predefined sustainability KPIs, rather than restricting use of proceeds."]],"c":[1],"es":"False: SLBs link terms (coupon) to issuer KPIs; proceeds are not earmarked.","ed":"ICMA distinguishes use-of-proceeds instruments (green bonds, social bonds, sustainability bonds combining both) from sustainability-linked bonds, which tie financial characteristics to issuer-level sustainability performance targets (e.g. a coupon step-up if an emissions KPI is missed). The same logic underlies sustainability-linked loans and derivatives (slide 24). The credibility of SLBs depends on ambitious, material KPIs and meaningful penalties.","kt":"","src":"L10 slide 9 · L10 slide 24"},{"id":"SB386","l":"L10","t":"Non-equity asset classes","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A real estate fund owns offices rated EPC \"F\" in a city that will ban letting buildings below \"C\" from 2030. What should the fund do in its investment cycle?","o":[["Raise rents to compensate.","Tenants will avoid buildings that will become unlettable."],["Sell immediately at any price.","Retrofitting may create more value than a fire sale."],["Plan retrofits during ownership and price stranding risk into valuations.","ESG belongs in ownership, valuation and exit planning."],["Ignore it until 2030, since rules may change.","Waiting raises stranding risk and lowers exit value."]],"c":[2],"es":"Retrofit and reprice: manage stranding risk across the investment cycle.","ed":"Lecture 10's real estate cycle covers deal sourcing, investment decision, ownership and sale. Split incentives with tenants complicate retrofits; green leases can help. Banks see the same risk through mortgage collateral (Lecture 11).","kt":"Energy Performance Certificate (EPC): a rating of a building's energy efficiency; minimum standards can make low-rated buildings unlettable.","src":"L10 slide 18-19 · L10 slide 14"},{"id":"SB387","l":"L10","t":"Real estate","f":"m","d":3,"p":"M","sc":"none","s":"Lecture 10 (slide 18) shows ESG across the real estate investment cycle. Which stage involves \"including ESG in management of the asset, use of external property managers and engagement with tenants\"?","o":[["Investment decision","This stage communicates material issues to the investment committee and assesses valuation impact."],["Deal sourcing","Deal sourcing is about identifying material ESG issues in screening and due diligence."],["Sale","The sale stage is about adding value when the asset is sold."],["Ownership","This is the ownership stage."]],"c":[3],"es":"Deal sourcing → investment decision → ownership (asset management, tenants) → sale.","ed":"In real estate, ESG enters deal sourcing (material issues in screening, due diligence, new developments and renovations), the investment decision (impact on valuation), ownership (asset management, property managers, tenant engagement) and sale (realising added value). UNPRI's framework adds green certification targets, minimum standards for developments, and working with occupiers on split incentives (owners pay for efficiency, tenants get lower bills).","kt":"","src":"L10 slide 18-19"},{"id":"SB388","l":"L10","t":"Real estate","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In real estate, \"split incentives\" arise because the owner often pays for energy efficiency investments while tenants enjoy the lower energy bills, which can lead to under-investment in green upgrades.","o":[["True","Correct. Slide 19 recommends working with occupiers to address split incentives, e.g. through green lease clauses."],["False","Incorrect. Slide 19 recommends working with occupiers to address split incentives, e.g. through green lease clauses."]],"c":[0],"es":"True: owner pays, tenant benefits → under-investment.","ed":"Split incentives are a principal-agent problem. Solutions include green leases that share costs and savings, tenant engagement and minimum standards. Certifications such as BREEAM (UK) and LEED (US), and green building councils (World GBC, Norwegian Grønn Byggallianse), help signal building quality. Green buildings contribute to several SDGs (health, energy, cities, climate).","kt":"","src":"L10 slide 19-20 · L10 slide 17"},{"id":"SB389","l":"L10","t":"Credit ratings and ESG","f":"m","d":3,"p":"M","sc":"short","s":"After a short-seller report in 2023, Adani Group companies saw their bond prices fall sharply, and Adani cut capex and bought back bonds to restore confidence. Which lever of bond markets does this illustrate?","o":[["Green bond use-of-proceeds rules","The pressure came from market pricing, not earmarking."],["Equity dilution from new shares","The example concerns bond markets."],["Bondholders' voting rights at the AGM","Bondholders normally have no AGM votes."],["Refinancing pressure: firms need bond investors' confidence.","Falling bond prices raise funding costs and force action."]],"c":[3],"es":"Bond market pressure via prices and refinancing forced corporate response.","ed":"Slide 12 lists maturity/refinancing, market size, shorting \"bad\" bonds, engagement and signalling as levers. Governance concerns (G) translated into credit pricing - consistent with evidence that governance is the most documented ESG factor in bonds.","kt":"Refinancing need: because bonds mature, issuers must return to investors, who can demand higher spreads or refuse to roll over debt.","src":"L10 slide 12 · Bok s. 265 (9.2.2)"},{"id":"SB390","l":"L10","t":"Derivatives","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"Constructed scenario: An aluminium producer in the EU fears rising carbon prices will squeeze margins over the next three years. Which instrument from Lecture 10's list best hedges this risk?","o":[["Buying EU emission allowance futures","Emissions trading derivatives lock in the carbon cost."],["Buying catastrophe bonds","Cat bonds transfer natural catastrophe risk, not carbon price risk."],["Buying renewable energy certificates only","RECs certify renewable power, not EU ETS compliance costs."],["Issuing a social bond","Social bonds fund social projects; they do not hedge carbon prices."]],"c":[0],"es":"Hedge carbon price risk with emission allowance futures.","ed":"Hedging reduces cash flow volatility but does not cut emissions; the long-term solution is abatement (e.g. green power), which also lowers transition risk in valuations.","kt":"Emission allowance futures: contracts to buy EU ETS allowances at a fixed price in the future, hedging carbon cost risk.","src":"L10 slide 23"},{"id":"SB391","l":"L10","t":"Derivatives","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"In Lecture 10 (slide 24), SBM Offshore's 2019 sustainability improvement derivative (ING) hedged interest rate risk on a $1bn credit facility. How was ESG built in?","o":[["The notional amount doubled if SBM's emissions rose.","The mechanism adjusts the spread, not the notional."],["The fixed rate was unchanged, but HSBC donated to charity if the rating improved.","That describes Siemens Gamesa's swap with HSBC."],["A 5-10 bp discount or penalty linked to its ESG score.","The spread adjusts with SBM's ESG performance."],["The swap was cancelled if SBM missed any ESG target.","Missing the target triggers a penalty spread, not cancellation."]],"c":[2],"es":"SBM: ±5-10 bp on the fixed rate tied to ESG score. Siemens Gamesa: fixed rate unchanged; charitable donation tied to rating changes.","ed":"Sustainability-linked derivatives embed incentives in hedging instruments. SBM Offshore pays less (5-10 bp) if it meets its ESG score target and more if not. Italo (Natixis, 2020) combined a sustainability-linked loan and swap with KPI-linked incentives. Siemens Gamesa's HSBC swap keeps the fixed rate but triggers donations: HSBC donates if the ESG rating improves, Siemens Gamesa if it declines. Credibility depends on KPI ambition and the size of incentives; small spread changes may have limited effect.","kt":"","src":"L10 slide 24"},{"id":"SB392","l":"L10","t":"Bonds and agency costs","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook, what is the debt overhang (underinvestment) problem (Myers, 1977)?","o":[["Firms with no debt cannot raise equity because investors fear dilution.","Unrelated to debt overhang."],["Bondholders block all new investments using their voting rights.","Bondholders typically have no voting rights."],["Shareholders invest in too many safe projects to protect bondholders.","Shareholders tend towards too little or too risky investment, not excessive safety."],["Shareholders forgo positive-NPV projects whose gains go to creditors.","Shareholders only invest if returns are high enough to leave them a residual."]],"c":[3],"es":"Debt overhang: positive-NPV projects foregone because payoffs accrue to creditors; risk shifting: negative-NPV gambles benefiting equity.","ed":"With high leverage, new equity-financed investments mostly benefit bondholders, so shareholders underinvest. With internal capital, shareholders may instead prefer risky all-or-nothing projects (risk shifting, Galai and Masulis). Covenants (restrictions on investments, dividends, new financing) limit these conflicts but create monitoring and bonding costs. Since bondholders rely on delegated monitoring and have little control, ESG red flags matter. Banks (Lecture 11) monitor more directly.","kt":"","src":"Bok s. 258 (9.1.5) · Bok s. 259 (9.1.5)"},{"id":"SB393","l":"L10","t":"Commodities and supply chains","f":"t","d":3,"p":"L","sc":"short","s":"True or false: The EU Deforestation Regulation requires companies placing products such as cocoa, coffee, palm oil and soy on the EU market to show they are deforestation-free, which makes supply-chain traceability a material issue for chocolate makers.","o":[["True","Correct. The regulation requires due diligence and traceability for listed commodities, turning deforestation risk into a compliance and market-access issue."],["False","Incorrect. The regulation requires due diligence and traceability for listed commodities, turning deforestation risk into a compliance and market-access issue."]],"c":[0],"es":"True: traceability becomes material for cocoa-based firms.","ed":"Like the Swiss Platform for Sustainable Cocoa, regulation and industry initiatives internalise externalities (deforestation, child labour). Investors can engage on traceability or face exposure to fines, lost market access and reputational damage.","kt":"Supply-chain traceability: the ability to track a product's origin back to the farm or plot, needed to prove it is deforestation-free.","src":"L10 slide 22 · L3 slide 17"},{"id":"SB394","l":"L10","t":"Bonds synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A BBB-rated chemicals company with weak environmental management issues both a conventional and a green bond with identical terms; the green bond yields 8 bp less. A bond investor worried about clean-up liabilities must choose. What is the best reasoning?","o":[["Both carry the same credit risk; first assess default risk from liabilities.","Green bonds are not ring-fenced; ESG matters for credit risk, especially for weaker credits."],["Ignore environmental issues because bondholders only care about coupons.","Clean-up liabilities can drive default, and bondholders bear downside risk."],["Buy the green bond because its proceeds are ring-fenced and therefore safer.","Green bonds are earmarked, not ring-fenced."],["Buy the conventional bond because green bonds always default more often.","Default risk is the same for both bonds of the same issuer."]],"c":[0],"es":"Same issuer → same credit risk; the label changes yield (greenium), not risk. ESG analysis must focus on default risk.","ed":"The investor's main question is credit risk. Schneider shows environmental liabilities matter most for weaker credits and can subordinate bondholders' claims, so a BBB chemicals issuer with weak environmental management deserves careful analysis. The green label does not reduce this risk; the 8 bp lower yield is a greenium paid for the label. If the investor values the use-of-proceeds impact and signalling (Flammer), the green bond may still be preferred - but only after the credit decision is sound.","kt":"","src":"Bok s. 264 (9.2.2) · Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1) · L10 slide 3 · L10 slide 13"},{"id":"SB395","l":"L10","t":"Bonds basics","f":"m","d":1,"p":"L","sc":"none","s":"According to Figure 9.1 in the textbook, which statement about bond types is correct?","o":[["Supranational bonds are issued by municipalities and local governments.","Supranationals are issued by bodies like the World Bank or EIB."],["Unsecured bondholders are always repaid before secured bondholders.","Secured bondholders have priority over pledged assets."],["Secured bonds give a direct claim on pledged collateral.","Secured bonds (structured products) pledge specific assets."],["Bank loans are a type of public debt traded on exchanges.","Bank loans are private debt."]],"c":[2],"es":"Government: supranational, sovereign, municipal. Corporate: secured (collateral) vs unsecured (senior, subordinated).","ed":"Government bonds include supranationals (World Bank, EIB - the first green bond issuer in 2007), sovereigns and municipals. Corporate bonds are split into financial and non-financial issuers and into secured (mortgage bonds, asset-backed securities, central in the 2008-09 crisis) and unsecured (senior before subordinated). Bonds can include call provisions, sinking funds or conversion into equity.","kt":"","src":"Bok s. 254 (9.1.2) · Bok s. 254 (Figure 9.1) · Bok s. 255 (9.1.2)"},{"id":"SB396","l":"L10","t":"Corporate bonds and ESG","f":"t","d":3,"p":"M","sc":"short","s":"True or false: Because bondholders do not share in a company's upside, a sudden ESG scandal such as Volkswagen's dieselgate is irrelevant to them as long as the company does not default immediately.","o":[["True","Incorrect. Scandals raise default risk and credit spreads (VW's CDS spread jumped sharply), lowering bond prices even without default."],["False","Correct. Scandals raise default risk and credit spreads (VW's CDS spread jumped sharply), lowering bond prices even without default."]],"c":[1],"es":"False: ESG scandals raise credit risk and spreads immediately.","ed":"ESG issues create tail risks in going-concern and default scenarios (Hanson et al.). Bond prices fall when default probability or loss given default rises, so bondholders care about ESG downside even without upside.","kt":"CDS spread: the price of insuring against a company's default; it rises when perceived credit risk rises.","src":"Bok s. 259 (9.2) · L10 slide 3"},{"id":"TR44","l":"L10","t":"Debt and equity payoffs","f":"m","d":3,"p":"H","sc":"none","s":"Seen as claims on a firm's assets with debt D outstanding, which option does the payoff to EQUITY holders resemble?","o":[["A risk-free bond paying D at maturity","Equity is the riskiest, residual claim."],["A forward contract that must be settled at D","A forward has symmetric payoffs, unlike limited-liability equity."],["A put option on the firm's assets with strike price D","A put pays when value falls below the strike; that relates to debt."],["A call option on the firm's assets, strike D","Shareholders get max(V − D, 0): unlimited upside, limited downside."]],"c":[3],"es":"Equity = call on firm assets; debt = risk-free debt minus a put.","ed":"This explains asset substitution: like call holders, shareholders gain from higher risk, while creditors (short the put) lose. Green and sustainability bonds change the information and incentives around this basic payoff structure.","kt":"Debt as an option: debt payoff = min(V, D), i.e. a risk-free payment of D minus a put option on the firm's assets.","src":"Opptak L10 ca. 10 min · Opptak L10 ca. 13 min"},{"id":"TR45","l":"L10","t":"Bond risks","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A utility is downgraded after an ESG scandal but is still expected to pay all coupons. Which bondholder is most exposed to the loss from the downgrade?","o":[["Shareholders, since downgrades only affect equity","Downgrades directly reprice the bonds."],["None, since fixed coupons protect all bondholders","Fixed coupons mean the price must fall to raise the yield."],["One who must sell the bond before maturity","Credit migration causes a mark-to-market loss realised only on sale."],["One who holds to maturity and is paid in full","If the issuer pays, the hold-to-maturity investor loses nothing."]],"c":[2],"es":"Downgrade → price falls → loss if you sell before maturity.","ed":"Corporate bond risks: default risk, loss given default, liquidity risk and credit migration risk. Sovereign bonds add GDP growth, inflation, external debt and default history. ESG factors feed into ratings through these channels.","kt":"","src":"Opptak L10 ca. 19 min"},{"id":"TR46","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A shipping firm issues a bond that can fund any corporate purpose, but its coupon rises by 0.25% if it fails to cut fleet emissions by 30% by 2030. What type of bond is this?","o":[["A catastrophe bond","Cat bonds transfer insurance risk from natural disasters."],["A social bond","A social bond earmarks proceeds for social projects."],["A green bond","A green bond earmarks proceeds for specified green projects."],["A sustainability-linked bond","SLBs tie terms to a KPI target; proceeds are not earmarked."]],"c":[3],"es":"Any use of funds + KPI-linked coupon = sustainability-linked bond.","ed":"Green, social and sustainability bonds are use-of-proceeds bonds: issuers state the projects, keep proceeds tracked (often in a separate account) and report, which lowers information asymmetry. SLBs instead set targets; the risk is greenwashing via easy, self-measured targets, partly checked by market discipline and certification.","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min"},{"id":"TR47","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"M","sc":"none","s":"Why does Lecture 10 see room for greenwashing in sustainability-linked bonds, and what limits it?","o":[["Proceeds must go to green projects, which are rarely audited","SLB proceeds are not earmarked at all."],["Issuers set own targets; investors may shun easy ones","Market discipline and external certification check weak targets."],["Regulators set SLB targets, which tend to be too strict","Targets are set by the issuer."],["SLBs pay no coupon, so investors cannot penalise issuers","SLBs pay coupons, with step-ups if targets are missed."]],"c":[1],"es":"Self-set, self-measured targets → greenwashing risk; markets push back.","ed":"A 5% emissions cut the firm would make anyway is a weak target. If investors see this, demand falls and issuance gets harder. In the EU, voluntary principles (ICMA) are complemented by the mandatory-style European Green Bond Standard for green bonds.","kt":"","src":"Opptak L10 ca. 35 min"},{"id":"TR48","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"M","sc":"none","s":"Evidence cited in Lecture 10 shows that after issuing green bonds, firms improve their environmental performance and attract more long-term and green investors. Which mechanism does this support?","o":[["Greenwashing, since green bonds never change behaviour","Improvement after issuance argues against pure greenwashing."],["Signalling a credible commitment to the environment","Green bond issuance works as a costly, credible signal."],["Short-selling pressure on the issuer","Short-selling is a different bond-market lever."],["Lower default risk from separate cash reserves only","The finding is about environmental performance and investor base."]],"c":[1],"es":"Green bonds act as a credible signal of commitment.","ed":"Other bond levers in the lecture: refinancing (firms must return to the market at maturity), market size (bond markets are larger than equity), short-selling (e.g. Adani) and engagement. Green loans work the same way as a signal.","kt":"","src":"Opptak L10 ca. 39 min · Opptak L10 ca. 41 min"},{"id":"TR49","l":"L10","t":"Blended finance","f":"m","d":3,"p":"M","sc":"none","s":"Sustainable infrastructure in developing countries is often underfunded by private investors. How does blended finance address this?","o":[["It requires investors to accept zero financial return","It improves risk-return so private investors can still earn a return."],["Public money takes part of the risk for private investors","Government backing lowers perceived physical, legal and institutional risks."],["It only applies to listed equity in rich countries","It is mainly used in emerging and developing markets."],["It bans private investors from infrastructure projects","The aim is to attract private capital, not exclude it."]],"c":[1],"es":"Public risk-sharing unlocks private capital for public-good-like projects.","ed":"Infrastructure has public-good features: the builder bears the cost, but benefits are shared, so private investment falls short. Blended finance (e.g. guarantees, first-loss capital) fixes the risk-return gap. Development finance institutions such as Norfund play this role.","kt":"","src":"Opptak L10 ca. 57 min"},{"id":"SB397","l":"L11","t":"Bank business model","f":"m","d":3,"p":"M","sc":"short","s":"Silicon Valley Bank failed in March 2023 after rising interest rates cut the value of its long-term bonds and depositors withdrew funds quickly. Which bank risks from Lecture 11 does this best illustrate?","o":[["Interest rate and liquidity risk from maturity transformation","Long assets funded by runnable short-term deposits."],["Insurance underwriting risk","SVB was a bank, not an insurer."],["Physical climate risk to bank branches","Not the cause of the failure."],["Credit risk from borrowers' carbon emissions","The trigger was rates and deposit flight, not borrower defaults."]],"c":[0],"es":"Maturity mismatch → interest rate + liquidity risk.","ed":"The case is a governance (G) issue too: weak risk management and a concentrated depositor base. It reminds us that ESG integration in banking includes governance and risk culture, not just environmental lending.","kt":"Maturity transformation: using short-term deposits to fund long-term loans or bonds; it creates interest rate and liquidity (run) risk.","src":"L11 slide 9 · L11 slide 10"},{"id":"SB398","l":"L11","t":"Role of banks","f":"m","d":2,"p":"H","sc":"none","s":"Lecture 11 (slide 7) describes the monitoring role of banks. Which element is part of it?","o":[["Voting at borrowers' annual general meetings as shareholders","Banks monitor as lenders, not as voting shareholders."],["Screening projects ex ante to prevent adverse selection","First element of monitoring."],["Issuing ESG ratings for listed companies","This is done by ESG rating agencies."],["Guaranteeing all deposits with the bank's own equity","Deposit insurance is a public scheme, not part of monitoring."]],"c":[1],"es":"Monitoring = screening (adverse selection) + preventing opportunism (moral hazard) + costly state verification.","ed":"Asymmetric information lies at the core of banking. Banks screen before lending, monitor during the loan to prevent moral hazard, and audit defaulting borrowers. They have a comparative advantage (Diamond, 1984) through economies of scale and low delegation costs. Unlike market investors, who face a free-rider problem because trading reveals information, banks can keep information from long-run relationships (checking accounts, factoring). This also lets them analyse sector-wide sustainability trends and spread best practices. Also correct: Auditing borrowers that fail to meet their obligations (costly state verification).","kt":"","src":"L11 slide 7 · Bok s. 285 (10.1.3) · Bok s. 286 (10.1.3)"},{"id":"SB399","l":"L11","t":"Role of banks","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook, when do companies typically turn to bank lending rather than market (bond) lending?","o":[["When uncertainty is lowest, because banks only lend to the safest firms.","The safest, large firms with track records tend to use bond markets."],["When the firm wants to avoid any monitoring by lenders.","Bank lending involves more, not less, monitoring."],["When cash flow uncertainty is higher, as banks can intervene.","With low asymmetric information firms borrow in markets; as it rises, banks come into play."],["Only when companies are large and publicly listed.","Large listed firms often use bond markets; small firms depend on banks."]],"c":[2],"es":"Low information asymmetry → bond markets; moderate → banks; too high → no finance. Small firms → banks.","ed":"Large, well-capitalised firms with published track records finance themselves in markets; smaller, newer firms turn to banks because banks can request information and intervene, and the fixed costs of market entry are too high for small firms. When uncertainty is too high, a firm cannot get finance at all (circular start-ups often face this). Bank credit is large relative to equity in Europe and Asia (slide 3: Germany, China, Norway), while the US is equity-heavy.","kt":"","src":"Bok s. 286 (10.1.3) · L11 slide 3 · Bok s. 291 (Figure 10.3)"},{"id":"SB400","l":"L11","t":"Bank business model","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A bank lends to a firm whose main factory sits on contaminated land. Compared with an otherwise identical clean firm, how should the risk-based approach affect the loan?","o":[["A higher deposit rate for the bank","Deposit rates are not set by one borrower's profile."],["No change, since ESG is not credit risk","Contamination is an economic sustainability criterion with large credit effects."],["Lower spread, because land is good collateral","Contaminated land is weaker collateral."],["Higher expected loss (PD and LGD) → higher spread","Clean-up and liability costs raise default risk and lower recoveries."]],"c":[3],"es":"ESG risks raise PD and LGD → higher risk premium.","ed":"The contracted loan rate exceeds the expected loan rate because some borrowers default. Including ESG factors improves default prediction and links pricing to sustainability (nudging: higher rates for ESG concerns).","kt":"Expected loss = probability of default (PD) × loss given default (LGD) × exposure; the risk premium must cover it.","src":"Bok s. 284 (10.1.1) · Bok s. 292 (10.4) · Bok s. 293 (Table 10.3)"},{"id":"SB401","l":"L11","t":"Bank risks","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: A bank with a small office footprint but large loans to oil and gas producers is still materially exposed to climate transition risk, through its borrowers' default risk and collateral values.","o":[["True","Correct. A bank's credit risk includes the risks its counterparties face; transition risk at borrowers becomes the bank's credit risk."],["False","Incorrect. A bank's credit risk includes the risks its counterparties face; transition risk at borrowers becomes the bank's credit risk."]],"c":[0],"es":"True: borrowers' transition risk becomes the bank's credit risk.","ed":"This is why EBA Pillar 3 requires disclosure of exposures to carbon-related sectors and why \"the bank's indirect material issues are its credits and investments\" (slide 14).","kt":"Financed emissions: emissions of the companies and projects a bank lends to or invests in (part of its scope 3).","src":"L11 slide 10 · L11 slide 14 · L11 slide 31"},{"id":"SB402","l":"L11","t":"Material issues in banking","f":"m","d":3,"p":"M","sc":"short","s":"Which real-world event matches SASB material issues for commercial banks?","o":[["A bank's office paper use - systemic risk management","Paper use is immaterial and not systemic risk."],["A bank branch's water consumption - core material issue","Not a material issue for banks."],["A cyber attack on customer data - access and affordability","This is data security."],["Wells Fargo opening millions of unauthorised customer accounts - business ethics / selling practices","Misconduct in sales practices."]],"c":[3],"es":"Financial crime and mis-selling = business ethics issues, highly material for banks.","ed":"Both scandals led to large fines, CEO departures and lasting reputational damage, showing why governance and ethics are often the most material ESG issues for banks. Also correct: Danske Bank's Estonian branch money-laundering scandal (about EUR 200bn of suspicious flows) - business ethics.","kt":"SASB commercial banks: data security, access and affordability, product design (ESG in credit), business ethics, systemic risk management.","src":"L11 slide 12"},{"id":"SB403","l":"L11","t":"Material issues","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"Deutsche Bank's materiality matrix (Lecture 11, slide 13) ranks anti-financial crime, data privacy and customer satisfaction highest, and climate change and human rights relatively low. How does slide 14 challenge this?","o":[["It shows climate change is irrelevant for banks because they have small office footprints.","The point is that financed impacts make climate highly relevant."],["Its biggest material issues are indirect: its credits and investments.","Slide 14: \"The bank's indirect material issues: credits and investments!\""],["It shows that data privacy is the only material issue for banks.","Data privacy is important but not the only issue."],["It argues that banks should not publish materiality matrices at all.","The slide refines what banks should consider material, not whether to report."]],"c":[1],"es":"Look through the bank to its loan book: financed emissions and human rights risks can be its largest material issues.","ed":"Matrices based on a bank's own operations and stakeholder perceptions can understate issues that arise through financing - climate risk in loan books, human rights in project finance. Handelsbanken explicitly lists \"the bank's indirect impact\" (responsible credits and investments) as one of six material topics. Regulators now require banks to disclose exposure to carbon-related sectors and physical risks (EBA Pillar 3), and the FT (slide 32) reports banks increased fossil fuel finance in 2024.","kt":"","src":"L11 slide 13-14 · Bok s. 289 (10.2.2) · L11 slide 31-32"},{"id":"SB404","l":"L11","t":"Banks and society","f":"m","d":3,"p":"L","sc":"short","s":"Cramer's study of an Indian bank branch expansion finds better household health years later. Through which mechanism does bank access improve health?","o":[["Bank branches reduce air pollution.","Not the mechanism."],["Savings, credit and jobs let households finance health care and absorb shocks.","Financial access smooths consumption and funds health investments."],["Banks provide medical treatment in their branches.","Banks provide finance, not treatment."],["Health improved only because of a parallel government programme.","The study exploits the branch expansion policy itself."]],"c":[1],"es":"Financial access → savings, credit, income → health investment.","ed":"This is the social side of banking's material issues (\"access and affordability\") and the rationale for microfinance and mic
