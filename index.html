-term targets with deferral address the weaknesses of current ESG pay."],["Rely only on the share price to judge progress because markets are efficient.","New risks may not be priced (AMH), and emissions are an externality."]],"c":[2],"es":"Long-term, audited, quantitative ESG pay with deferral and clawback, plus board oversight of assured reporting.","ed":"Agency theory says align incentives and reduce information asymmetry. Lecture 5 shows ESG pay often fails because targets are short-term, vague and opaque, and correlations with outcomes are weak. A robust design uses strategic, quantitative, long-term targets (cf. Starbucks' three-year modifier), deferral and clawback, combined with board monitoring (sustainability or audit committee) and audited reporting under mandatory standards (CSRD, Lecture 7). These measures make accountability credible and limit greenwashing. Also correct: Give a board sustainability committee (or the audit committee) responsibility for overseeing verified sustainability reporting.","kt":"","src":"L5 slide 9 · L5 slide 19 · L5 slide 36-37 · L5 slide 44 · L7 slide 20 · Bok s. 87 (3.3.2)"},{"id":"TR20","l":"L5","t":"Agency problems with debt","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A heavily indebted firm can make a positive-NPV investment in energy efficiency, but most of the gain would go to creditors by making their debt safer. Shareholders refuse to fund it. What is this?","o":[["Adverse selection before the loan contract","The problem arises after the debt exists, so it is moral hazard."],["Debt overhang, leading to underinvestment","With high debt, shareholders bear the cost but creditors get much of the benefit."],["Asset substitution, leading to excessive risk-taking","Asset substitution is choosing riskier projects, not skipping good ones."],["The Akerlof lemons problem in the used-car market","That is an adverse selection example, not this case."]],"c":[1],"es":"High debt makes shareholders skip positive-NPV projects = debt overhang.","ed":"The lecture's example: a project costs 10m and pays 15m (NPV 5m), but with 12m of debt the shareholders keep only 3m, so they may forgo it. Debt overhang and asset substitution are both moral hazard problems; banks and bond covenants try to limit them.","kt":"","src":"Opptak L5 ca. 22 min · Opptak L10 ca. 15 min"},{"id":"TR21","l":"L5","t":"Board monitoring","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A listed company's CEO also chairs the board. Investors worry the board cannot check whether supply chain abuses are being hidden. Which governance change addresses this most directly?","o":[["Separate the roles: appoint an independent board chair","CEO duality means the CEO oversees himself; separating roles strengthens monitoring."],["Pay the CEO a fixed salary regardless of results","A fixed salary raises the private cost of effort problem."],["Remove all independent directors to speed up decisions","Independence is what makes monitoring credible."],["Issue dual-class shares so the CEO gets more votes","That concentrates power further and weakens shareholder rights."]],"c":[0],"es":"Split CEO and chair roles to restore board oversight.","ed":"Ex-ante governance tools in the lecture: board monitoring (no CEO duality, independence, diversity, committees for audit, pay and nomination), compensation policy, shareholder rights (avoid dual-class shares), culture and transparent reporting. Ex-post tools are voice and exit.","kt":"CEO duality: the CEO is also chair of the board, so management effectively monitors itself.","src":"Opptak L5 ca. 31 min"},{"id":"TR22","l":"L5","t":"Shareholder governance tools","f":"m","d":3,"p":"M","sc":"none","s":"A large shareholder tells management it will sell its stake unless the firm cleans up its cocoa supply chain. Why can this threat work even before any shares are sold?","o":[["Exit gives the shareholder a seat on the audit committee","Exiting means leaving, not gaining board seats."],["A large sale would push the share price down","The lecture calls the threat of exit an effective disciplinary tool, especially for large holders."],["Shareholder votes in the US are always binding on managers","US shareholder proposals are non-binding, so voting alone may not force change."],["A sale would automatically remove the CEO from office","Selling shares does not fire anyone directly."]],"c":[1],"es":"Large exits depress prices, so the threat alone disciplines managers.","ed":"Voice (engagement, proposals, voting) and exit (selling, or threatening to) are the two broad shareholder tools. The lecture adds that in the US, even a proposal with over 50% support is non-binding, which makes engagement and credible exit threats more important.","kt":"","src":"Opptak L5 ca. 28 min"},{"id":"TR23","l":"L5","t":"ESG-linked executive pay","f":"m","d":3,"p":"H","sc":"short","s":"Lecture 5 contrasts vague ESG pay targets (e.g. \"drove a robust ESG programme\") with better designs. Which design best addresses the concerns raised?","o":[["A cash bonus for any increase in revenue during the year","Revenue is a financial metric, and annual cash adds short-termism."],["Removing all performance conditions from executive pay","That weakens incentives altogether."],["Broad qualitative goals that the board itself assesses each year","Self-evaluated, vague goals are exactly what critics warned about."],["Measurable, verified targets paid in multi-year equity","This counters vagueness, self-evaluation and short-termism."]],"c":[3],"es":"Good ESG pay: measurable, verified, long-term, equity-based.","ed":"Evidence in the lecture: most firms using ESG pay rely on self-evaluation and short-term bonuses. Starbucks moved its sustainability metrics from the annual cash bonus to a three-year modifier on equity awards. Note the link between ESG pay and ESG ratings is correlation, not proven causation.","kt":"","src":"Opptak L5 ca. 61 min · Opptak L5 ca. 65 min"},{"id":"TR24","l":"L5","t":"ESG-linked executive pay","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The study in Lecture 5 shows that linking executive pay to ESG metrics causes firms to obtain better ESG ratings.","o":[["True","Incorrect. It finds a weak positive correlation; firms with good ratings may simply be more likely to adopt ESG pay (reverse causality)."],["False","Correct. It finds a weak positive correlation; firms with good ratings may simply be more likely to adopt ESG pay (reverse causality)."]],"c":[1],"es":"False: correlation only; causality could run the other way.","ed":"Exam tip: distinguish association from cause. Here reverse causality is plausible. The same caution applies to many ESG-performance studies (e.g. doing well by doing good vs doing good by doing well).","kt":"","src":"Opptak L5 ca. 61 min"},{"id":"TR25","l":"L5","t":"Governance challenges by framework","f":"m","d":3,"p":"M","sc":"none","s":"Climate litigation against companies has risen sharply since the 1990s, suggesting firms do not internalise climate risk. Which agency-based reason does Lecture 5 give?","o":[["Creditors always force firms to over-invest in green projects","This is not one of the obstacles discussed."],["Shareholders are legally barred from suing over climate issues","Litigation is rising precisely because parties do sue."],["Climate risk is already fully priced, so no action is needed","The lecture questions this efficient-market view."],["Managers prefer a \"quiet life\" and avoid costly change","Exerting effort to change strategy has a private cost to managers."]],"c":[3],"es":"Managerial \"quiet life\" + lobbying + short-termism hinder internalisation.","ed":"Other obstacles: some shareholders only chase returns (brown stocks still do fine), short-termism, and belief in the efficient market hypothesis. The adaptive market hypothesis suggests new risks like carbon are priced only gradually.","kt":"","src":"Opptak L5 ca. 42 min"},{"id":"TR26","l":"L5","t":"Shareholder vs stakeholder conflicts","f":"m","d":3,"p":"M","sc":"short","s":"Evidence in Lecture 5 shows CEOs are less likely to divest units or lay off workers close to company headquarters. What does this illustrate?","o":[["Proof that layoffs near headquarters always destroy shareholder value","The point is that value-adding divestments may be skipped."],["A conflict between shareholder value and nearby employees' interests","Divesting may add value, but CEOs protect workers they know."],["That proximity has no effect on managerial decisions","The finding is that proximity does matter."],["A case of adverse selection in the labour market","This is about managers' choices, not hidden information before hiring."]],"c":[1],"es":"Managers may favour stakeholders they know, at shareholders' cost.","ed":"Under SF 1.0, managers face unclear accountability once social value enters the picture. Such \"local favouritism\" may be ethical or costly depending on the view taken, which is exactly the shareholder vs stakeholder debate.","kt":"","src":"Opptak L5 ca. 48 min"},{"id":"SB194","l":"L6","t":"Business model","f":"m","d":1,"p":"H","sc":"none","s":"According to Osterwalder and Pigneur (2010), quoted in Lecture 6, what does a business model describe?","o":[["The legal structure and ownership rights of a company.","Legal form and ownership are governance topics, not the business model."],["The list of material ESG issues identified with stakeholders.","That describes a materiality assessment."],["The company's plan for achieving desired outcomes over the next five years.","That is closer to the definition of strategy."],["The rationale of how an organisation creates, delivers and captures value.","This is the definition on slide 9."]],"c":[3],"es":"A business model describes how an organisation creates, delivers and captures value.","ed":"The business model is the representation of how a company creates and delivers value; Osterwalder and Pigneur add \"captures\" value. Their business model canvas has nine building blocks (key partners, key activities, key resources, value propositions, customer relationships, channels, customer segments, cost structure, revenue streams). Johnson et al. reduce a successful business model to three components: customer value proposition, profit formula, and key resources and processes.","kt":"","src":"L6 slide 9 · Bok s. 125 (5.2.2.1)"},{"id":"SB195","l":"L6","t":"Business model","f":"m","d":2,"p":"H","sc":"none","s":"According to Johnson et al. (2008), which is among the three components of a successful business model?","o":[["A profit formula covering the revenue model, cost structure, margins and inventory turnover","Second component on slide 9."],["A dual-class share structure to protect management","This is a governance feature, not a business model component."],["A credit rating of at least investment grade","Credit ratings are not a business model component."],["A materiality matrix approved by external stakeholders","Materiality is part of sustainability analysis, not one of the three components."]],"c":[0],"es":"Customer value proposition, profit formula, and key resources and processes.","ed":"Johnson, Christensen and Kagermann argue a successful business model has (1) a customer value proposition, (2) a profit formula (revenue model, cost structure, margins, inventory turnover) and (3) key resources and processes (people, products, facilities, equipment, brand, and processes to leverage them). The textbook notes such descriptions are profit-centric; Joyce and Paquin propose a triple-layered canvas adding environmental (life-cycle) and social (stakeholder) layers. Also correct: A customer value proposition that helps customers perform a \"job\" that alternatives do not address.","kt":"","src":"L6 slide 9 · Bok s. 125 (5.2.2.1) · Bok s. 126 (5.2.2.1)"},{"id":"SB196","l":"L6","t":"Business model","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Joyce and Paquin's triple-layered business model canvas extends the original canvas with a governance layer based on board oversight and a regulatory layer based on compliance requirements.","o":[["True","Incorrect. The two added layers are an environmental layer (life-cycle perspective) and a social layer (stakeholder perspective), not governance and regulatory layers."],["False","Correct. The two added layers are an environmental layer (life-cycle perspective) and a social layer (stakeholder perspective), not governance and regulatory layers."]],"c":[1],"es":"False: it adds environmental (life-cycle) and social (stakeholder) layers.","ed":"Standard business model descriptions focus on profit and ignore externalities. The triple-layered canvas makes environmental impacts across the product life cycle and social impacts on stakeholders part of business model design, consistent with the integrated value perspective (I = F + S + E).","kt":"","src":"Bok s. 126 (5.2.2.1)"},{"id":"SB197","l":"L6","t":"Competitive position","f":"m","d":2,"p":"H","sc":"none","s":"Lecture 6 and the textbook group the sources of competitive advantage into four broad categories. Which list is correct?","o":[["Financial capital, manufactured capital, natural capital, social capital","These are some of the six capitals of integrated reporting."],["Sales growth, margins, capital, cash flows","These are value drivers, which competitive advantages show up in."],["Cost leadership, differentiation, focus, diversification","Porter's generic strategies are cost leadership, differentiation and focus; this is a different framework."],["Resources, knowledge, human capital and culture, networks/access","These are the four groups on slide 12."]],"c":[3],"es":"Resources, knowledge, human capital/culture and networks/access.","ed":"(1) resources (natural resources, e.g. Rio Tinto's low-cost iron ore; data); (2) knowledge (technology and processes, e.g. Novozymes' enzymes); (3) human capital and culture (hard-to-imitate people management); (4) networks/access (regulation, switching costs, scale and network effects). Strategic assets that sustain an advantage are valuable, rare and hard to imitate (Lev). Competitive advantages show up in stronger value drivers.","kt":"","src":"L6 slide 12 · Bok s. 121 (5.2.1.1)"},{"id":"SB198","l":"L6","t":"Competitive position","f":"m","d":3,"p":"M","sc":"none","s":"The textbook explains that Novozymes grows twice as fast and at double the margin of ordinary chemicals companies by replacing chemicals with enzymes. Which source of competitive advantage does this illustrate?","o":[["Knowledge (R&D and technology)","Box 5.2 is titled \"Novozymes' competitive advantage from R&D\"."],["Networks and switching costs","The advantage comes from enzyme technology, not network effects."],["Regulatory protection of the market","No regulatory barrier is described."],["Natural resources","Rio Tinto's low-cost iron ore mines (Box 5.1) illustrate natural resources."]],"c":[0],"es":"Novozymes' edge comes from knowledge: R&D and enzyme technology.","ed":"Box 5.2 shows a knowledge-based advantage that is also a sustainability advantage: enzymes work at lower temperatures, cutting customers' energy costs and emissions. This illustrates Schramade's point that a competitive edge on a material sustainability issue should result in stronger value drivers (growth, margins). By contrast, Rio Tinto's advantage (Box 5.1) comes from high-grade iron ore and infrastructure - a resource advantage.","kt":"","src":"Bok s. 122 (Box 5.2) · Bok s. 122 (Box 5.1) · Bok s. 124 (5.2.1.6)"},{"id":"SB199","l":"L6","t":"Competitive position","f":"t","d":3,"p":"M","sc":"short","s":"True or false: Kodak invented an early digital camera in 1975 but kept prioritising its profitable film business; this illustrates the textbook's point that existing interests and cash flows can block business model innovation.","o":[["True","Correct. Chesbrough's barriers (locked-in investments, current cash flows) explain why Kodak did not cannibalise film."],["False","Incorrect. Chesbrough's barriers (locked-in investments, current cash flows) explain why Kodak did not cannibalise film."]],"c":[0],"es":"True: protecting current cash flows blocked adaptation.","ed":"The same logic applies to the sustainability transition: carmakers protecting combustion profits or oil firms protecting upstream margins. Investors should ask whether management can adapt the business model before it becomes stranded.","kt":"Business model innovation: changing how a firm creates, delivers and captures value, often requiring cannibalisation of existing profits.","src":"Bok s. 126 (5.2.2.2) · Bok s. 132 (5.2.4)"},{"id":"SB200","l":"L6","t":"Competitive position","f":"t","d":3,"p":"L","sc":"none","s":"True or false: According to evidence cited in the textbook (Chan, Karceski and Lakonishok, 2003), high sales growth tends to be much more persistent than high profit margins, because growth does not strain organisations.","o":[["True","Incorrect. The textbook says the opposite: high margins tend to be much more viable than high sales growth, because high growth strains organisations and markets have limits."],["False","Correct. The textbook says the opposite: high margins tend to be much more viable than high sales growth, because high growth strains organisations and markets have limits."]],"c":[1],"es":"False: high margins are more persistent than high growth.","ed":"A strong competitive position shows up in strong value drivers (growth, margins, return on investment). But growth alone is not enough: it strains the organisation and is limited by market size, so high margins tend to persist longer than high growth. This matters when forecasting value drivers in the ESG integration exercise (Appendix, Lectures 6 and 9).","kt":"","src":"Bok s. 124 (5.2.1.6)"},{"id":"SB201","l":"L6","t":"Intangibles","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A software company trades at 15 times book value. Its main assets are engineers, code and customer relationships. Why does this make material ESG issues like employee satisfaction relevant for valuation?","o":[["Most value lies in off-balance-sheet intangibles that ESG issues affect.","Human capital and relationships drive future cash flows but are not on the balance sheet."],["Because tangible assets are always overvalued.","The point is about where value comes from, not overvaluation."],["Because ESG ratings are included in book value.","ESG ratings are not part of book value."],["It is not relevant; only physical assets generate cash flows.","Intangibles are the main source of value for such firms."]],"c":[0],"es":"When value sits in intangibles, issues that affect people and relationships are material.","ed":"Intangibles rose from about 17% to 87% of S&P 500 value (1975-2015). Edmans finds employee satisfaction predicts returns, suggesting markets underprice such intangibles. This is why integrated reporting adds human and intellectual capital (Lecture 7).","kt":"Intangible resources: non-physical sources of value (human capital, know-how, brands, relationships); many are not recognised as accounting assets.","src":"L6 slide 20 · Bok s. 127 (Figure 5.3) · L6 slide 23"},{"id":"SB202","l":"L6","t":"Intangibles","f":"m","d":3,"p":"H","sc":"none","s":"Which statement correctly distinguishes intangible assets from intangible resources?","o":[["Intangible assets are on the balance sheet; resources like human capital usually are not.","Only intangibles meeting the accounting definition of an asset are capitalised."],["Intangible resources cannot affect a company's valuation because they are not reported in the accounts.","They can be reflected in valuations if investors trust their cash-generating ability."],["Intangible resources are a narrower concept than intangible assets, since only resources that are capitalised count.","It is the other way round: intangible assets are a subset of intangible resources."],["Goodwill is an accurate measure of the value of a firm's intangible resources.","Goodwill reflects the acquisition price over book value, which may overstate or understate real intangible value."]],"c":[0],"es":"Intangible assets are the subset of intangible resources that meet the asset definition and appear on the balance sheet.","ed":"An asset is a resource controlled by the enterprise as a result of past events from which future economic benefits are expected (IASB). Intangible assets meet this (control, estimable benefits); many intangible resources (human capital, culture, most R&D) do not and stay off the balance sheet. Goodwill is the price paid in an acquisition above book value; it reflects underlying intangible resources but is not a good measure of them, as the acquirer may have overpaid or underpaid.","kt":"","src":"L6 slide 21 · Bok s. 127 (5.2.3.1) · Bok s. 128 (5.2.3.1)"},{"id":"SB203","l":"L6","t":"Intangibles","f":"m","d":4,"p":"M","sc":"short","s":"A few platform firms (e.g. Alphabet, Meta) capture most profits in digital advertising. Which characteristics of intangibles (Haskel and Westlake) best explain such \"winner takes all\" outcomes?","o":[["Scalability and synergies between intangibles","Code and data scale at near-zero marginal cost and reinforce each other."],["Full recognition of intangibles on balance sheets","Most intangibles are not on balance sheets."],["Lack of spillovers to other firms","Intangibles often have spillovers."],["Low sunk costs and easy resale of intangibles","Intangibles are typically sunk and hard to resell."]],"c":[0],"es":"Scalability + synergies → winner-takes-all market structures.","ed":"The four characteristics are sunk costs, spillovers, scalability and synergies. Winner-takes-all dynamics raise social issues (inequality, market power, privacy), which can become material through regulation such as EU competition and data rules.","kt":"Scalability: an asset can be used many times at little extra cost; synergies: intangibles become more valuable in combination.","src":"L6 slide 21 · Bok s. 131 (5.2.3.3)"},{"id":"SB204","l":"L6","t":"Intangibles","f":"m","d":3,"p":"M","sc":"none","s":"According to Lev (2000), as summarised in the textbook, what are consequences of deficient disclosure of intangibles?","o":[["Systematic overvaluation of R&D-intensive firms.","Lev points to undervaluation (a lemons discount)."],["Improved usefulness of financial statements over time.","He notes a continuous deterioration in the usefulness of financial information."],["A high cost of capital and systematic undervaluation.","Lev lists these, plus insider gains in R&D-intensive firms and manipulation via intangibles."],["A lower cost of capital, because investors assume hidden intangibles are valuable.","Information asymmetry raises, not lowers, the cost of capital."]],"c":[2],"es":"Poor intangibles disclosure raises the cost of capital and causes undervaluation.","ed":"Lev lists excessively high cost of capital, systematic undervaluation, excessive insider trading gains in R&D-intensive firms, deteriorating usefulness of financial information and manipulation through intangibles. He proposed a value chain scorecard of non-financial indicators, which was not widely adopted but resembles the later integrated reporting recommendations (Lecture 7). Executives have few incentives to disclose, since information asymmetry helps them keep power.","kt":"","src":"Bok s. 131 (5.2.3.4) · Bok s. 132 (5.2.3.4)"},{"id":"SB205","l":"L6","t":"Intangibles","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Edmans (2012), cited in the textbook and shown in Lecture 6, finds that firms with higher employee satisfaction perform worse on the stock market, because satisfied employees are a costly luxury.","o":[["True","Incorrect. Edmans finds the opposite: firms with higher employee satisfaction perform better on the stock market (section 5.3.2, slide 23)."],["False","Correct. Edmans finds the opposite: firms with higher employee satisfaction perform better on the stock market (section 5.3.2, slide 23)."]],"c":[1],"es":"False: higher employee satisfaction is associated with better stock market performance.","ed":"Employee satisfaction is an intangible resource (human capital) that does not appear on the balance sheet but can be a source of competitive advantage. The stock market seems to underprice it, consistent with Lev's point that poorly disclosed intangibles are undervalued. It links to Lecture 4's evidence that workers accept lower pay at socially responsible firms.","kt":"","src":"L6 slide 23 · Bok s. 135 (5.3.2)"},{"id":"SB206","l":"L6","t":"Strategy","f":"m","d":3,"p":"H","sc":"short","s":"Between about 2009 and 2019, Danish DONG Energy (renamed Ørsted) sold its oil and gas business, phased out coal and became a leading offshore wind developer. In Hambrick and Fredrickson's terms, which strategy element changed most fundamentally?","o":[["Nothing: it kept the same arenas and economic logic","It changed its whole business portfolio."],["Arenas: where the company is active","It moved from fossil energy to offshore wind markets."],["Vehicles only: switching from acquisitions to organic growth","The main change was what it does, not how it grows."],["Staging only: the speed of existing projects","The change was far more than timing."]],"c":[1],"es":"Ørsted changed its arenas, and with them its economic logic.","ed":"Ørsted is a textbook \"business sustainability 3.0\" style shift: starting from a sustainability challenge and rebuilding the business model. Its 2023 US write-downs show the new strategy also carries risks (transition risk in green business models).","kt":"Strategy elements (Hambrick and Fredrickson): arenas (where), vehicles (how to get there), differentiators (how to win), staging (speed and sequence), economic logic (how returns are made).","src":"L6 slide 27 · Bok s. 132 (5.2.4)"},{"id":"SB207","l":"L6","t":"Strategy","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A car maker knows how to build electric cars but delays doing so, because they would cannibalise its high-margin spare parts business. According to Chesbrough (2010), as cited in the textbook, what does this illustrate?","o":[["Barriers to business model experimentation from existing interests.","The textbook uses exactly the car maker example."],["Adverse selection in the market for used cars, where buyers cannot observe quality.","The issue is internal resistance to new business models, not hidden information in trade."],["The circular economy rebound effect, where circular activities raise total production.","Rebound concerns increased production offsetting circular gains."],["A successful cost leadership strategy that requires no adaptation.","Failing to adapt may turn out to be a costly mistake."]],"c":[0],"es":"Existing interests, locked-in investments and current cash flows block business model innovation.","ed":"Firms invest heavily in exploring new ideas but often cannot innovate their business models, because experimentation conflicts with existing interests, locked-in investments and high cash flows from the existing business. Gillette's cheap-razor, expensive-blade model invited Dollar Shave Club's subscription model (Box 5.3); Kodak, Nokia and BlackBerry failed to adapt. The ability to adapt the business model can be crucial for survival as sustainability changes markets.","kt":"","src":"Bok s. 126 (5.2.2.2) · Bok s. 125 (Box 5.3) · Bok s. 132 (5.2.4)"},{"id":"SB208","l":"L6","t":"Value drivers","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Lecture 6 decomposes Oatly's return on equity (ROE) with the DuPont formula (net margin × asset turnover × leverage). ROE fell sharply from 2021 to 2022 even though asset turnover improved. What drove the decline?","o":[["Higher financial leverage alone","Leverage changed little; the margin was the main driver."],["Lower taxes","Taxes are not the explanation."],["A much more negative net profit margin","Losses grew relative to revenue, outweighing better asset use."],["A fall in asset turnover","Asset turnover improved."]],"c":[2],"es":"The margin collapse drove the ROE decline.","ed":"Oatly grew sales but at negative margins as competition intensified, illustrating that a sustainable value proposition does not guarantee strong value drivers. Note: slide 35 labels revenue/assets \"return on assets\"; in DuPont it is asset turnover.","kt":"DuPont analysis: ROE = net profit margin × asset turnover × financial leverage; it shows which value driver explains changes in returns.","src":"L6 slide 34-35"},{"id":"SB209","l":"L6","t":"Value drivers","f":"m","d":1,"p":"H","sc":"none","s":"Which set of value drivers does Lecture 6 use to assess a company's ability to sustainably generate free cash flows?","o":[["Interest rate, inflation, GDP growth and exchange rate","These are macro factors, not company value drivers."],["Sales growth, margins, return on capital, and cash flows","These are the value drivers on slides 32-34."],["ESG rating, carbon footprint, number of employees and market share","These may affect value drivers but are not the drivers themselves."],["Board size, number of shareholders, share price and dividend yield","These are not the value drivers used."]],"c":[1],"es":"Sales growth, margins, invested capital/return on capital and cost of capital, and cash flows.","ed":"The lecture goal is to assess a company's ability to sustainably generate free cash flows. The questions follow the textbook appendix: historical and realistic sales growth (volume vs price, long- vs short-term drivers), margins (gross, EBIT, EBITDA, net; cost structure and flexibility), invested capital, return on capital and cost of capital, debt, and conversion of profit into operating and free cash flow. Material ESG issues matter financially when they affect these drivers (Lecture 9 builds the DCF on them).","kt":"","src":"L6 slide 2 · L6 slide 32-34 · L9 slide 6"},{"id":"SB210","l":"L6","t":"Value drivers","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Free cash flow is operating cash flow after deducting the investment (capital expenditure) needed to maintain and grow the business, so a fast-growing company can have positive operating cash flow but negative free cash flow.","o":[["True","Correct. FCF = OCF minus capital investment; heavy growth investment can turn FCF negative even when OCF is positive, which is why the lecture asks about an inflection point to positive FCF."],["False","Incorrect. FCF = OCF minus capital investment; heavy growth investment can turn FCF negative even when OCF is positive, which is why the lecture asks about an inflection point to positive FCF."]],"c":[0],"es":"True: FCF = OCF minus investment, so heavy growth capex can make FCF negative.","ed":"Slide 33 asks to what extent profits convert into free cash flow, what explains the conversion rate, and whether a firm with negative FCF will reach an inflection point. OCF is cash generated by operations; FCF subtracts the capital expenditure (and working capital investment) required. The DCF model in Lecture 9 discounts free cash flows at the WACC.","kt":"","src":"L6 slide 33 · L9 slide 5"},{"id":"SB211","l":"L6","t":"Oatly case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Lecture 6 uses Oatly to discuss business models and competitive position, showing it losing market share as competition in oat milk intensified. Which conclusion fits the lecture's framework?","o":[["Because oat milk has lower environmental impact than dairy, Oatly's financial performance must be strong.","Positive impact does not automatically translate into strong value drivers."],["A sustainable value proposition is not enough: without a hard-to-imitate advantage, rivals can erode share and margins.","Strategic assets must be rare and hard to imitate; entry by competitors eroded Oatly's position."],["A company with positive impact cannot lose its competitive position.","The case shows that it can."],["Strong brand recognition guarantees a permanent competitive advantage regardless of competitors.","Brands help, but the case shows competition can still erode share."]],"c":[1],"es":"Positive impact needs a defensible competitive edge; value drivers reveal whether the business model creates value.","ed":"Oatly built a fast-growing brand on a sustainable value proposition, but entrants in the \"white-hot\" oat milk space eroded its market share, and its margins and ROE were negative. The case illustrates the textbook's points that a competitive edge must be valuable, rare and hard to imitate; that sustainability performance should be linked to value drivers; and that the most advanced sustainability approaches do not always win if they do not match economic reality. Also correct: Oatly's negative ROE shows the importance of analysing value drivers (margins, asset turnover, leverage) alongside sustainability.","kt":"","src":"L6 slide 5-18 · L6 slide 35-36 · L6 slide 75 · Bok s. 119 (5.1) · Bok s. 121 (5.2.1)"},{"id":"SB212","l":"L6","t":"Company purpose","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook, how does a company's purpose relate to maximising integrated value (IV)?","o":[["Purpose replaces the need to measure financial, social and environmental value.","IV still needs to be measured to operationalise purpose."],["Purpose is more fundamental; maximising IV is how it is put into practice.","The textbook says maximising IV is a good goal but less fundamental than purpose, which clarifies how IV should be maximised."],["Maximising IV is more fundamental, and purpose is just a marketing slogan derived from it.","The textbook says the reverse."],["Purpose and IV are unrelated concepts that should be managed by separate departments.","They are related: purpose clarifies how IV is to be maximised."]],"c":[1],"es":"Purpose is more fundamental; maximising IV operationalises it.","ed":"Lecture 6 asks what the company's purpose or raison d'être is, how it creates value for society and how it gets paid for that. The textbook adds that companies are often founded to meet an unmet need (Lever Bros wanted to popularise hygiene). Having a purpose brings clarity of vision, alignment of activities and strategy, and more motivated employees. The first LTVC guideline is to make purpose a key part of strategy.","kt":"","src":"L6 slide 41-43 · Bok s. 141 (5.5) · Bok s. 142 (5.5.1)"},{"id":"SB213","l":"L6","t":"Stakeholder analysis","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A wind farm developer in Norway analyses stakeholders. Sámi reindeer herders have high interest and, after the 2021 Fosen Supreme Court ruling that turbine licences violated their rights, also high power. How should they be treated in an interest-power matrix?","o":[["Manage closely: high interest and high power","Key players must be engaged early and closely."],["Monitor only: low interest and low power","They have both high interest and high power."],["Ignore them, since they are not shareholders","Stakeholder analysis covers all affected parties."],["Keep informed only, since interest is high but power is low","The ruling gave them high power."]],"c":[0],"es":"High interest + high power = key players to manage closely.","ed":"Fosen shows how a stakeholder group can move from \"low power\" to \"high power\" through courts, threatening a project's licence to operate. Stakeholder impact maps help spot such frictions early (Tables 5.2-5.3).","kt":"Interest-power matrix: classifies stakeholders by how much they care (interest) and can affect the project (power) to decide how to engage them.","src":"L6 slide 45 · L6 slide 46"},{"id":"SB214","l":"L6","t":"Stakeholder impact map","f":"m","d":4,"p":"H","sc":"none","s":"According to the textbook, what should an analyst pay special attention to when analysing a stakeholder impact map (e.g. Tables 5.2 and 5.3 for a pharmaceutical and a social media company)?","o":[["Only positive impacts, since negative impacts are already priced.","Negative impacts (e.g. high drug prices, privacy) often signal future risks."],["Only the shareholders' column, since the other stakeholders are irrelevant for valuation.","The map exists to look beyond shareholders."],["Frictions between stakeholders' goals and the company's impacts on them.","The textbook says these frictions can be a good indication of problems or opportunities ahead."],["The number of stakeholders, since more stakeholders always means more risk.","The content of goals and impacts matters, not the count."]],"c":[2],"es":"Look for frictions between stakeholders' goals and the company's impacts.","ed":"The stakeholder impact map lists, for each main stakeholder, the company's positive and negative impacts and the stakeholder's short- and long-term goals. For a pharmaceutical firm, patients' goal of affordable access conflicts with high prices that please shareholders; for a social media firm, users' privacy and addiction concerns and governments' worries about fake news create friction. Such frictions signal future risks (regulation, reputation) or opportunities and are a starting point for adjusting value drivers (Chapter 8).","kt":"","src":"L6 slide 46-48 · Bok s. 136 (Table 5.2) · Bok s. 137 (Table 5.3)"},{"id":"SB215","l":"L6","t":"Materiality","f":"m","d":3,"p":"H","sc":"none","s":"How does Lecture 6 contrast SASB's and GRI's definitions of materiality?","o":[["SASB is investor-focused; GRI also covers impact on society.","Slide 50 quotes both definitions and labels the combined view double materiality."],["SASB covers impacts on society, while GRI focuses only on information important to investors.","The definitions are reversed."],["SASB and GRI use identical definitions, so the choice does not matter.","The slide stresses the difference."],["Both define materiality purely as accounting materiality of balance sheet items, following IFRS.","Neither is restricted to accounting materiality."]],"c":[0],"es":"SASB = financial (investor) materiality; GRI = impact on economy, environment, society; together = double materiality.","ed":"SASB defines materiality as information reasonably likely to be important to investors in making investment decisions (financial materiality), assessed by an issue's potential impact on growth, cost or trust and its importance to stakeholders. GRI defines material topics as those with direct or indirect impact on an organisation's ability to create, preserve or erode economic, environmental and social value for itself, its stakeholders and society. Combining both directions is double materiality, as required by the CSRD (PwC guest lecture).","kt":"","src":"L6 slide 50-51 · L1 slide 36 · PwC s. 29"},{"id":"SB216","l":"L6","t":"Materiality","f":"m","d":3,"p":"H","sc":"none","s":"What do Khan, Serafeim and Yoon (2016) find about sustainability performance and stock returns?","o":[["Firms doing well on immaterial issues outperform most, because markets reward breadth.","Doing well on immaterial issues is associated with underperformance."],["Strong performance on material issues predicts stock outperformance; immaterial does not.","This is the finding cited on slide 52 and in section 5.2.3.2."],["Sustainability performance has no relation at all to stock returns once industry is controlled for.","Performance on material issues predicts outperformance."],["All sustainability investments, material or not, lead to equal outperformance.","The distinction between material and immaterial issues is the key result."]],"c":[1],"es":"Material sustainability performance predicts outperformance; immaterial focus does not.","ed":"The finding is that what matters is materiality: firms investing in material ESG issues outperform peers in stock price, sales growth and margin growth (as Folketrygdfondet also quotes), whereas firms doing well on immaterial issues tend to underperform. The textbook adds that greenwashing does not pay off in the long run. Anglo American scored well on many immaterial issues but failed on its most material ones (local stakeholder and environmental management), and VW failed on emissions.","kt":"","src":"L6 slide 52 · Bok s. 129 (5.2.3.2) · Bok s. 130 (Box 5.4) · Folketrygdfondet s. 15"},{"id":"SB217","l":"L6","t":"Materiality","f":"m","d":3,"p":"M","sc":"none","s":"The textbook distinguishes accounting, market and business materiality. Which statement is correct?","o":[["Accounting materiality applies to intangible resources that are not assets.","It applies only to assets, which is why it is too narrow."],["Business materiality is identical to the SASB definition of financial materiality.","The textbook introduces it as its own broader concept beyond accounting."],["Market materiality refers to anything that significantly moves the company's stock price, including noise.","Definition in section 5.2.3.2."],["The three types always coincide at the same moment in time.","They may or may not overlap and can follow each other over time."]],"c":[2],"es":"Accounting = importance of amounts in accounts (assets only); market = moves the stock price; business = affects the business model and future cash generation.","ed":"Accounting materiality is too narrow because it only covers assets. Market materiality covers anything that significantly moves the share price, including noise. Business materiality covers anything that significantly affects the ability to operate the business model and generate cash. They can overlap and move in sequence: a factory bottleneck becomes a business issue, then a market issue, then an accounting issue; or a demand surge moves the price before orders and profits. Also correct: Business materiality refers to anything that significantly affects the ability to operate the business model and generate future cash.","kt":"","src":"Bok s. 128 (5.2.3.2) · Bok s. 129 (Figure 5.5)"},{"id":"SB218","l":"L6","t":"Materiality","f":"t","d":3,"p":"H","sc":"none","s":"True or false: According to the textbook, materiality differs not only between industries but also within them; for example, an iron ore miner in Australia is less exposed to labour and local stakeholder issues than a gold miner in Africa.","o":[["True","Correct. Section 5.3 gives exactly this example: materiality depends on industry, business model and local conditions."],["False","Incorrect. Section 5.3 gives exactly this example: materiality depends on industry, business model and local conditions."]],"c":[0],"es":"True: materiality varies by industry, business model and location.","ed":"Many issues are potentially material, but few are actually material for a specific company. Mining and pharmaceuticals face very different issues, and even within mining, commodity (gold vs iron ore) and location (Africa vs Australia) change the picture. Differences can be existential, e.g. losing the licence to operate. SASB's materiality map (slide 51) operationalises this by industry.","kt":"","src":"Bok s. 134 (5.3) · L6 slide 51"},{"id":"SB219","l":"L6","t":"Materiality matrix","f":"m","d":2,"p":"M","sc":"none","s":"What do the two axes of a typical corporate materiality matrix (e.g. Novozymes or Unilever) represent?","o":[["Importance to stakeholders versus impact on the company","Novozymes' matrix plots importance to stakeholders against impact on Novozymes."],["Share price versus book value per share, compared with sector peers","These are valuation metrics."],["Probability of default versus loss given default of the company's loans","These are credit risk parameters."],["Revenue growth versus profit margin of each business unit","These are value drivers, not materiality dimensions."]],"c":[0],"es":"Stakeholder importance on one axis, impact on the company on the other.","ed":"Companies identify material issues through internal research and stakeholder dialogue and often present them in a matrix: importance to stakeholders against impact on the business. Issues in the high-high corner get targets or flagship initiatives. Matrices differ greatly between companies and industries (compare Novozymes, Deutsche Bank in Lecture 11, AXA and Swiss Re in Lecture 12) and are sometimes criticised for being self-selected; the textbook warns that firms and analysts often fail to prioritise.","kt":"","src":"L6 slide 55 · Bok s. 130 (Figure 5.6) · Bok s. 136 (5.3.5)"},{"id":"SB220","l":"L6","t":"Materiality","f":"m","d":4,"p":"M","sc":"none","s":"Lecture 6 refers to Rogers and Serafeim's \"Pathways to Materiality\". What is the central idea?","o":[["Materiality is determined solely by accounting standards and does not change.","The point is that it changes as society, regulation and technology evolve."],["Only governance issues can become material; environmental and social issues cannot.","Environmental and social issues are central to the pathways."],["Once an issue is classified as immaterial for an industry, it can never become material for that industry.","The paper argues the opposite."],["Materiality is dynamic: issues can become financially material over time.","The paper describes how sustainability issues become financially material to corporations and their investors."]],"c":[3],"es":"Materiality is dynamic: issues migrate from immaterial to financially material as pressure builds.","ed":"Rogers and Serafeim describe pathways through which sustainability issues become financially material: stakeholder expectations, legal and regulatory changes, innovation by competitors and changing industry norms. This is the same dynamic as internalisation of externalities (Lecture 3) and \"dynamic materiality\" in the Fondsfinans lecture. Analysts therefore need to anticipate tomorrow's material issues, not just today's.","kt":"","src":"L6 slide 53 · Fondsfinans s. 19 · L3 slide 17"},{"id":"SB221","l":"L6","t":"Materiality","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: An analyst uses the SDGs to screen a fertiliser producer such as Yara for material issues. Which link is most relevant?","o":[["SDG 16 (peace and justice): the only relevant SDG.","Not the most material area for this business."],["SDG 4 (quality education): the core material issue for a fertiliser maker.","Education is not a core material issue for this business."],["SDG 14 (life below water) is irrelevant because fertiliser runoff never reaches water.","Runoff can cause water pollution."],["SDG 2 (zero hunger): products raise crop yields - a positive exposure.","Fertilisers support food production."]],"c":[3],"es":"Map positive (food) and negative (emissions, runoff) SDG exposures to find material issues.","ed":"The same company can be part of the solution and part of the problem. Material issues then feed into value drivers (carbon costs, green ammonia investments) and impact analysis (Lecture 6, slide 72). Also correct: SDG 13 (climate action): ammonia production is energy- and emission-intensive - a negative exposure.","kt":"SDG exposure: whether a company's products and operations help (positive) or hinder (negative) progress on specific SDGs.","src":"L6 slide 54 · L6 slide 72"},{"id":"SB222","l":"L6","t":"Business sustainability typology","f":"m","d":3,"p":"M","sc":"none","s":"In Dyllick and Muff's business sustainability typology (Table 5.1), what distinguishes business sustainability 3.0?","o":[["It considers three-dimensional concerns to deliver a triple bottom line, still inside-out.","That is business sustainability 2.0."],["It focuses on economic concerns and shareholder value from an inside-out perspective.","That is business as usual."],["It maximises refined shareholder value while avoiding the worst harms.","That is business sustainability 1.0."],["It starts from sustainability challenges and takes an outside-in view.","BS 3.0 adds the third shift: changing the perspective from inside-out to outside-in."]],"c":[3],"es":"BS 3.0: start with sustainability challenges, create common good value, outside-in.","ed":"Summary of Table 5.1: business as usual - economic concerns, shareholder value, inside-out; BS 1.0 - three-dimensional concerns, refined shareholder value, inside-out; BS 2.0 - three-dimensional concerns, triple bottom line, inside-out; BS 3.0 - starting with sustainability challenges, value for the common good, outside-in. The three shifts: broadening the concern, expanding the value created, changing the perspective. It mirrors the SF 1.0-3.0 typology. Few companies have reached BS 3.0; utilities SSE and EDP are cited as outside-in examples.","kt":"","src":"Bok s. 118 (5.1) · Bok s. 119 (Table 5.1)"},{"id":"SB223","l":"L6","t":"Transformational change","f":"t","d":2,"p":"L","sc":"none","s":"True or false: The textbook suggests that, to avoid groupthink, boards should strive for diversity in members' backgrounds and skill sets, which may help shift the organisation from an inside-out to an outside-in perspective.","o":[["True","Correct. Section 5.1 recommends board diversity to avoid groupthink and help overturn the inside-out perspective."],["False","Incorrect. Section 5.1 recommends board diversity to avoid groupthink and help overturn the inside-out perspective."]],"c":[0],"es":"True: diverse boards reduce groupthink and support an outside-in view.","ed":"Groupthink (Janis) is poor group decision-making when members value unanimity over realistic appraisal of alternatives. Making the transition to business sustainability 3.0 depends on culture and board dialogue; diversity and asking the right questions can help. This links to Lecture 5's good governance practice of board diversity.","kt":"","src":"Bok s. 118 (5.1) · Bok s. 119 (5.1) · L5 slide 19"},{"id":"SB224","l":"L6","t":"Material ESG issues","f":"m","d":2,"p":"M","sc":"none","s":"The textbook classifies sustainability issues as environmental, social, governance and \"other\". Which example is correctly classified?","o":[["Supply chain disruptions and innovation - other","Section 5.3.4 places innovation and supply chains under \"other\"."],["Greenhouse gas emissions and water use - governance","These are environmental issues."],["Ownership structure and voting rules - environmental","These are governance elements."],["Health and safety of employees - environmental","Health and safety is a social (human capital) issue."]],"c":[0],"es":"E: climate, emissions, water, land; S: human capital, safety, local stakeholders, supply chain social issues; G: ownership, pay, voting, ethics, board; other: innovation, supply chains.","ed":"Environmental issues include climate strategy, emissions, water, land use, raw materials and product stewardship (VW, BP as failures; Novozymes, Tesla as opportunities). Social issues include human capital, health and safety, culture, local stakeholders, supply chain, brands and trust (Anglo American, Takata). Governance covers ownership, compensation, voting, ethics and the board; strong governance relates to higher valuations and can drive strong S and E. \"Other\" covers innovation and supply chains (Nippon Shokubai's plant explosion hit nappy producers). Also correct: Management of local stakeholders (e.g. mining communities) - social.","kt":"","src":"Bok s. 134 (5.3) · Bok s. 135 (5.3.2) · Bok s. 135 (5.3.3) · Bok s. 135 (5.3.4) · L6 slide 56-58"},{"id":"SB225","l":"L6","t":"Material ESG issues","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook argues that corporate governance is unrelated to social and environmental performance, so strong G cannot help drive strong S and E.","o":[["True","Incorrect. Section 5.3.3 cites Shrivastava and Addas (2014): high-quality governance can drive high social and environmental performance; stronger governance is also linked to higher valuations."],["False","Correct. Section 5.3.3 cites Shrivastava and Addas (2014): high-quality governance can drive high social and environmental performance; stronger governance is also linked to higher valuations."]],"c":[1],"es":"False: strong governance tends to drive strong S and E.","ed":"Corporate governance ensures a company is run decently and shareholders earn a return (Shleifer and Vishny). Stronger governance is associated with higher valuations and lower cost of capital (Gompers, Ishii and Metrick) and can drive better S and E performance. In emerging markets governance tends to be weaker, partly reflecting weaker country governance.","kt":"","src":"Bok s. 135 (5.3.3)"},{"id":"SB226","l":"L6","t":"Impact","f":"m","d":3,"p":"M","sc":"none","s":"According to Lecture 6 (and the textbook appendix), which question is part of assessing a company's impact?","o":[["What was the company's share price return over the last quarter relative to the index?","Short-term returns are not an impact measure."],["Which SDGs does the company help achieve, and which does it harm?","Slide 72 lists this question."],["How many sell-side analysts cover the stock and what are their price targets?","Analyst coverage is not about impact."],["What is the company's dividend payout ratio compared with its peers?","Payout policy is not an impact measure."]],"c":[1],"es":"Impact analysis looks at positive and negative SDG exposures, impact criteria and measurability of impact.","ed":"Summary of slide 72: which SDGs the company helps achieve and which negative SDG exposures it has; how its impact scores on the impact criteria; to what extent impact can be measured, whether it is reported, and how reporting could improve. Impact is distinct from materiality: materiality asks what affects the firm (and its stakeholders), impact asks how the firm changes the world. Lecture 8 and 9 link this to impact investing (GIIN criteria).","kt":"","src":"L6 slide 68-72"},{"id":"SB227","l":"L6","t":"Circular business models","f":"m","d":3,"p":"M","sc":"none","s":"In the \"value hill\" of a circular economy (Figure 5.8), what is the aim of circular strategies?","o":[["Eliminate the use phase entirely by selling disposable products.","Circular design prolongs the use phase."],["Move products down the hill as fast as possible to free capacity for new production.","That is the linear take-make-use-waste logic."],["Keep products near the top of the value hill for as long as possible.","Circular strategies retain value through maintenance, reuse, refurbishment, remanufacturing and recycling."],["Maximise extraction of virgin raw materials at the start of the hill.","Circular models reduce reliance on virgin materials."]],"c":[2],"es":"Circular models retain value at the top of the hill (use phase) and descend slowly via repair, reuse, refurbish, remanufacture, recycle.","ed":"In a linear economy value is added uphill (extraction, manufacturing, assembly, retail) and destroyed after use. A circular economy is restorative by design: pre-use strategies focus on circular design (longevity, modularity - Fairphone); in-use strategies optimise use, e.g. product-service systems (leasing, pay-per-use - Bundles' pay-per-wash); post-use strategies feed products and materials back (reuse, refurbish, remanufacture, recycle). Challenges: keeping control over resources and preserving residual value.","kt":"","src":"Bok s. 137 (5.4) · Bok s. 138 (Figure 5.8) · Bok s. 139 (Box 5.6) · L6 slide 39"},{"id":"SB228","l":"L6","t":"Circular business models","f":"t","d":4,"p":"L","sc":"none","s":"True or false: Zink and Geyer (2017) argue that circular economy activities always reduce total primary production, because lower per-unit impacts can never lead to more production overall.","o":[["True","Incorrect. They argue the opposite: circular activities can increase overall production, partly or fully offsetting their benefits - the \"circular economy rebound\"."],["False","Correct. They argue the opposite: circular activities can increase overall production, partly or fully offsetting their benefits - the \"circular economy rebound\"."]],"c":[1],"es":"False: circular economy rebound can offset the benefits.","ed":"By analogy with the energy-efficiency rebound, circular activities with lower per-unit impacts can lower prices and raise total production and consumption, reducing or eliminating their environmental benefit. This is another example of the fallacy of composition: micro-level improvements need not add up at the macro level.","kt":"","src":"Bok s. 140 (5.4) · Bok s. 54 (2.3.2)"},{"id":"SB229","l":"L6","t":"Long-term value creation","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"In the textbook's example, a mining company's $2bn desalination plant looks value-destroying in a \"primitive\" NPV analysis, but strongly value-creating in the correct analysis. What does the correct analysis do differently?","o":[["Adds the value of positive publicity only.","The key is the protected mine cash flows, not publicity."],["Ignores the plant's investment cost.","The cost is included in both analyses."],["Uses a zero discount rate because the plant is green.","The discount rate is not the difference."],["Compares cash flows with and without the plant, incl. the risk of losing the licence.","The plant protects the mine's cash flows; the right counterfactual changes the result."]],"c":[3],"es":"Correct NPV compares with vs without the plant, including licence risk.","ed":"Even if losing the licence is uncertain, the plant pays off above a fairly low probability of losing it. Benefits like better stakeholder relations and lower cost of capital are not even counted, so the case for the plant is stronger still.","kt":"Counterfactual (with-and-without) analysis: valuing a project by comparing the firm's cash flows with and without it.","src":"Bok s. 144 (Table 5.4) · Bok s. 145 (Table 5.6)"},{"id":"SB230","l":"L6","t":"Long-term value creation","f":"m","d":4,"p":"M","sc":"none","s":"The textbook describes a consumer goods board that splits proposals into \"sustainability projects\" (accepted even with negative NPV) and \"other projects\". How does the textbook judge this?","o":[["It shows sustainability should be left entirely to the CSR department.","The textbook calls for integrating sustainability in all functional areas."],["It is a form of greenwashing, because sustainability projects always have positive NPV.","Some sustainability projects have negative standalone NPV; the issue is lack of integration."],["It is best practice, since sustainability projects should never be subject to financial analysis.","The textbook argues for valuing sustainability effects (e.g. the desalination example)."],["It prioritises sustainability but is not integration: the value of the efforts stays unknown.","The textbook says this is prioritisation, not integration, and middle management does not change its approach."]],"c":[3],"es":"Prioritisation without valuation is not integration; integrate sustainability effects into NPV analysis.","ed":"True integration estimates the value of sustainability efforts (e.g. saved cash flows from a protected licence to operate, scenario probabilities, lower cost of capital) rather than putting them in a separate bucket. That requires middle management to change its approach - a multi-year change process. The LTVC guidelines ask firms to integrate sustainability and externalities into all functional areas, including investment decisions and reporting.","kt":"","src":"Bok s. 143 (5.5.2.1) · Bok s. 144 (5.5.2.1) · Bok s. 142 (5.5.2)"},{"id":"SB231","l":"L6","t":"Long-term value creation","f":"m","d":3,"p":"H","sc":"none","s":"Which is among the textbook's guidelines for a company pursuing long-term value creation (LTVC)?","o":[["Focus communication on shareholders only.","Guideline 3 says communicate long-term goals with all stakeholders."],["Keep sustainability separate from investment decisions to avoid complexity.","Guideline 2 says integrate sustainability in all functional areas, including investment decisions."],["Avoid investing in intangibles because they are not on the balance sheet.","Guideline 5 says build and maintain key long-term intangibles."],["Make the company's purpose a key part of corporate strategy.","This is guideline 1 in section 5.5.2."]],"c":[3],"es":"Purpose in strategy; integrate sustainability; communicate and balance goals; deliver and adapt; build intangibles; long-term measurement; long-term incentives.","ed":"Summary of the seven LTVC guidelines: (1) make purpose key to strategy; (2) integrate sustainability and externalities in all functional areas, including investment decisions and reporting; (3) communicate long-term goals with all stakeholders and balance them (KPN manages and reports KPIs for shareholders, customers, employees, society and environment); (4) deliver what you promise and adapt; (5) build and maintain key intangibles; (6) focus performance measurement on the long term and stop quarterly guidance; (7) base incentives on long-term objectives. Also correct: Base incentives on long-term objectives and get rid of short-term variable pay.","kt":"","src":"Bok s. 142 (5.5.2) · Bok s. 143 (5.5.2) · Bok s. 142 (Box 5.8) · L6 slide 73-76"},{"id":"SB232","l":"L6","t":"Long-term value creation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In the KPN example (Box 5.8), cutting marketing costs and network investments would raise short-run return on invested capital, but would soon reduce market share and margins, so restoring them would cost more than the original savings.","o":[["True","Correct. Box 5.8 explains this trade-off and why KPN instead manages and reports KPIs for five stakeholder goals."],["False","Incorrect. Box 5.8 explains this trade-off and why KPN instead manages and reports KPIs for five stakeholder goals."]],"c":[0],"es":"True: short-run ROIC gains from cuts would destroy long-term value.","ed":"Short-term metrics can be improved by under-investing in intangibles such as customer relationships and networks, but this erodes the competitive position. KPN therefore manages five goals (shareholders, customers, employees, society, environment) with KPIs reported quarterly; the net promoter score proved especially powerful. Equity analysts were slow to adapt, illustrating the short-termism problem from Lecture 5.","kt":"","src":"Bok s. 142 (Box 5.8) · Bok s. 143 (Figure 5.9)"},{"id":"SB233","l":"L6","t":"CCBJH materiality case","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Lecture 6 presents Coca-Cola Bottlers Japan Holdings (CCBJH), which describes Creating Shared Value (CSV) as the foundation of its sustainability strategy and continues to review its material issues identified in 2023. Which concept best matches this approach?","o":[["A one-time materiality assessment that never needs updating.","The company explicitly keeps reviewing its issues."],["Accounting materiality limited to items recognised on the balance sheet.","CSV and social value go beyond balance sheet items."],["Dynamic materiality: reassessing material issues as conditions change.","CCBJH reviews relevance and monitors new issues as conditions change."],["Exclusionary screening of sin stocks such as alcohol and tobacco producers.","This is an investor strategy, not a company materiality process."]],"c":[2],"es":"CCBJH treats materiality as dynamic, reviewing issues as conditions change.","ed":"Creating Shared Value (Porter and Kramer) aims to create economic value through business growth while delivering social value by addressing societal issues - close to the textbook's integrated value idea. Reviewing material issues regularly reflects that materiality changes over time (pathways to materiality, double and dynamic materiality). For a beverage bottler, issues such as water, packaging and plastics, and health are typical candidates.","kt":"","src":"L6 slide 62-67 · L6 slide 53 · Bok s. 118 (5.1)"},{"id":"SB234","l":"L6","t":"ESG integration in valuation","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: An analyst finds that a beverage company's most material issue is water scarcity at bottling plants, on which it performs poorly compared with peers. Following the ESG integration approach of Lectures 6 and 9, what is the best next step?","o":[["Estimate how water risk affects value drivers and reflect it in the DCF.","The materiality table asks how the issue affects the value drivers, which then feed the valuation."],["Exclude the company immediately because all water-intensive firms are sin stocks.","Exclusion is a different strategy; the question is how to integrate the issue into valuation."],["Ignore the issue because water is a free natural resource.","Unpriced resources are exactly the externalities that may be internalised."],["Subtract one notch from the company's ESG score and leave the valuation unchanged.","Integration requires translating material issues into value drivers, not only scores."]],"c":[0],"es":"Translate the material issue into value drivers and reflect it in the valuation (DCF, scenarios).","ed":"The appendix workflow goes from business model and competitive position, through value drivers, to sustainability analysis (purpose, stakeholders, externalities, materiality) and back to forecasts and valuation. For each material ESG factor: how the company performs, whether it gives a competitive (dis)advantage, and how it might affect value drivers. Water stress could reduce volumes, raise costs, require capex (cf. the desalination plant) or threaten the licence to operate, which can be modelled through cash flows, scenarios and possibly the cost of capital (Lecture 9).","kt":"","src":"L6 slide 59-61 · L9 slide 7-10 · Bok s. 144 (5.5.2.1) · Bok s. 247 (Appendix)"},{"id":"SB235","l":"L6","t":"Competitive position","f":"m","d":2,"p":"L","sc":"none","s":"Which example best illustrates \"networks/access\" as a source of competitive advantage in the textbook?","o":[["A social media platform that becomes more valuable as more users join.","Network effects arising from scale are given as an example (LinkedIn, Facebook)."],["An enzyme producer whose superior R&D lets it replace chemical processes.","This is a knowledge advantage (Novozymes)."],["A firm whose distinctive culture helps it attract, retain and manage its workforce.","This is human capital and culture."],["A mining company with the world's lowest-cost iron ore deposits.","This is a natural resource advantage (Rio Tinto)."]],"c":[0],"es":"Network effects, switching costs, regulation and supplier networks provide access-based advantages.","ed":"Access-based advantages arise when market access is restricted by regulation (sometimes rent seeking by elites), limited awareness in small specialised markets, sticky customers with high switching costs, network effects that grow with scale, or specialised supplier networks. The textbook notes data-intensive firms like Alphabet and Facebook have also raised concerns over privacy and market power.","kt":"","src":"Bok s. 123 (5.2.1.5) · Bok s. 124 (5.2.1.5) · L6 slide 12"},{"id":"TR27","l":"L6","t":"Free cash flow","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: After repeated extreme weather disrupts deliveries, a retailer decides to hold much larger safety stocks. Through which free cash flow component does this mainly lower firm value?","o":[["Higher revenue from green consumers","The change is about stockholding, not demand."],["Lower depreciation of buildings","Depreciation is unrelated to safety stocks."],["A lower corporate tax rate on profits","Holding inventory does not change the tax rate."],["Higher net working capital","An increase in inventory raises net working capital, reducing free cash flow."]],"c":[3],"es":"More inventory → higher NWC → lower FCF.","ed":"The lecture maps sustainability onto FCF = revenue × margin × (1 − tax) − capex − ΔNWC + depreciation: boycotts hit revenue, cleaner technology raises costs and capex, carbon taxes hit the tax line, climate shocks raise inventory buffers, and physical damage speeds up depreciation.","kt":"","src":"Opptak L6 ca. 1 min · Opptak L6 ca. 3 min"},{"id":"TR28","l":"L6","t":"Competitive strategy","f":"m","d":3,"p":"H","sc":"extended_course_case","s":"Oatly grew with a differentiation focus strategy in oat drinks. Then large beverage firms (e.g. Quaker, Planet Oat) entered with lower costs. How did this change Oatly's position according to Lecture 6?","o":[["Nothing changed, because its technology could not be copied","Rivals obtained oat-milk technology and entered."],["It became a cost leader in the whole beverage market overnight","Oatly stayed in a niche and was the higher-cost player."],["It could raise prices further, since entry proved demand was strong","Cheaper rivals made price increases harder, not easier."],["It had to focus more on cutting its costs","Oatly's 2024-25 reports stress aggressive cost management."]],"c":[3],"es":"Entry by large, cheaper rivals forced Oatly to cut costs.","ed":"A first-mover technology edge eroded as big firms with \"deep pockets\" copied it. Sustainability can create a value proposition, but value capture still depends on the profit formula: margins, cost structure and competition.","kt":"","src":"Opptak L6 ca. 16 min · Opptak L6 ca. 17 min"},{"id":"TR29","l":"L6","t":"Intangibles","f":"m","d":2,"p":"M","sc":"none","s":"An acquirer pays far more than the book value of a target known for its brand, skilled staff and strong sustainability reputation. What does the course call the excess, and what does it capture?","o":[["A stranded asset, which captures lost value from new rules","Stranded assets are value losses, not acquisition premiums."],["Working capital, which captures receivables and inventory","Working capital is short-term operating items."],["Depreciation, which captures wear on physical assets","Depreciation relates to tangible assets over time."],["Goodwill, reflecting intangibles like brand","Goodwill is the premium over book value paid in M&A."]],"c":[3],"es":"Premium over book value in M&A = goodwill (intangibles).","ed":"Intangibles share four economic features: sunk costs (a failed project cannot be resold like a machine), spillovers, scalability and synergies. They are hard to value, which is one reason sustainability assets can be over- or under-priced in deals.","kt":"","src":"Opptak L6 ca. 22 min"},{"id":"TR30","l":"L6","t":"Intangibles","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A firm spends heavily on a new low-carbon process that fails. Unlike a failed factory, it cannot sell anything to recover part of the cost. Which characteristic of intangibles does this show?","o":[["Synergies","Synergies mean intangibles reinforce each other."],["Scalability","Scalability means cheap replication, e.g. software."],["Spillovers","Spillovers mean others benefit from your intangible."],["Sunk costs","Spending on intangibles is usually unrecoverable if the project fails."]],"c":[3],"es":"Unrecoverable spending on failed intangibles = sunk cost.","ed":"This raises the risk of green innovation and links to Lecture 3: with spillovers to rivals and sunk costs if it fails, private incentives to innovate are weak, which supports subsidies or patient capital.","kt":"","src":"Opptak L6 ca. 23 min"},{"id":"SB236","l":"L7","t":"Limits of financial reporting","f":"m","d":2,"p":"H","sc":"none","s":"According to the textbook, which is a limitation of traditional financial reporting?","o":[["It lacks any enforcement mechanism or auditing standards.","Financial reporting has institutional legitimacy precisely because of auditing standards and enforcement."],["It overstates the usefulness of R&D by capitalising all of it.","R&D is typically expensed immediately, distorting the matching of costs and revenues."],["It reports too much information on non-financial performance.","The criticism is the opposite: too little non-financial information."],["It is backward looking, while investors are forward looking.","Section 6.1.2 contrasts backward-looking reports with forward-looking investors."]],"c":[3],"es":"Reporting is backward looking, focuses on tangible and financial assets, and omits key intangibles and non-financial information.","ed":"Financial reporting has institutional legitimacy (standards, enforcement, internal controls, IT), but it faces problems: different user needs, backward-looking information, focus on physical and financial assets rather than strategic intangibles, inconsistencies, mixed mandatory and voluntary elements, complexity and length. Eccles and Saltzman add time lags and little information on risks; Gray argues traditional accounting even encourages unsustainable organisations. Lev and Zarowin show the usefulness of earnings, cash flows and book values deteriorated as R&D is expensed while benefits come later. Also correct: It focuses on physical and financial assets and largely omits intangibles.","kt":"","src":"Bok s. 151 (6.1.1) · Bok s. 152 (6.1.2)"},{"id":"SB237","l":"L7","t":"Limits of financial reporting","f":"m","d":3,"p":"M","sc":"none","s":"Why, according to Lev and Zarowin (1999), has the usefulness of reported earnings, cash flows and book values deteriorated?","o":[["Companies started capitalising all intangible investments, inflating book values.","The problem is that intangibles are mostly not capitalised."],["R&D and restructuring are expensed at once, but benefits come later.","The matching of costs with revenues is distorted, especially for intangibles."],["Auditors stopped verifying earnings figures of R&D-intensive companies in the late 20th century.","The explanation is about accounting treatment, not the absence of audit."],["Stock markets became so efficient that accounting information is no longer needed by investors.","The argument is that accounting fails to reflect value, not that investors no longer need information."]],"c":[1],"es":"Expensing intangible investments while benefits arrive later breaks the matching principle.","ed":"Lev and Zarowin argue that accounting fails most seriously for intangibles, mainly because of mismatching costs and revenues. Large investments that drive change (restructuring, R&D) are expensed immediately while benefits are recorded later, so periodic earnings become less informative. They document that faster business change goes with shifts in R&D and declining informativeness of earnings. This links to Lecture 6 (rise of intangibles) and motivates integrated reporting.","kt":"","src":"Bok s. 152 (6.1.2) · Bok s. 153 (6.1.2)"},{"id":"SB238","l":"L7","t":"Sustainability reporting","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Hummel and Schlick (2016) find that weak sustainability performers tend to issue the most detailed, high-quality sustainability reports, to compensate for their weak performance.","o":[["True","Incorrect. They find the opposite: superior performers choose high-quality reporting to signal their performance, while weak performers prefer to hide their weakness by being less transparent."],["False","Correct. They find the opposite: superior performers choose high-quality reporting to signal their performance, while weak performers prefer to hide their weakness by being less transparent."]],"c":[1],"es":"False: strong performers report well to signal; weak performers hide.","ed":"This is the voluntary disclosure (signalling) view: good performers have an incentive to disclose. Related evidence: Dhaliwal et al. (2011) find firms issuing stand-alone CSR reports have lower analyst forecast errors and, for superior CSR performers, a lower cost of equity. Melloni et al. (2017) find integrated reports of weak financial performers are less concise and less balanced - impression management. Because voluntary reporting lets weak firms stay quiet or spin, Lecture 7 argues for a mix of voluntary and mandatory reporting.","kt":"","src":"Bok s. 153 (6.1.2) · Bok s. 155 (6.2.4) · Bok s. 170 (6.3.4)"},{"id":"SB239","l":"L7","t":"Environmental metrics","f":"m","d":2,"p":"H","sc":"short","s":"A car manufacturer reports emissions according to the GHG Protocol. In which scope do the emissions from its cars being driven by customers fall?","o":[["Scope 3, as an indirect emission from the use of sold products","Scope 3 covers other indirect emissions across the value chain, including use of sold products."],["Scope 2, because the emissions are indirect and caused by energy use","Scope 2 is limited to purchased electricity, heat or steam."],["Scope 4, because customers rather than the company control the cars","Scope 4 refers to emissions avoided by clients thanks to a company's solutions."],["Scope 1, because the company produced the cars that cause the emissions","Scope 1 covers only direct emissions from sources the company owns or controls."]],"c":[0],"es":"Use of sold products is scope 3.","ed":"Scope 1 = all direct GHG emissions from owned or controlled sources; scope 2 = indirect emissions from purchased electricity, heat or steam; scope 3 = all other indirect emissions along the value chain (purchased goods, use of sold products, etc.); scope 4 (not in the GHG Protocol) = reductions in clients' scope 3 achieved by a company's solutions, e.g. Novozymes claiming 76 million tons saved for clients. For banks, financed emissions are part of scope 3 (Lecture 11).","kt":"","src":"Bok s. 153 (6.2.1) · Bok s. 154 (Box 6.1) · L7 slide 7"},{"id":"SB240","l":"L7","t":"Environmental metrics","f":"m","d":3,"p":"M","sc":"none","s":"Table 6.1 shows Philips' footprint (kilotons CO2e). In 2017: scope 1 = 38, scope 2 = 58, scope 3 = 751, and 220 compensated by carbon offset projects. Which reading is correct?","o":[["Scope 1 is the largest category, so the company should focus on its own plants first.","Scope 1 (38) is the smallest."],["Scope 3 is by far the largest; net operational emissions are 627 kt after offsets.","38 + 58 + 751 = 847; 847 - 220 = 627."],["Total emissions fell between 2013 and 2017 because scope 3 declined sharply.","Total rose from 812 to 847; scope 3 rose from 654 to 751."],["Net operational emissions are 847 kt, because offsets are never deducted.","Table 6.1 reports 847 before and 627 after offsets."]],"c":[1],"es":"Total = 847 kt (scope 3 dominates); net after 220 kt offsets = 627 kt.","ed":"In Table 6.1, scope 2 fell sharply (121 to 58) thanks to renewable electricity, while scope 3 rose and dominates the total. Offsets lowered net emissions to 627 kt in 2017. The example shows why scope 3 matters for most companies and why compensation (offsetting) should be reported separately from actual reductions. Some firms (Unilever, DSM, Microsoft) also use internal carbon prices as a signal of commitment.","kt":"","src":"Bok s. 154 (Table 6.1) · Bok s. 154 (6.2.1)"},{"id":"SB241","l":"L7","t":"Social and governance metrics","f":"m","d":2,"p":"M","sc":"none","s":"Which is an example the textbook gives of a SOCIAL metric?","o":[["Scope 2 emissions per unit of sales","This is an environmental metric."],["Board independence and share classes","These are governance indicators (section 6.2.3)."],["Management compensation and voting rights","These are governance indicators."],["Accident frequency rates in mining companies","Listed in section 6.2.2."]],"c":[3],"es":"S metrics: accident rates, local stakeholder programmes, engagement, attrition, NPS, supplier standards, social impact targets.","ed":"Social metrics are harder to define than environmental ones but are increasingly recorded: accident frequency, local stakeholder programmes, employee engagement and attrition, external scores (Glassdoor, Indeed), brand valuations and net promoter scores, supplier standards and impact targets (Philips: improving 3 billion lives). Governance indicators include shareholder structure, board composition and independence, compensation, committees, voting rights, share classes and codes of conduct - plenty of data, but interpretation depends on context. Also correct: Employee engagement data, attrition
