ck show this fails where interests clearly conflict and ignores externalities on distant stakeholders such as the environment (Hart and Zingales' point). Still, unlike stakeholder theory, it has a single roughly measurable objective and recognises that good stakeholder relations ease contracting and create surplus - hence \"least bad\". The textbook classifies it as SF 1.0.","kt":"","src":"Bok s. 81 (3.2.2) · Bok s. 82 (3.2.2) · L5 slide 27"},{"id":"SB143","l":"L4","t":"Shareholder model challenges","f":"m","d":3,"p":"H","sc":"none","s":"Which is one of the challenges to the shareholder model in the textbook?","o":[["Shareholders pay for all damage","Limited liability caps shareholders' losses at the value of their shares."],["Business ethics problems","Listed as the third challenge, the \"final line of defence\"."],["It leads to too much long-term investment","The usual concern is short-termism, not excessive long-term investment."],["Shareholders are paid first","Shareholders are residual claimants, paid after all contractual claims."]],"c":[1],"es":"Contractual issues (incomplete contracts), public policy (externalities not fully covered) and business ethics.","ed":"Shareholders are residual, non-contractual claimants. (1) Contracts with stakeholders are incomplete, so in unforeseen circumstances shareholder interests override others. (2) Public policy: stakeholders may lobby for protection, but major externalities (environment, outsourced social issues) are not fully covered. (3) Business ethics: a narrow focus can justify cutting costs and accepting small risks of disasters, especially since limited liability and directors' liability insurance cap the downside. Shapira and Zingales show deterrence often fails because firms control the information. Also true, but not offered as an option here: Contractual issues: contracts cannot cover all future circumstances, including externalities (incomplete contracts).","kt":"","src":"Bok s. 80 (3.2.1) · Bok s. 81 (3.2.1) · L5 slide 24"},{"id":"SB144","l":"L4","t":"Stakeholder model","f":"m","d":4,"p":"L","sc":"none","s":"According to Magill, Quinzii and Rochet (2015), what goes wrong when large firms maximise shareholder value?","o":[["They spend too much on safety","The model predicts underinvestment, not overinvestment."],["Competition removes all externalities","The model shows externalities persist."],["They take too little risk","The issue is externalities on stakeholders, not shareholder risk aversion."],["Risks to workers are ignored","Shareholders do not internalise the externalities on workers and consumers, leading to underinvestment in prevention."]],"c":[3],"es":"Shareholders ignore externalities on workers and consumers, so firms underinvest in risk prevention.","ed":"Magill, Quinzii and Rochet propose a \"stakeholder equilibrium\": instruct managers to maximise the total welfare of stakeholders, implemented by creating new property rights (employee and consumer rights) and maximising the value of these rights plus shareholder value. The textbook links this to integrated value and integrated reporting (six capitals) as a practical language for such trade-offs.","kt":"","src":"Bok s. 82 (3.2.3)"},{"id":"SB145","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":5,"p":"M","sc":"constructed_scenario","s":"An index fund always votes for the most profitable option, though many of its clients want firms to avoid harmful activities. What would Hart and Zingales recommend?","o":[["Ask its investors and vote as they prefer","They propose company and asset managers pursue policies consistent with investors' preferences, and see the belief in a value-only fiduciary duty as a source of amoral drift."],["Keep voting for the most profitable option","Hart and Zingales call this belief mistaken and a source of amoral drift."],["Sell all harmful firms","In their model voting is precisely the channel through which preferences matter; divestment alone does not change the action."],["Let managers decide all votes","That removes shareholders' preferences from the decision entirely."]],"c":[0],"es":"Asset managers should vote in line with their investors' (prosocial) preferences, not mechanically for value.","ed":"Hart and Zingales argue asset managers, as delegates of ultimate investors, should pursue policies consistent with those investors' preferences. Large index funds hold many firms and vote on many proposals, so their voting policy matters greatly. The belief that fiduciary duty demands pure value maximisation feeds the amoral drift. This ties to the textbook's call to clarify fiduciary duty (High-Level Expert Group: understand beneficiaries' sustainability preferences) and to Lecture 8, where passive investors can still use voice (voting) even though they cannot exit.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 11-12 · Bok s. 86 (3.3.1) · L8 slide 71"},{"id":"SB146","l":"L4","t":"Business Roundtable statement","f":"t","d":3,"p":"M","sc":"none","s":"True or false: One criticism of the Business Roundtable statement is that some signers are big lenders to fossil fuel projects.","o":[["True","Correct. Slide 16 quotes Sanford Lewis, an attorney advising shareholder petitioners, making exactly this point."],["False","Incorrect. Slide 16 quotes Sanford Lewis, an attorney advising shareholder petitioners, making exactly this point."]],"c":[0],"es":"True: critics saw a gap between the pledge and signatories' fossil fuel financing.","ed":"Critics argued the statement was not backed by action (signatories did not change governance or behaviour), some questioned its legal basis, and others saw it as increasing agency problems. The fossil fuel financing criticism links to Lecture 11, where banks increased fossil fuel finance in 2024 despite climate commitments (\"banks have shown their true colours\").","kt":"","src":"L4 slide 14-16 · L11 slide 32"},{"id":"SB147","l":"L4","t":"Shareholder theory","f":"m","d":2,"p":"M","sc":"none","s":"Shareholders are called \"residual claimants\" because:","o":[["They have no right to any cash flows","They have a right to the residual cash flows."],["They get a fixed return","That describes debt; equity returns are residual and variable."],["They are paid last","Residual claimants receive what is left after contractual claims, which motivates the shareholder model."],["They are paid before creditors","Creditors have contractual priority; shareholders come last."]],"c":[2],"es":"Shareholders get what remains after all contractual claims are paid.","ed":"Jensen and Meckling describe shareholders as residual claimants: they receive the leftover after creditors, employees, customers and government are paid under their contracts. The shareholder model argues that maximising this residual maximises total value, provided contracts protect other stakeholders. The challenge is that contracts are incomplete and externalities are not contracted at all, which is the core of the stakeholder critique.","kt":"","src":"Bok s. 80 (3.2.1)"},{"id":"SB148","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":3,"p":"H","sc":"none","s":"How does the corporate goal debate match the SF stages?","o":[["Shareholder SF 1.0; stakeholder SF 2.0","Box 1.3, 1.4 and 1.5 formalise these objective functions."],["All the stages are the same in practice","Lecture 5 discusses different governance challenges for each model."],["Stakeholder value = SF 1.0","Exclusion lists belong to SF 1.0; stakeholder value is SF 2.0."],["Shareholder value = SF 3.0","Pure shareholder value is finance as usual."]],"c":[0],"es":"Refined shareholder value = SF 1.0; stakeholder/integrated value = SF 2.0; common good = SF 3.0.","ed":"The textbook links governance models to its typology. Finance as usual maximises shareholder value; refined shareholder value (enlightened value maximisation) maximises F subject to S and E constraints (SF 1.0); the stakeholder model optimises integrated value (SF 2.0); separate non-financial KPIs with financial value as a constraint come closer to SF 3.0. Lecture 5 lists challenges for each: unaccountability and measurement for SF 1.0, balancing interests and agency costs for SF 2.0.","kt":"","src":"Bok s. 82 (3.2.2) · Bok s. 83 (3.2.3) · L5 slide 27-28"},{"id":"SB149","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":4,"p":"L","sc":"none","s":"True or false: According to Hart and Zingales, a founder who wants her firm to stay \"clean\" after listing should make hostile takeovers easy.","o":[["True","Incorrect. Making takeovers easy helps a founder who wants dirty (amoral drift). To protect clean, a founder can use a staggered board or a dual-class structure retaining voting control."],["False","Correct. Making takeovers easy helps a founder who wants dirty (amoral drift). To protect clean, a founder can use a staggered board or a dual-class structure retaining voting control."]],"c":[1],"es":"False: easy takeovers favour dirty; staggered boards or dual-class shares protect clean.","ed":"Because of the amoral drift, an unfettered market for corporate control pushes firms towards the dirty, more profitable action. A founder wanting dirty should make takeovers easy; one wanting clean can adopt a staggered board or dual-class shares (as Google and Facebook did) to keep control. But such defences entrench management, which conflicts with Lecture 5's good governance practice of avoiding dual-class shares - another trade-off between accountability and stakeholder commitment, as in the Unilever/Kraft Heinz case.","kt":"","src":"Hart & Zingales s. 13-14 · L5 slide 19 · Bok s. 85 (3.3.1)"},{"id":"SB150","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Kraft Heinz tried to buy Unilever in 2017. How does the textbook see this failed takeover?","o":[["As SF 3.0 impact investing","Kraft Heinz is the shareholder-model company."],["As a clash between SF 1.0 and SF 2.0","Box 3.2 contrasts Kraft Heinz's shareholder model with Unilever's stakeholder model under Paul Polman."],["As proof that hostile takeovers always win","The bid was dropped; Warren Buffett did not approve a hostile takeover."],["As a merger of two equal firms","The firms had radically different business models and cultures."]],"c":[1],"es":"Shareholder model (Kraft Heinz, SF 1.0) vs stakeholder model (Unilever, SF 2.0); the bid was abandoned.","ed":"Kraft Heinz relied on debt-financed deals and aggressive cost cutting to expand margins and repay debt; Unilever balanced profitability with social and environmental sustainability and had a strong emerging market presence. Without protection, financial considerations would always dominate, biasing firms towards SF 1.0. The textbook proposes a societal cost-benefit test of takeovers: approval only if integrated value improves, with fairness opinions and possibly a takeover panel or court. Hart and Zingales' amoral drift gives the theory behind this concern.","kt":"","src":"Bok s. 85 (3.3.1) · Bok s. 86 (Box 3.2) · Hart & Zingales s. 11"},{"id":"SB151","l":"L4","t":"Shareholder vs stakeholder model","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook suggests approving a merger only if the combined firm's integrated value (F + S + E) is higher than for the two firms alone.","o":[["True","Correct. Section 3.3.1 proposes exactly this test, with an independent fairness opinion and review by a court or takeover panel."],["False","Incorrect. Section 3.3.1 proposes exactly this test, with an independent fairness opinion and review by a court or takeover panel."]],"c":[0],"es":"True: approve only if integrated value improves, verified by an independent fairness opinion.","ed":"The test uses the integrated value methodology from Chapter 2. Management of both firms would calculate the combined integrated value; an independent advisor gives a fairness opinion; a court or takeover panel approves only if integrated value improves. The textbook admits it is administratively cumbersome and information-hungry, which again stresses the importance of integrated reporting (Lecture 7).","kt":"","src":"Bok s. 85 (3.3.1) · Bok s. 86 (3.3.1)"},{"id":"SB152","l":"L4","t":"Purpose of the firm","f":"m","d":5,"p":"M","sc":"none","s":"\"On whose behalf should a company be run?\" Which answer fits the theories in the course?","o":[["For shareholders and their values","Shareholder welfare includes prosocial preferences, implemented for example through voting."],["It does not matter, since only owners are affected","Externalities, employees and supply chains show decisions affect many parties."],["The law allows only one party","The business judgement rule allows directors to consider stakeholders; several countries mandate employee board seats."],["Shareholder value always helps everyone","Externalities and incomplete contracts mean this is not automatic."]],"c":[0],"es":"Multiple principals need a balancing rule to avoid agency costs; shareholder welfare can include non-financial preferences.","ed":"The debate has three poles: Friedman (market value for shareholders), Hart and Zingales (welfare of shareholders, including prosocial preferences, via voting) and Freeman (all stakeholders). Critics of stakeholderism stress the difficulty of balancing interests and holding managers accountable; supporters point to incomplete contracts and externalities. Edmans offers a bridge: growing the pie reduces conflicts. Legal systems differ: Delaware frames duties towards shareholders, while Germany and Norway build employees into boards. Also true, but not offered as an option here: Running a firm for multiple parties is possible but needs a way to weigh conflicting interests; otherwise agency costs may rise.","kt":"","src":"L4 slide 4-5 · L4 slide 20-21 · L4 slide 31 · L4 slide 19"},{"id":"SB153","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":3,"p":"M","sc":"none","s":"Why do firms in civil law countries tend to have higher ESG scores (Liang and Renneboog, 2017)?","o":[["They have more takeovers","Dispersed ownership and active takeover markets are typical of common law countries."],["Rating agencies favour them","The explanation offered is legal origin and social control, not rater bias."],["Common law countries ban ESG reports","No such ban exists."],["It is more stakeholder-oriented","Rule-based mechanisms restricting firm behaviour ex ante are more prevalent in civil law countries."]],"c":[3],"es":"Civil law: ex ante rules embedding stakeholder preferences; common law: shareholder primacy and ex post judicial settlement.","ed":"Legal origin, interpreted as systems of social control of economic life, helps explain cross-country variation in ESG. Civil law countries (mainland Europe) rely more on rules restricting firm behaviour ex ante and are more stakeholder-oriented; common law countries (UK, US) emphasise shareholder primacy and ex post judicial settlement. Starks reports similar regional patterns in ESG fund assets and E scores.","kt":"","src":"Bok s. 84 (3.3) · Bok s. 85 (3.3) · Starks s. 1849-1851"},{"id":"SB154","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":3,"p":"L","sc":"none","s":"Many shareholders own diversified portfolios. What concern does Hart and Zingales' review raise about this?","o":[["They never vote","This is not the concern described."],["They always want high wages","High-wage preferences come from shareholders who are also employees, a different strand."],["Firms may act like one monopoly","With common ownership, coordination failures may be avoided, but joint monopoly power can be exploited."],["Firms must invest only in clean tech","Not the argument made."]],"c":[2],"es":"Common ownership can lead firms to soften competition and exploit joint monopoly power.","ed":"Hart and Zingales locate their work among four strands: (1) incomplete markets and imperfect competition make value maximisation not unanimously approved (e.g. a GM shareholder who buys cars); (2) diversified shareholders care about total portfolio value, which may reduce coordination failures but enable tacit collusion; (3) stakeholder relations under incomplete contracts; (4) corporate social responsibility, closest to their paper.","kt":"","src":"Hart & Zingales s. 5-6"},{"id":"SB155","l":"L4","t":"Purpose","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: In Edmans' view, a firm that raises profits by paying suppliers too little is creating value.","o":[["True","Incorrect. Edmans distinguishes growing the pie (creating value for society and investors) from splitting it differently; squeezing suppliers redistributes value and may shrink the pie over time."],["False","Correct. Edmans distinguishes growing the pie (creating value for society and investors) from splitting it differently; squeezing suppliers redistributes value and may shrink the pie over time."]],"c":[1],"es":"False: that is pie-splitting, not pie-growing.","ed":"Edmans' tests for an investment include the multiplication principle (does it create more value for society than it costs?), comparative advantage and materiality. Squeezing suppliers can backfire through lower quality, supply disruptions and reputational damage.","kt":"Pie-growing mentality (Edmans): create value for society through excellence, and profits follow as a by-product; pie-splitting takes value from one stakeholder to give it to another.","src":"L4 slide 30-31"},{"id":"TR13","l":"L4","t":"Shareholder vs stakeholder value","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Two manufacturers merge in a country with strong job protection, so closing plants is costly. How does the market react?","o":[["No reaction","Labour protection directly affects the cost of restructuring."],["Higher returns; faster approval","Approval speed is not the mechanism discussed."],["Lower returns; layoffs are harder","Strong labour rights protect workers (stakeholders) but cut expected synergy gains for shareholders."],["Higher returns; workers are more productive","The evidence cited points to lower, not higher, returns."]],"c":[2],"es":"Stronger worker protection → harder restructuring → lower deal returns.","ed":"This is a clean case of shareholder vs stakeholder value: the same rule that protects employees reduces the value shareholders can capture from a horizontal merger. It shows why a single \"stakeholder value\" objective is hard to define.","kt":"","src":"Opptak L4 ca. 33 min"},{"id":"TR14","l":"L4","t":"Critique of stakeholderism","f":"m","d":4,"p":"H","sc":"none","s":"Managers give some workers better contracts so they help block a takeover. Which criticism of stakeholderism does this show?","o":[["It requires CSRD reporting","Reporting rules are unrelated to this mechanism."],["It can shield managers","Workers become allies that help managers keep their jobs; this is the entrenchment risk."],["It forces a short-term focus","The case is about managers resisting shareholder pressure, not obeying it."],["It makes takeovers more likely","In the example the workers help block the takeover."]],"c":[1],"es":"\"Serving stakeholders\" can disguise managerial entrenchment.","ed":"Bebchuk and Tallarita argue stakeholderism mostly serves managers. Jensen adds that with many objectives, managers can justify almost any decision. The lecture's Bergen-office example is the same pattern: a self-serving choice dressed up as serving the region.","kt":"","src":"Opptak L4 ca. 32 min"},{"id":"TR15","l":"L4","t":"Conflicts among stakeholders","f":"m","d":3,"p":"M","sc":"short","s":"A price cartel is broken up. Consumers gain, but the firms then lay off workers. What does this show?","o":[["Shareholders always pay the full cost","The lecture notes workers, not shareholders, paid much of the price."],["Antitrust does not affect workers","The research shows layoffs follow cartel investigations."],["Consumers and workers always gain together","The case shows their interests diverging."],["Stakeholder interests can conflict","Consumers gain while employees lose: there is no single \"stakeholder value\" to maximise."]],"c":[3],"es":"Helping one stakeholder group can hurt another.","ed":"This is why Jensen calls stakeholder maximisation ill-defined: with conflicting groups, any decision can be defended. In SF 2.0 (integrated value) this trade-off has to be made explicit, which raises measurement and accountability problems.","kt":"","src":"Opptak L4 ca. 29 min · Opptak L5 ca. 49 min"},{"id":"TR16","l":"L4","t":"Legal view on corporate purpose","f":"m","d":3,"p":"H","sc":"none","s":"Why might the 2019 Business Roundtable statement not even be necessary?","o":[["The law already requires serving all stakeholders","Fiduciary duties (care and loyalty) are owed to shareholders, not all stakeholders."],["It was legally binding","It was a voluntary, non-binding declaration."],["Shareholders cannot sue directors","They can sue, which is why the business judgment rule matters."],["The business judgment rule already allows it","Courts presume directors acted in good faith for shareholders, so managers already have room to consider stakeholders."]],"c":[3],"es":"Managers already have legal leeway via the business judgment rule.","ed":"The lecture gives both legal views: strictly, under Delaware law, putting stakeholders before shareholders could breach fiduciary duty; but in practice the business judgment rule (plus D&O insurance) protects good-faith choices, so the statement adds little.","kt":"Business judgment rule: courts presume directors made decisions in good faith, with due care and in the company's interest, unless shown otherwise.","src":"Opptak L4 ca. 38 min · Opptak L4 ca. 41 min"},{"id":"TR17","l":"L4","t":"Business Roundtable 2019","f":"m","d":3,"p":"H","sc":"short","s":"A month after Jeff Bezos signed the stakeholder statement, Whole Foods cut health insurance for part-time staff. This supports the criticism that:","o":[["Pledges always lower firm value","The case says nothing about firm value."],["A non-binding pledge may be mostly PR","Senator Warren called it a publicity stunt and proposed binding rules instead."],["Health insurance is a governance issue","Employee benefits are a social (S) issue."],["Part-time workers are not stakeholders","Employees are core stakeholders in Freeman's list."]],"c":[1],"es":"Voluntary, unenforced pledges invite doubts about real change.","ed":"Critics noted signatories like Goldman Sachs and BlackRock kept financing fossil fuel expansion. Warren's proposed Accountable Capitalism Act would have made stakeholder duties binding: workers electing 40% of board members, limits on directors selling shares, and 75% approval for political spending.","kt":"","src":"Opptak L4 ca. 20 min · Opptak L4 ca. 23 min"},{"id":"TR18","l":"L4","t":"Stakeholder governance","f":"m","d":2,"p":"M","sc":"none","s":"In Norway, employees in firms with over 30 staff can elect board members. How does the course see this rule?","o":[["A dual-class share structure","Dual-class shares give some shareholders extra votes; this is about employees."],["A way to give shareholders more control","It gives employees, not shareholders, more say."],["A US-only rule","The lecture contrasts European laws (Germany, Norway, Sweden) with the US."],["A binding employee voice","It makes stakeholder voice legally enforceable, unlike voluntary pledges."]],"c":[3],"es":"Employee board seats make stakeholder voice binding.","ed":"Germany goes further, with up to half of supervisory board seats for workers in large firms. Such codetermination contrasts with the US, where the BRT pledge was voluntary and the Accountable Capitalism Act was only proposed.","kt":"","src":"Opptak L4 ca. 25 min"},{"id":"TR19","l":"L4","t":"CSR and performance","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A very profitable firm uses spare cash for community projects; a struggling rival does not. Which idea fits this?","o":[["Doing good by doing well","Causality runs from financial performance to CSR."],["Ethical relativism","This is an ethical theory, not a link between CSR and profits."],["Doing well by doing good","That runs the other way, from CSR to performance."],["Delegated philanthropy","Nothing indicates investors asked for this."]],"c":[0],"es":"Slack from profits funds CSR = doing good by doing well.","ed":"Both directions have evidence. \"Doing well by doing good\": treating employees well shows up in stock returns (Edmans). \"Doing good by doing well\": only profitable firms have resources to spare. A correlation between CSR and profits alone cannot tell you which story is true.","kt":"","src":"Opptak L4 ca. 14 min"},{"id":"EX01","l":"L5","t":"Exam sample: adaptive markets hypothesis","f":"t","d":2,"p":"H","sc":"none","s":"Can the adaptive markets hypothesis help explain why carbon risk may not yet be fully priced?","o":[["Yes","Riktig. Ifølge AMH avhenger markedseffektivitet av hvor mange og hvilke investorer som analyserer en risiko. Klimarisiko er ny og analyseres av få, så den kan være underpriset."],["No","Feil. Ifølge AMH avhenger markedseffektivitet av hvor mange og hvilke investorer som analyserer en risiko. Klimarisiko er ny og analyseres av få, så den kan være underpriset."]],"c":[0],"es":"Ja: AMH = effektivitet avhenger av hvem som analyserer. Ny risiko kan være underpriset.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- EMH (efficient markets hypothesis): all informasjon er alltid i prisen.\n- AMH (Lo): markedet blir effektivt over tid etter hvert som flere investorer lærer seg å analysere en risiko.\nKarbonrisiko er relativt ny, så den er kanskje ikke fullt priset ennå.","kt":"Adaptive markets hypothesis (AMH): markeder tilpasser seg og blir mer effektive over tid.","src":"L5 slide 26 · Bok s. 90 (3.4) · Bok s. 91 (3.4)","k":1,"x":1},{"id":"CX036","l":"L5","t":"Corporate governance","f":"m","d":2,"p":"H","sc":"none","s":"Corporate governance problems mainly come from:","o":[["Competition from foreign firms","Det har ikke med governance å gjøre."],["Too much government regulation","Det er ikke grunnproblemet."],["The separation of ownership and control","Eierne eier, ledelsen styrer: principal-agent."],["High interest rates","Renter er ikke kilden."]],"c":[2],"es":"Separation of ownership and control.","ed":"Styre, lederlønn, revisjon og stemmegivning er verktøy for å holde ledelsen ansvarlig overfor eierne.","kt":"","src":"L5 slide 7-8 · L5 slide 14","k":1},{"id":"CX037","l":"L5","t":"Voice and exit","f":"m","d":2,"p":"H","sc":"short","s":"A shareholder proposal asking a firm to set emission targets is an example of:","o":[["Divestment","Divestment = exit."],["Voice","Å påvirke selskapet innenfra = voice."],["Passive investing","Passiv investering handler om å følge en indeks."],["Exit","Exit er å selge aksjene."]],"c":[1],"es":"Forslag, stemmer, dialog = voice.","ed":"Voice: dialog, stemmegivning, forslag. Exit: selge aksjene. Trusselen om exit kan gjøre voice sterkere.","kt":"","src":"L5 slide 17 · L8 slide 71 · Bok s. 89 (3.3.4)","k":1},{"id":"CX038","l":"L5","t":"Voice vs exit","f":"m","d":2,"p":"H","sc":"none","s":"The most realistic tool for an index fund that wants a company to change is:","o":[["Voting and engagement","Indeksfond må eie alle selskapene i indeksen, så de bruker voice."],["Short selling the shares","Indeksfond shorter ikke enkeltaksjer."],["Refusing to receive dividends","Det er ikke et governance-verktøy."],["Selling the company's shares","Da følger fondet ikke lenger indeksen."]],"c":[0],"es":"Indeksfond: bare voice.","ed":"Exit er først og fremst et verktøy for aktive investorer. Når et indeksfond selger, følger det bare indeksreglene, ikke selskapets oppførsel.","kt":"","src":"L8 slide 71 · Bok s. 194 (7.3.4)","k":1},{"id":"CX039","l":"L5","t":"Engagement","f":"t","d":2,"p":"H","sc":"none","s":"Does selling a polluting firm's shares usually force it to cut emissions?","o":[["Yes","Feil. Noen andre kjøper aksjene, ofte en investor som bryr seg mindre. Selskapet kan fortsette som før."],["No","Riktig. Noen andre kjøper aksjene, ofte en investor som bryr seg mindre. Selskapet kan fortsette som før."]],"c":[1],"es":"Nei: divestment har begrenset effekt.","ed":"Derfor foretrekker mange investorer engagement (voice), og selger først når dialogen ikke fører frem.","kt":"","src":"Bok s. 89 (3.3.4) · Bok s. 21 (1.4.1) · L8 slide 58 · L9 slide 32","k":1},{"id":"CX040","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"The 'tragedy of the horizon' (Carney) refers to:","o":[["Investors hold shares for too many years","Problemet er heller for korte horisonter."],["Climate harms arrive beyond decision horizons","Kostnadene ved å handle kommer nå, gevinstene langt frem i tid."],["Firms report too much ESG information too often","Det er ikke poenget."],["Interest rates are too high for green projects","Det er ikke begrepet."]],"c":[1],"es":"Kostnad nå, gevinst langt frem = tragedy of the horizon.","ed":"Ledere, investorer og politikere har korte horisonter, så de undervurderer klimaeffekter som kommer langt frem i tid.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 98 (Key concepts) · L5 slide 29","k":1},{"id":"CX041","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"A practice that tends to INCREASE short-termism is:","o":[["Long vesting periods","Lang opptjening trekker mot langsiktighet."],["Clawback rules","Clawback reduserer fristelsen til kortsiktighet."],["Quarterly reporting","Hyppig måling gir press på kortsiktige tall."],["Long-term owners","Langsiktige eiere reduserer short-termism."]],"c":[2],"es":"Kvartalsrapportering øker short-termism.","ed":"Andre ting som øker short-termism: årlige bonuser, kvartalsvis måling av forvaltere og marking-to-market.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 77 (Table 3.1)","k":1},{"id":"CX042","l":"L5","t":"Executive compensation","f":"m","d":2,"p":"H","sc":"none","s":"A clawback provision means:","o":[["Delaying when shares can be sold","Det er vesting."],["Taking back pay already given","Selskapet krever tilbake bonus som ikke var fortjent."],["A bonus for hitting ESG targets","Det er ESG-linked pay."],["A fixed cap on total CEO pay","Det er et lønnstak."]],"c":[1],"es":"Clawback = ta tilbake.","ed":"Clawback og lange vesting-perioder får ledere til å tenke langsiktig.","kt":"","src":"Bok s. 92 (3.4.2) · L5 slide 29","k":1},{"id":"CX043","l":"L5","t":"ESG-linked executive pay","f":"m","d":2,"p":"H","sc":"none","s":"The evidence on ESG-linked executive pay shows that:","o":[["Its link to ESG results is weak","Svak og ikke-kausal sammenheng, ofte vage mål."],["It reliably causes better ESG results","Det finnes ikke slik evidens."],["It is banned in the European Union","Det er ikke forbudt."],["It always lowers total CEO pay","Det stemmer ikke."]],"c":[0],"es":"Svak sammenheng mellom ESG-lønn og ESG-resultat.","ed":"Bedre design: målbare, verifiserte mål og utbetaling over flere år.","kt":"","src":"Opptak L5 ca. 61 min · Opptak L5 ca. 65 min","k":1},{"id":"SB156","l":"L5","t":"Corporate governance","f":"m","d":1,"p":"H","sc":"none","s":"The root cause of corporate governance problems is:","o":[["Rules that force quarterly reporting","Quarterly reporting is a source of short-termism, not the origin of governance problems."],["The separation of ownership and control","Slide 7: governance issues arise from the separation of ownership (principals) and control (agents)."],["Shareholders knowing more than managers","It is the agent (manager) who usually has superior information."],["Firms being too small for managers","Governance problems are typical of large firms with professional managers and dispersed owners."]],"c":[1],"es":"Governance problems stem from separating ownership and control (principal-agent problem).","ed":"Owners (principals) delegate decision authority to managers (agents). Agency costs are the costs principals incur to make agents act in their interest. Problems arise because the agent has superior information and expertise, can choose behaviour after the contract is set and conceal outcomes, and cannot be monitored efficiently or costlessly. Corporate governance is the system of controls, regulation and incentives designed to minimise agency costs without unduly burdening managers with risk.","kt":"","src":"L5 slide 7-8 · L5 slide 14"},{"id":"SB157","l":"L5","t":"Agency problems","f":"m","d":3,"p":"H","sc":"short","s":"After two Boeing 737 MAX crashes, investigators found a culture that put cost cuts and share buybacks before safety. The lesson is that:","o":[["Safety is not material for plane makers","Product safety is highly material for aerospace."],["Short-term focus can hurt value","Short-termism and weak board oversight of safety destroyed value."],["Buybacks always raise long-term value","Buybacks can crowd out investment and do not guarantee value."],["A strong brand makes the board unimportant","The case shows boards must oversee material risks."]],"c":[1],"es":"Short-termism + weak oversight of a material issue (safety) destroyed long-term value.","ed":"Boeing lost tens of billions in costs and market value, and the board later created a safety committee. In course terms: misaligned incentives, weak board expertise on a material issue, and the \"tragedy of the horizon\" between short-term metrics and long-term risk.","kt":"Short-termism: favouring near-term earnings or share price over long-term value creation, e.g. by under-investing.","src":"L5 slide 5 · L5 slide 19"},{"id":"SB158","l":"L5","t":"Adverse selection","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Adverse selection happens after a deal, when someone takes more risk because others carry it.","o":[["True","Incorrect. That describes moral hazard. Adverse selection occurs before the transaction: hidden information is exploited, e.g. the borrowers most likely to produce bad outcomes are the ones most likely to seek loans."],["False","Correct. That describes moral hazard. Adverse selection occurs before the transaction: hidden information is exploited, e.g. the borrowers most likely to produce bad outcomes are the ones most likely to seek loans."]],"c":[1],"es":"False: that is moral hazard; adverse selection is about hidden information before the transaction.","ed":"Adverse selection (ex ante) - asymmetric information is exploited before the deal, as in Akerlof's \"lemons\" market where sellers of bad cars are most eager to sell, or riskier borrowers most eager to borrow. Moral hazard (ex post) - after the deal, behaviour changes when risks are borne by others; examples are debt overhang and asset substitution. Banks address adverse selection by screening and moral hazard by monitoring (Lecture 11).","kt":"","src":"L5 slide 10-13 · L11 slide 7"},{"id":"SB159","l":"L5","t":"Moral hazard","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Shareholders of a highly indebted firm push for a very risky project, because they get the upside while creditors carry the downside. This is:","o":[["Asset substitution (moral hazard)","Shifting to riskier assets after borrowing, at creditors' expense, is asset substitution."],["The tragedy of the horizon","That refers to costs now and benefits in the future, not risk-shifting."],["Adverse selection in the lemons market","There is no hidden information before the deal; behaviour changes after it."],["Tunnelling by a controlling shareholder","Tunnelling diverts assets to a controlling shareholder at minority shareholders' expense."]],"c":[0],"es":"Swapping to riskier assets after borrowing is asset substitution, a moral hazard problem.","ed":"Equity holders have a call-option-like payoff on firm assets (Lecture 10: equity holders get max(V - D, 0), debt holders min(V, D)). With high leverage they benefit from more risk, while creditors bear the losses: asset substitution. Debt overhang is the related problem where shareholders reject positive-NPV projects because gains would mostly go to creditors. Both arise after the contract is written.","kt":"","src":"L5 slide 13 · L10 slide 3"},{"id":"SB160","l":"L5","t":"Purpose of corporate governance","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A board that ignores repeated audit warnings fails the OECD goal of governance: trust, transparency and accountability.","o":[["True","Correct. The OECD principles see governance as building an environment of trust, transparency and accountability; ignoring control weaknesses undermines exactly that."],["False","Incorrect. The OECD principles see governance as building an environment of trust, transparency and accountability; ignoring control weaknesses undermines exactly that."]],"c":[0],"es":"True: ignoring control warnings undermines trust and accountability.","ed":"Wirecard is a real example of what happens when boards, auditors and supervisors fail to act on warnings. Good governance supports long-term investment, financial stability and business integrity.","kt":"Corporate governance: the system of rules, practices and processes by which a company is directed and controlled, balancing the interests of stakeholders.","src":"L5 slide 15"},{"id":"SB161","l":"L5","t":"Voice and exit","f":"m","d":2,"p":"H","sc":"none","s":"How does \"exit\" work as a governance tool?","o":[["Regulators remove the firm's licence","This is not a shareholder mechanism."],["The threat of selling disciplines managers","Slide 17: exit hurts managers ex post; the threat induces value maximisation ex ante."],["Shareholders vote managers out","Voting is a form of voice, not exit."],["Investors talk privately with the managers","Engagement (\"jawboning\") is voice."]],"c":[1],"es":"Exit = selling shares; its threat disciplines managers ex ante.","ed":"Shareholders have two direct mechanisms. Voice: voting at shareholder meetings and engagement with companies. Exit: selling shares (\"Wall Street walk\"), which lowers the share price and hurts managers ex post; the threat of exit induces value maximisation ex ante. Lecture 8 notes that passive investors can vote but cannot exit, and the textbook argues divestment alone has limited effect because others buy the shares.","kt":"","src":"L5 slide 17 · L8 slide 71 · Bok s. 89 (3.3.4)"},{"id":"SB162","l":"L5","t":"Good governance practices","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A firm's CEO also chairs the board, most directors are ex-executives, and the same auditor has served for 25 years. What is the best fix?","o":[["Split the CEO and chair roles","Independence strengthens monitoring of management."],["Use revenue growth as the only target","Growth-only pay encourages value-destroying expansion."],["Keep the same auditor for 35 years","Very long tenure threatens auditor independence; rotation is good practice."],["Add more former executives","This weakens independence further."]],"c":[0],"es":"Independent oversight and long-term incentives are core good governance practices.","ed":"Other practices in the lecture include board diversity, transparency, shareholder rights and oversight of sustainability. Evidence (Gompers et al.) links stronger governance to higher valuations, and strong G often drives strong S and E. Also true, but not offered as an option here: Link pay to long-term, risk-adjusted value and material ESG targets.","kt":"Board independence: directors without ties to management who can monitor and challenge executives.","src":"L5 slide 19 · Bok s. 135 (5.3.3)"},{"id":"SB163","l":"L5","t":"Governance of sustainability","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A salmon farmer's board has no biology or environmental expert, although sea lice are its biggest risk. What should it do?","o":[["Focus only on quarterly earnings","This ignores the material drivers of long-term value."],["Leave the environment to marketing","Material risks need board-level oversight, not just communications."],["Add expertise on key risks","Boards need competence to oversee the issues that drive value."],["Stop reporting on sea lice","Hiding material risks undermines trust and can raise the cost of capital."]],"c":[2],"es":"Board competence and oversight should match the firm's most material issues.","ed":"Good governance of sustainability helps manage risks, seize opportunities and build trust with investors and regulators. For a salmon farmer, biology and licence-to-operate issues are directly linked to volumes, costs and licences.","kt":"Materiality: issues that can substantially affect a company's value (financial) or its impact on society (impact materiality).","src":"L5 slide 19"},{"id":"SB164","l":"L5","t":"Nestlé and Cargill child labour case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Nestlé and Cargill were sued over child labour on cocoa farms; the case failed because no link to specific farms was shown. What can shareholders do?","o":[["Nothing; governance does not affect supply chains","Compliance policies, board oversight and due diligence are exactly the practices that can prevent such cases."],["Use voice (engagement) or exit (selling)","These are the direct governance mechanisms on slide 17."],["Managers must use the cheapest labour by law","No legal duty requires illegal or unethical practices; the shareholder model can, however, create incentives to cut corners."],["Nothing; the case cannot affect value","Reputational damage, litigation costs, consumer reactions and regulatory risk can still affect value."]],"c":[1],"es":"Incentive: cheap inputs with externalised, hard-to-trace harm; response: voice or exit; value effects remain despite the ruling.","ed":"The discussion follows five questions: incentives for abuses (cost savings, weak traceability and limited liability), shareholder mechanisms (voice and exit), preventive practices (board oversight, compliance, due diligence, whistleblowing), effects on financial value (reputation, litigation, consumers, regulation, cost of capital) and governance challenges under the shareholder model (narrow focus enabling morally dubious decisions) and the stakeholder model (balancing interests, accountability). Courts' reluctance to assign liability shows why public policy alone does not fully internalise such externalities. Also true, but not offered as an option here: Firms may tolerate abuses because cheap inputs raise short-term profits while harms fall on distant third parties who cannot easily sue.","kt":"","src":"L5 slide 3-6 · L5 slide 16-22 · L5 slide 24"},{"id":"SB165","l":"L5","t":"Finance as usual","f":"m","d":3,"p":"M","sc":"none","s":"Which forces push to keep the status quo instead of internalising externalities?","o":[["Integrated reporting and clawbacks","These are remedies against short-termism."],["Green bonds and impact investing","These are SF 3.0 instruments promoting change."],["Lobbying and agency problems","These three forces are listed on slide 25."],["Climate lawsuits and carbon taxes","These push towards change, not the status quo."]],"c":[2],"es":"Status-quo forces: incumbent lobbying, agency problems, and investor biases (chasing returns, herding).","ed":"Moving from understanding externalities to acting on them is hard because incumbents lobby to protect the value of existing assets (e.g. oil industry vs electric cars in California, Global Climate Coalition), agency problems persist between companies and investors, and investors herd and chase returns, extrapolating the past. Climate change litigation (slide 25) is a growing counter-force. Investors can engage to stop lobbying and, failing that, exclude lobbying companies.","kt":"","src":"L5 slide 25 · Bok s. 78 (3.1.2)"},{"id":"SB166","l":"L5","t":"Market efficiency","f":"m","d":3,"p":"H","sc":"none","s":"Why can the adaptive markets hypothesis (AMH) explain that carbon risk is not yet fully priced?","o":[["Under EMH, regulators set prices","EMH is about prices reflecting information, not regulation."],["Efficiency depends on who studies the risk","If only a few groups examine a new risk such as carbon, prices may not fully reflect it."],["AMH assumes fully rational investors","AMH replaces this neoclassical assumption with an evolutionary model."],["Under AMH, prices always include all information","That is the EMH claim."]],"c":[1],"es":"AMH: market efficiency depends on the number and nature of participant groups; new risks studied by few are under-priced.","ed":"The EMH (Fama 1970) says prices incorporate all relevant information and on average reflect long-term fundamental value, which reinforces the share price as the central performance measure. The AMH (Lo) sees efficiency as the outcome of individuals adapting to a changing environment: prices reflect as much information as the number and nature of distinct groups of participants allow. New risks (e.g. carbon) examined by few investors may be under-priced, as Hong, Li and Xu and Andersson, Bolton and Samama suggest.","kt":"","src":"L5 slide 26 · Bok s. 90 (3.4) · Bok s. 91 (3.4)"},{"id":"SB167","l":"L5","t":"Market efficiency","f":"t","d":2,"p":"M","sc":"none","s":"True or false: If markets were fully efficient (EMH), active investors could not gain from better ESG insight, so everyone should invest passively.","o":[["True","Correct. Lecture 8 (slide 68) states that under the EMH it is impossible to benefit from superior insights, which suggests passive investing; this is presented as a barrier to sustainability integration."],["False","Incorrect. Lecture 8 (slide 68) states that under the EMH it is impossible to benefit from superior insights, which suggests passive investing; this is presented as a barrier to sustainability integration."]],"c":[0],"es":"True: under EMH, superior insight cannot be exploited, so passive investing would be optimal.","ed":"The EMH makes the stock price the central performance measure and implies no benefit from active analysis. This is a barrier to integrating sustainability, because ESG integration and engagement require fundamental, active analysis (Table 8.3), and passive investors cannot exit. The AMH offers an alternative view in which new risks may be mispriced, creating a role for long-term, informed investors.","kt":"","src":"L8 slide 68 · L5 slide 26 · Bok s. 95 (3.5)"},{"id":"SB168","l":"L5","t":"SF 1.0 and SF 2.0 governance challenges","f":"m","d":3,"p":"H","sc":"none","s":"Which challenge do both the refined shareholder model (SF 1.0) and the stakeholder model (SF 2.0) face?","o":[["Both assume externalities are priced","Neither does; that is why S and E are added."],["How to measure social and environmental value","Measurement appears on both slide 27 and slide 28."],["The shareholder model has no challenges","Slide 27 lists several challenges, including unresolved conflicts of interest."],["Stakeholder models make managers easier to control","The concern is the opposite: subjectivity reduces accountability."]],"c":[1],"es":"SF 1.0: unaccountable on multiple goals, unresolved conflicts, measurement; SF 2.0: balancing interests, subjectivity and agency costs, measurement.","ed":"Slide 27 (SF 1.0) - leaves managers unaccountable when optimising several objectives, fails to resolve many shareholder-stakeholder conflicts, and raises the question of how to measure S and E value. Slide 28 (SF 2.0) - how to balance all stakeholders' interests, increased subjectivity that may raise agency costs, and how to measure integrated value. The lecture's summary: focusing on stakeholder value can create shareholder value, but defining the objective as stakeholder value can increase agency costs (moral hazard, greenwashing). Also true, but not offered as an option here: A challenge of the stakeholder model (SF 2.0) is increased subjectivity, which can increase agency costs.","kt":"","src":"L5 slide 27-28 · L5 slide 45"},{"id":"SB169","l":"L5","t":"Sustainable governance guidelines","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An \"ESG\" fund pays its managers bonuses based only on one-year returns. Which principle does this go against?","o":[["Maximising diversification","Diversification is not the issue here."],["Excluding all sin stocks","The issue is incentives, not exclusions."],["Long-term pay incentives","One-year relative bonuses encourage short-termism."],["Reporting in local currency","Irrelevant to the governance problem."]],"c":[2],"es":"Short-term bonuses conflict with long-term value creation.","ed":"The textbook argues that horizons shorten along the investment chain when each party is judged on short-term metrics (Lecture 8). An \"ESG\" label combined with one-year incentives is a recipe for \"say one thing, do another\".","kt":"Long-term incentive alignment: pay and evaluation horizons that match the long-term goals of clients and beneficiaries.","src":"L5 slide 25 · Bok s. 187 (7.1.4)"},{"id":"SB170","l":"L5","t":"Short-termism","f":"t","d":2,"p":"H","sc":"none","s":"True or false: The \"tragedy of the horizon\" means that the costs of acting are paid now, while the benefits come in the future.","o":[["True","Correct. This is the textbook's key-concept definition."],["False","Incorrect. This is the textbook's key-concept definition."]],"c":[0],"es":"True: costs now, benefits later - and short horizons discount the future.","ed":"Because the impacts of economic activity on society and especially the environment are felt in the long term, and managers and investors work to short horizons, long-term benefits are heavily (myopically) discounted. Practices that reinforce short-termism: quarterly reporting, annual-result-based variable pay, monthly/quarterly benchmarking of fund managers, marking-to-market, and supervisory treatment favouring liquid assets.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 98 (Key concepts) · L5 slide 29"},{"id":"SB171","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"Which practice increases short-termism?","o":[["Integrated reporting","Integrated reporting is proposed to lengthen horizons and attract long-term investors."],["Bonuses paid later, based on long-term results","Deferral is a remedy that spreads pay over future periods."],["Buy-and-hold investing","Buy-and-hold is long-term; supervisory bias against it is the problem."],["Quarterly reporting","High reporting frequency pushes managers to defend the share price each quarter."]],"c":[3],"es":"Quarterly reporting, annual-based variable pay, short benchmarking, marking-to-market and supervisory treatment reinforce short-termism.","ed":"The textbook lists five practices: quarterly financial reporting, variable pay based on annual results, monthly/quarterly benchmarking, marking-to-market, and supervisory treatment of illiquid investments. A common theme is the EMH, which elevates the share price as the performance measure. Remedies: less frequent reporting with long-term metrics, deferred pay and clawbacks, longer evaluation periods, less reliance on marking-to-market for long-lived illiquid assets, and allowing buy-and-hold. Also true, but not offered as an option here: Monthly or quarterly benchmarking of fund managers' performance.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 77 (Table 3.1)"},{"id":"SB172","l":"L5","t":"Short-termism","f":"m","d":3,"p":"M","sc":"none","s":"What is the trade-off of reporting less often (e.g. dropping quarterly reports)?","o":[["No trade-off; both improve","Less frequent reporting gives the market less information."],["Firms would not need to disclose anything","Timely publication of material information remains important."],["Managers would face more pressure","The textbook argues pressure falls with lower frequency."],["Less pressure, but less information","Gigler et al.: infrequent reports can improve project selection though they provide less information to capital markets."]],"c":[3],"es":"Less frequent reporting reduces myopic pressure but gives markets less information.","ed":"Most firms see quarterly earnings as the key metric for outsiders (Graham, Harvey and Rajgopal). High reporting frequency pushes managers to sustain the share price, inducing myopic investment choices. Less frequent reports can give better project-selection incentives, but provide less information; timely disclosure of material events remains necessary. Barton and Wiseman propose longer-term metrics (10-year economic value added, R&D efficiency, multi-year returns), and integrated reporting broadens what is reported.","kt":"","src":"Bok s. 91 (3.4.1)"},{"id":"SB173","l":"L5","t":"Executive compensation","f":"m","d":3,"p":"H","sc":"none","s":"Which pay rule lets a firm take back money already paid to executives?","o":[["An annual cash bonus","Annual EBIT bonuses are a source of short-termism, not a recovery mechanism."],["A clawback provision","Clawbacks recover pay already disbursed, sometimes with a penalty."],["A longer vesting period","Longer vesting delays when equity can be sold; it does not recover past payments."],["A deferred reward","Deferral delays payment and makes it contingent on later events, but does not take back what was paid."]],"c":[1],"es":"Clawbacks recover pay already disbursed; deferral and longer vesting delay pay.","ed":"Bonuses based on annual results or stock options reinforce short-termism (Edmans, Fang and Lewellen). Remedies: the deferred reward principle (spread pay over current and future periods, contingent on later outcomes such as completion of a strategy), longer vesting or lock-up periods for equity, even after retirement, and clawback provisions (activated for fraud, accounting errors or later losses revealing excess pay). Lecture 5 adds the idea of paying CEOs with shares they must hold after leaving.","kt":"","src":"Bok s. 92 (3.4.2) · L5 slide 29"},{"id":"SB174","l":"L5","t":"ESG-linked executive pay","f":"m","d":3,"p":"H","sc":"none","s":"What does the course say about linking CEO pay to ESG goals?","o":[["The link to ESG results is weak","Slide 36: weak correlation, not causal."],["It always cuts emissions a lot","The slide stresses the correlation is weak and not causal."],["ESG pay goals are always clear and measurable","Lack of transparency and vague discretionary measures are criticisms."],["CEOs cannot affect sustainability","The rationale for ESG pay is precisely that executives influence it; the issue is design."]],"c":[0],"es":"ESG pay is weakly (non-causally) related to ESG performance; targets are often short-term, vague and opaque.","ed":"The textbook's guideline 1 suggests sustainability indicators in executive contracts. Lecture 5 shows practice (PwC 2021 survey) and its problems: concentration on tactical short-term targets, vague discretionary measures mixed with qualitative goals, lack of transparency, and only a weak, non-causal link between ESG pay and ESG performance. Better design: strategic, measurable, long-term targets, as in Starbucks' move to a three-year modifier on equity awards. Also true, but not offered as an option here: ESG targets often focus on tactical, short-term goals such as operational efficiency rather than strategic goals like emissions reductions.","kt":"","src":"L5 slide 31-38 · Bok s. 87 (3.3.2)"},{"id":"SB175","l":"L5","t":"ESG-linked executive pay","f":"t","d":3,"p":"M","sc":"extended_course_case","s":"True or false: Starbucks moved sustainability from the annual bonus into a three-year part of executives' equity pay, making the incentive more long-term.","o":[["True","Correct. This is stated on Lecture 5, slide 44."],["False","Incorrect. This is stated on Lecture 5, slide 44."]],"c":[0],"es":"True: Starbucks moved sustainability from the annual bonus to a three-year equity modifier.","ed":"The change addresses the concern that ESG targets in annual bonuses tend to be short-term and tactical. Linking sustainability to multi-year equity awards aligns it with the deferred reward principle and lengthens executives' horizons, consistent with the textbook's guideline 2 (lengthening executive horizons).","kt":"","src":"L5 slide 39-44 · Bok s. 92 (3.4.2)"},{"id":"SB176","l":"L5","t":"Corporate governance models","f":"m","d":3,"p":"M","sc":"none","s":"Which governance problem is typical in European and Asian firms with a controlling shareholder?","o":[["Many small owners fail to monitor managers","Dispersed ownership and active takeover markets are typical of Anglo-Saxon countries."],["Tunnelling by the big owner","Controlling shareholders can expropriate minority shareholders, e.g. by shifting assets within a business group."],["Managers are replaced too quickly","Takeover markets are less active in civil law countries; management is more entrenched."],["Too much shareholder control","This is not the governance problem associated with controlling shareholders."]],"c":[1],"es":"With controlling shareholders, the key agency conflict is with minority shareholders (tunnelling).","ed":"Anglo-Saxon (common law) countries have dispersed shareholders, active stock markets and a market for corporate control; the classic agency problem is shareholders vs managers, solved by limited-term contracts, performance pay and takeovers - but with a risk of short-termism. Mainland Europe and Asia have more controlling shareholders (families, the state); the agency problem shifts to controlling vs minority shareholders, e.g. tunnelling, requiring minority protection. Management is more entrenched and intervention in underperformers can be delayed.","kt":"","src":"Bok s. 84 (3.3)"},{"id":"SB177","l":"L5","t":"Governance mechanisms for sustainability","f":"m","d":3,"p":"M","sc":"none","s":"Which governance tool can build sustainability into a firm?","o":[["A board sustainability committee","Non-executive/supervisory board monitoring."],["Removing loan covenants","The textbook notes integrated balance sheets change covenant ratios; creditors remain relevant."],["Keeping long-term investors away","The textbook suggests attracting long-term investors (Knauer and Serafeim)."],["Banning integrated reporting","Integrated reporting is promoted, not banned."]],"c":[0],"es":"Executive contracts, type of shareholders, creditors (covenants) and board monitoring can embed sustainability.","ed":"Summary of section 3.3.2: (1) executive contracts and compensation with sustainability KPIs; (2) type of shareholders - prosocial (Hart and Zingales) and long-term investors attracted by integrated thinking and reporting; (3) creditors - integrated balance sheets change ratios such as debt-to-equity used in covenants; (4) non-executive/supervisory board monitoring, e.g. through the audit committee or a separate sustainability committee. The textbook notes that legally the difference between shareholder and stakeholder models may matter less than in theory (business judgement rule). Also true, but not offered as an option here: Including sustainability KPIs (e.g. a sustainability index ranking or integrated P&L) in executive contracts and pay.","kt":"","src":"Bok s. 87 (3.3.2) · Bok s. 88 (3.3.2)"},{"id":"SB178","l":"L5","t":"Organisational forms","f":"m","d":3,"p":"L","sc":"none","s":"A major drawback of a cooperative is that:","o":[["It must maximise value for outside owners","Cooperatives work for members' mutual benefit, not outside shareholders."],["It can only raise equity from members","Lack of access to external equity can become a constraint when the cooperative grows or makes losses."],["It cannot align with customers","Alignment of major stakeholders with the firm is the cooperative's strength."],["It is a private B Lab label","That describes the B corporation certification."]],"c":[1],"es":"Cooperatives align members' interests but cannot raise external equity.","ed":"Summary of section 3.3.3: private companies (private equity) can intervene directly and scale up via institutional money; cooperatives align customers or suppliers with the firm but cannot raise external equity; B corporations are privately certified (by B Lab) without legal status, unlike US benefit corporations; social enterprises and foundations put impact first but lack external shareholder pressure; governmental organisations serve the public good but may lack efficiency and depend on public budgets.","kt":"","src":"Bok s. 88 (3.3.3) · Bok s. 89 (3.3.3)"},{"id":"SB179","l":"L5","t":"Investor engagement","f":"t","d":3,"p":"H","sc":"short","s":"True or false: McCahery, Sautner and Starks (2016) find that long-term investors prefer to talk privately with managers before selling, and engage more than short-term investors.","o":[["True","Correct. They find behind-the-scenes engagement is widespread and long-term investors intervene more; exit is often a last resort."],["False","Incorrect. They find behind-the-scenes engagement is widespread and long-term investors intervene more; exit is often a last resort."]],"c":[0],"es":"True: long-term investors favour voice and intervene more.","ed":"LGIM's engagement with Glencore (Lecture 8) is a real example of escalation from voice to exit. Passive investors cannot exit, which makes their voice the main lever.","kt":"Voice vs exit: voice = engagement and voting to change a firm; exit = selling the shares (\"Wall Street walk\").","src":"Bok s. 199 (8.2.5) · L8 slide 58 · L8 slide 71"},{"id":"SB180","l":"L5","t":"Engagement","f":"m","d":3,"p":"H","sc":"none","s":"Why does divestment (exit) have less impact than engagement (voice)?","o":[["Sold shares are cancelled","Divested shares are sold to others, not cancelled."],["Someone else just buys the shares","Section 3.3.4 refers back to 1.4.1: divestment has limited impact because others buy the shares."],["Divestment is illegal for EU investors","Divestment is legal and widely used."],["Engagement always works","Engagement can fail; escalation (e.g. LGIM and Glencore) may end in divestment."]],"c":[1],"es":"Sold shares find another owner; voice can change firm policy directly.","ed":"When an investor sells, another investor (possibly one who does not care) becomes the owner, and the price effect is modest (Heinkel, Kraus and Zechner). Engagement (dialogue, voting, shareholder proposals) aims to change firm behaviour directly and is used more by long-term investors. In practice they are combined: engage first, escalate, and divest if engagement fails, as LGIM did with Glencore (Lecture 8). The Gollier and Pouget \"washing machine\" idea (Lecture 9) shows how a large activist can profit by turning irresponsible firms responsible.","kt":"","src":"Bok s. 89 (3.3.4) · Bok s. 21 (1.4.1) · L8 slide 58 · L9 slide 32"},{"id":"SB181","l":"L5","t":"Marking-to-market","f":"m","d":4,"p":"L","sc":"none","s":"Marking-to-market does the most damage for which kind of assets (Plantin, Sapra and Shin, 2008)?","o":[["Long-term, illiquid bank loans","For these, price distortions from illiquidity outweigh the benefits of timely market signals."],["Short-term, liquid assets like stocks","For junior assets in liquid markets, marking-to-market is superior to historical cost."],["All assets equally","The textbook says marking to market is better for liquid junior assets like stocks."],["Cash","These have no meaningful mark-to-market distortion."]],"c":[0],"es":"Marking-to-market harms most for long-lived, illiquid, senior claims (e.g. bank loans).","ed":"In illiquid markets, others' sales depress observed prices beyond fundamentals; under mark-to-market this hurts holders, and short-horizon investors pre-emptively sell, amplifying price falls (endogenous volatility), especially in crises. Historical cost, however, ignores real value changes. Hence: mark-to-market for liquid junior assets (stocks), amortised cost for long-lived, illiquid, senior assets (bank loans, insurance liabilities). The point matters for long-term sustainable investments that are illiquid.","kt":"","src":"Bok s. 93 (3.4.4) · Bok s. 94 (3.4.4)"},{"id":"SB182","l":"L5","t":"Supervisory treatment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Higher capital rules for illiquid private investments than for listed assets can discourage long-term green projects like land restoration.","o":[["True","Correct. Section 3.4.5 explains that liquid assets carry low capital charges while private and direct investments carry higher ones, disadvantaging long-horizon projects that cannot be measured frequently."],["False","Incorrect. Section 3.4.5 explains that liquid assets carry low capital charges while private and direct investments carry higher ones, disadvantaging long-horizon projects that cannot be measured frequently."]],"c":[0],"es":"True: liquidity-biased capital charges penalise long-term, illiquid sustainable projects.","ed":"Supervisory treatment based on marking-to-market, liquidity and efficient markets favours listed, liquid assets. Environmental projects (land restoration ~20 years, energy, roads, coastal defence) are long-horizon and illiquid. The textbook suggests assessing such projects over their full cycle (e.g. with scenario analysis) when institutions hold them to maturity, reducing the illiquidity surcharge. Guideline 5 thus calls for allowing buy-and-hold investments.","kt":"","src":"Bok s. 94 (3.4.5) · L5 slide 30"},{"id":"SB183","l":"L5","t":"Short-termism","f":"m","d":2,"p":"L","sc":"none","s":"What do Davies et al. (2014) find about UK and US stock prices?","o":[["Prices underweight the far future","This suggests significant myopia."],["Prices are perfectly long-term","The evidence points to a myopic bias."],["Prices give too much weight to the future","Under-discounting would indicate the opposite of myopia."],["Short-termism exists only in emerging markets","The evidence concerns UK and US stock prices."]],"c":[0],"es":"Prices over-discounted future dividends by 5-10% (myopia).","ed":"Excessive (myopic) discounting means long-term cash flows, where many sustainability benefits lie, get too little weight in prices. Combined with the tragedy of the horizon, this supports the textbook's incentive-compatible remedies: long-term pay structures, less reliance on marking-to-market and longer evaluation horizons.","kt":"","src":"Bok s. 94 (3.4.5)"},{"id":"SB184","l":"L5","t":"Behavioural biases","f":"m","d":2,"p":"L","sc":"none","s":"An example of collaborative consumption is:","o":[["Buying a car to impress neighbours","This is competitive consumption driven by status."],["Buying a new phone before the old one breaks","This is an example of overconsumption."],["The sharing economy","Collaborative consumption mutualises access to goods and services."],["Expensive parties to show status","This is competitive consumption."]],"c":[2],"es":"Collaborative consumption = sharing economy (shared access instead of individual ownership).","ed":"Competitive consumption (status-driven, e.g. expensive cars and celebrations) and conformist consumption drive overuse of underpriced natural capital. Dasgupta and Ehrlich estimate that if 6.2 billion people in poorer countries consumed like the 1.3 billion in rich countries, at least two more Earths would be needed. Collaborative consumption (sharing cars, bikes, homes via platforms) can reduce resource use; nudging can help communities coordinate on less resource-intensive behaviour.","kt":"","src":"Bok s. 75 (3.1.1) · Bok s. 76 (3.1.1)"},{"id":"SB185","l":"L5","t":"Corporate scandals","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Scandals like Enron, Volkswagen and Olympus show that one regional governance model is better, since scandals only happen in Anglo-Saxon countries.","o":[["True","Incorrect. The textbook states there is no superior corporate governance model: scandals happen in all major regions, revealing classic agency problems."],["False","Correct. The textbook states there is no superior corporate governance model: scandals happen in all major regions, revealing classic agency problems."]],"c":[1],"es":"False: scandals occur in all regions; no governance model is superior.","ed":"Summary of Box 3.1: Enron used accounting loopholes and special purpose entities to hide debt and inflate performance; Volkswagen used defeat devices to cheat US emissions tests; Olympus concealed $1.5 billion of losses for years. All three show managers boosting profits and hiding problems - classic agency problems - under different governance systems. This motivates the governance mechanisms in section 3.3.","kt":"","src":"Bok s. 78 (3.1.2) · Bok s. 79 (Box 3.1)"},{"id":"SB186","l":"L5","t":"Players in sustainability","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about the time horizon of different players is correct?","o":[["Investors always think long-term","Investors range from short to long term; quarterly benchmarking is a threat, not a source of long horizons."],["Governments: up to four years","Table 3.1 lists government horizon as up to four years."],["Households play no role","Households steer corporates and investments through buying decisions and votes."],["Firms have the shortest horizon","Corporates are listed with medium- to long-term horizons."]],"c":[1],"es":"Government horizon is up to four years; investors range from short to long term; corporates and civil society medium to long term.","ed":"Summary of Table 3.1: government (country/global, up to four years, taxation and regulation; threats: shortfall, free-riding, dealing with future generations), civil society (debate, medium to long term, NGOs' public voice), corporates (value chain, medium to long term; threats: short-termism, lobbying, relocating production), investors (short to long term, investment and lending strategy, engagement; threats: short-termism, long investment chains, marking to market), households (consumption, short to long term; threats: poverty, aversion to change).","kt":"","src":"Bok s. 77 (Table 3.1)"},{"id":"SB187","l":"L5","t":"Fiduciary duty","f":"m","d":3,"p":"M","sc":"none","s":"What does the EU expert group recommend about fiduciary duty?","o":[["Limit it to short-term returns only","The clarification broadens the duty to sustainability factors."],["Make it include sustainability","The clarified duty requires incorporating sustainability factors and proactively understanding beneficiaries' sustainability preferences."],["Remove fiduciary duty","The recommendation clarifies, not removes, fiduciary duty."],["Apply it only to banks","It targets institutional investors and their asset managers."]],"c":[1],"es":"Fiduciary duty should explicitly include sustainability factors and beneficiaries' sustainability preferences.","ed":"Fiduciary duty sets out what financial institutions owe their beneficiaries (loyalty, prudence, transparency). The HLEG recommends clarifying in EU directives that sustainability factors must be incorporated in investment strategy, risk management, asset allocation, governance and stewardship, and that all participants in the investment chain proactively seek to understand beneficiaries' sustainability preferences and disclose effects. This echoes Hart and Zingales' call for asset managers to follow investors' preferences.","kt":"","src":"Bok s. 86 (3.3.1) · Bok s. 97 (Key concepts)"},{"id":"SB188","l":"L5","t":"Short-termism","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Fund managers should be judged over the same horizon as their strategy, e.g. three- or five-year averages instead of quarterly results.","o":[["True","Correct. Section 3.4.3 recommends aligning evaluation with the strategy's horizon and refers to Chapter 7's three- or five-year moving averages."],["False","Incorrect. Section 3.4.3 recommends aligning evaluation with the strategy's horizon and refers to Chapter 7's three- or five-year moving averages."]],"c":[0],"es":"True: evaluate long-term strategies over long horizons (e.g. 3-5 years).","ed":"Quarterly relative performance monitoring makes fund managers short-termist (Baker), and passive strategies mean fewer shareholders know any firm's fundamentals. Aligning evaluation with the investment horizon facilitates engagement. Edmans adds that intended holding periods differ from observed ones: a long-term investor may still sell early on new long-term information.","kt":"","src":"Bok s. 92 (3.4.3) · Bok s. 93 (3.4.3)"},{"id":"SB189","l":"L5","t":"Governance summary","f":"m","d":4,"p":"H","sc":"none","s":"Which statement best sums up the governance lecture?","o":[["Stakeholder value always lowers agency costs","The slide warns that it can increase agency costs."],["Governance is irrelevant to sustainability","The lecture shows governance is central to sustainability."],["Stakeholder focus adds value but raises agency costs","This combines the three points on the summary slide."],["Shareholder value already prices in all externalities","The lecture stresses that externalities are not fully internalised."]],"c":[2],"es":"Stakeholder focus can create shareholder value, but a stakeholder objective risks higher agency costs; rethink governance to protect shareholders.","ed":"Summary of slide 45: (1) focusing on stakeholder value can help create shareholder value, e.g. firms internalising externalities ex ante; (2) defining the firm's objective as stakeholder value maximisation can increase agency costs by increasing subjectivity and room for manipulation (moral hazard, greenwashing); (3) the transition requires careful rethinking of governance to ensure shareholder protection. This mirrors Jensen's critique and the textbook's guidelines.","kt":"","src":"L5 slide 45 · L5 slide 27-28"},{"id":"SB190","l":"L5","t":"Forces for change","f":"m","d":3,"p":"M","sc":"short","s":"Climate lawsuits such as Milieudefensie v Shell (2021) are increasing. What does this mean for investors?","o":[["Stop all engagement","Litigation risk is a reason to engage on transition plans."],["Inaction carries more legal risk","Litigation makes externalities and governance failures financially material."],["All oil firms will soon go bankrupt","Litigation increases risk but does not imply certain bankruptcy."],["Courts cannot affect firms","Court orders and damages can affect strategy and value."]],"c":[1],"es":"Litigation is a force for change that makes inaction costly.","ed":"Lecture 5 contrasts forces that maintain the status quo (short-termism, incentives) with forces for change (litigation, regulation, investor pressure). Investors can ask boards how they manage legal climate risk and whether transition plans are credible.","kt":"Climate litigation: legal action against firms or governments over climate change, e.g. demanding emission cuts or damages.","src":"L5 slide 25"},{"id":"SB191","l":"L5","t":"Governance models","f":"m","d":3,"p":"M","sc":"none","s":"The textbook wants to \"combine the best of both worlds\". Which strength of a model is being combined?","o":[["The shareholder model's long horizon","The shareholder model is criticised for focusing too heavily on short-term shareholder interests."],["The stakeholder model's broad view","The stakeholder model's strength is its breadth."],["The stakeholder model's takeover market","Takeover discipline is weaker in stakeholder/civil law systems."],["Takeover defences","Takeover defences reduce market discipline and may lower the share price."]],"c":[1],"es":"Combine shareholder-model accountability (takeovers, removal) with the stakeholder model's breadth.","ed":"The shareholder model offers accountability (limited-term contracts, performance pay, takeovers after underperformance) but can focus too heavily on short-term shareholder interests. The stakeholder model incorporates all interests but entrenches management. General takeover defences (certified or priority shares) reduce market discipline and may lower the share price, so the textbook instead proposes a societal cost-benefit test for takeovers based on integrated value. Also true, but not offered as an option here: The shareholder model's accountability, with removal of management or a takeover possible after structural underperformance.","kt":"","src":"Bok s. 84 (3.3) · Bok s. 85 (3.3.1)"},{"id":"SB192","l":"L5","t":"Integrated reporting and investor base","f":"m","d":3,"p":"M","sc":"none","s":"How can firms attract long-term investors (Knauer and Serafeim, 2014)?","o":[["Through integrated thinking and reporting","Firms need not take their investor base as given; integrated reporting attracts long-term investors."],["By beating quarterly earnings forecasts","This would attract short-term investors."],["By big annual bonuses tied to the share price","This reinforces short-termism."],["By listing on many exchanges","Trading volume is not the mechanism discussed."]],"c":[0],"es":"Integrated thinking and reporting credibly signal long-term commitment and attract long-term investors.","ed":"A company is not stuck with its investor base. By adopting integrated thinking and reporting, top leadership credibly communicates its commitment to long-term value creation and strong stakeholder relationships, which attracts investors with longer horizons and better aligns incentives with the strategy. This is guideline 2's point that integrated reporting increases transparency and accountability.","kt":"","src":"Bok s. 92 (3.4.1) · Bok s. 87 (3.3.2)"},{"id":"SB193","l":"L5","t":"Governance of sustainability","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A mining firm wants its board to be accountable for cutting emissions over ten years, without greenwashing. What is the best measure?","o":[["Quarterly emission targets","Quarterly targets reinforce short-termism for a ten-year goal."],["A yearly bonus judged by the CEO herself","Vague, discretionary, short-term targets are exactly the criticised design."],["Pay for audited multi-year cuts","Strategic, measurable, long-term targets with deferral address the weaknesses of current ESG pay."],["Use only the share price","New risks may not be priced (AMH), and emissions are an externality."]],"c":[2],"es":"Long-term, audited, quantitative ESG pay with deferral and clawback, plus board oversight of assured reporting.","ed":"Agency theory says align incentives and reduce information asymmetry. Lecture 5 shows ESG pay often fails because targets are short-term, vague and opaque, and correlations with outcomes are weak. A robust design uses strategic, quantitative, long-term targets (cf. Starbucks' three-year modifier), deferral and clawback, combined with board monitoring (sustainability or audit committee) and audited reporting under mandatory standards (CSRD, Lecture 7). These measures make accountability credible and limit greenwashing. Also true, but not offered as an option here: Give a board sustainability committee (or the audit committee) responsibility for overseeing verified sustainability reporting.","kt":"","src":"L5 slide 9 · L5 slide 19 · L5 slide 36-37 · L5 slide 44 · L7 slide 20 · Bok s. 87 (3.3.2)"},{"id":"TR20","l":"L5","t":"Agency problems with debt","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A heavily indebted firm skips a profitable energy-saving project because most of the gain would go to creditors. This is:","o":[["Adverse selection","The problem arises after the debt exists, so it is moral hazard."],["Debt overhang (underinvestment)","With high debt, shareholders bear the cost but creditors get much of the benefit."],["Asset substitution (too much risk)","Asset substitution is choosing riskier projects, not skipping good ones."],["The lemons problem","That is an adverse selection example, not this case."]],"c":[1],"es":"High debt makes shareholders skip positive-NPV projects = debt overhang.","ed":"The lecture's example: a project costs 10m and pays 15m (NPV 5m), but with 12m of debt the shareholders keep only 3m, so they may forgo it. Debt overhang and asset substitution are both moral hazard problems; banks and bond covenants try to limit them.","kt":"","src":"Opptak L5 ca. 22 min · Opptak L10 ca. 15 min"},{"id":"TR21","l":"L5","t":"Board monitoring","f":"m","d":2,"p":"M","sc":"c
