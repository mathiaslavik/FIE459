rates or Glassdoor scores.","kt":"","src":"Bok s. 155 (6.2.2) · Bok s. 155 (6.2.3)"},{"id":"SB242","l":"L7","t":"Metrics and value drivers","f":"m","d":3,"p":"H","sc":"none","s":"Figures 6.1 and 6.2 in the textbook show value driver trees for Novozymes and a mining company. Which comparison is correct?","o":[["Novozymes: human capital drives innovation; miner: stakeholder management protects the licence.","This is the contrast drawn in section 6.2.4."],["Both trees have exactly the same ESG drivers, because materiality does not depend on industry.","The point of the comparison is that the drivers differ."],["For Novozymes, management of local stakeholders near its plants is the main value driver.","That is the mining company's tree."],["For the miner, innovation driven by human capital is the main value driver, as for most industrial firms.","That is Novozymes' tree."]],"c":[0],"es":"Different industries have different material ESG drivers feeding into growth, margins and capital.","ed":"At Novozymes, growth and margins come from innovation, which depends on human capital. At a mining company, price and production volume drive sales, while management of local stakeholders and environmental management are key to the licence to operate; losing it wastes decades of capital (Barrick's Pascua Lama, Anglo American's Minas Rio). Mapping material ESG issues onto value drivers in this bottom-up way is how metrics become relevant for valuation (Lecture 9).","kt":"","src":"Bok s. 155 (6.2.4) · Bok s. 156 (Figure 6.1) · Bok s. 156 (Figure 6.2)"},{"id":"SB243","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: An investor asks a shipping company specifically how climate change could affect its finances, how the board oversees this, and how it performs under a 2°C scenario. Which framework fits this request best?","o":[["A materiality matrix alone","A matrix does not provide scenario analysis or governance disclosure."],["Integrated Reporting (<IR>)","<IR> covers value creation across six capitals, not specifically climate scenarios."],["TCFD","TCFD covers governance, strategy (incl. scenarios), risk management, metrics and targets for climate-related financial risks."],["GRI","GRI focuses on impacts on economy, environment and people for all stakeholders."]],"c":[2],"es":"Climate-related financial risk + board oversight + scenarios = TCFD.","ed":"GRI suits impact reporting to stakeholders, <IR> suits explaining value creation across capitals, CDP collects environmental data via its platform. TCFD's structure now underlies ISSB (IFRS S2) and ESRS E1.","kt":"TCFD: climate-related financial disclosures in four pillars - governance, strategy, risk management, metrics and targets.","src":"L7 slide 4 · L7 slide 16-17"},{"id":"SB244","l":"L7","t":"Reporting frameworks","f":"m","d":2,"p":"M","sc":"none","s":"According to the comparison on Lecture 7, slide 4, how do TCFD and CDP differ in where disclosures are made?","o":[["TCFD is reported on the CDP website, while CDP data must be in the audited financial statements.","The two are reversed."],["TCFD disclosures go in annual financial filings; CDP uses its own online reporting platform.","Slide 4 lists exactly this difference."],["Neither requires any public disclosure; both are internal management tools.","Both are disclosure frameworks."],["Both are reported only in stand-alone CSR reports.","TCFD aims for mainstream annual filings; CDP has its own platform."]],"c":[1],"es":"TCFD: annual financial filings; CDP: online platform, aligned with TCFD.","ed":"Summary of slide 4: TCFD targets investors and companies, covers climate-related disclosure and governance, uses a materiality approach consistent with how companies assess other information, and asks for disclosure in annual financial filings. CDP targets investors, companies, cities, states and regions, covers carbon, water, forests and supply chain, is aligned with TCFD and uses its own platform. CDP's self-reported data (e.g. Philips' carbon data) feed many ESG datasets.","kt":"","src":"L7 slide 4 · L7 slide 18-19 · Bok s. 170 (6.4)"},{"id":"SB245","l":"L7","t":"TCFD","f":"m","d":2,"p":"H","sc":"none","s":"The TCFD recommendations are organised around four thematic areas. Which is among them?","o":[["Product pricing","Not a TCFD area."],["Governance","One of the four areas: the board's oversight of climate-related risks and opportunities."],["Employee diversity","TCFD is climate-specific."],["Dividend policy","Not a TCFD area."]],"c":[1],"es":"Governance, strategy, risk management, metrics and targets.","ed":"TCFD (set up by the Financial Stability Board, chaired by Michael Bloomberg) recommends disclosure on governance, strategy, risk management, and metrics and targets for climate-related risks (physical and transition) and opportunities. A key element is scenario analysis: reporting likely financial outcomes under a 2 degrees scenario versus the current trajectory. The ISSB's IFRS S2 and the CSRD's ESRS E1 build on the TCFD structure. Also correct: Metrics and targets.","kt":"","src":"L7 slide 16-17 · Bok s. 173 (6.5)"},{"id":"SB246","l":"L7","t":"Integrated reporting","f":"m","d":2,"p":"H","sc":"none","s":"How does the IIRC (2013) define an integrated report?","o":[["A concise communication on how strategy and governance lead to value creation.","The full definition adds \"in the context of its external environment\" and \"over the short, medium and long term\"."],["A stand-alone CSR report issued alongside the annual report for non-investor stakeholders.","This is the silo approach that IR replaces."],["A mandatory EU report covering taxonomy alignment of revenues and capex.","This describes EU Taxonomy disclosures under CSRD."],["A complete compilation of all the company's financial and non-financial data in one very long document.","The IIRC stresses conciseness; companies that think IR means disclosing everything in one place misunderstand it."]],"c":[0],"es":"IR: concise communication on how strategy, governance, performance and prospects create value over the short, medium and long term.","ed":"IR evolved from the 1990s silo approach (financial report for investors, CSR report for \"society\") towards \"One Report\" (Eccles and Krzus, 2010). The IIRC was founded in 2010. Eccles and Saltzman define IR more simply as a single document presenting financial and ESG performance; in practice reports mix both definitions. The real goal is integrated thinking: taking into account the connectivity and interdependencies between factors affecting value creation over time.","kt":"","src":"L7 slide 8-9 · Bok s. 157 (6.3.1) · Bok s. 173 (Key concepts)"},{"id":"SB247","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A hospital group prepares an integrated report. Which item is correctly classified?","o":[["Nurses' skills, health and motivation - human capital","Competencies and motivation of people."],["Patents on diagnostic software - natural capital","Patents are intellectual capital."],["Hospital buildings - intellectual capital","Buildings are manufactured capital."],["Cash reserves - social and relationship capital","Cash is financial capital."]],"c":[0],"es":"People = human capital; relationships and trust = social and relationship capital.","ed":"IR adds intellectual, human, social and relationship, and natural capital to the two traditionally reported capitals. The aim is integrated thinking about how capitals interact to create value over time. Also correct: Trust and relationships with local communities and patients - social and relationship capital.","kt":"Six capitals (IIRC): financial, manufactured, intellectual, human, social and relationship, natural.","src":"L7 slide 10 · Bok s. 159 (6.3.1.1)"},{"id":"SB248","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"The IIRC framework lists seven guiding principles and eight content elements. Which of the following is a guiding PRINCIPLE rather than a content element?","o":[["Business model and value creation","This is content element 3."],["Outlook and uncertainties","This is content element 7."],["Connectivity of information","A guiding principle: a holistic picture of interrelated factors."],["Risks and opportunities","This is content element 4."]],"c":[2],"es":"Principles: strategic focus, connectivity, stakeholder relationships, materiality, conciseness, reliability and completeness, consistency and comparability.","ed":"The seven guiding principles shape how the report is prepared and presented: strategic focus and future orientation; connectivity of information; stakeholder relationships; materiality; conciseness; reliability and completeness; consistency and comparability. The eight content elements say what it should contain: organisational overview and external environment; governance; business model; risks and opportunities; strategy and resource allocation; performance; outlook; basis of presentation. The textbook rates Philips against both (Tables 6.3-6.4).","kt":"","src":"L7 slide 11 · Bok s. 160 (6.3.1.2) · Bok s. 161 (6.3.1.2)"},{"id":"SB249","l":"L7","t":"Integrated reporting","f":"t","d":3,"p":"L","sc":"none","s":"True or false: In the textbook's assessment of Philips' 2016 integrated report (Table 6.3), the principle of conciseness is NOT met, because the report is still 226 pages long.","o":[["True","Correct. Table 6.3 marks conciseness with an X: the report is \"still (too) long with 226 pages\"."],["False","Incorrect. Table 6.3 marks conciseness with an X: the report is \"still (too) long with 226 pages\"."]],"c":[0],"es":"True: Philips fails on conciseness.","ed":"Philips scores well on strategic focus, connectivity, stakeholder relationships, materiality (a matrix of 27 ESG issues) and consistency, but fails on conciseness and only partly meets reliability and completeness (it refers to natural and financial capital but not the other four). Table 6.4 adds that the business model is mentioned 11 times but not visualised, and risk is mentioned 399 times versus opportunities 32 times.","kt":"","src":"Bok s. 164 (Table 6.3) · Bok s. 165 (Table 6.4)"},{"id":"SB250","l":"L7","t":"Six capitals balance sheet","f":"m","d":4,"p":"H","sc":"none","s":"In the textbook's mining example, moving from a market value balance sheet to a six capitals balance sheet adds large negative natural capital. What happens to the company's picture?","o":[["Integrated equity falls and leverage rises: the firm looks much riskier.","Environmental liabilities hidden from markets now count."],["Debt disappears from the balance sheet.","Debt stays; natural capital liabilities are added."],["Nothing changes; the balance sheets are equivalent.","The six capitals view changes equity and leverage substantially."],["Equity rises because more capitals are added.","Negative natural capital outweighs the added capitals."]],"c":[0],"es":"Counting natural capital liabilities lowers integrated equity and raises leverage.","ed":"Market prices often ignore externalities, so a firm can look \"safe\" on a market basis but \"risky\" on a six capitals basis. The drawback is that each capital rests on many assumptions; no company publishes such a balance sheet yet.","kt":"Six capitals balance sheet: a balance sheet valuing financial, manufactured, intellectual, human, social and natural capital, including negative capital (e.g. environmental damage).","src":"Bok s. 166 (Figure 6.6) · Bok s. 167 (6.3.2.2)"},{"id":"SB251","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"H","sc":"none","s":"According to Table 6.2 in the textbook, which framework is aimed at ALL stakeholders, with investors not privileged?","o":[["SASB","SASB targets investors of companies issuing registered securities."],["IFRS","IFRS targets existing and potential investors, lenders and other creditors."],["<IR>","<IR> targets providers of financial capital and others interested in value creation."],["GRI","GRI follows a stakeholder approach; investors are not privileged."]],"c":[3],"es":"GRI = all stakeholders; IFRS = investors and creditors; <IR> = providers of financial capital; SASB = investors (industry-specific).","ed":"Summary of Table 6.2: IFRS covers financial performance and position, materiality defined by influence on users' decisions. <IR> covers value creation over time, using a multistep materiality process, principles based. GRI covers sustainability impacts on the economy, environment and society for all stakeholders, standards based, and requires reporting of issues material to society (e.g. water in water-scarce areas even if impact is small). SASB is very industry specific, identifying a minimum set of topics likely material to most companies in an industry.","kt":"","src":"Bok s. 157 (6.3) · Bok s. 158 (Table 6.2) · Bok s. 162 (6.3.1.3)"},{"id":"SB252","l":"L7","t":"Reporting frameworks","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The textbook characterises the IIRC as more rules based, the GRI as more principles based, and the SASB as industry agnostic.","o":[["True","Incorrect. It is the reverse: the IIRC is more principles based, the GRI more standards (rules) based, and the SASB very industry specific."],["False","Correct. It is the reverse: the IIRC is more principles based, the GRI more standards (rules) based, and the SASB very industry specific."]],"c":[1],"es":"False: IIRC principles based, GRI standards based, SASB industry specific.","ed":"The IIRC framework is the easiest to apply across industries because it is principles based. The GRI's 2016 standards (GRI 101 Foundation, 102 General Disclosures, 103 Management Approach) are more rigid but offer greater comparability. SASB develops industry-specific standards (79 industries in 11 sectors as of 2018) selecting topics that are relevant across an industry, can affect value creation, are actionable, of interest to investors and reflect stakeholder consensus.","kt":"","src":"Bok s. 157 (6.3) · Bok s. 161 (6.3.1.3) · Bok s. 162 (6.3.1.4)"},{"id":"SB253","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"L","sc":"none","s":"Which is among SASB's criteria for selecting material sustainability topics?","o":[["Linked to at least three SDGs","Not a SASB criterion."],["Relevant across an industry","One of the five criteria."],["Approved by the company's auditor before publication","Not a SASB selection criterion."],["Relevant to society even if there is no impact on the company","This reflects GRI's sustainability context, not SASB."]],"c":[1],"es":"Relevant across an industry; potential to affect value creation; actionable; of interest to investors; reflective of stakeholder consensus.","ed":"SASB's financial materiality focus means a topic qualifies if it is relevant across the industry, has potential to affect value creation, is actionable for companies, is of interest to investors and reflects stakeholder consensus. This is why its materiality map (Lecture 6) varies by industry. GRI, by contrast, asks for topics material to society (impact materiality); together they form double materiality. Also correct: Potential to affect value creation.","kt":"","src":"Bok s. 162 (6.3.1.4) · L6 slide 50-51"},{"id":"SB254","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"Lecture 7 (slide 13) compares four categories: no ESG reporting, stand-alone ESG reporting, ESG reporting in the annual report, and <IR>. What does the cited study conclude?","o":[["<IR> beats some forms, but a switch from stand-alone ESG reports adds nothing.","These are the two conclusions on slide 13."],["<IR> is inferior to all other forms of reporting because of its high preparation costs.","The study finds <IR> superior to two of the categories."],["Companies always benefit from switching from stand-alone ESG reporting to <IR>.","The slide states that they do not."],["No ESG reporting is the best option, because reporting costs exceed any benefit.","No ESG reporting is found to be inferior to <IR>."]],"c":[0],"es":"<IR> beats no reporting and ESG-in-annual-report, but not stand-alone ESG reporting.","ed":"Slide 13 shows <IR> is superior to \"no ESG reporting\" and \"ESG reporting in annual report\", but firms do not benefit from switching from stand-alone ESG reporting to <IR>. The textbook cites Barth et al. (2017): IR quality is positively associated with stock liquidity (bid-ask spreads) and firm value (Tobin's Q), consistent with better external information and better internal decisions. Most IR research, however, is normative rather than empirical (Dumay et al., 2016).","kt":"","src":"L7 slide 13 · Bok s. 163 (6.3.2)"},{"id":"SB255","l":"L7","t":"Mandatory vs voluntary reporting","f":"m","d":3,"p":"H","sc":"short","s":"In 2023 the US SEC fined asset manager DWS USD 19 million for misstatements about how it integrated ESG into investments. Which lesson from Lecture 7 does this case support?","o":[["ESG claims by asset managers never need to be verified.","The fine shows claims are checked."],["Purely voluntary claims enable greenwashing; enforced rules are needed.","Lecture 7 argues for a mix of voluntary and mandatory, verified reporting."],["Greenwashing only happens at small firms.","DWS is a large, Deutsche Bank-owned asset manager."],["Regulators cannot act against ESG misstatements.","The SEC did exactly that."]],"c":[1],"es":"Misleading ESG claims → enforcement; supports mandatory, verifiable disclosure.","ed":"Greenwashing is a material risk for asset managers (selling practices and product labelling in SASB). EU rules (SFDR, CSRD, the Green Claims agenda) and assurance requirements aim to reduce it; 94% of investors think reports contain unsupported claims (PwC).","kt":"Greenwashing: making misleading claims about environmental or sustainability performance.","src":"L7 slide 26 · L8 slide 19 · PwC s. 30"},{"id":"SB256","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"Which does the textbook list as a BARRIER to adopting integrated reporting?","o":[["Status quo bias: people prefer to do things the way they always have.","A behavioural barrier in section 6.3.3."],["A lower cost of capital from greater transparency.","This is an incentive (Dhaliwal et al., 2011)."],["Attracting long-term investors, as in the Shire case.","This is an incentive (Knauer and Serafeim, 2014)."],["Keeping up with peers that already report in an integrated way.","\"Keeping up with the Joneses\" is an incentive."]],"c":[0],"es":"Barriers: status quo bias, competitive sensitivity, misunderstanding, legal risk, lack of data, lack of assurance standards.","ed":"Incentives include a genuine desire to report accurately, stronger internal reporting, lower cost of capital, higher valuation and liquidity, reputation, catering to investors (like dividends, Shefrin and Statman), attracting long-term investors (Shire) and copying peers. Barriers include status quo bias, competitive sensitivity, the misunderstanding that IR means disclosing everything in one place, litigation risk, missing data, and lack of auditor skills and international assurance standards. A further shortcoming: IR rarely relates performance to system thresholds (only 5% mention ecological limits). Also correct: Fear of disclosing competitively sensitive information or increasing litigation risk.","kt":"","src":"Bok s. 167 (6.3.3) · Bok s. 168 (Table 6.5)"},{"id":"SB257","l":"L7","t":"Integrated reporting","f":"m","d":4,"p":"M","sc":"none","s":"The textbook argues that IR \"basically measures the net impact of a company on its capitals ... without relation to the relevant system threshold\". Why is that a problem?","o":[["Eco-efficiency is a stricter criterion than eco-effectiveness.","Eco-effectiveness is stricter, because it relates impact to absolute limits."],["IR measures system thresholds but not company impact.","The reverse: IR measures company impact but not the thresholds."],["Improving efficiency does not show the firm stays within its budget.","Judging sustainability requires comparing impact with the system threshold."],["System thresholds are already fully reflected in market prices, so IR double-counts them.","Externalities are largely unpriced; that is the problem."]],"c":[2],"es":"Without a system threshold, IR shows improvement (efficiency) but not whether impact is within planetary limits (effectiveness).","ed":"In Equation 4.1 (Chapter 4), sustainability is the company's impact (numerator) relative to the relevant threshold such as a carbon budget (denominator). IR reports the numerator only. A firm can cut emissions every year and still exceed its fair share of the budget. Bjørn et al. (2017) find only 5% of companies mention ecological limits and only 0.3% integrate them into strategy. Lecture 13 (transition) returns to this system view.","kt":"","src":"Bok s. 168 (6.3.3)"},{"id":"SB258","l":"L7","t":"Integrated reporting","f":"m","d":4,"p":"M","sc":"none","s":"Flower (2015) calls the IIRC \"a story of failure\". Which reason does he give?","o":[["It requires firms to publish a fully monetised six capitals balance sheet.","No such requirement exists; no firm has published one."],["Its concept of value is value for investors, and harm to outsiders need not be reported.","These are Flower's two main considerations."],["It focuses too much on society and too little on the information needs of capital providers.","Flower argues the opposite."],["It was founded by environmental NGOs who ignored the accounting profession.","He claims the council is dominated by the accounting profession and multinationals (regulatory capture)."]],"c":[1],"es":"Flower: IIRC value = value for investors, no duty to report external harm, regulatory capture.","ed":"Flower argues the IIRC abandoned sustainability accounting: value is \"value for investors\", and harm to outsiders without impact on the firm need not be reported. He also sees regulatory capture by accountants and multinationals and expects little impact due to lack of force. Thomson adds that IR serves investors' wealth, not societal prosperity. The textbook finds this harsh: value for society is not yet well defined, and evolution rather than revolution is needed. On the positive side, IR increases meaning (Adams and Simnett) and proxies for management quality (Churet and Eccles).","kt":"","src":"Bok s. 169 (6.3.4) · Bok s. 170 (6.3.4)"},{"id":"SB259","l":"L7","t":"Integrated reporting","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Churet and Eccles (2014) interpret integrated reporting as a useful proxy for the overall quality of a company's management.","o":[["True","Correct. They argue firms able to articulate the relevance of sustainability for long-term success are best equipped to manage it, so IR proxies management quality."],["False","Incorrect. They argue firms able to articulate the relevance of sustainability for long-term success are best equipped to manage it, so IR proxies management quality."]],"c":[0],"es":"True: IR is seen as a proxy for management quality.","ed":"On the \"success\" side of the debate, Eccles and Saltzman note growing attention to IR; Adams and Simnett argue it makes reporting more meaningful; Churet and Eccles see it as a proxy for management quality; and Ortiz-de-Mandojana and Bansal find firms with responsible practices have lower volatility, higher growth and better survival over 15 years. Weak points remain: limited assurance and investor focus.","kt":"","src":"Bok s. 169 (6.3.4)"},{"id":"SB260","l":"L7","t":"Mandatory reporting","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A large Norwegian seafood company in scope of the CSRD finds that its farms harm wild salmon (high impact) but this barely affects its own finances today. Should it report on the issue under the CSRD?","o":[["Only if an NGO asks for it.","Reporting is required by the double materiality assessment, not by requests."],["Yes: double materiality includes impact materiality.","An issue is material if it is material from an impact OR a financial perspective."],["No: only financially material issues are reported.","That is single (financial) materiality, e.g. SASB/ISSB."],["No: environmental impacts are covered only by GRI, which is voluntary.","ESRS require impact materiality as well."]],"c":[1],"es":"Under CSRD, high impact alone makes the issue reportable.","ed":"Impact materiality can turn into financial materiality over time (dynamic materiality), for example through stricter licences. The Omnibus has narrowed which firms are in scope, but the principle for in-scope firms is unchanged.","kt":"Double materiality: report an issue if it affects the company's value (financial materiality) or if the company significantly affects people or the environment (impact materiality).","src":"L7 slide 23-25 · PwC s. 29 · L6 slide 50"},{"id":"SB261","l":"L7","t":"Mandatory reporting","f":"m","d":2,"p":"H","sc":"none","s":"According to Lecture 7, which is a goal of the EU Taxonomy for sustainable activities?","o":[["Protect investors from greenwashing","Listed on slide 21."],["Replace credit ratings for EU banks","Not a goal of the taxonomy."],["Ban all investment in fossil fuel companies in the EU","The taxonomy is a classification system, not a ban."],["Set mandatory ESG ratings for all listed firms","The taxonomy defines sustainable activities; it does not rate firms."]],"c":[0],"es":"Meet EU 2030 climate targets and Green Deal objectives, protect investors from greenwashing, help companies become climate-friendly, mitigate fragmentation and shift investment.","ed":"The EU Taxonomy gives companies, investors and policymakers definitions of which economic activities can be considered environmentally sustainable. Its goals: meet the EU's 2030 climate and energy targets and the Green Deal objectives, protect investors from greenwashing, help companies become more climate-friendly, and mitigate market fragmentation while shifting investment where needed. Companies under CSRD disclose taxonomy alignment (Article 8 of the Taxonomy Regulation) of turnover, capex and opex. Also correct: Help shift investments to where they are most needed and mitigate market fragmentation.","kt":"","src":"L7 slide 21-22 · PwC s. 32"},{"id":"SB262","l":"L7","t":"Effects of reporting","f":"m","d":3,"p":"H","sc":"none","s":"According to the review of greenwashing research on Lecture 7, slide 26, how could greenwashing best be prevented?","o":[["By banning all sustainability claims by companies.","The review does not propose a ban; it proposes mixing voluntary and mandatory reporting."],["By keeping CSR reporting entirely voluntary, since market discipline is sufficient.","The entirely voluntary approach is found to facilitate greenwashing."],["By relying solely on ESG rating agencies to verify claims.","Ratings are themselves criticised as inconsistent and unreliable."],["By combining voluntary and mandatory reporting elements.","The review finds the entirely voluntary approach facilitates greenwashing."]],"c":[3],"es":"An entirely voluntary approach facilitates greenwashing; a voluntary-mandatory mix is proposed.","ed":"When reporting is voluntary, firms choose what to disclose, which allows selective and misleading claims. The review proposes a mix of voluntary and mandatory aspects. This connects to the PwC guest lecture (94% of investors think reports contain unsupported claims; CSRD aims to end greenwashing) and to the HBR critique on slides 30-31 (lack of mandates and auditing; sustainability reports must be mandated and audited).","kt":"","src":"L7 slide 26 · L7 slide 30-31 · PwC s. 30"},{"id":"SB263","l":"L7","t":"Effects of reporting","f":"m","d":4,"p":"M","sc":"none","s":"Lecture 7 discusses Krueger, Sautner, Tang and Zhong (2021) on mandatory ESG disclosure around the world. Which finding best summarises the paper?","o":[["Mandates improve ESG information and reduce negative ESG incidents and crash risk.","The paper finds positive capital market and real effects of mandatory disclosure."],["Mandatory ESG disclosure increases the frequency of negative ESG incidents.","Negative incidents decline after mandates."],["Mandatory ESG disclosure has no effect on the information available to investors.","The paper finds improved availability and quality of ESG disclosure."],["Mandatory ESG disclosure only matters for firms that already report voluntarily at a high level.","Effects are concentrated where information was poorer before mandates."]],"c":[0],"es":"Mandates raise disclosure quantity and quality and reduce negative ESG incidents and stock price crash risk.","ed":"Using country-level mandates across many countries, Krueger et al. find that mandatory ESG disclosure increases the availability and quality of ESG disclosures (e.g. fewer differences in ratings), reduces the likelihood of negative ESG incidents and stock price crash risk. This supports the argument for mandatory, audited reporting such as the CSRD and is in line with Starks' discussion of the value of better ESG information.","kt":"","src":"L7 slide 27-29"},{"id":"SB264","l":"L7","t":"Effects of reporting","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A retailer announces \"net zero by 2050\" with no interim targets, counts only its own stores' emissions (scope 1 and 2), and buys cheap offsets. Its scope 3 supply chain is 95% of emissions. Which problems from the HBR critique does this show?","o":[["Excessive attention to developing countries","Not the issue here."],["Overly strict definitions of sustainability","Definitions are too loose, if anything."],["Specious targets and opaque supply chains","Distant targets without interim steps and ignoring scope 3."],["Too much auditing and excessive mandates","The problem is the opposite."]],"c":[2],"es":"Distant targets + ignoring scope 3 = specious targets and opaque supply chains.","ed":"The HBR prescription is \"measure less, better\", with mandated and audited reports. Analysts should check interim targets, scope coverage and reliance on offsets, as PwC also stresses (\"fluffy targets no longer stand\").","kt":"Scope 3 emissions: indirect emissions across the value chain (suppliers and product use), often the largest share.","src":"L7 slide 30 · L7 slide 7 · PwC s. 24"},{"id":"SB265","l":"L7","t":"ESG ratings","f":"m","d":2,"p":"M","sc":"none","s":"The textbook classifies sustainability data providers along two dimensions (Table 6.6). Where does MSCI or Sustainalytics fit?","o":[["Topic-focused provider of raw data","Southpole (emissions data) is the example here."],["Topic-focused provider of ratings or advice","Equileap (gender), ISS and Glass Lewis (voting advice) are examples here."],["Comprehensive provider of scores/ratings","They score companies on all topics."],["Comprehensive provider of raw data","RepRisk (news tracking) is the example here."]],"c":[2],"es":"Dimensions: raw data vs scores/ratings/advice; topic-focused vs comprehensive. MSCI, Sustainalytics = comprehensive scores.","ed":"Topic-focused providers aim for the deepest data on one area (Southpole emissions, Equileap gender, ISS and Glass Lewis proxy voting). Comprehensive providers (MSCI, Sustainalytics, RobecoSAM, oekom/ISS ESG) score firms on all topics and need more scale. Scores are typically weighted averages of many items, with points for policies and penalties for controversies. Data providers add comparability and stimulate better reporting, but ratings are starting points, not final verdicts.","kt":"","src":"Bok s. 170 (6.4) · Bok s. 171 (Table 6.6) · L7 slide 32"},{"id":"SB266","l":"L7","t":"ESG ratings","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: Two rating agencies have the same E, S and G pillar scores for a company. Agency 1 weights governance heavily; agency 2 weights environment heavily. The company is strong on G but weak on E. What happens?","o":[["Agency 2 rates it higher, since environment is always weighted most.","The company is weak on E, so heavy E weight lowers its score."],["Both give the same overall rating, since data are identical.","Weights change the overall score."],["Ratings cannot differ unless the raw data differ.","Methodology (weights) is a major source of divergence."],["Agency 1 rates it higher: weights alone create divergence.","Different weights on the same data produce different overall scores."]],"c":[3],"es":"Weighting choices drive rating divergence.","ed":"This is one reason ESG ratings correlate poorly (Berg, Kölbel and Rigobon; Kotsantonis). Investors should understand what a rating weights before relying on it.","kt":"Rating divergence: different ESG ratings for the same firm, driven by differences in scope, measurement and weights.","src":"Bok s. 171 (Figure 6.7) · L7 slide 36-37 · Fondsfinans s. 16"},{"id":"SB267","l":"L7","t":"ESG ratings","f":"m","d":3,"p":"H","sc":"none","s":"According to Kotsantonis (2019), \"Four Things No One Will Tell You About ESG Data\" (Lecture 7), how does disagreement among ESG data providers relate to the amount of publicly available information?","o":[["Disagreement increases with the quantity of publicly available information.","Slide 37 states this counter-intuitive finding."],["Disagreement disappears once firms publish enough standardised information for providers.","More information gives providers more room to interpret differently."],["Disagreement only exists for firms that publish no ESG information.","Disagreement is large and increases with disclosure."],["Disagreement is unrelated to the amount of information that firms make public.","The slide states a positive relation."]],"c":[0],"es":"More disclosure → more disagreement among ESG data providers.","ed":"Slide 37 lists variety and inconsistency in how companies report, the crucial role of benchmarking (peer group choice) in rankings, large disagreements among providers, and that disagreement increases with the quantity of public information. Starks (2023) and Berg, Kölbel and Rigobon trace divergence to scope, measurement and weights. Implication: ratings are inputs for analysis, not verdicts, and standardised mandatory disclosure is needed.","kt":"","src":"L7 slide 37 · Starks s. 1843"},{"id":"SB268","l":"L7","t":"ESG ratings","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: An oil company receives a high ESG rating from one provider, which ranks it against oil and gas peers, and a low rating from another, which ranks it against all companies. What does this illustrate?","o":[["One of the providers must have made an arithmetic error.","Both ratings can be internally consistent with different methodologies."],["The choice of peer group can drive the rating as much as performance.","Slide 37 says benchmarking is crucial in determining a company's ranking."],["ESG ratings always measure absolute environmental impact, so the two cannot both be right.","Industry-relative ratings measure performance relative to peers."],["The oil company is clearly greenwashing.","The difference arises from methodology, not necessarily from misleading claims."]],"c":[1],"es":"Industry-relative vs absolute benchmarking can produce very different ratings for the same firm.","ed":"\"best-in-class\" ratings compare a firm with industry peers, so an oil major can score well while still having a large absolute footprint. Absolute ratings compare across industries. Investors must understand what a rating measures (risk to the firm vs impact on the world, relative vs absolute) before using it. This connects to best-in-class screening and rating divergence in Lectures 8 and 9.","kt":"","src":"L7 slide 37 · L7 slide 36"},{"id":"SB269","l":"L7","t":"ESG ratings","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook warns that although ESG data and ratings are only starting points for analysis, many investors are tempted to take them at face value as the final verdict on a company, and many automatically follow proxy advisors' voting recommendations.","o":[["True","Correct. Section 6.4 makes exactly this warning, adding that the challenge is distinguishing material from immaterial issues."],["False","Incorrect. Section 6.4 makes exactly this warning, adding that the challenge is distinguishing material from immaterial issues."]],"c":[0],"es":"True: ratings are starting points, but investors often treat them as verdicts.","ed":"Data providers supply previously unavailable, more comparable data and stimulate competition in reporting. But the data are a fraction of the ideal amount and do not show whether a firm is prepared for the transition; investors over-rely on scores and on ISS and Glass Lewis voting advice. Competition among providers and distribution via mainstream channels (Bloomberg) should improve quantity and quality over time.","kt":"","src":"Bok s. 172 (6.4)"},{"id":"SB270","l":"L7","t":"ESG ratings","f":"t","d":3,"p":"L","sc":"none","s":"True or false: The quotes on Lecture 7, slide 40 argue that \"in strict ESG terms\" the aim of ESG ratings is altruistic: to reward companies for doing good for society regardless of risk.","o":[["True","Incorrect. The slide says the aim is not altruistic; it is rather a way of assessing regulatory or reputational risks that arise from negative externalities."],["False","Correct. The slide says the aim is not altruistic; it is rather a way of assessing regulatory or reputational risks that arise from negative externalities."]],"c":[1],"es":"False: ESG ratings assess risks from negative externalities, not altruism.","ed":"Slide 40 criticises the ESG industry: it puts unmanageable demands on companies, ratings are too subjective, the industry overpromises and underdelivers, and the aim is risk assessment rather than altruism. It argues mandatory regulation of disclosures, especially material ones, should tighten things up. This matches the distinction between financial materiality (risk to the firm) and impact.","kt":"","src":"L7 slide 40"},{"id":"SB271","l":"L7","t":"ESG ratings","f":"t","d":4,"p":"H","sc":"short","s":"True or false: In 2022 Tesla was dropped from the S&P 500 ESG Index while ExxonMobil remained in it. This is consistent with ESG ratings often measuring industry-relative management of ESG risks rather than a company's positive impact on the world.","o":[["True","Correct. Many ratings benchmark firms within their industry and focus on risks and governance, so an oil major can score relatively well while an EV maker with governance or labour issues scores worse."],["False","Incorrect. Many ratings benchmark firms within their industry and focus on risks and governance, so an oil major can score relatively well while an EV maker with governance or labour issues scores worse."]],"c":[0],"es":"True: ratings often measure relative ESG risk management, not impact.","ed":"This is the benchmarking point on slide 37 and Brooks' warning that ESG ≠ sustainability. Investors must know whether a rating measures risk to the firm or the firm's impact, and treat ratings as a starting point for analysis.","kt":"Industry-relative (best-in-class) rating: scores a firm against its industry peers rather than across all industries.","src":"L7 slide 37 · Fondsfinans s. 6"},{"id":"SB272","l":"L7","t":"Reporting and materiality","f":"m","d":3,"p":"M","sc":"short","s":"A company has a small water footprint but operates in a water-scarce region. Under which framework does the textbook say it should report on water even though the impact is small?","o":[["None, because small impacts are never material under any framework.","GRI's impact materiality can make them reportable."],["GRI, because of its \"sustainability context\" principle.","Section 6.3.1.3 uses exactly this water example."],["SASB, because SASB ignores industry differences and focuses on society.","SASB is industry specific and investor focused."],["IFRS, because water rights are recognised as a balance sheet asset.","IFRS focuses on financial performance and position."]],"c":[1],"es":"GRI's sustainability context: report what matters to society, e.g. water in water-scarce areas.","ed":"GRI's impact materiality looks outward: topics are material if they reflect significant economic, environmental and social impacts or substantively influence stakeholders' assessments. In a water-scarce area, water use matters to society even if small. Under financial materiality (SASB, IFRS/ISSB), it would matter only if it could affect the company's value. CSRD's double materiality requires both views.","kt":"","src":"Bok s. 161 (6.3.1.3) · Bok s. 158 (Table 6.2)"},{"id":"SB273","l":"L7","t":"Integrated thinking","f":"m","d":3,"p":"M","sc":"none","s":"The IIRC says integrated reporting is a means to a deeper goal. What is that goal?","o":[["Integrated thinking about how value-creating factors connect.","The IIRC's long-term vision is integrated thinking embedded in mainstream practice."],["Ensuring all reporting companies obtain the highest ESG rating from data providers.","Ratings are not the goal of IR."],["Maximising the number of ESG indicators disclosed in each annual report.","Conciseness and materiality are guiding principles."],["Replacing financial statements entirely with sustainability statements.","IR combines financial and non-financial information; it does not replace financial statements."]],"c":[0],"es":"IR's goal is integrated thinking: seeing how factors and capitals interconnect to create value over time.","ed":"Integrated thinking combines financial, social and environmental dimensions. Example: a biotech's ability to produce new products depends on its innovation process, which depends on its human capital. Embedding integrated thinking should make information flow naturally into management reporting and decisions and break silo thinking (Chapter 12). The move from financial reporting to IR mirrors the move from SF 1.0 to SF 2.0 and 3.0.","kt":"","src":"Bok s. 158 (6.3.1.1) · Bok s. 159 (6.3.1.1) · Bok s. 157 (6.3.1)"},{"id":"SB274","l":"L7","t":"Reporting and value","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: Two airlines publish sustainability reports. Airline A shows photos of tree-planting events. Airline B reports fuel use per passenger-km, a sustainable aviation fuel target for 2030 and the expected cost impact. Which report is more useful to investors, and why?","o":[["Neither, because investors only use financial statements.","Most investors use ESG information (EY survey; Amel-Zadeh and Serafeim)."],["Both are equally useful, since any reporting helps.","Quality and materiality differ greatly."],["A: photos show genuine commitment.","Anecdotes are not comparable or decision-useful."],["B: it gives material, comparable and forward-looking data linked to costs.","Investors need material KPIs they can link to value drivers."]],"c":[3],"es":"Material, comparable, forward-looking KPIs linked to value drivers are decision-useful.","ed":"Fuel efficiency and fuel costs are core value drivers for airlines; interim targets show transition preparedness. This matches the IIRC principles (materiality, connectivity, future orientation) and the analyst's need to link ESG to valuation (Lecture 9).","kt":"Decision-useful information: material, reliable, comparable and forward-looking data that can change an investor's assessment.","src":"L7 slide 14-15 · Bok s. 160 (6.3.1.2)"},{"id":"SB275","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":3,"p":"H","sc":"none","s":"Lecture 8 extends the two-stock mean-variance problem (stock A: r = 10%, σ = 7%, 30 t emissions; stock B: r = 5%, σ = 3%, 20 t emissions) to include ESG. How does the optimisation problem change?","o":[["The correlation between A and B is set to zero to reflect ESG diversification benefits.","The correlation (0.5) is unchanged; it is a property of the assets."],["The objective switches from maximising return to minimising emissions, with no risk constraint.","Return is still maximised subject to risk; emissions enter as an additional constraint."],["A constraint is added: weighted portfolio emissions must stay below a tolerance.","Slide 7 adds w(A)·30 + w(B)·20 ≤ emission tolerance to the variance and budget constraints."],["Emissions are added to expected returns, so a high-emission stock has a higher return.","Emissions enter as a separate constraint, not as a return adjustment."]],"c":[2],"es":"Maximise w'r subject to variance ≤ risk tolerance, weighted emissions ≤ emission tolerance, and weights ≤ 1.","ed":"Traditional optimisation maximises expected return for a given risk tolerance (Markowitz efficient frontier). With ESG, an extra constraint limits portfolio emissions: w(A)·emission(A) + w(B)·emission(B) ≤ emission tolerance. A binding emission constraint pushes weight towards the cleaner stock B, typically lowering expected return for the given risk. Pedersen, Fitzgibbons and Pomorski (2021) generalise this to an ESG-efficient frontier: the highest Sharpe ratio for each level of portfolio ESG score.","kt":"","src":"L8 slide 4-7"},{"id":"SB276","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":4,"p":"M","sc":"none","s":"Pedersen, Fitzgibbons and Pomorski (2021), shown on Lecture 8, slide 8, derive an \"ESG-efficient frontier\". What does it show?","o":[["That ESG scores contain no information about risk or return.","In their model ESG can carry information about future fundamentals."],["The set of portfolios with zero carbon emissions, which dominate all other portfolios.","It covers the full range of ESG levels, not only zero emissions."],["The highest attainable Sharpe ratio for each level of portfolio ESG score.","The frontier maps the maximum Sharpe ratio against the portfolio's average ESG score."],["That portfolios with higher ESG scores always have higher Sharpe ratios.","At high ESG levels the constraint binds and the Sharpe ratio falls."]],"c":[2],"es":"The ESG-efficient frontier = max Sharpe ratio for each portfolio ESG level.","ed":"Pedersen et al. combine mean-variance with an ESG dimension. Starting from the tangency portfolio, investors can raise portfolio ESG at little cost at first, but at higher ESG levels the Sharpe ratio drops. They distinguish ESG-unaware, ESG-aware (use ESG as information about returns) and ESG-motivated investors (also derive utility from ESG). This connects to Lecture 9 (expected returns of green vs brown assets) and to the idea that constraints can be costly.","kt":"","src":"L8 slide 8"},{"id":"SB277","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: Using Lecture 8's two-stock example (A: 10% return, 30 t emissions; B: 5% return, 20 t), an investor tightens the emission limit so the portfolio must emit at most 22 t. What happens to the optimal portfolio?","o":[["It is unchanged, since emissions do not affect weights.","A binding emission constraint changes the weights."],["It shifts toward A, raising both return and emissions.","A has higher emissions, so the limit forces less A."],["It shifts toward B, so expected return falls.","At most 22 t requires mostly B (w(A) ≤ 0.2), so return is at most 6%."],["Return rises because low-emission stocks always earn more.","Here the low-emission stock has the lower return."]],"c":[2],"es":"Weighted emissions 30w + 20(1 − w) ≤ 22 → w(A) ≤ 0.2 → return ≤ 6%.","ed":"This is the ESG-efficient frontier logic (Pedersen et al.): tight constraints can cost return if green assets have lower expected returns. Whether that holds in reality is an empirical question (Lecture 9: tastes, hedging, and unexpected green demand shifts).","kt":"Binding constraint: a limit that actually changes the optimal solution; its cost is the return given up.","src":"L8 slide 7 · L8 slide 8"},{"id":"SB278","l":"L8","t":"Investment industry","f":"m","d":2,"p":"H","sc":"none","s":"In the stylised investment chain (Lecture 8, slide 14), what is the difference between an asset owner and an asset manager?","o":[["The owner (e.g. a pension fund) owns the assets; the manager manages them for it.","Definitions on slide 14."],["The asset manager owns the assets; the asset owner only provides advice.","The roles are reversed."],["There is no real difference; the terms are synonyms used for any institutional investor.","They are distinct links with a principal-agent relationship."],["Asset owners invest only in bonds, asset managers only in equities.","Both can deal with any asset class."]],"c":[0],"es":"Beneficiaries → asset owners (pension funds, insurers, funds) → asset managers → companies.","ed":"Beneficiaries or clients own a proportionate share of the assets held by an asset owner (pension fund, insurer, investment fund). The asset owner appoints asset managers to manage portfolios of financial assets on its behalf. Each link is a principal-agent relationship. Long chains distort incentives, shorten horizons and lose information - NBIM, for instance, uses about 111 external mandates (slide 72).","kt":"","src":"L8 slide 14 · Bok s. 185 (7.1.4) · Bok s. 185 (Figure 7.1)"},{"id":"SB279","l":"L8","t":"Investment industry","f":"m","d":3,"p":"M","sc":"short","s":"Because asset managers earn fees on assets under management, why did many launch ESG funds when investor demand surged around 2020-21, and why did some quietly drop the label when US political backlash grew?","o":[["Because regulators required every manager to launch ESG funds.","No such requirement existed."],["Because labels have no effect on fund flows.","Hartzmark and Sussman show labels and ratings strongly affect flows."],["Because ESG funds are exempt from management fees.","ESG funds charge fees, often higher ones."],["Fees depend on AUM, so labels follow flows and political risk.","Product strategy responds to where client money and risks go."]],"c":[3],"es":"Fee-on-AUM model → products follow flows (and political risk).","ed":"This explains both the ESG boom and \"greenhushing\" (Brooks). It is why selling practices and product labelling is a material issue for asset managers, and why regulators police labels (SFDR, the SEC's DWS case).","kt":"Assets under management (AUM): the value of assets a manager runs; most revenues are fees proportional to AUM.","src":"L8 slide 17 · L8 slide 36 · Fondsfinans s. 10"},{"id":"SB280","l":"L8","t":"Investment industry","f":"m","d":3,"p":"M","sc":"none","s":"Lecture 8 lists material issues for asset management (based on SASB). Which is among them?","o":[["Systemic risk management","Listed under leadership and governance."],["Tailings dam management","This is material for mining companies."],["Product safety recalls","Not listed for asset management."],["Water management at production sites","Not material for an asset manager's own operations."]],"c":[0],"es":"Selling practices and labelling, employee engagement and diversity, product design, business ethics, systemic risk - plus issues of the portfolio companies.","ed":"SASB lists for asset management: selling practices and product labelling (greenwashing risk - cf. SFDR reclassifications), employee engagement, diversity and inclusion, product design and lifecycle management (incorporating ESG in products), business ethics and systemic risk management. Additionally, any material issues of the companies in which the manager invests matter, so materiality depends on portfolio composition. UBS and Santander matrices (slides 20-21) illustrate this. Also correct: Selling practices and product labelling.","kt":"","src":"L8 slide 19-21"},{"id":"SB281","l":"L8","t":"SFDR","f":"m","d":2,"p":"H","sc":"none","s":"How does Lecture 8 distinguish SFDR Article 8 and Article 9 funds?","o":[["Article 9 funds may not engage with investee companies.","Article 9 funds often have active engagement policies."],["Article 8 promotes E/S traits; Article 9 targets sustainable investment.","Slides 24 and 26: Article 8 promotes, Article 9 invests in companies contributing positively, with do-no-significant-harm and good governance."],["Article 9 funds only promote E/S characteristics, while Article 8 funds must have impact objectives.","The definitions are reversed."],["Article 8 funds are exempt from any disclosure requirements.","Article 8 funds have SFDR disclosure obligations."]],"c":[1],"es":"Art. 8 = \"light green\" (promotes E/S); Art. 9 = \"dark green\" (sustainable objective, DNSH, good governance).","ed":"The SFDR (for asset managers, pension funds and insurers) classifies products. Article 8 funds promote environmental or social characteristics, typically using exclusions, ESG integration and engagement. Article 9 funds invest in companies whose products and services contribute positively to society, ensure no significant harm and good governance, and usually have a thematic or impact focus aligned with SDGs and active engagement. Article 8 and 9 assets totalled EUR 7.1 trillion (58.8% of the EU universe, Morningstar, Dec 2025).","kt":"","src":"L8 slide 22-27"},{"id":"SB282","l":"L8","t":"SFDR","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Lecture 8 notes that many funds were recently reclassified from Article 8 to Article 9 to take advantage of the stricter label's marketing value.","o":[["True","Incorrect. The slide notes the opposite: a mass reclassification from Article 9 to Article 8, to avoid accusations of greenwashing."],["False","Correct. The slide notes the opposite: a mass reclassification from Article 9 to Article 8, to avoid accusations of greenwashing."]],"c":[1],"es":"False: funds moved from Article 9 down to Article 8 to avoid greenwashing accusations.","ed":"As regulators clarified what \"sustainable investment\" under Article 9 requires, many managers downgraded funds to Article 8 rather than risk greenwashing claims. This shows the tension between marketing labels and substance, and why selling practices and product labelling is a material issue for asset managers.","kt":"","src":"L8 slide 26 · L8 slide 19"},{"id":"SB283","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A church foundation insists it will never own weapons or tobacco stocks, but otherwise wants market-like returns with low cost. Which strategy fits best?","o":[["Impact investing in private equity","Higher cost, illiquid, and beyond the client's brief."],["Full ESG integration with an active stock-picking team","Possible, but costlier than needed for a pure values constraint."],["Thematic clean-water fund only","Too concentrated for a market-like return target."],["Negative screening on an index portfolio","Exclusions meet the values constraint while keeping a low-cost, diversified portfolio."]],"c":[3],"es":"Values-based exclusion + low cost = negatively screened index.","ed":"Exclusion is SF 1.0 and the easiest strategy for passive portfolios (Table 8.3). It fits clients with clear values constraints; investors seeking impact or alpha from ESG need integration, engagement or impact strategies.","kt":"Negative screening: excluding companies or sectors based on ethical or risk criteria.","src":"L8 slide 43 · L9 slide 35"},{"id":"SB284","l":"L8","t":"Drivers of responsible investment","f":"m","d":3,"p":"H","sc":"none","s":"Hartzmark and Sussman (2019) use the introduction of Morningstar sustainability ratings as a natural experiment. What do they find?","o":[["High-sustainability funds subsequently earned much higher returns than low-rated funds.","They find no evidence that high-sustainability funds outperformed."],["Investors moved money out of high-sustainability funds because they expected lower returns.","High-rated funds received inflows."],["Sustainability ratings had no effect on fund flows.","Flows responded strongly to the ratings."],["Top-rated funds got inflows and bottom-rated funds outflows.","This is the paper's main finding."]],"c":[3],"es":"Top globe ratings → inflows; bottom ratings → outflows; no evidence of outperformance.","ed":"When Morningstar began publishing globe ratings in 2016, funds with the highest rating attracted significant inflows and those with the lowest saw outflows, showing investors collectively put positive value on sustainability. They find no evidence that high-sustainability funds outperform, so the flows seem driven by non-pecuniary motives or beliefs. Riedl and Smeets (slide 35) similarly find social preferences and social signalling explain SRI holdings.","kt":"","src":"L8 slide 36 · L8 slide 35"},{"id":"SB285","l":"L8","t":"Drivers of responsible investment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Riedl and Smeets (2017) find that investors hold socially responsible mutual funds mainly because they expect them to deliver higher financial returns than conventional funds.","o":[["True","Incorrect. They find social preferences and social signalling explain SRI holdings; SRI investors actually expect lower returns and pay higher fees."],["False","Correct. They find social preferences and social signalling explain SRI holdings; SRI investors actually expect lower returns and pay higher fees."]],"c":[1],"es":"False: social preferences and signalling, not return expectations, drive SRI holdings.","ed":"Combining administrative data with incentivised experiments, Riedl and Smeets show investors with stronger social preferences (measured by trust and generosity games) and those who care about signalling are more likely to hold SRI funds, while financial motives play a smaller role. This fits the \"values\" (non-pecuniary) motive in Starks' value vs values framework (Lecture 1).","kt":"","src":"L8 slide 35 · Starks s. 1838"},{"id":"SB286","l":"L8","t":"Investor motives","f":"m","d":3,"p":"M","sc":"short","s":"Most professionals in Amel-Zadeh and Serafeim's survey use ESG information, and the top reason given is that it is financially material. What does this imply for how ESG information should be presented to them?","o":[["Linked to risk, growth and margins rather than ethics.","Mainstream investors look for financial relevance."],["As moral arguments only.","Ethics is a less common motive among mainstream professionals."],["Without any numbers, to avoid confusion.","Investors want quantifiable, comparable data."],["As long lists of unprioritised indicators.","Lack of comparability and focus is their main complaint."]],"c":[0],"es":"Present ESG as financially material: linked to value drivers.","ed":"Professionals mostly consider ESG for performance reasons, then client demand and product strategy; lack of comparable data is the biggest obstacle. This supports SASB/ISSB-style financial materiality for investors - while CSRD adds impact materiality for other stakeholders.","kt":"Financial materiality: the extent to which an ESG issue affects a company's cash flows, risk or cost of capital.","src":"L8 slide 37-38 · Bok s. 226 (8.3)"},{"id":"SB287","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"Which description matches negative (exclusionary) screening as defined in Lecture 8?","o":[["Rules on \"undesirable\" criteria that make investments not permitted.","Slide 43 definition."],["Selecting firms expected to benefit from long-term sustainability trends, chosen top-down.","This is thematic investing."],["Selecting only firms that clear an ESG ranking hurdle within each sector.","This is best-in-class (positive) screening."],["Using voting rights and dialogue to improve investee companies.","This is stewardship / engagement."]],"c":[0],"es":"Negative screening excludes based on undesirable criteria (ethics/norms or risk, e.g. tobacco regulation, stranded assets).","ed":"Negative screening imposes exclusions based on ethical preferences or a normative worldview, or to avoid sectors prone to risk (tobacco regulation, fossil fuel stranded assets). Example: BlackRock ICS Euro Liquid Environmentally Aware Fund (slide 44). The textbook calls it a crude measure that steers money away from the worst firms (SF 1.0); about half of institutional ESG investors use ratings only for negative screening.","kt":"","src":"L8 slide 43-44 · Bok s. 189 (7.2.2) · Bok s. 194 (7.3.3)"},{"id":"SB288","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"H","sc":"short","s":"A fund invests only in companies benefiting from the clean water and sanitation trend (SDG 6), chosen top-down. Another fund keeps only the top 30% ESG-rated firms in each sector. Which labels fit?","o":[["First: impact investing; second: ESG integration.","Neither requires measured impact or integration into cash flow forecasts."],["First: thematic investing; second: best-in-class screening.","Thematic is top-down around a trend; best-in-class ranks within sectors."],["First: best-in-class screening; second: thematic investing.","The labels are swapped."],["Both are negative screening.","Neither excludes based on \"undesirable\" criteria as such."]],"c":[1],"es":"Thematic = top-down trend portfolios (e.g. Xtrackers SDG 6 ETF); best-in-class = select leaders within each sector.","ed":"Best-in-class (positive) screening applies \"desirable\" criteria, selecting firms that clear a ranking hurdle within each sector, often using ESG ratings (e.g. iShares MSCI World SRI ETF combines negative and positive screening). Thematic investing builds a portfolio top-down around medium- to long-term trends (clean tech, sustainable agriculture, health care, climate mitigation; e.g. Xtrackers MSCI Global SDG 6 Clean Water ETF). The textbook labels positive screening with ratings \"SF 1.5\" because of the ratings' design limits.","kt":"","src":"L8 slide 45-52 · Bok s. 189 (7.2.2)"},{"id":"SB289","l":"L8","t":"SRI strategies","f":"t","d":2,"p":"H","sc":"none","s":"True or false: According to Lecture 8, ESG integration means seeking out ESG information, assessing its materiality, and integrating material information into investment analysis, e.g. as inputs into cash flow forecasts or cost of capital estimates.","o":[["True","Correct. This is the definition on slide 53."],["False","Incorrect. This is the definition on slide 53."]],"c":[0],"es":"True: ESG integration brings material ESG information into financial analysis.","ed":"ESG integration explicitly includes ESG factors in traditional financial analysis of individual securities; implementation varies (BlackRock example, slides 54-55). The textbook sees full integration as SF 2.0, and Lecture 9 shows how to put it into a DCF (cash flows, scenarios, discount rate) and portfolio construction.","kt":"","src":"L8 slide 53-55 · Bok s. 189 (7.2.2) · L9 slide 7"},{"id":"SB290","l":"L8","t":"SRI strategies","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"In Lecture 8's stewardship example, LGIM engaged with Glencore on climate from 2016, filed a shareholder resolution in 2023 on thermal-coal alignment with 1.5°C, and in 2024 added Glencore to its divestment list for selected funds (about £176bn). What does this sequence illustrate?","o":[["Escalation from voice to exit when progress is insufficient.","The slide lays out engagement, specific request, shareholder rights, escalation and consequence."],["Passive investing with no use of investor rights or dialogue with management.","LGIM actively used dialogue and a shareholder resolution."],["Impact investing in a renewable energy start-up.","Glencore is a listed mining and commodity company."],["A pure negative screening strategy applied from the start.","Exclusion came only after years of engagement."]],"c":[0],"es":"Voice (dialogue, resolution) escalating to exit (divestment) is credible stewardship.","ed":"Stewardship uses investor rights and influence to protect and enhance long-term value, including common economic, social and environmental assets. LGIM's Climate Impact Pledge escalated from dialogue to a specific request (transparency on thermal coal), a shareholder resolution (2023), and finally divestment from selected funds (2024). The credible threat of exit can strengthen voice; slide 71 notes that passive investors cannot use exit, while active investors can use both voting, engagement and exit.","kt":"","src":"L8 slide 56-58 · L8 slide 71"},{"id":"SB291","l":"L8","t":"Active ownership","f":"m","d":4,"p":"H","sc":"none","s":"Dimson, Karakaş and Li (2015) study ESG engagements by a large institutional investor. What is their main finding?","o":[["Engagement has no measurable effect on firms or their stock prices.","Successful engagements were followed by improvements and positive returns."],["Successful engagements are followed by positive abnormal returns.","They report positive abnormal returns after successful engagements (especially on environmental and social issues) and no adverse effect after failures."],["Engagement only works when the investor holds a majority stake in the target firm.","The investor typically held small stakes; coordination helps."],["All engagements destroy value because they distract management.","They find positive effects for successful engagements."]],"c":[1],"es":"Successful engagement → positive abnormal returns and better performance; failure → no negative effect.","ed":"In \"Active Ownership\" (RFS 2015), successful engagements (roughly one in five) were followed by positive one-year abnormal returns and improvements in accounting performance and governance; unsuccessful ones had no negative return effect. In \"Coordinated Engagements\" (2020), collaborative engagements with a lead investor are more successful. This supports the textbook's condition of effective engagement and McCahery, Sautner and Starks' evidence on behind-the-scenes engagement.","kt":"","src":"L8 slide 60 · Bok s. 194 (7.3.4) · Bok s. 203 (7.4.3)"},{"id":"SB292","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"Which feature distinguishes impact investing from the other SRI strategies in Lecture 8?","o":[["It is only possible in listed equity markets.","It is usually done through private equity, but also via bonds, real assets and public equity."],["Intentional, measured positive impact alongside a financial return.","Slide 61: intention plus active measurement of social impact."],["It always accepts below-market or zero financial returns.","Impact investing seeks impact alongside a financial return."],["It relies only on excluding sin industries such as tobacco and gambling.","That is negative screening."]],"c":[1],"es":"Impact investing = intentional, measured positive impact alongside financial return.","ed":"Impact investing typically targets renewable energy, housing, health care, education, microfinance or sustainable agriculture, usually through private equity with concentrated ownership and longer horizons, but also through social impact bonds, real assets or public equity. The GSIR ordering on slides 39-40 shows strategies with increasing impact intent, measurement and reporting, from exclusions to impact investing. Lecture 10 covers green bonds and Lecture 9 the debate about whether listed equity can create additional impact.","kt":"","src":"L8 slide 61-65 · L8 slide 39"},{"id":"SB293","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about the SRI strategies in Lecture 8 is correct?","o":[["Thematic investing and best-in-class screening are the same strategy.","Thematic is top-down by trend; best-in-class ranks within sectors."],["ESG integration means excluding all companies with an ESG rating below average.","Integration brings material ESG into valuation; it is not an exclusion rule."],["Negative screening requires measuring the social impact of every holding.","Screening only applies exclusion rules."],["Impact investing sits at the high end of impact intent, measurement and reporting.","The GSIR overview orders strategies by increasing impact intent."]],"c":[3],"es":"Strategies: negative screening, best-in-class, thematic, ESG integration, stewardship, impact investing - with rising impact intent toward impact investing.","ed":"GSIR classifies sustainable investment approaches: ESG integration, negative/exclusionary screening, norms-based screening, best-in-class/positive screening, sustainability-themed investing, corporate engagement and shareholder action (stewardship), and impact investing. They can be combined (e.g. Article 8 funds: exclusions + integration + engagement). The textbook adds that the deeper approaches require concentrated, active portfolios. Also correct: Stewardship uses voting and engagement rather than only buying or selling securities.","kt":"","src":"L8 slide 39-42 · L8 slide 56 · L8 slide 65"},{"id":"SB294","l":"L8","t":"Barriers to integration","f":"m","d":3,"p":"H","sc":"none","s":"Why does the textbook (and Lecture 8) see the efficient market hypothesis as a barrier to integrating sustainability?","o":[["Because the EMH requires investors to hold concentrated portfolios.","It implies holding the market portfolio."],["Because the EMH forbids the use of the stock price as a performance measure.","It makes the stock price the central performance measure."],["Because the EMH proves that sustainable firms always underperform.","The EMH makes no such claim."],["If prices reflect all information, passive investing seems optimal.","The EMH suggests everyone should invest passively, leaving no allocation role for ESG analysis."]],"c":[3],"es":"EMH → all information priced → no benefit from active analysis → passive investing → no societal allocation role.","ed":"Under the EMH (Fama, 1970), arbitrage keeps prices correct, so investors cannot benefit from superior information; this suggests passive investing and makes the stock price the central performance measure. Behavioural finance (Tversky and Kahneman; momentum, Jegadeesh and Titman) and sustainability anomalies (Khan, Serafeim and Yoon) show markets are not always efficient. The adaptive markets hypothesis (Lo) explains why new risks such as environmental risks are priced only gradually, as more analysts examine them.","kt":"","src":"L8 slide 66-68 · Bok s. 181 (7.1.1) · Bok s. 182 (7.1.1) · Bok s. 189 (7.3.1)"},{"id":"SB295","l":"L8","t":"Barriers to integration","f":"m","d":3,"p":"M","sc":"none","s":"Lecture 8 (slide 67) shows an asset whose expected return lies below the security market line given its beta (α < 0). What happens according to the arbitrage logic of efficient markets?","o":[["It is overpriced; its price falls until it is back on the SML.","The slide: expected return too low for its risk → overpriced → price falls → expected return rises."],["Investors buy the asset because a negative alpha signals low risk.","Negative alpha signals too little return for the risk taken."],["Nothing happens, because the SML does not apply to individual assets.","The CAPM applies the SML to every asset."],["The asset is underpriced; its price rises until its expected return falls further.","An expected return below the SML implies overpricing."]],"c":[0],"es":"Below the SML → overpriced → price falls → expected return rises back to the line.","ed":"In the CAPM, E(Ri) = Rf + βi(E(Rm) − Rf); only systematic risk is priced. An asset below the SML offers too little return for its beta, so rational investors sell, its price drops, and its expected return rises back to the line. The textbook criticises the CAPM for using only past return volatility as risk, ignoring fundamental and social-environmental risks. If ESG risks are not yet priced (AMH), similar adjustments may happen slowly as the market learns.","kt":"","src":"L8 slide 67 · Bok s. 182 (7.1.2) · Bok s. 183 (7.1.2)"},{"id":"SB296","l":"L8","t":"Market framework","f":"m","d":3,"p":"H","sc":"none","s":"Table 7.1 contrasts traditional investing (SF 1.0) with investing for LTVC (SF 2.0). Which pairing is correct?","o":[["Portfolios: very diversified (traditional) vs more concentrated (LTVC)","Row \"Portfolios\" in Table 7.1."],["Investment chains: short and simple (traditional) vs long and complicated (LTVC)","The pairing is reversed in Table 7.1."],["Dialogue with corporates: deep (traditional) vs limited (LTVC)","The pairing is reversed in Table 7.1."],["Performance horizon: years or decades (traditional) vs 12 months (LTVC)","Reversed: traditional uses 12 months, LTVC years or decades."]],"c":[0],"es":"Traditional: EMH, max FV, EPS, long chains, diversified, limited dialogue, 12 months. LTVC: AMH, max IV, DCF with scenarios, short chains, concentrated, deep dialogue, years.","ed":"Summary of Table 7.1: traditional investing (SF 1.0) uses the EMH, treats S and E as irrelevant or already priced, maximises financial value, uses earnings per share, works through long and complicated chains with very diversified portfolios, limited dialogue and a 12-month horizon. Investing for LTVC (SF 2.0) uses the AMH (S and E priced as markets learn), maximises integrated value IV = FV + SEV, uses sophisticated DCF with internalisation scenarios, short chains, concentrated portfolios, deep dialogue and a horizon of years or decades. Also correct: Market framework: EMH (traditional) vs adaptive markets hypothesis (LTVC).","kt":"","src":"Bok s. 180 (Table 7.1) · L8 slide 74"},{"id":"SB297","l":"L8","t":"Adaptive markets hypothesis","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Under the adaptive markets hypothesis, the speed at which environmental risks become priced depends on the number of fundamental analysts covering these risks and the quality of their learning.","o":[["True","Correct. Section 7.3.1 states that the AMH explains why new risks are not yet fully priced: not enough investors are examining them."],["False","Incorrect. Section 7.3.1 states that the AMH explains why new risks are not yet fully priced: not enough investors are examining them."]],"c":[0],"es":"True: ESG pricing is an evolutionary process driven by analysts' learning.","ed":"Lo's AMH links market efficiency to market ecology - the number of competitors, the size of profit opportunities and participants' adaptability. It allows path dependence, changing behaviour and varying risk preferences. As more analysts study ESG factors, they become priced in, gradually. This creates temporary inefficiencies (alpha opportunities) for early adopters, as Figure 7.3 shows with \"pockets of interesting data\".","kt":"","src":"Bok s. 189 (7.3.1) · Bok s. 190 (7.3.1) · Bok s. 192 (Figure 7.3)"},{"id":"SB298","l":"L8","t":"Performance measurement","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about traditional fund performance metrics is correct?","o":[["These metrics capture social and environmental value.","They live purely in the financial risk-return space."],["A beta below 1 means the fund moves less than the market (a defensive style).","Beta measures sensitivity to market movements."],["A low tracking error means the fund deviates strongly from its index.","Low tracking error means it stays close to the index."],["The Sharpe ratio compares the fund only to its benchmark index.","Sharpe uses the risk-free rate, not the benchmark."]],"c":[1],"es":"Beta = market sensitivity; IR = excess return per unit of tracking error.","ed":"The textbook's critique is that these metrics push managers to hug benchmarks and ignore social and environmental value. Alternatives include peer groups, ranges of indices, absolute return targets and non-financial KPIs. Also correct: A high information ratio means sustained excess return relative to the risk taken versus the benchmark.","kt":"Tracking error: volatility of a fund's returns relative to its benchmark; information ratio: excess return per unit of tracking error.","src":"Bok s. 183 (7.1.3) · Bok s. 184 (Table 7.2)"},{"id":"SB299","l":"L8","t":"Performance measurement","f":"m","d":3,"p":"H","sc":"extended_course_case","s":"According to Box 7.1, the Norwegian Ministry of Finance limited NBIM's tracking error to about 1% relative to broad equity and bond indices. What consequence does the textbook draw?","o":[["The fund can freely deviate from the benchmark to pursue impact investments in private markets.","The tight tracking error limit prevents large deviations."],["The limit guarantees that the fund outperforms its benchmark.","Tracking error constrains deviations; it does not guarantee outperformance."],["Little room for active management, and little societal allocation role.","The Fund owns ~2% stakes in thousands of companies."],["NBIM is forced to hold a concentrated portfolio of about 100 stocks.","A 1% tracking error implies near-index holdings."]],"c":[2],"es":"A ~1% tracking error limit → near-passive, highly diversified portfolio with small stakes and limited allocation role.","ed":"The Ministry sets benchmarks (FTSE Global All Cap, Barclays Global Aggregate) and a tight tracking error, so NBIM holds about 2% of thousands of firms - illustrative of passive asset management (as is Vanguard). The textbook argues this leaves little societal allocation role and weakens monitoring (free-rider problem). NBIM compensates partly with voting, expectations documents and engagement, and exclusions by the Council on Ethics; Folketrygdfondet (guest lecture) runs a more concentrated domestic mandate with close ownership dialogue.","kt":"","src":"Bok s. 186 (Box 7.1) · L8 slide 15 · L8 slide 72"},{"id":"SB300","l":"L8","t":"Voice vs exit","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: An index fund tracking the OSEBX that is unhappy with a constituent's climate strategy can credibly threaten to sell the shares to pressure management.","o":[["True","Incorrect. An index fund must hold all index constituents, so it cannot exit; its levers are voting and engagement."],["False","Correct. An index fund must hold all index constituents, so it cannot exit; its levers are voting and engagement."]],"c":[1],"es":"False: index funds cannot exit; they must use voice.","ed":"This is why the large index providers matter most through voting (e.g. supporting Engine No. 1 at Exxon in 2021) and why critics question whether they engage enough across thousands of holdings.","kt":"Exit (\"Wall Street walk\"): selling shares to signal dissatisfaction or pressure management.","src":"L8 slide 71 · Bok s. 194 (7.3.4)"},{"id":"SB301","l":"L8","t":"Investment chains","f":"m","d":3,"p":"H","sc":"none","s":"Why do long investment chains exacerbate short-termism, according to the textbook?","o":[["Because asset managers are legally required to sell stocks within 12 months.","No such legal requirement exists."],["Because beneficiaries demand quarterly payouts.","Beneficiaries typically have long horizons (retirement); the agents shorten them."],["Each agent is monitored on short-term metrics, and information is lost.","The horizon gets shorter with each extra party; meaningful information is lost."],["Because long chains always involve high-frequency traders who hold stocks for seconds.","The issue is delegation and monitoring, not trading technology."]],"c":[2],"es":"More delegation → more agency problems → short-term benchmarks and lost information.","ed":"A pension fund chain runs from beneficiaries through the board, CEO/CIO, asset class heads, support functions and external managers; consultants and rating agencies add further links. Objectives, risk appetite, incentives, horizons and knowledge are not aligned, and the human reflex to long-term uncertainty is to focus on short-term measurable metrics (Neal and Warren, 2015). A long-term investor may still evaluate its managers quarterly. Remedy: align all parties on long-term outcomes and keep the chain short (condition 6).","kt":"","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 186 (7.1.4) · Bok s. 187 (7.1.4)"},{"id":"SB302","l":"L8","t":"ESG ratings limitations","f":"m","d":3,"p":"H","sc":"none","s":"Which is a design limitation of ESG ratings acc
