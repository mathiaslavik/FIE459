roinsurance (SF 3.0).","kt":"Financial inclusion: access to useful and affordable financial services (savings, credit, payments, insurance).","src":"L11 slide 15 · L11 slide 12"},{"id":"SB405","l":"L11","t":"Banks and society","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Ostergaard, Schindele and Vale find that Norwegian savings banks in communities with high social capital were LESS likely to survive after deregulation, because stakeholder governance is inefficient.","o":[["True","Incorrect. They find savings banks in high social capital communities were MORE likely to survive; social capital improves the efficiency of stakeholder governance. No similar effect exists for commercial banks."],["False","Correct. They find savings banks in high social capital communities were MORE likely to survive; social capital improves the efficiency of stakeholder governance. No similar effect exists for commercial banks."]],"c":[1],"es":"False: high social capital → higher survival for stakeholder-governed savings banks.","ed":"Savings banks are collectively governed by stakeholders. Where social capital is high, they raise more deposits locally, distribute more surplus to altruistic purposes and keep locally focused branch networks. The textbook adds that banks with the strongest shareholder-oriented governance performed worse in the financial crisis, and that banks reliant on interbank funding and high leverage were most vulnerable (Kotz and Schmidt).","kt":"","src":"L11 slide 16 · Bok s. 287 (10.2)"},{"id":"SB406","l":"L11","t":"Risk-based vs value-based banking","f":"m","d":2,"p":"H","sc":"none","s":"According to Table 10.2 (Lecture 11, slide 18), how do sustainable lending approaches map onto the SF typology?","o":[["ESG integration is SF 3.0 because it changes the risk premium.","Integration into the risk premium is SF 2.0."],["SF 1.0 and 2.0 are risk based; SF 3.0 is value based.","This is the table on slide 18."],["Exclusion is value based; impact lending is risk based.","The mapping is reversed."],["All three stages are value based, since all consider ESG factors.","SF 1.0 and 2.0 are risk based."]],"c":[1],"es":"SF 1.0 exclusion (risk), SF 2.0 ESG in risk premium (risk), SF 3.0 impact lending/microfinance (value).","ed":"In the risk-based approach, ESG factors enter credit risk assessment: SF 1.0 puts unsustainable firms on an exclusion list to avoid reputational risk; SF 2.0 includes social and environmental risks in the risk premium. In the value-based approach (SF 3.0), banks primarily lend to projects with positive social or environmental impact, and stakeholders (depositors, client-investors) care about ESG for non-monetary reasons.","kt":"","src":"L11 slide 18 · Bok s. 292 (Table 10.2) · Bok s. 292 (10.3.1)"},{"id":"SB407","l":"L11","t":"Risk-based lending","f":"m","d":3,"p":"H","sc":"short","s":"A bank lends to a chemicals firm whose plant sits on contaminated land. In the risk-based approach, through which credit risk parameters can this ESG factor affect the loan?","o":[["Only the deposit rate the bank pays.","Deposit rates are not driven by a single borrower's ESG profile."],["Only the bank's fee income.","The effect runs through expected loan losses."],["Neither, because environmental issues are not credit risks.","Contaminated sites are classified as an economic sustainability criterion because of their large financial impact."],["Both the probability of default and the loss given default.","Clean-up costs and liability risks can raise default risk and reduce recoveries."]],"c":[3],"es":"ESG risks raise PD and/or LGD → higher expected loss → higher risk premium.","ed":"In Equation 10.1, ESG risks affect p (default probability) and 1 − λ (loss given default). Weber, Scholz and Michalik rank contaminated sites and toxic waste as economic criteria because of their impact on profits and likely high LGD (clean-up, liability). Integrating sustainability criteria improved the ability of a credit rating system to predict defaults by nearly 5%. Sustainability also affects collateral values: energy-efficient buildings keep their value, inefficient ones and combustion-engine cars may not.","kt":"","src":"Bok s. 292 (10.4) · Bok s. 293 (Table 10.3) · Bok s. 294 (10.4) · Bok s. 291 (10.3)"},{"id":"SB408","l":"L11","t":"Risk-based lending","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Weber (2010), quoted in Lecture 11, concludes that sustainability criteria cannot predict a debtor's financial performance and should be kept separate from the credit rating process.","o":[["True","Incorrect. Weber concludes the opposite: sustainability criteria can predict financial performance and improve the predictive validity of credit ratings."],["False","Correct. Weber concludes the opposite: sustainability criteria can predict financial performance and improve the predictive validity of credit ratings."]],"c":[1],"es":"False: sustainability criteria improve the predictive validity of credit ratings.","ed":"Weber shows that a firm's sustainability influences its creditworthiness as part of its financial performance. The textbook reports that integrating economic, environmental and social criteria (Table 10.3) improved default prediction by nearly 5%. Chava (2014) finds banks charge higher rates to firms with environmental concerns, and lower rates to firms with environmentally beneficial products.","kt":"","src":"L11 slide 20 · Bok s. 294 (10.4) · Bok s. 299 (10.4.3)"},{"id":"SB409","l":"L11","t":"Risk-based lending","f":"m","d":3,"p":"M","sc":"none","s":"The Sustainability Credit Score System (Zeidan, Boechat and Fleury; Lecture 11, slide 19) develops paths for the average company in an industry. Which paths?","o":[["Start-up, growth, and maturity phases of the firm lifecycle.","These are lifecycle stages, not sustainability paths."],["Business as usual, sustainable, and future sustainable business.","The three development stages allow forward-looking assessment."],["Investment grade, high yield, and default, as in credit ratings.","These are credit rating categories."],["Exclusion, integration, and impact.","These are SF approaches, not development paths."]],"c":[1],"es":"Steps: industry analysis → BAU / sustainable / future-sustainable paths → material issues and vulnerabilities → weights → combined score (0-1).","ed":"The system analyses the industry (outlook, life cycle, value chain, regulation, innovation), develops three paths, defines variables in six sustainability dimensions, identifies material issues plus vulnerabilities and opportunities, formulates 30 questions and weights them into a score between 0 and 1. It is forward looking, but there is not yet hard evidence that it reduces defaults. ING's €1bn Philips facility (2017) linked the interest rate to Philips' Sustainalytics-assessed sustainability performance.","kt":"","src":"L11 slide 19 · Bok s. 294 (10.4) · Bok s. 295 (Box 10.1)"},{"id":"SB410","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"H","sc":"none","s":"According to Table 10.1 (GABV, 2006-15), how do values-based banks (VBBs) compare with global systemically important banks (G-SIBs)?","o":[["Identical returns and identical volatility over the period.","Volatility differs markedly."],["Lower ROA and higher leverage.","VBBs have higher ROA and lower leverage."],["Much higher ROE (15% vs 8.7%) with higher volatility.","VBB ROE is slightly lower, with lower volatility."],["Similar ROE but much lower ROE volatility.","VBBs are more stable and more real-economy focused."]],"c":[3],"es":"VBB vs G-SIB: ROA 0.65% vs 0.53%; ROE 8.3% vs 8.7%; SD ROE 4.9% vs 7.7%; loans/assets 77% vs 42%.","ed":"VBBs aim to deliver economic, social and environmental impact. They are more involved in the real economy (loans/assets 76.8% vs 41.6%; deposits/assets 81.7% vs 52.2%), have more equity relative to assets (8.1% vs 7.3%), and deliver more stable returns. Slightly lower ROE combined with lower leverage implies a higher ROA. This supports the textbook's claim that sustainable banking need not sacrifice financial performance.","kt":"","src":"L11 slide 22 · Bok s. 287 (10.2) · Bok s. 288 (Table 10.1)"},{"id":"SB411","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"Constructed scenario: Bank X has high ROA but lends mostly to speculative trading and commercial property with no social or environmental purpose. Bank Y has modest ROA, but most loans go to renewables, social housing and SMEs. Which bank scores higher on the GABV values-based banking scorecard, and why?","o":[["Y: the scorecard rewards real-economy and triple-bottom-line exposure most.","Impact-oriented and real-economy lending carry the largest weights."],["X: the scorecard is driven mainly by profitability.","Financial viability is a condition, not the main driver."],["Neither, because the scorecard only applies to microfinance.","It applies to banks in general."],["Both score the same, since only capital ratios count.","The scorecard covers viability, real-economy focus and triple bottom line."]],"c":[0],"es":"Real-economy and triple-bottom-line lending drive the GABV score.","ed":"Financial viability matters but is a condition, consistent with SF 3.0. Qualitative factors (leadership, culture, products) can adjust the score.","kt":"Triple bottom line: people, planet and profit - social, environmental and financial results.","src":"Bok s. 304 (Table 10.4) · L11 slide 22"},{"id":"SB412","l":"L11","t":"Values-based banking","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The textbook describes the risk-based approach to lending as three-dimensional (return, risk and impact), while values-based banking is two-dimensional (return and risk).","o":[["True","Incorrect. It is the reverse: the risk-based approach is two-dimensional (return, risk); values-based banking adds impact as a third dimension (Figure 10.4)."],["False","Correct. It is the reverse: the risk-based approach is two-dimensional (return, risk); values-based banking adds impact as a third dimension (Figure 10.4)."]],"c":[1],"es":"False: values-based banking is three-dimensional (return, risk, impact).","ed":"In values-based banking, project proposals go to a credit committee that judges viability in an integrated way, considering impact and risk. VBBs lend for economic resilience (microfinance, inclusion), social empowerment (education, health care, housing) and environmental regeneration (renewables, efficiency, sustainable agriculture). Projects that meet minimum impact criteria form the eligible universe (principle of inclusion).","kt":"","src":"Bok s. 303 (10.5) · Bok s. 303 (Figure 10.4) · Bok s. 304 (10.5)"},{"id":"SB413","l":"L11","t":"Sustainable loans","f":"m","d":2,"p":"H","sc":"none","s":"How does Lecture 11 distinguish green loans from sustainability-linked loans (SLLs)?","o":[["Green loans fund green projects; SLL pricing tracks borrower KPIs.","Slides 24-25 make this distinction."],["Green loans have a margin linked to ESG KPIs, while SLL proceeds are restricted to green projects.","The definitions are reversed."],["SLLs are only available to utilities.","SLLs are spread across many sectors; green loans are concentrated in utilities."],["Both require proceeds to be used only for renewable energy.","SLL proceeds can be used for general purposes."]],"c":[0],"es":"Green loan = use-of-proceeds; SLL = general purpose with interest rate linked to sustainability performance.","ed":"The LMA/APLMA/LSTA have Green Loan Principles, Social Loan Principles and Sustainability-Linked Loan Principles. UN PRI data show rapid growth of ESG loans 2016-21, with SLLs the largest share by 2021 and spread across sectors, while green loans are concentrated in utilities. ING's 2017 €1bn Philips facility was an early SLL: if Philips' sustainability improves, the rate falls and vice versa.","kt":"","src":"L11 slide 23-25 · Bok s. 295 (Box 10.1)"},{"id":"SB414","l":"L11","t":"Sustainable loans","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In April 2017, Philips agreed a €1bn five-year revolving credit facility with 16 banks, coordinated by ING, with the interest rate linked to its year-on-year sustainability performance (assessed by Sustainalytics). Which statement is correct?","o":[["The facility is a social impact bond paying only if outcomes are met.","It is a revolving credit facility, not an SIB."],["The proceeds can be used for general corporate purposes.","Box 10.1 states the facility is for general corporate purposes."],["The interest rate is fixed regardless of performance.","The rate is linked to sustainability performance."],["Philips' performance is assessed by its own internal audit only.","An independent provider, Sustainalytics, assessed and benchmarked performance."]],"c":[1],"es":"SLL: general purpose; margin ratchet tied to independently assessed sustainability performance.","ed":"The Philips facility incentivises the borrower to improve while ING reduces its risk. It followed Philips' \"Healthy People, Sustainable Planet\" programme (carbon neutrality and 100% renewable electricity by 2020; improving 3 billion lives a year by 2025). Credibility of SLLs depends on ambitious and material KPIs, independent verification, and a meaningful margin adjustment. Also correct: If Philips' sustainability performance improves, the rate falls; if it worsens, the rate rises.","kt":"","src":"Bok s. 295 (Box 10.1) · L11 slide 25"},{"id":"SB415","l":"L11","t":"Equator Principles","f":"m","d":2,"p":"H","sc":"none","s":"The Equator Principles are \"a financial industry benchmark for determining, assessing and managing environmental and social risk in projects\". Which is among the principles listed in Lecture 11?","o":[["Independent review","Listed on slide 26."],["Guaranteed minimum return for project sponsors","Not an Equator Principle."],["Mandatory green bond issuance","Not an Equator Principle."],["Shareholder voting on every project","Not an Equator Principle."]],"c":[0],"es":"EP: review and categorisation, E&S assessment, applicable standards, ESMS and action plan, stakeholder engagement, grievance mechanism, independent review, covenants, independent monitoring and reporting, reporting and transparency.","ed":"The Equator Principles help banks avoid a \"race to the bottom\" in project finance, where less responsible banks could undercut others by ignoring standards. Projects are categorised by E&S risk; risky projects need assessments, management systems, stakeholder engagement, grievance mechanisms and independent review; covenants require compliance with host country laws (IFC Performance Standards where regulation is weak). As of March 2021, 116 institutions in 37 countries had adopted them. Limitations: no monitoring of adherence; only about 5% of banks disclose everything required (Weber, 2017). Also correct: Grievance mechanism.","kt":"","src":"L11 slide 26 · Bok s. 297 (10.4.1) · Bok s. 298 (10.4.1)"},{"id":"SB416","l":"L11","t":"Equator Principles","f":"t","d":3,"p":"M","sc":"none","s":"True or false: According to the textbook, the Equator Principles include a strong enforcement mechanism that monitors member banks' adherence, and nearly all participating banks disclose all the required information.","o":[["True","Incorrect. There is no mechanism to monitor adherence, and Weber (2017) finds only about 5% of banks disclose all the information required."],["False","Correct. There is no mechanism to monitor adherence, and Weber (2017) finds only about 5% of banks disclose all the information required."]],"c":[1],"es":"False: no adherence monitoring; ~5% full disclosure.","ed":"The Equator Principles are a useful starting point covering over 70% of project finance, but they rely on self-regulation. Weber recommends standardisation and assurance of reporting. They also assess climate impact using scope 1 and 2 emissions only, while TCFD recommends scope 3 where appropriate. Project finance risks are inside-out (impact of projects), outside-in (weather, strikes, blockades) and reputational for financiers (e.g. the Dakota Access Pipeline, which several banks exited).","kt":"","src":"Bok s. 298 (10.4.1) · Bok s. 297 (10.4.1) · Bok s. 300 (Box 10.3)"},{"id":"SB417","l":"L11","t":"UN Principles for Responsible Banking","f":"m","d":2,"p":"H","sc":"none","s":"Which of the following is one of the six UN Principles for Responsible Banking (UNEP FI)?","o":[["Impact and target setting where impacts are most significant.","This is principle 2 on slide 29."],["Never lend to any company in the energy sector.","The PRB do not prescribe sector bans."],["Keep impacts confidential to protect clients.","Principle 6 calls for transparency and accountability."],["Maximise short-term return on equity for the bank's shareholders.","Not a PRB principle."]],"c":[0],"es":"PRB: 1 alignment (SDGs, Paris); 2 impact and target setting; 3 clients and customers; 4 stakeholders; 5 governance and culture; 6 transparency and accountability.","ed":"The PRB were launched by UNEP FI (consultation in 2018) and by the time of slide 28 had 247 signatories representing about 40% of global banking assets (about $65 trillion). They ask banks to align strategy with the SDGs and the Paris Agreement, set targets where impacts are most significant, work with clients, engage stakeholders, build governance and culture, and report on positive and negative impacts. The FT (slide 32) notes many banks have walked back climate commitments and increased fossil finance in 2024.","kt":"","src":"L11 slide 27-29 · L11 slide 32"},{"id":"SB418","l":"L11","t":"Banking regulation","f":"m","d":3,"p":"H","sc":"none","s":"Under the EBA's Pillar 3 ESG disclosure requirements (Lecture 11, slides 30-31), what does the Green Asset Ratio (GAR) measure?","o":[["The bank's scope 1 emissions per employee.","The GAR is about financed activities, not own emissions."],["The ratio of the bank's equity to its green bonds issued.","GAR concerns assets (exposures), not equity or bond issuance."],["The share of a bank's employees working in sustainability roles.","Not what the GAR measures."],["The share of exposures financing taxonomy-aligned activities.","The GAR is based on the EU taxonomy."]],"c":[3],"es":"GAR = taxonomy-aligned exposures / covered assets; BTAR extends this to the banking book; also transition and physical risk exposure templates.","ed":"Four major EU ESG regulations affect banks: the EU Taxonomy, SFDR, CSRD and the EBA's Pillar 3 ITS. Listed banks disclose 10 quantitative and 3 qualitative templates: transition risk (exposures to carbon-related sectors, fossil fuel companies, real estate by energy performance), physical risk (exposures to chronic and acute climate events by sector and geography), mitigating actions, the Green Asset Ratio and the banking book taxonomy alignment ratio (BTAR), plus qualitative E, S and G risk disclosures.","kt":"","src":"L11 slide 30-31"},{"id":"SB419","l":"L11","t":"Banking regulation","f":"m","d":4,"p":"H","sc":"none","s":"The textbook discusses using bank capital requirements to steer lending towards green projects. What is its position?","o":[["Central banks should decide which low-carbon technologies win.","Carney argues this is for governments, not central bankers."],["Capital requirements should never consider climate risk under any circumstances.","It supports higher weights for brown assets and possible Pillar 2 add-ons when evidence suffices."],["Lower capital risk weights for all green loans, because green projects are always safer.","The textbook says green projects face technology and policy uncertainty."],["Green is not safer, so rather raise brown risk weights.","The textbook prefers a brown penalising factor to a green supporting factor."]],"c":[3],"es":"No green discount (green is not safer); possible brown add-on (stranding risk); Carney warns against using prudential rules for other ends.","ed":"Schoenmaker and Van Tilburg propose using the capital framework to nudge lending; banks do reduce lending when capital requirements tighten. But green projects are uncertain (which technology wins, future carbon taxes), so there is no reason to lower their risk weights; brown assets' risk weights can rise because they may become stranded, creating a wedge. Carney (2015) argues prudential rules designed for financial stability should not be used for other ends; it is for governments to decide. Supervisors can still apply Pillar 2 add-ons for brown concentrations if evidence suffices.","kt":"","src":"Bok s. 301 (10.4.5) · Bok s. 302 (10.4.5)"},{"id":"SB420","l":"L11","t":"Banking regulation","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about regulatory approaches to sustainable lending is correct according to the textbook?","o":[["Weber finds China's policy worsened banks' financial performance.","He finds two-way positive causality between financial and sustainability performance."],["China's Green Credit Policy applies only to state-owned banks.","It is compulsory for all Chinese banks, including joint-stock banks and credit unions."],["Brazil prohibits banks from considering environmental factors.","Brazil requires integration of socio-environmental risk."],["China's Green Credit Policy requires banks to restrict loans to polluting industries and charge them higher rates.","Section 10.4.5."]],"c":[3],"es":"China: compulsory Green Credit Policy (2006); Brazil: central bank socio-environmental risk systems; both mandatory and coordinated.","ed":"China's Green Credit Policy (2006), overseen by environmental, central bank and banking regulators, demands restricted lending and higher rates for polluters and lower rates for green activities, and even withdrawal of loans after controversies; being compulsory for all banks, it limits free-riding. Weber finds Chinese banks' E&S performance improved 2009-13 with positive two-way causality to financial performance. Brazil, motivated by rainforest protection, built on a voluntary Green Protocol to require socio-environmental risk systems. Also correct: Brazil's central bank requires all banks to integrate socio-environmental risks alongside credit, market and operational risks.","kt":"","src":"Bok s. 298 (10.4.2) · Bok s. 299 (10.4.2) · Bok s. 302 (10.4.5) · Bok s. 303 (10.4.5)"},{"id":"SB421","l":"L11","t":"Evidence on sustainable lending","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: Two firms with the same credit rating apply for unsecured loans. Firm A has serious environmental and social controversies; firm B does not. Based on the evidence in the textbook, what should we expect?","o":[["Firm A pays a higher spread, especially as the loan is unsecured.","Lenders charge more for CSR concerns, more so without collateral."],["Both pay the same, since ratings capture everything.","Banks price ESG concerns beyond ratings."],["Firm A pays less, because banks reward risk-taking.","Higher risk means higher spreads."],["Firm B pays more, because CSR spending is wasteful.","Lenders mainly worry about discretionary CSR at low-quality borrowers."]],"c":[0],"es":"ESG concerns → higher loan spreads, especially without collateral.","ed":"Goss and Roberts find CSR concerns raise loan spreads, and Chava finds higher rates for firms with environmental concerns and lower rates for green revenues. Banks act as delegated monitors that price ESG into credit risk.","kt":"Loan spread: the margin over the base rate that a borrower pays, reflecting credit risk and other costs.","src":"Bok s. 299 (10.4.3)"},{"id":"SB422","l":"L11","t":"Barriers and incentives","f":"m","d":3,"p":"M","sc":"none","s":"Which is a barrier to integrating sustainability into lending according to the textbook?","o":[["Loan maturities are typically below ten years, while social and environmental risks are more long term.","Myopic bankers may ignore these risks."],["Banks have no information about their borrowers.","Banks have privileged information through monitoring."],["Regulators prohibit banks from pricing ESG risks.","Several regulators encourage or require it."],["Sustainable loans can never be profitable.","VBB evidence shows stable profitability."]],"c":[0],"es":"Barriers: staff training and incentives, client status quo, short loan maturities vs long-term ESG risks.","ed":"Integrating ESG requires training many account managers and changing due diligence and pricing; frameworks are implemented top down. Existing clients may resist; banks often phase in requirements (BNP Paribas stopped new tobacco financing in 2017 but honoured existing contracts). Short loan maturities can make bankers myopic, but collateral like real estate is long-lived and firms can become unviable quickly if they fail to adapt. Also correct: Account managers are trained to grant loans whenever possible and may resist charging long-standing clients a higher premium.","kt":"","src":"Bok s. 300 (10.4.4) · Bok s. 300 (Box 10.3)"},{"id":"SB423","l":"L11","t":"Barriers and incentives","f":"m","d":3,"p":"H","sc":"short","s":"A bank introduces a standard mortgage rate for homes with energy ratings A-D and a higher rate for ratings E-G. Which reasoning from the textbook supports this?","o":[["Nudging, and energy-efficient homes keep their collateral value.","Thaler and Sunstein's nudge; brown homes are expected to lose value."],["Regulators require banks to refuse all mortgages on E-G homes.","This is a pricing incentive, not a ban."],["Energy-inefficient homes are always cheaper to insure, so they need no premium.","The rationale is about collateral value and emissions, not insurance cost."],["Green homes have higher default rates, so they should pay less to compensate.","Lower pricing reflects lower collateral risk, not higher default."]],"c":[0],"es":"Base rate for green (default option), premium for brown; supports collateral values and household behaviour.","ed":"The nudging theory of change applies a base lending rate to projects with low ESG risk and a premium to those with ESG concerns, making the sustainable option the default. Buildings account for 40% of EU energy use and 36% of emissions; up to 60% of bank lending is mortgages. The European Mortgage Federation's energy-efficient mortgage initiative offers preferential rates for moving homes from the brown (E-G) to the green (A-D) zone. Energy-efficient homes are expected to retain collateral value while inefficient ones decline.","kt":"","src":"Bok s. 301 (10.4.5) · Bok s. 301 (Box 10.4) · Bok s. 291 (10.3)"},{"id":"SB424","l":"L11","t":"Circular economy financing","f":"m","d":4,"p":"M","sc":"none","s":"Why does the textbook say circular (product-as-a-service) business models are harder for banks to finance than linear ones?","o":[["Banks are legally prohibited from lending to circular firms.","No such prohibition exists."],["Circular firms never generate any cash flows.","They generate periodic lease or service payments."],["Cash flows arrive as lease payments and collateral is unclear.","Linear models have clear collateral and sales cash flows; circular ones do not."],["Circular products have shorter lifespans and lower residual values.","They have longer lifespans and higher residual values."]],"c":[2],"es":"Circular: longer payback, lease cash flows, ownership concentration risk, collateral issues → need new credit approaches.","ed":"In linear models, buildings, machines and inventories serve as collateral and loans are repaid from sales. In circular models the producer keeps ownership and earns lease payments over a longer horizon; bank loans typically cover 5-7 years. Legal issues arise (bricks cannot be separated from a house), and retained ownership creates concentration risk (diesel car write-downs). Oliver Wyman estimates 65% of Dutch circular businesses struggle to get finance. Solutions include materials passports, phased finance, isolating the least risky parts, client pre-financing and moving from historical financials to future cash flows.","kt":"","src":"Bok s. 305 (10.5.1) · Bok s. 306 (10.5.1) · Bok s. 307 (10.5.1)"},{"id":"SB425","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A Norwegian savings bank decides to lend only to projects that pass a minimum social or environmental impact test (e.g. energy-efficient housing, organic farming), as long as they are financially viable. How is this classified?","o":[["ESG risk integration (SF 2.0)","SF 2.0 adjusts risk premia; here impact drives selection."],["Exclusion (SF 1.0)","It goes beyond excluding harmful sectors."],["Finance as usual","Impact criteria change who gets loans."],["Value-based banking (SF 3.0)","Impact is the first criterion; viability is a constraint."]],"c":[3],"es":"Impact first, viability as constraint = SF 3.0.","ed":"GABV banks such as Triodos follow this model and show stable, if slightly lower, ROE with lower volatility. Risk-based approaches (SF 1.0-2.0) instead adjust exclusions and risk premia within conventional lending.","kt":"Value-based banking: lending primarily to projects with positive social or environmental impact, with financial viability as a condition (return, risk and impact).","src":"L11 slide 18 · L11 slide 22 · Bok s. 303 (10.5)"},{"id":"SB426","l":"L11","t":"Banking structure","f":"t","d":3,"p":"L","sc":"none","s":"True or false: The US Volcker Rule requires banks to move proprietary trading into a separate legal entity within the same banking group, while the EU Liikanen Report proposes an outright ban on proprietary trading by deposit-taking banks.","o":[["True","Incorrect. It is the reverse: the Volcker Rule prohibits proprietary trading by deposit-taking banks; the Liikanen Report proposes assigning significant trading to a separate legal entity within the group."],["False","Correct. It is the reverse: the Volcker Rule prohibits proprietary trading by deposit-taking banks; the Liikanen Report proposes assigning significant trading to a separate legal entity within the group."]],"c":[1],"es":"False: Volcker = prohibition; Liikanen = separation into a separate entity.","ed":"After the crisis, reforms aimed to protect the core of deposit-taking banking from risky trading. The Volcker Rule bans proprietary trading (with exemptions for market-making, hedging and US government securities). Liikanen proposed ring-fencing trading above a threshold (e.g. 10% of business) into a separate legal entity, preserving Europe's universal banking model. These reforms aim at a more \"real economy\" focused banking system, similar to values-based banks' profile.","kt":"","src":"Bok s. 288 (10.2.1) · Bok s. 289 (10.2.1)"},{"id":"SB427","l":"L11","t":"Material issues","f":"m","d":3,"p":"L","sc":"extended_course_case","s":"Handelsbanken, which performed well in the global financial crisis, defined six material sustainability topics. Which feature of its \"business culture\" topic stands out?","o":[["No performance- or volume-related bonuses.","This is listed under the bank's business culture."],["Outsourcing all lending decisions to central headquarters.","Its topics stress local presence and responsible lending."],["Exclusive focus on maximising quarterly shareholder returns.","It sees shareholder value as achievable only through long-term value for customers and society."],["Bonuses tied to annual loan volume growth.","Handelsbanken explicitly avoids volume-related bonuses."]],"c":[0],"es":"Handelsbanken: customers, community role, indirect impact, employer, business culture (no bonuses), the bank as an investment.","ed":"Handelsbanken's six topics are: the bank and its customers; its role in the community (local presence, taxpayer, not a burden on society); its indirect impact (responsible credits and investments); the bank as an employer; business culture (ethics, no performance- or volume-related bonuses, anti-money laundering); and the bank as an investment. Its strong, low-variance earnings illustrate that a long-term, stakeholder-oriented approach can coexist with profitability.","kt":"","src":"Bok s. 289 (10.2.2) · Bok s. 290 (10.2.2)"},{"id":"SB428","l":"L11","t":"Banking synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A Norwegian bank has a large, long-standing shipping client with an ageing, fuel-inefficient fleet. The client's loans mature over the next five years. Which approach best reflects Lecture 11 and the textbook?","o":[["Price the risk, offer a KPI-linked loan, and phase in tighter terms.","Combines risk-based pricing, nudging via SLLs and a phased approach, preserving the relationship."],["Immediately terminate all existing loans regardless of contracts.","Banks typically honour existing contracts and phase in requirements."],["Ignore the issue because the loans mature within five years.","Short maturities can make bankers myopic, but collateral and viability can deteriorate quickly."],["Lower the client's capital risk weight to reward it for being in transition.","Banks cannot set regulatory weights; green exposures are not inherently safer."]],"c":[0],"es":"Risk-based pricing + engagement/nudging (SLL) + phased tightening, while monitoring collateral values.","ed":"The client's transition risk affects PD (regulation, fuel costs, charterers' requirements) and LGD (vessel collateral may lose value, like diesel cars). The textbook suggests reflecting ESG in the risk premium, using nudges (base rate for compliant, premium for non-compliant), and phasing in requirements for existing clients (BNP Paribas tobacco). SLLs tie margins to KPIs. Exit remains a last resort if the client refuses to adapt. EBA Pillar 3 disclosures make such exposures visible.","kt":"","src":"Bok s. 300 (10.4.4) · Bok s. 301 (10.4.5) · L11 slide 25 · L11 slide 31 · Bok s. 306 (10.5.1)"},{"id":"SB429","l":"L11","t":"Bank climate commitments","f":"m","d":4,"p":"M","sc":"short","s":"In late 2024 and early 2025, the largest US banks left the Net-Zero Banking Alliance amid political pressure, and the FT reported banks increased fossil fuel financing in 2024. What does this suggest about voluntary coalitions?","o":[["Banks have no influence on emissions.","Financing choices affect which projects get built."],["Regulation is unnecessary once banks join coalitions.","The textbook sees regulation and coalitions as complements."],["Without enforcement, members can leave or free ride when pressure shifts.","Weak sanctions are a known weakness of coalitions (Ostrom criteria)."],["Voluntary coalitions always produce binding emission cuts.","The case shows commitments can be abandoned."]],"c":[2],"es":"Voluntary coalitions are fragile without monitoring and sanctions.","ed":"Chapter 4 argues effective coalitions need clear rules, monitoring and sanctions. Disclosure rules (EBA Pillar 3, CSRD) and supervisors can partly substitute for weak voluntary enforcement.","kt":"Free riding: enjoying the benefits of a coalition (reputation) without following its rules or costs.","src":"L11 slide 32 · Bok s. 113 (4.3.1)"},{"id":"SB430","l":"L11","t":"Sustainability and collateral","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook, why does sustainability matter for the collateral banks take?","o":[["Collateral values are fixed by contract and cannot change.","Collateral values fluctuate with markets and regulation."],["Only unsecured loans are exposed to sustainability risk.","Secured loans are exposed through collateral values."],["Electric car batteries have no environmental issues, so EV collateral is risk-free.","The textbook flags lithium mining and disposal as dilemmas."],["Collateral such as inefficient buildings can lose value.","Energy efficiency is a key determinant of real estate's future value."]],"c":[3],"es":"Transition can strand collateral (inefficient real estate, diesel cars); sustainability dilemmas exist (EV batteries).","ed":"Since close to 60% of bank credit is mortgages, real estate energy efficiency is central. Cars with combustion engines may lose value while hybrids and EVs keep theirs, though mining and disposal of lithium for batteries pose land-system concerns - a sustainability dilemma. Banks should consider the full impact of sustainability on a borrower's business model and on collateral when approving loans.","kt":"","src":"Bok s. 291 (10.3) · Bok s. 292 (10.3)"},{"id":"SB431","l":"L11","t":"Competition in sustainable lending","f":"m","d":3,"p":"L","sc":"none","s":"According to the textbook, which three types of social and environmental risk arise in project finance (Weber, 2017)?","o":[["Scope 1, scope 2 and scope 3 emissions.","These are emission categories."],["Interest rate, currency and liquidity risk on the project loans.","These are financial market risks."],["Adverse selection, moral hazard and costly state verification.","These are the monitoring problems banks address."],["Inside-out, outside-in, and reputation risk.","These are the three types in section 10.4.1."]],"c":[3],"es":"Inside-out (project impacts), outside-in (weather, strikes, blockades), reputation risk for financiers.","ed":"Big projects such as hydro dams or mines have large impacts on environment and society (inside-out); they can be hit by extreme weather, strikes, NGO blockades or permit delays (outside-in); and controversies can damage the reputation of the financiers too. Less responsible banks might undercut competitors by ignoring standards on child labour or land degradation; the Equator Principles were developed to avoid this race to the bottom.","kt":"","src":"Bok s. 297 (10.4.1)"},{"id":"TR50","l":"L11","t":"Information asymmetry in banking","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A bank charges every small firm the same average interest rate because it cannot tell good borrowers from bad ones. What tends to happen, and what is the bank's remedy?","o":[["Safe firms drop out and riskier ones stay; the bank must screen before lending","This is adverse selection, the lending version of Akerlof's lemons."],["All firms borrow more, so the bank becomes safer","The pool worsens, so the bank does not become safer."],["Nothing happens, because interest rates reflect true risk","A uniform rate ignores the true risk of each borrower."],["Borrowers take more risk after getting the loan; the bank should raise deposit rates","Risk-taking after the contract is moral hazard, and deposit rates do not fix it."]],"c":[0],"es":"Pooling rates drive out good borrowers; screening fixes this.","ed":"Adverse selection happens before the contract (screening is the remedy); moral hazard after it (monitoring is the remedy). In the lemons example, buyers pay the average price, good sellers leave, and the market can collapse. Banks' size and expertise make screening and monitoring cheaper than for individual lenders.","kt":"Adverse selection: hidden information before a contract leads to bad types crowding out good ones (Akerlof's market for lemons).","src":"Opptak L11 ca. 8 min · Opptak L5 ca. 17 min"},{"id":"TR51","l":"L11","t":"Bank business model","f":"m","d":2,"p":"M","sc":"none","s":"On a bank's balance sheet, where do customer deposits and loans to firms appear, and why do regulators focus on the bank's equity?","o":[["Both are assets; equity measures the number of branches","Deposits are owed to customers, so they are liabilities."],["Deposits: liabilities; loans: assets; equity absorbs losses","Equity is the cushion when loans default, protecting depositors."],["Both are off-balance-sheet; equity only matters for listed banks","Loans and deposits are the core balance sheet items."],["Deposits are assets, loans are liabilities; equity sets the deposit rate","This reverses assets and liabilities for a bank."]],"c":[1],"es":"Deposits = liabilities; loans = assets; equity = loss cushion.","ed":"If loan losses become known, depositors may run, creating liquidity risk. Capital requirements (Basel) force banks to hold enough equity. A proposed \"green asset ratio\" would add a target for the share of green assets.","kt":"","src":"Opptak L11 ca. 16 min · Opptak L11 ca. 48 min"},{"id":"TR52","l":"L11","t":"Sustainability approaches in banking","f":"m","d":3,"p":"H","sc":"short","s":"Triodos Bank only lends to projects with a positive social or environmental impact, provided they are financially viable. How does Lecture 11 classify this?","o":[["Risk-based exclusion, matching SF 1.0","Exclusion only avoids harmful borrowers; it does not require positive impact."],["Finance as usual, with no sustainability goal","Positive impact is the bank's core goal."],["Value-based banking, matching SF 3.0","Impact comes first, subject to financial viability."],["ESG integration in the risk premium, matching SF 2.0","That prices ESG risk into loans rather than requiring impact."]],"c":[2],"es":"Lending for positive impact = value-based (SF 3.0).","ed":"Most banks use the risk-based approach: exclusion (1.0) or integrating ESG into credit scoring and the risk premium (2.0). Value-based banks earned a higher and more stable ROA than global banks in 2006-2015 in the textbook's table, though this is only descriptive.","kt":"","src":"Opptak L11 ca. 32 min · Opptak L11 ca. 40 min"},{"id":"TR53","l":"L11","t":"ESG in credit risk","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Lecture 11 cites evidence that adding sustainability risks to credit models improves the prediction of borrowers' financial performance, suggesting these risks were not fully priced before.","o":[["True","Correct. If ESG risks were already reflected, adding them would not improve predictions."],["False","Incorrect. If ESG risks were already reflected, adding them would not improve predictions."]],"c":[0],"es":"True: ESG information adds predictive power, so it was not fully priced.","ed":"This supports integrating ESG into banks' credit scoring: industry trends, typical paths in the sector, material issues for the firm, and a coherent weighting. It also links to the adaptive market hypothesis: new risks get priced gradually.","kt":"","src":"Opptak L11 ca. 38 min"},{"id":"SB432","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"H","sc":"short","s":"In 2023 State Farm stopped writing new homeowners' policies in California, citing wildfire risk and rising rebuilding costs. What is the most likely knock-on effect discussed in the course?","o":[["Higher insurer solvency requirements set by the EU.","California is not under Solvency II."],["A bigger protection gap, pressure on property values and mortgage lending.","Uninsured homes are harder to finance and sell."],["No effect, because all homes are covered by government insurance.","Public schemes are limited and often costly."],["Lower wildfire risk in California.","Insurance withdrawal does not change the hazard."]],"c":[1],"es":"Insurance retreat → protection gap → lower property values and tighter mortgages.","ed":"The textbook describes this chain for coastal flood risk: annual insurance vs long mortgages creates \"technical default\" risk. Insurers act rationally on risk-based pricing; the social problem shifts to households, banks and governments.","kt":"Protection gap: the share of economic losses from disasters that is not insured.","src":"L12 slide 3 · Bok s. 337 (11.3.2.1)"},{"id":"SB433","l":"L12","t":"Insurance business model","f":"m","d":2,"p":"H","sc":"none","s":"On a typical insurer's balance sheet (Lecture 12, slide 8), what is the role of technical provisions versus equity?","o":[["Equity covers expected claims; technical provisions cover unexpected claims.","The roles are reversed."],["Both are assets that earn investment income.","Both are on the liability side."],["Technical provisions cover expected claims; equity covers unexpected claims.","This mirrors expected loss versus unexpected loss in VaR (slide 16)."],["Technical provisions are the insurer's cash holdings.","They are liabilities for future claims, not cash."]],"c":[2],"es":"TP = expected claims (liability); E = buffer for unexpected claims; assets = investments (insurers as asset managers).","ed":"Insurers collect premiums P, invest them in assets A earning rA, set aside technical provisions TP for expected future claims, and hold equity E as a buffer for unexpected claims. The P&L is premium income + investment income − claims − expenses. The asset side makes insurers major long-term institutional investors, so their investment portfolios also carry material ESG issues (slide 10).","kt":"","src":"L12 slide 8 · Bok s. 318 (Figure 11.1) · L12 slide 16"},{"id":"SB434","l":"L12","t":"Insurance business model","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A non-life insurer with a combined ratio slightly above 100% can still be profitable, because it earns investment income on premiums before claims are paid.","o":[["True","Correct. Profit = (100 − combined ratio) + investment income; investment returns can offset a small underwriting loss."],["False","Incorrect. Profit = (100 − combined ratio) + investment income; investment returns can offset a small underwriting loss."]],"c":[0],"es":"True: investment income can offset a small underwriting loss.","ed":"This is why insurers are large investors and why climate risk matters on both sides of their balance sheet: rising claims (liabilities) and climate-exposed investments (assets).","kt":"Combined ratio: (claims + expenses) / premiums; below 100% means underwriting is profitable on its own.","src":"Bok s. 318 (11.1.1) · Bok s. 319 (11.1.1)"},{"id":"SB435","l":"L12","t":"Material issues in insurance","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: For a Norwegian non-life insurer, climate change is material only on the liability side (claims), not on the asset side, because its investments are in bonds and equities.","o":[["True","Incorrect. Climate risk also affects the insurer's investments (transition and physical risk in bonds and equities); slide 10 explicitly adds investment-related material issues."],["False","Correct. Climate risk also affects the insurer's investments (transition and physical risk in bonds and equities); slide 10 explicitly adds investment-related material issues."]],"c":[1],"es":"False: climate is material on both sides.","ed":"A big storm can raise claims and simultaneously hit the value of real estate or utility investments, so risks correlate. Integrated scenario analysis across both sides is best practice.","kt":"Asset side vs liability side: an insurer's investments (assets) vs its obligations to pay claims (technical provisions).","src":"L12 slide 10 · L12 slide 8"},{"id":"SB436","l":"L12","t":"Material issues","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Swiss Re has treated climate change as its most important material issue for many years. Which element is part of its four-pillar climate strategy (Box 11.2)?","o":[["Quantifying climate risk and integrating it into risk management and underwriting.","Pillar 1; the others are products, awareness and its own footprint."],["Withdrawing from all weather-related catastrophe cover worldwide.","Swiss Re continues to cover weather risk while modelling it better."],["Ignoring its own carbon footprint because it is a financial firm.","Pillar 4 tackles its own footprint with annual reporting."],["Lobbying against any worldwide climate policy framework.","It advocates a worldwide policy framework."]],"c":[0],"es":"Swiss Re: (1) knowledge and integration in underwriting; (2) products to mitigate/adapt; (3) awareness and advocacy; (4) own footprint.","ed":"For a re-insurer, climate change raises the frequency and severity of floods, storms, rainfall and drought; combined with growing asset concentrations in exposed areas, losses rise steadily, and uncertainty makes pricing difficult. Swiss Re also advances renewable energy (risk covers for offshore wind) and food security (weather protection for 1.4 million African smallholders). Its materiality matrix distinguishes priority, management and exploration issues.","kt":"","src":"L12 slide 11 · Bok s. 326 (Box 11.2) · Bok s. 327 (11.2)"},{"id":"SB437","l":"L12","t":"Risk modelling","f":"t","d":2,"p":"M","sc":"none","s":"True or false: According to Lecture 12, catastrophe modelling evaluates a range of possible positive and negative outcomes for the whole insurer, while scenario analysis focuses specifically on losses from natural disasters such as earthquakes and floods.","o":[["True","Incorrect. The definitions are swapped: scenario analysis evaluates a range of outcomes on risk exposure; catastrophe modelling estimates potential losses from catastrophic events."],["False","Correct. The definitions are swapped: scenario analysis evaluates a range of outcomes on risk exposure; catastrophe modelling estimates potential losses from catastrophic events."]],"c":[1],"es":"False: scenario analysis = range of outcomes; catastrophe modelling = losses from catastrophes.","ed":"Risk modelling uses mathematical models to estimate potential losses in various scenarios. Scenario analysis (e.g. NGFS scenarios; DNB's \"Waterproof\" study on Dutch home insurance) compares outcomes under different climate pathways. Catastrophe models estimate losses from specific perils using hazard, vulnerability, exposure, financial loss and platform components.","kt":"","src":"L12 slide 13-15"},{"id":"SB438","l":"L12","t":"Risk modelling","f":"m","d":3,"p":"M","sc":"none","s":"The DNB (2017) \"Waterproof\" scenario analysis (Lecture 12, slide 14) estimates the climate-related claims burden for Dutch home insurance in 2085. What does it show?","o":[["Claims are identical under 1.5°C and 3.5°C.","The 3.5°C scenario shows much larger increases."],["Claims fall in both scenarios as buildings adapt.","Claims increase in both scenarios."],["Claims rise in both scenarios, much more under 3.5°C than under 1.5°C.","Roughly +10-52% under 1.5°C versus +25-131% under 3.5°C."],["Claims rise only under 1.5°C because of transition policies.","Physical claims rise more in the higher warming scenario."]],"c":[2],"es":"Rain, hail and storm claims: +10-52% (1.5°C) vs +25-131% (3.5°C) relative to 2016.","ed":"Scenario analysis makes climate physical risk concrete for insurers. Even under 1.5°C, claims rise; under higher warming they could more than double. Because home insurance is renewed annually, insurers can reprice, but rising premiums can make cover unaffordable and create protection gaps - with knock-on effects for mortgages and house prices.","kt":"","src":"L12 slide 14 · Bok s. 337 (11.3.2.1)"},{"id":"SB439","l":"L12","t":"Catastrophe modelling","f":"m","d":2,"p":"H","sc":"none","s":"A catastrophe model consists of five components. Which is among them?","o":[["Tax component: computes tax deductions on claims","Not one of the five components."],["Credit component: estimates default of reinsurers","Not one of the five components."],["Vulnerability component: relative damage to assets given the hazard","Component 2. of a catastrophe model."],["Dividend component: determines payouts to shareholders","This is not part of a catastrophe model."]],"c":[2],"es":"Hazard, vulnerability, exposure, financial loss, platform.","ed":"(1) hazard - extent and intensity of the event (e.g. peak gust wind speeds); (2) vulnerability - damage functions linking hazard intensity to damage ratios; (3) exposure - building, contents and business interruption values; (4) financial loss - ground-up loss before insurance structures, and who pays; (5) platform - software integrating the components. The output is a loss distribution from which metrics like average annual loss, return period losses and VaR are derived. Also correct: Financial loss component: translates physical damage into monetary (ground-up) loss.","kt":"","src":"L12 slide 15 · Bok s. 331 (11.3.1) · Bok s. 332 (11.3.1)"},{"id":"SB440","l":"L12","t":"Catastrophe modelling","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A \"200-year flood\" cannot happen twice within ten years, because the return period guarantees exactly 200 years between such events.","o":[["True","Incorrect. A return period is an average based on an annual probability (0.5%); such events can occur close together, and climate change can make them more frequent."],["False","Correct. A return period is an average based on an annual probability (0.5%); such events can occur close together, and climate change can make them more frequent."]],"c":[1],"es":"False: return periods are probabilities, not schedules.","ed":"Misreading return periods leads to underestimating tail risk. Climate change also shifts the distribution, so historical return periods can understate future frequency.","kt":"Return period: the inverse of the annual exceedance frequency; a 200-year event has about a 0.5% chance each year.","src":"Bok s. 332 (11.3.1) · Bok s. 333 (Table 11.3)"},{"id":"SB441","l":"L12","t":"Catastrophe modelling","f":"m","d":3,"p":"H","sc":"none","s":"In the loss distribution on Lecture 12, slide 16, what does the \"unexpected loss\" represent and how is it covered?","o":[["Losses that can never occur, so no coverage is needed.","Unexpected losses do occur and require capital."],["Losses from the expected loss up to the VaR confidence level, covered by equity.","Expected loss is covered by technical provisions; unexpected loss by capital."],["All losses beyond the VaR quantile, covered by technical provisions.","Tail losses beyond VaR are not covered by the capital calibration; provisions cover expected loss."],["The mean of the distribution, covered by premiums only.","The mean is the expected loss."]],"c":[1],"es":"EL (mean) → technical provisions; UL (EL to VaR quantile) → equity; beyond VaR → tail risk (re-insurance, cat bonds, government).","ed":"The expected loss is the mean of the distribution and is priced into premiums and technical provisions. The unexpected loss runs from the mean up to a confidence level (e.g. 99.5%) and is covered by capital. Losses in the tail beyond VaR are not covered by the calibration; insurers use re-insurance, cat bonds and government programmes for extreme events. Heavy-tailed distributions (Figure 11.2) and structural uncertainty (Weitzman) make tail estimation hard.","kt":"","src":"L12 slide 16 · L12 slide 8 · Bok s. 319 (11.1.2)"},{"id":"SB442","l":"L12","t":"Catastrophe risk","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Because of the law of large numbers, catastrophe losses with heavy-tailed distributions become just as predictable as small claims once an insurer writes enough policies.","o":[["True","Incorrect. Small claims have light tails and average out in large portfolios; large catastrophe claims have heavy tails, are estimated from few observations, and remain dangerous even in large portfolios."],["False","Correct. Small claims have light tails and average out in large portfolios; large catastrophe claims have heavy tails, are estimated from few observations, and remain dangerous even in large portfolios."]],"c":[1],"es":"False: heavy-tailed catastrophe losses do not average out like small claims.","ed":"Small claims (e.g. car accidents) follow light-tailed distributions, so average claims approach the expected value in a large portfolio. Catastrophes are low-probability, high-impact events from heavy-tailed distributions (e.g. log-normal), estimated from few extreme observations. Many policies may be hit by the same event (correlation), which is why catastrophe risk is shared across insurers, re-insurers, capital markets and governments.","kt":"","src":"Bok s. 319 (11.1.2) · L12 slide 15 · L12 slide 18"},{"id":"SB443","l":"L12","t":"Risk sharing","f":"m","d":3,"p":"H","sc":"short","s":"The January 2025 Los Angeles wildfires caused insured losses estimated in the tens of billions of USD. How does the course explain that individual insurers can survive such an event?","o":[["Losses are spread via re-insurance, cat bonds and sometimes government schemes.","Risk is layered across insurers, re-insurers and capital markets."],["Catastrophe losses are always paid by the central bank.","Central banks do not pay insurance claims."],["Insurers keep enough cash to pay any catastrophe alone.","A single insurer's equity would be wiped out by extreme events."],["Policyholders pay their own losses after the event.","Insured losses are paid by insurers (and their reinsurers)."]],"c":[0],"es":"Layered risk sharing: insurer → re-insurer → cat bond investors → government.","ed":"Cat bonds give investors high yields that are uncorrelated with markets, but they lose principal if a defined catastrophe occurs. Climate change raises frequency and severity, so pricing and capacity are under pressure.","kt":"Re-insurance: insurance for insurers; excess-of-loss contracts pay losses above a retention limit.","src":"L12 slide 18 · Bok s. 322 (11.1.3)"},{"id":"SB444","l":"L12","t":"Risk sharing","f":"m","d":3,"p":"M","sc":"none","s":"Why do (institutional) investors buy catastrophe bonds, according to the textbook?","o":[["They are guaranteed by governments and carry no risk.","Investors bear the catastrophe risk."],["They are highly correlated with equities, so they hedge stock market crashes.","Their attraction is low correlation, not hedging equities."],["They pay relatively high rates and natural disasters are uncorrelated with markets.","Cat bonds help investors diversify."],["They always pay their scheduled coupons regardless of disasters.","Payments can be skipped or deferred after a catastrophe."]],"c":[2],"es":"Cat bonds: high yield + low correlation → diversification; payments skipped/deferred after a trigger.","ed":"Cat bonds transfer insurance risk to capital markets. If a catastrophe exceeds a threshold, the issuer can skip or defer scheduled payments. Because natural disasters occur randomly, cat bonds have low correlation with stocks and other common factors. Climate change complicates pricing, as the hazard distribution shifts over time.","kt":"","src":"Bok s. 323 (11.1.3) · L12 slide 18"},{"id":"SB445","l":"L12","t":"Asymmetric information","f":"m","d":3,"p":"M","sc":"none","s":"Rothschild and Stiglitz (1976) propose a two-tier contract structure with self-selection. How does it address adverse selection in insurance?","o":[["High-risk types are forced to accept deductibles while low-risk types get full cover.","It is the low-risk types who accept partial cover."],["All clients must buy full coverage at the same price.","A pooled price drives low-risk types out - the adverse selection problem."],["Insurers observe all risk types directly, so no contract design is needed.","The problem arises because insurers cannot observe types ex ante."],["Low-risk types choose partial cover (deductibles), high-risk types full cover at a higher premium.","Low-risk clients reveal themselves by accepting a deductible or co-insurance."]],"c":[3],"es":"Adverse selection (ex ante) → self-selection via deductibles; moral hazard (ex post) → incomplete cover to keep incentives.","ed":"Adverse selection arises because the insured knows more about their risk; high-risk types are most eager to buy. Self-selecting contracts separate types. Moral hazard arises when behaviour affects outcomes but is costly to observe; complete coverage may not be attainable because efficient incentives require the insured to bear some consequences. Shiller notes missing markets even in rich countries (only about 10% of Californian homes have earthquake cover).","kt":"","src":"Bok s. 324 (11.1.4)"},{"id":"SB446","l":"L12","t":"Climate change and insurance","f":"m","d":3,"p":"M","sc":"none","s":"The IPCC assigns confidence levels to climate change impacts on natural hazards (textbook section 11.3.2). Which statement is correct?","o":[["Drought intensification has \"very high confidence\" everywhere.","Medium confidence in some regions, low elsewhere."],["Projected changes in riverine floods carry \"high confidence\".","There is \"low confidence\" in riverine flood projections."],["Heavy rainfall frequency is \"unlikely\" to increase.","It is \"likely\" to increase over many areas."],["Rising coastal high water levels are \"very likely\".","Very likely (90-100%)."]],"c":[3],"es":"Heat extremes virtually certain; sea-level-driven high water very likely; heavy rainfall likely; intense cyclones more likely than not; drought medium; river floods low confidence.","ed":"The ocean absorbs over 90% of excess heat, raising sea levels and intensifying weather. IPCC likelihood terms: virtually certain 99-100%, very likely 90-100%, likely 66-90%, about as likely as not 33-66%. Landslides have high confidence links to heat, glacier retreat and rainfall. Under RCP2.6, mean sea-level rise in 2100 is 44 cm (28-60 cm). Insurers frequently update catastrophe models because climate change shifts frequency, severity and geography of hazards. Also correct: More warm extremes and fewer cold extremes globally are \"virtually certain\".","kt":"","src":"L12 slide 21 · Bok s. 333 (11.3.2) · Bok s. 334 (11.3.2) · Bok s. 335 (11.3.2)"},{"id":"SB447","l":"L12","t":"Climate change and insurance","f":"m","d":4,"p":"H","sc":"short","s":"The textbook shows that a modest sea-level rise can turn today's 100-year floods into events that occur every few years in some cities. What does this imply for insurers and investors?","o":[["Sea-level rise only matters after 2100.","Effects grow over coming decades."],["Flood risk grows linearly, so past data are a good guide.","The relation is exponential, not linear."],["Flood risk grows non-linearly, so extrapolating past losses underestimates it.","Small changes in sea level cause large increases in flood frequency."],["Insurers can ignore flood risk because they reprice yearly.","Repricing helps but creates protection gaps and affects property values."]],"c":[2],"es":"Non-linear flood risk → history underestimates future losses.","ed":"Catastrophe models must be updated for climate trends. Knock-on effects include insurance retreat, falling house prices and tighter mortgage lending in coastal areas.","kt":"Non-linear (exponential) risk: a small change in a driver causes a much larger change in outcomes.","src":"Bok s. 337 (Figure 11.7) · Bok s. 338 (Table 11.4) · Bok s. 337 (11.3.2.1)"},{"id":"SB448","l":"L12","t":"Climate change and insurance","f":"m","d":4,"p":"H","sc":"none","s":"As flood risk rises, property insurance may retreat from coastal areas or become prohibitively expensive. What knock-on effect does the textbook highlight for banks?","o":[["Banks benefit because uninsured homes rise in value.","House prices in areas where insurance retreats are likely to decline."],["Banks are unaffected because mortgages never depend on insurance.","Insurance is often a requirement for residential mortgages."],["Banks must automatically take over insurance obligations.","Banks do not assume insurers' obligations."],["Mortgages often require insurance, so losing cover can trigger technical default; banks may tighten lending.","The maturity mismatch (annual insurance vs long mortgages) worsens this."]],"c":[3],"es":"Insurance retreat → lower house prices, technical default risk, tighter mortgage terms → possible abandonment of coastal areas.","ed":"Residential insurance is renewed annually while mortgages last a decade or more. If insurers withdraw or premiums soar, homeowners may breach mortgage conditions (\"technical default\"), house prices fall, and infrastructure investment becomes harder to justify. Bankers may lend less, require more equity or shorten terms, so coastal areas may be abandoned before risks materialise. This connects physical risk in insurance with collateral risk in banking (Lecture 11).","kt":"","src":"Bok s. 337 (11.3.2.1) · Bok s. 338 (11.3.2.1) · L11 slide 31"},{"id":"SB449","l":"L12","t":"Climate change and insurance","f":"m","d":5,"p":"M","sc":"none","s":"Weitzman (2009) analyses structural uncertainty in low-probability, high-impact climate catastrophes. What is his key implication?","o":[["Fat tails can outweigh discounting effects, strengthening the case for action.","Uncertain parameters fatten predictive tails so much that catastrophe risk dominates."],["Climate catastrophes are impossible, so insurers can ignore them.","His point is precisely that catastrophe is theoretically possible."],["Bayesian learning removes all tail risk, so discounting dominates.","Even with Bayesian updating, uncertain structural parameters fatten the tails."],["Uncertainty means climate policy should be delayed until all parameters are known.","The fat-tail argument implies precaution rather than delay."]],"c":[0],"es":"Structural uncertainty → fattened tails → catastrophe risk can dominate discounting in climate economics.","ed":"When key parameters (e.g. climate sensitivity, damages at high temperatures) are uncertain, posterior-predictive distributions get fat tails that prior knowledge cannot bound. The expected cost of catastrophe can then outweigh the effects of discounting future damages - a strong argument for precautionary mitigation. For insurers, it means historical data and standard models can underestimate tail losses.","kt":"","src":"Bok s. 335 (11.3.2) · Bok s. 319 (11.1.2)"},{"id":"SB450","l":"L12","t":"Mitigation and adaptation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook stresses that insurance only transfers the financial part of disaster risk and should therefore come after risk reduction measures such as early warning systems and flood defences.","o":[["True","Correct. Insurance does not save lives or prevent damage; risk reduction and adaptation should be prioritised, with insurance as a complement."],["False","Incorrect. Insurance does not save lives or prevent damage; risk reduction and adaptation should be prioritised, with insurance as a complement."]],"c":[0],"es":"True: insurance complements, not replaces, risk reduction.","ed":"Only a minority of disaster losses are insured, especially in developing countries. Insurance can also strengthen incentives for risk-reducing behaviour through pricing.","kt":"Adaptation: actions that help communities and ecosystems cope with a changing climate (e.g. flood defences, early warning).","src":"Bok s. 339 (11.3.3)"},{"id":"SB451","l":"L12","t":"Mitigation and adaptation","f":"m","d":4,"p":"L","sc":"none","s":"Box 11.3 proposes a global climate risk pool, with contributions from all countries, to help vulnerable countries recover from extreme weather shocks. Why would the pool only insure events that significantly exceed the trend line?","o":[["A rising trend is predictable and needs adaptation; insurance suits unexpected deviations.","The pool covers the shock part, not the expected climate trend."],["Because events below the trend are always uninsurable by law.","There is no such law; it is an insurance design principle."],["Because only rich countries can experience events above trend.","Equatorial low- and middle-income countries are the most vulnerable."],["Because the pool wants to avoid paying any claims.","It is meant to pay for extreme shocks."]],"c":[0],"es":"Insure deviations above the climate trend (shocks), not the predictable trend itself.","ed":"Extreme weather can damage a large share of a vulnerable country's productive capacity, cut tax revenues and raise reconstruction spending, risking a fiscal and macroeconomic downward spiral. Protecting every country against the most extreme events is neither possible nor cost-efficient; a pool insuring events far above the trend (e.g. a storm surge of 11.3 m vs a trend of about 10 m) helps countries recover from the initial shock. Expected trend increases require adaptation investment instead.","kt":"","src":"Bok s. 340 (Box 11.3)"},{"id":"SB452","l":"L12","t":"Environmental and liability risk","f":"m","d":3,"p":"M","sc":"none","s":"Shapira and Zingales (2017) study DuPont's pollution, which ended up costing about a billion dollars. What do internal documents suggest?","o":[["Regulators detected the pollution immediately and fully deterred it.","Control mechanisms failed."],["The pollution was an unforeseeable accident.","They rule out ignorance and unexpected realisation."],["DuPont's insurers forced it to pollute to cut costs.","Insurers played no such role."],["Polluting was a rational choice given low detection odds; liability, regulation and reputation failed to deter it.","The company controlled most of the information."]],"c":[3],"es":"DuPont case: pollution rational ex ante for the firm, harmful for society; deterrence failed because the firm controlled information.","ed":"Liability risks can grow dramatically over time - US asbestos losses are estimated at $85bn. Pollution insurance covers third-party liability from sudden accidental releases and clean-up costs. Tobacco firms paid large settlements, and oil companies might face similar climate liability, raising governance issues (ExxonMobil shareholders passed a climate risk disclosure resolution with 62%). These liabilities hit insurers to the extent they are covered by policies.","kt":"","src":"Bok s. 327 (11.2.1) · Bok s. 328 (11.2.1) · Bok s. 329 (11.2.3)"},{"id":"SB453","l":"L12","t":"Social issues in insurance","f":"t","d":2,"p":"L","sc":"none","s":"True or false: The textbook presents AIA Vitality as an example of a health insurer that rewards clients for healthy living, which can improve clients' health and lower the insurer's health-care costs.","o":[["True","Correct. Section 11.2.2 describes AIA Vitality as a science-backed wellness programme where engaged clients have lower health-care costs."],["False","Incorrect. Section 11.2.2 describes AIA Vitality as a science-backed wellness programme where engaged clients have lower health-care costs."]],"c":[0],"es":"True: wellness incentives align client health and insurer costs.","ed":"Ageing populations raise health-care costs, and governments offload part of them to private insurers, who then have incentives to contain costs at providers and clients. Other social themes: supplementary income insurance (unemployment, disability) as welfare states shrink, terrorism risk, liability questions from driverless cars, data privacy and cyber security.","kt":"","src":"Bok s. 328 (11.2.2)"},{"id":"SB454","l":"L12","t":"Principles for Sustainable Insurance","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A PSI signatory is asked to insure a new thermal coal mine. Which response is most consistent with PSI principle 1 (embed ESG in decision-making)?","o":[["Refuse to insure any mining company worldwide.","PSI does not prescribe blanket bans."],["Insure it at the standard price without assessment.","That ignores ESG in underwriting."],["Insure it but keep the decision secret.","Principle 4 calls for transparency."],["Assess its ESG risks in underwriting, which may mean refusing cover.","Principle 1 embeds ESG issues in insurance decisions."]],"c":[3],"es":"Embed ESG in underwriting decisions.","ed":"Several European insurers (e.g. AXA, Swiss Re) restrict underwriting for new coal projects. Insurance is a lever: without cover, many projects cannot get financing.","kt":"Underwriting: assessing and pricing the risk of a client or project, and deciding whether to insure it.","src":"L12 slide 24"},{"id":"SB455","l":"L12","t":"Insurance regulation","f":"m","d":3,"p":"M","sc":"none","s":"According to Lecture 12 (slide 25), which statement about EU insurance regulation since 2 August 2022 is correct?","o":[["The IDD sets capital requirements for catastrophe risk.","The IDD regulates product design and distribution; capital is in Solvency II."],["Solvency II bans insurers from holding any equities.","No such ban exists."],["Solvency II was abolished and replaced by the CSRD.","Solvency II remains the core prudential framework."],["The Insurance Distribution Directive integrates sustainability into product governance and suitability assessments.","Stated on Lecture 12, slide 25."]],"c":[3],"es":"Solvency II (capital, risk management) and IDD (product governance, suitability) amended in 2022 to include sustainability.","ed":"Solvency II codifies and harmonises EU insurance regulation with a focus on capital requirements (99.5% VaR, a 1-in-200-year calibration). Since August 2022, delegated acts require insurers to integrate sustainability risks in risk management and product governance, and the IDD requires sustainability preferences in suitability assessments when advising clients. Insurers are also covered by SFDR (as financial market participants) and CSRD. Also correct: Solvency II delegated acts integrate sustainability risks into insurers' risk management, rules of conduct and product governance.","kt":"","src":"L12 slide 25 · L7 slide 20"},{"id":"SB456","l":"L12","t":"Microinsurance","f":"m","d":2,"p":"M","sc":"none","s":"How does microinsurance help low-income people avoid the poverty trap, according to Lecture 12 and the textbook?","o":[["It guarantees a fixed monthly income regardless of events.","It pays when insured events occur, not a fixed income."],["It is always highly profitable for commercial insurers.","Microinsurance firms are difficult to sustain and make profitable."],["It provides large loans to start businesses.","That describes microcredit, not microinsurance."],["It swaps uncertain shocks for small regular premiums, smoothing income and consumption.","Risk pooling ex ante and shock absorption ex post reduce vulnerability."]],"c":[3],"es":"Microinsurance: low-priced cover for health and property risks; reduces vulnerability to shocks.","ed":"Microinsurance protects low-income people and micro-enterprises against health (illness, injury, death) and property (damage, loss) risks through crop, livestock, health, life, disability and disaster products. It improves access to health care and reduces catastrophic expenditures. Economically, providers are hard to sustain; catastrophe microinsurance often survives only with large subsidies (India's crop programme: farmers pay about 10% of the premium).","kt":"","src":"L12 slide 27 · Bok s. 340 (11.4) · Bok s. 341 (11.4)"},{"id":"SB457","l":"L12","t":"Microinsurance","f":"m","d":3,"p":"L","sc":"none","s":"What is the \"partner-agent model\" of microinsurance described in the textbook?","o":[["A commercial insurer designs the product and a local mutual or MFI distributes it.","It combines professional skills and diversification with local outreach."],["A government sells insurance directly without private partners.","This is not the partner-agent model."],["A re-insurer lends money to microfinance clients.","Re-insurers do not lend to clients in this model."],["Clients insure each other informally without any institution.","That describes informal mutual insurance."]],"c":[0],"es":"Suppliers: commercial insurers, community-based schemes/mutuals, MFIs; partner-agent combines them.","ed":"Commercial insurers bring skills and diversification but struggle to reach the poorest; community-based schemes have local knowledge but lack professionalism and are vulnerable to common shocks; MFIs have networks and existing clients. Rwanda's community-based health insurance reached 84% enrolment and helped cut maternal mortality by 79% (1990-2015). For-profit and larger providers tend to be more efficient.","kt":"","src":"Bok s. 341 (11.4.1) · Bok s. 342 (11.4.1) · Bok s. 343 (11.4.2)"},{"id":"SB458","l":"L12","t":"Microinsurance","f":"m","d":4,"p":"M","sc":"short","s":"A Kenyan farmer buys weather-index insurance paid automatically via mobile money when rainfall at a weather station falls below a threshold. His field is 40 km from the station. What risk does the textbook warn about?","o":[["Interest rate risk on his savings account.","Unrelated to index insurance design."],["Basis risk: the index can diverge from his losses, making cover more like a lottery ticket.","Large distances between the index location and the field make cover imprecise."],["Moral hazard: he can control rainfall at the weather station.","An objective index precisely limits moral hazard."],["Liquidity risk: mobile money cannot transfer payouts.","Mobile money is the payout channel that makes the product feasible."]],"c":[1],"es":"Index insurance cuts costs and fraud but creates basis risk (index ≠ actual loss).","ed":"Parametric products use objective data (weather stations, satellite data) to pay claims automatically, lowering costs and enabling distribution via mobile phones - by 2016 over 1 million farmers in Kenya, Tanzania and Rwanda had bought crop and livestock index cover (ACRE). But basis risk - the gap between index-triggered payouts and actual losses - can make cover imprecise and undermine trust and renewals. Low understanding (illiteracy) and difficult claims processes also impede microinsurance.","kt":"","src":"Bok s. 343 (Box 11.4) · Bok s. 342 (11.4.1)"},{"id":"SB459","l":"L12","t":"Measuring disaster impact","f":"t","d":4,"p":"L","sc":"none","s":"True or false: Noy's (2016) life years index values human lives equally across countries and scales monetary losses by annual income, so a dollar lost in a low-income country counts for more than a dollar lost in a high-income country.","o":[["True","Correct. Box 11.1: the index converts losses into life-year units (losses / annual income) and treats the value of human life as equal everywhere."],["False","Incorrect. Box 11.1: the index converts losses into life-year units (losses / annual income) and treats the value of human life as equal everywhere."]],"c":[0],"es":"True: people-centric index, equal value of life, losses scaled by income.","ed":"The standard measure (losses + victims × years lost × annual income) values deaths more in rich countries. The life years index = losses/annual income + deaths × years lost + affected people × years to recover. It better captures how disasters affect people, supporting fairer allocation of disaster risk reduction resources. Insured-loss rankings (Table 11.1) are dominated by the US, Europe and Japan due to higher insurance density, while events like the 2004 Indian Ocean tsunami (220,000 deaths) barely appear.","kt":"","src":"Bok s. 321 (Box 11.1) · Bok s. 321 (11.1.2.1)"},{"id":"SB460","l":"L12","t":"Insurance synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A Nordic non-life insurer writes home insurance in flood-prone coastal areas and holds a large bond portfolio of coastal real estate companies and utilities. Which assessment best reflects Lecture 12?","o":[["Climate risk can be ignored because catastrophe bonds always cover all losses.","Cat bonds and reinsurance cover parts of the risk, not everything."],["Annual repricing removes all climate risk, so no modelling is needed.","Repricing helps but risks protection gaps, correlated asset losses and tail events."],["Only the liability side matters, because bonds are risk-free.","Bonds of exposed issuers carry credit and physical/transition risk."],["Climate risk hits both claims and investments, so integrate scenarios across both sides and use reinsurance.","Physical risk raises claims; the same hazards and transition can hit asset values - correlated risk."]],"c":[3],"es":"Correlated exposure: claims (liabilities) and investment losses (assets) from the same climate hazards → integrated scenario analysis.","ed":"SASB lists physical impacts of climate change as material for insurers, and slide 10 adds investment-related issues. A flood can raise claims while also lowering the value of coastal real estate bonds, so risks on both sides correlate. Tools: scenario analysis (DNB Waterproof), catastrophe models, VaR-based capital (Solvency II), reinsurance and cat bonds, and ESG in investments. Annual repricing limits liability-side exposure but can create protection gaps wit
