 not only as means.","o":[["True","Correct. Evan and Freeman base stakeholder theory on Kant: treat stakeholders as ends, not only as means."],["False","Incorrect. Evan and Freeman base stakeholder theory on Kant: treat stakeholders as ends, not only as means."]],"c":[0],"es":"Sant. Evan og Freeman bygger på Kant: stakeholders er mål i seg selv, ikke bare midler.","ed":"Evan og Freeman mener stakeholder theory langt på vei bygger på Kant. Alle stakeholders (ansatte, kunder, lokalsamfunn) skal behandles som mål i seg selv, ikke bare som midler for å tjene penger til eierne. Husk: stakeholder theory har røtter i Kant.","kt":"","src":"Crane s. 18 · L4 slide 13"},{"id":"SB043","l":"L2","t":"Kant's ethics of duty","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A key criticism of Kant is that he focuses too much on outcomes and too little on duty.","o":[["True","Incorrect. The criticism is the opposite: Kant pays too little attention to outcomes."],["False","Correct. The criticism is the opposite: Kant pays too little attention to outcomes."]],"c":[1],"es":"Usant. Kritikken er motsatt: Kant bryr seg for lite om utfall.","ed":"Kritikken mot Kant er at han ser for lite på konsekvenser. Eksempelet er at man ikke skal lyve, selv om en løgn kunne redde et uskyldig liv. Det er utilitarianism som fokuserer på utfall. Husk: Kant = plikt først, selv om utfallet blir dårlig.","kt":"","src":"Crane s. 19"},{"id":"SB044","l":"L2","t":"Rights and justice","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"A board defends a huge CEO bonus: it helps the lowest-paid workers too, and the CEO job is open to anyone. Which theory supports this?","o":[["Postmodern ethics","Incorrect: postmodern ethics relies on gut feeling, not principles about distribution."],["Ethical egoism","Incorrect: egoism would only look at the CEO's own interest."],["Kant's categorical imperative","Incorrect: Kant is about duty and universal rules."],["Rawls' theory of justice","Correct: Rawls accepts inequality that helps the worst-off and is open to all."]],"c":[3],"es":"Ulikhet er ok hvis den hjelper de svakeste og jobben er åpen for alle. Det er Rawls.","ed":"Rawls' theory of justice godtar ulikhet hvis to betingelser holder: den må komme de dårligst stilte til gode (difference principle), og posisjonene må være åpne for alle (fair equality of opportunity). Styret bruker akkurat disse to argumentene. Husk: Rawls = ulikhet ok hvis den hjelper de svakeste.","kt":"","src":"L2 slide 9 · Crane s. 26 · Crane s. 27"},{"id":"SB045","l":"L2","t":"Rights and justice","f":"m","d":2,"p":"M","sc":"none","s":"Under the UN Guiding Principles (Ruggie), the main duty of business is to:","o":[["Respect human rights","Correct: business must respect human rights."],["Enforce human rights laws where the state is weak","Incorrect: protecting and enforcing is the state's duty."],["Report only issues that affect profits","Incorrect: the duty applies whatever the effect on profit."],["Act as a court for victims","Incorrect: courts are the state's job."]],"c":[0],"es":"Under UNGP skal staten beskytte, mens business skal respektere menneskerettigheter.","ed":"UN Guiding Principles (Ruggie) har tre pilarer: staten skal beskytte (protect), business skal respektere (respect), og ofre skal ha tilgang til rettsmidler (remedy). Business sitt ansvar er altså å ikke krenke rettigheter, og å gjøre due diligence. Husk: Protect – Respect – Remedy.\n\nForkortelser: UNGP = UN Guiding Principles on Business and Human Rights (Ruggie).","kt":"","src":"Crane s. 21 · Crane s. 22"},{"id":"SB046","l":"L2","t":"Ethical theories","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A CEO who says \"we invest in worker safety because accidents hurt our profits in the long run\" is reasoning like an ethical egoist.","o":[["True","Correct. The reason given is the firm's own interest (profit), which is ethical egoism."],["False","Incorrect. The reason given is the firm's own interest (profit), which is ethical egoism."]],"c":[0],"es":"Sant. Begrunnelsen er firmaets egen langsiktige interesse. Det er ethical egoism.","ed":"Ethical egoism sier at man skal handle i egen langsiktige interesse. Her begrunner CEO-en sikkerhetstiltak med at ulykker skader profitten. Resultatet er bra for arbeiderne, men begrunnelsen er egeninteresse (enlightened self-interest). Husk: \"fordi det lønner seg for oss\" = egoism.","kt":"Ethical egoism: an action is right if it maximises the decision-maker's long-term self-interest.","src":"L2 slide 9 · Crane s. 12"},{"id":"SB047","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"H","sc":"none","s":"Which theory and focus are correctly matched?","o":[["Ethics of care - universal rules","Incorrect: ethics of care is about relationships, not universal rules."],["Virtue ethics - total welfare","Incorrect: virtue ethics is about character; total welfare is utilitarianism."],["Discourse ethics - open, honest dialogue","Correct: discourse ethics finds norms through open, honest dialogue."],["Postmodern ethics - fixed rules for every culture","Incorrect: postmodern ethics rejects fixed rules."]],"c":[2],"es":"Discourse ethics = åpen, ærlig dialog med de berørte.","ed":"Kort oversikt over de \"nyere\" teoriene: ethics of care handler om relasjoner og ansvar for nære personer. Virtue ethics handler om god karakter. Discourse ethics (Habermas) sier at riktige normer finnes gjennom åpen og ærlig dialog mellom de berørte. Postmodern ethics avviser faste regler og stoler på den moralske impulsen. Husk: discourse = dialog.","kt":"","src":"L2 slide 10 · Crane s. 31"},{"id":"SB048","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"A manager under pressure to hide a product defect asks: \"What would an honest, brave professional do?\" This reflects:","o":[["Virtue ethics","Correct: he asks what a person of good character would do."],["Discourse ethics","Incorrect: discourse ethics would bring the affected parties together."],["Ethical relativism","Incorrect: relativism would follow local norms."],["Act utilitarianism","Incorrect: act utilitarianism would add up benefits and harms."]],"c":[0],"es":"\"Hva ville en ærlig og modig person gjort?\" er virtue ethics.","ed":"Virtue ethics spør ikke \"hvilken regel gjelder\" eller \"hva gir best resultat\", men \"hva ville en god person gjort?\". Ærlighet og mot er dyder. Når lederen spør hva en ærlig og modig profesjonell ville gjort, bruker han virtue ethics. Husk: virtue = karakter.","kt":"","src":"L2 slide 10 · Crane s. 31 · Crane s. 32"},{"id":"SB049","l":"L2","t":"Alternative ethical theories","f":"t","d":3,"p":"M","sc":"none","s":"True or false: An ethic of care says that universal, impartial rules should always come before the needs of specific people.","o":[["True","Incorrect. Ethics of care puts specific relationships first, not impartial universal rules."],["False","Correct. Ethics of care puts specific relationships first, not impartial universal rules."]],"c":[1],"es":"Usant. Ethics of care setter relasjoner og konkrete personer foran universelle regler.","ed":"Ethics of care ser mennesker som avhengige av hverandre, ikke som uavhengige individer. Den godtar at de nærmeste (familie, kolleger, lokalsamfunn) kan ha sterkere krav på oss enn fremmede. Universelle, upartiske regler er mer typisk for Kant. Husk: care = nære relasjoner teller ekstra.","kt":"","src":"L2 slide 10 · Crane s. 35 · Crane s. 36"},{"id":"SB050","l":"L2","t":"Alternative ethical theories","f":"m","d":4,"p":"M","sc":"none","s":"According to Bauman's postmodern ethics, strict rules in large organisations can harm moral behaviour because:","o":[["People follow rules and lose sight of victims","Correct: rules replace personal morals, and victims become invisible."],["Managers become too emotional","Incorrect: postmodern ethics welcomes emotions."],["Managers must weigh every pleasure and every pain","Incorrect: this is a criticism of utilitarianism."],["Stakeholders get too much say","Incorrect: Bauman is about the individual's moral impulse, not stakeholders."]],"c":[0],"es":"Folk følger reglene og slutter å se ofrene.","ed":"Bauman (postmodern ethics) mener moral kommer fra en indre impuls når vi møter andre mennesker. I store organisasjoner blir moral gjort om til regler og prosedyrer. Da følger folk reglene og slutter å se ofrene, og den moralske impulsen kveles. Husk: Bauman = regler kveler moralen.","kt":"","src":"L2 slide 10 · Crane s. 39 · Crane s. 84"},{"id":"SB051","l":"L2","t":"Ethical pluralism","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Crane et al. recommend choosing one best ethical theory and using it for every business problem.","o":[["True","Incorrect. Crane et al. recommend using several theories together, like a prism, not one lens."],["False","Correct. Crane et al. recommend using several theories together, like a prism, not one lens."]],"c":[1],"es":"Usant. De anbefaler å bruke flere teorier sammen (en \"prism\", ikke én \"lens\").","ed":"Crane et al. anbefaler ikke å velge én teori. De bruker et \"prism\"-bilde: hver teori belyser saken fra en vinkel, og sammen gir de et bedre bilde. Dette kalles en pluralistisk tilnærming. Husk: flere teorier, ikke én.","kt":"","src":"Crane s. 41 · Crane s. 42 · Crane s. 43"},{"id":"SB052","l":"L2","t":"Ethical pluralism","f":"m","d":3,"p":"H","sc":"none","s":"Crane et al. turn each theory into a question a manager might ask. Which pairing is correct?","o":[["\"What does my gut tell me?\" - rights","Incorrect: \"what does my gut say\" is postmodern ethics."],["\"What if everybody did this?\" - duty","Correct: \"what if everybody did this?\" is Kant's duty test."],["\"Does this protect relationships?\" - utilitarianism","Incorrect: \"does this protect relationships\" is ethics of care."],["\"Am I treating everyone fairly?\" - egoism","Incorrect: \"am I fair to everyone\" is justice, not egoism."]],"c":[1],"es":"\"Hva hvis alle gjorde dette?\" = duty (Kant).","ed":"Crane et al. gjør hver teori om til ett spørsmål. Egoism: hva er i min langsiktige interesse? Utilitarianism: hva gir mest total nytte? Kant/duty: hva hvis alle gjorde dette? Rights: hvem sine rettigheter krenkes? Justice: er dette rettferdig? Care: beskytter det relasjonene? Postmodern: hva sier magefølelsen? Husk: \"alle\" = Kant.","kt":"","src":"Crane s. 43 · L2 slide 9-10"},{"id":"SB053","l":"L2","t":"Ethical theories applied: Tesla case","f":"m","d":5,"p":"H","sc":"extended_course_case","s":"During COVID-19, Elon Musk reopened a Tesla factory against state orders. Which evaluation is correct?","o":[["Discourse ethics approves, since he announced it","Incorrect: discourse ethics requires dialogue, not just an announcement."],["An ethic of care would look only at shareholders","Incorrect: ethics of care looks at relationships with those affected, not only shareholders."],["Kant asks: could all firms do this?","Correct: Kant tests whether all firms could act like this."],["Relativism says it broke universal laws","Incorrect: relativism does not believe in universal laws."]],"c":[2],"es":"Kant spør: kan alle firmaer gjøre dette? Hvis ikke, er det galt.","ed":"Kant-vurderingen spør om regelen bak handlingen kunne gjelde for alle: \"bryt myndighetenes pålegg når det passer deg\". Hvis alle firmaer gjorde det, ville smittevernreglene bryte sammen. Discourse ethics ville krevd ekte dialog med de berørte, og relativism avviser universelle lover. Husk: Kant = universalisability.","kt":"","src":"L2 slide 2-3 · L2 slide 9-11 · L2 slide 22"},{"id":"SB054","l":"L2","t":"Ethical decision-making","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank employee sells complex products to elderly customers to hit targets, without seeing it as an ethical issue. Where does the decision process fail first?","o":[["Recognising the moral issue","Correct: she never sees the situation as an ethical issue."],["Moral judgement","Incorrect: judgement only comes after the issue is recognised."],["Establishing a moral intent to act","Incorrect: intent comes even later."],["Moral behaviour","Incorrect: it already fails at the first step."]],"c":[0],"es":"Hun ser ikke engang at det er et etisk problem. Første steg feiler.","ed":"Beslutningsmodellen har fire steg: recognise the moral issue → make a moral judgement → establish moral intent → moral behaviour. Bankansatte som ikke ser at salget til eldre er et etisk spørsmål, feiler allerede på første steg. Husk: først må du se at det er et etisk problem.","kt":"Ethical decision-making stages: recognise the issue → make a judgement → establish intent → act.","src":"L2 slide 14 · Crane s. 36"},{"id":"SB055","l":"L2","t":"Ethical decision-making model","f":"t","d":2,"p":"M","sc":"none","s":"True or false: In Schwartz (2016), the rationalist view stresses quick gut feelings, while the intuitionist view stresses careful logical reasoning.","o":[["True","Incorrect. The labels are swapped: rationalists use careful logic; intuitionists use quick gut feelings."],["False","Correct. The labels are swapped: rationalists use careful logic; intuitionists use quick gut feelings."]],"c":[1],"es":"Usant. Det er motsatt: rationalist = logikk, intuitionist = magefølelse.","ed":"Schwartz beskriver to syn på etiske beslutninger. Det rasjonalistiske synet sier at vi resonnerer logisk og bevisst. Det intuisjonistiske synet sier at vi først får en rask magefølelse og etterpå finner begrunnelser. Påstanden har byttet om på dem. Husk: rational = tenke, intuition = føle.","kt":"","src":"L2 slide 13"},{"id":"SB056","l":"L2","t":"Ethical decision-making","f":"m","d":3,"p":"M","sc":"short","s":"An analyst finds fake ESG data but says: \"Nothing I do will change anything; it is up to the bosses.\" This shows:","o":[["An external locus of control","Correct: she believes others control the outcome: external locus of control."],["High moral imagination","Incorrect: moral imagination would help her see options."],["An internal locus of control","Incorrect: internal locus means believing you can make a difference."],["Strong personal integrity","Incorrect: integrity would make her act."]],"c":[0],"es":"\"Det er opp til sjefene\" = hun tror andre styrer utfallet. Det er external locus of control.","ed":"Locus of control handler om hvem du tror styrer utfallet. External: andre (sjefer, systemet) bestemmer, så jeg kan ikke endre noe. Internal: jeg kan påvirke. Analytikeren som sier \"det er opp til sjefene\" har external locus of control, og gjør derfor ingenting. Husk: external = \"ikke mitt ansvar\".","kt":"Locus of control: the extent to which a person believes they control events in their life (internal) or that outside forces do (external).","src":"L2 slide 15"},{"id":"SB057","l":"L2","t":"Individual factors","f":"m","d":4,"p":"M","sc":"none","s":"What do Crane et al. find about individual factors in ethical decisions?","o":[["Locus of control has a strong, proven effect","Incorrect: locus of control has only a limited effect."],["Values matter; age and gender unclear","Correct: personal values matter; age and gender are unclear."],["Gender is the strongest factor","Incorrect: studies on gender give mixed results."],["Moral development has no effect","Incorrect: moral development has a small effect."]],"c":[1],"es":"Personlige verdier betyr noe. Alder og kjønn har uklar effekt.","ed":"Crane et al. oppsummerer forskning på individuelle faktorer. Personlige verdier har tydelig betydning. For alder, kjønn og nasjonalitet er funnene sprikende. Moral development og locus of control har bare begrensede effekter. Husk: verdier betyr noe, demografi er uklart.","kt":"","src":"Crane s. 61 · L2 slide 15"},{"id":"SB058","l":"L2","t":"Cognitive moral development","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An employee uses the office printer for private jobs and says: \"Everyone in my department does it.\" Which CMD level is this?","o":[["Conventional (fitting in with others)","Correct: he follows what his colleagues do: conventional level."],["Post-conventional (social contract)","Incorrect: social contract reasoning is about rights and society's agreement."],["Post-conventional (universal principles)","Incorrect: universal principles are self-chosen principles like justice."],["Pre-conventional (avoiding punishment)","Incorrect: pre-conventional reasoning is about avoiding punishment."]],"c":[0],"es":"\"Alle i avdelingen gjør det\" = følge gruppen. Det er conventional level.","ed":"Kohlbergs cognitive moral development (CMD) har tre nivåer. Pre-conventional: unngå straff eller få belønning. Conventional: gjør det som forventes av gruppen eller samfunnet. Post-conventional: egne prinsipper om rettigheter og rettferdighet. \"Alle i avdelingen gjør det\" er å følge gruppen. Husk: conventional = andre.\n\nForkortelser: CMD = Cognitive Moral Development (Kohlbergs stadier for moralsk utvikling).","kt":"","src":"L2 slide 16-17 · Crane s. 64 · Crane s. 65"},{"id":"SB059","l":"L2","t":"Cognitive moral development","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Since most people reason at the conventional level, the work context (peers, managers, culture) matters a lot for ethical decisions.","o":[["True","Correct. Most people are at the conventional level and follow what peers and bosses expect."],["False","Incorrect. Most people are at the conventional level and follow what peers and bosses expect."]],"c":[0],"es":"Sant. De fleste følger omgivelsene, så arbeidsmiljøet betyr mye.","ed":"Ifølge Kohlberg er de fleste voksne på conventional level, der vi gjør det som forventes av folk rundt oss. Derfor betyr arbeidsmiljøet mye: kolleger, sjefer og kultur former hva folk oppfatter som greit. Husk: conventional → context matters.","kt":"","src":"Crane s. 73 · Crane s. 67 · L2 slide 19"},{"id":"SB060","l":"L2","t":"Whistleblowing","f":"m","d":3,"p":"M","sc":"short","s":"In the Wirecard case, warnings came for years, but the regulator investigated journalists instead of the company. This shows:","o":[["Why whistleblowers need protection","Correct: without protection, the warnings were ignored."],["That auditors never miss fraud","Incorrect: the auditor missed the fraud for years."],["That short sellers are always wrong about accounting fraud","Incorrect: here the short sellers were right."],["That fraud only happens in emerging markets","Incorrect: Wirecard was a large German company."]],"c":[0],"es":"Advarslene ble ignorert. Det viser hvorfor whistleblowers trenger beskyttelse.","ed":"I Wirecard-saken kom advarsler fra journalister og short sellers i flere år, men tilsynet etterforsket varslerne i stedet for selskapet. Revisoren oppdaget heller ikke at ca. €1,9 mrd manglet. Saken viser hvorfor whistleblowers trenger beskyttelse og uavhengig tilsyn. Husk: Wirecard = varslerne ble straffet.","kt":"Whistleblowing: disclosure by an insider of wrongdoing to people able to act on it; it often requires legal protection against retaliation.","src":"L2 slide 18"},{"id":"SB061","l":"L2","t":"Moral intensity","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of Jones' (1991) six factors of moral intensity?","o":[["Moral muteness","Incorrect: moral muteness is about language, not intensity."],["Temporal immediacy","Correct: temporal immediacy = how quickly the harm comes."],["Locus of control","Incorrect: locus of control is an individual factor."],["Return on equity","Incorrect: ROE is not part of moral intensity."]],"c":[1],"es":"Temporal immediacy (hvor fort konsekvensene kommer) er en av de seks faktorene.","ed":"Jones (1991) sier at hvor alvorlig en sak oppleves (moral intensity) avhenger av seks faktorer: magnitude of consequences, social consensus, probability of effect, temporal immediacy, proximity og concentration of effect. Jo høyere intensitet, jo mer sannsynlig at folk ser saken som etisk. Husk: størrelse, enighet, sannsynlighet, tid, nærhet, konsentrasjon.\n\nForkortelser: ROE = Return on Equity (avkastning på egenkapital).","kt":"","src":"L2 slide 20 · Crane s. 76"},{"id":"SB062","l":"L2","t":"Moral intensity","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"The Rana Plaza collapse (2013) killed over 1,100 workers far from Western consumers. Why did it still feel so intense?","o":[["Small harm, but very likely","Incorrect: the harm was huge, not small."],["Big, sudden harm, made close by known brands","Correct: big, sudden harm, made close by known brands."],["Nobody agreed it was wrong","Incorrect: there was broad agreement that it was wrong."],["The harm was spread out and far in the future","Incorrect: the harm was concentrated and immediate."]],"c":[1],"es":"Stor, plutselig skade, og kjente merker gjorde den nær oss.","ed":"Rana Plaza hadde høy moral intensity: enorm skade (magnitude), den skjedde plutselig (temporal immediacy), og den rammet mange på ett sted (concentration). Selv om ofrene var langt unna, gjorde kjente klesmerker saken nær for vestlige forbrukere (proximity). Husk: stor + brå + nær = intens.","kt":"","src":"Crane s. 77 · Bok s. 7 (Box 1.2) · L2 slide 20"},{"id":"SB063","l":"L2","t":"Moral framing","f":"m","d":3,"p":"H","sc":"none","s":"Managers often avoid moral language (\"moral muteness\"). One reason is a perceived threat to:","o":[["Harmony at work","Correct: moral talk is seen as causing conflict and blame."],["The firm's credit rating","Incorrect: credit ratings are not one of the threats."],["The legality of decisions","Incorrect: legality is not one of the threats."],["Shareholders' voting rights","Incorrect: voting rights are not part of this."]],"c":[0],"es":"Moral snakk oppleves som å skape konflikt og ødelegge harmonien.","ed":"Moral muteness betyr at ledere unngår moralsk språk selv når de handler etisk. Grunnen er tre opplevde trusler: mot harmoni (det skaper konflikt og fingerpeking), mot effektivitet (det tar tid) og mot eget image (man virker naiv eller moraliserende). Husk: harmoni, effektivitet, image.","kt":"","src":"L2 slide 20 · Crane s. 78"},{"id":"SB064","l":"L2","t":"Moral framing","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An employee shops online during work hours and says: \"It is fine, I do lots of unpaid overtime.\" Which excuse is this?","o":[["Denial of victim","Incorrect: denial of victim says the victim deserved it."],["Denial of injury","Incorrect: denial of injury says nobody was harmed."],["Appeal to higher loyalties","Incorrect: higher loyalties points to a more important cause."],["Metaphor of the ledger","Correct: overtime gives \"credit\" to shop: metaphor of the ledger."]],"c":[3],"es":"\"Jeg har opparbeidet meg kreditt\" = metaphor of the ledger.","ed":"Rasjonaliseringer er unnskyldninger folk bruker for å forsvare uetisk atferd. Metaphor of the ledger er tanken om at gode gjerninger gir kreditt på en konto som kan brukes på dårlige. Den ansatte mener overtiden gir rett til å shoppe i arbeidstiden. Husk: ledger = regnskap med pluss og minus.","kt":"","src":"L2 slide 21 · Crane s. 79"},{"id":"SB065","l":"L2","t":"Moral framing","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A firm accused of pollution says: \"Our critics have no right to judge us, and competitors pollute more.\" This is \"social weighting\".","o":[["True","Correct. Attacking the critics and pointing to worse rivals is social weighting."],["False","Incorrect. Attacking the critics and pointing to worse rivals is social weighting."]],"c":[0],"es":"Sant. \"Dere har ingen rett\" + \"andre er verre\" = social weighting.","ed":"Social weighting har to deler: condemning the condemners (\"dere har ingen rett til å kritisere oss\") og selective social comparison (\"andre er verre\"). Firmaet bruker begge. Husk: social weighting = angrip kritikeren + sammenlign med verre.","kt":"","src":"L2 slide 21 · Crane s. 79"},{"id":"SB066","l":"L2","t":"Situational factors","f":"m","d":2,"p":"H","sc":"none","s":"Which of these is an issue-related (not context-related) factor in ethical decisions?","o":[["Reward systems","Incorrect: rewards are context-related."],["Authority of superiors","Incorrect: the boss's authority is context-related."],["Moral framing","Correct: moral framing is issue-related."],["Organisational culture","Incorrect: culture is context-related."]],"c":[2],"es":"Moral framing handler om selve saken. De andre handler om arbeidsplassen.","ed":"Crane et al. deler situasjonsfaktorer i to. Issue-related handler om selve saken: moral intensity og moral framing (hvordan saken beskrives). Context-related handler om arbeidsplassen: belønning, autoritet, byråkrati, kultur og normer. Husk: saken vs arbeidsplassen.","kt":"","src":"L2 slide 19-21 · Crane s. 76"},{"id":"SB067","l":"L2","t":"Situational factors","f":"m","d":4,"p":"M","sc":"none","s":"What do Crane et al. mean by \"distancing\" in large organisations?","o":[["Staff stop asking if the goals are right","Incorrect: that is instrumental morality."],["A buyer never sees the workers she affects","Correct: the buyer never sees the workers she affects."],["Sales targets are rewarded no matter how they are met","Incorrect: that is the rewards factor."],["Customers become data in a database","Incorrect: that is denial of moral status."]],"c":[1],"es":"Distancing = de som bestemmer ser aldri de som rammes.","ed":"Store byråkratier kan skape distancing: de som tar beslutningene er langt unna dem som rammes. En innkjøper ser bare tall og priser, aldri arbeiderne på fabrikken. Avstanden gjør det lettere å overse konsekvensene. Husk: distancing = avstand til ofrene.","kt":"","src":"Crane s. 84 · Crane s. 86"},{"id":"SB068","l":"L2","t":"Situational influences","f":"t","d":3,"p":"M","sc":"short","s":"True or false: In the Volkswagen emissions scandal, pressure from bosses to hit impossible targets does not help explain the misconduct.","o":[["True","Incorrect. Pressure from bosses and impossible targets are key context factors in the VW case."],["False","Correct. Pressure from bosses and impossible targets are key context factors in the VW case."]],"c":[1],"es":"Usant. Press fra sjefer og umulige mål forklarer mye av VW-skandalen.","ed":"Crane et al. bruker VW-skandalen for å vise at context-faktorer betyr mye. Ledelsen satte umulige mål for utslipp og kostnad, og ingeniørene opplevde sterkt press. Autoritet, belønning og kultur hjalp til å forklare juksingen. Husk: dårlig tønne, ikke bare dårlige epler.","kt":"Situational (context-related) factors: rewards, authority, bureaucracy, work roles, group norms and culture that shape ethical choices.","src":"Crane s. 48 · L5 slide 14"},{"id":"SB069","l":"L2","t":"Situational factors","f":"m","d":4,"p":"M","sc":"none","s":"What lesson do Crane et al. draw from Bernard Madoff's fraud?","o":[["Madoff acted alone, so only character matters","Incorrect: that was only the first assumption, later rejected."],["Rules always prevent fraud","Incorrect: rules and controls did not stop the fraud."],["Helpers and the environment also mattered","Correct: helpers and the environment also mattered."],["Descriptive ethics is irrelevant","Incorrect: the case shows descriptive ethics is useful."]],"c":[2],"es":"Madoff var ikke alene. Medhjelpere og omgivelsene spilte også en rolle.","ed":"Først ble Madoff sett på som en enslig svindler med dårlig karakter. Senere analyser viste at han opererte i et nettverk av medhjelpere, og at omgivelsene (svak kontroll, tillit, press) gjorde svindelen mulig. Husk: individ + kontekst.","kt":"","src":"Crane s. 53 · Bok s. 79 (Box 3.1)"},{"id":"SB070","l":"L2","t":"Theories of CSR","f":"m","d":3,"p":"H","sc":"none","s":"In Bénabou and Tirole (2010), managers spending other people's money on their own values is:","o":[["Shareholder primacy","Incorrect: this is not one of Bénabou and Tirole's three types."],["Insider-led philanthropy","Correct: managers spend owners' money on their own values."],["Delegated philanthropy","Incorrect: delegated means the firm acts for stakeholders' values."],["\"Win-win\" CSR","Incorrect: win-win CSR increases profit with no conflict."]],"c":[1],"es":"Ledere bruker andres penger på sine egne verdier = insider-led philanthropy.","ed":"Bénabou og Tirole har tre syn på CSR. Win-win: CSR som også øker profitten. Delegated philanthropy: firmaet gjør det eiere og kunder ønsker, på deres vegne. Insider-led philanthropy: ledelsen bruker eiernes penger på sine egne verdier, et agency problem. Husk: insider-led = ledernes verdier.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar).","kt":"","src":"L2 slide 25"},{"id":"SB071","l":"L2","t":"Theories of CSR","f":"t","d":5,"p":"M","sc":"none","s":"True or false: Bénabou and Tirole's \"delegated philanthropy\" is close to Hart and Zingales' idea: investors act on their social preferences through the firm.","o":[["True","Correct. In delegated philanthropy, investors use the firm to act on their values, as Hart and Zingales argue."],["False","Incorrect. In delegated philanthropy, investors use the firm to act on their values, as Hart and Zingales argue."]],"c":[0],"es":"Sant. Begge sier at investorer bruker firmaet til å følge sine sosiale preferanser.","ed":"Delegated philanthropy betyr at stakeholders med sosiale preferanser bruker firmaet som kanal for sine verdier. Det ligner Hart og Zingales: firmaet bør maksimere shareholder welfare, som inkluderer eiernes sosiale preferanser. Husk: delegated ≈ Hart og Zingales.","kt":"","src":"L2 slide 25 · L4 slide 31 · Hart & Zingales s. 3"},{"id":"SB072","l":"L2","t":"Telenor in Myanmar","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"After the 2021 coup, Telenor sold its Myanmar business to a buyer close to the military. Which statement is correct?","o":[["Utilitarianism ignores non-shareholders","Incorrect: utilitarianism counts everyone affected."],["A good mission made every decision ethical","Incorrect: good intentions do not solve the dilemma."],["Selling removed all responsibility for user data","Incorrect: critics said Telenor still had responsibility."],["Exit is not always ethical: the buyer mattered","Correct: the buyer was close to the military, so the exit could cause harm."]],"c":[3],"es":"Å selge seg ut er ikke automatisk etisk. Hvem man selger til betyr noe.","ed":"Telenor solgte Myanmar-virksomheten til en kjøper nær militærjuntaen. Kritikere kalte det irresponsible disengagement: brukerdata kunne havne hos militæret. Poenget er at exit ikke automatisk er etisk, måten man går ut på og hvem man selger til, betyr noe. Husk: exit har også konsekvenser.","kt":"","src":"L2 slide 27-29 · L2 slide 32-34 · Crane s. 21"},{"id":"SB073","l":"L2","t":"Business ethics","f":"m","d":2,"p":"H","sc":"short","s":"A company legally moves profits to a low-tax country. Critics call it unethical. The course frames this as:","o":[["Legal is not always ethical","Correct: legal does not mean ethical."],["Ethics applies only to people","Incorrect: ethics applies to organisations too."],["If it is legal, it is by definition ethical","Incorrect: law and ethics are not the same."],["Transfer pricing is always illegal","Incorrect: the case says it is legal."]],"c":[0],"es":"Noe kan være lovlig uten å være etisk.","ed":"Business ethics dekker områder loven ikke regulerer. Skatteplanlegging kan være helt lovlig, men likevel kritiseres som uetisk. Lov og etikk overlapper, men er ikke det samme. Husk: lovlig ≠ etisk.","kt":"Business ethics: the study of business situations, activities and decisions where issues of right and wrong are addressed; it largely concerns grey areas beyond the law.","src":"L2 slide 4"},{"id":"SB074","l":"L2","t":"Ethical theories applied: Tesla case","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Which explanation of Musk's decision to reopen the Tesla factory uses descriptive (not normative) ethics?","o":[["It caused more pain than pleasure","Incorrect: this is a normative (utilitarian) judgement."],["A good CEO would have obeyed the law","Incorrect: this is a normative (virtue) judgement."],["Ignoring the law cannot be a universal rule","Incorrect: this is a normative (Kantian) judgement."],["His personality and pressure from targets","Correct: this explains the decision without judging it."]],"c":[3],"es":"Descriptive forklarer hvorfor han gjorde det (personlighet, press). Normative sier om det var riktig.","ed":"Descriptive ethics forklarer hvorfor noen handlet som de gjorde, for eksempel personlighet (locus of control) og press fra mål. Normative ethics vurderer om handlingen var riktig. De tre andre alternativene feller alle en dom. Husk: \"hvorfor\" = descriptive, \"riktig/galt\" = normative.","kt":"","src":"L2 slide 3 · L2 slide 11 · L2 slide 15 · L2 slide 19"},{"id":"SB075","l":"L2","t":"Moral framing","f":"m","d":1,"p":"M","sc":"none","s":"Calling bribes \"facilitation payments\" or mass lay-offs \"restructuring\" is:","o":[["Moral framing","Correct: the language makes the act sound harmless: moral framing."],["Moral imagination","Incorrect: moral imagination helps you see ethical issues."],["Discourse ethics","Incorrect: discourse ethics is about honest dialogue."],["Post-conventional reasoning","Incorrect: post-conventional is about mature reasoning."]],"c":[0],"es":"Pene ord om stygge ting = moral framing.","ed":"Moral framing handler om språket vi bruker. Eufemismer som \"facilitation payments\" eller \"restructuring\" får uetiske handlinger til å virke ufarlige. Det gjør det lettere å rasjonalisere. Husk: pene ord om stygge ting = framing.","kt":"","src":"L2 slide 20 · Crane s. 77 · Crane s. 79"},{"id":"SB076","l":"L2","t":"Ethical theories applied: child labour dilemma","f":"m","d":5,"p":"M","sc":"extended_course_case","s":"A manager can buy toys at a third of the cost from a supplier that uses child labour at home. How do the theories differ?","o":[["Act utilitarianism may approve; rights object","Correct: act utilitarianism may say yes; children's rights say no."],["Rawls clearly supports the deal","Incorrect: children missing school are the worst-off, so Rawls says no."],["All theories give the same answer","Incorrect: the theories give different answers."],["Postmodern ethics gives a clear rule that applies everywhere","Incorrect: postmodern ethics rejects universal rules."]],"c":[0],"es":"Teoriene gir ulike svar: act utilitarianism kan si ja, rights-tenkning sier nei.","ed":"Leketøy-eksempelet viser at teoriene kan gi ulike svar. Act utilitarianism kan si ja, fordi billigere produkter gir mye total nytte. Rights-tenkning sier nei, fordi barnas rett til utdanning krenkes. Rawls sier også nei, fordi barna er de svakeste. Husk: teoriene kan være uenige.","kt":"","src":"Crane s. 10 · Crane s. 16 · Crane s. 23 · Crane s. 27"},{"id":"TR04","l":"L2","t":"Ethical egoism","f":"t","d":3,"p":"H","sc":"none","s":"True or false: An ethical egoist CEO can choose to protect workers' health if seeing them suffer would make him feel bad.","o":[["True","Correct. An egoist maximises his own welfare, which can include not feeling bad about others suffering."],["False","Incorrect. An egoist maximises his own welfare, which can include not feeling bad about others suffering."]],"c":[0],"es":"Sant. Egoisten maksimerer egen velferd, og det kan inkludere å slippe å føle seg dårlig.","ed":"Ethical egoism betyr å maksimere egen interesse, men egeninteressen kan inkludere egne følelser. Hvis det å se arbeiderne lide gjør CEO-en ulykkelig, kan han beskytte dem av egoistiske grunner. Husk: egoism kan gi gode handlinger.","kt":"Ethical egoism: an act is right if it maximises the decision-maker's own long-term interest or desires.","src":"Opptak L2 ca. 33 min"},{"id":"TR05","l":"L2","t":"Cognitive moral development","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Executives keep running a price cartel because they think they will not get caught. Which CMD stage is this?","o":[["Stage 4: living up to the expectations of society","Incorrect: stage 4 means following laws, and the cartel breaks them."],["Stage 1: obedience and punishment","Correct: they only care about punishment: stage 1."],["Stage 6: universal ethical principles","Incorrect: stage 6 follows principles regardless of punishment."],["Stage 5: social contract and individual rights","Incorrect: stage 5 would think about consumers' rights."]],"c":[1],"es":"Eneste tanke er om de blir tatt. Det er stage 1: straff.","ed":"Stage 1 (obedience and punishment) er det laveste nivået i Kohlbergs modell: det eneste som teller er om man blir straffet. Lederne fortsetter kartellet fordi de tror de ikke blir tatt. Husk: stage 1 = \"blir jeg tatt?\".\n\nForkortelser: CMD = Cognitive Moral Development (Kohlbergs stadier for moralsk utvikling).","kt":"","src":"Opptak L2 ca. 52 min"},{"id":"CX019","l":"L3","t":"Definition of externalities","f":"t","d":2,"p":"H","sc":"none","s":"Is an externality reflected in the market price of the good?","o":[["Yes","Feil. En externality er nettopp en effekt som ikke er med i prisen."],["No","Riktig. En externality er nettopp en effekt som ikke er med i prisen."]],"c":[1],"es":"Nei: externality = upriset effekt.","ed":"Fordi kostnaden ikke er i prisen, tar ikke kjøper og selger hensyn til den. Det er en market failure.","kt":"","src":"L3 slide 6 · L3 slide 10 · Bok s. 44 (2.1.1)","k":1},{"id":"CX020","l":"L3","t":"Types of externalities","f":"m","d":2,"p":"H","sc":"none","s":"Passive smoking that harms people nearby is:","o":[["A negative consumption externality","Skaden kommer fra forbruket av produktet."],["A negative production externality","Production externality kommer fra måten produktet lages på."],["A positive consumption externality","Andre blir skadet, så den er negativ."],["It is not an externality","Tredjepart bærer en kostnad som ikke er i prisen."]],"c":[0],"es":"Skade fra bruk av produktet = consumption externality.","ed":"Spør: kommer effekten fra produksjonen (fabrikkutslipp) eller fra forbruket (røyking)? Og er den positiv eller negativ for andre?","kt":"","src":"L3 slide 13 · Bok s. 36 (2.1)","k":1},{"id":"CX021","l":"L3","t":"Market failure diagram","f":"m","d":2,"p":"H","sc":"none","s":"With a negative production externality and no regulation, the market produces:","o":[["More than the social optimum, at too low a price","Kostnaden for andre er ikke i prisen, så produktet blir for billig."],["Nothing, because firms avoid pollution","Firmaer produserer, fordi de ikke betaler for skaden."],["Less than the social optimum, at too high a price","Det er motsatt."],["Exactly the social optimum","Da ville det ikke vært en market failure."]],"c":[0],"es":"Negativ externality = overproduksjon og for lav pris.","ed":"Private kostnader er lavere enn samfunnets kostnader. Markedet stopper der private kostnader møter etterspørselen, altså for langt ut.","kt":"","src":"L3 slide 9-12","k":1},{"id":"CX022","l":"L3","t":"Government intervention","f":"t","d":2,"p":"H","sc":"none","s":"Does a Pigouvian tax aim to make polluters pay the cost they impose on others?","o":[["Yes","Riktig. Skatten settes lik den eksterne skaden, slik at den blir internalised."],["No","Feil. Skatten settes lik den eksterne skaden, slik at den blir internalised."]],"c":[0],"es":"Ja: Pigouvian tax = skatt lik skaden.","ed":"Karbonavgift er et eksempel. Firmaer som kan kutte billig, kutter. De andre betaler. Det gjør skatten kostnadseffektiv.","kt":"","src":"Bok s. 47 (2.2.1.1) · L3 slide 21","k":1},{"id":"CX023","l":"L3","t":"Limits to internalisation","f":"t","d":2,"p":"H","sc":"none","s":"Is carbon leakage when emissions fall because firms invest in cleaner technology?","o":[["Yes","Feil. Carbon leakage er når produksjonen og utslippene flytter til land med svakere klimaregler."],["No","Riktig. Carbon leakage er når produksjonen og utslippene flytter til land med svakere klimaregler."]],"c":[1],"es":"Nei: leakage = utslipp flytter, ikke forsvinner.","ed":"Grunnen er territoriality: regler gjelder bare innenfor et område. EU svarer med en karbontoll på import (CBAM).\n\nForkortelser: CBAM = Carbon Border Adjustment Mechanism (EUs karbontoll ved grensen).","kt":"","src":"L3 slide 23 · Bok s. 55 (2.3.2)","k":1},{"id":"CX024","l":"L3","t":"Climate risk","f":"m","d":2,"p":"H","sc":"none","s":"An example of physical climate risk is:","o":[["A flood damages a factory","Klimaet selv gjør skade = physical risk."],["Buyers switch to electric cars","Endret etterspørsel = transition risk."],["A new carbon tax is introduced","Politikk = transition risk."],["New coal plants are banned","Regulering = transition risk."]],"c":[0],"es":"Flom, tørke, hete = physical. Regler og markeder = transition.","ed":"Physical: klimaet selv gjør skade (flom, tørke, hete). Transition: overgangen til lavutslipp gjør skade (karbonavgift, nye regler, ny teknologi).","kt":"","src":"L3 slide 36-38 · Bok s. 49 (2.3)","k":1},{"id":"CX025","l":"L3","t":"Climate scenarios","f":"m","d":2,"p":"H","sc":"none","s":"The NGFS-type scenario with the HIGHEST transition risk is:","o":[["Orderly: early, gradual policy action","Tidlig og gradvis gir moderat transition risk."],["Disorderly: late, sudden policy","Når politikken kommer sent og brått, blir omstillingen dyr og kaotisk."],["Hot house world: current policies only","Her kommer ingen nye regler, så transition risk er lav."],["Business as usual with no new rules","Ingen nye regler gir lav transition risk."]],"c":[1],"es":"Sent og brått = disorderly = høyest transition risk.","ed":"- Orderly: tidlig, gradvis. Moderat transition, lav physical.\n- Disorderly: sent, brått. Høy transition.\n- Hot house: ingenting skjer. Lav transition, høy physical.\n\nForkortelser: NGFS = Network for Greening the Financial System (nettverk av sentralbanker).","kt":"","src":"Opptak L3 ca. 59 min · Opptak L3 ca. 61 min","k":1},{"id":"CX026","l":"L3","t":"Stranded assets","f":"t","d":2,"p":"H","sc":"none","s":"Can coal power plants become stranded assets if strict carbon pricing is introduced?","o":[["Yes","Riktig. De kan miste verdien før tiden fordi de ikke lenger er lønnsomme."],["No","Feil. De kan miste verdien før tiden fordi de ikke lenger er lønnsomme."]],"c":[0],"es":"Ja: karbonpris kan gjøre fossile eiendeler verdiløse.","ed":"Stranded asset: en eiendel som taper verdi uventet tidlig, typisk på grunn av klimapolitikk eller billigere fornybar energi.","kt":"","src":"Bok s. 53 (2.3) · Bok s. 70 (Key concepts) · L9 slide 3","k":1},{"id":"CX027","l":"L3","t":"Integrated value approach","f":"m","d":2,"p":"H","sc":"short","s":"Process A has F = 10, S = -4, E = -4. Process B has F = 8, S = 0, E = -1. Which has the higher integrated value?","o":[["Process B (7 versus 2)","I = F + S + E. A: 10 - 4 - 4 = 2. B: 8 + 0 - 1 = 7."],["They are equal","A gir 2 og B gir 7."],["It cannot be calculated","Det kan regnes ut: I = F + S + E."],["Process A (10 versus 8)","Det er bare F. Integrated value tar med S og E."]],"c":[0],"es":"I = F + S + E. B vinner.","ed":"Poenget: en ren finansiell analyse velger A (høyest F). Integrated value viser at B er bedre totalt. Det er forskjellen mellom SF 1.0 og SF 2.0.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L3 slide 32 · Bok s. 50 (2.3) · Bok s. 51 (Figure 2.3)","k":1},{"id":"EX05","l":"L3","t":"Exam sample: stress testing","f":"m","d":2,"p":"H","sc":"none","s":"Stress-testing differs from scenario analysis in that stress-testing asks:","o":[["What the average outcome will be","Et gjennomsnitt er det motsatte av et ekstremt scenario."],["How a firm would be like in each scenario","Det er scenario analysis: se på flere mulige utfall."],["How the firm would be like if everything goes wrong in a drastic scenario","Stress testing ser på det verste, ekstreme tilfellet."],["How competitors will react in a drastic scenario","Stress testing handler om firmaet selv, ikke konkurrentene."]],"c":[2],"es":"Stress test = det verste tilfellet. Scenario analysis = flere mulige utfall.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- Scenario analysis: hvordan går det med firmaet i hvert av flere scenarioer (f.eks. orderly, disorderly, hot house)?\n- Stress testing: tål firmaet (eller banken) et ekstremt, drastisk scenario der alt går galt?","kt":"","src":"Bok s. 67 (2.4.4) · Bok s. 68 (Box 2.4)","k":1,"x":1},{"id":"SB077","l":"L3","t":"Definition of externalities","f":"m","d":1,"p":"H","sc":"none","s":"An externality is:","o":[["An extra benefit to shareholders on top of dividends","Incorrect: externalities hit third parties; they are not extra gains for owners."],["A cost a firm pays abroad, like foreign taxes","Incorrect: foreign taxes are a normal cost the firm pays itself."],["A cost that is fully included in the price","Incorrect: if the cost is in the price, it has been internalised."],["An unpriced effect on people outside the deal","Correct: an unpriced effect on people outside the deal."]],"c":[3],"es":"Externality = en effekt på noen utenfor handelen, som ikke er med i prisen.","ed":"En externality er en effekt av en handel som rammer noen utenfor handelen, og som ikke er med i prisen. Forurensning er en negativ externality: fabrikken og kunden handler, men naboene betaler med dårligere luft. Når kostnaden tas inn i prisen, sier vi at den er internalisert. Husk: tredjepart + ikke priset.","kt":"","src":"L3 slide 6 · L3 slide 10 · Bok s. 44 (2.1.1)"},{"id":"SB078","l":"L3","t":"Two-firm externality example","f":"m","d":3,"p":"H","sc":"none","s":"Two firms each choose technology (1): revenue $100, cost $20, plus a $10 cost on the other firm; or technology (2): revenue $100, cost $25, no cost to others. If each maximises its own profit, what happens?","o":[["They choose different ones; welfare is $145","Incorrect: both firms face the same choice, so they choose the same."],["Both choose (1); welfare is $140, not $150","Correct: both pick (1); welfare is 140 instead of 150."],["Both choose (1); welfare is $160","Incorrect: you must subtract the $10 cost each firm puts on the other."],["Both choose (2); welfare is $150","Incorrect: (2) gives only $75 privately, so firms do not choose it."]],"c":[1],"es":"Hver tjener 80 på (1) mot 75 på (2), så begge velger (1). Men da blir velferden 2×(80−10) = 140, mot 150 med (2).","ed":"Privat profitt: teknologi (1) gir 100 − 20 = 80, teknologi (2) gir 100 − 25 = 75. Hvert firma velger (1). Men da påfører hvert firma det andre en kostnad på 10, så samlet velferd blir 2 × (80 − 10) = 140. Med (2) ville den vært 2 × 75 = 150. Husk: når externalities ikke prises, blir privat optimum ulikt samfunnets optimum.","kt":"","src":"L3 slide 6-7"},{"id":"SB079","l":"L3","t":"Internalisation","f":"t","d":2,"p":"H","sc":"none","s":"True or false: In the two-firm example, a tax on the polluting technology equal to the damage it causes makes each firm's own choice also the best choice for both.","o":[["True","Correct. A tax equal to the damage makes each firm pay the full social cost, so the private and social choice match."],["False","Incorrect. A tax equal to the damage makes each firm pay the full social cost, so the private and social choice match."]],"c":[0],"es":"Sant. En skatt lik skaden gjør at firmaet betaler hele kostnaden, så privat og samfunnets valg blir likt.","ed":"En Pigouvian tax er en skatt lik den eksterne skaden. I eksempelet ville en skatt på 10 gjort at teknologi (1) gir 70 privat, mot 75 for (2). Da velger firmaene selv det som er best for samfunnet. Husk: skatt = skade → privat = sosialt optimum.","kt":"Pigouvian tax: a tax equal to the marginal external damage, which internalises a negative externality.","src":"L3 slide 9-10 · Bok s. 42 (2.2)"},{"id":"SB080","l":"L3","t":"Market failure diagram","f":"m","d":3,"p":"H","sc":"none","s":"With a negative production externality, compared with the social optimum, the free market gives:","o":[["too much, at too low a price","Correct: too much is produced, at too low a price."],["too much, at too high a price","Incorrect: the price is lower, not higher, because the damage is not paid."],["too little, at too high a price","Incorrect: too little output fits a positive externality."],["the same quantity","Incorrect: the quantity is too high."]],"c":[0],"es":"Produsentene betaler ikke skaden, så markedet lager for mye til for lav pris.","ed":"Ved negativ production externality ignorerer produsentene kostnaden de påfører andre. Den private tilbudskurven ligger derfor lavere enn den samfunnsøkonomiske. Resultatet er at markedet produserer for mye (Qe > Qso) til for lav pris (Pe < Pso). Husk: negativ externality = for mye, for billig.","kt":"","src":"L3 slide 9-12"},{"id":"SB081","l":"L3","t":"Externalities","f":"m","d":2,"p":"H","sc":"short","s":"Which example is correctly classified?","o":[["Vaccines that protect other people - negative","Incorrect: a vaccine that protects others is a positive externality."],["Factory pollution - negative production","Correct: the factory puts a cost on others: negative production externality."],["A bakery's nice smell - negative production","Incorrect: a nice smell is a free benefit, so it is positive."],["Traffic jams - positive consumption","Incorrect: traffic jams cost others, so they are negative."]],"c":[1],"es":"Forurensning fra en fabrikk = negative production externality.","ed":"Klassifiser i to steg. Positiv eller negativ: gir det andre en gratis gevinst eller en ubetalt kostnad? Production eller consumption: kommer effekten fra produksjonen eller fra bruken? Fabrikkforurensning er en kostnad fra produksjon. Husk: gevinst = positiv, kostnad = negativ.","kt":"Externality: a cost or benefit of an activity that falls on third parties and is not reflected in market prices.","src":"L3 slide 13 · Bok s. 36 (2.1)"},{"id":"SB082","l":"L3","t":"Enlarged production function","f":"m","d":3,"p":"H","sc":"none","s":"The textbook extends the production function Q = F(K, L) to q + w = F(K, L, N, S, H; r, e). The main point is that it:","o":[["proves waste is always zero","Incorrect: waste is included as its own output."],["replaces labour and capital with nature","Incorrect: K and L are still in the function."],["shows capital can always replace nature","Incorrect: the book says nature cannot be fully replaced."],["adds nature, people, energy and waste","Correct: it adds nature, people, energy and waste."]],"c":[3],"es":"Den nye funksjonen legger til natur, mennesker, energi og avfall.","ed":"Den vanlige produksjonsfunksjonen bruker bare kapital (K) og arbeid (L). Læreboka utvider den med naturressurser (N), sosial kapital (S), human capital (H), energi og avfall (w) som eget output. Poenget er at produksjon bruker og påvirker natur og samfunn. Husk: utvidet funksjon = natur, mennesker og avfall med.","kt":"","src":"L3 slide 14 · Bok s. 40 (2.1) · Bok s. 41 (2.1)"},{"id":"SB083","l":"L3","t":"Enlarged production function","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Machines and labour can always replace natural resources, so a firm can make the same steel with less iron ore.","o":[["True","Incorrect. Natural resources are complements, not substitutes: machines and labour cannot replace iron ore."],["False","Correct. Natural resources are complements, not substitutes: machines and labour cannot replace iron ore."]],"c":[1],"es":"Usant. Naturressurser er complements, ikke substitutes.","ed":"Læreboka sier at naturressurser er komplementer til kapital og arbeid, ikke substitutter. Du kan ikke lage stål uten jernmalm, uansett hvor mange maskiner du har. Derfor betyr ressursknapphet noe. Husk: natur kan ikke erstattes.","kt":"","src":"Bok s. 41 (2.1)"},{"id":"SB084","l":"L3","t":"Natural resources","f":"m","d":3,"p":"L","sc":"none","s":"What makes a non-renewable resource run out fastest?","o":[["Switching to a renewable alternative","Incorrect: switching to renewables lowers demand for the resource."],["Finding new reserves faster than demand grows","Incorrect: new finds extend the time left."],["Rising demand and no new reserves","Correct: rising use of a fixed stock empties it fastest."],["More recycling","Incorrect: recycling lowers demand."]],"c":[2],"es":"Mer etterspørsel og ingen nye reserver gjør at ressursen tar slutt fortest.","ed":"Hvor lenge en ikke-fornybar ressurs varer, avhenger av reserver delt på bruk. Økende etterspørsel og ingen nye funn gjør at tiden krymper raskest. Substitusjon, nye funn og resirkulering forlenger tiden. Husk: tid igjen = reserver / forbruk.","kt":"Depletion horizon: reserves divided by annual demand - the number of years a resource lasts at current use.","src":"Bok s. 39 (2.1.2)","e":1},{"id":"SB085","l":"L3","t":"Internalisation of externalities","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Internalising an externality means making those who cause it bear its costs (or enjoy its benefits).","o":[["True","Correct. This is the definition: the one who causes the externality bears its cost or gets its benefit."],["False","Incorrect. This is the definition: the one who causes the externality bears its cost or gets its benefit."]],"c":[0],"es":"Sant. Internalisere = den som lager effekten, betaler (eller får gevinsten).","ed":"Å internalisere en externality betyr å få den som skaper effekten til å bære kostnaden (eller få gevinsten). Det kan skje gjennom skatt, regulering, søksmål, omdømme eller kundenes valg. Husk: forurenser betaler.","kt":"","src":"L3 slide 15 · L3 slide 17"},{"id":"SB086","l":"L3","t":"Internalisation","f":"m","d":3,"p":"H","sc":"short","s":"After the Rana Plaza collapse (2013), clothing brands signed a safety accord and faced consumer boycotts. Which mechanism made them act?","o":[["Bank capital rules","Incorrect: bank rules played no role."],["Higher interest rates","Incorrect: interest rates are not relevant here."],["Damage to reputation","Correct: reputation damage pushed the brands to act."],["A carbon tax on garment factories","Incorrect: there was no tax involved."]],"c":[2],"es":"Boikott og press fra kunder skadet omdømmet. Det tvang merkene til å handle.","ed":"Etter Rana Plaza presset forbrukere, NGO-er og fagforeninger klesmerkene, og de signerte en sikkerhetsavtale. Ingen lov tvang dem. Mekanismen var omdømme: risikoen for å tape kunder gjorde det lønnsomt å ta ansvar. Husk: reputation er en vei til internalisering uten lov.\n\nForkortelser: NGO = Non-Governmental Organisation (frivillig organisasjon, f.eks. Greenpeace).","kt":"Internalisation mechanisms: government (taxes, regulation), society/stakeholders (pressure, boycotts, litigation), and market/technology shifts.","src":"L3 slide 17 · Bok s. 52 (2.3.2)"},{"id":"SB087","l":"L3","t":"Internalisation mechanisms","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Competitors' innovation can force a firm to internalise its externalities, even without new laws.","o":[["True","Correct. If a rival makes a cleaner product, you may have to follow, even without a new law."],["False","Incorrect. If a rival makes a cleaner product, you may have to follow, even without a new law."]],"c":[0],"es":"Sant. Hvis konkurrenten lager et renere produkt, må du følge etter.","ed":"Internalisering kan skje uten lover. Hvis en konkurrent lanserer et renere produkt, kan kundene bytte, og du må følge etter for å ikke tape markedsandeler. Husk: innovation hos konkurrenter kan tvinge frem endring.","kt":"","src":"L3 slide 17 · Bok s. 52 (2.3)"},{"id":"SB088","l":"L3","t":"Government intervention","f":"m","d":4,"p":"M","sc":"none","s":"When a planetary boundary is close to being crossed, why can quotas or bans be better than taxes?","o":[["Quotas let firms pollute more if they pay","Incorrect: paying to pollute describes a tax."],["Quotas raise more tax money","Incorrect: revenue is not the argument."],["Taxes are not allowed for this under international law","Incorrect: many countries use carbon taxes."],["Quotas give more certainty about limits","Correct: quotas give certainty about the limit."]],"c":[3],"es":"En quota setter et fast tak. En skatt gir usikker mengde.","ed":"En skatt gir sikker pris, men usikker mengde: man vet ikke hvor mye firmaene vil kutte. En quota (kvote) gir sikker mengde, fordi taket er fast. Når vi er nær en planetary boundary, er det viktigst å holde seg under grensen. Husk: tax = sikker pris, quota = sikker mengde.","kt":"","src":"Bok s. 46 (2.2) · Bok s. 47 (2.2.1)"},{"id":"SB089","l":"L3","t":"Government intervention","f":"m","d":3,"p":"H","sc":"none","s":"Why is a Pigouvian tax a cost-effective way to cut emissions?","o":[["All firms must cut by the same percent","Incorrect: equal cuts for all ignore different costs."],["The government picks each firm's technology","Incorrect: that is command-and-control, not a tax."],["Firms that can cut cheaply cut; others pay","Correct: cuts happen where they are cheapest."],["It guarantees an exact level of emissions","Incorrect: a tax fixes the price, not the quantity."]],"c":[2],"es":"De som kan kutte billig, kutter. De andre betaler skatt. Totalkostnaden blir lavest.","ed":"Med en Pigouvian tax velger hvert firma selv: kutte utslipp eller betale skatt. Firmaer som kan kutte billig, kutter. De andre betaler. Dermed skjer kuttene der det koster minst, og totalkostnaden blir lavest. Husk: tax = kostnadseffektivt.","kt":"","src":"Bok s. 47 (2.2.1.1) · L3 slide 21"},{"id":"SB090","l":"L3","t":"Carbon pricing","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"The EU carbon price rises sharply. Cement maker A emits much more CO2 per tonne than cement maker B. What happens?","o":[["A's margins fall more; B gains an advantage","Correct: A's margins fall more, so B gains an advantage."],["Neither is affected, since the ETS is voluntary.","Incorrect: the EU ETS is mandatory."],["A gains, because it already has high emissions.","Incorrect: high emissions mean high carbon costs."],["Both are affected equally, since they sell the same product.","Incorrect: the cost depends on emissions per tonne, not on the product."]],"c":[0],"es":"A slipper ut mest, så A får størst kostnadsøkning. B får fordel.","ed":"En høyere karbonpris rammer etter hvor mye man slipper ut. A slipper ut mest per tonn sement, så A sine kostnader øker mest og marginene faller. B blir relativt mer konkurransedyktig. Husk: carbon price rammer de mest utslippsintensive hardest.\n\nForkortelser: ETS = Emissions Trading System (EUs kvotemarked for CO2).","kt":"Carbon intensity: emissions per unit of output; it determines exposure to carbon prices.","src":"L3 slide 21-22 · Bok s. 46 (2.2.1)"},{"id":"SB091","l":"L3","t":"Government intervention","f":"m","d":3,"p":"M","sc":"none","s":"Why have most governments not introduced effective carbon prices?","o":[["Fossil fuels are already taxed enough","Incorrect: fossil fuels actually get subsidies."],["Carbon taxes always hurt growth a lot","Incorrect: Sweden cut emissions without harming growth."],["Short horizons due to elections","Correct: short election cycles stop carbon pricing."],["Carbon prices do not change behaviour","Incorrect: carbon prices do change behaviour, as in Scandinavia."]],"c":[2],"es":"Politikere tenker på neste valg, ikke langsiktige skatter.","ed":"Politikere må vinne valg hvert fjerde år. En karbonskatt gir kostnader nå, mens gevinsten kommer langt frem i tid. Det gjør karbonpris politisk vanskelig, selv om den virker (Skandinavia). Husk: kort politisk horisont.","kt":"","src":"Bok s. 48 (2.2.1.1) · Bok s. 49 (Box 2.2)"},{"id":"SB092","l":"L3","t":"Government intervention","f":"m","d":2,"p":"L","sc":"none","s":"What does the textbook conclude about fossil fuel subsidies?","o":[["They hold back clean investment","Correct: the subsidies hold back clean investment."],["They help poor households and should be expanded","Incorrect: the book calls them inefficient."],["Renewables need even bigger subsidies","Incorrect: the book would rather tax fossil fuels."],["They are too small to matter","Incorrect: the subsidies are large."]],"c":[0],"es":"Fossile subsidier gjør det mindre lønnsomt å investere grønt.","ed":"Fossile subsidier gjør fossil energi kunstig billig. Da blir fornybar energi relativt dyrere og mindre lønnsom å investere i. Læreboka sier at hvis man fjerner fossile subsidier (og priser inn skaden), trengs mindre støtte til fornybart. Husk: fjern fossile subsidier først.","kt":"","src":"Bok s. 49 (2.2.1.1)","e":1},{"id":"SB093","l":"L3","t":"Limits to internalisation","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"After the EU raises its carbon price, a cement maker moves production to a country without one and imports the cement back. This shows:","o":[["Lobbying","Incorrect: lobbying tries to change the rules."],["Carbon leakage","Correct: production moves abroad and emissions continue: carbon leakage."],["The fallacy of composition","Incorrect: fallacy of composition is about micro not adding up to macro."],["Greenwashing","Incorrect: greenwashing is misleading communication."]],"c":[1],"es":"Flytte produksjonen dit det ikke er karbonpris = carbon leakage.","ed":"Carbon leakage betyr at produksjon flyttes til land uten karbonpris. Utslippene forsvinner ikke, de bare \"lekker\" til et annet land. Dette er et argument for globale avtaler eller grensetoll på karbon (CBAM). Husk: leakage = utslippene flytter.\n\nForkortelser: CBAM = Carbon Border Adjustment Mechanism (EUs karbontoll ved grensen).","kt":"","src":"L3 slide 23 · Bok s. 55 (2.3.2)"},{"id":"SB094","l":"L3","t":"Limits to internalisation","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Duchin, Gao and Xu (2024) find that public firms often look greener by selling polluting assets to private firms, so the emissions do not disappear.","o":[["True","Correct. Listed firms sell polluting assets, but the emissions continue under the new owners."],["False","Incorrect. Listed firms sell polluting assets, but the emissions continue under the new owners."]],"c":[0],"es":"Sant. Utslippene forsvinner ikke, de bare flyttes til en privat eier.","ed":"Duchin, Gao og Xu viser at børsnoterte firmaer kan se grønnere ut ved å selge forurensende eiendeler til private firmaer. Utslippene fortsetter, ofte med mindre rapportering. Dette er en form for greenwashing gjennom informasjonsasymmetri. Husk: salg ≠ kutt.","kt":"","src":"L3 slide 24-25"},{"id":"SB095","l":"L3","t":"Climate risk","f":"m","d":2,"p":"H","sc":"short","s":"Which climate risk is correctly classified?","o":[["Buyers switching to electric cars - physical","Incorrect: buyers switching cars is transition risk."],["A higher carbon tax - physical","Incorrect: a new tax is transition risk."],["PG&E bankrupt after wildfires - physical","Correct: wildfires are physical risk."],["A heatwave hurting workers - transition","Incorrect: a heatwave is physical risk."]],"c":[2],"es":"Skogbrann som ødelegger = physical risk.","ed":"Physical risk er skade fra været og naturen: flom, tørke, hetebølger, skogbranner. Transition risk kommer fra overgangen til lavutslippsøkonomi: ny politikk, teknologi og endrede kundepreferanser. PG&E gikk konkurs etter skogbranner, så det er physical risk. Husk: natur = physical, politikk/marked = transition.","kt":"Physical risk: damage from climate events (acute) or gradual changes (chronic). Transition risk: losses from policy, technology, market or legal changes towards a low-carbon economy.","src":"L3 slide 36-38 · Bok s. 49 (2.3)"},{"id":"SB096","l":"L3","t":"Integrated value approach","f":"m","d":4,"p":"H","sc":"none","s":"Old process: F = 15, S = -3, E = -3. New process: F = 14, S = -1, E = -1. What does integrated value (I) show?","o":[["Both have the same I","Incorrect: 9 and 12 are not equal."],["I rises (9 to 12), but F falls","Correct: I rises from 9 to 12 while F falls from 15 to 14."],["I is 21 for the old one and 16 for the new one","Incorrect: S and E are negative, so they must be subtracted."],["I falls from 15 to 14","Incorrect: that only looks at F, not I."]],"c":[1],"es":"Gammel: 15 − 3 − 3 = 9. Ny: 14 − 1 − 1 = 12. I øker selv om F faller.","ed":"Integrated value er I = F + S + E. Gammel prosess: 15 − 3 − 3 = 9. Ny prosess: 14 − 1 − 1 = 12. Den nye gir litt lavere finansiell verdi, men mye mindre skade, så samlet verdi øker. Tradisjonell finance ville bare sett at F falt. Husk: I = F + S + E, husk fortegn.","kt":"","src":"L3 slide 32 · Bok s. 50 (2.3) · Bok s. 51 (Figure 2.3)"},{"id":"SB097","l":"L3","t":"Integrated value approach","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Conventional and sustainable roses from Kenya both cost about €0.70. What did the true price analysis find?","o":[["The conventional rose had the lower true price","Incorrect: the conventional rose had the higher true price."],["The sustainable rose had the lower true price","Correct: the sustainable rose was \"cheaper\" in total."],["Both true prices equalled the shop price","Incorrect: both true prices were above the shop price."],["A living wage was only possible if owners paid all","Incorrect: the cost was shared with traders and shops."]],"c":[1],"es":"Den bærekraftige rosen hadde lavest true price, mest pga. flyfrakt for den andre.","ed":"True price = butikkpris + skjulte sosiale og miljømessige kostnader. Begge rosene kostet ca. €0,70 i butikken. Den konvensjonelle hadde høyest true price, mest på grunn av flyfrakt. Den bærekraftige rosen hadde lavest samlet kostnad for samfunnet. Husk: true price viser de skjulte kostnadene.","kt":"","src":"Bok s. 52 (Box 2.3)"},{"id":"SB098","l":"L3","t":"Integrated value approach","f":"m","d":4,"p":"M","sc":"none","s":"A problem with putting a money value on externalities is that:","o":[["it automatically includes resilience","Incorrect: money values can miss resilience."],["it makes financial and other values impossible to compare","Incorrect: the whole point is to make them comparable."],["it needs no assumptions","Incorrect: it needs many assumptions."],["it cannot capture human rights fully","Correct: things like human rights cannot be fully priced."]],"c":[3],"es":"Noen ting, som menneskerettigheter, kan ikke fullt ut måles i penger.","ed":"Å sette pengeverdi på externalities gjør dem sammenlignbare med finansielle tall. Men det krever mange antagelser, og noe kan ikke fanges i penger, som menneskerettigheter eller verdien av et liv. Husk: monetisering er nyttig, men ufullstendig.","kt":"","src":"Bok s. 53 (2.3.1) · Bok s. 54 (2.3.1)"},{"id":"SB099","l":"L3","t":"Insufficient private effort","f":"m","d":4,"p":"M","sc":"none","s":"Even if each firm internalises its externalities, planetary boundaries may still be crossed. This is called:","o":[["The fallacy of composition","Correct: what works for each firm may not be enough for the whole system."],["Double materiality","Incorrect: double materiality is about reporting."],["The adaptive markets hypothesis (Lo)","Incorrect: AMH explains why new risks are not priced."],["The tragedy of the horizon","Incorrect: tragedy of the horizon is about timing."]],"c":[0],"es":"Hver for seg ok, men samlet over grensen = fallacy of composition.","ed":"Fallacy of composition betyr at det som stemmer for hver enkelt del, ikke nødvendigvis stemmer for helheten. Selv om hvert firma blir mer effektivt, kan total produksjon øke så mye at planetary boundaries likevel krysses. Husk: summen av små forbedringer er ikke nok.\n\nForkortelser: AMH = Adaptive Markets Hypothesis (markedet lærer gradvis, Lo).","kt":"","src":"Bok s. 54 (2.3.2) · Bok s. 55 (2.3.2)"},{"id":"SB100","l":"L3","t":"Stranded assets","f":"m","d":2,"p":"H","sc":"none","s":"Which is a stranded asset?","o":[["Foreign cash that has gained value","Incorrect: it has gained value."],["A fully rented new office building","Incorrect: there is no loss from regulation or technology."],["A bond whose price falls a little when rates rise","Incorrect: normal interest rate risk is not a stranded asset."],["Oil reserves hit by a carbon price","Correct: a carbon price makes the reserves worth less."]],"c":[3],"es":"Stranded asset = eiendel som mister verdi pga. regulering eller ny teknologi.","ed":"Et stranded asset er en eiendel som mister verdi før forventet på grunn av regulering, teknologi eller markedsendringer. Oljereserver som ikke kan utvinnes lønnsomt med karbonpris, er hovedeksempelet. Husk: stranded = verdien \"strander\".","kt":"","src":"Bok s. 53 (2.3) · Bok s. 70 (Key concepts) · L9 slide 3"},{"id":"SB101","l":"L3","t":"Internalisation uncertainty","f":"m","d":4,"p":"M","sc":"short","s":"In 2025 the EU delayed parts of its sustainability rules, and carbon prices kept moving up and down. What is the lesson for investors?","o":[["Internalisation always happens fast and fully","Incorrect: delays show it does not happen fast."],["Timing is uncertain, so use scenarios","Correct: timing is uncertain, so use scenarios."],["Externalities will never be priced","Incorrect: it is the timing that is uncertain."],["Only physical risk matters now","Incorrect: transition risk still exists."]],"c":[1],"es":"Politikk kan gå raskere eller tregere. Derfor bruker man scenarioer.","ed":"Internalisering skjer, men tidspunktet er usikkert: politikk kan forsinkes, akselereres eller reverseres. Derfor anbefaler læreboka scenarioanalyse i stedet for én prognose. Husk: spørsmålet er når, ikke om.","kt":"Scenario analysis: valuing a firm under several plausible futures (e.g. slow vs fast transition) instead of one forecast.","src":"L3 slide 21 · L3 slide 25 · PwC s. 41"},{"id":"SB102","l":"L3","t":"Sources of uncertainty","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The IEA's forecasts of solar power capacity were always too high compared with what was actually built.","o":[["True","Incorrect. Actual solar capacity was higher than IEA forecast; the forecasts were too low."],["False","Correct. Actual solar capacity was higher than IEA forecast; the forecasts were too low."]],"c":[1],"es":"Usant. Faktisk bygget sol var høyere enn IEA trodde.","ed":"Læreboka viser at både IEA og Greenpeace undervurderte hvor raskt solenergi ble bygget ut. Poenget er at historiske trender og prognoser kan undervurdere raske endringer. Husk: prognosene var for lave.\n\nForkortelser: IEA = International Energy Agency (Det internasjonale energibyrået).","kt":"","src":"Bok s. 57 (2.4.1.2) · Bok s. 58 (Figure 2.4)"},{"id":"SB103","l":"L3","t":"Scenario analysis","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"A coal-heavy utility is worth NOK 200 per share under slow transition (60%) and NOK 80 under fast transition (40%). What is the expected value?","o":[["NOK 140","Incorrect: that is just the average, without weights."],["NOK 200","Incorrect: that ignores the fast scenario."],["NOK 128","Incorrect: the probabilities are swapped."],["NOK 152","Correct: 0.6 × 200 + 0.4 × 80 = 152."]],"c":[3],"es":"0,6 × 200 + 0,4 × 80 = 120 + 32 = 152.","ed":"Forventet verdi = sum av (sannsynlighet × verdi). 0,6 × 200 = 120 og 0,4 × 80 = 32, så 120 + 32 = 152. Dette er scenario analysis: flere utfall vektes etter sannsynlighet. Husk: vekt hvert scenario.","kt":"Probability-weighted (expected) value = Σ probability × value in each scenario.","src":"L3 slide 25 · Bok s. 144 (Table 5.6)"},{"id":"SB104","l":"L3","t":"Scenario analysis","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Scenario analysis looks only at what happens if everything goes wrong, while stress testing weights several scenarios by probability.","o":[["True","Incorrect. The roles are swapped: stress testing looks at the worst case; scenario analysis weights several scenarios."],["False","Correct. The roles are swapped: stress testing looks at the worst case; scenario analysis weights several scenarios."]],"c":[1],"es":"Usant. Det er motsatt: stress testing = verste fall, scenario analysis = vektede scenarioer.","ed":"Scenario analysis ser på flere mulige fremtider og vekter dem etter sannsynlighet. Stress testing spør hva som skjer i et ekstremt, dårlig scenario: overlever firmaet? Påstanden har byttet om på dem. Husk: stress = \"hva om alt går galt\".","kt":"","src":"L3 slide 34 · Bok s. 66 (2.4.4)"},{"id":"SB105","l":"L3","t":"Scenario analysis","f":"m","d":4,"p":"M","sc":"none","s":"A $100 carbon price has never happened, so its historical probability is 0%. Why does the textbook reject this for valuation?","o":[["No historical data exist","Incorrect: data exist, but they do not reflect future policy."],["A 0% probability is always right for new events","Incorrect: this is exactly the error the book warns about."],["Carbon prices do not affect value","Incorrect: carbon prices can move value a lot."],["Past data come from a time without carbon prices","Correct: past data come from a world without carbon prices."]],"c":[3],"es":"Historiske data kommer fra en tid uten karbonpris, så de sier lite om fremtiden.","ed":"Historiske data kommer fra en tid uten karbonpris, så de sier lite om en fremtid med karbonpris. Å bruke 0 % sannsynlighet fordi noe aldri har skjedd, forutsetter at alt annet er likt (ceteris paribus), og det stemmer ikke når politikken endres. Husk: fortiden er en dårlig guide til nye risikoer.","kt":"","src":"Bok s. 61 (2.4.2) · Bok s. 62 (2.4.2)"},{"id":"SB106","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"H","sc":"none","s":"Compared with an early transition (\"soft landing\"), a late transition starting around 2030 (\"hard landing\") means:","o":[["Sudden policy and more stranded assets","Correct: late and sudden action gives the most stranded assets."],["A slow change that gives firms more time to adapt","Incorrect: that describes an early, smooth transition."],["The lowest risk for fossil fuel firms","Incorrect: fossil firms lose most here."],["No physical or transition risk","Incorrect: it has both physical and transition risk."]],"c":[0],"es":"Sen overgang = brå politikk og flere stranded assets.","ed":"En tidlig overgang (soft landing) er gradvis og forutsigbar. En sen overgang (hard landing) betyr at politikken må komme brått og hardt, og mange eiendeler mister verdi på kort tid. I tillegg har oppvarmingen fått gå lenger, så physical risk er også høyere. Husk: sent = brått = flest stranded assets.","kt":"","src":"Bok s. 62 (2.4.3) · Bok s. 63 (Figure 2.8) · L3 slide 35-38"},{"id":"SB107","l":"L3","t":"Scenario analysis","f":"m","d":3,"p":"H","sc":"none","s":"The textbook values an oil company under four scenarios, from business as usual (high value) to a late, sudden transition (value near zero). What is the main lesson?","o":[["One forecast is enough","Incorrect: uncertainty is why you use several scenarios."],["Timing does not affect value","Incorrect: timing creates big value differences."],["Value depends on transition timing","Correct: value depends on when the transition happens."],["The firm is worthless in all four scenarios","Incorrect: business as usual gives a high value."]],"c":[2],"es":"Verdien avhenger av når overgangen skjer.","ed":"Oljeselskapet har høy verdi hvis alt fortsetter som før, og nesten ingen verdi ved en sen, brå overgang. Forskjellen kommer av timingen. Ved å sammenligne aksjekursen med scenarioverdiene ser man hvilke sannsynligheter markedet priser inn. Husk: timing driver verdien.","kt":"Implied probability: the scenario weights that make the expected value equal to the observed market price.","src":"Bok s. 66 (Table 2.4) · L3 slide 25"},{"id":"SB108","l":"L3","t":"Climate scenarios","f":"t","d":5,"p":"M","sc":"none","s":"True or false: In the oil company example, a share price of about $126 implies the market gives about 60% probability to business as usual. An analyst who thinks this is too high would see the stock as overpriced.","o":[["True","Correct. The price implies 60% business as usual; if you think that is too high, the stock is overpriced."],["False","Incorrect. The price implies 60% business as usual; if you think that is too high, the stock is overpriced."]],"c":[0],"es":"Sant. Tror du sannsynligheten for business as usual er lavere, er aksjen for dyr.","ed":"Aksjekursen på $126 tilsvarer at markedet gir 60 % sannsynlighet til business as usual. Mener du sannsynligheten er lavere, er den riktige verdien lavere enn kursen, og aksjen er overpriset. Husk: prisen avslører markedets sannsynlighet.","kt":"","src":"Bok s. 66 (Table 2.4) · Bok s. 91 (3.4) · L5 slide 26"},{"id":"SB109","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"M","sc":"none","s":"The textbook's figure of EU emissions by sector shows that:","o":[["Finance is the most polluting sector","Incorrect: finance has low direct emissions."],["Carbon taxes also hit transport and industry","Correct: transport and industry also emit a lot."],["Only power and gas would be hit","Incorrect: several sectors are hit."],["Sectors with high value added never pollute much","Incorrect: industry and transport have both high value added and emissions."]],"c":[1],"es":"Karbonskatt rammer også transport og industri, ikke bare kraft.","ed":"Figuren viser at mange sektorer har store utslipp, ikke bare kraft og gass. Transport og industri er store utslippskilder og står for mye av verdiskapingen. En karbonskatt vil derfor ramme bredt. Husk: karbonrisiko er ikke bare et energiproblem.","kt":"","src":"Bok s. 63 (2.4.3) · Bok s. 64 (Figure 2.9) · Bok s. 67 (2.4.4)"},{"id":"SB110","l":"L3","t":"Stress testing","f":"m","d":4,"p":"L","sc":"none","s":"What does the climate stress test by Battiston et al. (2017) find for euro-area financial firms?","o":[["Climate policy would always cause a financial collapse","Incorrect: early policy does not cause a collapse."],["Lenders lose before shareholders","Incorrect: equity takes losses first."],["Banks mainly own risky oil shares","Incorrect: direct fossil exposure is small."],["Direct fossil exposure is small; total is large","Correct: direct exposure is small, but total exposure is large."]],"c":[3],"es":"Direkte fossil eksponering er liten, men samlet klimaeksponering er stor.","ed":"Battiston et al. finner at europeiske finansinstitusjoner har liten direkte eksponering mot fossile selskaper (3–12 %). Men når man tar med alle klimarelevante sektorer (energiintensive, bolig, transport), blir eksponeringen stor (40–54 %). Husk: liten direkte, stor total.","kt":"","src":"Bok s. 67 (2.4.4) · Bok s. 68 (Box 2.4)","e":1},{"id":"SB111","l":"L3","t":"Bank capital and climate","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Boot and Schoenmaker (2018) prefer lower capital rules for green loans over higher capital rules for brown loans, because green assets are proven to be safer.","o":[["True","Incorrect. They prefer higher capital rules for brown loans, because green assets are not proven to be safer."],["False","Correct. They prefer higher capital rules for brown loans, because green assets are not proven to be safer."]],"c":[1],"es":"Usant. De foretrekker høyere krav på brune lån. Grønt er ikke bevist tryggere.","ed":"Boot og Schoenmaker mener man bør straffe brune lån med høyere kapitalkrav (brown penalising factor), fordi de har ekstra risiko. Å senke kravet for grønne lån er farlig, fordi grønne prosjekter også har teknologi- og politikkrisiko. Husk: straff brunt, ikke belønn grønt.","kt":"","src":"Bok s. 68 (Box 2.4) · L11 slide 30-31"},{"id":"SB112","l":"L3","t":"Regulation","f":"m","d":3,"p":"M","sc":"short","s":"Why did the Montreal Protocol on the ozone layer succeed, while climate deals have struggled?","o":[["Trade sanctions punished free riders","Correct: trade sanctions punished free riders."],["Ozone loss had no health effects","Incorrect: ozone loss caused skin cancer, so it had health effects."],["Climate deals have never had any binding parts","Incorrect: climate deals have had binding parts."],["It relied only on voluntary pledges","Incorrect: it was a binding treaty."]],"c":[0],"es":"Handelssanksjoner straffet free riders.","ed":"Montreal-protokollen var en global, bindende avtale med handelssanksjoner mot land som ikke ble med. Det fjernet free rider-problemet. Klimaavtaler har slitt fordi kuttene er dyre og det er
