s + engagement + lang horisont.","kt":"","src":"Bok s. 180 (Table 7.1) · Bok s. 202 (Figure 7.6) · Bok s. 186 (Box 7.1) · Bok s. 205 (Box 7.3) · L8 slide 71-74"},{"id":"SB316","l":"L8","t":"Investment chain","f":"m","d":3,"p":"M","sc":"short","s":"NBIM uses external managers for part of the oil fund. What risk does each extra link in the chain create?","o":[["Less diversification","Feil: mandater kan øke diversifisering."],["Sure underperformance","Feil: ikke sikker underprestasjon."],["No risk","Feil: mål er sjelden helt like."],["Different horizons","Riktig: ulike horisonter."]],"c":[3],"es":"Hvert ledd kan ha egen horisont og egne mål.","ed":"Husk: principal-agent i hvert ledd.","kt":"Investment chain: the sequence of parties between the ultimate saver and the company (beneficiaries, asset owner, asset managers, companies).","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 204 (7.4.6)"},{"id":"SB317","l":"L8","t":"Financing lifecycle","f":"m","d":4,"p":"M","sc":"short","s":"Battery maker Northvolt raised billions but went bankrupt in 2024-25 after production problems. What does this show?","o":[["Green labels do not remove risk","Riktig: grønt fjerner ikke risiko."],["Green projects cannot default","Feil: Northvolt viser at de kan."],["Only equity can fund green tech","Feil: Northvolt brukte også gjeld."],["Banks should never fund new technology","Feil: poenget er å prise risikoen."]],"c":[0],"es":"Grønt betyr ikke risikofritt.","ed":"Husk: teknologirisiko finnes fortsatt.","kt":"Execution (scale-up) risk: the risk that a firm cannot turn a technology into reliable, profitable large-scale production.","src":"L8 slide 12 · Bok s. 301 (10.4.5)"},{"id":"TR31","l":"L8","t":"Double materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A cement maker emits a lot, and rising carbon prices squeeze its margins. How does double materiality apply?","o":[["Only financial materiality applies","Feil: impact er også relevant."],["Neither applies","Feil: begge gjelder."],["Impact: carbon costs; financial: emissions","Feil: paret er snudd."],["Impact: emissions; financial: carbon costs","Riktig: begge retninger."]],"c":[3],"es":"Impact: utslippene. Financial: karbonkostnadene.","ed":"Husk: impact = firma → verden. Financial = verden → firma.","kt":"Double materiality: an issue is material if the firm affects people/environment (impact) or the issue affects the firm's value (financial), or both.","src":"Opptak L8 ca. 65 min · Opptak L1 ca. 80 min"},{"id":"TR32","l":"L8","t":"Portfolio theory with sustainability","f":"m","d":3,"p":"M","sc":"none","s":"An investor adds a limit on portfolio emissions to the mean-variance problem. What happens?","o":[["Diversification is impossible","Feil: diversifisering er fortsatt mulig."],["More choices, so a higher Sharpe ratio","Feil: en grense gir færre valg."],["Nothing changes","Feil: noen porteføljer fjernes."],["Equal or lower Sharpe ratio","Riktig: lik eller lavere."]],"c":[3],"es":"En ekstra grense kan bare gi lik eller lavere Sharpe.","ed":"Husk: constraint fjerner valg.","kt":"","src":"Opptak L8 ca. 13 min · Opptak L8 ca. 17 min"},{"id":"TR33","l":"L8","t":"Asset manager materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An asset manager holds many weapons producers. What is also a material issue for the asset manager itself?","o":[["Its holdings' issues","Riktig: holdings sine issues."],["None","Feil: investorer arver issues."],["Only beating the benchmark","Feil: avkastning er et resultat."],["Only its own office energy use","Feil: egen drift er liten."]],"c":[0],"es":"Forvalteren arver problemene til selskapene den eier.","ed":"Husk: investor = holdings.","kt":"","src":"Opptak L8 ca. 37 min · Opptak L8 ca. 39 min"},{"id":"TR34","l":"L8","t":"Financing life cycle","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"Two students have an idea for carbon capture technology but no revenue yet. Which financing fits best?","o":[["A share issue on the stock exchange","Feil: emisjon er for børsnoterte."],["A big bank loan","Feil: ingen kontantstrøm å låne mot."],["Savings, family and grants","Riktig: sparing og tilskudd."],["A corporate bond","Feil: krever størrelse."]],"c":[2],"es":"Uten inntekt: sparepenger, familie og tilskudd.","ed":"Husk: tidlig fase = \"family, friends and fools\".","kt":"","src":"Opptak L8 ca. 22 min"},{"id":"TR35","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A fund drops the whole oil and gas sector, then keeps only firms with below-average emissions in each other sector. This is:","o":[["Thematic, then impact investing","Feil: ingen tema eller impact."],["Negative screening, then best-in-class","Riktig: negative screening + best-in-class."],["ESG integration, then tilting","Feil: ingen verdijustering."],["Norms-based screening, then stewardship","Feil: ingen normer."]],"c":[1],"es":"Fjerne sektor = negative screening. Beste i sektor = best-in-class.","ed":"Husk: to steg.","kt":"","src":"Opptak L8 ca. 31 min · Opptak L8 ca. 36 min"},{"id":"TR36","l":"L8","t":"Passive investing and governance","f":"m","d":3,"p":"H","sc":"none","s":"Why is \"exit\" mainly a governance tool for active investors, even though index funds also sell shares?","o":[["Their sales follow index rules","Riktig: salg følger indeksen."],["Index funds cannot vote","Feil: indeksfond kan stemme."],["Exit never works","Feil: exit kan virke."],["Index funds are never allowed to sell","Feil: de selger av og til."]],"c":[0],"es":"Indeksfond selger fordi indeksen endres, ikke fordi de misliker firmaet.","ed":"Husk: exit må være et signal.","kt":"","src":"Opptak L8 ca. 77 min · Opptak L8 ca. 78 min"},{"id":"TR37","l":"L8","t":"ESG integration","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Analyst A drops all fossil fuel firms because she dislikes them. Analyst B keeps them but lowers their forecast cash flows for carbon costs. What is B doing?","o":[["ESG integration","Riktig: ESG integration."],["Impact investing","Feil: B sikter ikke på impact."],["Norms-based screening","Feil: ingen normer."],["Negative screening","Feil: det beskriver A."]],"c":[0],"es":"B justerer kontantstrømmen for karbonkostnader = ESG integration.","ed":"Husk: A = negative screening. B = integration.","kt":"","src":"Opptak L8 ca. 52 min"},{"id":"TR38","l":"L8","t":"Impact investing","f":"t","d":2,"p":"H","sc":"none","s":"True or false: Since impact investing (SF 3.0) puts social and environmental goals first, an impact fund may run at a loss year after year.","o":[["True","Feil. Impact investing har fortsatt et avkastningskrav, så evige tap holder ikke."],["False","Riktig. Impact investing har fortsatt et avkastningskrav, så evige tap holder ikke."]],"c":[1],"es":"Usant. Impact investing er ikke veldedighet. Det krever en viss avkastning.","ed":"Husk: lavere krav, men ikke tap år etter år.","kt":"","src":"Opptak L8 ca. 67 min · Opptak L9 ca. 85 min"},{"id":"CX068","l":"L9","t":"Channels from ESG to value","f":"m","d":2,"p":"H","sc":"none","s":"A firm with strong ESG gets cheaper loans and a lower cost of equity. Here ESG affects value through:","o":[["Tax rates","Det er ikke en av kanalene i faget."],["Cash flows","Cash flow-kanalen handler om salg, kostnader og bøter."],["Cost of capital","Lavere finansieringskostnad gir høyere verdi."],["Share count","Det finnes ikke en slik kanal."]],"c":[2],"es":"Billigere finansiering = cost of capital channel.","ed":"To hovedkanaler: cash flows (f.eks. søksmål, karbonavgift) og cost of capital. Foreleser anbefaler å legge ESG inn via kontantstrømmene i verdsettelse.","kt":"","src":"L9 slide 3 · L9 slide 11","k":1},{"id":"CX069","l":"L9","t":"ESG integration in valuation","f":"t","d":2,"p":"H","sc":"none","s":"Does the lecturer recommend adjusting the WACC as the main way to integrate ESG into a valuation?","o":[["Yes","Feil. Hun anbefaler å justere kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig."],["No","Riktig. Hun anbefaler å justere kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig."]],"c":[1],"es":"Nei: juster kontantstrømmen, ikke WACC.","ed":"Justerer du både kontantstrøm og WACC for samme risiko, teller du risikoen to ganger.","kt":"","src":"Opptak L9 ca. 16 min · Opptak L9 ca. 36 min · Opptak L9 ca. 69 min","k":1},{"id":"CX070","l":"L9","t":"Green vs brown returns","f":"m","d":2,"p":"H","sc":"none","s":"According to Pástor, Stambaugh and Taylor, compared with brown assets, green assets' expected returns are:","o":[["Exactly the same","Smak og hedging gir en forskjell."],["Higher","Det er brune som må gi høyere forventet avkastning."],["Lower","Grønt er populært og en hedge mot klimarisiko, så prisen er høy og forventet avkastning lav."],["Unrelated to climate","Klimarisiko er nettopp mekanismen."]],"c":[2],"es":"Grønt: lavere forventet avkastning.","ed":"Brune aksjer er mindre populære og mer utsatt for klimarisiko, så de må tilby høyere forventet avkastning.","kt":"","src":"L9 slide 14-16","k":1},{"id":"CX071","l":"L9","t":"Green vs brown returns","f":"m","d":2,"p":"H","sc":"short","s":"When green stocks jump after a surprise climate subsidy, their future expected returns are:","o":[["They will be permanently higher","Høy pris nå betyr ikke høyere avkastning fremover."],["They will fall to zero for several years","Det er for bastant."],["Not higher: it was a one-time price jump","Sjokket ga et engangshopp i prisen."],["They will equal those of brown stocks from now on","I likevekt er grønn forventet avkastning lavere."]],"c":[2],"es":"Uventet nyhet = engangshopp, ikke høyere forventet avkastning.","ed":"Realised return (det du fikk) ≠ expected return (det du kan forvente). Grønne aksjer gjorde det bra fordi klimabekymringen økte uventet.","kt":"","src":"L9 slide 14 · L9 slide 17-18","k":1},{"id":"CX072","l":"L9","t":"Is ESG a risk factor","f":"t","d":2,"p":"H","sc":"none","s":"Is ESG a well-established risk factor, like the market factor?","o":[["Yes","Feil. Det finnes ingen robust evidens for en stabil ESG-premie på tvers av definisjoner og land."],["No","Riktig. Det finnes ingen robust evidens for en stabil ESG-premie på tvers av definisjoner og land."]],"c":[1],"es":"Nei: ingen robust ESG-faktor.","ed":"En faktor må ha solid forskning bak seg og være robust på tvers av definisjoner og land. ESG klarer ikke disse testene.","kt":"","src":"L9 slide 22 · L9 slide 24 · L9 slide 26","k":1},{"id":"CX073","l":"L9","t":"ESG as a risk factor","f":"m","d":2,"p":"H","sc":"none","s":"A risk that can be diversified away is:","o":[["A rise in all interest rates","Rammer hele markedet = systematisk."],["A scandal at one company","Selskapsspesifikk risiko forsvinner i en bred portefølje."],["Economy-wide climate change","Rammer mange samtidig = mulig systematisk."],["A global recession","Rammer alle = systematisk."]],"c":[1],"es":"Ett selskap = diversifiserbart.","ed":"Derfor gir slik risiko ingen risikopremie. Klima er annerledes: det kan ramme hele økonomien og er derfor muligens systematisk.","kt":"","src":"Opptak L9 ca. 59 min · Opptak L9 ca. 68 min","k":1},{"id":"CX074","l":"L9","t":"Is ESG a risk factor","f":"m","d":2,"p":"H","sc":"none","s":"Bolton and Kacperczyk find higher stock returns for high-emission firms. The best interpretation is that:","o":[["Carbon risk is not priced at all","Premien viser at den er priset."],["High emitters are better managed firms","Studien sier ikke det."],["Investors want pay for carbon risk","Det er en carbon premium: betalt for å bære risikoen."],["Green firms are riskier than brown firms","Det er motsatt."]],"c":[2],"es":"Høyere avkastning = kompensasjon for karbonrisiko.","ed":"Dette passer med Pástor m.fl.: brune aksjer må tilby høyere forventet avkastning.","kt":"","src":"L9 slide 27 · L9 slide 15","k":1},{"id":"CX075","l":"L9","t":"DCF valuation","f":"m","d":2,"p":"H","sc":"none","s":"To go from enterprise value to equity value, you:","o":[["Divide by the tax rate","Skatt er allerede i kontantstrømmen."],["Add net debt","Gjeld skal trekkes fra."],["Multiply by the WACC","WACC brukes til diskontering, ikke her."],["Subtract net debt","Gjelden tilhører långiverne."]],"c":[3],"es":"Equity = EV − net debt.","ed":"Enterprise value er verdien for både eiere og långivere. Trekk fra det långiverne skal ha, og del på antall aksjer for verdi per aksje.","kt":"","src":"L9 slide 5 · Bok s. 215 (8.1.2) · Bok s. 217 (Table 8.2)","k":1},{"id":"CX076","l":"L9","t":"Engagement and divestment","f":"m","d":2,"p":"H","sc":"none","s":"Cohen, Gurun and Nguyen question excluding energy firms from ESG funds because:","o":[["Energy firms always have high ESG ratings","De har ofte lave ESG-scorer."],["Energy firms never emit CO2","Det stemmer ikke."],["Excluding them is illegal","Det er helt lovlig å ekskludere dem."],["They produce many green patents","Ekskluderte energiselskaper er viktige grønne innovatører."]],"c":[3],"es":"Ekskludering kan ramme de som innoverer mest grønt.","ed":"Et argument for engagement fremfor ren ekskludering: man beholder innflytelsen over selskapene som utvikler grønn teknologi.","kt":"","src":"L9 slide 33 · L8 slide 58","k":1},{"id":"EX07","l":"L9","t":"Exam sample: channels from ESG to value","f":"m","d":2,"p":"H","sc":"none","s":"ESG issues can affect firm value through which channel:","o":[["Tax channel","Det er ikke en av kanalene i faget."],["Cash flow channel","Foreleserens fasit: ESG påvirker salg, kostnader, investeringer og bøter, og dermed kontantstrømmen."],["Cost of capital channel","Faget nevner også denne kanalen, men foreleserens fasit er cash flow. Hun anbefaler å legge ESG inn via kontantstrømmene."],["Dividend channel","Det er ikke en av kanalene i faget."]],"c":[1],"es":"Foreleserens fasit: cash flow channel.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nObs: boka beskriver også en cost of capital channel. Foreleser anbefaler likevel å legge ESG inn via kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig. På eksamen: velg cash flow når bare én kanal kan være riktig.","kt":"","src":"L9 slide 3 · L9 slide 11","k":1,"x":1},{"id":"SB318","l":"L9","t":"Channels from ESG to value","f":"m","d":3,"p":"H","sc":"short","s":"Bayer agreed in 2020 to pay about USD 10 billion to settle lawsuits claiming its weedkiller Roundup caused cancer. Through which channel did this hit value?","o":[["Only the cost of capital","Feil: forliket er en kontantkostnad."],["Cash flows: legal costs","Riktig: juridiske kostnader trekker ned kontantstrømmen."],["Neither","Feil: produktsikkerhet er material."],["Higher Roundup sales","Feil: søksmålet senket verdien."]],"c":[1],"es":"Erstatning er penger ut av firmaet, altså cash flow-kanalen.","ed":"Husk: søksmål = cash flow. Risikopremie = cost of capital.","kt":"Cash flow channel: ESG affects value through revenues, costs (incl. litigation), capex and stranded assets.","src":"L9 slide 3 · L9 slide 11"},{"id":"SB319","l":"L9","t":"Valuation methods","f":"m","d":2,"p":"H","sc":"none","s":"Why does the textbook prefer a DCF valuation over multiples for ESG integration?","o":[["A DCF shows the assumptions","Riktig: DCF gjør antagelsene synlige."],["A DCF needs no forecasts","Feil: DCF bygger på prognoser."],["Multiples cannot be calculated here","Feil: multiples kan regnes ut."],["P/E ratios are banned","Feil: P/E er ikke forbudt."]],"c":[0],"es":"En DCF viser antagelsene tydelig, så du kan legge inn ESG-effekter.","ed":"Husk: multiples skjuler antagelser.","kt":"","src":"L9 slide 4 · Bok s. 214 (8.1.2) · Bok s. 218 (8.1.2)"},{"id":"SB320","l":"L9","t":"DCF valuation","f":"m","d":2,"p":"H","sc":"none","s":"In a DCF, how do you go from enterprise value to equity value?","o":[["Add net debt","Feil: gjeld skal trekkes fra."],["Discount it again","Feil: diskonteringen er allerede gjort."],["Multiply by the equity share","Feil: egenkapitalen er resten, ikke en andel."],["Subtract net debt","Riktig: trekk fra netto gjeld."]],"c":[3],"es":"Equity value = enterprise value − netto gjeld.","ed":"Husk: EV er for alle finansierere. Eierne får resten.","kt":"","src":"L9 slide 5 · Bok s. 215 (8.1.2) · Bok s. 217 (Table 8.2)"},{"id":"SB321","l":"L9","t":"DCF valuation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In V0 = FCF1 / (WACC − g), a higher growth rate g (with the same WACC) lowers the firm's value.","o":[["True","Feil. Høyere g gir mindre nevner, og da blir verdien høyere."],["False","Riktig. Høyere g gir mindre nevner, og da blir verdien høyere."]],"c":[1],"es":"Usant. Høyere g gjør nevneren (WACC − g) mindre, så verdien stiger.","ed":"Husk: mindre nevner = større verdi.","kt":"","src":"Bok s. 215 (8.1.2) · L9 slide 8"},{"id":"SB322","l":"L9","t":"DCF valuation","f":"m","d":3,"p":"M","sc":"none","s":"An analyst uses the consensus forecast, except she sets the EBIT margin at 16% instead of 12%. What happens to fair value?","o":[["It falls","Feil: kontantstrømmen etter skatt øker."],["It rises by exactly 4%","Feil: 4 prosentpoeng er ca. 33 % mer EBIT."],["It does not change","Feil: marginen driver FCF."],["It rises by over 4%","Riktig: mer enn 4 % (ca. 35 %)."]],"c":[3],"es":"Fra 12 % til 16 % er en tredjedel høyere EBIT. Verdien stiger mye mer enn 4 %.","ed":"Husk: prosentpoeng ≠ prosent.","kt":"","src":"Bok s. 218 (8.1.2)"},{"id":"SB323","l":"L9","t":"Value drivers","f":"m","d":2,"p":"H","sc":"none","s":"Where does sustainability usually link to value drivers?","o":[["Only in the terminal growth rate","Feil: det kan påvirke alle drivere."],["Only for energy firms","Feil: alle bransjer har material issues."],["Through growth, margins and capital","Riktig: vekst, margin og kapital."],["Add the ESG rating to the share price","Feil: integrering går via value drivers."]],"c":[2],"es":"Bærekraft påvirker vekst, marginer og kapital.","ed":"Husk: value drivers.","kt":"","src":"L9 slide 6 · Bok s. 218 (8.1.2)"},{"id":"SB324","l":"L9","t":"Why sustainability matters","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Business models are the \"missing link\" between ESG and finance; because few see this link, material ESG issues are often mispriced, which creates opportunities.","o":[["True","Riktig. Business models er koblingen. Fordi få ser den, oppstår feilprising."],["False","Feil. Business models er koblingen. Fordi få ser den, oppstår feilprising."]],"c":[0],"es":"Sant. Business model kobler ESG til finans. Få ser det, så ESG blir feilpriset.","ed":"Husk: missing link.","kt":"","src":"Bok s. 219 (8.2) · Bok s. 219 (Figure 8.3) · Bok s. 220 (8.2)"},{"id":"SB325","l":"L9","t":"ESG integration in valuation","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"After ESG adjustments, CESGA's enterprise value is 882,379. It has cash of 40,000, debt of 600,000 (thousands) and 20 million shares. What is the equity value?","o":[["882,379","Feil: du må justere for kontanter og gjeld."],["242,379 (about 12 per share)","Feil: kontanter skal legges til."],["322,379 (about 16 per share)","Riktig: 322 379."],["1,522,379 (about 76 per share)","Feil: snudd fortegn på gjeld og kontanter."]],"c":[2],"es":"882 379 + 40 000 − 600 000 = 322 379, ca. 16 per aksje.","ed":"Husk: equity = EV + cash − debt.","kt":"","src":"L9 slide 9-10"},{"id":"SB326","l":"L9","t":"ESG integration in valuation","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In the CESGA example, which ESG adjustment is matched with the right pillar?","o":[["More market share from better products - Social","Feil: bedre produkter for miljøet er E."],["Higher growth from good governance - Social","Feil: ingen slik justering."],["Lower debt from the lawsuit - Environmental","Feil: ingen slik justering."],["Extra taxes from tax avoidance - Governance","Riktig: skatt er G."]],"c":[3],"es":"Skatteunngåelse er governance (G).","ed":"Husk: skatt = G.","kt":"","src":"L9 slide 9-10 · Bok s. 231 (8.3.1.1)"},{"id":"SB327","l":"L9","t":"Materiality analysis","f":"m","d":2,"p":"H","sc":"none","s":"The textbook's materiality table asks three things about each material ESG factor. Which set is correct?","o":[["ESG rating, index weight, price reaction","Feil: ikke kolonnene."],["Carbon, water and waste","Feil: ikke bare miljø."],["Performance, edge, value driver","Riktig: de tre spørsmålene."],["News, NGO campaigns, lawsuits","Feil: ikke rammeverket."]],"c":[2],"es":"Performance, edge og value driver.","ed":"Husk: hvor god, fortrinn, hvilken driver.","kt":"","src":"L9 slide 7-8 · Bok s. 249 (Appendix)"},{"id":"SB328","l":"L9","t":"Value driver adjustment","f":"m","d":2,"p":"H","sc":"none","s":"Which is a step in the value driver adjustment (VDA) approach?","o":[["Hold the stock for 12 months","Feil: ikke et steg."],["Use a P/E multiple instead of a DCF","Feil: VDA bruker DCF."],["Focus on the most material issues","Riktig: fokus på material issues."],["Let a proxy advisor vote","Feil: analytikeren skal ha dialog selv."]],"c":[2],"es":"Første steg i VDA er å fokusere på de mest material issues.","ed":"Husk: VDA = material → drivere → verdi → dialog.","kt":"","src":"Bok s. 229 (8.3.1.1) · Bok s. 230 (8.3.1.1)"},{"id":"SB329","l":"L9","t":"Value driver adjustment","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"An analyst makes small ESG adjustments for KUKA: slightly higher growth and margins and a slightly lower cost of capital. Why does the target price rise a lot?","o":[["Small changes add up over time","Riktig: små endringer summerer seg."],["ESG is added as a fixed bonus","Feil: VDA bruker drivere, ikke bonus."],["It does not rise","Feil: alle tre øker verdien."],["A lower cost of capital lowers value","Feil: lavere kapitalkostnad øker verdien."]],"c":[0],"es":"Små endringer i flere drivere forsterker hverandre over tid.","ed":"Husk: små justeringer, stor effekt.","kt":"Value driver adjustment (VDA): changing growth, margin or cost-of-capital assumptions to reflect ESG-based competitive (dis)advantages.","src":"Bok s. 231 (Box 8.1)"},{"id":"SB330","l":"L9","t":"Value driver adjustment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Governance adjustments mostly change sales growth and margins, while innovation adjustments mostly change the cost of capital.","o":[["True","Feil. Det er motsatt: innovasjon påvirker vekst/margin, governance påvirker cost of capital."],["False","Riktig. Det er motsatt: innovasjon påvirker vekst/margin, governance påvirker cost of capital."]],"c":[1],"es":"Usant. Det er motsatt: innovasjon endrer vekst og margin, governance endrer kapitalkostnad.","ed":"Husk: G → WACC.","kt":"","src":"Bok s. 231 (8.3.1.1)"},{"id":"SB331","l":"L9","t":"Cost of capital channel","f":"m","d":3,"p":"H","sc":"none","s":"Which finding on ESG and the cost of capital is correctly attributed?","o":[["El Ghoul et al.: better CSR, lower cost of equity","Riktig: bedre CSR, lavere kostnad."],["El Ghoul et al.: tobacco firms have lower cost of equity","Feil: tobakk gir høyere kostnad."],["Dhaliwal et al.: CSR reports raise the cost of capital","Feil: de finner lavere kostnad."],["Cheng et al.: only governance matters","Feil: både S og E betyr noe."]],"c":[0],"es":"El Ghoul et al.: bedre CSR gir lavere cost of equity.","ed":"Husk: sin industries gir høyere cost of equity.","kt":"","src":"L9 slide 12 · Bok s. 220 (8.2.1.1) · Bok s. 221 (8.2.1.1)"},{"id":"SB332","l":"L9","t":"Cost of capital channel","f":"t","d":4,"p":"M","sc":"short","s":"True or false: Lower bond spreads for firms with higher ESG scores do not prove that ESG lowers the cost of capital, since high-ESG firms are also often larger and stronger.","o":[["True","Riktig. Størrelse og styrke kan forklare både høy ESG og lav spread."],["False","Feil. Størrelse og styrke kan forklare både høy ESG og lav spread."]],"c":[0],"es":"Sant. Store, sterke firmaer har både høy ESG og lav spread.","ed":"Husk: korrelasjon ≠ kausalitet.","kt":"Confounding variable: a factor (e.g. firm size) that drives both the supposed cause and the effect, creating a misleading correlation.","src":"L9 slide 13 · L9 slide 12"},{"id":"SB333","l":"L9","t":"Green vs brown returns","f":"m","d":3,"p":"H","sc":"none","s":"Why should green assets have LOWER expected returns than brown assets (Pástor, Stambaugh and Taylor)?","o":[["Green firms are smaller and riskier","Feil: mer risiko ville gitt høyere avkastning."],["Regulators cap green returns","Feil: det finnes ingen slik regulering."],["Green firms pay more dividends","Feil: det handler om preferanser og hedging."],["Taste and climate hedging","Riktig: taste og hedging."]],"c":[3],"es":"Investorer liker grønt (taste) og det sikrer mot klimarisiko (hedging). Begge senker avkastningen.","ed":"Husk: grønt = dyrere = lavere forventet avkastning.","kt":"","src":"L9 slide 14-16"},{"id":"SB334","l":"L9","t":"Green vs brown returns","f":"m","d":4,"p":"H","sc":"none","s":"A green-minus-brown portfolio earned 174% in recent years. How do Pástor, Stambaugh and Taylor explain this?","o":[["Green stocks always have higher expected returns","Feil: de forventer lavere avkastning for grønt."],["Brown stocks are riskier","Feil: brune gjorde det dårligere."],["Green firms paid higher dividends","Feil: driveren var klimabekymring."],["Climate concern rose unexpectedly","Riktig: uventet bekymring."]],"c":[3],"es":"Uventet økt klimabekymring løftet grønne aksjer.","ed":"Husk: realisert ≠ forventet avkastning.","kt":"","src":"L9 slide 14 · L9 slide 17-18"},{"id":"SB335","l":"L9","t":"Green vs brown returns","f":"m","d":4,"p":"H","sc":"short","s":"US clean energy stocks jumped when the Inflation Reduction Act (2022) offered surprise subsidies. How should investors read this?","o":[["A one-time price jump","Riktig: engangshopp."],["Expect the same jump every year","Feil: overraskelser gjentar seg ikke."],["Subsidies do not affect prices","Feil: prisene reagerte."],["Green stocks always earn more","Feil: teori sier lavere forventet avkastning."]],"c":[0],"es":"Et engangshopp i prisen, ikke høyere fremtidig avkastning.","ed":"Husk: overraskelser gjentas ikke.","kt":"Realised vs expected return: realised returns include surprises; expected returns are what investors anticipate given risk and tastes.","src":"L9 slide 15-16 · L9 slide 18"},{"id":"SB336","l":"L9","t":"Asset pricing models","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A manager says: \"This solar park is green, so we should use a much lower discount rate.\" What is the best answer?","o":[["Ignore the discount rate","Feil: NPV krever diskontering."],["Use the highest rate","Feil: renten skal matche risikoen."],["Agree and use a zero rate","Feil: grønne prosjekter har risiko."],["Use a rate for its risk","Riktig: rente etter risiko."]],"c":[3],"es":"Bruk en rente som passer risikoen. Grønt alene gir ikke lav rente.","ed":"Husk: rente = risiko. ESG-effekter i cash flow.","kt":"Cost of capital: the return investors require for a project's risk; in CAPM/APT it depends on exposure to systematic risk factors.","src":"L9 slide 19 · L9 slide 21"},{"id":"SB337","l":"L9","t":"Asset pricing models","f":"m","d":3,"p":"H","sc":"none","s":"In the arbitrage pricing theory, E(Ri) = Rf + Σ βi,λ (RM,λ − Rf). What is βi,λ?","o":[["The asset's weight in the market","Feil: det er en vekt."],["Sensitivity to factor λ","Riktig: følsomhet for faktoren."],["The asset's firm-specific risk","Feil: firmarisiko kan diversifiseres bort."],["The real risk-free rate","Feil: Rf står separat."]],"c":[1],"es":"β er hvor følsom aksjen er for faktoren.","ed":"Husk: β = sensitivity.","kt":"","src":"L9 slide 21 · L9 slide 23"},{"id":"SB338","l":"L9","t":"Is ESG a risk factor","f":"m","d":4,"p":"H","sc":"none","s":"Research Affiliates tested long-short ESG strategies (2009-2020). What did they conclude?","o":[["ESG is a strong factor everywhere","Feil: alfaene var små."],["There is no robust ESG premium","Riktig: ingen robust premie."],["Governance has a large premium","Feil: governance hadde negativ avkastning."],["ESG meets all factor criteria","Feil: lite enighet om robusthet."]],"c":[1],"es":"Ingen robust ESG-premie.","ed":"Husk: alfaene var ikke signifikante.","kt":"","src":"L9 slide 22 · L9 slide 24 · L9 slide 26"},{"id":"SB339","l":"L9","t":"Is ESG a risk factor","f":"t","d":4,"p":"H","sc":"none","s":"True or false: Bolton and Kacperczyk (2021) find that firms with higher carbon emissions earn LOWER stock returns.","o":[["True","Feil. Firmaer med høye utslipp har høyere avkastning, fordi investorer krever en premie."],["False","Riktig. Firmaer med høye utslipp har høyere avkastning, fordi investorer krever en premie."]],"c":[1],"es":"Usant. Høyere utslipp gir HØYERE avkastning (carbon premium).","ed":"Husk: investorer krever kompensasjon for karbonrisiko.","kt":"","src":"L9 slide 27 · L9 slide 15"},{"id":"SB340","l":"L9","t":"Is ESG a risk factor","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"High-ESG stocks have earned lower returns. Analyst A says they are less risky; analyst B says they are overpriced. What is the difference?","o":[["A: fair return; B: mispricing","Riktig: risiko vs feilprising."],["A means you should short them","Feil: lavere risiko gir ingen gratis gevinst."],["There is no difference","Feil: forskjellen er stor."],["B means a higher beta","Feil: overprising handler om alfa."]],"c":[0],"es":"A: lavere risiko gir lavere avkastning (fair). B: aksjene er feilpriset.","ed":"Husk: risiko består, feilprising forsvinner.","kt":"Risk explanation: lower expected return compensates for lower (systematic) risk. Mispricing: price deviates from fair value (α ≠ 0) and should eventually correct.","src":"L9 slide 24-25 · L9 slide 20 · L9 slide 27"},{"id":"SB341","l":"L9","t":"Evidence: sustainability and value","f":"m","d":3,"p":"M","sc":"short","s":"Firms with high CSR did better in the 2008-09 crisis (Lins, Servaes and Tamayo). Why?","o":[["They were all in safe sectors","Feil: ikke bare sektoreffekt."],["They had no debt","Feil: forklaringen er tillit."],["Governments rescued only them","Feil: ingen slik redning."],["Stakeholder trust paid off","Riktig: tillit."]],"c":[3],"es":"Tillit fra stakeholders lønte seg i krisen.","ed":"Husk: CSR = trust = buffer i krise.","kt":"Social capital: trust and goodwill built with employees, customers, suppliers and investors through responsible behaviour.","src":"Bok s. 221 (8.2.1.1)"},{"id":"SB342","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"M","sc":"none","s":"Firms with IMPROVING sustainability ratings outperform, but firms with already HIGH ratings do not. Why?","o":[["Improvements are news","Riktig: forbedring er ny info."],["Agencies inflate bad firms' ratings","Feil: ikke forklaringen."],["High-rated firms are bubbles","Feil: ingen krakk."],["Improving firms are smaller","Feil: forklaringen er informasjon."]],"c":[0],"es":"Forbedringer er nyheter. Høye nivåer er allerede priset.","ed":"Husk: endring > nivå.","kt":"","src":"Bok s. 222 (8.2.1.2) · Bok s. 232 (8.3.1.2)"},{"id":"SB343","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"H","sc":"none","s":"Why is the evidence linking ESG to INVESTOR returns weak, even though ESG is linked to firm performance?","o":[["Investors price ESG at once","Feil: markedet ignorerer ofte ESG."],["All SRI funds are the same","Feil: strategiene er ulike."],["Sin stocks are unique","Feil: sin stocks kan kopieres."],["Old studies used narrow funds","Riktig: smale fond."]],"c":[3],"es":"Eldre studier brukte smale fond, ikke ESG generelt.","ed":"Husk: strategien betyr noe.","kt":"","src":"Bok s. 222 (8.2.1.3) · Bok s. 223 (Figure 8.4)"},{"id":"SB344","l":"L9","t":"Evidence: sustainability and value","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A high carbon footprint always means high carbon risk; for example, an aluminium producer always loses from a higher carbon price.","o":[["True","Feil. Høyt fotavtrykk kan gi fordel, fordi aluminium erstatter tyngre materialer."],["False","Riktig. Høyt fotavtrykk kan gi fordel, fordi aluminium erstatter tyngre materialer."]],"c":[1],"es":"Usant. Et aluminiumsselskap kan tjene på høyere karbonpris.","ed":"Husk: footprint ≠ risiko.","kt":"","src":"Bok s. 223 (8.2.2) · Bok s. 224 (8.2.2)"},{"id":"SB345","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"L","sc":"none","s":"What do Edmans, Li and Zhang (2017) find about employee satisfaction across countries?","o":[["It predicts lower returns in the US and UK","Feil: effekten er positiv der."],["It predicts higher returns everywhere","Feil: det avhenger av markedet."],["It matters only in Germany","Feil: Tyskland viser ingen effekt."],["It works in flexible labour markets","Riktig: fleksible markeder."]],"c":[3],"es":"Fornøyde ansatte gir avkastning der arbeidsmarkedet er fleksibelt.","ed":"Husk: USA/UK ja, Tyskland nei.","kt":"","src":"Bok s. 224 (8.2.3) · Bok s. 225 (8.2.3)"},{"id":"SB346","l":"L9","t":"Evidence: sustainability and value","f":"m","d":3,"p":"M","sc":"none","s":"What do Grewal, Serafeim and Yoon (2016) find about ESG shareholder proposals?","o":[["They have no effect","Feil: de har effekt."],["They work even without a majority","Riktig: virker uten flertall."],["They only work with majority support","Feil: flertall trengs ikke."],["All proposals add equal value","Feil: immaterielle forslag skader."]],"c":[1],"es":"Forslagene virker selv uten flertall.","ed":"Husk: immaterielle forslag kan senke verdien.","kt":"","src":"Bok s. 225 (8.2.5) · Bok s. 226 (8.2.5)"},{"id":"SB347","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"H","sc":"none","s":"Which match of investment approach and goal is correct?","o":[["Exclusion: max F; integration: max I; impact: max S+E","Riktig: riktig kobling."],["Exclusion: max S+E; integration: max F; impact: max I","Feil: blandet sammen."],["Impact: max F; exclusion: max I","Feil: impact setter S og E først."],["All three maximise F","Feil: bare tradisjonell maksimerer F alene."]],"c":[0],"es":"Exclusion: maks F. Integration: maks I. Impact: maks S + E.","ed":"Husk: 1.0, 2.0, 3.0.","kt":"","src":"L9 slide 29 · Bok s. 212 (Table 8.1)"},{"id":"SB348","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about ESG approaches in equity investing is correct?","o":[["Ratings are the basis of impact investing","Feil: ratinger brukes ikke i impact."],["Exclusion picks only the best performers","Feil: exclusion beholder mange."],["Impact investing looks at return first","Feil: impact kommer først."],["Impact investing looks at products first","Riktig: produktene først."]],"c":[3],"es":"Impact investing ser på produktene først.","ed":"Husk: impact = hva firmaet selger.","kt":"","src":"Bok s. 212 (Table 8.1)"},{"id":"SB349","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"H","sc":"none","s":"How well does ESG integration suit fundamental, quant and passive investing?","o":[["High, high, high","Feil: bare fundamental kan integrere."],["Low, high, high","Feil: rekkefølgen er snudd."],["High, low, none","Riktig: høy, lav, ingen."],["Medium, medium, medium","Feil: det beskriver screening."]],"c":[2],"es":"Fundamental: høy, quant: lav, passiv: ingen.","ed":"Husk: integrering krever analyse.","kt":"","src":"L9 slide 34-35 · Bok s. 228 (Table 8.3) · Bok s. 228 (8.3.1)"},{"id":"SB350","l":"L9","t":"ESG in portfolio management","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Quant investing looks backward at past patterns, so it struggles with big changes like rising carbon prices.","o":[["True","Riktig. Quant bygger på historiske mønstre og ser dårlig nye endringer som karbonpris."],["False","Feil. Quant bygger på historiske mønstre og ser dårlig nye endringer som karbonpris."]],"c":[0],"es":"Sant. Quant bruker historikk og sliter med store skifter.","ed":"Husk: fortid ≠ fremtid.","kt":"","src":"Bok s. 232 (8.3.1.2) · Bok s. 233 (8.3.1.2)"},{"id":"SB351","l":"L9","t":"ESG in portfolio management","f":"m","d":4,"p":"H","sc":"none","s":"A low-carbon index has about 50% lower emissions but tracks its benchmark closely. Why is it called a \"free option on carbon\"?","o":[["It carries no risk","Feil: den har markedsrisiko."],["It wins once carbon is priced","Riktig: gevinst når karbon prises."],["It wins from day one","Feil: gevinsten kommer senere."],["Investors get free carbon credits","Feil: det er et bilde, ikke en kontrakt."]],"c":[1],"es":"Den følger markedet nå, og vinner når karbon blir priset.","ed":"Husk: lite tap i dag, gevinst senere.","kt":"","src":"Bok s. 233 (Box 8.2) · Bok s. 233 (8.3.1.3) · Bok s. 234 (8.3.1.3)"},{"id":"SB352","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A fund only uses negative screening but calls itself \"fully ESG integrated\". What is the best critique?","o":[["Exclusion is not valuation","Riktig: exclusion er ikke integrering."],["Exclusion always gives the best returns","Feil: integrering sees som mer nyttig."],["Screening is the best form of integration","Feil: exclusion er SF 1.0."],["They are the same thing","Feil: de er forskjellige."]],"c":[0],"es":"Å utelukke er ikke å verdsette. Integrering krever ESG i analysen.","ed":"Husk: exclusion = 1.0, integration = 2.0.","kt":"ESG integration: explicit consideration of material ESG factors alongside financial factors in valuing and selecting securities.","src":"L9 slide 31 · L9 slide 37 · Bok s. 228 (8.3.1.1)"},{"id":"SB353","l":"L9","t":"Engagement and divestment","f":"m","d":3,"p":"M","sc":"none","s":"What is the \"washing machine\" strategy (Gollier and Pouget, 2014)?","o":[["Relabelling normal funds as ESG","Feil: det handler om å forbedre firmaer."],["Money laundering through green loans","Feil: ikke relevant."],["Buying and fixing bad firms","Riktig: kjøp og fiks."],["Selling brown stocks for green bonds","Feil: det er divestment."]],"c":[2],"es":"Kjøp dårlige firmaer og gjør dem bedre.","ed":"Husk: washing machine = forbedre, ikke selge.","kt":"","src":"L9 slide 32 · L9 slide 33"},{"id":"SB354","l":"L9","t":"Engagement and divestment","f":"t","d":4,"p":"H","sc":"none","s":"True or false: Energy firms with low ESG scores, often excluded by ESG funds, produce many high-quality green patents (Cohen, Gurun and Nguyen, 2020).","o":[["True","Riktig. Energifirmaer med lav ESG-score står bak mange grønne patenter."],["False","Feil. Energifirmaer med lav ESG-score står bak mange grønne patenter."]],"c":[0],"es":"Sant. Energiselskaper med lav ESG lager mange grønne patenter.","ed":"Husk: ESG-innovation disconnect.","kt":"","src":"L9 slide 33 · L8 slide 58"},{"id":"SB355","l":"L9","t":"Impact investing","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the GIIN's four features of impact investing?","o":[["Only private equity counts","Feil: alle aktivaklasser."],["Measuring impact","Riktig: måle impact."],["Returns must be below market","Feil: avkastning kan være over eller under markedet."],["Investments must be rated AAA","Feil: ikke et kriterium."]],"c":[1],"es":"Å måle impact er en av GIIN-kravene.","ed":"Husk: intention, return, range of returns, measurement.","kt":"","src":"L9 slide 36 · Bok s. 235 (8.4) · Bok s. 236 (8.4) · Bok s. 237 (8.4.3)"},{"id":"SB356","l":"L9","t":"Impact investing","f":"m","d":4,"p":"M","sc":"none","s":"Why can listed impact investing still give market-level returns?","o":[["Governments guarantee returns","Feil: ingen garantier."],["SDG trends help their growth","Riktig: SDG-trender gir vekst."],["Impact stocks are always cheap","Feil: ikke argumentet."],["They take more risk","Feil: det handler om drivere."]],"c":[1],"es":"SDG-trender gir vekst, så avkastningen kan være på markedsnivå.","ed":"Husk: impact kan gi sterke value drivers.","kt":"","src":"Bok s. 237 (8.4.2) · Bok s. 238 (Figure 8.5) · Bok s. 239 (8.4.4) · Bok s. 240 (Table 8.5)"},{"id":"SB357","l":"L9","t":"Impact investing","f":"m","d":3,"p":"L","sc":"none","s":"Which impact dimension asks how the effect compares with what would have happened anyway?","o":[["Contribution","Riktig: contribution."],["Who","Feil: who = hvem som får effekten."],["Risk","Feil: risk = sannsynlighet for avvik."],["How much (scale and duration)","Feil: how much = størrelse."]],"c":[0],"es":"Contribution = hva hadde skjedd uansett (additionality).","ed":"Husk: contribution = counterfactual.","kt":"","src":"Bok s. 239 (8.4.4) · Bok s. 240 (Figure 8.6)"},{"id":"SB358","l":"L9","t":"ESG integration in valuation","f":"t","d":3,"p":"H","sc":"extended_course_case","s":"True or false: Novozymes' enzymes cut customers' energy use. Using VDA, an analyst would set its growth and margins above the industry average.","o":[["True","Riktig. Novozymes har høyere vekst og margin enn bransjen, og VDA gjør det eksplisitt."],["False","Feil. Novozymes har høyere vekst og margin enn bransjen, og VDA gjør det eksplisitt."]],"c":[0],"es":"Sant. Novozymes vokser og tjener mer enn bransjen, så VDA justerer opp.","ed":"Husk: positive impact → sterkere drivere.","kt":"Value driver adjustment (VDA): adjusting growth, margin or cost-of-capital assumptions to reflect a company's competitive (dis)advantage on material ESG issues.","src":"Bok s. 230 (8.3.1.1) · Bok s. 122 (Box 5.2)"},{"id":"SB359","l":"L9","t":"Barriers to ESG integration","f":"m","d":2,"p":"M","sc":"none","s":"Why do ESG issues get too little attention in investment cases (CFA Institute, 2015)?","o":[["Short investor horizons","Riktig: kort horisont."],["ESG never affects results","Feil: ESG kan påvirke resultater."],["ESG data are boring","Feil: problemet er dårlige data."],["ESG is banned in valuations","Feil: ikke forbudt."]],"c":[0],"es":"Korte investorhorisonter gjør at ESG får lite oppmerksomhet.","ed":"Husk: short-termism.","kt":"","src":"Bok s. 227 (8.3) · Bok s. 228 (8.3.1.1)"},{"id":"SB360","l":"L9","t":"ESG integration synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"An analyst thinks a utility's renewable assets give it a lasting cost edge, and that carbon prices will rise. How should she show this?","o":[["Cut the discount rate a lot","Feil: det blander risiko og forventning."],["Assume past green returns will repeat","Feil: tidligere avkastning var overraskelser."],["Adjust value drivers","Riktig: juster drivere."],["Exclude the utility","Feil: exclusion ignorerer fortrinnet."]],"c":[2],"es":"Vis det gjennom value drivers.","ed":"Husk: fortrinn → drivere, ikke lavere rente.","kt":"","src":"L9 slide 3-10 · L9 slide 14-18 · L9 slide 20 · Bok s. 230 (8.3.1.1)"},{"id":"SB361","l":"L9","t":"ESG integration synthesis","f":"m","d":3,"p":"L","sc":"none","s":"The NorSIF guide to ESG valuation adds something beyond cash flows and the cost of capital. What?","o":[["Past \"sins\"","Riktig: tidligere sins."],["A ban on scenarios","Feil: scenarioer er med."],["A buy list","Feil: det er en metodeguide."],["Using only P/E multiples","Feil: guiden bruker DCF."]],"c":[0],"es":"NorSIF legger til tidligere \"sins\" (fortidens synder).","ed":"Husk: også scenarioer og opsjonalitet.","kt":"","src":"L9 slide 11"},{"id":"SB362","l":"L9","t":"Equity basics","f":"m","d":2,"p":"M","sc":"none","s":"Why does sustainability matter more to equity investors than to most other investors?","o":[["They are liable for company debts","Feil: limited liability."],["Equity has a fixed return","Feil: det beskriver gjeld."],["They are residual claimants","Riktig: residual claimants."],["Only they read sustainability reports","Feil: ikke argumentet."]],"c":[2],"es":"Eierne er residual claimants og får mest av risikoen.","ed":"Husk: equity tar tapet først.","kt":"","src":"Bok s. 211 (Overview) · Bok s. 215 (8.1.2)"},{"id":"TR39","l":"L9","t":"ESG integration in valuation","f":"t","d":3,"p":"H","sc":"none","s":"True or false: The lecturer recommends putting ESG mainly into the cash flows, not the WACC, because the evidence on ESG and the cost of capital is unclear.","o":[["True","Riktig. Effekten på cash flows er tydelig, mens effekten på WACC er omdiskutert."],["False","Feil. Effekten på cash flows er tydelig, mens effekten på WACC er omdiskutert."]],"c":[0],"es":"Sant. ESG påvirker klart cash flows. Effekten på WACC er uklar.","ed":"Husk: putt ESG i kontantstrømmen.","kt":"","src":"Opptak L9 ca. 16 min · Opptak L9 ca. 36 min · Opptak L9 ca. 69 min"},{"id":"TR40","l":"L9","t":"Stranded assets","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"A German coal plant built for 40 years must close after 20 because of a new law. What kind of stranded asset is this?","o":[["Not stranded at all","Feil: den mister verdi."],["Physical-risk stranded","Feil: physical ville vært f.eks. flom."],["A gain for the firm","Feil: det er et tap."],["Transition-risk stranded","Riktig: transition-risk stranded."]],"c":[3],"es":"Ny lov kuttet levetiden = transition-risk stranded.","ed":"Husk: lov = transition.","kt":"","src":"Opptak L9 ca. 10 min"},{"id":"TR41","l":"L9","t":"Relative valuation","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"An analyst values Oatly using the P/E of Alpro, which sells soy, almond and oat drinks. Why does the course question this?","o":[["Alpro does not sell dairy alternatives","Feil: Alpro er en naturlig peer."],["Peers are never used","Feil: relativ verdsettelse bruker peers."],["P/E cannot be used for food firms","Feil: problemet er valg av peer."],["Different sustainability risks","Riktig: ulik risiko."]],"c":[3],"es":"Alpro har andre bærekraftsrisikoer, så P/E kan ikke sammenlignes.","ed":"Husk: peers må ha lik eksponering.","kt":"","src":"Opptak L9 ca. 14 min"},{"id":"TR42","l":"L9","t":"ESG as a risk factor","f":"m","d":4,"p":"H","sc":"none","s":"Why does the lecturer doubt that child labour risk can be a priced risk factor, while she is less sure about climate change?","o":[["Factors only exist for bonds, not equities","Feil: faktormodeller er for aksjer."],["Child labour is a governance issue, and only E issues are priced","Feil: poenget er diversifisering."],["Child labour risk is diversifiable; climate risk may not be","Riktig: diversifiserbar vs systematisk."],["Climate change has no effect on asset prices","Feil: klima kan påvirke priser."]],"c":[2],"es":"Barnearbeid kan diversifiseres bort. Klima rammer alle og kan være systematisk.","ed":"Husk: bare systematisk risiko gir premie.","kt":"","src":"Opptak L9 ca. 59 min · Opptak L9 ca. 68 min"},{"id":"TR43","l":"L9","t":"Exclusion vs engagement","f":"m","d":3,"p":"M","sc":"none","s":"Oil and gas firms are among the biggest filers of green patents. What does this support?","o":[["Oil firms are green firms","Feil: patentene fjerner ikke utslipp."],["Exclusion may miss innovators","Riktig: exclusion mister innovatører."],["Oil firms have no transition risk","Feil: de har transition risk."],["Exclusion is the only consistent strategy","Feil: bevisene stiller spørsmål ved det."]],"c":[1],"es":"Exclusion kan miste innovatørene.","ed":"Husk: støtter engagement og washing machine.","kt":"","src":"Opptak L9 ca. 82 min"},{"id":"CX077","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"A green bond is defined by the fact that:","o":[["It carries no credit risk","Samme kredittrisiko som utstederens andre obligasjoner."],["Its proceeds fund green projects","Use of proceeds øremerket grønne prosjekter."],["Its coupon depends on KPIs","Det er en sustainability-linked bond."],["Only governments may issue it","Selskaper utsteder også green bonds."]],"c":[1],"es":"Green bond = øremerket.","ed":"Foreleser sa at sustainability bonds helt sikkert kommer på eksamen. Fire typer:\n- Green bond: grønne prosjekter.\n- Social bond: sosiale prosjekter.\n- Sustainability bond: blanding av grønt og sosialt.\n- Sustainability-linked bond: fri bruk, kupong knyttet til KPI-er.","kt":"","src":"L10 slide 9-10 · Bok s. 273 (9.4.1)","k":1},{"id":"CX078","l":"L10","t":"Social bonds","f":"m","d":2,"p":"H","sc":"none","s":"The project that fits a social bond best is:","o":[["A share buyback programme","Det er ikke et sosialt prosjekt."],["Building affordable housing","Sosialt formål = social bond."],["Building a wind farm","Det er et grønt prosjekt (green bond)."],["Any corporate purpose, with a KPI-linked coupon","Det er en sustainability-linked bond."]],"c":[1],"es":"Sosiale prosjekter = social bond.","ed":"Social bonds fungerer som green bonds (use of proceeds), men pengene går til boliger, helse, utdanning eller arbeidsplasser.","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min","k":1},{"id":"CX079","l":"L10","t":"Sustainability bonds","f":"m","d":2,"p":"H","sc":"none","s":"A bond that finances a MIX of green and social projects is a:","o":[["Sustainability-linked bond","SLB har ingen øremerking, men KPI-kupong."],["Social bond","Social bond er bare sosialt."],["Green bond","Green bond er bare grønt."],["Sustainability bond","Grønt + sosialt, øremerket."]],"c":[3],"es":"Grønt + sosialt = sustainability bond.","ed":"Sustainability bond = øremerket (use of proceeds). Sustainability-linked bond = KPI-knyttet kupong.","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min","k":1},{"id":"CX080","l":"L10","t":"Sustainability-linked bonds","f":"m","d":2,"p":"H","sc":"none","s":"If the issuer of a sustainability-linked bond misses its target, typically:","o":[["It turns into a green bond","Det skjer ikke."],["The bond must be repaid at once","Det skjer ikke."],["The coupon rises","Typisk step-up: renten øker, f.eks. 0,25 prosentpoeng."],["Nothing at all happens","Da ville det ikke vært noe insentiv."]],"c":[2],"es":"Bommer på målet → høyere kupong.","ed":"Eksempel: Enel (2019), første store SLB. Risiko: lette mål kan gi greenwashing.","kt":"","src":"L10 slide 9 · L10 slide 24 · L11 slide 25","k":1},{"id":"CX081","l":"L10","t":"Sustainability-linked instruments","f":"m","d":2,"p":"H","sc":"none","s":"The key difference between a green bond and a sustainability-linked bond is:","o":[["Short maturity vs long maturity bonds","Løpetid er ikke forskjellen."],["Government issuer vs company issuer","Begge kan utstedes av både stater og selskaper."],["Fixed coupon vs no coupon","Begge betaler kupong."],["Use of proceeds vs KPI-linked terms","Green: hva pengene brukes til. SLB: om selskapet når målene."]],"c":[3],"es":"Green = øremerket. SLB = KPI.","ed":"SLB gir insentiv til å forbedre hele selskapet. Green bond finansierer bestemte prosjekter.","kt":"","src":"L10 slide 9 · L10 slide 24","k":1},{"id":"CX082","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"Compared with a conventional bond from the same issuer, a green bond's credit risk is:","o":[["About the same","Hele selskapet står bak. Pengene er øremerket, ikke ring-fenced."],["Higher","Det er ingen grunn til høyere risiko."],["Lower","Det grønne prosjektet er ikke skilt ut fra resten."],["Zero, the project secures it","Selskapet kan fortsatt gå konkurs."]],"c":[0],"es":"Samme utsteder = samme kredittrisiko.","ed":"Earmarked ≠ ring-fenced. Går selskapet konkurs, taper du på green bonden akkurat som på en vanlig obligasjon.","kt":"","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)","k":1},{"id":"CX083","l":"L10","t":"Green bonds","f":"t","d":2,"p":"H","sc":"none","s":"Is the greenium mainly explained by green bonds being less risky?","o":[["Yes","Feil. Risikoen er den samme. Greenium skyldes at etterspørselen etter grønne obligasjoner er større enn tilbudet."],["No","Riktig. Risikoen er den samme. Greenium skyldes at etterspørselen etter grønne obligasjoner er større enn tilbudet."]],"c":[1],"es":"Nei: greenium = etterspørsel, ikke lavere risiko.","ed":"Greenium er som regel liten, noen få basispunkter.","kt":"","src":"Bok s. 275 (9.4.1) · L9 slide 14","k":1},{"id":"CX084","l":"L10","t":"Bonds vs equity","f":"m","d":2,"p":"H","sc":"none","s":"Bond investors focus mostly on downside ESG risk because:","o":[["ESG never causes defaults","ESG kan øke default risk."],["They vote at general meetings","Obligasjonseiere har normalt ikke stemmerett."],["Bonds have unlimited upside","Det er aksjer som har det."],["Their upside is capped","De får maks renter og hovedstol, men kan tape ved konkurs."]],"c":[3],"es":"Begrenset oppside → fokus på nedside.","ed":"Derfor bryr obligasjonseiere seg mest om nedsiden: ESG-risiko som kan føre til konkurs (default risk).","kt":"","src":"L10 slide 3 · Bok s. 258 (9.1.5) · Bok s. 259 (9.2)","k":1},{"id":"SB363","l":"L10","t":"Bonds vs equity","f":"m","d":2,"p":"H","sc":"none","s":"Looking at debt and equity payoffs, why do bond investors focus mainly on downside ESG risk?","o":[["Their upside is capped","Riktig: oppsiden er begrenset."],["They get all the upside","Feil: det beskriver aksjeeiere."],["Their payoff never depends on the firm's value","Feil: under D faller verdien med firmaet."],["Their votes protect them from losses","Feil: obligasjonseiere har ikke stemmer."]],"c":[0],"es":"Obligasjonseiere får maks det de er lovet. De har lite oppside, så de bryr seg mest om nedsiden.","ed":"Husk: gjeld = begrenset oppside. Aksje = ubegrenset oppside.","kt":"","src":"L10 slide 3 · Bok s. 258 (9.1.5) · Bok s. 259 (9.2)"},{"id":"SB364","l":"L10","t":"Bond valuation","f":"m","d":2,"p":"H","sc":"none","s":"Which is a driver of CORPORATE (not sovereign) bond value?","o":[["External debt","Feil: det er for statsobligasjoner."],["Loss given default","Riktig: loss given default."],["GDP per capita","Feil: det er for statsobligasjoner."],["Default history of the country","Feil: det er for statsobligasjoner."]],"c":[1],"es":"Loss given default er en driver for selskapsobligasjoner.","ed":"Husk: land = GDP, utenlandsgjeld, mislighold-historikk.","kt":"","src":"L10 slide 4 · Bok s. 256 (9.1.3.1) · Bok s. 256 (9.1.3.2)"},{"id":"SB365","l":"L10","t":"Bond valuation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Longer bonds have higher duration and so react more to interest rate changes, which is one reason the yield curve usually slopes upwards.","o":[["True","Riktig. Lange obligasjoner har kontantstrømmer langt frem, så de svinger mer med renten."],["False","Feil. Lange obligasjoner har kontantstrømmer langt frem, så de svinger mer med renten."]],"c":[0],"es":"Sant. Lange obligasjoner har høyere duration og er mer rentefølsomme.","ed":"Husk: lang løpetid = mer risiko = høyere rente.","kt":"","src":"Bok s. 254 (9.1.3) · Bok s. 256 (9.1.3)"},{"id":"SB366","l":"L10","t":"Bond valuation","f":"m","d":3,"p":"M","sc":"none","s":"Bond X has a higher yield to maturity than bond Z. What can you say about expected returns?","o":[["Bond Z must be close to default","Feil: lav rente betyr ikke mislighold."],["Both earn the risk-free rate","Feil: risikable obligasjoner har spread."],["X always has the higher expected return","Feil: høy YTM kan skyldes risiko."],["Not necessarily higher for X","Riktig: ikke nødvendigvis høyere."]],"c":[3],"es":"Høyere YTM kan bare bety høyere risiko for mislighold. Forventet avkastning er ikke nødvendigvis høyere.","ed":"Husk: lovet ≠ forventet.","kt":"","src":"Bok s. 257 (9.1.3.2)"},{"id":"SB367","l":"L10","t":"Credit ratings","f":"m","d":2,"p":"M","sc":"none","s":"How does S&P describe the role of ESG in its credit ratings?","o":[["ESG matters; the question is how","Riktig: ESG betyr noe."],["ESG is 90% of every rating","Feil: ingen fast vekt."],["ESG is excluded","Feil: ESG er med."],["ESG is used only for country ratings","Feil: også for selskaper."]],"c":[0],"es":"S&P: ESG betyr noe. Spørsmålet er hvordan.","ed":"Husk: ESG er integrert i vanlig kredittanalyse.","kt":"","src":"L10 slide 5 · L10 slide 7 · Bok s. 257 (9.1.4) · Bok s. 271 (9.3.3) · Bok s. 272 (9.3.3)"},{"id":"SB368","l":"L10","t":"Credit ratings","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Attig et al. (2013) find that rating agencies give LOWER credit ratings to firms with good social performance.","o":[["True","Feil. Firmaer med god sosial ytelse får høyere rating, ikke lavere."],["False","Riktig. Firmaer med god sosial ytelse får høyere rating, ikke lavere."]],"c":[1],"es":"Usant. God sosial ytelse gir HØYERE kredittrating.","ed":"Husk: CSR gir info om risiko.","kt":"","src":"L10 slide 6 · Bok s. 263 (9.2.2) · Bok s. 264 (9.2.2)"},{"id":"SB369","l":"L10","t":"Relevance of sustainability to bonds","f":"m","d":3,"p":"H","sc":"none","s":"Which ESG factor matters MOSTLY for sovereign (country) bonds?","o":[["Climate change and pollution","Feil: relevant for både land og selskap."],["Corruption and rule of law","Riktig: korrupsjon og rettsstat."],["Product stewardship","Feil: det er for selskaper."],["Diversity and employee relations","Feil: det er for selskaper."]],"c":[1],"es":"Korrupsjon og rule of law er viktigst for land.","ed":"Husk: land = governance.","kt":"","src":"L10 slide 8 · Bok s. 260 (Table 9.1) · Bok s. 261 (9.2)"},{"id":"SB370","l":"L10","t":"Sovereign bonds and ESG","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A country with an investment-grade rating sees more corruption, weaker rule of law and social unrest, while GDP growth is still fine. What should a bond analyst expect?","o":[["Only shareholders are affected","Feil: obligasjonseiere bærer risikoen."],["Higher credit risk","Riktig: høyere risiko."],["Lower spreads","Feil: ustabilitet øker spread."],["No effect; only GDP matters","Feil: governance betyr mye."]],"c":[1],"es":"Korrupsjon og uro gir høyere kredittrisiko.","ed":"Husk: governance driver landrisiko.","kt":"Sovereign credit risk: the risk that a government fails to pay its debt; driven by economic, fiscal and institutional (governance) factors.","src":"Bok s. 261 (9.2.1) · Bok s. 263 (9.2.1) · L10 slide 8"},{"id":"SB371","l":"L10","t":"Sovereign bonds and ESG","f":"t","d":3,"p":"L","sc":"short","s":"True or false: Country sustainability rankings give governance the largest weight, so they partly overlap with credit ratings.","o":[["True","Riktig. Governance veier mest, og kredittratinger ser også på institusjoner, så de overlapper."],["False","Feil. Governance veier mest, og kredittratinger ser også på institusjoner, så de overlapper."]],"c":[0],"es":"Sant. Governance veier tyngst og overlapper med kredittrating.","ed":"Husk: G for land = institusjoner.","kt":"Country sustainability ranking: a score of countries on environmental, social and governance indicators, used e.g. to tilt sovereign bond portfolios.","src":"Bok s. 265 (9.3.1) · Bok s. 267 (Table 9.2)"},{"id":"SB372","l":"L10","t":"Sovereign bonds and ESG","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Promised pensions and health costs that may not be affordable (e.g. in Japan and Italy) are a sovereign credit risk.","o":[["True","Riktig. Lovede pensjoner og helsekostnader kan bli for dyre, og det er en kredittrisiko."],["False","Feil. Lovede pensjoner og helsekostnader kan bli for dyre, og det er en kredittrisiko."]],"c":[0],"es":"Sant. Store pensjons- og helsekostnader er en risiko for land.","ed":"Husk: aldrende befolkning = kredittrisiko.","kt":"","src":"Bok s. 261 (9.2) · Bok s. 267 (Table 9.2)"},{"id":"SB373","l":"L10","t":"Corporate bonds and ESG","f":"m","d":4,"p":"M","sc":"none","s":"The link between environmental performance and bond yields gets weaker for higher-quality bonds (Schneider, 2011). Why?","o":[["They matter most near default","Riktig: viktigst nær default."],["Those investors do not read reports","Feil: forklaringen er payoff-strukturen."],["Good issuers have no liabilities","Feil: de kan ha forpliktelser."],["Safe bonds are exempt from environmental rules","Feil: regler gjelder alle."]],"c":[0],"es":"Miljøforpliktelser betyr mest når firmaet er nær mislighold.","ed":"Husk: trygg obligasjon = lite nedside.","kt":"","src":"Bok s. 264 (9.2.2) · L10 slide 3"},{"id":"SB374","l":"L10","t":"Corporate bonds and ESG","f":"m","d":3,"p":"M","sc":"none","s":"How can ESG lower a firm's cost of debt?","o":[["Environmental claims never come first","Feil: oppryddingskrav kan komme først."],["Bondholders get all the upside","Feil: de bryr seg mest om nedsiden."],["Takeover defences protect bondholders","Feil: takeover-forsvar øker lånekostnaden."],["Better governance protects lenders","Riktig: bedre governance."]],"c":[3],"es":"Bedre governance beskytter långiverne og senker lånekostnaden.","ed":"Husk: governance = mindre risiko for kreditor.","kt":"Cost of debt: the interest rate a company pays on borrowing, which rises with default risk and loss given default.","src":"Bok s. 264 (9.2.2) · Bok s. 265 (9.2.2) · L10 slide 3"},{"id":"SB375","l":"L10","t":"Sustainability-linked bonds","f":"m","d":3,"p":"H","sc":"short","s":"In 2019 Enel issued a bond for general purposes, but the coupon rises by 0.25% if it misses its renewable energy target. How does it differ from a green bond?","o":[["It is ring-fenced","Feil: ingen av dem er ring-fenced."],["The money must go to renewable projects","Feil: det beskriver green bond."],["The coupon depends on targets","Riktig: kupongen avhenger av mål."],["It has no link to sustainability","Feil: kupongen er koblet til et mål."]],"c":[2],"es":"Dette er en sustainability-linked bond: kupongen avhenger av mål, ikke bruken av pengene.","ed":"Husk: green bond = bruk av penger. SLB = mål styrer kupong.","kt":"Sustainability-linked bond (SLB): a general-purpose bond whose financial terms (usually the coupon) change depending on whether the issuer meets sustainability performance targets.","src":"L10 slide 9 · L10 slide 24 · L11 slide 25"},{"id":"SB376","l":"L10","t":"ESG integration in bonds","f":"m","d":3,"p":"M","sc":"none","s":"Why is engagement harder for bond investors?","o":[["Firms are not allowed to talk to bondholders","Feil: ingen slikt forbud."],["There is nothing to discuss","Feil: det er mye å diskutere."],["They are not owners","Riktig: de er ikke eiere."],["They have majority votes","Feil: de har ikke stemmer."]],"c":[2],"es":"Obligasjonseiere er ikke eiere, så de har mindre makt.","ed":"Husk: kreditor ≠ eier.","kt":"","src":"Bok s. 270 (Box 9.1) · Bok s. 271 (Box 9.1) · L10 slide 12"},{"id":"SB377","l":"L10","t":"Relevance of bonds to sustainability","f":"m","d":3,"p":"H","sc":"none","s":"Bondholders cannot vote. Which lever do they still have?","o":[["Bonds cannot be shorted","Feil: shorting er et verktøy."],["Bond markets are small","Feil: obligasjonsmarkedet er stort."],["Firms must refinance often","Riktig: hyppig refinansiering."],["They can replace the board at any time","Feil: de har ikke stemmer."]],"c":[2],"es":"Firmaer må refinansiere ofte, så obligasjonseiere får innflytelse.","ed":"Husk: refinansiering = makt.","kt":"","src":"L10 slide 12 · Bok s. 253 (9.1)"},{"id":"SB378","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the four core parts of the Green Bond Principles?","o":[["A lower guaranteed coupon than normal bonds","Feil: pris er ikke med."],["An AAA rating","Feil: AAA er ikke krav."],["Reporting on use of proceeds","Riktig: rapportering."],["ECB approval","Feil: ikke med."]],"c":[2],"es":"Rapportering om bruken av pengene er en del av Green Bond Principles.","ed":"Husk: use of proceeds, evaluation, management, reporting.","kt":"","src":"L10 slide 9-10 · Bok s. 273 (9.4.1)"},{"id":"SB379","l":"L10","t":"Green bonds","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Green bonds are ring-fenced, so repayment depends only on the green project's cash flows, not on the issuer's overall credit.","o":[["True","Feil. Green bonds er bare øremerket. Tilbakebetalingen avhenger av hele utstederen."],["False","Riktig. Green bonds er bare øremerket. Tilbakebetalingen avhenger av hele utstederen."]],"c":[1],"es":"Usant. Green bonds er øremerket, men ikke ring-fenced. Risikoen er utstederens.","ed":"Husk: earmarked ≠ ring-fenced.","kt":"","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)"},{"id":"SB380","l":"L10","t":"Green bonds","f":"m","d":3,"p":"H","sc":"none","s":"Green bonds yield slightly less than similar normal bonds from the same issuer. Why?","o":[["They are less liquid","Feil: lav likviditet ville gitt høyere rente."],["Their issuers never default","Feil: samme utsteder, samme risiko."],["Demand is higher than supply","Riktig: høy etterspørsel."],["They are ring-fenced from the issuer","Feil: de er ikke ring-fenced."]],"c":[2],"es":"Mer etterspørsel enn tilbud presser renten ned.","ed":"Husk: greenium = betaling for merkelappen.","kt":"Greenium: the yield discount on a green bond versus a comparable conventional bond.","src":"Bok s. 275 (9.4.1) · L9 slide 14"},{"id":"SB381","l":"L10","t":"Green bonds","f":"m","d":3,"p":"H","sc":"none","s":"What does Flammer (2021) find around green bond issues?","o":[["Prices rise; the environment improves","Riktig: positiv effekt."],["Share prices fall","Feil: kursen stiger."],["Emissions rise","Feil: utslipp faller."],["They mainly attract short-term hedge funds","Feil: langsiktige investorer øker."]],"c":[0],"es":"Aksjekursen stiger og miljøet blir bedre.","ed":"Husk: signalling.","kt":"","src":"L10 slide 13"},{"id":"SB382","l":"L10","t":"Green bonds","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: If a green bond and a normal bond from the same issuer have the same terms, the default risk is the same, so a lower green yield is a price for the label.","o":[["True","Riktig. Risikoen er lik, så rentegapet er prisen investorer betaler for merkelappen."],["False","Feil. Risikoen er lik, så rentegapet er prisen investorer betaler for merkelappen."]],"c":[0],"es":"Sant. Samme risiko, så lavere rente er prisen for merkelappen.","ed":"Husk: greenium.","kt":"Greenium: the lower yield (higher price) investors accept on a green bond versus a comparable conventional bond.","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)"},{"id":"SB383","l":"L10","t":"Green bonds","f":"m","d":3,"p":"M","sc":"short","s":"Poland gets about 80% of its energy from coal but issues a green bond. Which challenge does this show?","o":[["Coal countries cannot issue bonds","Feil: ingen slikt forbud."],["Judging the issuer's credibility","Riktig: troverdighet."],["Countries cannot issue green bonds","Feil: land kan utstede."],["Country green bonds are always ring-fenced","Feil: de er øremerket."]],"c":[1],"es":"Det er vanskelig å vurdere om utstederen er troverdig.","ed":"Husk: grønn obligasjon fra et kull-land.","kt":"","src":"Bok s. 276 (9.4.2) · Bok s. 273 (9.4.1)"},{"id":"SB384","l":"L10","t":"Social bonds","f":"m","d":3,"p":"M","sc":"none","s":"How does a social impact bond (SIB) differ from a social bond?","o":[["A SIB is ring-fenced","Feil: ikke forskjellen."],["A SIB pays only if goals are met","Riktig: betaler ved måloppnåelse."],["A social bond is a donation, not a bond","Feil: definisjonene er snudd."],["There is no difference","Feil: de er forskjellige."]],"c":[1],"es":"SIB betaler bare hvis målene nås. Social bond er en vanlig obligasjon.","ed":"Husk: SIB er egentlig ikke en obligasjon.","kt":"","src":"Bok s. 276 (9.4.3) · Bok s. 277 (9.4.3)"},{"id":"SB385","l":"L10","t":"Sustainability-linked instruments","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Like a green bond, a sustainability-linked bond must use its money only for green or social projects.","o":[["True","Feil. SLB-penger kan brukes fritt. Det er kupongen som er koblet til mål."],["False","Riktig. SLB-penger kan brukes fritt. Det er kupongen som er koblet til mål."]],"c":[1],"es":"Usant. SLB kan brukes til hva som helst. Kupongen avhenger av mål.","ed":"Husk: SLB = general purpose.","kt":"","src":"L10 slide 9 · L10 slide 24"},{"id":"SB386","l":"L10","t":"Non-equity asset classes","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A real estate fund owns offices with energy label F. The city will ban renting out buildings below C from 2030. What should the fund do?","o":[["Raise rents","Feil: leietakerne vil unngå byggene."],["Sell at any price now","Feil: oppgradering kan gi mer verdi."],["Plan upgrades","Riktig: planlegg oppgraderinger."],["Wait until 2030 and see","Feil: venting øker risikoen."]],"c":[2],"es":"Planlegg oppgraderinger før forbudet.","ed":"Husk: unngå stranded buildings.","kt":"Energy Performance Certificate (EPC): a rating of a building's energy efficiency; minimum standards can make low-rated buildings unlettable.","src":"L10 slide 18-19 · L10 slide 14"},{"id":"SB387","l":"L10","t":"Real estate","f":"m","d":3,"p":"M","sc":"none","s":"In which stage of the real estate cycle do you manage ESG for the building, use property managers and engage with tenants?","o":[["Investment decision","Feil: det er investeringskomiteen."],["Deal sourcing","Feil: det er screening."],["Sale","Feil: det er ved salg."],["Ownership","Riktig: ownership."]],"c":[3],"es":"Ownership-fasen: drift, eiendomsforvaltere og leietakere.","ed":"Husk: deal sourcing → investment → ownership → sale.","kt":"","src":"L10 slide 18-19"},{"id":"SB388","l":"L10","t":"Real estate","f":"t","d":3,"p":"M","sc":"none","s":"True or false: \"Split incentives\" in real estate: owners pay for energy upgrades but tenants get the lower bills, so too little is invested.","o":[["True","Riktig. Eieren betaler for oppgraderingen, mens leietakeren får gevinsten."],["False","Feil. Eieren betaler for oppgraderingen, mens leietakeren får gevinsten."]],"c":[0],"es":"Sant. Eier betaler, leietaker sparer, så det investeres for lite.","ed":"Husk: green lease kan løse det.","kt":"","src":"L10 slide 19-20 · L10 slide 17"},{"id":"SB389","l":"L10","t":"Credit ratings and ESG","f":"m","d":3,"p":"M","sc":"short","s":"After a short-seller report in 2023, Adani's bond prices fell sharply, and Adani cut investment and bought back bonds. Which bond market lever is this?","o":[["Green bond rules","Feil: presset kom fra prisen."],["Issuing new shares","Feil: dette gjelder obligasjoner."],["Bondholders' votes at the AGM","Feil: obligasjonseiere stemmer ikke."],["Short selling and repricing","Riktig: shorting og reprising."]],"c":[3],"es":"Short selling og prisfall presset Adani.","ed":"Husk: lavere pris = høyere lånekostnad.","kt":"Refinancing need: because bonds mature, issuers must return to investors, who can demand higher spreads or refuse to roll over debt.","src":"L10 slide 12 · Bok s. 265 (9.2.2)"},{"id":"SB390","l":"L10","t":"Derivatives","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"An EU aluminium producer fears rising carbon prices will squeeze margins. Which instrument hedges this best?","o":[["Buying carbon allowance futures","Riktig: kvote-futures."],["Buying cat bonds","Feil: cat bonds gjelder naturkatastrofer."],["Buying green power certificates","Feil: sertifikater gjelder ikke ETS."],["Issuing a social bond","Feil: social bonds sikrer ikke."]],"c":[0],"es":"Kjøp futures på karbonkvoter for å låse prisen.","ed":"Husk: hedge = lås kostnaden.","kt":"Emission allowance futures: contracts to buy EU ETS allowances at a fixed price in the future, hedging carbon cost risk.","src":"L10 slide 23"},{"id":"SB391","l":"L10","t":"Derivatives","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"SBM Offshore's 2019 interest rate swap with ING was linked to ESG. How?","o":[["The amount doubled if emissions rose","Feil: spreaden justeres, ikke beløpet."],["The bank gave money to charity","Feil: det er Siemens Gamesa."],["A rate linked to its ESG score","Riktig: rente koblet til ESG."],["The swap was cancelled if targets were missed","Feil: det gir straffespread."]],"c":[2],"es":"Renten i swappen var koblet til ESG-scoren.","ed":"Husk: ESG-linked derivatives.","kt":"","src":"L10 slide 24"},{"id":"SB392","l":"L10","t":"Bonds and agency costs","f":"m","d":3,"p":"M","sc":"none","s":"What is the debt overhang (underinvestment) problem (Myers, 1977)?","o":[["Firms without debt cannot raise equity","Feil: ikke relevant."],["Bondholders block investments","Feil: kreditorer har ikke stemmer."],["Too many safe projects","Feil: problemet er for lite."],["Owners skip good projects","Riktig: gode prosjekter droppes."]],"c":[3],"es":"Eierne dropper gode prosjekter fordi gevinsten går til kreditorene.","ed":"Husk: debt overhang = for lite investering.","kt":"","src":"Bok s. 258 (9.1.5) · Bok s. 259 (9.1.5)"},{"id":"SB393","l":"L10","t":"Commodities and supply chains","f":"t","d":3,"p":"L","sc":"short","s":"True or false: The EU Deforestation Regulation (postponed) will require firms selling cocoa, coffee, palm oil or soy in the EU to prove it is deforestation-free, so traceability matters for chocolate makers.","o":[["True","Riktig. Forordningen krever sporbarhet, så sjokoladeprodusenter må vise opprinnelsen."],["False","Feil. Forordningen krever sporbarhet, så sjokoladeprodusenter må vise opprinnelsen."]],"c":[0],"es":"Sant. Firmaene må vise at råvarene ikke kommer fra avskoging.","ed":"Husk: traceability blir et krav.","kt":"Supply-chain traceability: the ability to track a product's origin back to the farm or plot, needed to prove it is deforestation-free.","src":"L10 slide 22 · L3 slide 17"},{"id":"SB394","l":"L10","t":"Bonds synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A BBB chemicals firm with weak environmental management issues a normal and a green bond with the same terms; the green bond yields 8 bp less. An investor worries about clean-up costs. What is the best reasoning?","o":[["Same risk; check clean-up costs","Riktig: lik risiko, sjekk miljøkostnad."],["Ignore the environment","Feil: miljøkostnader kan gi mislighold."],["Buy the green bond; it is safer","Feil: green bond er ikke tryggere."],["Buy the normal bond; green bonds default more","Feil: risikoen er lik."]],"c":[0],"es":"Samme risiko på begge. Sjekk oppryddingskostnader.","ed":"Husk: ikke ring-fenced, ESG påvirker kredittrisiko.","kt":"","src":"Bok s. 264 (9.2.2) · Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1) · L10 slide 3 · L10 slide 13"},{"id":"SB395","l":"L10","t":"Bonds basics","f":"m","d":1,"p":"L","sc":"none","s":"Which statement about bond types is correct?","o":[["Supranational bonds are issued by cities","Feil: supranational = Verdensbanken, EIB."],["Unsecured bonds are repaid first","Feil: secured kommer først."],["Secured bonds have collateral","Riktig: secured betyr at det er pant."],["Bank loans trade on exchanges","Feil: banklån er private."]],"c":[2],"es":"Secured bonds har sikkerhet (pant).","ed":"Husk: secured = pant.","kt":"","src":"Bok s. 254 (9.1.2) · Bok s. 254 (Figure 9.1) · Bok s. 255 (9.1.2)"},{"id":"SB396","l":"L10","t":"Corporate bonds and ESG","f":"t","d":3,"p":"M","sc":"short","s":"True or false: Since bondholders do not share the upside, a sudden ESG scandal like Volkswagen's dieselgate does not matter to them unless the firm defaults at once.","o":[["True","Feil. Skandaler øker spreaden og senker prisen, selv uten mislighold."],["False","Riktig. Skandaler øker spreaden og senker prisen, selv uten mislighold."]],"c":[1],"es":"Usant. Skandaler øker risikoen og senker obligasjonsprisen.","ed":"Husk: spread øker uten mislighold.","kt":"CDS spread: the price of insuring against a company's default; it rises when perceived credit risk rises.","src":"Bok s. 259 (9.2) · L10 slide 3"},{"id":"TR44","l":"L10","t":"Debt and equity payoffs","f":"m","d":3,"p":"H","sc":"none","s":"With debt D outstanding, the payoff to EQUITY holders looks like:","o":[["A risk-free bond","Feil: egenkapital er mest risikabelt."],["A forward contract","Feil: forward har symmetrisk payoff."],["A put option","Feil: put er knyttet til gjeld."],["A call option","Riktig: call option."]],"c":[3],"es":"Eierne får max(V − D, 0) = en call option.","ed":"Husk: equity = call, debt = risikofri − put.","kt":"Debt as an option: debt payoff = min(V, D), i.e. a risk-free payment of D minus a put option on the firm's assets.","src":"Opptak L10 ca. 10 min · Opptak L10 ca. 13 min"},{"id":"TR45","l":"L10","t":"Bond risks","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A utility is downgraded after an ESG scandal but will still pay all coupons. Which bondholder loses most?","o":[["Shareholders only","Feil: obligasjonene reprises."],["Nobody","Feil: prisen må falle."],["One who sells early","Riktig: den som selger tidlig."],["One who holds to maturity","Feil: får alt tilbake."]],"c":[2],"es":"Den som selger før forfall tar tapet.","ed":"Husk: hold til forfall = ingen tap hvis alt betales.","kt":"","src":"Opptak L10 ca. 19 min"},{"id":"TR46","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A shipping firm's bond can fund anything, but the coupon rises by 0.25% if it fails to cut emissions by 30% by 2030. This is a:","o":[["Catastrophe bond","Feil: cat bonds er forsikring."],["Social bond","Feil: social bond er øremerket."],["Green bond","Feil: green bond er øremerket."],["Sustainability-linked","Riktig: sustainability-linked."]],"c":[3],"es":"Fritt bruk, men kupongen avhenger av mål = sustainability-linked.","ed":"Husk: SLB = KPI-mål.","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min"},{"id":"TR47","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"M","sc":"none","s":"Why is there room for greenwashing in sustainability-linked bonds, and what limits it?","o":[["Green projects are rarely checked","Feil: SLB er ikke øremerket."],["Firms set their own targets","Riktig: egne mål."],["Regulators set targets that are too strict","Feil: utsteder setter målene."],["SLBs pay no coupon","Feil: SLB betaler kupong."]],"c":[1],"es":"Firmaene setter egne mål. Markedet og sertifisering begrenser det.","ed":"Husk: svake mål = greenwashing.","kt":"","src":"Opptak L10 ca. 35 min"},{"id":"TR48","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"M","sc":"none","s":"After issuing green bonds, firms improve environmentally and attract more long-term investors. Which mechanism does this support?","o":[["Greenwashing","Feil: forbedring taler mot greenwashing."],["Signalling","Riktig: signalling."],["Short-selling pressure","Feil: en annen mekanisme."],["Separate cash reserves","Feil: funnet handler om miljø."]],"c":[1],"es":"Green bonds fungerer som et troverdig signal.","ed":"Husk: signalling.","kt":"","src":"Opptak L10 ca. 39 min · Opptak L10 ca. 41 min"},{"id":"TR49","l":"L10","t":"Blended finance","f":"m","d":3,"p":"M","sc":"none","s":"Private investors often avoid green infrastructure in developing countries. How does blended finance help?","o":[["Investors accept zero return","Feil: de får fortsatt avkastning."],["Public money takes some risk","Riktig: staten tar risiko."],["It only works in rich countries","Feil: brukes i utviklingsland."],["It bans private investors","Feil: målet er å tiltrekke private."]],"c":[1],"es":"Offentlige penger tar noe av risikoen.","ed":"Husk: blended = offentlig + privat.","kt":"","src":"Opptak L10 ca. 57 min"},{"id":"CX085","l":"L11","t":"Information asymmetry in banking","f":"m","d":2,"p":"H","sc":"short","s":"When a bank raises its rate for everyone because it cannot tell good from bad borrowers, the borrowers most likely to drop out are:","o":[["Only government borrowers","Det handler om bedriftslån."],["The riskiest borrowers","De har mest å tjene på å bli."],["The safest borrowers","De synes renten er for høy for deres lave risiko."],["None of them","Noen vil reagere på høyere rente."]],"c":[2],"es":"Adverse selection: de gode forsvinner, de dårlige blir.","ed":"Foreleser har sagt at adverse selection kommer på eksamen. Bankens løsning er screening før lånet gis.","kt":"","src":"Opptak L11 ca. 8 min · Opptak L5 ca. 17 min","k":1},{"id":"CX086","l":"L11","t":"Adverse selection","f":"t","d":2,"p":"H","sc":"none","s":"Is moral hazard a problem that arises before the contract is signed?","o":[["Yes","Feil. Moral hazard skjer etter avtalen. Adverse selection skjer før."],["No","Riktig. Moral hazard skjer etter avtalen. Adverse selection skjer før."]],"c":[1],"es":"Nei: moral hazard = etter avtalen.","ed":"Adverse selection: skjult informasjon før avtalen ('hvem er du?'). Moral hazard: skjult handling etter avtalen ('hva gjør du nå?').","kt":"","src":"L5 slide 10-13 · L11 slide 7","k":1},{"id":"CX087","l":"L11","t":"Risk-based lending
