 threaten to sell a company's shares if it dislikes its climate strategy.","o":[["True","Incorrect. An index fund must hold all index firms, so it cannot credibly threaten to sell."],["False","Correct. An index fund must hold all index firms, so it cannot credibly threaten to sell."]],"c":[1],"es":"Usant. Et indeksfond må eie alle i indeksen, så det kan ikke true med salg.","ed":"Et indeksfond må eie alle selskapene i indeksen. Det kan derfor ikke true med å selge, fordi alle vet at det ikke kan. Verktøyene det har, er stemmegivning og dialog (voice). Husk: passiv = voice, ikke exit.","kt":"Exit (\"Wall Street walk\"): selling shares to signal dissatisfaction or pressure management.","src":"L8 slide 71 · Bok s. 194 (7.3.4)"},{"id":"SB301","l":"L8","t":"Investment chains","f":"m","d":3,"p":"H","sc":"none","s":"Why do long investment chains increase short-termism?","o":[["Managers must sell within 12 months","Incorrect: there is no such rule."],["Savers want quarterly payouts","Incorrect: savers have long horizons."],["Each link is judged short-term","Correct: each link is judged short-term, so the horizon shrinks."],["They always include high-speed traders","Incorrect: the issue is delegation."]],"c":[2],"es":"Hvert ledd blir vurdert kortsiktig, så horisonten krymper.","ed":"Mellom spareren og firmaet står mange ledd: pensjonsfond, konsulenter, forvaltere. Hvert ledd vurderes ofte kortsiktig av leddet over. Da krymper horisonten for hvert ledd, selv om spareren tenker langsiktig (pensjon). Husk: lang kjede = kort horisont.","kt":"","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 186 (7.1.4) · Bok s. 187 (7.1.4)"},{"id":"SB302","l":"L8","t":"ESG ratings limitations","f":"m","d":3,"p":"H","sc":"none","s":"A design weakness of ESG ratings is that:","o":[["the big agencies always agree","Incorrect: the big agencies often disagree."],["even coal firms can score well","Correct: even coal firms can score well."],["they are far too expensive","Incorrect: the issue is too few resources, not too much cost."],["they rely too much on site visits","Incorrect: they rely on reported data."]],"c":[1],"es":"Selv kullselskaper kan få god rating.","ed":"ESG-ratinger har designsvakheter: de vurderer ofte relativt til bransjen og legger vekt på policyer, så selv kullselskaper kan få god score. Byråene er også ofte uenige, og analytikerne har mange selskaper hver. Husk: rating ≠ bærekraftig.","kt":"","src":"L8 slide 73 · Bok s. 187 (7.2) · Bok s. 187 (7.2.1) · Bok s. 188 (7.2.1)"},{"id":"SB303","l":"L8","t":"ESG ratings limitations","f":"m","d":3,"p":"M","sc":"none","s":"How do investors' uses of ESG ratings fit the SF stages?","o":[["Positive screening is SF 2.0","Incorrect: it is labelled SF 1.5."],["All rating-based strategies are SF 3.0","Incorrect: ratings do not capture impact."],["Exclusion 1.0, integration 2.0","Correct: exclusion is SF 1.0 and integration is SF 2.0."],["Negative screening is SF 3.0","Incorrect: exclusion is SF 1.0."]],"c":[2],"es":"Exclusion = SF 1.0, integration = SF 2.0.","ed":"Læreboka kobler bruk av ESG-ratinger til SF-trappen: exclusion basert på ratinger er SF 1.0, positive screening er SF 1.5 (fordi ratingene er unøyaktige), og full integrering i analysen er SF 2.0. Ratinger alene når ikke SF 3.0. Husk: 1.0, 1.5, 2.0.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Bok s. 189 (7.2.2) · L1 slide 30"},{"id":"SB304","l":"L8","t":"Active investment approach","f":"m","d":4,"p":"H","sc":"none","s":"Why is analysing a firm's transition readiness nearly impossible for passive and quant funds?","o":[["ESG ratings already capture it","Incorrect: ratings capture it poorly."],["Quant always wins","Incorrect: quant is a complement."],["It needs firm-specific judgement","Correct: it needs judgement about each firm."],["They are not allowed to use ESG data","Incorrect: there is no ban."]],"c":[2],"es":"Det krever skjønn om hvert enkelt firma.","ed":"Å vurdere om et firma er klart for overgangen (transition readiness) krever innsikt i strategi, teknologi og ledelse. Det kan bare gjøres med fundamental analyse av hvert firma. Passive fond og quant-fond bruker data og regler, ikke slikt skjønn. Husk: transition readiness krever fundamental analyse.","kt":"","src":"Bok s. 190 (7.3.2) · Bok s. 191 (Figure 7.2) · Bok s. 191 (7.3.2)"},{"id":"SB305","l":"L8","t":"Active investment approach","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A portfolio needs at least 1,000 stocks to remove most firm-specific risk, so concentrated portfolios are always poorly diversified.","o":[["True","Incorrect. Statman shows 50 to 100 stocks remove most firm-specific risk."],["False","Correct. Statman shows 50 to 100 stocks remove most firm-specific risk."]],"c":[1],"es":"Usant. 50–100 aksjer fjerner det meste av firmarisikoen.","ed":"Statman viser at 50–100 aksjer fjerner det meste av den firmaspesifikke risikoen. Gevinsten av flere aksjer etter det er liten. Derfor kan fokuserte porteføljer være godt nok diversifisert. Husk: 50–100 aksjer er nok.","kt":"","src":"Bok s. 193 (7.3.3) · Bok s. 193 (Figure 7.4) · Bok s. 194 (7.3.3)"},{"id":"SB306","l":"L8","t":"Active investment approach","f":"m","d":2,"p":"M","sc":"none","s":"How does too much diversification create a free-rider problem?","o":[["They free-ride on the CAPM","Incorrect: the free-rider problem is about monitoring."],["Tiny stakes mean nobody monitors","Correct: tiny stakes mean nobody bothers to monitor."],["They pay no tax on dividends","Incorrect: tax is irrelevant."],["Index funds can borrow more cheaply","Incorrect: borrowing costs are irrelevant."]],"c":[1],"es":"Små eierandeler gjør at ingen gidder å overvåke.","ed":"Når en investor eier en bitteliten andel i tusenvis av selskaper, lønner det seg ikke å bruke tid på å overvåke hvert enkelt. Alle håper at noen andre gjør jobben (free riding). Resultatet er at ingen overvåker ledelsen. Husk: små andeler = ingen overvåker.\n\nForkortelser: CAPM = Capital Asset Pricing Model.","kt":"","src":"Bok s. 194 (7.3.3) · Bok s. 205 (Box 7.3) · L5 slide 9"},{"id":"SB307","l":"L8","t":"Alternative performance measures","f":"m","d":3,"p":"M","sc":"none","s":"Instead of one market benchmark, what does the textbook suggest for judging a fund?","o":[["The firms' earnings per share","Incorrect: EPS is the traditional measure."],["Several sector indices","Correct: use several sector indices."],["The number of trades","Incorrect: trading activity is not a performance measure."],["Daily tracking error","Incorrect: that is the traditional approach being criticised."]],"c":[1],"es":"Bruk flere sektorindekser i stedet for én.","ed":"Læreboka foreslår å måle fond mot flere sektorindekser i stedet for én bred markedsindeks. Da kan forvalteren ha fokuserte posisjoner uten å straffes for å avvike fra markedet, og sammenligningen blir mer rettferdig. Husk: bedre benchmark.\n\nForkortelser: EPS = Earnings Per Share (resultat per aksje).","kt":"","src":"Bok s. 195 (7.3.5) · Bok s. 196 (Table 7.3) · Bok s. 196 (Table 7.4)"},{"id":"SB308","l":"L8","t":"Alternative performance measures","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"A mining firm sells its underground mines in a developing country, and its injury rate (LTIFR) falls sharply. What does this show?","o":[["Safety at the other mines clearly improved","Incorrect: the improvement came from the sale."],["It may reflect selling risky mines","Correct: the drop may come from selling risky mines."],["Safety KPIs do not matter","Incorrect: safety is very material in mining."],["The number is fully reliable","Incorrect: KPIs are hard to compare."]],"c":[1],"es":"Tallet falt fordi de solgte risikable gruver, ikke fordi sikkerheten ble bedre.","ed":"LTIFR (skaderate) falt fordi firmaet solgte de farligste gruvene, ikke fordi sikkerheten ble bedre i de gjenværende. KPI-er kan endres av porteføljeendringer. Husk: sjekk alltid hvorfor en KPI endres.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); LTIFR = Lost Time Injury Frequency Rate (skadefrekvens).","kt":"","src":"Bok s. 197 (7.3.6.1) · Bok s. 198 (7.3.6.1)"},{"id":"SB309","l":"L8","t":"Alternative performance measures","f":"m","d":3,"p":"M","sc":"none","s":"KPMG's True Value method has three steps. Which order is correct?","o":[["SDG target → offsets → report","Incorrect: these are not the True Value steps."],["True earnings → at risk → business cases","Correct: true earnings, then earnings at risk, then business cases."],["Beta → tracking error → information ratio","Incorrect: these are traditional performance measures."],["Exclude → rank → invest","Incorrect: this describes screening."]],"c":[1],"es":"True earnings → earnings at risk → business cases.","ed":"KPMG True Value har tre steg: 1) true earnings, altså resultat justert for externalities, 2) earnings at risk, hvor mye av resultatet som kan forsvinne når externalities internaliseres, 3) business cases for å forbedre seg. Husk: true → at risk → business case.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger).","kt":"","src":"Bok s. 199 (Box 7.2) · Bok s. 198 (7.3.6.2) · L3 slide 17"},{"id":"SB310","l":"L8","t":"SDG tagging","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"A fund tags its holdings: a hospital (+SDG 3), a coal miner (−SDG 13) and a bank (neutral). What can it learn?","o":[["Nothing","Incorrect: it maps companies to SDGs."],["Each firm's exact impact","Incorrect: tagging is not exact measurement."],["A rough SDG picture","Correct: it gives a rough SDG picture."],["The firms' credit ratings","Incorrect: it is about SDGs, not credit risk."]],"c":[2],"es":"Tagging gir et grovt SDG-bilde.","ed":"SDG-tagging kobler hvert selskap til SDG-er det hjelper (+) eller skader (−). Det er grovt og kvalitativt, men gir et bilde av porteføljens profil selv med lite data. Husk: tagging = grovt kart.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger).","kt":"SDG tagging: marking holdings as positive, neutral or negative for each SDG to estimate a portfolio's exposure.","src":"Bok s. 200 (7.3.6.3)","e":1},{"id":"SB311","l":"L8","t":"Conditions for LTVC","f":"m","d":2,"p":"H","sc":"none","s":"Which is a condition for investing for long-term value creation (De Jong et al., 2017)?","o":[["Keep the investment chain short","Correct: keep the investment chain short."],["Leave engagement to proxy advisors","Incorrect: engagement should be linked to the analysis, not outsourced."],["Stay close to the market index","Incorrect: staying close to the index prevents LTVC."],["Judge managers quarterly","Incorrect: managers should be judged over longer periods."]],"c":[0],"es":"Hold investeringskjeden kort.","ed":"De Jong et al. lister betingelser for investering i long-term value creation: lang horisont, fokusert portefølje, engagement koblet til analyse, måling av reell verdiskaping og en kort investeringskjede. Husk: kort kjede, lang horisont.\n\nForkortelser: LTVC = Long-Term Value Creation (langsiktig verdiskaping).","kt":"","src":"Bok s. 202 (7.4) · Bok s. 202 (Figure 7.6) · Bok s. 204 (7.4.5) · Bok s. 204 (7.4.6) · L8 slide 74"},{"id":"SB312","l":"L8","t":"Conditions for LTVC","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"Swedish pension fund Alecta holds about 104 stocks for 15-20 years, does its own analysis and engagement, and has costs of 0.09%. What does this show?","o":[["Long-term investors must outsource analysis","Incorrect: Alecta does its own analysis."],["104 stocks is not diversified enough","Incorrect: 50–100 stocks remove most firm risk."],["Focused investing can be cheap","Correct: focused investing can be cheap."],["Active management is always more expensive","Incorrect: Alecta is cheap."]],"c":[2],"es":"Fokusert investering kan være billig.","ed":"Alecta eier ca. 104 aksjer i 15–20 år, gjør egen analyse og engagement, og har kostnader på bare 0,09 %. Ved å kutte eksterne forvaltere og konsulenter er fokusert, langsiktig investering billig. Husk: Alecta = fokusert, lang, billig.","kt":"","src":"Bok s. 205 (Box 7.3) · Bok s. 204 (7.4.6)"},{"id":"SB313","l":"L8","t":"Ideal investment chain","f":"m","d":4,"p":"M","sc":"none","s":"In the textbook's \"often observed\" investment chain, a typical company:","o":[["maximises EPS and has short-term pay","Correct: the typical firm maximises EPS and has short-term pay."],["hires many asset managers","Incorrect: that describes a typical asset owner."],["maximises integrated value over decades","Incorrect: that is the \"ideally\" column."],["holds many small stakes","Incorrect: that describes a typical asset manager."]],"c":[0],"es":"Typisk firma maksimerer EPS og har kortsiktig lønn.","ed":"Læreboka sammenligner hvordan kjeden ofte er og hvordan den ideelt bør være. Ofte: firmaet maksimerer EPS og har kortsiktige incentiver, forvaltere holder mange små posisjoner, eiere bruker mange forvaltere. Ideelt: firmaet maksimerer integrated value over lang tid. Husk: \"often\" = kortsiktig.\n\nForkortelser: EPS = Earnings Per Share (resultat per aksje).","kt":"","src":"Bok s. 200 (7.3.7) · Bok s. 201 (Figure 7.5)"},{"id":"SB314","l":"L8","t":"UN PRI","f":"m","d":2,"p":"M","sc":"none","s":"Which is one of the six UN Principles for Responsible Investment (PRI)?","o":[["Guarantee returns above the market","Incorrect: PRI does not promise returns."],["Invest only in Article 9 funds","Incorrect: SFDR categories are not part of PRI."],["Be active owners and use ESG","Correct: be active owners and use ESG."],["Sell all fossil fuel firms","Incorrect: PRI does not require blanket divestment."]],"c":[2],"es":"PRI: vær aktive eiere og bruk ESG.","ed":"UN PRI har seks prinsipper. De to første: 1) inkludere ESG i investeringsanalysen, 2) være aktive eiere og bruke ESG i eierskapet. De andre handler om rapportering, samarbeid og å fremme prinsippene. Husk: PRI = ESG i analyse og eierskap.\n\nForkortelser: SFDR = Sustainable Finance Disclosure Regulation (EU-regler som deler fond i Article 6/8/9); PRI = UN Principles for Responsible Investment.","kt":"","src":"L8 slide 75-76"},{"id":"SB315","l":"L8","t":"Integrated LTVC investing","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A pension fund tracks an ESG index closely, judges its manager quarterly and follows proxy advisors' votes. Which change moves it MOST towards long-term value creation?","o":[["A focused, engaged mandate","Correct: a focused, engaged mandate moves it most toward LTVC."],["A rating provider that gives higher scores","Incorrect: a different rating provider changes little."],["A tighter tracking error limit","Incorrect: a tighter limit makes it even more passive."],["More external managers","Incorrect: more managers lengthen the chain."]],"c":[0],"es":"Et fokusert, engasjert mandat flytter mest mot LTVC.","ed":"Fondet har alle tegn på kortsiktighet: følger en indeks tett, vurderer forvalteren hvert kvartal og følger stemmeråd blindt. Et fokusert, engasjert mandat med lang horisont endrer alt dette. Husk: fokus + engagement + lang horisont.\n\nForkortelser: LTVC = Long-Term Value Creation (langsiktig verdiskaping).","kt":"","src":"Bok s. 180 (Table 7.1) · Bok s. 202 (Figure 7.6) · Bok s. 186 (Box 7.1) · Bok s. 205 (Box 7.3) · L8 slide 71-74"},{"id":"SB316","l":"L8","t":"Investment chain","f":"m","d":3,"p":"M","sc":"short","s":"NBIM uses external managers for part of the oil fund. What risk does each extra link in the chain create?","o":[["Less diversification","Incorrect: mandates can increase diversification."],["Sure underperformance","Incorrect: chains create risks, not sure losses."],["No risk","Incorrect: goals are rarely fully aligned."],["Different horizons","Correct: each link can have different horizons and goals."]],"c":[3],"es":"Hvert ledd kan ha egen horisont og egne mål.","ed":"Hver gang et fond setter ut forvaltning, oppstår et nytt principal-agent-forhold. Den eksterne forvalteren kan ha kortere horisont eller andre incentiver, og informasjon kan gå tapt. Husk: hvert ledd = nytt agency problem.\n\nForkortelser: NBIM = Norges Bank Investment Management (forvalter Oljefondet).","kt":"Investment chain: the sequence of parties between the ultimate saver and the company (beneficiaries, asset owner, asset managers, companies).","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 204 (7.4.6)"},{"id":"SB317","l":"L8","t":"Financing lifecycle","f":"m","d":4,"p":"M","sc":"short","s":"Battery maker Northvolt raised billions but went bankrupt in 2024-25 after production problems. What does this show?","o":[["Green labels do not remove risk","Correct: a green label does not remove risk."],["Green projects cannot default","Incorrect: Northvolt shows green firms can fail."],["Only equity can fund green tech","Incorrect: Northvolt also used debt."],["Banks should never fund new technology","Incorrect: the lesson is to price the risk, not avoid it."]],"c":[0],"es":"Grønt betyr ikke risikofritt.","ed":"Northvolt hentet milliarder for å lage batterier, men gikk konkurs etter produksjonsproblemer. Grønne prosjekter har fortsatt teknologi- og oppskaleringsrisiko. Husk: grønt ≠ trygt.","kt":"Execution (scale-up) risk: the risk that a firm cannot turn a technology into reliable, profitable large-scale production.","src":"L8 slide 12 · Bok s. 301 (10.4.5)"},{"id":"TR31","l":"L8","t":"Double materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A cement maker emits a lot, and rising carbon prices squeeze its margins. How does double materiality apply?","o":[["Only financial materiality applies","Incorrect: impact materiality also applies."],["Neither applies","Incorrect: both apply."],["Impact: carbon costs; financial: emissions","Incorrect: the two labels are swapped."],["Impact: emissions; financial: carbon costs","Correct: impact = the emissions; financial = the carbon costs."]],"c":[3],"es":"Impact: utslippene. Financial: karbonkostnadene.","ed":"Double materiality har to retninger. Impact materiality: firmaets påvirkning på verden, her utslippene. Financial materiality: verdens påvirkning på firmaet, her karbonkostnadene som presser marginene. Husk: impact = firma → verden, financial = verden → firma.","kt":"Double materiality: an issue is material if the firm affects people/environment (impact) or the issue affects the firm's value (financial), or both.","src":"Opptak L8 ca. 65 min · Opptak L1 ca. 80 min"},{"id":"TR32","l":"L8","t":"Portfolio theory with sustainability","f":"m","d":3,"p":"M","sc":"none","s":"An investor adds a limit on portfolio emissions to the mean-variance problem. What happens?","o":[["Diversification is impossible","Incorrect: diversification is still possible."],["More choices, so a higher Sharpe ratio","Incorrect: a constraint removes options; it never adds them."],["Nothing changes","Incorrect: some portfolios are removed."],["Equal or lower Sharpe ratio","Correct: the Sharpe ratio stays the same or falls."]],"c":[3],"es":"En ekstra grense kan bare gi lik eller lavere Sharpe.","ed":"En ekstra betingelse kan bare fjerne valg. Hvis den beste porteføljen allerede oppfylte kravet, er Sharpe den samme. Hvis ikke, må man velge en dårligere portefølje, og Sharpe faller. Husk: constraint = lik eller lavere Sharpe.","kt":"","src":"Opptak L8 ca. 13 min · Opptak L8 ca. 17 min"},{"id":"TR33","l":"L8","t":"Asset manager materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An asset manager holds many weapons producers. What is also a material issue for the asset manager itself?","o":[["Its holdings' issues","Correct: the manager inherits its holdings' issues."],["None","Incorrect: investors inherit their holdings' issues."],["Only beating the benchmark","Incorrect: performance is an outcome, not the issue."],["Only its own office energy use","Incorrect: own operations are a small part."]],"c":[0],"es":"Forvalteren arver problemene til selskapene den eier.","ed":"Foreleseren sier at investorens material issues inkluderer issues i selskapene den eier. En forvalter med mange våpenprodusenter har våpen som et material issue, med omdømme- og regulatorisk risiko. Husk: du arver porteføljens issues.","kt":"","src":"Opptak L8 ca. 37 min · Opptak L8 ca. 39 min"},{"id":"TR34","l":"L8","t":"Financing life cycle","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"Two students have an idea for carbon capture technology but no revenue yet. Which financing fits best?","o":[["A share issue on the stock exchange","Incorrect: share issues are for listed firms."],["A big bank loan","Incorrect: there are no cash flows to lend against."],["Savings, family and grants","Correct: savings, family and grants fit the earliest stage."],["A corporate bond","Incorrect: bonds need scale and a track record."]],"c":[2],"es":"Uten inntekt: sparepenger, familie og tilskudd.","ed":"Helt tidlig, uten inntekter, er det for risikabelt for banker og obligasjonsmarkedet. Gründere bruker egne sparepenger, familie og venner (\"family, friends and fools\") og offentlige tilskudd. Senere kommer venture capital, banklån og børs. Husk: finansiering følger fasen.","kt":"","src":"Opptak L8 ca. 22 min"},{"id":"TR35","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A fund drops the whole oil and gas sector, then keeps only firms with below-average emissions in each other sector. This is:","o":[["Thematic, then impact investing","Incorrect: there is no theme or measured impact."],["Negative screening, then best-in-class","Correct: sector exclusion, then best-in-class."],["ESG integration, then tilting","Incorrect: there are no valuation adjustments."],["Norms-based screening, then stewardship","Incorrect: no norms or engagement are used."]],"c":[1],"es":"Fjerne sektor = negative screening. Beste i sektor = best-in-class.","ed":"Steg 1: hele olje- og gassektoren fjernes, altså negative screening. Steg 2: i de andre sektorene beholdes bare firmaer med lavere utslipp enn snittet, altså best-in-class. Husk: ut med sektoren, inn med de beste.","kt":"","src":"Opptak L8 ca. 31 min · Opptak L8 ca. 36 min"},{"id":"TR36","l":"L8","t":"Passive investing and governance","f":"m","d":3,"p":"H","sc":"none","s":"Why is \"exit\" mainly a governance tool for active investors, even though index funds also sell shares?","o":[["Their sales follow index rules","Correct: their sales follow index rules, so they send no signal."],["Index funds cannot vote","Incorrect: passive funds can vote."],["Exit never works","Incorrect: exit can work for active investors."],["Index funds are never allowed to sell","Incorrect: they do sell, e.g. when firms leave the index."]],"c":[0],"es":"Indeksfond selger fordi indeksen endres, ikke fordi de misliker firmaet.","ed":"Exit virker fordi salg sender et signal om at investoren er misfornøyd. Indeksfond selger bare når indeksen endres, ikke på grunn av ledelsen. Derfor gir salget deres ikke noe signal. Husk: exit må være et valg for å virke.","kt":"","src":"Opptak L8 ca. 77 min · Opptak L8 ca. 78 min"},{"id":"TR37","l":"L8","t":"ESG integration","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Analyst A drops all fossil fuel firms because she dislikes them. Analyst B keeps them but lowers their forecast cash flows for carbon costs. What is B doing?","o":[["ESG integration","Correct: B builds carbon costs into cash flows: ESG integration."],["Impact investing","Incorrect: B is not aiming for a measured outcome."],["Norms-based screening","Incorrect: no international norms are used."],["Negative screening","Incorrect: that describes analyst A."]],"c":[0],"es":"B justerer kontantstrømmen for karbonkostnader = ESG integration.","ed":"Analytiker A utelukker fossile firmaer fordi hun misliker dem (negative screening, values). Analytiker B beholder dem, men senker kontantstrømmen for fremtidige karbonkostnader. Det er ESG integration: ESG inn i verdsettelsen. Husk: B justerer tallene.","kt":"","src":"Opptak L8 ca. 52 min"},{"id":"TR38","l":"L8","t":"Impact investing","f":"t","d":2,"p":"H","sc":"none","s":"True or false: Since impact investing (SF 3.0) puts social and environmental goals first, an impact fund may run at a loss year after year.","o":[["True","Incorrect. Impact investing is not charity; it still has a required, if lower, financial return."],["False","Correct. Impact investing is not charity; it still has a required, if lower, financial return."]],"c":[1],"es":"Usant. Impact investing er ikke veldedighet. Det krever en viss avkastning.","ed":"Foreleseren understreker at impact investing ikke er veldedighet. Det finnes et lavere, men reelt avkastningskrav, minst å bevare kapitalen. Et fond som taper penger år etter år, oppfyller ikke dette. Husk: impact ≠ charity.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Opptak L8 ca. 67 min · Opptak L9 ca. 85 min"},{"id":"CX068","l":"L9","t":"Channels from ESG to value","f":"m","d":2,"p":"H","sc":"none","s":"A firm with strong ESG gets cheaper loans and a lower cost of equity. Here ESG affects value through:","o":[["Tax rates","Det er ikke en av kanalene i faget."],["Cash flows","Cash flow-kanalen handler om salg, kostnader og bøter."],["Cost of capital","Lavere finansieringskostnad gir høyere verdi."],["Share count","Det finnes ikke en slik kanal."]],"c":[2],"es":"Billigere finansiering = cost of capital channel.","ed":"To hovedkanaler: cash flows (f.eks. søksmål, karbonavgift) og cost of capital. Foreleser anbefaler å legge ESG inn via kontantstrømmene i verdsettelse.","kt":"","src":"L9 slide 3 · L9 slide 11","k":1},{"id":"CX069","l":"L9","t":"ESG integration in valuation","f":"t","d":2,"p":"H","sc":"none","s":"Does the lecturer recommend adjusting the WACC as the main way to integrate ESG into a valuation?","o":[["Yes","Feil. Hun anbefaler å justere kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig."],["No","Riktig. Hun anbefaler å justere kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig."]],"c":[1],"es":"Nei: juster kontantstrømmen, ikke WACC.","ed":"Justerer du både kontantstrøm og WACC for samme risiko, teller du risikoen to ganger.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad).","kt":"","src":"Opptak L9 ca. 16 min · Opptak L9 ca. 36 min · Opptak L9 ca. 69 min","k":1},{"id":"CX070","l":"L9","t":"Green vs brown returns","f":"m","d":2,"p":"H","sc":"none","s":"According to Pástor, Stambaugh and Taylor, compared with brown assets, green assets' expected returns are:","o":[["Exactly the same","Smak og hedging gir en forskjell."],["Higher","Det er brune som må gi høyere forventet avkastning."],["Lower","Grønt er populært og en hedge mot klimarisiko, så prisen er høy og forventet avkastning lav."],["Unrelated to climate","Klimarisiko er nettopp mekanismen."]],"c":[2],"es":"Grønt: lavere forventet avkastning.","ed":"Brune aksjer er mindre populære og mer utsatt for klimarisiko, så de må tilby høyere forventet avkastning.","kt":"","src":"L9 slide 14-16","k":1},{"id":"CX071","l":"L9","t":"Green vs brown returns","f":"m","d":2,"p":"H","sc":"short","s":"When green stocks jump after a surprise climate subsidy, their future expected returns are:","o":[["They will be permanently higher","Høy pris nå betyr ikke høyere avkastning fremover."],["They will fall to zero for several years","Det er for bastant."],["Not higher: it was a one-time price jump","Sjokket ga et engangshopp i prisen."],["They will equal those of brown stocks from now on","I likevekt er grønn forventet avkastning lavere."]],"c":[2],"es":"Uventet nyhet = engangshopp, ikke høyere forventet avkastning.","ed":"Realised return (det du fikk) ≠ expected return (det du kan forvente). Grønne aksjer gjorde det bra fordi klimabekymringen økte uventet.","kt":"","src":"L9 slide 14 · L9 slide 17-18","k":1},{"id":"CX072","l":"L9","t":"Is ESG a risk factor","f":"t","d":2,"p":"H","sc":"none","s":"Is ESG a well-established risk factor, like the market factor?","o":[["Yes","Feil. Det finnes ingen robust evidens for en stabil ESG-premie på tvers av definisjoner og land."],["No","Riktig. Det finnes ingen robust evidens for en stabil ESG-premie på tvers av definisjoner og land."]],"c":[1],"es":"Nei: ingen robust ESG-faktor.","ed":"En faktor må ha solid forskning bak seg og være robust på tvers av definisjoner og land. ESG klarer ikke disse testene.","kt":"","src":"L9 slide 22 · L9 slide 24 · L9 slide 26","k":1},{"id":"CX073","l":"L9","t":"ESG as a risk factor","f":"m","d":2,"p":"H","sc":"none","s":"A risk that can be diversified away is:","o":[["A rise in all interest rates","Rammer hele markedet = systematisk."],["A scandal at one company","Selskapsspesifikk risiko forsvinner i en bred portefølje."],["Economy-wide climate change","Rammer mange samtidig = mulig systematisk."],["A global recession","Rammer alle = systematisk."]],"c":[1],"es":"Ett selskap = diversifiserbart.","ed":"Derfor gir slik risiko ingen risikopremie. Klima er annerledes: det kan ramme hele økonomien og er derfor muligens systematisk.","kt":"","src":"Opptak L9 ca. 59 min · Opptak L9 ca. 68 min","k":1},{"id":"CX074","l":"L9","t":"Is ESG a risk factor","f":"m","d":2,"p":"H","sc":"none","s":"Bolton and Kacperczyk find higher stock returns for high-emission firms. The best interpretation is that:","o":[["Carbon risk is not priced at all","Premien viser at den er priset."],["High emitters are better managed firms","Studien sier ikke det."],["Investors want pay for carbon risk","Det er en carbon premium: betalt for å bære risikoen."],["Green firms are riskier than brown firms","Det er motsatt."]],"c":[2],"es":"Høyere avkastning = kompensasjon for karbonrisiko.","ed":"Dette passer med Pástor m.fl.: brune aksjer må tilby høyere forventet avkastning.","kt":"","src":"L9 slide 27 · L9 slide 15","k":1},{"id":"CX075","l":"L9","t":"DCF valuation","f":"m","d":2,"p":"H","sc":"none","s":"To go from enterprise value to equity value, you:","o":[["Divide by the tax rate","Skatt er allerede i kontantstrømmen."],["Add net debt","Gjeld skal trekkes fra."],["Multiply by the WACC","WACC brukes til diskontering, ikke her."],["Subtract net debt","Gjelden tilhører långiverne."]],"c":[3],"es":"Equity = EV − net debt.","ed":"Enterprise value er verdien for både eiere og långivere. Trekk fra det långiverne skal ha, og del på antall aksjer for verdi per aksje.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad); EV = Enterprise Value (verdien for alle kapitalgivere).","kt":"","src":"L9 slide 5 · Bok s. 215 (8.1.2) · Bok s. 217 (Table 8.2)","k":1},{"id":"CX076","l":"L9","t":"Engagement and divestment","f":"m","d":2,"p":"H","sc":"none","s":"Cohen, Gurun and Nguyen question excluding energy firms from ESG funds because:","o":[["Energy firms always have high ESG ratings","De har ofte lave ESG-scorer."],["Energy firms never emit CO2","Det stemmer ikke."],["Excluding them is illegal","Det er helt lovlig å ekskludere dem."],["They produce many green patents","Ekskluderte energiselskaper er viktige grønne innovatører."]],"c":[3],"es":"Ekskludering kan ramme de som innoverer mest grønt.","ed":"Et argument for engagement fremfor ren ekskludering: man beholder innflytelsen over selskapene som utvikler grønn teknologi.","kt":"","src":"L9 slide 33 · L8 slide 58","k":1},{"id":"EX07","l":"L9","t":"Exam sample: channels from ESG to value","f":"m","d":2,"p":"H","sc":"none","s":"ESG issues can affect firm value through which channel:","o":[["Tax channel","Det er ikke en av kanalene i faget."],["Cash flow channel","Foreleserens fasit: ESG påvirker salg, kostnader, investeringer og bøter, og dermed kontantstrømmen."],["Cost of capital channel","Faget nevner også denne kanalen, men foreleserens fasit er cash flow. Hun anbefaler å legge ESG inn via kontantstrømmene."],["Dividend channel","Det er ikke en av kanalene i faget."]],"c":[1],"es":"Foreleserens fasit: cash flow channel.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nObs: boka beskriver også en cost of capital channel. Foreleser anbefaler likevel å legge ESG inn via kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig. På eksamen: velg cash flow når bare én kanal kan være riktig.","kt":"","src":"L9 slide 3 · L9 slide 11","k":1,"x":1},{"id":"SB318","l":"L9","t":"Channels from ESG to value","f":"m","d":3,"p":"H","sc":"short","s":"Bayer agreed in 2020 to pay about USD 10 billion to settle lawsuits claiming its weedkiller Roundup caused cancer. Through which channel did this hit value?","o":[["Only the cost of capital","Incorrect: the settlement is a cash cost."],["Cash flows: legal costs","Correct: legal costs are cash flowing out of the firm."],["Neither","Incorrect: product safety is a material issue."],["Higher Roundup sales","Incorrect: the lawsuits lowered value."]],"c":[1],"es":"Erstatning er penger ut av firmaet, altså cash flow-kanalen.","ed":"ESG påvirker verdien gjennom to kanaler: cash flows (inntekter, kostnader, investeringer) og cost of capital (risikopremien). Et forlik på $10 mrd er penger rett ut av firmaet, altså cash flow-kanalen. Husk: søksmål = cash flow.","kt":"Cash flow channel: ESG affects value through revenues, costs (incl. litigation), capex and stranded assets.","src":"L9 slide 3 · L9 slide 11"},{"id":"SB319","l":"L9","t":"Valuation methods","f":"m","d":2,"p":"H","sc":"none","s":"Why does the textbook prefer a DCF valuation over multiples for ESG integration?","o":[["A DCF shows the assumptions","Correct: a DCF shows the assumptions, so ESG effects can be added."],["A DCF needs no forecasts","Incorrect: a DCF relies on forecasts."],["Multiples cannot be calculated here","Incorrect: multiples can be calculated."],["P/E ratios are banned","Incorrect: P/E is not banned."]],"c":[0],"es":"En DCF viser antagelsene tydelig, så du kan legge inn ESG-effekter.","ed":"En multiple (f.eks. P/E) antar at sammenlignbare firmaer er riktig priset og har like utsikter. En DCF viser hver antagelse: vekst, marginer, investeringer, rente. Da kan analytikeren legge inn ESG-effekter der de hører hjemme. Husk: DCF gjør antagelsene synlige.\n\nForkortelser: DCF = Discounted Cash Flow (verdsettelse ved å diskontere fremtidige kontantstrømmer).","kt":"","src":"L9 slide 4 · Bok s. 214 (8.1.2) · Bok s. 218 (8.1.2)"},{"id":"SB320","l":"L9","t":"DCF valuation","f":"m","d":2,"p":"H","sc":"none","s":"In a DCF, how do you go from enterprise value to equity value?","o":[["Add net debt","Incorrect: debt must be subtracted."],["Discount it again","Incorrect: discounting is already done."],["Multiply by the equity share","Incorrect: equity is what is left, not a share."],["Subtract net debt","Correct: subtract net debt."]],"c":[3],"es":"Equity value = enterprise value − netto gjeld.","ed":"Enterprise value er verdien for alle som har finansiert firmaet (egenkapital og gjeld). For å finne verdien for aksjonærene trekker man fra netto gjeld (gjeld minus kontanter). Husk: equity = EV − netto gjeld.\n\nForkortelser: DCF = Discounted Cash Flow (verdsettelse ved å diskontere fremtidige kontantstrømmer); EV = Enterprise Value (verdien for alle kapitalgivere).","kt":"","src":"L9 slide 5 · Bok s. 215 (8.1.2) · Bok s. 217 (Table 8.2)"},{"id":"SB321","l":"L9","t":"DCF valuation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In V0 = FCF1 / (WACC − g), a higher growth rate g (with the same WACC) lowers the firm's value.","o":[["True","Incorrect. A higher g makes the denominator (WACC − g) smaller, so the value goes up."],["False","Correct. A higher g makes the denominator (WACC − g) smaller, so the value goes up."]],"c":[1],"es":"Usant. Høyere g gjør nevneren (WACC − g) mindre, så verdien stiger.","ed":"I Gordon-formelen V0 = FCF1 / (WACC − g) står g i nevneren med minus. Høyere g gjør nevneren mindre, og da blir verdien større. Formelen er svært følsom når g nærmer seg WACC. Husk: høyere vekst = høyere verdi.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad); FCF = Free Cash Flow (fri kontantstrøm).","kt":"","src":"Bok s. 215 (8.1.2) · L9 slide 8"},{"id":"SB322","l":"L9","t":"DCF valuation","f":"m","d":3,"p":"M","sc":"none","s":"An analyst uses the consensus forecast, except she sets the EBIT margin at 16% instead of 12%. What happens to fair value?","o":[["It falls","Incorrect: after-tax cash flows still rise."],["It rises by exactly 4%","Incorrect: 4 percentage points is about a third more EBIT."],["It does not change","Incorrect: the margin drives FCF."],["It rises by over 4%","Correct: value rises by much more than 4%."]],"c":[3],"es":"Fra 12 % til 16 % er en tredjedel høyere EBIT. Verdien stiger mye mer enn 4 %.","ed":"Å øke marginen fra 12 % til 16 % er 4 prosentpoeng, men en økning på ca. 33 % i EBIT. Det slår gjennom i NOPLAT og FCF for alle årene, så verdien stiger mye, i læreboka med ca. 35 %. Husk: prosentpoeng ≠ prosent.\n\nForkortelser: FCF = Free Cash Flow (fri kontantstrøm); EBIT = Earnings Before Interest and Taxes (driftsresultat); NOPLAT = Net Operating Profit Less Adjusted Taxes (driftsresultat etter skatt).","kt":"","src":"Bok s. 218 (8.1.2)"},{"id":"SB323","l":"L9","t":"Value drivers","f":"m","d":2,"p":"H","sc":"none","s":"Where does sustainability usually link to value drivers?","o":[["Only in the terminal growth rate","Incorrect: it can affect all value drivers."],["Only for energy firms","Incorrect: every industry has material issues."],["Through growth, margins and capital","Correct: through growth, margins and capital."],["Add the ESG rating to the share price","Incorrect: integration works through value drivers."]],"c":[2],"es":"Bærekraft påvirker vekst, marginer og kapital.","ed":"Bærekraft påvirker verdien gjennom value drivers: vekst (nye grønne markeder), marginer (lavere kostnader, færre bøter) og kapital (investeringer, risiko). Et gruveselskap med god stakeholder-håndtering får færre forsinkelser. Husk: ESG → value drivers → verdi.","kt":"","src":"L9 slide 6 · Bok s. 218 (8.1.2)"},{"id":"SB324","l":"L9","t":"Why sustainability matters","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Business models are the \"missing link\" between ESG and finance; because few see this link, material ESG issues are often mispriced, which creates opportunities.","o":[["True","Correct. Business models link ESG to finance; few see this link, so material ESG is often mispriced."],["False","Incorrect. Business models link ESG to finance; few see this link, so material ESG is often mispriced."]],"c":[0],"es":"Sant. Business model kobler ESG til finans. Få ser det, så ESG blir feilpriset.","ed":"Læreboka kaller business models \"the missing link\": de viser hvordan ESG-forhold påvirker inntekter og kostnader. Fordi få analytikere ser denne koblingen, blir material ESG ofte feilpriset, og det gir muligheter for aktive investorer. Husk: business model = koblingen.","kt":"","src":"Bok s. 219 (8.2) · Bok s. 219 (Figure 8.3) · Bok s. 220 (8.2)"},{"id":"SB325","l":"L9","t":"ESG integration in valuation","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"After ESG adjustments, CESGA's enterprise value is 882,379. It has cash of 40,000, debt of 600,000 (thousands) and 20 million shares. What is the equity value?","o":[["882,379","Incorrect: you must adjust for cash and debt."],["242,379 (about 12 per share)","Incorrect: cash must be added, not subtracted."],["322,379 (about 16 per share)","Correct: 882,379 + 40,000 − 600,000 = 322,379, about 16 per share."],["1,522,379 (about 76 per share)","Incorrect: the signs of debt and cash are swapped."]],"c":[2],"es":"882 379 + 40 000 − 600 000 = 322 379, ca. 16 per aksje.","ed":"Equity value = enterprise value + kontanter − gjeld = 882 379 + 40 000 − 600 000 = 322 379. Delt på 20 mill. aksjer gir det ca. 16 per aksje. Husk: legg til kontanter, trekk fra gjeld.","kt":"","src":"L9 slide 9-10"},{"id":"SB326","l":"L9","t":"ESG integration in valuation","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In the CESGA example, which ESG adjustment is matched with the right pillar?","o":[["More market share from better products - Social","Incorrect: better products for the environment are E."],["Higher growth from good governance - Social","Incorrect: there is no such adjustment."],["Lower debt from the lawsuit - Environmental","Incorrect: there is no such adjustment."],["Extra taxes from tax avoidance - Governance","Correct: tax avoidance is governance."]],"c":[3],"es":"Skatteunngåelse er governance (G).","ed":"I CESGA-eksempelet kobles hver ESG-justering til en søyle. Ekstra skatt på grunn av aggressiv skatteplanlegging er governance (G). Mer markedsandel fra miljøvennlige produkter er environmental (E). Husk: skatt = G.","kt":"","src":"L9 slide 9-10 · Bok s. 231 (8.3.1.1)"},{"id":"SB327","l":"L9","t":"Materiality analysis","f":"m","d":2,"p":"H","sc":"none","s":"The textbook's materiality table asks three things about each material ESG factor. Which set is correct?","o":[["ESG rating, index weight, price reaction","Incorrect: ratings and index weights are not the columns."],["Carbon, water and waste","Incorrect: material issues are not only environmental."],["Performance, edge, value driver","Correct: performance, edge and value driver."],["News, NGO campaigns, lawsuits","Incorrect: controversy counts are not the framework."]],"c":[2],"es":"Performance, edge og value driver.","ed":"Materiality-tabellen stiller tre spørsmål for hvert material issue: Hvor god er firmaets ytelse? Har det et fortrinn sammenlignet med konkurrentene (edge)? Hvilken value driver påvirkes? Husk: performance – edge – driver.\n\nForkortelser: NGO = Non-Governmental Organisation (frivillig organisasjon, f.eks. Greenpeace).","kt":"","src":"L9 slide 7-8 · Bok s. 249 (Appendix)"},{"id":"SB328","l":"L9","t":"Value driver adjustment","f":"m","d":2,"p":"H","sc":"none","s":"Which is a step in the value driver adjustment (VDA) approach?","o":[["Hold the stock for 12 months","Incorrect: not a VDA step."],["Use a P/E multiple instead of a DCF","Incorrect: VDA works inside a DCF."],["Focus on the most material issues","Correct: step 1 is to focus on the most material issues."],["Let a proxy advisor vote","Incorrect: the analyst should engage directly."]],"c":[2],"es":"Første steg i VDA er å fokusere på de mest material issues.","ed":"Value driver adjustment (VDA): 1) fokuser på de mest material issues, 2) vurder hvordan de påvirker value drivers, 3) juster driverne i verdsettelsen, 4) ha dialog med firmaet. Husk: material → drivere → verdi → dialog.\n\nForkortelser: DCF = Discounted Cash Flow (verdsettelse ved å diskontere fremtidige kontantstrømmer); VDA = Value Driver Adjustment (justere value drivers for ESG).","kt":"","src":"Bok s. 229 (8.3.1.1) · Bok s. 230 (8.3.1.1)"},{"id":"SB329","l":"L9","t":"Value driver adjustment","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"An analyst makes small ESG adjustments for KUKA: slightly higher growth and margins and a slightly lower cost of capital. Why does the target price rise a lot?","o":[["Small changes add up over time","Correct: small changes in several drivers add up over time."],["ESG is added as a fixed bonus","Incorrect: VDA uses value drivers, not a fixed bonus."],["It does not rise","Incorrect: all three adjustments raise value."],["A lower cost of capital lowers value","Incorrect: a lower cost of capital raises value."]],"c":[0],"es":"Små endringer i flere drivere forsterker hverandre over tid.","ed":"Små justeringer i vekst, margin og kapitalkostnad virker samtidig og forsterker hverandre over mange år. Derfor kan kursmålet stige mye selv om hver justering er liten. Husk: små endringer, stor samlet effekt.\n\nForkortelser: VDA = Value Driver Adjustment (justere value drivers for ESG).","kt":"Value driver adjustment (VDA): changing growth, margin or cost-of-capital assumptions to reflect ESG-based competitive (dis)advantages.","src":"Bok s. 231 (Box 8.1)"},{"id":"SB330","l":"L9","t":"Value driver adjustment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Governance adjustments mostly change sales growth and margins, while innovation adjustments mostly change the cost of capital.","o":[["True","Incorrect. It is the reverse: innovation changes growth and margins; governance changes the cost of capital."],["False","Correct. It is the reverse: innovation changes growth and margins; governance changes the cost of capital."]],"c":[1],"es":"Usant. Det er motsatt: innovasjon endrer vekst og margin, governance endrer kapitalkostnad.","ed":"Innovasjon påvirker typisk salgsvekst og marginer (nye produkter, bedre prosesser). Governance påvirker mest risiko og dermed kapitalkostnaden. Påstanden har byttet om på dem. Husk: innovasjon → vekst/margin, governance → WACC.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad).","kt":"","src":"Bok s. 231 (8.3.1.1)"},{"id":"SB331","l":"L9","t":"Cost of capital channel","f":"m","d":3,"p":"H","sc":"none","s":"Which finding on ESG and the cost of capital is correctly attributed?","o":[["El Ghoul et al.: better CSR, lower cost of equity","Correct: El Ghoul et al. find better CSR lowers the cost of equity."],["El Ghoul et al.: tobacco firms have lower cost of equity","Incorrect: sin industries have a higher cost of equity."],["Dhaliwal et al.: CSR reports raise the cost of capital","Incorrect: they find a lower cost of capital."],["Cheng et al.: only governance matters","Incorrect: both social and environmental factors matter."]],"c":[0],"es":"El Ghoul et al.: bedre CSR gir lavere cost of equity.","ed":"El Ghoul et al. finner at firmaer med bedre CSR har lavere cost of equity, og at sin industries (tobakk, kjernekraft) har høyere. Dhaliwal et al. finner at CSR-rapportering senker kapitalkostnaden for gode aktører. Husk: god CSR → billigere kapital.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar).","kt":"","src":"L9 slide 12 · Bok s. 220 (8.2.1.1) · Bok s. 221 (8.2.1.1)"},{"id":"SB332","l":"L9","t":"Cost of capital channel","f":"t","d":4,"p":"M","sc":"short","s":"True or false: Lower bond spreads for firms with higher ESG scores do not prove that ESG lowers the cost of capital, since high-ESG firms are also often larger and stronger.","o":[["True","Correct. Larger, stronger firms tend to have both high ESG scores and low spreads, so it may not be causal."],["False","Incorrect. Larger, stronger firms tend to have both high ESG scores and low spreads, so it may not be causal."]],"c":[0],"es":"Sant. Store, sterke firmaer har både høy ESG og lav spread.","ed":"Firmaer med høy ESG-score er ofte større, mer lønnsomme og bedre styrt. Disse egenskapene gir også lavere spread. Derfor beviser sammenhengen ikke at ESG i seg selv senker kapitalkostnaden. Husk: korrelasjon ≠ kausalitet.","kt":"Confounding variable: a factor (e.g. firm size) that drives both the supposed cause and the effect, creating a misleading correlation.","src":"L9 slide 13 · L9 slide 12"},{"id":"SB333","l":"L9","t":"Green vs brown returns","f":"m","d":3,"p":"H","sc":"none","s":"Why should green assets have LOWER expected returns than brown assets (Pástor, Stambaugh and Taylor)?","o":[["Green firms are smaller and riskier","Incorrect: more risk would mean higher, not lower, returns."],["Regulators cap green returns","Incorrect: there is no such rule."],["Green firms pay more dividends","Incorrect: it is about tastes and hedging."],["Taste and climate hedging","Correct: investors like green (taste) and it hedges climate risk."]],"c":[3],"es":"Investorer liker grønt (taste) og det sikrer mot klimarisiko (hedging). Begge senker avkastningen.","ed":"Pástor, Stambaugh og Taylor gir to grunner til lavere forventet avkastning på grønt: investorer liker grønne aksjer (taste premium) og grønne aksjer gir sikring mot klimarisiko (hedging). Begge gjør at investorer godtar lavere avkastning. Husk: grønt = dyrere = lavere forventet avkastning.","kt":"","src":"L9 slide 14-16"},{"id":"SB334","l":"L9","t":"Green vs brown returns","f":"m","d":4,"p":"H","sc":"none","s":"A green-minus-brown portfolio earned 174% in recent years. How do Pástor, Stambaugh and Taylor explain this?","o":[["Green stocks always have higher expected returns","Incorrect: they expect lower returns for green."],["Brown stocks are riskier","Incorrect: brown stocks did worse."],["Green firms paid higher dividends","Incorrect: the driver was climate concern."],["Climate concern rose unexpectedly","Correct: climate concern rose unexpectedly."]],"c":[3],"es":"Uventet økt klimabekymring løftet grønne aksjer.","ed":"Grønne aksjer gjorde det mye bedre enn brune, men ifølge Pástor et al. skyldes det at klimabekymringen økte uventet, så grønne aksjer ble dyrere. Uten disse overraskelsene ville forskjellen vært nær null. Husk: realisert avkastning ≠ forventet avkastning.","kt":"","src":"L9 slide 14 · L9 slide 17-18"},{"id":"SB335","l":"L9","t":"Green vs brown returns","f":"m","d":4,"p":"H","sc":"short","s":"US clean energy stocks jumped when the Inflation Reduction Act (2022) offered surprise subsidies. How should investors read this?","o":[["A one-time price jump","Correct: it was a one-time price jump."],["Expect the same jump every year","Incorrect: surprises do not repeat every year."],["Subsidies do not affect prices","Incorrect: prices reacted strongly."],["Green stocks always earn more","Incorrect: theory says lower expected returns for green."]],"c":[0],"es":"Et engangshopp i prisen, ikke høyere fremtidig avkastning.","ed":"Inflation Reduction Act ga uventede subsidier, og grønne aksjer steg med en gang. Det er en engangseffekt: prisen justeres til den nye informasjonen. Fremtidig forventet avkastning blir ikke høyere, heller lavere. Husk: overraskelse = engangshopp.","kt":"Realised vs expected return: realised returns include surprises; expected returns are what investors anticipate given risk and tastes.","src":"L9 slide 15-16 · L9 slide 18"},{"id":"SB336","l":"L9","t":"Asset pricing models","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A manager says: \"This solar park is green, so we should use a much lower discount rate.\" What is the best answer?","o":[["Ignore the discount rate","Incorrect: NPV needs discounting."],["Use the highest rate","Incorrect: the rate should match the risk."],["Agree and use a zero rate","Incorrect: green projects still have risk."],["Use a rate for its risk","Correct: use a rate that matches the project's risk."]],"c":[3],"es":"Bruk en rente som passer risikoen. Grønt alene gir ikke lav rente.","ed":"Diskonteringsrenten skal gjenspeile risikoen, ikke hvor grønt prosjektet er. Et solkraftprosjekt har teknologi-, pris- og politikkrisiko. Bærekraftseffekter skal heller inn i kontantstrømmene. Husk: rente = risiko.\n\nForkortelser: NPV = Net Present Value (nåverdi); CAPM = Capital Asset Pricing Model; APT = Arbitrage Pricing Theory (flerfaktormodell).","kt":"Cost of capital: the return investors require for a project's risk; in CAPM/APT it depends on exposure to systematic risk factors.","src":"L9 slide 19 · L9 slide 21"},{"id":"SB337","l":"L9","t":"Asset pricing models","f":"m","d":3,"p":"H","sc":"none","s":"In the arbitrage pricing theory, E(Ri) = Rf + Σ βi,λ (RM,λ − Rf). What is βi,λ?","o":[["The asset's weight in the market","Incorrect: that is a portfolio weight."],["Sensitivity to factor λ","Correct: beta is the sensitivity to factor λ."],["The asset's firm-specific risk","Incorrect: firm-specific risk can be diversified away."],["The real risk-free rate","Incorrect: Rf stands alone in the formula."]],"c":[1],"es":"β er hvor følsom aksjen er for faktoren.","ed":"I arbitrage pricing theory (APT) avhenger forventet avkastning av flere risikofaktorer. β for hver faktor viser hvor følsom aksjen er for den faktoren. Faktorpremien (RM,λ − Rf) er prisen på den risikoen. Husk: β = følsomhet.\n\nForkortelser: APT = Arbitrage Pricing Theory (flerfaktormodell).","kt":"","src":"L9 slide 21 · L9 slide 23"},{"id":"SB338","l":"L9","t":"Is ESG a risk factor","f":"m","d":4,"p":"H","sc":"none","s":"Research Affiliates tested long-short ESG strategies (2009-2020). What did they conclude?","o":[["ESG is a strong factor everywhere","Incorrect: the alphas were small and not significant."],["There is no robust ESG premium","Correct: there is no robust ESG premium."],["Governance has a large premium","Incorrect: governance had negative raw returns."],["ESG meets all factor criteria","Incorrect: there is little agreement on robustness."]],"c":[1],"es":"Ingen robust ESG-premie.","ed":"Research Affiliates testet long-short ESG-strategier (kjøp høy ESG, selg lav ESG) fra 2009 til 2020. Ingen av strategiene ga statistisk signifikant meravkastning. Det finnes altså ingen robust ESG-faktor. Husk: ingen bevist ESG-premie.","kt":"","src":"L9 slide 22 · L9 slide 24 · L9 slide 26"},{"id":"SB339","l":"L9","t":"Is ESG a risk factor","f":"t","d":4,"p":"H","sc":"none","s":"True or false: Bolton and Kacperczyk (2021) find that firms with higher carbon emissions earn LOWER stock returns.","o":[["True","Incorrect. They find higher-emission firms earn higher returns: a carbon premium for carbon risk."],["False","Correct. They find higher-emission firms earn higher returns: a carbon premium for carbon risk."]],"c":[1],"es":"Usant. Høyere utslipp gir HØYERE avkastning (carbon premium).","ed":"Bolton og Kacperczyk finner en carbon premium: firmaer med høyere utslipp gir høyere aksjeavkastning. Investorer krever kompensasjon for å bære karbonrisiko (fremtidig regulering). Husk: høye utslipp → høyere forventet avkastning.","kt":"","src":"L9 slide 27 · L9 slide 15"},{"id":"SB340","l":"L9","t":"Is ESG a risk factor","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"High-ESG stocks have earned lower returns. Analyst A says they are less risky; analyst B says they are overpriced. What is the difference?","o":[["A: fair return; B: mispricing","Correct: A sees a fair, lower return; B sees mispricing."],["A means you should short them","Incorrect: lower risk gives no free profit."],["There is no difference","Incorrect: the difference matters a lot."],["B means a higher beta","Incorrect: overpricing concerns alpha, not beta."]],"c":[0],"es":"A: lavere risiko gir lavere avkastning (fair). B: aksjene er feilpriset.","ed":"To forklaringer på lavere avkastning: risiko-forklaringen (A) sier at høy ESG gir lavere risiko, så lavere avkastning er rettferdig og vil vare. Feilprising-forklaringen (B) sier at aksjene er for dyre, og at det vil rette seg. Husk: risiko består, feilprising forsvinner.","kt":"Risk explanation: lower expected return compensates for lower (systematic) risk. Mispricing: price deviates from fair value (α ≠ 0) and should eventually correct.","src":"L9 slide 24-25 · L9 slide 20 · L9 slide 27"},{"id":"SB341","l":"L9","t":"Evidence: sustainability and value","f":"m","d":3,"p":"M","sc":"short","s":"Firms with high CSR did better in the 2008-09 crisis (Lins, Servaes and Tamayo). Why?","o":[["They were all in safe sectors","Incorrect: it was not just a sector effect."],["They had no debt","Incorrect: the reason is trust, not zero debt."],["Governments rescued only them","Incorrect: there was no such bailout."],["Stakeholder trust paid off","Correct: stakeholder trust paid off in the crisis."]],"c":[3],"es":"Tillit fra stakeholders lønte seg i krisen.","ed":"Lins, Servaes og Tamayo finner at firmaer med høy CSR gjorde det bedre i finanskrisen 2008–09. Forklaringen er tillit: når tilliten til markedet faller, holder kunder, ansatte og investorer seg til firmaer de stoler på. Husk: CSR = tillit = buffer i krise.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar).","kt":"Social capital: trust and goodwill built with employees, customers, suppliers and investors through responsible behaviour.","src":"Bok s. 221 (8.2.1.1)"},{"id":"SB342","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"M","sc":"none","s":"Firms with IMPROVING sustainability ratings outperform, but firms with already HIGH ratings do not. Why?","o":[["Improvements are news","Correct: improvements are news; high levels are already priced."],["Agencies inflate bad firms' ratings","Incorrect: this is not the book's explanation."],["High-rated firms are bubbles","Incorrect: the finding is no outperformance, not crashes."],["Improving firms are smaller","Incorrect: the explanation is about information."]],"c":[0],"es":"Forbedringer er nyheter. Høye nivåer er allerede priset.","ed":"Et firma som allerede har høy rating, er allerede priset slik. En forbedring er ny informasjon som markedet ikke har tatt inn, og kursen stiger. Husk: endring er nyheter, nivå er allerede i prisen.","kt":"","src":"Bok s. 222 (8.2.1.2) · Bok s. 232 (8.3.1.2)"},{"id":"SB343","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"H","sc":"none","s":"Why is the evidence linking ESG to INVESTOR returns weak, even though ESG is linked to firm performance?","o":[["Investors price ESG at once","Incorrect: markets tend to ignore ESG information."],["All SRI funds are the same","Incorrect: strategies differ a lot."],["Sin stocks are unique","Incorrect: sin stock profiles can be replicated."],["Old studies used narrow funds","Correct: older studies used narrow ethical funds."]],"c":[3],"es":"Eldre studier brukte smale fond, ikke ESG generelt.","ed":"Mange eldre studier så på smale etiske fond med mye exclusion, og de gjorde det dårlig. Bredere ESG-strategier gjorde det bedre. Derfor er bevisene for investoravkastning svake og blandet, selv om ESG henger sammen med firmaets resultater. Husk: strategien bestemmer resultatet.\n\nForkortelser: SRI = Socially Responsible Investing (ansvarlig investering).","kt":"","src":"Bok s. 222 (8.2.1.3) · Bok s. 223 (Figure 8.4)"},{"id":"SB344","l":"L9","t":"Evidence: sustainability and value","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A high carbon footprint always means high carbon risk; for example, an aluminium producer always loses from a higher carbon price.","o":[["True","Incorrect. A high footprint does not always mean high risk: an aluminium maker can gain from higher carbon prices."],["False","Correct. A high footprint does not always mean high risk: an aluminium maker can gain from higher carbon prices."]],"c":[1],"es":"Usant. Et aluminiumsselskap kan tjene på høyere karbonpris.","ed":"Schramade bruker aluminium som eksempel: produksjonen gir mye utslipp, men aluminium gjør biler og fly lettere og erstatter tyngre materialer. Høyere karbonpris kan øke etterspørselen. Fotavtrykk og risiko er altså ikke det samme. Husk: footprint ≠ risiko.","kt":"","src":"Bok s. 223 (8.2.2) · Bok s. 224 (8.2.2)"},{"id":"SB345","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"L","sc":"none","s":"What do Edmans, Li and Zhang (2017) find about employee satisfaction across countries?","o":[["It predicts lower returns in the US and UK","Incorrect: the link is positive in flexible markets."],["It predicts higher returns everywhere","Incorrect: the effect depends on the labour market."],["It matters only in Germany","Incorrect: Germany shows no effect."],["It works in flexible labour markets","Correct: it predicts returns where labour markets are flexible."]],"c":[3],"es":"Fornøyde ansatte gir avkastning der arbeidsmarkedet er fleksibelt.","ed":"Edmans, Li og Zhang finner at fornøyde ansatte gir høyere avkastning i land med fleksible arbeidsmarkeder (USA, UK). Der kan ansatte lett slutte, så trivsel er viktig og dyrt. I land med strengt stillingsvern (Tyskland) er det ingen effekt. Husk: fleksibelt marked = trivsel betyr mer.","kt":"","src":"Bok s. 224 (8.2.3) · Bok s. 225 (8.2.3)","e":1},{"id":"SB346","l":"L9","t":"Evidence: sustainability and value","f":"m","d":3,"p":"M","sc":"none","s":"What do Grewal, Serafeim and Yoon (2016) find about ESG shareholder proposals?","o":[["They have no effect","Incorrect: they do have an effect."],["They work even without a majority","Correct: they work even without a majority vote."],["They only work with majority support","Incorrect: a majority is not needed."],["All proposals add equal value","Incorrect: immaterial proposals can lower value."]],"c":[1],"es":"Forslagene virker selv uten flertall.","ed":"Grewal, Serafeim og Yoon finner at ESG-forslag fra aksjonærer forbedrer firmaets ytelse på temaet selv om de ikke får flertall. Men forslag om immaterielle issues kan senke verdien. Husk: forslag virker, men bare material ones skaper verdi.","kt":"","src":"Bok s. 225 (8.2.5) · Bok s. 226 (8.2.5)"},{"id":"SB347","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"H","sc":"none","s":"Which match of investment approach and goal is correct?","o":[["Exclusion: max F; integration: max I; impact: max S+E","Correct: exclusion max F, integration max I, impact max S+E."],["Exclusion: max S+E; integration: max F; impact: max I","Incorrect: the mapping is mixed up."],["Impact: max F; exclusion: max I","Incorrect: impact puts S and E first."],["All three maximise F","Incorrect: only traditional investing maximises F alone."]],"c":[0],"es":"Exclusion: maks F. Integration: maks I. Impact: maks S + E.","ed":"Koblingen til SF-trappen: exclusion (SF 1.0) maksimerer finansiell verdi med noen begrensninger, integration (SF 2.0) maksimerer integrated value (F + S + E), og impact investing (SF 3.0) maksimerer S + E med et minstekrav til F. Husk: F → I → S+E.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L9 slide 29 · Bok s. 212 (Table 8.1)"},{"id":"SB348","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about ESG approaches in equity investing is correct?","o":[["Ratings are the basis of impact investing","Incorrect: ratings are not available for impact investing."],["Exclusion picks only the best performers","Incorrect: exclusion keeps a very large universe."],["Impact investing looks at return first","Incorrect: impact comes first."],["Impact investing looks at products first","Correct: impact investing looks at products first."]],"c":[3],"es":"Impact investing ser på produktene først.","ed":"Impact investing ser først på hva firmaet selger (produkter og tjenester), og om det løser et samfunnsproblem. ESG-integrering ser mer på hvordan firmaet driver (operations). Husk: impact = hva du lager.","kt":"","src":"Bok s. 212 (Table 8.1)"},{"id":"SB349","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"H","sc":"none","s":"How well does ESG integration suit fundamental, quant and passive investing?","o":[["High, high, high","Incorrect: only fundamental investing can integrate ESG into valuation."],["Low, high, high","Incorrect: the order is reversed."],["High, low, none","Correct: high for fundamental, low for quant, none for passive."],["Medium, medium, medium","Incorrect: that describes exclusion, not integration."]],"c":[2],"es":"Fundamental: høy, quant: lav, passiv: ingen.","ed":"ESG integration betyr å legge ESG inn i verdsettelsen av hvert firma. Det krever fundamental analyse. Quant-investorer kan bruke ESG-data, men ikke firmaspesifikt skjønn. Passive fond følger bare indeksen. Husk: integrering krever analyse.","kt":"","src":"L9 slide 34-35 · Bok s. 228 (Table 8.3) · Bok s. 228 (8.3.1)"},{"id":"SB350","l":"L9","t":"ESG in portfolio management","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Quant investing looks backward at past patterns, so it struggles with big changes like rising carbon prices.","o":[["True","Correct. Quant relies on past patterns, so it struggles with big new changes like rising carbon prices."],["False","Incorrect. Quant relies on past patterns, so it struggles with big new changes like rising carbon prices."]],"c":[0],"es":"Sant. Quant bruker historikk og sliter med store skifter.","ed":"Quant-investering bygger på historiske sammenhenger i data. Store, nye endringer som karbonprising har ikke skjedd før, så modellene fanger dem dårlig. Quant kan likevel være et nyttig supplement (quantamental). Husk: fortiden er ikke fremtiden.","kt":"","src":"Bok s. 232 (8.3.1.2) · Bok s. 233 (8.3.1.2)"},{"id":"SB351","l":"L9","t":"ESG in portfolio management","f":"m","d":4,"p":"H","sc":"none","s":"A low-carbon index has about 50% lower emissions but tracks its benchmark closely. Why is it called a \"free option on carbon\"?","o":[["It carries no risk","Incorrect: it still carries market risk."],["It wins once carbon is priced","Correct: it tracks the market now and wins once carbon is priced."],["It wins from day one","Incorrect: the gain is expected later."],["Investors get free carbon credits","Incorrect: it is a metaphor, not a contract."]],"c":[1],"es":"Den følger markedet nå, og vinner når karbon blir priset.","ed":"En lavkarbonindeks har halvparten så høye utslipp, men følger referanseindeksen tett. Så lenge karbon ikke prises, gir den omtrent markedsavkastning. Når karbon prises, gjør den det bedre. Som en gratis opsjon: lite å tape, mulig gevinst. Husk: free option on carbon.","kt":"","src":"Bok s. 233 (Box 8.2) · Bok s. 233 (8.3.1.3) · Bok s. 234 (8.3.1.3)"},{"id":"SB352","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A fund only uses negative screening but calls itself \"fully ESG integrated\". What is the best critique?","o":[["Exclusion is not valuation","Correct: exclusion is not valuation."],["Exclusion always gives the best returns","Incorrect: integration is seen as more useful."],["Screening is the best form of integration","Incorrect: exclusion is SF 1.0."],["They are the same thing","Incorrect: they are different."]],"c":[0],"es":"Å utelukke er ikke å verdsette. Integrering krever ESG i analysen.","ed":"Negative screening fjerner selskaper fra universet, men endrer ikke hvordan de andre verdsettes. ESG integration betyr at ESG påvirker prognoser, value drivers eller diskonteringsrente. Fondets påstand er derfor misvisende. Husk: exclusion ≠ integration.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"ESG integration: explicit consideration of material ESG factors alongside financial factors in valuing and selecting securities.","src":"L9 slide 31 · L9 slide 37 · Bok s. 228 (8.3.1.1)"},{"id":"SB353","l":"L9","t":"Engagement and divestment","f":"m","d":3,"p":"M","sc":"none","s":"What is the \"washing machine\" strategy (Gollier and Pouget, 2014)?","o":[["Relabelling normal funds as ESG","Incorrect: it is about transforming firms, not relabelling funds."],["Money laundering through green loans","Incorrect: not related."],["Buying and fixing bad firms","Correct: buy bad firms and fix them."],["Selling brown stocks for green bonds","Incorrect: that is divestment."]],"c":[2],"es":"Kjøp dårlige firmaer og gjør dem bedre.","ed":"Gollier og Pouget beskriver en \"washing machine\": en stor aktivistisk investor kjøper aksjer i dårlige firmaer, presser dem til å forbedre seg og tjener på verdiøkningen. Det gir mer endring enn å selge. Husk: washing machine = kjøp og forbedre.","kt":"","src":"L9 slide 32 · L9 slide 33"},{"id":"SB354","l":"L9","t":"Engagement and divestment","f":"t","d":4,"p":"H","sc":"none","s":"True or false: Energy firms with low ESG scores, often excluded by ESG funds, produce many high-quality green patents (Cohen, Gurun and Nguyen, 2020).","o":[["True","Correct. Low-ESG energy firms produce many high-quality green patents: the ESG-innovation disconnect."],["False","Incorrect. Low-ESG energy firms produce many high-quality green patents: the ESG-innovation disconnect."]],"c":[0],"es":"Sant. Energiselskaper med lav ESG lager mange grønne patenter.","ed":"Cohen, Gurun og Nguyen finner at energifirmaer med lav ESG-score, som ofte utelukkes av ESG-fond, står bak mange gode grønne patenter. ESG-fond kan dermed gå glipp av viktige innovatører. Husk: ESG-innovation disconnect.","kt":"","src":"L9 slide 33 · L8 slide 58"},{"id":"SB355","l":"L9","t":"Impact investing","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the GIIN's four features of impact investing?","o":[["Only private equity counts","Incorrect: impact investing spans all asset classes."],["Measuring impact","Correct: measuring impact is one of the four features."],["Returns must be below market","Incorrect: returns can be below or at market."],["Investments must be rated AAA","Incorrect: an AAA rating is not a criterion."]],"c":[1],"es":"Å måle impact er en av GIIN-kravene.","ed":"GIIN definerer impact investing med fire kjennetegn: intentionality (bevisst mål om impact), financial return (forventer avkastning), range of returns and asset classes (fra under til markedsavkastning, alle aktivaklasser) og impact measurement (måle effekten). Husk: intention + return + measurement.\n\nForkortelser: GIIN = Global Impact Investing Network.","kt":"","src":"L9 slide 36 · Bok s. 235 (8.4) · Bok s. 236 (8.4) · Bok s. 237 (8.4.3)"},{"id":"SB356","l":"L9","t":"Impact investing","f":"m","d":4,"p":"M","sc":"none","s":"Why can listed impact investing still give market-level returns?","o":[["Governments guarantee returns","Incorrect: there are no guarantees."],["SDG trends help their growth","Correct: SDG trends support their growth."],["Impact stocks are always cheap","Incorrect: not the argument."],["They take more risk","Incorrect: the argument is about value drivers."]],"c":[1],"es":"SDG-trender gir vekst, så avkastningen kan være på markedsnivå.","ed":"Schramade finner at børsnoterte firmaer med positiv impact ofte har sterkere value drivers, fordi SDG-trender (helse, ren energi) gir vekst. Derfor kan listed impact investing gi markedsavkastning. Husk: impact kan gi vekst.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger).","kt":"","src":"Bok s. 237 (8.4.2) · Bok s. 238 (Figure 8.5) · Bok s. 239 (8.4.4) · Bok s. 240 (Table 8.5)"},{"id":"SB357","l":"L9","t":"Impact investing","f":"m","d":3,"p":"L","sc":"none","s":"Which impact dimension asks how the effect compares with what would have happened anyway?","o":[["Contribution","Correct: contribution compares with what would have happened anyway."],["Who","Incorrect: \"who\" is about who gets the effect."],["Risk","Incorrect: \"risk\" is the chance the impact differs."],["How much (scale and duration)","Incorrect: \"how much\" is about scale and duration."]],"c":[0],"es":"Contribution = hva hadde skjedd uansett (additionality).","ed":"Impact Management Project har fem dimensjoner: what, who, how much, contribution og risk. Contribution spør om effekten skjer på grunn av investeringen, eller om den ville skjedd uansett (additionality). Husk: contribution = counterfactual.","kt":"","src":"Bok s. 239 (8.4.4) · Bok s. 240 (Figure 8.6)","e":1},{"id":"SB358","l":"L9","t":"ESG integration in valuation","f":"t","d":3,"p":"H","sc":"extended_course_case","s":"True or false: Novozymes' enzymes cut customers' energy use. Using VDA, an analyst would set its growth and margins above the industry average.","o":[["True","Correct. Novozymes grows faster and earns higher margins than the industry, and VDA makes this explicit."],["False","Incorrect. Novozymes grows faster and earns higher margins than the industry, and VDA makes this explicit."]],"c":[0],"es":"Sant. Novozymes vokser og tjener mer enn bransjen, så VDA justerer opp.","ed":"Novozymes sine enzymer sparer kundene for energi og kjemikalier, og firmaet vokser omtrent dobbelt så raskt med dobbelt så høy margin som kjemibransjen. Med VDA legger analytikeren dette inn som høyere vekst og margin. Husk: positiv impact → sterkere drivere.\n\nForkortelser: VDA = Value Driver Adjustment (justere value drivers for ESG).","kt":"Value driver adjustment (VDA): adjusting growth, margin or cost-of-capital assumptions to reflect a company's competitive (dis)advantage on material ESG issues.","src":"Bok s. 230 (8.3.1.1) · Bok s. 122 (Box 5.2)"},{"id":"SB359","l":"L9","t":"Barriers to ESG integration","f":"m","d":2,"p":"M","sc":"none","s":"Why do ESG issues get too little attention in investment cases (CFA Institute, 2015)?","o":[["Short investor horizons","Correct: short investor horizons push ESG aside."],["ESG never affects results","Incorrect: ESG can make or break business models."],["ESG data are boring","Incorrect: the problem is poor data."],["ESG is banned in valuations","Incorrect: ESG is not banned."]],"c":[0],"es":"Korte investorhorisonter gjør at ESG får lite oppmerksomhet.","ed":"CFA Institute gir tre grunner til at ESG får lite plass i investeringscaser: korte investorhorisonter, dårlige og lite standardiserte data, og at det er vanskelig å koble ESG til verdien. Husk: short-termism er én hovedgrunn.","kt":"","src":"Bok s. 227 (8.3) · Bok s. 228 (8.3.1.1)"},{"id":"SB360","l":"L9","t":"ESG integration synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"An analyst thinks a utility's renewable assets give it a lasting cost edge, and that carbon prices will rise. How should she show this?","o":[["Cut the discount rate a lot","Incorrect: this mixes up risk and expected return."],["Assume past green returns will repeat","Incorrect: past green returns came from surprises."],["Adjust value drivers","Correct: show it through the value drivers."],["Exclude the utility","Incorrect: exclusion ignores the advantage she found."]],"c":[2],"es":"Vis det gjennom value drivers.","ed":"Et varig kostnadsfortrinn og stigende karbonpris påvirker fremtidige marginer og vekst. Det skal inn i value drivers. Å senke diskonteringsrenten blander risiko og forventet avkastning, og historisk grønn avkastning var overraskelser. Husk: fortrinn → value drivers.","kt":"","src":"L9 slide 3-10 · L9 slide 14-18 · L9 slide 20 · Bok s. 230 (8.3.1.1)"},{"id":"SB361","l":"L9","t":"ESG integration synthesis","f":"m","d":3,"p":"L","sc":"none","s":"The NorSIF guide to ESG valuation adds something beyond cash flows and the cost of capital. What?","o":[["Past \"sins\"","Correct: past \"sins\" (old liabilities) are added."],["A ban on scenarios","Incorrect: scenarios are a chapter in the guide."],["A buy list","Incorrect: it is a method guide, not a stock list."],["Using only P/E multiples","Incorrect: the guide focuses on DCF-type valuation."]],"c":[0],"es":"NorSIF legger til tidligere \"sins\" (fortidens synder).","ed":"NorSIF-guiden om ESG-verdsettelse ser på mer enn kontantstrøm og kapitalkostnad. Den tar med tidligere \"synder\" (gamle forpliktelser som kan gi søksmål og kostnader), scenarioer og opsjonalitet. Husk: fortiden kan koste.\n\nForkortelser: DCF = Discounted Cash Flow (verdsettelse ved å diskontere fremtidige kontantstrømmer).","kt":"","src":"L9 slide 11"},{"id":"SB362","l":"L9","t":"Equity basics","f":"m","d":2,"p":"M","sc":"none","s":"Why does sustainability matter more to equity investors than to most other investors?","o":[["They are liable for company debts","Incorrect: limited liability caps their loss."],["Equity has a fixed return","Incorrect: a fixed return describes debt."],["They are residual claimants","Correct: they are residual claimants and bear most of the risk."],["Only they read sustainability reports","Incorrect: not the argument."]],"c":[2],"es":"Eierne er residual claimants og får mest av risikoen.","ed":"Aksjonærer får betalt sist (residual claimants), etter långivere og andre. Derfor tar de det første tapet hvis ESG-problemer skader firmaet, og de får hele oppsiden hvis bærekraft gir vekst. Husk: equity = mest eksponert.","kt":"","src":"Bok s. 211 (Overview) · Bok s. 215 (8.1.2)"},{"id":"TR39","l":"L9","t":"ESG integration in valuation","f":"t","d":3,"p":"H","sc":"none","s":"True or false: The lecturer recommends putting ESG mainly into the cash flows, not the WACC, because the evidence on ESG and the cost of capital is unclear.","o":[["True","Correct. ESG clearly affects cash flows, while its effect on the WACC is still debated."],["False","Incorrect. ESG clearly affects cash flows, while its effect on the WACC is still debated."]],"c":[0],"es":"Sant. ESG påvirker klart cash flows. Effekten på WACC er uklar.","ed":"Foreleseren anbefaler å legge ESG inn i kontantstrømmene (inntekter, kostnader, investeringer), fordi effekten der er tydelig. Om ESG senker kapitalkostnaden er uklart i forskningen. Husk: ESG i cash flows, ikke i WACC.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad).","kt":"","src":"Opptak L9 ca. 16 min · Opptak L9 ca. 36 min · Opptak L9 ca. 69 min"},{"id":"TR40","l":"L9","t":"Stranded assets","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"A German coal plant built for 40 years must close after 20 because of a new law. What kind of stranded asset is this?","o":[["Not stranded at all","Incorrect: it loses value, so it is stranded."],["Physical-risk stranded","Incorrect: physical risk would be e.g. a flood."],["A gain for the firm","Incorrect: losing 20 years of cash flow is a loss."],["Transition-risk stranded","Correct: a policy change cut its life: transition-risk stranded."]],"c":[3],"es":"Ny lov kuttet levetiden = transition-risk stranded.","ed":"Kullkraftverket mister 20 års kontantstrøm fordi en ny lov stenger det tidligere. Det er et stranded asset, og årsaken er politikk, altså transition risk. Hvis en flom hadde ødelagt det, ville det vært physical risk. Husk: lov = transition.","kt":"","src":"Opptak L9 ca. 10 min"},{"id":"TR41","l":"L9","t":"Relative valuation","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"An analyst values Oatly using the P/E of Alpro, which sells soy, almond and oat drinks. Why does the course question this?","o":[["Alpro does not sell dairy alternatives","Incorrect: Alpro is a natural peer for dairy alternatives."],["Peers are never used","Incorrect: relative valuation uses peers."],["P/E cannot be used for food firms","Incorrect: the issue is peer choice."],["Different sustainability risks","Correct: the two firms have different sustainability risks."]],"c":[3],"es":"Alpro har andre bærekraftsrisikoer, så P/E kan ikke sammenlignes.","ed":"Multiples forutsetter at sammenlignbare firmaer har like risikoer og utsikter. Alpro selger flere typer plantedrikker med andre råvarer og andre bærekraftsrisikoer enn Oatly. Da kan P/E-en gi feil verdi. Husk: peers må ha lik material eksponering.","kt":"","src":"Opptak L9 ca. 14 min"},{"id":"TR42","l":"L9","t":"ESG as a risk factor","f":"m","d":4,"p":"H","sc":"none","s":"Why does the lecturer doubt that child labour risk can be a priced risk factor, while she is less sure about climate change?","o":[["Factors only exist for bonds, not equities","Incorrect: factor models are mainly for equities."],["Child labour is a governance issue, and only E issues are priced","Incorrect: the argument is about diversification, not E/S/G."],["Child labour risk is diversifiable; climate risk may not be","Correct: child labour risk can be diversified away; climate risk may not."],["Climate change has no effect on asset prices","Incorrect: climate change can affect prices."]],"c":[2],"es":"Barnearbeid kan diversifiseres bort. Klima rammer alle og kan være systematisk.","ed":"Bare systematisk risiko (som ikke kan diversifiseres bort) gir en risikopremie. Barnearbeid rammer noen få firmaer, så risikoen forsvinner i en bred portefølje. Klimaendringer kan ramme alle firmaer samtidig, så det kan være systematisk. Husk: bare systematisk risiko prises.","kt":"","src":"Opptak L9 ca. 59 min · Opptak L9 ca. 68 min"},{"id":"TR43","l":"L9","t":"Exclusion vs engagement","f":"m","d":3,"p":"M","sc":"none","s":"Oil and gas firms are among the biggest filers of green patents. What does this support?","o":[["Oil firms are green firms","Incorrect: patents do not erase current emissions."],["Exclusion may miss innovators","Correct: exclusion may miss important innovators."],["Oil firms have no transition risk","Incorrect: they still face trans
