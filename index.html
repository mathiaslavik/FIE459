:[2],"es":"Friedman har rett når aktiviteten kan skilles ut, som veldedighet. Eierne kan gi selv.","ed":"Husk: separable = Friedman ok. Non-separable = Friedman feil.","kt":"","src":"Hart & Zingales s. 3-4 · L4 slide 31"},{"id":"SB128","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Hart and Zingales agree with Friedman that externalities should be left entirely to the government.","o":[["True","Feil. Hart og Zingales mener staten ikke alltid løser externalities godt nok."],["False","Riktig. Hart og Zingales mener staten ikke alltid løser externalities godt nok."]],"c":[1],"es":"Usant. De stoler ikke på at staten løser alt.","ed":"Husk: politikken er treg og ufullstendig.","kt":"","src":"Hart & Zingales s. 4 · Bok s. 44 (2.1.1)"},{"id":"SB129","l":"L4","t":"Shareholder welfare","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A firm can choose a clean method that is slightly less profitable. Under Hart and Zingales, when should it choose it?","o":[["Never; only market value matters","Feil: det er market value-synet de kritiserer."],["Always, whatever shareholders want","Feil: det avhenger av hva eierne vil."],["When owners care more about the harm","Riktig: eiernes preferanser avgjør."],["Only if the law says it must","Feil: firmaet bør følge eierne selv uten lov."]],"c":[2],"es":"Velg det rene når eierne bryr seg nok om skaden.","ed":"Husk: følg eiernes preferanser.","kt":"Shareholder welfare maximisation: firms maximise what shareholders care about, including non-financial (social) preferences, not only market value.","src":"L4 slide 31 · Hart & Zingales s. 8"},{"id":"SB130","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":4,"p":"M","sc":"none","s":"What causes the \"amoral drift\" in Hart and Zingales?","o":[["Owners sell to a bidder who pollutes","Riktig: eiere selger til en forurenser."],["Regulators relax laws after lobbying","Feil: lobbying er en annen mekanisme."],["Managers slowly lose their moral values","Feil: det handler om takeover, ikke personlig moral."],["Shareholders sell to green investors","Feil: driften går mot skittent, ikke grønt."]],"c":[0],"es":"Hver eier tjener på å selge til en bud-giver som forurenser. Firmaet glir mot \"skittent\".","ed":"Husk: amoral drift = takeover-problem, ikke dårlig moral.","kt":"","src":"Hart & Zingales s. 10-11 · Hart & Zingales s. 13-14 · Bok s. 86 (Box 3.2)"},{"id":"SB131","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":4,"p":"M","sc":"none","s":"True or false: In Hart and Zingales, a prosocial investor may vote for the clean option in one firm but still hold shares in a dirty firm, because she only cares about decisions she feels responsible for.","o":[["True","Riktig. Modellen sier folk vekter samfunnet bare når de føler seg ansvarlige."],["False","Feil. Modellen sier folk vekter samfunnet bare når de føler seg ansvarlige."]],"c":[0],"es":"Sant. Hun bryr seg bare om valg hun føler ansvar for, som når hun stemmer.","ed":"Husk: ansvar føles ved stemmegivning, ikke ved å bare eie.","kt":"","src":"Hart & Zingales s. 4-5 · Hart & Zingales s. 7-8"},{"id":"SB132","l":"L4","t":"Grow the pie","f":"m","d":2,"p":"H","sc":"none","s":"Edmans' \"grow the pie\" view says that:","o":[["Shareholders and stakeholders always conflict","Feil: det er pie-splitting, som Edmans avviser."],["Shareholders should vote on every decision","Feil: stemmegivning er Hart og Zingales."],["Purpose does not matter for firm value","Feil: for Edmans er purpose sentralt."],["Firms can grow total value for all","Riktig: kaken kan bli større for alle."]],"c":[3],"es":"Grow the pie: firmaer kan øke den totale verdien for alle.","ed":"Husk: grow, ikke split.","kt":"","src":"L4 slide 30-31"},{"id":"SB133","l":"L4","t":"Purpose of the firm","f":"m","d":4,"p":"H","sc":"none","s":"How does Edmans (\"grow the pie\") differ from Hart and Zingales?","o":[["Both ignore shareholders' preferences","Feil: H&Z bryr seg nettopp om eiernes preferanser."],["Both are the same as Friedman","Feil: begge avviker fra Friedman."],["Edmans focuses on growing total value","Riktig: Edmans handler om å øke kaken."],["Hart and Zingales want market value only","Feil: H&Z vil ha welfare, ikke bare market value."]],"c":[2],"es":"Edmans fokuserer på å øke total verdi. Hart og Zingales fokuserer på eiernes preferanser.","ed":"Husk: Edmans = grow the pie. H&Z = shareholder welfare.","kt":"","src":"L4 slide 30-32 · Hart & Zingales s. 1"},{"id":"SB134","l":"L4","t":"Shareholder vs stakeholder","f":"m","d":4,"p":"H","sc":"short","s":"Hedge fund Engine No. 1, owning about 0.02% of ExxonMobil, won three board seats with support from BlackRock, Vanguard and State Street. What does this show?","o":[["Owners used votes to push climate strategy","Riktig: eierne brukte stemmene sine."],["Only majority owners can change the board","Feil: en liten eier vant."],["Passive investors never vote against managers","Feil: de store indeksfondene stemte mot ledelsen."],["Climate does not affect firm value","Feil: kampanjen handlet om langsiktig verdi."]],"c":[0],"es":"Små eiere vant med støtte fra store fond. Eiere brukte stemmer for klimastrategi.","ed":"Husk: voice gjennom stemmer kan endre styret.","kt":"Shareholder welfare (Hart and Zingales): firms should maximise shareholders' welfare, which can include their social preferences, not just market value.","src":"L4 slide 31 · Hart & Zingales s. 2"},{"id":"SB135","l":"L4","t":"Klarna AI case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Klarna replaced many customer service workers with AI. In 2025 the CEO said \"we went too far\" and started rehiring. What is the lesson?","o":[["Employees do not matter for listed firms","Feil: ansatte og kunder påvirker verdien."],["Using AI instead of workers is always wrong","Feil: forelesningen sier det er en avveining."],["Cost cuts hurt customers, which hurt value","Riktig: dårligere service skadet verdien."],["Cost cuts never affect customers","Feil: rehiring viser at kundene ble rammet."]],"c":[2],"es":"Kostnadskutt skadet kundeservicen, og det skadet verdien.","ed":"Husk: stakeholders påvirker firmaverdien.","kt":"","src":"L4 slide 28-29 · L4 slide 31"},{"id":"SB136","l":"L4","t":"Stakeholders: employees","f":"m","d":3,"p":"M","sc":"none","s":"In an experiment, job applicants bid for the same job at a firm with or without CSR. What was found?","o":[["They wanted higher pay at the CSR firm","Feil: de krevde lavere lønn, ikke høyere."],["They accepted lower pay at the CSR firm","Riktig: lavere bud hos CSR-firmaet."],["They refused to apply to the CSR firm","Feil: de søkte på begge."],["CSR made no difference","Feil: forskjellen var signifikant."]],"c":[1],"es":"Søkerne godtok lavere lønn hos CSR-firmaet.","ed":"Husk: CSR kan senke lønnskostnadene.","kt":"","src":"L4 slide 34-37 · L6 slide 23"},{"id":"SB137","l":"L4","t":"Stakeholders: supply chains","f":"m","d":2,"p":"M","sc":"extended_course_case","s":"Why did Nestlé stop buying Brazilian soybeans from Cargill?","o":[["Brazil banned soy exports","Feil: det fantes ikke et slikt forbud."],["Cargill's soy became too expensive","Feil: grunnen var sporbarhet, ikke pris."],["The soy could not be traced","Riktig: soyaen kunne ikke spores."],["Nestlé stopped using soy for health reasons","Feil: det handlet om avskoging, ikke helse."]],"c":[2],"es":"Soyaen kunne ikke spores, så det var risiko for avskoging.","ed":"Husk: supply chain-risiko.","kt":"","src":"L4 slide 38 · L4 slide 44 · L5 slide 3-5"},{"id":"SB138","l":"L4","t":"Stakeholders: supply chains","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Bisetti et al. (2024) find that US firms cut imports from foreign suppliers by about 30% after environmental or social incidents at those suppliers.","o":[["True","Riktig. Studien viser ca. 30 % kutt i import etter slike hendelser."],["False","Feil. Studien viser ca. 30 % kutt i import etter slike hendelser."]],"c":[0],"es":"Sant. Amerikanske firmaer kuttet import med ca. 30 % etter E&S-hendelser.","ed":"Husk: kunder straffer dårlige leverandører.","kt":"","src":"L4 slide 40-41"},{"id":"SB139","l":"L4","t":"Stakeholders: supply chains","f":"m","d":3,"p":"M","sc":"none","s":"What happens when suppliers are hit by extreme heat?","o":[["Suppliers and customers both earn less","Riktig: både leverandører og kunder tjener mindre."],["Heat has no effect","Feil: hete har effekt."],["Customers gain from lower input prices","Feil: kundene taper."],["Only farms are affected","Feil: kundene rammes også."]],"c":[0],"es":"Hete rammer leverandøren, og skaden sprer seg til kundene.","ed":"Husk: physical risk sprer seg i supply chain.","kt":"","src":"L4 slide 40 · Fondsfinans s. 38"},{"id":"SB140","l":"L4","t":"Human rights due diligence","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A Norwegian sportswear firm buys from a region with reports of forced labour. Under the Norwegian Transparency Act, what must it do?","o":[["Stop buying from the whole country at once","Feil: exit er ett valg, ikke automatisk."],["Map the risks, act on them and report","Riktig: kartlegg risiko, handle og rapporter."],["Only report suppliers' credit ratings","Feil: loven gjelder menneskerettigheter."],["Nothing, since the suppliers are foreign","Feil: utenlandske leverandører er med."]],"c":[1],"es":"Åpenhetsloven krever due diligence: kartlegg, handle, rapporter.","ed":"Husk: due diligence gjelder hele leverandørkjeden.","kt":"Human rights due diligence: identify, prevent, mitigate and account for adverse human rights impacts in own operations and value chains (UN Guiding Principles).","src":"L4 slide 44"},{"id":"SB141","l":"L4","t":"Corporate objectives","f":"m","d":3,"p":"M","sc":"short","s":"European executives see ESG as part of the firm's goal more often than US executives. Why?","o":[["US firms face no ESG risks","Feil: amerikanske firmaer har samme risiko."],["Europe's stakeholder model","Riktig: Europas stakeholder-modell."],["European firms may not maximise profits","Feil: det finnes ikke et slikt forbud."],["Views have no link to governance","Feil: governance og kultur betyr mye."]],"c":[1],"es":"Europa har en stakeholder-modell, så ledere ser ESG som en del av målet.","ed":"Husk: institusjoner former holdninger.","kt":"Shareholder model vs stakeholder model: corporate governance focused on owners' value vs balancing the interests of several stakeholder groups.","src":"L4 slide 26-27 · Starks s. 1840 · Bok s. 362 (12.3.1)"},{"id":"SB142","l":"L4","t":"Refined shareholder value","f":"m","d":3,"p":"H","sc":"none","s":"What do Mehrotra and Morck (2017) say about Jensen's \"enlightened value maximisation\"?","o":[["It is flawed, but maybe the least bad option","Riktig: feil, men minst dårlig."],["It is the same as SF 3.0","Feil: refined shareholder value er SF 1.0."],["It should be replaced by stakeholder welfare","Feil: de mener flere mål blir umulige å måle."],["It solves all conflicts perfectly","Feil: den løser ikke alle konflikter."]],"c":[0],"es":"Den har feil, men er kanskje det minst dårlige alternativet.","ed":"Husk: \"least bad\".","kt":"","src":"Bok s. 81 (3.2.2) · Bok s. 82 (3.2.2) · L5 slide 27"},{"id":"SB143","l":"L4","t":"Shareholder model challenges","f":"m","d":3,"p":"H","sc":"none","s":"Which is one of the challenges to the shareholder model in the textbook?","o":[["Shareholders pay for all damage","Feil: eierne har limited liability."],["Business ethics problems","Riktig: etiske problemer er en utfordring."],["It leads to too much long-term investment","Feil: bekymringen er for lite langsiktighet."],["Shareholders are paid first","Feil: eierne får betalt sist."]],"c":[1],"es":"Business ethics problems er en av utfordringene til shareholder-modellen.","ed":"Husk: etikk er \"siste forsvarslinje\".","kt":"","src":"Bok s. 80 (3.2.1) · Bok s. 81 (3.2.1) · L5 slide 24"},{"id":"SB144","l":"L4","t":"Stakeholder model","f":"m","d":4,"p":"L","sc":"none","s":"According to Magill, Quinzii and Rochet (2015), what goes wrong when large firms maximise shareholder value?","o":[["They spend too much on safety","Feil: modellen sier for lite på sikkerhet."],["Competition removes all externalities","Feil: externalities består."],["They take too little risk","Feil: problemet er ikke eiernes risiko."],["Risks to workers are ignored","Riktig: risiko for arbeidere blir ignorert."]],"c":[3],"es":"Eierne tar ikke hensyn til risiko for arbeidere og kunder.","ed":"Husk: externalities på stakeholders.","kt":"","src":"Bok s. 82 (3.2.3)"},{"id":"SB145","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":5,"p":"M","sc":"constructed_scenario","s":"An index fund always votes for the most profitable option, though many of its clients want firms to avoid harmful activities. What would Hart and Zingales recommend?","o":[["Ask its investors and vote as they prefer","Riktig: følg kundenes preferanser."],["Keep voting for the most profitable option","Feil: det kaller H&Z en feil som gir amoral drift."],["Sell all harmful firms","Feil: hos H&Z er stemmegivning kanalen, ikke salg."],["Let managers decide all votes","Feil: da forsvinner eiernes preferanser."]],"c":[0],"es":"Spør investorene og stem slik de ønsker.","ed":"Husk: H&Z = la eiernes preferanser styre stemmene.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 11-12 · Bok s. 86 (3.3.1) · L8 slide 71"},{"id":"SB146","l":"L4","t":"Business Roundtable statement","f":"t","d":3,"p":"M","sc":"none","s":"True or false: One criticism of the Business Roundtable statement is that some signers are big lenders to fossil fuel projects.","o":[["True","Riktig. Kritikerne pekte på at noen underskrivere finansierer mye fossilt."],["False","Feil. Kritikerne pekte på at noen underskrivere finansierer mye fossilt."]],"c":[0],"es":"Sant. Kritikere sier at noen underskrivere låner ut mye til fossile prosjekter.","ed":"Husk: ord vs handling.","kt":"","src":"L4 slide 14-16 · L11 slide 32"},{"id":"SB147","l":"L4","t":"Shareholder theory","f":"m","d":2,"p":"M","sc":"none","s":"Shareholders are called \"residual claimants\" because:","o":[["They have no right to any cash flows","Feil: de har rett til restverdien."],["They get a fixed return","Feil: fast avkastning er gjeld."],["They are paid last","Riktig: de får betalt sist."],["They are paid before creditors","Feil: kreditorer får betalt først."]],"c":[2],"es":"Residual claimants får det som er igjen, altså betalt sist.","ed":"Husk: eierne får restene etter alle andre.","kt":"","src":"Bok s. 80 (3.2.1)"},{"id":"SB148","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":3,"p":"H","sc":"none","s":"How does the corporate goal debate match the SF stages?","o":[["Shareholder SF 1.0; stakeholder SF 2.0","Riktig: shareholder SF 1.0, stakeholder SF 2.0."],["All the stages are the same in practice","Feil: stadiene er ulike."],["Stakeholder value = SF 1.0","Feil: stakeholder value er SF 2.0."],["Shareholder value = SF 3.0","Feil: ren shareholder value er finance as usual."]],"c":[0],"es":"Shareholder = SF 1.0, stakeholder = SF 2.0.","ed":"Husk: shareholder ↔ 1.0, stakeholder ↔ 2.0.","kt":"","src":"Bok s. 82 (3.2.2) · Bok s. 83 (3.2.3) · L5 slide 27-28"},{"id":"SB149","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":4,"p":"L","sc":"none","s":"True or false: According to Hart and Zingales, a founder who wants her firm to stay \"clean\" after listing should make hostile takeovers easy.","o":[["True","Feil. Enkle takeovers gir amoral drift mot skittent. Hun bør gjøre dem vanskeligere."],["False","Riktig. Enkle takeovers gir amoral drift mot skittent. Hun bør gjøre dem vanskeligere."]],"c":[1],"es":"Usant. Enkle takeovers hjelper \"skittent\". For å beskytte \"rent\" må hun gjøre takeovers vanskelige.","ed":"Husk: lett takeover = amoral drift.","kt":"","src":"Hart & Zingales s. 13-14 · L5 slide 19 · Bok s. 85 (3.3.1)"},{"id":"SB150","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Kraft Heinz tried to buy Unilever in 2017. How does the textbook see this failed takeover?","o":[["As SF 3.0 impact investing","Feil: Kraft Heinz er shareholder-modellen."],["As a clash between SF 1.0 and SF 2.0","Riktig: SF 1.0 mot SF 2.0."],["As proof that hostile takeovers always win","Feil: budet ble trukket."],["As a merger of two equal firms","Feil: de var veldig ulike firmaer."]],"c":[1],"es":"Kraft Heinz (SF 1.0) mot Unilever (SF 2.0).","ed":"Husk: shareholder-modell mot stakeholder-modell.","kt":"","src":"Bok s. 85 (3.3.1) · Bok s. 86 (Box 3.2) · Hart & Zingales s. 11"},{"id":"SB151","l":"L4","t":"Shareholder vs stakeholder model","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook suggests approving a merger only if the combined firm's integrated value (F + S + E) is higher than for the two firms alone.","o":[["True","Riktig. Læreboka foreslår å godkjenne en fusjon bare hvis integrated value øker."],["False","Feil. Læreboka foreslår å godkjenne en fusjon bare hvis integrated value øker."]],"c":[0],"es":"Sant. Fusjon bare hvis F + S + E blir høyere samlet.","ed":"Husk: integrated value-test for fusjoner.","kt":"","src":"Bok s. 85 (3.3.1) · Bok s. 86 (3.3.1)"},{"id":"SB152","l":"L4","t":"Purpose of the firm","f":"m","d":5,"p":"M","sc":"none","s":"\"On whose behalf should a company be run?\" Which answer fits the theories in the course?","o":[["For shareholders and their values","Riktig: eierne og deres verdier."],["It does not matter, since only owners are affected","Feil: beslutninger påvirker mange."],["The law allows only one party","Feil: business judgment rule tillater mer."],["Shareholder value always helps everyone","Feil: externalities gjør at det ikke skjer automatisk."]],"c":[0],"es":"Firmaet drives for eierne, inkludert deres verdier.","ed":"Husk: shareholder welfare inkluderer verdier.","kt":"","src":"L4 slide 4-5 · L4 slide 20-21 · L4 slide 31 · L4 slide 19"},{"id":"SB153","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":3,"p":"M","sc":"none","s":"Why do firms in civil law countries tend to have higher ESG scores (Liang and Renneboog, 2017)?","o":[["They have more takeovers","Feil: takeovers er typisk for common law."],["Rating agencies favour them","Feil: forklaringen er rettssystemet."],["Common law countries ban ESG reports","Feil: det finnes ikke et slikt forbud."],["It is more stakeholder-oriented","Riktig: mer stakeholder-orientert."]],"c":[3],"es":"Civil law-land er mer stakeholder-orientert, så ESG-score blir høyere.","ed":"Husk: civil law = stakeholder. Common law = shareholder.","kt":"","src":"Bok s. 84 (3.3) · Bok s. 85 (3.3) · Starks s. 1849-1851"},{"id":"SB154","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":3,"p":"L","sc":"none","s":"Many shareholders own diversified portfolios. What concern does Hart and Zingales' review raise about this?","o":[["They never vote","Feil: ikke bekymringen."],["They always want high wages","Feil: det gjelder eiere som også er ansatte."],["Firms may act like one monopoly","Riktig: felles eiere kan gi monopol-atferd."],["Firms must invest only in clean tech","Feil: ikke argumentet."]],"c":[2],"es":"Med felles eiere kan firmaer oppføre seg som ett monopol.","ed":"Husk: common ownership kan svekke konkurransen.","kt":"","src":"Hart & Zingales s. 5-6"},{"id":"SB155","l":"L4","t":"Purpose","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: In Edmans' view, a firm that raises profits by paying suppliers too little is creating value.","o":[["True","Feil. Å betale leverandørene for lite flytter verdi, det skaper ikke ny verdi."],["False","Riktig. Å betale leverandørene for lite flytter verdi, det skaper ikke ny verdi."]],"c":[1],"es":"Usant. Å presse leverandører er å dele kaken annerledes, ikke gjøre den større.","ed":"Husk: split ≠ grow.","kt":"Pie-growing mentality (Edmans): create value for society through excellence, and profits follow as a by-product; pie-splitting takes value from one stakeholder to give it to another.","src":"L4 slide 30-31"},{"id":"TR13","l":"L4","t":"Shareholder vs stakeholder value","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Two manufacturers merge in a country with strong job protection, so closing plants is costly. How does the market react?","o":[["No reaction","Feil: arbeidsvern påvirker kostnaden."],["Higher returns; faster approval","Feil: godkjenningstid er ikke mekanismen."],["Lower returns; layoffs are harder","Riktig: lavere avkastning, vanskeligere oppsigelser."],["Higher returns; workers are more productive","Feil: bevisene viser lavere avkastning."]],"c":[2],"es":"Sterkt stillingsvern gjør kutt dyre, så markedet reagerer negativt.","ed":"Husk: stakeholder-beskyttelse kan senke synergier.","kt":"","src":"Opptak L4 ca. 33 min"},{"id":"TR14","l":"L4","t":"Critique of stakeholderism","f":"m","d":4,"p":"H","sc":"none","s":"Managers give some workers better contracts so they help block a takeover. Which criticism of stakeholderism does this show?","o":[["It requires CSRD reporting","Feil: rapporteringsregler er ikke relevante."],["It can shield managers","Riktig: det skjermer ledelsen."],["It forces a short-term focus","Feil: det handler om å motstå eierne."],["It makes takeovers more likely","Feil: ansatte hjelper å stoppe takeover."]],"c":[1],"es":"Ledere bruker ansatte som allierte for å beskytte egen jobb.","ed":"Husk: stakeholderism kan skjerme ledere.","kt":"","src":"Opptak L4 ca. 32 min"},{"id":"TR15","l":"L4","t":"Conflicts among stakeholders","f":"m","d":3,"p":"M","sc":"short","s":"A price cartel is broken up. Consumers gain, but the firms then lay off workers. What does this show?","o":[["Shareholders always pay the full cost","Feil: arbeiderne betalte mye."],["Antitrust does not affect workers","Feil: oppsigelser fulgte."],["Consumers and workers always gain together","Feil: interessene gikk i hver sin retning."],["Stakeholder interests can conflict","Riktig: interessene krasjer."]],"c":[3],"es":"Kundene vinner, de ansatte taper. Stakeholder-interesser kan krasje.","ed":"Husk: det finnes ikke én \"stakeholder-interesse\".","kt":"","src":"Opptak L4 ca. 29 min · Opptak L5 ca. 49 min"},{"id":"TR16","l":"L4","t":"Legal view on corporate purpose","f":"m","d":3,"p":"H","sc":"none","s":"Why might the 2019 Business Roundtable statement not even be necessary?","o":[["The law already requires serving all stakeholders","Feil: plikten er overfor eierne, ikke alle."],["It was legally binding","Feil: den var frivillig."],["Shareholders cannot sue directors","Feil: eierne kan saksøke."],["The business judgment rule already allows it","Riktig: regelen gir allerede rom."]],"c":[3],"es":"Business judgment rule lar allerede styret ta hensyn til andre.","ed":"Husk: domstolene overprøver sjelden styret.","kt":"Business judgment rule: courts presume directors made decisions in good faith, with due care and in the company's interest, unless shown otherwise.","src":"Opptak L4 ca. 38 min · Opptak L4 ca. 41 min"},{"id":"TR17","l":"L4","t":"Business Roundtable 2019","f":"m","d":3,"p":"H","sc":"short","s":"A month after Jeff Bezos signed the stakeholder statement, Whole Foods cut health insurance for part-time staff. This supports the criticism that:","o":[["Pledges always lower firm value","Feil: caset sier ingenting om verdi."],["A non-binding pledge may be mostly PR","Riktig: kan være PR."],["Health insurance is a governance issue","Feil: helseforsikring er social (S)."],["Part-time workers are not stakeholders","Feil: ansatte er stakeholders."]],"c":[1],"es":"Ord og handling stemte ikke. Erklæringen kan være mest PR.","ed":"Husk: frivillige løfter er svake.","kt":"","src":"Opptak L4 ca. 20 min · Opptak L4 ca. 23 min"},{"id":"TR18","l":"L4","t":"Stakeholder governance","f":"m","d":2,"p":"M","sc":"none","s":"In Norway, employees in firms with over 30 staff can elect board members. How does the course see this rule?","o":[["A dual-class share structure","Feil: dual-class gir ekstra stemmer til eiere."],["A way to give shareholders more control","Feil: det gir ansatte mer makt."],["A US-only rule","Feil: dette er europeisk."],["A binding employee voice","Riktig: en bindende stemme."]],"c":[3],"es":"Ansatte får en bindende stemme i styret.","ed":"Husk: lov, ikke frivillig.","kt":"","src":"Opptak L4 ca. 25 min"},{"id":"TR19","l":"L4","t":"CSR and performance","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A very profitable firm uses spare cash for community projects; a struggling rival does not. Which idea fits this?","o":[["Doing good by doing well","Riktig: profitt fører til CSR."],["Ethical relativism","Feil: relativism er en etisk teori."],["Doing well by doing good","Feil: det er motsatt retning."],["Delegated philanthropy","Feil: ingen investorer ba om det."]],"c":[0],"es":"Først tjene penger, så gjøre godt = doing good by doing well.","ed":"Husk: well → good. Good → well er motsatt.","kt":"","src":"Opptak L4 ca. 14 min"},{"id":"EX01","l":"L5","t":"Exam sample: adaptive markets hypothesis","f":"t","d":2,"p":"H","sc":"none","s":"Can the adaptive markets hypothesis help explain why carbon risk may not yet be fully priced?","o":[["Yes","Riktig. Ifølge AMH avhenger markedseffektivitet av hvor mange og hvilke investorer som analyserer en risiko. Klimarisiko er ny og analyseres av få, så den kan være underpriset."],["No","Feil. Ifølge AMH avhenger markedseffektivitet av hvor mange og hvilke investorer som analyserer en risiko. Klimarisiko er ny og analyseres av få, så den kan være underpriset."]],"c":[0],"es":"Ja: AMH = effektivitet avhenger av hvem som analyserer. Ny risiko kan være underpriset.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- EMH (efficient markets hypothesis): all informasjon er alltid i prisen.\n- AMH (Lo): markedet blir effektivt over tid etter hvert som flere investorer lærer seg å analysere en risiko.\nKarbonrisiko er relativt ny, så den er kanskje ikke fullt priset ennå.","kt":"Adaptive markets hypothesis (AMH): markeder tilpasser seg og blir mer effektive over tid.","src":"L5 slide 26 · Bok s. 90 (3.4) · Bok s. 91 (3.4)","k":1,"x":1},{"id":"CX036","l":"L5","t":"Corporate governance","f":"m","d":2,"p":"H","sc":"none","s":"Corporate governance problems mainly come from:","o":[["Competition from foreign firms","Det har ikke med governance å gjøre."],["Too much government regulation","Det er ikke grunnproblemet."],["The separation of ownership and control","Eierne eier, ledelsen styrer: principal-agent."],["High interest rates","Renter er ikke kilden."]],"c":[2],"es":"Separation of ownership and control.","ed":"Styre, lederlønn, revisjon og stemmegivning er verktøy for å holde ledelsen ansvarlig overfor eierne.","kt":"","src":"L5 slide 7-8 · L5 slide 14","k":1},{"id":"CX037","l":"L5","t":"Voice and exit","f":"m","d":2,"p":"H","sc":"short","s":"A shareholder proposal asking a firm to set emission targets is an example of:","o":[["Divestment","Divestment = exit."],["Voice","Å påvirke selskapet innenfra = voice."],["Passive investing","Passiv investering handler om å følge en indeks."],["Exit","Exit er å selge aksjene."]],"c":[1],"es":"Forslag, stemmer, dialog = voice.","ed":"Voice: dialog, stemmegivning, forslag. Exit: selge aksjene. Trusselen om exit kan gjøre voice sterkere.","kt":"","src":"L5 slide 17 · L8 slide 71 · Bok s. 89 (3.3.4)","k":1},{"id":"CX038","l":"L5","t":"Voice vs exit","f":"m","d":2,"p":"H","sc":"none","s":"The most realistic tool for an index fund that wants a company to change is:","o":[["Voting and engagement","Indeksfond må eie alle selskapene i indeksen, så de bruker voice."],["Short selling the shares","Indeksfond shorter ikke enkeltaksjer."],["Refusing to receive dividends","Det er ikke et governance-verktøy."],["Selling the company's shares","Da følger fondet ikke lenger indeksen."]],"c":[0],"es":"Indeksfond: bare voice.","ed":"Exit er først og fremst et verktøy for aktive investorer. Når et indeksfond selger, følger det bare indeksreglene, ikke selskapets oppførsel.","kt":"","src":"L8 slide 71 · Bok s. 194 (7.3.4)","k":1},{"id":"CX039","l":"L5","t":"Engagement","f":"t","d":2,"p":"H","sc":"none","s":"Does selling a polluting firm's shares usually force it to cut emissions?","o":[["Yes","Feil. Noen andre kjøper aksjene, ofte en investor som bryr seg mindre. Selskapet kan fortsette som før."],["No","Riktig. Noen andre kjøper aksjene, ofte en investor som bryr seg mindre. Selskapet kan fortsette som før."]],"c":[1],"es":"Nei: divestment har begrenset effekt.","ed":"Derfor foretrekker mange investorer engagement (voice), og selger først når dialogen ikke fører frem.","kt":"","src":"Bok s. 89 (3.3.4) · Bok s. 21 (1.4.1) · L8 slide 58 · L9 slide 32","k":1},{"id":"CX040","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"The 'tragedy of the horizon' (Carney) refers to:","o":[["Investors hold shares for too many years","Problemet er heller for korte horisonter."],["Climate harms arrive beyond decision horizons","Kostnadene ved å handle kommer nå, gevinstene langt frem i tid."],["Firms report too much ESG information too often","Det er ikke poenget."],["Interest rates are too high for green projects","Det er ikke begrepet."]],"c":[1],"es":"Kostnad nå, gevinst langt frem = tragedy of the horizon.","ed":"Ledere, investorer og politikere har korte horisonter, så de undervurderer klimaeffekter som kommer langt frem i tid.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 98 (Key concepts) · L5 slide 29","k":1},{"id":"CX041","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"A practice that tends to INCREASE short-termism is:","o":[["Long vesting periods","Lang opptjening trekker mot langsiktighet."],["Clawback rules","Clawback reduserer fristelsen til kortsiktighet."],["Quarterly reporting","Hyppig måling gir press på kortsiktige tall."],["Long-term owners","Langsiktige eiere reduserer short-termism."]],"c":[2],"es":"Kvartalsrapportering øker short-termism.","ed":"Andre ting som øker short-termism: årlige bonuser, kvartalsvis måling av forvaltere og marking-to-market.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 77 (Table 3.1)","k":1},{"id":"CX042","l":"L5","t":"Executive compensation","f":"m","d":2,"p":"H","sc":"none","s":"A clawback provision means:","o":[["Delaying when shares can be sold","Det er vesting."],["Taking back pay already given","Selskapet krever tilbake bonus som ikke var fortjent."],["A bonus for hitting ESG targets","Det er ESG-linked pay."],["A fixed cap on total CEO pay","Det er et lønnstak."]],"c":[1],"es":"Clawback = ta tilbake.","ed":"Clawback og lange vesting-perioder får ledere til å tenke langsiktig.","kt":"","src":"Bok s. 92 (3.4.2) · L5 slide 29","k":1},{"id":"CX043","l":"L5","t":"ESG-linked executive pay","f":"m","d":2,"p":"H","sc":"none","s":"The evidence on ESG-linked executive pay shows that:","o":[["Its link to ESG results is weak","Svak og ikke-kausal sammenheng, ofte vage mål."],["It reliably causes better ESG results","Det finnes ikke slik evidens."],["It is banned in the European Union","Det er ikke forbudt."],["It always lowers total CEO pay","Det stemmer ikke."]],"c":[0],"es":"Svak sammenheng mellom ESG-lønn og ESG-resultat.","ed":"Bedre design: målbare, verifiserte mål og utbetaling over flere år.","kt":"","src":"Opptak L5 ca. 61 min · Opptak L5 ca. 65 min","k":1},{"id":"SB156","l":"L5","t":"Corporate governance","f":"m","d":1,"p":"H","sc":"none","s":"The root cause of corporate governance problems is:","o":[["Rules that force quarterly reporting","Feil: kvartalsrapportering gir short-termism, men er ikke roten."],["The separation of ownership and control","Riktig: eierskap og kontroll er skilt."],["Shareholders knowing more than managers","Feil: det er lederne som vet mest."],["Firms being too small for managers","Feil: problemet er typisk for store firmaer."]],"c":[1],"es":"Governance-problemer starter med at eiere (principal) og ledere (agent) er forskjellige personer.","ed":"Husk: separation of ownership and control → agency problem.","kt":"","src":"L5 slide 7-8 · L5 slide 14"},{"id":"SB157","l":"L5","t":"Agency problems","f":"m","d":3,"p":"H","sc":"short","s":"After two Boeing 737 MAX crashes, investigators found a culture that put cost cuts and share buybacks before safety. The lesson is that:","o":[["Safety is not material for plane makers","Feil: sikkerhet er svært material for flyprodusenter."],["Short-term focus can hurt value","Riktig: kortsiktighet kan skade verdien."],["Buybacks always raise long-term value","Feil: buybacks kan fortrenge investeringer."],["A strong brand makes the board unimportant","Feil: styret må følge med på risiko."]],"c":[1],"es":"Fokus på kortsiktige kutt og buybacks foran sikkerhet ødela verdi.","ed":"Husk: short-termism + svakt styre = verditap.","kt":"Short-termism: favouring near-term earnings or share price over long-term value creation, e.g. by under-investing.","src":"L5 slide 5 · L5 slide 19"},{"id":"SB158","l":"L5","t":"Adverse selection","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Adverse selection happens after a deal, when someone takes more risk because others carry it.","o":[["True","Feil. Mer risiko etter avtalen er moral hazard. Adverse selection er skjult info før avtalen."],["False","Riktig. Mer risiko etter avtalen er moral hazard. Adverse selection er skjult info før avtalen."]],"c":[1],"es":"Usant. Det beskriver moral hazard. Adverse selection skjer før avtalen.","ed":"Husk: før = adverse selection. Etter = moral hazard.","kt":"","src":"L5 slide 10-13 · L11 slide 7"},{"id":"SB159","l":"L5","t":"Moral hazard","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Shareholders of a highly indebted firm push for a very risky project, because they get the upside while creditors carry the downside. This is:","o":[["Asset substitution (moral hazard)","Riktig: risiko flyttes over på kreditorene etter avtalen."],["The tragedy of the horizon","Feil: tragedy of the horizon handler om tid."],["Adverse selection in the lemons market","Feil: det er ingen skjult info før avtalen."],["Tunnelling by a controlling shareholder","Feil: tunnelling er når storeier tar verdier fra småeiere."]],"c":[0],"es":"Eierne velger mer risiko etter lånet fordi kreditorene tar tapet = asset substitution.","ed":"Husk: asset substitution = for mye risiko. Debt overhang = for lite investering.","kt":"","src":"L5 slide 13 · L10 slide 3"},{"id":"SB160","l":"L5","t":"Purpose of corporate governance","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A board that ignores repeated audit warnings fails the OECD goal of governance: trust, transparency and accountability.","o":[["True","Riktig. Å ignorere advarsler bryter med tillit, åpenhet og ansvar."],["False","Feil. Å ignorere advarsler bryter med tillit, åpenhet og ansvar."]],"c":[0],"es":"Sant. Å ignorere revisoren bryter med tillit, åpenhet og ansvar.","ed":"Husk: OECD = trust, transparency, accountability.","kt":"Corporate governance: the system of rules, practices and processes by which a company is directed and controlled, balancing the interests of stakeholders.","src":"L5 slide 15"},{"id":"SB161","l":"L5","t":"Voice and exit","f":"m","d":2,"p":"H","sc":"none","s":"How does \"exit\" work as a governance tool?","o":[["Regulators remove the firm's licence","Feil: det er ikke en eiermekanisme."],["The threat of selling disciplines managers","Riktig: trusselen om salg presser lederne."],["Shareholders vote managers out","Feil: stemmegivning er voice."],["Investors talk privately with the managers","Feil: private samtaler er voice."]],"c":[1],"es":"Trusselen om å selge disiplinerer lederne.","ed":"Husk: exit = selge. Voice = stemme/snakke.","kt":"","src":"L5 slide 17 · L8 slide 71 · Bok s. 89 (3.3.4)"},{"id":"SB162","l":"L5","t":"Good governance practices","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A firm's CEO also chairs the board, most directors are ex-executives, and the same auditor has served for 25 years. What is the best fix?","o":[["Split the CEO and chair roles","Riktig: uavhengig styre kontrollerer bedre."],["Use revenue growth as the only target","Feil: kun vekstmål gir verdiødeleggende vekst."],["Keep the same auditor for 35 years","Feil: lang tid med samme revisor svekker uavhengigheten."],["Add more former executives","Feil: flere tidligere ledere svekker uavhengigheten."]],"c":[0],"es":"Del CEO- og styreleder-rollen, så styret kan kontrollere ledelsen.","ed":"Husk: uavhengighet = bedre kontroll.","kt":"Board independence: directors without ties to management who can monitor and challenge executives.","src":"L5 slide 19 · Bok s. 135 (5.3.3)"},{"id":"SB163","l":"L5","t":"Governance of sustainability","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A salmon farmer's board has no biology or environmental expert, although sea lice are its biggest risk. What should it do?","o":[["Focus only on quarterly earnings","Feil: det ignorerer langsiktig risiko."],["Leave the environment to marketing","Feil: material risiko må følges av styret."],["Add expertise on key risks","Riktig: legg til ekspertise."],["Stop reporting on sea lice","Feil: å skjule risiko skader tilliten."]],"c":[2],"es":"Styret trenger kompetanse på den største risikoen.","ed":"Husk: styret må forstå det som driver verdi.","kt":"Materiality: issues that can substantially affect a company's value (financial) or its impact on society (impact materiality).","src":"L5 slide 19"},{"id":"SB164","l":"L5","t":"Nestlé and Cargill child labour case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Nestlé and Cargill were sued over child labour on cocoa farms; the case failed because no link to specific farms was shown. What can shareholders do?","o":[["Nothing; governance does not affect supply chains","Feil: governance påvirker leverandørkjeden."],["Use voice (engagement) or exit (selling)","Riktig: voice eller exit."],["Managers must use the cheapest labour by law","Feil: ingen lov krever billigst mulig arbeid."],["Nothing; the case cannot affect value","Feil: omdømme og søksmål påvirker verdien."]],"c":[1],"es":"Eierne kan bruke voice (engagement) eller exit (selge).","ed":"Husk: voice og exit er de to verktøyene.","kt":"","src":"L5 slide 3-6 · L5 slide 16-22 · L5 slide 24"},{"id":"SB165","l":"L5","t":"Finance as usual","f":"m","d":3,"p":"M","sc":"none","s":"Which forces push to keep the status quo instead of internalising externalities?","o":[["Integrated reporting and clawbacks","Feil: dette er løsninger mot short-termism."],["Green bonds and impact investing","Feil: dette fremmer endring."],["Lobbying and agency problems","Riktig: lobbying og agency hindrer endring."],["Climate lawsuits and carbon taxes","Feil: dette presser mot endring."]],"c":[2],"es":"Lobbying og agency problems holder på status quo.","ed":"Husk: de andre alternativene presser mot endring.","kt":"","src":"L5 slide 25 · Bok s. 78 (3.1.2)"},{"id":"SB166","l":"L5","t":"Market efficiency","f":"m","d":3,"p":"H","sc":"none","s":"Why can the adaptive markets hypothesis (AMH) explain that carbon risk is not yet fully priced?","o":[["Under EMH, regulators set prices","Feil: EMH handler om informasjon, ikke regulering."],["Efficiency depends on who studies the risk","Riktig: få som studerer risikoen = ikke priset."],["AMH assumes fully rational investors","Feil: AMH erstatter antagelsen om full rasjonalitet."],["Under AMH, prices always include all information","Feil: det er EMH."]],"c":[1],"es":"AMH: effisiens avhenger av hvor mange som studerer risikoen. Få studerer karbonrisiko, så den er ikke priset.","ed":"Husk: AMH = markedet lærer over tid.","kt":"","src":"L5 slide 26 · Bok s. 90 (3.4) · Bok s. 91 (3.4)"},{"id":"SB167","l":"L5","t":"Market efficiency","f":"t","d":2,"p":"M","sc":"none","s":"True or false: If markets were fully efficient (EMH), active investors could not gain from better ESG insight, so everyone should invest passively.","o":[["True","Riktig. Under EMH reflekterer prisene all info, så ingen kan tjene på bedre innsikt."],["False","Feil. Under EMH reflekterer prisene all info, så ingen kan tjene på bedre innsikt."]],"c":[0],"es":"Sant. Under EMH er alt priset, så bedre innsikt gir ingen gevinst.","ed":"Husk: EMH → passiv investering.","kt":"","src":"L8 slide 68 · L5 slide 26 · Bok s. 95 (3.5)"},{"id":"SB168","l":"L5","t":"SF 1.0 and SF 2.0 governance challenges","f":"m","d":3,"p":"H","sc":"none","s":"Which challenge do both the refined shareholder model (SF 1.0) and the stakeholder model (SF 2.0) face?","o":[["Both assume externalities are priced","Feil: ingen av dem antar at externalities er priset."],["How to measure social and environmental value","Riktig: måling er en utfordring for begge."],["The shareholder model has no challenges","Feil: shareholder-modellen har flere utfordringer."],["Stakeholder models make managers easier to control","Feil: stakeholder gjør ledere vanskeligere å kontrollere."]],"c":[1],"es":"Begge modellene sliter med å måle sosial og miljømessig verdi.","ed":"Husk: måling er felles problem.","kt":"","src":"L5 slide 27-28 · L5 slide 45"},{"id":"SB169","l":"L5","t":"Sustainable governance guidelines","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An \"ESG\" fund pays its managers bonuses based only on one-year returns. Which principle does this go against?","o":[["Maximising diversification","Feil: diversifisering er ikke problemet."],["Excluding all sin stocks","Feil: problemet er incentiver, ikke exclusions."],["Long-term pay incentives","Riktig: lønnen bør være langsiktig."],["Reporting in local currency","Feil: valuta er irrelevant."]],"c":[2],"es":"Ettårige bonuser gir short-termism. Prinsippet er langsiktig lønn.","ed":"Husk: incentiver bør matche horisonten.","kt":"Long-term incentive alignment: pay and evaluation horizons that match the long-term goals of clients and beneficiaries.","src":"L5 slide 25 · Bok s. 187 (7.1.4)"},{"id":"SB170","l":"L5","t":"Short-termism","f":"t","d":2,"p":"H","sc":"none","s":"True or false: The \"tragedy of the horizon\" means that the costs of acting are paid now, while the benefits come in the future.","o":[["True","Riktig. Dette er definisjonen: kostnaden kommer nå, gevinsten i fremtiden."],["False","Feil. Dette er definisjonen: kostnaden kommer nå, gevinsten i fremtiden."]],"c":[0],"es":"Sant. Kostnaden betales nå, gevinsten kommer senere.","ed":"Husk: tragedy of the horizon = kost nå, nytte senere.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 98 (Key concepts) · L5 slide 29"},{"id":"SB171","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"Which practice increases short-termism?","o":[["Integrated reporting","Feil: integrated reporting skal gi lengre horisont."],["Bonuses paid later, based on long-term results","Feil: utsatt bonus er en løsning."],["Buy-and-hold investing","Feil: buy-and-hold er langsiktig."],["Quarterly reporting","Riktig: kvartalsrapporter gir kortsiktighet."]],"c":[3],"es":"Kvartalsrapportering presser ledere til å tenke kortsiktig.","ed":"Husk: hyppig rapportering = mer short-termism.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 77 (Table 3.1)"},{"id":"SB172","l":"L5","t":"Short-termism","f":"m","d":3,"p":"M","sc":"none","s":"What is the trade-off of reporting less often (e.g. dropping quarterly reports)?","o":[["No trade-off; both improve","Feil: markedet får mindre info."],["Firms would not need to disclose anything","Feil: viktig info må fortsatt publiseres."],["Managers would face more pressure","Feil: presset blir mindre."],["Less pressure, but less information","Riktig: mindre press, mindre info."]],"c":[3],"es":"Mindre press på ledere, men markedet får mindre informasjon.","ed":"Husk: det er en trade-off.","kt":"","src":"Bok s. 91 (3.4.1)"},{"id":"SB173","l":"L5","t":"Executive compensation","f":"m","d":3,"p":"H","sc":"none","s":"Which pay rule lets a firm take back money already paid to executives?","o":[["An annual cash bonus","Feil: årlig bonus gir short-termism."],["A clawback provision","Riktig: clawback henter penger tilbake."],["A longer vesting period","Feil: vesting utsetter salg, men henter ikke tilbake."],["A deferred reward","Feil: deferral utsetter, men tar ikke tilbake."]],"c":[1],"es":"Clawback = firmaet kan kreve tilbake lønn som allerede er betalt.","ed":"Husk: clawback = ta tilbake. Deferral = vent med å betale.","kt":"","src":"Bok s. 92 (3.4.2) · L5 slide 29"},{"id":"SB174","l":"L5","t":"ESG-linked executive pay","f":"m","d":3,"p":"H","sc":"none","s":"What does the course say about linking CEO pay to ESG goals?","o":[["The link to ESG results is weak","Riktig: svak sammenheng."],["It always cuts emissions a lot","Feil: effekten er svak."],["ESG pay goals are always clear and measurable","Feil: målene er ofte vage."],["CEOs cannot affect sustainability","Feil: CEO-er kan påvirke bærekraft."]],"c":[0],"es":"Koblingen mellom ESG-lønn og ESG-resultater er svak.","ed":"Husk: korrelasjon, ikke årsak.","kt":"","src":"L5 slide 31-38 · Bok s. 87 (3.3.2)"},{"id":"SB175","l":"L5","t":"ESG-linked executive pay","f":"t","d":3,"p":"M","sc":"extended_course_case","s":"True or false: Starbucks moved sustainability from the annual bonus into a three-year part of executives' equity pay, making the incentive more long-term.","o":[["True","Riktig. Starbucks gjorde bærekraftsmålet til en del av treårig aksjelønn."],["False","Feil. Starbucks gjorde bærekraftsmålet til en del av treårig aksjelønn."]],"c":[0],"es":"Sant. Starbucks flyttet målet fra årlig bonus til treårig aksjelønn.","ed":"Husk: lengre periode = mer langsiktig.","kt":"","src":"L5 slide 39-44 · Bok s. 92 (3.4.2)"},{"id":"SB176","l":"L5","t":"Corporate governance models","f":"m","d":3,"p":"M","sc":"none","s":"Which governance problem is typical in European and Asian firms with a controlling shareholder?","o":[["Many small owners fail to monitor managers","Feil: det er typisk for USA/UK."],["Tunnelling by the big owner","Riktig: tunnelling."],["Managers are replaced too quickly","Feil: ledere byttes sjelden."],["Too much shareholder control","Feil: ikke problemet med storeiere."]],"c":[1],"es":"Storeieren kan ta verdier fra småeierne = tunnelling.","ed":"Husk: Europa/Asia = storeier mot småeier. USA/UK = eier mot leder.","kt":"","src":"Bok s. 84 (3.3)"},{"id":"SB177","l":"L5","t":"Governance mechanisms for sustainability","f":"m","d":3,"p":"M","sc":"none","s":"Which governance tool can build sustainability into a firm?","o":[["A board sustainability committee","Riktig: styrekomité for bærekraft."],["Removing loan covenants","Feil: ikke foreslått."],["Keeping long-term investors away","Feil: læreboka vil tiltrekke langsiktige investorer."],["Banning integrated reporting","Feil: integrated reporting fremmes."]],"c":[0],"es":"En sustainability committee i styret bygger bærekraft inn.","ed":"Husk: styret overvåker.","kt":"","src":"Bok s. 87 (3.3.2) · Bok s. 88 (3.3.2)"},{"id":"SB178","l":"L5","t":"Organisational forms","f":"m","d":3,"p":"L","sc":"none","s":"A major drawback of a cooperative is that:","o":[["It must maximise value for outside owners","Feil: samvirket jobber for medlemmene."],["It can only raise equity from members","Riktig: kapital kun fra medlemmer."],["It cannot align with customers","Feil: samvirket er godt samkjørt med kundene."],["It is a private B Lab label","Feil: det beskriver B Corp."]],"c":[1],"es":"Et samvirke kan bare hente egenkapital fra medlemmene.","ed":"Husk: begrenset tilgang til ekstern kapital.","kt":"","src":"Bok s. 88 (3.3.3) · Bok s. 89 (3.3.3)"},{"id":"SB179","l":"L5","t":"Investor engagement","f":"t","d":3,"p":"H","sc":"short","s":"True or false: McCahery, Sautner and Starks (2016) find that long-term investors prefer to talk privately with managers before selling, and engage more than short-term investors.","o":[["True","Riktig. Studien finner at langsiktige investorer engasjerer mer og selger heller som siste utvei."],["False","Feil. Studien finner at langsiktige investorer engasjerer mer og selger heller som siste utvei."]],"c":[0],"es":"Sant. Langsiktige investorer snakker med ledelsen før de selger.","ed":"Husk: engagement først, exit sist.","kt":"Voice vs exit: voice = engagement and voting to change a firm; exit = selling the shares (\"Wall Street walk\").","src":"Bok s. 199 (8.2.5) · L8 slide 58 · L8 slide 71"},{"id":"SB180","l":"L5","t":"Engagement","f":"m","d":3,"p":"H","sc":"none","s":"Why does divestment (exit) have less impact than engagement (voice)?","o":[["Sold shares are cancelled","Feil: aksjene blir ikke slettet."],["Someone else just buys the shares","Riktig: andre kjøper aksjene."],["Divestment is illegal for EU investors","Feil: det er lovlig."],["Engagement always works","Feil: engagement kan også feile."]],"c":[1],"es":"Når du selger, kjøper noen andre. Firmaet endrer seg ikke.","ed":"Husk: exit flytter bare eierskapet.","kt":"","src":"Bok s. 89 (3.3.4) · Bok s. 21 (1.4.1) · L8 slide 58 · L9 slide 32"},{"id":"SB181","l":"L5","t":"Marking-to-market","f":"m","d":4,"p":"L","sc":"none","s":"Marking-to-market does the most damage for which kind of assets (Plantin, Sapra and Shin, 2008)?","o":[["Long-term, illiquid bank loans","Riktig: illikvide lån får forvridde priser."],["Short-term, liquid assets like stocks","Feil: for likvide eiendeler fungerer det godt."],["All assets equally","Feil: effekten er ulik."],["Cash","Feil: kontanter har ingen slik forvrengning."]],"c":[0],"es":"Mark-to-market skader mest for langsiktige, illikvide banklån.","ed":"Husk: illikvid = priser blir støyete.","kt":"","src":"Bok s. 93 (3.4.4) · Bok s. 94 (3.4.4)"},{"id":"SB182","l":"L5","t":"Supervisory treatment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Higher capital rules for illiquid private investments than for listed assets can discourage long-term green projects like land restoration.","o":[["True","Riktig. Illikvide private investeringer får høye kapitalkrav, og det bremser langsiktige prosjekter."],["False","Feil. Illikvide private investeringer får høye kapitalkrav, og det bremser langsiktige prosjekter."]],"c":[0],"es":"Sant. Høye kapitalkrav for illikvide investeringer gjør langsiktige grønne prosjekter dyrere.","ed":"Husk: regler kan straffe langsiktighet.","kt":"","src":"Bok s. 94 (3.4.5) · L5 slide 30"},{"id":"SB183","l":"L5","t":"Short-termism","f":"m","d":2,"p":"L","sc":"none","s":"What do Davies et al. (2014) find about UK and US stock prices?","o":[["Prices underweight the far future","Riktig: fremtiden vektes for lite."],["Prices are perfectly long-term","Feil: bevisene viser myopia."],["Prices give too much weight to the future","Feil: det er motsatt."],["Short-termism exists only in emerging markets","Feil: studien gjelder UK og USA."]],"c":[0],"es":"Aksjeprisene vekter fjern fremtid for lite. Det er myopia.","ed":"Husk: myopia = nærsynt marked.","kt":"","src":"Bok s. 94 (3.4.5)"},{"id":"SB184","l":"L5","t":"Behavioural biases","f":"m","d":2,"p":"L","sc":"none","s":"An example of collaborative consumption is:","o":[["Buying a car to impress neighbours","Feil: det er competitive consumption."],["Buying a new phone before the old one breaks","Feil: det er overforbruk."],["The sharing economy","Riktig: deling av goder."],["Expensive parties to show status","Feil: det er competitive consumption."]],"c":[2],"es":"Sharing economy er collaborative consumption.","ed":"Husk: dele i stedet for å eie.","kt":"","src":"Bok s. 75 (3.1.1) · Bok s. 76 (3.1.1)"},{"id":"SB185","l":"L5","t":"Corporate scandals","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Scandals like Enron, Volkswagen and Olympus show that one regional governance model is better, since scandals only happen in Anglo-Saxon countries.","o":[["True","Feil. Skandalene skjedde i USA, Tyskland og Japan. Ingen modell er overlegen."],["False","Riktig. Skandalene skjedde i USA, Tyskland og Japan. Ingen modell er overlegen."]],"c":[1],"es":"Usant. Skandaler skjer i alle regioner. Ingen modell er best.","ed":"Husk: Enron (USA), VW (Tyskland), Olympus (Japan).","kt":"","src":"Bok s. 78 (3.1.2) · Bok s. 79 (Box 3.1)"},{"id":"SB186","l":"L5","t":"Players in sustainability","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about the time horizon of different players is correct?","o":[["Investors always think long-term","Feil: investorer kan være kortsiktige."],["Governments: up to four years","Riktig: opptil fire år."],["Households play no role","Feil: husholdninger påvirker gjennom forbruk."],["Firms have the shortest horizon","Feil: firmaer har medium til lang horisont."]],"c":[1],"es":"Myndigheter har horisont på opptil fire år (valgperioden).","ed":"Husk: politikere tenker til neste valg.","kt":"","src":"Bok s. 77 (Table 3.1)"},{"id":"SB187","l":"L5","t":"Fiduciary duty","f":"m","d":3,"p":"M","sc":"none","s":"What does the EU expert group recommend about fiduciary duty?","o":[["Limit it to short-term returns only","Feil: plikten utvides."],["Make it include sustainability","Riktig: inkluder bærekraft."],["Remove fiduciary duty","Feil: den klargjøres, ikke fjernes."],["Apply it only to banks","Feil: den gjelder institusjonelle investorer."]],"c":[1],"es":"EU-gruppen vil at fiduciary duty skal inkludere bærekraft.","ed":"Husk: fiduciary duty utvides.","kt":"","src":"Bok s. 86 (3.3.1) · Bok s. 97 (Key concepts)"},{"id":"SB188","l":"L5","t":"Short-termism","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Fund managers should be judged over the same horizon as their strategy, e.g. three- or five-year averages instead of quarterly results.","o":[["True","Riktig. Evalueringen bør følge strategiens horisont, f.eks. 3–5 år."],["False","Feil. Evalueringen bør følge strategiens horisont, f.eks. 3–5 år."]],"c":[0],"es":"Sant. Vurder forvaltere over samme horisont som strategien.","ed":"Husk: langsiktig strategi = langsiktig evaluering.","kt":"","src":"Bok s. 92 (3.4.3) · Bok s. 93 (3.4.3)"},{"id":"SB189","l":"L5","t":"Governance summary","f":"m","d":4,"p":"H","sc":"none","s":"Which statement best sums up the governance lecture?","o":[["Stakeholder value always lowers agency costs","Feil: det kan øke agency-kostnader."],["Governance is irrelevant to sustainability","Feil: governance er sentralt."],["Stakeholder focus adds value but raises agency costs","Riktig: verdi, men agency-kostnader."],["Shareholder value already prices in all externalities","Feil: externalities er ikke internalisert."]],"c":[2],"es":"Stakeholder-fokus kan gi verdi, men øker agency-kostnadene.","ed":"Husk: en trade-off.","kt":"","src":"L5 slide 45 · L5 slide 27-28"},{"id":"SB190","l":"L5","t":"Forces for change","f":"m","d":3,"p":"M","sc":"short","s":"Climate lawsuits such as Milieudefensie v Shell (2021) are increasing. What does this mean for investors?","o":[["Stop all engagement","Feil: risikoen er en grunn til å engasjere."],["Inaction carries more legal risk","Riktig: mer juridisk risiko ved å ikke gjøre noe."],["All oil firms will soon go bankrupt","Feil: ikke sikker konkurs."],["Courts cannot affect firms","Feil: domstoler kan påvirke strategi og verdi."]],"c":[1],"es":"Søksmål gjør passivitet mer risikabelt juridisk.","ed":"Husk: litigation gjør externalities material.","kt":"Climate litigation: legal action against firms or governments over climate change, e.g. demanding emission cuts or damages.","src":"L5 slide 25"},{"id":"SB191","l":"L5","t":"Governance models","f":"m","d":3,"p":"M","sc":"none","s":"The textbook wants to \"combine the best of both worlds\". Which strength of a model is being combined?","o":[["The shareholder model's long horizon","Feil: shareholder-modellen kritiseres for kortsiktighet."],["The stakeholder model's broad view","Riktig: bredt syn."],["The stakeholder model's takeover market","Feil: takeover-disiplin er svak i stakeholder-systemer."],["Takeover defences","Feil: takeover-forsvar svekker disiplinen."]],"c":[1],"es":"Stakeholder-modellens styrke er det brede synet.","ed":"Husk: shareholder = disiplin, stakeholder = bredde.","kt":"","src":"Bok s. 84 (3.3) · Bok s. 85 (3.3.1)"},{"id":"SB192","l":"L5","t":"Integrated reporting and investor base","f":"m","d":3,"p":"M","sc":"none","s":"How can firms attract long-term investors (Knauer and Serafeim, 2014)?","o":[["Through integrated thinking and reporting","Riktig: integrated reporting."],["By beating quarterly earnings forecasts","Feil: det tiltrekker kortsiktige investorer."],["By big annual bonuses tied to the share price","Feil: det forsterker kortsiktighet."],["By listing on many exchanges","Feil: ikke mekanismen."]],"c":[0],"es":"Integrated thinking og reporting tiltrekker langsiktige investorer.","ed":"Husk: firmaet kan velge sine investorer.","kt":"","src":"Bok s. 92 (3.4.1) · Bok s. 87 (3.3.2)"},{"id":"SB193","l":"L5","t":"Governance of sustainability","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A mining firm wants its board to be accountable for cutting emissions over ten years, without greenwashing. What is the best measure?","o":[["Quarterly emission targets","Feil: kvartalsmål er for kortsiktig."],["A yearly bonus judged by the CEO herself","Feil: vagt og selvvurdert."],["Pay for audited multi-year cuts","Riktig: reviderte flerårige kutt."],["Use only the share price","Feil: aksjekursen fanger ikke externalities."]],"c":[2],"es":"Lønn for reviderte, flerårige kutt.","ed":"Husk: målbart + langsiktig + revidert.","kt":"","src":"L5 slide 9 · L5 slide 19 · L5 slide 36-37 · L5 slide 44 · L7 slide 20 · Bok s. 87 (3.3.2)"},{"id":"TR20","l":"L5","t":"Agency problems with debt","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A heavily indebted firm skips a profitable energy-saving project because most of the gain would go to creditors. This is:","o":[["Adverse selection","Feil: problemet oppstår etter at gjelden finnes."],["Debt overhang (underinvestment)","Riktig: debt overhang."],["Asset substitution (too much risk)","Feil: asset substitution er å velge mer risiko."],["The lemons problem","Feil: lemons er adverse selection."]],"c":[1],"es":"Gjelden tar mesteparten av gevinsten, så eierne dropper prosjektet = debt overhang.","ed":"Husk: debt overhang = for lite investering.","kt":"","src":"Opptak L5 ca. 22 min · Opptak L10 ca. 15 min"},{"id":"TR21","l":"L5","t":"Board monitoring","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"A firm's CEO also chairs the board. Investors fear the board cannot check for hidden supply chain abuse. What is the best fix?","o":[["Appoint an independent chair","Riktig: uavhengig styreleder."],["Give the CEO a fixed salary","Feil: fast lønn løser ikke kontrollen."],["Remove independent directors","Feil: uavhengighet gir kontroll."],["Give the CEO more votes","Feil: mer makt svekker kontrollen."]],"c":[0],"es":"CEO som også er styreleder kontrollerer seg selv. Velg en uavhengig styreleder.","ed":"Husk: CEO duality er et problem.","kt":"CEO duality: the CEO is also chair of the board, so management effectively monitors itself.","src":"Opptak L5 ca. 31 min"},{"id":"TR22","l":"L5","t":"Shareholder governance tools","f":"m","d":3,"p":"M","sc":"none","s":"A big shareholder threatens to sell unless the firm cleans up its cocoa supply chain. Why can this work before any shares are sold?","o":[["It gives a seat on the audit committee","Feil: exit gir ikke styreplass."],["A big sale would push the price down","Riktig: salg presser kursen."],["US shareholder votes are always binding","Feil: avstemninger i USA er ofte ikke bindende."],["A sale would remove the CEO","Feil: salg fjerner ikke CEO."]],"c":[1],"es":"Et stort salg ville presset kursen ned. Trusselen alene virker.","ed":"Husk: threat of exit disiplinerer.","kt":"","src":"Opptak L5 ca. 28 min"},{"id":"TR23","l":"L5","t":"ESG-linked executive pay","f":"m","d":3,"p":"H","sc":"short","s":"Which design of ESG-linked CEO pay is best?","o":[["A bonus for any revenue growth","Feil: inntekt er finansielt og kortsiktig."],["No performance conditions","Feil: ingen betingelser gir ingen incentiver."],["Vague goals that the board judges each year","Feil: vage, selvvurderte mål er problemet."],["Measurable targets paid over years","Riktig: målbart over flere år."]],"c":[3],"es":"Målbare mål betalt over flere år.","ed":"Husk: målbart + langsiktig.","kt":"","src":"Opptak L5 ca. 61 min · Opptak L5 ca. 65 min"},{"id":"TR24","l":"L5","t":"ESG-linked executive pay","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The study in the course shows that linking CEO pay to ESG causes better ESG ratings.","o":[["True","Feil. Studien finner bare svak korrelasjon. Gode firmaer velger kanskje ESG-lønn selv."],["False","Riktig. Studien finner bare svak korrelasjon. Gode firmaer velger kanskje ESG-lønn selv."]],"c":[1],"es":"Usant. Det er bare en svak korrelasjon, ikke bevis for årsak.","ed":"Husk: korrelasjon ≠ kausalitet.","kt":"","src":"Opptak L5 ca. 61 min"},{"id":"TR25","l":"L5","t":"Governance challenges by framework","f":"m","d":3,"p":"M","sc":"none","s":"Climate lawsuits have risen sharply, suggesting firms do not deal with climate risk. Which agency reason does the course give?","o":[["Creditors force too much green investment","Feil: ikke et av hindrene."],["Shareholders cannot sue","Feil: søksmål øker nettopp fordi folk saksøker."],["Climate risk is already priced","Feil: forelesningen stiller spørsmål ved det."],["Managers prefer a quiet life","Riktig: ledere vil ha et rolig liv."]],"c":[3],"es":"Ledere foretrekker et rolig liv. Å endre strategi koster dem innsats.","ed":"Husk: quiet life = agency problem.","kt":"","src":"Opptak L5 ca. 42 min"},{"id":"TR26","l":"L5","t":"Shareholder vs stakeholder conflicts","f":"m","d":3,"p":"M","sc":"short","s":"CEOs are less likely to close units or lay off workers near headquarters. This shows:","o":[["Layoffs near HQ always destroy value","Feil: poenget er at verdiskapende kutt droppes."],["A conflict with nearby workers","Riktig: konflikt med nære arbeidere."],["Distance does not affect decisions","Feil: nærhet betyr noe."],["Adverse selection","Feil: det handler om ledernes valg."]],"c":[1],"es":"CEO-er beskytter arbeidere de kjenner, selv om kutt kunne gitt verdi.","ed":"Husk: agency-konflikt med nære ansatte.","kt":"","src":"Opptak L5 ca. 48 min"},{"id":"CX044","l":"L6","t":"Business model","f":"t","d":2,"p":"H","sc":"none","s":"Does a business model describe how a firm creates, delivers and captures value?","o":[["Yes","Riktig. Dette er Osterwalder og Pigneurs definisjon."],["No","Feil. Dette er Osterwalder og Pigneurs definisjon."]],"c":[0],"es":"Ja: create, deliver, capture.","ed":"Tre deler (Johnson m.fl.): value proposition, profit formula, nøkkelressurser og prosesser.","kt":"","src":"L6 slide 9 · Bok s. 125 (5.2.2.1)","k":1},{"id":"CX045","l":"L6","t":"Materiality","f":"m","d":2,"p":"H","sc":"none","s":"Which standard looks at materiality from the investor's (financial) point of view:","o":[["The Equator Principles","Det er prinsipper for prosjektfinansiering i bank."],["SASB","SASB: hva som er finansielt vesentlig for investorer, per bransje."],["Ostrom's design principles","Det handler om styring av fellesressurser."],["GRI","GRI ser også på påvirkning på samfunn, for alle stakeholders."]],"c":[1],"es":"SASB = investorer. GRI = alle stakeholders.","ed":"SASB (outside-in) + GRI (inside-out) dekker til sammen double materiality.","kt":"","src":"L6 slide 50-51 · L1 slide 36 · PwC s. 29","k":1},{"id":"CX046","l":"L6","t":"Materiality","f":"t","d":2,"p":"H","sc":"none","s":"Do Khan, Serafeim and Yoon find that good performance on immaterial ESG issues predicts higher stock returns?","o":[["Yes","Feil. Bare material issues gir meravkastning. Immaterial issues gjør det ikke."],["No","Riktig. Bare material issues gir meravkastning. Immaterial issues gjør det ikke."]],"c":[1],"es":"Nei: bare material issues teller.","ed":"Poenget: fokuser på ESG-temaene som faktisk er vesentlige for bransjen.","kt":"","src":"L6 slide 52 · Bok s. 129 (5.2.3.2) · Bok s. 130 (Box 5.4) · Folketrygdfondet s. 15","k":1},{"id":"CX047","l":"L6","t":"Materiality","f":"m","d":2,"p":"H","sc":"none","s":"The issue most likely to be material for a retail bank is:","o":[["Water use in production","En bank har knapt produksjon som bruker vann."],["Biodiversity at mine sites","Det er material for gruveselskaper."],["Fuel efficiency of its vehicle fleet","Det er material for transportselskaper."],["Data security and privacy","For en bank er kundedata og tillit sentralt."]],"c":[3],"es":"Materiality avhenger av bransjen.","ed":"Samme ESG-tema kan være avgjørende for én bransje og uvesentlig for en annen. SASB lager derfor bransjespesifikke standarder.","kt":"","src":"Bok s. 134 (5.3) · L6 slide 51","k":1},{"id":"CX048","l":"L6","t":"Intangibles","f":"m","d":2,"p":"H","sc":"none","s":"Most intangible resources, such as employee skills, are found:","o":[["In the cash flow statement","Kontantstrømoppstillingen viser ikke slike ressurser."],["Under current liabilities","De er ikke gjeld."],["Among tangible fixed assets","De er per definisjon ikke fysiske."],["Off the balance sheet","De fleste står ikke i regnskapet."]],"c":[3],"es":"Intangibles = mest utenfor balansen.","ed":"Derfor sier regnskapet lite om verdien til kunnskapsbedrifter, og ESG-forhold som påvirker ansatte og kunder blir viktige.","kt":"","src":"L6 slide 20 · Bok s. 127 (Figure 5.3) · L6 slide 23","k":1},{"id":"CX049","l":"L6","t":"Oatly case","f":"m","d":2,"p":"H","sc":"none","s":"The main lesson from Oatly losing market share to big rivals is that:","o":[["Big firms cannot sell oat drinks","De gjorde nettopp det."],["ESG reporting hurt Oatly's sales","Rapportering var ikke problemet."],["Green products can never be profitable","Det er for bastant."],["Green products need a hard-to-copy edge","Uten konkurransefortrinn kan andre kopiere og presse prisen."]],"c":[3],"es":"Bærekraft + konkurransefortrinn.","ed":"Oatly vokste med havremelk, men store aktører kopierte produktet billigere, og Oatly måtte kutte kostnader.","kt":"","src":"L6 slide 5-18 · L6 slide 35-36 · L6 slide 75 · Bok s. 119 (5.1) · Bok s. 121 (5.2.1)","k":1},{"id":"CX050","l":"L6","t":"Value drivers","f":"m","d":2,"p":"H","sc":"none","s":"An energy-efficiency upgrade that cuts operating costs raises firm value mainly through:","o":[["Higher sales growth","Salget endres ikke direkte."],["Higher margins","Lavere kostnader per krone omsetning = høyere margin."],["A lower tax rate","Skattesatsen endres ikke."],["More shares outstanding","Det har ingenting med verdiskaping å gjøre."]],"c":[1],"es":"Lavere kostnader = høyere margin.","ed":"Value drivers: sales growth, margins, return on capital, cash flows. ESG påvirker verdien gjennom disse.","kt":"","src":"L6 slide 2 · L6 slide 32-34 · L9 slide 6","k":1},{"id":"SB194","l":"L6","t":"Business model","f":"m","d":1,"p":"H","sc":"none","s":"According to Osterwalder and Pigneur (2010), a business model describes:","o":[["The firm's legal structure","Feil: juridisk struktur er governance."],["The firm's material ESG issues","Feil: det er en materiality assessment."],["The firm's plan for the next five years","Feil: en femårsplan er strategi."],["How a firm creates and captures value","Riktig: skape og fange verdi."]],"c":[3],"es":"Business model = hvordan firmaet skaper og fanger verdi.","ed":"Husk: create + capture value.","kt":"","src":"L6 slide 9 · Bok s. 125 (5.2.2.1)"},{"id":"SB195","l":"L6","t":"Business model","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the three parts of a successful business model (Johnson et al., 2008)?","o":[["A profit formula","Riktig: profit formula."],["A dual-class share structure","Feil: aksjestruktur er governance."],["An investment-grade credit rating","Feil: kredittrating er ikke en del."],["A materiality matrix","Feil: materiality er bærekraftsanalyse."]],"c":[0],"es":"En profit formula er en av de tre delene.","ed":"Husk: customer value proposition, profit formula, key resources/processes.","kt":"","src":"L6 slide 9 · Bok s. 125 (5.2.2.1) · Bok s. 126 (5.2.2.1)"},{"id":"SB196","l":"L6","t":"Business model","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Joyce and Paquin's triple-layered canvas adds a governance layer and a regulation layer to the original canvas.","o":[["True","Feil. Lagene som legges til er et miljølag og et sosialt lag, ikke governance og regulering."],["False","Riktig. Lagene som legges til er et miljølag og et sosialt lag, ikke governance og regulering."]],"c":[1],"es":"Usant. De to nye lagene er miljø og sosialt.","ed":"Husk: triple = økonomisk + miljø + sosialt.","kt":"","src":"Bok s. 126 (5.2.2.1)"},{"id":"SB197","l":"L6","t":"Competitive position","f":"m","d":2,"p":"H","sc":"none","s":"The four broad sources of competitive advantage are:","o":[["Financial, manufactured, natural and social capital","Feil: dette er capitals fra integrated reporting."],["Sales growth, margins, capital, cash flows","Feil: dette er value drivers."],["Cost, differentiation, focus, diversification","Feil: dette ligner Porters strategier."],["Resources, knowledge, people and culture, networks","Riktig: de fire kildene."]],"c":[3],"es":"Fire kilder: ressurser, kunnskap, mennesker og kultur, nettverk.","ed":"Husk: R-K-P-N.","kt":"","src":"L6 slide 12 · Bok s. 121 (5.2.1.1)"},{"id":"SB198","l":"L6","t":"Competitive position","f":"m","d":3,"p":"M","sc":"none","s":"Novozymes grows twice as fast as normal chemical firms by replacing chemicals with enzymes. Which source of advantage is this?","o":[["Knowledge (R&D and technology)","Riktig: kunnskap fra R&D."],["Networks and switching costs","Feil: det er ikke nettverkseffekter."],["Regulatory protection of the market","Feil: ingen regulering nevnt."],["Natural resources","Feil: naturressurser er Rio Tinto-eksemplet."]],"c":[0],"es":"Novozymes vinner på R&D og teknologi = knowledge.","ed":"Husk: Novozymes = knowledge. Rio Tinto = resources.","kt":"","src":"Bok s. 122 (Box 5.2) · Bok s. 122 (Box 5.1) · Bok s. 124 (5.2.1.6)"},{"id":"SB199","l":"L6","t":"Competitive position","f":"t","d":3,"p":"M","sc":"short","s":"True or false: Kodak invented a digital camera in 1975 but stuck with its profitable film business. This shows that existing profits can block new business models.","o":[["True","Riktig. Kodak holdt fast ved film fordi den var lønnsom. Eksisterende profitt blokkerte ny modell."],["False","Feil. Kodak holdt fast ved film fordi den var lønnsom. Eksisterende profitt blokkerte ny modell."]],"c":[0],"es":"Sant. Kodak ville ikke ødelegge sin lønnsomme filmforretning.","ed":"Husk: dagens profitt kan blokkere fornyelse.","kt":"Business model innovation: changing how a firm creates, delivers and captures value, often requiring cannibalisation of existing profits.","src":"Bok s. 126 (5.2.2.2) · Bok s. 132 (5.2.4)"},{"id":"SB200","l":"L6","t":"Competitive position","f":"t","d":3,"p":"L","sc":"none","s":"True or false: High sales growth lasts much longer than high profit margins (Chan, Karceski and Lakonishok, 2003).","o":[["True","Feil. Det er motsatt: høye marginer holder seg bedre enn høy vekst."],["False","Riktig. Det er motsatt: høye marginer holder seg bedre enn høy vekst."]],"c":[1],"es":"Usant. Høye marginer varer lenger enn høy vekst.","ed":"Husk: vekst forsvinner raskt.","kt":"","src":"Bok s. 124 (5.2.1.6)"},{"id":"SB201","l":"L6","t":"Intangibles","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A software firm trades at 15 times book value. Its main assets are engineers, code and customers. Why are ESG issues like employee satisfaction relevant?","o":[["Most value is in intangibles","Riktig: verdien er i intangibles."],["Physical assets are always overvalued","Feil: poenget er hvor verdien kommer fra."],["ESG ratings are part of book value","Feil: ESG-rating er ikke bokført verdi."],["They are not relevant","Feil: de er svært relevante."]],"c":[0],"es":"Mesteparten av verdien ligger i intangibles som ansatte og kunder.","ed":"Husk: intangibles står ikke i balansen, men driver verdien.","kt":"Intangible resources: non-physical sources of value (human capital, know-how, brands, relationships); many are not recognised as accounting assets.","src":"L6 slide 20 · Bok s. 127 (Figure 5.3) · L6 slide 23"},{"id":"SB202","l":"L6","t":"Intangibles","f":"m","d":3,"p":"H","sc":"none","s":"What is the difference between intangible assets and intangible resources?","o":[["Only assets are on the balance sheet","Riktig: bare assets bokføres."],["Resources cannot affect value","Feil: ressurser kan påvirke verdien."],["Resources are narrower than assets","Feil: ressurser er bredere, ikke smalere."],["Goodwill measures all resources exactly","Feil: goodwill måler ikke alt."]],"c":[0],"es":"Bare intangible assets står i balansen. Intangible resources er bredere.","ed":"Husk: assets ⊂ resources.","kt":"","src":"L6 slide 21 · Bok s. 127 (5.2.3.1) · Bok s. 128 (5.2.3.1)"},{"id":"SB203","l":"L6","t":"Intangibles","f":"m","d":4,"p":"M","sc":"short","s":"A few platforms (e.g. Alphabet, Meta) take most of the profits in digital ads. Which features of intangibles explain this \"winner takes all\" result?","o":[["Scalability and synergies","Riktig: skalering og synergier."],["Intangibles are fully on the balance sheet","Feil: de fleste står ikke i balansen."],["No spillovers","Feil: intangibles har ofte spillovers."],["Low sunk costs","Feil: intangibles har høye sunk costs."]],"c":[0],"es":"Kode og data er billig å skalere og forsterker hverandre.","ed":"Husk: scalability + synergies = winner takes all.","kt":"Scalability: an asset can be used many times at little extra cost; synergies: intangibles become more valuable in combination.","src":"L6 slide 21 · Bok s. 131 (5.2.3.3)"},{"id":"SB204","l":"L6","t":"Intangibles","f":"m","d":3,"p":"M","sc":"none","s":"What happens when firms disclose too little about their intangibles (Lev, 2000)?","o":[["R&D-heavy firms are overvalued","Feil: de blir undervurdert."],["Financial reports become more useful","Feil: rapportene blir mindre nyttige."],["Higher cost of capital","Riktig: høyere kapitalkostnad."],["A lower cost of capital","Feil: asymmetri øker kostnaden."]],"c":[2],"es":"For lite info gir høyere kapitalkostnad.","ed":"Husk: information asymmetry → høyere cost of capital.","kt":"","src":"Bok s. 131 (5.2.3.4) · Bok s. 132 (5.2.3.4)"},{"id":"SB205","l":"L6","t":"Intangibles","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Edmans (2012) finds that firms with happier employees do worse on the stock market.","o":[["True","Feil. Edmans finner at firmaer med fornøyde ansatte gjør det bedre."],["False","Riktig. Edmans finner at firmaer med fornøyde ansatte gjør det bedre."]],"c":[1],"es":"Usant. Firmaer med fornøyde ansatte gjør det bedre på børsen.","ed":"Husk: Edmans = glade ansatte → bedre avkastning.","kt":"","src":"L6 slide 23 · Bok s. 135 (5.3.2)"},{"id":"SB206","l":"L6","t":"Strategy","f":"m","d":3,"p":"H","sc":"short","s":"From 2009 to 2019, DONG Energy (now Ørsted) sold its oil and gas business and became a leading offshore wind firm. Which strategy element changed most?","o":[["Nothing changed","Feil: hele porteføljen endret seg."],["Arenas","Riktig: fra olje/gass til havvind."],["Vehicles only","Feil: hovedendringen var hva, ikke hvordan."],["Staging only","Feil: endringen var mer enn timing."]],"c":[1],"es":"Ørsted endret hvilke markeder de er i = arenas.","ed":"Husk: arenas = hvor vi er aktive.","kt":"Strategy elements (Hambrick and Fredrickson): arenas (where), vehicles (how to get there), differentiators (how to win), staging (speed and sequence), economic logic (how returns are made).","src":"L6 slide 27 · Bok s. 132 (5.2.4)"},{"id":"SB207","l":"L6","t":"Strategy","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A car maker can build electric cars but waits, because they would hurt its profitable spare parts business. This shows:","o":[["Existing interests blocking change","Riktig: eksisterende interesser blokkerer."],["Adverse selection","Feil: det er intern motstand, ikke skjult info."],["The rebound effect of the circular economy","Feil: rebound gjelder sirkulær økonomi."],["A successful cost leadership strategy","Feil: å ikke tilpasse seg kan bli dyrt."]],"c":[0],"es":"Lønnsom reservedelsforretning blokkerer endring.","ed":"Husk: eksisterende interesser bremser.","kt":"","src":"Bok s. 126 (5.2.2.2) · Bok s. 125 (Box 5.3) · Bok s. 132 (5.2.4)"},{"id":"SB208","l":"L6","t":"Value drivers","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Oatly's ROE fell sharply from 2021 to 2022, even though asset turnover improved. What caused the fall (DuPont)?","o":[["Higher leverage","Feil: leverage økte."],["Lower taxes","Feil: skatt er ikke forklaringen."],["A worse profit margin","Riktig: dårligere margin."],["Lower asset turnover","Feil: turnover ble bedre."]],"c":[2],"es":"ROE falt fordi marginen kollapset.","ed":"Husk: DuPont: ROE = margin × turnover × leverage.","kt":"DuPont analysis: ROE = net profit margin × asset turnover × financial leverage; it shows which value driver explains changes in returns.","src":"L6 slide 34-35"},{"id":"SB209","l":"L6","t":"Value drivers","f":"m","d":1,"p":"H","sc":"none","s":"Which value drivers does the course use to judge a firm's ability to generate free cash flow?","o":[["Interest rate, inflation, GDP and FX","Feil: dette er makrofaktorer."],["Growth, margins, return on capital","Riktig: de tre value drivers."],["ESG rating, emissions, staff, market share","Feil: disse påvirker driverne, men er ikke selve driverne."],["Board size, owners, share price, dividends","Feil: ikke value drivers."]],"c":[1],"es":"Value drivers: vekst, marginer, avkastning på kapital.","ed":"Husk: growth, margin, ROIC.","kt":"","src":"L6 slide 2 · L6 slide 32-34 · L9 slide 6"},{"id":"SB210","l":"L6","t":"Value drivers","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Free cash flow is operating cash flow minus investment, so a fast-growing firm can have positive operating cash flow but negative free cash flow.","o":[["True","Riktig. FCF = OCF minus investeringer, så mye vekst kan gi negativ FCF."],["False","Feil. FCF = OCF minus investeringer, så mye vekst kan gi negativ FCF."]],"c":[0],"es":"Sant. Store investeringer kan gjøre FCF negativ selv om OCF er positiv.","ed":"Husk: FCF = OCF − investering.","kt":"","src":"L6 slide 33 · L9 slide 5"},{"id":"SB211","l":"L6","t":"Oatly case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Oatly lost market share when competition in oat milk grew. What is the lesson?","o":[["Lower impact means strong financial results","Feil: impact gir ikke automatisk gode resultater."],["Green products need a hard-to-copy edge","Riktig: trenger et fortrinn som ikke kan kopieres."],["Firms with positive impact cannot lose market share","Feil: caset viser at det kan skje."],["A strong brand guarantees success","Feil: merkevare er ikke nok."]],"c":[1],"es":"Grønne produkter trenger en fordel som er vanskelig å kopiere.","ed":"Husk: impact ≠ automatisk konkurransefortrinn.","kt":"","src":"L6 slide 5-18 · L6 slide 35-36 · L6 slide 75 · Bok s. 119 (5.1) · Bok s. 121 (5.2.1)"},{"id":"SB212","l":"L6","t":"Company purpose","f":"m","d":3,"p":"M","sc":"none","s":"How does a firm's purpose relate to maximising integrated value (IV)?","o":[["Purpose replaces measuring value","Feil: IV må fortsatt måles."],["Purpose first; IV puts it into practice","Riktig: purpose først, IV i praksis."],["IV comes first; purpose is just marketing","Feil: det er motsatt."],["They are unrelated","Feil: de henger sammen."]],"c":[1],"es":"Purpose kommer først. IV setter det ut i praksis.","ed":"Husk: purpose = hvorfor. IV = hvordan måle.","kt":"","src":"L6 slide 41-43 · Bok s. 141 (5.5) · Bok s. 142 (5.5.1)"},{"id":"SB213","l":"L6","t":"Stakeholder analysis","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A Norwegian wind farm developer analyses stakeholders. Sámi reindeer herders have high interest and, after the 2021 Fosen ruling, high power. How should they be treated?","o":[["Manage closely","Riktig: følg tett."],["Monitor only","Feil: de har både interesse og
