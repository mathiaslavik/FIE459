low (fri kontantstrøm); NWC = Net Working Capital (arbeidskapital).","kt":"","src":"Opptak L6 ca. 1 min · Opptak L6 ca. 3 min"},{"id":"TR28","l":"L6","t":"Competitive strategy","f":"m","d":3,"p":"H","sc":"extended_course_case","s":"Oatly grew with a differentiation strategy. Then big drinks firms entered with lower costs. What did this mean for Oatly?","o":[["Nothing changed","Incorrect: rivals entered the market."],["It became the cost leader","Incorrect: Oatly was the higher-cost player."],["It could raise prices","Incorrect: cheaper rivals made price rises harder."],["It had to cut its costs","Correct: it had to cut its costs."]],"c":[3],"es":"Billigere konkurrenter tvang Oatly til å kutte kostnader.","ed":"Oatly brukte differentiation: et unikt, grønt produkt til høy pris. Da store aktører kom inn med lavere kostnader, ble det vanskelig å holde prisen. Oatly måtte kutte kostnader for å konkurrere. Husk: differentiation er sårbart når andre kopierer.","kt":"","src":"Opptak L6 ca. 16 min · Opptak L6 ca. 17 min"},{"id":"TR29","l":"L6","t":"Intangibles","f":"m","d":2,"p":"M","sc":"none","s":"A buyer pays far more than book value for a firm with a strong brand and skilled staff. The extra amount is called:","o":[["A stranded asset","Incorrect: a stranded asset is a loss of value."],["Working capital","Incorrect: working capital is short-term operating items."],["Depreciation","Incorrect: depreciation relates to physical assets over time."],["Goodwill","Correct: goodwill is the premium paid over book value."]],"c":[3],"es":"Ekstra betaling over bokført verdi = goodwill.","ed":"Ved oppkjøp betaler kjøperen ofte mer enn bokført verdi for verdier som ikke står i balansen, som merkevare og kompetente ansatte. Merbetalingen føres som goodwill. Husk: goodwill = premie ved oppkjøp.","kt":"","src":"Opptak L6 ca. 22 min"},{"id":"TR30","l":"L6","t":"Intangibles","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A firm spends a lot on a new low-carbon process that fails, and it cannot sell anything to get money back. This shows that intangibles have:","o":[["Synergies","Incorrect: synergies mean intangibles reinforce each other."],["Scalability","Incorrect: scalability means cheap copying."],["Spillovers","Incorrect: spillovers mean others benefit."],["Sunk costs","Correct: the money cannot be recovered: sunk costs."]],"c":[3],"es":"Pengene kan ikke hentes tilbake = sunk costs.","ed":"Investeringer i intangibles, som en ny prosess, kan sjelden selges videre hvis de feiler. Pengene er tapt (sunk costs). Det gjør slike investeringer risikable. Husk: intangibles = sunk costs.","kt":"","src":"Opptak L6 ca. 23 min"},{"id":"CX051","l":"L7","t":"Environmental metrics","f":"m","d":2,"p":"H","sc":"none","s":"Emissions from coal burned in a steel maker's own furnaces are:","o":[["Scope 3","Scope 3 er resten av verdikjeden."],["Not counted in any scope","Egne utslipp telles alltid."],["Scope 2","Scope 2 er innkjøpt strøm og varme."],["Scope 1","Direkte utslipp fra egne anlegg = scope 1."]],"c":[3],"es":"Egen pipe = scope 1.","ed":"Huskeregel: 1 = egen pipe, 2 = strømledningen inn, 3 = resten av verdikjeden (leverandører og kunders bruk).","kt":"","src":"Bok s. 153 (6.2.1) · Bok s. 154 (Box 6.1) · L7 slide 7","k":1},{"id":"CX052","l":"L7","t":"Environmental metrics","f":"m","d":2,"p":"H","sc":"none","s":"Emissions from a company's suppliers belong to:","o":[["Scope 1","Scope 1 er egne direkte utslipp."],["Scope 3","Verdikjeden utenfor egne anlegg = scope 3."],["No scope at all","De telles i scope 3."],["Scope 2","Scope 2 er innkjøpt strøm og varme."]],"c":[1],"es":"Leverandører = scope 3.","ed":"Scope 3 er ofte den største delen, men den vanskeligste å måle.","kt":"","src":"Bok s. 153 (6.2.1) · Bok s. 154 (Box 6.1) · L7 slide 7","k":1},{"id":"CX053","l":"L7","t":"TCFD","f":"m","d":2,"p":"H","sc":"none","s":"The framework that reports climate-related financial risk under four pillars is:","o":[["TCFD","Governance, strategy, risk management, metrics and targets."],["SASB","SASB er bransjespesifikk, ikke bygget på fire klimasøyler."],["EU Taxonomy","Taksonomien klassifiserer aktiviteter."],["GRI","GRI handler om impact for alle stakeholders."]],"c":[0],"es":"TCFD = klima → økonomi, fire søyler.","ed":"Fire søyler: governance, strategy (inkl. scenarioanalyse), risk management, metrics and targets. Bygget inn i ISSB (IFRS S2).\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders); TCFD = Task Force on Climate-related Financial Disclosures (rammeverk for klimarisiko-rapportering); IFRS = International Financial Reporting Standards (regnskapsstandarder); ISSB = International Sustainability Standards Board (IFRS sin bærekraftsstandard for investorer).","kt":"","src":"L7 slide 16-17 · Bok s. 173 (6.5)","k":1},{"id":"CX054","l":"L7","t":"Reporting frameworks","f":"m","d":2,"p":"H","sc":"none","s":"The reporting framework aimed at ALL stakeholders, not mainly investors, is:","o":[["TCFD","TCFD er for investorer."],["IFRS","IFRS er for investorer og kreditorer."],["SASB","SASB er for investorer."],["GRI","GRI = impact, alle stakeholders."]],"c":[3],"es":"GRI = alle stakeholders.","ed":"SASB, TCFD og IFRS er rettet mot investorer. GRI er rettet mot alle.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders); TCFD = Task Force on Climate-related Financial Disclosures (rammeverk for klimarisiko-rapportering); IFRS = International Financial Reporting Standards (regnskapsstandarder).","kt":"","src":"Bok s. 157 (6.3) · Bok s. 158 (Table 6.2) · Bok s. 162 (6.3.1.3)","k":1},{"id":"CX055","l":"L7","t":"Integrated reporting","f":"m","d":2,"p":"H","sc":"none","s":"In integrated reporting, a firm's patents and know-how are:","o":[["Human capital","Human capital er de ansattes ferdigheter og helse."],["Intellectual capital","Kunnskap og patenter = intellectual capital."],["Manufactured capital","Manufactured capital er bygg og maskiner."],["Social and relationship capital","Det er relasjoner og tillit."]],"c":[1],"es":"Patenter = intellectual.","ed":"Seks kapitaler: financial, manufactured, intellectual, human, social and relationship, natural.","kt":"","src":"L7 slide 10 · Bok s. 159 (6.3.1.1)","k":1},{"id":"CX056","l":"L7","t":"Mandatory reporting","f":"m","d":2,"p":"H","sc":"none","s":"The EU's CSRD requires:","o":[["Double materiality","CSRD krever at både impact og financial materiality vurderes."],["Financial materiality only","Det er ISSB-tilnærmingen, ikke CSRD."],["No materiality assessment","Materialitetsvurdering er kjernen i CSRD."],["Impact materiality only","CSRD krever begge retninger."]],"c":[0],"es":"CSRD = double materiality.","ed":"Rapporteringen følger ESRS. Et tema er rapporteringspliktig hvis det er vesentlig i minst én retning.\n\nForkortelser: CSRD = Corporate Sustainability Reporting Directive (EUs lov om bærekraftsrapportering); ESRS = European Sustainability Reporting Standards (standardene under CSRD); ISSB = International Sustainability Standards Board (IFRS sin bærekraftsstandard for investorer).","kt":"","src":"L7 slide 23-25 · PwC s. 29 · L6 slide 50","k":1},{"id":"CX057","l":"L7","t":"EU Taxonomy","f":"m","d":2,"p":"H","sc":"none","s":"The EU Taxonomy classifies:","o":[["Economic activities","Taksonomien klassifiserer aktiviteter, ikke selskaper."],["Countries and their governments","Taksonomien klassifiserer ikke land."],["Fund managers and their funds","Fond rapporterer under SFDR, men taksonomien klassifiserer aktiviteter."],["Whole companies","Et selskap kan ha både grønne og ikke-grønne aktiviteter."]],"c":[0],"es":"Taxonomy = aktiviteter.","ed":"Selskaper rapporterer hvor stor andel av omsetning og investeringer som er taxonomy-aligned. Et mål er å hindre greenwashing.\n\nForkortelser: SFDR = Sustainable Finance Disclosure Regulation (EU-regler som deler fond i Article 6/8/9).","kt":"","src":"Opptak L12 ca. 44 min","k":1},{"id":"CX058","l":"L7","t":"ESG ratings","f":"m","d":2,"p":"H","sc":"none","s":"'Aggregate confusion' refers to:","o":[["Low agreement between ESG raters","Ulike leverandører gir svært ulike ratinger."],["Adding E, S and G into one score","Problemet er sprik mellom leverandører."],["Confusing ESG labels on funds","Det handler om ratinger, ikke fondsnavn."],["Investors ignoring ESG reports","Det er ikke begrepet."]],"c":[0],"es":"Aggregate confusion = ratingene spriker.","ed":"Eksempel: Tesla ble fjernet fra en ESG-indeks mens ExxonMobil ble værende, fordi ratingen målte ESG-risikostyring relativt til bransjen.","kt":"","src":"L7 slide 37 · Fondsfinans s. 6","k":1},{"id":"SB236","l":"L7","t":"Limits of financial reporting","f":"m","d":2,"p":"H","sc":"none","s":"A limitation of traditional financial reporting is that:","o":[["It has no auditing standards","Incorrect: financial reporting has auditing standards."],["It puts all R&D spending on the balance sheet","Incorrect: R&D is usually expensed, not put on the balance sheet."],["It reports too much non-financial data","Incorrect: the critique is too little non-financial data."],["It looks backward","Correct: traditional reports look backward."]],"c":[3],"es":"Tradisjonelle regnskap ser bakover, ikke fremover.","ed":"Tradisjonelle årsrapporter viser hva som har skjedd, mens investorer bryr seg om fremtiden. De mangler også mye ikke-finansiell informasjon, som intangibles og bærekraftsrisiko. Husk: regnskapet er bakoverskuende.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"","src":"Bok s. 151 (6.1.1) · Bok s. 152 (6.1.2)"},{"id":"SB237","l":"L7","t":"Limits of financial reporting","f":"m","d":3,"p":"M","sc":"none","s":"Why have reported earnings and book values become less useful (Lev and Zarowin, 1999)?","o":[["Firms put all intangibles on the balance sheet","Incorrect: the problem is that intangibles are mostly not capitalised."],["R&D costs come now, benefits later","Correct: R&D costs come now, but benefits come later."],["Auditors stopped checking R&D firms","Incorrect: it is about accounting rules."],["Markets no longer need accounts","Incorrect: accounting fails to show value well."]],"c":[1],"es":"R&D koster nå, men gevinsten kommer senere. Da passer ikke kostnad og inntekt sammen.","ed":"R&D kostnadsføres med en gang, men gevinsten kommer i fremtiden. Da passer ikke kostnader og inntekter sammen i tid (matching), og resultat og egenkapital gir et dårlig bilde av verdien. Lev og Zarowin mener dette har gjort regnskapet mindre nyttig. Husk: matching-problemet.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"","src":"Bok s. 152 (6.1.2) · Bok s. 153 (6.1.2)"},{"id":"SB238","l":"L7","t":"Sustainability reporting","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Hummel and Schlick (2016) find that weak sustainability performers publish the most detailed sustainability reports.","o":[["True","Incorrect. They find the opposite: the best performers publish the best reports to signal their quality."],["False","Correct. They find the opposite: the best performers publish the best reports to signal their quality."]],"c":[1],"es":"Usant. De beste rapporterer best, for å signalisere at de er gode.","ed":"Hummel og Schlick bruker signalling theory: firmaer som er gode på bærekraft, lager detaljerte rapporter for å vise det. Svake firmaer lager heller korte, vage rapporter. Husk: gode firmaer signaliserer.","kt":"","src":"Bok s. 153 (6.1.2) · Bok s. 155 (6.2.4) · Bok s. 170 (6.3.4)"},{"id":"SB239","l":"L7","t":"Environmental metrics","f":"m","d":2,"p":"H","sc":"short","s":"A car maker reports under the GHG Protocol. Emissions from customers driving its cars are:","o":[["Scope 3","Correct: customers driving the cars is Scope 3."],["Scope 2","Incorrect: Scope 2 is bought electricity, heat or steam."],["Scope 4","Incorrect: Scope 4 is avoided emissions."],["Scope 1","Incorrect: Scope 1 is the firm's own direct emissions."]],"c":[0],"es":"Kundenes kjøring er indirekte utslipp i verdikjeden = Scope 3.","ed":"GHG Protocol: Scope 1 er direkte utslipp fra egne kilder (fabrikker, egne biler). Scope 2 er indirekte utslipp fra kjøpt strøm og varme. Scope 3 er alle andre indirekte utslipp i verdikjeden, både oppstrøms (leverandører) og nedstrøms (kundenes bruk). Husk: 1 = eget, 2 = strøm, 3 = resten.\n\nForkortelser: GHG = Greenhouse Gas (klimagass).","kt":"","src":"Bok s. 153 (6.2.1) · Bok s. 154 (Box 6.1) · L7 slide 7"},{"id":"SB240","l":"L7","t":"Environmental metrics","f":"m","d":3,"p":"M","sc":"none","s":"Philips' emissions in 2017 (kilotons CO2e): scope 1 = 38, scope 2 = 58, scope 3 = 751, and 220 offset. Which reading is correct?","o":[["Scope 1 is the largest","Incorrect: Scope 1 (38) is the smallest."],["Scope 3 is the largest","Correct: Scope 3 (751) is by far the largest."],["Scope 3 fell sharply","Incorrect: Scope 3 rose."],["Offsets are never deducted from the total","Incorrect: offsets are deducted in the table."]],"c":[1],"es":"Scope 3 (751) er størst.","ed":"Philips har 38 i Scope 1, 58 i Scope 2 og 751 i Scope 3. Scope 3 er altså langt størst, noe som er vanlig for mange firmaer, siden det dekker hele verdikjeden. Husk: Scope 3 er ofte størst og vanskeligst å måle.","kt":"","src":"Bok s. 154 (Table 6.1) · Bok s. 154 (6.2.1)"},{"id":"SB241","l":"L7","t":"Social and governance metrics","f":"m","d":2,"p":"M","sc":"none","s":"Which is a SOCIAL metric?","o":[["Scope 2 emissions per sale","Incorrect: emissions are environmental."],["Board independence","Incorrect: board independence is governance."],["Management pay","Incorrect: management pay is governance."],["Accident rates at mines","Correct: accident rates are a social metric."]],"c":[3],"es":"Ulykker i gruver er en sosial (S) indikator.","ed":"Sosiale (S) indikatorer handler om mennesker: helse og sikkerhet, arbeidsforhold, menneskerettigheter, lokalsamfunn. Ulykker i gruver er et klassisk S-mål. Utslipp er E, og styre og lederlønn er G. Husk: mennesker = S.","kt":"","src":"Bok s. 155 (6.2.2) · Bok s. 155 (6.2.3)"},{"id":"SB242","l":"L7","t":"Metrics and value drivers","f":"m","d":3,"p":"H","sc":"none","s":"Value driver trees for Novozymes and a mining company show that:","o":[["Novozymes: people; miner: stakeholders","Correct: Novozymes is driven by people and innovation; the miner by stakeholders."],["Both have exactly the same ESG drivers","Incorrect: the point is that the drivers differ."],["Novozymes: local stakeholders matter most","Incorrect: local stakeholders are the miner's tree."],["Miner: innovation matters most","Incorrect: innovation is Novozymes' tree."]],"c":[0],"es":"Novozymes drives av folk og innovasjon. Gruveselskapet av lokale stakeholders.","ed":"Et value driver tree viser hvilke ESG-forhold som påvirker verdien. For Novozymes er det ansatte og innovasjon. For et gruveselskap er det lokalsamfunn og andre stakeholders, fordi konflikter kan stoppe driften. Husk: ESG-drivere avhenger av bransjen.","kt":"","src":"Bok s. 155 (6.2.4) · Bok s. 156 (Figure 6.1) · Bok s. 156 (Figure 6.2)"},{"id":"SB243","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An investor asks a shipping firm how climate change could affect its finances, how the board oversees this, and how it does under a 2°C scenario. Which framework fits best?","o":[["A materiality matrix alone","Incorrect: a matrix alone gives no scenarios or governance view."],["Integrated Reporting (<IR>)","Incorrect: <IR> covers six capitals, not climate specifically."],["TCFD","Correct: TCFD covers climate governance, strategy and scenarios."],["GRI","Incorrect: GRI focuses on impacts for all stakeholders."]],"c":[2],"es":"Klima + styrets rolle + 2°C-scenario = TCFD.","ed":"TCFD (Task Force on Climate-related Financial Disclosures) handler om hvordan klima påvirker firmaets økonomi. Den har fire deler: governance (styrets rolle), strategy (inkl. scenarioer som 2 °C), risk management og metrics and targets. Investorens tre spørsmål passer akkurat. Husk: TCFD = klima + finans.\n\nForkortelser: GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders); IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi); TCFD = Task Force on Climate-related Financial Disclosures (rammeverk for klimarisiko-rapportering).","kt":"TCFD: climate-related financial disclosures in four pillars - governance, strategy, risk management, metrics and targets.","src":"L7 slide 4 · L7 slide 16-17"},{"id":"SB244","l":"L7","t":"Reporting frameworks","f":"m","d":2,"p":"M","sc":"none","s":"Where are TCFD and CDP disclosures made?","o":[["TCFD on the CDP website; CDP in the accounts","Incorrect: the two are swapped."],["TCFD: annual report; CDP: own platform","Correct: TCFD goes in the annual report; CDP uses its own platform."],["Neither is public","Incorrect: both are public."],["Both only in separate CSR reports","Incorrect: TCFD aims for the annual report."]],"c":[1],"es":"TCFD i årsrapporten, CDP på egen plattform.","ed":"TCFD-informasjonen skal stå i den vanlige årsrapporten, slik at klimarisiko behandles som annen finansiell risiko. CDP er en egen plattform der firmaer svarer på spørreskjema om klima, vann og skog. Husk: TCFD = årsrapport, CDP = egen plattform.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar); TCFD = Task Force on Climate-related Financial Disclosures (rammeverk for klimarisiko-rapportering); CDP = tidligere Carbon Disclosure Project (plattform for klimarapportering).","kt":"","src":"L7 slide 4 · L7 slide 18-19 · Bok s. 170 (6.4)"},{"id":"SB245","l":"L7","t":"TCFD","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the four TCFD areas?","o":[["Product pricing","Incorrect: product pricing is not a TCFD area."],["Governance","Correct: governance is one of the four TCFD areas."],["Employee diversity","Incorrect: TCFD is about climate only."],["Dividend policy","Incorrect: dividend policy is not a TCFD area."]],"c":[1],"es":"Governance er ett av fire TCFD-områder.","ed":"TCFD har fire områder: governance (hvordan styret følger med på klimarisiko), strategy (effekter og scenarioer), risk management (hvordan risiko håndteres) og metrics and targets (tall og mål). Husk: G-S-R-M.\n\nForkortelser: TCFD = Task Force on Climate-related Financial Disclosures (rammeverk for klimarisiko-rapportering).","kt":"","src":"L7 slide 16-17 · Bok s. 173 (6.5)"},{"id":"SB246","l":"L7","t":"Integrated reporting","f":"m","d":2,"p":"H","sc":"none","s":"The IIRC (2013) defines an integrated report as:","o":[["A short report on how the firm creates value","Correct: a short report on how the firm creates value."],["A separate CSR report","Incorrect: a separate CSR report is the silo approach IR replaces."],["A mandatory EU taxonomy report","Incorrect: that is EU Taxonomy reporting."],["All of the firm's data in one very long document","Incorrect: IR should be concise."]],"c":[0],"es":"En kort rapport om hvordan firmaet skaper verdi.","ed":"IIRC definerer en integrated report som en kort rapport om hvordan firmaets strategi, governance, resultater og fremtidsutsikter skaper verdi over tid. Den skal erstatte separate rapporter (siloer) og koble finansiell og ikke-finansiell info. Husk: kort + verdiskaping.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar); IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi); IIRC = International Integrated Reporting Council (står bak <IR>-rammeverket).","kt":"","src":"L7 slide 8-9 · Bok s. 157 (6.3.1) · Bok s. 173 (Key concepts)"},{"id":"SB247","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A hospital group prepares an integrated report. Which item is correctly classified?","o":[["Nurses' skills - human capital","Correct: nurses' skills are human capital."],["Software patents - natural capital","Incorrect: patents are intellectual capital."],["Hospital buildings - intellectual capital","Incorrect: buildings are manufactured capital."],["Cash - social capital","Incorrect: cash is financial capital."]],"c":[0],"es":"Sykepleiernes kompetanse = human capital.","ed":"Integrated reporting bruker seks capitals: financial (penger), manufactured (bygg, utstyr), intellectual (patenter, programvare), human (ansattes kompetanse og motivasjon), social and relationship (relasjoner, tillit) og natural (natur, ressurser). Husk: folkets ferdigheter = human.\n\nForkortelser: IIRC = International Integrated Reporting Council (står bak <IR>-rammeverket).","kt":"Six capitals (IIRC): financial, manufactured, intellectual, human, social and relationship, natural.","src":"L7 slide 10 · Bok s. 159 (6.3.1.1)"},{"id":"SB248","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"Which is a guiding PRINCIPLE (not a content element) of integrated reporting?","o":[["Business model and value creation","Incorrect: this is a content element."],["Outlook and uncertainties","Incorrect: this is a content element."],["Connectivity of information","Correct: connectivity of information is a guiding principle."],["Risks and opportunities","Incorrect: this is a content element."]],"c":[2],"es":"Connectivity of information er et prinsipp. De andre er innholdselementer.","ed":"Integrated reporting har guiding principles (hvordan rapporten lages: strategic focus, connectivity of information, stakeholder relationships, materiality, conciseness, reliability, consistency) og content elements (hva den inneholder: business model, risks and opportunities, outlook osv.). Husk: principles = hvordan, content = hva.","kt":"","src":"L7 slide 11 · Bok s. 160 (6.3.1.2) · Bok s. 161 (6.3.1.2)"},{"id":"SB249","l":"L7","t":"Integrated reporting","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Philips' 2016 integrated report does NOT meet the principle of conciseness, because it is 226 pages long.","o":[["True","Correct. At 226 pages the report is not concise, so it fails that principle."],["False","Incorrect. At 226 pages the report is not concise, so it fails that principle."]],"c":[0],"es":"Sant. 226 sider er ikke kort.","ed":"Conciseness er et av prinsippene i integrated reporting: rapporten skal være kort og fokusert på det som er material. Philips sin rapport på 226 sider er for lang. Husk: integrated report skal være kort.","kt":"","src":"Bok s. 164 (Table 6.3) · Bok s. 165 (Table 6.4)","e":1},{"id":"SB250","l":"L7","t":"Six capitals balance sheet","f":"m","d":4,"p":"H","sc":"none","s":"For a mining firm, a six capitals balance sheet adds large negative natural capital. What happens to the picture of the firm?","o":[["Equity falls; risk rises","Correct: equity falls and risk rises."],["Debt disappears from the balance sheet","Incorrect: debt stays."],["Nothing changes","Incorrect: the picture changes a lot."],["Equity rises","Incorrect: equity falls."]],"c":[0],"es":"Negativ natural capital senker egenkapitalen og øker risikoen.","ed":"En six capitals balance sheet tar med verdier og forpliktelser som ikke står i vanlig regnskap. For et gruveselskap gir naturskaden en stor negativ natural capital. Da blir egenkapitalen lavere, og gjeldsgraden og risikoen ser høyere ut. Husk: skjulte forpliktelser blir synlige.","kt":"Six capitals balance sheet: a balance sheet valuing financial, manufactured, intellectual, human, social and natural capital, including negative capital (e.g. environmental damage).","src":"Bok s. 166 (Figure 6.6) · Bok s. 167 (6.3.2.2)"},{"id":"SB251","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"H","sc":"none","s":"Which framework is aimed at ALL stakeholders, not mainly investors?","o":[["SASB","Incorrect: SASB is for investors."],["IFRS","Incorrect: IFRS is for investors and lenders."],["<IR>","Incorrect: <IR> is mainly for providers of capital."],["GRI","Correct: GRI is for all stakeholders."]],"c":[3],"es":"GRI er for alle stakeholders.","ed":"GRI har et stakeholder-perspektiv: rapporten skal vise firmaets påvirkning på økonomi, miljø og mennesker, for alle interessenter. SASB, IFRS/ISSB og <IR> er hovedsakelig rettet mot investorer og andre kapitalgivere. Husk: GRI = alle, de andre = investorer.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders); IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi); IFRS = International Financial Reporting Standards (regnskapsstandarder); ISSB = International Sustainability Standards Board (IFRS sin bærekraftsstandard for investorer).","kt":"","src":"Bok s. 157 (6.3) · Bok s. 158 (Table 6.2) · Bok s. 162 (6.3.1.3)"},{"id":"SB252","l":"L7","t":"Reporting frameworks","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The textbook calls the IIRC rules based, GRI principles based and SASB the same for all industries.","o":[["True","Incorrect. It is the reverse: IIRC is principles-based, GRI is rules-based, and SASB is industry-specific."],["False","Correct. It is the reverse: IIRC is principles-based, GRI is rules-based, and SASB is industry-specific."]],"c":[1],"es":"Usant. IIRC er principles based, GRI rules based, SASB bransjespesifikk.","ed":"IIRC (<IR>) gir prinsipper og lar firmaet velge hvordan, altså principles-based. GRI har detaljerte standarder og indikatorer, altså rules-based. SASB har egne standarder for hver bransje. Husk: IIRC = prinsipper, GRI = regler, SASB = per bransje.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders); IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi); IIRC = International Integrated Reporting Council (står bak <IR>-rammeverket).","kt":"","src":"Bok s. 157 (6.3) · Bok s. 161 (6.3.1.3) · Bok s. 162 (6.3.1.4)"},{"id":"SB253","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"L","sc":"none","s":"Which is one of SASB's criteria for picking material topics?","o":[["Linked to at least three SDGs","Incorrect: SDG links are not a SASB criterion."],["Relevant across an industry","Correct: relevant across an industry is a SASB criterion."],["Approved by the auditor","Incorrect: auditor approval is not a criterion."],["Relevant to society, even with no effect on the firm","Incorrect: impact on society regardless of the firm is GRI's view."]],"c":[1],"es":"SASB velger issues som er relevante for en hel bransje.","ed":"SASB velger material topics for hver bransje ut fra kriterier som finansiell effekt, investorinteresse og at temaet er relevant for hele bransjen. Fokuset er alltid investorens perspektiv. Husk: SASB = bransje + investor.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger); SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders).","kt":"","src":"Bok s. 162 (6.3.1.4) · L6 slide 50-51"},{"id":"SB254","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"A study compares no ESG reporting, separate ESG reports, ESG in the annual report, and integrated reporting (<IR>). What does it find?","o":[["<IR> beats some forms, not all","Correct: <IR> beats no ESG reporting and ESG in the annual report, but not a stand-alone ESG report."],["<IR> is the worst form","Incorrect: <IR> beats two of the other forms."],["Switching to <IR> always helps the firm","Incorrect: firms gain nothing from switching from a stand-alone ESG report to <IR>."],["No ESG reporting is best","Incorrect: no ESG reporting is worse than <IR>."]],"c":[0],"es":"<IR> er bedre enn ingen ESG-rapport og ESG i årsrapporten, men ikke bedre enn en egen ESG-rapport.","ed":"Studien (L7, slide 13) sammenligner fire former: ingen ESG-rapportering, en egen ESG-rapport (stand-alone), ESG som et kapittel i årsrapporten, og integrated reporting (<IR>). <IR> er bedre enn ingen ESG-rapportering og bedre enn ESG i årsrapporten. Men firmaer som allerede har en egen ESG-rapport, tjener ikke noe på å bytte til <IR>. Ingen form er altså bedre enn <IR>, men en egen ESG-rapport er omtrent like god. Husk: <IR> slår \"ingen\" og \"i årsrapporten\", ikke \"stand-alone\".\n\nForkortelser: IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi).","kt":"","src":"L7 slide 13 · Bok s. 163 (6.3.2)"},{"id":"SB255","l":"L7","t":"Mandatory vs voluntary reporting","f":"m","d":3,"p":"H","sc":"short","s":"In 2023 the US SEC fined DWS USD 19 million for false claims about its ESG investing. This shows that:","o":[["ESG claims never need to be checked","Incorrect: the fine shows claims are checked."],["Enforcement of claims matters","Correct: enforcement of claims matters."],["Only small firms greenwash","Incorrect: DWS is a large asset manager."],["Regulators cannot act","Incorrect: the SEC did act."]],"c":[1],"es":"Myndighetene sjekker og straffer falske ESG-påstander.","ed":"SEC bøtela DWS (eid av Deutsche Bank) for å overdrive sin ESG-integrering. Saken viser at myndighetene sjekker og straffer greenwashing, og at påstander må kunne dokumenteres. Husk: enforcement gjør påstander troverdige.\n\nForkortelser: SEC = Securities and Exchange Commission (USAs finanstilsyn).","kt":"Greenwashing: making misleading claims about environmental or sustainability performance.","src":"L7 slide 26 · L8 slide 19 · PwC s. 30"},{"id":"SB256","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"Which is a BARRIER to adopting integrated reporting?","o":[["Status quo bias","Correct: status quo bias is a barrier."],["A lower cost of capital","Incorrect: a lower cost of capital is an incentive."],["Attracting more long-term investors","Incorrect: attracting long-term investors is an incentive."],["Keeping up with peers","Incorrect: keeping up with peers is an incentive."]],"c":[0],"es":"Status quo bias hindrer IR. De andre er grunner til å bruke det.","ed":"Læreboka lister incentiver for integrated reporting (lavere kapitalkostnad, langsiktige investorer, følge konkurrentene) og barrierer. Status quo bias, at man helst fortsetter som før, er en barriere. Husk: incentiv vs barriere.\n\nForkortelser: IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi).","kt":"","src":"Bok s. 167 (6.3.3) · Bok s. 168 (Table 6.5)"},{"id":"SB257","l":"L7","t":"Integrated reporting","f":"m","d":4,"p":"M","sc":"none","s":"Integrated reporting measures a firm's net impact, but not against system limits. Why is that a problem?","o":[["Eco-efficiency is stricter","Incorrect: eco-effectiveness is the stricter idea."],["IR measures limits, not impact","Incorrect: swapped: IR measures impact but not limits."],["Efficiency does not show it stays within limits","Correct: being efficient does not show you stay within limits."],["System limits are already in market prices","Incorrect: externalities are mostly not priced."]],"c":[2],"es":"Effektivitet sier ikke om firmaet holder seg innenfor naturens grenser.","ed":"Eco-efficiency betyr mindre skade per produsert enhet. Eco-effectiveness betyr å holde seg innenfor naturens absolutte grenser. Integrated reporting måler firmaets påvirkning, men sammenligner den ikke med systemets grenser. Et firma kan bli mer effektivt og likevel bidra til overshoot. Husk: efficiency ≠ effectiveness.\n\nForkortelser: IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi).","kt":"","src":"Bok s. 168 (6.3.3)"},{"id":"SB258","l":"L7","t":"Integrated reporting","f":"m","d":4,"p":"M","sc":"none","s":"Why does Flower (2015) call the IIRC \"a story of failure\"?","o":[["It requires a money value for all six capitals","Incorrect: there is no such requirement."],["It focuses on value for investors","Correct: Flower says the IIRC focuses on value for investors."],["It focuses too much on society","Incorrect: he argues the opposite."],["It was started by NGOs","Incorrect: he says the accounting profession dominates."]],"c":[1],"es":"Flower: IIRC fokuserer på verdi for investorer, ikke samfunnet.","ed":"Flower (2015) mener IIRC sviktet fordi rammeverket fokuserer på verdi for investorer, ikke for samfunnet, og fordi det ikke krever rapportering om påvirkning på andre. Han mener også at regnskapsbransjen dominerte arbeidet. Husk: kritikk = investorfokus.\n\nForkortelser: NGO = Non-Governmental Organisation (frivillig organisasjon, f.eks. Greenpeace); IIRC = International Integrated Reporting Council (står bak <IR>-rammeverket).","kt":"","src":"Bok s. 169 (6.3.4) · Bok s. 170 (6.3.4)"},{"id":"SB259","l":"L7","t":"Integrated reporting","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Churet and Eccles (2014) see integrated reporting as a good sign of high-quality management.","o":[["True","Correct. They argue that firms able to explain sustainability for long-term success are well managed."],["False","Incorrect. They argue that firms able to explain sustainability for long-term success are well managed."]],"c":[0],"es":"Sant. IR viser at ledelsen forstår bærekraft for langsiktig suksess.","ed":"Churet og Eccles mener at firmaer som klarer å vise hvordan bærekraft henger sammen med langsiktig suksess, har god ledelse. Integrated reporting blir dermed et signal om kvalitet i ledelsen. Husk: IR = signal om god ledelse.\n\nForkortelser: IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi).","kt":"","src":"Bok s. 169 (6.3.4)","e":1},{"id":"SB260","l":"L7","t":"Mandatory reporting","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A Norwegian seafood firm under the CSRD harms wild salmon, but this barely affects its finances. Must it report on this?","o":[["Only if an NGO asks","Incorrect: the duty comes from the law."],["Yes, under double materiality","Correct: yes, under double materiality."],["No: only financial issues count under CSRD","Incorrect: that is single materiality."],["No: only GRI covers this","Incorrect: ESRS also require impact materiality."]],"c":[1],"es":"Ja. Under double materiality er impact nok, selv uten finansiell effekt.","ed":"CSRD og ESRS bygger på double materiality: et tema må rapporteres hvis det er material fra et impact-perspektiv eller et finansielt perspektiv. Skade på villaks er impact-material, selv om det knapt påvirker økonomien. Husk: impact ELLER financial er nok.\n\nForkortelser: GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders); CSRD = Corporate Sustainability Reporting Directive (EUs lov om bærekraftsrapportering); ESRS = European Sustainability Reporting Standards (standardene under CSRD); NGO = Non-Governmental Organisation (frivillig organisasjon, f.eks. Greenpeace).","kt":"Double materiality: report an issue if it affects the company's value (financial materiality) or if the company significantly affects people or the environment (impact materiality).","src":"L7 slide 23-25 · PwC s. 29 · L6 slide 50"},{"id":"SB261","l":"L7","t":"Mandatory reporting","f":"m","d":2,"p":"H","sc":"none","s":"One goal of the EU Taxonomy is to:","o":[["Prevent greenwashing","Correct: the EU Taxonomy aims to prevent greenwashing."],["Replace credit ratings","Incorrect: replacing credit ratings is not a goal."],["Ban fossil fuel investment","Incorrect: it is a classification, not a ban."],["Set mandatory ESG ratings","Incorrect: it does not rate firms."]],"c":[0],"es":"EU Taxonomy skal hindre greenwashing.","ed":"EU Taxonomy er et klassifiseringssystem som definerer hvilke økonomiske aktiviteter som er miljømessig bærekraftige. Målet er felles språk, mer kapital til grønt og mindre greenwashing. Den forbyr ingenting og rater ikke firmaer. Husk: taxonomy = felles definisjon av grønt.","kt":"","src":"L7 slide 21-22 · PwC s. 32"},{"id":"SB262","l":"L7","t":"Effects of reporting","f":"m","d":3,"p":"H","sc":"none","s":"How can greenwashing best be prevented, according to the research in the course?","o":[["Ban all sustainability claims","Incorrect: a ban is not proposed."],["Keep reporting fully voluntary","Incorrect: fully voluntary reporting makes greenwashing easier."],["Let rating agencies check every claim","Incorrect: ratings are themselves unreliable."],["Mix voluntary and mandatory rules","Correct: mix voluntary and mandatory rules."]],"c":[3],"es":"En blanding av frivillige og obligatoriske regler.","ed":"Forskningen finner at helt frivillig rapportering gjør greenwashing lett, fordi firmaene velger hva de viser. En blanding av obligatoriske krav (med kontroll) og frivillig rapportering gir best resultat. Husk: frivillig alene = greenwashing.","kt":"","src":"L7 slide 26 · L7 slide 30-31 · PwC s. 30"},{"id":"SB263","l":"L7","t":"Effects of reporting","f":"m","d":4,"p":"M","sc":"none","s":"Krueger et al. (2021) study mandatory ESG disclosure around the world. They find that it:","o":[["improves information","Correct: mandatory disclosure improves information."],["increases bad ESG events","Incorrect: bad incidents go down."],["has no effect on information","Incorrect: information gets better."],["matters only for firms that already report well","Incorrect: the effect is largest where information was poor."]],"c":[0],"es":"Obligatorisk rapportering gir bedre informasjon.","ed":"Krueger et al. studerer land som innførte obligatorisk ESG-rapportering. De finner bedre og mer tilgjengelig ESG-informasjon, og færre negative ESG-hendelser etterpå. Effekten er størst der informasjonen var dårligst før. Husk: mandatory → bedre data.","kt":"","src":"L7 slide 27-29"},{"id":"SB264","l":"L7","t":"Effects of reporting","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A retailer promises \"net zero by 2050\" with no interim targets, counts only its own stores' emissions, and buys cheap offsets. Its supply chain is 95% of emissions. What problems does this show?","o":[["Too much focus on developing countries","Incorrect: not the issue here."],["Too strict definitions","Incorrect: the definitions are too loose, if anything."],["Weak targets, hidden supply chain","Correct: weak targets and a hidden supply chain (Scope 3)."],["Too much auditing","Incorrect: the problem is the opposite."]],"c":[2],"es":"Svake mål og skjult Scope 3 (leverandørkjeden).","ed":"Et net zero-mål for 2050 uten delmål er lett å love og vanskelig å kontrollere. Å telle bare egne butikker ignorerer Scope 3, som her er 95 % av utslippene. Billige offsets gjør det verre. Husk: sjekk delmål, Scope 3 og kvalitet på offsets.","kt":"Scope 3 emissions: indirect emissions across the value chain (suppliers and product use), often the largest share.","src":"L7 slide 30 · L7 slide 7 · PwC s. 24"},{"id":"SB265","l":"L7","t":"ESG ratings","f":"m","d":2,"p":"M","sc":"none","s":"Where do MSCI and Sustainalytics fit among ESG data providers?","o":[["Raw data on one topic","Incorrect: raw data on one topic is e.g. Southpole."],["Ratings on one topic","Incorrect: ratings on one topic are e.g. Equileap."],["Broad ratings","Correct: MSCI and Sustainalytics give broad ratings on all topics."],["Broad raw data","Incorrect: broad raw data is e.g. RepRisk."]],"c":[2],"es":"MSCI og Sustainalytics gir brede ratinger.","ed":"ESG-dataleverandører kan deles i fire: raw data på ett tema (Southpole, utslipp), ratings på ett tema (Equileap, kjønn), broad raw data (RepRisk, nyheter) og broad ratings (MSCI, Sustainalytics, som scorer alt). Husk: MSCI = bred rating.\n\nForkortelser: MSCI = stor leverandør av indekser og ESG-ratinger.","kt":"","src":"Bok s. 170 (6.4) · Bok s. 171 (Table 6.6) · L7 slide 32"},{"id":"SB266","l":"L7","t":"ESG ratings","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Two rating agencies have the same E, S and G scores for a firm. Agency 1 weights G most; agency 2 weights E most. The firm is strong on G but weak on E. What happens?","o":[["Agency 2 rates it higher","Incorrect: a heavy E weight lowers the score."],["Both give the same rating","Incorrect: the weights change the total score."],["Ratings differ only if data differ","Incorrect: method also creates differences."],["Agency 1 rates it higher","Correct: agency 1 weights G most, and the firm is strong on G."]],"c":[3],"es":"Byrå 1 vekter G mest, og firmaet er sterkt på G. Byrå 1 gir høyest.","ed":"Selv med samme data kan ratingbyråer gi ulik totalscore fordi de vekter E, S og G forskjellig. Firmaet er sterkt på G og svakt på E. Byrå 1 vekter G mest, så det gir høyest score. Husk: vekter skaper uenighet.","kt":"Rating divergence: different ESG ratings for the same firm, driven by differences in scope, measurement and weights.","src":"Bok s. 171 (Figure 6.7) · L7 slide 36-37 · Fondsfinans s. 16"},{"id":"SB267","l":"L7","t":"ESG ratings","f":"m","d":3,"p":"H","sc":"none","s":"According to Kotsantonis (2019), how does disagreement among ESG data providers change with more public information?","o":[["It increases","Correct: disagreement increases with more information."],["It disappears","Incorrect: more information gives more room to interpret."],["It only exists with no data","Incorrect: disagreement exists and grows."],["It is unrelated","Incorrect: there is a positive link."]],"c":[0],"es":"Mer info gir mer uenighet.","ed":"Man skulle tro at mer informasjon ga mer enighet. Kotsantonis finner det motsatte: mer offentlig ESG-informasjon gir mer uenighet mellom leverandørene, fordi de tolker og vekter den ulikt. Husk: mer data ≠ mer enighet.","kt":"","src":"L7 slide 37 · Starks s. 1843"},{"id":"SB268","l":"L7","t":"ESG ratings","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"An oil firm gets a high ESG rating when compared with oil peers, and a low one when compared with all firms. This shows:","o":[["One provider made a mistake","Incorrect: both ratings can be consistent with their methods."],["The peer group can drive the rating","Correct: the peer group can drive the rating."],["Ratings always measure absolute impact","Incorrect: industry-relative ratings measure performance vs peers."],["The firm is greenwashing","Incorrect: the gap comes from method."]],"c":[1],"es":"Sammenligningsgruppen styrer ratingen.","ed":"Mange ratinger sammenligner firmaet med bransjen (best-in-class). Et oljeselskap kan være best blant oljeselskaper og få høy score, men dårlig sammenlignet med alle firmaer. Valg av sammenligningsgruppe styrer altså ratingen. Husk: best i bransjen ≠ bra totalt.","kt":"","src":"L7 slide 37 · L7 slide 36"},{"id":"SB269","l":"L7","t":"ESG ratings","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Many investors treat ESG ratings as the final answer instead of a starting point, and many follow proxy advisors' voting advice automatically.","o":[["True","Correct. The book warns that many use ratings and proxy advice uncritically instead of as a starting point."],["False","Incorrect. The book warns that many use ratings and proxy advice uncritically instead of as a starting point."]],"c":[0],"es":"Sant. Mange bruker ratinger som fasit og følger stemmeråd blindt.","ed":"Læreboka advarer mot å bruke ESG-ratinger som fasit. De bør være et utgangspunkt for egen analyse. Mange følger også stemmeråd fra proxy advisors automatisk. Utfordringen er å skille material fra immaterielle saker. Husk: rating = start, ikke svar.","kt":"","src":"Bok s. 172 (6.4)"},{"id":"SB270","l":"L7","t":"ESG ratings","f":"t","d":3,"p":"L","sc":"none","s":"True or false: \"In strict ESG terms\", ESG ratings aim to reward firms for doing good for society, regardless of risk.","o":[["True","Incorrect. ESG ratings mainly measure risks to the firm, not how much good it does for society."],["False","Correct. ESG ratings mainly measure risks to the firm, not how much good it does for society."]],"c":[1],"es":"Usant. ESG-ratinger måler risiko for firmaet, ikke godhet.","ed":"De fleste ESG-ratinger måler hvor godt firmaet håndterer ESG-risiko som kan påvirke verdien (regulering, omdømme). De måler ikke hvor mye godt firmaet gjør for samfunnet. Husk: rating = risiko for firmaet, ikke impact.","kt":"","src":"L7 slide 40"},{"id":"SB271","l":"L7","t":"ESG ratings","f":"t","d":4,"p":"H","sc":"short","s":"True or false: In 2022 Tesla was dropped from an ESG index while ExxonMobil stayed in. This fits the view that ESG ratings often measure ESG risk management relative to the industry, not positive impact.","o":[["True","Correct. Ratings often measure risk management relative to the industry, so an oil major can score high."],["False","Incorrect. Ratings often measure risk management relative to the industry, so an oil major can score high."]],"c":[0],"es":"Sant. Ratinger måler risikostyring mot bransjen, ikke positiv impact.","ed":"Tesla ble tatt ut av S&P 500 ESG-indeksen, mens ExxonMobil ble værende. Grunnen er at ratinger ofte måler risikostyring relativt til bransjen (Exxon er \"god\" for et oljeselskap) og vekter G og S tungt (Tesla hadde problemer der). Husk: rating ≠ positiv impact.\n\nForkortelser: S&P = Standard & Poor's (ratingbyrå og indeksleverandør).","kt":"Industry-relative (best-in-class) rating: scores a firm against its industry peers rather than across all industries.","src":"L7 slide 37 · Fondsfinans s. 6"},{"id":"SB272","l":"L7","t":"Reporting and materiality","f":"m","d":3,"p":"M","sc":"short","s":"A firm uses little water but operates where water is scarce. Under which framework should it still report on water?","o":[["None","Incorrect: GRI can still require it."],["GRI","Correct: GRI looks at impact in water-scarce areas."],["SASB","Incorrect: SASB is investor-focused."],["IFRS","Incorrect: IFRS is financial."]],"c":[1],"es":"GRI krever rapportering på vann når firmaet påvirker et tørt område.","ed":"GRI bruker impact materiality og ser på sammenhengen (sustainability context). Selv lite vannbruk kan ha stor påvirkning i et område med vannmangel. Derfor bør firmaet rapportere på vann under GRI. Husk: GRI = påvirkning i konteksten.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders); IFRS = International Financial Reporting Standards (regnskapsstandarder).","kt":"","src":"Bok s. 161 (6.3.1.3) · Bok s. 158 (Table 6.2)"},{"id":"SB273","l":"L7","t":"Integrated thinking","f":"m","d":3,"p":"M","sc":"none","s":"The IIRC says integrated reporting serves a deeper goal. That goal is:","o":[["Integrated thinking","Correct: the deeper goal is integrated thinking."],["Top ESG ratings for all","Incorrect: ratings are not the goal."],["As many ESG indicators as possible","Incorrect: IR should be concise."],["Replacing financial statements","Incorrect: IR does not replace financial statements."]],"c":[0],"es":"Målet er integrated thinking.","ed":"IIRC sier at rapporten bare er et middel. Det egentlige målet er integrated thinking: at ledelsen tenker helhetlig om hvordan alle typer kapital henger sammen i beslutningene. Husk: rapporten → tenkemåten.\n\nForkortelser: IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi); IIRC = International Integrated Reporting Council (står bak <IR>-rammeverket).","kt":"","src":"Bok s. 158 (6.3.1.1) · Bok s. 159 (6.3.1.1) · Bok s. 157 (6.3.1)"},{"id":"SB274","l":"L7","t":"Reporting and value","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Airline A shows photos of tree planting. Airline B reports fuel use per passenger-km, a 2030 green fuel target and the cost impact. Which report helps investors more?","o":[["Neither","Incorrect: most investors use ESG information."],["Both equally","Incorrect: the quality differs a lot."],["A: the photos show real commitment","Incorrect: photos are not comparable or useful."],["B: material data linked to costs","Correct: B gives material data linked to costs."]],"c":[3],"es":"B gir målbare tall koblet til kostnader.","ed":"Investorer trenger material, målbare og sammenlignbare data som kan kobles til value drivers. Drivstoff per passasjerkilometer, et grønt drivstoffmål og kostnadseffekt kan legges rett inn i analysen. Bilder av treplanting kan ikke det. Husk: material KPI-er > historier.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall).","kt":"Decision-useful information: material, reliable, comparable and forward-looking data that can change an investor's assessment.","src":"L7 slide 14-15 · Bok s. 160 (6.3.1.2)"},{"id":"CX059","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"Excluding all tobacco and weapons stocks is an example of:","o":[["Negative screening","Utelukke bransjer = negative screening."],["Best-in-class screening","Best-in-class beholder alle bransjer."],["ESG integration","Integration handler om verdsettelse."],["Thematic investing","Tematisk velger et tema aktivt."]],"c":[0],"es":"Ekskludering = negative screening.","ed":"Negative screening er den enkleste SRI-strategien, og den vanligste i SF 1.0.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka); SRI = Socially Responsible Investing (ansvarlig investering).","kt":"","src":"L8 slide 43 · L9 slide 35","k":1},{"id":"CX060","l":"L8","t":"SRI strategies","f":"t","d":2,"p":"H","sc":"none","s":"Does best-in-class screening exclude entire sectors such as oil and gas?","o":[["Yes","Feil. Best-in-class beholder alle bransjer, men velger de beste selskapene i hver."],["No","Riktig. Best-in-class beholder alle bransjer, men velger de beste selskapene i hver."]],"c":[1],"es":"Nei: best-in-class velger de beste innen hver bransje.","ed":"Å fjerne en hel bransje er negative screening. De to kan kombineres.","kt":"","src":"L8 slide 45-52 · Bok s. 189 (7.2.2)","k":1},{"id":"CX061","l":"L8","t":"ESG integration","f":"m","d":2,"p":"H","sc":"short","s":"Lowering a utility's forecast margins for expected carbon costs is an example of:","o":[["Thematic investing","Tematisk investering velger et tema, f.eks. rent vann."],["Negative screening","Ingen selskaper blir ekskludert."],["Impact investing","Målet er ikke å skape målbar positiv effekt."],["ESG integration","ESG-informasjon bygges inn i selve verdsettelsen."]],"c":[3],"es":"ESG i prognosene = ESG integration.","ed":"ESG integration: finn de vesentlige ESG-temaene og legg dem inn i salg, marginer, investeringer eller risiko.","kt":"","src":"Opptak L8 ca. 52 min","k":1},{"id":"CX062","l":"L8","t":"Impact investing","f":"t","d":2,"p":"H","sc":"none","s":"Does impact investing require an intention to create measurable positive impact?","o":[["Yes","Riktig. Intentionality og impact measurement er kjennetegn ved impact investing."],["No","Feil. Intentionality og impact measurement er kjennetegn ved impact investing."]],"c":[0],"es":"Ja: intensjon + måling.","ed":"GIIN: intentionality, return expectations, range of returns and asset classes, impact measurement.\n\nForkortelser: GIIN = Global Impact Investing Network.","kt":"","src":"L8 slide 61-65 · L8 slide 39","k":1},{"id":"CX063","l":"L8","t":"Impact investing","f":"m","d":2,"p":"H","sc":"none","s":"Impact investing belongs to:","o":[["SF 1.0","SF 1.0 er f.eks. ekskludering."],["Traditional finance","Tradisjonell finans ser bare på avkastning."],["SF 3.0","Impact først, med krav om minimum avkastning = SF 3.0."],["SF 2.0","SF 2.0 er integrated value, f.eks. ESG integration."]],"c":[2],"es":"Impact investing = SF 3.0.","ed":"Impact investing er fortsatt ikke veldedighet: det kreves en finansiell avkastning, men samfunns- og miljøeffekten kommer først.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Opptak L8 ca. 67 min · Opptak L9 ca. 85 min","k":1},{"id":"CX064","l":"L8","t":"SFDR","f":"m","d":2,"p":"H","sc":"none","s":"Under the EU's SFDR, the fund type with sustainable investment as its objective is:","o":[["An Article 8 fund","Artikkel 8 fremmer bare E/S-egenskaper (light green)."],["An Article 9 fund","Artikkel 9 = dark green."],["An Article 6 fund","Artikkel 6 har ingen bærekraftsmål."],["An Article 2 fund","Det er ikke en fondskategori."]],"c":[1],"es":"Artikkel 9 = dark green.","ed":"SFDR: artikkel 6 (ingen bærekraftsmål), artikkel 8 (fremmer E/S), artikkel 9 (bærekraftig investering er målet).\n\nForkortelser: SFDR = Sustainable Finance Disclosure Regulation (EU-regler som deler fond i Article 6/8/9).","kt":"","src":"L8 slide 22-27","k":1},{"id":"CX065","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"short","s":"After years of failed dialogue with a firm, an investor's last step is:","o":[["Asking the miner for a sustainability report","Det er et tidlig steg i dialogen."],["Buying more shares quietly","Det er ikke eskalering."],["Divesting the shares (exit)","Når voice ikke virker, er exit det siste steget."],["Starting a first private meeting","Det er starten på engagement, ikke slutten."]],"c":[2],"es":"Voice først, exit til slutt.","ed":"Eksempel: LGIM og Glencore. Dialog fra 2016, aksjonærforslag i 2023, og salg fra noen fond i 2024.","kt":"","src":"L8 slide 56-58 · L8 slide 71","k":1},{"id":"CX066","l":"L8","t":"Investment industry","f":"m","d":2,"p":"H","sc":"none","s":"An example of an asset owner is:","o":[["A pension fund","Pensjonsfond eier pengene på vegne av sparerne."],["An asset manager hired to run money","Det er en forvalter, ikke en eier."],["An ESG rating agency","De lager ratinger, de eier ikke pengene."],["A proxy advisor","Proxy advisors gir stemmeråd."]],"c":[0],"es":"Pensjonsfond = asset owner.","ed":"Kjeden: sparere → asset owners (pensjonsfond, forsikringsselskaper) → asset managers → selskaper.","kt":"","src":"L8 slide 14 · Bok s. 185 (7.1.4) · Bok s. 185 (Figure 7.1)","k":1},{"id":"CX067","l":"L8","t":"Investment chains","f":"m","d":2,"p":"H","sc":"none","s":"Long investment chains tend to lead to:","o":[["More voting by end savers","Sparerne kommer lenger unna selskapene."],["More short-termism","Hvert ledd måles kortsiktig, og informasjon går tapt."],["Lower agency costs","Flere ledd gir flere agency problems."],["A longer-term focus","Det er motsatt."]],"c":[1],"es":"Lange kjeder = short-termism.","ed":"Boka anbefaler korte kjeder og langsiktige mandater for long-term value creation (LTVC).\n\nForkortelser: LTVC = Long-Term Value Creation (langsiktig verdiskaping).","kt":"","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 186 (7.1.4) · Bok s. 187 (7.1.4)","k":1},{"id":"EX06","l":"L8","t":"Exam sample: ESG integration","f":"m","d":2,"p":"H","sc":"none","s":"Full ESG integration means:","o":[["Adding an ESG logo to fund marketing","Det er markedsføring, i verste fall greenwashing."],["Building ESG issues into the fundamental analysis and valuation itself","ESG legges inn i selve analysen og verdsettelsen (kontantstrøm, vekst, marginer, risiko)."],["Voting at shareholder meetings","Det er voice/engagement, en annen strategi."],["Excluding all controversial sectors","Det er negative screening."]],"c":[1],"es":"ESG integration = ESG inn i analysen og verdsettelsen.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nSkill strategiene: negative screening (ekskludere), best-in-class (velge de beste per bransje), ESG integration (ESG i verdsettelsen), engagement (voice), impact investing (målbar positiv effekt).","kt":"","src":"Opptak L8 ca. 52 min","k":1,"x":1},{"id":"SB275","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":3,"p":"H","sc":"none","s":"How does the two-stock portfolio problem change when ESG is added?","o":[["The correlation is set to zero","Incorrect: correlation is a property of the stocks and does not change."],["The goal becomes minimising emissions only","Incorrect: return is still maximised."],["An emissions limit is added","Correct: an emissions limit is added as an extra constraint."],["Emissions are added to returns","Incorrect: emissions are a separate limit, not part of returns."]],"c":[2],"es":"ESG legges til som en egen grense for utslipp i porteføljen.","ed":"I vanlig mean-variance optimaliserer man avkastning mot risiko. Når ESG legges til, kommer en ekstra betingelse: porteføljens samlede utslipp (vektet) kan ikke være over en grense. Avkastning og korrelasjon er de samme. Husk: ESG = ekstra constraint.","kt":"","src":"L8 slide 4-7"},{"id":"SB276","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":4,"p":"M","sc":"none","s":"The \"ESG-efficient frontier\" (Pedersen, Fitzgibbons and Pomorski, 2021) shows:","o":[["that ESG scores say nothing about risk","Incorrect: ESG can carry information about future fundamentals."],["portfolios with zero emissions","Incorrect: it covers all ESG levels, not only zero."],["the best Sharpe ratio for each ESG score","Correct: it shows the best Sharpe ratio for each ESG level."],["that higher ESG always means a higher Sharpe ratio","Incorrect: at high ESG levels the Sharpe ratio falls."]],"c":[2],"es":"Den viser beste Sharpe ratio for hvert ESG-nivå.","ed":"Pedersen, Fitzgibbons og Pomorski viser ESG-efficient frontier: for hvert ESG-nivå i porteføljen, hva er den høyeste mulige Sharpe ratio? Litt ESG kan øke Sharpe (fordi ESG gir informasjon), men veldig strenge krav senker den. Husk: ESG vs Sharpe-kurven.","kt":"","src":"L8 slide 8"},{"id":"SB277","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"Two stocks: A (10% return, 30 t emissions) and B (5% return, 20 t). An investor holding 50/50 sets a limit of at most 22 t. What happens?","o":[["Nothing changes","Incorrect: the limit forces a change."],["It moves toward A","Incorrect: A has more emissions, so you need less A."],["It moves toward B","Correct: the portfolio moves toward B to meet the limit."],["Return rises","Incorrect: B has lower return, so return falls."]],"c":[2],"es":"50/50 gir 25 t. For å nå 22 t må du ha mer B (lav utslipp, lav avkastning).","ed":"50/50 gir 0,5 × 30 + 0,5 × 20 = 25 t, over grensen på 22. Med w som vekt i A: 30w + 20(1 − w) ≤ 22 gir w ≤ 0,2. Altså maks 20 % i A og minst 80 % i B. Siden B har lavest avkastning, faller forventet avkastning (maks 6 %). Husk: utslippsgrense → mer av lavutslippsaksjen.","kt":"Binding constraint: a limit that actually changes the optimal solution; its cost is the return given up.","src":"L8 slide 7 · L8 slide 8"},{"id":"SB278","l":"L8","t":"Investment industry","f":"m","d":2,"p":"H","sc":"none","s":"What is the difference between an asset owner and an asset manager?","o":[["The owner owns; the manager invests","Correct: the owner owns the money; the manager invests it."],["The manager owns them; the owner advises","Incorrect: the roles are swapped."],["There is no difference","Incorrect: they are different links in the chain."],["Owners buy only bonds; managers buy only stocks","Incorrect: both can use any asset class."]],"c":[0],"es":"Owner eier pengene, manager investerer for dem.","ed":"En asset owner (f.eks. et pensjonsfond) eier pengene på vegne av sparerne. En asset manager (f.eks. et fondsselskap) forvalter pengene for eieren mot et gebyr. Forholdet er principal-agent. Husk: owner = principal, manager = agent.","kt":"","src":"L8 slide 14 · Bok s. 185 (7.1.4) · Bok s. 185 (Figure 7.1)"},{"id":"SB279","l":"L8","t":"Investment industry","f":"m","d":3,"p":"M","sc":"short","s":"Many asset managers launched ESG funds when demand surged in 2020-21, then dropped the label when US political backlash grew. Why?","o":[["Regulators required ESG funds","Incorrect: no such rule existed."],["Labels do not affect money flows","Incorrect: labels do affect money flows."],["ESG funds pay no fees","Incorrect: ESG funds charge fees."],["Fees depend on assets under management","Correct: fees depend on assets under management, so they follow client money."]],"c":[3],"es":"Gebyrene avhenger av hvor mye penger de forvalter, så de følger kundenes penger.","ed":"Forvaltere tjener gebyr basert på hvor mye penger de forvalter (AUM). Da ESG var populært, lanserte de ESG-fond for å tiltrekke penger. Da det kom politisk motstand i USA, fjernet de merkelappen. Produktvalg følger altså kundenes penger. Husk: AUM styrer.\n\nForkortelser: AUM = Assets Under Management (forvaltningskapital).","kt":"Assets under management (AUM): the value of assets a manager runs; most revenues are fees proportional to AUM.","src":"L8 slide 17 · L8 slide 36 · Fondsfinans s. 10"},{"id":"SB280","l":"L8","t":"Investment industry","f":"m","d":3,"p":"M","sc":"none","s":"Which is a material issue for asset managers (SASB)?","o":[["Systemic risk management","Correct: systemic risk management is material for asset managers."],["Tailings dam management","Incorrect: tailings dams are material for mining."],["Product safety recalls","Incorrect: not listed for asset management."],["Water management at production sites","Incorrect: not material for an asset manager's own operations."]],"c":[0],"es":"Systemic risk management er material for forvaltere.","ed":"SASB lister hva som er material for hver bransje. For asset managers er det blant annet systemic risk management, ESG i investeringsprosessen og etikk. Ting som demninger og produktsikkerhet hører til andre bransjer. Husk: tenk på bransjens egne risikoer.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer).","kt":"","src":"L8 slide 19-21"},{"id":"SB281","l":"L8","t":"SFDR","f":"m","d":2,"p":"H","sc":"none","s":"How do SFDR Article 8 and Article 9 funds differ?","o":[["Article 9 funds may not engage","Incorrect: Article 9 funds often engage actively."],["Art. 9 has a sustainable goal; Art. 8 does not","Correct: Article 9 has a sustainable goal; Article 8 only promotes E/S."],["Art. 9 promotes E/S; Art. 8 has impact goals","Incorrect: the definitions are swapped."],["Art. 8 funds disclose nothing","Incorrect: Article 8 funds have disclosure duties."]],"c":[1],"es":"Article 9 har et bærekraftig mål. Article 8 fremmer bare E/S.","ed":"SFDR deler fond i kategorier. Article 8 (\"light green\") fremmer miljø- eller sosiale egenskaper. Article 9 (\"dark green\") har bærekraftig investering som mål. Article 6 har ingen bærekraftsprofil. Husk: 9 = mål, 8 = fremmer.\n\nForkortelser: SFDR = Sustainable Finance Disclosure Regulation (EU-regler som deler fond i Article 6/8/9).","kt":"","src":"L8 slide 22-27"},{"id":"SB282","l":"L8","t":"SFDR","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Many funds were recently moved from Article 8 to Article 9 to use the stricter label for marketing.","o":[["True","Incorrect. The opposite happened: many funds moved from Article 9 down to Article 8 to avoid greenwashing claims."],["False","Correct. The opposite happened: many funds moved from Article 9 down to Article 8 to avoid greenwashing claims."]],"c":[1],"es":"Usant. Det var motsatt: mange gikk fra Article 9 ned til Article 8.","ed":"Etter at reglene ble strengere, flyttet mange fond seg fra Article 9 ned til Article 8. De var redde for anklager om greenwashing hvis de ikke klarte de strenge kravene. Husk: nedgradering, ikke oppgradering.","kt":"","src":"L8 slide 26 · L8 slide 19"},{"id":"SB283","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A church foundation will never own weapons or tobacco stocks, but otherwise wants market returns at low cost. Which strategy fits?","o":[["Impact investing","Incorrect: impact investing is costly and beyond the brief."],["Active ESG integration","Incorrect: possible, but costlier than needed."],["A clean-water theme fund","Incorrect: a theme fund is too concentrated."],["Negative screening","Correct: negative screening meets the values limit at low cost."]],"c":[3],"es":"Utelukke våpen og tobakk, ellers markedet billig = negative screening.","ed":"Stiftelsen vil ikke eie våpen eller tobakk (et verdibasert krav), men ellers ha markedsavkastning billig. Negative screening utelukker disse sektorene og beholder en bred, billig portefølje. Husk: verdier + lav kostnad = exclusion.","kt":"Negative screening: excluding companies or sectors based on ethical or risk criteria.","src":"L8 slide 43 · L9 slide 35"},{"id":"SB284","l":"L8","t":"Drivers of responsible investment","f":"m","d":3,"p":"H","sc":"none","s":"What did Hartzmark and Sussman (2019) find when Morningstar introduced sustainability ratings?","o":[["Top-rated funds earned much more","Incorrect: top-rated funds did not earn more."],["Money left top-rated funds","Incorrect: top-rated funds got inflows."],["Ratings had no effect","Incorrect: flows reacted strongly."],["Money moved into top-rated funds","Correct: money moved into top-rated funds."]],"c":[3],"es":"Pengene strømmet inn i fond med høy rating.","ed":"Da Morningstar innførte globus-ratinger for bærekraft, strømmet penger til fond med høy rating og ut av fond med lav. Fondene med høy rating gjorde det likevel ikke bedre. Investorer bryr seg altså om bærekraft. Husk: merkelapper flytter penger.","kt":"","src":"L8 slide 36 · L8 slide 35"},{"id":"SB285","l":"L8","t":"Drivers of responsible investment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Riedl and Smeets (2017) find that investors hold SRI funds mainly because they expect higher returns.","o":[["True","Incorrect. Social preferences explain SRI holdings; SRI investors actually expect lower returns."],["False","Correct. Social preferences explain SRI holdings; SRI investors actually expect lower returns."]],"c":[1],"es":"Usant. SRI-investorer har sosiale preferanser og forventer faktisk lavere avkastning.","ed":"Riedl og Smeets finner at investorer holder SRI-fond på grunn av sosiale preferanser og ønsket om å signalisere (social signalling). De forventer faktisk lavere avkastning. Husk: SRI = values, ikke value.\n\nForkortelser: SRI = Socially Responsible Investing (ansvarlig investering).","kt":"","src":"L8 slide 35 · Starks s. 1838"},{"id":"SB286","l":"L8","t":"Investor motives","f":"m","d":3,"p":"M","sc":"short","s":"Most professionals use ESG information mainly because it is financially material. How should ESG information be presented to them?","o":[["Linked to risk and growth","Correct: show ESG linked to risk and growth."],["As moral arguments only","Incorrect: ethics is a less common motive for professionals."],["Without numbers","Incorrect: investors want numbers."],["As long lists of indicators","Incorrect: lack of focus is their main complaint."]],"c":[0],"es":"Koble ESG til risiko og vekst.","ed":"Profesjonelle investorer bruker ESG mest fordi det er finansielt material. Informasjonen bør derfor kobles til risiko, vekst og andre value drivers, med tall som kan sammenlignes. Husk: snakk investorens språk.","kt":"Financial materiality: the extent to which an ESG issue affects a company's cash flows, risk or cost of capital.","src":"L8 slide 37-38 · Bok s. 226 (8.3)"},{"id":"SB287","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"Negative (exclusionary) screening means:","o":[["Ruling out \"bad\" investments","Correct: negative screening rules out \"bad\" investments."],["Picking firms that gain from green trends","Incorrect: picking firms that gain from trends is thematic."],["Picking the top ESG firms in each sector","Incorrect: picking top firms in each sector is best-in-class."],["Using votes and dialogue","Incorrect: votes and dialogue are engagement."]],"c":[0],"es":"Negative screening = utelukke \"dårlige\" investeringer.","ed":"SRI-strategier: negative screening (utelukke dårlige), best-in-class/positive screening (velge de beste i hver sektor), thematic (investere i et tema), ESG integration (ESG i analysen), engagement (påvirke som eier) og impact investing (målt positiv effekt). Husk: negative = ut.\n\nForkortelser: SRI = Socially Responsible Investing (ansvarlig investering).","kt":"","src":"L8 slide 43-44 · Bok s. 189 (7.2.2) · Bok s. 194 (7.3.3)"},{"id":"SB288","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"H","sc":"short","s":"Fund 1 invests only in firms that gain from the clean water trend. Fund 2 keeps the top 30% ESG firms in each sector. Which labels fit?","o":[["Impact; ESG integration","Incorrect: neither has measured impact or integration."],["Thematic; best-in-class","Correct: Fund 1 is thematic; Fund 2 is best-in-class."],["Best-in-class; thematic","Incorrect: the labels are swapped."],["Both are negative screening","Incorrect: neither excludes."]],"c":[1],"es":"Fond 1 følger et tema (thematic). Fond 2 velger de beste i hver sektor (best-in-class).","ed":"Fond 1 velger firmaer som tjener på en trend (rent vann), altså thematic investing. Fond 2 rangerer innen hver sektor og beholder de beste 30 %, altså best-in-class. Husk: tema = thematic, topp i hver sektor = best-in-class.","kt":"","src":"L8 slide 45-52 · Bok s. 189 (7.2.2)"},{"id":"SB289","l":"L8","t":"SRI strategies","f":"t","d":2,"p":"H","sc":"none","s":"True or false: ESG integration means finding material ESG information and using it in the analysis, for example in cash flow forecasts or the cost of capital.","o":[["True","Correct. This is the definition: find material ESG information and use it in the valuation."],["False","Incorrect. This is the definition: find material ESG information and use it in the valuation."]],"c":[0],"es":"Sant. ESG integration = bruke material ESG-info i analysen.","ed":"ESG integration betyr å finne ESG-informasjon som er material og bruke den i den finansielle analysen, for eksempel i kontantstrømprognoser eller diskonteringsrenten. Det er SF 2.0. Husk: ESG inn i tallene.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L8 slide 53-55 · Bok s. 189 (7.2.2) · L9 slide 7"},{"id":"SB290","l":"L8","t":"SRI strategies","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"LGIM engaged with Glencore on climate from 2016, filed a shareholder proposal in 2023, and sold Glencore from some funds in 2024. What does this show?","o":[["Moving from voice to exit","Correct: it moved from voice to exit."],["Passive investing","Incorrect: LGIM was active."],["Impact investing","Incorrect: Glencore is a listed company."],["Negative screening from the start","Incorrect: exit came only after years of engagement."]],"c":[0],"es":"LGIM gikk fra dialog (voice) til salg (exit).","ed":"LGIM fulgte en escalation-strategi: dialog fra 2016, så aksjonærforslag i 2023, og til slutt salg fra noen fond i 2024. Det viser hvordan investorer går fra voice til exit når engagement ikke virker. Husk: dialog → forslag → exit.","kt":"","src":"L8 slide 56-58 · L8 slide 71"},{"id":"SB291","l":"L8","t":"Active ownership","f":"m","d":4,"p":"H","sc":"none","s":"Dimson, Karakaş and Li (2015) find that:","o":[["engagement has no effect","Incorrect: engagement has an effect."],["successful engagement raises returns","Correct: successful engagement raises returns."],["engagement only works for majority owners","Incorrect: small owners can succeed."],["engagement destroys value","Incorrect: the effect is positive."]],"c":[1],"es":"Vellykket engagement gir høyere avkastning.","ed":"Dimson, Karakaş og Li (2015) studerer engagement fra en stor investor. Når engagement lykkes, øker aksjekursen og firmaets resultater. Mislykket engagement gir ingen negativ effekt. Samarbeid mellom investorer øker sjansen. Husk: vellykket engagement lønner seg.","kt":"","src":"L8 slide 60 · Bok s. 194 (7.3.4) · Bok s. 203 (7.4.3)"},{"id":"SB292","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"What makes impact investing different from the other SRI strategies?","o":[["It works only in listed stocks","Incorrect: it is often private, but not only listed stocks."],["Planned, measured impact","Correct: impact is intended and measured."],["It always accepts a zero return","Incorrect: it also seeks a financial return."],["It only excludes sin stocks","Incorrect: excluding sin stocks is negative screening."]],"c":[1],"es":"Impact investing = planlagt og målt impact.","ed":"Impact investing har to kjennetegn: intensjon om positiv sosial eller miljømessig effekt, og måling av denne effekten. Det skiller den fra andre SRI-strategier, som ofte bare unngår skade. Den søker også finansiell avkastning. Husk: intention + measurement.\n\nForkortelser: SRI = Socially Responsible Investing (ansvarlig investering).","kt":"","src":"L8 slide 61-65 · L8 slide 39"},{"id":"SB293","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about SRI strategies is correct?","o":[["Thematic and best-in-class are the same","Incorrect: thematic and best-in-class differ."],["ESG integration excludes all below-average firms","Incorrect: integration does not exclude firms."],["Negative screening measures every impact","Incorrect: screening does not measure impact."],["Impact investing measures impact most","Correct: impact investing measures impact the most."]],"c":[3],"es":"Impact investing har mest fokus på å måle impact.","ed":"SRI-strategiene kan rangeres etter hvor mye de sikter mot impact. Negative screening gjør minst (bare unngår), og impact investing gjør mest (planlegger og måler effekt). Husk: impact investing er mest ambisiøst.\n\nForkortelser: SRI = Socially Responsible Investing (ansvarlig investering).","kt":"","src":"L8 slide 39-42 · L8 slide 56 · L8 slide 65"},{"id":"SB294","l":"L8","t":"Barriers to integration","f":"m","d":3,"p":"H","sc":"none","s":"Why is the efficient market hypothesis a barrier to integrating sustainability?","o":[["EMH requires concentrated portfolios","Incorrect: EMH implies holding the market portfolio."],["EMH forbids using the share price","Incorrect: EMH makes the share price central."],["EMH proves green firms do worse","Incorrect: EMH makes no such claim."],["It makes passive investing seem best","Correct: EMH makes passive investing seem best."]],"c":[3],"es":"EMH gjør passiv investering til det beste valget, så ingen analyserer bærekraft.","ed":"Under EMH er all informasjon allerede i prisene, så ingen kan slå markedet med bedre analyse. Da er passive indeksfond det beste valget. Men da analyserer ingen bærekraft, og kapitalen fordeles bare etter markedsvekter. Husk: EMH → passivt → ingen analyse.\n\nForkortelser: EMH = Efficient Market Hypothesis (prisene reflekterer all informasjon).","kt":"","src":"L8 slide 66-68 · Bok s. 181 (7.1.1) · Bok s. 182 (7.1.1) · Bok s. 189 (7.3.1)"},{"id":"SB295","l":"L8","t":"Barriers to integration","f":"m","d":3,"p":"M","sc":"none","s":"An asset has an expected return below the security market line (α < 0). What happens in an efficient market?","o":[["It is overpriced, so its price falls","Correct: it is overpriced, so the price falls."],["Investors buy it","Incorrect: negative alpha means too little return for the risk."],["Nothing happens","Incorrect: the SML applies to all assets."],["It is underpriced, so its price rises","Incorrect: below the SML means overpriced."]],"c":[0],"es":"Under SML = for lav avkastning for risikoen = overpriset. Prisen faller.","ed":"Security market line (SML) viser hvilken avkastning en aktiva bør gi for sin risiko (beta). Ligger forventet avkastning under linjen (α < 0), er avkastningen for lav, altså er prisen for høy. Investorer selger, og prisen faller til avkastningen er på linjen. Husk: under SML = overpriset.\n\nForkortelser: SML = Security Market Line (linjen for krav til avkastning gitt beta).","kt":"","src":"L8 slide 67 · Bok s. 182 (7.1.2) · Bok s. 183 (7.1.2)"},{"id":"SB296","l":"L8","t":"Market framework","f":"m","d":3,"p":"H","sc":"none","s":"Traditional investing (SF 1.0) vs investing for LTVC (SF 2.0). Which pairing is correct?","o":[["Portfolios: broad vs focused","Correct: traditional portfolios are broad; LTVC portfolios are focused."],["Chains: short vs long","Incorrect: the pair is reversed."],["Dialogue: deep vs limited","Incorrect: the pair is reversed."],["Horizon: decades vs 12 months","Incorrect: the pair is reversed."]],"c":[0],"es":"Tradisjonell = bred portefølje. LTVC = fokusert.","ed":"Læreboka sammenligner tradisjonell investering (SF 1.0) og investering for long-term value creation (SF 2.0). Tradisjonell: brede porteføljer, kort horisont (12 mnd), lange investeringskjeder og lite dialog. LTVC: fokuserte porteføljer, horisont på år eller tiår, korte kjeder og dyp dialog. Husk: LTVC = fokusert og langsiktig.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka); LTVC = Long-Term Value Creation (langsiktig verdiskaping).","kt":"","src":"Bok s. 180 (Table 7.1) · L8 slide 74"},{"id":"SB297","l":"L8","t":"Adaptive markets hypothesis","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Under the adaptive markets hypothesis, how fast climate risks get priced depends on how many analysts study them and how well they learn.","o":[["True","Correct. Under AMH, pricing depends on how many analysts study a risk and how well they learn."],["False","Incorrect. Under AMH, pricing depends on how many analysts study a risk and how well they learn."]],"c":[0],"es":"Sant. Under AMH avhenger prisingen av hvor mange som studerer risikoen.","ed":"Adaptive markets hypothesis sier at markedene lærer over tid. Nye risikoer, som klima, blir priset gradvis etter hvert som flere investorer analyserer dem og lærer. Husk: AMH = læring.\n\nForkortelser: AMH = Adaptive Markets Hypothesis (markedet lærer gradvis, Lo).","kt":"","src":"Bok s. 189 (7.3.1) · Bok s. 190 (7.3.1) · Bok s. 192 (Figure 7.3)"},{"id":"SB298","l":"L8","t":"Performance measurement","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about fund performance measures is correct?","o":[["They capture social and environmental value","Incorrect: these measures are purely financial."],["A beta below 1 means a defensive fund","Correct: a beta below 1 means the fund moves less than the market."],["Low tracking error means a big deviation from the index","Incorrect: low tracking error means staying close to the index."],["The Sharpe ratio compares only with the index","Incorrect: the Sharpe ratio uses the risk-free rate."]],"c":[1],"es":"Beta under 1 = fondet svinger mindre enn markedet (defensivt).","ed":"Vanlige mål: beta (følsomhet for markedet; under 1 = defensivt), tracking error (hvor mye fondet avviker fra indeksen), Sharpe ratio (meravkastning over risikofri rente per risiko) og information ratio. Alle er rent finansielle. Husk: beta < 1 = defensivt.","kt":"Tracking error: volatility of a fund's returns relative to its benchmark; information ratio: excess return per unit of tracking error.","src":"Bok s. 183 (7.1.3) · Bok s. 184 (Table 7.2)"},{"id":"SB299","l":"L8","t":"Performance measurement","f":"m","d":3,"p":"H","sc":"extended_course_case","s":"Norway limits the oil fund's (NBIM's) tracking error to about 1%. What follows from this?","o":[["It can freely make impact investments","Incorrect: the tight limit stops large deviations."],["It is sure to beat its benchmark","Incorrect: it guarantees nothing."],["Little room for active choices","Correct: there is little room for active choices."],["It must hold about 100 stocks","Incorrect: it means holding thousands of stocks."]],"c":[2],"es":"1 % tracking error gir lite rom for aktive valg.","ed":"Tracking error måler hvor mye porteføljen avviker fra indeksen. En grense på ca. 1 % betyr at oljefondet må ligge svært nær indeksen. Det gir lite rom for aktive valg, som store ESG-vekter eller konsentrerte posisjoner. Husk: lav tracking error = nesten passivt.\n\nForkortelser: NBIM = Norges Bank Investment Management (forvalter Oljefondet).","kt":"","src":"Bok s. 186 (Box 7.1) · L8 slide 15 · L8 slide 72"},{"id":"SB300","l":"L8","t":"Voice vs exit","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: An index fund tracking the Oslo index can credibly
