<style>
/* Layout: single centred column. Home = dashboard (ring + stat tiles) then setup; quiz = one elevated card. */
:root{
  --bg:#F3F4F7; --bg2:#E9EBF1; --surface:#FFFFFF; --surface2:#F7F8FB; --ink:#141824; --muted:#5E6577; --line:#DDE0E8;
  --accent:#4C51D9; --accent2:#7B5CE6; --accent-ink:#FFFFFF; --accent-soft:#E9EAFC; --glow:rgba(76,81,217,.16);
  --ok:#17804A; --ok-soft:#E0F4E8; --bad:#C2372D; --bad-soft:#FCE6E3; --warn:#A06A00; --warn-soft:#FDF2DA;
  --shadow:0 1px 2px rgba(20,24,36,.06),0 8px 24px rgba(20,24,36,.06);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F15; --bg2:#12151D; --surface:#161922; --surface2:#1B1F2A; --ink:#E8EAF0; --muted:#949AAD; --line:#272B37;
  --accent:#8C8FF5; --accent2:#B08CF7; --accent-ink:#0D0F15; --accent-soft:#22243F; --glow:rgba(140,143,245,.16);
  --ok:#5BD08F; --ok-soft:#12301F; --bad:#F2887D; --bad-soft:#3A1B18; --warn:#EDB95A; --warn-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F15; --bg2:#12151D; --surface:#161922; --surface2:#1B1F2A; --ink:#E8EAF0; --muted:#949AAD; --line:#272B37;
  --accent:#8C8FF5; --accent2:#B08CF7; --accent-ink:#0D0F15; --accent-soft:#22243F; --glow:rgba(140,143,245,.16);
  --ok:#5BD08F; --ok-soft:#12301F; --bad:#F2887D; --bad-soft:#3A1B18; --warn:#EDB95A; --warn-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(900px 420px at 85% -120px,var(--glow),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--accent),var(--accent2));color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;box-shadow:0 4px 12px var(--glow)}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em;line-height:1.1}
nav{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{background:none;border:0;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13.5px}
nav button[aria-current="true"]{color:var(--accent-ink);background:var(--accent)}
main{padding-block:22px 72px}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:31px;line-height:1.12}
.lead{color:var(--muted);max-width:62ch;margin:8px 0 0}
.label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
section.block{display:grid;gap:10px}
.stack{display:grid;gap:26px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* dashboard */
.dash{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:20px 22px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{display:block;font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.tile.exam{background:linear-gradient(140deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink)}
.tile.exam span{color:inherit;opacity:.85}

/* modes */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px;transition:transform .12s,border-color .12s,box-shadow .12s}
.seg button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.seg .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.seg .ic svg{width:17px;height:17px}
.seg button b{font-weight:700;font-size:14.5px}
.seg button span.d{font-size:12.5px;color:var(--muted);line-height:1.35}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 18px var(--glow)}
.seg.sec{grid-template-columns:1fr 1fr}
.seg button[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-ink)}

/* lectures */
.lecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px}
.lec{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;transition:opacity .12s,border-color .12s}
.lec[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.lec[aria-pressed="false"]{opacity:.45}
.lec .code{font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;min-width:3.2em;text-align:center}
.lec .name{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lec .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.lec .bar{grid-column:1/-1}
.bar i{display:block;height:100%}
.bar .k{background:var(--ok)} .bar .w{background:var(--bad)}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-size:13px;font-weight:600}
.primary{background:linear-gradient(140deg,var(--accent),var(--accent2));color:var(--accent-ink);border:0;border-radius:12px;padding:13px 22px;font-weight:700;box-shadow:0 6px 18px var(--glow);transition:transform .1s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:600}
.startbar{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.startbar .info{color:var(--muted);font-size:14px}
.startbar .info b{color:var(--ink);font-variant-numeric:tabular-nums}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .pos{font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{flex:1;min-width:60px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .25s}
.qtop .stat{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:18px;box-shadow:var(--shadow);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meta span{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.meta .lecid{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.meta .tag{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.meta .qid{font-family:var(--f-mono);font-weight:400;background:none;border:0;padding:3px 2px}
.stem{font-family:var(--f-display);font-size:21px;line-height:1.42;margin:0;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;transition:border-color .12s,background .12s,transform .1s}
.opt:not(:disabled):hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.opt:not(:disabled):active{transform:scale(.995)}
.opt .key{font-family:var(--f-mono);font-size:12.5px;font-weight:500;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:5px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.verdict{border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.verdict .vi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;grid-row:span 2}
.verdict .vi svg{width:16px;height:16px}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict.ok .vi{background:var(--ok);color:var(--surface)} .verdict.bad .vi{background:var(--bad);color:var(--surface)}
.verdict b{font-weight:700}
.verdict.ok b{color:var(--ok)} .verdict.bad b{color:var(--bad)}
.verdict.plain{grid-template-columns:1fr}
details.deep{border-top:1px solid var(--line);padding-top:14px}
details.deep summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
details.deep summary::-webkit-details-marker{display:none}
details.deep summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.deep[open] summary::before{transform:rotate(45deg)}
details.deep .body{display:grid;gap:12px;margin-top:12px;max-width:68ch}
.kt{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:16px}
.actions .left{display:flex;gap:8px;flex-wrap:wrap}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.grid button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11.5px;padding:0}
.grid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.grid button.fl{box-shadow:inset 0 -3px 0 var(--warn)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}

/* results & progress */
.hero{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.hero .of{color:var(--muted);font-size:14px}
.hero h1{margin-bottom:4px}
.tablewrap{overflow-x:auto;padding:6px 18px 10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
td .bar{min-width:80px}
.review{display:grid;gap:8px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.review summary{cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-weight:600}
.review summary .m{font-family:var(--f-mono);font-size:11px;padding-top:3px;color:var(--bad);font-weight:500}
.review .inner{display:grid;gap:10px;margin-top:12px}
.empty{color:var(--muted);padding:12px 0}
@media (max-width:640px){
  .seg{grid-template-columns:1fr 1fr}
  .card{padding:18px;border-radius:18px}
  .stem{font-size:19px}
  h1{font-size:26px}
  .dash,.hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .dash .tiles{width:100%}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  </nav>

<script type="application/json" id="bank">[{"id":"CX001","l":"L1","t":"Definition of sustainable finance","f":"m","d":2,"p":"H","sc":"none","s":"Unlike charity, sustainable finance:","o":[["Is the same thing as ESG ratings","ESG-ratinger er bare ett verktøy."],["Gives up all financial return","Da ville det vært veldedighet."],["Still requires a financial return","Det er ikke veldedighet. Selv SF 3.0 krever en minimum avkastning."],["Covers only renewable energy stocks","Det dekker hele finanssystemet: investering, utlån og forsikring."]],"c":[2],"es":"Sustainable finance ≠ veldedighet.","ed":"Selv i den mest ambisiøse formen (SF 3.0) kreves en minimum finansiell avkastning. Foreleser: 'it's not charity'.","kt":"","src":"L1 slide 25 · Bok s. 4 (1)","k":1},{"id":"CX002","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":2,"p":"H","sc":"none","s":"The stage of sustainable finance that puts social and environmental value first, subject to a minimum financial return, is:","o":[["SF 3.0","SF 3.0 = common good value: maks S + E, så lenge F er over et minimum."],["SF 2.0","SF 2.0 maksimerer integrated value (F + S + E samlet)."],["Traditional finance","Tradisjonell finans ser bare på F."],["SF 1.0","SF 1.0 maksimerer F, med noen begrensninger som ekskludering."]],"c":[0],"es":"SF 3.0 = samfunn og miljø først.","ed":"Trappen:\n- SF 1.0: maks F (refined shareholder value).\n- SF 2.0: maks F + S + E (stakeholder value).\n- SF 3.0: maks S + E med minimum F (common good).","kt":"","src":"Bok s. 20 (1.4) · L9 slide 29","k":1},{"id":"CX003","l":"L1","t":"Sustainable finance typology","f":"m","d":2,"p":"H","sc":"none","s":"A fund that excludes tobacco and coal but otherwise maximises financial return is an example of:","o":[["SF 1.0","Ekskludering + maks avkastning = SF 1.0."],["SF 2.0","SF 2.0 ville vektet F, S og E likt (integrated value)."],["Traditional finance","Tradisjonell finans ekskluderer ikke av etiske grunner."],["SF 3.0","SF 3.0 setter samfunn og miljø først."]],"c":[0],"es":"Ekskludering + maks avkastning = SF 1.0.","ed":"SF 1.0 tar bare hensyn til samfunn og miljø som begrensninger (ikke eie 'sin stocks'), mens målet fortsatt er finansiell verdi.","kt":"","src":"L1 slide 30 · Bok s. 17 (1.4)","k":1},{"id":"CX004","l":"L1","t":"Value versus values","f":"m","d":2,"p":"H","sc":"short","s":"In Starks' terms, an investor who accepts a lower return to avoid firms that conflict with her beliefs is:","o":[["A values investor","Hun handler ut fra egne verdier (nonpecuniary preferences), selv om det koster."],["An activist hedge fund","Det har ingenting med motivet hennes å gjøre."],["A passive investor","Passiv handler om å følge en indeks, ikke om motivet."],["A value investor","En value-investor bruker ESG fordi det påvirker risiko og avkastning."]],"c":[0],"es":"Verdier som motiv = values investor.","ed":"Value = ESG for pengenes skyld. Values = ESG for verdienes skyld, også om det koster avkastning.","kt":"","src":"Starks s. 1838 · L1 slide 44","k":1},{"id":"CX005","l":"L1","t":"Double materiality","f":"t","d":2,"p":"H","sc":"none","s":"Does double materiality cover both a firm's impact on the world and the world's impact on the firm?","o":[["Yes","Riktig. Impact materiality (inside-out) + financial materiality (outside-in)."],["No","Feil. Impact materiality (inside-out) + financial materiality (outside-in)."]],"c":[0],"es":"Ja: begge retninger.","ed":"Foreleser har sagt at double materiality helt sikkert kommer på eksamen. CSRD i EU bygger på dette prinsippet.","kt":"","src":"L1 slide 36 · L6 slide 50 · PwC s. 29","k":1},{"id":"CX006","l":"L1","t":"Inside-out vs outside-in","f":"m","d":2,"p":"H","sc":"short","s":"River pollution from a firm's factory that does not affect the firm's own profits is an example of:","o":[["Physical climate risk","Physical risk er klimaets skade på firmaet, ikke omvendt."],["Financial materiality (outside-in)","Det ville vært hvis forurensningen påvirket firmaets økonomi."],["Impact materiality (inside-out)","Firmaet påvirker verden. Det er impact materiality."],["It is not material in any sense","Under double materiality er stor impact nok til at temaet er vesentlig."]],"c":[2],"es":"Firmaet påvirker verden = impact (inside-out).","ed":"Pilen bestemmer: fra firmaet og ut = inside-out (impact). Fra verden og inn i regnskapet = outside-in (financial).","kt":"","src":"Opptak L8 ca. 65 min · Opptak L1 ca. 80 min","k":1},{"id":"CX007","l":"L1","t":"Principal-agent problem","f":"m","d":2,"p":"H","sc":"none","s":"Ownership by many small shareholders makes the principal-agent problem worse because:","o":[["Small owners receive no dividends at all","Alle aksjeeiere får utbytte."],["Managers then own most of the shares","Spredt eierskap betyr ikke at lederne eier mest."],["No single owner gains enough from monitoring","Hver liten eier bærer kostnaden ved å overvåke, men deler gevinsten med alle (free riding)."],["Small owners must vote with managers by law","Det finnes ingen slik regel."]],"c":[2],"es":"Spredt eierskap = svak overvåking.","ed":"Principal-agent: eiere (principals) og ledere (agents) kan ha ulike interesser. Med mange små eiere er det ingen som har nok å vinne på å overvåke lederne (free riding).","kt":"","src":"L1 slide 23 · L5 slide 13","k":1},{"id":"CX008","l":"L1","t":"Planetary boundaries and the doughnut","f":"m","d":2,"p":"H","sc":"none","s":"In Raworth's doughnut, the inner ring represents:","o":[["The ecological ceiling","Det er den ytre ringen."],["The planetary boundaries","Planetary boundaries er den ytre ringen."],["A target for GDP growth","Modellen har ikke et vekstmål."],["The social foundation","Under indre ring mangler folk grunnbehov (shortfall)."]],"c":[3],"es":"Indre ring = social foundation.","ed":"Under indre ring: folk mangler grunnbehov (shortfall). Over ytre ring: vi bryter planetens grenser (overshoot). Målet er rommet mellom.","kt":"","src":"L1 slide 35 · Bok s. 11 (1.2.2)","k":1},{"id":"EX08","l":"L1","t":"Exam sample: principal-agent problem","f":"m","d":2,"p":"H","sc":"none","s":"In the principal-agent problem within a corporation, the manager acts as the:","o":[["Principal","Principal er eierne (aksjonærene), som lederen jobber for."],["Agent","Lederen handler på vegne av eierne, og er derfor agenten."],["Beneficiary","Beneficiary er sluttmottakeren, f.eks. sparerne i et pensjonsfond."],["Regulator","Regulator er myndighetene, ikke en part i principal-agent-forholdet."]],"c":[1],"es":"Leder = agent. Eiere = principal.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nPrincipal-agent: eierne (principals) ansetter lederne (agents) til å styre. Lederne kan ha egne interesser (bonus, makt, et rolig liv). Corporate governance skal få dem til å handle i eiernes interesse.","kt":"","src":"L1 slide 23 · L5 slide 13","k":1,"x":1},{"id":"SB001","l":"L1","t":"Definition of sustainable finance","f":"m","d":1,"p":"H","sc":"none","s":"According to Schoenmaker and Schramade, sustainable finance is:","o":[["Charity done by banks next to their normal business","Incorrect: sustainable finance is part of normal investing and lending, not charity on the side."],["Investing only in the top ESG-rated firms in each sector","Incorrect: buying only top ESG firms is one strategy (positive screening), not the definition."],["How finance interacts with society and nature","Correct: this is the textbook definition: finance interacting with society and nature."],["Public subsidies for renewable energy projects","Incorrect: subsidies are a government tool; the field is about private investing and lending."]],"c":[2],"es":"Sustainable finance = hvordan finance påvirker og påvirkes av samfunn og natur.","ed":"Schoenmaker og Schramade definerer sustainable finance som studiet av hvordan finance (investering og utlån) samspiller med økonomiske, sosiale og miljømessige forhold. Det er altså ikke veldedighet ved siden av, men en del av selve kapitalallokeringen. Strategier som positive screening og offentlige virkemidler som subsidier er bare deler av helheten. Husk: finance ↔ society and nature.","kt":"","src":"L1 slide 25 · Bok s. 4 (1)"},{"id":"SB002","l":"L1","t":"CSR, SRI and ESG","f":"m","d":2,"p":"H","sc":"none","s":"How do CSR, SRI and ESG relate to each other in the course?","o":[["They are three names for the same thing","Incorrect: the course keeps them apart because they are different things."],["CSR and SRI are actions; ESG measures the result","Correct: CSR (firms) and SRI (investors) are actions; ESG measures the outcome."],["SRI is for firms; CSR is for investors","Incorrect: swapped. CSR is what firms do; SRI is what investors do."],["ESG is a firm action; CSR is an investor rating","Incorrect: ESG is a measurement, not an action by the firm."]],"c":[1],"es":"CSR (firmaer) og SRI (investorer) er handlinger. ESG er målingen av resultatet.","ed":"CSR (corporate social responsibility) er det firmaet gjør, og SRI (socially responsible investing) er det investoren gjør. ESG er målestokken: tallene som prøver å fange resultatet av disse handlingene. Mange empiriske problemer i faget oppstår nettopp i målingen (ESG-ratinger spriker). Husk: CSR = firma handler, SRI = investor handler, ESG = måling.","kt":"","src":"L1 slide 33 · Starks s. 1837"},{"id":"SB003","l":"L1","t":"Sustainable finance typology","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A pension fund drops coal and tobacco stocks but otherwise just tracks the index. This is:","o":[["SF 1.0","Correct: excluding a few sectors while still maximising return is SF 1.0."],["SF 2.0","Incorrect: SF 2.0 means optimising F + S + E together, not only excluding."],["Finance as usual","Incorrect: finance as usual excludes nothing."],["SF 3.0","Incorrect: SF 3.0 puts social and environmental impact first; here return is still the goal."]],"c":[0],"es":"Utelukke noen sektorer, men ellers bare tjene penger = SF 1.0.","ed":"SF-trappen: finance as usual maksimerer bare finansiell verdi (F). SF 1.0 maksimerer fortsatt F, men med noen begrensninger, typisk exclusion av \"sin\"-sektorer. SF 2.0 optimerer integrated value (F + S + E), og SF 3.0 setter S og E først med F som minstekrav. Et pensjonsfond som dropper kull og tobakk men ellers følger indeksen, har fortsatt avkastning som mål. Husk: exclusion = SF 1.0.","kt":"SF 1.0 = maximise F subject to S and E (avoid the worst); SF 2.0 = optimise integrated value IV = F + S + E; SF 3.0 = optimise S + E subject to F.","src":"L1 slide 30 · Bok s. 17 (1.4)"},{"id":"SB004","l":"L1","t":"Principal-agent problem","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"After raising equity, a CEO moves the firm into much riskier projects because outside investors carry most of the losses. This is:","o":[["Modigliani-Miller Proposition I","Incorrect: MM I is about firm value and capital structure, not behaviour."],["Double materiality","Incorrect: double materiality is a reporting concept."],["Adverse selection","Incorrect: adverse selection is about hidden information before the deal."],["Moral hazard","Correct: the CEO changes behaviour after the deal because others carry the loss: moral hazard."]],"c":[3],"es":"Endret atferd etter kontrakten, fordi andre bærer tapet = moral hazard.","ed":"Moral hazard er når noen endrer atferd etter at en avtale er inngått, fordi andre bærer konsekvensene. Her tar CEO-en mer risiko etter emisjonen, fordi de eksterne investorene tar det meste av tapet. Adverse selection er derimot skjult informasjon før avtalen (hvem som velger å inngå den). Husk: før = adverse selection, etter = moral hazard.","kt":"","src":"L1 slide 23 · L5 slide 13"},{"id":"SB005","l":"L1","t":"Principal-agent problem","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A CEO's bonus depends only on next year's earnings. She cuts R&D to hit the target. What is the problem and the fix?","o":[["No problem; short-term earnings are the goal","Incorrect: owners care about long-term value, and cutting R&D can destroy it."],["Agency problem; link pay to long-term targets","Correct: she follows her bonus, not the owners; long-term pay fixes this."],["Market failure; add a carbon tax","Incorrect: a carbon tax fixes an externality, not an incentive problem."],["Adverse selection; screen job applicants better","Incorrect: the problem arises after hiring, so it is not adverse selection."]],"c":[1],"es":"Kortsiktig bonus gir kortsiktig atferd. Det er et agency problem, og løsningen er langsiktig lønn.","ed":"Dette er et agency problem: lederen (agent) handler i egen interesse, ikke i eiernes (principal). En bonus knyttet til neste års resultat gir short-termism, for eksempel kutt i R&D som skader langsiktig verdi. Løsningen er å koble lønnen til langsiktige, material mål, gjerne utsatt over flere år. Husk: incentivene må matche eiernes horisont.","kt":"Principal-agent problem: an agent (manager) acting for a principal (owners) has different goals and better information, so incentives and monitoring are needed.","src":"L1 slide 23"},{"id":"SB006","l":"L1","t":"Capital structure","f":"t","d":2,"p":"L","sc":"none","s":"True or false: In Modigliani-Miller Proposition II, more debt lowers the cost of equity because debt is cheaper.","o":[["True","Incorrect. MM II says the cost of equity rises with leverage, because more debt makes equity riskier."],["False","Correct. MM II says the cost of equity rises with leverage, because more debt makes equity riskier."]],"c":[1],"es":"Usant. Mer gjeld gjør egenkapitalen mer risikabel, så cost of equity øker.","ed":"Modigliani-Miller II sier at cost of equity øker lineært med gjeldsgraden. Gjeld er billigere, men mer gjeld gjør egenkapitalen mer risikabel, og aksjonærene krever høyere avkastning. I en perfekt verden spiser dette opp fordelen av billig gjeld, så WACC blir den samme. Husk: mer gjeld → dyrere egenkapital.","kt":"","src":"L1 slide 19"},{"id":"SB007","l":"L1","t":"Traditional vs sustainable investing","f":"m","d":2,"p":"H","sc":"none","s":"Compared with traditional finance, sustainable finance may accept:","o":[["Ignoring how capital is allocated","Incorrect: capital allocation is still the core of sustainable finance."],["Shareholder value as the firm's only goal","Incorrect: shareholder value as the only goal is traditional finance."],["Less diversification, e.g. avoiding sin stocks","Correct: avoiding sin stocks means fewer stocks to spread risk over, which may be worth it."],["No risk sharing between investors and lenders","Incorrect: risk sharing is part of finance in both views."]],"c":[2],"es":"Sustainable finance kan godta mindre diversifisering, f.eks. ved å droppe sin stocks.","ed":"Tradisjonell finance vil ha maksimal diversifisering. Sustainable finance kan godta litt mindre diversifisering, for eksempel ved å droppe sin stocks, fordi målet er bredere (stakeholder welfare og langsiktighet). Kapitalallokering og risk sharing er fortsatt sentrale. Husk: exclusion koster litt diversifisering.","kt":"","src":"L1 slide 32 · L8 slide 7"},{"id":"SB008","l":"L1","t":"Value versus values","f":"m","d":2,"p":"H","sc":"none","s":"In Starks (2023), the difference between a \"values\" and a \"value\" ESG investor is that:","o":[["Values: beliefs; value: risk and return","Correct: values investors act on beliefs; value investors care about risk and return."],["Values expects ESG to beat the market; value does not","Incorrect: the difference is the motive, not what they expect to earn."],["Value investors never screen; values investors never engage","Incorrect: both groups can use screening and engagement."],["Values buys cheap stocks; value buys growth stocks","Incorrect: this has nothing to do with value vs growth stocks."]],"c":[0],"es":"Values-investor følger egne verdier. Value-investor bryr seg om ESG fordi det påvirker risk og return.","ed":"Starks (2023) skiller mellom to typer ESG-investorer. Values-investoren handler ut fra moral og preferanser (non-pecuniary), og kan godta lavere avkastning. Value-investoren bruker ESG fordi det påvirker risk og return, altså av økonomiske grunner. Begge kan bruke de samme verktøyene. Husk: valueS = verdier, value = penger.","kt":"","src":"Starks s. 1838-1839 · L1 slide 45"},{"id":"SB009","l":"L1","t":"Value versus values","f":"m","d":3,"p":"H","sc":"none","s":"Starks (2023) ranks investment approaches. Which order goes from most values-driven to most purely financial?","o":[["Impact investing, SRI, ESG investing, traditional investing","Correct: impact and SRI at the values end, ESG in the middle, traditional at the financial end."],["SRI, traditional investing, impact investing, ESG investing","Incorrect: traditional investing belongs at the purely financial end, not in the middle."],["Traditional investing, ESG investing, SRI, impact investing","Incorrect: this is the reverse order."],["ESG investing, impact investing, traditional investing, SRI","Incorrect: impact and SRI should sit next to each other at the values end."]],"c":[0],"es":"Fra mest verdistyrt til mest finansiell: impact, SRI, ESG, traditional.","ed":"Starks plasserer strategiene på en skala fra values til value. Impact investing og SRI er mest verdistyrt. ESG investing kan være begge deler og ligger i midten. Tradisjonell investering ser bare på risk og return. Husk: impact → SRI → ESG → traditional.","kt":"","src":"Starks s. 1839-1841 · L1 slide 45-47"},{"id":"SB010","l":"L1","t":"Value versus values","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In Starks (2023), an investor who uses negative ESG screening must be a values investor.","o":[["True","Incorrect. Value investors can also use negative screening, e.g. to avoid financial risk, so the tool does not reveal the motive."],["False","Correct. Value investors can also use negative screening, e.g. to avoid financial risk, so the tool does not reveal the motive."]],"c":[1],"es":"Usant. Også value-investorer bruker negative screening, f.eks. for å unngå finansiell risiko.","ed":"Negative screening er et vanlig verktøy for values-investorer, men en value-investor kan også utelukke for eksempel kullselskaper fordi hun tror risikoen er feilpriset. Verktøyet sier altså ikke noe om motivet. Husk: det er motivet, ikke verktøyet, som skiller value og values.","kt":"","src":"Starks s. 1841"},{"id":"SB011","l":"L1","t":"Investor motivations for ESG","f":"m","d":3,"p":"H","sc":"none","s":"A survey of about 30,000 Vanguard investors (Giglio et al.) shows that:","o":[["Most expect ESG funds to beat the market","Incorrect: on average they expect ESG funds to do worse than the market."],["Almost everyone wants to invest in ESG","Incorrect: almost half see no reason to invest in ESG at all."],["ESG demand comes mostly from values","Correct: ESG demand comes mostly from values, not from expected returns."],["Most want to hedge climate risk","Incorrect: climate hedging motivates only a minority."]],"c":[2],"es":"De fleste kjøper ESG av verdier, ikke for å tjene mer.","ed":"Undersøkelsen av Vanguard-kunder (Giglio et al.) viser at få kjøper ESG fordi de tror det gir høyere avkastning. I snitt forventer de faktisk at ESG gjør det litt dårligere. Etterspørselen drives mest av etiske preferanser, og nesten halvparten bryr seg ikke om ESG i det hele tatt. Husk: ESG-etterspørsel = mest values.","kt":"","src":"L1 slide 44 · Starks s. 1844-1845"},{"id":"SB012","l":"L1","t":"Value vs values","f":"t","d":3,"p":"H","sc":"short","s":"True or false: An investor who avoids an oil stock only because she thinks its stranded-asset risk is underpriced is a \"values\" investor (Starks, 2023).","o":[["True","Incorrect. She avoids the stock for risk and price reasons, which makes her a value investor, not a values investor."],["False","Correct. She avoids the stock for risk and price reasons, which makes her a value investor, not a values investor."]],"c":[1],"es":"Usant. Hun selger på grunn av risiko og pris, altså penger. Det gjør henne til value-investor.","ed":"Hun selger fordi hun tror stranded asset-risikoen ikke er priset inn, altså for å unngå tap. Det er et økonomisk motiv, så hun er en value-investor. En values-investor ville solgt av moralske grunner, selv om det kostet avkastning. Husk: motiv = penger → value.","kt":"Value investor (Starks): uses ESG because it affects risk and return. Values investor: invests according to ethics or preferences, accepting possible financial cost.","src":"Starks s. 1838 · L1 slide 44"},{"id":"SB013","l":"L1","t":"Drivers of sustainable finance","f":"m","d":3,"p":"M","sc":"short","s":"In 2021 a Dutch court ordered Shell to cut its emissions by 45% by 2030. Which driver of sustainable finance does this show?","o":[["Regulation","Correct: a court (the law) forces the cuts, so this is regulation."],["Lower interest rates","Incorrect: interest rates played no role in the ruling."],["Cheaper green technology","Incorrect: technology was not the cause here."],["Consumer demand","Incorrect: this was a lawsuit, not customers switching products."]],"c":[0],"es":"En domstol tvang Shell til kutt. Det er regulering/lov som driver.","ed":"Driverne for sustainable finance inkluderer regulering, teknologi, kundeetterspørsel og investorpress. I Shell-saken var det en domstol som påla kutt, altså lov og rett. Søksmål gjør en externality (utslipp) om til en finansiell risiko for firmaet. Husk: domstol/lov = regulation.","kt":"Internalisation: making a firm bear (part of) the cost of its externality, via regulation, taxes, litigation or stakeholder pressure.","src":"L5 slide 25 · L3 slide 17"},{"id":"SB014","l":"L1","t":"Sustainable finance","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A fund that only buys firms with low emissions today is automatically aligned with the Paris Agreement.","o":[["True","Incorrect. Paris alignment looks at the future emission path, so low emissions today are not enough."],["False","Correct. Paris alignment looks at the future emission path, so low emissions today are not enough."]],"c":[1],"es":"Usant. Paris-alignment handler om fremtidige utslipp, ikke bare dagens.","ed":"Paris-avtalen handler om å holde oppvarmingen godt under 2 °C, og alignment ser på utslippsbanen fremover. Et firma med lave utslipp i dag kan likevel ha en dårlig plan, og et med høye utslipp kan ha en troverdig vei ned. Derfor teller overgangsplaner og fremtidige utslipp. Husk: Paris = fremoverskuende.","kt":"Paris Agreement (2015): limit warming to well below 2°C, pursuing 1.5°C. Alignment = being on a pathway consistent with that goal.","src":"L1 slide 37 · PwC s. 25"},{"id":"SB015","l":"L1","t":"Double materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A salmon farmer faces (i) stricter rules that may raise its costs and (ii) pollution that harms wild fish but not its profits. Under double materiality, what should it report?","o":[["Only (ii)","Incorrect: double materiality does not drop the financial side."],["Neither","Incorrect: both issues matter, especially the pollution."],["Only (i)","Incorrect: only (i) is single (financial) materiality."],["Both","Correct: both directions must be reported."]],"c":[3],"es":"Double materiality = rapporter begge veier: hva som påvirker firmaet, og hva firmaet påvirker.","ed":"Double materiality betyr to retninger. Financial materiality (outside-in): hva påvirker firmaets verdi, her strengere regler. Impact materiality (inside-out): hva påvirker firmaet i verden, her forurensning av villfisk. Under double materiality skal begge rapporteres, selv om forurensningen ikke påvirker profitten. Husk: outside-in + inside-out.","kt":"","src":"L1 slide 36 · L6 slide 50 · PwC s. 29"},{"id":"SB016","l":"L1","t":"Planetary boundaries and the doughnut","f":"m","d":2,"p":"M","sc":"none","s":"In Raworth's doughnut, the \"safe and just space for humanity\" is:","o":[["Countries that have reached all the SDGs","Incorrect: the doughnut is a global framework, not a list of countries."],["Between the social floor and the ecological ceiling","Correct: the safe space is between the social floor and the ecological ceiling."],["Carbon prices that still allow growth","Incorrect: carbon prices do not define the doughnut."],["Above the ecological ceiling, as long as basic needs are met","Incorrect: above the ceiling is overshoot, outside the safe space."]],"c":[1],"es":"Safe and just space ligger mellom det sosiale gulvet og det økologiske taket.","ed":"Raworths doughnut har to ringer. Den indre ringen er det sosiale gulvet (grunnleggende behov), og den ytre er det økologiske taket (planetary boundaries). Under gulvet er det mangel (shortfall), over taket er det overshoot. Det trygge området er ringen mellom. Husk: mellom gulv og tak.","kt":"","src":"L1 slide 35 · Bok s. 11 (1.2.2)"},{"id":"SB017","l":"L1","t":"Planetary boundaries and the doughnut","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook, which planetary boundary has already been crossed?","o":[["Climate change","Correct: climate change is already past its boundary."],["Atmospheric aerosol loading","Incorrect: no global limit has been set for aerosols yet."],["Ocean acidification","Incorrect: ocean acidification is close but still inside the limit."],["Freshwater use","Incorrect: freshwater use is still below its limit."]],"c":[0],"es":"Climate change er en grense som allerede er krysset.","ed":"Planetary boundaries er grenser for hvor mye vi kan belaste jorda. Ifølge læreboka er flere allerede krysset: climate change, land-system change, biodiversity loss og biochemical flows (nitrogen og fosfor). Ocean acidification og ferskvann er fortsatt innenfor, og for aerosoler finnes ingen global grense. Husk: klima er krysset.","kt":"","src":"Bok s. 10 (1.2.1) · Bok s. 9 (1.2.1) · L1 slide 35"},{"id":"SB018","l":"L1","t":"Role of the financial system","f":"m","d":3,"p":"M","sc":"none","s":"Which function of the financial system is especially relevant for sustainable finance?","o":[["Collecting savings from households","Incorrect: this is a function of finance, but not one of the three highlighted."],["Making trade easier","Incorrect: this is a function of finance, but not one of the three highlighted."],["Guaranteeing savers a minimum return","Incorrect: guaranteeing returns is not a function of the financial system."],["Choosing where capital goes","Correct: allocation decides which projects get money."]],"c":[3],"es":"Å velge hvor kapitalen går (allocation) er den sentrale rollen for sustainable finance.","ed":"Levine beskriver flere funksjoner i finanssystemet. Tre er særlig viktige for sustainable finance: allocation (hvor kapitalen går), monitoring og governance, og risk management. Allokering er viktigst fordi den bestemmer hvilke aktiviteter som får finansiering. Husk: finance styrer pengene.","kt":"","src":"Bok s. 18 (1.3)"},{"id":"SB019","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":2,"p":"H","sc":"none","s":"Which stage maximises social and environmental value, subject to a minimum financial value?","o":[["SF 1.0 - refined shareholder value","Incorrect: SF 1.0 maximises F with small S and E limits."],["Finance as usual - shareholder value","Incorrect: finance as usual maximises F only."],["SF 3.0 - common good value","Correct: SF 3.0 maximises S and E, with F only as a minimum."],["SF 2.0 - stakeholder value","Incorrect: SF 2.0 weights F, S and E equally."]],"c":[2],"es":"SF 3.0 setter samfunn og miljø først, med en minste finansiell avkastning.","ed":"SF 3.0 kalles common good value. Her er målet å maksimere sosial og miljømessig verdi (S + E), mens finansiell verdi bare er et minstekrav (fair return). Dette er motsatt av SF 1.0, der F er målet og S/E bare begrensninger. Husk: SF 3.0 = samfunnet først.","kt":"","src":"Bok s. 20 (1.4) · L9 slide 29"},{"id":"SB020","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The time horizon gets longer from finance as usual and SF 1.0 (short), to SF 2.0 (medium), to SF 3.0 (long).","o":[["True","Correct. The horizon gets longer from finance as usual and SF 1.0 (short) to SF 2.0 (medium) and SF 3.0 (long)."],["False","Incorrect. The horizon gets longer from finance as usual and SF 1.0 (short) to SF 2.0 (medium) and SF 3.0 (long)."]],"c":[0],"es":"Sant. Jo høyere SF-nivå, jo lengre tidshorisont.","ed":"Tidshorisonten følger SF-trappen. Finance as usual og SF 1.0 er kortsiktige, SF 2.0 har mellomlang horisont, og SF 3.0 tenker langsiktig. Jo mer S og E teller, jo lengre må man se fremover, fordi slike effekter kommer sent. Husk: høyere SF = lengre horisont.","kt":"","src":"Bok s. 20 (1.4)"},{"id":"SB021","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":3,"p":"H","sc":"none","s":"Why does exclusion (SF 1.0) have only a limited effect at first?","o":[["Too few green investors to raise polluters' costs","Correct: there are too few green investors to raise polluters' cost of capital."],["Excluded shares disappear from the market","Incorrect: the shares do not disappear; other investors buy them."],["Excluded firms simply get cheaper bank loans instead","Incorrect: the textbook does not use this argument."],["Exclusion is illegal for pension funds","Incorrect: exclusion is legal and widely used."]],"c":[0],"es":"Andre investorer kjøper aksjene du selger. Effekten blir liten før mange nok er grønne.","ed":"Når en grønn investor selger, kjøper en annen investor aksjene. Kapitalkostnaden til forurenseren øker bare litt, så lenge de fleste investorene ikke bryr seg. Heinkel, Kraus og Zechner viser at det trengs en stor andel grønne investorer (ca. 20 %+) før exclusion virker. Husk: noen andre kjøper alltid.","kt":"","src":"Bok s. 21 (1.4.1) · L9 slide 33"},{"id":"SB022","l":"L1","t":"Integrated value","f":"m","d":4,"p":"M","sc":"none","s":"Which extra condition does SF 2.0 add when maximising integrated value?","o":[["F must equal S + E","Incorrect: there is no such equality condition."],["S and E may not get worse than before","Correct: S and E may not fall below today's level."],["Only a one-year horizon is used","Incorrect: SF 2.0 has a medium horizon, not one year."],["S and E use the same discount rate as F","Incorrect: the discount rate is a problem the book discusses, not this condition."]],"c":[1],"es":"SF 2.0 krever at S og E ikke blir verre enn i dag.","ed":"SF 2.0 maksimerer integrated value (F + S + E). I tillegg legger læreboka til en betingelse: sosial og miljømessig verdi (SEV) kan ikke bli lavere enn i dag. Ellers kunne firmaet \"kjøpe\" høyere F ved å ødelegge S og E. Husk: SF 2.0 = maks I, men S+E kan ikke falle.","kt":"","src":"Bok s. 22 (1.4.2) · Bok s. 23 (Box 1.4) · L3 slide 32"},{"id":"SB023","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Social and environmental effects come later and are less certain, so a private discount rate gives them less weight than financial value.","o":[["True","Correct. A high private discount rate gives little weight to effects that come late and are uncertain."],["False","Incorrect. A high private discount rate gives little weight to effects that come late and are uncertain."]],"c":[0],"es":"Sant. Høy privat diskonteringsrente gjør at sene, usikre S/E-effekter teller lite.","ed":"Private investorer bruker en høyere diskonteringsrente enn samfunnet, blant annet på grunn av usikkerhet. S- og E-effekter kommer ofte langt frem i tid og er usikre. Med høy rente blir nåverdien av dem liten, så de vektes for lite. Husk: sent + usikkert + høy rente = lav vekt.","kt":"","src":"Bok s. 22 (1.4.2) · Bok s. 55 (2.3.2)"},{"id":"SB024","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":4,"p":"M","sc":"none","s":"According to the textbook, where are most firms today, and what is the challenge?","o":[["At SF 2.0; the challenge is SF 3.0","Incorrect: most firms have not reached SF 2.0 yet."],["At SF 1.0; the challenge is SF 2.0","Correct: most are at SF 1.0, and the next step is SF 2.0."],["At finance as usual; the challenge is exclusion","Incorrect: most firms have already moved to SF 1.0."],["At SF 3.0; the challenge is returns","Incorrect: fewer than 1% are at SF 3.0."]],"c":[1],"es":"De fleste firmaer er på SF 1.0. Utfordringen er å komme til SF 2.0.","ed":"Læreboka mener de fleste firmaer og finansinstitusjoner er på SF 1.0, der S og E bare teller litt (ca. 10 %). Den virkelige utfordringen er steget til SF 2.0, der F, S og E vektes likt. SF 3.0 er en liten nisje. Husk: flest på 1.0, utfordringen er 2.0.","kt":"","src":"Bok s. 27 (1.4.4) · Bok s. 28 (1.4.4)"},{"id":"SB025","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":3,"p":"H","sc":"none","s":"In banking, which instrument is SF 3.0?","o":[["Impact lending and microfinance","Correct: loans with impact as the goal are SF 3.0."],["ESG integration in credit risk models","Incorrect: ESG in credit models is SF 2.0."],["Exclusion of very harmful sectors from the loan book","Incorrect: exclusion is SF 1.0."],["Catastrophe bonds","Incorrect: cat bonds are an insurance tool."]],"c":[0],"es":"I banking er SF 3.0 = impact lending og microfinance.","ed":"I banking tilsvarer SF 1.0 å utelukke skadelige sektorer, SF 2.0 å integrere ESG i kredittvurderingen, og SF 3.0 impact lending og microfinance. Det samme mønsteret gjelder i andre deler av finans: impact investing i aksjer, green bonds i obligasjoner, microinsurance i forsikring. Husk: SF 3.0 = impact først.","kt":"","src":"Bok s. 30 (Table 1.4) · L11 slide 18"},{"id":"SB026","l":"L1","t":"Legitimacy theory","f":"m","d":2,"p":"M","sc":"none","s":"Legitimacy theory says that:","o":[["Legitimacy depends only on shareholder value","Incorrect: that is the shareholder view, not legitimacy theory."],["Following the law is always enough for legitimacy","Incorrect: a social licence goes beyond just following the law."],["Firms need society's approval to operate","Correct: firms need society's approval to keep operating."],["Only governments can give legitimacy","Incorrect: approval comes from society, not only the state."]],"c":[2],"es":"Legitimacy theory: firmaet trenger samfunnets aksept for å drive (social licence to operate).","ed":"Legitimacy theory sier at firmaer trenger samfunnets aksept for å overleve, en social licence to operate. Denne aksepten går lenger enn å følge loven: firmaet må leve opp til samfunnets forventninger. Teorien brukes som begrunnelse for SF 3.0. Husk: lovlig er ikke nok, samfunnet må godta deg.","kt":"","src":"Bok s. 26 (1.4.3) · Bok s. 21 (1.4.1)"},{"id":"SB027","l":"L1","t":"Inside-out vs outside-in","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In Dyllick and Muff, the \"outside-in\" view asks how a firm can reduce its own impact on society and nature.","o":[["True","Incorrect. Reducing your own impact is inside-out; outside-in starts from society's problems."],["False","Correct. Reducing your own impact is inside-out; outside-in starts from society's problems."]],"c":[1],"es":"Usant. Å redusere egen skade er inside-out. Outside-in spør hvordan firmaet kan hjelpe å løse samfunnsproblemer.","ed":"Dyllick og Muff skiller mellom to perspektiver. Inside-out: firmaet starter med seg selv og prøver å redusere egen negativ påvirkning. Outside-in: firmaet starter med samfunnets utfordringer og spør hvordan det kan bidra til å løse dem. Outside-in er det mest ambisiøse (business sustainability 3.0). Husk: outside-in = start med samfunnet.","kt":"","src":"Bok s. 26 (1.4.3) · Bok s. 23 (1.4.2)"},{"id":"SB028","l":"L1","t":"Fair financial return","f":"m","d":2,"p":"M","sc":"none","s":"In SF 3.0, a \"fair financial return\" means:","o":[["A zero return, like charity","Incorrect: impact investing is not charity."],["At least the market return","Incorrect: market return is not required, only keeping capital."],["The highest return possible without sin stocks","Incorrect: that describes SF 1.0."],["At least keeping capital's real value","Correct: capital should at least keep its real value."]],"c":[3],"es":"Fair financial return = minst bevare kapitalens reelle verdi.","ed":"I SF 3.0 er finansiell avkastning et minstekrav, ikke målet. Fair financial return betyr at kapitalen minst skal bevare sin reelle verdi (etter inflasjon). Det er altså ikke veldedighet (null avkastning), men heller ikke krav om markedsavkastning. Husk: bevar kapitalen.","kt":"","src":"Bok s. 24 (1.4.3) · Bok s. 32 (Key concepts)"},{"id":"SB029","l":"L1","t":"ESG and financial performance","f":"m","d":4,"p":"M","sc":"none","s":"What does the evidence say about sustainability and financial performance?","o":[["Sustainable banks earn far higher returns","Incorrect: sustainable banks had slightly lower ROE, but less volatility."],["SRI funds always do much worse","Incorrect: many studies find little difference."],["Sustainable firms always earn more short term","Incorrect: there was no difference in short-term profit, only lower risk."],["No clear negative link; SRI results are mixed","Correct: there is no clear trade-off, and SRI results are mixed."]],"c":[3],"es":"Ingen tydelig negativ sammenheng. Resultatene for SRI er blandet.","ed":"Forskningen finner ingen tydelig negativ sammenheng mellom bærekraft og finansielle resultater. For SRI-fond er funnene blandet. Bærekraftige banker hadde litt lavere avkastning, men mindre svingninger. Husk: ingen klar trade-off. Vær skeptisk til svaralternativer med \"always\".","kt":"","src":"Bok s. 25 (1.4.3) · Bok s. 26 (1.4.3) · L11 slide 22"},{"id":"SB030","l":"L1","t":"ESG and financial performance","f":"m","d":4,"p":"M","sc":"none","s":"Why is it hard to say whether ESG investing performs better, according to Starks (2023)?","o":[["Firm characteristics never affect returns","Incorrect: this contradicts basic asset pricing."],["There are too few ESG funds","Incorrect: there are many funds; quantity is not the problem."],["Theory says ESG must always win","Incorrect: theory gives conflicting answers, not that ESG always wins."],["ESG funds have very different goals","Correct: ESG funds have very different goals, so they are hard to compare."]],"c":[3],"es":"ESG-fond har svært ulike mål, så de er vanskelige å sammenligne.","ed":"Starks peker på at \"ESG\" dekker mange ulike strategier og motiver. Noen fond er values-drevne og godtar lavere avkastning, andre er value-drevne. Når fondene har så ulike mål, blir det vanskelig å si noe generelt om ESG-avkastning. Husk: ESG er en blanding.","kt":"","src":"Starks s. 1851-1853"},{"id":"SB031","l":"L1","t":"Value versus values","f":"m","d":4,"p":"M","sc":"none","s":"According to Starks (2023), green securities carry a \"greenium\" when:","o":[["Regulators ban brown assets","Incorrect: bans are not the mechanism."],["Almost all investors are value investors","Incorrect: if almost everyone is a value investor, prices are fair."],["Values investors accept lower returns","Correct: values investors bid up the price and accept lower returns."],["Green firms must pay more for tech risk","Incorrect: a greenium means lower, not higher, required returns."]],"c":[2],"es":"Greenium oppstår når values-investorer godtar lavere avkastning på grønne papirer.","ed":"Greenium betyr at grønne papirer er dyrere og derfor gir lavere avkastning. Det skjer når values-investorer er villige til å betale mer for grønt. Da får grønne firmaer lavere kapitalkostnad. Hvis nesten alle er value-investorer, prises papirene ut fra risk og return, og greenium forsvinner. Husk: greenium = values-investorer betaler ekstra.","kt":"","src":"Starks s. 1848 · L9 slide 14-15"},{"id":"SB032","l":"L1","t":"ESG and value","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"The EU introduces stricter energy rules for buildings. A property firm owns many old, inefficient offices. How is its value hit?","o":[["Lower rents and higher costs","Correct: poor buildings lose tenants and need costly upgrades."],["Higher dividends forced by law","Incorrect: energy rules do not set dividends."],["No effect on buildings","Incorrect: buildings can become stranded when rules change."],["A lower tax rate","Incorrect: the rule does not change taxes."]],"c":[0],"es":"Strengere energikrav gir lavere leieinntekter og dyre oppgraderinger.","ed":"Strengere energikrav gjør gamle bygg mindre attraktive for leietakere, og de krever dyre oppgraderinger. Det gir lavere inntekter, høyere investeringer og mulige nedskrivninger. Dette er stranded asset-risiko fra regulering (transition risk). Husk: ny regel → eiendel mister verdi.","kt":"Stranded asset: an asset that loses value earlier than expected because of regulation, technology or market shifts.","src":"L1 slide 27 · Bok s. 291 (10.3)"},{"id":"SB033","l":"L1","t":"Value versus values","f":"m","d":5,"p":"H","sc":"none","s":"Which statement fits both Starks' value/values idea and the SF 1.0-3.0 stages?","o":[["Values investors never accept lower returns","Incorrect: values investors can accept lower returns."],["Any exclusion list means SF 3.0","Incorrect: exclusion is SF 1.0."],["A traditional investor is already at SF 2.0","Incorrect: a traditional investor is finance as usual."],["Lower returns for impact: SF 3.0 and values","Correct: impact with lower returns fits both SF 3.0 and values investing."]],"c":[3],"es":"Godta lavere avkastning for impact = SF 3.0 og values-investor.","ed":"Koblingen mellom Starks og SF-trappen: en investor som godtar lavere avkastning for å oppnå impact, er values-drevet og passer SF 3.0. En investor som bruker ESG for å forbedre risk og return, er value-drevet og passer SF 2.0. Exclusion alene er SF 1.0. Husk: SF 3.0 ↔ values.","kt":"","src":"Starks s. 1839-1841 · Bok s. 20 (Table 1.3) · L9 slide 29"},{"id":"SB034","l":"L1","t":"Sustainable development","f":"m","d":1,"p":"M","sc":"none","s":"The Brundtland Report (1987) defines sustainable development as development that:","o":[["puts nature above all other goals","Incorrect: the concept balances economy, society and environment."],["stops using non-renewable resources","Incorrect: it is not about zero use of resources."],["maximises GDP growth while keeping inflation low","Incorrect: Brundtland goes beyond growth."],["meets today's needs without hurting future ones","Correct: this is the Brundtland definition."]],"c":[3],"es":"Brundtland: dekke dagens behov uten å ødelegge for fremtidige generasjoner.","ed":"Brundtland-rapporten (1987) definerer bærekraftig utvikling som utvikling som dekker dagens behov uten å ødelegge fremtidige generasjoners mulighet til å dekke sine. Den balanserer økonomi, samfunn og miljø. Husk: nå + fremtid.","kt":"","src":"Bok s. 6 (1.1)"},{"id":"SB035","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":5,"p":"M","sc":"constructed_scenario","s":"A pension fund first excludes coal, but still maximises financial return. Later it puts carbon prices in its forecasts and aims to maximise integrated value. What are these two steps?","o":[["SF 2.0, then finance as usual","Incorrect: exclusion is SF 1.0, and carbon pricing is not finance as usual."],["Both are SF 3.0","Incorrect: SF 3.0 puts S and E first; here F is still maximised in step one."],["Neither changes the goal","Incorrect: both steps change something."],["SF 1.0, then SF 2.0","Correct: exclusion is SF 1.0, integrated value is SF 2.0."]],"c":[3],"es":"Først exclusion (SF 1.0), så carbon pricing og integrated value (SF 2.0).","ed":"Første steg (utelukke kull, men fortsatt maksimere avkastning) er SF 1.0. Andre steg legger karbonpris inn i prognosene og sikter mot integrated value (F + S + E), og det er SF 2.0. Fondet har altså gått fra å utelukke til å prise inn externalities. Husk: utelukke = 1.0, prise inn = 2.0.","kt":"","src":"Bok s. 22 (Box 1.3) · L9 slide 29"},{"id":"TR01","l":"L1","t":"Real options","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A shipping firm plans to buy a ship now, but a cleaner engine may arrive in two to three years. Which tool fits this choice?","o":[["Beta estimation","Incorrect: beta measures market risk, not the value of waiting."],["Agency theory","Incorrect: agency is about conflicts of interest, not timing."],["Real options","Correct: waiting for new technology has option value."],["Negative screening","Incorrect: screening is a portfolio strategy."]],"c":[2],"es":"Valget er om man skal vente på bedre teknologi. Det er real options.","ed":"En real option er verdien av fleksibilitet, for eksempel muligheten til å vente. Hvis en renere motor kan komme om to-tre år, kan det lønne seg å vente med å kjøpe skip, fordi man unngår å låse seg til gammel teknologi. Husk: real option = verdien av å vente.","kt":"Real option: the right, but not the obligation, to take an action later (e.g. defer, expand, abandon) once more is known.","src":"Opptak L1 ca. 65 min · Opptak L9 ca. 18 min"},{"id":"TR02","l":"L1","t":"Planetary boundaries and the doughnut","f":"t","d":3,"p":"H","sc":"none","s":"True or false: The lecturer argues that developing countries should make the same fast, deep emission cuts as rich countries.","o":[["True","Incorrect. Many people in poor countries live below the social floor, so equal cuts for all ignore basic needs."],["False","Correct. Many people in poor countries live below the social floor, so equal cuts for all ignore basic needs."]],"c":[1],"es":"Usant. Fattige land har mange under det sosiale gulvet og trenger vekst.","ed":"Foreleseren viser til doughnut-modellen: det finnes både overshoot (over taket) og shortfall (under gulvet). Mange i utviklingsland mangler grunnleggende behov, og forurensning kan være den billigste veien til vekst for dem. Like kutt for alle ignorerer dette. Husk: begge sider av doughnut teller.","kt":"Social foundation: the inner ring of the doughnut; falling below it means people lack basic needs (shortfall).","src":"Opptak L1 ca. 79 min"},{"id":"TR03","l":"L1","t":"Drivers of sustainable finance","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"With no law requiring it, a milk producer loses customers to a rival that has cut its emissions. Which driver of sustainable finance is this?","o":[["Regulation","Incorrect: the question says no law requires it."],["Physical climate damage","Incorrect: there is no physical damage in the case."],["Modigliani-Miller","Incorrect: MM is about capital structure."],["Client demand","Correct: customers reward the greener rival."]],"c":[3],"es":"Kunder bytter til den grønne konkurrenten uten lovkrav. Det er client demand.","ed":"Når kundene bytter til en konkurrent med lavere utslipp, uten at noen lov krever det, er driveren client demand. Kundenes valg gjør bærekraft lønnsomt. Husk: ingen lov = ikke regulation; kunder som bytter = client demand.","kt":"","src":"Opptak L1 ca. 77 min"},{"id":"EX03","l":"L2","t":"Exam sample: consequentialism","f":"t","d":2,"p":"H","sc":"none","s":"Is utilitarianism classified as a non-consequentialist ethical theory?","o":[["Yes","Feil. Utilitarianism er consequentialist: den bedømmer handlinger ut fra konsekvensene (total nytte)."],["No","Riktig. Utilitarianism er consequentialist: den bedømmer handlinger ut fra konsekvensene (total nytte)."]],"c":[1],"es":"Nei: utilitarianism = consequentialist.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- Consequentialist (resultatet teller): ethical egoism, utilitarianism.\n- Non-consequentialist (prinsippet teller): ethics of duty (Kant), rights, justice.","kt":"Consequentialist vs non-consequentialist theories.","src":"L2 slide 9 · Crane s. 17","k":1,"x":1},{"id":"CX009","l":"L2","t":"Normative vs descriptive ethics","f":"m","d":2,"p":"H","sc":"none","s":"A descriptive (not normative) ethics question is:","o":[["Should firms ever accept child labour in supply chains?","'Should' = normativ."],["Why do employees break rules when under pressure?","Den beskriver hvordan folk faktisk oppfører seg."],["Is it morally wrong to mislead a firm's investors?","Den spør hva som er rett eller galt, altså normativ."],["What would a fair wage for workers be?","Den spør hva som er rettferdig, altså normativ."]],"c":[1],"es":"Descriptive = hvordan folk faktisk handler.","ed":"Normative teorier (Kant, utilitarianism) sier hva man bør gjøre. Descriptive teorier (CMD, moral intensity) forklarer hvorfor folk handler som de gjør.","kt":"","src":"L2 slide 7 · L2 slide 12 · Crane s. 53","k":1},{"id":"CX010","l":"L2","t":"Utilitarianism","f":"t","d":2,"p":"H","sc":"none","s":"Can utilitarianism justify harming a small group if the total benefit for everyone is larger?","o":[["Yes","Riktig. Utilitarianism ser på summen. Blir summen positiv, kan skade på noen godtas."],["No","Feil. Utilitarianism ser på summen. Blir summen positiv, kan skade på noen godtas."]],"c":[0],"es":"Ja: summen avgjør.","ed":"Dette er en klassisk kritikk av utilitarianism: minoriteter kan bli ofret for flertallets nytte. Rights og Kant setter grenser for dette.","kt":"","src":"L2 slide 9 · Crane s. 17","k":1},{"id":"CX011","l":"L2","t":"Kant's ethics of duty","f":"t","d":2,"p":"H","sc":"none","s":"Does Kant's ethics allow using people merely as a means if the outcome is good enough?","o":[["Yes","Feil. Kant sier at mennesker aldri skal brukes bare som et middel, uansett resultat."],["No","Riktig. Kant sier at mennesker aldri skal brukes bare som et middel, uansett resultat."]],"c":[1],"es":"Nei: aldri 'merely as a means'.","ed":"Kant er non-consequentialist: handlingen bedømmes ut fra plikt og prinsipp, ikke resultatet. To tester: universalisability og humanity (ikke bare et middel).","kt":"","src":"L2 slide 9 · Crane s. 17 · Crane s. 18","k":1},{"id":"CX012","l":"L2","t":"Ethical egoism","f":"m","d":2,"p":"H","sc":"none","s":"Ethical egoism is classified as:","o":[["As a form of virtue ethics","Virtue ethics handler om karakter, ikke eget utfall."],["As a form of discourse ethics","Discourse ethics handler om dialog."],["As a non-consequentialist theory","Egoism ser på resultatet for en selv, så den er consequentialist."],["As a consequentialist theory","Den bedømmer handlinger ut fra konsekvensene for en selv."]],"c":[3],"es":"Egoism og utilitarianism er begge consequentialist.","ed":"Forskjellen mellom de to consequentialist-teoriene: egoism ser på konsekvensene for meg, utilitarianism ser på konsekvensene for alle.","kt":"","src":"Opptak L2 ca. 33 min","k":1},{"id":"CX013","l":"L2","t":"Rights and justice","f":"m","d":2,"p":"H","sc":"none","s":"The ethical theory that focuses on how benefits and burdens are distributed is:","o":[["Ethical egoism","Egoism ser bare på eget beste."],["Justice","Justice = rettferdig fordeling."],["Virtue ethics","Virtue ethics handler om karakter."],["Rights","Rights handler om hver enkelts grunnleggende rettigheter."]],"c":[1],"es":"Fordeling = justice.","ed":"Justice og rights er begge non-consequentialist. Rights handler om hver enkelts grunnleggende rettigheter, justice om rettferdig fordeling.","kt":"","src":"L2 slide 9 · Crane s. 26 · Crane s. 27","k":1},{"id":"CX014","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"H","sc":"none","s":"Virtue ethics asks:","o":[["What would a person of good character do?","Virtue ethics = karakter og integritet."],["Could my rule be followed by everyone?","Det er Kant (universalisability)."],["Which action gives the most total happiness?","Det er utilitarianism."],["What can all parties agree on in dialogue?","Det er discourse ethics."]],"c":[0],"es":"Virtue = karakter.","ed":"Huskeliste:\n- Utilitarianism: størst sum?\n- Kant: kan alle gjøre det?\n- Virtue: hva ville et godt menneske gjort?\n- Care: tar det vare på relasjonene?\n- Discourse: kan alle enes i åpen dialog?","kt":"","src":"L2 slide 10 · Crane s. 31","k":1},{"id":"CX015","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"H","sc":"none","s":"The ethical theory that focuses on relationships and the needs of specific people is:","o":[["Kantian ethics","Kant handler om universelle plikter."],["Discourse ethics","Discourse handler om åpen dialog."],["Utilitarianism","Utilitarianism handler om total nytte."],["Ethic of care","Care = relasjoner og empati."]],"c":[3],"es":"Relasjoner = ethic of care.","ed":"Ethic of care ser den konkrete situasjonen og menneskene i den, i stedet for abstrakte regler som Kant.","kt":"","src":"L2 slide 10 · Crane s. 31","k":1},{"id":"CX016","l":"L2","t":"Absolutism and relativism","f":"m","d":2,"p":"H","sc":"none","s":"Saying that whether bribery is wrong depends entirely on local culture is:","o":[["Ethical absolutism","Absolutism: samme regler overalt."],["Ethical pluralism","Pluralism er mellomtingen boka anbefaler."],["Ethical relativism","Moral avhenger av kultur = relativism."],["Ethical egoism","Egoism handler om eget beste."]],"c":[2],"es":"'Kommer an på kulturen' = relativism.","ed":"Absolutism: universelle regler. Relativism: avhenger av kultur. Boka anbefaler en mellomting (pluralism).","kt":"","src":"L2 slide 7 · Crane s. 4 · Crane s. 3","k":1},{"id":"CX017","l":"L2","t":"Cognitive moral development","f":"m","d":2,"p":"H","sc":"short","s":"An employee who refuses to pay a bribe because it breaks her own principles, even though her boss wants it, is at the:","o":[["Moral muteness","Moral muteness er å unngå moralsk språk, ikke et CMD-nivå."],["Pre-conventional level","Pre-conventional handler om egen fordel eller straff."],["Post-conventional level","Hun følger egne prinsipper, også mot gruppen og sjefen."],["Conventional level","Conventional ville betydd å følge det sjefen og gruppen forventer."]],"c":[2],"es":"Egne prinsipper mot gruppepress = post-conventional.","ed":"Kohlberg:\n- Pre-conventional: hva gagner meg?\n- Conventional: hva forventer andre?\n- Post-conventional: hva sier mine prinsipper?","kt":"","src":"L2 slide 16-17 · Crane s. 64 · Crane s. 65","k":1},{"id":"CX018","l":"L2","t":"Moral intensity","f":"m","d":2,"p":"H","sc":"none","s":"According to Jones, an issue feels MORE morally intense when:","o":[["The harm is large and happens soon","Magnitude og temporal immediacy øker moral intensity."],["The harm affects distant strangers","Lav proximity gir lavere intensitet."],["The harm lies far in the future","Skade langt frem i tid føles mindre intens."],["The harm is unlikely to happen","Lav probability of effect gir lavere intensitet."]],"c":[0],"es":"Stor, snart, sannsynlig, nær = høy intensitet.","ed":"Seks faktorer: magnitude, social consensus, probability of effect, temporal immediacy, proximity, concentration of effect. Dette forklarer også hvorfor klima er vanskelig: skaden er langt frem og ofte langt unna.","kt":"","src":"L2 slide 20 · Crane s. 76","k":1},{"id":"SB036","l":"L2","t":"Normative vs descriptive ethics","f":"m","d":1,"p":"H","sc":"none","s":"The difference between normative and descriptive ethical theories is that:","o":[["Normative is for people; descriptive is for firms","Feil: begge kan brukes på både personer og firmaer."],["Normative describes; descriptive tells what to do","Feil: snudd. Normative sier hva man bør gjøre."],["Normative comes from religion; descriptive comes from philosophy","Feil: forskjellen er ikke religion vs filosofi."],["Normative: what is right; descriptive: what people do","Riktig: normative = hva som er riktig, descriptive = hva folk gjør."]],"c":[3],"es":"Normative sier hva som er riktig. Descriptive beskriver hva folk faktisk gjør.","ed":"Husk: normative = \"bør\", descriptive = \"er\".","kt":"","src":"L2 slide 7 · L2 slide 12 · Crane s. 53"},{"id":"SB037","l":"L2","t":"Absolutism and relativism","f":"m","d":2,"p":"H","sc":"none","s":"A manager says that whether small bribes to officials are wrong depends only on local norms. This position is:","o":[["Ethical relativism","Riktig: moral avhenger av sted og kultur."],["Ethical absolutism","Feil: absolutism sier at bestikkelse er galt overalt."],["Ethical pluralism","Feil: pluralism godtar flere syn, men sier ikke at alt er lokalt."],["Utilitarianism","Feil: utilitarianism er en universell teori som veier konsekvenser."]],"c":[0],"es":"\"Det kommer an på lokale normer\" = ethical relativism.","ed":"Husk: relativism = ingen universelle regler. Absolutism = samme regler overalt.","kt":"","src":"L2 slide 7 · Crane s. 4 · Crane s. 3"},{"id":"SB038","l":"L2","t":"Ethical theories","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A mining firm can open a mine that creates 2,000 jobs, but it must move a local community against its will. Which statement applies the theories correctly?","o":[["Kant objects to using the community merely as a means","Riktig: å tvangsflytte folk bruker dem kun som et middel."],["Utilitarianism rejects any project that harms someone","Feil: utilitarianism godtar skade hvis total nytte er større."],["Ethical egoism puts the community first","Feil: egoism ser på egen interesse, ikke lokalsamfunnet."],["Deontology approves it if profits are high","Feil: deontology bytter ikke plikter mot profitt."]],"c":[0],"es":"Kant: du kan ikke bruke folk bare som et middel, uansett hvor mange jobber det gir.","ed":"Husk: Kant = plikter og rettigheter. Utilitarianism = sum av nytte.","kt":"Consequentialist theories (egoism, utilitarianism) judge outcomes; non-consequentialist theories (Kantian duties, rights and justice) judge principles.","src":"L2 slide 9 · Crane s. 17"},{"id":"SB039","l":"L2","t":"Utilitarianism","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A manager says: \"Child labour at this one supplier may help a little, but as a general rule it causes far more harm than good, so we will not use it.\" This is:","o":[["Ethical egoism","Feil: egoism ser på egen interesse, ikke total skade."],["Rule utilitarianism","Riktig: han ser på regelen som helhet og dens konsekvenser."],["Ethics of care","Feil: ethics of care handler om relasjoner."],["Act utilitarianism","Feil: act utilitarianism ville bare sett på denne ene leverandøren."]],"c":[1],"es":"Han vurderer regelen (\"barnearbeid generelt\"), ikke bare denne ene handlingen. Det er rule utilitarianism.","ed":"Husk: act = denne ene handlingen. Rule = hva skjer hvis dette blir regelen.","kt":"","src":"L2 slide 9 · Crane s. 15 · Crane s. 16"},{"id":"SB040","l":"L2","t":"Utilitarianism","f":"m","d":3,"p":"M","sc":"none","s":"A problem with utilitarianism, according to Crane et al., is that:","o":[["It gives extra weight to yourself","Feil: alle teller likt, også deg selv."],["It assumes people act only from a sense of duty","Feil: plikt er Kant, ikke utilitarianism."],["It can ignore minorities who pay","Riktig: mindretall som betaler kan bli oversett."],["It ignores consequences","Feil: utilitarianism handler bare om konsekvenser."]],"c":[2],"es":"Utilitarianism ser på total nytte, så en liten gruppe kan tape mye.","ed":"Husk: problemet er fordeling. Flertallet kan vinne på mindretallets bekostning.","kt":"","src":"Crane s. 15 · Crane s. 57"},{"id":"SB041","l":"L2","t":"Kant's ethics of duty","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A CFO thinks about faking earnings \"just this once\". Which reasoning is Kantian?","o":[["It is wrong only if total harm beats total benefit","Feil: å veie skade mot nytte er utilitarianism."],["It is wrong because a good person would feel ashamed","Feil: karakter og skam er virtue ethics."],["It is fine if everyone in the industry does it","Feil: \"alle gjør det\" er relativism."],["If every CFO did it, no report could be trusted","Riktig: dette er universalisability-testen til Kant."]],"c":[3],"es":"Kant: hva hvis alle gjorde det? Da kunne ingen stole på regnskap.","ed":"Husk: Kant-testen = kan dette bli en regel for alle?","kt":"","src":"L2 slide 9 · Crane s. 17 · Crane s. 18"},{"id":"SB042","l":"L2","t":"Kant's ethics of duty","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Evan and Freeman base stakeholder theory partly on Kant: stakeholders should be treated as ends, not only as means.","o":[["True","Riktig. Evan og Freeman bygger stakeholder theory på Kant: behandle folk som mål, ikke bare midler."],["False","Feil. Evan og Freeman bygger stakeholder theory på Kant: behandle folk som mål, ikke bare midler."]],"c":[0],"es":"Sant. Evan og Freeman bygger på Kant: stakeholders er mål i seg selv, ikke bare midler.","ed":"Husk: stakeholder theory har røtter i Kant.","kt":"","src":"Crane s. 18 · L4 slide 13"},{"id":"SB043","l":"L2","t":"Kant's ethics of duty","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A key criticism of Kant is that he focuses too much on outcomes and too little on duty.","o":[["True","Feil. Kritikken er det motsatte: Kant ser for lite på konsekvensene."],["False","Riktig. Kritikken er det motsatte: Kant ser for lite på konsekvensene."]],"c":[1],"es":"Usant. Kritikken er motsatt: Kant bryr seg for lite om utfall.","ed":"Husk: Kant = plikt først, selv om utfallet blir dårlig.","kt":"","src":"Crane s. 19"},{"id":"SB044","l":"L2","t":"Rights and justice","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"A board defends a huge CEO bonus: it helps the lowest-paid workers too, and the CEO job is open to anyone. Which theory supports this?","o":[["Postmodern ethics","Feil: postmodern ethics bygger på magefølelse, ikke prinsipper om fordeling."],["Ethical egoism","Feil: egoism ville bare sett på CEO-ens egen interesse."],["Kant's categorical imperative","Feil: Kant handler om plikt og universelle regler."],["Rawls' theory of justice","Riktig: Rawls godtar ulikhet som hjelper de svakeste."]],"c":[3],"es":"Ulikhet er ok hvis den hjelper de svakeste og jobben er åpen for alle. Det er Rawls.","ed":"Husk: Rawls = difference principle + like muligheter.","kt":"","src":"L2 slide 9 · Crane s. 26 · Crane s. 27"},{"id":"SB045","l":"L2","t":"Rights and justice","f":"m","d":2,"p":"M","sc":"none","s":"Under the UN Guiding Principles (Ruggie), the main duty of business is to:","o":[["Respect human rights","Riktig: business sitt ansvar er å respektere."],["Enforce human rights laws where the state is weak","Feil: å beskytte og håndheve er statens plikt."],["Report only issues that affect profits","Feil: ansvaret gjelder uansett effekt på profitt."],["Act as a court for victims","Feil: domstoler er statens oppgave."]],"c":[0],"es":"Under UNGP skal staten beskytte, mens business skal respektere menneskerettigheter.","ed":"Husk: Protect (stat), Respect (business), Remedy (begge).","kt":"","src":"Crane s. 21 · Crane s. 22"},{"id":"SB046","l":"L2","t":"Ethical theories","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A CEO who says \"we invest in worker safety because accidents hurt our profits in the long run\" is reasoning like an ethical egoist.","o":[["True","Riktig. Begrunnelsen er firmaets egen interesse (profitt), og det er ethical egoism."],["False","Feil. Begrunnelsen er firmaets egen interesse (profitt), og det er ethical egoism."]],"c":[0],"es":"Sant. Begrunnelsen er firmaets egen langsiktige interesse. Det er ethical egoism.","ed":"Husk: \"fordi det lønner seg for oss\" = egoism, selv om resultatet er bra.","kt":"Ethical egoism: an action is right if it maximises the decision-maker's long-term self-interest.","src":"L2 slide 9 · Crane s. 12"},{"id":"SB047","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"H","sc":"none","s":"Which theory and focus are correctly matched?","o":[["Ethics of care - universal rules","Feil: ethics of care handler om relasjoner, ikke universelle regler."],["Virtue ethics - total welfare","Feil: virtue ethics handler om karakter. Total nytte er utilitarianism."],["Discourse ethics - open, honest dialogue","Riktig: discourse ethics finner normer gjennom åpen dialog."],["Postmodern ethics - fixed rules for every culture","Feil: postmodern ethics avviser faste regler."]],"c":[2],"es":"Discourse ethics = åpen, ærlig dialog med de berørte.","ed":"Husk: care = relasjoner, virtue = karakter, discourse = dialog, postmodern = magefølelse.","kt":"","src":"L2 slide 10 · Crane s. 31"},{"id":"SB048","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"A manager under pressure to hide a product defect asks: \"What would an honest, brave professional do?\" This reflects:","o":[["Virtue ethics","Rikti
