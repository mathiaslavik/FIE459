 SP ≤ 1."],["When SP > 1","Feil: over 1 er ikke bærekraftig."],["When its ESG rating is above average","Feil: rating ser ikke på grenser."],["When emissions fall each year","Feil: forbedring sier ikke noe om grensen."]],"c":[0],"es":"SP ≤ 1 betyr at faktisk påvirkning er innenfor grensen.","ed":"Husk: under 1 = innenfor taket.","kt":"","src":"Bok s. 105 (4.2) · Bok s. 168 (6.3.3)"},{"id":"SB490","l":"L13","t":"Role of players","f":"m","d":3,"p":"H","sc":"short","s":"Norway's government faces elections every four years but must cut emissions over decades. Which threat to government does this show?","o":[["A short horizon","Riktig: kort horisont."],["Marking to market","Feil: det er for investorer."],["Single-issue campaigns","Feil: det er for sivilsamfunnet."],["Poverty and fear of change","Feil: det er for husholdninger."]],"c":[0],"es":"Valg hvert fjerde år gir kort horisont.","ed":"Husk: myndigheter = opptil fire år.","kt":"Table 3.1: each player (government, civil society, corporates, investors, households) has a sphere of influence, horizon, mechanisms, opportunities and threats.","src":"L13 slide 8-9 · Bok s. 84 (Table 3.1)"},{"id":"SB491","l":"L13","t":"Coalitions","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"A new investor alliance covers 60% of Nordic assets and has ambitious goals, but no reporting and no consequences for missing targets. What is the main weakness?","o":[["The goals are too ambitious","Feil: ambisjon er bra hvis det håndheves."],["No checks or sanctions","Riktig: ingen kontroll eller sanksjoner."],["It has too many members","Feil: høy dekning er en styrke."],["It is not run by the government","Feil: selvstyrte koalisjoner kan virke."]],"c":[1],"es":"Ingen kontroll og ingen konsekvenser.","ed":"Husk: Ostrom krever monitoring og sanksjoner.","kt":"Ostrom's design principles: clear boundaries, rules restricting use, collective choice, monitoring, graduated sanctions, conflict resolution.","src":"L13 slide 6-7 · Bok s. 111 (4.3.1) · Bok s. 112 (Table 4.3) · Bok s. 113 (4.3.1)"},{"id":"SB492","l":"L13","t":"Coalitions","f":"m","d":3,"p":"H","sc":"none","s":"How does the size of sustainable finance coalitions relate to their ambition?","o":[["No link","Feil: det er en tydelig sammenheng."],["Larger is more ambitious","Feil: de største er minst ambisiøse."],["All are SF 3.0","Feil: de fleste er SF 1.0/2.0."],["Larger is less ambitious","Riktig: større = mindre ambisiøs."]],"c":[3],"es":"Jo større koalisjon, jo lavere ambisjon.","ed":"Husk: store = SF 1.0–2.0.","kt":"","src":"L13 slide 3-9 · Bok s. 113 (4.3.1)"},{"id":"SB493","l":"L13","t":"Coalitions","f":"m","d":2,"p":"M","sc":"none","s":"Which is a reason for joining a sustainable finance coalition?","o":[["Joint engagement","Riktig: felles engagement."],["Escaping regulation","Feil: privat og offentlig forsterker hverandre."],["Avoiding monitoring","Feil: koalisjoner krever overvåking."],["Higher short-term profits","Feil: fokuset er langsiktig."]],"c":[0],"es":"Felles engagement er en grunn til å bli med.","ed":"Husk: samarbeid øker suksess.","kt":"","src":"L13 slide 3-9 · Bok s. 110 (4.3.1) · Bok s. 111 (4.3.1)"},{"id":"SB494","l":"L13","t":"Coalitions","f":"m","d":3,"p":"H","sc":"none","s":"Using Ostrom's principles, what is a clear weak spot of many sustainable finance coalitions?","o":[["Weak enforcement and few sanctions","Riktig: svak håndheving."],["Too many members from poor countries","Feil: ikke problemet."],["No principles at all","Feil: flere har prinsipper."],["Too strict sanctions","Feil: sanksjoner mangler stort sett."]],"c":[0],"es":"Svak håndheving og få sanksjoner.","ed":"Husk: mangler Ostroms sanksjoner.","kt":"","src":"L13 slide 3-9 · Bok s. 111 (4.3.1) · Bok s. 113 (4.3.1) · Bok s. 114 (4.3.1)"},{"id":"SB495","l":"L13","t":"Government policy","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Green steel costs 25% more than normal steel (its \"green premium\"). Which policy best \"levels the playing field\"?","o":[["Banning steel imports","Feil: ikke mekanismen."],["Cutting R&D funding","Feil: man trenger mer R&D."],["A rising carbon price","Riktig: karbonpris."],["Ignoring emissions for now","Feil: da består premien."]],"c":[2],"es":"En stigende karbonpris lukker green premium.","ed":"Husk: level the playing field = karbonpris.","kt":"Green premium: the extra cost of choosing a zero-carbon option over a fossil one.","src":"L13 slide 11-12 · L3 slide 19"},{"id":"SB496","l":"L13","t":"Coalitions","f":"m","d":2,"p":"L","sc":"none","s":"How do private coalitions and government regulation relate?","o":[["Coalitions make rules unnecessary","Feil: man trenger begge."],["They support each other","Riktig: de støtter hverandre."],["Coalitions should fight regulation","Feil: de støtter god politikk."],["Rules always weaken coalitions","Feil: de utfyller hverandre."]],"c":[1],"es":"Koalisjoner og regulering støtter hverandre.","ed":"Husk: complements.","kt":"","src":"L13 slide 3-9 · Bok s. 111 (4.3.1) · Bok s. 114 (4.4)"},{"id":"SB497","l":"L13","t":"Transition dynamics","f":"m","d":2,"p":"H","sc":"none","s":"According to the x-curve (Loorbach et al.), how do transitions happen?","o":[["Through one decision that replaces everything","Feil: overganger tar tiår."],["Through small, smooth improvements","Feil: små forbedringer er det gamle systemet."],["Only through collapse","Feil: det nye bygges parallelt."],["The new grows while the old breaks down","Riktig: nytt opp, gammelt ned."]],"c":[3],"es":"Det nye vokser mens det gamle bryter sammen.","ed":"Husk: x-curve = to linjer som krysser.","kt":"","src":"Bok s. 352 (12.1) · Bok s. 352 (Figure 12.1) · Bok s. 353 (12.1)"},{"id":"SB498","l":"L13","t":"Transition dynamics","f":"m","d":3,"p":"H","sc":"none","s":"Which practice is a small (incremental) change within today's financial system, not a transformation?","o":[["Optimising integrated value","Feil: det er det nye systemet."],["Focused portfolios for long-term value","Feil: det er et eksperiment."],["Using ESG ratings to screen","Riktig: ESG-screening er inkrementelt."],["Integrated investment and engagement teams","Feil: det er det nye systemet."]],"c":[2],"es":"ESG-screening er en liten forbedring innenfor dagens system.","ed":"Husk: incremental vs transformation.","kt":"","src":"Bok s. 353 (12.1) · Bok s. 356 (12.1.1.1)"},{"id":"SB499","l":"L13","t":"Transition management","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Backcasting starts from today and extends current trends forward to see where we end up in 2050.","o":[["True","Feil. Å forlenge trender fremover er forecasting. Backcasting starter med ønsket fremtid."],["False","Riktig. Å forlenge trender fremover er forecasting. Backcasting starter med ønsket fremtid."]],"c":[1],"es":"Usant. Det er forecasting. Backcasting starter med målet og jobber bakover.","ed":"Husk: back = fra mål tilbake til nå.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (Figure 12.2) · Bok s. 354 (12.1.1)"},{"id":"SB500","l":"L13","t":"Transition management","f":"m","d":2,"p":"H","sc":"none","s":"What is the \"new vision\" for the financial sector in chapter 12?","o":[["Finance long-term value","Riktig: langsiktig verdi."],["Fund green projects only with subsidies","Feil: kritiseres."],["Maximise return with some exclusions","Feil: det er det gamle systemet."],["Replace private finance with state banks","Feil: ikke visjonen."]],"c":[0],"es":"Finanssektoren skal finansiere langsiktig verdi.","ed":"Husk: bruk allokering til å styre.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (12.1.1.1) · Bok s. 355 (12.1.1.1) · Bok s. 356 (12.1.1.1)"},{"id":"SB501","l":"L13","t":"Transition management","f":"m","d":3,"p":"M","sc":"none","s":"In Loorbach's transition management, which tool works at the STRATEGIC level?","o":[["Transition experiments","Feil: eksperiment er operasjonelt."],["Transition agendas","Feil: agenda er taktisk nivå."],["Transition arenas","Riktig: arena er strategisk nivå."],["Monitoring and evaluation","Feil: monitoring er refleksivt nivå."]],"c":[2],"es":"Transition arenas er på strategisk nivå.","ed":"Husk: arena = strategisk, agenda = taktisk, eksperiment = operasjonelt.","kt":"","src":"L13 slide 13-16 · Bok s. 359 (Figure 12.4) · Bok s. 359 (12.2) · Bok s. 360 (12.2)"},{"id":"SB502","l":"L13","t":"Transition management","f":"m","d":2,"p":"M","sc":"none","s":"Which is a TRUE experiment in a new system, not just improving the old one?","o":[["Adding an ESG screen to an index fund","Feil: bare overflaten."],["A small SDG-themed allocation","Riktig: SDG-allokering."],["Publishing a CSR report","Feil: det gamle systemet."],["Quarterly benchmarking","Feil: det gamle systemet."]],"c":[1],"es":"En liten SDG-allokering er et ekte eksperiment.","ed":"Husk: ekte eksperiment = nytt system.","kt":"","src":"L13 slide 13-16 · Bok s. 357 (12.1.1.3) · Bok s. 358 (12.1.1.3)"},{"id":"SB503","l":"L13","t":"Government policy","f":"m","d":3,"p":"M","sc":"short","s":"Coal regions like Poland's Silesia face job losses as coal is phased out. Which policy fits a \"just transition\"?","o":[["Keep the mines open forever","Feil: blokkerer overgangen."],["Phase out and retrain","Riktig: fase ut og omskoler."],["Leave workers to charity","Feil: myndighetene har en rolle."],["Close the mines overnight","Feil: ignorerer sosiale kostnader."]],"c":[1],"es":"Fase ut og omskoler arbeiderne.","ed":"Husk: just transition = fordel kostnadene rettferdig.","kt":"Just transition: moving to a low-carbon economy in a way that is fair to affected workers and communities.","src":"L13 slide 12 · PwC s. 47"},{"id":"SB504","l":"L13","t":"Role of players","f":"m","d":2,"p":"M","sc":"short","s":"Greenpeace runs a media campaign against a bank that finances an oil pipeline. Which player and tool is this?","o":[["Investors","Feil: Greenpeace låner ikke ut."],["Civil society","Riktig: civil society."],["Households","Feil: dette er en organisert NGO."],["Government","Feil: Greenpeace kan ikke skattlegge."]],"c":[1],"es":"NGO-kampanje = civil society.","ed":"Husk: sivilsamfunnet bruker media og press.","kt":"Civil society: NGOs, media and citizens' groups that influence through public debate, campaigns and social pressure.","src":"L13 slide 9 · Bok s. 300 (Box 10.3)"},{"id":"SB505","l":"L13","t":"Government policy","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Technology, policy and markets must all be pulled at the same time; using only one (e.g. R&D subsidies) is unlikely to be enough.","o":[["True","Riktig. Alle tre spakene må brukes samtidig for å komme bort fra fossilt."],["False","Feil. Alle tre spakene må brukes samtidig for å komme bort fra fossilt."]],"c":[0],"es":"Sant. Teknologi, politikk og marked må dras samtidig.","ed":"Husk: tre spaker.","kt":"Policy mix: combining technology support (R&D), policy (prices, regulation) and market development to drive a transition.","src":"L13 slide 11-12"},{"id":"SB506","l":"L13","t":"Role of players","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A pension fund judges its managers quarterly, invests through several layers of external managers, and must mark illiquid assets to market. Which threat does it face?","o":[["Low trust in government","Feil: det er for husholdninger."],["A long investment chain","Riktig: lang kjede."],["Short election cycles","Feil: det gjelder myndigheter."],["Single-issue campaigns","Feil: det er for sivilsamfunnet."]],"c":[1],"es":"Lang investeringskjede er trusselen.","ed":"Husk: L8 investment chain.","kt":"Investor mechanisms (Table 3.1): investment strategy, lending strategy and engagement; threats include short-termism, long investment chains, marking to market and supervisory treatment of illiquid investments.","src":"L13 slide 9 · L8 slide 72 · Bok s. 202 (Figure 7.6)"},{"id":"SB507","l":"L13","t":"Transition management","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: A bank that tests impact lending on 5% of its loans, monitors the results and scales up if it works is running a transition experiment.","o":[["True","Riktig. Å teste i liten skala, overvåke og skalere opp er et transition experiment."],["False","Feil. Å teste i liten skala, overvåke og skalere opp er et transition experiment."]],"c":[0],"es":"Sant. Test, overvåk, skaler opp = transition experiment.","ed":"Husk: lær og skaler.","kt":"Transition experiments: small-scale trials of alternative practices that, if successful, are scaled up and institutionalised.","src":"L13 slide 14-16 · Bok s. 357 (12.1.1.3) · Bok s. 359 (12.2)"},{"id":"SB508","l":"L13","t":"Role of players","f":"m","d":2,"p":"M","sc":"none","s":"Why does the course stress global coalitions like the IPCC, COP and the Paris Agreement, not just national policy?","o":[["Countries cannot affect emissions","Feil: land kan påvirke."],["They replace private coalitions","Feil: de utfyller hverandre."],["The IPCC sets carbon taxes","Feil: IPCC vurderer vitenskap."],["Climate is a global commons","Riktig: global commons."]],"c":[3],"es":"Klima er et globalt fellesgode.","ed":"Husk: global commons krever global koordinering.","kt":"IPCC: the UN body assessing climate science; it informs policy but does not set binding rules.","src":"L13 slide 8 · L13 slide 10"},{"id":"SB509","l":"L13","t":"Transition synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A pension fund wants to move from SF 1.0 toward SF 2.0-3.0. Which steps follow transition management?","o":[["Vision, backcast, experiment","Riktig: visjon, backcast, eksperiment."],["Wait for regulators","Feil: private skal lede."],["Add more exclusions each year","Feil: det er inkrementelt."],["Sell everything and buy impact funds","Feil: overganger er gradvise."]],"c":[0],"es":"Visjon, backcast, eksperiment.","ed":"Husk: Loorbach-stegene.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (12.1.1) · Bok s. 359 (12.2) · Bok s. 361 (12.3)"},{"id":"SB510","l":"L13","t":"Integrated thinking","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: When portfolio managers themselves lead engagement on material ESG issues, instead of a separate ESG team, engagement becomes a line function, as the textbook recommends.","o":[["True","Riktig. Læreboka anbefaler at forvalterne selv engasjerer, ikke et eget ESG-team."],["False","Feil. Læreboka anbefaler at forvalterne selv engasjerer, ikke et eget ESG-team."]],"c":[0],"es":"Sant. Når forvalterne selv engasjerer, blir det en del av jobben.","ed":"Husk: integrerte team.","kt":"Line function vs staff function: line functions make the core decisions (investing, lending); staff functions advise or support from the side.","src":"Bok s. 361 (12.3) · Bok s. 362 (12.3) · Folketrygdfondet s. 24"},{"id":"L13S01","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A Norwegian bank joins a net-zero banking alliance mainly because its competitors have already joined. Which motive is this?","o":[["Collective advocacy","Feil: advocacy er felles lobbying."],["Peer effect","Riktig: peer effect."],["Collective engagement","Feil: engagement er dialog med firmaer."],["Risk avoidance","Feil: risk avoidance gjelder stranded assets."]],"c":[1],"es":"Banken blir med fordi konkurrentene er med = peer effect.","ed":"Husk: peer = gjør som de andre.","kt":"Peer effect: joining because competitors have joined, to avoid a competitive disadvantage.","src":"L13 slide 4"},{"id":"L13S02","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"An asset manager joins an investor coalition mainly to lobby governments together for a higher carbon price. Which motive is this?","o":[["Reputation","Feil: reputation er å bli sett som leder."],["Outside pressure","Feil: outside pressure kommer utenfra."],["Peer effect","Feil: peer effect er å følge andre."],["Collective advocacy","Riktig: collective advocacy."]],"c":[3],"es":"Felles lobbying for karbonpris = collective advocacy.","ed":"Husk: advocacy = påvirke politikk.","kt":"","src":"L13 slide 4"},{"id":"L13S03","l":"L13","t":"Coordinated engagement","f":"m","d":2,"p":"H","sc":"none","s":"Which engagement strategy do Dimson, Karakaş and Li (2020) find effective?","o":[["Delegating all dialogue to proxy advisors","Feil: ikke strategien som studeres."],["Each investor engaging alone and confidentially","Feil: samarbeid virker bedre."],["A lead investor backed by supporting investors","Riktig: lead + støtte."],["Divesting first and engaging afterwards","Feil: da mister man stemmen."]],"c":[2],"es":"En lead investor med støttende investorer.","ed":"Husk: two-tier strategy.","kt":"Coordinated engagement: several investors engaging a company together through a coalition.","src":"L13 slide 5"},{"id":"L13S04","l":"L13","t":"Coordinated engagement","f":"m","d":3,"p":"H","sc":"none","s":"When is an investor more likely to lead a joint engagement (Dimson, Karakaş and Li, 2020)?","o":[["When it plans to sell soon","Feil: lite grunn til å lede."],["When it has never met the firm","Feil: koblet til eierandel og marked."],["Small stake, foreign target","Feil: det er motsatt."],["Larger stake, domestic target","Riktig: stor andel, hjemmemarked."]],"c":[3],"es":"Større eierandel og hjemmemarked gjør at investoren leder.","ed":"Husk: stor + lokal = leder.","kt":"","src":"L13 slide 5"},{"id":"L13S05","l":"L13","t":"Coordinated engagement","f":"t","d":3,"p":"H","sc":"none","s":"Do joint engagements succeed more often when the lead investors are domestic and the supporting investors are international?","o":[["Yes","Riktig. Lokale ledere har kunnskap og tilgang, og internasjonale støttespillere gir tyngde."],["No","Feil. Lokale ledere har kunnskap og tilgang, og internasjonale støttespillere gir tyngde."]],"c":[0],"es":"Ja. Lokale ledere og internasjonale støttespillere gir best resultat.","ed":"Husk: lokal kunnskap + internasjonal tyngde.","kt":"","src":"L13 slide 5"},{"id":"L13S06","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"Which policy priority says that a lack of information, skilled staff or incentives can block decarbonisation?","o":[["Mind the investment gap","Feil: det gjelder statlig finansiering."],["Plan for a just transition","Feil: det gjelder berørte lokalsamfunn."],["Overcome non-market barriers","Riktig: non-market barriers."],["Level the playing field","Feil: det gjelder karbonpris."]],"c":[2],"es":"Manglende info, folk eller incentiver = non-market barriers.","ed":"Husk: ikke prisproblemer.","kt":"","src":"L13 slide 11"},{"id":"L13S07","l":"L13","t":"Why government policies matter","f":"m","d":3,"p":"H","sc":"none","s":"The \"Stay up to date\" point warns that:","o":[["Old government rules can block decarbonisation","Riktig: gamle regler."],["Carbon prices should be frozen at current levels","Feil: karbonprisen bør øke."],["ESG ratings must be updated every year","Feil: det gjelder politikk."],["Firms must report their emissions every quarter","Feil: ikke poenget."]],"c":[0],"es":"Gamle regler kan blokkere avkarbonisering.","ed":"Husk: oppdater politikken.","kt":"","src":"L13 slide 11"},{"id":"L13S08","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"\"Mind the investment gap\" calls for:","o":[["Cutting public research so markets decide","Feil: man trenger mer offentlig R&D."],["Raising interest rates to slow investment","Feil: målet er å lukke gapet."],["Public funding for new zero-carbon tech","Riktig: offentlig finansiering."],["Banning private investment in energy","Feil: private trengs også."]],"c":[2],"es":"Offentlig finansiering av ny nullutslippsteknologi.","ed":"Husk: privat kapital er ikke nok.","kt":"","src":"L13 slide 11"},{"id":"L13S09","l":"L13","t":"What each of us can do","f":"m","d":3,"p":"H","sc":"none","s":"Employers should \"help early-stage innovators get across the valley of death\". The valley of death is:","o":[["Climate damage concentrated in poor countries","Feil: det er physical risk."],["The funding gap from lab to market","Riktig: gapet fra lab til marked."],["The fall in share prices after an IPO","Feil: ikke betydningen her."],["Job losses in regions that depend on coal","Feil: det er just transition."]],"c":[1],"es":"Valley of death = finansieringsgapet fra lab til marked.","ed":"Husk: prototype → lønnsom.","kt":"Valley of death: the stage where a new technology has been shown to work but cannot yet attract enough funding to scale.","src":"L13 slide 18"},{"id":"L13S10","l":"L13","t":"Role of players","f":"m","d":2,"p":"H","sc":"none","s":"Which task does the lecture give to governments?","o":[["Writing firms' sustainability reports","Feil: firmaene rapporterer selv."],["Producing commercial ESG ratings","Feil: private lager ratinger."],["Choosing which stocks pension funds buy","Feil: investorene velger selv."],["Setting taxation and carbon pricing","Riktig: skatt og karbonpris."]],"c":[3],"es":"Myndighetene skal sette skatter og karbonpris.","ed":"Husk: lover, skatt, karbonpris, overvåking.","kt":"","src":"L13 slide 8"},{"id":"TR60","l":"L13","t":"Coalitions","f":"m","d":3,"p":"M","sc":"none","s":"What goes wrong if a coalition lets almost anyone become a member?","o":[["Membership then means little","Riktig: medlemskap betyr lite."],["It becomes an SF 3.0 network","Feil: SF-typen endres ikke."],["Almost nobody can join","Feil: det er for smale grenser."],["Members are fined","Feil: få koalisjoner har sanksjoner."]],"c":[0],"es":"Hvis alle kan bli med, betyr medlemskap lite.","ed":"Husk: Ostrom: clear boundaries.","kt":"","src":"Opptak L12 ca. 54 min"},{"id":"TR61","l":"L13","t":"Coalitions","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An asset manager joins a climate coalition mainly so its engagement with big emitters carries more weight. Which motive is this?","o":[["Reputation","Feil: reputation er signalling."],["Risk avoidance","Feil: målet er påvirkning."],["Outside pressure","Feil: ikke press utenfra."],["Collective engagement","Riktig: collective engagement."]],"c":[3],"es":"Mer tyngde i engagement = collective engagement.","ed":"Husk: samarbeid øker suksess.","kt":"","src":"Opptak L12 ca. 51 min"},{"id":"TR62","l":"L13","t":"Transition management","f":"m","d":3,"p":"M","sc":"none","s":"In the transition management interview, what is the biggest challenge for transitions?","o":[["Inventing new technology","Feil: teknologien finnes ofte."],["Changing institutions and culture","Riktig: institusjoner og kultur."],["One global plan","Feil: bygger på små eksperimenter."],["Raising interest rates","Feil: ikke diskutert."]],"c":[1],"es":"Det vanskeligste er å endre institusjoner og kultur.","ed":"Husk: \"Technology is the least of our problems\".","kt":"","src":"Opptak L12 ca. 60 min · Opptak L12 ca. 64 min"}]</script>

function h(tag, attrs, ...kids){

function sameSet(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }
function fmtTime(s){ const m=Math.floor(s/60), ss=s%60; return (m>=60? Math.floor(m/60)+':'+String(m%60).padStart(2,'0') : m)+':'+String(ss).padStart(2,'0'); }
function lecStats(l){ const qs=BANK.filter(q=>q.l===l && inSec(q)); let seen=0,k=0,w=0; for(const q of qs){const r=DB.p[q.id]; if(r){seen++; if(r.last>0)k++; else w++;}} return {n:qs.length,seen,k,w}; }
function lecLabel(id){ return id==='GUEST' ? 'Guest' : id; }
function daysLeft(){ const t=new Date(); t.setHours(0,0,0,0); return Math.max(0, Math.round((EXAM - t)/864e5)); }
function ring(pct, size){
  const r=54, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function bar(k, w, n){ return h('span',{class:'bar'}, h('i',{class:'k',style:`width:${n?k/n*100:0}%`}), h('i',{class:'w',style:`width:${n?w/n*100:0}%`})); }
function tfText(o){ return o[0]; }
function isYN(q){ return q.f==='t' && q.o[0][0]==='Yes'; }
function keyFor(q, pos){ return q.f==='t' ? (isYN(q) ? (pos?'N':'Y') : (pos?'F':'T')) : String.fromCharCode(65+pos); }

function pool(){
  return BANK.filter(q => inSec(q) && S.lecs.includes(q.l) && (S.fmts.includes(q.f)||!S.fmts.some(f=>f==='m'||f==='t')) && (S.sec==='core' || S.prio==='all' || q.p==='H')
    && (S.sec==='core' || !S.trOnly || q.id.startsWith('TR'))
    && (S.mode!=='wrong' || (DB.p[q.id] && DB.p[q.id].last<0))
    && (S.mode!=='flagged' || FLAGS.has(q.id)));
}

// ---------- setup view ----------
function renderSetup(){
  setNav('setup'); stopTimer(); clearSes(); SES = null; app.replaceChildren();
  const SQ = BANK.filter(inSec), all = SQ.map(q=>DB.p[q.id]).filter(Boolean), seen = all.length, lastOk = all.filter(r=>r.last>0).length, lastBad = seen-lastOk;
  const pct = SQ.length ? lastOk/SQ.length : 0;
  app.append(h('div',{class:'stack'},
    h('div',null, h('h1',{text:'Train for the exam'}),
      h('p',{class:'lead', text: S.sec==='core'
        ? `Core ${SQ.length}: the most likely exam topics, written like the lecturer's sample questions, with the exam mix of about 4 multiple choice to 1 yes/no. Includes the three sample questions. Explanations in Norwegian, key terms in English.`
        : `${SQ.length} questions from every lecture, the textbook and the guest lectures. Single-answer multiple choice and true/false, just like the exam, with an explanation and source for every answer.`})),
    block('Question set', h('div',{class:'seg sec', role:'group'}, [['core','Core '+BANK.filter(q=>q.k).length,'Basics first · Norwegian explanations'],['full','Full bank','Exam-style · '+BANK.filter(q=>!q.k).length+' questions']].map(([k,t,d]) =>
      h('button',{id:'sec-'+k,'aria-pressed':String(S.sec===k), on:{click:()=>{S.sec=k; saveSet(); renderSetup();}}},
        h('b',{text:t}), h('span',{class:'d',text:d}))))),
    h('div',{class:'panel dash'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'mastered'})))),
      h('div',{class:'tiles'},
        h('div',{class:'tile exam'}, h('b',{text:String(daysLeft())}), h('span',{text:'days to exam · 16 Dec'})),
        h('div',{class:'tile'}, h('b',{text:`${seen}`}), h('span',{text:`of ${SQ.length} seen`})),
        h('div',{class:'tile'}, h('b',{text:`${lastBad}`}), h('span',{text:'to review'})),
        h('div',{class:'tile'}, h('b',{text:`${FLAGS.size}`}), h('span',{text:'flagged'})))),
    block('Mode', h('div',{class:'seg', role:'group'}, MODES.map(([k,t,d]) =>
      h('button',{id:'mode-'+k,'aria-pressed':String(S.mode===k), on:{click:()=>{S.mode=k; saveSet(); renderSetup();}}},
        h('span',{class:'ic', html:ICON[k]}), h('b',{text:t}), h('span',{class:'d',text:d}))))),
    block('Lectures', [
      h('div',{class:'lecs'}, LECS.map(([id,name]) => { const st=lecStats(id);
        return h('button',{class:'lec', id:'lec-'+id, 'aria-pressed':String(S.lecs.includes(id)), title:`${st.k} correct, ${st.w} wrong last time, of ${st.n}`,
          on:{click:()=>{ S.lecs = S.lecs.includes(id)? S.lecs.filter(x=>x!==id) : [...S.lecs,id]; saveSet(); renderSetup(); }}},
          h('span',{class:'code',text:lecLabel(id)}), h('span',{class:'name',text:name}), h('span',{class:'n',text:`${st.seen}/${st.n}`}),
          bar(st.k, st.w, st.n)); })),
      h('div',{class:'row'},
        h('button',{class:'linkbtn', id:'lec-all', on:{click:()=>{S.lecs=LECS.map(l=>l[0]); saveSet(); renderSetup();}}, text:'Select all'}),
        h('button',{class:'linkbtn', id:'lec-none', on:{click:()=>{S.lecs=[]; saveSet(); renderSetup();}}, text:'Clear all'}))]),
    block('Question type', h('div',{class:'row'}, FMTS.map(([k,t]) => chip('fmt-'+k, t, S.fmts.includes(k), ()=>{ S.fmts = S.fmts.includes(k)? S.fmts.filter(x=>x!==k):[...S.fmts,k]; }))),
      S.sec==='core' ? null : h('div',{class:'row'}, chip('prio-all','All priorities',S.prio==='all',()=>S.prio='all'), chip('prio-h','High priority only',S.prio==='H',()=>S.prio='H'), chip('tr-only','New from lecture recordings',!!S.trOnly,()=>S.trOnly=!S.trOnly))),
    block('Number of questions', h('div',{class:'row'}, [10,20,40,80,0].map(n => chip('count-'+n, n?String(n):'All', S.count===n, ()=>S.count=n)),
      S.mode==='practice' ? chip('smart','Unseen and wrong first', S.smart, ()=>S.smart=!S.smart) : null)),
    startBar()
  ));
}
function block(label, ...kids){ return h('section',{class:'block'}, h('p',{class:'label',text:label}), ...kids); }
function chip(id, text, on, fn){ return h('button',{class:'chip', id, 'aria-pressed':String(on), on:{click:()=>{fn(); saveSet(); renderSetup();}}, text}); }
function startBar(){
  const p = pool(), n = S.count ? Math.min(S.count, p.length) : p.length;
  const msg = p.length ? [h('b',{text:String(n)}), ` questions of ${p.length} available`]
    : [S.mode==='wrong' ? 'No mistakes to review yet.' : S.mode==='flagged' ? 'You have not flagged any questions yet.' : 'No questions match your filters.'];
  return h('div',{class:'startbar'}, h('span',{class:'info'}, msg),
    h('button',{class:'primary', id:'start', disabled:!p.length, on:{click:()=>startSession(p, n)}, text: S.mode==='exam' ? 'Start exam' : 'Start'}));
}

// ---------- session ----------
let SES = null, timer = null;
const SESKEY = 'fie459-session-v1';
function persistSes(){ try{ if(SES) localStorage.setItem(SESKEY, JSON.stringify(SES)); }catch(e){} }
function clearSes(){ try{ localStorage.removeItem(SESKEY); }catch(e){} }
function fixSes(s){ // a saved session can predate a bank update (e.g. a yes/no question that became multiple choice)
  if(!s || !s.items) return s;
  s.items = s.items.filter(x=>BYID[x.id]);
  for(const x of s.items){ const q=BYID[x.id];
    if(!x.order || x.order.length!==q.o.length || x.order.some(i=>i>=q.o.length)){
      x.order = (q.f==='t' || q.x) ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i)); x.chosen=[]; x.done=false; x.ok=false; } }
  if(!s.items.length) return null; if(s.i>=s.items.length) s.i=s.items.length-1; return s; }
function loadSes(){ try{ const s = JSON.parse(localStorage.getItem(SESKEY)); if(s && s.items && s.items.length && s.items.some(x=>BYID[x.id])) return s; }catch(e){} return null; }
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
function startSession(p, n){
  let list = shuffle(p);
  if(S.mode==='practice' && S.smart){ const w = q => { const r=DB.p[q.id]; return !r?1 : r.last<0?0 : 2; }; list.sort((a,b)=>w(a)-w(b)); }
  list = list.slice(0, n);
  SES = { exam:S.mode==='exam', i:0, t0:Date.now(), confirm:false,
    items: list.map(q => ({ id:q.id, order: (q.f==='t' || q.x) ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i)), chosen:[], done:false, ok:false })) };
  stopTimer(); timer = setInterval(tick, 1000);
  renderQuestion(); window.scrollTo(0,0);
}
function tick(){ const el=document.getElementById('clock'); if(el && SES) el.textContent = fmtTime(Math.floor((Date.now()-SES.t0)/1000)); }

function renderQuestion(){
  persistSes();
  setNav(''); app.replaceChildren();
  const it = SES.items[SES.i], q = BYID[it.id], ms = q.f==='s', N = SES.items.length;
  const answered = SES.items.filter(x=> SES.exam ? x.chosen.length : x.done).length;
  const correct = SES.items.filter(x=>x.done&&x.ok).length;
  const need = ms ? q.c.length : 1;

  const top = h('div',{class:'qtop'},
    h('span',{class:'pos',text:`${SES.i+1} / ${N}`}),
    h('span',{class:'track'}, h('i',{style:`width:${answered/N*100}%`})),
    h('span',{class:'stat'}, SES.exam ? '' : `${correct} correct · `, h('span',{id:'clock',text:fmtTime(Math.floor((Date.now()-SES.t0)/1000))})));

  const meta = h('div',{class:'meta'},
    h('span',{class:'lecid',text:q.l==='GUEST'?'Guest lecture':q.l+' · '+LECNAME[q.l]}),
    h('span',{text:q.t}), SCN[q.sc] ? h('span',{class:'tag',text:SCN[q.sc]}) : null, h('span',{class:'qid',text:q.id}));

  const opts = h('div',{class:'opts', role: ms?'group':'radiogroup'});
  it.order.forEach((oi, pos) => {
    const o = q.o[oi], sel = it.chosen.includes(oi);
    let cls = 'opt';
    const reveal = it.done && !SES.exam;
    if(reveal){ if(q.c.includes(oi)) cls+=' right'; else if(sel) cls+=' wrong'; }
    const showWhy = reveal && (sel || q.c.includes(oi));
    opts.append(h('button',{class:cls, id:`opt-${pos}`, 'aria-pressed':String(sel), disabled:reveal,
        on:{click:()=>choose(oi)}},
      h('span',{class:'key',text: keyFor(q,pos)}),
      h('span',null, q.f==='t' ? tfText(o) : o[0], showWhy ? h('span',{class:'why',text:o[1]}) : null)));
  });

  const card = h('div',{class:'card'}, meta, h('p',{class:'stem',text:q.s}), opts);
  if(it.done && !SES.exam) card.append(feedback(q, it));

  const acts = h('div',{class:'actions'});
  const left = h('div',{class:'left'},
    h('button',{class:'ghost flag', id:'flag', 'aria-pressed':String(FLAGS.has(q.id)), on:{click:()=>{ FLAGS.has(q.id)?FLAGS.delete(q.id):FLAGS.add(q.id); save(); renderQuestion(); }}, text: FLAGS.has(q.id)?'Flagged':'Flag'}),
    h('button',{class:'ghost', id:'quit', on:{click:()=> SES.exam ? finish() : (SES.items.some(x=>x.done) ? finish() : renderSetup())}, text:'Quit'}));
  let main;
  if(SES.exam){
    main = h('div',{class:'left'},
      SES.i>0 ? h('button',{class:'ghost', id:'prev', on:{click:()=>{SES.i--; renderQuestion();}}, text:'Back'}) : null,
      SES.i<N-1 ? h('button',{class:'primary', id:'next', on:{click:()=>{SES.i++; renderQuestion();}}, text:'Next'})
               : h('button',{class:'primary', id:'submit', on:{click:askSubmit}, text:'Submit'}));
  } else if(!it.done){
    main = h('button',{class:'primary', id:'answer', disabled: it.chosen.length!==need, on:{click:answer}, text:'Check answer'});
  } else {
    main = h('button',{class:'primary', id:'next', on:{click:next}, text: SES.i<N-1 ? 'Next' : 'See results'});
  }
  acts.append(left, main);

  app.append(top, card, acts);
  if(SES.exam){
    if(SES.confirm){ const un = SES.items.filter(x=>!x.chosen.length).length;
      app.append(h('div',{class:'confirm'}, h('span',{text: un ? `${un} questions unanswered. Submit anyway?` : 'Submit the exam?'}),
        h('div',{class:'left'}, h('button',{class:'ghost',id:'cancel-submit',on:{click:()=>{SES.confirm=false; renderQuestion();}},text:'Keep going'}), h('button',{class:'primary',id:'confirm-submit',on:{click:finish},text:'Submit'})))); }
    app.append(h('div',{class:'grid', 'aria-label':'Jump to question'}, SES.items.map((x,k)=> h('button',{
      class:[x.chosen.length?'ans':'', FLAGS.has(x.id)?'fl':'', k===SES.i?'cur':''].join(' '), id:'jump-'+k, 'aria-label':`Question ${k+1}`,
      on:{click:()=>{SES.i=k; renderQuestion();}}, text:String(k+1)}))));
  }
  app.append(h('p',{class:'kbd', text: q.f==='t' ? (isYN(q)?'Keyboard: Y/N or 1–2 to choose, Enter to continue.':'Keyboard: T/F or 1–2 to choose, Enter to continue.') : `Keyboard: 1–${q.o.length} or A–${String.fromCharCode(64+q.o.length)} to choose, Enter to continue.`}));
}
function explain(q){
  return [q.kt ? h('div',{class:'kt'}, h('b',{text:'Key terms: '}), q.kt) : null, h('p',{style:'margin:0;white-space:pre-line',text:q.ed}), h('p',{class:'src',text:'Source: '+q.src})];
}
function feedback(q, it){
  const box = h('div',{style:'display:grid;gap:14px'},
    h('div',{class:'verdict '+(it.ok?'ok':'bad')}, h('span',{class:'vi', html: it.ok?ICON.ok:ICON.bad}), h('b',{text: it.ok ? 'Correct' : 'Not quite'}), h('span',{text:q.es})));
  box.append(h('details',{class:'deep', open: !it.ok}, h('summary',{text:'Full explanation'}), h('div',{class:'body'}, explain(q))));
  return box;
}
function choose(oi){
  const it = SES.items[SES.i], q = BYID[it.id];
  if(it.done && !SES.exam) return;
  if(q.f==='s'){ it.chosen = it.chosen.includes(oi) ? it.chosen.filter(x=>x!==oi) : (it.chosen.length < q.c.length ? [...it.chosen, oi] : it.chosen); }
  else it.chosen = [oi];
  renderQuestion();
}
function grade(it){ const q=BYID[it.id]; it.ok = sameSet(it.chosen, q.c); it.done = true; }
function answer(){ const it=SES.items[SES.i]; grade(it); rec(it.id, it.ok); renderQuestion(); }
function next(){ if(SES.i < SES.items.length-1){ SES.i++; renderQuestion(); window.scrollTo(0,0); } else finish(); }
function askSubmit(){ SES.confirm = true; renderQuestion(); }
function finish(){
  stopTimer();
  clearSes();
  if(SES.exam){ for(const it of SES.items){ grade(it); if(it.chosen.length) rec(it.id, it.ok); else it.skip=true; } }
  else SES.items = SES.items.filter(x=>x.done);
  renderResults();
}

// ---------- results ----------
function renderResults(){
  setNav(''); app.replaceChildren(); window.scrollTo(0,0);
  const done = SES.items.filter(x=>x.done && !x.skip), ok = done.filter(x=>x.ok), N = SES.items.length;
  const pct = done.length ? ok.length/done.length : 0;
  const secs = Math.floor((Date.now()-SES.t0)/1000);
  const byLec = {};
  for(const it of done){ const l=BYID[it.id].l; byLec[l]=byLec[l]||{n:0,k:0}; byLec[l].n++; if(it.ok) byLec[l].k++; }
  const wrong = SES.items.filter(x=>x.done && !x.ok);

  app.append(h('div',{class:'stack'},
    h('div',{class:'panel hero'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'correct'})))),
      h('div',null, h('p',{class:'label',text: SES.exam?'Exam submitted':'Round complete'}),
        h('h1',{text: pct>=.8?'Strong work':pct>=.6?'Good progress':'Keep going'}),
        h('p',{class:'of',text:`${ok.length} of ${done.length} correct${done.length<N?` · ${N-done.length} unanswered`:''} · ${fmtTime(secs)}`}))),
    Object.keys(byLec).length>1 ? block('By lecture', h('div',{class:'panel tablewrap'}, h('table',null,
      h('thead',null,h('tr',null,h('th',{text:'Lecture'}),h('th',{text:'Correct'}),h('th',{text:''}))),
      h('tbody',null, LECS.filter(([id])=>byLec[id]).map(([id,name])=>{ const b=byLec[id]; return h('tr',null,
        h('td',{text:lecLabel(id)+' '+name}), h('td',{class:'num',text:`${b.k}/${b.n}`}),
        h('td',null, bar(b.k, b.n-b.k, b.n))); })))) ) : null,
    block(wrong.length ? `Mistakes (${wrong.length})` : 'Review', wrong.length ? h('div',{class:'review'}, wrong.map(reviewItem)) : h('p',{class:'empty',text: SES.exam && !done.length ? 'No questions were answered.' : 'Everything correct this round.'})),
    h('div',{class:'row'},
      wrong.length ? h('button',{class:'primary', id:'retry-wrong', on:{click:()=>startSession(wrong.map(x=>BYID[x.id]), wrong.length)}, text:'Practise these mistakes'}) : null,
      h('button',{class:'ghost', id:'new-round', on:{click:renderSetup}, text:'New round'}))
  ));
}
function reviewItem(it){
  const q = BYID[it.id];
  return h('details',null,
    h('summary',null, h('span',{class:'m',text:q.id}), h('span',{text:q.s})),
    h('div',{class:'inner'},
      h('div',{class:'opts'}, it.order.map((oi,pos)=>{ const o=q.o[oi], sel=it.chosen.includes(oi), r=q.c.includes(oi);
        return h('div',{class:'opt'+(r?' right':sel?' wrong':'')}, h('span',{class:'key',text:keyFor(q,pos)}),
          h('span',null, q.f==='t'?tfText(o):o[0], (r||sel)?h('span',{class:'why',text:o[1]}):null)); })),
      h('div',{class:'verdict bad plain'}, h('span',{text:q.es})),
      explain(q)));
}

// ---------- progress ----------
let resetAsk = false;
function renderProgress(){
  setNav('progress'); stopTimer(); app.replaceChildren();
  const all = Object.values(DB.p), seen = all.length, lastOk = all.filter(r=>r.last>0).length;
  const pct = lastOk/BANK.length;
  app.append(h('div',{class:'stack'},
    h('div',{class:'panel hero'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'mastered'})))),
      h('div',null, h('h1',{text:'Progress'}),
        h('p',{class:'of',text:`${lastOk} of ${BANK.length} correct last time · ${seen} seen · ${FLAGS.size} flagged`}),
        h('p',{class:'of',style:'margin-top:6px;font-size:12.5px',text:'Saved on this device only. "Mastered" counts questions where your last answer was correct.'}))),
    block('By lecture', h('div',{class:'panel tablewrap'}, h('table',null,
      h('thead',null,h('tr',null,h('th',{text:'Lecture'}),h('th',{text:'Seen'}),h('th',{text:'Right'}),h('th',{text:'Wrong'}),h('th',{text:''}))),
      h('tbody',null, LECS.map(([id,name])=>{ const s=lecStats(id); return h('tr',null,
        h('td',{text:lecLabel(id)+' '+name}), h('td',{class:'num',text:`${s.seen}/${s.n}`}), h('td',{class:'num',text:String(s.k)}), h('td',{class:'num',text:String(s.w)}),
        h('td',null, bar(s.k, s.w, s.n))); }))))),
    block('Reset', resetAsk
      ? h('div',{class:'confirm'}, h('span',{text:'Delete all progress and flags?'}), h('div',{class:'left'},
          h('button',{class:'ghost',id:'reset-cancel',on:{click:()=>{resetAsk=false; renderProgress();}},text:'Cancel'}),
          h('button',{class:'primary',id:'reset-yes',on:{click:()=>{DB.p={}; FLAGS=new Set(); save(); resetAsk=false; renderProgress();}},text:'Delete'})))
      : h('div',null, h('button',{class:'ghost',id:'reset',on:{click:()=>{resetAsk=true; renderProgress();}},text:'Reset progress'})))
  ));
}

// ---------- keyboard & nav ----------
document.addEventListener('keydown', e => {
  if(!SES || !document.querySelector('.card') || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = SES.items[SES.i], q = BYID[it.id], k = e.key.toLowerCase();
  let pos = -1;
  if(/^[1-6]$/.test(k)) pos = +k-1;
  else if(q.f==='t' && (k==='t'||k==='f'||k==='y'||k==='n')) pos = (k==='t'||k==='y')?0:1;
  else if(q.f!=='t' && /^[a-f]$/.test(k)) pos = k.charCodeAt(0)-97;
  if(pos>=0 && pos<it.order.length){ e.preventDefault(); choose(it.order[pos]); return; }
  if(e.key==='Enter'){ const b = document.getElementById('answer') || document.getElementById('next'); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
});
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => b.dataset.view==='progress' ? renderProgress() : renderSetup()));
document.getElementById('home').addEventListener('click', () => { if(!document.querySelector('.card')) renderSetup(); });
function boot(data){
  const saved = fixSes((data && data.SES) || loadSes());
  if(saved){ SES = saved; stopTimer(); timer = setInterval(tick, 1000); renderQuestion(); }
  else renderSetup();
}
if(window.claude && window.claude.hot){ try{ window.claude.hot.snapshot(() => ({SES: (document.querySelector('.card') ? SES : null)})); }catch(e){} }
if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(boot); } else { boot(window.claude && window.claude.hot ? window.claude.hot.data : null); }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
