 lett å snylte på andres innsats. Husk: Montreal = global + sanksjoner.","kt":"Free-rider problem: when each country benefits from others' cuts without cutting itself, global cooperation is hard.","src":"Bok s. 57 (2.4) · L3 slide 20"},{"id":"SB113","l":"L3","t":"Social externalities","f":"m","d":2,"p":"L","sc":"none","s":"How have rich countries mainly internalised social externalities since World War II?","o":[["Voluntary company codes","Incorrect: it was laws, not voluntary codes."],["Carbon taxes","Incorrect: carbon taxes target the environment, not labour."],["Laws on working hours and wages","Correct: labour laws internalised social costs."],["Banning trade with developing countries","Incorrect: there was no such ban."]],"c":[2],"es":"Rike land brukte lover om arbeidstid og lønn.","ed":"Etter andre verdenskrig brukte rike land lovgivning (arbeidstid, minstelønn, sikkerhet) for å internalisere sosiale externalities. Læreboka bruker dette som eksempel på at regulering kan virke. Husk: sosiale externalities ble løst med lover.","kt":"","src":"Bok s. 49 (2.2.2) · Bok s. 50 (2.2.2)","e":1},{"id":"SB114","l":"L3","t":"Externality case: Velsicol","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Velsicol was sued for knowingly polluting water with cancer-causing pesticides. Which statement is correct?","o":[["The social cost shows in its income statement","Incorrect: externalities are not in the firm's accounts."],["Shareholders are not affected","Incorrect: damages and reputation losses hit owners."],["A negative production externality","Correct: production harmed others: a negative production externality."],["A consumption externality, so consumers should pay","Incorrect: the harm comes from production, not consumption."]],"c":[2],"es":"Forurensning fra produksjon = negative production externality.","ed":"Velsicol forurenset vann med giftige stoffer fra produksjonen. Det er en negative production externality: en kostnad for andre som ikke var med i prisen. Søksmålet tvinger firmaet til å betale en del av kostnaden, og det rammer eierne. Husk: søksmål = internalisering.","kt":"","src":"L3 slide 3-5 · L3 slide 16 · L3 slide 31 · Bok s. 81 (3.2.1)"},{"id":"SB115","l":"L3","t":"Air France-KLM case","f":"m","d":5,"p":"M","sc":"extended_course_case","s":"How should you assess the effect of a carbon price on the value of Air France-KLM?","o":[["Use only past earnings","Incorrect: past earnings understate future carbon costs."],["Assume today's carbon price lasts forever","Incorrect: one fixed price ignores uncertainty."],["Use several carbon price scenarios","Correct: several scenarios capture the uncertainty."],["Ignore carbon prices","Incorrect: ignoring the risk is wrong."]],"c":[2],"es":"Bruk flere karbonpris-scenarioer.","ed":"Fremtidig karbonpris er usikker, særlig for luftfart der unntak kan forsvinne. Derfor bør man lage flere scenarioer for karbonprisen og se hvordan verdien endres. Historiske tall og én fast pris fanger ikke usikkerheten. Husk: usikker fremtid = scenarioer.","kt":"","src":"L3 slide 39-42 · Bok s. 61 (Figure 2.7) · Bok s. 55 (2.3.2)"},{"id":"SB116","l":"L3","t":"Limits to internalisation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The UK advertising regulator approved Shell's ads because they showed that low-carbon energy was a big part of Shell's business.","o":[["True","Incorrect. The ASA banned the ads because they left out Shell's polluting fossil fuel business."],["False","Correct. The ASA banned the ads because they left out Shell's polluting fossil fuel business."]],"c":[1],"es":"Usant. Reklamen ble forbudt fordi den skjulte Shells fossile virksomhet.","ed":"Den britiske reklamemyndigheten (ASA) forbød Shells reklame fordi den bare viste lavutslippsprosjekter og utelot den store fossile virksomheten. Det ga et misvisende bilde. Husk: greenwashing = vise det grønne, skjule det skitne.","kt":"","src":"L3 slide 24-25 · PwC s. 30"},{"id":"SB117","l":"L3","t":"Integrated value approach","f":"m","d":1,"p":"M","sc":"none","s":"The four steps of the integrated value method are:","o":[["Beta, WACC, discount, compare with price","Incorrect: this is a normal DCF without S and E."],["Screen, rank, select, rebalance","Incorrect: this is screening."],["Measure, add up to I, adapt, recalculate","Correct: these are the four steps of the integrated value method."],["Find stakeholders, rank, engage, report","Incorrect: this is stakeholder analysis."]],"c":[2],"es":"Mål, summer til I, tilpass, regn ut på nytt.","ed":"Integrated value-metoden: 1) mål F, S og E, 2) summer til I, 3) tilpass virksomheten for å øke I, 4) regn ut på nytt. Målet er å ta beslutninger som øker samlet verdi, ikke bare F. Husk: measure → add up → adapt → recalculate.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad); DCF = Discounted Cash Flow (verdsettelse ved å diskontere fremtidige kontantstrømmer).","kt":"","src":"Bok s. 50 (2.3) · L3 slide 32"},{"id":"TR06","l":"L3","t":"Types of externalities","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A chemical factory leaks toxins into a river while making a product households buy. How does the lecturer classify this?","o":[["No externality","Incorrect: the cost to people downstream is not priced."],["Negative production externality","Correct: the harm comes from production."],["Negative consumption externality","Incorrect: demand is not the source of the pollution."],["Positive production externality","Incorrect: jobs are part of the deal, not an externality."]],"c":[1],"es":"Skaden kommer fra fabrikkens produksjon = negative production externality.","ed":"Foreleseren sier at du klassifiserer etter hvor skaden kommer fra. Giftutslippet kommer fra fabrikkens produksjon, ikke fra at husholdninger bruker produktet. Derfor er det en negative production externality. Husk: finn kilden til skaden.","kt":"","src":"Opptak L3 ca. 7 min · Opptak L3 ca. 19 min"},{"id":"TR07","l":"L3","t":"Types of externalities","f":"m","d":3,"p":"M","sc":"none","s":"Vaccination also protects others. How do you find the social optimum in the diagram?","o":[["No shift is needed","Incorrect: the benefit to others is not priced."],["Shift demand up; the optimum is higher","Correct: shift demand up; the optimum is higher."],["Shift supply up; the optimum is lower","Incorrect: that is the pollution case."],["Shift demand down; the optimum is lower","Incorrect: that is the smoking case."]],"c":[1],"es":"Samfunnet får mer nytte enn kjøperen. Flytt demand opp, optimum blir høyere.","ed":"Vaksinasjon gir en positive consumption externality: andre blir også beskyttet. Den samfunnsøkonomiske nytten er større enn den private, så demand-kurven flyttes opp. Det sosiale optimumet har høyere mengde enn markedet gir. Husk: positiv externality = markedet gir for lite.","kt":"","src":"Opptak L3 ca. 20 min"},{"id":"TR08","l":"L3","t":"Innovation externalities","f":"m","d":3,"p":"H","sc":"none","s":"Why might a firm hold back on developing cleaner technology, even if society would gain?","o":[["Rivals can copy it","Correct: rivals can copy it, so the firm does not get the full gain."],["Regulators forbid innovation","Incorrect: regulators do not forbid innovation."],["Green R&D never pays off for society","Incorrect: society can gain a lot."],["Patents stop rivals from benefiting","Incorrect: spillovers happen because patents do not protect enough."]],"c":[0],"es":"Konkurrenter kan kopiere, så firmaet får ikke hele gevinsten.","ed":"R&D er en positive production externality: andre kan lære av og kopiere oppfinnelsen. Firmaet som betaler for forskningen, får derfor bare en del av gevinsten. Privat avkastning blir lavere enn samfunnets, og det investeres for lite. Husk: spillovers → for lite R&D.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"Business stealing effect: competitors adopting the new technology capture market share from the original innovator.","src":"Opptak L3 ca. 34 min"},{"id":"TR09","l":"L3","t":"Limitations to internalisation","f":"m","d":3,"p":"H","sc":"short","s":"Listed firms often sell their most polluting plants to private firms, which report less. This shows:","o":[["Consumers cannot afford green products","Incorrect: consumer budgets are not relevant."],["A ban removes the pollution","Incorrect: a ban would stop the pollution."],["No cleaner technology exists for these plants","Incorrect: the plants are sold, not closed."],["It looks greener; emissions continue","Correct: only the owner changes; emissions continue."]],"c":[3],"es":"Firmaet ser grønnere ut, men utslippene fortsetter hos ny eier.","ed":"Når et børsnotert firma selger en forurensende fabrikk til et privat firma, ser det børsnoterte firmaet grønnere ut. Men fabrikken fortsetter å forurense, ofte med mindre rapportering. Husk: salg flytter utslipp, det kutter dem ikke.","kt":"","src":"Opptak L3 ca. 44 min · Opptak L3 ca. 47 min"},{"id":"TR10","l":"L3","t":"Internalisation through disclosure","f":"m","d":3,"p":"M","sc":"short","s":"In 2012 the US SEC required firms to check if their minerals came from Congo mines that funded armed groups. What happened?","o":[["Firms avoided risky suppliers","Correct: firms avoided risky suppliers."],["The SEC banned mining in the region","Incorrect: the SEC regulates reporting, not mines."],["Firms paid a tax per tonne","Incorrect: it was a reporting rule, not a tax."],["Nothing changed","Incorrect: there was a clear change."]],"c":[0],"es":"Krav om disclosure gjorde skjult skade synlig, så firmaene byttet leverandør.","ed":"SEC krevde at firmaer rapporterte om mineralene kom fra gruver som finansierte væpnede grupper i Kongo. Rapporteringen gjorde en skjult skade synlig, og firmaene byttet leverandører. Husk: transparency kan endre atferd uten forbud.\n\nForkortelser: SEC = Securities and Exchange Commission (USAs finanstilsyn).","kt":"","src":"Opptak L3 ca. 40 min · Opptak L4 ca. 62 min"},{"id":"TR11","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"H","sc":"none","s":"In a \"hot house world\" scenario (only current policies), which is true?","o":[["Physical risk is low and transition risk is high","Incorrect: that describes the orderly scenario."],["Both physical and transition risk are low","Incorrect: you always get one of the two risks."],["Neither risk applies, because policy stays unchanged","Incorrect: unchanged policy leaves full physical risk."],["Physical risk is high and transition risk is low","Correct: physical risk is high and transition risk is low."]],"c":[3],"es":"Ingen ny politikk = lav transition risk, men mye oppvarming = høy physical risk.","ed":"Hot house world betyr at bare dagens politikk videreføres. Det kommer lite ny klimapolitikk, så transition risk er lav. Men oppvarmingen blir høy, så physical risk er høy. Du slipper aldri begge. Husk: lite politikk → varmt → physical.","kt":"Physical risk: damage from climate change itself; transition risk: costs from policy, technology and market changes on the way to low carbon.","src":"Opptak L3 ca. 59 min · Opptak L3 ca. 61 min"},{"id":"TR12","l":"L3","t":"Measuring internalisation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Stress testing means weighting several climate scenarios by probability and combining them into one expected value.","o":[["True","Incorrect. Weighting scenarios is scenario analysis; stress testing looks only at the worst case."],["False","Correct. Weighting scenarios is scenario analysis; stress testing looks only at the worst case."]],"c":[1],"es":"Usant. Det beskriver scenario analysis. Stress testing ser på verste fall.","ed":"Scenario analysis vekter flere scenarioer etter sannsynlighet og gir en forventet verdi. Stress testing ser bare på det verste tilfellet og spør om firmaet overlever. Husk: stress = verste fall, scenario = vektet snitt.","kt":"","src":"Opptak L3 ca. 56 min · Opptak L3 ca. 59 min"},{"id":"CX028","l":"L4","t":"Shareholder theory","f":"m","d":2,"p":"H","sc":"none","s":"Friedman opposed managers spending company money on social causes because:","o":[["Employees would then get lower wages","Det var ikke argumentet."],["It spends the owners' money without consent","Lederne er ansatt av eierne. Eierne kan selv gi til gode formål."],["It always raises the firm's tax bill","Skatt var ikke argumentet."],["Social causes are illegal for firms","Det er ikke ulovlig."]],"c":[1],"es":"Friedman: maks profitt innenfor reglene, eierne gir selv.","ed":"Friedmans logikk: ledere er ansatt av eierne. Bruker de eiernes penger på egne samfunnsmål, er det nesten som en skatt på eierne.","kt":"","src":"L4 slide 5 · Hart & Zingales s. 2 · Bok s. 20 (1.4)","k":1},{"id":"CX029","l":"L4","t":"Stakeholder theory","f":"m","d":2,"p":"H","sc":"short","s":"A CEO who cancels a layoff to protect the local community, at some cost to profit, is acting in line with:","o":[["Stakeholder theory","Lokalsamfunnet er en stakeholder som skal tas hensyn til."],["Jensen's critique of stakeholder theory","Jensen kritiserer nettopp uklare mål som dette."],["Friedman's shareholder theory","Friedman ville prioritert profitt."],["Ethical egoism","Egoism ser på eget beste."]],"c":[0],"es":"Hensyn til flere enn eierne = stakeholder theory.","ed":"Stakeholder theory: firmaet skal skape verdi for alle som påvirkes. Kritikken (Jensen, Bebchuk) er at lederen da kan forsvare nesten alt.","kt":"","src":"Bok s. 82 (3.2.2) · Bok s. 83 (3.2.3) · L5 slide 27-28","k":1},{"id":"CX030","l":"L4","t":"Criticism of stakeholder theory","f":"m","d":2,"p":"H","sc":"none","s":"Instead of pure stakeholder theory, Jensen proposes:","o":[["Common good value","Det er målet i SF 3.0."],["Enlightened value maximisation","Ett mål (langsiktig verdi), men ta hensyn til stakeholders."],["Shareholder welfare maximisation","Det er Hart og Zingales."],["Growing the pie","Det er Edmans sitt begrep."]],"c":[1],"es":"Jensen = enlightened value maximisation.","ed":"Jensens løsning er enlightened value maximisation: ett mål (langsiktig verdi), men ta hensyn til stakeholders for å nå det.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L4 slide 20 · Bok s. 81 (3.2.2)","k":1},{"id":"CX031","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":2,"p":"H","sc":"none","s":"According to Hart and Zingales, a firm should choose a cleaner but slightly less profitable process:","o":[["When shareholders care more about the harm than the profit","Maksimer shareholder welfare, ikke bare market value."],["Never, because the firm's market value would then fall","Det er Friedmans syn, som HZ nyanserer."],["Always, whatever its shareholders want","Det er eiernes velferd som skal styre."],["Only when the law explicitly requires the cleaner process","HZ sier at eiernes preferanser også teller."]],"c":[0],"es":"HZ: følg det eierne faktisk bryr seg om.","ed":"Mange eiere er prosocial. Når skaden kommer fra selve produksjonen (non-separable), kan de ikke fikse den selv. Da bør firmaet gjøre det hvis eierne vil.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 2-3 · L4 slide 30-31","k":1},{"id":"CX032","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":2,"p":"H","sc":"none","s":"According to Hart and Zingales, Friedman is right when the social activity is:","o":[["required by the law","Lovkrav er ikke poenget."],["supported only by managers","Det er eiernes preferanser som teller."],["linked to the firm's own pollution","Det er non-separable: firmaet må handle."],["separable from the business, like charity","Eierne kan gjøre det selv, så firmaet trenger ikke."]],"c":[3],"es":"Separable = Friedman har rett.","ed":"Separable (f.eks. veldedighet): eierne kan gjøre det selv, så Friedman har rett. Non-separable (forurensning fra fabrikken): bare firmaet kan gjøre noe.","kt":"","src":"Hart & Zingales s. 3-4 · L4 slide 31","k":1},{"id":"CX033","l":"L4","t":"Grow the pie","f":"m","d":2,"p":"H","sc":"none","s":"Growing the pie, in Edmans' sense, means:","o":[["Training staff so productivity and pay rise","Total verdi øker, og flere får mer."],["Paying suppliers less than their production costs","Det flytter verdi fra leverandører til eiere."],["Raising prices without improving the product","Det flytter verdi fra kunder til eiere."],["Cutting wages to pay higher dividends","Det flytter verdi fra ansatte til eiere."]],"c":[0],"es":"Grow = mer verdi totalt. Split = flytte verdi.","ed":"Edmans: purpose og profitt kan gå sammen når firmaet øker kaken, ikke når det bare tar en større bit av den.","kt":"","src":"L4 slide 30-31","k":1},{"id":"CX034","l":"L4","t":"Business Roundtable statement","f":"m","d":2,"p":"H","sc":"none","s":"A main criticism of the 2019 Business Roundtable statement is that:","o":[["It forced firms to give up all profits","Den krevde ingenting slikt."],["It ignored customers and employees","Den nevnte nettopp alle stakeholders."],["It was imposed on firms by US law","Den var frivillig."],["It was non-binding and may be mostly PR","Ingen håndheving, og noen selskaper gjorde det motsatte rett etterpå."]],"c":[3],"es":"Frivillig = mulig PR.","ed":"Erklæringen signaliserte et skifte fra shareholder primacy til alle stakeholders. Kritikk: ingen håndheving, og noen selskaper gjorde det motsatte rett etterpå.","kt":"","src":"L4 slide 6-11 · L4 slide 14-16","k":1},{"id":"CX035","l":"L4","t":"Shareholder vs stakeholder","f":"m","d":2,"p":"H","sc":"none","s":"Engine No. 1 won three board seats at ExxonMobil with about 0.02% of the shares because:","o":[["Large index funds voted with it","BlackRock, Vanguard og State Street støttet forslaget."],["A court appointed its directors","Det var en avstemning."],["It bought a majority of the shares","Den eide bare ca. 0,02 %."],["Exxon's managers invited it in","Ledelsen var imot."]],"c":[0],"es":"Store indeksfond stemte med = voice virker.","ed":"Saken viser voice i praksis: eiere brukte stemmeretten til å presse frem en mer langsiktig klimastrategi.","kt":"","src":"L4 slide 31 · Hart & Zingales s. 2","k":1},{"id":"EX04","l":"L4","t":"Exam sample: Friedman","f":"m","d":2,"p":"H","sc":"none","s":"According to Milton Friedman (1970), the social responsibility of business is to:","o":[["Fund social programmes chosen by managers","Det var nettopp dette Friedman var imot: ledere som bruker eiernes penger på egne samfunnsmål."],["Maximize stakeholder welfare","Det er stakeholder theory, det motsatte synet."],["Eliminate all externalities","Friedman mente det er statens oppgave gjennom lover og regler."],["Increase its profits","Friedman: øk profitten innenfor spillets regler. Eierne kan selv gi til gode formål."]],"c":[3],"es":"Friedman = increase its profits (innenfor reglene).","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nFriedman (shareholder theory): ledere er ansatt av eierne og skal tjene penger for dem. Hart og Zingales nyanserer dette: når skaden er non-separable, bør firmaet ta hensyn til hva eierne bryr seg om.","kt":"","src":"L4 slide 5 · Hart & Zingales s. 2 · Bok s. 20 (1.4)","k":1,"x":1},{"id":"SB118","l":"L4","t":"Shareholder theory","f":"m","d":1,"p":"H","sc":"none","s":"Milton Friedman's (1970) view is that:","o":[["Firms should maximise shareholder welfare","Incorrect: shareholder welfare is Hart and Zingales' update of Friedman."],["Firms should set society's rules","Incorrect: Friedman says government sets the rules, not firms."],["Managers should balance all stakeholders equally","Incorrect: balancing all stakeholders is Freeman's stakeholder view."],["Business should increase its profits","Correct: Friedman says the business of business is to increase profits."]],"c":[3],"es":"Friedman: business skal øke profitten (innenfor lovens rammer).","ed":"Friedman (1970) er grunnlaget for shareholder theory: firmaets eneste samfunnsansvar er å øke profitten, innenfor lovens og vanlige etiske regler. Samfunnsproblemer skal staten løse. Hart og Zingales endrer dette til shareholder welfare, og Freeman står for stakeholder-synet. Husk: Friedman = profit.","kt":"","src":"L4 slide 5 · Hart & Zingales s. 2 · Bok s. 20 (1.4)"},{"id":"SB119","l":"L4","t":"Stakeholder theory","f":"t","d":3,"p":"H","sc":"short","s":"True or false: Danone's CEO was ousted in 2021 after investors complained about weak returns. This shows that a stakeholder purpose removes the need for good financial results.","o":[["True","Incorrect. The CEO was removed because returns were weak; purpose does not remove the need for results."],["False","Correct. The CEO was removed because returns were weak; purpose does not remove the need for results."]],"c":[1],"es":"Usant. Danone viser at eierne fortsatt krever god avkastning.","ed":"Danone gjorde seg til et \"entreprise à mission\" med stakeholder purpose, men investorer klaget over svak avkastning, og CEO-en ble kastet i 2021. Caset viser at eierne fortsatt krever konkurransedyktig avkastning. Husk: purpose uten resultater holder ikke.","kt":"Stakeholder theory (Freeman): firms should create value for all stakeholders (customers, employees, suppliers, communities, financiers), not only shareholders.","src":"L4 slide 9 · L4 slide 20"},{"id":"SB120","l":"L4","t":"Business Roundtable statement","f":"m","d":2,"p":"H","sc":"none","s":"The 2019 Business Roundtable statement, signed by about 200 US CEOs, represented:","o":[["A shift to all stakeholders","Correct: the CEOs promised value for all stakeholders."],["A promise to stop paying dividends for now","Incorrect: the statement said nothing about stopping dividends."],["Support for Friedman's view","Incorrect: it was seen as a move away from Friedman."],["A new binding US law","Incorrect: it was voluntary, not law."]],"c":[0],"es":"Business Roundtable 2019 = skifte mot alle stakeholders.","ed":"I 2019 signerte ca. 200 amerikanske CEO-er i Business Roundtable en erklæring om at firmaet skal skape verdi for kunder, ansatte, leverandører, lokalsamfunn og eiere. Den ble sett som et skifte bort fra Friedman, men den er frivillig og endrer ikke loven. Husk: BRT 2019 = stakeholder-erklæring.\n\nForkortelser: BRT = Business Roundtable (forening av store amerikanske CEO-er).","kt":"","src":"L4 slide 6-11 · L4 slide 14-16"},{"id":"SB121","l":"L4","t":"Criticism of stakeholder theory","f":"m","d":2,"p":"H","sc":"none","s":"Jensen's (2002) main criticism of stakeholder theory is that:","o":[["It makes firms too short-term","Incorrect: short-termism is a different criticism."],["It makes boards unnecessary","Incorrect: Jensen says agency costs rise, not that boards become useless."],["It forces managers to ignore shareholders","Incorrect: his point is about measurement, not ignoring owners."],["It lets managers set vague goals","Correct: without one clear goal, managers cannot be held to account."]],"c":[3],"es":"Jensen: stakeholder theory gir ledere vage mål, så de blir vanskelige å holde ansvarlige.","ed":"Jensen (2002) mener stakeholder theory gir ledere mange mål uten noen måte å veie dem mot hverandre. Da kan lederen forklare nesten hvilken som helst beslutning, og blir umulig å holde ansvarlig. Han foreslår enlightened value maximisation: maksimer langsiktig verdi, men ta hensyn til stakeholders. Husk: mange mål = ingen mål.","kt":"","src":"L4 slide 20 · Bok s. 81 (3.2.2)"},{"id":"SB122","l":"L4","t":"Criticism of stakeholder theory","f":"m","d":3,"p":"H","sc":"none","s":"Bebchuk and Tallarita (2020) criticise \"stakeholderists\" because:","o":[["No way to balance conflicting interests","Correct: there is no method to balance interests that conflict."],["They claim interests never conflict","Incorrect: the critique is that they overlook conflicts, not that they deny them."],["They want all profits paid as dividends","Incorrect: dividends are not part of the critique."],["They want regulators to set stakeholder weights","Incorrect: the critique is that managers set the weights themselves."]],"c":[0],"es":"Stakeholderists har ingen metode for å veie interesser som krasjer.","ed":"Bebchuk og Tallarita kritiserer stakeholderism: interessene til ansatte, kunder og eiere krasjer ofte, og teorien gir ingen metode for å avgjøre hvem som vinner. Vektene overlates til ledernes skjønn, og det gir mer makt og mindre ansvar. Husk: hvem vinner når interessene krasjer?","kt":"","src":"L4 slide 20-21"},{"id":"SB123","l":"L4","t":"Criticism of stakeholder theory","f":"t","d":3,"p":"M","sc":"none","s":"True or false: One view is that the Business Roundtable statement was unnecessary, because the business judgment rule already lets directors do what it says.","o":[["True","Correct. The business judgment rule already protects boards that consider stakeholders."],["False","Incorrect. The business judgment rule already protects boards that consider stakeholders."]],"c":[0],"es":"Sant. Business judgment rule lar allerede styret ta hensyn til stakeholders.","ed":"Business judgment rule sier at domstolene ikke overprøver styrets beslutninger så lenge styret har handlet i god tro. Styret kan derfor allerede ta hensyn til stakeholders hvis det argumenterer for at det tjener firmaet langsiktig. Erklæringen endret dermed lite juridisk. Husk: BJR gir allerede rom.\n\nForkortelser: BJR = Business Judgment Rule (domstolen overprøver sjelden styrets vurderinger).","kt":"","src":"L4 slide 23-25 · Bok s. 87 (3.3.2)"},{"id":"SB124","l":"L4","t":"Corporate governance models","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A US private equity firm buys a Norwegian company with 300 employees and wants only owner-appointed board members. What should it expect?","o":[["Foreign owners are banned from the board","Incorrect: foreign owners are allowed on the board."],["Employees can take over the firm","Incorrect: employees get board seats, not control."],["Nothing; Norway is like the US","Incorrect: Norway differs from the US here."],["Employees can demand board seats","Correct: employees can demand board seats."]],"c":[3],"es":"I Norge kan ansatte kreve styreplasser.","ed":"Norge har stakeholder-elementer i selskapsloven: i firmaer med over 30 ansatte kan de ansatte kreve å velge styremedlemmer. En amerikansk eier kan derfor ikke regne med et styre med bare eiervalgte medlemmer. Husk: Norge = ansatte i styret.","kt":"Stakeholder governance model: governance where groups beyond shareholders (e.g. employees) have formal influence, as in Norway and Germany.","src":"L4 slide 19 · Bok s. 362 (12.3.1)"},{"id":"SB125","l":"L4","t":"Shareholder vs stakeholder","f":"m","d":3,"p":"M","sc":"short","s":"In 2022 Patagonia's founder gave the company to a trust and a non-profit that uses the profits to fight climate change. This structure:","o":[["removes the need to make a profit","Incorrect: profits are needed to fund the climate work."],["locks in the purpose","Correct: the trust locks in the purpose."],["makes Patagonia state-owned","Incorrect: the ownership is private."],["maximises value for outside investors","Incorrect: there are no outside profit-seeking owners."]],"c":[1],"es":"Trust-strukturen låser formålet fast. Profitten går til klima.","ed":"Patagonia ble gitt til en trust (som holder stemmene og beskytter formålet) og en non-profit (som får profitten og bruker den mot klimaendringer). Firmaet må fortsatt tjene penger, men formålet er låst og kan ikke endres av nye eiere. Husk: steward-ownership låser purpose.","kt":"Purpose: a company's reason for existing beyond profit; ownership structures (foundations, trusts) can protect it.","src":"L4 slide 31 · Hart & Zingales s. 8"},{"id":"SB126","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":2,"p":"H","sc":"none","s":"The central claim of Hart and Zingales (2017) is that:","o":[["Firms should maximise shareholder welfare","Correct: firms should maximise shareholder welfare."],["Firms should always maximise market value","Incorrect: they criticise the market-value-only view."],["Social issues should be left to the government","Incorrect: they do not trust politics to fix everything."],["All stakeholders should count equally","Incorrect: they keep shareholders as the goal."]],"c":[0],"es":"Hart og Zingales: maksimer shareholder welfare, ikke bare market value.","ed":"Hart og Zingales (2017) sier at firmaer bør maksimere shareholder welfare, ikke bare market value. Eierne bryr seg også om etikk og samfunn, og de kan ikke alltid fikse skade selv. Firmaet bør derfor følge eiernes preferanser. Husk: welfare = penger + eiernes verdier.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 2-3 · L4 slide 30-31"},{"id":"SB127","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":3,"p":"H","sc":"none","s":"According to Hart and Zingales, Friedman is right when:","o":[["the harm comes from production itself","Incorrect: that is where Friedman fails, because owners cannot fix it themselves."],["the activity is already banned","Incorrect: that is not their condition."],["the activity is separate, like charity","Correct: owners can do separable activities like charity themselves."],["shareholders care about society as well","Incorrect: social preferences matter for non-separable activities."]],"c":[2],"es":"Friedman har rett når aktiviteten kan skilles ut, som veldedighet. Eierne kan gi selv.","ed":"Hart og Zingales skiller mellom separable og non-separable aktiviteter. Veldedighet er separable: firmaet kan betale ut pengene, og eierne kan gi selv. Da har Friedman rett. Forurensning fra produksjonen er non-separable: eierne kan ikke fikse det selv, så firmaet bør ta hensyn til eiernes preferanser. Husk: separable = Friedman ok.","kt":"","src":"Hart & Zingales s. 3-4 · L4 slide 31"},{"id":"SB128","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Hart and Zingales agree with Friedman that externalities should be left entirely to the government.","o":[["True","Incorrect. They do not trust politics to fix all externalities, so firms should act on owners' preferences."],["False","Correct. They do not trust politics to fix all externalities, so firms should act on owners' preferences."]],"c":[1],"es":"Usant. De stoler ikke på at staten løser alt.","ed":"Hart og Zingales mener staten ikke alltid løser externalities godt. Politikken kan være treg, påvirket av lobbying eller mangle virkemidler. Derfor bør firmaer selv ta hensyn til eiernes sosiale preferanser. Husk: ikke bare overlat det til staten.","kt":"","src":"Hart & Zingales s. 4 · Bok s. 44 (2.1.1)"},{"id":"SB129","l":"L4","t":"Shareholder welfare","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A firm can choose a clean method that is slightly less profitable. Under Hart and Zingales, when should it choose it?","o":[["Never; only market value matters","Incorrect: market value only is the view they criticise."],["Always, whatever shareholders want","Incorrect: it depends on what the owners want."],["When owners care more about the harm","Correct: choose clean when owners care enough about the harm."],["Only if the law says it must","Incorrect: firms should follow owners even without a law."]],"c":[2],"es":"Velg det rene når eierne bryr seg nok om skaden.","ed":"Ifølge Hart og Zingales skal firmaet velge det rene alternativet hvis eierne verdsetter den reduserte skaden mer enn tapet i profitt. Svaret avhenger altså av eiernes preferanser, ikke av lov eller ren markedsverdi. Husk: følg eiernes preferanser.","kt":"Shareholder welfare maximisation: firms maximise what shareholders care about, including non-financial (social) preferences, not only market value.","src":"L4 slide 31 · Hart & Zingales s. 8"},{"id":"SB130","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":4,"p":"M","sc":"none","s":"What causes the \"amoral drift\" in Hart and Zingales?","o":[["Owners sell to a bidder who pollutes","Correct: owners sell to a bidder who will pollute."],["Regulators relax laws after lobbying","Incorrect: lobbying is a different mechanism."],["Managers slowly lose their moral values","Incorrect: it is a takeover problem, not personal morals."],["Shareholders sell to green investors","Incorrect: the drift is toward dirty, not clean."]],"c":[0],"es":"Hver eier tjener på å selge til en bud-giver som forurenser. Firmaet glir mot \"skittent\".","ed":"Amoral drift: en budgiver vil kjøpe firmaet og gjøre det mer forurensende og lønnsomt. Hver eier tenker at deres eget salg ikke avgjør noe, så de selger, selv om de egentlig ønsker at firmaet skal være rent. Resultatet er at firmaet glir mot skitten drift. Husk: amoral drift = kollektivt handlingsproblem ved takeover.","kt":"","src":"Hart & Zingales s. 10-11 · Hart & Zingales s. 13-14 · Bok s. 86 (Box 3.2)"},{"id":"SB131","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":4,"p":"M","sc":"none","s":"True or false: In Hart and Zingales, a prosocial investor may vote for the clean option in one firm but still hold shares in a dirty firm, because she only cares about decisions she feels responsible for.","o":[["True","Correct. The model says people weigh society only when they feel responsible, like when voting."],["False","Incorrect. The model says people weigh society only when they feel responsible, like when voting."]],"c":[0],"es":"Sant. Hun bryr seg bare om valg hun føler ansvar for, som når hun stemmer.","ed":"Hart og Zingales antar at folk bare tar hensyn til samfunnet når de føler seg ansvarlige for utfallet, som når de stemmer. Derfor kan en investor stemme for det rene alternativet i ett firma, men fortsatt eie aksjer i et skittent firma. Husk: ansvar føles ved stemmegivning.","kt":"","src":"Hart & Zingales s. 4-5 · Hart & Zingales s. 7-8"},{"id":"SB132","l":"L4","t":"Grow the pie","f":"m","d":2,"p":"H","sc":"none","s":"Edmans' \"grow the pie\" view says that:","o":[["Shareholders and stakeholders always conflict","Incorrect: that is pie-splitting, which Edmans rejects."],["Shareholders should vote on every decision","Incorrect: voting on policy is Hart and Zingales."],["Purpose does not matter for firm value","Incorrect: for Edmans, purpose is central."],["Firms can grow total value for all","Correct: firms can grow total value for everyone."]],"c":[3],"es":"Grow the pie: firmaer kan øke den totale verdien for alle.","ed":"Edmans skiller mellom pie-splitting (en vinner, en annen taper) og pie-growing (alle kan få mer). Han mener firmaer med purpose kan skape verdi for samfunnet, og at det over tid også gir verdi til eierne. Husk: grow the pie, ikke split it.","kt":"","src":"L4 slide 30-31"},{"id":"SB133","l":"L4","t":"Purpose of the firm","f":"m","d":4,"p":"H","sc":"none","s":"How does Edmans (\"grow the pie\") differ from Hart and Zingales?","o":[["Both ignore shareholders' preferences","Incorrect: Hart and Zingales care about owners' preferences."],["Both are the same as Friedman","Incorrect: both move away from Friedman."],["Edmans focuses on growing total value","Correct: Edmans focuses on growing total value."],["Hart and Zingales want market value only","Incorrect: Hart and Zingales want welfare, not only market value."]],"c":[2],"es":"Edmans fokuserer på å øke total verdi. Hart og Zingales fokuserer på eiernes preferanser.","ed":"Edmans og Hart & Zingales går begge bort fra Friedman, men på ulik måte. Edmans fokuserer på å skape mer total verdi gjennom purpose (grow the pie). Hart og Zingales fokuserer på at firmaet skal følge eiernes sosiale preferanser (shareholder welfare). Husk: Edmans = kaken, H&Z = eiernes preferanser.\n\nForkortelser: H&Z = Hart og Zingales.","kt":"","src":"L4 slide 30-32 · Hart & Zingales s. 1"},{"id":"SB134","l":"L4","t":"Shareholder vs stakeholder","f":"m","d":4,"p":"H","sc":"short","s":"Hedge fund Engine No. 1, owning about 0.02% of ExxonMobil, won three board seats with support from BlackRock, Vanguard and State Street. What does this show?","o":[["Owners used votes to push climate strategy","Correct: owners used their votes to push climate strategy."],["Only majority owners can change the board","Incorrect: a tiny owner won."],["Passive investors never vote against managers","Incorrect: the big index funds voted against management."],["Climate does not affect firm value","Incorrect: the campaign was about long-term value."]],"c":[0],"es":"Små eiere vant med støtte fra store fond. Eiere brukte stemmer for klimastrategi.","ed":"Engine No. 1 eide bare 0,02 % av ExxonMobil, men vant tre styreplasser fordi BlackRock, Vanguard og State Street stemte med dem. Kampanjen handlet om at klimastrategien var viktig for langsiktig verdi. Det viser at eiere kan bruke stemmer (voice) for å påvirke. Husk: voice kan virke, også for små eiere.","kt":"Shareholder welfare (Hart and Zingales): firms should maximise shareholders' welfare, which can include their social preferences, not just market value.","src":"L4 slide 31 · Hart & Zingales s. 2"},{"id":"SB135","l":"L4","t":"Klarna AI case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Klarna replaced many customer service workers with AI. In 2025 the CEO said \"we went too far\" and started rehiring. What is the lesson?","o":[["Employees do not matter for listed firms","Incorrect: workers and customers affect value."],["Using AI instead of workers is always wrong","Incorrect: the lecture calls it a trade-off, not always wrong."],["Cost cuts hurt customers, which hurt value","Correct: worse service hurt customers, which hurt value."],["Cost cuts never affect customers","Incorrect: the rehiring shows customers were affected."]],"c":[2],"es":"Kostnadskutt skadet kundeservicen, og det skadet verdien.","ed":"Klarna erstattet mange kundeservicemedarbeidere med AI for å spare kostnader. Kvaliteten falt, og CEO-en innrømmet at de gikk for langt. Poenget er at stakeholders som kunder påvirker firmaverdien, så å kutte for hardt kan slå tilbake. Husk: stakeholders påvirker verdien.","kt":"","src":"L4 slide 28-29 · L4 slide 31"},{"id":"SB136","l":"L4","t":"Stakeholders: employees","f":"m","d":3,"p":"M","sc":"none","s":"In an experiment, job applicants bid for the same job at a firm with or without CSR. What was found?","o":[["They wanted higher pay at the CSR firm","Incorrect: they asked for less pay, not more."],["They accepted lower pay at the CSR firm","Correct: they accepted lower pay at the CSR firm."],["They refused to apply to the CSR firm","Incorrect: they applied to both."],["CSR made no difference","Incorrect: the difference was significant."]],"c":[1],"es":"Søkerne godtok lavere lønn hos CSR-firmaet.","ed":"I eksperimentet ga jobbsøkere lavere lønnskrav til firmaet med CSR enn til firmaet uten. Folk verdsetter å jobbe et sted med god samfunnsprofil, og godtar derfor litt lavere lønn. Husk: CSR kan senke lønnskostnadene.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar).","kt":"","src":"L4 slide 34-37 · L6 slide 23"},{"id":"SB137","l":"L4","t":"Stakeholders: supply chains","f":"m","d":2,"p":"M","sc":"extended_course_case","s":"Why did Nestlé stop buying Brazilian soybeans from Cargill?","o":[["Brazil banned soy exports","Incorrect: there was no such ban."],["Cargill's soy became too expensive","Incorrect: the reason was traceability, not price."],["The soy could not be traced","Correct: the soy could not be traced, so it risked deforestation."],["Nestlé stopped using soy for health reasons","Incorrect: it was about deforestation, not health."]],"c":[2],"es":"Soyaen kunne ikke spores, så det var risiko for avskoging.","ed":"Nestlé vil fjerne avskoging fra leverandørkjeden. Soyaen fra Cargill kunne ikke spores tilbake til gårder uten avskoging, så Nestlé sluttet å kjøpe den. Dette viser supply chain-risiko: firmaet bærer risikoen for det leverandørene gjør. Husk: sporbarhet er et krav.","kt":"","src":"L4 slide 38 · L4 slide 44 · L5 slide 3-5"},{"id":"SB138","l":"L4","t":"Stakeholders: supply chains","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Bisetti et al. (2024) find that US firms cut imports from foreign suppliers by about 30% after environmental or social incidents at those suppliers.","o":[["True","Correct. The study shows US firms cut imports by about 30% after E&S incidents at suppliers."],["False","Incorrect. The study shows US firms cut imports by about 30% after E&S incidents at suppliers."]],"c":[0],"es":"Sant. Amerikanske firmaer kuttet import med ca. 30 % etter E&S-hendelser.","ed":"Bisetti et al. finner at amerikanske firmaer kutter import fra utenlandske leverandører med ca. 30 % etter miljø- eller sosiale hendelser hos leverandøren. Kundene straffer dårlige leverandører for å beskytte sitt eget omdømme. Husk: E&S-skandaler gir tapt salg.\n\nForkortelser: E&S = Environmental and Social (miljø og sosialt).","kt":"","src":"L4 slide 40-41"},{"id":"SB139","l":"L4","t":"Stakeholders: supply chains","f":"m","d":3,"p":"M","sc":"none","s":"What happens when suppliers are hit by extreme heat?","o":[["Suppliers and customers both earn less","Correct: both suppliers and customers earn less."],["Heat has no effect","Incorrect: heat does have an effect."],["Customers gain from lower input prices","Incorrect: customers are harmed, not helped."],["Only farms are affected","Incorrect: customers are hit too."]],"c":[0],"es":"Hete rammer leverandøren, og skaden sprer seg til kundene.","ed":"Ekstrem hete hos leverandører reduserer deres produksjon og inntekter. Effekten sprer seg nedover i verdikjeden, slik at også kundene deres tjener mindre. Physical climate risk smitter altså gjennom supply chain. Husk: klimarisiko sprer seg.","kt":"","src":"L4 slide 40 · Fondsfinans s. 38"},{"id":"SB140","l":"L4","t":"Human rights due diligence","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A Norwegian sportswear firm buys from a region with reports of forced labour. Under the Norwegian Transparency Act, what must it do?","o":[["Stop buying from the whole country at once","Incorrect: exit is one option, not automatic."],["Map the risks, act on them and report","Correct: map the risks, act on them and report."],["Only report suppliers' credit ratings","Incorrect: the law is about human rights, not credit risk."],["Nothing, since the suppliers are foreign","Incorrect: foreign suppliers are covered."]],"c":[1],"es":"Åpenhetsloven krever due diligence: kartlegg, handle, rapporter.","ed":"Åpenhetsloven krever aktsomhetsvurderinger (due diligence) for menneskerettigheter i hele leverandørkjeden, også i utlandet. Firmaet må kartlegge risiko, iverksette tiltak og rapportere. Å avslutte leverandører er ett mulig tiltak, ikke det første kravet. Husk: kartlegg → handle → rapporter.","kt":"Human rights due diligence: identify, prevent, mitigate and account for adverse human rights impacts in own operations and value chains (UN Guiding Principles).","src":"L4 slide 44"},{"id":"SB141","l":"L4","t":"Corporate objectives","f":"m","d":3,"p":"M","sc":"short","s":"European executives see ESG as part of the firm's goal more often than US executives. Why?","o":[["US firms face no ESG risks","Incorrect: US firms face the same risks."],["Europe's stakeholder model","Correct: Europe's stakeholder model shapes how executives think."],["European firms may not maximise profits","Incorrect: there is no such ban."],["Views have no link to governance","Incorrect: governance and culture matter a lot."]],"c":[1],"es":"Europa har en stakeholder-modell, så ledere ser ESG som en del av målet.","ed":"Europeiske land har institusjoner som støtter stakeholder-modellen, for eksempel ansatte i styret (co-determination) og stakeholder-koder. Det former hvordan ledere tenker, så de ser oftere ESG som en del av firmaets mål. USA har en mer shareholder-orientert modell. Husk: institusjoner former holdninger.","kt":"Shareholder model vs stakeholder model: corporate governance focused on owners' value vs balancing the interests of several stakeholder groups.","src":"L4 slide 26-27 · Starks s. 1840 · Bok s. 362 (12.3.1)"},{"id":"SB142","l":"L4","t":"Refined shareholder value","f":"m","d":3,"p":"H","sc":"none","s":"What do Mehrotra and Morck (2017) say about Jensen's \"enlightened value maximisation\"?","o":[["It is flawed, but maybe the least bad option","Correct: flawed, but maybe the least bad option."],["It is the same as SF 3.0","Incorrect: refined shareholder value is SF 1.0."],["It should be replaced by stakeholder welfare","Incorrect: they see multiple goals as hard to measure."],["It solves all conflicts perfectly","Incorrect: it does not solve all conflicts."]],"c":[0],"es":"Den har feil, men er kanskje det minst dårlige alternativet.","ed":"Mehrotra og Morck kritiserer Jensens enlightened value maximisation fordi den ikke løser alle konflikter. Likevel mener de den er det minst dårlige alternativet, siden flere mål samtidig er vanskelig å måle og gir agency problems. Husk: \"least bad\".\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Bok s. 81 (3.2.2) · Bok s. 82 (3.2.2) · L5 slide 27"},{"id":"SB143","l":"L4","t":"Shareholder model challenges","f":"m","d":3,"p":"H","sc":"none","s":"Which is one of the challenges to the shareholder model in the textbook?","o":[["Shareholders pay for all damage","Incorrect: shareholders have limited liability."],["Business ethics problems","Correct: business ethics problems are one of the challenges."],["It leads to too much long-term investment","Incorrect: the worry is too little long-term investment."],["Shareholders are paid first","Incorrect: shareholders are paid last."]],"c":[1],"es":"Business ethics problems er en av utfordringene til shareholder-modellen.","ed":"Læreboka lister utfordringer for shareholder-modellen: externalities, short-termism og business ethics problems. Etikk beskrives som \"siste forsvarslinje\" når lover og kontrakter ikke dekker alt. Husk: shareholder-modellen trenger etikk.","kt":"","src":"Bok s. 80 (3.2.1) · Bok s. 81 (3.2.1) · L5 slide 24"},{"id":"SB144","l":"L4","t":"Stakeholder model","f":"m","d":4,"p":"L","sc":"none","s":"According to Magill, Quinzii and Rochet (2015), what goes wrong when large firms maximise shareholder value?","o":[["They spend too much on safety","Incorrect: the model predicts too little safety spending."],["Competition removes all externalities","Incorrect: externalities remain."],["They take too little risk","Incorrect: the problem is not owners' risk."],["Risks to workers are ignored","Correct: risks to workers and customers are ignored."]],"c":[3],"es":"Eierne tar ikke hensyn til risiko for arbeidere og kunder.","ed":"Magill, Quinzii og Rochet viser at når store firmaer bare maksimerer shareholder value, tar de ikke hensyn til risiko de påfører arbeidere og kunder. Disse er externalities for eierne, så firmaet investerer for lite i å redusere dem. Husk: shareholder value overser stakeholders' risiko.","kt":"","src":"Bok s. 82 (3.2.3)","e":1},{"id":"SB145","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":5,"p":"M","sc":"constructed_scenario","s":"An index fund always votes for the most profitable option, though many of its clients want firms to avoid harmful activities. What would Hart and Zingales recommend?","o":[["Ask its investors and vote as they prefer","Correct: ask its investors and vote as they prefer."],["Keep voting for the most profitable option","Incorrect: H&Z call this a mistake that causes amoral drift."],["Sell all harmful firms","Incorrect: voting, not selling, is their channel."],["Let managers decide all votes","Incorrect: then owners' preferences disappear."]],"c":[0],"es":"Spør investorene og stem slik de ønsker.","ed":"Hart og Zingales foreslår at fond og forvaltere skal spørre investorene sine hva de ønsker, og stemme deretter. Å alltid stemme for det mest lønnsomme ignorerer kundenes preferanser og kan gi amoral drift. Husk: la eiernes preferanser styre stemmene.\n\nForkortelser: H&Z = Hart og Zingales.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 11-12 · Bok s. 86 (3.3.1) · L8 slide 71"},{"id":"SB146","l":"L4","t":"Business Roundtable statement","f":"t","d":3,"p":"M","sc":"none","s":"True or false: One criticism of the Business Roundtable statement is that some signers are big lenders to fossil fuel projects.","o":[["True","Correct. Critics pointed out that some signers are big lenders to fossil fuel projects."],["False","Incorrect. Critics pointed out that some signers are big lenders to fossil fuel projects."]],"c":[0],"es":"Sant. Kritikere sier at noen underskrivere låner ut mye til fossile prosjekter.","ed":"En kritikk mot Business Roundtable-erklæringen var at ord og handling ikke stemte. Noen av bankene som signerte, finansierte store fossile prosjekter. Det tyder på at erklæringen delvis var PR. Husk: sjekk handling, ikke bare ord.","kt":"","src":"L4 slide 14-16 · L11 slide 32"},{"id":"SB147","l":"L4","t":"Shareholder theory","f":"m","d":2,"p":"M","sc":"none","s":"Shareholders are called \"residual claimants\" because:","o":[["They have no right to any cash flows","Incorrect: they have a right to what is left."],["They get a fixed return","Incorrect: a fixed return describes debt."],["They are paid last","Correct: they are paid last, from what is left."],["They are paid before creditors","Incorrect: creditors are paid first."]],"c":[2],"es":"Residual claimants får det som er igjen, altså betalt sist.","ed":"Aksjonærer er residual claimants: de får det som er igjen etter at alle med kontrakter (ansatte, leverandører, långivere, skatt) har fått sitt. Derfor bærer de mest risiko, og noen mener derfor de bør styre firmaet. Husk: eierne får restverdien.","kt":"","src":"Bok s. 80 (3.2.1)"},{"id":"SB148","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":3,"p":"H","sc":"none","s":"How does the corporate goal debate match the SF stages?","o":[["Shareholder SF 1.0; stakeholder SF 2.0","Correct: shareholder model ↔ SF 1.0, stakeholder model ↔ SF 2.0."],["All the stages are the same in practice","Incorrect: the stages differ."],["Stakeholder value = SF 1.0","Incorrect: stakeholder value is SF 2.0."],["Shareholder value = SF 3.0","Incorrect: pure shareholder value is finance as usual."]],"c":[0],"es":"Shareholder = SF 1.0, stakeholder = SF 2.0.","ed":"Koblingen mellom styringsmodell og SF-trappen: refined shareholder value (maks F med noen S/E-begrensninger) er SF 1.0. Stakeholder value (F, S og E vektes) er SF 2.0. Ren shareholder value er finance as usual. Husk: shareholder ↔ 1.0, stakeholder ↔ 2.0.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Bok s. 82 (3.2.2) · Bok s. 83 (3.2.3) · L5 slide 27-28"},{"id":"SB149","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":4,"p":"L","sc":"none","s":"True or false: According to Hart and Zingales, a founder who wants her firm to stay \"clean\" after listing should make hostile takeovers easy.","o":[["True","Incorrect. Easy takeovers help a dirty bidder (amoral drift); she should make takeovers harder."],["False","Correct. Easy takeovers help a dirty bidder (amoral drift); she should make takeovers harder."]],"c":[1],"es":"Usant. Enkle takeovers hjelper \"skittent\". For å beskytte \"rent\" må hun gjøre takeovers vanskelige.","ed":"Hart og Zingales viser at enkle takeovers gir amoral drift mot skitten drift. En grunnlegger som vil beskytte et \"rent\" firma, bør gjøre takeovers vanskeligere, for eksempel med dual-class shares eller andre forsvar. Husk: lett takeover = drift mot skittent.","kt":"","src":"Hart & Zingales s. 13-14 · L5 slide 19 · Bok s. 85 (3.3.1)"},{"id":"SB150","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Kraft Heinz tried to buy Unilever in 2017. How does the textbook see this failed takeover?","o":[["As SF 3.0 impact investing","Incorrect: Kraft Heinz is the shareholder-model firm."],["As a clash between SF 1.0 and SF 2.0","Correct: it was a clash between SF 1.0 and SF 2.0."],["As proof that hostile takeovers always win","Incorrect: the bid was withdrawn."],["As a merger of two equal firms","Incorrect: the firms were very different."]],"c":[1],"es":"Kraft Heinz (SF 1.0) mot Unilever (SF 2.0).","ed":"Kraft Heinz, styrt etter en hard shareholder-modell med kostnadskutt (SF 1.0), prøvde å kjøpe Unilever, som hadde en stakeholder-modell (SF 2.0). Budet ble trukket. Læreboka bruker saken som eksempel på kollisjon mellom to forretningsmodeller. Husk: Kraft Heinz = 1.0, Unilever = 2.0.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Bok s. 85 (3.3.1) · Bok s. 86 (Box 3.2) · Hart & Zingales s. 11"},{"id":"SB151","l":"L4","t":"Shareholder vs stakeholder model","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook suggests approving a merger only if the combined firm's integrated value (F + S + E) is higher than for the two firms alone.","o":[["True","Correct. The book proposes approving a merger only if integrated value (F + S + E) rises."],["False","Incorrect. The book proposes approving a merger only if integrated value (F + S + E) rises."]],"c":[0],"es":"Sant. Fusjon bare hvis F + S + E blir høyere samlet.","ed":"Læreboka foreslår at fusjoner bare bør godkjennes hvis integrated value (F + S + E) for det sammenslåtte firmaet er høyere enn for de to hver for seg. En uavhengig vurdering bør sjekke dette. Husk: fusjon må øke I, ikke bare F.","kt":"","src":"Bok s. 85 (3.3.1) · Bok s. 86 (3.3.1)"},{"id":"SB152","l":"L4","t":"Purpose of the firm","f":"m","d":5,"p":"M","sc":"none","s":"\"On whose behalf should a company be run?\" Which answer fits the theories in the course?","o":[["For shareholders and their values","Correct: the firm is run for shareholders, including their values."],["It does not matter, since only owners are affected","Incorrect: decisions affect many people."],["The law allows only one party","Incorrect: the business judgment rule allows more."],["Shareholder value always helps everyone","Incorrect: externalities mean this is not automatic."]],"c":[0],"es":"Firmaet drives for eierne, inkludert deres verdier.","ed":"Kursets svar bygger på Hart og Zingales: firmaet drives for eierne, men eiernes welfare inkluderer deres sosiale verdier. Det er altså verken ren profitt eller lik vekt på alle stakeholders. Husk: shareholder welfare.","kt":"","src":"L4 slide 4-5 · L4 slide 20-21 · L4 slide 31 · L4 slide 19"},{"id":"SB153","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":3,"p":"M","sc":"none","s":"Why do firms in civil law countries tend to have higher ESG scores (Liang and Renneboog, 2017)?","o":[["They have more takeovers","Incorrect: takeovers are typical of common law countries."],["Rating agencies favour them","Incorrect: the explanation is the legal system."],["Common law countries ban ESG reports","Incorrect: there is no such ban."],["It is more stakeholder-oriented","Correct: civil law countries are more stakeholder-oriented."]],"c":[3],"es":"Civil law-land er mer stakeholder-orientert, så ESG-score blir høyere.","ed":"Liang og Renneboog finner at firmaer i civil law-land (f.eks. Tyskland, Norden) har høyere ESG-score enn i common law-land (USA, UK). Civil law-systemer har mer regulering og stakeholder-orientering. Husk: civil law = stakeholder, common law = shareholder.","kt":"","src":"Bok s. 84 (3.3) · Bok s. 85 (3.3) · Starks s. 1849-1851"},{"id":"SB154","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":3,"p":"L","sc":"none","s":"Many shareholders own diversified portfolios. What concern does Hart and Zingales' review raise about this?","o":[["They never vote","Incorrect: this is not the concern."],["They always want high wages","Incorrect: that applies to owners who are also employees."],["Firms may act like one monopoly","Correct: firms may act like one monopoly."],["Firms must invest only in clean tech","Incorrect: not the argument."]],"c":[2],"es":"Med felles eiere kan firmaer oppføre seg som ett monopol.","ed":"Når de samme store fondene eier alle firmaene i en bransje (common ownership), har de mindre interesse av at firmaene konkurrerer. Firmaene kan da oppføre seg som ett monopol. Det kan være dårlig for kundene. Husk: felles eiere kan svekke konkurransen.","kt":"","src":"Hart & Zingales s. 5-6","e":1},{"id":"SB155","l":"L4","t":"Purpose","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: In Edmans' view, a firm that raises profits by paying suppliers too little is creating value.","o":[["True","Incorrect. Paying suppliers too little moves value from them to the firm; it does not create new value."],["False","Correct. Paying suppliers too little moves value from them to the firm; it does not create new value."]],"c":[1],"es":"Usant. Å presse leverandører er å dele kaken annerledes, ikke gjøre den større.","ed":"Edmans skiller mellom å øke kaken (skape ny verdi) og å dele den annerledes. Å presse leverandørene gir firmaet mer, men leverandørene tilsvarende mindre. Det er pie-splitting, ikke pie-growing. Husk: split ≠ grow.","kt":"Pie-growing mentality (Edmans): create value for society through excellence, and profits follow as a by-product; pie-splitting takes value from one stakeholder to give it to another.","src":"L4 slide 30-31"},{"id":"TR13","l":"L4","t":"Shareholder vs stakeholder value","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Two manufacturers merge in a country with strong job protection, so closing plants is costly. How does the market react?","o":[["No reaction","Incorrect: labour protection affects the cost."],["Higher returns; faster approval","Incorrect: approval speed is not the mechanism."],["Lower returns; layoffs are harder","Correct: lower returns, because layoffs are harder."],["Higher returns; workers are more productive","Incorrect: the evidence shows lower returns."]],"c":[2],"es":"Sterkt stillingsvern gjør kutt dyre, så markedet reagerer negativt.","ed":"Ved fusjoner kommer mye av gevinsten fra å kutte kostnader, for eksempel ved å legge ned fabrikker. Sterkt stillingsvern beskytter arbeiderne (stakeholders), men gjør kuttene dyrere. Markedet forventer derfor mindre synergier, og avkastningen blir lavere. Husk: stakeholder-beskyttelse har en pris.","kt":"","src":"Opptak L4 ca. 33 min"},{"id":"TR14","l":"L4","t":"Critique of stakeholderism","f":"m","d":4,"p":"H","sc":"none","s":"Managers give some workers better contracts so they help block a takeover. Which criticism of stakeholderism does this show?","o":[["It requires CSRD reporting","Incorrect: reporting rules are not relevant."],["It can shield managers","Correct: it can shield managers."],["It forces a short-term focus","Incorrect: it is about resisting owners."],["It makes takeovers more likely","Incorrect: the workers help block the takeover."]],"c":[1],"es":"Ledere bruker ansatte som allierte for å beskytte egen jobb.","ed":"Ledere kan bruke stakeholderism som skjold: de gir ansatte bedre avtaler slik at de ansatte hjelper til å stoppe en takeover. Da beskytter lederne sin egen jobb, ikke nødvendigvis firmaets verdi. Husk: stakeholderism kan beskytte ledere mot eierne.\n\nForkortelser: CSRD = Corporate Sustainability Reporting Directive (EUs lov om bærekraftsrapportering).","kt":"","src":"Opptak L4 ca. 32 min"},{"id":"TR15","l":"L4","t":"Conflicts among stakeholders","f":"m","d":3,"p":"M","sc":"short","s":"A price cartel is broken up. Consumers gain, but the firms then lay off workers. What does this show?","o":[["Shareholders always pay the full cost","Incorrect: workers paid much of the cost."],["Antitrust does not affect workers","Incorrect: layoffs followed."],["Consumers and workers always gain together","Incorrect: their interests went in different directions."],["Stakeholder interests can conflict","Correct: stakeholder interests can conflict."]],"c":[3],"es":"Kundene vinner, de ansatte taper. Stakeholder-interesser kan krasje.","ed":"Når et priskartell brytes opp, vinner kundene på lavere priser, men firmaene kutter ansatte. Kunder og ansatte er begge stakeholders, men interessene deres går i hver sin retning. Husk: det finnes ikke én felles \"stakeholder-interesse\".","kt":"","src":"Opptak L4 ca. 29 min · Opptak L5 ca. 49 min"},{"id":"TR16","l":"L4","t":"Legal view on corporate purpose","f":"m","d":3,"p":"H","sc":"none","s":"Why might the 2019 Business Roundtable statement not even be necessary?","o":[["The law already requires serving all stakeholders","Incorrect: fiduciary duties are owed to shareholders, not all stakeholders."],["It was legally binding","Incorrect: it was voluntary."],["Shareholders cannot sue directors","Incorrect: owners can sue."],["The business judgment rule already allows it","Correct: the business judgment rule already gives room."]],"c":[3],"es":"Business judgment rule lar allerede styret ta hensyn til andre.","ed":"Styret har plikter overfor eierne (care og loyalty), men domstolene overprøver sjelden styrets vurderinger (business judgment rule). Styret kan derfor allerede ta hensyn til stakeholders hvis det begrunnes med firmaets langsiktige interesse. Husk: BJR gjør erklæringen nesten unødvendig.\n\nForkortelser: BJR = Business Judgment Rule (domstolen overprøver sjelden styrets vurderinger).","kt":"Business judgment rule: courts presume directors made decisions in good faith, with due care and in the company's interest, unless shown otherwise.","src":"Opptak L4 ca. 38 min · Opptak L4 ca. 41 min"},{"id":"TR17","l":"L4","t":"Business Roundtable 2019","f":"m","d":3,"p":"H","sc":"short","s":"A month after Jeff Bezos signed the stakeholder statement, Whole Foods cut health insurance for part-time staff. This supports the criticism that:","o":[["Pledges always lower firm value","Incorrect: the case says nothing about value."],["A non-binding pledge may be mostly PR","Correct: a non-binding pledge may be mostly PR."],["Health insurance is a governance issue","Incorrect: health insurance is a social (S) issue."],["Part-time workers are not stakeholders","Incorrect: employees are stakeholders."]],"c":[1],"es":"Ord og handling stemte ikke. Erklæringen kan være mest PR.","ed":"Kort tid etter at Bezos signerte stakeholder-erklæringen, kuttet Whole Foods helseforsikring for deltidsansatte. Det støtter kritikken om at frivillige løfter uten bindende regler mest er PR. Husk: frivillige løfter er svake.","kt":"","src":"Opptak L4 ca. 20 min · Opptak L4 ca. 23 min"},{"id":"TR18","l":"L4","t":"Stakeholder governance","f":"m","d":2,"p":"M","sc":"none","s":"In Norway, employees in firms with over 30 staff can elect board members. How does the course see this rule?","o":[["A dual-class share structure","Incorrect: dual-class shares give extra votes to some owners."],["A way to give shareholders more control","Incorrect: it gives employees more say."],["A US-only rule","Incorrect: this is a European rule."],["A binding employee voice","Correct: it gives employees a binding voice."]],"c":[3],"es":"Ansatte får en bindende stemme i styret.","ed":"I Norge kan ansatte i firmaer med over 30 ansatte velge styremedlemmer. Det er en lovpålagt stakeholder-stemme, i motsetning til frivillige erklæringer som i USA. Husk: lov gir bindende stakeholder-innflytelse.","kt":"","src":"Opptak L4 ca. 25 min"},{"id":"TR19","l":"L4","t":"CSR and performance","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A very profitable firm uses spare cash for community projects; a struggling rival does not. Which idea fits this?","o":[["Doing good by doing well","Correct: profit comes first, then CSR: doing good by doing well."],["Ethical relativism","Incorrect: relativism is an ethical theory."],["Doing well by doing good","Incorrect: that is the reverse direction."],["Delegated philanthropy","Incorrect: no investors asked for this."]],"c":[0],"es":"Først tjene penger, så gjøre godt = doing good by doing well.","ed":"Rekkefølgen avgjør begrepet. Doing good by doing well: firmaet tjener godt og har derfor råd til CSR (profitt → CSR). Doing well by doing good: CSR gjør firmaet mer lønnsomt (CSR → profitt). Husk: les rekkefølgen i uttrykket.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar).","kt":"","src":"Opptak L4 ca. 14 min"},{"id":"EX01","l":"L5","t":"Exam sample: adaptive markets hypothesis","f":"t","d":2,"p":"H","sc":"none","s":"Can the adaptive markets hypothesis help explain why carbon risk may not yet be fully priced?","o":[["Yes","Riktig. Ifølge AMH avhenger markedseffektivitet av hvor mange og hvilke investorer som analyserer en risiko. Klimarisiko er ny og analyseres av få, så den kan være underpriset."],["No","Feil. Ifølge AMH avhenger markedseffektivitet av hvor mange og hvilke investorer som analyserer en risiko. Klimarisiko er ny og analyseres av få, så den kan være underpriset."]],"c":[0],"es":"Ja: AMH = effektivitet avhenger av hvem som analyserer. Ny risiko kan være underpriset.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- EMH (efficient markets hypothesis): all informasjon er alltid i prisen.\n- AMH (Lo): markedet blir effektivt over tid etter hvert som flere investorer lærer seg å analysere en risiko.\nKarbonrisiko er relativt ny, så den er kanskje ikke fullt priset ennå.\n\nForkortelser: AMH = Adaptive Markets Hypothesis (markedet lærer gradvis, Lo); EMH = Efficient Market Hypothesis (prisene reflekterer all informasjon).","kt":"Adaptive markets hypothesis (AMH): markeder tilpasser seg og blir mer effektive over tid.","src":"L5 slide 26 · Bok s. 90 (3.4) · Bok s. 91 (3.4)","k":1,"x":1},{"id":"CX036","l":"L5","t":"Corporate governance","f":"m","d":2,"p":"H","sc":"none","s":"Corporate governance problems mainly come from:","o":[["Competition from foreign firms","Det har ikke med governance å gjøre."],["Too much government regulation","Det er ikke grunnproblemet."],["The separation of ownership and control","Eierne eier, ledelsen styrer: principal-agent."],["High interest rates","Renter er ikke kilden."]],"c":[2],"es":"Separation of ownership and control.","ed":"Styre, lederlønn, revisjon og stemmegivning er verktøy for å holde ledelsen ansvarlig overfor eierne.","kt":"","src":"L5 slide 7-8 · L5 slide 14","k":1},{"id":"CX037","l":"L5","t":"Voice and exit","f":"m","d":2,"p":"H","sc":"short","s":"A shareholder proposal asking a firm to set emission targets is an example of:","o":[["Divestment","Divestment = exit."],["Voice","Å påvirke selskapet innenfra = voice."],["Passive investing","Passiv investering handler om å følge en indeks."],["Exit","Exit er å selge aksjene."]],"c":[1],"es":"Forslag, stemmer, dialog = voice.","ed":"Voice: dialog, stemmegivning, forslag. Exit: selge aksjene. Trusselen om exit kan gjøre voice sterkere.","kt":"","src":"L5 slide 17 · L8 slide 71 · Bok s. 89 (3.3.4)","k":1},{"id":"CX038","l":"L5","t":"Voice vs exit","f":"m","d":2,"p":"H","sc":"none","s":"The most realistic tool for an index fund that wants a company to change is:","o":[["Voting and engagement","Indeksfond må eie alle selskapene i indeksen, så de bruker voice."],["Short selling the shares","Indeksfond shorter ikke enkeltaksjer."],["Refusing to receive dividends","Det er ikke et governance-verktøy."],["Selling the company's shares","Da følger fondet ikke lenger indeksen."]],"c":[0],"es":"Indeksfond: bare voice.","ed":"Exit er først og fremst et verktøy for aktive investorer. Når et indeksfond selger, følger det bare indeksreglene, ikke selskapets oppførsel.","kt":"","src":"L8 slide 71 · Bok s. 194 (7.3.4)","k":1},{"id":"CX039","l":"L5","t":"Engagement","f":"t","d":2,"p":"H","sc":"none","s":"Does selling a polluting firm's shares usually force it to cut emissions?","o":[["Yes","Feil. Noen andre kjøper aksjene, ofte en investor som bryr seg mindre. Selskapet kan fortsette som før."],["No","Riktig. Noen andre kjøper aksjene, ofte en investor som bryr seg mindre. Selskapet kan fortsette som før."]],"c":[1],"es":"Nei: divestment har begrenset effekt.","ed":"Derfor foretrekker mange investorer engagement (voice), og selger først når dialogen ikke fører frem.","kt":"","src":"Bok s. 89 (3.3.4) · Bok s. 21 (1.4.1) · L8 slide 58 · L9 slide 32","k":1},{"id":"CX040","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"The 'tragedy of the horizon' (Carney) refers to:","o":[["Investors hold shares for too many years","Problemet er heller for korte horisonter."],["Climate harms arrive beyond decision horizons","Kostnadene ved å handle kommer nå, gevinstene langt frem i tid."],["Firms report too much ESG information too often","Det er ikke poenget."],["Interest rates are too high for green projects","Det er ikke begrepet."]],"c":[1],"es":"Kostnad nå, gevinst langt frem = tragedy of the horizon.","ed":"Ledere, investorer og politikere har korte horisonter, så de undervurderer klimaeffekter som kommer langt frem i tid.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 98 (Key concepts) · L5 slide 29","k":1},{"id":"CX041","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"A practice that tends to INCREASE short-termism is:","o":[["Long vesting periods","Lang opptjening trekker mot langsiktighet."],["Clawback rules","Clawback reduserer fristelsen til kortsiktighet."],["Quarterly reporting","Hyppig måling gir press på kortsiktige tall."],["Long-term owners","Langsiktige eiere reduserer short-termism."]],"c":[2],"es":"Kvartalsrapportering øker short-termism.","ed":"Andre ting som øker short-termism: årlige bonuser, kvartalsvis måling av forvaltere og marking-to-market.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 77 (Table 3.1)","k":1},{"id":"CX042","l":"L5","t":"Executive compensation","f":"m","d":2,"p":"H","sc":"none","s":"A clawback provision means:","o":[["Delaying when shares can be sold","Det er vesting."],["Taking back pay already given","Selskapet krever tilbake bonus som ikke var fortjent."],["A bonus for hitting ESG targets","Det er ESG-linked pay."],["A fixed cap on total CEO pay","Det er et lønnstak."]],"c":[1],"es":"Clawback = ta tilbake.","ed":"Clawback og lange vesting-perioder får ledere til å tenke langsiktig.","kt":"","src":"Bok s. 92 (3.4.2) · L5 slide 29","k":1},{"id":"CX043","l":"L5","t":"ESG-linked executive pay","f":"m","d":2,"p":"H","sc":"none","s":"The evidence on ESG-linked executive pay shows that:","o":[["Its link to ESG results is weak","Svak og ikke-kausal sammenheng, ofte vage mål."],["It reliably causes better ESG results","Det finnes ikke slik evidens."],["It is banned in the European Union","Det er ikke forbudt."],["It always lowers total CEO pay","Det stemmer ikke."]],"c":[0],"es":"Svak sammenheng mellom ESG-lønn og ESG-resultat.","ed":"Bedre design: målbare, verifiserte mål og utbetaling over flere år.","kt":"","src":"Opptak L5 ca. 61 min · Opptak L5 ca. 65 min","k":1},{"id":"SB156","l":"L5","t":"Corporate governance","f":"m","d":1,"p":"H","sc":"none","s":"The root cause of corporate governance problems is:","o":[["Rules that force quarterly reporting","Incorrect: quarterly reporting causes short-termism, but it is not the root cause."],["The separation of ownership and control","Correct: owners (principals) and managers (agents) are different people."],["Shareholders knowing more than managers","Incorrect: managers usually know more, not shareholders."],["Firms being too small for managers","Incorrect: the problem is typical of large firms."]],"c":[1],"es":"Governance-problemer starter med at eiere (principal) og ledere (agent) er forskjellige personer.","ed":"I store firmaer eier aksjonærene (principals) firmaet, mens profesjonelle ledere (agents) styrer det. Når eierskap og kontroll er skilt, kan lederne handle i egen interesse. Dette er roten til agency problems og hele corporate governance-feltet. Husk: separation of ownership and control.","kt":"","src":"L5 slide 7-8 · L5 slide 14"},{"id":"SB157","l":"L5","t":"Agency problems","f":"m","d":3,"p":"H","sc":"short","s":"After two Boeing 737 MAX crashes, investigators found a culture that put cost cuts and share buybacks before safety. The lesson is that:","o":[["Safety is not material for plane makers","Incorrect: product safety is highly material for plane makers."],["Short-term focus can hurt value","Correct: short-term focus on costs and buybacks destroyed value."],["Buybacks always raise long-term value","Incorrect: buybacks can crowd out investment."],["A strong brand makes the board unimportant","Incorrect: boards must oversee material risks."]],"c":[1],"es":"Fokus på kortsiktige kutt og buybacks foran sikkerhet ødela verdi.","ed":"Boeing kuttet kostnader og kjøpte tilbake aksjer, mens sikkerhet fikk lavere prioritet og styret fulgte for dårlig med. To flystyrt ødela mye verdi. Caset viser at short-termism og svak governance kan skade langsiktig verdi. Husk: kortsiktige kutt kan koste dyrt.","kt":"Short-termism: favouring near-term earnings or share price over long-term value creation, e.g. by under-investing.","src":"L5 slide 5 · L5 slide 19"},{"id":"SB158","l":"L5","t":"Adverse selection","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Adverse selection happens after a deal, when someone takes more risk because others carry it.","o":[["True","Incorrect. Taking more risk after the deal is moral hazard; adverse selection is hidden information before the deal."],["False","Correct. Taking more risk after the deal is moral hazard; adverse selection is hidden information before the deal."]],"c":[1],"es":"Usant. Det beskriver moral hazard. Adverse selection skjer før avtalen.","ed":"Adverse selection skjer før en avtale: den ene parten har skjult informasjon (f.eks. vet selgeren at bilen er dårlig). Moral hazard skjer etter avtalen: atferden endres fordi andre bærer risikoen. Påstanden beskriver moral hazard. Husk: før = adverse selection, etter = moral hazard.","kt":"","src":"L5 slide 10-13 · L11 slide 7"},{"id":"SB159","l":"L5","t":"Moral hazard","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Shareholders of a highly indebted firm push for a very risky project, because they get the upside while creditors carry the downside. This is:","o":[["Asset substitution (moral hazard)","Correct: shifting risk to creditors after borrowing: asset substitution."],["The tragedy of the horizon","Incorrect: tragedy of the horizon is about timing."],["Adverse selection in the lemons market","Incorrect: there is no hidden information before the deal."],["Tunnelling by a controlling shareholder","Incorrect: tunnelling is a big owner taking value from small owners."]],"c":[0],"es":"Eierne velger mer risiko etter lånet fordi kreditorene tar tapet = asset substitution.","ed":"Asset substitution er en form for moral hazard: etter at gjelden er tatt opp, velger eierne svært risikable prosjekter. Hvis det går bra, får eierne gevinsten. Hvis det går galt, tar kreditorene mye av tapet. Husk: asset substitution = for mye risiko; debt overhang = for lite investering.","kt":"","src":"L5 slide 13 · L10 slide 3"},{"id":"SB160","l":"L5","t":"Purpose of corporate governance","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A board that ignores repeated audit warnings fails the OECD goal of governance: trust, transparency and accountability.","o":[["True","Correct. Ignoring repeated audit warnings breaks trust, transparency and accountability."],["False","Incorrect. Ignoring repeated audit warnings breaks trust, transparency and accountability."]],"c":[0],"es":"Sant. Å ignorere revisoren bryter med tillit, åpenhet og ansvar.","ed":"OECD beskriver målet med god corporate governance som å bygge tillit, åpenhet og ansvarlighet (trust, transparency, accountability). Et styre som ignorerer advarsler fra revisor, svikter på alle tre. Husk: OECD = trust, transparency, accountability.\n\nForkortelser: OECD = Organisation for Economic Co-operation and Development.","kt":"Corporate governance: the system of rules, practices and processes by which a company is directed and controlled, balancing the interests of stakeholders.","src":"L5 slide 15"},{"id":"SB161","l":"L5","t":"Voice and exit","f":"m","d":2,"p":"H","sc":"none","s":"How does \"exit\" work as a governance tool?","o":[["Regulators remove the firm's licence","Incorrect: removing a licence is not an owner tool."],["The threat of selling disciplines managers","Correct: the threat of selling disciplines managers."],["Shareholders vote managers out","Incorrect: voting is voice."],["Investors talk privately with the managers","Incorrect: private talks are voice."]],"c":[1],"es":"Trusselen om å selge disiplinerer lederne.","ed":"Eiere har to hovedverktøy: voice (stemme, dialog, forslag) og exit (selge aksjene). Exit virker gjennom trusselen: hvis store eiere selger, faller kursen, og det skader lederne (bonus, omdømme, takeover-risiko). Husk: exit = selge, voice = påvirke innenfra.","kt":"","src":"L5 slide 17 · L8 slide 71 · Bok s. 89 (3.3.4)"},{"id":"SB162","l":"L5","t":"Good governance practices","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A firm's CEO also chairs the board, most directors are ex-executives, and the same auditor has served for 25 years. What is the best fix?","o":[["Split the CEO and chair roles","Correct: an independent chair can check the CEO."],["Use revenue growth as the only target","Incorrect: growth-only targets encourage bad expansion."],["Keep the same auditor for 35 years","Incorrect: very long auditor tenure weakens independence."],["Add more former executives","Incorrect: more ex-executives weakens independence further."]],"c":[0],"es":"Del CEO- og styreleder-rollen, så styret kan kontrollere ledelsen.","ed":"Når CEO også er styreleder (CEO duality), kontrollerer CEO-en i praksis seg selv. Et styre fullt av tidligere ledere og en revisor med 25 år i firmaet gjør det verre. Den beste løsningen er å skille rollene og styrke uavhengigheten. Husk: uavhengighet = bedre kontroll.","kt":"Board independence: directors without ties to management who can monitor and challenge executives.","src":"L5 slide 19 · Bok s. 135 (5.3.3)"},{"id":"SB163","l":"L5","t":"Governance of sustainability","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A salmon farmer's board has no biology or environmental expert, although sea lice are its biggest risk. What should it do?","o":[["Focus only on quarterly earnings","Incorrect: this ignores what drives long-term value."],["Leave the environment to marketing","Incorrect: material risks need board oversight, not just marketing."],["Add expertise on key risks","Correct: the board needs expertise on its biggest risk."],["Stop reporting on sea lice","Incorrect: hiding material risks damages trust."]],"c":[2],"es":"Styret trenger kompetanse på den største risikoen.","ed":"Lakselus er den største risikoen for en lakseoppdretter. Et styre uten kompetanse innen biologi eller miljø kan ikke følge med på risikoen ordentlig. Styret bør ha ekspertise på det som driver verdien. Husk: styret må forstå de material risikoene.","kt":"Materiality: issues that can substantially affect a company's value (financial) or its impact on society (impact materiality).","src":"L5 slide 19"},{"id":"SB164","l":"L5","t":"Nestlé and Cargill child labour case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Nestlé and Cargill were sued over child labour on cocoa farms; the case failed because no link to specific farms was shown. What can shareholders do?","o":[["Nothing; governance does not affect supply chains","Incorrect: governance does affect supply chains."],["Use voice (engagement) or exit (selling)","Correct: shareholders can use voice (engagement) or exit (selling)."],["Managers must use the cheapest labour by law","Incorrect: no law requires the cheapest labour."],["Nothing; the case cannot affect value","Incorrect: reputation and lawsuits affect value."]],"c":[1],"es":"Eierne kan bruke voice (engagement) eller exit (selge).","ed":"Selv om søksmålet mot Nestlé og Cargill feilet, kan barnearbeid skade omdømme og verdi. Aksjonærer kan bruke voice (dialog, stemmer, forslag) for å kreve bedre kontroll i leverandørkjeden, eller exit (selge). Husk: voice og exit er eiernes verktøy.","
