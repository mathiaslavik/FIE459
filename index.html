h knock-on effects for mortgages and property values.","kt":"","src":"L12 slide 8 · L12 slide 10 · L12 slide 13-18 · L12 slide 25 · Bok s. 337 (11.3.2.1)"},{"id":"SB461","l":"L12","t":"Sustainability risks in insurance","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Gatzert, Reichel and Zitzmann (2020), shown in Lecture 12, conclude that climate change is the only sustainability risk relevant for insurers, so they should focus exclusively on it.","o":[["True","Incorrect. They conclude that while climate change is important, it is by far not the only factor; insurers should take a broader approach, and lack of data and knowledge are key barriers."],["False","Correct. They conclude that while climate change is important, it is by far not the only factor; insurers should take a broader approach, and lack of data and knowledge are key barriers."]],"c":[1],"es":"False: climate is important but not the only sustainability risk.","ed":"Sustainability risks and opportunities arise on the asset side (investments), the liability side (underwriting: pandemics, liability, cyber, demographics) and at corporate level (governance, reputation). AXA's matrix illustrates this breadth: financial instability, terrorism, demographic change, pandemics, cyber and data privacy alongside climate change. Lack of data and knowledge impedes transparency.","kt":"","src":"L12 slide 20 · Bok s. 325 (11.2)"},{"id":"SB462","l":"L12","t":"Catastrophe losses","f":"m","d":4,"p":"M","sc":"short","s":"Insured catastrophe losses have trended upward for decades (Swiss Re). An analyst attributes the whole rise to climate change. What does the textbook suggest is missing?","o":[["Lower insurance density in rich countries.","Insurance density is higher in rich countries."],["Falling property values.","Property values and asset concentrations have risen."],["Growth in exposure: more assets in risky areas, not just stronger hazards.","Losses = hazard × exposure × vulnerability; exposure has grown fast."],["Nothing; losses depend only on hazards.","Catastrophe models include exposure and vulnerability."]],"c":[2],"es":"Rising losses reflect both stronger hazards and growing exposure.","ed":"Swiss Re notes climate change combined with growing asset concentrations in exposed areas causes a steady rise in losses. Lloyd's estimates sea-level rise raised Sandy's surge losses by 30%. Separating drivers matters for pricing and adaptation.","kt":"Catastrophe model components: hazard, vulnerability, exposure, financial loss, platform.","src":"Bok s. 322 (Figure 11.3) · Bok s. 326 (Box 11.2) · L12 slide 15"},{"id":"TR54","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: Climate-related claims rise much faster than the insurer's models predicted, and premiums were set too low. Where does the shortfall land first?","o":[["On the central bank, which automatically pays all claims","There is no such automatic guarantee."],["On policyholders, who must repay past claims","Policyholders are not liable for the insurer's underpricing."],["Nowhere, because technical provisions can never be too small","Provisions rest on models that may underestimate climate risk."],["On equity: shareholders absorb the shortfall","When provisions are too small, equity must cover the gap."]],"c":[3],"es":"Underestimated claims eat into equity first.","ed":"Insurers respond by raising premiums or stopping cover for certain risks (which widens the protection gap), by buying reinsurance, via state-backed schemes funded by taxpayers, or by transferring risk to cat bond investors. The lecture notes models built on 30-40 years of \"stable\" data may misjudge a changing climate.","kt":"","src":"Opptak L11 ca. 58 min · Opptak L12 ca. 13 min · Opptak L12 ca. 35 min"},{"id":"TR55","l":"L12","t":"Insurance innovation","f":"m","d":3,"p":"H","sc":"short","s":"In 2024, Hurricane Beryl left hundreds of thousands of Jamaican homes without power, but narrowly missed the air-pressure trigger of a parametric policy, so nothing was paid. What does this show?","o":[["Parametric cover is fast and cheap but has basis risk","Payout depends on the index, not on the actual loss (basis risk)."],["The policy was a catastrophe bond, so investors kept the premium","The case is about a parametric policy, not a cat bond."],["Parametric insurance pays only after a detailed loss assessment","It pays automatically when the parameter crosses a threshold."],["Parametric insurance always pays out more than the actual loss","It can pay more or less, or nothing, depending on the trigger."]],"c":[0],"es":"Fast and cheap, but basis risk: no payout if the trigger is missed.","ed":"The lecturer stresses that \"everything has two sides\": the Lloyd's olive-farm cover (pay-out once temperatures hit 36°C) shows the simplicity and low cost, while the Beryl case shows the risk for buyers.","kt":"Parametric insurance: pays a preset amount when an objective measure (wind speed, rainfall, temperature) crosses a threshold.","src":"Opptak L12 ca. 27 min · Opptak L12 ca. 37 min"},{"id":"TR56","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"M","sc":"none","s":"Some insurers stop insuring coal companies. Which concern does the lecturer raise about this strategy?","o":[["Coal firms have no physical or liability risk to insure","They face substantial risks."],["Insurers are legally obliged to insure every company","Insurers can choose which risks to underwrite."],["Exclusion always raises the insurer's profits","Profit effects are not the concern raised."],["Coal firms may self-insure; insurers lose leverage","This mirrors the washing machine argument against pure exclusion."]],"c":[3],"es":"Exclusion may lead to self-insurance and lost influence.","ed":"The lecture links this to Lecture 9: oil and gas firms are major green patent filers, and staying invested (or insured) can allow engagement. Whether exclusion or engagement is better remains open.","kt":"","src":"Opptak L11 ca. 52 min"},{"id":"TR57","l":"L12","t":"Reinsurance","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Because insurers can buy reinsurance, climate catastrophes cannot create systemic risk in the insurance sector.","o":[["True","Incorrect. Reinsurance links insurers in a network; if a large player fails, losses can spread like dominoes."],["False","Correct. Reinsurance links insurers in a network; if a large player fails, losses can spread like dominoes."]],"c":[1],"es":"False: reinsurance spreads risk but also connects firms.","ed":"Reinsurance is often done within the same insurance group, where information asymmetry is lower (less adverse selection). It shares risk but does not remove it, which is why systemic risk management is a material issue for insurers.","kt":"","src":"Opptak L12 ca. 31 min · Opptak L12 ca. 32 min"},{"id":"TR58","l":"L12","t":"EU regulation","f":"t","d":2,"p":"H","sc":"none","s":"True or false: The EU Taxonomy classifies companies as either sustainable or not sustainable.","o":[["True","Incorrect. It classifies economic activities, not entities: whether a specific activity, by whichever firm, counts as sustainable."],["False","Correct. It classifies economic activities, not entities: whether a specific activity, by whichever firm, counts as sustainable."]],"c":[1],"es":"False: the Taxonomy classifies activities, not companies.","ed":"One company can have both taxonomy-aligned and non-aligned activities (e.g. a utility with wind farms and gas plants). This is why firms report the share of turnover, capex and opex that is taxonomy-aligned. Solvency II and the IDD are the insurance-specific EU rules.","kt":"","src":"Opptak L12 ca. 44 min"},{"id":"TR59","l":"L12","t":"Insurance basics","f":"m","d":2,"p":"L","sc":"none","s":"What does directors and officers (D&O) liability insurance cover, as explained in the course?","o":[["Physical damage to company buildings from natural disasters","That is non-life property insurance."],["The firm's bondholders against default","That would be credit insurance or a credit default swap."],["Directors' personal costs from lawsuits","It protects managers if they are sued, linked to fiduciary duties and the business judgment rule."],["Employees' pensions after retirement","That is life/pension insurance."]],"c":[2],"es":"D&O covers directors' personal liability from lawsuits.","ed":"Combined with the business judgment rule, D&O insurance means directors rarely pay personally for good-faith decisions, which is one reason lawyers saw the BRT statement as adding little in practice.","kt":"","src":"Opptak L11 ca. 56 min · Opptak L4 ca. 41 min"},{"id":"SB463","l":"GUEST","t":"Folketrygdfondet","f":"m","d":1,"p":"M","sc":"none","s":"What is the stated overall objective of Folketrygdfondet's management of the Government Pension Fund Norway (GPFN)?","o":[["Maximising the fund's positive impact on the SDGs, even at the cost of lower returns","Impact is not the primary objective; responsible ownership serves long-term return."],["Tracking the Oslo Børs benchmark index as closely as possible with zero active risk","The mandate is active, responsible and long-term, not pure index tracking."],["Supporting Norwegian employment through targeted investments in local companies","Industrial policy goals are not part of the mandate."],["The highest possible return over time, within risk limits","Stated repeatedly in the lecture (pages 5, 10 and 18)."]],"c":[3],"es":"Highest possible return over time, through active, responsible and long-term management.","ed":"Folketrygdfondet manages the GPFN (about NOK 429bn) and is the largest institutional investor on Oslo Børs (about 5% of OSEAX, 11% of OSEBX). Responsible investment and active ownership are tools to achieve the return objective, because returns depend on companies performing well over time and on well-functioning markets. Compare NBIM's near-index global mandate (Lecture 8).","kt":"","src":"Folketrygdfondet s. 3 · Folketrygdfondet s. 5 · Folketrygdfondet s. 10 · Folketrygdfondet s. 18"},{"id":"SB464","l":"GUEST","t":"Folketrygdfondet","f":"m","d":2,"p":"M","sc":"none","s":"Which of the following is one of the six active ownership tools Folketrygdfondet says it uses?","o":[["Participation in nomination committees","Listed with expectations, dialogue, voting, ethical exclusions and contributing to well-functioning markets."],["Buying sustainability-linked derivatives on portfolio companies","Not one of the six tools."],["Short-selling companies with weak ESG ratings","Short-selling is not listed as an ownership tool."],["Appointing its own staff as CEOs of portfolio companies","It sits in nomination committees, not in management."]],"c":[0],"es":"Expectations, company dialogue, voting, nomination committees, ethical exclusions, contribution to well-functioning markets.","ed":"The six tools are integrated into management because returns depend on companies delivering good results and on efficient markets. Folketrygdfondet sits in 16 nomination committees (e.g. Equinor, Norsk Hydro, Yara, TOMRA) and is a top-3 owner in 52 Norwegian companies, giving it real influence - unlike widely diversified passive owners.","kt":"","src":"Folketrygdfondet s. 18 · Folketrygdfondet s. 21 · Folketrygdfondet s. 24"},{"id":"SB465","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Folketrygdfondet is among the top three owners in 52 Norwegian companies and sits in 16 nomination committees. Why does this give it more influence than NBIM has in a typical holding?","o":[["Because it only invests in bonds.","It is a large equity owner."],["Because Norwegian law gives it veto rights in all listed companies.","No such legal veto exists."],["Because it uses passive index tracking.","It is an active, concentrated manager."],["Larger, concentrated stakes and board-nomination roles give it real voice.","Concentration makes engagement credible and effective."]],"c":[3],"es":"Concentrated stakes + nomination committees = real influence.","ed":"NBIM owns about 1-2% of thousands of firms (near-index), while Folketrygdfondet can shape boards. This illustrates the textbook's link between concentration and effective engagement (Lecture 8, condition 2-3).","kt":"Nomination committee: a shareholder-elected committee that proposes board members, common in Norway.","src":"Folketrygdfondet s. 21 · Folketrygdfondet s. 24 · Bok s. 186 (Box 7.1)"},{"id":"SB466","l":"GUEST","t":"Folketrygdfondet","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The PwC / Finance Society Norway survey shown by Folketrygdfondet indicates that Norwegian practitioners only adjust for weak environmental performance through the discount rate, never through cash flows.","o":[["True","Incorrect. The survey shows adjustments through cash flows, through the discount rate, through both, and a share making no adjustment."],["False","Correct. The survey shows adjustments through cash flows, through the discount rate, through both, and a share making no adjustment."]],"c":[1],"es":"False: adjustments are made via cash flows, the discount rate, or both.","ed":"This mirrors the two channels in Lecture 9: the cash flow channel (revenues, costs, capex, stranded assets) and the cost of capital channel. Practice is mixed, and a sizeable share makes no adjustment at all, showing that ESG integration in valuation is still uneven.","kt":"","src":"Folketrygdfondet s. 16 · L9 slide 3"},{"id":"SB467","l":"GUEST","t":"Folketrygdfondet","f":"m","d":2,"p":"H","sc":"none","s":"Folketrygdfondet calls materiality a \"prerequisite for financial value creation\". Which evidence does it cite?","o":[["Firms that exclude ESG from their strategy earn the highest risk-adjusted returns.","The cited evidence shows the opposite for material issues."],["Firms with the highest overall ESG scores always outperform, regardless of materiality.","The point is materiality, not overall scores."],["Immaterial ESG investments generate the largest sales growth.","Immaterial investments do not drive outperformance."],["Firms investing in material ESG issues outperform peers.","Quoted from Khan, Serafeim and Yoon (HBR): better stock returns, sales growth and margin growth."]],"c":[3],"es":"Material ESG investments → better risk-adjusted returns, sales growth and margin growth.","ed":"This is the same evidence as in Lectures 6 and 9: performance on material issues (SASB-defined) predicts outperformance, while performance on immaterial issues does not. For an active investor this is the rationale for qualitative company analysis focused on material issues.","kt":"","src":"Folketrygdfondet s. 15 · L6 slide 52"},{"id":"SB468","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"M","sc":"none","s":"Folketrygdfondet's conclusion asks \"The end of ESG?\" and quotes: \"Considering long-term factors when valuing a company isn't ESG investing; it's investing.\" What does this imply?","o":[["Investors should stop considering sustainability entirely because ESG has failed.","The point is integration, not abandonment."],["Material ESG factors belong in ordinary investment analysis.","ESG becomes integrated rather than a separate label."],["Only funds labelled as ESG funds should consider long-term factors.","The quote says all investing should consider them."],["ESG should be outsourced to rating agencies so analysts can focus on finance.","The lecture stresses in-house, integrated analysis."]],"c":[1],"es":"Long-term, material ESG factors are simply part of good investing.","ed":"The slide contrasts hype (\"ESG = excess return\", greenwashing, disclosure avalanche) with open questions (financial materiality, credible transition plans, real-world outcomes). The conclusion echoes the textbook's SF 2.0: ESG integration through fundamental analysis rather than labels. It also connects to Brooks' \"greenhushing\" and to Starks' \"value vs values\" distinction.","kt":"","src":"Folketrygdfondet s. 26 · Folketrygdfondet s. 27"},{"id":"SB469","l":"GUEST","t":"Folketrygdfondet","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Folketrygdfondet's expectations to companies are limited to climate, because climate is the only ESG topic material to Norwegian listed firms.","o":[["True","Incorrect. The expectations also cover strategy and capital structure, anti-corruption, human and labour rights, nature, remuneration and bond issuance."],["False","Correct. The expectations also cover strategy and capital structure, anti-corruption, human and labour rights, nature, remuneration and bond issuance."]],"c":[1],"es":"False: expectations cover a broad set of governance, social and environmental topics.","ed":"As the largest institutional investor on Oslo Børs, Folketrygdfondet publishes expectations (updated December 2025) on strategy, capital structure and financial targets, anti-corruption, human and labour rights, climate, nature and ecosystems, executive and board pay, and bond issuance (including issuer and lead manager roles). Companies and other shareholders look to its views.","kt":"","src":"Folketrygdfondet s. 19"},{"id":"SB470","l":"GUEST","t":"Fondsfinans","f":"m","d":2,"p":"H","sc":"none","s":"How does Melanie Brooks (Fondsfinans) distinguish \"ESG\" from \"sustainability\"?","o":[["ESG measures product impact on the SDGs, while sustainability only measures governance.","This reverses the distinction."],["ESG concerns how a firm is run; sustainability also asks whether its products contribute to sustainable outcomes.","Every company has ESG considerations; there is no \"ESG company\"."],["Sustainability is scored relative to industry peers, ESG in absolute terms.","ESG performance is usually scored relative to industry peers."],["They are identical terms and can always be used interchangeably.","The slide warns they are not necessarily the same."]],"c":[1],"es":"ESG = operations and management (often peer-relative); sustainability = contribution of products/services to outcomes (SDGs, Paris, taxonomy).","ed":"This matches Table 8.1 in the textbook (operations vs products focus) and the critique that industry-relative ESG ratings can rate an oil major highly. A company can be well run (good ESG) without being \"sustainable\" in what it sells, and vice versa.","kt":"","src":"Fondsfinans s. 6 · Bok s. 212 (Table 8.1)"},{"id":"SB471","l":"GUEST","t":"Fondsfinans","f":"m","d":2,"p":"M","sc":"none","s":"Brooks describes market responses to the new era of ESG regulation, moving from \"greenwashing\" to \"greenwishing\" and \"greenhushing\". What is greenhushing?","o":[["Firms deliberately say less about their sustainability efforts.","Stricter scrutiny makes firms quieter to avoid accusations."],["Firms exaggerate sustainability claims to attract investors.","That is greenwashing."],["Regulators ban all environmental claims in marketing.","Greenhushing is a firm behaviour, not a regulatory ban."],["Firms set well-meant but unrealistic sustainability goals.","That is closer to greenwishing."]],"c":[0],"es":"Greenhushing = under-communicating sustainability efforts to avoid scrutiny.","ed":"As regulations multiplied (868 ESG regulations globally by 2022, 60% in Europe) and greenwashing accusations rose, some firms and funds moved to greenhushing. The SFDR mass reclassification from Article 9 to Article 8 (Lecture 8) is a related phenomenon. Greenhushing reduces transparency and can hide genuine progress.","kt":"","src":"Fondsfinans s. 9 · Fondsfinans s. 10 · L8 slide 26"},{"id":"SB472","l":"GUEST","t":"Fondsfinans","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: Following Brooks, a manager whose mandate requires ESG integration but who ignores material ESG risks can face client outflows, reputational damage and legal consequences, even if the fund's returns are good.","o":[["True","Correct. The asset owner/mandate perspective: breaching mandate requirements creates outflow, reputational and legal risk regardless of short-term returns."],["False","Incorrect. The asset owner/mandate perspective: breaching mandate requirements creates outflow, reputational and legal risk regardless of short-term returns."]],"c":[0],"es":"True: mandate breaches carry outflow, reputational and legal risk.","ed":"Brooks lists three perspectives: financial (material ESG can but does not always improve returns), mandate, and regulatory (licence to operate). The DWS fine shows the legal side of mis-stating ESG practices.","kt":"Investment mandate: the contract setting the objectives, constraints and requirements an asset manager must follow for a client.","src":"Fondsfinans s. 12"},{"id":"SB473","l":"GUEST","t":"Fondsfinans","f":"t","d":3,"p":"M","sc":"none","s":"True or false: According to NBIM's Responsible Investment Report 2024 (quoted by Brooks), risk-based divestments since 2012 have reduced the cumulative return on equity management by several percentage points.","o":[["True","Incorrect. NBIM reports risk-based divestments INCREASED cumulative return by 0.64 percentage points (about 0.02 pp per year), with climate and human rights divestments contributing 0.30 and 0.16 pp."],["False","Correct. NBIM reports risk-based divestments INCREASED cumulative return by 0.64 percentage points (about 0.02 pp per year), with climate and human rights divestments contributing 0.30 and 0.16 pp."]],"c":[1],"es":"False: risk-based divestments added about 0.64 pp cumulatively.","ed":"The effect is positive but small, consistent with the view that divesting firms with unpriced or unacceptable ESG risk need not hurt returns. Combined with the cost of ESG controversies (BofA/RepRisk), it supports managing ESG risk. Note the debate in Lecture 9 on whether divestment changes real-world outcomes.","kt":"","src":"Fondsfinans s. 15 · L9 slide 33"},{"id":"SB474","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"H","sc":"none","s":"Which weakness of \"off the shelf\" ESG ratings does Brooks highlight, citing \"Aggregate Confusion\" (Berg, Kölbel and Rigobon)?","o":[["Ratings are biased in favour of small emerging market firms.","The bias favours large companies and developed markets."],["Ratings are fully forward-looking and audited.","Data are mostly self-reported, not standardised and backward-looking."],["Ratings measure real-world sustainability outcomes precisely.","The link between ESG scores and sustainability is insufficient."],["Low and inconsistent correlations between providers.","Also listed: self-reported data, opaque methods, large-cap bias, weak link to sustainability."]],"c":[3],"es":"Ratings: self-reported, backward-looking data; opaque methods; large-cap/DM bias; low correlation; weak link to sustainability.","ed":"This matches Lecture 7 (Kotsantonis: disagreement rises with information) and the textbook's design limitations of ratings (Lecture 8). Brooks recommends more granular sources (company filings, media, NGOs, regulators, specialist data providers) to understand what a company does, how, when and where.","kt":"","src":"Fondsfinans s. 16 · Fondsfinans s. 17 · L7 slide 37"},{"id":"SB475","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"H","sc":"short","s":"A semiconductor maker uses large amounts of water in a drought-prone region. Its water use harms local farmers today, and water shortages could later halt its production. Which concept from Brooks' lecture best describes this?","o":[["Accounting materiality only","Accounting materiality ignores impacts on society."],["Immateriality, since water is a free resource","Unpriced resources are exactly what can become material."],["Purely financial materiality with no time dimension","The example includes impact and changes over time."],["Double and dynamic materiality","Impact on society and financial impact on the firm, changing over time."]],"c":[3],"es":"Double = firm→society and society→firm; dynamic = materiality changes over time.","ed":"Brooks distinguishes financial materiality (how ESG affects the company), impact materiality (what the company does to society and the environment) and double and dynamic materiality (both directions, changing over time as new factors emerge). Water stress is her example of a double material risk. This links to GRI vs SASB (Lecture 6) and CSRD (PwC).","kt":"","src":"Fondsfinans s. 19 · Fondsfinans s. 20 · L6 slide 53"},{"id":"SB476","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"M","sc":"none","s":"Which question does Brooks list as a consideration before choosing active ownership as an ESG approach?","o":[["Can engagement replace the need for any company-specific knowledge?","Company- and issue-specific knowledge is required."],["Are you engaging for information or to promote change?","One of seven considerations on page 24."],["Can you avoid all contact with company management?","Access to management is needed, not avoided."],["Is the issue immaterial so it will not affect returns?","Engagement should focus on material, meaningful issues."]],"c":[1],"es":"Consider: goal (information vs change), market and access, realism, knowledge, receptiveness, success markers and resources to follow up.","ed":"Brooks warns against box-checking engagement. Investors should ask whether the market allows meaningful engagement, whether they have access (alone or in a group), whether they are realistic about influence, whether they have knowledge, whether the company is receptive, and what success looks like with resources to follow up. She also notes one can be a passive investor but an active owner.","kt":"","src":"Fondsfinans s. 24 · Fondsfinans s. 22"},{"id":"SB477","l":"GUEST","t":"Fondsfinans","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Brooks argues there is no one-size-fits-all approach to ESG integration; investors should start by asking what they are trying to achieve (e.g. compliance, returns, risk reduction, thematic exposure or impact) and what resources they have.","o":[["True","Correct. Page 21 makes exactly this point."],["False","Incorrect. Page 21 makes exactly this point."]],"c":[0],"es":"True: the right approach depends on goals and resources.","ed":"Different objectives lead to different strategies (screening, integration, tilts, engagement, impact). This mirrors Lecture 9's objective functions (max FV, max FV s.t. SEV, max IV, max SEV s.t. FV) and the textbook's Table 8.3 on suitability per investing style.","kt":"","src":"Fondsfinans s. 21 · L9 slide 29"},{"id":"SB478","l":"GUEST","t":"PwC","f":"m","d":2,"p":"H","sc":"none","s":"According to the PwC guest lecture, which principle determines what companies report under the CSRD and its European Sustainability Reporting Standards (ESRS)?","o":[["Only greenhouse gas emissions, with no social topics","ESRS cover environment, social and governance topics."],["Double materiality","Companies report impacts, risks and opportunities (IROs) assessed by double materiality."],["Purely financial materiality as under SASB","CSRD requires impact materiality as well."],["Voluntary choice of any framework the company prefers","ESRS are mandatory standards with a standardised structure."]],"c":[1],"es":"CSRD/ESRS: double materiality assessment of impacts, risks and opportunities; standardised sustainability statement.","ed":"The management report moves from vague statements to a standardised sustainability statement: general information (ESRS 2), environmental information (incl. Taxonomy Article 8 disclosures, E1 climate, E5 resource use), social (S1 own workforce, S2 value-chain workers, S4 consumers) and governance (G1 business conduct). Each topic includes IRO management and metrics and targets. Reports require assurance.","kt":"","src":"PwC s. 29 · PwC s. 32"},{"id":"SB479","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"short","s":"PwC reports that 94% of investors believe corporate reports contain unsupported sustainability claims. Which CSRD feature is most directly designed to address this?","o":[["Requiring firms to publish only photos and case stories","Unverifiable stories are the problem."],["Allowing firms to choose any reporting framework","Free choice reduces comparability."],["Mandatory external assurance of sustainability statements","Assurance verifies claims, building trust."],["Removing all sustainability reporting for large firms","That would reduce information."]],"c":[2],"es":"External assurance builds trust in sustainability claims.","ed":"Assurance plus standardised ESRS data points aim to make sustainability information as reliable as financial reporting. PwC notes immature processes and systems still make errors more likely than in financial reporting.","kt":"Assurance: independent third-party verification of reported information (limited or reasonable assurance).","src":"PwC s. 30 · PwC s. 38 · PwC s. 46"},{"id":"SB480","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"short","s":"The EU Omnibus package sharply narrows which companies must report under the CSRD, citing administrative burden. What is the main trade-off for investors and banks?","o":[["No trade-off, since excluded firms must still report under ESRS.","Out-of-scope firms are not required to report."],["It bans voluntary sustainability reporting.","Firms can still report voluntarily."],["It raises reporting costs for all firms.","The aim is to reduce costs."],["Lower reporting costs vs less standardised, assured data on smaller firms.","Fewer firms report, so ESG data for many borrowers and holdings will be thinner."]],"c":[3],"es":"Cheaper for firms, but thinner, less comparable data for users.","ed":"Banks still need ESG data for EBA Pillar 3 and credit risk, so they may ask smaller clients directly or rely on voluntary standards. This illustrates the tension between reporting burden and decision-useful information.","kt":"CSRD scope: the set of companies legally required to publish sustainability statements under ESRS.","src":"PwC s. 40 · PwC s. 41 · L11 slide 31"},{"id":"SB481","l":"GUEST","t":"PwC","f":"t","d":2,"p":"L","sc":"none","s":"True or false: PwC argues that sustainability reporting carries a lower inherent risk of errors than financial reporting, because sustainability data are typically produced in mature, well-integrated IT systems.","o":[["True","Incorrect. PwC says immature processes and weak technology support mean a GREATER inherent risk, with manual spreadsheets, fragmented systems and unclear indicator definitions."],["False","Correct. PwC says immature processes and weak technology support mean a GREATER inherent risk, with manual spreadsheets, fragmented systems and unclear indicator definitions."]],"c":[1],"es":"False: immature processes and weak systems increase inherent risk.","ed":"Pitfalls include manual spreadsheets, fragmented systems, many contributors with decentralised responsibility, weak internal controls, unclear definitions, poor master data control, limited documentation and different measurement methods across borders. Best practice: consistent financial and sustainability reporting, focus on the big picture and material matters, critical use of digital tools and multidisciplinary teams.","kt":"","src":"PwC s. 46 · PwC s. 47"},{"id":"SB482","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"none","s":"PwC states \"It's really not about the reporting...\" What is the main message?","o":[["Companies should minimise reporting effort because reports have no value.","PwC finds firms that use the reporting process to inform business operations get the most value."],["Reporting should serve strategy, transformation and steering.","PwC links strategy (\"design\"), transformation (\"make it real\") and reporting (\"keep it real\")."],["Only compliance matters; strategy is irrelevant.","Compliance is the minimum, not the goal."],["Sustainability should be kept separate from core strategy to avoid complexity.","PwC argues sustainability should be integrated into the core strategy."]],"c":[1],"es":"Reporting is a means: integrate sustainability in strategy and use data for monitoring and steering.","ed":"PwC shows a progression from reporting (what happened?) to monitoring (what happens now?) to steering (what will happen?), with value added rising along the way. Sustainability integrated into core strategy, specific targets and credible climate transition plans (e.g. Maersk) replace \"fluffy\" targets. This echoes the textbook's integrated thinking (Lecture 7) and LTVC (Lecture 6).","kt":"","src":"PwC s. 13 · PwC s. 23 · PwC s. 24 · PwC s. 27"},{"id":"SB483","l":"GUEST","t":"PwC","f":"m","d":3,"p":"L","sc":"none","s":"Which statement does PwC present as a climate MYTH that businesses should \"bust\"?","o":[["\"Financial impacts can arise through operations, supply chains and customer markets.\"","PwC presents this as fact."],["\"Global losses from natural disasters were estimated at $417bn in 2024.\"","This is cited as a fact."],["\"A firm's carbon footprint determines its exposure to physical climate risk.\"","PwC says footprint is irrelevant to physical risk exposure."],["\"Physical impacts will deteriorate for decades regardless of decarbonisation speed.\"","PwC presents this as fact, not myth."]],"c":[2],"es":"Myths: \"it's ages away\", \"it will happen elsewhere\", \"technology will solve it\", \"financial impact will be immaterial\", \"footprint = risk exposure\".","ed":"PwC stresses that climate change has already happened, impacts will worsen non-linearly, and financial effects hit balance sheets and P&L through operations, supply chains and markets. A low-emission firm can still be highly exposed to physical risk - the same footprint-vs-risk distinction as the textbook's aluminium example (Lecture 9).","kt":"","src":"PwC s. 16 · Bok s. 223 (8.2.2)"},{"id":"SB484","l":"GUEST","t":"Guest lectures synthesis","f":"m","d":4,"p":"H","sc":"none","s":"Which statement best captures the common thread across the Folketrygdfondet, Fondsfinans and PwC guest lectures?","o":[["ESG investing always produces excess returns.","Folketrygdfondet and Brooks warn against such claims."],["Material, decision-useful ESG information matters more than labels and scores.","All three stress materiality, integration and data quality over labels."],["Sustainability reporting is mainly a compliance exercise with little strategic value.","PwC argues the opposite."],["ESG ratings from external providers are sufficient for investment decisions.","Brooks and the textbook stress rating weaknesses."]],"c":[1],"es":"Common thread: materiality, integration in analysis and strategy, credible data - not labels.","ed":"Folketrygdfondet integrates material ESG into company analysis and ownership to maximise return; Brooks warns about ratings, greenhushing and the need for clear objectives; PwC shows CSRD forces structured double materiality assessments but that value comes from using data for strategy. Together they illustrate the move from SF 1.0 labels to SF 2.0 integration described in the textbook.","kt":"","src":"Folketrygdfondet s. 26 · Fondsfinans s. 16 · Fondsfinans s. 21 · PwC s. 13"},{"id":"SB485","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A fund holds a renewable equipment maker hit by a forced-labour allegation in its polysilicon supply chain. Following Brooks' guide, what should the manager do first?","o":[["Sell immediately without analysis.","Divestment is one option, chosen after assessment."],["Publicly praise the company to support the share price.","Not a risk-management step."],["Ignore it, since renewable firms are sustainable by definition.","A green product does not remove S risks."],["Assess severity, financial materiality, pricing and the desired outcome.","Then choose: do nothing, reduce/divest, or engage to make a difference."]],"c":[3],"es":"Assess first, then manage (nothing / reduce / engage) and disclose.","ed":"Brooks' guide: decide what you screen for, identify and assess the risk (severity, materiality, market pricing, desired outcome), manage it, and disclose results. Green companies can still have material social risks, as solar supply chains show.","kt":"Desired outcome: what the investor wants to achieve - reduce financial risk, reduce reputational risk, or \"make a difference\" (MAD).","src":"Fondsfinans s. 23 · Fondsfinans s. 24"},{"id":"SB486","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"L","sc":"short","s":"Folketrygdfondet reports a positive excess return versus its benchmark over many years and attributes part of it to \"quality companies\" and \"avoiding over-optimism\". Why does long-run, not single-year, excess return matter more for judging this active, ESG-integrated strategy?","o":[["A single year always proves skill.","One year is too short to judge."],["Benchmarks should be changed every year.","Stable benchmarks make performance comparable."],["ESG integration pays off slowly, so short periods are noise.","Long horizons are needed to separate skill from luck."],["Excess returns are irrelevant for active managers.","Value added versus the benchmark is the key test."]],"c":[2],"es":"Judge active, long-term strategies over long horizons.","ed":"This mirrors the textbook's critique of short evaluation horizons (Lecture 8) and supports alternative performance measures such as absolute and multi-year targets.","kt":"Excess return (active return): portfolio return minus benchmark return.","src":"Folketrygdfondet s. 8 · Folketrygdfondet s. 11 · Bok s. 195 (7.3.5)"},{"id":"SB487","l":"L13","t":"Institutional investors","f":"m","d":3,"p":"M","sc":"short","s":"Climate Action 100+ was formed in 2017 so that hundreds of investors could jointly engage the largest corporate emitters. Why does the textbook expect such coalitions to be more effective than individual investors?","o":[["Coalitions remove the need for any monitoring of members.","Effective coalitions need monitoring and sanctions."],["Individual investors are banned from engaging.","They are not banned."],["Coalitions can legally force companies to change.","They rely on influence, not legal power."],["Pooled ownership raises leverage and engagement success.","Dimson, Karakaş and Li find collaboration increases engagement success."]],"c":[3],"es":"Pooling stakes increases leverage and success rates.","ed":"Institutional investors own about 65% of developed-market equity, so coordinated action is powerful. But coalitions face free riding and exits: several large managers left Climate Action 100+ in 2024 amid political pressure.","kt":"Collective engagement: several investors coordinating dialogue with a company to increase their influence.","src":"L13 slide 4-5 · Bok s. 111 (4.3.1) · Bok s. 104 (Table 4.1)"},{"id":"SB488","l":"L13","t":"System approach","f":"m","d":2,"p":"H","sc":"none","s":"How does Ostrom (1990) propose governing common-pool resources such as the atmosphere?","o":[["Only through central government taxation.","Ostrom looks beyond centralised regulation."],["Only by assigning private property rights to individuals.","She looks beyond private property rights too."],["Through coalitions that set, monitor and enforce their own rules.","With graduated sanctions and dispute resolution."],["By letting each user act in self-interest, since markets self-correct.","That leads to the tragedy of the commons."]],"c":[2],"es":"Voluntary coalitions with own rules, monitoring, graduated sanctions and conflict resolution.","ed":"The tragedy of the commons arises when individuals deplete a shared resource. Standard remedies are taxation, regulation or property rights, but a purely regulatory approach to carbon has been elusive. Ostrom shows communities can govern commons through coalitions with clear boundaries, rules made with those affected, monitoring and sanctions. The Paris Agreement is a country-level coalition; PRI or the Equator Principles are private ones.","kt":"","src":"L13 slide 3-9 · Bok s. 104 (4.2) · Bok s. 105 (4.2)"},{"id":"SB489","l":"L13","t":"System approach","f":"m","d":3,"p":"H","sc":"none","s":"McElroy's sustainability quotient is SP = AI / NI (actual impact over normative impact). For an ecological quotient such as carbon, when is a company sustainable?","o":[["When SP ≤ 1, i.e. within its fair share of the threshold","For ecological quotients SP ≤ 1 is sustainable, SP > 1 unsustainable."],["When SP > 1, i.e. impact exceeds the norm","This is unsustainable for ecological quotients."],["When its ESG rating is above the industry average","Ratings measure the numerator only, without system thresholds."],["Whenever its emissions fall year on year","Improvement alone says nothing about the threshold."]],"c":[0],"es":"Ecological: SP ≤ 1 sustainable; social: SP ≥ 1 sustainable. Impact is judged against system thresholds.","ed":"The innovation is relating a company's actual impact (numerator) to a normative impact derived from system thresholds such as a carbon budget (denominator). ESG ratings and integrated reports measure only the numerator (Lecture 7). For social quotients (e.g. living wages), SP ≥ 1 is sustainable. Thurm et al. call this context-based sustainability (Reporting 3.0).","kt":"","src":"Bok s. 105 (4.2) · Bok s. 168 (6.3.3)"},{"id":"SB490","l":"L13","t":"Role of players","f":"m","d":3,"p":"H","sc":"short","s":"Norway's government faces elections every four years but must cut emissions over decades. According to Table 3.1 (Lecture 13), which threat to government as a sustainability player does this illustrate?","o":[["A short horizon that makes it hard to act for future generations","Table 3.1 gives governments a horizon of up to four years and lists \"dealing with future generations\" as a threat."],["Marking to market of investments","That is a threat for investors."],["Fragmentation into single-issue campaigns","That is a threat for civil society."],["Poverty and aversion to change","These are threats listed for households."]],"c":[0],"es":"Government horizon ≈ election cycle → hard to serve future generations.","ed":"Governments have the strongest tools (taxation, regulation, carbon pricing) but short horizons, policy differences and free riding between countries limit them. That is why the lecture stresses supranational coalitions (UN/COP, IPCC, Paris) and private coalitions as complements.","kt":"Table 3.1: each player (government, civil society, corporates, investors, households) has a sphere of influence, horizon, mechanisms, opportunities and threats.","src":"L13 slide 8-9 · Bok s. 84 (Table 3.1)"},{"id":"SB491","l":"L13","t":"Coalitions","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A new \"Nordic Net-Zero Investor Alliance\" has members covering 60% of Nordic AUM, ambitious principles, but no reporting requirement and no consequences for members that miss targets. Using Ostrom's principles, what is the main weakness?","o":[["Principles are too ambitious to matter.","Ambition is a strength if enforced."],["No monitoring or sanctions, so free riding is likely.","Monitoring and graduated sanctions are key design principles."],["Coverage is too high to be effective.","High coverage (clear boundaries) is a strength."],["Coalitions must be government-run to work.","Ostrom shows self-governed coalitions can work."]],"c":[1],"es":"Without monitoring and sanctions, coalitions invite free riding.","ed":"The textbook finds enforcement is the weak spot of most sustainable finance coalitions; only WBCSD can expel members. Reporting alone already gives incentives, but sanctions are more effective.","kt":"Ostrom's design principles: clear boundaries, rules restricting use, collective choice, monitoring, graduated sanctions, conflict resolution.","src":"L13 slide 6-7 · Bok s. 111 (4.3.1) · Bok s. 112 (Table 4.3) · Bok s. 113 (4.3.1)"},{"id":"SB492","l":"L13","t":"Coalitions","f":"m","d":3,"p":"H","sc":"none","s":"What relationship does the textbook find between the size of sustainable finance coalitions and the ambition (SF typology) of their principles?","o":[["No relationship at all.","The textbook finds a clear inverse relationship."],["A positive relationship: the largest coalitions are the most ambitious (SF 3.0).","The largest are the least ambitious."],["All coalitions are SF 3.0 regardless of size.","Most are SF 1.0/2.0."],["An inverse relationship: large coalitions are less ambitious; SF 3.0 ones are tiny.","Larger coalitions sit between SF 1.0 and 2.0."]],"c":[3],"es":"Bigger coalitions → lower ambition (SF 1.0/2.0); SF 3.0 coalitions (GIIN, GABV) → tiny coverage.","ed":"Coalitions covering 20-40% of their sector include social and environmental factors but do not prioritise them over profit. SF 3.0 coalitions put people and planet first with finance as a viability constraint, but cover less than 1%. A positive dynamic: members tend to tighten principles over successive versions. PRI and WBCSD have well-defined, monitored principles, closer to SF 2.0.","kt":"","src":"L13 slide 3-9 · Bok s. 113 (4.3.1)"},{"id":"SB493","l":"L13","t":"Coalitions","f":"m","d":2,"p":"M","sc":"none","s":"Which is one of the reasons the textbook gives for joining a sustainable finance coalition?","o":[["Collective engagement, which raises engagement success rates","Dimson, Karakaş and Li show collaboration increases success."],["Escaping government regulation entirely","Private and public initiatives reinforce each other."],["Avoiding all monitoring of the organisation's behaviour","Effective coalitions require monitoring."],["Guaranteed higher short-term profits","Coalitions have a long-term focus."]],"c":[0],"es":"Peer effects, outside pressure, reputation, risk avoidance (stranded assets), collective advocacy, collective engagement.","ed":"Members may be intrinsically or instrumentally motivated to pursue LTVC. Joining can avoid competitive disadvantage (peers), respond to NGO and consumer pressure, build reputation (sometimes just marketing), avoid stranded-asset risk, lobby governments to reduce policy uncertainty, and engage collectively. The main risk is free riding: enjoying benefits without following the rules.","kt":"","src":"L13 slide 3-9 · Bok s. 110 (4.3.1) · Bok s. 111 (4.3.1)"},{"id":"SB494","l":"L13","t":"Coalitions","f":"m","d":3,"p":"H","sc":"none","s":"Using Ostrom's design principles, what does the textbook identify as a clear weak spot of many sustainable finance coalitions?","o":[["Weak enforcement: few sanctions or conflict-resolution mechanisms.","Only WBCSD can expel members and has a (partial) conflict mechanism."],["Too many members from emerging markets.","Members come from North America, Europe and Asia."],["Lack of any stated principles in all coalitions.","Several, like PRI and WBCSD, have well-defined principles."],["Excessively strict sanctions that deter membership.","Sanctions are mostly absent."]],"c":[0],"es":"Six criteria: boundaries, membership rules, collective choice, monitoring, sanctions/rewards, conflict resolution. Enforcement is the weak spot.","ed":"Monitoring varies - the Equator Principles Association leaves monitoring to members and does not verify content, while WBCSD reviews and benchmarks members' sustainability reports. Reporting itself is a powerful incentive, but sanctions are more effective; most coalitions have none or only for their board. Coalitions should also avoid quarterly benchmarking to allow long-term solutions to develop.","kt":"","src":"L13 slide 3-9 · Bok s. 111 (4.3.1) · Bok s. 113 (4.3.1) · Bok s. 114 (4.3.1)"},{"id":"SB495","l":"L13","t":"Government policy","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: Green steel costs 25% more than conventional steel (its \"green premium\"). Lecture 13 argues governments should \"level the playing field\". Which policy does this refer to most directly?","o":[["Banning all steel imports","Not the mechanism described."],["Cutting R&D funding to save public money","The lecture calls for more R&D on hard-to-abate sectors."],["Gradually raising the carbon price so fossil steel bears its true cost","A carbon price closes the green premium by pricing the externality."],["Letting markets ignore emissions until technology is cheaper","Without a price signal, the green premium persists."]],"c":[2],"es":"Carbon pricing levels the playing field and shrinks green premiums.","ed":"The slides list: mind the investment gap, level the playing field (carbon price), overcome non-market barriers, keep policies up to date, plan a just transition, do the hard stuff (R&D), and pull technology, policy and market levers together. Lower green premiums also improve green firms' value drivers.","kt":"Green premium: the extra cost of choosing a zero-carbon option over a fossil one.","src":"L13 slide 11-12 · L3 slide 19"},{"id":"SB496","l":"L13","t":"Coalitions","f":"m","d":2,"p":"L","sc":"none","s":"How does the textbook see the relationship between private sustainability coalitions and government regulation?","o":[["They are substitutes: coalitions make regulation unnecessary.","The textbook calls for both in parallel."],["They reinforce each other: private action can pave the way for public rules.","Public endorsement can in turn strengthen private coalitions."],["Coalitions should lobby against all sustainability regulation.","Collective advocacy aims to clarify and support sustainable policy."],["Regulation always undermines private coalitions.","The textbook sees complementarity."]],"c":[1],"es":"Private coalitions and public rules are complements.","ed":"The chapter recommends research on effective coalitions in parallel with regulatory initiatives addressing externalities. Examples of the interplay: voluntary Brazilian Green Protocol followed by central bank rules (Lecture 11); TCFD (a private-led task force) feeding into mandatory ESRS and ISSB standards.","kt":"","src":"L13 slide 3-9 · Bok s. 111 (4.3.1) · Bok s. 114 (4.4)"},{"id":"SB497","l":"L13","t":"Transition dynamics","f":"m","d":2,"p":"H","sc":"none","s":"According to the x-curve of transition dynamics (Loorbach et al., Figure 12.1), how do transitions unfold?","o":[["Through a single regulatory decision that instantly replaces the old regime.","Transitions take decades and are iterative."],["As smooth, incremental optimisation of the existing regime.","Incremental optimisation is what the incumbent regime does; transitions are non-linear."],["Only through the breakdown of the old regime, with nothing new emerging.","Build-up of a new regime happens in parallel."],["A new regime builds up while the old one breaks down, non-linearly.","Experimentation, acceleration and institutionalisation vs destabilisation and phase-out."]],"c":[3],"es":"X-curve: build-up (experimentation → acceleration → institutionalisation) and breakdown (optimisation → destabilisation → phase-out) over decades.","ed":"Incumbent regimes optimise path-dependently while change agents experiment with alternatives. Pressure destabilises the regime, alternatives accelerate, the transition becomes chaotic and disruptive, and new combinations form a new regime while non-transforming elements are phased out. In finance, applying ESG ratings (screening, best-in-class) is incremental optimisation within the old regime; fundamental integrated analysis and engagement are transformative experiments.","kt":"","src":"Bok s. 352 (12.1) · Bok s. 352 (Figure 12.1) · Bok s. 353 (12.1)"},{"id":"SB498","l":"L13","t":"Transition dynamics","f":"m","d":3,"p":"H","sc":"none","s":"According to chapter 12, which practice is an INCREMENTAL change within the current financial regime rather than a transformative one?","o":[["Optimising integrated value as the guiding principle","This is the new regime's guiding principle."],["Concentrated portfolios based on fundamental analysis of LTVC","This is a transformative experiment."],["Applying ESG ratings for negative screening or best-in-class selection","These optimise within a regime still based on market benchmarks."],["Integrated teams that make investment decisions and engage on long-term strategy","This is described as the new regime."]],"c":[2],"es":"Incremental: ratings-based screening within benchmark thinking. Transformative: integrated value, fundamental analysis, integrated engagement.","ed":"In the incumbent regime, maximising financial return subject to risk remains the objective, sometimes with a moral overlay (no fur or tobacco). These incremental changes are not durable and open space for alternatives. The new regime optimises integrated value (financial, social, environmental) subject to integrated risk, with engagement as part of the investment process.","kt":"","src":"Bok s. 353 (12.1) · Bok s. 356 (12.1.1.1)"},{"id":"SB499","l":"L13","t":"Transition management","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Backcasting starts from today's situation and extrapolates current trends forward to see where they will lead by 2050.","o":[["True","Incorrect. That is forecasting. Backcasting starts from a desired long-term vision and works backwards to pathways, stepping stones and concrete short-term actions."],["False","Correct. That is forecasting. Backcasting starts from a desired long-term vision and works backwards to pathways, stepping stones and concrete short-term actions."]],"c":[1],"es":"False: backcasting starts from the desired future and works back to today's actions.","ed":"Transition governance moves from vision (strategic) to transition agenda and pathways with stepping stones (tactical), concrete actions and experiments (operational), and monitoring (reflexive). Backcasting is the move from long-term thinking to short-term action; it is used in the transition arena process together with problem structuring and envisioning.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (Figure 12.2) · Bok s. 354 (12.1.1)"},{"id":"SB500","l":"L13","t":"Transition management","f":"m","d":2,"p":"H","sc":"none","s":"What is the \"new vision\" for the financial sector proposed in chapter 12?","o":[["Invest in, lend to and engage with companies pursuing LTVC, consistent with the SDGs.","Using finance's allocation role to steer the corporate sector."],["Finance green infrastructure projects only when public subsidies are available.","The textbook criticises a project-based, subsidy-dependent approach as too narrow."],["Maximise financial return subject to risk, adding ethical exclusions.","This is the incumbent regime."],["Replace private finance with government development banks.","Not the textbook's vision."]],"c":[0],"es":"New vision: invest, lend and engage for LTVC aligned with the SDGs by 2030; guiding norm = optimise integrated value.","ed":"Corporates play a key role through their products (SDG contributions) and production processes. The financial sector should allocate capital to positive-impact companies and divest from or stop lending to negative-impact ones. Rebooting finance from managing financial value to managing integrated value avoids subsidy-seeking, project-by-project approaches.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (12.1.1.1) · Bok s. 355 (12.1.1.1) · Bok s. 356 (12.1.1.1)"},{"id":"SB501","l":"L13","t":"Transition management","f":"m","d":3,"p":"M","sc":"none","s":"In Loorbach's transition management framework (Figure 12.4), which instrument operates at the STRATEGIC level?","o":[["Transition experiments, such as pilot concentrated portfolios","Experiments are operational."],["Transition agendas and pathways","Agendas are tactical."],["Transition arenas: problem structuring, envisioning and backcasting","Example: the TCFD, which brought investors and companies together."],["Transition monitoring and evaluation","Monitoring is reflexive."]],"c":[2],"es":"Strategic: transition arenas. Tactical: scenarios and agenda (e.g. PRI, FCLTGlobal). Operational: experiments. Reflexive: monitoring.","ed":"Transition arenas involve selective participation by transformative actors (front-runners, radical outsiders) who structure problems and develop visions; examples are the TCFD, the Natural Capital Coalition and Reporting 3.0. At the tactical level, coalitions align goals and push for structural and regulatory change. Experiments (e.g. allocating 5-10% of portfolios to SDG themes) test new practices; monitoring feeds learning back into the process.","kt":"","src":"L13 slide 13-16 · Bok s. 359 (Figure 12.4) · Bok s. 359 (12.2) · Bok s. 360 (12.2)"},{"id":"SB502","l":"L13","t":"Transition management","f":"m","d":2,"p":"M","sc":"none","s":"Which of the following does the textbook describe as a TRUE experiment in the new regime (rather than optimisation within the old one)?","o":[["Adding an ESG rating screen to an index fund","This only scratches the surface within the current regime."],["Allocating a small part of portfolios to SDG-contributing themes or companies","Described as true experiments in the new regime."],["Publishing a stand-alone CSR report alongside the annual report","This is the silo approach of the old regime."],["Benchmarking managers against a market index every quarter","This is incumbent-regime practice."]],"c":[1],"es":"Experiments: SDG-themed allocations, front-runners with concentrated, engaged portfolios (Alecta), green bonds (Amundi), impact loans (VBBs).","ed":"Financial institutions are \"tiptoeing\" into SF: first applying ESG ratings (scratching the surface), then allocating small parts to SDG themes (true experiments), and a few front-runners doing fundamental analysis and engagement with concentrated holdings. Better information (integrated reporting, TCFD, SDG-linked data) and better investor-company dialogue support these experiments.","kt":"","src":"L13 slide 13-16 · Bok s. 357 (12.1.1.3) · Bok s. 358 (12.1.1.3)"},{"id":"SB503","l":"L13","t":"Government policy","f":"m","d":3,"p":"M","sc":"short","s":"Coal regions such as Poland's Silesia face job losses as coal is phased out. Which policy best reflects the \"just transition\" principle in Lecture 13?","o":[["Keep coal mines open indefinitely to protect jobs.","This blocks the transition."],["Fund retraining and new local industries while phasing out coal.","A just transition shares the costs fairly and helps affected communities adapt."],["Leave affected workers to private charities.","The lecture gives governments a role through funding and advice."],["Close the mines overnight with no support.","This ignores the social costs a just transition addresses."]],"c":[1],"es":"Just transition = support affected communities while decarbonising.","ed":"Without a just transition, opposition can slow climate policy. PwC also stresses that \"a just transition is our common goal\". For investors, social acceptance is part of the policy risk in transition scenarios.","kt":"Just transition: moving to a low-carbon economy in a way that is fair to affected workers and communities.","src":"L13 slide 12 · PwC s. 47"},{"id":"SB504","l":"L13","t":"Role of players","f":"m","d":2,"p":"M","sc":"short","s":"Greenpeace runs a media campaign and mobilises public opinion against a bank financing a new oil pipeline. According to Table 3.1, which player and mechanism is this?","o":[["Investors using lending strategy","Greenpeace is not a lender."],["Civil society using public voice and media","NGOs act through debate, media and social pressure."],["Households using purchasing decisions","This is an organised NGO campaign, not household consumption."],["Government using taxation","Greenpeace has no power to tax."]],"c":[1],"es":"NGO campaign = civil society, via media and public voice.","ed":"Civil society's strengths are agenda setting and stimulating citizenship of companies and investors; its threats are single-issue focus and fragmentation. Such campaigns can raise reputational risk for financiers (Equator Principles, Dakota Access Pipeline).","kt":"Civil society: NGOs, media and citizens' groups that influence through public debate, campaigns and social pressure.","src":"L13 slide 9 · Bok s. 300 (Box 10.3)"},{"id":"SB505","l":"L13","t":"Government policy","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Lecture 13 argues that technology, policy and markets are three levers that must be pulled at the same time and in the same direction; pulling only one of them (e.g. R&D subsidies) is unlikely to be enough.","o":[["True","Correct. The slide says the three levers must be pulled together to wean economies off fossil fuels."],["False","Incorrect. The slide says the three levers must be pulled together to wean economies off fossil fuels."]],"c":[0],"es":"True: the levers reinforce each other.","ed":"R&D lowers future green premiums, carbon prices create demand, and markets scale up solutions (helping innovators across the \"valley of death\"). The investment gap needs public and private finance together.","kt":"Policy mix: combining technology support (R&D), policy (prices, regulation) and market development to drive a transition.","src":"L13 slide 11-12"},{"id":"SB506","l":"L13","t":"Role of players","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A Norwegian pension fund wants to support the transition but evaluates managers quarterly, invests through several layers of external managers, and must mark illiquid assets to market. Which threat from Table 3.1 does it face?","o":[["Lack of trust in government","This is listed for households."],["A long investment chain","Listed as an investor threat (see also Lecture 8)."],["Election cycles of up to four years","This is a government threat."],["Single-issue campaigning","This is a civil society threat."]],"c":[1],"es":"Quarterly benchmarking and long chains undermine investors' long-term role.","ed":"This ties Lecture 13 back to Lecture 8: the six conditions for LTVC (long horizons, concentration, engagement, real-economy performance, aligned mandates, short chains) are answers to exactly these threats. Also correct: Short-termism from monthly/quarterly benchmarking.","kt":"Investor mechanisms (Table 3.1): investment strategy, lending strategy and engagement; threats include short-termism, long investment chains, marking to market and supervisory treatment of illiquid investments.","src":"L13 slide 9 · L8 slide 72 · Bok s. 202 (Figure 7.6)"},{"id":"SB507","l":"L13","t":"Transition management","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: In the textbook's transition management framework, a bank piloting an impact-lending unit for 5% of its loan book, monitoring results and scaling up if successful is an example of transition experiments feeding back into the agenda.","o":[["True","Correct. Experiments at the operational level are monitored (reflexive level) and the lessons feed back into vision and agenda."],["False","Incorrect. Experiments at the operational level are monitored (reflexive level) and the lessons feed back into vision and agenda."]],"c":[0],"es":"True: experiment → monitor → scale is the transition management loop.","ed":"Loorbach's framework links strategic arenas, tactical agendas, operational experiments and reflexive monitoring. Allocating 5-10% of portfolios to SDG themes is the textbook's own example of a true experiment in the new regime.","kt":"Transition experiments: small-scale trials of alternative practices that, if successful, are scaled up and institutionalised.","src":"L13 slide 14-16 · Bok s. 357 (12.1.1.3) · Bok s. 359 (12.2)"},{"id":"SB508","l":"L13","t":"Role of players","f":"m","d":2,"p":"M","sc":"none","s":"Why does Lecture 13 stress supranational coalitions such as the IPCC, the UN climate conferences (COP) and the Paris Agreement, rather than national policy alone?","o":[["National governments have no influence on emissions.","They set taxes, regulation and carbon prices."],["Supranational bodies replace the need for private coalitions.","Public and private coalitions complement each other."],["The IPCC sets binding carbon taxes for all countries.","The IPCC assesses science; it does not set taxes."],["Climate is a global commons; national action alone invites free riding.","Supranational coalitions build shared understanding and coordinate action."]],"c":[3],"es":"Global commons → coordination via supranational coalitions.","ed":"The slide lists the roles of governments: understanding challenges (research), forming supranational coalitions, setting priorities, laws, taxation, carbon pricing, and monitoring and sanctioning deviations. Free riding between countries is the classic threat (Table 3.1).","kt":"IPCC: the UN body assessing climate science; it informs policy but does not set binding rules.","src":"L13 slide 8 · L13 slide 10"},{"id":"SB509","l":"L13","t":"Transition synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A Norwegian pension fund wants to move from SF 1.0 towards SF 2.0-3.0. Which sequence best follows the textbook's transition management logic?","o":[["Set a long-term vision, backcast, run small experiments, monitor and scale up.","Vision → agenda/pathways → experiments → monitoring, per Loorbach."],["Wait until regulators prescribe exactly how to invest sustainably.","The textbook expects private front-runners to lead alongside regulation."],["Keep the current benchmark approach and add more exclusions each year.","This is incremental optimisation within the old regime."],["Immediately sell all holdings and invest only in impact funds.","Transitions are iterative; abrupt moves ignore learning and scale constraints (impact funds are small)."]],"c":[0],"es":"Vision (LTVC/SDGs) → backcasting → pathways and coalitions → experiments → monitoring and scaling.","ed":"The fund would formulate a vision (optimise integrated value, contribute to the SDGs), backcast to pathways (e.g. growing concentrated, fundamental, engaged mandates; joining coalitions such as PRI), run experiments (an SDG-themed sleeve, integrated investment-engagement teams), and monitor results to scale up. Cultural change (leadership, education, intrinsic motivation) is needed for this to last.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (12.1.1) · Bok s. 359 (12.2) · Bok s. 361 (12.3)"},{"id":"SB510","l":"L13","t":"Integrated thinking","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: An asset manager where portfolio managers themselves lead engagement on material ESG issues, rather than handing it to a separate ESG team, is moving engagement from a staff function to a line function, as the textbook recommends.","o":[["True","Correct. The textbook recommends integrated teams that both decide on investments and engage with companies."],["False","Incorrect. The textbook recommends integrated teams that both decide on investments and engage with companies."]],"c":[0],"es":"True: engagement becomes part of the investment process.","ed":"Separate ESG teams often lack knowledge of the investment case and engage on immaterial issues (Lecture 8). Folketrygdfondet, where portfolio managers sit in nomination committees, is a practical example of integrated engagement.","kt":"Line function vs staff function: line functions make the core decisions (investing, lending); staff functions advise or support from the side.","src":"Bok s. 361 (12.3) · Bok s. 362 (12.3) · Folketrygdfondet s. 24"},{"id":"TR60","l":"L13","t":"Coalitions","f":"m","d":3,"p":"M","sc":"none","s":"According to the lecture on coalitions, what goes wrong if a sustainability coalition sets its membership boundary far too broadly?","o":[["Membership then signals little","Too broad boundaries make membership meaningless as a signal."],["It turns the coalition into an SF 3.0 impact network","Breadth does not change the coalition's SF type."],["Almost no institution can meet the requirements","That is the problem of boundaries that are too narrow."],["Members are automatically fined by regulators","Most coalitions are voluntary and rarely have sanctions."]],"c":[0],"es":"Too broad = meaningless; too narrow = nobody qualifies.","ed":"Design principles (from Ostrom, via the textbook): clear boundaries, membership rules, collective choice, monitoring, sanctions and rewards, conflict resolution. In practice sanctions are rare, since most coalitions are voluntary.","kt":"","src":"Opptak L12 ca. 54 min"},{"id":"TR61","l":"L13","t":"Coalitions","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A mid-sized asset manager joins an investor climate coalition mainly so that its engagement with large emitters carries more weight. Which motive and course theory fit best?","o":[["Reputation, matching the efficient market hypothesis","Reputation links to signalling, not the EMH."],["Risk avoidance, matching Akerlof's lemons problem","The aim described is influence, not avoiding hidden-quality risk."],["Outside pressure, matching consumer boycotts","No external pressure is described here."],["Collective engagement, as coordinated engagement works better","Coordinated engagement raises success rates (Dimson et al.)."]],"c":[3],"es":"Joining to engage together = collective engagement.","ed":"Motives in the lecture: collective advocacy and engagement (link: coordinated engagement papers), reputation and peer effects (link: signalling, like green bonds), outside pressure (consumers, investors, NGOs), and risk avoidance (link: integrating E and S into risk management).","kt":"","src":"Opptak L12 ca. 51 min"},{"id":"TR62","l":"L13","t":"Transition management","f":"m","d":3,"p":"M","sc":"none","s":"In the transition management interview shown in the final lecture, what is described as the biggest challenge for sustainability transitions?","o":[["Inventing the basic technologies, which do not yet exist","The speaker says superior technologies often already exist."],["Changing institutions, behaviour and culture","\"Technology is the least of our problems\" in many areas."],["Replacing all small experiments with one global plan","Transition management builds on small experiments."],["Raising interest rates to slow economic growth","Monetary policy is not discussed."]],"c":[1],"es":"The hard part is institutional and behavioural change.","ed":"Transitions combine bottom-up experiments that scale up with the destabilisation of the dominant regime (e.g. fossil energy). Transition management uses backcasting: envision the future, then work backwards to stepping stones and concrete actions today.","kt":"","src":"Opptak L12 ca. 60 min · Opptak L12 ca. 64 min"}]</script>
<script>
(function(){
const BANK = JSON.parse(document.getElementById('bank').textContent);
const BYID = Object.fromEntries(BANK.map(q => [q.id, q]));
const LECS = [['L1','Introduction'],['L2','Business ethics'],['L3','Externalities'],['L4','Shareholder vs stakeholder'],['L5','Governance'],['L6','Business models'],['L7','Metrics and reporting'],['L8','Investing for LTVC'],['L9','ESG integration and asset prices'],['L10','Non-equity asset classes'],['L11','Banking'],['L12','Insurance'],['L13','Coalitions and transition'],['GUEST','Guest lectures']];
const LECNAME = Object.fromEntries(LECS);
const ICON = {
  practice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h6"/></svg>',
  exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
  wrong:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  flagged:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
const MODES = [
  ['practice','Practice','Answer and see the explanation right away'],
  ['exam','Exam','No answers until you submit'],
  ['wrong','Review mistakes','Questions you last got wrong'],
  ['flagged','Flagged','Questions you have flagged']];
const FMTS = [['m','Multiple choice'],['t','True / false']];
const SCN = {short:'Case', extended_course_case:'Course case', constructed_scenario:'Scenario'};
const STORE = 'fie459-progress-v1';
const EXAM = new Date(2026, 11, 16);

// ---------- storage (per browser) ----------
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && s.p) return s; }catch(e){} return {p:{}, flags:[], set:null}; }
let DB = load();
let FLAGS = new Set(DB.flags || []);
function save(){ try{ DB.flags=[...FLAGS]; localStorage.setItem(STORE, JSON.stringify(DB)); }catch(e){} }
function rec(id, ok){ const r = DB.p[id] || {n:0,k:0,last:0}; r.n++; if(ok) r.k++; r.last = ok?1:-1; DB.p[id]=r; save(); }

// ---------- settings ----------
const S = Object.assign({mode:'practice', lecs:LECS.map(l=>l[0]), fmts:['m','t'], prio:'all', count:20, smart:true}, DB.set || {});
function saveSet(){ DB.set = S; save(); }

// ---------- helpers ----------
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){ const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='on') for(const ev in v) e.addEventListener(ev, v[ev]);
    else if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else e.setAttribute(k, v===true?'':v); }
  for(const c of kids.flat()) if(c!=null && c!==false) e.append(c instanceof Node ? c : document.createTextNode(c));
  return e;
}
const app = document.getElementById('app');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function setNav(v){ document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.view===v))); }
function sameSet(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }
function fmtTime(s){ const m=Math.floor(s/60), ss=s%60; return (m>=60? Math.floor(m/60)+':'+String(m%60).padStart(2,'0') : m)+':'+String(ss).padStart(2,'0'); }
function lecStats(l){ const qs=BANK.filter(q=>q.l===l); let seen=0,k=0,w=0; for(const q of qs){const r=DB.p[q.id]; if(r){seen++; if(r.last>0)k++; else w++;}} return {n:qs.length,seen,k,w}; }
function lecLabel(id){ return id==='GUEST' ? 'Guest' : id; }
function daysLeft(){ const t=new Date(); t.setHours(0,0,0,0); return Math.max(0, Math.round((EXAM - t)/864e5)); }
function ring(pct, size){
  const r=54, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function bar(k, w, n){ return h('span',{class:'bar'}, h('i',{class:'k',style:`width:${n?k/n*100:0}%`}), h('i',{class:'w',style:`width:${n?w/n*100:0}%`})); }
function tfText(o){ return o[0]==='True' ? 'True' : 'False'; }
function keyFor(q, pos){ return q.f==='t' ? (pos?'F':'T') : String.fromCharCode(65+pos); }

function pool(){
  return BANK.filter(q => S.lecs.includes(q.l) && (S.fmts.includes(q.f)||!S.fmts.some(f=>f==='m'||f==='t')) && (S.prio==='all' || q.p==='H')
    && (!S.trOnly || q.id.startsWith('TR'))
    && (S.mode!=='wrong' || (DB.p[q.id] && DB.p[q.id].last<0))
    && (S.mode!=='flagged' || FLAGS.has(q.id)));
}

// ---------- setup view ----------
function renderSetup(){
  setNav('setup'); stopTimer(); clearSes(); SES = null; app.replaceChildren();
  const all = Object.values(DB.p), seen = all.length, lastOk = all.filter(r=>r.last>0).length, lastBad = seen-lastOk;
  const pct = lastOk/BANK.length;
  app.append(h('div',{class:'stack'},
    h('div',null, h('h1',{text:'Train for the exam'}),
      h('p',{class:'lead', text:`${BANK.length} questions from every lecture, the textbook and the guest lectures. Single-answer multiple choice and true/false, just like the exam, with an explanation and source for every answer.`})),
    h('div',{class:'panel dash'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'mastered'})))),
      h('div',{class:'tiles'},
        h('div',{class:'tile exam'}, h('b',{text:String(daysLeft())}), h('span',{text:'days to exam · 16 Dec'})),
        h('div',{class:'tile'}, h('b',{text:`${seen}`}), h('span',{text:`of ${BANK.length} seen`})),
        h('div',{class:'tile'}, h('b',{text:`${lastBad}`}), h('span',{text:'to review'})),
        h('div',{class:'tile'}, h('b',{text:`${FLAGS.size}`}), h('span',{text:'flagged'})))),
    block('Mode', h('div',{class:'seg', role:'group'}, MODES.map(([k,t,d]) =>
      h('button',{id:'mode-'+k,'aria-pressed':String(S.mode===k), on:{click:()=>{S.mode=k; saveSet(); renderSetup();}}},
        h('span',{class:'ic', html:ICON[k]}), h('b',{text:t}), h('span',{class:'d',text:d}))))),
    block('Lectures', [
      h('div',{class:'lecs'}, LECS.map(([id,name]) => { const st=lecStats(id);
        return h('button',{class:'lec', id:'lec-'+id, 'aria-pressed':String(S.lecs.includes(id)), title:`${st.k} correct, ${st.w} wrong last time, of ${st.n}`,
          on:{click:()=>{ S.lecs = S.lecs.includes(id)? S.lecs.filter(x=>x!==id) : [...S.lecs,id]; saveSet(); renderSetup(); }}},
          h('span',{class:'code',text:lecLabel(id)}), h('span',{class:'name',text:name}), h('span',{class:'n',text:`${st.seen}/${st.n}`}),
          bar(st.k, st.w, st.n)); })),
      h('div',{class:'row'},
        h('button',{class:'linkbtn', id:'lec-all', on:{click:()=>{S.lecs=LECS.map(l=>l[0]); saveSet(); renderSetup();}}, text:'Select all'}),
        h('button',{class:'linkbtn', id:'lec-none', on:{click:()=>{S.lecs=[]; saveSet(); renderSetup();}}, text:'Clear all'}))]),
    block('Question type', h('div',{class:'row'}, FMTS.map(([k,t]) => chip('fmt-'+k, t, S.fmts.includes(k), ()=>{ S.fmts = S.fmts.includes(k)? S.fmts.filter(x=>x!==k):[...S.fmts,k]; }))),
      h('div',{class:'row'}, chip('prio-all','All priorities',S.prio==='all',()=>S.prio='all'), chip('prio-h','High priority only',S.prio==='H',()=>S.prio='H'), chip('tr-only','New from lecture recordings',!!S.trOnly,()=>S.trOnly=!S.trOnly))),
    block('Number of questions', h('div',{class:'row'}, [10,20,40,80,0].map(n => chip('count-'+n, n?String(n):'All', S.count===n, ()=>S.count=n)),
      S.mode==='practice' ? chip('smart','Unseen and wrong first', S.smart, ()=>S.smart=!S.smart) : null)),
    startBar()
  ));
}
function block(label, ...kids){ return h('section',{class:'block'}, h('p',{class:'label',text:label}), ...kids); }
function chip(id, text, on, fn){ return h('button',{class:'chip', id, 'aria-pressed':String(on), on:{click:()=>{fn(); saveSet(); renderSetup();}}, text}); }
function startBar(){
  const p = pool(), n = S.count ? Math.min(S.count, p.length) : p.length;
  const msg = p.length ? [h('b',{text:String(n)}), ` questions of ${p.length} available`]
    : [S.mode==='wrong' ? 'No mistakes to review yet.' : S.mode==='flagged' ? 'You have not flagged any questions yet.' : 'No questions match your filters.'];
  return h('div',{class:'startbar'}, h('span',{class:'info'}, msg),
    h('button',{class:'primary', id:'start', disabled:!p.length, on:{click:()=>startSession(p, n)}, text: S.mode==='exam' ? 'Start exam' : 'Start'}));
}

// ---------- session ----------
let SES = null, timer = null;
const SESKEY = 'fie459-session-v1';
