 annual report; CDP: own platform","Slide 4 lists exactly this difference."],["Neither is public","Both are disclosure frameworks."],["Both only in separate CSR reports","TCFD aims for mainstream annual filings; CDP has its own platform."]],"c":[1],"es":"TCFD: annual financial filings; CDP: online platform, aligned with TCFD.","ed":"Summary of slide 4: TCFD targets investors and companies, covers climate-related disclosure and governance, uses a materiality approach consistent with how companies assess other information, and asks for disclosure in annual financial filings. CDP targets investors, companies, cities, states and regions, covers carbon, water, forests and supply chain, is aligned with TCFD and uses its own platform. CDP's self-reported data (e.g. Philips' carbon data) feed many ESG datasets.","kt":"","src":"L7 slide 4 · L7 slide 18-19 · Bok s. 170 (6.4)"},{"id":"SB245","l":"L7","t":"TCFD","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the four TCFD areas?","o":[["Product pricing","Not a TCFD area."],["Governance","One of the four areas: the board's oversight of climate-related risks and opportunities."],["Employee diversity","TCFD is climate-specific."],["Dividend policy","Not a TCFD area."]],"c":[1],"es":"Governance, strategy, risk management, metrics and targets.","ed":"TCFD (set up by the Financial Stability Board, chaired by Michael Bloomberg) recommends disclosure on governance, strategy, risk management, and metrics and targets for climate-related risks (physical and transition) and opportunities. A key element is scenario analysis: reporting likely financial outcomes under a 2 degrees scenario versus the current trajectory. The ISSB's IFRS S2 and the CSRD's ESRS E1 build on the TCFD structure. Also true, but not offered as an option here: Metrics and targets.","kt":"","src":"L7 slide 16-17 · Bok s. 173 (6.5)"},{"id":"SB246","l":"L7","t":"Integrated reporting","f":"m","d":2,"p":"H","sc":"none","s":"The IIRC (2013) defines an integrated report as:","o":[["A short report on how the firm creates value","The full definition adds \"in the context of its external environment\" and \"over the short, medium and long term\"."],["A separate CSR report","This is the silo approach that IR replaces."],["A mandatory EU taxonomy report","This describes EU Taxonomy disclosures under CSRD."],["All of the firm's data in one very long document","The IIRC stresses conciseness; companies that think IR means disclosing everything in one place misunderstand it."]],"c":[0],"es":"IR: concise communication on how strategy, governance, performance and prospects create value over the short, medium and long term.","ed":"IR evolved from the 1990s silo approach (financial report for investors, CSR report for \"society\") towards \"One Report\" (Eccles and Krzus, 2010). The IIRC was founded in 2010. Eccles and Saltzman define IR more simply as a single document presenting financial and ESG performance; in practice reports mix both definitions. The real goal is integrated thinking: taking into account the connectivity and interdependencies between factors affecting value creation over time.","kt":"","src":"L7 slide 8-9 · Bok s. 157 (6.3.1) · Bok s. 173 (Key concepts)"},{"id":"SB247","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A hospital group prepares an integrated report. Which item is correctly classified?","o":[["Nurses' skills - human capital","Competencies and motivation of people."],["Software patents - natural capital","Patents are intellectual capital."],["Hospital buildings - intellectual capital","Buildings are manufactured capital."],["Cash - social capital","Cash is financial capital."]],"c":[0],"es":"People = human capital; relationships and trust = social and relationship capital.","ed":"IR adds intellectual, human, social and relationship, and natural capital to the two traditionally reported capitals. The aim is integrated thinking about how capitals interact to create value over time. Also true, but not offered as an option here: Trust and relationships with local communities and patients - social and relationship capital.","kt":"Six capitals (IIRC): financial, manufactured, intellectual, human, social and relationship, natural.","src":"L7 slide 10 · Bok s. 159 (6.3.1.1)"},{"id":"SB248","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"Which is a guiding PRINCIPLE (not a content element) of integrated reporting?","o":[["Business model and value creation","This is content element 3."],["Outlook and uncertainties","This is content element 7."],["Connectivity of information","A guiding principle: a holistic picture of interrelated factors."],["Risks and opportunities","This is content element 4."]],"c":[2],"es":"Principles: strategic focus, connectivity, stakeholder relationships, materiality, conciseness, reliability and completeness, consistency and comparability.","ed":"The seven guiding principles shape how the report is prepared and presented: strategic focus and future orientation; connectivity of information; stakeholder relationships; materiality; conciseness; reliability and completeness; consistency and comparability. The eight content elements say what it should contain: organisational overview and external environment; governance; business model; risks and opportunities; strategy and resource allocation; performance; outlook; basis of presentation. The textbook rates Philips against both (Tables 6.3-6.4).","kt":"","src":"L7 slide 11 · Bok s. 160 (6.3.1.2) · Bok s. 161 (6.3.1.2)"},{"id":"SB249","l":"L7","t":"Integrated reporting","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Philips' 2016 integrated report does NOT meet the principle of conciseness, because it is 226 pages long.","o":[["True","Correct. Table 6.3 marks conciseness with an X: the report is \"still (too) long with 226 pages\"."],["False","Incorrect. Table 6.3 marks conciseness with an X: the report is \"still (too) long with 226 pages\"."]],"c":[0],"es":"True: Philips fails on conciseness.","ed":"Philips scores well on strategic focus, connectivity, stakeholder relationships, materiality (a matrix of 27 ESG issues) and consistency, but fails on conciseness and only partly meets reliability and completeness (it refers to natural and financial capital but not the other four). Table 6.4 adds that the business model is mentioned 11 times but not visualised, and risk is mentioned 399 times versus opportunities 32 times.","kt":"","src":"Bok s. 164 (Table 6.3) · Bok s. 165 (Table 6.4)"},{"id":"SB250","l":"L7","t":"Six capitals balance sheet","f":"m","d":4,"p":"H","sc":"none","s":"For a mining firm, a six capitals balance sheet adds large negative natural capital. What happens to the picture of the firm?","o":[["Equity falls; risk rises","Environmental liabilities hidden from markets now count."],["Debt disappears from the balance sheet","Debt stays; natural capital liabilities are added."],["Nothing changes","The six capitals view changes equity and leverage substantially."],["Equity rises","Negative natural capital outweighs the added capitals."]],"c":[0],"es":"Counting natural capital liabilities lowers integrated equity and raises leverage.","ed":"Market prices often ignore externalities, so a firm can look \"safe\" on a market basis but \"risky\" on a six capitals basis. The drawback is that each capital rests on many assumptions; no company publishes such a balance sheet yet.","kt":"Six capitals balance sheet: a balance sheet valuing financial, manufactured, intellectual, human, social and natural capital, including negative capital (e.g. environmental damage).","src":"Bok s. 166 (Figure 6.6) · Bok s. 167 (6.3.2.2)"},{"id":"SB251","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"H","sc":"none","s":"Which framework is aimed at ALL stakeholders, not mainly investors?","o":[["SASB","SASB targets investors of companies issuing registered securities."],["IFRS","IFRS targets existing and potential investors, lenders and other creditors."],["<IR>","<IR> targets providers of financial capital and others interested in value creation."],["GRI","GRI follows a stakeholder approach; investors are not privileged."]],"c":[3],"es":"GRI = all stakeholders; IFRS = investors and creditors; <IR> = providers of financial capital; SASB = investors (industry-specific).","ed":"Summary of Table 6.2: IFRS covers financial performance and position, materiality defined by influence on users' decisions. <IR> covers value creation over time, using a multistep materiality process, principles based. GRI covers sustainability impacts on the economy, environment and society for all stakeholders, standards based, and requires reporting of issues material to society (e.g. water in water-scarce areas even if impact is small). SASB is very industry specific, identifying a minimum set of topics likely material to most companies in an industry.","kt":"","src":"Bok s. 157 (6.3) · Bok s. 158 (Table 6.2) · Bok s. 162 (6.3.1.3)"},{"id":"SB252","l":"L7","t":"Reporting frameworks","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The textbook calls the IIRC rules based, GRI principles based and SASB the same for all industries.","o":[["True","Incorrect. It is the reverse: the IIRC is more principles based, the GRI more standards (rules) based, and the SASB very industry specific."],["False","Correct. It is the reverse: the IIRC is more principles based, the GRI more standards (rules) based, and the SASB very industry specific."]],"c":[1],"es":"False: IIRC principles based, GRI standards based, SASB industry specific.","ed":"The IIRC framework is the easiest to apply across industries because it is principles based. The GRI's 2016 standards (GRI 101 Foundation, 102 General Disclosures, 103 Management Approach) are more rigid but offer greater comparability. SASB develops industry-specific standards (79 industries in 11 sectors as of 2018) selecting topics that are relevant across an industry, can affect value creation, are actionable, of interest to investors and reflect stakeholder consensus.","kt":"","src":"Bok s. 157 (6.3) · Bok s. 161 (6.3.1.3) · Bok s. 162 (6.3.1.4)"},{"id":"SB253","l":"L7","t":"Reporting frameworks","f":"m","d":3,"p":"L","sc":"none","s":"Which is one of SASB's criteria for picking material topics?","o":[["Linked to at least three SDGs","Not a SASB criterion."],["Relevant across an industry","One of the five criteria."],["Approved by the auditor","Not a SASB selection criterion."],["Relevant to society, even with no effect on the firm","This reflects GRI's sustainability context, not SASB."]],"c":[1],"es":"Relevant across an industry; potential to affect value creation; actionable; of interest to investors; reflective of stakeholder consensus.","ed":"SASB's financial materiality focus means a topic qualifies if it is relevant across the industry, has potential to affect value creation, is actionable for companies, is of interest to investors and reflects stakeholder consensus. This is why its materiality map (Lecture 6) varies by industry. GRI, by contrast, asks for topics material to society (impact materiality); together they form double materiality. Also true, but not offered as an option here: Potential to affect value creation.","kt":"","src":"Bok s. 162 (6.3.1.4) · L6 slide 50-51"},{"id":"SB254","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"A study compares no ESG reporting, separate ESG reports, ESG in the annual report, and integrated reporting (<IR>). What does it find?","o":[["<IR> beats some forms, not all","These are the two conclusions on slide 13."],["<IR> is the worst form","The study finds <IR> superior to two of the categories."],["Switching to <IR> always helps the firm","The slide states that they do not."],["No ESG reporting is best","No ESG reporting is found to be inferior to <IR>."]],"c":[0],"es":"<IR> beats no reporting and ESG-in-annual-report, but not stand-alone ESG reporting.","ed":"Slide 13 shows <IR> is superior to \"no ESG reporting\" and \"ESG reporting in annual report\", but firms do not benefit from switching from stand-alone ESG reporting to <IR>. The textbook cites Barth et al. (2017): IR quality is positively associated with stock liquidity (bid-ask spreads) and firm value (Tobin's Q), consistent with better external information and better internal decisions. Most IR research, however, is normative rather than empirical (Dumay et al., 2016).","kt":"","src":"L7 slide 13 · Bok s. 163 (6.3.2)"},{"id":"SB255","l":"L7","t":"Mandatory vs voluntary reporting","f":"m","d":3,"p":"H","sc":"short","s":"In 2023 the US SEC fined DWS USD 19 million for false claims about its ESG investing. This shows that:","o":[["ESG claims never need to be checked","The fine shows claims are checked."],["Enforcement of claims matters","Lecture 7 argues for a mix of voluntary and mandatory, verified reporting."],["Only small firms greenwash","DWS is a large, Deutsche Bank-owned asset manager."],["Regulators cannot act","The SEC did exactly that."]],"c":[1],"es":"Misleading ESG claims → enforcement; supports mandatory, verifiable disclosure.","ed":"Greenwashing is a material risk for asset managers (selling practices and product labelling in SASB). EU rules (SFDR, CSRD, the Green Claims agenda) and assurance requirements aim to reduce it; 94% of investors think reports contain unsupported claims (PwC).","kt":"Greenwashing: making misleading claims about environmental or sustainability performance.","src":"L7 slide 26 · L8 slide 19 · PwC s. 30"},{"id":"SB256","l":"L7","t":"Integrated reporting","f":"m","d":3,"p":"M","sc":"none","s":"Which is a BARRIER to adopting integrated reporting?","o":[["Status quo bias","A behavioural barrier in section 6.3.3."],["A lower cost of capital","This is an incentive (Dhaliwal et al., 2011)."],["Attracting more long-term investors","This is an incentive (Knauer and Serafeim, 2014)."],["Keeping up with peers","\"Keeping up with the Joneses\" is an incentive."]],"c":[0],"es":"Barriers: status quo bias, competitive sensitivity, misunderstanding, legal risk, lack of data, lack of assurance standards.","ed":"Incentives include a genuine desire to report accurately, stronger internal reporting, lower cost of capital, higher valuation and liquidity, reputation, catering to investors (like dividends, Shefrin and Statman), attracting long-term investors (Shire) and copying peers. Barriers include status quo bias, competitive sensitivity, the misunderstanding that IR means disclosing everything in one place, litigation risk, missing data, and lack of auditor skills and international assurance standards. A further shortcoming: IR rarely relates performance to system thresholds (only 5% mention ecological limits). Also true, but not offered as an option here: Fear of disclosing competitively sensitive information or increasing litigation risk.","kt":"","src":"Bok s. 167 (6.3.3) · Bok s. 168 (Table 6.5)"},{"id":"SB257","l":"L7","t":"Integrated reporting","f":"m","d":4,"p":"M","sc":"none","s":"Integrated reporting measures a firm's net impact, but not against system limits. Why is that a problem?","o":[["Eco-efficiency is stricter","Eco-effectiveness is stricter, because it relates impact to absolute limits."],["IR measures limits, not impact","The reverse: IR measures company impact but not the thresholds."],["Efficiency does not show it stays within limits","Judging sustainability requires comparing impact with the system threshold."],["System limits are already in market prices","Externalities are largely unpriced; that is the problem."]],"c":[2],"es":"Without a system threshold, IR shows improvement (efficiency) but not whether impact is within planetary limits (effectiveness).","ed":"In Equation 4.1 (Chapter 4), sustainability is the company's impact (numerator) relative to the relevant threshold such as a carbon budget (denominator). IR reports the numerator only. A firm can cut emissions every year and still exceed its fair share of the budget. Bjørn et al. (2017) find only 5% of companies mention ecological limits and only 0.3% integrate them into strategy. Lecture 13 (transition) returns to this system view.","kt":"","src":"Bok s. 168 (6.3.3)"},{"id":"SB258","l":"L7","t":"Integrated reporting","f":"m","d":4,"p":"M","sc":"none","s":"Why does Flower (2015) call the IIRC \"a story of failure\"?","o":[["It requires a money value for all six capitals","No such requirement exists; no firm has published one."],["It focuses on value for investors","These are Flower's two main considerations."],["It focuses too much on society","Flower argues the opposite."],["It was started by NGOs","He claims the council is dominated by the accounting profession and multinationals (regulatory capture)."]],"c":[1],"es":"Flower: IIRC value = value for investors, no duty to report external harm, regulatory capture.","ed":"Flower argues the IIRC abandoned sustainability accounting: value is \"value for investors\", and harm to outsiders without impact on the firm need not be reported. He also sees regulatory capture by accountants and multinationals and expects little impact due to lack of force. Thomson adds that IR serves investors' wealth, not societal prosperity. The textbook finds this harsh: value for society is not yet well defined, and evolution rather than revolution is needed. On the positive side, IR increases meaning (Adams and Simnett) and proxies for management quality (Churet and Eccles).","kt":"","src":"Bok s. 169 (6.3.4) · Bok s. 170 (6.3.4)"},{"id":"SB259","l":"L7","t":"Integrated reporting","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Churet and Eccles (2014) see integrated reporting as a good sign of high-quality management.","o":[["True","Correct. They argue firms able to articulate the relevance of sustainability for long-term success are best equipped to manage it, so IR proxies management quality."],["False","Incorrect. They argue firms able to articulate the relevance of sustainability for long-term success are best equipped to manage it, so IR proxies management quality."]],"c":[0],"es":"True: IR is seen as a proxy for management quality.","ed":"On the \"success\" side of the debate, Eccles and Saltzman note growing attention to IR; Adams and Simnett argue it makes reporting more meaningful; Churet and Eccles see it as a proxy for management quality; and Ortiz-de-Mandojana and Bansal find firms with responsible practices have lower volatility, higher growth and better survival over 15 years. Weak points remain: limited assurance and investor focus.","kt":"","src":"Bok s. 169 (6.3.4)"},{"id":"SB260","l":"L7","t":"Mandatory reporting","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A Norwegian seafood firm under the CSRD harms wild salmon, but this barely affects its finances. Must it report on this?","o":[["Only if an NGO asks","Reporting is required by the double materiality assessment, not by requests."],["Yes, under double materiality","An issue is material if it is material from an impact OR a financial perspective."],["No: only financial issues count under CSRD","That is single (financial) materiality, e.g. SASB/ISSB."],["No: only GRI covers this","ESRS require impact materiality as well."]],"c":[1],"es":"Under CSRD, high impact alone makes the issue reportable.","ed":"Impact materiality can turn into financial materiality over time (dynamic materiality), for example through stricter licences. The Omnibus has narrowed which firms are in scope, but the principle for in-scope firms is unchanged.","kt":"Double materiality: report an issue if it affects the company's value (financial materiality) or if the company significantly affects people or the environment (impact materiality).","src":"L7 slide 23-25 · PwC s. 29 · L6 slide 50"},{"id":"SB261","l":"L7","t":"Mandatory reporting","f":"m","d":2,"p":"H","sc":"none","s":"One goal of the EU Taxonomy is to:","o":[["Prevent greenwashing","Listed on slide 21."],["Replace credit ratings","Not a goal of the taxonomy."],["Ban fossil fuel investment","The taxonomy is a classification system, not a ban."],["Set mandatory ESG ratings","The taxonomy defines sustainable activities; it does not rate firms."]],"c":[0],"es":"Meet EU 2030 climate targets and Green Deal objectives, protect investors from greenwashing, help companies become climate-friendly, mitigate fragmentation and shift investment.","ed":"The EU Taxonomy gives companies, investors and policymakers definitions of which economic activities can be considered environmentally sustainable. Its goals: meet the EU's 2030 climate and energy targets and the Green Deal objectives, protect investors from greenwashing, help companies become more climate-friendly, and mitigate market fragmentation while shifting investment where needed. Companies under CSRD disclose taxonomy alignment (Article 8 of the Taxonomy Regulation) of turnover, capex and opex. Also true, but not offered as an option here: Help shift investments to where they are most needed and mitigate market fragmentation.","kt":"","src":"L7 slide 21-22 · PwC s. 32"},{"id":"SB262","l":"L7","t":"Effects of reporting","f":"m","d":3,"p":"H","sc":"none","s":"How can greenwashing best be prevented, according to the research in the course?","o":[["Ban all sustainability claims","The review does not propose a ban; it proposes mixing voluntary and mandatory reporting."],["Keep reporting fully voluntary","The entirely voluntary approach is found to facilitate greenwashing."],["Let rating agencies check every claim","Ratings are themselves criticised as inconsistent and unreliable."],["Mix voluntary and mandatory rules","The review finds the entirely voluntary approach facilitates greenwashing."]],"c":[3],"es":"An entirely voluntary approach facilitates greenwashing; a voluntary-mandatory mix is proposed.","ed":"When reporting is voluntary, firms choose what to disclose, which allows selective and misleading claims. The review proposes a mix of voluntary and mandatory aspects. This connects to the PwC guest lecture (94% of investors think reports contain unsupported claims; CSRD aims to end greenwashing) and to the HBR critique on slides 30-31 (lack of mandates and auditing; sustainability reports must be mandated and audited).","kt":"","src":"L7 slide 26 · L7 slide 30-31 · PwC s. 30"},{"id":"SB263","l":"L7","t":"Effects of reporting","f":"m","d":4,"p":"M","sc":"none","s":"Krueger et al. (2021) study mandatory ESG disclosure around the world. They find that it:","o":[["improves information","The paper finds positive capital market and real effects of mandatory disclosure."],["increases bad ESG events","Negative incidents decline after mandates."],["has no effect on information","The paper finds improved availability and quality of ESG disclosure."],["matters only for firms that already report well","Effects are concentrated where information was poorer before mandates."]],"c":[0],"es":"Mandates raise disclosure quantity and quality and reduce negative ESG incidents and stock price crash risk.","ed":"Using country-level mandates across many countries, Krueger et al. find that mandatory ESG disclosure increases the availability and quality of ESG disclosures (e.g. fewer differences in ratings), reduces the likelihood of negative ESG incidents and stock price crash risk. This supports the argument for mandatory, audited reporting such as the CSRD and is in line with Starks' discussion of the value of better ESG information.","kt":"","src":"L7 slide 27-29"},{"id":"SB264","l":"L7","t":"Effects of reporting","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A retailer promises \"net zero by 2050\" with no interim targets, counts only its own stores' emissions, and buys cheap offsets. Its supply chain is 95% of emissions. What problems does this show?","o":[["Too much focus on developing countries","Not the issue here."],["Too strict definitions","Definitions are too loose, if anything."],["Weak targets, hidden supply chain","Distant targets without interim steps and ignoring scope 3."],["Too much auditing","The problem is the opposite."]],"c":[2],"es":"Distant targets + ignoring scope 3 = specious targets and opaque supply chains.","ed":"The HBR prescription is \"measure less, better\", with mandated and audited reports. Analysts should check interim targets, scope coverage and reliance on offsets, as PwC also stresses (\"fluffy targets no longer stand\").","kt":"Scope 3 emissions: indirect emissions across the value chain (suppliers and product use), often the largest share.","src":"L7 slide 30 · L7 slide 7 · PwC s. 24"},{"id":"SB265","l":"L7","t":"ESG ratings","f":"m","d":2,"p":"M","sc":"none","s":"Where do MSCI and Sustainalytics fit among ESG data providers?","o":[["Raw data on one topic","Southpole (emissions data) is the example here."],["Ratings on one topic","Equileap (gender), ISS and Glass Lewis (voting advice) are examples here."],["Broad ratings","They score companies on all topics."],["Broad raw data","RepRisk (news tracking) is the example here."]],"c":[2],"es":"Dimensions: raw data vs scores/ratings/advice; topic-focused vs comprehensive. MSCI, Sustainalytics = comprehensive scores.","ed":"Topic-focused providers aim for the deepest data on one area (Southpole emissions, Equileap gender, ISS and Glass Lewis proxy voting). Comprehensive providers (MSCI, Sustainalytics, RobecoSAM, oekom/ISS ESG) score firms on all topics and need more scale. Scores are typically weighted averages of many items, with points for policies and penalties for controversies. Data providers add comparability and stimulate better reporting, but ratings are starting points, not final verdicts.","kt":"","src":"Bok s. 170 (6.4) · Bok s. 171 (Table 6.6) · L7 slide 32"},{"id":"SB266","l":"L7","t":"ESG ratings","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Two rating agencies have the same E, S and G scores for a firm. Agency 1 weights G most; agency 2 weights E most. The firm is strong on G but weak on E. What happens?","o":[["Agency 2 rates it higher","The company is weak on E, so heavy E weight lowers its score."],["Both give the same rating","Weights change the overall score."],["Ratings differ only if data differ","Methodology (weights) is a major source of divergence."],["Agency 1 rates it higher","Different weights on the same data produce different overall scores."]],"c":[3],"es":"Weighting choices drive rating divergence.","ed":"This is one reason ESG ratings correlate poorly (Berg, Kölbel and Rigobon; Kotsantonis). Investors should understand what a rating weights before relying on it.","kt":"Rating divergence: different ESG ratings for the same firm, driven by differences in scope, measurement and weights.","src":"Bok s. 171 (Figure 6.7) · L7 slide 36-37 · Fondsfinans s. 16"},{"id":"SB267","l":"L7","t":"ESG ratings","f":"m","d":3,"p":"H","sc":"none","s":"According to Kotsantonis (2019), how does disagreement among ESG data providers change with more public information?","o":[["It increases","Slide 37 states this counter-intuitive finding."],["It disappears","More information gives providers more room to interpret differently."],["It only exists with no data","Disagreement is large and increases with disclosure."],["It is unrelated","The slide states a positive relation."]],"c":[0],"es":"More disclosure → more disagreement among ESG data providers.","ed":"Slide 37 lists variety and inconsistency in how companies report, the crucial role of benchmarking (peer group choice) in rankings, large disagreements among providers, and that disagreement increases with the quantity of public information. Starks (2023) and Berg, Kölbel and Rigobon trace divergence to scope, measurement and weights. Implication: ratings are inputs for analysis, not verdicts, and standardised mandatory disclosure is needed.","kt":"","src":"L7 slide 37 · Starks s. 1843"},{"id":"SB268","l":"L7","t":"ESG ratings","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"An oil firm gets a high ESG rating when compared with oil peers, and a low one when compared with all firms. This shows:","o":[["One provider made a mistake","Both ratings can be internally consistent with different methodologies."],["The peer group can drive the rating","Slide 37 says benchmarking is crucial in determining a company's ranking."],["Ratings always measure absolute impact","Industry-relative ratings measure performance relative to peers."],["The firm is greenwashing","The difference arises from methodology, not necessarily from misleading claims."]],"c":[1],"es":"Industry-relative vs absolute benchmarking can produce very different ratings for the same firm.","ed":"\"best-in-class\" ratings compare a firm with industry peers, so an oil major can score well while still having a large absolute footprint. Absolute ratings compare across industries. Investors must understand what a rating measures (risk to the firm vs impact on the world, relative vs absolute) before using it. This connects to best-in-class screening and rating divergence in Lectures 8 and 9.","kt":"","src":"L7 slide 37 · L7 slide 36"},{"id":"SB269","l":"L7","t":"ESG ratings","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Many investors treat ESG ratings as the final answer instead of a starting point, and many follow proxy advisors' voting advice automatically.","o":[["True","Correct. Section 6.4 makes exactly this warning, adding that the challenge is distinguishing material from immaterial issues."],["False","Incorrect. Section 6.4 makes exactly this warning, adding that the challenge is distinguishing material from immaterial issues."]],"c":[0],"es":"True: ratings are starting points, but investors often treat them as verdicts.","ed":"Data providers supply previously unavailable, more comparable data and stimulate competition in reporting. But the data are a fraction of the ideal amount and do not show whether a firm is prepared for the transition; investors over-rely on scores and on ISS and Glass Lewis voting advice. Competition among providers and distribution via mainstream channels (Bloomberg) should improve quantity and quality over time.","kt":"","src":"Bok s. 172 (6.4)"},{"id":"SB270","l":"L7","t":"ESG ratings","f":"t","d":3,"p":"L","sc":"none","s":"True or false: \"In strict ESG terms\", ESG ratings aim to reward firms for doing good for society, regardless of risk.","o":[["True","Incorrect. The slide says the aim is not altruistic; it is rather a way of assessing regulatory or reputational risks that arise from negative externalities."],["False","Correct. The slide says the aim is not altruistic; it is rather a way of assessing regulatory or reputational risks that arise from negative externalities."]],"c":[1],"es":"False: ESG ratings assess risks from negative externalities, not altruism.","ed":"Slide 40 criticises the ESG industry: it puts unmanageable demands on companies, ratings are too subjective, the industry overpromises and underdelivers, and the aim is risk assessment rather than altruism. It argues mandatory regulation of disclosures, especially material ones, should tighten things up. This matches the distinction between financial materiality (risk to the firm) and impact.","kt":"","src":"L7 slide 40"},{"id":"SB271","l":"L7","t":"ESG ratings","f":"t","d":4,"p":"H","sc":"short","s":"True or false: In 2022 Tesla was dropped from an ESG index while ExxonMobil stayed in. This fits the view that ESG ratings often measure ESG risk management relative to the industry, not positive impact.","o":[["True","Correct. Many ratings benchmark firms within their industry and focus on risks and governance, so an oil major can score relatively well while an EV maker with governance or labour issues scores worse."],["False","Incorrect. Many ratings benchmark firms within their industry and focus on risks and governance, so an oil major can score relatively well while an EV maker with governance or labour issues scores worse."]],"c":[0],"es":"True: ratings often measure relative ESG risk management, not impact.","ed":"This is the benchmarking point on slide 37 and Brooks' warning that ESG ≠ sustainability. Investors must know whether a rating measures risk to the firm or the firm's impact, and treat ratings as a starting point for analysis.","kt":"Industry-relative (best-in-class) rating: scores a firm against its industry peers rather than across all industries.","src":"L7 slide 37 · Fondsfinans s. 6"},{"id":"SB272","l":"L7","t":"Reporting and materiality","f":"m","d":3,"p":"M","sc":"short","s":"A firm uses little water but operates where water is scarce. Under which framework should it still report on water?","o":[["None","GRI's impact materiality can make them reportable."],["GRI","Section 6.3.1.3 uses exactly this water example."],["SASB","SASB is industry specific and investor focused."],["IFRS","IFRS focuses on financial performance and position."]],"c":[1],"es":"GRI's sustainability context: report what matters to society, e.g. water in water-scarce areas.","ed":"GRI's impact materiality looks outward: topics are material if they reflect significant economic, environmental and social impacts or substantively influence stakeholders' assessments. In a water-scarce area, water use matters to society even if small. Under financial materiality (SASB, IFRS/ISSB), it would matter only if it could affect the company's value. CSRD's double materiality requires both views.","kt":"","src":"Bok s. 161 (6.3.1.3) · Bok s. 158 (Table 6.2)"},{"id":"SB273","l":"L7","t":"Integrated thinking","f":"m","d":3,"p":"M","sc":"none","s":"The IIRC says integrated reporting serves a deeper goal. That goal is:","o":[["Integrated thinking","The IIRC's long-term vision is integrated thinking embedded in mainstream practice."],["Top ESG ratings for all","Ratings are not the goal of IR."],["As many ESG indicators as possible","Conciseness and materiality are guiding principles."],["Replacing financial statements","IR combines financial and non-financial information; it does not replace financial statements."]],"c":[0],"es":"IR's goal is integrated thinking: seeing how factors and capitals interconnect to create value over time.","ed":"Integrated thinking combines financial, social and environmental dimensions. Example: a biotech's ability to produce new products depends on its innovation process, which depends on its human capital. Embedding integrated thinking should make information flow naturally into management reporting and decisions and break silo thinking (Chapter 12). The move from financial reporting to IR mirrors the move from SF 1.0 to SF 2.0 and 3.0.","kt":"","src":"Bok s. 158 (6.3.1.1) · Bok s. 159 (6.3.1.1) · Bok s. 157 (6.3.1)"},{"id":"SB274","l":"L7","t":"Reporting and value","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Airline A shows photos of tree planting. Airline B reports fuel use per passenger-km, a 2030 green fuel target and the cost impact. Which report helps investors more?","o":[["Neither","Most investors use ESG information (EY survey; Amel-Zadeh and Serafeim)."],["Both equally","Quality and materiality differ greatly."],["A: the photos show real commitment","Anecdotes are not comparable or decision-useful."],["B: material data linked to costs","Investors need material KPIs they can link to value drivers."]],"c":[3],"es":"Material, comparable, forward-looking KPIs linked to value drivers are decision-useful.","ed":"Fuel efficiency and fuel costs are core value drivers for airlines; interim targets show transition preparedness. This matches the IIRC principles (materiality, connectivity, future orientation) and the analyst's need to link ESG to valuation (Lecture 9).","kt":"Decision-useful information: material, reliable, comparable and forward-looking data that can change an investor's assessment.","src":"L7 slide 14-15 · Bok s. 160 (6.3.1.2)"},{"id":"CX059","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"Excluding all tobacco and weapons stocks is an example of:","o":[["Negative screening","Utelukke bransjer = negative screening."],["Best-in-class screening","Best-in-class beholder alle bransjer."],["ESG integration","Integration handler om verdsettelse."],["Thematic investing","Tematisk velger et tema aktivt."]],"c":[0],"es":"Ekskludering = negative screening.","ed":"Negative screening er den enkleste SRI-strategien, og den vanligste i SF 1.0.","kt":"","src":"L8 slide 43 · L9 slide 35","k":1},{"id":"CX060","l":"L8","t":"SRI strategies","f":"t","d":2,"p":"H","sc":"none","s":"Does best-in-class screening exclude entire sectors such as oil and gas?","o":[["Yes","Feil. Best-in-class beholder alle bransjer, men velger de beste selskapene i hver."],["No","Riktig. Best-in-class beholder alle bransjer, men velger de beste selskapene i hver."]],"c":[1],"es":"Nei: best-in-class velger de beste innen hver bransje.","ed":"Å fjerne en hel bransje er negative screening. De to kan kombineres.","kt":"","src":"L8 slide 45-52 · Bok s. 189 (7.2.2)","k":1},{"id":"CX061","l":"L8","t":"ESG integration","f":"m","d":2,"p":"H","sc":"short","s":"Lowering a utility's forecast margins for expected carbon costs is an example of:","o":[["Thematic investing","Tematisk investering velger et tema, f.eks. rent vann."],["Negative screening","Ingen selskaper blir ekskludert."],["Impact investing","Målet er ikke å skape målbar positiv effekt."],["ESG integration","ESG-informasjon bygges inn i selve verdsettelsen."]],"c":[3],"es":"ESG i prognosene = ESG integration.","ed":"ESG integration: finn de vesentlige ESG-temaene og legg dem inn i salg, marginer, investeringer eller risiko.","kt":"","src":"Opptak L8 ca. 52 min","k":1},{"id":"CX062","l":"L8","t":"Impact investing","f":"t","d":2,"p":"H","sc":"none","s":"Does impact investing require an intention to create measurable positive impact?","o":[["Yes","Riktig. Intentionality og impact measurement er kjennetegn ved impact investing."],["No","Feil. Intentionality og impact measurement er kjennetegn ved impact investing."]],"c":[0],"es":"Ja: intensjon + måling.","ed":"GIIN: intentionality, return expectations, range of returns and asset classes, impact measurement.","kt":"","src":"L8 slide 61-65 · L8 slide 39","k":1},{"id":"CX063","l":"L8","t":"Impact investing","f":"m","d":2,"p":"H","sc":"none","s":"Impact investing belongs to:","o":[["SF 1.0","SF 1.0 er f.eks. ekskludering."],["Traditional finance","Tradisjonell finans ser bare på avkastning."],["SF 3.0","Impact først, med krav om minimum avkastning = SF 3.0."],["SF 2.0","SF 2.0 er integrated value, f.eks. ESG integration."]],"c":[2],"es":"Impact investing = SF 3.0.","ed":"Impact investing er fortsatt ikke veldedighet: det kreves en finansiell avkastning, men samfunns- og miljøeffekten kommer først.","kt":"","src":"Opptak L8 ca. 67 min · Opptak L9 ca. 85 min","k":1},{"id":"CX064","l":"L8","t":"SFDR","f":"m","d":2,"p":"H","sc":"none","s":"Under the EU's SFDR, the fund type with sustainable investment as its objective is:","o":[["An Article 8 fund","Artikkel 8 fremmer bare E/S-egenskaper (light green)."],["An Article 9 fund","Artikkel 9 = dark green."],["An Article 6 fund","Artikkel 6 har ingen bærekraftsmål."],["An Article 2 fund","Det er ikke en fondskategori."]],"c":[1],"es":"Artikkel 9 = dark green.","ed":"SFDR: artikkel 6 (ingen bærekraftsmål), artikkel 8 (fremmer E/S), artikkel 9 (bærekraftig investering er målet).","kt":"","src":"L8 slide 22-27","k":1},{"id":"CX065","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"short","s":"After years of failed dialogue with a firm, an investor's last step is:","o":[["Asking the miner for a sustainability report","Det er et tidlig steg i dialogen."],["Buying more shares quietly","Det er ikke eskalering."],["Divesting the shares (exit)","Når voice ikke virker, er exit det siste steget."],["Starting a first private meeting","Det er starten på engagement, ikke slutten."]],"c":[2],"es":"Voice først, exit til slutt.","ed":"Eksempel: LGIM og Glencore. Dialog fra 2016, aksjonærforslag i 2023, og salg fra noen fond i 2024.","kt":"","src":"L8 slide 56-58 · L8 slide 71","k":1},{"id":"CX066","l":"L8","t":"Investment industry","f":"m","d":2,"p":"H","sc":"none","s":"An example of an asset owner is:","o":[["A pension fund","Pensjonsfond eier pengene på vegne av sparerne."],["An asset manager hired to run money","Det er en forvalter, ikke en eier."],["An ESG rating agency","De lager ratinger, de eier ikke pengene."],["A proxy advisor","Proxy advisors gir stemmeråd."]],"c":[0],"es":"Pensjonsfond = asset owner.","ed":"Kjeden: sparere → asset owners (pensjonsfond, forsikringsselskaper) → asset managers → selskaper.","kt":"","src":"L8 slide 14 · Bok s. 185 (7.1.4) · Bok s. 185 (Figure 7.1)","k":1},{"id":"CX067","l":"L8","t":"Investment chains","f":"m","d":2,"p":"H","sc":"none","s":"Long investment chains tend to lead to:","o":[["More voting by end savers","Sparerne kommer lenger unna selskapene."],["More short-termism","Hvert ledd måles kortsiktig, og informasjon går tapt."],["Lower agency costs","Flere ledd gir flere agency problems."],["A longer-term focus","Det er motsatt."]],"c":[1],"es":"Lange kjeder = short-termism.","ed":"Boka anbefaler korte kjeder og langsiktige mandater for long-term value creation (LTVC).","kt":"","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 186 (7.1.4) · Bok s. 187 (7.1.4)","k":1},{"id":"EX06","l":"L8","t":"Exam sample: ESG integration","f":"m","d":2,"p":"H","sc":"none","s":"Full ESG integration means:","o":[["Adding an ESG logo to fund marketing","Det er markedsføring, i verste fall greenwashing."],["Building ESG issues into the fundamental analysis and valuation itself","ESG legges inn i selve analysen og verdsettelsen (kontantstrøm, vekst, marginer, risiko)."],["Voting at shareholder meetings","Det er voice/engagement, en annen strategi."],["Excluding all controversial sectors","Det er negative screening."]],"c":[1],"es":"ESG integration = ESG inn i analysen og verdsettelsen.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nSkill strategiene: negative screening (ekskludere), best-in-class (velge de beste per bransje), ESG integration (ESG i verdsettelsen), engagement (voice), impact investing (målbar positiv effekt).","kt":"","src":"Opptak L8 ca. 52 min","k":1,"x":1},{"id":"SB275","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":3,"p":"H","sc":"none","s":"How does the two-stock portfolio problem change when ESG is added?","o":[["The correlation is set to zero","The correlation (0.5) is unchanged; it is a property of the assets."],["The goal becomes minimising emissions only","Return is still maximised subject to risk; emissions enter as an additional constraint."],["An emissions limit is added","Slide 7 adds w(A)·30 + w(B)·20 ≤ emission tolerance to the variance and budget constraints."],["Emissions are added to returns","Emissions enter as a separate constraint, not as a return adjustment."]],"c":[2],"es":"Maximise w'r subject to variance ≤ risk tolerance, weighted emissions ≤ emission tolerance, and weights ≤ 1.","ed":"Traditional optimisation maximises expected return for a given risk tolerance (Markowitz efficient frontier). With ESG, an extra constraint limits portfolio emissions: w(A)·emission(A) + w(B)·emission(B) ≤ emission tolerance. A binding emission constraint pushes weight towards the cleaner stock B, typically lowering expected return for the given risk. Pedersen, Fitzgibbons and Pomorski (2021) generalise this to an ESG-efficient frontier: the highest Sharpe ratio for each level of portfolio ESG score.","kt":"","src":"L8 slide 4-7"},{"id":"SB276","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":4,"p":"M","sc":"none","s":"The \"ESG-efficient frontier\" (Pedersen, Fitzgibbons and Pomorski, 2021) shows:","o":[["that ESG scores say nothing about risk","In their model ESG can carry information about future fundamentals."],["portfolios with zero emissions","It covers the full range of ESG levels, not only zero emissions."],["the best Sharpe ratio for each ESG score","The frontier maps the maximum Sharpe ratio against the portfolio's average ESG score."],["that higher ESG always means a higher Sharpe ratio","At high ESG levels the constraint binds and the Sharpe ratio falls."]],"c":[2],"es":"The ESG-efficient frontier = max Sharpe ratio for each portfolio ESG level.","ed":"Pedersen et al. combine mean-variance with an ESG dimension. Starting from the tangency portfolio, investors can raise portfolio ESG at little cost at first, but at higher ESG levels the Sharpe ratio drops. They distinguish ESG-unaware, ESG-aware (use ESG as information about returns) and ESG-motivated investors (also derive utility from ESG). This connects to Lecture 9 (expected returns of green vs brown assets) and to the idea that constraints can be costly.","kt":"","src":"L8 slide 8"},{"id":"SB277","l":"L8","t":"Portfolio optimisation with ESG","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"Two stocks: A (10% return, 30 t emissions) and B (5% return, 20 t). An investor holding 50/50 sets a limit of at most 22 t. What happens?","o":[["Nothing changes","A binding emission constraint changes the weights."],["It moves toward A","A has higher emissions, so the limit forces less A."],["It moves toward B","At most 22 t requires mostly B (w(A) ≤ 0.2), so return is at most 6%."],["Return rises","Here the low-emission stock has the lower return."]],"c":[2],"es":"Weighted emissions 30w + 20(1 − w) ≤ 22 → w(A) ≤ 0.2 → return ≤ 6%.","ed":"This is the ESG-efficient frontier logic (Pedersen et al.): tight constraints can cost return if green assets have lower expected returns. Whether that holds in reality is an empirical question (Lecture 9: tastes, hedging, and unexpected green demand shifts).","kt":"Binding constraint: a limit that actually changes the optimal solution; its cost is the return given up.","src":"L8 slide 7 · L8 slide 8"},{"id":"SB278","l":"L8","t":"Investment industry","f":"m","d":2,"p":"H","sc":"none","s":"What is the difference between an asset owner and an asset manager?","o":[["The owner owns; the manager invests","Definitions on slide 14."],["The manager owns them; the owner advises","The roles are reversed."],["There is no difference","They are distinct links with a principal-agent relationship."],["Owners buy only bonds; managers buy only stocks","Both can deal with any asset class."]],"c":[0],"es":"Beneficiaries → asset owners (pension funds, insurers, funds) → asset managers → companies.","ed":"Beneficiaries or clients own a proportionate share of the assets held by an asset owner (pension fund, insurer, investment fund). The asset owner appoints asset managers to manage portfolios of financial assets on its behalf. Each link is a principal-agent relationship. Long chains distort incentives, shorten horizons and lose information - NBIM, for instance, uses about 111 external mandates (slide 72).","kt":"","src":"L8 slide 14 · Bok s. 185 (7.1.4) · Bok s. 185 (Figure 7.1)"},{"id":"SB279","l":"L8","t":"Investment industry","f":"m","d":3,"p":"M","sc":"short","s":"Many asset managers launched ESG funds when demand surged in 2020-21, then dropped the label when US political backlash grew. Why?","o":[["Regulators required ESG funds","No such requirement existed."],["Labels do not affect money flows","Hartzmark and Sussman show labels and ratings strongly affect flows."],["ESG funds pay no fees","ESG funds charge fees, often higher ones."],["Fees depend on assets under management","Product strategy responds to where client money and risks go."]],"c":[3],"es":"Fee-on-AUM model → products follow flows (and political risk).","ed":"This explains both the ESG boom and \"greenhushing\" (Brooks). It is why selling practices and product labelling is a material issue for asset managers, and why regulators police labels (SFDR, the SEC's DWS case).","kt":"Assets under management (AUM): the value of assets a manager runs; most revenues are fees proportional to AUM.","src":"L8 slide 17 · L8 slide 36 · Fondsfinans s. 10"},{"id":"SB280","l":"L8","t":"Investment industry","f":"m","d":3,"p":"M","sc":"none","s":"Which is a material issue for asset managers (SASB)?","o":[["Systemic risk management","Listed under leadership and governance."],["Tailings dam management","This is material for mining companies."],["Product safety recalls","Not listed for asset management."],["Water management at production sites","Not material for an asset manager's own operations."]],"c":[0],"es":"Selling practices and labelling, employee engagement and diversity, product design, business ethics, systemic risk - plus issues of the portfolio companies.","ed":"SASB lists for asset management: selling practices and product labelling (greenwashing risk - cf. SFDR reclassifications), employee engagement, diversity and inclusion, product design and lifecycle management (incorporating ESG in products), business ethics and systemic risk management. Additionally, any material issues of the companies in which the manager invests matter, so materiality depends on portfolio composition. UBS and Santander matrices (slides 20-21) illustrate this. Also true, but not offered as an option here: Selling practices and product labelling.","kt":"","src":"L8 slide 19-21"},{"id":"SB281","l":"L8","t":"SFDR","f":"m","d":2,"p":"H","sc":"none","s":"How do SFDR Article 8 and Article 9 funds differ?","o":[["Article 9 funds may not engage","Article 9 funds often have active engagement policies."],["Art. 9 has a sustainable goal; Art. 8 does not","Slides 24 and 26: Article 8 promotes, Article 9 invests in companies contributing positively, with do-no-significant-harm and good governance."],["Art. 9 promotes E/S; Art. 8 has impact goals","The definitions are reversed."],["Art. 8 funds disclose nothing","Article 8 funds have SFDR disclosure obligations."]],"c":[1],"es":"Art. 8 = \"light green\" (promotes E/S); Art. 9 = \"dark green\" (sustainable objective, DNSH, good governance).","ed":"The SFDR (for asset managers, pension funds and insurers) classifies products. Article 8 funds promote environmental or social characteristics, typically using exclusions, ESG integration and engagement. Article 9 funds invest in companies whose products and services contribute positively to society, ensure no significant harm and good governance, and usually have a thematic or impact focus aligned with SDGs and active engagement. Article 8 and 9 assets totalled EUR 7.1 trillion (58.8% of the EU universe, Morningstar, Dec 2025).","kt":"","src":"L8 slide 22-27"},{"id":"SB282","l":"L8","t":"SFDR","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Many funds were recently moved from Article 8 to Article 9 to use the stricter label for marketing.","o":[["True","Incorrect. The slide notes the opposite: a mass reclassification from Article 9 to Article 8, to avoid accusations of greenwashing."],["False","Correct. The slide notes the opposite: a mass reclassification from Article 9 to Article 8, to avoid accusations of greenwashing."]],"c":[1],"es":"False: funds moved from Article 9 down to Article 8 to avoid greenwashing accusations.","ed":"As regulators clarified what \"sustainable investment\" under Article 9 requires, many managers downgraded funds to Article 8 rather than risk greenwashing claims. This shows the tension between marketing labels and substance, and why selling practices and product labelling is a material issue for asset managers.","kt":"","src":"L8 slide 26 · L8 slide 19"},{"id":"SB283","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A church foundation will never own weapons or tobacco stocks, but otherwise wants market returns at low cost. Which strategy fits?","o":[["Impact investing","Higher cost, illiquid, and beyond the client's brief."],["Active ESG integration","Possible, but costlier than needed for a pure values constraint."],["A clean-water theme fund","Too concentrated for a market-like return target."],["Negative screening","Exclusions meet the values constraint while keeping a low-cost, diversified portfolio."]],"c":[3],"es":"Values-based exclusion + low cost = negatively screened index.","ed":"Exclusion is SF 1.0 and the easiest strategy for passive portfolios (Table 8.3). It fits clients with clear values constraints; investors seeking impact or alpha from ESG need integration, engagement or impact strategies.","kt":"Negative screening: excluding companies or sectors based on ethical or risk criteria.","src":"L8 slide 43 · L9 slide 35"},{"id":"SB284","l":"L8","t":"Drivers of responsible investment","f":"m","d":3,"p":"H","sc":"none","s":"What did Hartzmark and Sussman (2019) find when Morningstar introduced sustainability ratings?","o":[["Top-rated funds earned much more","They find no evidence that high-sustainability funds outperformed."],["Money left top-rated funds","High-rated funds received inflows."],["Ratings had no effect","Flows responded strongly to the ratings."],["Money moved into top-rated funds","This is the paper's main finding."]],"c":[3],"es":"Top globe ratings → inflows; bottom ratings → outflows; no evidence of outperformance.","ed":"When Morningstar began publishing globe ratings in 2016, funds with the highest rating attracted significant inflows and those with the lowest saw outflows, showing investors collectively put positive value on sustainability. They find no evidence that high-sustainability funds outperform, so the flows seem driven by non-pecuniary motives or beliefs. Riedl and Smeets (slide 35) similarly find social preferences and social signalling explain SRI holdings.","kt":"","src":"L8 slide 36 · L8 slide 35"},{"id":"SB285","l":"L8","t":"Drivers of responsible investment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Riedl and Smeets (2017) find that investors hold SRI funds mainly because they expect higher returns.","o":[["True","Incorrect. They find social preferences and social signalling explain SRI holdings; SRI investors actually expect lower returns and pay higher fees."],["False","Correct. They find social preferences and social signalling explain SRI holdings; SRI investors actually expect lower returns and pay higher fees."]],"c":[1],"es":"False: social preferences and signalling, not return expectations, drive SRI holdings.","ed":"Combining administrative data with incentivised experiments, Riedl and Smeets show investors with stronger social preferences (measured by trust and generosity games) and those who care about signalling are more likely to hold SRI funds, while financial motives play a smaller role. This fits the \"values\" (non-pecuniary) motive in Starks' value vs values framework (Lecture 1).","kt":"","src":"L8 slide 35 · Starks s. 1838"},{"id":"SB286","l":"L8","t":"Investor motives","f":"m","d":3,"p":"M","sc":"short","s":"Most professionals use ESG information mainly because it is financially material. How should ESG information be presented to them?","o":[["Linked to risk and growth","Mainstream investors look for financial relevance."],["As moral arguments only","Ethics is a less common motive among mainstream professionals."],["Without numbers","Investors want quantifiable, comparable data."],["As long lists of indicators","Lack of comparability and focus is their main complaint."]],"c":[0],"es":"Present ESG as financially material: linked to value drivers.","ed":"Professionals mostly consider ESG for performance reasons, then client demand and product strategy; lack of comparable data is the biggest obstacle. This supports SASB/ISSB-style financial materiality for investors - while CSRD adds impact materiality for other stakeholders.","kt":"Financial materiality: the extent to which an ESG issue affects a company's cash flows, risk or cost of capital.","src":"L8 slide 37-38 · Bok s. 226 (8.3)"},{"id":"SB287","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"Negative (exclusionary) screening means:","o":[["Ruling out \"bad\" investments","Slide 43 definition."],["Picking firms that gain from green trends","This is thematic investing."],["Picking the top ESG firms in each sector","This is best-in-class (positive) screening."],["Using votes and dialogue","This is stewardship / engagement."]],"c":[0],"es":"Negative screening excludes based on undesirable criteria (ethics/norms or risk, e.g. tobacco regulation, stranded assets).","ed":"Negative screening imposes exclusions based on ethical preferences or a normative worldview, or to avoid sectors prone to risk (tobacco regulation, fossil fuel stranded assets). Example: BlackRock ICS Euro Liquid Environmentally Aware Fund (slide 44). The textbook calls it a crude measure that steers money away from the worst firms (SF 1.0); about half of institutional ESG investors use ratings only for negative screening.","kt":"","src":"L8 slide 43-44 · Bok s. 189 (7.2.2) · Bok s. 194 (7.3.3)"},{"id":"SB288","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"H","sc":"short","s":"Fund 1 invests only in firms that gain from the clean water trend. Fund 2 keeps the top 30% ESG firms in each sector. Which labels fit?","o":[["Impact; ESG integration","Neither requires measured impact or integration into cash flow forecasts."],["Thematic; best-in-class","Thematic is top-down around a trend; best-in-class ranks within sectors."],["Best-in-class; thematic","The labels are swapped."],["Both are negative screening","Neither excludes based on \"undesirable\" criteria as such."]],"c":[1],"es":"Thematic = top-down trend portfolios (e.g. Xtrackers SDG 6 ETF); best-in-class = select leaders within each sector.","ed":"Best-in-class (positive) screening applies \"desirable\" criteria, selecting firms that clear a ranking hurdle within each sector, often using ESG ratings (e.g. iShares MSCI World SRI ETF combines negative and positive screening). Thematic investing builds a portfolio top-down around medium- to long-term trends (clean tech, sustainable agriculture, health care, climate mitigation; e.g. Xtrackers MSCI Global SDG 6 Clean Water ETF). The textbook labels positive screening with ratings \"SF 1.5\" because of the ratings' design limits.","kt":"","src":"L8 slide 45-52 · Bok s. 189 (7.2.2)"},{"id":"SB289","l":"L8","t":"SRI strategies","f":"t","d":2,"p":"H","sc":"none","s":"True or false: ESG integration means finding material ESG information and using it in the analysis, for example in cash flow forecasts or the cost of capital.","o":[["True","Correct. This is the definition on slide 53."],["False","Incorrect. This is the definition on slide 53."]],"c":[0],"es":"True: ESG integration brings material ESG information into financial analysis.","ed":"ESG integration explicitly includes ESG factors in traditional financial analysis of individual securities; implementation varies (BlackRock example, slides 54-55). The textbook sees full integration as SF 2.0, and Lecture 9 shows how to put it into a DCF (cash flows, scenarios, discount rate) and portfolio construction.","kt":"","src":"L8 slide 53-55 · Bok s. 189 (7.2.2) · L9 slide 7"},{"id":"SB290","l":"L8","t":"SRI strategies","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"LGIM engaged with Glencore on climate from 2016, filed a shareholder proposal in 2023, and sold Glencore from some funds in 2024. What does this show?","o":[["Moving from voice to exit","The slide lays out engagement, specific request, shareholder rights, escalation and consequence."],["Passive investing","LGIM actively used dialogue and a shareholder resolution."],["Impact investing","Glencore is a listed mining and commodity company."],["Negative screening from the start","Exclusion came only after years of engagement."]],"c":[0],"es":"Voice (dialogue, resolution) escalating to exit (divestment) is credible stewardship.","ed":"Stewardship uses investor rights and influence to protect and enhance long-term value, including common economic, social and environmental assets. LGIM's Climate Impact Pledge escalated from dialogue to a specific request (transparency on thermal coal), a shareholder resolution (2023), and finally divestment from selected funds (2024). The credible threat of exit can strengthen voice; slide 71 notes that passive investors cannot use exit, while active investors can use both voting, engagement and exit.","kt":"","src":"L8 slide 56-58 · L8 slide 71"},{"id":"SB291","l":"L8","t":"Active ownership","f":"m","d":4,"p":"H","sc":"none","s":"Dimson, Karakaş and Li (2015) find that:","o":[["engagement has no effect","Successful engagements were followed by improvements and positive returns."],["successful engagement raises returns","They report positive abnormal returns after successful engagements (especially on environmental and social issues) and no adverse effect after failures."],["engagement only works for majority owners","The investor typically held small stakes; coordination helps."],["engagement destroys value","They find positive effects for successful engagements."]],"c":[1],"es":"Successful engagement → positive abnormal returns and better performance; failure → no negative effect.","ed":"In \"Active Ownership\" (RFS 2015), successful engagements (roughly one in five) were followed by positive one-year abnormal returns and improvements in accounting performance and governance; unsuccessful ones had no negative return effect. In \"Coordinated Engagements\" (2020), collaborative engagements with a lead investor are more successful. This supports the textbook's condition of effective engagement and McCahery, Sautner and Starks' evidence on behind-the-scenes engagement.","kt":"","src":"L8 slide 60 · Bok s. 194 (7.3.4) · Bok s. 203 (7.4.3)"},{"id":"SB292","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"none","s":"What makes impact investing different from the other SRI strategies?","o":[["It works only in listed stocks","It is usually done through private equity, but also via bonds, real assets and public equity."],["Planned, measured impact","Slide 61: intention plus active measurement of social impact."],["It always accepts a zero return","Impact investing seeks impact alongside a financial return."],["It only excludes sin stocks","That is negative screening."]],"c":[1],"es":"Impact investing = intentional, measured positive impact alongside financial return.","ed":"Impact investing typically targets renewable energy, housing, health care, education, microfinance or sustainable agriculture, usually through private equity with concentrated ownership and longer horizons, but also through social impact bonds, real assets or public equity. The GSIR ordering on slides 39-40 shows strategies with increasing impact intent, measurement and reporting, from exclusions to impact investing. Lecture 10 covers green bonds and Lecture 9 the debate about whether listed equity can create additional impact.","kt":"","src":"L8 slide 61-65 · L8 slide 39"},{"id":"SB293","l":"L8","t":"SRI strategies","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about SRI strategies is correct?","o":[["Thematic and best-in-class are the same","Thematic is top-down by trend; best-in-class ranks within sectors."],["ESG integration excludes all below-average firms","Integration brings material ESG into valuation; it is not an exclusion rule."],["Negative screening measures every impact","Screening only applies exclusion rules."],["Impact investing measures impact most","The GSIR overview orders strategies by increasing impact intent."]],"c":[3],"es":"Strategies: negative screening, best-in-class, thematic, ESG integration, stewardship, impact investing - with rising impact intent toward impact investing.","ed":"GSIR classifies sustainable investment approaches: ESG integration, negative/exclusionary screening, norms-based screening, best-in-class/positive screening, sustainability-themed investing, corporate engagement and shareholder action (stewardship), and impact investing. They can be combined (e.g. Article 8 funds: exclusions + integration + engagement). The textbook adds that the deeper approaches require concentrated, active portfolios. Also true, but not offered as an option here: Stewardship uses voting and engagement rather than only buying or selling securities.","kt":"","src":"L8 slide 39-42 · L8 slide 56 · L8 slide 65"},{"id":"SB294","l":"L8","t":"Barriers to integration","f":"m","d":3,"p":"H","sc":"none","s":"Why is the efficient market hypothesis a barrier to integrating sustainability?","o":[["EMH requires concentrated portfolios","It implies holding the market portfolio."],["EMH forbids using the share price","It makes the stock price the central performance measure."],["EMH proves green firms do worse","The EMH makes no such claim."],["It makes passive investing seem best","The EMH suggests everyone should invest passively, leaving no allocation role for ESG analysis."]],"c":[3],"es":"EMH → all information priced → no benefit from active analysis → passive investing → no societal allocation role.","ed":"Under the EMH (Fama, 1970), arbitrage keeps prices correct, so investors cannot benefit from superior information; this suggests passive investing and makes the stock price the central performance measure. Behavioural finance (Tversky and Kahneman; momentum, Jegadeesh and Titman) and sustainability anomalies (Khan, Serafeim and Yoon) show markets are not always efficient. The adaptive markets hypothesis (Lo) explains why new risks such as environmental risks are priced only gradually, as more analysts examine them.","kt":"","src":"L8 slide 66-68 · Bok s. 181 (7.1.1) · Bok s. 182 (7.1.1) · Bok s. 189 (7.3.1)"},{"id":"SB295","l":"L8","t":"Barriers to integration","f":"m","d":3,"p":"M","sc":"none","s":"An asset has an expected return below the security market line (α < 0). What happens in an efficient market?","o":[["It is overpriced, so its price falls","The slide: expected return too low for its risk → overpriced → price falls → expected return rises."],["Investors buy it","Negative alpha signals too little return for the risk taken."],["Nothing happens","The CAPM applies the SML to every asset."],["It is underpriced, so its price rises","An expected return below the SML implies overpricing."]],"c":[0],"es":"Below the SML → overpriced → price falls → expected return rises back to the line.","ed":"In the CAPM, E(Ri) = Rf + βi(E(Rm) − Rf); only systematic risk is priced. An asset below the SML offers too little return for its beta, so rational investors sell, its price drops, and its expected return rises back to the line. The textbook criticises the CAPM for using only past return volatility as risk, ignoring fundamental and social-environmental risks. If ESG risks are not yet priced (AMH), similar adjustments may happen slowly as the market learns.","kt":"","src":"L8 slide 67 · Bok s. 182 (7.1.2) · Bok s. 183 (7.1.2)"},{"id":"SB296","l":"L8","t":"Market framework","f":"m","d":3,"p":"H","sc":"none","s":"Traditional investing (SF 1.0) vs investing for LTVC (SF 2.0). Which pairing is correct?","o":[["Portfolios: broad vs focused","Row \"Portfolios\" in Table 7.1."],["Chains: short vs long","The pairing is reversed in Table 7.1."],["Dialogue: deep vs limited","The pairing is reversed in Table 7.1."],["Horizon: decades vs 12 months","Reversed: traditional uses 12 months, LTVC years or decades."]],"c":[0],"es":"Traditional: EMH, max FV, EPS, long chains, diversified, limited dialogue, 12 months. LTVC: AMH, max IV, DCF with scenarios, short chains, concentrated, deep dialogue, years.","ed":"Summary of Table 7.1: traditional investing (SF 1.0) uses the EMH, treats S and E as irrelevant or already priced, maximises financial value, uses earnings per share, works through long and complicated chains with very diversified portfolios, limited dialogue and a 12-month horizon. Investing for LTVC (SF 2.0) uses the AMH (S and E priced as markets learn), maximises integrated value IV = FV + SEV, uses sophisticated DCF with internalisation scenarios, short chains, concentrated portfolios, deep dialogue and a horizon of years or decades. Also true, but not offered as an option here: Market framework: EMH (traditional) vs adaptive markets hypothesis (LTVC).","kt":"","src":"Bok s. 180 (Table 7.1) · L8 slide 74"},{"id":"SB297","l":"L8","t":"Adaptive markets hypothesis","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Under the adaptive markets hypothesis, how fast climate risks get priced depends on how many analysts study them and how well they learn.","o":[["True","Correct. Section 7.3.1 states that the AMH explains why new risks are not yet fully priced: not enough investors are examining them."],["False","Incorrect. Section 7.3.1 states that the AMH explains why new risks are not yet fully priced: not enough investors are examining them."]],"c":[0],"es":"True: ESG pricing is an evolutionary process driven by analysts' learning.","ed":"Lo's AMH links market efficiency to market ecology - the number of competitors, the size of profit opportunities and participants' adaptability. It allows path dependence, changing behaviour and varying risk preferences. As more analysts study ESG factors, they become priced in, gradually. This creates temporary inefficiencies (alpha opportunities) for early adopters, as Figure 7.3 shows with \"pockets of interesting data\".","kt":"","src":"Bok s. 189 (7.3.1) · Bok s. 190 (7.3.1) · Bok s. 192 (Figure 7.3)"},{"id":"SB298","l":"L8","t":"Performance measurement","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about fund performance measures is correct?","o":[["They capture social and environmental value","They live purely in the financial risk-return space."],["A beta below 1 means a defensive fund","Beta measures sensitivity to market movements."],["Low tracking error means a big deviation from the index","Low tracking error means it stays close to the index."],["The Sharpe ratio compares only with the index","Sharpe uses the risk-free rate, not the benchmark."]],"c":[1],"es":"Beta = market sensitivity; IR = excess return per unit of tracking error.","ed":"The textbook's critique is that these metrics push managers to hug benchmarks and ignore social and environmental value. Alternatives include peer groups, ranges of indices, absolute return targets and non-financial KPIs. Also true, but not offered as an option here: A high information ratio means sustained excess return relative to the risk taken versus the benchmark.","kt":"Tracking error: volatility of a fund's returns relative to its benchmark; information ratio: excess return per unit of tracking error.","src":"Bok s. 183 (7.1.3) · Bok s. 184 (Table 7.2)"},{"id":"SB299","l":"L8","t":"Performance measurement","f":"m","d":3,"p":"H","sc":"extended_course_case","s":"Norway limits the oil fund's (NBIM's) tracking error to about 1%. What follows from this?","o":[["It can freely make impact investments","The tight tracking error limit prevents large deviations."],["It is sure to beat its benchmark","Tracking error constrains deviations; it does not guarantee outperformance."],["Little room for active choices","The Fund owns ~2% stakes in thousands of companies."],["It must hold about 100 stocks","A 1% tracking error implies near-index holdings."]],"c":[2],"es":"A ~1% tracking error limit → near-passive, highly diversified portfolio with small stakes and limited allocation role.","ed":"The Ministry sets benchmarks (FTSE Global All Cap, Barclays Global Aggregate) and a tight tracking error, so NBIM holds about 2% of thousands of firms - illustrative of passive asset management (as is Vanguard). The textbook argues this leaves little societal allocation role and weakens monitoring (free-rider problem). NBIM compensates partly with voting, expectations documents and engagement, and exclusions by the Council on Ethics; Folketrygdfondet (guest lecture) runs a more concentrated domestic mandate with close ownership dialogue.","kt":"","src":"Bok s. 186 (Box 7.1) · L8 slide 15 · L8 slide 72"},{"id":"SB300","l":"L8","t":"Voice vs exit","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: An index fund tracking the Oslo index can credibly threaten to sell a company's shares if it dislikes its climate strategy.","o":[["True","Incorrect. An index fund must hold all index constituents, so it cannot exit; its levers are voting and engagement."],["False","Correct. An index fund must hold all index constituents, so it cannot exit; its levers are voting and engagement."]],"c":[1],"es":"False: index funds cannot exit; they must use voice.","ed":"This is why the large index providers matter most through voting (e.g. supporting Engine No. 1 at Exxon in 2021) and why critics question whether they engage enough across thousands of holdings.","kt":"Exit (\"Wall Street walk\"): selling shares to signal dissatisfaction or pressure management.","src":"L8 slide 71 · Bok s. 194 (7.3.4)"},{"id":"SB301","l":"L8","t":"Investment chains","f":"m","d":3,"p":"H","sc":"none","s":"Why do long investment chains increase short-termism?","o":[["Managers must sell within 12 months","No such legal requirement exists."],["Savers want quarterly payouts","Beneficiaries typically have long horizons (retirement); the agents shorten them."],["Each link is judged short-term","The horizon gets shorter with each extra party; meaningful information is lost."],["They always include high-speed traders","The issue is delegation and monitoring, not trading technology."]],"c":[2],"es":"More delegation → more agency problems → short-term benchmarks and lost information.","ed":"A pension fund chain runs from beneficiaries through the board, CEO/CIO, asset class heads, support functions and external managers; consultants and rating agencies add further links. Objectives, risk appetite, incentives, horizons and knowledge are not aligned, and the human reflex to long-term uncertainty is to focus on short-term measurable metrics (Neal and Warren, 2015). A long-term investor may still evaluate its managers quarterly. Remedy: align all parties on long-term outcomes and keep the chain short (condition 6).","kt":"","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 186 (7.1.4) · Bok s. 187 (7.1.4)"},{"id":"SB302","l":"L8","t":"ESG ratings limitations","f":"m","d":3,"p":"H","sc":"none","s":"A design weakness of ESG ratings is that:","o":[["the big agencies always agree","Howard (2016) finds a correlation of only 26% between the two largest agencies."],["even coal firms can score well","Listed in section 7.2.1."],["they are far too expensive","The problem is the opposite: as many as 70 stocks per analyst."],["they rely too much on site visits","They rely on reported data and policies, which are only a fraction of what is needed."]],"c":[1],"es":"Limitations: little materiality focus, reliance on reported data, industry neutrality, too many stocks per analyst → size bias, intuitively wrong ratings, low agreement.","ed":"ESG ratings try to be too many things to too many people. They rely on reported data and policies, are industry neutral and operations-focused, and analysts cover up to 70 stocks. Results: size bias, coal and tobacco \"leaders\", and material problems cancelled out by immaterial positives (Volkswagen, Toshiba). Correlation between the two largest providers was only 26% (Howard, 2016). Ratings are like valuation multiples: quick but imprecise shortcuts, better at portfolio level than company level, and a starting point for analysis. Also true, but not offered as an option here: They have little focus on material issues, so a fatal material issue can be offset by high scores on immaterial items.","kt":"","src":"L8 slide 73 · Bok s. 187 (7.2) · Bok s. 187 (7.2.1) · Bok s. 188 (7.2.1)"},{"id":"SB303","l":"L8","t":"ESG ratings limitations","f":"m","d":3,"p":"M","sc":"none","s":"How do investors' uses of ESG ratings fit the SF stages?","o":[["Positive screening is SF 2.0","Because of ratings' design limitations it is labelled SF 1.5."],["All rating-based strategies are SF 3.0","SF 3.0 requires optimising impact; ratings do not capture this."],["Exclusion 1.0, integration 2.0","Section 7.2.2 uses this labelling."],["Negative screening is SF 3.0","Exclusion is the most basic stage, SF 1.0."]],"c":[2],"es":"About half use ratings only for exclusion (SF 1.0); half for positive screening (SF 1.5); full integration = SF 2.0.","ed":"Among institutional ESG investors, about half use ESG ratings only for negative screening (excluding very negative externalities, SF 1.0), and half for positive screening such as best-in-class and thematic (labelled SF 1.5 due to rating limitations). Investors still rely on tracking errors and benchmarks; ratings are just added. Full ESG integration via fundamental analysis and engagement is SF 2.0; SF 3.0 would put impact first.","kt":"","src":"Bok s. 189 (7.2.2) · L1 slide 30"},{"id":"SB304","l":"L8","t":"Active investment approach","f":"m","d":4,"p":"H","sc":"none","s":"Why is analysing a firm's transition readiness nearly impossible for passive and quant funds?","o":[["ESG ratings already capture it","Ratings are of limited use for preparedness."],["Quant always wins","Quant ESG mainly tracks short-term ESG momentum and is complementary."],["It needs firm-specific judgement","Preparedness can so far only be assessed diagnostically by a fundamental analyst."],["They are not allowed to use ESG data","No such ban exists."]],"c":[2],"es":"Preparedness requires company-level, expert, diagnostic judgement; scalable metrics do not yet exist.","ed":"True sustainable investing means investing in transition, so investors must know whether a company's business model can adapt to a sustainable economy. Lacking objective and scalable metrics, this needs fundamental analysts using new tools and data (externalities, governance, behaviour). Figure 7.2 shows the workflow: identify material issues → assess qualitatively and quantitatively → estimate financial impact (e.g. human capital → margin advantage). Few analysts do this, which creates alpha opportunities. Cremers and Pareek: high active share plus patience (>2 years holding) outperform by over 2% per year.","kt":"","src":"Bok s. 190 (7.3.2) · Bok s. 191 (Figure 7.2) · Bok s. 191 (7.3.2)"},{"id":"SB305","l":"L8","t":"Active investment approach","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A portfolio needs at least 1,000 stocks to remove most firm-specific risk, so concentrated portfolios are always poorly diversified.","o":[["True","Incorrect. Statman shows that 50 to 100 stocks eliminate most idiosyncratic risk; benefits beyond 100 are small and exhausted beyond 300."],["False","Correct. Statman shows that 50 to 100 stocks eliminate most idiosyncratic risk; benefits beyond 100 are small and exhausted beyond 300."]],"c":[1],"es":"False: 50-100 stocks suffice; diversification across asset classes matters more.","ed":"Figure 7.4 shows diminishing benefits of diversification. Diversification gains come mainly from allocation across asset classes, so a concentrated portfolio within each class is fine. Excess diversification has costs: less selectiveness, less knowledge of and engagement with holdings, and a free-rider problem in monitoring management. Choi et al. (2017) find concentrated strategies by skilled investors earn excess risk-adjusted returns, consistent with information advantage theory.","kt":"","src":"Bok s. 193 (7.3.3) · Bok s. 193 (Figure 7.4) · Bok s. 194 (7.3.3)"},{"id":"SB306","l":"L8","t":"Active investment approach","f":"m","d":2,"p":"M","sc":"none","s":"How does too much diversification create a free-rider problem?","o":[["They free-ride on the CAPM","The free-rider problem concerns monitoring of corporate managements."],["Tiny stakes mean nobody monitors","Small percentage stakes mean few investors have sufficient incentive to monitor."],["They pay no tax on dividends","Taxation is unrelated to the monitoring problem."],["Index funds can
