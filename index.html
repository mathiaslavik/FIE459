als, but no reporting and no consequences for missing targets. What is the main weakness?","o":[["The goals are too ambitious","Incorrect: ambition is good if it is enforced."],["No checks or sanctions","Correct: there are no checks or sanctions."],["It has too many members","Incorrect: wide coverage is a strength."],["It is not run by the government","Incorrect: self-governed coalitions can work."]],"c":[1],"es":"Ingen kontroll og ingen konsekvenser.","ed":"Ifølge Ostrom trenger en koalisjon overvåking og sanksjoner for å virke. Uten rapportering og konsekvenser kan medlemmene love mye og gjøre lite. Stor dekning og ambisiøse mål hjelper ikke da. Husk: ingen kontroll = svak koalisjon.","kt":"Ostrom's design principles: clear boundaries, rules restricting use, collective choice, monitoring, graduated sanctions, conflict resolution.","src":"L13 slide 6-7 · Bok s. 111 (4.3.1) · Bok s. 112 (Table 4.3) · Bok s. 113 (4.3.1)"},{"id":"SB492","l":"L13","t":"Coalitions","f":"m","d":3,"p":"H","sc":"none","s":"How does the size of sustainable finance coalitions relate to their ambition?","o":[["No link","Incorrect: there is a clear link."],["Larger is more ambitious","Incorrect: the largest are the least ambitious."],["All are SF 3.0","Incorrect: most are SF 1.0 or 2.0."],["Larger is less ambitious","Correct: larger coalitions are less ambitious."]],"c":[3],"es":"Jo større koalisjon, jo lavere ambisjon.","ed":"Læreboka finner en omvendt sammenheng: jo flere medlemmer en koalisjon har, jo lavere ambisjon. Store koalisjoner må ha krav alle kan godta, så de havner mellom SF 1.0 og 2.0. Små koalisjoner kan være mer ambisiøse. Husk: stor = svak.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L13 slide 3-9 · Bok s. 113 (4.3.1)"},{"id":"SB493","l":"L13","t":"Coalitions","f":"m","d":2,"p":"M","sc":"none","s":"Which is a reason for joining a sustainable finance coalition?","o":[["Joint engagement","Correct: joint engagement is a reason to join."],["Escaping regulation","Incorrect: private and public efforts support each other."],["Avoiding monitoring","Incorrect: effective coalitions need monitoring."],["Higher short-term profits","Incorrect: coalitions focus on the long term."]],"c":[0],"es":"Felles engagement er en grunn til å bli med.","ed":"Motiver for å bli med i en koalisjon: collective engagement (mer tyngde overfor firmaer), collective advocacy (felles lobbying), peer effect (konkurrentene er med), reputation (bli sett som leder), outside pressure og risk avoidance. Husk: sammen er sterkere.","kt":"","src":"L13 slide 3-9 · Bok s. 110 (4.3.1) · Bok s. 111 (4.3.1)"},{"id":"SB494","l":"L13","t":"Coalitions","f":"m","d":3,"p":"H","sc":"none","s":"Using Ostrom's principles, what is a clear weak spot of many sustainable finance coalitions?","o":[["Weak enforcement and few sanctions","Correct: enforcement is weak and sanctions are few."],["Too many members from poor countries","Incorrect: members come from rich regions."],["No principles at all","Incorrect: several coalitions have clear principles."],["Too strict sanctions","Incorrect: sanctions are mostly missing."]],"c":[0],"es":"Svak håndheving og få sanksjoner.","ed":"Når man vurderer koalisjoner med Ostroms prinsipper, er svakheten tydelig: få har overvåking og sanksjoner. Bare WBCSD kan kaste ut medlemmer. Uten konsekvenser er det lett å snylte. Husk: mangler sanksjoner.\n\nForkortelser: WBCSD = World Business Council for Sustainable Development.","kt":"","src":"L13 slide 3-9 · Bok s. 111 (4.3.1) · Bok s. 113 (4.3.1) · Bok s. 114 (4.3.1)"},{"id":"SB495","l":"L13","t":"Government policy","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Green steel costs 25% more than normal steel (its \"green premium\"). Which policy best \"levels the playing field\"?","o":[["Banning steel imports","Incorrect: an import ban is not the mechanism."],["Cutting R&D funding","Incorrect: the lecture calls for more R&D."],["A rising carbon price","Correct: a rising carbon price closes the green premium."],["Ignoring emissions for now","Incorrect: without a price the green premium stays."]],"c":[2],"es":"En stigende karbonpris lukker green premium.","ed":"Green premium er ekstrakostnaden ved det grønne alternativet (her 25 % for grønt stål). Level the playing field betyr å prise utslippene, slik at den skitne varen blir dyrere og gapet krymper. Husk: karbonpris lukker green premium.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"Green premium: the extra cost of choosing a zero-carbon option over a fossil one.","src":"L13 slide 11-12 · L3 slide 19"},{"id":"SB496","l":"L13","t":"Coalitions","f":"m","d":2,"p":"L","sc":"none","s":"How do private coalitions and government regulation relate?","o":[["Coalitions make rules unnecessary","Incorrect: both are needed."],["They support each other","Correct: they support each other."],["Coalitions should fight regulation","Incorrect: coalitions support good policy."],["Rules always weaken coalitions","Incorrect: they complement each other."]],"c":[1],"es":"Koalisjoner og regulering støtter hverandre.","ed":"Læreboka mener private koalisjoner og offentlig regulering utfyller hverandre. Koalisjoner kan gå foran og vise hva som er mulig, og regulering kan gjøre det bindende for alle. Husk: privat + offentlig.","kt":"","src":"L13 slide 3-9 · Bok s. 111 (4.3.1) · Bok s. 114 (4.4)"},{"id":"SB497","l":"L13","t":"Transition dynamics","f":"m","d":2,"p":"H","sc":"none","s":"According to the x-curve (Loorbach et al.), how do transitions happen?","o":[["Through one decision that replaces everything","Incorrect: transitions take decades."],["Through small, smooth improvements","Incorrect: small improvements are what the old regime does."],["Only through collapse","Incorrect: the new grows in parallel."],["The new grows while the old breaks down","Correct: the new grows while the old breaks down."]],"c":[3],"es":"Det nye vokser mens det gamle bryter sammen.","ed":"X-curve (Loorbach et al.) har to linjer: den gamle måten bryter gradvis sammen (destabilisering, utfasing), mens den nye vokser frem (eksperimenter, akselerasjon, institusjonalisering). De krysser hverandre som en X. Husk: nytt opp, gammelt ned.","kt":"","src":"Bok s. 352 (12.1) · Bok s. 352 (Figure 12.1) · Bok s. 353 (12.1)"},{"id":"SB498","l":"L13","t":"Transition dynamics","f":"m","d":3,"p":"H","sc":"none","s":"Which practice is a small (incremental) change within today's financial system, not a transformation?","o":[["Optimising integrated value","Incorrect: optimising integrated value is the new regime."],["Focused portfolios for long-term value","Incorrect: focused portfolios are a transformative experiment."],["Using ESG ratings to screen","Correct: ESG screening improves things within today's system."],["Integrated investment and engagement teams","Incorrect: integrated teams are the new regime."]],"c":[2],"es":"ESG-screening er en liten forbedring innenfor dagens system.","ed":"Inkrementell endring forbedrer det eksisterende systemet uten å endre logikken, som å bruke ESG-ratinger for screening mens man fortsatt følger markedsindekser. Transformasjon endrer selve logikken, som å optimalisere integrated value. Husk: screening = finjustering.","kt":"","src":"Bok s. 353 (12.1) · Bok s. 356 (12.1.1.1)"},{"id":"SB499","l":"L13","t":"Transition management","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Backcasting starts from today and extends current trends forward to see where we end up in 2050.","o":[["True","Incorrect. Extending today's trends forward is forecasting; backcasting starts from the goal and works back."],["False","Correct. Extending today's trends forward is forecasting; backcasting starts from the goal and works back."]],"c":[1],"es":"Usant. Det er forecasting. Backcasting starter med målet og jobber bakover.","ed":"Forecasting starter i dag og forlenger trendene fremover. Backcasting starter med en ønsket fremtid (f.eks. net zero i 2050) og jobber bakover for å finne stegene som må tas. Backcasting brukes i transition management. Husk: back = fra målet tilbake til nå.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (Figure 12.2) · Bok s. 354 (12.1.1)"},{"id":"SB500","l":"L13","t":"Transition management","f":"m","d":2,"p":"H","sc":"none","s":"What is the \"new vision\" for the financial sector in chapter 12?","o":[["Finance long-term value","Correct: the financial sector should finance long-term value."],["Fund green projects only with subsidies","Incorrect: the book criticises a subsidy-dependent approach."],["Maximise return with some exclusions","Incorrect: that is the old regime."],["Replace private finance with state banks","Incorrect: not the book's vision."]],"c":[0],"es":"Finanssektoren skal finansiere langsiktig verdi.","ed":"Visjonen er at finanssektoren bruker sin rolle i kapitalallokering til å styre firmaer mot long-term value creation (integrated value). Ikke bare grønne prosjekter med subsidier, og ikke bare avkastning med noen exclusions. Husk: finance styrer mot langsiktig verdi.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (12.1.1.1) · Bok s. 355 (12.1.1.1) · Bok s. 356 (12.1.1.1)"},{"id":"SB501","l":"L13","t":"Transition management","f":"m","d":3,"p":"M","sc":"none","s":"In Loorbach's transition management, which tool works at the STRATEGIC level?","o":[["Transition experiments","Incorrect: experiments are at the operational level."],["Transition agendas","Incorrect: agendas are at the tactical level."],["Transition arenas","Correct: transition arenas are at the strategic level."],["Monitoring and evaluation","Incorrect: monitoring is at the reflexive level."]],"c":[2],"es":"Transition arenas er på strategisk nivå.","ed":"Loorbachs transition management har fire nivåer: strategic (transition arenas, der man lager felles visjon, f.eks. TCFD), tactical (transition agendas og veikart), operational (experiments) og reflexive (monitoring og evaluering). Husk: arena = strategisk.\n\nForkortelser: TCFD = Task Force on Climate-related Financial Disclosures (rammeverk for klimarisiko-rapportering).","kt":"","src":"L13 slide 13-16 · Bok s. 359 (Figure 12.4) · Bok s. 359 (12.2) · Bok s. 360 (12.2)"},{"id":"SB502","l":"L13","t":"Transition management","f":"m","d":2,"p":"M","sc":"none","s":"Which is a TRUE experiment in a new system, not just improving the old one?","o":[["Adding an ESG screen to an index fund","Incorrect: an ESG screen only scratches the surface."],["A small SDG-themed allocation","Correct: a small SDG-themed allocation is a true experiment."],["Publishing a CSR report","Incorrect: a CSR report belongs to the old regime."],["Quarterly benchmarking","Incorrect: quarterly benchmarking is the old regime."]],"c":[1],"es":"En liten SDG-allokering er et ekte eksperiment.","ed":"Et ekte transition experiment tester en ny måte å gjøre ting på i liten skala, som en SDG-tematisk allokering. Å legge på et ESG-filter eller skrive en CSR-rapport er bare små endringer i det gamle systemet. Husk: eksperiment = test av det nye.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger); CSR = Corporate Social Responsibility (firmaets samfunnsansvar).","kt":"","src":"L13 slide 13-16 · Bok s. 357 (12.1.1.3) · Bok s. 358 (12.1.1.3)"},{"id":"SB503","l":"L13","t":"Government policy","f":"m","d":3,"p":"M","sc":"short","s":"Coal regions like Poland's Silesia face job losses as coal is phased out. Which policy fits a \"just transition\"?","o":[["Keep the mines open forever","Incorrect: this blocks the transition."],["Phase out and retrain","Correct: phase out and retrain workers."],["Leave workers to charity","Incorrect: governments have a role."],["Close the mines overnight","Incorrect: it ignores the social costs."]],"c":[1],"es":"Fase ut og omskoler arbeiderne.","ed":"Just transition betyr at overgangen må være rettferdig: kostnadene skal ikke bare ramme arbeidere og regioner som er avhengige av fossilt. Kullgruver fases ut gradvis, og arbeiderne får omskolering og støtte. Husk: rettferdig fordeling av kostnader.","kt":"Just transition: moving to a low-carbon economy in a way that is fair to affected workers and communities.","src":"L13 slide 12 · PwC s. 47"},{"id":"SB504","l":"L13","t":"Role of players","f":"m","d":2,"p":"M","sc":"short","s":"Greenpeace runs a media campaign against a bank that finances an oil pipeline. Which player and tool is this?","o":[["Investors","Incorrect: Greenpeace is not a lender."],["Civil society","Correct: civil society uses media and public pressure."],["Households","Incorrect: this is an organised NGO campaign."],["Government","Incorrect: Greenpeace cannot tax."]],"c":[1],"es":"NGO-kampanje = civil society.","ed":"Aktører i overgangen: myndigheter (lover, skatt), investorer (kapital), firmaer, husholdninger (forbruk) og civil society (NGO-er). Sivilsamfunnet bruker debatt, media og press. Greenpeace sin kampanje mot banken er et klassisk eksempel. Husk: NGO = civil society.\n\nForkortelser: NGO = Non-Governmental Organisation (frivillig organisasjon, f.eks. Greenpeace).","kt":"Civil society: NGOs, media and citizens' groups that influence through public debate, campaigns and social pressure.","src":"L13 slide 9 · Bok s. 300 (Box 10.3)"},{"id":"SB505","l":"L13","t":"Government policy","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Technology, policy and markets must all be pulled at the same time; using only one (e.g. R&D subsidies) is unlikely to be enough.","o":[["True","Correct. All three levers (technology, policy, markets) must be pulled together to move away from fossil fuels."],["False","Incorrect. All three levers (technology, policy, markets) must be pulled together to move away from fossil fuels."]],"c":[0],"es":"Sant. Teknologi, politikk og marked må dras samtidig.","ed":"Forelesningen sier at teknologi, politikk og markeder må endres samtidig. Teknologi alene (f.eks. R&D-støtte) blir ikke tatt i bruk uten riktig pris og regulering. Husk: tre spaker samtidig.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"Policy mix: combining technology support (R&D), policy (prices, regulation) and market development to drive a transition.","src":"L13 slide 11-12"},{"id":"SB506","l":"L13","t":"Role of players","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A pension fund judges its managers quarterly, invests through several layers of external managers, and must mark illiquid assets to market. Which threat does it face?","o":[["Low trust in government","Incorrect: low trust in government is a household threat."],["A long investment chain","Correct: a long investment chain is the investor threat here."],["Short election cycles","Incorrect: election cycles concern governments."],["Single-issue campaigns","Incorrect: single-issue campaigns concern civil society."]],"c":[1],"es":"Lang investeringskjede er trusselen.","ed":"Pensjonsfondet har typiske investortrusler: kvartalsvis måling, mange ledd av eksterne forvaltere og mark-to-market av illikvide eiendeler. Alt dette gjør investeringskjeden lang og kortsiktig (som i L8). Husk: investor-trussel = lang kjede.","kt":"Investor mechanisms (Table 3.1): investment strategy, lending strategy and engagement; threats include short-termism, long investment chains, marking to market and supervisory treatment of illiquid investments.","src":"L13 slide 9 · L8 slide 72 · Bok s. 202 (Figure 7.6)"},{"id":"SB507","l":"L13","t":"Transition management","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: A bank that tests impact lending on 5% of its loans, monitors the results and scales up if it works is running a transition experiment.","o":[["True","Correct. Testing on a small scale, monitoring and scaling up is a transition experiment."],["False","Incorrect. Testing on a small scale, monitoring and scaling up is a transition experiment."]],"c":[0],"es":"Sant. Test, overvåk, skaler opp = transition experiment.","ed":"Banken tester impact-utlån på 5 % av porteføljen, følger med på resultatene og skalerer opp hvis det virker. Det er et transition experiment på operasjonelt nivå, og lærdommen går tilbake til strategien (refleksivt nivå). Husk: test → lær → skaler.","kt":"Transition experiments: small-scale trials of alternative practices that, if successful, are scaled up and institutionalised.","src":"L13 slide 14-16 · Bok s. 357 (12.1.1.3) · Bok s. 359 (12.2)"},{"id":"SB508","l":"L13","t":"Role of players","f":"m","d":2,"p":"M","sc":"none","s":"Why does the course stress global coalitions like the IPCC, COP and the Paris Agreement, not just national policy?","o":[["Countries cannot affect emissions","Incorrect: countries can affect emissions."],["They replace private coalitions","Incorrect: public and private coalitions complement each other."],["The IPCC sets carbon taxes","Incorrect: the IPCC assesses science."],["Climate is a global commons","Correct: climate is a global commons."]],"c":[3],"es":"Klima er et globalt fellesgode.","ed":"Klimaet er et globalt fellesgode: utslipp ett sted påvirker alle. Ingen land kan løse det alene, og alle kan snylte på andres innsats. Derfor trengs globale koalisjoner som IPCC, COP og Paris-avtalen for felles kunnskap og koordinering. Husk: global commons = global koordinering.\n\nForkortelser: IPCC = Intergovernmental Panel on Climate Change (FNs klimapanel); COP = Conference of the Parties (FNs årlige klimatoppmøte).","kt":"IPCC: the UN body assessing climate science; it informs policy but does not set binding rules.","src":"L13 slide 8 · L13 slide 10"},{"id":"SB509","l":"L13","t":"Transition synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A pension fund wants to move from SF 1.0 toward SF 2.0-3.0. Which steps follow transition management?","o":[["Vision, backcast, experiment","Correct: vision, backcasting, then experiments."],["Wait for regulators","Incorrect: private front-runners should lead too."],["Add more exclusions each year","Incorrect: more exclusions are incremental."],["Sell everything and buy impact funds","Incorrect: transitions are gradual."]],"c":[0],"es":"Visjon, backcast, eksperiment.","ed":"Transition management (Loorbach) følger stegene: lag en visjon for fremtiden, bruk backcasting for å finne veien dit, start eksperimenter, overvåk og juster. Å vente, legge til exclusions eller selge alt brått følger ikke metoden. Husk: visjon → backcast → eksperiment → lær.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L13 slide 13-16 · Bok s. 354 (12.1.1) · Bok s. 359 (12.2) · Bok s. 361 (12.3)"},{"id":"SB510","l":"L13","t":"Integrated thinking","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: When portfolio managers themselves lead engagement on material ESG issues, instead of a separate ESG team, engagement becomes a line function, as the textbook recommends.","o":[["True","Correct. When portfolio managers lead engagement themselves, it becomes part of their core job, as the book recommends."],["False","Incorrect. When portfolio managers lead engagement themselves, it becomes part of their core job, as the book recommends."]],"c":[0],"es":"Sant. Når forvalterne selv engasjerer, blir det en del av jobben.","ed":"Læreboka anbefaler at de som tar investeringsbeslutningene, også driver engagement. Da kobles dialogen med firmaet direkte til analysen. Når et separat ESG-team gjør det, blir det lett en sidefunksjon. Husk: integrerte team.","kt":"Line function vs staff function: line functions make the core decisions (investing, lending); staff functions advise or support from the side.","src":"Bok s. 361 (12.3) · Bok s. 362 (12.3) · Folketrygdfondet s. 24","e":1},{"id":"L13S01","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A Norwegian bank joins a net-zero banking alliance mainly because its competitors have already joined. Which motive is this?","o":[["Collective advocacy","Incorrect: collective advocacy is joint lobbying."],["Peer effect","Correct: joining because competitors have joined is a peer effect."],["Collective engagement","Incorrect: collective engagement is joint dialogue with firms."],["Risk avoidance","Incorrect: risk avoidance is about stranded assets."]],"c":[1],"es":"Banken blir med fordi konkurrentene er med = peer effect.","ed":"Motiver for koalisjoner (slide 4): peer effect (konkurrentene er med), reputation, outside pressure, risk avoidance, collective engagement og collective advocacy. Banken blir med fordi andre har gjort det, for å ikke falle bak. Husk: peer = gjør som de andre.","kt":"Peer effect: joining because competitors have joined, to avoid a competitive disadvantage.","src":"L13 slide 4"},{"id":"L13S02","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"An asset manager joins an investor coalition mainly to lobby governments together for a higher carbon price. Which motive is this?","o":[["Reputation","Incorrect: reputation is about being seen as a leader."],["Outside pressure","Incorrect: outside pressure comes from NGOs or clients."],["Peer effect","Incorrect: peer effect is following competitors."],["Collective advocacy","Correct: joint lobbying on policy is collective advocacy."]],"c":[3],"es":"Felles lobbying for karbonpris = collective advocacy.","ed":"Collective advocacy betyr å påvirke politikk sammen, for eksempel å lobbe for høyere karbonpris. Collective engagement er derimot dialog med firmaer. Husk: advocacy = politikk, engagement = firmaer.\n\nForkortelser: NGO = Non-Governmental Organisation (frivillig organisasjon, f.eks. Greenpeace).","kt":"","src":"L13 slide 4"},{"id":"L13S03","l":"L13","t":"Coordinated engagement","f":"m","d":2,"p":"H","sc":"none","s":"Which engagement strategy do Dimson, Karakaş and Li (2020) find effective?","o":[["Delegating all dialogue to proxy advisors","Incorrect: proxy advisors are not the strategy studied."],["Each investor engaging alone and confidentially","Incorrect: collaboration works better."],["A lead investor backed by supporting investors","Correct: a lead investor backed by supporting investors."],["Divesting first and engaging afterwards","Incorrect: divesting loses your voice."]],"c":[2],"es":"En lead investor med støttende investorer.","ed":"Dimson, Karakaş og Li (2020) finner at en two-tier strategy virker best: én eller noen få lead investors driver dialogen, mens mange supporting investors står bak og gir tyngde. Husk: leder + støttespillere.","kt":"Coordinated engagement: several investors engaging a company together through a coalition.","src":"L13 slide 5"},{"id":"L13S04","l":"L13","t":"Coordinated engagement","f":"m","d":3,"p":"H","sc":"none","s":"When is an investor more likely to lead a joint engagement (Dimson, Karakaş and Li, 2020)?","o":[["When it plans to sell soon","Incorrect: an investor about to sell has little reason to lead."],["When it has never met the firm","Incorrect: leadership is linked to stake size and home market."],["Small stake, foreign target","Incorrect: this is the opposite of the finding."],["Larger stake, domestic target","Correct: larger stake and a domestic target."]],"c":[3],"es":"Større eierandel og hjemmemarked gjør at investoren leder.","ed":"Investorer leder oftere engagement når de har en stor eierandel i selskapet og selskapet er i hjemlandet. Da har de mer å tape, bedre kunnskap og bedre tilgang til ledelsen. Husk: stor + lokal = leder.","kt":"","src":"L13 slide 5"},{"id":"L13S05","l":"L13","t":"Coordinated engagement","f":"t","d":3,"p":"H","sc":"none","s":"Do joint engagements succeed more often when the lead investors are domestic and the supporting investors are international?","o":[["Yes","Correct. Domestic leads bring local knowledge and access; international supporters add weight."],["No","Incorrect. Domestic leads bring local knowledge and access; international supporters add weight."]],"c":[0],"es":"Ja. Lokale ledere og internasjonale støttespillere gir best resultat.","ed":"Dimson, Karakaş og Li finner at engagement lykkes oftere når lederen er en lokal investor og støttespillerne er internasjonale. Lokale ledere kjenner selskapet og kulturen, og internasjonale støttespillere gir økonomisk tyngde. Husk: lokal leder + internasjonal støtte.","kt":"","src":"L13 slide 5"},{"id":"L13S06","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"Which policy priority says that a lack of information, skilled staff or incentives can block decarbonisation?","o":[["Mind the investment gap","Incorrect: the investment gap is about public funding for new tech."],["Plan for a just transition","Incorrect: just transition is about communities hit by change."],["Overcome non-market barriers","Correct: non-market barriers like missing information or skills."],["Level the playing field","Incorrect: levelling the field is about the carbon price."]],"c":[2],"es":"Manglende info, folk eller incentiver = non-market barriers.","ed":"Gates-stil politikkprioriteringer: level the playing field (karbonpris), mind the investment gap (offentlig R&D), overcome non-market barriers (mangel på info, kompetanse, incentiver), stay up to date (oppdater gamle regler) og plan for a just transition. Husk: non-market = ikke pris.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"","src":"L13 slide 11"},{"id":"L13S07","l":"L13","t":"Why government policies matter","f":"m","d":3,"p":"H","sc":"none","s":"The \"Stay up to date\" point warns that:","o":[["Old government rules can block decarbonisation","Correct: old government rules can block decarbonisation."],["Carbon prices should be frozen at current levels","Incorrect: the carbon price should rise."],["ESG ratings must be updated every year","Incorrect: the point is about policy, not ratings."],["Firms must report their emissions every quarter","Incorrect: reporting frequency is not the point."]],"c":[0],"es":"Gamle regler kan blokkere avkarbonisering.","ed":"Stay up to date: noen ganger er hindringen utdaterte offentlige regler, for eksempel byggeforskrifter som ikke tillater nye materialer. Myndighetene må oppdatere politikken slik at den ikke blokkerer grønne løsninger. Husk: gamle regler kan blokkere.","kt":"","src":"L13 slide 11"},{"id":"L13S08","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"\"Mind the investment gap\" calls for:","o":[["Cutting public research so markets decide","Incorrect: the lecture argues for more public R&D."],["Raising interest rates to slow investment","Incorrect: the aim is to close the gap."],["Public funding for new zero-carbon tech","Correct: public funding for new zero-carbon technology."],["Banning private investment in energy","Incorrect: private investment is needed too."]],"c":[2],"es":"Offentlig finansiering av ny nullutslippsteknologi.","ed":"Mind the investment gap: private investorer vil ikke alene finansiere tidlig utvikling av ny nullutslippsteknologi, fordi risikoen er høy og gevinsten usikker. Staten må fylle gapet med forskning og tidlig finansiering. Husk: offentlig R&D fyller gapet.\n\nForkortelser: R&D = Research and Development (forskning og utvikling).","kt":"","src":"L13 slide 11"},{"id":"L13S09","l":"L13","t":"What each of us can do","f":"m","d":3,"p":"H","sc":"none","s":"Employers should \"help early-stage innovators get across the valley of death\". The valley of death is:","o":[["Climate damage concentrated in poor countries","Incorrect: that is about physical risk and justice."],["The funding gap from lab to market","Correct: the funding gap from lab to market."],["The fall in share prices after an IPO","Incorrect: not the meaning here."],["Job losses in regions that depend on coal","Incorrect: that is the just transition issue."]],"c":[1],"es":"Valley of death = finansieringsgapet fra lab til marked.","ed":"Valley of death er perioden mellom en fungerende prototype og et lønnsomt produkt. Her er det for sent for forskningsmidler og for tidlig for vanlige investorer, så mange teknologier dør. Husk: lab → marked = dødens dal.\n\nForkortelser: IPO = Initial Public Offering (børsnotering).","kt":"Valley of death: the stage where a new technology has been shown to work but cannot yet attract enough funding to scale.","src":"L13 slide 18"},{"id":"L13S10","l":"L13","t":"Role of players","f":"m","d":2,"p":"H","sc":"none","s":"Which task does the lecture give to governments?","o":[["Writing firms' sustainability reports","Incorrect: firms prepare their own reports."],["Producing commercial ESG ratings","Incorrect: private providers produce ratings."],["Choosing which stocks pension funds buy","Incorrect: investors make their own choices."],["Setting taxation and carbon pricing","Correct: setting taxes and carbon pricing."]],"c":[3],"es":"Myndighetene skal sette skatter og karbonpris.","ed":"Myndighetenes rolle (slide 8): lover og regulering, skatter, karbonpris, og overvåking av at reglene følges. Rapporter, ratinger og investeringsvalg er det private aktører som gjør. Husk: staten setter rammene.","kt":"","src":"L13 slide 8"},{"id":"TR60","l":"L13","t":"Coalitions","f":"m","d":3,"p":"M","sc":"none","s":"What goes wrong if a coalition lets almost anyone become a member?","o":[["Membership then means little","Correct: membership then means little as a signal."],["It becomes an SF 3.0 network","Incorrect: breadth does not change the SF type."],["Almost nobody can join","Incorrect: that is the problem of too narrow boundaries."],["Members are fined","Incorrect: most coalitions have no fines."]],"c":[0],"es":"Hvis alle kan bli med, betyr medlemskap lite.","ed":"Ostroms første prinsipp er klare grenser for hvem som er med. Hvis nesten hvem som helst kan bli medlem, blir medlemskapet et svakt signal, og koalisjonen mister troverdighet. Husk: for åpne grenser = meningsløst medlemskap.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Opptak L12 ca. 54 min"},{"id":"TR61","l":"L13","t":"Coalitions","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An asset manager joins a climate coalition mainly so its engagement with big emitters carries more weight. Which motive is this?","o":[["Reputation","Incorrect: reputation is about signalling."],["Risk avoidance","Incorrect: the aim is influence, not avoiding risk."],["Outside pressure","Incorrect: no outside pressure is described."],["Collective engagement","Correct: collective engagement gives more weight."]],"c":[3],"es":"Mer tyngde i engagement = collective engagement.","ed":"Når målet er at engagement med firmaer skal få mer tyngde, er motivet collective engagement. Mange investorer sammen øker sjansen for at selskapet lytter (Dimson et al.). Husk: engagement = dialog med firmaer.","kt":"","src":"Opptak L12 ca. 51 min"},{"id":"TR62","l":"L13","t":"Transition management","f":"m","d":3,"p":"M","sc":"none","s":"In the transition management interview, what is the biggest challenge for transitions?","o":[["Inventing new technology","Incorrect: better technology often already exists."],["Changing institutions and culture","Correct: changing institutions and culture is hardest."],["One global plan","Incorrect: transition management builds on small experiments."],["Raising interest rates","Incorrect: monetary policy is not discussed."]],"c":[1],"es":"Det vanskeligste er å endre institusjoner og kultur.","ed":"I intervjuet sier eksperten at \"technology is the least of our problems\": bedre teknologi finnes ofte allerede. Det vanskeligste er å endre institusjoner, regler, vaner og kultur. Husk: kultur og institusjoner er flaskehalsen.","kt":"","src":"Opptak L12 ca. 60 min · Opptak L12 ca. 64 min"},{"id":"DF001","l":"L1","t":"Definition of sustainable finance","f":"m","d":1,"p":"H","sc":"none","s":"The European Commission defines sustainable finance as:","o":[["Investing only in renewable energy and other clean technology projects","Incorrect: renewable energy is one possible target, but the definition is much broader."],["Public money given to green firms","Incorrect: the definition is about the financial sector's own decisions, not subsidies."],["Avoiding all firms with any emissions","Incorrect: that would be an extreme exclusion rule, not the definition."],["Taking ESG factors into account in investment decisions","Correct: the EU definition is about using ESG factors when investing, leading to more long-term sustainable investment."]],"c":[3],"es":"EU: sustainable finance = ta hensyn til ESG i investeringsbeslutninger.","ed":"Slide 25 gir to definisjoner. Schoenmaker og Schramade: hvordan finance (investering og utlån) samspiller med økonomiske, sosiale og miljømessige forhold. EU-kommisjonen: å ta hensyn til ESG-forhold i investeringsbeslutninger, slik at mer kapital går til langsiktige, bærekraftige aktiviteter. Husk: EU-definisjonen = ESG inn i investeringsbeslutningen.","kt":"","src":"L1 slide 25"},{"id":"DF002","l":"L1","t":"Principal-agent problem","f":"m","d":1,"p":"H","sc":"none","s":"The principal-agent problem is:","o":[["A conflict between two competing firms that sell the same product","Incorrect: it is about a principal and the person acting for them, not rival firms."],["A rule that managers must own shares","Incorrect: giving shares is one solution, not the problem itself."],["An agent acting for a principal but with other interests","Correct: the manager (agent) acts for the investor (principal) but may follow his own interests."],["A tax paid by the principal to the agent","Incorrect: it has nothing to do with taxes."]],"c":[2],"es":"Agent (leder) handler for principal (eier), men har egne interesser.","ed":"Principal-agent problem: en principal (f.eks. investor) lar en agent (f.eks. leder) handle på sine vegne, men agenten har andre interesser. Kjernen er information asymmetry: agenten vet mer. To former: adverse selection (før avtalen) og moral hazard (etter avtalen). Husk: eier = principal, leder = agent.","kt":"","src":"L1 slide 23"},{"id":"DF003","l":"L1","t":"Information asymmetry","f":"m","d":1,"p":"H","sc":"none","s":"Information asymmetry means:","o":[["Both sides of a contract know exactly the same things","Incorrect: that is symmetric information."],["One side of a deal knows more than the other","Correct: one party has information the other does not, which is the core of agency problems."],["Prices include all information","Incorrect: that is the efficient market hypothesis."],["A firm reports both good and bad news","Incorrect: that is transparency, which reduces asymmetry."]],"c":[1],"es":"Information asymmetry = den ene parten vet mer enn den andre.","ed":"Slide 23 sier at information asymmetry er kjernen i principal-agent-problemet. Lederen vet mer om firmaet enn eierne, og låntakeren vet mer om prosjektet enn banken. Det gir rom for adverse selection og moral hazard. Husk: asymmetri = ulik informasjon.","kt":"","src":"L1 slide 23"},{"id":"DF004","l":"L1","t":"CSR vs SRI vs ESG","f":"m","d":1,"p":"H","sc":"none","s":"SRI (socially responsible investing) is:","o":[["Stakeholder management done by investors","Correct: SRI is the investor side of stakeholder management; CSR is the corporate side."],["Stakeholder management done by firms","Incorrect: that is CSR."],["A score that measures the ESG outcomes of a firm","Incorrect: that is ESG metrics."],["A law that forces green investing","Incorrect: SRI is a voluntary strategy, not a law."]],"c":[0],"es":"SRI = investor-siden av stakeholder management.","ed":"Slide 33: stakeholder management settes ut i praksis gjennom CSR (firma-siden) og SRI (investor-siden). ESG er målingen av resultatet. Husk: CSR = firma gjør, SRI = investor gjør, ESG = måling.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar); SRI = Socially Responsible Investing (ansvarlig investering).","kt":"","src":"L1 slide 33"},{"id":"DF005","l":"L1","t":"Double materiality","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Double materiality means looking at how climate affects the firm and how the firm affects climate.","o":[["True","Correct. Double materiality has two directions: outside-in (financial) and inside-out (impact)."],["False","Incorrect. Double materiality has two directions: outside-in (financial) and inside-out (impact)."]],"c":[0],"es":"Sant. Double materiality = to retninger.","ed":"Double materiality (slide 36) betyr at man ser begge veier: hvordan klima og samfunn påvirker firmaets verdi (financial materiality, outside-in), og hvordan firmaet påvirker klima og samfunn (impact materiality, inside-out). Husk: outside-in + inside-out.","kt":"","src":"L1 slide 36"},{"id":"DF006","l":"L1","t":"Planetary boundaries","f":"m","d":1,"p":"H","sc":"none","s":"Planetary boundaries are:","o":[["National borders for trading carbon","Incorrect: they are about the Earth system, not national borders."],["Maximum sizes for firms","Incorrect: they have nothing to do with firm size."],["Safe limits for how much we can stress the Earth","Correct: they mark safe limits for things like climate, biodiversity and nutrients."],["The minimum social needs that all people should have met","Incorrect: that is the social floor in the doughnut."]],"c":[2],"es":"Planetary boundaries = trygge grenser for belastning på jorda.","ed":"Planetary boundaries (Steffen, Rockström m.fl.) er grenser for hvor mye vi kan belaste jordas systemer, som klima, biologisk mangfold og nitrogen/fosfor. I Raworths doughnut er dette det økologiske taket, mens det sosiale gulvet er minstebehovene. Husk: boundaries = taket.","kt":"","src":"L1 slide 35"},{"id":"DF007","l":"L2","t":"Business ethics","f":"m","d":1,"p":"H","sc":"none","s":"Business ethics is:","o":[["The laws and tax rules a firm must follow in each country","Incorrect: ethics goes beyond what the law requires."],["Rules for what is right or wrong at work","Correct: this is the Cambridge Dictionary definition on the slide."],["A firm's marketing of good deeds","Incorrect: that is communication, not ethics itself."],["The study of how to maximise profit","Incorrect: that is not ethics."]],"c":[1],"es":"Business ethics = regler og prinsipper for hva som er rett og galt i jobben.","ed":"Slide 4: business ethics er reglene, prinsippene og standardene for å avgjøre hva som er moralsk rett eller galt i arbeidslivet. Det er bredere enn loven: noe kan være lovlig, men uetisk. Husk: ethics ≠ law.","kt":"","src":"L2 slide 4"},{"id":"DF008","l":"L2","t":"Ethical absolutism","f":"m","d":1,"p":"H","sc":"none","s":"Ethical absolutism says that:","o":[["Some moral rules apply everywhere and always","Correct: absolutism holds that there are eternal, universal moral principles."],["Morality depends on local culture and differs between places","Incorrect: that is ethical relativism."],["Only outcomes matter","Incorrect: that is consequentialism, which is one type within absolutism."],["There are no moral rules at all","Incorrect: absolutism claims the opposite."]],"c":[0],"es":"Absolutism = universelle moralregler som gjelder overalt.","ed":"Slide 7: ethical absolutism sier at det finnes evige, universelle moralprinsipper. Ethical relativism sier at moral avhenger av kontekst og er subjektiv. Under absolutism ligger egoism, utilitarianism, duty (Kant) og rights & justice. Husk: absolutt = gjelder alltid.","kt":"","src":"L2 slide 7"},{"id":"DF009","l":"L2","t":"Consequentialist theories","f":"m","d":1,"p":"H","sc":"none","s":"A consequentialist ethical theory judges an action by:","o":[["The motive behind it","Incorrect: that is non-consequentialist (duty, rights)."],["Local customs","Incorrect: that is relativism."],["Whether it is legal","Incorrect: legality is not the test in ethical theory."],["Its outcomes","Correct: consequentialist theories (egoism, utilitarianism) look at results."]],"c":[3],"es":"Consequentialist = dømmer etter utfallet.","ed":"Slide 9 deler absolutist-teoriene i to. Consequentialist (outcomes): ethical egoism og utilitarianism. Non-consequentialist (motivation/principles): ethics of duty (Kant) og rights & justice. Husk: consequence = konsekvens = utfall.","kt":"","src":"L2 slide 9"},{"id":"DF010","l":"L2","t":"Utilitarianism","f":"m","d":1,"p":"H","sc":"none","s":"Utilitarianism focuses on:","o":[["Your own self-interest only","Incorrect: that is ethical egoism."],["Duties that apply no matter the outcome","Incorrect: that is ethics of duty (Kant)."],["Outcomes and collective welfare","Correct: utilitarianism seeks the greatest total good for everyone affected."],["Close relationships","Incorrect: that is ethics of care."]],"c":[2],"es":"Utilitarianism = mest mulig total nytte for alle.","ed":"Utilitarianism (slide 9) er en konsekvensetikk med fokus på utfall og kollektiv velferd: det riktige er det som gir størst total nytte. Den deles i act (denne handlingen) og rule (regelen). Ethical egoism ser bare på egen interesse. Husk: utility = nytte for alle.","kt":"","src":"L2 slide 9"},{"id":"DF011","l":"L2","t":"Ethics of duty","f":"m","d":1,"p":"H","sc":"none","s":"The categorical imperative (Kant) says you should:","o":[["Do what gives the best total outcome","Incorrect: that is utilitarianism."],["Act only on rules that could become a universal law","Correct: this is the core test of ethics of duty."],["Follow what your gut tells you","Incorrect: that is postmodern ethics."],["Protect your closest relationships first, even if others lose","Incorrect: that is ethics of care."]],"c":[1],"es":"Kant: handle bare etter regler som kunne vært en universell lov.","ed":"Ethics of duty (Kant) er non-consequentialist: handlingen er riktig eller gal uavhengig av utfallet. Categorical imperative: handle bare etter prinsipper du kan ønske at alle skal følge, og behandle mennesker som mål, ikke bare midler. Husk: \"hva hvis alle gjorde det?\".","kt":"","src":"L2 slide 9"},{"id":"DF012","l":"L2","t":"Virtue ethics","f":"m","d":1,"p":"H","sc":"none","s":"Virtue ethics focuses on:","o":[["Character: striving to be a good person","Correct: virtue ethics asks what a person of good character would do."],["The total outcome for society","Incorrect: that is utilitarianism."],["Open dialogue between all the people affected","Incorrect: that is discourse ethics."],["Universal rights for all humans","Incorrect: that is rights and justice."]],"c":[0],"es":"Virtue ethics = karakter.","ed":"Slide 10 lister de fire relativist-teoriene: virtue ethics (karakter, være et godt menneske), ethics of care (relasjoner), discourse ethics (dialog) og postmodern ethics (moralsk impuls). Husk: virtue = karakter.","kt":"","src":"L2 slide 10"},{"id":"DF013","l":"L2","t":"Discourse ethics","f":"m","d":1,"p":"H","sc":"none","s":"Discourse ethics says ethical conflicts are solved through:","o":[["Rules set by top management","Incorrect: that is not discourse ethics."],["Calculating total benefits","Incorrect: that is utilitarianism."],["Personal gut feeling","Incorrect: that is postmodern ethics."],["Honest and open discussion","Correct: discourse ethics resolves conflicts through argument and dialogue."]],"c":[3],"es":"Discourse ethics = åpen, ærlig dialog.","ed":"Discourse ethics (slide 10) sier at konflikter løses gjennom ærlig og åpen diskusjon mellom rasjonelle mennesker. Ethics of care ser på relasjoner, og postmodern ethics stoler på den moralske impulsen. Husk: discourse = diskusjon.","kt":"","src":"L2 slide 10"},{"id":"DF014","l":"L2","t":"Ethics of care","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Ethics of care says our first responsibility is to our significant relationships.","o":[["True","Correct. Ethics of care focuses on relationships; our first duty is to the people close to us."],["False","Incorrect. Ethics of care focuses on relationships; our first duty is to the people close to us."]],"c":[0],"es":"Sant. Ethics of care = relasjoner først.","ed":"Ethics of care (slide 10) ser mennesker som relasjonelle og avhengige av hverandre. Det første ansvaret er overfor nære relasjoner. Det skiller seg fra Kant, som krever upartiske, universelle regler. Husk: care = de nære.","kt":"","src":"L2 slide 10"},{"id":"DF015","l":"L2","t":"Descriptive ethics","f":"m","d":1,"p":"H","sc":"none","s":"Descriptive ethical theories explain:","o":[["What the right decision is","Incorrect: that is normative ethics."],["How ethical decisions are actually made","Correct: descriptive theories describe the real decision process and what influences it."],["Which laws and rules a firm must follow at work","Incorrect: that is law, not descriptive ethics."],["How to price externalities","Incorrect: that belongs to L3."]],"c":[1],"es":"Descriptive = hvordan beslutninger faktisk tas.","ed":"Slide 12: descriptive ethical theories beskriver hvordan etiske beslutninger faktisk tas i business, og hvilke faktorer som påvirker dem: individual factors (alder, verdier, locus of control) og situational factors (moral intensity, framing, kultur). Normative teorier sier hva som er riktig. Husk: descriptive = \"er\", normative = \"bør\".","kt":"","src":"L2 slide 12"},{"id":"DF016","l":"L2","t":"Locus of control","f":"m","d":1,"p":"H","sc":"none","s":"Locus of control is:","o":[["How much you believe you control events in your life","Correct: the slide defines it as the extent you believe you control events."],["How much power the CEO has","Incorrect: it is a personal belief, not formal power."],["A firm's internal audit system","Incorrect: that is internal control."],["Seeing the many possible moral outcomes of your choices","Incorrect: that is moral imagination."]],"c":[0],"es":"Locus of control = hvor mye du tror du selv styrer.","ed":"Slide 15: locus of control er i hvilken grad man tror man har kontroll over hendelser i livet. Internal = jeg kan påvirke. External = andre bestemmer. Moral imagination er evnen til å se mulighetene og de moralske konsekvensene av valg. Husk: locus = hvor kontrollen sitter.","kt":"","src":"L2 slide 15"},{"id":"DF017","l":"L2","t":"Whistleblowing","f":"m","d":1,"p":"H","sc":"none","s":"Whistleblowing is when an employee:","o":[["Leaves the firm for a rival","Incorrect: that is just changing jobs."],["Refuses to follow a legal order from a manager","Incorrect: that is not the definition."],["Reports good results to investors","Incorrect: that is normal reporting."],["Exposes wrongdoing in the firm","Correct: whistleblowing means intentionally revealing perceived violations."]],"c":[3],"es":"Whistleblowing = avsløre ulovlig eller uetisk atferd i firmaet.","ed":"Slide 18: whistleblowing er når en ansatt bevisst avslører det hun oppfatter som etiske eller juridiske brudd. Det krever ofte beskyttelse; Sarbanes-Oxley krever anonyme varslingskanaler i amerikanske børsselskaper. Husk: varsling krever vern.","kt":"","src":"L2 slide 18"},{"id":"DF018","l":"L2","t":"Moral framing","f":"m","d":1,"p":"H","sc":"none","s":"Moral framing means that:","o":[["Ethics is decided by a framework law","Incorrect: it has nothing to do with laws."],["Firms must disclose moral risks","Incorrect: that is reporting."],["The same issue can be seen differently based on how it is described","Correct: framing and language shape whether people see an issue as moral."],["Every business decision carries the same moral weight, whatever words are used","Incorrect: that ignores framing."]],"c":[2],"es":"Moral framing = måten saken beskrives på, endrer hvordan den oppfattes.","ed":"Slide 20: samme dilemma kan oppfattes helt ulikt avhengig av hvordan det rammes inn. Moralsk språk trigger moralsk tenkning; nøytrale ord kan skjule problemet. Moral muteness er når ledere unngår moralsk språk. Husk: ord former oppfatningen.","kt":"","src":"L2 slide 20"},{"id":"DF019","l":"L2","t":"Moral intensity","f":"t","d":1,"p":"H","sc":"none","s":"True or false: In Jones' model, moral intensity depends on factors like the size of the harm and how soon it happens.","o":[["True","Correct. Moral intensity depends on six factors, including magnitude of consequences and temporal immediacy."],["False","Incorrect. Moral intensity depends on six factors, including magnitude of consequences and temporal immediacy."]],"c":[0],"es":"Sant. Moral intensity = hvor alvorlig saken oppleves.","ed":"Jones (1991) sier at moral intensity avhenger av seks faktorer: magnitude of consequences, social consensus, probability of effect, temporal immediacy, proximity og concentration of effect. Jo mer intens, jo lettere ser folk det som et etisk spørsmål. Husk: størrelse, enighet, sannsynlighet, tid, nærhet, konsentrasjon.","kt":"","src":"L2 slide 20"},{"id":"DF020","l":"L3","t":"Externality","f":"m","d":1,"p":"H","sc":"none","s":"An externality is:","o":[["An effect on people outside the deal","Correct: it is a positive or negative effect on parties outside the production or consumption."],["A cost the buyer pays in the price","Incorrect: costs in the price are internal, not external."],["A tax on foreign trade","Incorrect: that is a tariff."],["Profit a firm earns outside its home country","Incorrect: that is foreign income."]],"c":[0],"es":"Externality = effekt på noen utenfor handelen.","ed":"Slide 6 og 10: en externality er en positiv eller negativ effekt på aktører som ikke er med i produksjonen eller forbruket av varen. Fordi effekten ikke er i prisen, produserer markedet for mye (negativ) eller for lite (positiv). Husk: tredjepart + ikke priset.","kt":"","src":"L3 slide 6"},{"id":"DF021","l":"L3","t":"Market failure","f":"m","d":1,"p":"H","sc":"none","s":"A market failure is when:","o":[["A stock market crashes","Incorrect: that is a crash, not the economic term."],["A firm goes bankrupt","Incorrect: one firm failing is not a market failure."],["Prices are set freely by supply and demand without government","Incorrect: that is the normal free market."],["The free market does not reach the socially best outcome","Correct: the market allocates resources away from the social optimum, so welfare is lost."]],"c":[3],"es":"Market failure = markedet når ikke samfunnets optimum.","ed":"Slide 10: market failure betyr at det frie markedet ikke fordeler ressursene på det samfunnsøkonomisk beste nivået, og det gir velferdstap. Externalities er en hovedårsak. Husk: externality → market failure.","kt":"","src":"L3 slide 10"},{"id":"DF022","l":"L3","t":"Internalisation","f":"m","d":1,"p":"H","sc":"none","s":"Internalising an externality means:","o":[["Moving production inside the country","Incorrect: that is reshoring."],["Hiding the cost from investors","Incorrect: that is the opposite."],["Making those who cause it bear its cost or get its benefit","Correct: internalisation brings the external cost or benefit into decisions and prices."],["Paying the cost with public money so the polluter is not hurt","Incorrect: then the cost is not borne by the one causing it."]],"c":[2],"es":"Internalisere = den som skaper effekten, bærer kostnaden.","ed":"Slide 15: internalisering er prosessen der kostnader eller gevinster fra externalities tas inn i beslutningene og prisene til dem som skaper dem. Det kan skje via myndigheter (skatt, kvoter), sivilsamfunn, investorer, firmaer, forbrukere og konkurrenters innovasjon (slide 17). Husk: forurenser betaler.","kt":"","src":"L3 slide 15"},{"id":"DF023","l":"L3","t":"Greenwashing","f":"m","d":1,"p":"H","sc":"none","s":"Greenwashing is:","o":[["Cleaning up a polluted site","Incorrect: that is remediation."],["Making a firm look greener than it really is","Correct: greenwashing is misleading green claims, a form of information asymmetry."],["Investing only in green bonds and other labelled products","Incorrect: that is a strategy, not greenwashing."],["Reporting emissions honestly","Incorrect: honest reporting is the opposite."]],"c":[1],"es":"Greenwashing = fremstille seg grønnere enn man er.","ed":"Slide 24–25: greenwashing er en form for information asymmetry, der firmaer gir et misvisende grønt bilde. Eksempler: Shell-reklamen som utelot fossil virksomhet, og børsselskaper som selger forurensende eiendeler til private kjøpere. Husk: grønt utenpå, brunt inni.","kt":"","src":"L3 slide 25"},{"id":"DF024","l":"L3","t":"Carbon leakage","f":"m","d":1,"p":"H","sc":"none","s":"Firms moving production to regions with weaker climate rules is a limit to internalisation called:","o":[["Territoriality of jurisdiction","Correct: rules apply only in one territory, so firms can shift production elsewhere."],["Political frictions","Incorrect: that refers to lobbying and policy uncertainty."],["Information asymmetry and greenwashing","Incorrect: that refers to greenwashing."],["Moral hazard","Incorrect: that is an agency concept."]],"c":[0],"es":"Territoriality of jurisdiction = firmaer flytter dit reglene er svakere.","ed":"Slide 23–27 lister tre grenser for internalisering: territoriality of jurisdiction (firmaer flytter produksjon, f.eks. etter California cap-and-trade), information asymmetry (greenwashing) og political frictions (usikker politikk, lobbying). Husk: flytte = territorialitet.","kt":"","src":"L3 slide 23"},{"id":"DF025","l":"L3","t":"Lobbying","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Lobbying against climate policy is a political friction that limits the internalisation of externalities.","o":[["True","Correct. Lobbying and policy uncertainty are political frictions that slow internalisation."],["False","Incorrect. Lobbying and policy uncertainty are political frictions that slow internalisation."]],"c":[0],"es":"Sant. Lobbying = political friction.","ed":"Slide 27: political frictions er en grense for internalisering. Firmaer bruker i snitt mer på lobbying mot klimapolitikk enn for (Leippold, Sautner og Yu). Usikker politikk gjør også at firmaer venter. Husk: lobbying bremser internalisering.","kt":"","src":"L3 slide 27"},{"id":"DF026","l":"L3","t":"Stress testing","f":"m","d":1,"p":"H","sc":"none","s":"Stress testing asks:","o":[["What the average outcome across scenarios is","Incorrect: that is scenario analysis with weights."],["How fast the firm can grow","Incorrect: that is growth analysis."],["How the firm does if everything goes wrong","Correct: stress testing looks at an extreme bad case."],["Which firms have the best ESG score","Incorrect: that is a rating question."]],"c":[2],"es":"Stress testing = \"hva om alt går galt?\".","ed":"Slide 34: scenario analysis finner de viktigste usikkerhetene, lager scenarioer og vekter sannsynligheten for hvert. Stress testing spør \"hva om alt går galt?\": hvordan klarer firmaet seg i et drastisk scenario? Husk: stress = verste fall.","kt":"","src":"L3 slide 34"},{"id":"DF027","l":"L3","t":"Sources of uncertainty","f":"m","d":1,"p":"H","sc":"none","s":"In internalisation, the three sources of uncertainty are:","o":[["Interest rates, inflation, and exchange rates","Incorrect: these are macro risks, not the slide's sources."],["Technology, policy, and consumer preferences","Correct: these three drive how and when externalities get internalised."],["Revenue, costs, and taxes","Incorrect: these are income statement items."],["Board, CEO, and auditor","Incorrect: these are governance actors."]],"c":[1],"es":"Usikkerhet: teknologi, politikk, forbrukerpreferanser.","ed":"Slide 33: når og hvordan externalities blir internalisert, avhenger av tre usikre faktorer: teknologi (f.eks. billigere sol), politikk (karbonpris, regulering) og forbrukeratferd og preferanser. Derfor brukes scenarioanalyse. Husk: T-P-C.","kt":"","src":"L3 slide 33"},{"id":"DF028","l":"L3","t":"Enlarged production function","f":"m","d":1,"p":"H","sc":"none","s":"The enlarged production function adds to capital and labour:","o":[["Natural, social and human capital","Correct: it adds natural capital (N), social capital (S) and human capital (H), plus resources, energy and waste."],["Only more machines","Incorrect: machines are already capital (K)."],["Debt, equity and retained earnings","Incorrect: these are financing, not production inputs."],["Prices and quantities","Incorrect: these are market outcomes."]],"c":[0],"es":"Utvidet produksjonsfunksjon: + natur, sosial og human capital.","ed":"Slide 14: den vanlige funksjonen er Q = F(K, L). Den utvidede er q + w = F(K, L, N, S, H; r, e): output pluss avfall (w) avhenger av kapital, arbeid, natural capital, social capital, human capital og flyt av ressurser (r) og energi (e). Husk: produksjon bruker natur og mennesker.","kt":"","src":"L3 slide 14"},{"id":"DF029","l":"L4","t":"Shareholder theory","f":"m","d":1,"p":"H","sc":"none","s":"Shareholder theory (Friedman) says managers should:","o":[["Balance the interests of all stakeholders equally","Incorrect: that is stakeholder theory."],["Follow what employees vote for","Incorrect: that is not Friedman's view."],["Maximise social impact first","Incorrect: that is closer to SF 3.0."],["Make decisions that maximise shareholder value","Correct: the old view says the firm's responsibility is to increase profits for shareholders."]],"c":[3],"es":"Shareholder theory = maksimer verdien for aksjonærene.","ed":"Slide 5: det gamle synet (Friedman 1970): \"the social responsibility of business is to increase its profits\", så ledere skal maksimere shareholder value. Det nye synet (stakeholder theory) sier at firmaet også har ansvar for ansatte, kreditorer, kunder, leverandører, lokalsamfunn og miljø. Husk: Friedman = profit.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L4 slide 5"},{"id":"DF030","l":"L4","t":"Stakeholder theory","f":"m","d":1,"p":"H","sc":"none","s":"Stakeholder theory (Freeman) says businesses work best when they:","o":[["Act only for their shareholders","Incorrect: that is shareholder theory."],["Avoid all trade-offs","Incorrect: stakeholder theory faces trade-offs."],["Act in the best interest of all stakeholders","Correct: Freeman says firms serve the greater good by considering all stakeholders."],["Let the government decide their goals and targets","Incorrect: that is not the theory."]],"c":[2],"es":"Stakeholder theory = handle til beste for alle stakeholders.","ed":"Slide 13: Freeman mener at firmaer finnes for mer enn å tjene penger til eierne, og at de fungerer best når handlingene er til det beste for alle stakeholders: ansatte, leverandører, lokalsamfunn, partnere og eiere. Kritikere (Jensen, Bebchuk) sier dette gir uklare mål. Husk: Freeman = alle stakeholders.","kt":"","src":"L4 slide 13"},{"id":"DF031","l":"L4","t":"Stakeholders","f":"m","d":1,"p":"H","sc":"none","s":"Which group is NOT a stakeholder in a firm?","o":[["Employees","Incorrect: employees are key stakeholders."],["An unrelated firm in another industry","Correct: a stakeholder is affected by or affects the firm; an unrelated firm is neither."],["The local community around its factories","Incorrect: the community is a stakeholder."],["Creditors","Incorrect: creditors are stakeholders."]],"c":[1],"es":"Stakeholder = noen som påvirker eller påvirkes av firmaet.","ed":"Slide 5 lister stakeholders: ansatte, kreditorer, kunder, leverandører, lokalsamfunn og miljø (pluss eierne). En stakeholder er noen som påvirkes av eller påvirker firmaet. Et urelatert firma er ikke det. Husk: berørt = stakeholder.","kt":"","src":"L4 slide 5"},{"id":"DF032","l":"L4","t":"Fiduciary duty","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Under Delaware law, directors have a fiduciary duty to act in the best interests of the shareholders.","o":[["True","Correct. The slide says directors have a fiduciary duty to act in the best interests of shareholders."],["False","Incorrect. The slide says directors have a fiduciary duty to act in the best interests of shareholders."]],"c":[0],"es":"Sant. Fiduciary duty overfor aksjonærene.","ed":"Slide 23: i Delaware har styret en fiduciary duty (forvalteransvar) til å handle i aksjonærenes beste interesse. Derfor mente kritikerne at Business Roundtable-erklæringen var juridisk feil. Business judgment rule beskytter likevel styrets valg. Husk: fiduciary = plikt overfor eierne.","kt":"","src":"L4 slide 23"},{"id":"DF033","l":"L4","t":"Purpose","f":"m","d":1,"p":"H","sc":"none","s":"Edmans defines purpose as the answer to:","o":[["How can the firm grow fastest?","Incorrect: that is growth strategy."],["What does the law require the company to report each year?","Incorrect: that is compliance."],["How much profit can be paid out?","Incorrect: that is dividend policy."],["How is the world better because your company exists?","Correct: this is Edmans' definition of purpose."]],"c":[3],"es":"Purpose = hvordan er verden bedre fordi firmaet finnes?","ed":"Slide 31: Edmans (Grow the Pie) definerer purpose som svaret på \"how is the world a better place by your company being here?\". Han skiller pie-splitting (en vinner, en taper) fra pie-growing (skape mer verdi for alle). Husk: purpose = firmaets bidrag til verden.","kt":"","src":"L4 slide 31"},{"id":"DF034","l":"L4","t":"Shareholder welfare","f":"m","d":1,"p":"H","sc":"none","s":"Hart and Zingales argue that companies should maximise:","o":[["Market value only","Incorrect: that is the view they criticise."],["Employee welfare, even at the cost of shareholders","Incorrect: they keep shareholders as the focus."],["Shareholder welfare, not just market value","Correct: shareholders also care about non-money things, so firms should follow their preferences."],["Total sales","Incorrect: sales is not their goal."]],"c":[2],"es":"Hart og Zingales: maksimer shareholder welfare.","ed":"Slide 31: Hart og Zingales sier at sosiale effekter ofte ikke kan skilles fra forretningsbeslutningen (non-separable), og at aksjonærer bryr seg om mer enn penger. Derfor bør firmaet ta hensyn til eiernes preferanser og maksimere shareholder welfare. Husk: welfare = penger + verdier.","kt":"","src":"L4 slide 31"},{"id":"DF035","l":"L5","t":"Corporate governance","f":"m","d":1,"p":"H","sc":"none","s":"Corporate governance is:","o":[["The government's direct control of how firms are run","Incorrect: it is mainly the firm's own system, not state control."],["Controls and incentives that limit agency costs","Correct: the slide defines it as controls, regulations and incentives to minimise agency costs and prevent fraud."],["A firm's marketing strategy","Incorrect: that is unrelated."],["The way a firm sets prices","Incorrect: that is pricing."]],"c":[1],"es":"Corporate governance = kontroller og incentiver som reduserer agency costs.","ed":"Slide 14: corporate governance er systemet av kontroller, regler og incentiver som skal minimere agency costs mellom ledere (agent) og investorer (principal) og hindre svindel. Det er \"checks and balances\" som avveier kostnader og nytte. Husk: governance løser agency problems.","kt":"","src":"L5 slide 14"},{"id":"DF036","l":"L5","t":"Agency costs","f":"m","d":1,"p":"H","sc":"none","s":"Agency costs are:","o":[["Costs of making managers act for owners","Correct: they are the costs of aligning and monitoring agents."],["Fees paid to a travel agency","Incorrect: nothing to do with travel agencies."],["Taxes paid by the firm","Incorrect: taxes are not agency costs."],["The interest cost of raising new debt from banks","Incorrect: that is the cost of debt."]],"c":[0],"es":"Agency costs = kostnaden ved å få lederne til å handle i eiernes interesse.","ed":"Slide 7: agency costs er kostnadene principals (eierne) må bære for å sikre at agentene (lederne) tar beslutninger i deres interesse, for eksempel overvåking, incentivlønn og tap fra dårlige valg. Husk: agency costs = prisen for å delegere.","kt":"","src":"L5 slide 7"},{"id":"DF037","l":"L5","t":"Adverse selection","f":"m","d":1,"p":"H","sc":"none","s":"Adverse selection happens:","o":[["After a deal, when behaviour changes","Incorrect: that is moral hazard."],["When prices are too high","Incorrect: that is not the definition."],["When a firm always picks the cheapest supplier on the market","Incorrect: that is normal procurement."],["Before a deal, when hidden information is exploited","Correct: adverse selection is about hidden information before the transaction."]],"c":[3],"es":"Adverse selection = skjult info FØR avtalen.","ed":"Slide 11: adverse selection skjer når asymmetrisk informasjon utnyttes før transaksjonen, f.eks. at de mest risikable låntakerne er de som oftest søker lån. Klassisk eksempel: Akerlofs \"lemons\"-marked for bruktbiler. Husk: adverse selection = før.","kt":"","src":"L5 slide 11"},{"id":"DF038","l":"L5","t":"Moral hazard","f":"m","d":1,"p":"H","sc":"none","s":"Moral hazard happens when:","o":[["A seller hides defects in a product before the sale takes place","Incorrect: that is adverse selection."],["A firm follows the law strictly","Incorrect: that is compliance."],["Behaviour changes after a deal because others bear the risk","Correct: moral hazard is behaviour change after the contract."],["Two firms merge","Incorrect: that is a merger."]],"c":[2],"es":"Moral hazard = endret atferd ETTER avtalen.","ed":"Slide 13: moral hazard betyr at noen endrer atferd etter avtalen fordi andre bærer risikoen. Eksempler fra sliden: debt overhang og asset substitution. Husk: moral hazard = etter.","kt":"","src":"L5 slide 13"},{"id":"DF039","l":"L5","t":"Voice and exit","f":"m","d":1,"p":"H","sc":"none","s":"In corporate governance, \"voice\" means shareholders:","o":[["Sell their shares","Incorrect: that is exit."],["Vote and engage with the company","Correct: voice is voting at meetings and engaging (jawboning) with management."],["Sue the auditor","Incorrect: that is litigation."],["Buy more shares in rival companies","Incorrect: that is just investing."]],"c":[1],"es":"Voice = stemme og engasjere. Exit = selge.","ed":"Slide 17: eiere kan reagere med voice (stemme på generalforsamling, engagement) eller exit (selge aksjene). Exit virker også som trussel: frykten for at eiere selger og presser kursen ned, disiplinerer ledelsen. Husk: voice = snakke, exit = gå.","kt":"","src":"L5 slide 17"},{"id":"DF040","l":"L5","t":"Efficient market hypothesis","f":"m","d":1,"p":"H","sc":"none","s":"The efficient market hypothesis (Fama) says that:","o":[["Stock prices include all relevant information","Correct: under EMH, prices reflect all available information."],["New risks like carbon take time to be priced in","Incorrect: that is the adaptive markets hypothesis."],["Investors always overreact","Incorrect: that is a behavioural view."],["Prices are set by the government","Incorrect: prices are set by the market."]],"c":[0],"es":"EMH = prisene inneholder all relevant informasjon.","ed":"Slide 26: EMH (Fama 1970) sier at aksjekurser inneholder all relevant informasjon og i snitt viser langsiktig fundamental verdi. Adaptive markets hypothesis (Lo 2017) sier at markedets effisiens avhenger av hvor mange grupper som analyserer, så nye risikoer (karbon) kan være feilpriset. Husk: EMH = alt er i prisen.\n\nForkortelser: EMH = Efficient Market Hypothesis (prisene reflekterer all informasjon).","kt":"","src":"L5 slide 26"},{"id":"DF041","l":"L5","t":"Adaptive markets hypothesis","f":"t","d":1,"p":"H","sc":"none","s":"True or false: The adaptive markets hypothesis can explain why new risks like carbon are not yet fully priced.","o":[["True","Correct. Under AMH, markets are less efficient for new risks that few groups study."],["False","Incorrect. Under AMH, markets are less efficient for new risks that few groups study."]],"c":[0],"es":"Sant. AMH = nye risikoer prises gradvis.","ed":"Slide 26: AMH (Lo 2017) sier at markedet tilpasser seg gradvis. Prisene reflekterer så mye informasjon som antall og type markedsaktører tillater. Er risikoen ny eller få analyserer den, er markedet mindre effisient. Husk: AMH = læring over tid.\n\nForkortelser: AMH = Adaptive Markets Hypothesis (markedet lærer gradvis, Lo).","kt":"","src":"L5 slide 26"},{"id":"DF042","l":"L5","t":"Corporate governance practices","f":"m","d":1,"p":"H","sc":"none","s":"Which is a good board practice listed on the slide?","o":[["Dual-class shares for founders","Incorrect: the slide says to avoid dual-class shares."],["Executive pay based only on this year's sales growth","Incorrect: the slide favours stock- and option-based pay."],["The CEO is not also the chair of the board","Correct: separating CEO and chair (or having a lead independent director) improves monitoring."],["No audit committee","Incorrect: board committees like audit are recommended."]],"c":[2],"es":"God praksis: CEO er ikke styreleder.","ed":"Slide 19: gode governance-praksiser er bl.a. board leadership (CEO ikke styreleder, ellers lead independent director), uavhengighet, mangfold og komiteer (lønn, revisjon, nominasjon); aksje- og opsjonsbasert lønn; aksjonærrettigheter (unngå dual-class shares); compliance, antikorrupsjon og varsling. Husk: skill CEO og styreleder.","kt":"","src":"L5 slide 19"},{"id":"DF043","l":"L6","t":"Business model","f":"m","d":1,"p":"H","sc":"none","s":"According to Osterwalder and Pigneur, a business model describes:","o":[["The firm's legal structure and ownership of subsidiaries","Incorrect: that is governance."],["How an organisation creates, delivers and captures value","Correct: this is the definition on the slide."],["The firm's five-year budget","Incorrect: that is planning."],["The firm's ESG rating","Incorrect: that is a metric."]],"c":[1],"es":"Business model = hvordan firmaet skaper, leverer og fanger verdi.","ed":"Slide 9: \"a business model describes the rationale of how an organization creates, delivers and captures value\". Johnson et al. sier en vellykket modell har tre deler: customer value proposition, profit formula og key resources and processes. Husk: create, deliver, capture.","kt":"","src":"L6 slide 9"},{"id":"DF044","l":"L6","t":"Customer value proposition","f":"m","d":1,"p":"H","sc":"none","s":"A customer value proposition is:","o":[["Doing a \"job\" for customers that rivals do not","Correct: it is what the firm does for the customer that alternatives do not."],["The price list of the firm","Incorrect: prices are part of the profit formula."],["The firm's total value on the stock market today","Incorrect: that is market value."],["A promise to pay dividends","Incorrect: that is dividend policy."]],"c":[0],"es":"Customer value proposition = jobben firmaet gjør for kunden som andre ikke gjør.","ed":"Slide 9 (Johnson et al.): tre deler i en business model. Customer value proposition: hjelper kunden med en \"job\" som alternativene ikke dekker. Profit formula: inntektsmodell, kostnader, marginer. Key resources and processes: folk, produkter, anlegg, merkevare. Husk: kunde, profitt, ressurser.","kt":"","src":"L6 slide 9"},{"id":"DF045","l":"L6","t":"Competitive advantage","f":"m","d":1,"p":"H","sc":"none","s":"Which is a source of competitive advantage listed on the slide?","o":[["A high share price","Incorrect: that is a result, not a source."],["Paying high dividends to shareholders every year","Incorrect: that is payout policy."],["Having a large board","Incorrect: board size is not a source."],["Knowledge, such as technology and processes","Correct: the four sources are resources, knowledge, human capital and culture, and networks/access."]],"c":[3],"es":"Kilder: resources, knowledge, human capital/culture, networks/access.","ed":"Slide 12 (Porter): fire kilder til konkurransefortrinn: resources (naturressurser, data), knowledge (teknologi, prosesser), human capital and culture, og networks/access (regulering, byttekostnader, skala). Husk: R-K-H-N.","kt":"","src":"L6 slide 12"},{"id":"DF046","l":"L6","t":"Intangibles","f":"m","d":1,"p":"H","sc":"none","s":"Which is an intangible resource that does NOT show up on the balance sheet?","o":[["Goodwill from an acquisition","Incorrect: goodwill is an intangible asset on the balance sheet."],["Buildings","Incorrect: buildings are tangible assets."],["Human capital","Correct: intangible resources like human capital are not on the balance sheet."],["Cash","Incorrect: cash is a financial asset."]],"c":[2],"es":"Human capital = intangible resource utenfor balansen.","ed":"Slide 21: intangible assets (f.eks. goodwill) står i balansen, mens intangible resources (f.eks. human capital) ikke gjør det. Goodwill er prisen betalt ved oppkjøp over bokført verdi. Husk: assets i balansen, resources utenfor.","kt":"","src":"L6 slide 21"},{"id":"DF047","l":"L6","t":"Goodwill","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Goodwill is the price paid in an acquisition above the book value of assets.","o":[["True","Correct. This is the definition of goodwill on the slide."],["False","Incorrect. This is the definition of goodwill on the slide."]],"c":[0],"es":"Sant. Goodwill = merpris over bokført verdi ved oppkjøp.","ed":"Slide 21: goodwill er prisen som betales ved oppkjøp utover bokført verdi av eiendelene. Den er ikke nødvendigvis et godt mål på verdien av immaterielle ressurser. Husk: goodwill = oppkjøpspremie.","kt":"","src":"L6 slide 21"},{"id":"DF048","l":"L6","t":"Intangibles","f":"m","d":1,"p":"H","sc":"none","s":"Which is one of the four economic features of intangibles (Haskel and Westlake)?","o":[["They are often scalable","Correct: the four features are sunk cost, spillovers, scalability and synergies."],["They are easy to sell again","Incorrect: they are a sunk cost and hard to resell."],["They never benefit other firms","Incorrect: they often create spillovers."],["They always appear on the balance sheet","Incorrect: most do not."]],"c":[0],"es":"Intangibles: sunk cost, spillovers, scalable, synergies (4 S).","ed":"Slide 21: Haskel og Westlake gir fire egenskaper ved intangibles: sunk cost (kan ikke selges tilbake), spillovers (andre kan dra nytte), scalability (kan brukes mange ganger) og synergies (forsterker hverandre). Husk: de fire S-ene.","kt":"","src":"L6 slide 21"},{"id":"DF049","l":"L6","t":"Strategy","f":"m","d":1,"p":"H","sc":"none","s":"In Hambrick and Fredrickson's strategy model, \"arenas\" are:","o":[["How the company will get there, for example by acquisitions","Incorrect: that is vehicles."],["How the company will win","Incorrect: that is differentiators."],["The speed and order of moves","Incorrect: that is staging."],["The markets where the company will be active","Correct: arenas answer where the firm will compete."]],"c":[3],"es":"Arenas = hvilke markeder firmaet skal være i.","ed":"Slide 27: en strategi har fem elementer: arenas (hvilke markeder), vehicles (hvordan komme dit), differentiators (hvordan vinne), staging (tempo og rekkefølge) og economic logic (hvordan tjene penger). Husk: arena = hvor.","kt":"","src":"L6 slide 27"},{"id":"DF050","l":"L6","t":"Value drivers","f":"m","d":1,"p":"H","sc":"none","s":"The value drivers on the slide are:","o":[["GDP growth, inflation and central bank interest rates","Incorrect: these are macro factors."],["ESG score, rating and ranking","Incorrect: these are metrics, not value drivers."],["Sales growth, margins, return on capital, cash flows","Correct: these are the value drivers used in ESG integration."],["Board size, CEO age and tenure","Incorrect: these are governance traits."]],"c":[2],"es":"Value drivers: vekst, marginer, kapital/avkastning på kapital, kontantstrøm.","ed":"Slide 34: value drivers er salgsvekst, marginer, kapital og avkastning på kapital (invested capital, cost of capital) og kontantstrøm og investering (OCF, FCF). ESG-forhold påvirker verdien gjennom disse. Husk: ESG → value drivers → verdi.\n\nForkortelser: GDP = Gross Domestic Product (BNP); FCF = Free Cash Flow (fri kontantstrøm); OCF = Operating Cash Flow (kontantstrøm fra drift).","kt":"","src":"L6 slide 34"},{"id":"DF051","l":"L6","t":"Stakeholder analysis","f":"m","d":1,"p":"H","sc":"none","s":"The three steps of stakeholder analysis on the slide are:","o":[["Measure, add up, adapt, then recalculate value","Incorrect: that is the integrated value method."],["Identify, categorise, prioritise","Correct: identify all stakeholders, group them, then rank by interest and power."],["Screen, monitor, report","Incorrect: those are not the steps."],["Plan, do, check","Incorrect: that is a quality cycle."]],"c":[1],"es":"Stakeholder analysis: identify → categorise → prioritise.","ed":"Slide 45: 1) identifiser alle stakeholders som påvirkes, 2) kategoriser (intern/ekstern, typer), 3) prioriter med en interest vs power-matrise. Et stakeholder impact map (slide 46) viser målene deres og hvordan firmaet hjelper eller skader dem. Husk: finn, grupper, ranger.","kt":"","src":"L6 slide 45"},{"id":"DF052","l":"L6","t":"Materiality (SASB)","f":"m","d":1,"p":"H","sc":"none","s":"SASB defines material information as:","o":[["Information likely to be important to investors","Correct: SASB uses a financial, investor-oriented definition."],["Any impact on society, even with no financial effect","Incorrect: that is closer to GRI's impact view."],["Only information in the balance sheet","Incorrect: that is too narrow."],["Information required by tax law","Incorrect: not the definition."]],"c":[0],"es":"SASB: material = viktig for investorer.","ed":"Slide 50: SASB definerer materialitet finansielt: informasjon som sannsynligvis er viktig for investorer. GRI definerer det bredere: tema som påvirker evnen til å skape eller ødelegge økonomisk, miljømessig og sosial verdi for firmaet, stakeholders og samfunnet. Sammen = double materiality. Husk: SASB = investor, GRI = samfunn.\n\nForkortelser: SASB = Sustainability Accounting Standards Board (bransjevise bærekraftsstandarder for investorer); GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders).","kt":"","src":"L6 slide 50"},{"id":"DF053","l":"L6","t":"Materiality (GRI)","f":"t","d":1,"p":"H","sc":"none","s":"True or false: GRI's definition of materiality includes value for society at large, not only for the company.","o":[["True","Correct. GRI covers economic, environmental and social value for the firm, its stakeholders and society."],["False","Incorrect. GRI covers economic, environmental and social value for the firm, its stakeholders and society."]],"c":[0],"es":"Sant. GRI ser på verdi for hele samfunnet.","ed":"Slide 50: GRI sier at material topics er de som påvirker evnen til å skape, bevare eller ødelegge økonomisk, miljømessig og sosial verdi \"for itself, its stakeholders and society at large\". Det er impact-perspektivet. Husk: GRI = bredt.\n\nForkortelser: GRI = Global Reporting Initiative (rapporteringsstandard for alle stakeholders).","kt":"","src":"L6 slide 50"},{"id":"DF054","l":"L6","t":"Materiality matrix","f":"m","d":1,"p":"H","sc":"none","s":"A materiality matrix plots issues by:","o":[["Price and quantity","Incorrect: that is a supply-demand chart."],["Risk and return","Incorrect: that is a portfolio chart."],["Importance to stakeholders vs impact on the firm","Correct: it shows which issues matter most to both stakeholders and the firm."],["Interest and power of each stakeholder group","Incorrect: that is the stakeholder matrix."]],"c":[2],"es":"Materiality matrix: viktig for stakeholders × påvirkning på firmaet.","ed":"Slide 55 (Unilever): en materiality matrix har to akser: hvor viktig saken er for stakeholders, og hvor stor påvirkning den har på firmaet. Saker høyt på begge er mest material. Ikke bland med interest/power-matrisen for stakeholders. Husk: to akser, begge perspektiver.","kt":"","src":"L6 slide 55"},{"id":"DF055","l":"L7","t":"TCFD","f":"m","d":1,"p":"H","sc":"none","s":"TCFD is a framework for reporting on:","o":[["All social and human rights issues in the supply chain","Incorrect: TCFD is about climate."],["Climate risk and governance, in the annual report","Correct: TCFD covers climate-related disclosure and governance in annual filings."],["Tax payments by country","Incorrect: that is tax reporting."],["Board diversity only","Incorrect: too narrow and not climate."]],"c":[1],"es":"TCFD = klimarisiko og governance
