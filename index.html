rise risikoen inn og tilby et sustainability-linked loan med mål for flåtefornyelse, slik at kunden får incentiv til å forbedre seg. Å avslutte kunden brått er sjelden best. Husk: pris + nudge + gradvis.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall).","kt":"","src":"Bok s. 300 (10.4.4) · Bok s. 301 (10.4.5) · L11 slide 25 · L11 slide 31 · Bok s. 306 (10.5.1)"},{"id":"SB429","l":"L11","t":"Bank climate commitments","f":"m","d":4,"p":"M","sc":"short","s":"In 2024-25 the largest US banks left the Net-Zero Banking Alliance, and banks increased fossil fuel lending. What does this suggest about voluntary coalitions?","o":[["Banks do not affect emissions","Incorrect: financing choices affect what gets built."],["Regulation is not needed","Incorrect: regulation and coalitions complement each other."],["Members can leave or free ride","Correct: members can leave or free ride."],["They always lead to binding cuts","Incorrect: the case shows promises can be dropped."]],"c":[2],"es":"Medlemmer kan forlate eller snylte i frivillige koalisjoner.","ed":"Net-Zero Banking Alliance var frivillig, uten sanksjoner. Da de store amerikanske bankene gikk ut og økte fossile lån, skjedde det ingenting. Ostrom viser at koalisjoner trenger overvåking og sanksjoner for å virke. Husk: frivillig uten sanksjoner = svakt.","kt":"Free riding: enjoying the benefits of a coalition (reputation) without following its rules or costs.","src":"L11 slide 32 · Bok s. 113 (4.3.1)"},{"id":"SB430","l":"L11","t":"Sustainability and collateral","f":"m","d":3,"p":"M","sc":"none","s":"Why does sustainability matter for the collateral banks take?","o":[["Collateral values never change","Incorrect: collateral values change."],["Only unsecured loans are at risk","Incorrect: secured loans are exposed through the collateral."],["Electric cars are risk-free collateral","Incorrect: electric cars also have issues."],["Collateral can lose value","Correct: collateral can lose value."]],"c":[3],"es":"Sikkerheten (pantet) kan tape verdi.","ed":"Banker tar pant, ofte i eiendom. Hvis pantet taper verdi, for eksempel fordi energiineffektive bygg blir mindre attraktive eller flomutsatte boliger faller i pris, taper banken mer ved mislighold. Husk: bærekraft påvirker pantets verdi.","kt":"","src":"Bok s. 291 (10.3) · Bok s. 292 (10.3)","e":1},{"id":"SB431","l":"L11","t":"Competition in sustainable lending","f":"m","d":3,"p":"L","sc":"none","s":"Which three types of social and environmental risk arise in project finance (Weber, 2017)?","o":[["Scope 1, 2 and 3","Incorrect: these are emission categories."],["Interest rate, currency, liquidity","Incorrect: these are market risks."],["Adverse selection, moral hazard, verification","Incorrect: these are monitoring problems."],["Inside-out, outside-in, reputation","Correct: inside-out, outside-in and reputation risk."]],"c":[3],"es":"Inside-out, outside-in og omdømme.","ed":"Weber (2017) deler miljø- og sosial risiko i prosjektfinans i tre: inside-out (prosjektets skade på omgivelsene), outside-in (omgivelsenes påvirkning på prosjektet, f.eks. klima) og omdømmerisiko for banken. Husk: inside-out, outside-in, reputation.","kt":"","src":"Bok s. 297 (10.4.1)","e":1},{"id":"TR50","l":"L11","t":"Information asymmetry in banking","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank charges every small firm the same rate because it cannot tell good from bad borrowers. What happens, and what should the bank do?","o":[["Safe firms leave; the bank must screen","Correct: safe firms leave, so the bank must screen."],["All firms borrow more","Incorrect: the pool gets worse."],["Nothing happens","Incorrect: one rate ignores each borrower's risk."],["Borrowers take more risk; raise deposit rates","Incorrect: risk-taking after the loan is moral hazard."]],"c":[0],"es":"Trygge firmaer forsvinner. Banken må screene (adverse selection).","ed":"Med lik rente for alle betaler trygge firmaer for mye og går et annet sted, mens risikable firmaer blir igjen. Porteføljen blir dårligere: adverse selection (Akerlofs lemons). Løsningen er å screene og prise etter risiko. Husk: lik pris → bare de risikable blir igjen.","kt":"Adverse selection: hidden information before a contract leads to bad types crowding out good ones (Akerlof's market for lemons).","src":"Opptak L11 ca. 8 min · Opptak L5 ca. 17 min"},{"id":"TR51","l":"L11","t":"Bank business model","f":"m","d":2,"p":"M","sc":"none","s":"On a bank's balance sheet, where are deposits and loans, and why does equity matter?","o":[["Both are assets","Incorrect: deposits are owed to customers, so they are liabilities."],["Deposits: debts; loans: assets","Correct: deposits are debts; loans are assets."],["Both are off the balance sheet","Incorrect: they are core balance sheet items."],["Deposits: assets; loans: debts","Incorrect: this reverses assets and liabilities."]],"c":[1],"es":"Innskudd = gjeld, lån = eiendeler. Egenkapital er bufferen.","ed":"For banken er innskudd gjeld: pengene skyldes kundene. Lån er eiendeler: banken har krav på tilbakebetaling. Egenkapitalen er bufferen som tar tapet hvis lån misligholdes, før innskyterne rammes. Husk: innskudd = gjeld, lån = eiendel.","kt":"","src":"Opptak L11 ca. 16 min · Opptak L11 ca. 48 min"},{"id":"TR52","l":"L11","t":"Sustainability approaches in banking","f":"m","d":3,"p":"H","sc":"short","s":"Triodos Bank lends only to viable projects with a positive social or environmental impact. This is:","o":[["Risk-based exclusion (SF 1.0)","Incorrect: exclusion only avoids harm."],["Finance as usual","Incorrect: positive impact is the goal."],["Value-based banking (SF 3.0)","Correct: value-based banking (SF 3.0)."],["ESG integration (SF 2.0)","Incorrect: integration prices risk into loans."]],"c":[2],"es":"Impact først = value-based banking (SF 3.0).","ed":"Triodos låner bare til levedyktige prosjekter med positiv sosial eller miljømessig effekt. Impact er første kriterium, økonomi er en betingelse. Det er value-based banking (SF 3.0). Husk: Triodos = SF 3.0.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"Opptak L11 ca. 32 min · Opptak L11 ca. 40 min"},{"id":"TR53","l":"L11","t":"ESG in credit risk","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Adding sustainability risks to credit models improves predictions of how borrowers perform, suggesting these risks were not fully priced.","o":[["True","Correct. If the risks were already priced, adding them would not improve the predictions."],["False","Incorrect. If the risks were already priced, adding them would not improve the predictions."]],"c":[0],"es":"Sant. Bedre prediksjon viser at risikoen ikke var priset.","ed":"Hvis bærekraftsrisiko allerede var med i kredittmodellene, ville det ikke hjelpe å legge dem til. At prediksjonen blir bedre, viser at risikoen ikke var fullt priset. Husk: forbedret prediksjon = ny informasjon.","kt":"","src":"Opptak L11 ca. 38 min"},{"id":"CX091","l":"L12","t":"Asymmetric information","f":"m","d":2,"p":"H","sc":"none","s":"An insured homeowner who stops maintaining the house because the insurer will pay is an example of:","o":[["Moral hazard","Atferd endres etter avtalen."],["Protection gap","Det er uforsikrede tap."],["Adverse selection","Det er skjult informasjon før avtalen."],["Basis risk","Det gjelder parametrisk forsikring."]],"c":[0],"es":"Etter avtalen = moral hazard.","ed":"Forsikringsselskaper bruker egenandel (deductible) mot moral hazard, og screening mot adverse selection.","kt":"","src":"Bok s. 324 (11.1.4)","k":1},{"id":"CX092","l":"L12","t":"Insurance and climate","f":"m","d":2,"p":"H","sc":"none","s":"The insurance protection gap gets bigger when:","o":[["Disaster losses fall over time","Det minsker heller problemet."],["Premiums fall in safe areas","Det påvirker ikke gapet i risikoområder."],["More homeowners buy insurance","Det minsker gapet."],["Insurers exit high-risk areas","Flere tap blir uforsikret."]],"c":[3],"es":"Forsikring trekker seg ut → større protection gap.","ed":"Protection gap = andelen tap som ikke er forsikret. Eksempel: State Farm i California. Uforsikrede hus er vanskeligere å få lån på, så boligpriser og banker rammes også.","kt":"","src":"L12 slide 3 · Bok s. 337 (11.3.2.1)","k":1},{"id":"CX093","l":"L12","t":"Insurance business model","f":"m","d":2,"p":"H","sc":"none","s":"On an insurer's balance sheet, UNEXPECTED claims are covered by:","o":[["Equity","Egenkapitalen er bufferen for uventede tap."],["Technical provisions","De dekker forventede skader."],["The policyholders","Kundene skal nettopp slippe å bære tapet."],["Next year's premiums","De er ikke en buffer i balansen i dag."]],"c":[0],"es":"Uventet = equity. Forventet = technical provisions.","ed":"Ekstreme tap utover egenkapitalen dekkes av reinsurance, cat bonds eller staten.","kt":"","src":"L12 slide 8 · Bok s. 318 (Figure 11.1) · L12 slide 16","k":1},{"id":"CX094","l":"L12","t":"Material issues in insurance","f":"m","d":2,"p":"H","sc":"none","s":"Climate change can hit an insurer's balance sheet:","o":[["Nowhere, because risk is reinsured","Reinsurance fjerner ikke all risiko."],["Only on its assets (investments)","Erstatningene øker også."],["Only on its liabilities (the claims)","Investeringene kan også rammes."],["On both assets and liabilities","Flere erstatninger (liabilities) og tap på investeringer (assets)."]],"c":[3],"es":"Begge sider av balansen.","ed":"Samme klimahendelse kan både øke erstatningene og redusere verdien av investeringene. Derfor bør scenarioanalyse dekke begge sider.","kt":"","src":"L12 slide 10 · L12 slide 8","k":1},{"id":"CX095","l":"L12","t":"Insurance innovation","f":"t","d":2,"p":"H","sc":"none","s":"Does parametric insurance pay out based on a measured event, such as wind speed, rather than the actual loss?","o":[["Yes","Riktig. Fordelen er rask utbetaling. Ulempen er basis risk."],["No","Feil. Fordelen er rask utbetaling. Ulempen er basis risk."]],"c":[0],"es":"Ja: målt hendelse, ikke faktisk tap.","ed":"Basis risk: utbetalingen matcher ikke alltid skaden. Jamaica fikk ingenting etter orkanen Beryl fordi triggeren så vidt ikke ble utløst.","kt":"","src":"Opptak L12 ca. 27 min · Opptak L12 ca. 37 min","k":1},{"id":"CX096","l":"L12","t":"Risk sharing","f":"m","d":2,"p":"H","sc":"none","s":"If the specified disaster occurs, investors in a catastrophe bond:","o":[["The government repays them","Det er ingen statsgaranti."],["They receive double interest","Det er motsatt: de taper."],["They lose part or all of the principal","Pengene går til å dekke forsikringstapet."],["Nothing changes for the bond investors","Hele poenget er at investorene bærer risikoen."]],"c":[2],"es":"Katastrofe → cat bond-investorer taper.","ed":"Til gjengjeld får investorene høy rente når katastrofen ikke skjer. Slik flyttes ekstrem risiko fra forsikring til kapitalmarkedet.","kt":"","src":"L12 slide 18 · Bok s. 322 (11.1.3)","k":1},{"id":"SB432","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"H","sc":"short","s":"In 2023 State Farm stopped selling new home insurance in California because of wildfire risk. What is the most likely knock-on effect?","o":[["Stricter EU capital rules","Incorrect: California is not under Solvency II."],["A bigger protection gap","Correct: more homes go uninsured: a bigger protection gap."],["No effect","Incorrect: public schemes are limited and costly."],["Less wildfire risk","Incorrect: leaving does not change the wildfire hazard."]],"c":[1],"es":"Når forsikringen forsvinner, står flere hjem uten dekning = større protection gap.","ed":"Protection gap er forskjellen mellom totale tap og forsikrede tap. Når forsikringsselskaper trekker seg ut av risikable områder, står flere hjem uten forsikring. Da blir boligene vanskeligere å selge og få lån på. Husk: forsikring forsvinner → gapet vokser.","kt":"Protection gap: the share of economic losses from disasters that is not insured.","src":"L12 slide 3 · Bok s. 337 (11.3.2.1)"},{"id":"SB433","l":"L12","t":"Insurance business model","f":"m","d":2,"p":"H","sc":"none","s":"On an insurer's balance sheet, technical provisions and equity cover:","o":[["Equity: expected claims; provisions: unexpected claims","Incorrect: the roles are swapped."],["Both are investment assets","Incorrect: both are on the liability side."],["Provisions: expected claims; equity: unexpected claims","Correct: provisions cover expected claims; equity covers unexpected ones."],["Provisions are the insurer's cash","Incorrect: provisions are liabilities, not cash."]],"c":[2],"es":"Avsetninger dekker forventede krav. Egenkapital dekker uventede.","ed":"Forsikringsselskapets balanse: technical provisions er avsetninger for forventede fremtidige krav (expected loss). Egenkapitalen er bufferen for uventede, store tap (unexpected loss). Solvency II-kravet er kalibrert slik at egenkapitalen tåler et 1-av-200-års tap. Husk: forventet = avsetning, uventet = egenkapital.","kt":"","src":"L12 slide 8 · Bok s. 318 (Figure 11.1) · L12 slide 16"},{"id":"SB434","l":"L12","t":"Insurance business model","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A non-life insurer with a combined ratio a bit above 100% can still make a profit, because it earns investment income before claims are paid.","o":[["True","Correct. Investment income earned before claims are paid can cover a small underwriting loss."],["False","Incorrect. Investment income earned before claims are paid can cover a small underwriting loss."]],"c":[0],"es":"Sant. Investeringsinntekt kan veie opp et lite tap på forsikringen.","ed":"Combined ratio = (krav + kostnader) / premier. Over 100 % betyr tap på selve forsikringen. Men forsikringsselskapet får premiene før kravene betales, og investerer pengene i mellomtiden. Investeringsinntekten kan dekke et lite underwriting-tap. Husk: profitt = (100 − CR) + investeringsinntekt.\n\nForkortelser: CR = Combined Ratio (krav + kostnader delt på premier).","kt":"Combined ratio: (claims + expenses) / premiums; below 100% means underwriting is profitable on its own.","src":"Bok s. 318 (11.1.1) · Bok s. 319 (11.1.1)","e":1},{"id":"SB435","l":"L12","t":"Material issues in insurance","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: For a Norwegian non-life insurer, climate change matters only for claims, not for its investments.","o":[["True","Incorrect. Climate risk also hits the insurer's investments, through physical and transition risk."],["False","Correct. Climate risk also hits the insurer's investments, through physical and transition risk."]],"c":[1],"es":"Usant. Klima påvirker også investeringene.","ed":"Klimarisiko rammer forsikringsselskapet på begge sider av balansen. På gjeldssiden gir flere og større naturskader høyere krav. På eiendelssiden kan obligasjoner og aksjer tape verdi på grunn av transition og physical risk. Husk: krav + investeringer.","kt":"Asset side vs liability side: an insurer's investments (assets) vs its obligations to pay claims (technical provisions).","src":"L12 slide 10 · L12 slide 8"},{"id":"SB436","l":"L12","t":"Material issues","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Swiss Re sees climate change as its most important material issue. Which is part of its climate strategy?","o":[["Measuring climate risk","Correct: measuring climate risk is part of the strategy."],["Stopping all weather insurance","Incorrect: Swiss Re still insures weather risk."],["Ignoring its own emissions","Incorrect: it works on its own footprint."],["Lobbying against climate policy","Incorrect: it supports climate policy."]],"c":[0],"es":"Å måle klimarisiko er en del av Swiss Re sin strategi.","ed":"Swiss Re sin klimastrategi har fire pilarer: 1) måle og modellere klimarisiko, 2) utvikle produkter som hjelper kunder (f.eks. katastrofeforsikring), 3) øke bevisstheten og støtte klimapolitikk, 4) redusere eget fotavtrykk. Husk: mål risiko, lag produkter, påvirk, kutt eget.","kt":"","src":"L12 slide 11 · Bok s. 326 (Box 11.2) · Bok s. 327 (11.2)"},{"id":"SB437","l":"L12","t":"Risk modelling","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Catastrophe modelling looks at good and bad outcomes for the whole insurer, while scenario analysis looks only at losses from natural disasters.","o":[["True","Incorrect. The definitions are swapped: scenario analysis looks at many outcomes; cat models look at natural disasters."],["False","Correct. The definitions are swapped: scenario analysis looks at many outcomes; cat models look at natural disasters."]],"c":[1],"es":"Usant. Det er motsatt: scenario analysis ser bredt, cat modelling ser på katastrofer.","ed":"Scenario analysis ser på et bredt spekter av mulige utfall for hele porteføljen. Catastrophe modelling er spesialmodeller for tap fra naturkatastrofer, med hazard, vulnerability og exposure. Påstanden har byttet om på dem. Husk: cat model = naturkatastrofer.","kt":"","src":"L12 slide 13-15"},{"id":"SB438","l":"L12","t":"Risk modelling","f":"m","d":3,"p":"M","sc":"none","s":"The Dutch central bank's \"Waterproof\" study estimates home insurance claims in 2085. What does it show?","o":[["Claims are the same in both","Incorrect: 3.5°C gives much larger increases."],["Claims fall in both","Incorrect: claims rise in both."],["Claims rise, most at 3.5°C","Correct: claims rise in both, most at 3.5°C."],["Claims rise only at 1.5°C","Incorrect: claims rise more with more warming."]],"c":[2],"es":"Kravene øker, mest ved 3,5 °C.","ed":"Den nederlandske sentralbanken anslo boligforsikringskrav i 2085. Ved 1,5 °C øker kravene med ca. 10–52 %, ved 3,5 °C med ca. 25–131 %. Mer oppvarming gir mye høyere krav. Husk: mer varme = flere krav.","kt":"","src":"L12 slide 14 · Bok s. 337 (11.3.2.1)"},{"id":"SB439","l":"L12","t":"Catastrophe modelling","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the five parts of a catastrophe model?","o":[["A tax part","Incorrect: tax is not a component."],["A credit part","Incorrect: credit is not a component."],["A vulnerability part","Correct: vulnerability is one of the five parts."],["A dividend part","Incorrect: dividends are not a component."]],"c":[2],"es":"Vulnerability er en av de fem delene.","ed":"En katastrofemodell har fem deler: hazard (hvor ofte og hvor sterkt), vulnerability (hvor mye skade det gir på bygg), exposure (hva som er forsikret og hvor), financial (forsikringsvilkår) og loss output. Husk: hazard × vulnerability × exposure.","kt":"","src":"L12 slide 15 · Bok s. 331 (11.3.1) · Bok s. 332 (11.3.1)"},{"id":"SB440","l":"L12","t":"Catastrophe modelling","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A \"200-year flood\" cannot happen twice in ten years.","o":[["True","Incorrect. A 200-year flood has a 0.5% chance each year, so two can happen close together."],["False","Correct. A 200-year flood has a 0.5% chance each year, so two can happen close together."]],"c":[1],"es":"Usant. \"200-års flom\" er bare et snitt (0,5 % per år). Den kan skje flere ganger.","ed":"\"200-års flom\" betyr 0,5 % sannsynlighet hvert år, ikke at den kommer hvert 200. år. To slike flommer kan komme tett. Med klimaendringer blir slike flommer dessuten hyppigere. Husk: return period er et snitt, ikke en timeplan.","kt":"Return period: the inverse of the annual exceedance frequency; a 200-year event has about a 0.5% chance each year.","src":"Bok s. 332 (11.3.1) · Bok s. 333 (Table 11.3)","e":1},{"id":"SB441","l":"L12","t":"Catastrophe modelling","f":"m","d":3,"p":"H","sc":"none","s":"In the loss distribution, what is the \"unexpected loss\", and what covers it?","o":[["Losses that never happen","Incorrect: unexpected losses do happen."],["Above expected, covered by equity","Correct: losses above the expected level, covered by equity."],["Extreme losses, covered by provisions","Incorrect: extreme tail losses are not covered by provisions."],["The average loss, covered by premiums","Incorrect: the average loss is the expected loss."]],"c":[1],"es":"Unexpected loss = tap over det forventede, dekket av egenkapital.","ed":"Tapsfordelingen har tre deler: expected loss (snittet, dekkes av premier og avsetninger), unexpected loss (tap over snittet opp til et gitt nivå, dekkes av egenkapital) og ekstreme halehendelser utover det. Husk: unexpected = egenkapital.","kt":"","src":"L12 slide 16 · L12 slide 8 · Bok s. 319 (11.1.2)"},{"id":"SB442","l":"L12","t":"Catastrophe risk","f":"t","d":3,"p":"M","sc":"none","s":"True or false: With enough policies, catastrophe losses become as predictable as small claims (law of large numbers).","o":[["True","Incorrect. Catastrophe losses have fat tails and hit many policies at once, so they do not average out."],["False","Correct. Catastrophe losses have fat tails and hit many policies at once, so they do not average out."]],"c":[1],"es":"Usant. Katastrofer har fat tails og jevner seg ikke ut.","ed":"Loven om store tall virker for små, uavhengige krav (som bilskader): med mange kunder blir totalen forutsigbar. Katastrofer rammer mange kunder samtidig og har tunge haler, så de jevner seg ikke ut. Husk: katastrofer er korrelerte.","kt":"","src":"Bok s. 319 (11.1.2) · L12 slide 15 · L12 slide 18","e":1},{"id":"SB443","l":"L12","t":"Risk sharing","f":"m","d":3,"p":"H","sc":"short","s":"The 2025 Los Angeles wildfires caused huge insured losses. How can individual insurers survive such an event?","o":[["Reinsurance and cat bonds","Correct: reinsurance and cat bonds spread the risk."],["The central bank pays","Incorrect: central banks do not pay claims."],["Each insurer holds enough cash itself","Incorrect: one insurer's equity would be wiped out."],["Customers pay themselves","Incorrect: insurers pay the insured losses."]],"c":[0],"es":"Reforsikring og cat bonds sprer risikoen.","ed":"Store katastrofer spres i lag: forsikringsselskapet tar første del, reforsikringsselskaper tar neste, og kapitalmarkedet tar en del via catastrophe bonds. Da kan hvert selskap overleve. Husk: risiko i lag.","kt":"Re-insurance: insurance for insurers; excess-of-loss contracts pay losses above a retention limit.","src":"L12 slide 18 · Bok s. 322 (11.1.3)"},{"id":"SB444","l":"L12","t":"Risk sharing","f":"m","d":3,"p":"M","sc":"none","s":"Why do investors buy catastrophe bonds?","o":[["They are risk-free","Incorrect: investors carry the catastrophe risk."],["They move with stocks","Incorrect: their appeal is low correlation."],["High yield and low correlation","Correct: high yield and low correlation with other assets."],["They always pay their coupons","Incorrect: payments can be lost after a disaster."]],"c":[2],"es":"Høy rente og lav korrelasjon med andre investeringer.","ed":"Catastrophe bonds betaler høy rente, men investorene kan miste pengene hvis en katastrofe skjer. Fordi naturkatastrofer ikke henger sammen med aksjemarkedet, gir de god diversifisering. Husk: cat bond = høy rente + lav korrelasjon.","kt":"","src":"Bok s. 323 (11.1.3) · L12 slide 18","e":1},{"id":"SB445","l":"L12","t":"Asymmetric information","f":"m","d":3,"p":"M","sc":"none","s":"How do Rothschild and Stiglitz (1976) solve adverse selection in insurance?","o":[["High-risk clients must take deductibles","Incorrect: it is the low-risk types who take deductibles."],["Everyone buys full cover at one price","Incorrect: one pooled price drives out low-risk clients."],["Insurers see every risk directly","Incorrect: insurers cannot see each client's risk."],["Clients pick contracts that reveal their risk","Correct: clients choose contracts that reveal their risk."]],"c":[3],"es":"Kundene velger kontrakter som avslører risikoen deres.","ed":"Adverse selection i forsikring: forsikringsselskapet vet ikke hvem som er høy- eller lavrisiko. Rothschild og Stiglitz foreslår å tilby ulike kontrakter: full dekning til høy pris og delvis dekning (egenandel) til lav pris. Lavrisikokunder velger egenandel og avslører seg selv. Husk: screening via kontraktvalg.","kt":"","src":"Bok s. 324 (11.1.4)","e":1},{"id":"SB446","l":"L12","t":"Climate change and insurance","f":"m","d":3,"p":"M","sc":"none","s":"The IPCC rates its confidence in climate effects on natural hazards. Which statement is correct?","o":[["Worse droughts everywhere: very high confidence","Incorrect: confidence is medium or low."],["River floods: high confidence","Incorrect: confidence in river flood projections is low."],["More heavy rain: unlikely","Incorrect: more heavy rain is likely."],["Higher coastal water levels: very likely","Correct: higher coastal water levels are very likely."]],"c":[3],"es":"Høyere havnivå ved kysten er very likely.","ed":"IPCC uttrykker hvor sikre de er. Høyere havnivå og kystflom er very likely (90–100 %). Mer kraftig nedbør er likely. For elveflom og tørke i mange regioner er usikkerheten større. Husk: havnivå = svært sikkert.\n\nForkortelser: IPCC = Intergovernmental Panel on Climate Change (FNs klimapanel).","kt":"","src":"L12 slide 21 · Bok s. 333 (11.3.2) · Bok s. 334 (11.3.2) · Bok s. 335 (11.3.2)"},{"id":"SB447","l":"L12","t":"Climate change and insurance","f":"m","d":4,"p":"H","sc":"short","s":"A small sea-level rise can turn today's 100-year floods into events every few years. What does this mean for insurers?","o":[["It only matters after 2100","Incorrect: effects grow in the coming decades."],["Risk grows steadily, so past data are fine","Incorrect: the relation is exponential, not linear."],["Past losses understate risk","Correct: past losses understate future risk."],["Insurers can ignore it","Incorrect: insurers cannot ignore it."]],"c":[2],"es":"Historiske tap undervurderer fremtidig risiko.","ed":"En liten havnivåstigning kan gjøre en 100-års flom til noe som skjer hvert par år, fordi sammenhengen er eksponentiell. Historiske tapsdata undervurderer derfor fremtidig risiko. Husk: fortiden er en dårlig guide.","kt":"Non-linear (exponential) risk: a small change in a driver causes a much larger change in outcomes.","src":"Bok s. 337 (Figure 11.7) · Bok s. 338 (Table 11.4) · Bok s. 337 (11.3.2.1)"},{"id":"SB448","l":"L12","t":"Climate change and insurance","f":"m","d":4,"p":"H","sc":"none","s":"If home insurance pulls out of flood areas or gets too expensive, what happens to banks?","o":[["Banks gain","Incorrect: house prices are likely to fall."],["Banks are not affected","Incorrect: insurance is often required for mortgages."],["Banks take over the insurance","Incorrect: banks do not take over insurance."],["Banks lend less","Correct: banks lend less in those areas."]],"c":[3],"es":"Uten forsikring låner bankene ut mindre i flomområder.","ed":"Boliglån krever ofte forsikring. Hvis forsikring blir borte eller for dyr, blir boligene vanskeligere å belåne, og prisene faller. Bankene låner mindre og taper mer på pantet. I tillegg fornyes forsikring årlig, mens lånene varer i 25 år. Husk: forsikring og bank henger sammen.","kt":"","src":"Bok s. 337 (11.3.2.1) · Bok s. 338 (11.3.2.1) · L11 slide 31"},{"id":"SB449","l":"L12","t":"Climate change and insurance","f":"m","d":5,"p":"M","sc":"none","s":"What is Weitzman's (2009) key point about rare but extreme climate disasters?","o":[["Fat tails favour acting now","Correct: fat tails favour acting now."],["They are impossible","Incorrect: his point is that catastrophe is possible."],["Learning removes all extreme risk","Incorrect: uncertainty remains even with learning."],["Wait until everything is known","Incorrect: the argument supports precaution."]],"c":[0],"es":"Fat tails gjør at vi bør handle nå.","ed":"Weitzman (2009) viser at usikkerhet om klimasystemet gir fat tails: ekstreme katastrofer er mer sannsynlige enn vanlige modeller tilsier. Da kan den forventede skaden bli enorm, og det lønner seg å handle nå som en forsikring. Husk: fat tails → føre-var.","kt":"","src":"Bok s. 335 (11.3.2) · Bok s. 319 (11.1.2)","e":1},{"id":"SB450","l":"L12","t":"Mitigation and adaptation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Insurance only moves the financial part of disaster risk, so it should be combined with risk reduction such as flood defences, not replace it.","o":[["True","Correct. Insurance only moves the money; it should be combined with risk reduction like flood defences."],["False","Incorrect. Insurance only moves the money; it should be combined with risk reduction like flood defences."]],"c":[0],"es":"Sant. Forsikring flytter bare penger. Man må også redusere risikoen.","ed":"Forsikring redder ikke liv og hindrer ikke skade, den flytter bare den økonomiske kostnaden. Derfor bør man først redusere risikoen (flomvern, tilpasning) og bruke forsikring for det som er igjen. Husk: forebygg først, forsikre resten.","kt":"Adaptation: actions that help communities and ecosystems cope with a changing climate (e.g. flood defences, early warning).","src":"Bok s. 339 (11.3.3)","e":1},{"id":"SB451","l":"L12","t":"Mitigation and adaptation","f":"m","d":4,"p":"L","sc":"none","s":"A global climate risk pool would only insure events well above the trend. Why?","o":[["A trend needs adaptation","Correct: a trend needs adaptation, not insurance."],["Smaller events are illegal to insure","Incorrect: there is no such law."],["Only rich countries have extreme events","Incorrect: poorer countries are the most exposed."],["The pool wants to avoid paying","Incorrect: it is meant to pay for extreme shocks."]],"c":[0],"es":"En trend krever tilpasning, ikke forsikring.","ed":"Forsikring passer for uforutsigbare sjokk. En gradvis klimatrend (f.eks. stadig tørrere somre) er forutsigbar og må håndteres med tilpasning. Derfor dekker en global risikopool bare hendelser godt over trenden. Husk: trend = tilpasning, sjokk = forsikring.","kt":"","src":"Bok s. 340 (Box 11.3)","e":1},{"id":"SB452","l":"L12","t":"Environmental and liability risk","f":"m","d":3,"p":"M","sc":"none","s":"DuPont's pollution ended up costing about a billion dollars (Shapira and Zingales, 2017). What do internal documents show?","o":[["Regulators caught it at once","Incorrect: the controls failed."],["It was an accident","Incorrect: it was not an accident."],["Its insurers forced it to pollute","Incorrect: insurers played no such role."],["Low risk of being caught","Correct: DuPont knew the risk of being caught was low."]],"c":[3],"es":"DuPont visste at risikoen for å bli tatt var lav.","ed":"Shapira og Zingales viser med DuPonts interne dokumenter at selskapet visste om forurensningen og regnet med at sjansen for å bli tatt var lav, fordi det kontrollerte informasjonen. Det ble likevel svært dyrt. Husk: informasjonsovertak kan friste til å forurense.","kt":"","src":"Bok s. 327 (11.2.1) · Bok s. 328 (11.2.1) · Bok s. 329 (11.2.3)","e":1},{"id":"SB453","l":"L12","t":"Social issues in insurance","f":"t","d":2,"p":"L","sc":"none","s":"True or false: AIA Vitality rewards clients for healthy living, which can improve their health and lower the insurer's costs.","o":[["True","Correct. Healthier clients file fewer claims, so both the client and the insurer gain."],["False","Incorrect. Healthier clients file fewer claims, so both the client and the insurer gain."]],"c":[0],"es":"Sant. Sunnere kunder gir lavere kostnader.","ed":"AIA Vitality gir kunder belønninger for sunn livsstil (trening, sjekker). Sunnere kunder har lavere helsekostnader og færre krav. Både kunde og forsikringsselskap vinner. Husk: forsikring kan endre atferd.","kt":"","src":"Bok s. 328 (11.2.2)","e":1},{"id":"SB454","l":"L12","t":"Principles for Sustainable Insurance","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An insurer that has signed the PSI is asked to insure a new coal mine. Which response fits PSI principle 1?","o":[["Refuse all mining firms","Incorrect: PSI does not ban whole sectors."],["Insure it with no extra checks","Incorrect: ESG must be considered."],["Insure it in secret","Incorrect: PSI calls for transparency."],["Assess its ESG risks","Correct: assess its ESG risks."]],"c":[3],"es":"PSI prinsipp 1: vurder ESG-risiko.","ed":"UN Principles for Sustainable Insurance (PSI) prinsipp 1: inkluder ESG i beslutninger, også underwriting. Forsikringsselskapet bør vurdere ESG-risikoen ved kullgruva før det bestemmer seg. Andre prinsipper handler om samarbeid og åpenhet. Husk: PSI = ESG i forsikring.\n\nForkortelser: PSI = UN Principles for Sustainable Insurance.","kt":"Underwriting: assessing and pricing the risk of a client or project, and deciding whether to insure it.","src":"L12 slide 24"},{"id":"SB455","l":"L12","t":"Insurance regulation","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about EU insurance rules since August 2022 is correct?","o":[["The IDD sets capital rules","Incorrect: capital rules are in Solvency II, not the IDD."],["Solvency II bans fossil fuel shares","Incorrect: there is no such ban."],["Solvency II was replaced","Incorrect: Solvency II still applies."],["IDD: sustainability in advice","Correct: the IDD puts sustainability into advice."]],"c":[3],"es":"IDD: bærekraft skal inn i rådgivningen.","ed":"Fra august 2022 krever Insurance Distribution Directive (IDD) at rådgivere spør kundene om bærekraftspreferanser. Solvency II regulerer kapitalkrav og risikostyring. Husk: IDD = salg og råd, Solvency II = kapital.\n\nForkortelser: IDD = Insurance Distribution Directive (EU-regler for salg av forsikring).","kt":"","src":"L12 slide 25 · L7 slide 20"},{"id":"SB456","l":"L12","t":"Microinsurance","f":"m","d":2,"p":"M","sc":"none","s":"How does microinsurance help poor people avoid the poverty trap?","o":[["It guarantees a fixed monthly income","Incorrect: it pays when events happen, not a fixed income."],["It is always very profitable","Incorrect: it is hard to make profitable."],["It gives large loans","Incorrect: large loans are microcredit."],["Small premiums replace big shocks","Correct: small premiums replace big shocks."]],"c":[3],"es":"Små premier erstatter store sjokk.","ed":"Fattige husholdninger kan bli kastet inn i fattigdom av ett sjokk (sykdom, tørke). Microinsurance lar dem betale små, faste premier i stedet for å risikere et stort tap. Det beskytter mot poverty trap. Husk: små premier, stor beskyttelse.","kt":"","src":"L12 slide 27 · Bok s. 340 (11.4) · Bok s. 341 (11.4)"},{"id":"SB457","l":"L12","t":"Microinsurance","f":"m","d":3,"p":"L","sc":"none","s":"What is the \"partner-agent model\" of microinsurance?","o":[["An insurer designs, a partner sells","Correct: an insurer designs the product; a local partner sells it."],["The government sells it","Incorrect: not the model."],["A reinsurer lends money to clients","Incorrect: not the model."],["Clients insure each other","Incorrect: that is informal mutual insurance."]],"c":[0],"es":"Forsikringen lager produktet, en lokal partner selger.","ed":"I partner-agent-modellen lager et profesjonelt forsikringsselskap produktet og bærer risikoen, mens en lokal partner (f.eks. en mikrofinansinstitusjon) selger det. Det kombinerer kompetanse med lokal tilgang. Husk: designer + selger.","kt":"","src":"Bok s. 341 (11.4.1) · Bok s. 342 (11.4.1) · Bok s. 343 (11.4.2)","e":1},{"id":"SB458","l":"L12","t":"Microinsurance","f":"m","d":4,"p":"M","sc":"short","s":"A Kenyan farmer has rainfall insurance that pays when a weather station 40 km away records too little rain. What risk does he face?","o":[["Interest rate risk","Incorrect: interest rates are not relevant."],["Basis risk","Correct: basis risk: the station may not match his field."],["Moral hazard","Incorrect: an objective index limits moral hazard."],["Liquidity risk","Incorrect: not the issue."]],"c":[1],"es":"Målestasjonen er 40 km unna, så den kan bomme = basis risk.","ed":"Index insurance betaler etter en målt indeks (her nedbør), ikke etter faktisk skade. Det er billig og raskt, men indeksen kan bomme: det kan regne ved stasjonen og være tørt på bondens jorde. Det kalles basis risk. Husk: basis risk = indeks ≠ faktisk tap.","kt":"","src":"Bok s. 343 (Box 11.4) · Bok s. 342 (11.4.1)","e":1},{"id":"SB459","l":"L12","t":"Measuring disaster impact","f":"t","d":4,"p":"L","sc":"none","s":"True or false: Noy's (2016) life years index values lives equally across countries and scales money losses by income, so a dollar lost in a poor country counts more.","o":[["True","Correct. The index divides losses by income, so a dollar lost in a poor country counts more."],["False","Incorrect. The index divides losses by income, so a dollar lost in a poor country counts more."]],"c":[0],"es":"Sant. En dollar tapt i et fattig land teller mer.","ed":"Noy sitt life years index regner om tap til \"leveår\" ved å dele tapet på årsinntekt. Da teller en dollar tapt i et fattig land mer enn i et rikt, og alle liv vektes likt. Det gir et mer rettferdig bilde av katastrofer. Husk: tap / inntekt.","kt":"","src":"Bok s. 321 (Box 11.1) · Bok s. 321 (11.1.2.1)","e":1},{"id":"SB460","l":"L12","t":"Insurance synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A Nordic insurer sells home insurance in flood-prone coastal areas and owns many bonds in coastal property firms. What is the best assessment?","o":[["Cat bonds cover everything","Incorrect: cat bonds cover only part of the risk."],["Yearly repricing removes the risk","Incorrect: repricing does not remove all risk."],["Only claims matter","Incorrect: the bonds also carry risk."],["Both claims and investments","Correct: both claims and investments are exposed."]],"c":[3],"es":"Risikoen rammer både krav og investeringer.","ed":"Forsikringsselskapet er utsatt to ganger: flom gir krav fra kundene, og den samme flommen kan svekke eiendomsselskapene det har investert i. Risikoen på begge sider av balansen henger sammen. Husk: korrelert risiko.","kt":"","src":"L12 slide 8 · L12 slide 10 · L12 slide 13-18 · L12 slide 25 · Bok s. 337 (11.3.2.1)"},{"id":"SB461","l":"L12","t":"Sustainability risks in insurance","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Gatzert et al. (2020) conclude that climate change is the only sustainability risk that matters for insurers.","o":[["True","Incorrect. They say climate change is important but far from the only sustainability risk for insurers."],["False","Correct. They say climate change is important but far from the only sustainability risk for insurers."]],"c":[1],"es":"Usant. Klima er viktig, men ikke den eneste risikoen.","ed":"Gatzert et al. konkluderer at klima er viktig, men at forsikringsselskaper også må ta hensyn til andre ESG-risikoer, som sosiale forhold, governance og omdømme. Husk: mer enn klima.","kt":"","src":"L12 slide 20 · Bok s. 325 (11.2)"},{"id":"SB462","l":"L12","t":"Catastrophe losses","f":"m","d":4,"p":"M","sc":"short","s":"Insured disaster losses have risen for decades. An analyst blames it all on climate change. What is missing?","o":[["Less insurance in rich countries","Incorrect: rich countries have more insurance."],["Falling coastal property values","Incorrect: property values have risen."],["More assets in risky places","Correct: more assets are now in risky places."],["Nothing","Incorrect: exposure is missing from the analysis."]],"c":[2],"es":"Flere verdier i utsatte områder øker tapene.","ed":"Tap = hazard × exposure × vulnerability. Selv uten klimaendringer har tapene økt fordi flere bygger og bor i risikable områder (kyst, skog), og verdiene er høyere. Analytikeren glemmer exposure. Husk: tre faktorer, ikke bare klima.","kt":"Catastrophe model components: hazard, vulnerability, exposure, financial loss, platform.","src":"Bok s. 322 (Figure 11.3) · Bok s. 326 (Box 11.2) · L12 slide 15"},{"id":"TR54","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Climate claims rise much faster than the insurer expected, and premiums were too low. Who takes the loss first?","o":[["The central bank","Incorrect: there is no automatic guarantee."],["The customers","Incorrect: policyholders are not liable."],["Nobody","Incorrect: someone must take the loss."],["The shareholders","Correct: the shareholders take the loss first."]],"c":[3],"es":"Eierne tar tapet først.","ed":"Hvis kravene blir mye høyere enn avsetningene, må egenkapitalen dekke resten. Aksjonærene tar altså tapet først. Kundene skal få kravene sine betalt. Husk: egenkapital dekker uventede tap.","kt":"","src":"Opptak L11 ca. 58 min · Opptak L12 ca. 13 min · Opptak L12 ca. 35 min"},{"id":"TR55","l":"L12","t":"Insurance innovation","f":"m","d":3,"p":"H","sc":"short","s":"In 2024 Hurricane Beryl hit Jamaica hard, but just missed the trigger of its parametric insurance, so nothing was paid. What does this show?","o":[["It has basis risk","Correct: it has basis risk."],["It removes all risk","Incorrect: basis risk remains."],["It pays only after a damage check","Incorrect: it pays automatically when the trigger is hit."],["It always pays more than the loss","Incorrect: it can pay nothing."]],"c":[0],"es":"Indeksen ble ikke utløst selv om skaden var stor = basis risk.","ed":"Parametric insurance betaler automatisk når en målt verdi (f.eks. vindstyrke eller sti) passerer en grense. Orkanen Beryl gjorde stor skade på Jamaica, men passerte akkurat utenfor triggeren, så ingenting ble betalt. Det er basis risk. Husk: parametric = rask, men kan bomme.","kt":"Parametric insurance: pays a preset amount when an objective measure (wind speed, rainfall, temperature) crosses a threshold.","src":"Opptak L12 ca. 27 min · Opptak L12 ca. 37 min"},{"id":"TR56","l":"L12","t":"Insurance and climate","f":"m","d":3,"p":"M","sc":"none","s":"Some insurers stop insuring coal companies. What concern does the lecturer raise?","o":[["Coal firms have no risk","Incorrect: coal firms do have risks."],["Insurers must insure everyone","Incorrect: insurers can choose what to cover."],["Exclusion always raises profits","Incorrect: profit is not the concern."],["Insurers lose influence","Correct: insurers lose influence."]],"c":[3],"es":"Ved å utelukke mister forsikringen innflytelse.","ed":"Hvis forsikringsselskaper slutter å forsikre kull, mister de muligheten til å påvirke selskapene, for eksempel med krav eller pris. Kullselskapene kan finne andre forsikringsløsninger. Det ligner washing machine-argumentet mot ren exclusion. Husk: exit mister innflytelse.","kt":"","src":"Opptak L11 ca. 52 min"},{"id":"TR57","l":"L12","t":"Reinsurance","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Since insurers can buy reinsurance, climate disasters cannot create systemic risk in insurance.","o":[["True","Incorrect. Reinsurance links insurers in a network, so a big failure can spread like dominoes."],["False","Correct. Reinsurance links insurers in a network, so a big failure can spread like dominoes."]],"c":[1],"es":"Usant. Reforsikring knytter selskapene sammen, så tap kan spre seg.","ed":"Reforsikring sprer risikoen, men knytter også selskapene sammen. Hvis et stort reforsikringsselskap går over ende etter ekstreme katastrofer, kan tapene spre seg til mange forsikringsselskaper. Det er systemrisiko. Husk: nettverk = smitte.","kt":"","src":"Opptak L12 ca. 31 min · Opptak L12 ca. 32 min"},{"id":"TR58","l":"L12","t":"EU regulation","f":"t","d":2,"p":"H","sc":"none","s":"True or false: The EU Taxonomy classifies whole companies as sustainable or not.","o":[["True","Incorrect. The EU Taxonomy classifies economic activities, not whole companies."],["False","Correct. The EU Taxonomy classifies economic activities, not whole companies."]],"c":[1],"es":"Usant. Taxonomy klassifiserer aktiviteter, ikke hele selskaper.","ed":"EU Taxonomy sier hvilke aktiviteter som er bærekraftige (f.eks. vindkraftproduksjon), ikke hvilke selskaper. Et selskap kan ha både grønne og ikke-grønne aktiviteter og rapportere andelen av hver. Husk: activity, ikke entity.","kt":"","src":"Opptak L12 ca. 44 min"},{"id":"TR59","l":"L12","t":"Insurance basics","f":"m","d":2,"p":"L","sc":"none","s":"What does D&O (directors and officers) insurance cover?","o":[["Damage to buildings","Incorrect: building damage is property insurance."],["Bondholders against default","Incorrect: that is credit insurance or a CDS."],["Directors' legal costs","Correct: it covers directors' legal costs."],["Employees' pensions","Incorrect: pensions are life insurance."]],"c":[2],"es":"D&O dekker styremedlemmers og lederes juridiske kostnader.","ed":"D&O (directors and officers) insurance dekker styremedlemmer og ledere hvis de blir saksøkt for beslutninger i jobben, for eksempel brudd på fiduciary duties eller dårlig håndtering av klimarisiko. Husk: D&O = ledernes juridiske risiko.\n\nForkortelser: CDS = Credit Default Swap (forsikring mot mislighold); D&O = Directors and Officers insurance (ansvarsforsikring for styre og ledelse).","kt":"","src":"Opptak L11 ca. 56 min · Opptak L4 ca. 41 min"},{"id":"SB463","l":"GUEST","t":"Folketrygdfondet","f":"m","d":1,"p":"M","sc":"none","s":"What is the overall goal of Folketrygdfondet's management of the Government Pension Fund Norway?","o":[["Maximum SDG impact, even with lower returns","Incorrect: impact is not the main goal."],["Copying the Oslo index exactly","Incorrect: the mandate is active, not pure index tracking."],["Supporting Norwegian jobs","Incorrect: industrial policy is not part of the mandate."],["The highest return within risk limits","Correct: the highest return within the risk limits."]],"c":[3],"es":"Folketrygdfondet skal gi høyest mulig avkastning innenfor risikorammene.","ed":"Folketrygdfondet forvalter Statens pensjonsfond Norge. Målet er høyest mulig avkastning over tid innenfor rammene Finansdepartementet setter. Ansvarlig eierskap og ESG brukes fordi det støtter langsiktig avkastning, ikke som et eget impact-mål. Husk: avkastning først, ESG som middel.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger).","kt":"","src":"Folketrygdfondet s. 3 · Folketrygdfondet s. 5 · Folketrygdfondet s. 10 · Folketrygdfondet s. 18","e":1},{"id":"SB464","l":"GUEST","t":"Folketrygdfondet","f":"m","d":2,"p":"M","sc":"none","s":"Which is one of Folketrygdfondet's six active ownership tools?","o":[["Nomination committees","Correct: nomination committees are one of the six tools."],["Buying ESG derivatives","Incorrect: ESG derivatives are not a tool."],["Short-selling weak ESG firms","Incorrect: short-selling is not an ownership tool."],["Appointing its own CEOs","Incorrect: it sits on nomination committees, not in management."]],"c":[0],"es":"Valgkomiteer er ett av de seks eierskapsverktøyene.","ed":"Folketrygdfondet sine seks eierskapsverktøy: forventninger til selskapene, dialog, stemmegivning, deltakelse i valgkomiteer, etiske utelukkelser og kontakt med andre aktører. Valgkomiteer gir innflytelse over hvem som sitter i styret. Husk: seks verktøy, valgkomité er ett.","kt":"","src":"Folketrygdfondet s. 18 · Folketrygdfondet s. 21 · Folketrygdfondet s. 24","e":1},{"id":"SB465","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Folketrygdfondet is a top-three owner in 52 Norwegian firms and sits on 16 nomination committees. Why does this give it more influence than NBIM has?","o":[["It only buys bonds","Incorrect: it is a large equity owner."],["It has veto rights by law","Incorrect: there is no legal veto."],["It invests passively","Incorrect: it is an active, concentrated manager."],["Bigger stakes and nomination roles","Correct: bigger stakes and seats on nomination committees."]],"c":[3],"es":"Store eierandeler og plass i valgkomiteer gir mer påvirkning.","ed":"NBIM eier små andeler (ca. 1–2 %) i tusenvis av selskaper. Folketrygdfondet eier store andeler i færre norske selskaper og sitter i mange valgkomiteer. Konsentrert eierskap gjør engagement mer troverdig og effektivt. Husk: større andel = mer påvirkning.\n\nForkortelser: NBIM = Norges Bank Investment Management (forvalter Oljefondet).","kt":"Nomination committee: a shareholder-elected committee that proposes board members, common in Norway.","src":"Folketrygdfondet s. 21 · Folketrygdfondet s. 24 · Bok s. 186 (Box 7.1)","e":1},{"id":"SB466","l":"GUEST","t":"Folketrygdfondet","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A survey shows that Norwegian practitioners adjust for weak environmental performance only through the discount rate, never through cash flows.","o":[["True","Incorrect. The survey shows adjustments through cash flows, the discount rate, both, or none."],["False","Correct. The survey shows adjustments through cash flows, the discount rate, both, or none."]],"c":[1],"es":"Usant. De justerer både i kontantstrøm, rente, begge, eller ingen.","ed":"Undersøkelsen blant norske praktikere viser at de justerer for svak miljøytelse på ulike måter: i kontantstrømmen, i diskonteringsrenten, i begge, eller ikke i det hele tatt. Det finnes ingen enkelt standard. Husk: praksis varierer.","kt":"","src":"Folketrygdfondet s. 16 · L9 slide 3","e":1},{"id":"SB467","l":"GUEST","t":"Folketrygdfondet","f":"m","d":2,"p":"H","sc":"none","s":"Folketrygdfondet calls materiality a \"prerequisite for financial value creation\". What evidence does it cite?","o":[["Firms ignoring ESG earn the most","Incorrect: the evidence shows the opposite."],["The highest ESG scores always win","Incorrect: the point is materiality, not overall scores."],["Immaterial ESG drives growth","Incorrect: immaterial issues do not drive returns."],["Material ESG investment pays","Correct: investing in material ESG pays."]],"c":[3],"es":"Investering i material ESG lønner seg.","ed":"Folketrygdfondet viser til Khan, Serafeim og Yoon: firmaer som investerer i ESG-forhold som er material for bransjen, får bedre aksjeavkastning, salgsvekst og marginer. Innsats på immaterielle forhold gir ikke det. Husk: materialitet er nøkkelen.","kt":"","src":"Folketrygdfondet s. 15 · L6 slide 52"},{"id":"SB468","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"M","sc":"none","s":"Folketrygdfondet asks \"The end of ESG?\" and quotes: \"Considering long-term factors when valuing a company isn't ESG investing; it's investing.\" What does this mean?","o":[["Stop thinking about sustainability","Incorrect: the point is integration, not dropping it."],["ESG is part of normal analysis","Correct: ESG becomes part of normal analysis."],["Only ESG funds should think long-term","Incorrect: all investing should consider long-term factors."],["Leave ESG to rating agencies","Incorrect: the analysis should be done in-house."]],"c":[1],"es":"ESG er en vanlig del av analysen, ikke en egen merkelapp.","ed":"Sitatet betyr at å ta hensyn til langsiktige faktorer når man verdsetter et selskap, ikke er en egen \"ESG-strategi\", men bare god investering. ESG blir en integrert del av vanlig analyse, ikke en merkelapp. Husk: \"it's investing\".","kt":"","src":"Folketrygdfondet s. 26 · Folketrygdfondet s. 27","e":1},{"id":"SB469","l":"GUEST","t":"Folketrygdfondet","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Folketrygdfondet's expectations to companies cover only climate, since climate is the only material ESG topic for Norwegian firms.","o":[["True","Incorrect. The expectations also cover corruption, human and labour rights, nature, tax and more."],["False","Correct. The expectations also cover corruption, human and labour rights, nature, tax and more."]],"c":[1],"es":"Usant. Forventningene dekker også korrupsjon, menneskerettigheter, natur osv.","ed":"Folketrygdfondets forventninger til selskapene dekker mye mer enn klima: strategi og kapitalstruktur, antikorrupsjon, menneskerettigheter og arbeidstakerrettigheter, natur, skatt og governance. Husk: bred liste, ikke bare klima.","kt":"","src":"Folketrygdfondet s. 19","e":1},{"id":"SB470","l":"GUEST","t":"Fondsfinans","f":"m","d":2,"p":"H","sc":"none","s":"How does Melanie Brooks (Fondsfinans) separate \"ESG\" from \"sustainability\"?","o":[["ESG is product impact; sustainability is governance","Incorrect: this reverses the distinction."],["ESG: how it runs; sustainability: what it sells","Correct: ESG is how the firm runs; sustainability is what it sells."],["Sustainability is relative; ESG is absolute","Incorrect: ESG scores are usually relative to peers."],["They mean the same","Incorrect: they are not the same."]],"c":[1],"es":"ESG = hvordan firmaet drives. Sustainability = hva firmaet selger.","ed":"Brooks skiller mellom ESG og sustainability. ESG handler om hvordan firmaet drives (utslipp, ansatte, styre), og alle firmaer har ESG-forhold. Sustainability handler om hva firmaet selger og om produktene bidrar til en bærekraftig økonomi. Husk: ESG = drift, sustainability = produkt.","kt":"","src":"Fondsfinans s. 6 · Bok s. 212 (Table 8.1)"},{"id":"SB471","l":"GUEST","t":"Fondsfinans","f":"m","d":2,"p":"M","sc":"none","s":"Brooks describes a move from \"greenwashing\" to \"greenwishing\" and \"greenhushing\". Greenhushing means:","o":[["Firms say less","Correct: firms say less to avoid criticism."],["Firms exaggerate green claims","Incorrect: exaggerating is greenwashing."],["Regulators ban green claims","Incorrect: it is firm behaviour, not a ban."],["Firms set unrealistic goals","Incorrect: unrealistic goals are greenwishing."]],"c":[0],"es":"Greenhushing = firmaer sier mindre for å unngå kritikk.","ed":"Tre begreper: greenwashing (overdrive grønne påstander), greenwishing (sette mål man ikke vet hvordan man skal nå) og greenhushing (si mindre om grønt arbeid for å unngå kritikk og søksmål). Strengere regler har ført til mer greenhushing. Husk: hushing = stille.","kt":"","src":"Fondsfinans s. 9 · Fondsfinans s. 10 · L8 slide 26","e":1},{"id":"SB472","l":"GUEST","t":"Fondsfinans","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: A manager whose mandate requires ESG integration but who ignores material ESG risks can face outflows, reputation damage and legal trouble, even with good returns.","o":[["True","Correct. Breaching the mandate can bring outflows, reputation damage and legal trouble, even with good returns."],["False","Incorrect. Breaching the mandate can bring outflows, reputation damage and legal trouble, even with good returns."]],"c":[0],"es":"Sant. Å bryte mandatet gir risiko selv med god avkastning.","ed":"Hvis mandatet fra kunden (asset owner) krever ESG-integrering, er det et brudd å ignorere material ESG-risiko. Det kan gi uttak, omdømmetap og juridiske problemer, uansett avkastning. Husk: mandatet må følges.","kt":"Investment mandate: the contract setting the objectives, constraints and requirements an asset manager must follow for a client.","src":"Fondsfinans s. 12","e":1},{"id":"SB473","l":"GUEST","t":"Fondsfinans","f":"t","d":3,"p":"M","sc":"none","s":"True or false: According to NBIM (quoted by Brooks), risk-based divestments since 2012 have cut equity returns by several percentage points.","o":[["True","Incorrect. NBIM reports that risk-based divestments increased returns slightly, by about 0.64 percentage points in total."],["False","Correct. NBIM reports that risk-based divestments increased returns slightly, by about 0.64 percentage points in total."]],"c":[1],"es":"Usant. Risikobasert salg ØKTE avkastningen litt.","ed":"NBIM har solgt seg ut av selskaper på grunn av risiko (f.eks. klima, korrupsjon). Ifølge NBIM har dette økt den samlede avkastningen litt, ca. 0,64 prosentpoeng siden 2012. Det kostet altså ikke avkastning. Husk: risikobasert salg økte avkastningen litt.\n\nForkortelser: NBIM = Norges Bank Investment Management (forvalter Oljefondet).","kt":"","src":"Fondsfinans s. 15 · L9 slide 33","e":1},{"id":"SB474","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"H","sc":"none","s":"Which weakness of \"off the shelf\" ESG ratings does Brooks highlight (\"Aggregate Confusion\")?","o":[["They favour small emerging market firms","Incorrect: they favour large firms in developed markets."],["They are audited and forward-looking","Incorrect: data are self-reported and backward-looking."],["They measure real outcomes precisely","Incorrect: the link to real outcomes is weak."],["Different providers disagree a lot","Correct: different providers disagree a lot."]],"c":[3],"es":"Ulike leverandører er svært uenige.","ed":"Brooks lister svakheter ved ferdige ESG-ratinger: stor uenighet mellom leverandører (Aggregate Confusion), selvrapporterte og bakoverskuende data, uklare metoder, skjevhet mot store selskaper og svak kobling til faktisk bærekraft. Husk: ratingene spriker.","kt":"","src":"Fondsfinans s. 16 · Fondsfinans s. 17 · L7 slide 37"},{"id":"SB475","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"H","sc":"short","s":"A chip maker uses lots of water in a drought area. Its water use harms local farmers today, and water shortages could stop its production later. Which concept fits?","o":[["Accounting materiality","Incorrect: accounting materiality ignores impacts on society."],["Not material","Incorrect: it is clearly material."],["Only financial materiality","Incorrect: impact on farmers matters too."],["Double and dynamic","Correct: it is both double and dynamic materiality."]],"c":[3],"es":"Påvirker både samfunnet og firmaet, og endrer seg over tid = double og dynamic.","ed":"Vannbruken skader bøndene i dag (impact materiality) og kan stoppe produksjonen senere (financial materiality). Det er double materiality. At risikoen for firmaet vokser over tid, er dynamic materiality. Husk: double = begge veier, dynamic = over tid.","kt":"","src":"Fondsfinans s. 19 · Fondsfinans s. 20 · L6 slide 53"},{"id":"SB476","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"M","sc":"none","s":"Which question should you ask before choosing active ownership as an ESG approach (Brooks)?","o":[["Can engagement replace knowledge of the firm?","Incorrect: engagement needs knowledge of the firm."],["Information or change?","Correct: ask whether you want information or change."],["Can you avoid managers?","Incorrect: you need access to managers."],["Is the issue immaterial?","Incorrect: focus on material issues."]],"c":[1],"es":"Spør: vil du ha informasjon eller endring?","ed":"Brooks lister spørsmål før man velger active ownership: Vil du ha informasjon eller endring? Har du nok kunnskap og ressurser? Har du tilgang til ledelsen? Er saken material? Målet avgjør hvilket verktøy som passer. Husk: start med målet.","kt":"","src":"Fondsfinans s. 24 · Fondsfinans s. 22","e":1},{"id":"SB477","l":"GUEST","t":"Fondsfinans","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Brooks says there is no one-size-fits-all ESG approach; investors should start by asking what they want to achieve and what resources they have.","o":[["True","Correct. Brooks says there is no single approach; start with what you want to achieve and your resources."],["False","Incorrect. Brooks says there is no single approach; start with what you want to achieve and your resources."]],"c":[0],"es":"Sant. Start med hva du vil oppnå og hvilke ressurser du har.","ed":"Det finnes ingen ESG-tilnærming som passer alle. En liten forvalter med få analytikere må velge annerledes enn et stort fond. Start med målet og ressursene, og velg verktøy deretter. Husk: no one-size-fits-all.","kt":"","src":"Fondsfinans s. 21 · L9 slide 29","e":1},{"id":"SB478","l":"GUEST","t":"PwC","f":"m","d":2,"p":"H","sc":"none","s":"According to PwC, which principle decides what firms report under the CSRD and ESRS?","o":[["Only emissions","Incorrect: ESRS cover E, S and G."],["Double materiality","Correct: double materiality decides what is reported."],["Only financial materiality","Incorrect: CSRD also requires impact materiality."],["Any framework the firm likes","Incorrect: ESRS are mandatory standards."]],"c":[1],"es":"CSRD bruker double materiality.","ed":"Under CSRD og ESRS gjør firmaene en double materiality assessment. De rapporterer impacts, risks and opportunities (IROs) som er material enten fra et impact-perspektiv eller et finansielt perspektiv. Husk: CSRD = double materiality.\n\nForkortelser: CSRD = Corporate Sustainability Reporting Directive (EUs lov om bærekraftsrapportering); ESRS = European Sustainability Reporting Standards (standardene under CSRD); IRO = Impacts, Risks and Opportunities (det som rapporteres under ESRS).","kt":"","src":"PwC s. 29 · PwC s. 32"},{"id":"SB479","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"short","s":"94% of investors think corporate reports contain unsupported sustainability claims. Which CSRD feature addresses this most directly?","o":[["Only photos and stories","Incorrect: unverifiable stories are the problem."],["Free choice of framework","Incorrect: free choice lowers comparability."],["Mandatory external assurance","Correct: mandatory external assurance checks the claims."],["No reporting for large firms","Incorrect: that would give less information."]],"c":[2],"es":"Obligatorisk ekstern revisjon (assurance) gir tillit.","ed":"Mange investorer tror rapportene inneholder udokumenterte påstander. CSRD krever ekstern assurance (revisjon) av bærekraftsrapporten, slik at påstandene blir sjekket av en uavhengig part. Det bygger tillit. Husk: assurance = kontroll.\n\nForkortelser: CSRD = Corporate Sustainability Reporting Directive (EUs lov om bærekraftsrapportering).","kt":"Assurance: independent third-party verification of reported information (limited or reasonable assurance).","src":"PwC s. 30 · PwC s. 38 · PwC s. 46","e":1},{"id":"SB480","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"short","s":"The EU Omnibus package cuts the number of firms that must report under the CSRD. What is the trade-off for investors and banks?","o":[["No trade-off","Incorrect: there is a trade-off."],["It bans voluntary reporting","Incorrect: voluntary reporting is still allowed."],["It raises costs for all firms","Incorrect: the aim is lower costs."],["Lower costs, less reliable data","Correct: lower costs, but less reliable data."]],"c":[3],"es":"Lavere kostnader, men mindre pålitelige data.","ed":"Omnibus-pakken reduserer antall firmaer som må rapportere under CSRD. Det sparer kostnader, men investorer og banker får mindre og mindre pålitelige ESG-data om mange låntakere og selskaper. Husk: billigere, men dårligere data.\n\nForkortelser: CSRD = Corporate Sustainability Reporting Directive (EUs lov om bærekraftsrapportering); ESRS = European Sustainability Reporting Standards (standardene under CSRD).","kt":"CSRD scope: the set of companies legally required to publish sustainability statements under ESRS.","src":"PwC s. 40 · PwC s. 41 · L11 slide 31","e":1},{"id":"SB481","l":"GUEST","t":"PwC","f":"t","d":2,"p":"L","sc":"none","s":"True or false: PwC says sustainability reporting has a lower risk of errors than financial reporting, because its data come from mature IT systems.","o":[["True","Incorrect. PwC says sustainability data have a greater risk of errors, because processes and systems are immature."],["False","Correct. PwC says sustainability data have a greater risk of errors, because processes and systems are immature."]],"c":[1],"es":"Usant. Bærekraftsdata har HØYERE risiko for feil, pga. umodne systemer.","ed":"Finansiell rapportering har modne systemer og kontroller. Bærekraftsrapportering bygger ofte på manuelle regneark og nye prosesser. PwC sier derfor at risikoen for feil er høyere. Husk: umodne systemer = flere feil.","kt":"","src":"PwC s. 46 · PwC s. 47","e":1},{"id":"SB482","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"none","s":"PwC says \"It's really not about the reporting...\" What is the main message?","o":[["Reports have no value","Incorrect: reporting can add value."],["Reporting should support strategy","Correct: reporting should support strategy."],["Only compliance matters","Incorrect: compliance is the minimum."],["Keep sustainability out of strategy","Incorrect: sustainability belongs in the core strategy."]],"c":[1],"es":"Rapporteringen skal støtte strategien.","ed":"PwC sitt poeng: rapporteringen er ikke målet i seg selv. Firmaer som bruker rapporteringsprosessen til å forbedre strategi og drift, får mest ut av det. Rekkefølgen er design (strategi), make it real (endring), report. Husk: strategi først, rapport etterpå.","kt":"","src":"PwC s. 13 · PwC s. 23 · PwC s. 24 · PwC s. 27","e":1},{"id":"SB483","l":"GUEST","t":"PwC","f":"m","d":3,"p":"L","sc":"none","s":"Which statement does PwC call a climate MYTH?","o":[["\"Impacts can come through operations and supply chains\"","Incorrect: PwC presents this as fact."],["\"Disaster losses were about $417bn in 2024\"","Incorrect: this is cited as fact."],["\"A firm's carbon footprint decides its physical risk\"","Correct: this is the myth: footprint does not decide physical risk."],["\"Physical impacts will worsen for decades anyway\"","Incorrect: PwC presents this as fact."]],"c":[2],"es":"Myten er at karbonavtrykket bestemmer physical risk.","ed":"Physical risk avhenger av hvor eiendelene og leverandørene ligger (flom, hete, storm), ikke av hvor mye firmaet slipper ut. Et firma med små utslipp kan ha stor physical risk. Husk: physical risk = sted, ikke utslipp.","kt":"","src":"PwC s. 16 · Bok s. 223 (8.2.2)","e":1},{"id":"SB484","l":"GUEST","t":"Guest lectures synthesis","f":"m","d":4,"p":"H","sc":"none","s":"What is the common thread across the Folketrygdfondet, Fondsfinans and PwC guest lectures?","o":[["ESG always beats the market","Incorrect: the speakers warn against such claims."],["Material ESG beats labels","Correct: material ESG matters more than labels."],["Reporting is just compliance","Incorrect: PwC argues the opposite."],["ESG ratings are enough for decisions","Incorrect: ratings have weaknesses."]],"c":[1],"es":"Material ESG betyr mer enn merkelapper.","ed":"Alle tre gjesteforelesningene peker på det samme: det som teller, er material ESG-forhold, integrering i analyse og strategi, og god datakvalitet. Merkelapper, ratinger og ren compliance er ikke nok. Husk: materialitet over merkelapper.","kt":"","src":"Folketrygdfondet s. 26 · Fondsfinans s. 16 · Fondsfinans s. 21 · PwC s. 13"},{"id":"SB485","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A fund owns a solar equipment maker accused of forced labour in its supply chain. What should the manager do first (Brooks)?","o":[["Sell at once","Incorrect: selling is chosen after an assessment."],["Praise the firm publicly","Incorrect: praise is not risk management."],["Ignore it","Incorrect: a green product does not remove S risks."],["Assess how material it is","Correct: first assess how material the issue is."]],"c":[3],"es":"Først: vurder hvor material saken er.","ed":"Brooks anbefaler først å vurdere hvor material saken er (alvorlighet, sannsynlighet, effekt på verdien). Deretter velger man: gjøre ingenting, redusere eller selge, eller engasjere for å skape endring. Et grønt produkt fjerner ikke sosial risiko. Husk: vurder først, handle etterpå.","kt":"Desired outcome: what the investor wants to achieve - reduce financial risk, reduce reputational risk, or \"make a difference\" (MAD).","src":"Fondsfinans s. 23 · Fondsfinans s. 24","e":1},{"id":"SB486","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"L","sc":"short","s":"Folketrygdfondet has beaten its benchmark over many years. Why does the long-run result matter more than one year for judging its ESG strategy?","o":[["One year proves skill","Incorrect: one year is too short."],["Change the benchmark every year","Incorrect: stable benchmarks make results comparable."],["One year is just noise","Correct: one year is mostly noise."],["Excess returns do not matter","Incorrect: excess return is the key test."]],"c":[2],"es":"Ett år er bare støy. Lang tid skiller ferdighet fra flaks.","ed":"Ett års avkastning påvirkes mye av tilfeldigheter. For å skille ferdigheter fra flaks trengs mange år med resultater mot en stabil benchmark. En langsiktig ESG-strategi må derfor vurderes over lang tid. Husk: skill vs luck krever tid.","kt":"Excess return (active return): portfolio return minus benchmark return.","src":"Folketrygdfondet s. 8 · Folketrygdfondet s. 11 · Bok s. 195 (7.3.5)","e":1},{"id":"EX02","l":"L13","t":"Exam sample: backcasting","f":"t","d":2,"p":"H","sc":"none","s":"Does backcasting start from a desired future end-state and work backwards to define the pathway?","o":[["Yes","Riktig. Backcasting starter med målet (f.eks. netto null i 2050) og jobber bakover for å finne stegene dit."],["No","Feil. Backcasting starter med målet (f.eks. netto null i 2050) og jobber bakover for å finne stegene dit."]],"c":[0],"es":"Ja: start i ønsket fremtid, jobb bakover.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- Forecasting: start i dag og spå hva som skjer.\n- Backcasting: bestem hvor du vil være, og planlegg bakover hva som må skje.\nBackcasting er et verktøy i transition management (forelesning 13).","kt":"Backcasting: planlegging bakover fra et ønsket fremtidig mål.","src":"L13 slide 13-16 · Bok s. 354 (12.1.1) · Bok s. 359 (12.2) · Bok s. 361 (12.3)","k":1,"x":1},{"id":"CX097","l":"L13","t":"Coalitions","f":"m","d":2,"p":"H","sc":"none","s":"According to Ostrom, a coalition that governs a common resource well needs:","o":[["Monitoring and sanctions","Uten kontroll og konsekvenser blir det free riding."],["Full government ownership","Ostrom viser nettopp at fellesskap kan styre uten staten."],["No formal rules","Ostrom vektlegger klare regler."],["As many members as possible","Store koalisjoner er ofte mindre ambisiøse."]],"c":[0],"es":"Monitoring + sanctions mot free riding.","ed":"Ostroms prinsipper: klare grenser, medlemsregler, felles beslutninger, overvåking, sanksjoner, konfliktløsning. Mange klimakoalisjoner mangler håndheving.","kt":"","src":"L13 slide 6-7 · Bok s. 111 (4.3.1) · Bok s. 112 (Table 4.3) · Bok s. 113 (4.3.1)","k":1},{"id":"CX098","l":"L13","t":"Coalitions","f":"m","d":2,"p":"H","sc":"none","s":"In sustainable finance coalitions, size and ambition are related in that:","o":[["Larger ones tend to be less ambitious","Mange medlemmer krever lette krav."],["Only small ones have principles","Store koalisjoner har også prinsipper, bare svakere."],["Size and ambition are unrelated","Boka finner en tydelig sammenheng."],["Larger ones are more ambitious","Det er motsatt."]],"c":[0],"es":"Stor koalisjon = lavere ambisjon.","ed":"For å få med mange medlemmer må kravene være lette. GIIN og GABV er ambisiøse, men små.\n\nForkortelser: GIIN = Global Impact Investing Network; GABV = Global Alliance for Banking on Values (nettverk av verdibaserte banker).","kt":"","src":"L13 slide 3-9 · Bok s. 113 (4.3.1)","k":1},{"id":"CX099","l":"L13","t":"Role of players","f":"t","d":2,"p":"H","sc":"none","s":"Do short election cycles make it harder for governments to pursue long-term climate goals?","o":[["Yes","Riktig. Politikere må vinne valg om få år, mens klimatiltak virker over tiår."],["No","Feil. Politikere må vinne valg om få år, mens klimatiltak virker over tiår."]],"c":[0],"es":"Ja: valgsykluser = kort horisont.","ed":"Ligner tragedy of the horizon: kostnadene merkes nå, gevinstene kommer senere. Derfor trengs også investorer, banker og koalisjoner.","kt":"","src":"L13 slide 8-9 · Bok s. 84 (Table 3.1)","k":1},{"id":"CX100","l":"L13","t":"Government policy","f":"m","d":2,"p":"H","sc":"none","s":"The 'green premium' is:","o":[["The extra cost of going green","F.eks. at grønt stål koster 25 % mer enn vanlig stål."],["The lower yield on green bonds","Det er greenium, ikke green premium."],["A tax on fossil fuels","En karbonavgift kan krympe green premium, men er ikke det samme."],["A subsidy paid to green producers","Det er en subsidie."]],"c":[0],"es":"Green premium = merkostnad ved det grønne. Greenium = lavere yield på grønne obligasjoner.","ed":"En gradvis høyere karbonpris gjør det fossile dyrere og krymper green premium. Det kalles å 'level the playing field'.","kt":"","src":"L13 slide 11-12 · L3 slide 19","k":1},{"id":"CX101","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"none","s":"One motive for joining a sustainability coalition is:","o":[["Members no longer report emissions","Rapporteringsplikten gjelder fortsatt."],["Higher success in joint engagement","Når investorer engasjerer sammen, lykkes de oftere."],["Members are exempt from regulation","Medlemskap gir ikke unntak fra lover."],["Members pay lower corporate taxes","Medlemskap gir ingen skattefordel."]],"c":[1],"es":"Collective engagement er ett av seks motiver.","ed":"Seks motiver (slide 4):\n- Collective advocacy: lobbe sammen overfor myndighetene.\n- Reputation: bli sett som en leder.\n- Peer effect: konkurrentene er med.\n- Outside pressure: press fra kunder, investorer, NGO-er.\n- Risk avoidance: unngå stranded assets.\n- Collective engagement: høyere suksessrate i engagement.\n\nForkortelser: NGO = Non-Governmental Organisation (frivillig organisasjon, f.eks. Greenpeace).","kt":"","src":"L13 slide 4","k":1},{"id":"CX102","l":"L13","t":"Coordinated engagement","f":"m","d":2,"p":"H","sc":"none","s":"Dimson, Karakaş and Li (2020) find that an effective engagement strategy is:","o":[["Leaving dialogue to proxy advisors","Det er ikke strategien de studerer."],["Selling the shares before engaging","Da mister du stemmen din."],["Each investor engaging alone in secret","Studien handler nettopp om samarbeid."],["Lead investor plus supporters","To nivåer: én leder dialogen, de andre støtter."]],"c":[3],"es":"Lead investor + supporting investors = effektiv coordinated engagement.","ed":"Lead-rollen tas oftest av en investor med stor eierandel i et hjemlandsselskap. Suksessen er høyest når lederen er innenlandsk og støttespillerne er internasjonale.","kt":"","src":"L13 slide 5","k":1},{"id":"CX103","l":"L13","t":"Why government policies matter","f":"t","d":2,"p":"H","sc":"none","s":"Is a lack of information, trained staff or incentives an example of a non-market barrier to decarbonisation?","o":[["Yes","Riktig. Det er barrierer som ikke handler om pris, og der riktig politikk kan gjøre stor forskjell."],["No","Feil. Det er barrierer som ikke handler om pris, og der riktig politikk kan gjøre stor forskjell."]],"c":[0],"es":"Ja: non-market barriers.","ed":"Foreleserens liste over hvorfor politikk betyr noe: mind the investment gap, level the playing field, overcome non-market barriers, stay up to date, plan for a just transition, do the hard stuff too, work on technology, policy and markets at the same time.","kt":"","src":"L13 slide 11","k":1},{"id":"CX104","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"The three levers that must be pulled at the same time to get to zero are:","o":[["Equity, bonds and loans","Det er finansieringsformer."],["Environment, social and governance","Det er ESG, ikke de tre spakene."],["Taxes, subsidies and bans","Det er bare politikkverktøy."],["Technology, policy and markets","Alle tre må dras samtidig og i samme retning."]],"c":[3],"es":"Tre spaker: technology, policy, markets.","ed":"Poenget er at én spak alene ikke er nok: ny teknologi trenger politikk (f.eks. karbonpris) og markeder som tar den i bruk.","kt":"","src":"L13 slide 11-12","k":1},{"id":"CX105","l":"L13","t":"Government policy","f":"m","d":2,"p":"H","sc":"none","s":"Planning for a 'just transition' aims to:","o":[["Delay all climate policy until 2050","Just transition handler om hvordan, ikke om å utsette."],["Make polluters pay every cost at once","Det er ikke kjernen i just transition."],["Give tax breaks to oil companies","Det er motsatt av poenget."],["Support communities hit by the shift","F.eks. kullregioner som mister arbeidsplasser."]],"c":[3],"es":"Just transition = støtte til de som rammes av omstillingen.","ed":"Staten kan gi finansiering og teknisk hjelp, og koble sammen lokalsamfunn med like problemer så de kan dele det som virker.","kt":"","src":"L13 slide 12 · PwC s. 47","k":1},{"id":"SB487","l":"L13","t":"Institutional investors","f":"m","d":3,"p":"M","sc":"short","s":"Climate Action 100+ lets hundreds of investors engage the biggest emitters together. Why are such coalitions more effective than one investor alone?","o":[["No monitoring is needed","Incorrect: effective coalitions need monitoring."],["Single investors may not engage","Incorrect: single investors are allowed to engage."],["Coalitions can force firms by law","Incorrect: coalitions have influence, not legal power."],["Pooled ownership gives leverage","Correct: pooled ownership gives more leverage."]],"c":[3],"es":"Samlet eierskap gir mer makt overfor firmaene.","ed":"Climate Action 100+ samler hundrevis av investorer som engasjerer de største utslipperne sammen. Når mange eiere står bak de samme kravene, får de mye mer tyngde enn én investor alene. Dimson, Karakaş og Li viser at samarbeid øker suksessraten. Husk: sammen = mer makt.","kt":"Collective engagement: several investors coordinating dialogue with a company to increase their influence.","src":"L13 slide 4-5 · Bok s. 111 (4.3.1) · Bok s. 104 (Table 4.1)"},{"id":"SB488","l":"L13","t":"System approach","f":"m","d":2,"p":"H","sc":"none","s":"How does Ostrom (1990) suggest governing shared resources such as the atmosphere?","o":[["Only through taxes","Incorrect: Ostrom looks beyond central rules like taxes."],["Only through private property","Incorrect: she looks beyond private property too."],["Self-governing groups","Correct: self-governing groups with their own rules and sanctions."],["By letting markets fix it","Incorrect: markets alone lead to the tragedy of the commons."]],"c":[2],"es":"Ostrom: grupper som styrer seg selv, med regler og sanksjoner.","ed":"Ostrom (Nobelpris) viste at fellesressurser kan styres godt av grupper som lager egne regler, uten bare stat eller marked. Kjennetegn: klare grenser, overvåking, gradvise sanksjoner og konfliktløsning. Prinsippene brukes for å vurdere finanskoalisjoner. Husk: selvstyre med regler og sanksjoner.","kt":"","src":"L13 slide 3-9 · Bok s. 104 (4.2) · Bok s. 105 (4.2)"},{"id":"SB489","l":"L13","t":"System approach","f":"m","d":3,"p":"H","sc":"none","s":"McElroy's sustainability quotient is SP = actual impact / normative impact. For carbon, when is a firm sustainable?","o":[["When SP ≤ 1","Correct: SP ≤ 1 means impact is within the limit."],["When SP > 1","Incorrect: above 1 is unsustainable."],["When its ESG rating is above average","Incorrect: ratings do not compare with limits."],["When emissions fall each year","Incorrect: improvement says nothing about the limit."]],"c":[0],"es":"SP ≤ 1 betyr at faktisk påvirkning er innenfor grensen.","ed":"McElroys sustainability quotient: SP = faktisk påvirkning / normativ påvirkning (firmaets rettferdige andel av hva naturen tåler). For utslipp betyr SP ≤ 1 at firmaet holder seg innenfor sin andel. Over 1 er ikke bærekraftig. Husk: under 1 = innenfor taket.\n\nForkortelser: SP = Sustainability Performance (McElroys bærekraftskvotient).","kt":"","src":"Bok s. 105 (4.2) · Bok s. 168 (6.3.3)"},{"id":"SB490","l":"L13","t":"Role of players","f":"m","d":3,"p":"H","sc":"short","s":"Norway's government faces elections every four years but must cut emissions over decades. Which threat to government does this show?","o":[["A short horizon","Correct: elections every four years give a short horizon."],["Marking to market","Incorrect: marking to market is an investor threat."],["Single-issue campaigns","Incorrect: single-issue campaigns are a civil society threat."],["Poverty and fear of change","Incorrect: these are household threats."]],"c":[0],"es":"Valg hvert fjerde år gir kort horisont.","ed":"Læreboka lister roller og trusler for ulike aktører. For myndigheter er trusselen kort horisont: valg hvert fjerde år gjør det vanskelig å gjennomføre politikk som koster nå og gir gevinst om tiår. Husk: myndigheter = valgperioden.","kt":"Table 3.1: each player (government, civil society, corporates, investors, households) has a sphere of influence, horizon, mechanisms, opportunities and threats.","src":"L13 slide 8-9 · Bok s. 84 (Table 3.1)"},{"id":"SB491","l":"L13","t":"Coalitions","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"A new investor alliance covers 60% of Nordic assets and has ambitious go
