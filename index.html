ment producer - physical risk","Policy changes are transition risk."],["California utility PG&E filing for bankruptcy in 2019 after wildfire liabilities - physical risk","Climate-linked wildfires created the losses (plus liability)."],["A heatwave reducing worker productivity - transition risk","Heat is a physical risk."]],"c":[2],"es":"Climate hazards = physical; policy, technology, markets and costs of the transition = transition risk.","ed":"Ørsted shows that \"green\" firms also face transition risk: rising interest rates and supply costs hit offshore wind. PG&E shows physical risk combined with liability risk. Both matter for valuation, bonds (Lecture 10) and insurance (Lecture 12). Also correct: Offshore wind developer Ørsted writing down US projects in 2023 after cost and rate increases - transition risk.","kt":"Physical risk: damage from climate events (acute) or gradual changes (chronic). Transition risk: losses from policy, technology, market or legal changes towards a low-carbon economy.","src":"L3 slide 23 · Bok s. 49 (2.3)"},{"id":"SB096","l":"L3","t":"Integrated value approach","f":"m","d":4,"p":"H","sc":"none","s":"In the textbook's integrated value example, the original process has F = 15, S = -2 and E = -4. An adapted process has F = 14, S = -1 and E = -1. What do the integrated values tell us?","o":[["Both processes have the same integrated value, so the choice does not matter.","9 and 12 differ."],["I rises from 9 to 12, but a pure F-maximiser keeps the old process (15 > 14).","I = 15 - 2 - 4 = 9 versus I* = 14 - 1 - 1 = 12; traditional finance only compares F."],["I is 21 for the original process and 16 for the adapted one, so the original process creates more integrated value.","S and E are negative values and must be subtracted, not added."],["I falls from 15 to 14, so the firm should keep the original process.","This compares only financial value, not integrated value."]],"c":[1],"es":"I = 9 originally, I* = 12 after adaptation; finance as usual would keep the old process because F is higher.","ed":"Summary of Figure 2.3: step 1 measures F and monetises S and E; step 2 computes I = F + S + E = 15 - 2 - 4 = 9; step 3 adapts the process, reducing S and E impacts at a financial cost of 1; step 4 computes I* = 14 - 1 - 1 = 12. Integrated value rises by 3, yet traditional finance (max F) prefers the old process (15 > 14). If the externalities are later priced (tax, reputation), the old process becomes obsolete and its assets may become stranded.","kt":"","src":"L3 slide 32 · Bok s. 50 (2.3) · Bok s. 51 (Figure 2.3)"},{"id":"SB097","l":"L3","t":"Integrated value approach","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In the textbook's true price analysis of roses from Kenya (Box 2.3), both conventional and sustainable roses retail at about €0.70 per stem. What did the analysis find?","o":[["The conventional rose had the lower true price because it was cheaper to produce.","The conventional rose had the higher true price (€0.92)."],["The sustainable rose had the lower true price, since its externalities were smaller.","The gap comes mainly from the environmental impact of air-freight transport and the social impact on workers' incomes."],["The true price of both roses equalled the retail price, so there were no externalities.","Both true prices exceeded the €0.70 retail price."],["A living wage was shown to be feasible only if farm owners alone bore all the costs.","It was feasible only when part of the cost was borne by traders, retailers and consumers."]],"c":[1],"es":"Sustainable rose: true price €0.74 vs conventional €0.92, at the same €0.70 retail price.","ed":"The true price adds the monetised social and environmental costs to the market price. The analysis identified projects such as shipping by sea (+€5,000 profit per hectare), health and safety training (+€4,500 per hectare), solar-powered greenhouses and closed-loop hydroponics. Better standards were financially feasible, but paying a living wage required part of the cost to be shared along the value chain (traders, retailers, consumers).","kt":"","src":"Bok s. 52 (Box 2.3)"},{"id":"SB098","l":"L3","t":"Integrated value approach","f":"m","d":4,"p":"M","sc":"none","s":"Which is a pitfall of monetising externalities identified in the textbook?","o":[["Efficiency-based calculations automatically build in resilience and adaptive capacity.","The textbook warns efficiency-based calculations can neglect resilience; it proposes optimisation with scope for adaptive capacity."],["Monetisation makes it impossible to compare financial and non-financial values.","The purpose of monetisation is precisely to make them comparable."],["Integrated value calculations require no assumptions about the size or price of externalities.","They require many assumptions and are surrounded by uncertainty."],["Monetisation cannot fully express ethical aspects such as human rights or health and safety.","The textbook notes ethical aspects resist monetisation and capitals are not substitutable."]],"c":[3],"es":"Pitfalls: ethics not captured, capitals not substitutable, perverse offsets, uncertainty, neglect of resilience.","ed":"Summary of section 2.3.1: (1) calculations are traditionally done on efficiency grounds, neglecting resilience, so the textbook proposes optimisation with scope for adaptive capacity over a long horizon; (2) monetisation cannot fully express ethical aspects, and capitals are not substitutable; (3) perverse outcomes where economic gains offset destruction, so SEV may not be reduced; (4) inherent uncertainty. On the positive side, stakeholder participation and reliable, certified integrated reporting improve credibility. Also correct: Large financial gains can appear to offset severe environmental damage, legitimising destruction.","kt":"","src":"Bok s. 53 (2.3.1) · Bok s. 54 (2.3.1)"},{"id":"SB099","l":"L3","t":"Insufficient private effort","f":"m","d":4,"p":"M","sc":"none","s":"The textbook argues that even if individual companies internalise externalities, planetary boundaries may still be crossed. Which concept describes this micro-macro gap?","o":[["The fallacy of composition","Individual eco-efficiency gains need not add up to staying within the carbon budget (Dyllick and Muff's \"big disconnect\")."],["Double materiality","Double materiality is a reporting concept, not an aggregation problem."],["The adaptive markets hypothesis (Lo)","AMH explains why new risks may not be priced; it is not about micro efforts failing to add up."],["The tragedy of the horizon","That concerns costs now and benefits later, not the aggregation of firm efforts."]],"c":[0],"es":"The fallacy of composition: individual firm efforts need not sum to a sustainable macro outcome.","ed":"The fallacy of composition arises when one concludes something is true of the whole because it is true of every part. Companies reduce their carbon footprints (eco-efficiency), but projected emissions still exceed the 2°C budget (eco-effectiveness), the \"big disconnect\". Reasons: private discount rates are higher than the public rate Stern advocates, only about 20% of companies actively manage their carbon footprint, and the boundary problem lets activity shift elsewhere. Hence government regulation remains necessary.","kt":"","src":"Bok s. 54 (2.3.2) · Bok s. 55 (2.3.2)"},{"id":"SB100","l":"L3","t":"Stranded assets","f":"m","d":2,"p":"H","sc":"none","s":"Which example best illustrates a stranded asset as defined in the textbook?","o":[["Cash held by a firm in a foreign currency that has appreciated.","An appreciating currency increases value; stranded assets lose value."],["A new office building rented out at full occupancy for 20 years.","There is no loss of value from regulation or technology change here."],["A government bond whose price falls slightly when interest rates rise.","Ordinary interest-rate risk is not what stranded assets refers to."],["Oil reserves that become unprofitable once strict carbon pricing arrives.","Stranded assets lose their value, e.g. fossil fuel assets made unprofitable by regulation or technology change."]],"c":[3],"es":"Stranded assets lose their value, e.g. because of carbon pricing or cheaper renewables.","ed":"The term was introduced for fossil fuel assets that may lose value because of government regulation (carbon pricing) or technological change (cheaper solar and wind). It applies more widely: real estate with poor energy labels, diesel cars banned from city centres, and land degraded by intensive agriculture. Late, abrupt transitions create more stranded assets than early, gradual ones, which is why scenario analysis matters for valuation.","kt":"","src":"Bok s. 53 (2.3) · Bok s. 70 (Key concepts) · L9 slide 3"},{"id":"SB101","l":"L3","t":"Internalisation uncertainty","f":"m","d":4,"p":"M","sc":"short","s":"In 2025 the EU agreed to delay and simplify parts of its sustainability rules (the \"Omnibus\"), while carbon prices kept fluctuating. For an investor, what is the main lesson from Lecture 3?","o":[["Internalisation always happens immediately and fully.","Policy delays show it does not."],["The timing and strength of internalisation are uncertain, so use scenarios.","Policy can speed up, slow down or reverse; scenarios capture this."],["Externalities will never be internalised, so they can be ignored.","Internalisation is uncertain in timing, not impossible."],["Only physical risks matter, transition risks have disappeared.","Transition risks remain, though uncertain in timing."]],"c":[1],"es":"Uncertain timing of internalisation → scenario analysis, not a single forecast.","ed":"Lecture 3 lists uncertainty about whether, when and how externalities are internalised. Investors who assume \"never\" risk stranded assets; those who assume \"tomorrow\" may overpay for green assets (see Ørsted). Probability-weighted scenarios balance this.","kt":"Scenario analysis: valuing a firm under several plausible futures (e.g. slow vs fast transition) instead of one forecast.","src":"L3 slide 21 · L3 slide 25 · PwC s. 41"},{"id":"SB102","l":"L3","t":"Sources of uncertainty","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Figure 2.4 in the textbook shows that the IEA's forecasts of global solar PV capacity were consistently higher than the actual installed capacity, because the IEA overestimated technological progress.","o":[["True","Incorrect. Actual installed capacity was consistently higher than both IEA and Greenpeace forecasts; the textbook concludes our thinking tends to be linear while technology can develop exponentially."],["False","Correct. Actual installed capacity was consistently higher than both IEA and Greenpeace forecasts; the textbook concludes our thinking tends to be linear while technology can develop exponentially."]],"c":[1],"es":"False: actual solar capacity consistently beat the forecasts.","ed":"Solar PV electricity grew at about 51% per year (2005-2015), and Figure 2.4 shows actual capacity above both IEA and Greenpeace forecasts, with Greenpeace closer to reality. The lesson: forecasts tend to be linear while underlying technology may be exponential (cf. Moore's law; renewables doubling roughly every 5.5 years; the \"carbon law\" of halving emissions each decade). This understates disruption risk for incumbents.","kt":"","src":"Bok s. 57 (2.4.1.2) · Bok s. 58 (Figure 2.4)"},{"id":"SB103","l":"L3","t":"Scenario analysis","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: An analyst values a coal-heavy utility at NOK 200 per share under \"slow transition\" (60% probability) and NOK 80 under \"fast transition\" (40%). What is the probability-weighted value?","o":[["NOK 140","This is the simple average, ignoring probabilities."],["NOK 200","This ignores the fast-transition scenario."],["NOK 128","This reverses the probabilities."],["NOK 152","0.6 × 200 + 0.4 × 80 = 120 + 32 = 152."]],"c":[3],"es":"0.6 × 200 + 0.4 × 80 = NOK 152.","ed":"Steps: identify drivers of internalisation, build scenarios, value the firm in each, weight by probabilities. If the market price is close to the slow-transition value, the market may be underpricing transition risk.","kt":"Probability-weighted (expected) value = Σ probability × value in each scenario.","src":"L3 slide 25 · Bok s. 144 (Table 5.6)"},{"id":"SB104","l":"L3","t":"Scenario analysis","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Scenario analysis asks only how a company would fare if everything goes wrong at once, whereas stress-testing weighs several plausible scenarios by their probabilities to arrive at a fair value.","o":[["True","Incorrect. The roles are reversed: stress-testing asks \"what if everything goes wrong?\" (a drastic scenario), while scenario analysis elaborates several plausible scenarios and weighs them by probabilities."],["False","Correct. The roles are reversed: stress-testing asks \"what if everything goes wrong?\" (a drastic scenario), while scenario analysis elaborates several plausible scenarios and weighs them by probabilities."]],"c":[1],"es":"False: it is the other way round - stress tests focus on extreme scenarios; scenario analysis weights several plausible ones.","ed":"Scenario analysis is used for valuation and strategy (e.g. probability-weighted fair value). Stress-testing is used by central banks and supervisors to identify tail risks, for example carbon stress tests of banks' and investors' exposures. Thomä and Dupre argue traditional three-year macro stress tests underestimate transition risk; sector-level analysis with horizons of up to 20 years is needed.","kt":"","src":"L3 slide 34 · Bok s. 66 (2.4.4)"},{"id":"SB105","l":"L3","t":"Scenario analysis","f":"m","d":4,"p":"M","sc":"none","s":"Based only on historical frequency, the probability of a $100 carbon price is 0%, because it has never happened. Why does the textbook reject this as the basis for valuation?","o":[["Historical data on carbon prices are not published anywhere, so no probability can be estimated.","Carbon price data exist; the problem is they do not reflect future policy."],["A 0% probability is always correct for events that have not occurred.","This is exactly the backward-looking error the textbook warns against."],["Carbon prices are irrelevant to the valuation of companies.","The oil company example shows carbon prices can drive fair value from $163 to $0."],["Past data come from an unpriced era and understate future disruption.","Forecasting based on the past assumes ceteris paribus, which fails when externalities become internalised."]],"c":[3],"es":"History understates disruption; use forward-looking (Bayesian) probabilities based on commitments, attitudes and technology.","ed":"We come from a period in which externalities were largely unpriced, so models based on historical data underestimate future disruptions when they become internalised (\"ceteris non paribus\"). A Bayesian probability uses all available information - political commitments (Paris), changing attitudes, new technologies - and highlights both downside and upside risks. Forecasting methods (expert judgement, extrapolation, Delphi, prediction markets) all struggle with rare, high-impact events.","kt":"","src":"Bok s. 61 (2.4.2) · Bok s. 62 (2.4.2)"},{"id":"SB106","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"H","sc":"none","s":"According to the textbook, what characterises a late climate transition starting around 2030 (\"hard landing\"), compared with an early transition starting in 2020 (\"soft landing\")?","o":[["Sudden, belated policy forces harsher cuts and strands more assets.","Late adjustment produces back-loaded, abrupt policy and the steepest shocks."],["A late transition is gradual and gives firms more time to replace their physical capital stock.","That describes the early, orderly transition."],["A late transition is the scenario with the lowest risk for fossil fuel companies.","In the oil company example, the 2030 transition drives the fair value to zero."],["A late transition eliminates both physical and transition risks.","It typically combines higher physical risk with abrupt transition risk."]],"c":[0],"es":"Late transition = abrupt, back-loaded policy, harsher cuts and more stranded assets (\"hard landing\").","ed":"With an early transition (cuts starting 2020) the economy adjusts gradually, physical capital is replaced in time and technological progress keeps energy costs bearable - a soft landing. With a late transition (starting 2030), short-term political costs and coordination problems delay action until sudden, severe constraints are imposed - a hard landing. Figure 2.8 labels the early paths \"mostly transition risks\" and continued high emissions \"physical risks\". The NGFS scenarios on Lecture 3 use similar logic (orderly, disorderly, hot house world).","kt":"","src":"Bok s. 62 (2.4.3) · Bok s. 63 (Figure 2.8) · L3 slide 35-38"},{"id":"SB107","l":"L3","t":"Scenario analysis","f":"m","d":3,"p":"H","sc":"none","s":"The textbook values a fictive oil company under four scenarios, from business as usual (high value) to an immediate transition (value close to zero). What is the main insight of this exercise for investors?","o":[["Scenarios are unnecessary because one forecast is enough.","Uncertain internalisation is exactly why scenarios are used."],["Transition timing has no effect on valuation.","Timing drives the large value differences."],["Value depends heavily on transition timing, so the market price embeds implicit probabilities.","Comparing price with scenario values reveals the assumed probability of business as usual."],["Oil companies are worthless in all scenarios.","Under business as usual the value is high."]],"c":[2],"es":"Scenario values reveal how much transition risk the market prices in.","ed":"An analyst who thinks the market's implied probability of business as usual is too high would see the stock as overpriced. This links to the adaptive markets hypothesis: transition risk is priced gradually as more investors analyse it.","kt":"Implied probability: the scenario weights that make the expected value equal to the observed market price.","src":"Bok s. 66 (Table 2.4) · L3 slide 25"},{"id":"SB108","l":"L3","t":"Climate scenarios","f":"t","d":5,"p":"M","sc":"none","s":"True or false: In the oil company example (Table 2.4), under its probability structure with the remaining probability spread roughly equally across the three transition scenarios, a share price of about $126 implies that the market assigns about a 60% probability to business as usual; if an analyst believes this probability is too high, she would conclude that the stock is overpriced - which is consistent with the adaptive markets view that new risks such as carbon may not yet be fully priced.","o":[["True","Correct. Table 2.4 shows the $126 price implies ~60% business as usual; the textbook authors think that is an overestimation, hence overpricing. The adaptive markets hypothesis (Chapter 3) explains why new risks like carbon may not yet be priced."],["False","Incorrect. Table 2.4 shows the $126 price implies ~60% business as usual; the textbook authors think that is an overestimation, hence overpricing. The adaptive markets hypothesis (Chapter 3) explains why new risks like carbon may not yet be priced."]],"c":[0],"es":"True: the price implies ~60% BAU; doubting that implies overpricing, consistent with AMH.","ed":"Reverse-engineering market prices into implied scenario probabilities is a powerful way to see what the market believes. If the market puts too much weight on business as usual, carbon transition risk is underpriced. The efficient markets hypothesis would say prices already reflect all information; the adaptive markets hypothesis (Lo) argues that when few investor groups analyse a new risk, markets can be inefficient in pricing it, as Hong, Li and Xu find for climate risks.","kt":"","src":"Bok s. 66 (Table 2.4) · Bok s. 91 (3.4) · L5 slide 26"},{"id":"SB109","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"M","sc":"none","s":"Figure 2.9 (GHG emissions and gross value added by sector in the EU) supports which conclusion for a portfolio manager or loan officer?","o":[["Finance is the most carbon-intensive sector in the EU.","Finance has low direct emissions; its exposure is indirect through loans and investments."],["Carbon taxes would also hit transport, real estate and manufacturing.","These sectors are large emitters and represent a large share of value added."],["Only the electricity and gas supply sector would be materially affected by a carbon tax.","The figure shows significant emissions in several other sectors."],["Sectors with high value added never have high emissions.","Manufacturing and transport combine high value added and substantial emissions."]],"c":[1],"es":"Transition risk is broad: transport, real estate and manufacturing are also exposed.","ed":"A portfolio or loan book must be assessed scenario by scenario, and the impact of carbon pricing goes well beyond oil companies and utilities. Transport (cars, lorries, aircraft), real estate (heating and cooling) and fossil-dependent manufacturing are all exposed. Battiston et al. find combined equity exposures of financial firms to climate-policy-relevant sectors of 40-54%, and bank loans to housing alone of 281% of bank capital.","kt":"","src":"Bok s. 63 (2.4.3) · Bok s. 64 (Figure 2.9) · Bok s. 67 (2.4.4)"},{"id":"SB110","l":"L3","t":"Stress testing","f":"m","d":4,"p":"L","sc":"none","s":"According to Battiston et al. (2017), as summarised in the textbook, what is the main finding of their climate stress test of euro-area financial firms?","o":[["Climate policy would cause systemic collapse even if introduced early and within a stable framework.","They find no adverse systemic impact if policies are introduced early and stably."],["Debt holders absorb losses before equity holders in climate-relevant sectors.","Equity absorbs losses first; debt holdings are affected less."],["Banks are mainly exposed through equity holdings in oil companies, which exceed their regulatory capital.","Direct fossil fuel equity exposures are small."],["Direct fossil exposure is small; total climate-relevant exposure is large.","Direct fossil exposures are 3-12% of market cap, combined exposures 40-54%, with 30-40% amplification."]],"c":[3],"es":"Small direct fossil exposure, large combined climate-relevant exposure (40-54%), amplified 30-40% by second-round effects.","ed":"The network analysis shows direct equity exposure to fossil fuels of 3-12% of financial firms' market capitalisation, but 40-54% to all climate-policy-relevant sectors, with second-round (counterparty) effects adding 30-40%. Loans: fossil and utilities 11% of bank capital, energy-intensive 28%, transport 16%, housing 281%. Policies would create winners and losers but no systemic crisis if implemented early and within a stable framework. Box 2.4 discusses a \"brown penalising factor\" rather than a \"green supporting factor\" in bank capital rules.","kt":"","src":"Bok s. 67 (2.4.4) · Bok s. 68 (Box 2.4)"},{"id":"SB111","l":"L3","t":"Bank capital and climate","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Boot and Schoenmaker (2018) argue that a \"green supporting factor\" (lower capital requirements for green loans) is preferable to a \"brown penalising factor\", because green assets are proven to be extra safe.","o":[["True","Incorrect. They argue the opposite: recognising extra risk in brown assets does not make green assets extra safe, and a green factor would make banks ignore business risk; a brown penalising factor is better."],["False","Correct. They argue the opposite: recognising extra risk in brown assets does not make green assets extra safe, and a green factor would make banks ignore business risk; a brown penalising factor is better."]],"c":[1],"es":"False: they favour a brown penalising factor; green is not automatically safe.","ed":"Both sides agree climate risks are material and currently neglected in capital rules. A green supporting factor (proposed by the European Commission) would lower capital for green assets, but it is unclear which green technologies will win, so this weakens risk management. A brown penalising factor for fossil-intensive assets gives banks loss-absorbing capacity when the transition accelerates and discourages further brown lending, reducing systemic climate risk. Calibration should use scenario studies, not historical data.","kt":"","src":"Bok s. 68 (Box 2.4) · L11 slide 30-31"},{"id":"SB112","l":"L3","t":"Regulation","f":"m","d":3,"p":"M","sc":"short","s":"The Montreal Protocol (1987) on ozone-depleting substances is seen as highly successful, while climate agreements have struggled. Which difference best explains this?","o":[["Ozone substitutes were cheap and few producers were involved; CO2 is economy-wide.","Low abatement costs and few actors make coordination easier."],["Ozone depletion had no health effects, so nobody objected.","Ozone depletion raised skin cancer risk; that motivated action."],["Climate agreements have never had any binding element.","The EU ETS and Kyoto had binding elements; the issue is scale and cost."],["The Montreal Protocol relied only on voluntary corporate pledges.","It was a binding international treaty with phase-out schedules."]],"c":[0],"es":"Cheap substitutes + few producers = easy coordination; CO2 is everywhere and costly to cut.","ed":"Climate change is the ultimate tragedy of the commons (Lecture 13, Ostrom): many emitters, high costs and benefits spread over time and countries. This is why private coalitions, carbon pricing and finance-based pressure all play a role.","kt":"Free-rider problem: when each country benefits from others' cuts without cutting itself, global cooperation is hard.","src":"Bok s. 57 (2.4) · L3 slide 20"},{"id":"SB113","l":"L3","t":"Social externalities","f":"m","d":2,"p":"L","sc":"none","s":"According to the textbook, how have developed countries largely internalised social externalities since World War II?","o":[["Through voluntary corporate codes of conduct without any legislation.","The textbook stresses legislation, not purely voluntary codes."],["Through carbon taxes that also cover labour issues.","Carbon taxes address environmental, not labour, externalities."],["Through social legislation, e.g. on working hours and minimum wages.","Social legislation in developed countries is presented as a successful example of internalisation."],["By banning all international trade with developing countries.","No such ban is discussed."]],"c":[2],"es":"Social legislation (working hours, safety, equality, minimum wages) internalised many social externalities.","ed":"Developed countries internalised many social externalities through legislation, while many developing countries still lack such rules (child labour, underpayment). Taxes are also used socially: alcohol, tobacco and sugar-sweetened beverages; evidence suggests health taxes should raise prices by 20% or more to reduce consumption effectively.","kt":"","src":"Bok s. 49 (2.2.2) · Bok s. 50 (2.2.2)"},{"id":"SB114","l":"L3","t":"Externality case: Velsicol","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Lecture 3 case: chemical manufacturer Velsicol was sued for knowingly polluting water with cancer-causing pesticides. Which statement applies the lecture's framework correctly?","o":[["The social cost of the pollution can be read directly from Velsicol's historical income statements.","Externalities are by definition not in the firm's accounts; they must be estimated (e.g. health costs)."],["Internalisation has no financial consequences for shareholders because of limited liability.","Damages, clean-up and reputational losses reduce firm value, even if limited liability caps shareholder losses at their equity."],["The pollution is a negative production externality, which a lawsuit partly internalises by making the firm bear damages.","Litigation forces the polluter to bear (part of) the social cost of its production."],["Because the pollution is a consumption externality, consumers rather than Velsicol should bear the cost.","The harm arises from production, so it is a production externality."]],"c":[2],"es":"Pollution is a negative production externality; litigation internalises it, and its timing and size were uncertain ex ante.","ed":"The discussion questions move from identifying the externality (negative, production), to how it is internalised (lawsuit, regulation, media), to quantifying the social cost (health damage, water clean-up), to ex-ante uncertainty (policy, legal outcome, public attention) and finally to financial consequences (damages, clean-up costs, lower cash flows and higher risk, potentially stranded assets). Scenario analysis with probabilities is the tool for valuing such uncertain liabilities; Chapter 3 adds that limited liability and insurance can weaken deterrence. Also correct: Ex ante, Velsicol faced uncertainty about whether and when the externality would be internalised and how large the costs would be.","kt":"","src":"L3 slide 3-5 · L3 slide 16 · L3 slide 31 · Bok s. 81 (3.2.1)"},{"id":"SB115","l":"L3","t":"Air France-KLM case","f":"m","d":5,"p":"M","sc":"extended_course_case","s":"Lecture 3 ends with Air France-KLM and the effect of a carbon price on its value. Which approach is most consistent with the lecture and textbook for assessing this effect?","o":[["Rely only on the airline's historical earnings, since past carbon costs were low.","Historical data understate future internalisation (ceteris non paribus)."],["Assume the current EU ETS price stays constant forever and apply it in one forecast.","A single static forecast ignores policy and technology uncertainty."],["Value it under several carbon price scenarios and weight these by probabilities.","This combines internalisation through carbon pricing with scenario analysis and probability weighting."],["Ignore carbon prices because airlines between EU and non-EU countries have always been fully exempt.","Exemptions are a boundary problem that may change; ignoring the risk is not consistent with the lecture."]],"c":[2],"es":"Use carbon price scenarios, translate them into cash-flow effects, and weight by probabilities.","ed":"Airlines are carbon-intensive (transport is a major emitter in Figure 2.9). A carbon price raises operating costs and may reduce demand, and its level and timing are uncertain (policy uncertainty, boundary problems such as exemptions for flights to non-EU countries, technology such as sustainable fuels). The textbook's approach - scenarios, cash-flow and terminal-value effects, risk premium, probability weighting - is the right tool, as in the oil company example. The lecture also points to Air France-KLM's own decarbonisation trajectory.","kt":"","src":"L3 slide 39-42 · Bok s. 61 (Figure 2.7) · Bok s. 55 (2.3.2)"},{"id":"SB116","l":"L3","t":"Limits to internalisation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: In the Shell advertising case shown in Lecture 3, the UK Advertising Standards Authority approved the adverts because they accurately showed that low-carbon energy made up a significant share of Shell's energy products.","o":[["True","Incorrect. The ASA banned the adverts because they left out information on Shell's more polluting fossil fuel activities and wrongly gave the impression that low-carbon products were a significant proportion of its energy products."],["False","Correct. The ASA banned the adverts because they left out information on Shell's more polluting fossil fuel activities and wrongly gave the impression that low-carbon products were a significant proportion of its energy products."]],"c":[1],"es":"False: the ASA banned the adverts for giving a misleading impression of Shell's low-carbon share.","ed":"Greenwashing exploits information asymmetry: outsiders cannot easily verify a firm's claims, so the firm can look greener than it is. The Shell adverts (a TV advert, a Bristol poster and a YouTube ad in 2022) were banned for omitting the polluting side of the business. This is one of the three limitations to internalisation in Lecture 3 (with territoriality and political frictions), and it motivates mandatory, audited reporting (Lecture 7) and the PwC point that 94% of investors believe corporate reporting contains unsupported sustainability claims.","kt":"","src":"L3 slide 24-25 · PwC s. 30"},{"id":"SB117","l":"L3","t":"Integrated value approach","f":"m","d":1,"p":"M","sc":"none","s":"Which sequence matches the four steps of the integrated value methodology in the textbook?","o":[["Estimate the CAPM beta; compute the WACC; discount cash flows; compare with the share price.","This is a traditional DCF sequence without S and E."],["Screen out sin stocks; rank by ESG score; select the top quartile; rebalance annually.","This describes a screening strategy, not integrated value."],["Measure and monetise; sum to I; adapt the process; recalculate I.","These are the four bars in Figure 2.3."],["Identify stakeholders; prioritise by power and interest; engage; report.","This is a stakeholder analysis, not the integrated value method."]],"c":[2],"es":"Measure and monetise, sum to I, adapt the process, recalculate I*.","ed":"The methodology (KPMG True Value, True Price) measures, monetises and balances financial and non-financial values: (1) calculate F and quantify and monetise S and E; (2) internalise them and compute I = F + S + E; (3) adapt the production process to find a better combination; (4) calculate the optimised I*. It makes trade-offs visible but relies on assumptions and faces the pitfalls discussed in section 2.3.1.","kt":"","src":"Bok s. 50 (2.3) · L3 slide 32"},{"id":"TR06","l":"L3","t":"Types of externalities","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A chemical firm's factory leaks toxins into a river while making a product that households buy. Some students argue it is a consumption externality \"because without buyers there would be no production\". How does the lecturer classify it?","o":[["No externality, because the firm sells the product at a market price","The cost to people downstream is not in the price, so it is an externality."],["Negative production externality, because the harm stems from how the good is made","You classify by the root cause of the harm, which is the factory's production process."],["Negative consumption externality, because demand from households ultimately causes it","The lecturer rejects this: demand is not the source of the pollution."],["Positive production externality, because the product creates jobs in the area","Jobs are part of the market transaction, not an external effect."]],"c":[1],"es":"Classify by root cause: pollution from the factory = production externality.","ed":"For a production externality the supply curve shifts up when social costs are added (private cost below social cost). For consumption externalities, such as smoking (negative) or vaccines (positive), it is the demand curve that shifts.","kt":"","src":"Opptak L3 ca. 7 min · Opptak L3 ca. 19 min"},{"id":"TR07","l":"L3","t":"Types of externalities","f":"m","d":3,"p":"M","sc":"none","s":"Getting vaccinated also protects others by reducing the spread of a virus. In Lecture 3's diagrams, how do you find the socially optimal outcome?","o":[["No shift is needed, because vaccines are traded in a free market","The external benefit is not priced, so the market outcome is not optimal."],["Shift the demand curve up to the social benefit; optimal quantity is higher","Social benefit exceeds private benefit, so the free market under-consumes."],["Shift the supply curve up to the social cost; optimal quantity is lower","That is the case of a negative production externality like pollution."],["Shift the demand curve down to the social benefit; optimal quantity is lower","That is the smoking case (negative consumption externality)."]],"c":[1],"es":"Positive consumption externality: demand shifts up, too little is consumed.","ed":"Summary of the four cases: smoking (demand down), vaccines (demand up), pollution (supply up), R&D (supply down/right). In each case the triangle between the market and social optimum is the deadweight loss. Subsidies fit positive externalities; taxes, quotas or bans fit negative ones.","kt":"","src":"Opptak L3 ca. 20 min"},{"id":"TR08","l":"L3","t":"Innovation externalities","f":"m","d":3,"p":"H","sc":"none","s":"Why might a firm hold back on developing a cleaner production technology, even if society would gain from it?","o":[["Rivals can copy it and then win market share from it.","Both effects reduce the private return of the innovator below the social return."],["Innovation creates only negative externalities, so regulators forbid it.","R&D is the lecture's example of a POSITIVE production externality."],["Green R&D always has a negative net present value for society as a whole.","The point is that the SOCIAL return can be high while the private return is low."],["Patent law guarantees that rivals can never benefit from the innovation.","The lecture stresses spillovers happen especially when patent protection is weak."]],"c":[0],"es":"Spillovers + business stealing → private return < social return → underinvestment.","ed":"This is why R&D subsidies are a tool for internalising positive externalities. Tesla is the lecture's example of an innovator that triggered a whole industry: a positive externality from product market competition and innovation.","kt":"Business stealing effect: competitors adopting the new technology capture market share from the original innovator.","src":"Opptak L3 ca. 34 min"},{"id":"TR09","l":"L3","t":"Limitations to internalisation","f":"m","d":3,"p":"H","sc":"short","s":"Research cited in Lecture 3 finds that listed companies under disclosure pressure often sell their most polluting plants to private firms, which face few disclosure rules. Which limitation to internalising externalities does this show?","o":[["Consumers being unable to afford green products","Consumer budgets are not involved in this mechanism."],["A legislative ban that removes the polluting activity entirely","A ban would stop the pollution; here it continues under a new owner."],["Technology uncertainty: no cleaner process exists for these plants","The plants are sold, not abandoned because of missing technology."],["Information asymmetry: it looks greener, emissions continue","The plant keeps polluting; only the reported owner changes."]],"c":[3],"es":"Selling dirty assets to private owners hides, but does not cut, pollution.","ed":"The lecture lists three limitations: policy arbitrage (moving production to places with weaker rules, e.g. after California's cap-and-trade), greenwashing/information asymmetry (Shell's banned ad; selling dirty plants), and political uncertainty and lobbying. Investors should look at the real economy, not only reported portfolios.","kt":"","src":"Opptak L3 ca. 44 min · Opptak L3 ca. 47 min"},{"id":"TR10","l":"L3","t":"Internalisation through disclosure","f":"m","d":3,"p":"M","sc":"short","s":"Profits from many tin, tantalum, tungsten and gold (3TG) mines in the Democratic Republic of Congo funded armed groups. In 2012 the US SEC required listed firms to trace whether their supply chains used such minerals. What effect does the lecturer report?","o":[["Firms shifted sourcing away from high-risk suppliers","Disclosure made a hidden harm visible and changed sourcing behaviour."],["Mining in the region was banned by the SEC","The SEC regulates disclosure by US-listed firms, not mining in the DRC."],["Firms paid a Pigouvian tax per tonne of minerals bought","The rule was a disclosure requirement, not a tax."],["Nothing changed, because disclosure rules never affect firm behaviour","The lecturer reports a clear shift in sourcing."]],"c":[0],"es":"A disclosure rule made the externality visible and shifted sourcing.","ed":"Many buyers did not even know they were funding conflict. Mandatory disclosure reduced that information gap. The same supply chain logic underlies the EU Corporate Sustainability Due Diligence Directive and the Norwegian Transparency Act.","kt":"","src":"Opptak L3 ca. 40 min · Opptak L4 ca. 62 min"},{"id":"TR11","l":"L3","t":"Climate scenarios","f":"m","d":3,"p":"H","sc":"none","s":"The NGFS scenarios range from \"orderly\" (net zero by 2050) to a \"hot house world\" (only current policies). Which statement about risks in the hot house world is correct?","o":[["Physical risk is low and transition risk is high","This describes the orderly scenario with strong policy action."],["Both physical and transition risk are low","Some combination of risk is always present; you cannot avoid both."],["Neither risk applies, because policy stays unchanged","Unchanged policy leaves the full physical risk of warming."],["Physical risk is high and transition risk is low","Few new policies mean little transition risk, but the planet warms more."]],"c":[3],"es":"Hot house = high physical, low transition risk.","ed":"The lower the future temperature, the higher the transition risk firms face, and vice versa (Bank of England chart). Disorderly transitions combine late, sudden policy with some physical risk. Analysts use these scenarios in scenario analysis and stress testing.","kt":"Physical risk: damage from climate change itself; transition risk: costs from policy, technology and market changes on the way to low carbon.","src":"Opptak L3 ca. 59 min · Opptak L3 ca. 61 min"},{"id":"TR12","l":"L3","t":"Measuring internalisation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: In Lecture 3, stress testing means weighting several climate scenarios by their probabilities and combining the scenario DCF values into one expected valuation.","o":[["True","Incorrect. That describes scenario analysis. Stress testing asks whether the firm can survive the most extreme case (e.g. +5°C)."],["False","Correct. That describes scenario analysis. Stress testing asks whether the firm can survive the most extreme case (e.g. +5°C)."]],"c":[1],"es":"False: probability-weighting = scenario analysis; worst case survival = stress test.","ed":"Scenario analysis steps: identify the key uncertainty, elaborate scenarios (trends, external actions, internal responses), present them, and weigh their probabilities. Stress testing then checks survival and losses in the most drastic scenario. Insurers and banks use both.","kt":"","src":"Opptak L3 ca. 56 min · Opptak L3 ca. 59 min"},{"id":"SB118","l":"L4","t":"Shareholder theory","f":"m","d":1,"p":"H","sc":"none","s":"Which statement summarises Milton Friedman's (1970) view as presented in Lecture 4?","o":[["Companies should maximise shareholder welfare, which may differ from market value when shareholders are prosocial.","That is Hart and Zingales' refinement of Friedman."],["Firms should set the rules of the game for society because governments are inefficient.","Friedman argues government sets the rules of the game; firms operate within them."],["Managers should balance the interests of employees, creditors, customers, suppliers and the community equally.","That is the stakeholder view (Freeman)."],["The social responsibility of business is to increase its profits, so managers should maximise shareholder value.","This is the \"old view\" (shareholder theory) on slide 5."]],"c":[3],"es":"Friedman: the social responsibility of business is to increase its profits (within the rules of the game).","ed":"In Friedman's view, managers are agents of the owners and should make as much money as possible while conforming to the basic rules of society, embodied in law and ethical custom. Social and environmental goals are the task of individuals and government. Hart and Zingales accept shareholder welfare as the right objective but argue it is too narrow to equate it with market value; Freeman's stakeholder theory goes further and says firms should serve all stakeholders.","kt":"","src":"L4 slide 5 · Hart & Zingales s. 2 · Bok s. 20 (1.4)"},{"id":"SB119","l":"L4","t":"Stakeholder theory","f":"t","d":3,"p":"H","sc":"short","s":"True or false: In 2021, Danone's CEO Emmanuel Faber, who had made Danone the first listed French \"entreprise à mission\", was ousted after activist investors complained about weak returns. This shows that a stated stakeholder purpose removes the need to deliver financial performance.","o":[["True","Incorrect. The case shows the opposite: shareholders still demand competitive returns, and purpose without financial delivery is vulnerable."],["False","Correct. The case shows the opposite: shareholders still demand competitive returns, and purpose without financial delivery is vulnerable."]],"c":[1],"es":"False: stakeholder purpose still needs financial viability.","ed":"The Danone case illustrates the tension in Lecture 4: integrated value requires F as well as S and E. Edmans' \"grow the pie\" view argues purpose should create value for both society and shareholders; when returns lag peers, activists may still win.","kt":"Stakeholder theory (Freeman): firms should create value for all stakeholders (customers, employees, suppliers, communities, financiers), not only shareholders.","src":"L4 slide 9 · L4 slide 20"},{"id":"SB120","l":"L4","t":"Business Roundtable statement","f":"m","d":2,"p":"H","sc":"none","s":"What did the Business Roundtable's statement on the purpose of a corporation, signed by about 200 US CEOs, represent according to Lecture 4?","o":[["A shift from shareholder primacy towards long-term value for all stakeholders.","The quotes on slide 9 stress long-term value for investors, employees, communities, suppliers and customers."],["A pledge by CEOs to stop paying dividends until climate targets are met.","The statement contains no such pledge."],["A reaffirmation of Friedman's view that firms should only maximise profits.","The statement was presented as moving away from that view."],["A legally binding change to Delaware corporate law requiring directors to serve stakeholders.","The statement is voluntary; Delaware law still frames directors' duties towards shareholders."]],"c":[0],"es":"The statement signalled a move from shareholder primacy to long-term value for all stakeholders.","ed":"In 2019 roughly 200 CEOs (including Apple, Amazon, JPMorgan, BlackRock) signed a statement that corporations should deliver value to customers, employees, suppliers, communities and shareholders. Lecture 4 shows CEO quotes supporting it (long-term value, investing in workers and communities) and then a wave of criticism: possible hypocrisy (e.g. signatories financing fossil fuels), agency-cost concerns (Jensen, Mehrotra and Morck, Bebchuk and Tallarita) and legal objections (Delaware fiduciary duties).","kt":"","src":"L4 slide 6-11 · L4 slide 14-16"},{"id":"SB121","l":"L4","t":"Criticism of stakeholder theory","f":"m","d":2,"p":"H","sc":"none","s":"What is Jensen's (2002) main criticism of stakeholder theory?","o":[["It makes firms too focused on short-term share prices.","Short-termism is a separate critique of shareholder value, not Jensen's point about stakeholder theory."],["It reduces agency costs so much that boards become unnecessary.","Jensen argues it increases agency costs."],["It forces managers to ignore shareholders entirely, which is illegal under all corporate laws.","Jensen's point is about accountability and measurability, not illegality."],["It lets managers set their own vague objectives, raising agency costs.","Without a single measurable objective, managers become unaccountable and can run firms in their own interests."]],"c":[3],"es":"Stakeholder theory gives managers a vague objective, making them unaccountable and increasing agency costs.","ed":"Jensen argues that managers cannot be held accountable when they must optimise several objectives at once, because performance becomes hard to measure; stakeholder theory thus lets them design their own objective function. He proposes \"enlightened value maximisation\": maximise long-run firm value while catering to stakeholders as a means to that end. Mehrotra and Morck make a similar point: shareholder value is a bright line, stakeholder welfare an ill-defined charge that widens room for private benefits.","kt":"","src":"L4 slide 20 · Bok s. 81 (3.2.2)"},{"id":"SB122","l":"L4","t":"Criticism of stakeholder theory","f":"m","d":3,"p":"H","sc":"none","s":"According to Bebchuk and Tallarita (2020), as summarised in Lecture 4, which criticism applies to \"stakeholderists\"?","o":[["They provide no method for aggregating or balancing stakeholders' interests when they conflict.","Third point on slide 21."],["They overstate trade-offs, when in fact stakeholder and shareholder interests never conflict.","The critique is the opposite: stakeholderists overlook the ubiquity of trade-offs."],["They insist that firms must always pay out all profits as dividends.","Not part of the critique."],["They require regulators to set each firm's stakeholder weights by law.","The critique is that weights are left to managers' discretion."]],"c":[0],"es":"Stakeholderists leave stakeholder definition and balancing to managers and overlook trade-offs, increasing agency problems.","ed":"Bebchuk and Tallarita argue stakeholderism (1) avoids defining who the stakeholders are, (2) overlooks how common trade-offs between stakeholders and long-term shareholder value are, and (3) offers no method for balancing them. All three leave matters to corporate leaders' discretion, insulating management from shareholders, reducing accountability and potentially harming performance - more agency problems. Also correct: They avoid determining which groups count as stakeholders, leaving it to the discretion of corporate leaders.","kt":"","src":"L4 slide 20-21"},{"id":"SB123","l":"L4","t":"Criticism of stakeholder theory","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The Harvard Law School Forum analysis in Lecture 4 argues that the Business Roundtable statement is unnecessary, because under the business judgement rule directors can already pursue what the statement intends without changing the principles under which decisions are made.","o":[["True","Correct. Slides 24-25: directors' decisions are protected by the business judgement rule, so they can accomplish what the statement intends \"unburdened by the issues embedded in the Statement\"."],["False","Incorrect. Slides 24-25: directors' decisions are protected by the business judgement rule, so they can accomplish what the statement intends \"unburdened by the issues embedded in the Statement\"."]],"c":[0],"es":"True: the analysis calls the statement legally incorrect and unnecessary given the business judgement rule.","ed":"The analysis makes two points. In Delaware, directors have a fiduciary duty to act in the best interests of the shareholders, so stating that the corporation will further other constituencies is \"legally incorrect\". It is also \"unnecessary\": the business judgement rule protects directors' decisions as long as they discharge their duties of care and loyalty, so they can already consider stakeholders. Changing principles would cause confusion. The textbook adds that in practice the difference between shareholder and stakeholder models may matter less than in theory.","kt":"","src":"L4 slide 23-25 · Bok s. 87 (3.3.2)"},{"id":"SB124","l":"L4","t":"Corporate governance models","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A US private equity firm buys a Norwegian company with 300 employees and plans to make all board decisions with only owner-appointed directors. What should it expect?","o":[["Norwegian law bans all foreign owners from the board.","Foreign ownership and board seats are allowed."],["Employees can take over the company if they disagree.","Employee rights concern board representation, not control."],["Nothing; Norway follows a pure shareholder model like the US.","Norway has stakeholder elements such as employee board seats."],["Employees can demand board representatives under Norwegian company law.","Norway gives employees the right to elect board members above certain size thresholds."]],"c":[3],"es":"Norwegian law gives employees board seats in larger companies.","ed":"Norway, like Germany (co-determination), embeds stakeholder voice in governance, unlike the US and UK shareholder model. This affects how buyers can restructure and links to Lecture 13's point that integrated thinking is easier in stakeholder-oriented regions.","kt":"Stakeholder governance model: governance where groups beyond shareholders (e.g. employees) have formal influence, as in Norway and Germany.","src":"L4 slide 16 · Bok s. 362 (12.3.1)"},{"id":"SB125","l":"L4","t":"Shareholder vs stakeholder","f":"m","d":3,"p":"M","sc":"short","s":"In 2022 Patagonia's founder transferred ownership to a trust (voting shares) and a non-profit that receives profits not reinvested, to fight climate change. In Lecture 4 terms, what does this structure achieve?","o":[["It removes the need for the firm to be profitable.","Profits are needed to fund the non-profit's work."],["It locks in purpose by separating control from profit-seeking shareholders.","The trust protects the mission; profits fund environmental goals."],["It turns Patagonia into a state-owned company.","Ownership is private (trust and non-profit)."],["It maximises shareholder value for outside investors.","There are no outside profit-seeking shareholders."]],"c":[1],"es":"Trust + non-profit ownership protects purpose; profits serve the mission.","ed":"This contrasts with Friedman's view and with Danone's fate. Industrial foundations (e.g. Novo Nordisk Foundation in Denmark) are a similar, more common model. The trade-off: less access to equity capital and less market discipline.","kt":"Purpose: a company's reason for existing beyond profit; ownership structures (foundations, trusts) can protect it.","src":"L4 slide 20 · Hart & Zingales s. 8"},{"id":"SB126","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":2,"p":"H","sc":"none","s":"What is the central claim of Hart and Zingales (2017)?","o":[["Firms should maximise shareholder welfare, which can differ from market value.","This is the abstract's core argument."],["Firms should always maximise market value because shareholders can undo any externality themselves.","Hart and Zingales argue shareholders often cannot undo externalities that are non-separable from production."],["Companies should leave all social issues to government, which regulates them efficiently.","They are sceptical of the efficiency of the political process."],["Managers should maximise the welfare of all stakeholders equally, regardless of shareholders' views.","They keep shareholder welfare as the objective; it is not a general stakeholder theory."]],"c":[0],"es":"Prosocial shareholders + non-separable externalities = maximise shareholder welfare, not market value.","ed":"Shareholders are ordinary people who care about money but also about ethical and social issues (they buy electric cars, fair trade coffee). If a consumer would spend $100 to reduce pollution by $120, why not want the companies she owns to do the same? When profit and damage are technologically inseparable (e.g. Walmart selling high-capacity magazines), returning profits to shareholders to spend on gun control is less efficient than not causing the harm. So firms (and asset managers) should pursue policies consistent with investors' preferences, for example by shareholder votes on corporate policy.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 2-3 · L4 slide 30-31"},{"id":"SB127","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":3,"p":"H","sc":"none","s":"According to Hart and Zingales, in which case is Friedman's argument (firms make money, individuals handle ethics) correct?","o":[["When the externality is inextricably linked to production technology, as with an oil drilling project.","Non-separable activities are exactly where Friedman's conclusion fails."],["Only when the government has already banned the harmful activity.","That is not their condition; a ban would make the issue moot."],["When the social activity is separable from money-making, as with charitable giving by companies.","For separable activities like charity, shareholders can do it themselves at least as efficiently."],["Whenever shareholders have prosocial preferences, regardless of separability.","Prosocial preferences matter for non-separable activities, not for separable ones like charity."]],"c":[2],"es":"Friedman is right for separable activities (e.g. charity); wrong for non-separable externalities.","ed":"Friedman's argument requires that shareholders could \"undo\" what the company does with a reverse project of their own, which works for charity (the firm could pay out the money and let shareholders donate) but not for externalities tied to production technology. The reverse of an oil-drilling project rarely exists. Hart and Zingales therefore focus on non-separable activities, where the firm creates both profit and damage, and individuals cannot costlessly undo it.","kt":"","src":"Hart & Zingales s. 3-4 · L4 slide 31"},{"id":"SB128","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Hart and Zingales accept Friedman's view that externalities should be left entirely to government, because the political process is efficient and regulation can specify any social goal.","o":[["True","Incorrect. They are not sanguine about the efficiency of the political process, note that some goals (e.g. treating workers with dignity) are hard to regulate, and that political change can be hard (e.g. US court rulings on guns), so corporate-level action is a reasonable substitute."],["False","Correct. They are not sanguine about the efficiency of the political process, note that some goals (e.g. treating workers with dignity) are hard to regulate, and that political change can be hard (e.g. US court rulings on guns), so corporate-level action is a reasonable substitute."]],"c":[1],"es":"False: they doubt government efficiency and see corporate action as a substitute where politics fails.","ed":"Friedman's second argument is that government should handle externalities. Hart and Zingales reply that the political process is often inefficient, that some goals are hard to write into regulation, and that some political change is blocked (e.g. constitutional rights to own guns and to fund campaigns in the US). Shareholder action, such as Trinity Church's proposal at Walmart on products that endanger public safety, can then substitute. This is consistent with the textbook's points on government failure and insufficient regulation in Chapter 2.","kt":"","src":"Hart & Zingales s. 4 · Bok s. 44 (2.1.1)"},{"id":"SB129","l":"L4","t":"Shareholder welfare","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A firm can choose a clean production method that is slightly less profitable. Under Hart and Zingales' shareholder welfare view, when should the firm choose it?","o":[["Never, because only market value matters.","That is the market-value view they criticise."],["Always, regardless of what shareholders want.","The model depends on shareholders' preferences."],["When shareholders' concern for the damage outweighs the profit they give up.","Firms should maximise shareholder welfare, which includes social preferences."],["Only if the government requires it.","Their point is that firms should act on shareholders' preferences even without regulation."]],"c":[2],"es":"Clean if shareholders' social concern exceeds the profit cost.","ed":"Hart and Zingales argue that when profits and harm are not separable (the firm can avoid harm more cheaply than shareholders can undo it), firms should ask shareholders. This supports shareholder votes on ESG issues.","kt":"Shareholder welfare maximisation: firms maximise what shareholders care about, including non-financial (social) preferences, not only market value.","src":"Hart & Zingales s. 8 · L4 slide 12"},{"id":"SB130","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":4,"p":"M","sc":"none","s":"Hart and Zingales describe an \"amoral drift\". What mechanism drives it?","o":[["Non-pivotal prosocial shareholders tender to a bidder who then chooses the dirty action.","Tendering is a dominant strategy even for prosocial shareholders, so the market for corporate control pushes clean firms towards dirty."],["Regulators slowly relax environmental laws under lobbying pressure.","Lobbying is a different mechanism (Lecture 3)."],["Managers gradually lose their moral values because of long working hours and pressure from quarterly targets.","The drift is a collective action problem in takeovers, not personal moral decay."],["Prosocial shareholders sell to green investors, pushing up the prices of clean firms.","The drift pushes firms towards dirty, not clean."]],"c":[0],"es":"Non-pivotal prosocial shareholders tender to a profit-maximising bidder, so the firm drifts to the dirty action.","ed":"If a clean firm is worth p_clean, a profit-seeking bidder can offer a price between p_clean and p_dirty. Each small shareholder is almost never pivotal, so even a prosocial one does not feel responsible and tenders. Collectively they accept an outcome they would have voted against: the \"amoral drift\". Hart and Zingales note it is weaker today (poison pills force a vote, Delaware limits coercive two-tier offers) but may persist if boards and asset managers believe their fiduciary duty is to maximise value. To lock in \"clean\", a founder can use a staggered board or dual-class shares.","kt":"","src":"Hart & Zingales s. 10-11 · Hart & Zingales s. 13-14 · Bok s. 86 (Box 3.2)"},{"id":"SB131","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":4,"p":"M","sc":"none","s":"True or false: In Hart and Zingales' model, a prosocial investor may vote for a clean action in a company, yet happily hold shares in a dirty company at full price, because she only puts weight on social surplus for decisions she feels responsible for.","o":[["True","Correct. The model assumes individuals weigh social surplus only when they feel responsible (e.g. when voting as if pivotal); merely holding shares in a firm where the decision has already been made does not trigger this."],["False","Incorrect. The model assumes individuals weigh social surplus only when they feel responsible (e.g. when voting as if pivotal); merely holding shares in a firm where the decision has already been made does not trigger this."]],"c":[0],"es":"True: responsibility, not ownership as such, triggers prosocial weighting in their model.","ed":"Unlike \"sin-averse\" models (e.g. Heinkel, Kraus and Zechner), in which prosocial investors discount dirty shares, Hart and Zingales assume people care about doing the right thing only when responsible for the action. This explains why many prosocial investors hold tobacco or gun stocks, and why voting rather than buying or selling is the channel through which prosocial preferences can shape corporate policy. It also implies that divestment alone may not change firm behaviour.","kt":"","src":"Hart & Zingales s. 4-5 · Hart & Zingales s. 7-8"},{"id":"SB132","l":"L4","t":"Grow the pie","f":"m","d":2,"p":"H","sc":"none","s":"Which statement reflects Alex Edmans' \"grow the pie\" view as presented in Lecture 4?","o":[["Shareholders and stakeholders are always in a zero-sum conflict, so firms must choose one group.","That is the pie-splitting mentality Edmans rejects."],["Firms should maximise the welfare of shareholders by letting them vote on every decision.","Voting on corporate policy is Hart and Zingales' proposal."],["Purpose is irrelevant for value creation and should be left to charities.","For Edmans, purpose is central and defined by how the world is better off."],["Firms can deliver purpose and profit by enlarging total value, not splitting it.","Edmans contrasts the pie-splitting mentality with pie-growing, where purpose and profit go together."]],"c":[3],"es":"Edmans: grow the pie rather than split it - purpose and profit can go together.","ed":"A pie-splitting mentality sees value as fixed, so more for stakeholders means less for shareholders. Edmans argues great companies \"grow the pie\", creating value for society and thereby also profit. Purpose answers \"how is the world a better place by your company being here?\". The view is close to the textbook's long-term value creation (LTVC) and to Jensen's enlightened value maximisation, but stresses purpose explicitly.","kt":"","src":"L4 slide 30-31"},{"id":"SB133","l":"L4","t":"Purpose of the firm","f":"m","d":4,"p":"H","sc":"none","s":"Lecture 4 contrasts Edmans (\"grow the pie\") with Hart and Zingales (\"maximise shareholder welfare\"). Which statement is accurate?","o":[["Both frameworks reject any role for shareholders' preferences in corporate decisions.","Hart and Zingales explicitly want firms to consider shareholders' preferences."],["Both frameworks are identical to Friedman's 1970 argument.","Both depart from Friedman in different ways."],["Edmans focuses on enlarging total value so that purpose and profit reinforce each other.","Pie-growing versus pie-splitting is the core of Edmans' view."],["Hart and Zingales argue that firms should maximise market value even when shareholders are prosocial.","They argue the opposite: maximise welfare, which differs from market value."]],"c":[2],"es":"HZ: non-separability and prosocial shareholders; Edmans: grow the pie so purpose and profit coexist.","ed":"Both reject a narrow profit focus, but differently. Hart and Zingales keep shareholders at the centre and widen their objective from wealth to welfare, implemented by shareholder voting. Edmans emphasises value creation for society through purpose, arguing that trade-offs are often smaller than assumed when firms grow the pie. Lecture 4's synthesis (slide 32): sustainable finance analyses decisions from the perspective of shareholders, other stakeholders and ethics; sometimes these reinforce each other, but often they involve trade-offs. Also correct: Hart and Zingales stress that social implications are often non-separable from business decisions and that shareholders care about more than money.","kt":"","src":"L4 slide 30-32 · Hart & Zingales s. 1"},{"id":"SB134","l":"L4","t":"Shareholder vs stakeholder","f":"m","d":4,"p":"H","sc":"short","s":"In 2021, hedge fund Engine No. 1, holding about 0.02% of ExxonMobil, won three board seats by arguing Exxon's fossil-heavy strategy destroyed long-term value; BlackRock, Vanguard and State Street voted for it. Which interpretation fits Lecture 4 best?","o":[["Shareholders used governance to push long-term value and climate risk together.","The case ties shareholder value to climate strategy, close to Hart and Zingales."],["It proves that only majority owners can influence boards.","A tiny stake won with support from large passive owners."],["It shows passive investors never vote against management.","The three largest index funds supported the dissident."],["It shows climate issues are irrelevant to financial value.","The campaign was framed as protecting long-term value."]],"c":[0],"es":"Governance + coalition of large investors pushed climate-related long-term value.","ed":"The case shows the convergence of value and values (Starks) and the power of passive investors' voice (Lecture 8, slide 71). It also links to coalitions (Lecture 13): a small activist succeeded because large owners joined.","kt":"Shareholder welfare (Hart and Zingales): firms should maximise shareholders' welfare, which can include their social preferences, not just market value.","src":"L4 slide 12 · Hart & Zingales s. 2 · L8 slide 71"},{"id":"SB135","l":"L4","t":"Klarna AI case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Lecture 4 case: Klarna's AI assistant did the work of about 700 agents, the workforce shrank from about 5,000 towards 3,000 through attrition and a hiring freeze, and in 2025 the CEO admitted \"we went too far\" and began rehiring human agents. What lesson best fits the lecture's framework?","o":[["The case shows that employee interests are irrelevant once a firm is publicly listed.","Listing does not make employee or customer effects irrelevant to value."],["The case proves that replacing workers with AI is always unethical regardless of quality.","The lecture poses this as an open question with trade-offs, not a universal verdict."],["Short-term cost savings hurt customers, so stakeholder effects mattered for value too.","The CEO admitted cost was weighted too heavily over quality; neglecting customers backfired."],["It shows that cost-cutting can never affect customer satisfaction or revenue.","The rehiring decision shows that quality and customers suffered."]],"c":[2],"es":"Over-weighting cost over quality hurt customers; ignoring stakeholders can destroy long-term value.","ed":"The discussion question is whether a company should replace workers with AI if the AI does the job just as well. Klarna's experience shows the premise may fail: quality fell, customers needed to reach a person, and the firm reversed course. From Jensen's or Edmans' perspective, treating stakeholders well can be instrumental to long-run value; from a stakeholder perspective, employees' interests matter in their own right. Either way, the narrow short-term cost focus was mistaken.","kt":"","src":"L4 slide 28-29 · L4 slide 31"},{"id":"SB136","l":"L4","t":"Stakeholders: employees","f":"m","d":3,"p":"M","sc":"none","s":"Lecture 4 presents an experiment in which job applicants bid for the same job at a firm with or without a CSR treatment. What was the finding?","o":[["Applicants demanded higher pay at the socially responsible firm because CSR signals lower profits.","The bids were lower, not higher, in the CSR treatment."],["Applicants were willing to accept lower pay for the same job at a socially responsible firm.","The mean bid was significantly higher in the control group than in the CSR treatment group."],["Applicants refused to apply to the CSR firm at any wage.","Applicants bid for both, with lower bids at the CSR firm."],["CSR information had no effect on the distribution of bids.","The distributions of the control and treatment groups were statistically different."]],"c":[1],"es":"Workers accept lower wages to work for socially responsible firms.","ed":"The result shows a channel through which CSR can create value: firms with good social performance may attract and retain talent at lower wage cost (a \"win-win\" in Bénabou and Tirole's terms). It also links to the textbook's point that intangibles such as human capital and employee satisfaction matter for value (Lecture 6) and to Starks' notion that employees, like investors, have values-based preferences.","kt":"","src":"L4 slide 34-37 · L6 slide 23"},{"id":"SB137","l":"L4","t":"Stakeholders: supply chains","f":"m","d":2,"p":"M","sc":"extended_course_case","s":"According to Lecture 4, why did Nestlé stop buying Brazilian-produced soybeans from Cargill?","o":[["Brazilian law banned the export of soybeans to Switzerland.","No such ban is mentioned."],["Cargill's soybeans had become more expensive than those of other suppliers in the region.","The reason given is traceability and deforestation risk, not price."],["The soy could not be traced to plantations, raising deforestation concerns.","Nestlé aims to eliminate deforestation from its supply chain within three years."],["Nestlé wanted to stop using soy in all of its products for health reasons.","The decision relates to deforestation, not health."]],"c":[2],"es":"Lack of traceability raised deforestation concerns, conflicting with Nestlé's zero-deforestation goal.","ed":"Companies increasingly internalise supply chain externalities (deforestation, human rights) because they create reputational, regulatory and operational risks. Traceability is a precondition. The EU Corporate Sustainability Due Diligence Directive (slide 44) pushes in the same direction, and Lecture 5 discusses the cocoa child labour lawsuit against Nestlé and Cargill as a governance case.","kt":"","src":"L4 slide 38 · L4 slide 44 · L5 slide 3-5"},{"id":"SB138","l":"L4","t":"Stakeholders: supply chains","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Bisetti et al. (2024), shown in Lecture 4, find that after environmental and social incidents at foreign suppliers, US firms cut their imports from those suppliers by around 30%.","o":[["True","Correct. Slide 41 reports that US firms cut imports by around 30% after E&S incidents at foreign suppliers."],["False","Incorrect. Slide 41 reports that US firms cut imports by around 30% after E&S incidents at foreign suppliers."]],"c":[0],"es":"True: US firms cut imports from suppliers with E&S incidents by about 30%.","ed":"Firms treat suppliers' E&S incidents as a risk to their own reputation and operations and respond by reducing purchases. Slide 40 shows the reverse channel too: when a supplier's exposure to heat increases, its performance suffers and so does its customers' operating income. Supply chains are therefore a key stakeholder channel through which externalities and climate risks propagate.","kt":"","src":"L4 slide 40-41"},{"id":"SB139","l":"L4","t":"Stakeholders: supply chains","f":"m","d":3,"p":"M","sc":"none","s":"What does the evidence on Lecture 4, slide 40 show about heat exposure in supply chains?","o":[["Suppliers' performance suffers, and their customers' operating income drops too.","Physical climate risk at suppliers propagates downstream to customers."],["Heat exposure has no measurable effect on firm performance.","The slide shows firm performance suffers."],["Customers benefit from suppliers' heat exposure because input prices fall.","The evidence shows customers are harmed, not helped."],["Heat exposure only affects agricultural firms and has no measurable effect on their customers.","The slide shows customers' operating income also drops."]],"c":[0],"es":"Heat hurts suppliers and propagates to their customers' operating income.","ed":"Physical climate risk is not confined to directly exposed firms; it spreads through production networks. This matters for stakeholder analysis (suppliers are stakeholders whose problems become yours), for valuation (hidden exposures) and for insurers and banks (Lectures 11-12). The Fondsfinans guest lecture makes the same point with Darling Ingredients, where heat lowers feedstock yields and EBITDA.","kt":"","src":"L4 slide 40 · Fondsfinans s. 38"},{"id":"SB140","l":"L4","t":"Human rights due diligence","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A Norwegian sportswear company sources from suppliers in a region with credible reports of forced labour. Under the Norwegian Transparency Act (2022) and the logic of the EU CSDDD, what is expected?","o":[["Immediately stop all purchases from the entire country.","Due diligence is risk-based; exiting is one option, not automatic."],["Map and assess supply-chain risks, act on them and report publicly.","Due diligence means identifying, preventing and accounting for adverse impacts."],["Only disclose the suppliers' credit ratings.","The duty concerns human rights, not credit risk."],["Nothing, as long as the suppliers are foreign companies.","Due diligence covers the supply chain, including foreign suppliers."]],"c":[1],"es":"Assess, act on and report supply-chain human rights risks.","ed":"H&M faced a boycott in China in 2021 after stating concerns about Xinjiang cotton, showing that due diligence can involve hard trade-offs. Such laws turn stakeholder harm into legal and financial risk.","kt":"Human rights due diligence: identify, prevent, mitigate and account for adverse human rights impacts in own operations and value chains (UN Guiding Principles).","src":"L4 slide 30 · L2 slide 20"},{"id":"SB141","l":"L4","t":"Corporate objectives","f":"m","d":3,"p":"M","sc":"short","s":"Surveys of executives (e.g. Graham, 2022) find European executives more inclined than US executives to see stakeholder and ESG goals as part of the firm's objective. Which explanation fits the course best?","o":[["US firms face no ESG risks","US firms face the same physical and transition risks."],["Europe's stakeholder-oriented governance vs the US shareholder model","Institutions (co-determination, stakeholder codes) shape executives' objectives."],["European firms are legally banned from maximising profit","No such ban exists."],["Executives' views have no link to governance models","Governance models and culture strongly shape views."]],"c":[1],"es":"Governance institutions explain the regional gap.","ed":"The same pattern appears in chapter 12: integrated thinking is easier in less materialistic, stakeholder-oriented regions (Europe, Asia-Pacific) than in North America. Remember the direction and the reason, not the survey percentages.","kt":"Shareholder model vs stakeholder model: corporate governance focused on owners' value vs balancing the interests of several stakeholder groups.","src":"L4 slide 26-27 · Starks s. 1840 · Bok s. 362 (12.3.1)"},{"id":"SB142","l":"L4","t":"Refined shareholder value","f":"m","d":3,"p":"H","sc":"none","s":"According to the textbook, what do Mehrotra and Morck (2017) conclude about Jensen's \"enlightened value maximisation\" (refined shareholder value)?","o":[["It is flawed, but perhaps the least bad option since it has one measurable goal.","They criticise it but see it as the least bad alternative."],["It is identical to SF 3.0 because it puts social value first.","Refined shareholder value is classified as SF 1.0."],["It should be replaced by maximising the welfare of each stakeholder group separately.","They see multiple objectives as unmeasurable and prone to agency problems."],["It perfectly resolves all conflicts between shareholders and stakeholders.","They argue it fails to resolve many clear conflicts."]],"c":[0],"es":"Flawed but the least bad option: a single measurable objective that recognises the value of good stakeholder relations.","ed":"Jensen argues firm value is best maximised by catering to all stakeholders (stakeholders as means). Mehrotra and Morck show this fails where interests clearly conflict and ignores externalities on distant stakeholders such as the environment (Hart and Zingales' point). Still, unlike stakeholder theory, it has a single roughly measurable objective and recognises that good stakeholder relations ease contracting and create surplus - hence \"least bad\". The textbook classifies it as SF 1.0.","kt":"","src":"Bok s. 81 (3.2.2) · Bok s. 82 (3.2.2) · L5 slide 27"},{"id":"SB143","l":"L4","t":"Shareholder model challenges","f":"m","d":3,"p":"H","sc":"none","s":"The textbook (following Mehrotra and Morck) lists three challenges to the shareholder model. Which is among them?","o":[["Limited liability makes shareholders responsible for all environmental damages.","Limited liability caps shareholders' losses at the value of their shares."],["Business ethics: a narrow focus on shareholder value can create scope for morally dubious decisions.","Listed as the third challenge, the \"final line of defence\"."],["The shareholder model leads to excessive long-term investment.","The usual concern is short-termism, not excessive long-term investment."],["Shareholders are fixed claimants who are paid before creditors and employees.","Shareholders are residual claimants, paid after all contractual claims."]],"c":[1],"es":"Contractual issues (incomplete contracts), public policy (externalities not fully covered) and business ethics.",
