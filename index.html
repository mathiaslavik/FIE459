l norms. This position is:","o":[["Ethical relativism","Relativism holds that morality is context-dependent and subjective, so outside judgement is not possible."],["Ethical absolutism","Absolutism claims eternal, universally applicable principles, so bribery would be judged the same everywhere."],["Ethical pluralism","Pluralism accepts several legitimate perspectives but does not hold that anything goes; it neither treats all views as equal nor favours one."],["Utilitarianism","Utilitarianism is an absolutist, consequentialist theory that would weigh the consequences, not defer to local norms."]],"c":[0],"es":"Saying morality depends wholly on local context is ethical relativism.","ed":"Absolutism = universal moral principles that apply regardless of circumstances; relativism = morality is context-dependent and subjective, often based on culture; pluralism (Crane et al.'s own position) = recognises that incompatible values can be equally legitimate, but neither puts all perspectives on an equal footing nor favours one. Western modernist theories (egoism, utilitarianism, duty, rights and justice) are mainly absolutist in intention; the alternative theories (virtue, care, discourse, postmodern) lean relativist.","kt":"","src":"L2 slide 7 · Crane s. 4 · Crane s. 3"},{"id":"SB038","l":"L2","t":"Ethical theories","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A mining firm can open a mine that creates 2,000 jobs, but it must move a local community against its will. Which statement applies the theories correctly?","o":[["Kant objects to using the community merely as a means","Duties and rights cannot be overridden by aggregate benefits."],["Utilitarianism rejects any project that harms someone","Utilitarianism accepts harms if total benefits are larger."],["Ethical egoism puts the community first","Egoism focuses on the decision-maker's own long-term self-interest."],["Deontology approves it if profits are high","Deontology does not trade duties against profits."]],"c":[0],"es":"Utilitarianism weighs net consequences; rights/Kantian views protect individuals from being used as means.","ed":"Real cases like Rio Tinto's 2020 destruction of the Juukan Gorge rock shelters show how rights violations can also become financially material: investor pressure forced the CEO to resign. Also true, but not offered as an option here: A utilitarian would weigh total benefits (jobs, income) against total harms to all affected.","kt":"Consequentialist theories (egoism, utilitarianism) judge outcomes; non-consequentialist theories (Kantian duties, rights and justice) judge principles.","src":"L2 slide 9 · Crane s. 17"},{"id":"SB039","l":"L2","t":"Utilitarianism","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A manager says: \"Child labour at this one supplier may help a little, but as a general rule it causes far more harm than good, so we will not use it.\" This is:","o":[["Ethical egoism","Egoism looks at the decision-maker's own desires or interests, not total welfare in society."],["Rule utilitarianism","Rule utilitarianism asks whether the underlying principle or class of action produces more pleasure than pain for society in the long run."],["Ethics of care","Ethics of care focuses on relationships and responsibilities, not on aggregating pleasure and pain."],["Act utilitarianism","Act utilitarianism evaluates only the single action in its specific circumstances, which might allow the deal here."]],"c":[1],"es":"Judging the general practice (class of actions) by its total consequences is rule utilitarianism.","ed":"Both forms of utilitarianism are consequentialist and aim at the greatest good for the greatest number. Act utilitarianism assesses each single action; in Crane et al.'s toy-supplier dilemma it might approve the deal because the children's pain looks small in that case. Rule utilitarianism assesses classes of action (e.g. \"child labour\", \"bribery\") and supports general rules such as \"don't bribe\", which brings it closer to principle-based theories. J.S. Mill introduced the distinction partly to address the subjectivity problem.","kt":"","src":"L2 slide 9 · Crane s. 15 · Crane s. 16"},{"id":"SB040","l":"L2","t":"Utilitarianism","f":"m","d":3,"p":"M","sc":"none","s":"A problem with utilitarianism, according to Crane et al., is that:","o":[["It gives extra weight to yourself","Universalism requires equal weighting of everyone, including oneself."],["It assumes people act only from a sense of duty","Utilitarianism sees humans as motivated by avoiding pain and gaining pleasure."],["It can ignore minorities who pay","The problem of distribution of utility."],["It ignores consequences","Utilitarianism is entirely focused on consequences; that criticism applies to Kant."]],"c":[2],"es":"Utilitarianism faces subjectivity, equal weighting, quantification and distribution problems.","ed":"Crane et al. list four problems: subjectivity (who and what to include, how to judge pleasure and pain), equal weighting (everyone, including distant stakeholders, counts equally), quantification and calculation (how to price a childhood or a life), and distribution (the greatest good for the greatest number can sacrifice minorities and future generations). The GM Malibu fuel-tank calculation in Chapter 4 shows the danger of mechanically applied cost-benefit reasoning. Also true, but not offered as an option here: Assigning quantified costs and benefits to things like childhood or human life is very difficult.","kt":"","src":"Crane s. 15 · Crane s. 57"},{"id":"SB041","l":"L2","t":"Kant's ethics of duty","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A CFO thinks about faking earnings \"just this once\". Which reasoning is Kantian?","o":[["It is wrong only if total harm beats total benefit","Weighing harms and benefits is consequentialist (utilitarian) reasoning."],["It is wrong because a good person would feel ashamed","Reasoning from character and shame is closer to virtue ethics."],["It is fine if everyone in the industry does it","This is relativist reasoning, not Kantian."],["If every CFO did it, no report could be trusted","This applies the first formulation of the categorical imperative: act only on maxims you could will as universal law."]],"c":[3],"es":"Kant: act only on a maxim you can will as a universal law; misreporting fails that test.","ed":"The categorical imperative says act only according to the maxim by which you can at the same time will that it should become a universal law (Crane et al. use lying and failure to repay debts as examples that cannot be universalised). A second formulation requires treating people never merely as a means but also as ends in themselves. Kant judges by motivation and duty, not outcomes, which is also the source of the main criticisms (undervaluing outcomes and motivation, assuming rationality).","kt":"","src":"L2 slide 9 · Crane s. 17 · Crane s. 18"},{"id":"SB042","l":"L2","t":"Kant's ethics of duty","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Evan and Freeman base stakeholder theory partly on Kant: stakeholders should be treated as ends, not only as means.","o":[["True","Correct. Crane et al. state that Evan and Freeman argued the stakeholder concept is substantially derived from Kant, implying a duty to give stakeholders some influence on the firm."],["False","Incorrect. Crane et al. state that Evan and Freeman argued the stakeholder concept is substantially derived from Kant, implying a duty to give stakeholders some influence on the firm."]],"c":[0],"es":"True: the \"treat people as ends, not merely as means\" formulation underpins the ethical case for stakeholder theory.","ed":"Kant's second formulation of the categorical imperative requires respect for human dignity. Applied to business, employees, communities and suppliers should not be treated merely as factors of production or sources of revenue. Evan and Freeman conclude firms have a duty to allow stakeholders some influence on the corporation. This links Lecture 2 to the stakeholder theory discussed in Lecture 4 (Freeman).","kt":"","src":"Crane s. 18 · L4 slide 13"},{"id":"SB043","l":"L2","t":"Kant's ethics of duty","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A key criticism of Kant is that he focuses too much on outcomes and too little on duty.","o":[["True","Incorrect. The criticism is the opposite: Kantianism undervalues outcomes (e.g. refusing to lie even when an innocent life is at stake) because it judges only by duty and principle."],["False","Correct. The criticism is the opposite: Kantianism undervalues outcomes (e.g. refusing to lie even when an innocent life is at stake) because it judges only by duty and principle."]],"c":[1],"es":"False: Kant is criticised for undervaluing outcomes, not overvaluing them.","ed":"Crane et al. list three problems with Kantianism: undervaluing motivation (only acting from duty counts as morally worthy, even if the result is the same), undervaluing outcomes (no room for rule-bending to avoid great harm) and the assumption of rationality (people rarely work calmly through the categorical imperative). Overvaluing outcomes is a criticism one would rather make of utilitarianism.","kt":"","src":"Crane s. 19"},{"id":"SB044","l":"L2","t":"Rights and justice","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"A board defends a huge CEO bonus: it helps the lowest-paid workers too, and the CEO job is open to anyone. Which theory supports this?","o":[["Postmodern ethics","The board gives a principled argument about distribution, not an appeal to moral impulse."],["Ethical egoism","The defence appeals to fairness for the least well off, not to the CEO's self-interest."],["Kant's categorical imperative","The argument is about distribution and benefit to the least advantaged, which is Rawlsian, not about universalising a maxim."],["Rawls' theory of justice","Rawls accepts inequalities if they benefit the least advantaged and are attached to positions open to all."]],"c":[3],"es":"Rawls: inequalities are just if they benefit the least advantaged and positions are open to all.","ed":"Behind a \"veil of ignorance\", rational people would choose (1) equal basic liberties for all and (2) social and economic inequalities only if (a) they are to the greatest benefit of the least advantaged (difference principle) and (b) attached to positions open to all under fair equality of opportunity. Crane et al. use exactly the example of high executive pay that also raises the lowest wages. The first principle must be met before inequalities are considered.","kt":"","src":"L2 slide 9 · Crane s. 26 · Crane s. 27"},{"id":"SB045","l":"L2","t":"Rights and justice","f":"m","d":2,"p":"M","sc":"none","s":"Under the UN Guiding Principles (Ruggie), the main duty of business is to:","o":[["Respect human rights","The UNGP give the state the duty to protect, business the responsibility to respect, and victims access to remedy."],["Enforce human rights laws where the state is weak","The duty to protect lies primarily with the state."],["Report only issues that affect profits","The responsibility to respect applies regardless of profit effects and includes due diligence."],["Act as a court for victims","Access to (judicial) remedy is primarily a state and judiciary function, though businesses should support non-judicial remedies."]],"c":[0],"es":"UNGP: state duty to protect, corporate responsibility to respect, access to remedy.","ed":"The UN Guiding Principles (2011) assign the state the duty to protect human rights, business the responsibility to respect human rights (avoid causing or contributing to adverse impacts, and seek to prevent impacts linked to its operations through business relationships), and the judiciary access to remedy. In practice this means a policy commitment, a human rights due diligence process and remediation. Investors increasingly expect firms to show how they manage these risks.","kt":"","src":"Crane s. 21 · Crane s. 22"},{"id":"SB046","l":"L2","t":"Ethical theories","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A CEO who says \"we invest in worker safety because accidents hurt our profits in the long run\" is reasoning like an ethical egoist.","o":[["True","Correct. The justification is the firm's own long-term interest, which is ethical egoism (enlightened self-interest), even though the action also benefits workers."],["False","Incorrect. The justification is the firm's own long-term interest, which is ethical egoism (enlightened self-interest), even though the action also benefits workers."]],"c":[0],"es":"True: the reason given is long-term self-interest.","ed":"Much \"business case for CSR\" reasoning is egoist. It works when ethics and profit coincide, but gives no guidance when doing right is costly - which is where utilitarian, rights or justice reasoning matters.","kt":"Ethical egoism: an action is right if it maximises the decision-maker's long-term self-interest.","src":"L2 slide 9 · Crane s. 12"},{"id":"SB047","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"H","sc":"none","s":"Which theory and focus are correctly matched?","o":[["Ethics of care - universal rules","Ethics of care focuses on relationships and responsibilities; universal justice rules are Rawls/rights."],["Virtue ethics - total welfare","Virtue ethics focuses on character; collective welfare is utilitarianism."],["Discourse ethics - open, honest dialogue","Discourse ethics (Habermas) is procedural: norms are generated through open discussion."],["Postmodern ethics - fixed rules for every culture","Postmodern ethics rejects codified rules in favour of a moral impulse that is context- and individual-specific."]],"c":[2],"es":"Virtue = character; care = relationships; discourse = deliberative process; postmodern = moral impulse.","ed":"Summary of Table 3.6 / slide 10: virtue ethics (Aristotle, MacIntyre) - character, strive to be a good person; ethic of care (Gilligan, Held) - relationships, our first responsibility is to those close to us; discourse ethics (Habermas) - deliberative process, conflict resolution through honest open discussion among rational individuals; postmodern ethics (Bauman) - moral impulse, ethics is context and individual specific, humans have an innate internal guide.","kt":"","src":"L2 slide 10 · Crane s. 31"},{"id":"SB048","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"A manager under pressure to hide a product defect asks: \"What would an honest, brave professional do?\" This reflects:","o":[["Virtue ethics","Asking what a person of good character would do is the hallmark of virtue ethics: good actions come from good persons."],["Discourse ethics","Discourse ethics would bring the affected parties together to generate norms through dialogue."],["Ethical relativism","Relativism would defer to local or group norms; the manager appeals to character traits."],["Act utilitarianism","Act utilitarianism would add up the pleasure and pain of disclosing versus hiding the defect."]],"c":[0],"es":"Reasoning from what a person of good character would do is virtue ethics.","ed":"Virtue ethics, going back to Aristotle's Nicomachean Ethics, says good actions come from good persons with excellent traits of character (virtues such as honesty, courage, justice and practical wisdom). Virtues are acquired through learning and community and are about habitual patterns, with a balance between extremes (e.g. rashness and cowardice around courage). Its weakness: how to act when virtues conflict, and which community's virtues to follow.","kt":"","src":"L2 slide 10 · Crane s. 31 · Crane s. 32"},{"id":"SB049","l":"L2","t":"Alternative ethical theories","f":"t","d":3,"p":"M","sc":"none","s":"True or false: An ethic of care says that universal, impartial rules should always come before the needs of specific people.","o":[["True","Incorrect. An ethic of care assumes we are relational and interdependent, not autonomous, and accepts that the claims of particular others (those we care for) can be compelling even if they conflict with universalisable judgements."],["False","Correct. An ethic of care assumes we are relational and interdependent, not autonomous, and accepts that the claims of particular others (those we care for) can be compelling even if they conflict with universalisable judgements."]],"c":[1],"es":"False: an ethic of care sees people as relational and accepts partiality towards those we have relationships with.","ed":"Drawing on Gilligan and Held, an ethic of care accepts that we have emotional commitments to those with whom we have significant relationships, that we are not autonomous, are bound by circumstance and position, have restricted information and choices, and stand in positions of unequal power. Moral problems are conflicts of responsibilities in relationships; the goal is to avoid harm and maintain healthy relationships, valuing emotions such as empathy alongside reason.","kt":"","src":"L2 slide 10 · Crane s. 35 · Crane s. 36"},{"id":"SB050","l":"L2","t":"Alternative ethical theories","f":"m","d":4,"p":"M","sc":"none","s":"According to Bauman's postmodern ethics, strict rules in large organisations can harm moral behaviour because:","o":[["People follow rules and lose sight of victims","Bauman argues codifying morality in rules denies its real source, the moral impulse, which is nullified when people are distanced from those affected."],["Managers become too emotional","Postmodern ethics welcomes emotions and gut feelings; the problem it identifies is the suppression of them."],["Managers must weigh every pleasure and every pain","This is a criticism of utilitarian calculation, not Bauman's argument."],["Stakeholders get too much say","Bauman's argument is about the individual moral impulse, not stakeholder voice."]],"c":[0],"es":"Codified rules and organisational distance suppress the moral impulse that is the true source of morality.","ed":"Postmodern ethics locates morality beyond rationality in an emotional \"moral impulse\" towards others and encourages questioning everyday rules and listening to gut feelings. Bauman argues that rational codes (as in bureaucracies) deny this impulse and distance people from the consequences of their decisions. This connects to Chapter 4's situational factor \"bureaucracy\", which suppresses moral autonomy, creates instrumental morality, distancing and denial of moral status.","kt":"","src":"L2 slide 10 · Crane s. 39 · Crane s. 84"},{"id":"SB051","l":"L2","t":"Ethical pluralism","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Crane et al. recommend choosing one best ethical theory and using it for every business problem.","o":[["True","Incorrect. They reject the single \"lens\" view and recommend a pluralist \"prism\" in which the theories are used in a complementary way to reveal a variety of considerations."],["False","Correct. They reject the single \"lens\" view and recommend a pluralist \"prism\" in which the theories are used in a complementary way to reveal a variety of considerations."]],"c":[1],"es":"False: they propose a pluralist \"prism\" of theories rather than a single lens.","ed":"Figure 3.1 shows the typical \"lens\" view (one theory gives one normative consideration); Figure 3.2 shows Crane et al.'s preferred \"prism\" (all theories together give a spectrum of considerations). Table 3.8 turns this into checklist questions: own interests (egoism), social consequences (utilitarianism), duties (Kant), rights, fairness (justice), character (virtue), relationships (care), deliberative process (discourse) and moral impulse (postmodern).","kt":"","src":"Crane s. 41 · Crane s. 42 · Crane s. 43"},{"id":"SB052","l":"L2","t":"Ethical pluralism","f":"m","d":3,"p":"H","sc":"none","s":"Crane et al. turn each theory into a question a manager might ask. Which pairing is correct?","o":[["\"What does my gut tell me?\" - rights","That is the postmodern question; rights ethics asks whose fundamental rights must be respected."],["\"What if everybody did this?\" - duty","This is the universalisability test of the categorical imperative."],["\"Does this protect relationships?\" - utilitarianism","That is the ethic of care question."],["\"Am I treating everyone fairly?\" - egoism","That is the justice question; egoism asks about one's own long-term interests."]],"c":[1],"es":"Universalisability = duty; open, non-coercive deliberation = discourse ethics.","ed":"Summary of Table 3.8: own interests - egoism; social consequences - utilitarianism; duties to others (\"what if everybody did this?\", \"am I using people merely as means?\") - ethics of duty; entitlements - rights; fairness and equal chances - justice; integrity (\"what would a decent, honest person do?\") - virtue ethics; relationships and avoiding harm - ethic of care; deliberative process - discourse ethics; empathy and gut feeling - postmodern ethics. Also true, but not offered as an option here: \"How can we reach a mutually acceptable solution through open discussion that avoids railroading by the most powerful player?\" - discourse ethics.","kt":"","src":"Crane s. 43 · L2 slide 9-10"},{"id":"SB053","l":"L2","t":"Ethical theories applied: Tesla case","f":"m","d":5,"p":"H","sc":"extended_course_case","s":"During COVID-19, Elon Musk reopened a Tesla factory against state orders. Which evaluation is correct?","o":[["Discourse ethics approves, since he announced it","Discourse ethics requires honest, open deliberation with all affected parties, not a unilateral announcement."],["An ethic of care would look only at shareholders","An ethic of care focuses on relationships and responsibilities to those affected, such as workers and their families."],["Kant asks: could all firms do this?","Kantian ethics tests the maxim behind the act for universalisability, regardless of outcomes."],["Relativism says it broke universal laws","Relativism denies universal moral laws; this sentence describes absolutism."]],"c":[2],"es":"Utilitarians weigh total consequences; Kantians test whether the maxim could be a universal law.","ed":"The lecture asks whether Musk's decision was morally right, what influenced it and how a shareholder would react. Different theories highlight different considerations: utilitarianism (jobs and output versus health risks for all affected), Kant (universalisability and treating workers merely as means), rights (workers' right to safety), ethic of care (responsibility to workers and community) and discourse ethics (was there genuine dialogue with authorities and workers?). Descriptive theory then asks which individual factors (e.g. locus of control, values) and situational factors (authority, culture, issue framing) explain the decision. Also true, but not offered as an option here: A utilitarian would weigh the benefits (jobs, production, shareholder value) against the expected harm (infection risk to workers and community) for everyone affected.","kt":"","src":"L2 slide 2-3 · L2 slide 9-11 · L2 slide 22"},{"id":"SB054","l":"L2","t":"Ethical decision-making","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank employee sells complex products to elderly customers to hit targets, without seeing it as an ethical issue. Where does the decision process fail first?","o":[["Recognising the moral issue","She never framed the situation as an ethical issue."],["Moral judgement","Judgement requires first recognising the issue."],["Establishing a moral intent to act","Intent comes after recognition and judgement."],["Moral behaviour","The breakdown starts earlier, at recognition."]],"c":[0],"es":"Failure at stage 1: the moral issue is not recognised.","ed":"Situational factors (sales targets, euphemisms like \"product push\") reduce recognition. This is close to the Wells Fargo fake-accounts scandal (2016), where aggressive targets drove misconduct - a governance and culture issue as much as an individual one.","kt":"Ethical decision-making stages: recognise the issue → make a judgement → establish intent → act.","src":"L2 slide 14 · Crane s. 36"},{"id":"SB055","l":"L2","t":"Ethical decision-making model","f":"t","d":2,"p":"M","sc":"none","s":"True or false: In Schwartz (2016), the rationalist view stresses quick gut feelings, while the intuitionist view stresses careful logical reasoning.","o":[["True","Incorrect. The labels are swapped: the rationalist perspective assumes calculation-like logical reasoning, while the intuitionist/sentimentalist perspective stresses intuition, emotion and quick moral intuitions."],["False","Correct. The labels are swapped: the rationalist perspective assumes calculation-like logical reasoning, while the intuitionist/sentimentalist perspective stresses intuition, emotion and quick moral intuitions."]],"c":[1],"es":"False (swapped): rationalist = calculation-like reasoning; intuitionist = quick moral intuitions, emotion, sentiment.","ed":"Schwartz distinguishes the very common rationalist view (logical reasoning before a judgement) from the intuitionist or sentimentalist view (cognitive processes, intuition, emotion, quick moral intuitions). This mirrors the normative debate: Western modernist theories are rational and codified, while postmodern ethics and the ethic of care stress emotions and gut feelings.","kt":"","src":"L2 slide 13"},{"id":"SB056","l":"L2","t":"Ethical decision-making","f":"m","d":3,"p":"M","sc":"short","s":"An analyst finds fake ESG data but says: \"Nothing I do will change anything; it is up to the bosses.\" This shows:","o":[["An external locus of control","She believes outcomes are controlled by others, not by her actions."],["High moral imagination","Moral imagination would help her see alternatives."],["An internal locus of control","Internal locus means believing you can influence outcomes."],["Strong personal integrity","Integrity would push her to act on her values."]],"c":[0],"es":"Believing you cannot influence outcomes = external locus of control.","ed":"People with an internal locus of control are more likely to take responsibility and act ethically, e.g. by raising concerns. Organisations can support this with whistleblowing channels and legal protection (slide on integrity).","kt":"Locus of control: the extent to which a person believes they control events in their life (internal) or that outside forces do (external).","src":"L2 slide 15"},{"id":"SB057","l":"L2","t":"Individual factors","f":"m","d":4,"p":"M","sc":"none","s":"What do Crane et al. find about individual factors in ethical decisions?","o":[["Locus of control has a strong, proven effect","Table 4.2 says locus of control has at most a limited effect, though it can predict how blame is apportioned."],["Values matter; age and gender unclear","Table 4.2 reports a significant influence of personal values and unclear associations for age and gender."],["Gender is the strongest factor","Studies are contradictory; many find no differences at all."],["Moral development has no effect","CMD has a small but significant effect, smaller than Kohlberg proposed."]],"c":[1],"es":"Personal values matter significantly; age/gender evidence is unclear; locus of control at most limited; CMD small but significant.","ed":"Summary of Table 4.2: age and gender - mixed evidence, unclear associations; national and cultural characteristics - significant effect on beliefs; education and employment - somewhat unclear, though some differences exist; CMD - small but significant effect; locus of control - at most limited effect; personal values - significant influence; personal integrity - likely significant but rarely tested; moral imagination - new, largely untested. Overall Crane et al. argue situational factors are at least as important as individual ones.","kt":"","src":"Crane s. 61 · L2 slide 15"},{"id":"SB058","l":"L2","t":"Cognitive moral development","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An employee uses the office printer for private jobs and says: \"Everyone in my department does it.\" Which CMD level is this?","o":[["Conventional (fitting in with others)","Living up to what peers expect is stage 3, conventional level."],["Post-conventional (social contract)","Stage 5 assesses right and wrong by basic rights and society's contracts, not peer behaviour."],["Post-conventional (universal principles)","Post-conventional reasoning would rely on self-chosen principles such as justice or rights."],["Pre-conventional (avoiding punishment)","Pre-conventional reasoning would focus on whether the person will be punished or rewarded."]],"c":[0],"es":"\"Everyone here does it\" is conventional-level reasoning (stage 3, conformity to peers).","ed":"Summary of Table 4.3: Level I pre-conventional - (1) obedience and punishment, (2) instrumental purpose and exchange (\"you scratch my back...\"); Level II conventional - (3) interpersonal accord and conformity to peers, (4) social accord and system maintenance (wider societal expectations); Level III post-conventional - (5) social contract and individual rights, (6) universal ethical principles. Crane et al. use almost exactly this office-resources example for stage 3. Most adults reason at the conventional level, which is why context matters so much.","kt":"","src":"L2 slide 16-17 · Crane s. 64 · Crane s. 65"},{"id":"SB059","l":"L2","t":"Cognitive moral development","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Since most people reason at the conventional level, the work context (peers, managers, culture) matters a lot for ethical decisions.","o":[["True","Correct. Crane et al. note that Kohlberg's theory suggests most of us are at a conventional level, which prompts us to seek guidance from those around us; hence context-related factors matter."],["False","Incorrect. Crane et al. note that Kohlberg's theory suggests most of us are at a conventional level, which prompts us to seek guidance from those around us; hence context-related factors matter."]],"c":[0],"es":"True: conventional reasoners look to those around them, so context shapes their decisions.","ed":"CMD has a small but significant effect, and critics note people reason differently in different situations (\"multiple ethical selves\"), Kohlberg's original sample was male, and the theory may be culturally biased. The link to situational factors is direct: if most people take their cues from others, rewards, authority, roles and culture will strongly influence what they do.","kt":"","src":"Crane s. 73 · Crane s. 67 · L2 slide 19"},{"id":"SB060","l":"L2","t":"Whistleblowing","f":"m","d":3,"p":"M","sc":"short","s":"In the Wirecard case, warnings came for years, but the regulator investigated journalists instead of the company. This shows:","o":[["Why whistleblowers need protection","Without protection and independent supervision, warnings were ignored."],["That auditors never miss fraud","The auditor failed to detect missing cash of about €1.9bn for years."],["That short sellers are always wrong about accounting fraud","Here short sellers and journalists were right."],["That fraud only happens in emerging markets","Wirecard was a DAX company in Germany."]],"c":[0],"es":"Warnings were suppressed; protection and independent oversight matter.","ed":"Wirecard shows governance failures at several gatekeepers (board, auditor, regulator). In the course framework it is a G failure with large financial consequences, and an example of why personal integrity alone is not enough without institutional support.","kt":"Whistleblowing: disclosure by an insider of wrongdoing to people able to act on it; it often requires legal protection against retaliation.","src":"L2 slide 18"},{"id":"SB061","l":"L2","t":"Moral intensity","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of Jones' (1991) six factors of moral intensity?","o":[["Moral muteness","Moral muteness relates to moral framing and managers' reluctance to use moral language."],["Temporal immediacy","How quickly the consequences are likely to occur."],["Locus of control","Locus of control is an individual factor, not a dimension of issue intensity."],["Return on equity","Financial performance is not part of moral intensity."]],"c":[1],"es":"Magnitude, social consensus, probability of effect, temporal immediacy, proximity, concentration of effect.","ed":"Jones' six factors are magnitude of consequences, social consensus, probability of effect, temporal immediacy, proximity (social, cultural, psychological or physical nearness to those affected) and concentration of effect. Empirical reviews (O'Fallon and Butterfield) find strong support, especially for magnitude and social consensus. Moral intensity is an issue-related situational factor. Also true, but not offered as an option here: Concentration of effect.","kt":"","src":"L2 slide 20 · Crane s. 76"},{"id":"SB062","l":"L2","t":"Moral intensity","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"The Rana Plaza collapse (2013) killed over 1,100 workers far from Western consumers. Why did it still feel so intense?","o":[["Small harm, but very likely","The magnitude of consequences was very large."],["Big, sudden harm, made close by known brands","Crane et al. point to magnitude, temporal immediacy, concentration of effect and virtual proximity through brands such as Benetton and Primark."],["Nobody agreed it was wrong","There was already relatively high social consensus around sweatshop labour."],["The harm was spread out and far in the future","The harm was concentrated in one building and immediate."]],"c":[1],"es":"Magnitude, immediacy and concentration were high, and brand logos created virtual proximity.","ed":"Crane et al. use Rana Plaza to show the six factors at work. Social consensus against sweatshop labour already existed; the collapse added huge magnitude, temporal immediacy and concentration of effect (one building). Physical distance would normally lower proximity, but global brand logos and online coverage created strong virtual proximity. The resulting moral intensity led more than 150 companies to sign the Accord. The textbook (Box 1.2) uses the same event to show underinvestment in safety for short-term profits.","kt":"","src":"Crane s. 77 · Bok s. 7 (Box 1.2) · L2 slide 20"},{"id":"SB063","l":"L2","t":"Moral framing","f":"m","d":3,"p":"H","sc":"none","s":"Managers often avoid moral language (\"moral muteness\"). One reason is a perceived threat to:","o":[["Harmony at work","Moral talk is seen as provoking confrontation and finger-pointing."],["The firm's credit rating","Credit ratings are not among the three threats."],["The legality of decisions","Legality is not one of the three perceived threats."],["Shareholders' voting rights","Voting rights are not part of the moral muteness argument."]],"c":[0],"es":"Moral muteness stems from perceived threats to harmony, efficiency, and image of power and effectiveness.","ed":"Moral framing is the use of language to expose or mask the ethical nature of decisions (e.g. \"cutting and pasting\" vs \"stealing someone's ideas\"). Bird and Waters found managers reframe moral issues as matters of practicality or economic sense because moral talk is perceived to threaten harmony, efficiency, and their image of power and effectiveness. Crane (2001) calls this amoralisation: managers can still take morally good decisions if they couch them in business terms, but ethical issues may then be treated as mere business problems. Also true, but not offered as an option here: A threat to their image of power and effectiveness.","kt":"","src":"L2 slide 20 · Crane s. 78"},{"id":"SB064","l":"L2","t":"Moral framing","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An employee shops online during work hours and says: \"It is fine, I do lots of unpaid overtime.\" Which excuse is this?","o":[["Denial of victim","Denial of victim argues the harmed party deserved it (\"they chose to participate\")."],["Denial of injury","Denial of injury claims no one was really harmed."],["Appeal to higher loyalties","Appeal to higher loyalties invokes a more important cause or loyalty to a boss."],["Metaphor of the ledger","Claiming accrued \"credits\" from extra effort that entitle one to deviant behaviour is the metaphor of the ledger."]],"c":[3],"es":"\"I have earned it with overtime\" = metaphor of the ledger.","ed":"Summary of Table 4.5 (Anand, Ashforth and Joshi): denial of responsibility (\"I had no choice\"), denial of injury (\"no one was really harmed\"), denial of victim (\"they deserved it\"), social weighting (condemn the condemner, \"others are worse\"), appeal to higher loyalties (\"we answered to a more important cause\"), metaphor of the ledger (\"I have accrued credits\"). Euphemistic language (\"facilitation payments\", \"restructuring\") supports such rationalisations, which can become socialised in organisations.","kt":"","src":"L2 slide 21 · Crane s. 79"},{"id":"SB065","l":"L2","t":"Moral framing","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A firm accused of pollution says: \"Our critics have no right to judge us, and competitors pollute more.\" This is \"social weighting\".","o":[["True","Correct. Social weighting combines condemning the condemner (\"you have no right to criticise us\") and selective social comparison (\"others are worse\")."],["False","Incorrect. Social weighting combines condemning the condemner (\"you have no right to criticise us\") and selective social comparison (\"others are worse\")."]],"c":[0],"es":"True: condemning the critics and comparing with worse others is social weighting.","ed":"Anand et al.'s social weighting tactic has two parts: condemn the condemner and selective social comparison. Its function is to reduce the salience of the corrupt behaviour. Such tactics neutralise regret and can become part of an organisation's culture, which is why Crane et al. treat them as part of moral framing.","kt":"","src":"L2 slide 21 · Crane s. 79"},{"id":"SB066","l":"L2","t":"Situational factors","f":"m","d":2,"p":"H","sc":"none","s":"Which of these is an issue-related (not context-related) factor in ethical decisions?","o":[["Reward systems","Rewards are context-related."],["Authority of superiors","Authority is context-related."],["Moral framing","Moral intensity and moral framing are the two issue-related factors."],["Organisational culture","Culture is context-related."]],"c":[2],"es":"Issue-related: moral intensity and moral framing. Context-related: rewards, authority, bureaucracy, work roles, culture, national context.","ed":"Summary of Table 4.4: issue-related factors concern the nature of the issue (moral intensity) and how it is represented (moral framing). Context-related factors concern the work environment: rewards (strong evidence), authority (good support), bureaucracy (significant but contested), work roles (likely but little evidence), organisational culture (strong overall influence) and national context (limited but clear for some decisions). Crane et al. argue situational factors are at least as important as, and probably more important than, individual ones.","kt":"","src":"L2 slide 19-21 · Crane s. 76"},{"id":"SB067","l":"L2","t":"Situational factors","f":"m","d":4,"p":"M","sc":"none","s":"What do Crane et al. mean by \"distancing\" in large organisations?","o":[["Staff stop asking if the goals are right","That is instrumental morality (and suppression of moral autonomy)."],["A buyer never sees the workers she affects","Distancing separates decision-makers from those who bear the consequences of their decisions."],["Sales targets are rewarded no matter how they are met","That is the rewards factor, not bureaucracy's distancing effect."],["Customers become data in a database","That is denial of moral status."]],"c":[1],"es":"Distancing: bureaucracy separates decision-makers from the people affected by their decisions.","ed":"Drawing on Weber, Jackall and Bauman, Crane et al. list four negative effects of bureaucracy: suppression of moral autonomy (people become \"moral robots\" following rules), instrumental morality (focus on correct procedures rather than moral goals; loyalty over integrity), distancing (from the consequences of actions) and denial of moral status (people and animals become resources or data). They also note bureaucratic rules can protect people (e.g. in hospitals or aviation).","kt":"","src":"Crane s. 84 · Crane s. 86"},{"id":"SB068","l":"L2","t":"Situational influences","f":"t","d":3,"p":"M","sc":"short","s":"True or false: In the Volkswagen emissions scandal, pressure from bosses to hit impossible targets does not help explain the misconduct.","o":[["True","Incorrect. Crane et al. stress context-related factors such as authority, rewards and organisational culture; superiors have a strong influence on subordinates' ethical behaviour."],["False","Correct. Crane et al. stress context-related factors such as authority, rewards and organisational culture; superiors have a strong influence on subordinates' ethical behaviour."]],"c":[1],"es":"False: authority and culture are key situational drivers.","ed":"VW combines individual and situational factors: targets, fear-based culture and weak governance (Lecture 5) pushed employees towards cheating. This is why governance and culture, not just personal ethics, are material ESG issues.","kt":"Situational (context-related) factors: rewards, authority, bureaucracy, work roles, group norms and culture that shape ethical choices.","src":"Crane s. 48 · L5 slide 14"},{"id":"SB069","l":"L2","t":"Situational factors","f":"m","d":4,"p":"M","sc":"none","s":"What lesson do Crane et al. draw from Bernard Madoff's fraud?","o":[["Madoff acted alone, so only character matters","This was the initial assumption that later analysis challenged."],["Rules always prevent fraud","The case says nothing of the sort; rules and controls failed to stop it for decades."],["Helpers and the environment also mattered","Further analysis showed Madoff operated within a web of collaborators and an environment that encouraged and enabled the fraud."],["Descriptive ethics is irrelevant","The case is used to motivate descriptive theory."]],"c":[2],"es":"Misconduct reflects both individual and situational factors; Madoff relied on collaborators and an enabling environment.","ed":"Madoff was first portrayed as a lone \"monster\", but he worked within a web of collaborators, credulous clients and partners (JP Morgan paid a $1.7bn penalty; five others were sentenced). Crane et al. use this to ask whether wrongdoing is individual ingenuity or due to industry culture and institutional norms, which motivates the study of both individual and situational factors. The same logic applies to the corporate scandals (Enron, VW, Olympus) in the textbook's Box 3.1.","kt":"","src":"Crane s. 53 · Bok s. 79 (Box 3.1)"},{"id":"SB070","l":"L2","t":"Theories of CSR","f":"m","d":3,"p":"H","sc":"none","s":"In Bénabou and Tirole (2010), managers spending other people's money on their own values is:","o":[["Shareholder primacy","This is not one of Bénabou and Tirole's three views."],["Insider-led philanthropy","Slide 25: management spends other people's money on its own values; this is an agency problem."],["Delegated philanthropy","In delegated philanthropy the firm acts as an agent for stakeholders' values, not managers' own values."],["\"Win-win\" CSR","Win-win is value-maximising CSR with no ethical tension."]],"c":[1],"es":"Insider-initiated philanthropy = managers spending shareholders' money on their own values (an agency problem).","ed":"Summary of slide 25: (1) \"win-win\" - doing well by doing good; CSR pays for itself via reputation, retention and lower risk, so the firm is simply maximising long-run value. (2) Delegated philanthropy - customers, employees and shareholders have prosocial preferences and use the firm to act on them (close to Hart and Zingales in Lecture 4). (3) Insider-initiated corporate philanthropy - managers spend other people's money on their own values; an agency problem, linked to Lecture 5 on governance.","kt":"","src":"L2 slide 25"},{"id":"SB071","l":"L2","t":"Theories of CSR","f":"t","d":5,"p":"M","sc":"none","s":"True or false: Bénabou and Tirole's \"delegated philanthropy\" is close to Hart and Zingales' idea: investors act on their social preferences through the firm.","o":[["True","Correct. Delegated philanthropy means stakeholders with prosocial preferences use the firm as the vehicle for their values; Hart and Zingales argue managers should follow prosocial shareholders' preferences (e.g. by voting) because externalities are not separable from production."],["False","Incorrect. Delegated philanthropy means stakeholders with prosocial preferences use the firm as the vehicle for their values; Hart and Zingales argue managers should follow prosocial shareholders' preferences (e.g. by voting) because externalities are not separable from production."]],"c":[0],"es":"True: both see the firm as a vehicle for investors' or stakeholders' prosocial preferences.","ed":"In delegated philanthropy the firm acts as an agent for others' values. Hart and Zingales make a related point: when shareholders are prosocial and externalities cannot be separated from production decisions, maximising market value is not the same as maximising shareholder welfare, so firms should pursue policies consistent with investors' preferences, for example via shareholder votes. By contrast, insider-initiated philanthropy (managers' own values) is an agency problem, matching Jensen's and Bebchuk and Tallarita's concerns in Lecture 4.","kt":"","src":"L2 slide 25 · L4 slide 31 · Hart & Zingales s. 3"},{"id":"SB072","l":"L2","t":"Telenor in Myanmar","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"After the 2021 coup, Telenor sold its Myanmar business to a buyer close to the military. Which statement is correct?","o":[["Utilitarianism ignores non-shareholders","Utilitarianism counts the welfare of everyone affected."],["A good mission made every decision ethical","Good intentions do not settle the dilemma; outcomes and rights still need to be assessed."],["Selling removed all responsibility for user data","Critics argued precisely that Telenor retained responsibility for the consequences of the sale."],["Exit is not always ethical: the buyer mattered","The \"irresponsible disengagement\" accusation concerns the manner of exit and the buyer."]],"c":[3],"es":"Both staying and leaving had serious human rights costs; the manner of exit matters too.","ed":"Telenor entered Myanmar in 2014 with a mission to help build society and connected almost the entire population by 2021. After the coup it faced surveillance pressure, concluded it could not operate according to its values and international law, and sold to a buyer linked to the junta, prompting accusations of irresponsible disengagement and of sharing user data. The case illustrates rights-based reasoning (privacy), utilitarian trade-offs (connectivity versus surveillance) and the UNGP idea that companies should address impacts linked to their business relationships, including when exiting. Telenor later published learning outcomes from the engagement. Also true, but not offered as an option here: Staying would have meant operating against Telenor's values and international law under junta surveillance demands, while leaving risked handing sensitive user data to the junta.","kt":"","src":"L2 slide 27-29 · L2 slide 32-34 · Crane s. 21"},{"id":"SB073","l":"L2","t":"Business ethics","f":"m","d":2,"p":"H","sc":"short","s":"A company legally moves profits to a low-tax country. Critics call it unethical. The course frames this as:","o":[["Legal is not always ethical","Business ethics covers areas the law does not regulate."],["Ethics applies only to people","Business ethics concerns organisations as well."],["If it is legal, it is by definition ethical","Law and ethics overlap but are not the same."],["Transfer pricing is always illegal","The scenario states it is legal."]],"c":[0],"es":"Legal ≠ ethical; ethics covers grey areas beyond the law.","ed":"Aggressive tax avoidance is a classic grey area. It can also become financially material: reputational damage, new regulation (e.g. the OECD global minimum tax), or extra taxes - as in the CESGA valuation example where tax avoidance raised future taxes (Lecture 9).","kt":"Business ethics: the study of business situations, activities and decisions where issues of right and wrong are addressed; it largely concerns grey areas beyond the law.","src":"L2 slide 4"},{"id":"SB074","l":"L2","t":"Ethical theories applied: Tesla case","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"Which explanation of Musk's decision to reopen the Tesla factory uses descriptive (not normative) ethics?","o":[["It caused more pain than pleasure","This is a normative utilitarian judgement."],["A good CEO would have obeyed the law","This is a normative virtue-ethics judgement."],["Ignoring the law cannot be a universal rule","This is normative (Kantian) reasoning about what he should have done."],["His personality and pressure from targets","Explaining a decision through individual factors (locus of control) and situational factors (rewards, pressure) is descriptive ethics."]],"c":[3],"es":"Descriptive ethics explains what influenced a decision (e.g. locus of control, pressures), not whether it was right.","ed":"The lecture's three questions map onto the two halves of the topic. \"Was the decision morally right?\" calls for normative theories. \"What factors may have influenced it?\" calls for descriptive theory: individual factors (values, locus of control, CMD, moral imagination) and situational factors (rewards and targets, authority, organisational culture, moral framing of the issue as \"freedom\" or \"jobs\"). \"How would you react as a shareholder?\" links to governance (voice and exit) in Lecture 5.","kt":"","src":"L2 slide 3 · L2 slide 11 · L2 slide 15 · L2 slide 19"},{"id":"SB075","l":"L2","t":"Moral framing","f":"m","d":1,"p":"M","sc":"none","s":"Calling bribes \"facilitation payments\" or mass lay-offs \"restructuring\" is:","o":[["Moral framing","Euphemisms make unethical acts seem inoffensive and support rationalisation."],["Moral imagination","Moral imagination expands awareness of moral issues; euphemisms reduce it."],["Discourse ethics","Discourse ethics concerns honest, open deliberation, not masking language."],["Post-conventional reasoning","CMD levels describe reasoning maturity, not the use of euphemisms."]],"c":[0],"es":"Euphemisms are a form of moral framing that masks the ethical nature of decisions.","ed":"Moral framing is the use of language to expose or mask the ethical nature of behaviour. Moral words (\"stealing\", \"cheating\", \"fairness\") trigger moral thinking; euphemisms (\"facilitation payments\", \"restructuring\") suppress it. Anand et al. show such language helps employees rationalise corruption, and it can become socialised within organisations.","kt":"","src":"L2 slide 20 · Crane s. 77 · Crane s. 79"},{"id":"SB076","l":"L2","t":"Ethical theories applied: child labour dilemma","f":"m","d":5,"p":"M","sc":"extended_course_case","s":"A manager can buy toys at a third of the cost from a supplier that uses child labour at home. How do the theories differ?","o":[["Act utilitarianism may approve; rights object","Crane et al. note act utilitarianism may favour the deal (most total pleasure), while human rights provide the most straightforward objection."],["Rawls clearly supports the deal","If the children miss schooling, the arrangement fails both the difference principle and fair equality of opportunity."],["All theories give the same answer","The chapter shows the theories reach different, sometimes contradictory, results."],["Postmodern ethics gives a clear rule that applies everywhere","Postmodern ethics rejects universal rules; it would ask the manager to engage directly and follow the moral impulse."]],"c":[0],"es":"Different theories give different verdicts; act utilitarianism may allow it, rights theory clearly objects.","ed":"Crane et al. apply each theory to the same dilemma. Egoism: depends on whether all parties freely pursue their long-term interests (doubtful for children). Act utilitarianism: may favour the deal (most pleasure overall); rule utilitarianism: child labour as a practice causes more pain. Kant: fails universalisability and treats children as means. Rights: violates the right to education. Rawls: fails if children lose schooling. Virtue, care, discourse and postmodern perspectives add context, relationships, dialogue and direct engagement. Hence their pluralist \"prism\" approach.","kt":"","src":"Crane s. 10 · Crane s. 16 · Crane s. 23 · Crane s. 27"},{"id":"TR04","l":"L2","t":"Ethical egoism","f":"t","d":3,"p":"H","sc":"none","s":"True or false: An ethical egoist CEO can choose to protect workers' health if seeing them suffer would make him feel bad.","o":[["True","Correct. Ethical egoism maximises one's own interests, which can include feeling bad about others' suffering; a purely selfish person would not care at all."],["False","Incorrect. Ethical egoism maximises one's own interests, which can include feeling bad about others' suffering; a purely selfish person would not care at all."]],"c":[0],"es":"True: egoism is not the same as selfishness.","ed":"In the Elon Musk/Tesla case, egoism could justify reopening (he gains as a bold leader) or not (if worker suffering weighs on him). The theory is consequentialist, but only the decision-maker's own outcomes count.","kt":"Ethical egoism: an act is right if it maximises the decision-maker's own long-term interest or desires.","src":"Opptak L2 ca. 33 min"},{"id":"TR05","l":"L2","t":"Cognitive moral development","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Executives keep running a price cartel because they think they will not get caught. Which CMD stage is this?","o":[["Stage 4: living up to the expectations of society","Stage 4 means following society's norms and laws, which the cartel breaks."],["Stage 1: obedience and punishment","The only consideration is whether they will be punished; this is the lecturer's own cartel example."],["Stage 6: universal ethical principles","Stage 6 applies principles regardless of punishment."],["Stage 5: social contract and individual rights","Stage 5 reasons from the rights of others, here consumers."]],"c":[1],"es":"Doing wrong because you will not get caught = stage 1.","ed":"The lecture's examples: stage 1, cartels persisting because executives expect not to be caught; stage 2, \"you scratch my back, I scratch yours\"; stage 3, doing what colleagues do; stage 4, paying above the industry minimum because society expects it; stage 6, refusing animal-tested inputs on principle.","kt":"","src":"Opptak L2 ca. 52 min"},{"id":"CX019","l":"L3","t":"Definition of externalities","f":"t","d":2,"p":"H","sc":"none","s":"Is an externality reflected in the market price of the good?","o":[["Yes","Feil. En externality er nettopp en effekt som ikke er med i prisen."],["No","Riktig. En externality er nettopp en effekt som ikke er med i prisen."]],"c":[1],"es":"Nei: externality = upriset effekt.","ed":"Fordi kostnaden ikke er i prisen, tar ikke kjøper og selger hensyn til den. Det er en market failure.","kt":"","src":"L3 slide 6 · L3 slide 10 · Bok s. 44 (2.1.1)","k":1},{"id":"CX020","l":"L3","t":"Types of externalities","f":"m","d":2,"p":"H","sc":"none","s":"Passive smoking that harms people nearby is:","o":[["A negative consumption externality","Skaden kommer fra forbruket av produktet."],["A negative production externality","Production externality kommer fra måten produktet lages på."],["A positive consumption externality","Andre blir skadet, så den er negativ."],["It is not an externality","Tredjepart bærer en kostnad som ikke er i prisen."]],"c":[0],"es":"Skade fra bruk av produktet = consumption externality.","ed":"Spør: kommer effekten fra produksjonen (fabrikkutslipp) eller fra forbruket (røyking)? Og er den positiv eller negativ for andre?","kt":"","src":"L3 slide 13 · Bok s. 36 (2.1)","k":1},{"id":"CX021","l":"L3","t":"Market failure diagram","f":"m","d":2,"p":"H","sc":"none","s":"With a negative production externality and no regulation, the market produces:","o":[["More than the social optimum, at too low a price","Kostnaden for andre er ikke i prisen, så produktet blir for billig."],["Nothing, because firms avoid pollution","Firmaer produserer, fordi de ikke betaler for skaden."],["Less than the social optimum, at too high a price","Det er motsatt."],["Exactly the social optimum","Da ville det ikke vært en market failure."]],"c":[0],"es":"Negativ externality = overproduksjon og for lav pris.","ed":"Private kostnader er lavere enn samfunnets kostnader. Markedet stopper der private kostnader møter etterspørselen, altså for langt ut.","kt":"","src":"L3 slide 9-12","k":1},{"id":"CX022","l":"L3","t":"Government intervention","f":"t","d":2,"p":"H","sc":"none","s":"Does a Pigouvian tax aim to make polluters pay the cost they impose on others?","o":[["Yes","Riktig. Skatten settes lik den eksterne skaden, slik at den blir internalised."],["No","Feil. Skatten settes lik den eksterne skaden, slik at den blir internalised."]],"c":[0],"es":"Ja: Pigouvian tax = skatt lik skaden.","ed":"Karbonavgift er et eksempel. Firmaer som kan kutte billig, kutter. De andre betaler. Det gjør skatten kostnadseffektiv.","kt":"","src":"Bok s. 47 (2.2.1.1) · L3 slide 21","k":1},{"id":"CX023","l":"L3","t":"Limits to internalisation","f":"t","d":2,"p":"H","sc":"none","s":"Is carbon leakage when emissions fall because firms invest in cleaner technology?","o":[["Yes","Feil. Carbon leakage er når produksjonen og utslippene flytter til land med svakere klimaregler."],["No","Riktig. Carbon leakage er når produksjonen og utslippene flytter til land med svakere klimaregler."]],"c":[1],"es":"Nei: leakage = utslipp flytter, ikke forsvinner.","ed":"Grunnen er territoriality: regler gjelder bare innenfor et område. EU svarer med en karbontoll på import (CBAM).","kt":"","src":"L3 slide 23 · Bok s. 55 (2.3.2)","k":1},{"id":"CX024","l":"L3","t":"Climate risk","f":"m","d":2,"p":"H","sc":"none","s":"An example of physical climate risk is:","o":[["A flood damages a factory","Klimaet selv gjør skade = physical risk."],["Buyers switch to electric cars","Endret etterspørsel = transition risk."],["A new carbon tax is introduced","Politikk = transition risk."],["New coal plants are banned","Regulering = transition risk."]],"c":[0],"es":"Flom, tørke, hete = physical. Regler og markeder = transition.","ed":"Physical: klimaet selv gjør skade (flom, tørke, hete). Transition: overgangen til lavutslipp gjør skade (karbonavgift, nye regler, ny teknologi).","kt":"","src":"L3 slide 36-38 · Bok s. 49 (2.3)","k":1},{"id":"CX025","l":"L3","t":"Climate scenarios","f":"m","d":2,"p":"H","sc":"none","s":"The NGFS-type scenario with the HIGHEST transition risk is:","o":[["Orderly: early, gradual policy action","Tidlig og gradvis gir moderat transition risk."],["Disorderly: late, sudden policy","Når politikken kommer sent og brått, blir omstillingen dyr og kaotisk."],["Hot house world: current policies only","Her kommer ingen nye regler, så transition risk er lav."],["Business as usual with no new rules","Ingen nye regler gir lav transition risk."]],"c":[1],"es":"Sent og brått = disorderly = høyest transition risk.","ed":"- Orderly: tidlig, gradvis. Moderat transition, lav physical.\n- Disorderly: sent, brått. Høy transition.\n- Hot house: ingenting skjer. Lav transition, høy physical.","kt":"","src":"Opptak L3 ca. 59 min · Opptak L3 ca. 61 min","k":1},{"id":"CX026","l":"L3","t":"Stranded assets","f":"t","d":2,"p":"H","sc":"none","s":"Can coal power plants become stranded assets if strict carbon pricing is introduced?","o":[["Yes","Riktig. De kan miste verdien før tiden fordi de ikke lenger er lønnsomme."],["No","Feil. De kan miste verdien før tiden fordi de ikke lenger er lønnsomme."]],"c":[0],"es":"Ja: karbonpris kan gjøre fossile eiendeler verdiløse.","ed":"Stranded asset: en eiendel som taper verdi uventet tidlig, typisk på grunn av klimapolitikk eller billigere fornybar energi.","kt":"","src":"Bok s. 53 (2.3) · Bok s. 70 (Key concepts) · L9 slide 3","k":1},{"id":"CX027","l":"L3","t":"Integrated value approach","f":"m","d":2,"p":"H","sc":"short","s":"Process A has F = 10, S = -4, E = -4. Process B has F = 8, S = 0, E = -1. Which has the higher integrated value?","o":[["Process B (7 versus 2)","I = F + S + E. A: 10 - 4 - 4 = 2. B: 8 + 0 - 1 = 7."],["They are equal","A gir 2 og B gir 7."],["It cannot be calculated","Det kan regnes ut: I = F + S + E."],["Process A (10 versus 8)","Det er bare F. Integrated value tar med S og E."]],"c":[0],"es":"I = F + S + E. B vinner.","ed":"Poenget: en ren finansiell analyse velger A (høyest F). Integrated value viser at B er bedre totalt. Det er forskjellen mellom SF 1.0 og SF 2.0.","kt":"","src":"L3 slide 32 · Bok s. 50 (2.3) · Bok s. 51 (Figure 2.3)","k":1},{"id":"EX05","l":"L3","t":"Exam sample: stress testing","f":"m","d":2,"p":"H","sc":"none","s":"Stress-testing differs from scenario analysis in that stress-testing asks:","o":[["What the average outcome will be","Et gjennomsnitt er det motsatte av et ekstremt scenario."],["How a firm would be like in each scenario","Det er scenario analysis: se på flere mulige utfall."],["How the firm would be like if everything goes wrong in a drastic scenario","Stress testing ser på det verste, ekstreme tilfellet."],["How competitors will react in a drastic scenario","Stress testing handler om firmaet selv, ikke konkurrentene."]],"c":[2],"es":"Stress test = det verste tilfellet. Scenario analysis = flere mulige utfall.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- Scenario analysis: hvordan går det med firmaet i hvert av flere scenarioer (f.eks. orderly, disorderly, hot house)?\n- Stress testing: tål firmaet (eller banken) et ekstremt, drastisk scenario der alt går galt?","kt":"","src":"Bok s. 67 (2.4.4) · Bok s. 68 (Box 2.4)","k":1,"x":1},{"id":"SB077","l":"L3","t":"Definition of externalities","f":"m","d":1,"p":"H","sc":"none","s":"An externality is:","o":[["An extra benefit to shareholders on top of dividends","Externalities concern third parties outside the transaction, not extra benefits to owners."],["A cost a firm pays abroad, like foreign taxes","Foreign taxes are ordinary costs borne by the firm; an externality falls on third parties."],["A cost that is fully included in the price","Once the cost is reflected in prices it has been internalised; an externality is by definition not priced."],["An unpriced effect on people outside the deal","This combines the slide definition with the textbook point that the effect is not reflected in market prices."]],"c":[3],"es":"An externality affects third parties outside the transaction and is not reflected in market prices.","ed":"An externality is a positive or negative effect on agents not involved in producing or consuming a good or service, which is not reflected in market prices. Because neoclassical models and profit-maximising firms use market prices as signals, externalities are ignored, which produces a market failure: the free market fails to allocate resources at the socially optimal level. Examples: pollution (negative, production), smoking (negative, consumption), vaccines (positive, consumption) and R&D (positive, production).","kt":"","src":"L3 slide 6 · L3 slide 10 · Bok s. 44 (2.1.1)"},{"id":"SB078","l":"L3","t":"Two-firm externality example","f":"m","d":3,"p":"H","sc":"none","s":"Two firms each choose technology (1): revenue $100, cost $20, plus a $10 cost on the other firm; or technology (2): revenue $100, cost $25, no cost to others. If each maximises its own profit, what happens?","o":[["They choose different ones; welfare is $145","The two firms face the same choices and incentives, so both choose (1)."],["Both choose (1); welfare is $140, not $150","Private profit is 80 > 75, so both choose (1); social welfare = (100 - 20 - 10) x 2 = 140 versus (100 - 25) x 2 = 150."],["Both choose (1); welfare is $160","This ignores the $10 cost each firm imposes on the other, which must be deducted from social welfare."],["Both choose (2); welfare is $150","Privately, (2) yields only $75 versus $80 for (1), so profit-maximisers choose (1)."]],"c":[1],"es":"Private optimum (1): $80 each; social welfare $140 < $150 under (2). The $10 externality causes the gap.","ed":"Each firm compares only private profit (80 vs 75) and picks the polluting technology. But each imposes $10 on the other, so social welfare under (1) is 2 x (100 - 20 - 10) = 140, while under (2) it is 2 x (100 - 25) = 150. The $10 negative externality makes the market outcome socially suboptimal. Internalising it (e.g. a $10 tax per unit of harm) would make (2) privately optimal, because (1) would then yield 100 - 20 - 10 = 70 < 75.","kt":"","src":"L3 slide 6-7"},{"id":"SB079","l":"L3","t":"Internalisation","f":"t","d":2,"p":"H","sc":"none","s":"True or false: In the two-firm example, a tax on the polluting technology equal to the damage it causes makes each firm's own choice also the best choice for both.","o":[["True","Correct. A tax equal to the external cost makes the polluter bear the full social cost, so private and social optimum coincide."],["False","Incorrect. A tax equal to the external cost makes the polluter bear the full social cost, so private and social optimum coincide."]],"c":[0],"es":"True: a damage-sized tax aligns private and social incentives.","ed":"Without the tax, each firm ignores the cost it imposes on the other and both may choose the polluting technology. Carbon taxes and ETS prices apply the same logic at economy scale.","kt":"Pigouvian tax: a tax equal to the marginal external damage, which internalises a negative externality.","src":"L3 slide 9-10 · Bok s. 42 (2.2)"},{"id":"SB080","l":"L3","t":"Market failure diagram","f":"m","d":3,"p":"H","sc":"none","s":"With a negative production externality, compared with the social optimum, the free market gives:","o":[["too much, at too low a price","Qe > Qso and Pe < Pso: the market overproduces because producers ignore the external cost."],["too much, at too high a price","The market price is lower, since producers do not pay for the external cost."],["too little, at too high a price","That would describe underproduction, typical of a positive externality, not a negative one."],["the same quantity","Demand is unchanged, but the relevant supply curve shifts once social costs are included, changing the optimum."]],"c":[0],"es":"Negative production externality: Qe > Qso and Pe < Pso (overproduction at too low a price).","ed":"The private supply curve reflects only marginal production cost. Adding the external cost gives the marginal societal cost (MSC) curve, which lies above it. Where demand (marginal societal benefit = marginal production benefit) meets MSC gives the socially optimal quantity Qso and price Pso. Because the market ignores the external cost, it produces Qe > Qso at Pe < Pso. Internalisation (taxes, regulation) moves the market towards Qso.","kt":"","src":"L3 slide 9-12"},{"id":"SB081","l":"L3","t":"Externalities","f":"m","d":2,"p":"H","sc":"short","s":"Which example is correctly classified?","o":[["Vaccines that protect other people - negative","Herd immunity is a positive externality."],["Factory pollution - negative production","A third party bears a cost from production."],["A bakery's nice smell - negative production","An unpaid benefit to others is positive."],["Traffic jams - positive consumption","Congestion imposes costs on others: negative."]],"c":[1],"es":"Ask: who bears the cost/benefit, is it priced, and does it come from production or consumption?","ed":"Negative externalities lead to overproduction (price too low), positive ones to underproduction. Sustainable finance focuses on how such externalities get internalised and become financially material.","kt":"Externality: a cost or benefit of an activity that falls on third parties and is not reflected in market prices.","src":"L3 slide 13 · Bok s. 36 (2.1)"},{"id":"SB082","l":"L3","t":"Enlarged production function","f":"m","d":3,"p":"H","sc":"none","s":"The textbook extends the production function Q = F(K, L) to q + w = F(K, L, N, S, H; r, e). The main point is that it:","o":[["proves waste is always zero","Waste is an explicit output; profit maximisation ignoring externalities tends to increase waste."],["replaces labour and capital with nature","K and L remain in the function; the extension adds inputs rather than replacing them."],["shows capital can always replace nature","The textbook stresses the opposite: natural resources are complementary and cannot be replaced by labour or capital."],["adds nature, people, energy and waste","The neoclassical function only includes physical capital and labour; ignoring the other inputs is the root cause of externalities."]],"c":[3],"es":"It adds N, S, H (funds) and r, e (flows) plus waste w, which the neoclassical function leaves out.","ed":"Daly and Farley distinguish funds (K, L, N, S, H), which provide services but are not embodied in the product, from flows (natural resources r and energy e) that are transformed into output q and waste w. N is natural capital (e.g. a forest's watershed protection), S social and relationship capital, H human capital. Leaving these out of decision-making - because they are unpriced - is the root cause of social and environmental externalities.","kt":"","src":"L3 slide 14 · Bok s. 40 (2.1) · Bok s. 41 (2.1)"},{"id":"SB083","l":"L3","t":"Enlarged production function","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Machines and labour can always replace natural resources, so a firm can make the same steel with less iron ore.","o":[["True","Incorrect. The textbook says the opposite: natural resources are complementary and cannot be substituted with labour or physical capital (you cannot make steel with less iron ore by adding machines); non-substitutability is called a principle of sustainability. Substitution is only possible between natural resources (e.g. aluminium for steel)."],["False","Correct. The textbook says the opposite: natural resources are complementary and cannot be substituted with labour or physical capital (you cannot make steel with less iron ore by adding machines); non-substitutability is called a principle of sustainability. Substitution is only possible between natural resources (e.g. aluminium for steel)."]],"c":[1],"es":"False: natural resources cannot be replaced by labour or capital, though some natural resources can replace others.","ed":"The Cobb-Douglas function stresses substitutability between capital and labour (e.g. machines replacing workers). Natural resources are different: they are complementary inputs, so you cannot make steel with less iron ore by adding labour. Substitution is possible between natural resources (light-weighting with aluminium, renewable energy instead of fossil fuels), often driven by exponential technological change.","kt":"","src":"Bok s. 41 (2.1)"},{"id":"SB084","l":"L3","t":"Natural resources","f":"m","d":3,"p":"L","sc":"none","s":"What makes a non-renewable resource run out fastest?","o":[["Switching to a renewable alternative","Substitution reduces demand for the scarce resource."],["Finding new reserves faster than demand grows","This lengthens the horizon."],["Rising demand and no new reserves","Higher demand over a fixed reserve base shortens the depletion horizon."],["More recycling","Lower primary demand lengthens the horizon."]],"c":[2],"es":"Higher demand on fixed reserves → faster depletion.","ed":"This motivates circular economy strategies (recycling, longer product life) and explains why scarce inputs (e.g. battery metals) can become material for firms that depend on them.","kt":"Depletion horizon: reserves divided by annual demand - the number of years a resource lasts at current use.","src":"Bok s. 39 (2.1.2)"},{"id":"SB085","l":"L3","t":"Internalisation of externalities","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Internalising an externality means making those who cause it bear its costs (or enjoy its benefits).","o":[["True","Correct. This is the definition on slide 15."],["False","Incorrect. This is the definition on slide 15."]],"c":[0],"es":"True: internalisation makes those responsible bear (or benefit from) the external effects of their actions.","ed":"Externalities are not reflected in market prices; internalisation brings them into prices and decisions. Mechanisms include taxes, quotas and subsidies (government), media pressure (civil society), integrating externalities in investment and lending and engaging with firms (investors), pricing externalities into business practices (corporates), buying sustainable products (consumers), and innovation by competitors.","kt":"","src":"L3 slide 15 · L3 slide 17"},{"id":"SB086","l":"L3","t":"Internalisation","f":"m","d":3,"p":"H","sc":"short","s":"After the Rana Plaza collapse (2013), clothing brands signed a safety accord and faced consumer boycotts. Which mechanism made them act?","o":[["Bank capital rules","Prudential rules played no role."],["Higher interest rates","Not a mechanism for social externalities."],["Damage to reputation","NGOs, consumers and unions pushed brands to bear supply-chain safety costs."],["A carbon tax on garment factories","No tax was involved; the issue was worker safety."]],"c":[2],"es":"Stakeholder pressure made brands internalise social costs in their supply chains.","ed":"Social externalities (unsafe work, low wages) in supply chains were long borne by workers. Pressure turned them into costs for brands: audits, safety investments and reputational risk. For investors, supply chain management becomes a material S issue.","kt":"Internalisation mechanisms: government (taxes, regulation), society/stakeholders (pressure, boycotts, litigation), and market/technology shifts.","src":"L3 slide 17 · Bok s. 52 (2.3.2)"},{"id":"SB087","l":"L3","t":"Internalisation mechanisms","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Competitors' innovation can force a firm to internalise its externalities, even without new laws.","o":[["True","Correct. Slide 17 states: \"Innovation by competitors may force companies to internalize their externalities!\""],["False","Incorrect. Slide 17 states: \"Innovation by competitors may force companies to internalize their externalities!\""]],"c":[0],"es":"True: competitors' cleaner innovations can force internalisation.","ed":"When competitors offer cleaner products at similar cost (e.g. cheaper solar and wind, electric cars), customers and investors compare, and the old production process becomes less competitive. This is why the textbook says it is in a firm's self-interest to internalise externalities early, before regulation, employees (talent drain) or the public (reputation, customer strikes) force it, and before assets become stranded.","kt":"","src":"L3 slide 17 · Bok s. 52 (2.3)"},{"id":"SB088","l":"L3","t":"Government intervention","f":"m","d":4,"p":"M","sc":"none","s":"When a planetary boundary is close to being crossed, why can quotas or bans be better than taxes?","o":[["Quotas let firms pollute more if they pay","Paying to pollute describes a tax; quotas cap the quantity."],["Quotas raise more tax money","Revenue is not the textbook's argument; quotas may raise no revenue at all unless auctioned."],["Taxes are not allowed for this under international law","Carbon taxes are used in many countries, e.g. Scandinavia."],["Quotas give more certainty about limits","With an uncertain demand curve, a tax gives an uncertain quantity; a quota fixes the quantity directly."]],"c":[3],"es":"Quotas fix quantity directly, which is safer when demand is uncertain and boundaries are critical.","ed":"In theory, a tax (price) and a quota (quantity) can reach the same outcome for a known demand curve. In practice demand is uncertain and shifts, so a tax gives an uncertain quantity. Where planetary boundaries are close to critical, quotas or complete bans (zero quota) give more certainty, as with the Montreal Protocol banning CFCs. Cap-and-trade (ETS) combines a quantity cap with tradable allowances that create a market price.","kt":"","src":"Bok s. 46 (2.2) · Bok s. 47 (2.2.1)"},{"id":"SB089","l":"L3","t":"Government intervention","f":"m","d":3,"p":"H","sc":"none","s":"Why is a Pigouvian tax a cost-effective way to cut emissions?","o":[["All firms must cut by the same percent","Uniform cuts ignore cost differences; that is not how a Pigouvian tax works."],["The government picks each firm's technology","That is command-and-control regulation, not a price instrument."],["Firms that can cut cheaply cut; others pay","Reductions happen where they are cheapest, which minimises the total cost of reaching the target."],["It guarantees an exact level of emissions","A tax fixes the price, not the quantity; quotas fix the quantity."]],"c":[2],"es":"A Pigouvian tax lets firms choose: cheap abaters cut, others pay, equalising marginal abatement cost at the tax.","ed":"A Pigouvian tax equals the marginal social cost of the damage. Firms with adjustment costs below the tax adjust; those with higher costs pay. In equilibrium marginal adjustment cost equals the tax, so a given reduction is achieved at minimum total cost. Stern sees a carbon tax as an efficient route to a low-carbon economy. An ETS (cap-and-trade) achieves a similar result by capping total emissions and letting firms trade allowances.","kt":"","src":"Bok s. 47 (2.2.1.1) · L3 slide 21"},{"id":"SB090","l":"L3","t":"Carbon pricing","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"The EU carbon price rises sharply. Cement maker A emits much more CO2 per tonne than cement maker B. What happens?","o":[["A's margins fall more; B gains an advantage","Internalisation hits emission-intensive producers hardest."],["Neither is affected, since the ETS is voluntary.","The EU ETS is mandatory for covered sectors."],["A gains, because it already has high emissions.","Higher emissions mean higher carbon costs."],["Both are affected equally, since they sell the same product.","Costs depend on emissions per tonne."]],"c":[0],"es":"Higher carbon intensity → larger cost increase → competitive disadvantage.","ed":"Internalisation changes value drivers (margins) and competitive positions. Analysts model this with carbon price scenarios; low-carbon producers can gain market share or pricing power.","kt":"Carbon intensity: emissions per unit of output; it determines exposure to carbon prices.","src":"L3 slide 21-22 · Bok s. 46 (2.2.1)"},{"id":"SB091","l":"L3","t":"Government intervention","f":"m","d":3,"p":"M","sc":"none","s":"Why have most governments not introduced effective carbon prices?","o":[["Fossil fuels are already taxed enough","Fossil fuels are actually subsidised; IMF estimates pre-tax subsidies of $333 billion."],["Carbon taxes always hurt growth a lot","Swedish evidence shows emission cuts without a negative impact on growth."],["Short horizons due to elections","Politicians follow public opinion rather than imposing taxes with long-term benefits."],["Carbon prices do not change behaviour","The Scandinavian experience shows carbon pricing can change behaviour."]],"c":[2],"es":"Free-riding/coordination failure, short election horizons, intergenerational trade-offs and climate uncertainty.","ed":"Four reasons are given: (1) coordination failure, since the benefits of mitigation are a global public good (free-rider effect); (2) short political horizons of up to four years; (3) intergenerational trade-offs, as the current generation may care less about future ones; (4) uncertainty about the caus
