borrow more cheaply","Unrelated to free-riding in monitoring."]],"c":[1],"es":"Small stakes → weak incentives to monitor → everybody free-rides on others' monitoring.","ed":"Monitoring is costly and its benefits are shared by all shareholders, so with small stakes the private benefit is below the cost. Widely diversified portfolios therefore lead to inadequate monitoring of corporate management on aggregate. Concentrated, active portfolios with larger stakes (e.g. Alecta, often among the largest shareholders) make engagement worthwhile. This mirrors Lecture 5 on blockholders and monitoring.","kt":"","src":"Bok s. 194 (7.3.3) · Bok s. 205 (Box 7.3) · L5 slide 9"},{"id":"SB307","l":"L8","t":"Alternative performance measures","f":"m","d":3,"p":"M","sc":"none","s":"Instead of one market benchmark, what does the textbook suggest for judging a fund?","o":[["The firms' earnings per share","EPS is the traditional value indicator in Table 7.1."],["Several sector indices","First alternative in section 7.3.5."],["The number of trades","Trading activity is not a performance measure."],["Daily tracking error","This is the traditional approach the textbook criticises."]],"c":[1],"es":"Alternatives: a range of indices, a peer group of comparable funds, and an absolute return target.","ed":"Relative benchmarking reduces funds to a few backward-looking metrics that encourage shortcuts. Using a range of indices, a peer group (Table 7.3: the fund beats 20% of peers over one year but 80% over three and five years) and an absolute return target (Table 7.4: 7% p.a., consistent with Jordà et al.'s long-run equity return) gives a wider context. The absolute target is tougher: the fund needs years to recover from -34.5% in 2008. Non-financial performance should also be measured (KPIs, externality valuation, SDG contribution). Also true, but not offered as an option here: An absolute return target, possibly corrected for an absolute risk metric.","kt":"","src":"Bok s. 195 (7.3.5) · Bok s. 196 (Table 7.3) · Bok s. 196 (Table 7.4)"},{"id":"SB308","l":"L8","t":"Alternative performance measures","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"A mining firm sells its underground mines in a developing country, and its injury rate (LTIFR) falls sharply. What does this show?","o":[["Safety at the other mines clearly improved","The improvement comes from portfolio composition, not from better conditions."],["It may reflect selling risky mines","The textbook uses exactly this divestment example."],["Safety KPIs do not matter","Safety is highly material in mining."],["The number is fully reliable","KPIs are hard to compare across firms and over time."]],"c":[1],"es":"Single KPIs can change through boundary shifts; they are narrow, hard to compare and need expert interpretation.","ed":"Limitations of specific KPIs: (1) each is too narrow for a holistic view; (2) they are hard to compare across companies and industries and over time (boundaries change, e.g. divesting high-LTIFR units); (3) they may not measure what matters (scope 1-3 omit avoided emissions, e.g. Novozymes' 76 million tons); (4) it is unclear whether good KPI performance is sufficient for a sustainable model. Externality valuation (True Price, KPMG True Value) is more holistic but slow and allows netting of pluses and minuses.","kt":"","src":"Bok s. 197 (7.3.6.1) · Bok s. 198 (7.3.6.1)"},{"id":"SB309","l":"L8","t":"Alternative performance measures","f":"m","d":3,"p":"M","sc":"none","s":"KPMG's True Value method has three steps. Which order is correct?","o":[["SDG target → offsets → report","Not the True Value steps."],["True earnings → at risk → business cases","These are the three steps in Box 7.2."],["Beta → tracking error → information ratio","These are traditional performance metrics."],["Exclude → rank → invest","This describes screening."]],"c":[1],"es":"1) True earnings bridge (material externalities); 2) earnings at risk from regulation, stakeholders, markets; 3) value-creating business cases with True Value NPV.","ed":"KPMG argues the gap between corporate and societal value is closing as externalities are internalised via regulation and standards, stakeholder action and market dynamics. Step 1 quantifies material externalities in a \"true earnings bridge\"; step 2 assesses earnings at risk using scenario analysis; step 3 builds business cases whose True Value NPV includes future returns from internalised externalities, compared via a marginal True Value curve. The textbook uses \"integrated value\" for the same idea.","kt":"","src":"Bok s. 199 (Box 7.2) · Bok s. 198 (7.3.6.2) · L3 slide 17"},{"id":"SB310","l":"L8","t":"SDG tagging","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"A fund tags its holdings: a hospital (+SDG 3), a coal miner (−SDG 13) and a bank (neutral). What can it learn?","o":[["Nothing","The approach maps companies to SDGs."],["Each firm's exact impact","Tagging is qualitative, not precise measurement."],["A rough SDG picture","Schramade argues tagging works even with limited data."],["The firms' credit ratings","Tagging is about SDG exposure, not credit risk."]],"c":[2],"es":"Tagging gives a rough but useful view of SDG exposure.","ed":"Roughly 20% of companies are SDG positive, 20% negative and 60% neutral. Tagging helps identify which holdings need engagement and which align with transition themes, and is a first step towards impact measurement.","kt":"SDG tagging: marking holdings as positive, neutral or negative for each SDG to estimate a portfolio's exposure.","src":"Bok s. 200 (7.3.6.3)"},{"id":"SB311","l":"L8","t":"Conditions for LTVC","f":"m","d":2,"p":"H","sc":"none","s":"Which is a condition for investing for long-term value creation (De Jong et al., 2017)?","o":[["Keep the investment chain short","This is condition 6 in Figure 7.6."],["Leave engagement to proxy advisors","Condition 3 calls for effective engagement linked to investment analysis."],["Stay close to the market index","A tight tracking error prevents the deviations needed for LTVC."],["Judge managers quarterly","Condition 4 calls for performance analysis of value added in the real economy."]],"c":[0],"es":"1 long horizons; 2 active, concentrated portfolios; 3 effective engagement; 4 performance analysis of real value added; 5 long-term mandate alignment; 6 short chains.","ed":"The conditions reinforce each other: long horizons (5+ years intended holding), active management of concentrated portfolios (enables fundamental ESG analysis and is necessary for engagement), effective engagement behind the scenes and by voting, performance analysis based on value added in the real economy (financial, social, environmental), long-term alignment of mandates with incentives and investment beliefs, and short investment chains (each extra party adds complexity and shortens accountability periods). Also true, but not offered as an option here: Long-term alignment of the mandates of asset owners and asset managers.","kt":"","src":"Bok s. 202 (7.4) · Bok s. 202 (Figure 7.6) · Bok s. 204 (7.4.5) · Bok s. 204 (7.4.6) · L8 slide 74"},{"id":"SB312","l":"L8","t":"Conditions for LTVC","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"Swedish pension fund Alecta holds about 104 stocks for 15-20 years, does its own analysis and engagement, and has costs of 0.09%. What does this show?","o":[["Long-term investors must outsource analysis","Alecta relies on independent in-house analysis."],["104 stocks is not diversified enough","Statman shows 50-100 stocks remove most idiosyncratic risk."],["Focused investing can be cheap","Cutting external managers and consultants kept costs at 0.09% while enabling dialogue."],["Active management is always more expensive","Alecta's costs are very low because it cut out external managers and consultants."]],"c":[2],"es":"Alecta shows LTVC conditions in practice: long horizon, concentration, in-house analysis, engagement, short chain, low costs.","ed":"Alecta (€81bn AUM in 2016) focuses on absolute return and risk over five-year averages, reviews sustainability before each investment, and as a large shareholder engages closely. Its short chain (no external managers or consultants) both aligns incentives and cuts costs (investment management costs 0.02%). Returns 2012-16 averaged 9.1% p.a. This contrasts with NBIM's near-index approach in Box 7.1.","kt":"","src":"Bok s. 205 (Box 7.3) · Bok s. 204 (7.4.6)"},{"id":"SB313","l":"L8","t":"Ideal investment chain","f":"m","d":4,"p":"M","sc":"none","s":"In the textbook's \"often observed\" investment chain, a typical company:","o":[["maximises EPS and has short-term pay","This is the \"often\" column for the investee company."],["hires many asset managers","This describes a typical asset owner."],["maximises integrated value over decades","This is the \"ideally\" column."],["holds many small stakes","This describes a typical asset manager."]],"c":[0],"es":"Often: tenure horizon, EPS focus, short-term pay, traditional reporting. Ideally: decades, IV = FV + SV + EV, aligned pay, IR.","ed":"Ideally, the asset owner has a decades-long horizon, maximises IV, is simple and flat, uses few managers and nuanced metrics; the asset manager has a horizon of years, concentrated portfolios and engagement on all holdings linked to investment decisions; the company balances long-term and short-run execution, aligns pay with LTVC and reports in an integrated way. In practice, horizons are quarterly, chains bureaucratic and metrics narrow. The HLEG (2018) recommends including sustainability in fiduciary duty.","kt":"","src":"Bok s. 200 (7.3.7) · Bok s. 201 (Figure 7.5)"},{"id":"SB314","l":"L8","t":"UN PRI","f":"m","d":2,"p":"M","sc":"none","s":"Which is one of the six UN Principles for Responsible Investment (PRI)?","o":[["Guarantee returns above the market","The principles concern ESG incorporation, not return guarantees."],["Invest only in Article 9 funds","SFDR categories are not part of the PRI."],["Be active owners and use ESG","This is PRI principle 2."],["Sell all fossil fuel firms","The PRI does not mandate blanket divestment."]],"c":[2],"es":"PRI: incorporate ESG in analysis; active ownership; seek disclosure; promote the principles; collaborate; report on progress.","ed":"The six PRI principles commit signatories to (1) incorporate ESG issues into investment analysis and decisions; (2) be active owners; (3) seek appropriate ESG disclosure from investees; (4) promote acceptance and implementation in the industry; (5) work together to enhance effectiveness; (6) report on activities and progress. Slide 76 states the PRI's mission: a sustainable global financial system, encouraged through adoption of the principles, good governance and addressing obstacles in market practices, structures and regulation.","kt":"","src":"L8 slide 75-76"},{"id":"SB315","l":"L8","t":"Integrated LTVC investing","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A pension fund tracks an ESG index closely, judges its manager quarterly and follows proxy advisors' votes. Which change moves it MOST towards long-term value creation?","o":[["A focused, engaged mandate","This addresses conditions 1-6: horizon, concentration, engagement, performance, alignment and chain length."],["A rating provider that gives higher scores","Ratings are imprecise shortcuts; changing provider does not change the approach."],["A tighter tracking error limit","This makes the portfolio even more passive."],["More external managers","This lengthens the investment chain (condition 6)."]],"c":[0],"es":"LTVC needs long horizons, concentrated active portfolios, real engagement, real-economy performance analysis, aligned mandates and short chains.","ed":"The starting situation is SF 1.0-1.5: a screened passive index (exclusions), tight tracking error, quarterly evaluation, proxy-advisor voting and rating-based reporting. Each element conflicts with the textbook's conditions. A concentrated in-house mandate with fundamental ESG analysis (transition preparedness), engagement integrated with investment cases, multi-year and absolute or real-economy performance measures and fewer intermediaries moves it towards SF 2.0. The trade-off: more cost and active risk, which the Alecta case suggests can be managed.","kt":"","src":"Bok s. 180 (Table 7.1) · Bok s. 202 (Figure 7.6) · Bok s. 186 (Box 7.1) · Bok s. 205 (Box 7.3) · L8 slide 71-74"},{"id":"SB316","l":"L8","t":"Investment chain","f":"m","d":3,"p":"M","sc":"short","s":"NBIM uses external managers for part of the oil fund. What risk does each extra link in the chain create?","o":[["Less diversification","Mandates can increase diversification."],["Sure underperformance","Chains create risks, not guaranteed underperformance."],["No risk","Goals and incentives are rarely fully aligned."],["Different horizons","Each principal-agent link can shorten horizons and lose information."]],"c":[3],"es":"More links → more agency problems, shorter horizons, lost information.","ed":"The remedy is aligned, long-term mandates and short chains (conditions 5 and 6 for LTVC). Alecta shows a short, in-house chain can be both low-cost and engaged.","kt":"Investment chain: the sequence of parties between the ultimate saver and the company (beneficiaries, asset owner, asset managers, companies).","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 204 (7.4.6)"},{"id":"SB317","l":"L8","t":"Financing lifecycle","f":"m","d":4,"p":"M","sc":"short","s":"Battery maker Northvolt raised billions but went bankrupt in 2024-25 after production problems. What does this show?","o":[["Green labels do not remove risk","Technology and scale-up risk remain, whatever the climate benefit."],["Green projects cannot default","Northvolt shows they can."],["Only equity can fund green tech","Northvolt was privately financed with equity and debt."],["Banks should never fund new technology","The lesson is to price and structure the risk, not to avoid it entirely."]],"c":[0],"es":"Green ≠ low risk: execution risk dominates in scale-ups.","ed":"The textbook notes green projects are not necessarily safer (technology uncertainty), which is why it opposes lower capital weights for green loans (Lecture 11). Investors need fundamental analysis of business models, not labels.","kt":"Execution (scale-up) risk: the risk that a firm cannot turn a technology into reliable, profitable large-scale production.","src":"L8 slide 12 · Bok s. 301 (10.4.5)"},{"id":"TR31","l":"L8","t":"Double materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A cement maker emits a lot, and rising carbon prices squeeze its margins. How does double materiality apply?","o":[["Only financial materiality applies","Externalities are exactly what impact materiality captures."],["Neither applies","Necessity does not remove material impacts or risks."],["Impact: carbon costs; financial: emissions","The two labels are reversed."],["Impact: emissions; financial: carbon costs","Both directions are present: firm → environment and environment/policy → firm."]],"c":[3],"es":"Impact = firm on world; financial = world on firm.","ed":"The lecturer stresses the loop: a firm's impact on environment and society can feed back into its financial performance (e.g. via carbon pricing, regulation, customers). CSRD/ESRS reporting uses double materiality; SASB uses mainly financial materiality.","kt":"Double materiality: an issue is material if the firm affects people/environment (impact) or the issue affects the firm's value (financial), or both.","src":"Opptak L8 ca. 65 min · Opptak L1 ca. 80 min"},{"id":"TR32","l":"L8","t":"Portfolio theory with sustainability","f":"m","d":3,"p":"M","sc":"none","s":"An investor adds a limit on portfolio emissions to the mean-variance problem. What happens?","o":[["Diversification is impossible","Diversification is still possible within the allowed assets."],["More choices, so a higher Sharpe ratio","A constraint can only remove options, never add them."],["Nothing changes","The emission constraint removes some portfolios."],["Equal or lower Sharpe ratio","Adding a constraint cannot improve the optimum; high-return polluters drop out."]],"c":[3],"es":"Extra constraint → smaller feasible set → Sharpe ratio not higher.","ed":"This is the SF 1.0 view: maximise return subject to risk AND emission limits. The lecturer adds a caveat: in the long run, if physical and transition risks hit polluters, the green portfolio may not underperform.","kt":"","src":"Opptak L8 ca. 13 min · Opptak L8 ca. 17 min"},{"id":"TR33","l":"L8","t":"Asset manager materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"An asset manager holds many weapons producers. What is also a material issue for the asset manager itself?","o":[["Its holdings' issues","An investor's material issues include those of its portfolio companies."],["None","The lecture says investors inherit their holdings' material issues."],["Only beating the benchmark","Performance is a financial outcome, not the material issue in question."],["Only its own office energy use","Own operations are a minor part of an asset manager's impact."]],"c":[0],"es":"Investors inherit the material issues of their holdings.","ed":"SASB lists direct issues for asset managers (product labelling and greenwashing, employee diversity, systemic risk, business ethics), but the lecturer stresses the indirect ones from the portfolio. Materiality matrices also differ between institutions (e.g. UBS vs Santander), so analysis must be firm-specific.","kt":"","src":"Opptak L8 ca. 37 min · Opptak L8 ca. 39 min"},{"id":"TR34","l":"L8","t":"Financing life cycle","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"Two students have an idea for carbon capture technology but no revenue yet. Which financing fits best?","o":[["A share issue on the stock exchange","Seasoned offerings are for already-listed firms."],["A big bank loan","There are no cash flows to lend against yet."],["Savings, family and grants","Pre-revenue ideas rely on savings, \"family, friends and fools\" and public grants."],["A corporate bond","Bond markets require scale and a track record."]],"c":[2],"es":"Pre-revenue: savings, FFF and grants; later angels, VC, then M&A or IPO.","ed":"Sequence in the lecture: research grants and own funds → government grants → angel investors and venture capital (once running) → M&A or IPO as exit → seasoned equity offerings and bonds. Impact investing is mostly done through private equity at these earlier stages.","kt":"","src":"Opptak L8 ca. 22 min"},{"id":"TR35","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A fund drops the whole oil and gas sector, then keeps only firms with below-average emissions in each other sector. This is:","o":[["Thematic, then impact investing","No single theme or measured impact intent is described."],["Negative screening, then best-in-class","Sector exclusion is negative screening; within-sector ranking is best-in-class."],["ESG integration, then tilting","No valuation adjustments are described."],["Norms-based screening, then stewardship","No international norms or engagement are involved."]],"c":[1],"es":"Excluding a sector = negative; ranking within a sector = best-in-class.","ed":"The lecturer expects these two to be combined in practice. She also advises using concrete metrics (emissions, specific KPIs) rather than overall ESG scores, given rating divergence.","kt":"","src":"Opptak L8 ca. 31 min · Opptak L8 ca. 36 min"},{"id":"TR36","l":"L8","t":"Passive investing and governance","f":"m","d":3,"p":"H","sc":"none","s":"Why is \"exit\" mainly a governance tool for active investors, even though index funds also sell shares?","o":[["Their sales follow index rules","Their trades follow index rules, so they send no signal about the firm's behaviour."],["Index funds cannot vote","Passive funds can and do vote; voting is open to them."],["Exit never works","Exit can discipline managers when used by active investors."],["Index funds are never allowed to sell","They do sell, e.g. when firms leave the index."]],"c":[0],"es":"Passive sales track the index, so they carry no disciplinary message.","ed":"Active investors can use engagement, voting and exit; passive investors mainly voting. With the shift to passive investing (supported by CAPM and efficient markets), a key sustainability lever weakens: this is one of the barriers to integrating sustainability.","kt":"","src":"Opptak L8 ca. 77 min · Opptak L8 ca. 78 min"},{"id":"TR37","l":"L8","t":"ESG integration","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Analyst A drops all fossil fuel firms because she dislikes them. Analyst B keeps them but lowers their forecast cash flows for carbon costs. What is B doing?","o":[["ESG integration","B analyses how ESG issues affect cash flows and value."],["Impact investing","B is not targeting a measured social or environmental outcome."],["Norms-based screening","No international norms are applied."],["Negative screening","That describes Analyst A."]],"c":[0],"es":"Adjusting forecasts for material ESG issues = ESG integration.","ed":"BlackRock's description used in the lecture: ESG integration uses financially material ESG information to identify risks and opportunities, and is not just a values-based exercise. Starks would call A a values investor and B a value investor.","kt":"","src":"Opptak L8 ca. 52 min"},{"id":"TR38","l":"L8","t":"Impact investing","f":"t","d":2,"p":"H","sc":"none","s":"True or false: Since impact investing (SF 3.0) puts social and environmental goals first, an impact fund may run at a loss year after year.","o":[["True","Incorrect. The lecturer stresses impact investing is not charity: there is still a required (lower) financial return, entering as a constraint."],["False","Correct. The lecturer stresses impact investing is not charity: there is still a required (lower) financial return, entering as a constraint."]],"c":[1],"es":"False: impact investing still needs a financial return.","ed":"Key features: intentional, measurable positive impact alongside a financial return. Financial return is a constraint (lower bound) rather than the objective. It is mostly done through private equity, but can also use fixed income and public equity.","kt":"","src":"Opptak L8 ca. 67 min · Opptak L9 ca. 85 min"},{"id":"CX068","l":"L9","t":"Channels from ESG to value","f":"m","d":2,"p":"H","sc":"none","s":"A firm with strong ESG gets cheaper loans and a lower cost of equity. Here ESG affects value through:","o":[["Tax rates","Det er ikke en av kanalene i faget."],["Cash flows","Cash flow-kanalen handler om salg, kostnader og bøter."],["Cost of capital","Lavere finansieringskostnad gir høyere verdi."],["Share count","Det finnes ikke en slik kanal."]],"c":[2],"es":"Billigere finansiering = cost of capital channel.","ed":"To hovedkanaler: cash flows (f.eks. søksmål, karbonavgift) og cost of capital. Foreleser anbefaler å legge ESG inn via kontantstrømmene i verdsettelse.","kt":"","src":"L9 slide 3 · L9 slide 11","k":1},{"id":"CX069","l":"L9","t":"ESG integration in valuation","f":"t","d":2,"p":"H","sc":"none","s":"Does the lecturer recommend adjusting the WACC as the main way to integrate ESG into a valuation?","o":[["Yes","Feil. Hun anbefaler å justere kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig."],["No","Riktig. Hun anbefaler å justere kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig."]],"c":[1],"es":"Nei: juster kontantstrømmen, ikke WACC.","ed":"Justerer du både kontantstrøm og WACC for samme risiko, teller du risikoen to ganger.","kt":"","src":"Opptak L9 ca. 16 min · Opptak L9 ca. 36 min · Opptak L9 ca. 69 min","k":1},{"id":"CX070","l":"L9","t":"Green vs brown returns","f":"m","d":2,"p":"H","sc":"none","s":"According to Pástor, Stambaugh and Taylor, compared with brown assets, green assets' expected returns are:","o":[["Exactly the same","Smak og hedging gir en forskjell."],["Higher","Det er brune som må gi høyere forventet avkastning."],["Lower","Grønt er populært og en hedge mot klimarisiko, så prisen er høy og forventet avkastning lav."],["Unrelated to climate","Klimarisiko er nettopp mekanismen."]],"c":[2],"es":"Grønt: lavere forventet avkastning.","ed":"Brune aksjer er mindre populære og mer utsatt for klimarisiko, så de må tilby høyere forventet avkastning.","kt":"","src":"L9 slide 14-16","k":1},{"id":"CX071","l":"L9","t":"Green vs brown returns","f":"m","d":2,"p":"H","sc":"short","s":"When green stocks jump after a surprise climate subsidy, their future expected returns are:","o":[["They will be permanently higher","Høy pris nå betyr ikke høyere avkastning fremover."],["They will fall to zero for several years","Det er for bastant."],["Not higher: it was a one-time price jump","Sjokket ga et engangshopp i prisen."],["They will equal those of brown stocks from now on","I likevekt er grønn forventet avkastning lavere."]],"c":[2],"es":"Uventet nyhet = engangshopp, ikke høyere forventet avkastning.","ed":"Realised return (det du fikk) ≠ expected return (det du kan forvente). Grønne aksjer gjorde det bra fordi klimabekymringen økte uventet.","kt":"","src":"L9 slide 14 · L9 slide 17-18","k":1},{"id":"CX072","l":"L9","t":"Is ESG a risk factor","f":"t","d":2,"p":"H","sc":"none","s":"Is ESG a well-established risk factor, like the market factor?","o":[["Yes","Feil. Det finnes ingen robust evidens for en stabil ESG-premie på tvers av definisjoner og land."],["No","Riktig. Det finnes ingen robust evidens for en stabil ESG-premie på tvers av definisjoner og land."]],"c":[1],"es":"Nei: ingen robust ESG-faktor.","ed":"En faktor må ha solid forskning bak seg og være robust på tvers av definisjoner og land. ESG klarer ikke disse testene.","kt":"","src":"L9 slide 22 · L9 slide 24 · L9 slide 26","k":1},{"id":"CX073","l":"L9","t":"ESG as a risk factor","f":"m","d":2,"p":"H","sc":"none","s":"A risk that can be diversified away is:","o":[["A rise in all interest rates","Rammer hele markedet = systematisk."],["A scandal at one company","Selskapsspesifikk risiko forsvinner i en bred portefølje."],["Economy-wide climate change","Rammer mange samtidig = mulig systematisk."],["A global recession","Rammer alle = systematisk."]],"c":[1],"es":"Ett selskap = diversifiserbart.","ed":"Derfor gir slik risiko ingen risikopremie. Klima er annerledes: det kan ramme hele økonomien og er derfor muligens systematisk.","kt":"","src":"Opptak L9 ca. 59 min · Opptak L9 ca. 68 min","k":1},{"id":"CX074","l":"L9","t":"Is ESG a risk factor","f":"m","d":2,"p":"H","sc":"none","s":"Bolton and Kacperczyk find higher stock returns for high-emission firms. The best interpretation is that:","o":[["Carbon risk is not priced at all","Premien viser at den er priset."],["High emitters are better managed firms","Studien sier ikke det."],["Investors want pay for carbon risk","Det er en carbon premium: betalt for å bære risikoen."],["Green firms are riskier than brown firms","Det er motsatt."]],"c":[2],"es":"Høyere avkastning = kompensasjon for karbonrisiko.","ed":"Dette passer med Pástor m.fl.: brune aksjer må tilby høyere forventet avkastning.","kt":"","src":"L9 slide 27 · L9 slide 15","k":1},{"id":"CX075","l":"L9","t":"DCF valuation","f":"m","d":2,"p":"H","sc":"none","s":"To go from enterprise value to equity value, you:","o":[["Divide by the tax rate","Skatt er allerede i kontantstrømmen."],["Add net debt","Gjeld skal trekkes fra."],["Multiply by the WACC","WACC brukes til diskontering, ikke her."],["Subtract net debt","Gjelden tilhører långiverne."]],"c":[3],"es":"Equity = EV − net debt.","ed":"Enterprise value er verdien for både eiere og långivere. Trekk fra det långiverne skal ha, og del på antall aksjer for verdi per aksje.","kt":"","src":"L9 slide 5 · Bok s. 215 (8.1.2) · Bok s. 217 (Table 8.2)","k":1},{"id":"CX076","l":"L9","t":"Engagement and divestment","f":"m","d":2,"p":"H","sc":"none","s":"Cohen, Gurun and Nguyen question excluding energy firms from ESG funds because:","o":[["Energy firms always have high ESG ratings","De har ofte lave ESG-scorer."],["Energy firms never emit CO2","Det stemmer ikke."],["Excluding them is illegal","Det er helt lovlig å ekskludere dem."],["They produce many green patents","Ekskluderte energiselskaper er viktige grønne innovatører."]],"c":[3],"es":"Ekskludering kan ramme de som innoverer mest grønt.","ed":"Et argument for engagement fremfor ren ekskludering: man beholder innflytelsen over selskapene som utvikler grønn teknologi.","kt":"","src":"L9 slide 33 · L8 slide 58","k":1},{"id":"EX07","l":"L9","t":"Exam sample: channels from ESG to value","f":"m","d":2,"p":"H","sc":"none","s":"ESG issues can affect firm value through which channel:","o":[["Tax channel","Det er ikke en av kanalene i faget."],["Cash flow channel","Foreleserens fasit: ESG påvirker salg, kostnader, investeringer og bøter, og dermed kontantstrømmen."],["Cost of capital channel","Faget nevner også denne kanalen, men foreleserens fasit er cash flow. Hun anbefaler å legge ESG inn via kontantstrømmene."],["Dividend channel","Det er ikke en av kanalene i faget."]],"c":[1],"es":"Foreleserens fasit: cash flow channel.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nObs: boka beskriver også en cost of capital channel. Foreleser anbefaler likevel å legge ESG inn via kontantstrømmene, fordi evidensen for ESG og kapitalkostnad ikke er entydig. På eksamen: velg cash flow når bare én kanal kan være riktig.","kt":"","src":"L9 slide 3 · L9 slide 11","k":1,"x":1},{"id":"SB318","l":"L9","t":"Channels from ESG to value","f":"m","d":3,"p":"H","sc":"short","s":"Bayer agreed in 2020 to pay about USD 10 billion to settle lawsuits claiming its weedkiller Roundup caused cancer. Through which channel did this hit value?","o":[["Only the cost of capital","The settlements are cash costs."],["Cash flows: legal costs","Settlements are direct cash outflows (a liability for past externalities)."],["Neither","Product safety and health impacts are material S issues."],["Higher Roundup sales","Litigation reduced, not raised, value."]],"c":[1],"es":"Litigation = cash flow channel (liabilities for past externalities).","ed":"The NorSIF guide lists \"liabilities for past externalities\" as a separate valuation element. Due diligence before M&A should assess such product and legal risks; the reputational hit may also raise risk premia (cost of capital channel).","kt":"Cash flow channel: ESG affects value through revenues, costs (incl. litigation), capex and stranded assets.","src":"L9 slide 3 · L9 slide 11"},{"id":"SB319","l":"L9","t":"Valuation methods","f":"m","d":2,"p":"H","sc":"none","s":"Why does the textbook prefer a DCF valuation over multiples for ESG integration?","o":[["A DCF shows the assumptions","Multiples rely on correct peer pricing and imply the same assumptions while giving a false sense of objectivity."],["A DCF needs no forecasts","A DCF relies heavily on forecasts of cash flows and the cost of capital."],["Multiples cannot be calculated here","Multiples are easy to compute when EPS is positive; the issue is what they assume."],["P/E ratios are banned","No such prohibition exists."]],"c":[0],"es":"DCF: explicit, adjustable assumptions on value drivers. Multiples: depend on comparables being fairly priced and comparable.","ed":"With relative valuation, P = EPS x (P/E of peers) - e.g. Unilever with EPS €2.8 and peer P/E 20 is valued at €56. But peers may be mispriced, and true comparables are rare. A DCF values the firm as the present value of free cash flows at the WACC; assumptions on growth, margins, capex and cost of capital are explicit, so an analyst can state precisely where they disagree with the market - exactly what ESG integration requires. Risk: analysts simply extrapolate recent history.","kt":"","src":"L9 slide 4 · Bok s. 214 (8.1.2) · Bok s. 218 (8.1.2)"},{"id":"SB320","l":"L9","t":"DCF valuation","f":"m","d":2,"p":"H","sc":"none","s":"In a DCF, how do you go from enterprise value to equity value?","o":[["Add net debt","Debt is a claim of other financiers and must be subtracted."],["Discount it again","Discounting is already done when computing enterprise value."],["Multiply by the equity share","Equity value is a residual, not a WACC-weighted share."],["Subtract net debt","Enterprise value is the value to all financiers; equity holders are residual claimants."]],"c":[3],"es":"Equity value = enterprise value − net debt (and other non-equity claims such as pensions, leases, options).","ed":"FCF = cash from operations − investment (NOPLAT + depreciation − capex − increase in NWC). Discounting FCFs at the WACC gives enterprise value, the value to all financiers. Subtracting net debt and other non-equity claims gives equity value; divide by shares outstanding for a fair price (Table 8.2: EV 13,798 − net debt 1,328 = 12,470; /213 shares = 58.5 vs a market price of 60.2). FCF is preferred to earnings because earnings are easier to manipulate via accruals.","kt":"","src":"L9 slide 5 · Bok s. 215 (8.1.2) · Bok s. 217 (Table 8.2)"},{"id":"SB321","l":"L9","t":"DCF valuation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In V0 = FCF1 / (WACC − g), a higher growth rate g (with the same WACC) lowers the firm's value.","o":[["True","Incorrect. A higher g shrinks the denominator (WACC − g), so value rises; the formula is very sensitive when g approaches the WACC."],["False","Correct. A higher g shrinks the denominator (WACC − g), so value rises; the formula is very sensitive when g approaches the WACC."]],"c":[1],"es":"False: higher g → smaller (WACC − g) → higher value.","ed":"Koller, Goedhart and Wessels simplify the DCF to V0 = FCF1/(WACC − g). Small changes in g or WACC move value a lot, which is why the textbook appendix (slide 8) asks for sensitivities of ±1% in growth, margins and cost of capital, and what value drivers the current share price implies. ESG can affect both: durable competitive advantages support growth and margins, while risk perceptions affect the WACC.","kt":"","src":"Bok s. 215 (8.1.2) · L9 slide 8"},{"id":"SB322","l":"L9","t":"DCF valuation","f":"m","d":3,"p":"M","sc":"none","s":"An analyst uses the consensus forecast, except she sets the EBIT margin at 16% instead of 12%. What happens to fair value?","o":[["It falls","Taxes rise, but after-tax cash flows still rise."],["It rises by exactly 4%","A 4 percentage point margin change is a one-third increase in EBIT, with a much larger value effect."],["It does not change","Margins drive EBIT, NOPLAT and FCF."],["It rises by over 4%","The textbook reports a 35% higher fair value."]],"c":[3],"es":"12% → 16% EBIT margin raises fair value by about 35%.","ed":"A DCF lets the analyst be explicit about where they disagree with the market. Here only the margin assumption changes, yet fair value rises about 35%. This is the logic of the value driver adjustment (VDA) approach: if a material ESG competency gives a real competitive advantage, it should show up in value driver assumptions (growth, margins, capital), with potentially large valuation effects.","kt":"","src":"Bok s. 218 (8.1.2)"},{"id":"SB323","l":"L9","t":"Value drivers","f":"m","d":2,"p":"H","sc":"none","s":"Where does sustainability usually link to value drivers?","o":[["Only in the terminal growth rate","It can affect all value drivers in all periods."],["Only for energy firms","Material issues exist in every industry, though they differ."],["Through growth, margins and capital","E.g. a miner with better stakeholder management has fewer delays and lower costs."],["Add the ESG rating to the share price","Integration works through value drivers, not a bolt-on premium."]],"c":[2],"es":"Material ESG intangibles (human, intellectual, social capital) underlie the value drivers.","ed":"Koller et al. split value into sales (volume, price), margins (by cost type) and capital (cost of capital and uses: capex, working capital). Behind these are sources of competitive advantage, often intangibles on material ESG issues. Example: a miner good at managing local stakeholders and safety has lower costs; a miner with low costs from ignoring safety and paying poorly has a temporary advantage with a high risk of disruption, which should be reflected in its cost of capital. Slide 6 lists sales growth, margins, capex and cost of capital.","kt":"","src":"L9 slide 6 · Bok s. 218 (8.1.2)"},{"id":"SB324","l":"L9","t":"Why sustainability matters","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Business models are the \"missing link\" between ESG and finance; because few see this link, material ESG issues are often mispriced, which creates opportunities.","o":[["True","Correct. Section 8.2 makes both points (Figures 8.2 and 8.3)."],["False","Incorrect. Section 8.2 makes both points (Figures 8.2 and 8.3)."]],"c":[0],"es":"True: business models link ESG to value drivers; poor recognition leaves material issues mispriced.","ed":"Figure 8.3 runs from company purpose, products and stakeholders, through material sustainability issues, to competitive positions and business models, to value drivers. Financial analysts and ESG analysts both study business models only casually, so they miss the link. Shareholder value is typically the outcome of satisfying customers and other stakeholders. Since material issues are not well priced, ESG analysis is a natural extension of fundamental analysis and a source of alpha (consistent with the AMH).","kt":"","src":"Bok s. 219 (8.2) · Bok s. 219 (Figure 8.3) · Bok s. 220 (8.2)"},{"id":"SB325","l":"L9","t":"ESG integration in valuation","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"After ESG adjustments, CESGA's enterprise value is 882,379. It has cash of 40,000, debt of 600,000 (thousands) and 20 million shares. What is the equity value?","o":[["882,379","Equity value requires adjusting for cash and debt, and ESG lowered the price."],["242,379 (about 12 per share)","Cash must be added, not subtracted."],["322,379 (about 16 per share)","882,379 + 40,000 − 600,000 = 322,379, giving 16 per share."],["1,522,379 (about 76 per share)","Debt must be subtracted and cash added, not the reverse."]],"c":[2],"es":"Equity = EV + cash − debt = 882,379 + 40,000 − 600,000 = 322,379 → 16 per share vs 20 without ESG.","ed":"The CESGA example adjusts cash flows for (S) lower revenues in years 1-3 from litigation and reputational damage over poor employee treatment, (G) additional taxes due to tax avoidance, (E) higher market share in years 4-5 from better products, and (E) extra capex for better batteries. The terminal value uses CF(1+g)/(r − g). Net effect: a significantly lower share price (16 vs 20), showing how material E, S and G issues move value through specific cash flow lines.","kt":"","src":"L9 slide 9-10"},{"id":"SB326","l":"L9","t":"ESG integration in valuation","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In the CESGA example, which ESG adjustment is matched with the right pillar?","o":[["More market share from better products - Social","Labelled E: driven by environmentally better products."],["Higher growth from good governance - Social","No such adjustment is in the example."],["Lower debt from the lawsuit - Environmental","No such adjustment is made."],["Extra taxes from tax avoidance - Governance","Labelled G on slide 9."]],"c":[3],"es":"S: litigation/reputation → revenues; G: tax avoidance → taxes; E: better products → market share; E: battery capex.","ed":"ESG integration is concrete when each material issue is mapped to a specific line in the cash flow model: revenues (S litigation, E market share), taxes (G tax avoidance) and capex (E batteries). The textbook's VDA approach does the same at the level of value drivers. Governance issues are often reflected in the cost of capital, and innovation issues in growth and margins. Also true, but not offered as an option here: Lower operating revenues in years 1-3 due to litigation over bad employee treatment - Social.","kt":"","src":"L9 slide 9-10 · Bok s. 231 (8.3.1.1)"},{"id":"SB327","l":"L9","t":"Materiality analysis","f":"m","d":2,"p":"H","sc":"none","s":"The textbook's materiality table asks three things about each material ESG factor. Which set is correct?","o":[["ESG rating, index weight, price reaction","Ratings and index weights are not the columns."],["Carbon, water and waste","Material issues are not limited to environmental footprints."],["Performance, edge, value driver","These are the three columns."],["News, NGO campaigns, lawsuits","Controversy counts are not the framework."]],"c":[2],"es":"For each material factor: (i) performance, (ii) competitive edge or disadvantage, (iii) impact on value drivers.","ed":"The appendix workflow (8.1A-8.10A) moves from business model and competitive position, through value drivers, management quality, sustainability (materiality table), strategy, forecasts of growth, margins, capex and cost of capital, to valuation (fair value vs price, sensitivities, implied value drivers) and an investment conclusion. The materiality table is the bridge from ESG to the forecast.","kt":"","src":"L9 slide 7-8 · Bok s. 249 (Appendix)"},{"id":"SB328","l":"L9","t":"Value driver adjustment","f":"m","d":2,"p":"H","sc":"none","s":"Which is a step in the value driver adjustment (VDA) approach?","o":[["Hold the stock for 12 months","Not a VDA step."],["Use a P/E multiple instead of a DCF","VDA works inside fundamental valuation, typically a DCF."],["Focus on the most material issues","This is step 1 of the VDA approach."],["Let a proxy advisor vote","Step 4 is an active dialogue by the analyst or portfolio manager."]],"c":[2],"es":"VDA: 1 identify material issues; 2 analyse the company's performance vs peers; 3 adjust value drivers; 4 active dialogue.","ed":"Step 1 uses an industry materiality analysis (likelihood vs size of impact), adjusted for company specifics (safety matters more in manual gold mining than mechanised iron ore). Step 2 assesses performance absolutely and relative to peers to find competitive (dis)advantages. Step 3 makes deliberate, often significant adjustments (raising margins from 20% to 23% can move the target price ~15%, from HOLD to BUY). Step 4 uses the insights to ask meaningful questions, improving disclosure and the investor's understanding. Few analysts take step 3. Also true, but not offered as an option here: Quantify competitive advantages to adjust value driver assumptions.","kt":"","src":"Bok s. 229 (8.3.1.1) · Bok s. 230 (8.3.1.1)"},{"id":"SB329","l":"L9","t":"Value driver adjustment","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"An analyst makes small ESG adjustments for KUKA: slightly higher growth and margins and a slightly lower cost of capital. Why does the target price rise a lot?","o":[["Small changes add up over time","Growth, margins and the cost of capital all lift value at once."],["ESG is added as a fixed bonus","VDA works through value drivers, not a fixed bonus."],["It does not rise","All three adjustments push value up."],["A lower cost of capital lowers value","A lower cost of capital raises value."]],"c":[0],"es":"Several small driver changes compound into a large valuation effect.","ed":"This is why the VDA approach can turn a HOLD into a BUY, and why analysts must justify adjustments with evidence on material issues. Innovation adjusts growth and margins; capital management or governance adjusts the cost of capital.","kt":"Value driver adjustment (VDA): changing growth, margin or cost-of-capital assumptions to reflect ESG-based competitive (dis)advantages.","src":"Bok s. 231 (Box 8.1)"},{"id":"SB330","l":"L9","t":"Value driver adjustment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Governance adjustments mostly change sales growth and margins, while innovation adjustments mostly change the cost of capital.","o":[["True","Incorrect. It is the reverse: innovation VDAs tend to adjust sales growth and margins, governance VDAs mostly adjust the cost of capital."],["False","Correct. It is the reverse: innovation VDAs tend to adjust sales growth and margins, governance VDAs mostly adjust the cost of capital."]],"c":[1],"es":"False: innovation → growth and margins; governance → cost of capital.","ed":"VDAs can be made on any ESG issue, but innovation, corporate governance, environmental management and supply chain management are most frequent. Innovation shows up in growth and margins (Novozymes, KUKA); governance affects the risk investors face and thus the discount rate (KUKA's capital management −100 bps). The target price is only an intermediate step towards an investment decision.","kt":"","src":"Bok s. 231 (8.3.1.1)"},{"id":"SB331","l":"L9","t":"Cost of capital channel","f":"m","d":3,"p":"H","sc":"none","s":"Which finding on ESG and the cost of capital is correctly attributed?","o":[["El Ghoul et al.: better CSR, lower cost of equity","First bullet on slide 12."],["El Ghoul et al.: tobacco firms have lower cost of equity","Operating in these sin industries increases the cost of equity."],["Dhaliwal et al.: CSR reports raise the cost of capital","They find a reduction in the cost of capital for strong performers that initiate disclosure."],["Cheng et al.: only governance matters","Both social and environmental dimensions drive the relationship."]],"c":[0],"es":"Better ESG → lower implied cost of equity, cheaper financing, better access to finance, more debt capacity.","ed":"El Ghoul et al. find lower implied cost of equity for better CSR scores (employee relations, environment, product strategy) and higher cost for tobacco and nuclear. Dhaliwal et al. find strong CSR performers that start CSR disclosure enjoy a lower cost of capital. Cheng et al. find better stakeholder engagement and transparency reduce capital constraints. Sharfman and Fernando find better environmental risk management lowers the cost of capital and shifts financing from equity to debt. Slide 13 adds lower bond spreads for higher MSCI ESG scores. Also true, but not offered as an option here: Cheng, Ioannou and Serafeim (2014): superior CSR performance gives better access to finance.","kt":"","src":"L9 slide 12 · Bok s. 220 (8.2.1.1) · Bok s. 221 (8.2.1.1)"},{"id":"SB332","l":"L9","t":"Cost of capital channel","f":"t","d":4,"p":"M","sc":"short","s":"True or false: Lower bond spreads for firms with higher ESG scores do not prove that ESG lowers the cost of capital, since high-ESG firms are also often larger and stronger.","o":[["True","Correct. Correlation is not causation: size, profitability and governance quality can drive both ESG scores and spreads."],["False","Incorrect. Correlation is not causation: size, profitability and governance quality can drive both ESG scores and spreads."]],"c":[0],"es":"True: confounders like size and quality may explain the link.","ed":"Studies such as El Ghoul et al. control for firm characteristics and still find a link, but analysts should be careful with simple charts. Also note: a lower cost of capital means lower expected returns for investors (hence the question mark next to \"ESG stocks outperform\").","kt":"Confounding variable: a factor (e.g. firm size) that drives both the supposed cause and the effect, creating a misleading correlation.","src":"L9 slide 13 · L9 slide 12"},{"id":"SB333","l":"L9","t":"Green vs brown returns","f":"m","d":3,"p":"H","sc":"none","s":"Why should green assets have LOWER expected returns than brown assets (Pástor, Stambaugh and Taylor)?","o":[["Green firms are smaller and riskier","Higher risk would imply higher, not lower, expected returns."],["Regulators cap green returns","No such regulation exists."],["Green firms pay more dividends","The argument is about tastes and hedging, not payout policy."],["Taste and climate hedging","Slide 15: a taste premium and a risk (hedging) premium both lower expected returns."]],"c":[3],"es":"Taste premium (higher demand → higher prices) + hedging value against climate risk → lower expected returns for green.","ed":"\"taste premium\": investors derive utility from holding green assets, so demand bids up prices and lowers expected returns. \"Risk premium\": green assets are better hedges against climate risk, so investors accept lower returns. Brown assets must offer higher expected returns to be held. But realised returns can differ: when green demand shifts unexpectedly (investors or consumers, e.g. via regulation), green assets can outperform - until a correction.","kt":"","src":"L9 slide 14-16"},{"id":"SB334","l":"L9","t":"Green vs brown returns","f":"m","d":4,"p":"H","sc":"none","s":"A green-minus-brown portfolio earned 174% in recent years. How do Pástor, Stambaugh and Taylor explain this?","o":[["Green stocks always have higher expected returns","They estimate lower expected returns for green assets, consistent with theory."],["Brown stocks are riskier","Brown stocks underperformed in the period."],["Green firms paid higher dividends","The driver is climate concern shocks."],["Climate concern rose unexpectedly","Their counterfactual purges climate concern shocks; GMB becomes essentially flat."]],"c":[3],"es":"High realised green returns came from unexpected shifts in climate concerns, not high expected returns.","ed":"GMB had a monthly Sharpe ratio of 0.33, above the market's 0.3 in the period. Using a measure of climate concerns, they compute counterfactual returns without unexpected concern shocks: GMB becomes essentially flat. Similarly, German green bonds outperformed their non-green twins as the greenium widened. Lesson: do not extrapolate past green outperformance; theory and their ex-post estimates point to lower expected returns for green assets.","kt":"","src":"L9 slide 14 · L9 slide 17-18"},{"id":"SB335","l":"L9","t":"Green vs brown returns","f":"m","d":4,"p":"H","sc":"short","s":"US clean energy stocks jumped when the Inflation Reduction Act (2022) offered surprise subsidies. How should investors read this?","o":[["A one-time price jump","Unexpected green shifts raise realised returns now; expected returns stay lower afterwards."],["Expect the same jump every year","Unexpected shocks cannot be expected to repeat."],["Subsidies do not affect prices","Prices reacted strongly."],["Green stocks always earn more","Theory implies lower expected returns for green assets."]],"c":[0],"es":"Policy surprise → one-time repricing; future expected returns are not higher.","ed":"The consumer/regulatory channel (higher green profits) and investor-demand channel both create unexpected green outperformance. Once priced, green stocks offer lower expected returns, consistent with the taste and hedging premia.","kt":"Realised vs expected return: realised returns include surprises; expected returns are what investors anticipate given risk and tastes.","src":"L9 slide 15-16 · L9 slide 18"},{"id":"SB336","l":"L9","t":"Asset pricing models","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A manager says: \"This solar park is green, so we should use a much lower discount rate.\" What is the best answer?","o":[["Ignore the discount rate","NPV requires discounting cash flows at an appropriate rate."],["Use the highest rate","The rate should match the project's risk, not be arbitrary."],["Agree and use a zero rate","Green projects still carry risk and an opportunity cost of capital."],["Use a rate for its risk","The discount rate reflects risk; cash flow effects belong in the forecast."]],"c":[3],"es":"Discount at a risk-based rate; model green benefits explicitly in cash flows.","ed":"A lower rate is justified only if risk (e.g. regulated, contracted revenues) is lower or investors accept lower returns (greenium). Arbitrary \"green discounts\" hide assumptions; scenario analysis is more transparent.","kt":"Cost of capital: the return investors require for a project's risk; in CAPM/APT it depends on exposure to systematic risk factors.","src":"L9 slide 19 · L9 slide 21"},{"id":"SB337","l":"L9","t":"Asset pricing models","f":"m","d":3,"p":"H","sc":"none","s":"In the arbitrage pricing theory, E(Ri) = Rf + Σ βi,λ (RM,λ − Rf). What is βi,λ?","o":[["The asset's weight in the market","That is a portfolio weight, not a factor loading."],["Sensitivity to factor λ","The slide calls it the \"sensitivity\" to a risk factor."],["The asset's firm-specific risk","Idiosyncratic risk is diversifiable and not priced."],["The real risk-free rate","Rf is separate in the formula."]],"c":[1],"es":"β = factor loading (sensitivity); (RM,λ − Rf) = premium on an undiversifiable factor.","ed":"The APT generalises the CAPM to several systematic, undiversifiable risk factors (e.g. size, value, momentum). Each factor earns a premium; an asset's expected return depends on its exposure to each. Harvey, Liu and Zhu (2016) document a \"factor zoo\" of hundreds of proposed factors, so a new ESG factor needs strong justification. The question is whether ESG is such a priced, systematic factor.","kt":"","src":"L9 slide 21 · L9 slide 23"},{"id":"SB338","l":"L9","t":"Is ESG a risk factor","f":"m","d":4,"p":"H","sc":"none","s":"Research Affiliates tested long-short ESG strategies (2009-2020). What did they conclude?","o":[["ESG is a strong factor everywhere","The tested alphas are small and insignificant."],["There is no robust ESG premium","None of the long-short ESG alphas are statistically significant; studies find ESG both adds to and detracts from returns."],["Governance has a large premium","Governance strategies show negative raw returns and insignificant alphas."],["ESG meets all factor criteria","There is little agreement on robustness across definitions and geographies."]],"c":[1],"es":"Factor criteria: deep literature, robust across definitions, robust across geographies. ESG fails the robustness tests.","ed":"A factor should be grounded in a long, deep literature and be robust across definitions and geographies. Long-short ESG, E, S and G strategies in the US and Europe show small, insignificant CAPM alphas. Some studies find ESG adds to returns (Clark, Feiner and Viehs; Friede, Busch and Bassen; Khan, Serafeim and Yoon), others that it detracts (Brammer et al.; Fabozzi et al.; Hong and Kacperczyk). There is also no convincing risk-based or behavioural explanation. Measurement (rating disagreement) is a major challenge.","kt":"","src":"L9 slide 22 · L9 slide 24 · L9 slide 26"},{"id":"SB339","l":"L9","t":"Is ESG a risk factor","f":"t","d":4,"p":"H","sc":"none","s":"True or false: Bolton and Kacperczyk (2021) find that firms with higher carbon emissions earn LOWER stock returns.","o":[["True","Incorrect. They find higher-emission firms earn HIGHER returns (a carbon premium), consistent with investors demanding compensation for carbon risk exposure."],["False","Correct. They find higher-emission firms earn HIGHER returns (a carbon premium), consistent with investors demanding compensation for carbon risk exposure."]],"c":[1],"es":"False: higher emissions → higher returns (carbon premium), i.e. investors demand compensation.","ed":"Controlling for size, book-to-market and other predictors, firms with higher total CO2 emissions (and higher growth in emissions) earn higher returns; the premium is not explained by unexpected profitability or known risk factors. Institutional investors also screen on emission intensity in a few salient industries. This fits the risk-premium logic of Pástor et al. (brown assets need higher expected returns), but the debate continues - e.g. whether the premium reflects risk or the size of firms.","kt":"","src":"L9 slide 27 · L9 slide 15"},{"id":"SB340","l":"L9","t":"Is ESG a risk factor","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"High-ESG stocks have earned lower returns. Analyst A says they are less risky; analyst B says they are overpriced. What is the difference?","o":[["A: fair return; B: mispricing","Risk explanations mean lower required returns in equilibrium; mispricing means α < 0 that arbitrage could remove."],["A means you should short them","If lower returns compensate for lower risk, there is no free profit."],["There is no difference","Risk-based returns persist; mispricing should disappear."],["B means a higher beta","Overpricing concerns alpha, not beta."]],"c":[0],"es":"Risk → persistent lower expected return; mispricing → temporary alpha.","ed":"Practitioners most often believe high-ESG firms have lower beta (a risk view). Academically the question is unresolved: Bolton and Kacperczyk find a carbon premium, Pástor et al. stress taste and hedging premia, and Research Affiliates find no robust ESG factor.","kt":"Risk explanation: lower expected return compensates for lower (systematic) risk. Mispricing: price deviates from fair value (α ≠ 0) and should eventually correct.","src":"L9 slide 24-25 · L9 slide 20 · L9 slide 27"},{"id":"SB341","l":"L9","t":"Evidence: sustainability and value","f":"m","d":3,"p":"M","sc":"short","s":"Firms with high CSR did better in the 2008-09 crisis (Lins, Servaes and Tamayo). Why?","o":[["They were all in safe sectors","The effect is not just a sector effect."],["They had no debt","The explanation is trust, not zero leverage."],["Governments rescued only them","No such targeted bailout explains the result."],["Stakeholder trust paid off","Stakeholders and investors stick with trusted firms in a crisis."]],"c":[3],"es":"Social capital works like insurance when trust collapses.","ed":"This is the \"resilience\" argument for ESG: investments in stakeholder trust look costly in good times but protect value in bad times. Relevant for bank stress, pandemics or scandals in a peer's industry.","kt":"Social capital: trust and goodwill built with employees, customers, suppliers and investors through responsible behaviour.","src":"Bok s. 221 (8.2.1.1)"},{"id":"SB342","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"M","sc":"none","s":"Firms with IMPROVING sustainability ratings outperform, but firms with already HIGH ratings do not. Why?","o":[["Improvements are news","Static high levels are already priced; changes are news."],["Agencies inflate bad firms' ratings","Not the textbook's explanation."],["High-rated firms are bubbles","The finding is no outperformance, not crashes."],["Improving firms are smaller","The explanation offered is about information, not size."]],"c":[0],"es":"Levels are priced; changes (ESG momentum) carry news.","ed":"Ratings are rather static, so their levels are unlikely to affect returns; changes are more promising. In emerging markets, both improving and high-rated firms outperform, attributed to lower market efficiency and more recent interest in sustainability - consistent with the AMH. Khan, Serafeim and Yoon's results are also based on changes in material ESG performance. Quant ESG strategies often exploit this ESG momentum.","kt":"","src":"Bok s. 222 (8.2.1.2) · Bok s. 232 (8.3.1.2)"},{"id":"SB343","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"H","sc":"none","s":"Why is the evidence linking ESG to INVESTOR returns weak, even though ESG is linked to firm performance?","o":[["Investors price ESG at once","The textbook argues markets tend to ignore ESG information."],["All SRI funds are the same","Strategies differ greatly and matter for results."],["Sin stocks are unique","Blitz and Fabozzi show their risk-return properties can be replicated without sin exposure."],["Old studies used narrow funds","Derwall, Koedijk and Ter Horst find ethical funds underperform while ESG-integrated funds do not."]],"c":[3],"es":"Weak investor link: ethical funds' constrained universes, and a chain of steps (value drivers, stock performance, investor approach) that dilutes direct tests.","ed":"Friede, Busch and Bassen's meta-study finds a well-established link between ESG and corporate financial performance, but a weaker one with investment performance. Hong and Kacperczyk find SRI funds underperform by avoiding sin stocks, but Blitz and Fabozzi show the sin premium can be replicated. Derwall et al. find ethical (values-driven) funds underperform while ESG-integrated (value-driven) funds do not. Studying the chain step by step (Figure 8.4) reveals stronger relations. And if many funds exploit the same information, alpha disappears (AMH). Also true, but not offered as an option here: Going directly from ESG performance to investor performance skips intermediate steps, an incomplete model.","kt":"","src":"Bok s. 222 (8.2.1.3) · Bok s. 223 (Figure 8.4)"},{"id":"SB344","l":"L9","t":"Evidence: sustainability and value","f":"t","d":3,"p":"M","sc":"none","s":"True or false: A high carbon footprint always means high carbon risk; for example, an aluminium producer always loses from a higher carbon price.","o":[["True","Incorrect. Schramade's aluminium example shows a high-footprint firm can benefit from higher carbon prices because aluminium provides light-weighting solutions and producers can source clean energy."],["False","Correct. Schramade's aluminium example shows a high-footprint firm can benefit from higher carbon prices because aluminium provides light-weighting solutions and producers can source clean energy."]],"c":[1],"es":"False: footprint ≠ risk; aluminium can have positive carbon exposure.","ed":"Environmental research often focuses on carbon and waste footprints, but footprints are not the same as climate risk. Aluminium production is energy intensive but reduces emissions in aerospace and cars through lighter vehicles, and producers can switch to clean energy. Further evidence: eco-efficient firms earn higher returns (Derwall et al., 2005); GHG disclosure and efficiency earned abnormal returns of up to 13% p.a. in 2005-09 (Liesen et al.), suggesting carbon information was inefficiently priced.","kt":"","src":"Bok s. 223 (8.2.2) · Bok s. 224 (8.2.2)"},{"id":"SB345","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"L","sc":"none","s":"What do Edmans, Li and Zhang (2017) find about employee satisfaction across countries?","o":[["It predicts lower returns in the US and UK","The relation is positive in flexible labour markets."],["It predicts higher returns everywhere","The effect depends on labour market flexibility."],["It matters only in Germany","Germany, with low flexibility, shows no effect."],["It works in flexible labour markets","Where hiring and firing are easy, satisfaction is a costlier, more valuable differentiator."]],"c":[3],"es":"Positive link in flexible labour markets (US, UK), not in rigid ones (Germany).","ed":"Edmans (2011, 2012) finds firms with higher employee satisfaction earn better returns, valuations and earnings surprises. Internationally, the effect holds in flexible labour markets, where satisfaction helps recruit, retain and motivate, but not where legal protections already set high minimum standards. S also correlates with G: employees at founder-run firms report higher satisfaction (Huang et al.). Evidence on S is thinner than on E because data are more problematic.","kt":"","src":"Bok s. 224 (8.2.3) · Bok s. 225 (8.2.3)"},{"id":"SB346","l":"L9","t":"Evidence: sustainability and value","f":"m","d":3,"p":"M","sc":"none","s":"What do Grewal, Serafeim and Yoon (2016) find about ESG shareholder proposals?","o":[["They have no effect","They improve performance on the focal issue."],["They work even without a majority","Proposals on immaterial issues are associated with subsequent declines in value."],["They only work with majority support","They are effective even without majority support."],["All proposals add equal value","Immaterial proposals are associated with value declines."]],"c":[1],"es":"Proposals work even without a majority; material → value up, immaterial → value down.","ed":"Firms seem to focus on immaterial issues when there are agency problems, low awareness of materiality, or to divert attention from poor performance on material issues. Related: Dimson, Karakaş and Li find successful engagements are followed by positive abnormal returns; McCahery, Sautner and Starks find long-term investors intervene more. Institutional investors now own about 75% of equity, increasing engagement.","kt":"","src":"Bok s. 225 (8.2.5) · Bok s. 226 (8.2.5)"},{"id":"SB347","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"H","sc":"none","s":"Which match of investment approach and goal is correct?","o":[["Exclusion: max F; integration: max I; impact: max S+E","This is the mapping on slide 29 and in Table 8.1."],["Exclusion: max S+E; integration: max F; impact: max I","The mapping is scrambled."],["Impact: max F; exclusion: max I","Impact puts SEV first; exclusion keeps FV as the goal."],["All three maximise F","Only traditional risk/return optimisation maximises FV alone."]],"c":[0],"es":"Risk/return: max FV. Exclusion (SF 1.0): max FV s.t. SEV_min. Integration (SF 2.0): max IV. Impact (SF 3.0): max SEV s.t. FV_min.","ed":"Summary of Table 8.1: exclusionary screening (SF 1.0) has financial return as first criterion, uses ratings as its foundation, focuses on operations, and drops the worst companies from a very large universe. ESG integration (SF 2.0) maximises integrated value, uses ratings as part of the data, considers operations and products, and drops the worst 20-30%. Impact investing (SF 3.0) puts positive S + E impact first, has no ratings available, considers products first, and invests only in the best 10-30%.","kt":"","src":"L9 slide 29 · Bok s. 212 (Table 8.1)"},{"id":"SB348","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"M","sc":"none","s":"Which statement about ESG approaches in equity investing is correct?","o":[["Ratings are the basis of impact investing","For impact investing, ratings are \"not available\"; they are the foundation of exclusion."],["Exclusion picks only the best performers","That is impact investing; exclusion keeps a very large universe."],["Impact investing looks at return first","Its first criterion is impact (positive S + E)."],["Impact investing looks at products first","Row \"Products versus operations\" in Table 8.1."]],"c":[3],"es":"Exclusion: operations focus, very large universe; integration: operations + products, worst 20-30% out; impact: products first, best 10-30% only.","ed":"The further one moves from SF 1.0 to 3.0, the more the analysis shifts from operations (how a firm produces) to products (what it produces and their impact), and the smaller the investable universe. Ratings, which mostly measure operations, are central to exclusion but not available for measuring product impact. Also true, but not offered as an option here: ESG integration drops the worst S and E performers but keeps most of the universe.","kt":"","src":"Bok s. 212 (Table 8.1)"},{"id":"SB349","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"H","sc":"none","s":"How well does ESG integration suit fundamental, quant and passive investing?","o":[["High, high, high","Only fundamental investing can integrate ESG into valuation."],["Low, high, high","The ranking is reversed."],["High, low, none","ESG integration needs fundamental analysis."],["Medium, medium, medium","That describes exclusionary screening, not integration."]],"c":[2],"es":"Fundamental: high for all six methods. Passive: only exclusion is really credible. Integration: high / very low / not at all.","ed":"Summary of Table 8.3: exclusionary screening - high, medium-high, medium-high (can be done on scores); best-in-class - high, medium, medium-low; thematic - high, medium, low; active ownership - high, low, low (fundamental analysis needed, can be bought externally with loss of quality); impact - high, very low, very low; ESG integration - high, very low, not at all. Fundamental investing allows analysis of business models and transition preparedness; quant is backward looking and cannot handle regime change; passive relies on indices built on ratings.","kt":"","src":"L9 slide 34-35 · Bok s. 228 (Table 8.3) · Bok s. 228 (8.3.1)"},{"id":"SB350","l":"L9","t":"ESG in portfolio management","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Quant investing looks backward at past patterns, so it struggles with big changes like rising carbon prices.","o":[["True","Correct. Section 8.3.1.2 makes this argument, while noting quant can be complementary (quantamental)."],["False","Incorrect. Section 8.3.1.2 makes this argument, while noting quant can be complementary (quantamental)."]],"c":[0],"es":"True: quant relies on history and struggles with regime change.","ed":"Quant strategies select stocks by factor exposures (growth, value, size, momentum) using rules based on historically profitable patterns. ESG scores can be used as a quasi-factor (best-in-class) or for exclusion; smart beta ESG combines passive costs with factor tilts. Melas et al. find ESG scores correlate with size, quality and low volatility. But quant cannot anticipate situations that have not happened yet. \"Quantamental\" hybrids, like chess player plus computer, may be strongest.","kt":"","src":"Bok s. 232 (8.3.1.2) · Bok s. 233 (8.3.1.2)"},{"id":"SB351","l":"L9","t":"ESG in portfolio management","f":"m","d":4,"p":"H","sc":"none","s":"A low-carbon index has about 50% lower emissions but tracks its benchmark closely. Why is it called a \"free option on carbon\"?","o":[["It carries no risk","It selects low-carbon firms within each sector and stays close to the benchmark."],["It wins once carbon is priced","While mitigation is pending it earns the benchmark return; once carbon is priced it should outperform."],["It wins from day one","Outperformance is expected only once carbon is (expected to be) priced."],["Investors get free carbon credits","It is a metaphor, not a derivative contract."]],"c":[1],"es":"Low tracking error now (no cost), upside when carbon gets priced = free option.","ed":"By selecting low-carbon firms within each sector (best-in-class) and minimising tracking error, passive investors can halve the carbon footprint at no extra cost. This also suggests climate risk was not yet priced (consistent with the AMH). Passive ESG is a crude but useful improvement over mainstream passive (SF 1.0): it can exclude the worst industries and tilt to green revenues, but selectiveness and engagement remain limited, and voting usually follows proxy advisors.","kt":"","src":"Bok s. 233 (Box 8.2) · Bok s. 233 (8.3.1.3) · Bok s. 234 (8.3.1.3)"},{"id":"SB352","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A fund only uses negative screening but calls itself \"fully ESG integrated\". What is the best critique?","o":[["Exclusion is not valuation","Integration means ESG enters forecasts, value drivers or discount rates."],["Exclusion always gives the best returns","Professionals see integration and positive screening as more useful for returns."],["Screening is the best form of integration","Exclusion is SF 1.0; integration is SF 2.0."],["They are the same thing","Eurosif defines integration as explicit inclusion of ESG in financial analysis."]],"c":[0],"es":"Screening ≠ integration; integration needs ESG in the valuation.","ed":"The textbook notes negative screening is the most used but least valued method among professionals, who see more merit in full integration and positive screening. Many funds label universe reduction as \"integration\", which is misleading.","kt":"ESG integration: explicit consideration of material ESG factors alongside financial factors in valuing and selecting securities.","src":"L9 slide 31 · L9 slide 37 · Bok s. 228 (8.3.1.1)"},{"id":"SB353","l":"L9","t":"Engagement and divestment","f":"m","d":3,"p":"M","sc":"none","s":"What is the \"washing machine\" strategy (Gollier and Pouget, 2014)?","o":[["Relabelling normal funds as ESG","The term refers to transforming companies, not relabelling funds."],["Money laundering through green loans","Unrelated to the paper, which is about investor strategies and corporate behaviour."],["Buying and fixing bad firms","The quote on slide 32 states that a large activist can generate positive abnormal returns this way."],["Selling brown stocks for green bonds","That is divestment, not the washing machine idea."]],"c":[2],"es":"Buy the \"dirty\", engage to clean them, profit as their value rises.","ed":"If markets reward responsible behaviour, a large activist can buy irresponsible firms cheaply, push them to improve, and capture the revaluation. This is the logic of engagement as an alternative to exclusion: by divesting, responsible investors give up influence. Slide 33 adds Cohen, Gurun and Nguyen: low-ESG energy firms, often excluded by ESG funds, are key green innovators - questioning whether divestment is optimal.","kt":"","src":"L9 slide 32 · L9 slide 33"},{"id":"SB354","l":"L9","t":"Engagement and divestment","f":"t","d":4,"p":"H","sc":"none","s":"True or false: Energy firms with low ESG scores, often excluded by ESG funds, produce many high-quality green patents (Cohen, Gurun and Nguyen, 2020).","o":[["True","Correct. This is the \"ESG-innovation disconnect\" on slide 33."],["False","Incorrect. This is the \"ESG-innovation disconnect\" on slide 33."]],"c":[0],"es":"True: excluded energy firms are key green innovators.","ed":"The finding suggests that ESG scores and exclusion lists may penalise exactly the firms best placed to develop green technologies. If excluded, these firms lose access to engaged, sustainability-minded capital. Reward-based incentives or engagement might lead to more efficient innovation. Combined with the washing machine idea, this is an argument for engagement over blanket divestment, while divestment can still be credible as an escalation step (LGIM-Glencore, Lecture 8).","kt":"","src":"L9 slide 33 · L8 slide 58"},{"id":"SB355","l":"L9","t":"Impact investing","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the GIIN's four features of impact investing?","o":[["Only private equity counts","Impact investing spans asset classes including public equity and fixed income."],["Measuring impact","This is GIIN characteristic 4."],["Returns must be below market","Characteristic 3 allows a range of returns, above or below market."],["Investments must be rated AAA","Not a GIIN criterion."]],"c":[1],"es":"GIIN: intentionality; return expectations; range of returns and asset classes; impact measurement.","ed":"Impact investing fits SF 3.0, with impact as the first criterion (max SEV s.t. FV_min). Research so far focuses on private equity impact funds (Barber, Morse and Yasuda: demand exceeds supply). Challenges: poor impact data, lack of scale (small projects vs pension funds' ticket sizes), institutional resistance to change, perception problems (assumed low returns) and complex investment chains. Also true, but not offered as an option here: Intentionality to generate positive social or environmental impact.","kt":"","src":"L9 slide 36 · Bok s. 235 (8.4) · Bok s. 236 (8.4) · Bok s. 237 (8.4.3)"},{"id":"SB356","l":"L9","t":"Impact investing","f":"m","d":4,"p":"M","sc":"none","s":"Why can listed impact investing still give market-level returns?","o":[["Governments guarantee returns","There are no such guarantees."],["SDG trends help their growth","Schramade finds positive-impact stocks already have stronger value drivers."],["Impact stocks are always cheap","Not the argument made."],["They take more risk","The argument is about value drivers, not higher risk."]],"c":[1],"es":"Impact firms ride SDG tailwinds (growth, margins, lower risk) and internalisation will tighten the link.","ed":"In a universe of 15,000 stocks, the 2,300 with positive impact potential already show higher growth, higher cash flow return on investment and lower cost of capital, even within sectors (Schramade, 2018). Figure 8.5 sketches internalisation: tobacco (negative impact, positive return now) likely to deteriorate; solar (positive impact, weak return now) likely to improve. Impact can be assessed with the Impact Management Project's five dimensions (what, how much, who, contribution, risk) and impact criteria (material, intentional, transformational - Novozymes).","kt":"","src":"Bok s. 237 (8.4.2) · Bok s. 238 (Figure 8.5) · Bok s. 239 (8.4.4) · Bok s. 240 (Table 8.5)"},{"id":"SB357","l":"L9","t":"Impact investing","f":"m","d":3,"p":"L","sc":"none","s":"Which impact dimension asks how the effect compares with what would have happened anyway?","o":[["Contribution","Contribution concerns additionality versus the counterfactual."],["Who","\"Who\" asks who experiences the effect and how underserved they are."],["Risk","\"Risk\" concerns the likelihood that impact differs from expectations."],["How much (scale and duration)","\"How much\" concerns scale, depth and duration."]],"c":[0],"es":"What, how much, who, contribution (additionality), risk.","ed":"The five dimensions are: What (which outcomes, how important to people or planet); How much (scale, depth, duration); Who (stakeholders affected, how underserved); Contribution (compared with what would occur anyway - additionality); Risk (probability that impact differs from expectation). Contribution is central to the debate whether buying listed shares creates real-world impact, since secondary market trades may not change a firm's financing.","kt":"","src":"Bok s. 239 (8.4.4) · Bok s. 240 (Figure 8.6)"},{"id":"SB358","l":"L9","t":"ESG integration in valuation","f":"t","d":3,"p":"H","sc":"extended_course_case","s":"True or false: Novozymes' enzymes cut customers' energy use. Using VDA, an analyst would set its growth and margins above the industry average.","o":[["True","Correct. Novozymes grows about twice as fast as the chemicals industry at about twice the margin; VDA makes this explicit in value driver assumptions."],["False","Incorrect. Novozymes grows about twice as fast as the chemicals industry at about twice the margin; VDA makes this explicit in value driver assumptions."]],"c":[0],"es":"True: a material ESG edge → higher growth and margin assumptions.","ed":"Steps: identify material issues, assess performance versus peers, quantify the advantage in value drivers, and engage. Innovation edges usually adjust growth and margins; governance edges usually adjust the cost of capital.","kt":"Value driver adjustment (VDA): adjusting growth, margin or cost-of-capital assumptions to reflect a company's competitive (dis)advantage on material ESG issues.","src":"Bok s. 230 (8.3.1.1) · Bok s. 122 (Box 5.2)"},{"id":"SB359","l":"L9","t":"Barriers to ESG integration","f":"m","d":2,"p":"M","sc":"none","s":"Why do ESG issues get too little attention in investment cases (CFA Institute, 2015)?","o":[["Short investor horizons","One of the three reasons listed."],["ESG never affects results","The textbook shows they can make or break business models."],["ESG data are boring","The problem is that disclosures are limited, unverified and non-standardised."],["ESG is banned in valuations","No such prohibition exists."]],"c":[0],"es":"Hard to monetise ESG; limited, unverified, non-standard disclosure; long-term effects vs short horizons.","ed":"The three reasons: (1) difficulty expressing sustainability effects in monetary terms and integrating them in quant models; (2) limited, unverified and non-standardised ESG disclosure; (3) long-term effects versus short-term investor horizons. Many \"integration\" approaches only use ESG scores to shrink the universe, which is not real integration under Eurosif's definition (explicit consideration of ESG alongside financial factors and its impact on financials).","kt":"","src":"Bok s. 227 (8.3) · Bok s. 228 (8.3.1.1)"},{"id":"SB360","l":"L9","t":"ESG integration synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"An analyst thinks a utility's renewable assets give it a lasting cost edge, and that carbon prices will rise. How should she show this?","o":[["Cut the discount rate a lot","Theory implies lower expected returns for green assets; mixing this up confu
