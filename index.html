<style>
/* Layout: single centred column. Home = dashboard (ring + stat tiles) then setup; quiz = one elevated card. */
:root{
  --bg:#F3F4F7; --bg2:#E9EBF1; --surface:#FFFFFF; --surface2:#F7F8FB; --ink:#141824; --muted:#5E6577; --line:#DDE0E8;
  --accent:#4C51D9; --accent2:#7B5CE6; --accent-ink:#FFFFFF; --accent-soft:#E9EAFC; --glow:rgba(76,81,217,.16);
  --ok:#17804A; --ok-soft:#E0F4E8; --bad:#C2372D; --bad-soft:#FCE6E3; --warn:#A06A00; --warn-soft:#FDF2DA;
  --shadow:0 1px 2px rgba(20,24,36,.06),0 8px 24px rgba(20,24,36,.06);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F15; --bg2:#12151D; --surface:#161922; --surface2:#1B1F2A; --ink:#E8EAF0; --muted:#949AAD; --line:#272B37;
  --accent:#8C8FF5; --accent2:#B08CF7; --accent-ink:#0D0F15; --accent-soft:#22243F; --glow:rgba(140,143,245,.16);
  --ok:#5BD08F; --ok-soft:#12301F; --bad:#F2887D; --bad-soft:#3A1B18; --warn:#EDB95A; --warn-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F15; --bg2:#12151D; --surface:#161922; --surface2:#1B1F2A; --ink:#E8EAF0; --muted:#949AAD; --line:#272B37;
  --accent:#8C8FF5; --accent2:#B08CF7; --accent-ink:#0D0F15; --accent-soft:#22243F; --glow:rgba(140,143,245,.16);
  --ok:#5BD08F; --ok-soft:#12301F; --bad:#F2887D; --bad-soft:#3A1B18; --warn:#EDB95A; --warn-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(900px 420px at 85% -120px,var(--glow),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--accent),var(--accent2));color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;box-shadow:0 4px 12px var(--glow)}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em;line-height:1.1}
nav{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{background:none;border:0;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13.5px}
nav button[aria-current="true"]{color:var(--accent-ink);background:var(--accent)}
main{padding-block:22px 72px}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:31px;line-height:1.12}
.lead{color:var(--muted);max-width:62ch;margin:8px 0 0}
.label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
section.block{display:grid;gap:10px}
.stack{display:grid;gap:26px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* dashboard */
.dash{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:20px 22px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{display:block;font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.tile.exam{background:linear-gradient(140deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink)}
.tile.exam span{color:inherit;opacity:.85}

/* modes */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px;transition:transform .12s,border-color .12s,box-shadow .12s}
.seg button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.seg .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.seg .ic svg{width:17px;height:17px}
.seg button b{font-weight:700;font-size:14.5px}
.seg button span.d{font-size:12.5px;color:var(--muted);line-height:1.35}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 18px var(--glow)}
.seg.sec{grid-template-columns:1fr 1fr}
.seg button[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-ink)}

/* lectures */
.lecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px}
.lec{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;transition:opacity .12s,border-color .12s}
.lec[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.lec[aria-pressed="false"]{opacity:.45}
.lec .code{font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;min-width:3.2em;text-align:center}
.lec .name{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lec .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.lec .bar{grid-column:1/-1}
.bar i{display:block;height:100%}
.bar .k{background:var(--ok)} .bar .w{background:var(--bad)}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-size:13px;font-weight:600}
.primary{background:linear-gradient(140deg,var(--accent),var(--accent2));color:var(--accent-ink);border:0;border-radius:12px;padding:13px 22px;font-weight:700;box-shadow:0 6px 18px var(--glow);transition:transform .1s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:600}
.startbar{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.startbar .info{color:var(--muted);font-size:14px}
.startbar .info b{color:var(--ink);font-variant-numeric:tabular-nums}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .pos{font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{flex:1;min-width:60px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .25s}
.qtop .stat{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:18px;box-shadow:var(--shadow);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meta span{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.meta .lecid{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.meta .tag{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.meta .qid{font-family:var(--f-mono);font-weight:400;background:none;border:0;padding:3px 2px}
.stem{font-family:var(--f-display);font-size:21px;line-height:1.42;margin:0;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;transition:border-color .12s,background .12s,transform .1s}
.opt:not(:disabled):hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.opt:not(:disabled):active{transform:scale(.995)}
.opt .key{font-family:var(--f-mono);font-size:12.5px;font-weight:500;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:5px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.verdict{border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.verdict .vi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;grid-row:span 2}
.verdict .vi svg{width:16px;height:16px}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict.ok .vi{background:var(--ok);color:var(--surface)} .verdict.bad .vi{background:var(--bad);color:var(--surface)}
.verdict b{font-weight:700}
.verdict.ok b{color:var(--ok)} .verdict.bad b{color:var(--bad)}
.verdict.plain{grid-template-columns:1fr}
details.deep{border-top:1px solid var(--line);padding-top:14px}
details.deep summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
details.deep summary::-webkit-details-marker{display:none}
details.deep summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.deep[open] summary::before{transform:rotate(45deg)}
details.deep .body{display:grid;gap:12px;margin-top:12px;max-width:68ch}
.kt{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:16px}
.actions .left{display:flex;gap:8px;flex-wrap:wrap}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.grid button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11.5px;padding:0}
.grid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.grid button.fl{box-shadow:inset 0 -3px 0 var(--warn)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}

/* results & progress */
.hero{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.hero .of{color:var(--muted);font-size:14px}
.hero h1{margin-bottom:4px}
.tablewrap{overflow-x:auto;padding:6px 18px 10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
td .bar{min-width:80px}
.review{display:grid;gap:8px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.review summary{cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-weight:600}
.review summary .m{font-family:var(--f-mono);font-size:11px;padding-top:3px;color:var(--bad);font-weight:500}
.review .inner{display:grid;gap:10px;margin-top:12px}
.empty{color:var(--muted);padding:12px 0}
@media (max-width:640px){
  .seg{grid-template-columns:1fr 1fr}
  .card{padding:18px;border-radius:18px}
  .stem{font-size:19px}
  h1{font-size:26px}
  .dash,.hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .dash .tiles{width:100%}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  </nav>

<script type="application/json" id="bank">[{"id":"CX001","l":"L1","t":"Definition of sustainable finance","f":"m","d":2,"p":"H","sc":"none","s":"Unlike charity, sustainable finance:","o":[["Is the same thing as ESG ratings","ESG-ratinger er bare ett verktøy."],["Gives up all financial return","Da ville det vært veldedighet."],["Still requires a financial return","Det er ikke veldedighet. Selv SF 3.0 krever en minimum avkastning."],["Covers only renewable energy stocks","Det dekker hele finanssystemet: investering, utlån og forsikring."]],"c":[2],"es":"Sustainable finance ≠ veldedighet.","ed":"Selv i den mest ambisiøse formen (SF 3.0) kreves en minimum finansiell avkastning. Foreleser: 'it's not charity'.","kt":"","src":"L1 slide 25 · Bok s. 4 (1)","k":1},{"id":"CX002","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":2,"p":"H","sc":"none","s":"The stage of sustainable finance that puts social and environmental value first, subject to a minimum financial return, is:","o":[["SF 3.0","SF 3.0 = common good value: maks S + E, så lenge F er over et minimum."],["SF 2.0","SF 2.0 maksimerer integrated value (F + S + E samlet)."],["Traditional finance","Tradisjonell finans ser bare på F."],["SF 1.0","SF 1.0 maksimerer F, med noen begrensninger som ekskludering."]],"c":[0],"es":"SF 3.0 = samfunn og miljø først.","ed":"Trappen:\n- SF 1.0: maks F (refined shareholder value).\n- SF 2.0: maks F + S + E (stakeholder value).\n- SF 3.0: maks S + E med minimum F (common good).","kt":"","src":"Bok s. 20 (1.4) · L9 slide 29","k":1},{"id":"CX003","l":"L1","t":"Sustainable finance typology","f":"m","d":2,"p":"H","sc":"none","s":"A fund that excludes tobacco and coal but otherwise maximises financial return is an example of:","o":[["SF 1.0","Ekskludering + maks avkastning = SF 1.0."],["SF 2.0","SF 2.0 ville vektet F, S og E likt (integrated value)."],["Traditional finance","Tradisjonell finans ekskluderer ikke av etiske grunner."],["SF 3.0","SF 3.0 setter samfunn og miljø først."]],"c":[0],"es":"Ekskludering + maks avkastning = SF 1.0.","ed":"SF 1.0 tar bare hensyn til samfunn og miljø som begrensninger (ikke eie 'sin stocks'), mens målet fortsatt er finansiell verdi.","kt":"","src":"L1 slide 30 · Bok s. 17 (1.4)","k":1},{"id":"CX004","l":"L1","t":"Value versus values","f":"m","d":2,"p":"H","sc":"short","s":"In Starks' terms, an investor who accepts a lower return to avoid firms that conflict with her beliefs is:","o":[["A values investor","Hun handler ut fra egne verdier (nonpecuniary preferences), selv om det koster."],["An activist hedge fund","Det har ingenting med motivet hennes å gjøre."],["A passive investor","Passiv handler om å følge en indeks, ikke om motivet."],["A value investor","En value-investor bruker ESG fordi det påvirker risiko og avkastning."]],"c":[0],"es":"Verdier som motiv = values investor.","ed":"Value = ESG for pengenes skyld. Values = ESG for verdienes skyld, også om det koster avkastning.","kt":"","src":"Starks s. 1838 · L1 slide 44","k":1},{"id":"CX005","l":"L1","t":"Double materiality","f":"t","d":2,"p":"H","sc":"none","s":"Does double materiality cover both a firm's impact on the world and the world's impact on the firm?","o":[["Yes","Riktig. Impact materiality (inside-out) + financial materiality (outside-in)."],["No","Feil. Impact materiality (inside-out) + financial materiality (outside-in)."]],"c":[0],"es":"Ja: begge retninger.","ed":"Foreleser har sagt at double materiality helt sikkert kommer på eksamen. CSRD i EU bygger på dette prinsippet.","kt":"","src":"L1 slide 36 · L6 slide 50 · PwC s. 29","k":1},{"id":"CX006","l":"L1","t":"Inside-out vs outside-in","f":"m","d":2,"p":"H","sc":"short","s":"River pollution from a firm's factory that does not affect the firm's own profits is an example of:","o":[["Physical climate risk","Physical risk er klimaets skade på firmaet, ikke omvendt."],["Financial materiality (outside-in)","Det ville vært hvis forurensningen påvirket firmaets økonomi."],["Impact materiality (inside-out)","Firmaet påvirker verden. Det er impact materiality."],["It is not material in any sense","Under double materiality er stor impact nok til at temaet er vesentlig."]],"c":[2],"es":"Firmaet påvirker verden = impact (inside-out).","ed":"Pilen bestemmer: fra firmaet og ut = inside-out (impact). Fra verden og inn i regnskapet = outside-in (financial).","kt":"","src":"Opptak L8 ca. 65 min · Opptak L1 ca. 80 min","k":1},{"id":"CX007","l":"L1","t":"Principal-agent problem","f":"m","d":2,"p":"H","sc":"none","s":"Ownership by many small shareholders makes the principal-agent problem worse because:","o":[["Small owners receive no dividends at all","Alle aksjeeiere får utbytte."],["Managers then own most of the shares","Spredt eierskap betyr ikke at lederne eier mest."],["No single owner gains enough from monitoring","Hver liten eier bærer kostnaden ved å overvåke, men deler gevinsten med alle (free riding)."],["Small owners must vote with managers by law","Det finnes ingen slik regel."]],"c":[2],"es":"Spredt eierskap = svak overvåking.","ed":"Principal-agent: eiere (principals) og ledere (agents) kan ha ulike interesser. Med mange små eiere er det ingen som har nok å vinne på å overvåke lederne (free riding).","kt":"","src":"L1 slide 23 · L5 slide 13","k":1},{"id":"CX008","l":"L1","t":"Planetary boundaries and the doughnut","f":"m","d":2,"p":"H","sc":"none","s":"In Raworth's doughnut, the inner ring represents:","o":[["The ecological ceiling","Det er den ytre ringen."],["The planetary boundaries","Planetary boundaries er den ytre ringen."],["A target for GDP growth","Modellen har ikke et vekstmål."],["The social foundation","Under indre ring mangler folk grunnbehov (shortfall)."]],"c":[3],"es":"Indre ring = social foundation.","ed":"Under indre ring: folk mangler grunnbehov (shortfall). Over ytre ring: vi bryter planetens grenser (overshoot). Målet er rommet mellom.","kt":"","src":"L1 slide 35 · Bok s. 11 (1.2.2)","k":1},{"id":"EX08","l":"L1","t":"Exam sample: principal-agent problem","f":"m","d":2,"p":"H","sc":"none","s":"In the principal-agent problem within a corporation, the manager acts as the:","o":[["Principal","Principal er eierne (aksjonærene), som lederen jobber for."],["Agent","Lederen handler på vegne av eierne, og er derfor agenten."],["Beneficiary","Beneficiary er sluttmottakeren, f.eks. sparerne i et pensjonsfond."],["Regulator","Regulator er myndighetene, ikke en part i principal-agent-forholdet."]],"c":[1],"es":"Leder = agent. Eiere = principal.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\nPrincipal-agent: eierne (principals) ansetter lederne (agents) til å styre. Lederne kan ha egne interesser (bonus, makt, et rolig liv). Corporate governance skal få dem til å handle i eiernes interesse.","kt":"","src":"L1 slide 23 · L5 slide 13","k":1,"x":1},{"id":"SB001","l":"L1","t":"Definition of sustainable finance","f":"m","d":1,"p":"H","sc":"none","s":"According to Schoenmaker and Schramade, sustainable finance is:","o":[["Charity done by banks next to their normal business","Sustainable finance is about integrating social and environmental issues into core financial decisions, not side charity."],["Investing only in the top ESG-rated firms in each sector","Investing only in top-rated firms is one strategy (positive screening), not the definition of the field."],["How finance interacts with society and nature","This is the textbook definition quoted on Lecture 1, slide 25."],["Public subsidies for renewable energy projects","Subsidies are a government tool; sustainable finance covers private investing and lending decisions."]],"c":[2],"es":"Sustainable finance studies how investing and lending interact with economic, social and environmental issues.","ed":"Sustainable finance = how finance (investing and lending) interacts with economic, social and environmental issues. The European Commission definition on the same slide stresses taking ESG considerations into account in investment decisions, leading to more long-term investment in sustainable activities. Note the breadth: it covers all financial decisions (equity, bonds, loans, insurance), not one particular strategy such as screening, and it is not charity. Later lectures show the different ways this interaction can be organised (SF 1.0, 2.0, 3.0).","kt":"","src":"L1 slide 25 · Bok s. 4 (1)"},{"id":"SB002","l":"L1","t":"CSR, SRI and ESG","f":"m","d":2,"p":"H","sc":"none","s":"How do CSR, SRI and ESG relate to each other in the course?","o":[["They are three names for the same thing","The slide stresses the distinction because most empirical difficulties arise at the measurement (ESG) step."],["CSR and SRI are actions; ESG measures the result","This is exactly the slide 33 framing: CSR (corporate side) and SRI (investor side) are actions; ESG is measurement."],["SRI is for firms; CSR is for investors","Swapped: CSR is the corporate side, SRI the investor side."],["ESG is a firm action; CSR is an investor rating","This reverses the roles: CSR is a corporate action and ESG is the measurement layer."]],"c":[1],"es":"CSR (firms) and SRI (investors) are actions; ESG metrics try to measure the outcome in terms of stakeholder welfare.","ed":"CSR and SRI are actions, ESG is measurement. Lecture 1 builds a chain: sustainability requires that stakeholders' interests are taken care of, which is stakeholder management; stakeholder management is put into practice by firms through CSR and by investors through SRI; ESG metrics then try to measure the outcomes (stakeholder welfare). Keeping action and measurement apart matters because ratings can disagree strongly (Lecture 7), so a weak ESG score does not automatically mean weak CSR, and vice versa. Starks (2023) also notes that the lack of clarity on these terms causes misunderstandings.","kt":"","src":"L1 slide 33 · Starks s. 1837"},{"id":"SB003","l":"L1","t":"Sustainable finance typology","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A pension fund drops coal and tobacco stocks but otherwise just tracks the index. This is:","o":[["SF 1.0","Exclusions avoid \"sin\" sectors, but the goal is still maximising financial value."],["SF 2.0","SF 2.0 requires optimising integrated value (F + S + E), not only excluding a few sectors."],["Finance as usual","Excluding sectors with very negative externalities is exactly what defines SF 1.0."],["SF 3.0","SF 3.0 puts social and environmental impact first, with finance as a constraint."]],"c":[0],"es":"Exclusions + financial benchmark = SF 1.0.","ed":"The test is the objective function, not the label. Here the objective is still financial return with a few constraints. Moving to SF 2.0 would mean valuing material S and E effects in the investment decision; SF 3.0 would mean choosing investments for their impact first.","kt":"SF 1.0 = maximise F subject to S and E (avoid the worst); SF 2.0 = optimise integrated value IV = F + S + E; SF 3.0 = optimise S + E subject to F.","src":"L1 slide 30 · Bok s. 17 (1.4)"},{"id":"SB004","l":"L1","t":"Principal-agent problem","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"After raising equity, a CEO moves the firm into much riskier projects because outside investors carry most of the losses. This is:","o":[["Modigliani-Miller Proposition I","MM I says firm value is independent of capital structure in a perfect market; it does not describe agent behaviour."],["Double materiality","Double materiality is a reporting concept about financial and impact materiality, not an agency problem."],["Adverse selection","Adverse selection concerns hidden information before the transaction (who self-selects into the contract), not behaviour after it."],["Moral hazard","The behaviour changes after the contract is signed, and the risk is borne by others: that is moral hazard."]],"c":[3],"es":"Taking extra risk after the contract because others bear the cost is moral hazard.","ed":"Adverse selection = exploiting hidden information before the deal; moral hazard = changing behaviour after the deal when risk is borne by others. Both stem from information asymmetry between principal (investors) and agent (manager). Lecture 5 gives examples of moral hazard such as asset substitution and debt overhang, and Lecture 11 shows how banks screen (against adverse selection) and monitor (against moral hazard).","kt":"","src":"L1 slide 23 · L5 slide 13"},{"id":"SB005","l":"L1","t":"Principal-agent problem","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A CEO's bonus depends only on next year's earnings. She cuts R&D to hit the target. What is the problem and the fix?","o":[["No problem; short-term earnings are the goal","Shareholders care about long-term value; short-term EPS can destroy it."],["Agency problem; link pay to long-term targets","Long-term, deferred pay aligns the agent with owners' long-term interest."],["Market failure; add a carbon tax","A carbon tax addresses an environmental externality, not the incentive problem here."],["Adverse selection; screen job applicants better","The problem arises from incentives after hiring (moral hazard), not hidden type."]],"c":[1],"es":"Short-term EPS pay creates a short-termist agency problem; fix with long-term, material KPIs.","ed":"Cutting investment to meet a target raises reported earnings now but lowers future cash flows. Remedies from the course: long-term incentive plans, deferral and claw-backs, KPIs on material ESG issues, and engaged owners who monitor (Lecture 5).","kt":"Principal-agent problem: an agent (manager) acting for a principal (owners) has different goals and better information, so incentives and monitoring are needed.","src":"L1 slide 23"},{"id":"SB006","l":"L1","t":"Capital structure","f":"t","d":2,"p":"L","sc":"none","s":"True or false: In Modigliani-Miller Proposition II, more debt lowers the cost of equity because debt is cheaper.","o":[["True","Incorrect. MM II states that the cost of equity rises linearly with leverage to compensate shareholders for the additional risk created by debt."],["False","Correct. MM II states that the cost of equity rises linearly with leverage to compensate shareholders for the additional risk created by debt."]],"c":[1],"es":"False: under MM II the cost of equity rises with leverage.","ed":"MM I says firm value is independent of capital structure in a perfect market; MM II says the cost of equity is a linear, increasing function of leverage. Debt is cheaper, but adding it makes equity riskier, so the required return on equity rises and the overall cost of capital stays unchanged in a perfect market. Taxes, bankruptcy costs and information asymmetry break these results in practice.","kt":"","src":"L1 slide 19"},{"id":"SB007","l":"L1","t":"Traditional vs sustainable investing","f":"m","d":2,"p":"H","sc":"none","s":"Compared with traditional finance, sustainable finance may accept:","o":[["Ignoring how capital is allocated","Sustainable finance still deals with capital allocation, but for long-term sustainability."],["Shareholder value as the firm's only goal","That is the traditional finance goal; sustainable finance points to stakeholder welfare."],["Less diversification, e.g. avoiding sin stocks","Slide 32 lists this explicitly: excluding sin stocks reduces diversification but may be justified."],["No risk sharing between investors and lenders","Risk sharing remains part of finance in both paradigms."]],"c":[2],"es":"Sustainable finance may accept less diversification (e.g. excluding sin stocks) and aims at stakeholder welfare.","ed":"Traditional finance focuses on efficient capital allocation, diversification and shareholder value maximisation; sustainable finance deals with the same things but also allocates capital for long-term sustainability, sometimes accepts less diversification for good reasons and aims at stakeholder welfare. The cost of reduced diversification shows up again in portfolio optimisation with an emissions constraint (Lecture 8) and in Starks' point that values-based screening shrinks the opportunity set.","kt":"","src":"L1 slide 32 · L8 slide 7"},{"id":"SB008","l":"L1","t":"Value versus values","f":"m","d":2,"p":"H","sc":"none","s":"In Starks (2023), the difference between a \"values\" and a \"value\" ESG investor is that:","o":[["Values: beliefs; value: risk and return","This is the core distinction of the presidential address."],["Values expects ESG to beat the market; value does not","Return expectations are not what defines the two groups; motivation (preferences vs financial value) does."],["Value investors never screen; values investors never engage","Both can use screening and engagement; Starks notes negative screening can also be used by value investors."],["Values buys cheap stocks; value buys growth stocks","The terms have nothing to do with the value/growth style; they describe motivations."]],"c":[0],"es":"Values = nonpecuniary preferences; value = ESG matters for financial risk and return.","ed":"Values investors care about ESG because of their preferences (they do not want to finance or profit from objectionable activities); value investors care because ESG information sheds light on financially significant risks and return opportunities. Starks argues that mixing the two motivations is the source of much confusion, for example when interpreting ESG performance studies. Many investors combine both, and the same tool (e.g. negative screening or engagement) can serve either motivation.","kt":"","src":"Starks s. 1838-1839 · L1 slide 45"},{"id":"SB009","l":"L1","t":"Value versus values","f":"m","d":3,"p":"H","sc":"none","s":"Starks (2023) ranks investment approaches. Which order goes from most values-driven to most purely financial?","o":[["Impact investing, SRI, ESG investing, traditional investing","This is the order in Figure 1, Panel B: impact and SRI are values-focused, ESG can be both, traditional is risk and return only."],["SRI, traditional investing, impact investing, ESG investing","Traditional investing sits at the purely financial end, not between SRI and impact."],["Traditional investing, ESG investing, SRI, impact investing","This is the reverse ordering."],["ESG investing, impact investing, traditional investing, SRI","Impact investing and SRI are adjacent at the values end of the spectrum."]],"c":[0],"es":"Impact and SRI are at the values end, ESG investing in the middle, traditional investing at the financial end.","ed":"Starks uses a linear Venn diagram. Impact investors intentionally target social and environmental outcomes; SRI investors mainly avoid companies that conflict with their values (negative screening); ESG investing is the \"classic\" middle ground that can be values- or value-motivated; traditional investing cares only about risk and return. Panel C adds that return expectations differ: impact investors may accept lower returns, while value-oriented ESG investors expect no sacrifice or even better risk-adjusted returns.","kt":"","src":"Starks s. 1839-1841 · L1 slide 45-47"},{"id":"SB010","l":"L1","t":"Value versus values","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In Starks (2023), an investor who uses negative ESG screening must be a values investor.","o":[["True","Incorrect. Starks notes negative screening is a primary technique of values investors but can also be employed by value investors (e.g. to avoid financially material ESG risks), so it is not conclusive evidence."],["False","Correct. Starks notes negative screening is a primary technique of values investors but can also be employed by value investors (e.g. to avoid financially material ESG risks), so it is not conclusive evidence."]],"c":[1],"es":"False: negative screening can also be used by value investors, so it does not identify motivation on its own.","ed":"Tools do not reveal motives. A value investor may exclude, for example, thermal coal because of stranded-asset risk, while a values investor excludes it because it conflicts with their preferences. This is why Starks argues that research must separate the influences of value and values investors more cleanly before drawing conclusions about ESG performance.","kt":"","src":"Starks s. 1841"},{"id":"SB011","l":"L1","t":"Investor motivations for ESG","f":"m","d":3,"p":"H","sc":"none","s":"A survey of about 30,000 Vanguard investors (Giglio et al.) shows that:","o":[["Most expect ESG funds to beat the market","On average respondents expect ESG to underperform by around 2% per year."],["Almost everyone wants to invest in ESG","About 48% see no reason at all to invest in ESG."],["ESG demand comes mostly from values","Only about 6% are motivated by return expectations, and on average respondents expect ESG to underperform."],["Most want to hedge climate risk","Climate hedging motivates about 22%, not a majority."]],"c":[2],"es":"Most ESG demand is values-based; few investors expect higher returns, and on average they expect underperformance.","ed":"Summary of slide 44: 48% see no reason to invest in ESG, 24% are motivated by ethics, 22% by climate hedging and 6% by return expectations; on average respondents expect ESG to underperform by about 2% per year. The lecture concludes that demand is driven far more by values than by expected value, which is exactly Starks' distinction. Note that Starks (2023) cites an earlier version of this survey with slightly different percentages (45%, 25%, 25%, 7%).","kt":"","src":"L1 slide 44 · Starks s. 1844-1845"},{"id":"SB012","l":"L1","t":"Value vs values","f":"t","d":3,"p":"H","sc":"short","s":"True or false: An investor who avoids an oil stock only because she thinks its stranded-asset risk is underpriced is a \"values\" investor (Starks, 2023).","o":[["True","Incorrect. She is a \"value\" investor: her motive is risk and return. A \"values\" investor acts on non-pecuniary preferences even if it costs return."],["False","Correct. She is a \"value\" investor: her motive is risk and return. A \"values\" investor acts on non-pecuniary preferences even if it costs return."]],"c":[1],"es":"False: a risk/return motive makes her a value investor.","ed":"The same action (avoiding fossil fuels) can come from different motives. The motive matters for expected returns and for what counts as success: value investors should see better risk-adjusted returns if they are right; values investors may accept lower returns.","kt":"Value investor (Starks): uses ESG because it affects risk and return. Values investor: invests according to ethics or preferences, accepting possible financial cost.","src":"Starks s. 1838 · L1 slide 44"},{"id":"SB013","l":"L1","t":"Drivers of sustainable finance","f":"m","d":3,"p":"M","sc":"short","s":"In 2021 a Dutch court ordered Shell to cut its emissions by 45% by 2030. Which driver of sustainable finance does this show?","o":[["Regulation","Courts can create liability for emissions, turning an externality into a financial risk."],["Lower interest rates","Interest rates played no role in the ruling."],["Cheaper green technology","Technology is not the mechanism in this case."],["Consumer demand","The case was a lawsuit by NGOs and citizens, not a market demand shift."]],"c":[0],"es":"Climate litigation is a legal channel of internalisation.","ed":"For investors, the lesson is that \"unpriced\" externalities can become financially material through courts, not only through carbon taxes. This is one of the uncertainties in timing and form of internalisation (Lecture 3).","kt":"Internalisation: making a firm bear (part of) the cost of its externality, via regulation, taxes, litigation or stakeholder pressure.","src":"L5 slide 25 · L3 slide 17"},{"id":"SB014","l":"L1","t":"Sustainable finance","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A fund that only buys firms with low emissions today is automatically aligned with the Paris Agreement.","o":[["True","Incorrect. Paris alignment is forward-looking: it concerns emission pathways consistent with well below 2°C, so transition plans and future emissions matter, not just today's footprint."],["False","Correct. Paris alignment is forward-looking: it concerns emission pathways consistent with well below 2°C, so transition plans and future emissions matter, not just today's footprint."]],"c":[1],"es":"False: alignment depends on future pathways, not only current emissions.","ed":"A low-carbon portfolio today can still be misaligned if holdings plan to grow emissions, and a high emitter with a credible transition plan may contribute more to alignment. This links to transition preparedness (Lecture 8) and PwC's point on credible transition plans.","kt":"Paris Agreement (2015): limit warming to well below 2°C, pursuing 1.5°C. Alignment = being on a pathway consistent with that goal.","src":"L1 slide 37 · PwC s. 25"},{"id":"SB015","l":"L1","t":"Double materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A salmon farmer faces (i) stricter rules that may raise its costs and (ii) pollution that harms wild fish but not its profits. Under double materiality, what should it report?","o":[["Only (ii)","Double materiality adds impact materiality to financial materiality; it does not drop the financial side."],["Neither","Both are sustainability issues; the pollution in particular is an externality that does not show up in the financial statements."],["Only (i)","That is a purely financial (single) materiality view, like SASB's investor-focused definition."],["Both","Double materiality covers both directions: effects on the firm and effects of the firm on society and the environment."]],"c":[3],"es":"Double materiality = outside-in (impact on the firm's value) plus inside-out (impact of the firm on society and environment).","ed":"Financial materiality asks how ESG issues affect the company (cash flows, risk, value); impact materiality asks how the company affects people and planet. Double materiality combines both. In Lecture 6 this shows up as the contrast between SASB's investor-focused definition and GRI's broader definition, and in the CSRD (PwC guest lecture) as a legal requirement for EU sustainability reporting.","kt":"","src":"L1 slide 36 · L6 slide 50 · PwC s. 29"},{"id":"SB016","l":"L1","t":"Planetary boundaries and the doughnut","f":"m","d":2,"p":"M","sc":"none","s":"In Raworth's doughnut, the \"safe and just space for humanity\" is:","o":[["Countries that have reached all the SDGs","The doughnut is a global framework, not a list of countries."],["Between the social floor and the ecological ceiling","Correct: below the inner ring is shortfall, beyond the outer ring is overshoot."],["Carbon prices that still allow growth","Carbon prices are not what defines the doughnut."],["Above the ecological ceiling, as long as basic needs are met","Crossing planetary boundaries is \"overshoot\", outside the safe space."]],"c":[1],"es":"The safe and just space lies between the social foundation and the ecological ceiling.","ed":"Raworth combines the planetary boundaries (Steffen et al. 2015) as the ecological ceiling with 12 social priorities as the social foundation. Falling below the foundation is a shortfall (e.g. hunger, lack of education); exceeding the ceiling is an overshoot (e.g. climate change, biodiversity loss). Sustainable development means living inside this space.","kt":"","src":"L1 slide 35 · Bok s. 11 (1.2.2)"},{"id":"SB017","l":"L1","t":"Planetary boundaries and the doughnut","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook, which planetary boundary has already been crossed?","o":[["Climate change","The textbook lists climate change among the crossed boundaries (atmospheric CO2 beyond 350 ppm)."],["Atmospheric aerosol loading","No global control variable has been defined yet."],["Ocean acidification","At around 84% aragonite saturation it is still above the 80% boundary, though intensifying."],["Freshwater use","Blue water use (~2,600 km3) is below the 4,000 km3 boundary."]],"c":[0],"es":"Climate change, land-system change, biodiversity loss and biochemical flows have been crossed.","ed":"The textbook states that the boundaries for climate change, land-system change, biodiversity loss (biosphere integrity) and biochemical flows have been crossed. Ozone is recovering thanks to the Montreal Protocol, an example of successful international regulation in Chapter 2. The precautionary principle places the boundary at the start of the zone of uncertainty. Also true, but not offered as an option here: Biochemical flows (nitrogen and phosphorus).","kt":"","src":"Bok s. 10 (1.2.1) · Bok s. 9 (1.2.1) · L1 slide 35"},{"id":"SB018","l":"L1","t":"Role of the financial system","f":"m","d":3,"p":"M","sc":"none","s":"Which function of the financial system is especially relevant for sustainable finance?","o":[["Collecting savings from households","Also a Levine function, but not singled out."],["Making trade easier","This is a Levine function, but not one of the three singled out as particularly relevant."],["Guaranteeing savers a minimum return","This is not one of Levine's functions."],["Choosing where capital goes","Allocation of funding to its most productive use is a key role of finance."]],"c":[3],"es":"Information and allocation, monitoring and governance, and risk management are the three relevant functions.","ed":"Of Levine's five functions, the first three matter most for sustainable finance: (1) producing information and allocating capital, (2) monitoring and exerting corporate governance, (3) facilitating trading, diversification and management of risk. Finance can steer capital towards sustainable firms, influence firms through governance and engagement, and price long-term uncertain risks (e.g. through scenario analysis). Also true, but not offered as an option here: Monitoring investments and exerting corporate governance after providing finance.","kt":"","src":"Bok s. 18 (1.3)"},{"id":"SB019","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":2,"p":"H","sc":"none","s":"Which stage maximises social and environmental value, subject to a minimum financial value?","o":[["SF 1.0 - refined shareholder value","SF 1.0 maximises F subject to minor S and E constraints."],["Finance as usual - shareholder value","Finance as usual maximises F only."],["SF 3.0 - common good value","SF 3.0 puts S and E first, with financial viability as a constraint."],["SF 2.0 - stakeholder value","SF 2.0 optimises integrated value I = F + S + E, ranking the three equally."]],"c":[2],"es":"SF 3.0 optimises S and E subject to a minimum financial return (common good value).","ed":"Summary of Table 1.3: finance as usual maximises financial value F (short term); SF 1.0 maximises F subject to S and E constraints (refined shareholder value, short term); SF 2.0 optimises integrated value I = F + S + E (stakeholder value, medium term); SF 3.0 optimises S and E subject to F (common good value, long term). The ranking moves from finance first to S and E first, and the horizon lengthens.","kt":"","src":"Bok s. 20 (1.4) · L9 slide 29"},{"id":"SB020","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The time horizon gets longer from finance as usual and SF 1.0 (short), to SF 2.0 (medium), to SF 3.0 (long).","o":[["True","Correct. Table 1.3 assigns short term to finance as usual and SF 1.0, medium term to SF 2.0 and long term to SF 3.0."],["False","Incorrect. Table 1.3 assigns short term to finance as usual and SF 1.0, medium term to SF 2.0 and long term to SF 3.0."]],"c":[0],"es":"True: the horizon broadens from short to long term across the stages.","ed":"Sustainability is about the future, so moving from shareholder value to common good value goes together with a longer horizon. This is why short-termism (quarterly reporting, annual bonuses, quarterly benchmarking) is treated as a key obstacle in Chapter 3 and Lecture 5.","kt":"","src":"Bok s. 20 (1.4)"},{"id":"SB021","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":3,"p":"H","sc":"none","s":"Why does exclusion (SF 1.0) have only a limited effect at first?","o":[["Too few green investors to raise polluters' costs","This is the Heinkel, Kraus and Zechner argument used in section 1.4.1."],["Excluded shares disappear from the market","Excluded shares are bought by other investors; that is precisely why the effect is limited."],["Excluded firms simply get cheaper bank loans instead","The textbook does not make this argument."],["Exclusion is illegal for pension funds","Exclusion is widely used and legal; the issue is its limited price effect."]],"c":[0],"es":"Divested shares are bought by others; the cost-of-capital effect is small unless a large share (>20%) of investors are green.","ed":"When some investors exclude a firm, fewer investors hold it, which lowers its price and raises its cost of capital, but only modestly. Heinkel, Kraus and Zechner estimate that more than 20% green investors are needed to induce polluters to reform, while evidence suggests at most 10% are green. Divestment can still matter through stigmatisation (loss of social licence to operate) and by setting norms. Lecture 9 adds evidence that excluded energy firms are key green innovators (Cohen, Gurun and Nguyen).","kt":"","src":"Bok s. 21 (1.4.1) · L9 slide 33"},{"id":"SB022","l":"L1","t":"Integrated value","f":"m","d":4,"p":"M","sc":"none","s":"Which extra condition does SF 2.0 add when maximising integrated value?","o":[["F must equal S + E","No such equality is imposed."],["S and E may not get worse than before","Equation 1.2 requires SEV in the next period to be at least as high as today."],["Only a one-year horizon is used","SF 2.0 has a medium-term horizon; a one-year horizon is not a constraint."],["S and E use the same discount rate as F","Private discounting is a problem the textbook highlights, not the constraint it adds."]],"c":[1],"es":"SF 2.0 adds the constraint that SEV cannot fall below its initial level.","ed":"Because IV adds up F, S and E, large financial gains could \"offset\" serious environmental damage such as deforestation, effectively legitimising destruction. To avoid this, Box 1.4 constrains next-period social and environmental value to be at least the current value. Other caveats are uncertainty in pricing (e.g. climate scenarios) and lack of stakeholder participation. Chapter 2 repeats the same caveat when monetising externalities.","kt":"","src":"Bok s. 22 (1.4.2) · Bok s. 23 (Box 1.4) · L3 slide 32"},{"id":"SB023","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"t","d":4,"p":"M","sc":"none","s":"True or false: Social and environmental effects come later and are less certain, so a private discount rate gives them less weight than financial value.","o":[["True","Correct. The textbook states that private discounting (higher than the public rate because of uncertainty) leads to a lower weighting of S and E value, since these impacts are long term and more uncertain."],["False","Incorrect. The textbook states that private discounting (higher than the public rate because of uncertainty) leads to a lower weighting of S and E value, since these impacts are long term and more uncertain."]],"c":[0],"es":"True: private discounting systematically underweights long-term, uncertain S and E impacts.","ed":"Firms use a private discount rate that is higher than the public rate. The further in the future and the more uncertain an impact is, the smaller its present value. Since S and E impacts are long term, they weigh less than financial value in the integrated value calculation. Stern argues the public discount rate should be very small or zero to treat generations equally, which is one reason private effort is insufficient (Chapter 2).","kt":"","src":"Bok s. 22 (1.4.2) · Bok s. 55 (2.3.2)"},{"id":"SB024","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":4,"p":"M","sc":"none","s":"According to the textbook, where are most firms today, and what is the challenge?","o":[["At SF 2.0; the challenge is SF 3.0","The textbook sees firms close to SF 1.0, not SF 2.0."],["At SF 1.0; the challenge is SF 2.0","The textbook approximates alpha = 0.1 and calls the switch from SF 1.0 to SF 2.0 the real challenge."],["At finance as usual; the challenge is exclusion","The textbook says the majority are at SF 1.0, with about 30-40% of financial institutions adopting sustainable principles."],["At SF 3.0; the challenge is returns","Fewer than 1% of financial institutions adopt SF 3.0."]],"c":[1],"es":"Most firms are near SF 1.0 (S and E weighted ~10%); the key step is from SF 1.0 to SF 2.0.","ed":"Firms that adopt sustainable principles only partly maximise IV, which can be written as max V = FV + alpha(SV + EV) with alpha around 0.1. They are just above SEVmin. The textbook calls the switch from SF 1.0 to SF 2.0 the real challenge and relates it to Hart and Zingales' distinction between shareholder value (SF 1.0) and shareholder welfare (SF 2.0). Fewer than 1% of financial institutions are at SF 3.0.","kt":"","src":"Bok s. 27 (1.4.4) · Bok s. 28 (1.4.4)"},{"id":"SB025","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":3,"p":"H","sc":"none","s":"In banking, which instrument is SF 3.0?","o":[["Impact lending and microfinance","Table 1.4 lists impact lending and microfinance as SF 3.0 in banking."],["ESG integration in credit risk models","ESG integration is SF 2.0."],["Exclusion of very harmful sectors from the loan book","Exclusion is SF 1.0 across all sectors."],["Catastrophe bonds","Cat bonds are an insurance risk-transfer tool and not the SF 3.0 entry for banking."]],"c":[0],"es":"SF 3.0 in banking = impact lending and microfinance (green/social bonds for bonds, impact investing for equity, microinsurance for insurance).","ed":"Summary of Table 1.4: SF 1.0 = exclusion and SF 2.0 = ESG integration across equity, bonds, banking and insurance. SF 3.0 differs by sector: impact investing (equity), green and social bonds (bonds), impact lending and microfinance (banking), microinsurance (insurance). Lecture 11 repeats this: exclusion and ESG integration are risk based, impact lending and microfinance are value based.","kt":"","src":"Bok s. 30 (Table 1.4) · L11 slide 18"},{"id":"SB026","l":"L1","t":"Legitimacy theory","f":"m","d":2,"p":"M","sc":"none","s":"Legitimacy theory says that:","o":[["Legitimacy depends only on shareholder value","This is the shareholder view, not legitimacy theory."],["Following the law is always enough for legitimacy","The social licence goes beyond legal compliance to society's expectations."],["Firms need society's approval to operate","This is the textbook definition underpinning SF 3.0."],["Only governments can give legitimacy","The social licence is granted informally by society, not only by formal permits."]],"c":[2],"es":"Firms seek societal approval (a social licence to operate) to ensure their continued existence.","ed":"The social licence to operate represents society's expectations about how a firm conducts its operations, including social and environmental standards. Losing it can threaten the business, which Chapter 5 values explicitly (NPV at various probabilities of losing the licence to operate for a mining company). Divestment campaigns can also stigmatise a sector to the point where it loses its social licence.","kt":"","src":"Bok s. 26 (1.4.3) · Bok s. 21 (1.4.1)"},{"id":"SB027","l":"L1","t":"Inside-out vs outside-in","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In Dyllick and Muff, the \"outside-in\" view asks how a firm can reduce its own impact on society and nature.","o":[["True","Incorrect. That describes the inside-out perspective. The outside-in perspective asks how the company can contribute effectively to solving social and environmental challenges."],["False","Correct. That describes the inside-out perspective. The outside-in perspective asks how the company can contribute effectively to solving social and environmental challenges."]],"c":[1],"es":"False: reducing own impact is inside-out; outside-in asks how to help solve societal challenges.","ed":"Inside-out starts from the firm and asks how to reduce its negative impacts (helpful but limited). Outside-in starts from society's challenges (e.g. the SDGs, planetary boundaries) and asks how the firm can contribute to solving them. Outside-in allows a system approach and is associated with SF 3.0 and impact.","kt":"","src":"Bok s. 26 (1.4.3) · Bok s. 23 (1.4.2)"},{"id":"SB028","l":"L1","t":"Fair financial return","f":"m","d":2,"p":"M","sc":"none","s":"In SF 3.0, a \"fair financial return\" means:","o":[["A zero return, like charity","Impact investing has return expectations and is not charity (GIIN criteria)."],["At least the market return","Many impact investors target market rates, but the definition only requires capital preservation."],["The highest return possible without sin stocks","This describes SF 1.0, not the SF 3.0 constraint."],["At least keeping capital's real value","This is the key-concept definition."]],"c":[3],"es":"A fair financial return preserves at least the (real) value of capital.","ed":"In SF 3.0 finance moves from primacy to serving: investors maximise social and environmental value subject to FV(t+1) >= (1 + r_fair) FV(t), with r_fair >= 0. Without financial viability, projects may be aborted early. GIIN survey data in the textbook show most impact investors still target market-rate or close to market-rate returns.","kt":"","src":"Bok s. 24 (1.4.3) · Bok s. 32 (Key concepts)"},{"id":"SB029","l":"L1","t":"ESG and financial performance","f":"m","d":4,"p":"M","sc":"none","s":"What does the evidence say about sustainability and financial performance?","o":[["Sustainable banks earn far higher returns","Average ROE was slightly lower for sustainable banks (8.3% vs 8.7%) but much less volatile."],["SRI funds always do much worse","Several studies find little difference in average performance."],["Sustainable firms always earn more short term","Ortiz-de-Mandojana and Bansal find no differences in short-term profits, only lower volatility and higher survival."],["No clear negative link; SRI results are mixed","Busch, Bauer and Orlitzky conclude there is no clear trade-off; SRI fund evidence is mixed."]],"c":[3],"es":"No clear trade-off: evidence is mixed, but there is no clear negative relationship.","ed":"Busch, Bauer and Orlitzky find no clear trade-off; Ortiz-de-Mandojana and Bansal find sustainable firms have lower volatility, higher sales growth and higher survival but similar short-term profits; values-based banks have slightly lower but much more stable ROE than G-SIBs; SRI fund evidence is mixed. Starks warns that such comparisons mix value and values investors, which muddles the interpretation.","kt":"","src":"Bok s. 25 (1.4.3) · Bok s. 26 (1.4.3) · L11 slide 22"},{"id":"SB030","l":"L1","t":"ESG and financial performance","f":"m","d":4,"p":"M","sc":"none","s":"Why is it hard to say whether ESG investing performs better, according to Starks (2023)?","o":[["Firm characteristics never affect returns","This contradicts basic asset pricing and is not her argument."],["There are too few ESG funds","Thousands of studies and many funds exist; quantity is not the problem."],["Theory says ESG must always win","Theory gives conflicting predictions; a values approach may imply a constrained, lower-return portfolio."],["ESG funds have very different goals","An amalgam of strategies makes comparisons across time and studies hard."]],"c":[3],"es":"Heterogeneous strategies and mixed value/values motives muddle ESG performance comparisons.","ed":"Starks asks not whether ESG beats the market, but whether we ask the right questions. A values approach often relies on negative screening, shrinking the opportunity set (a constrained optimisation that need not outperform), while a value approach expects better risk management or return opportunities. Since ESG samples mix both types and many strategies, aggregate results are hard to interpret. Lecture 9 repeats that the ESG factor debate is unresolved. Also true, but not offered as an option here: Value and values investors have different return expectations, and their influences must be separated.","kt":"","src":"Starks s. 1851-1853"},{"id":"SB031","l":"L1","t":"Value versus values","f":"m","d":4,"p":"M","sc":"none","s":"According to Starks (2023), green securities carry a \"greenium\" when:","o":[["Regulators ban brown assets","This is not the mechanism discussed."],["Almost all investors are value investors","Starks says that if enough investors are driven by value considerations, securities should be priced fairly (no greenium)."],["Values investors accept lower returns","Starks notes that if managers become greener to lower their cost of capital to satisfy values investors, securities may carry a greenium."],["Green firms must pay more for tech risk","A greenium means lower, not higher, required returns for green assets."]],"c":[2],"es":"A greenium arises when values investors bid up green securities, lowering green firms' cost of capital.","ed":"A greenium is a lower required return (higher price) for green assets. It arises if enough investors have nonpecuniary preferences for green assets. If instead most capital is driven by value considerations, green and brown firms should be priced fairly. Lecture 9 adds that green assets should have lower expected returns (taste and hedging premium), while realised returns can be high if green demand shifts unexpectedly (Pastor, Stambaugh and Taylor).","kt":"","src":"Starks s. 1848 · L9 slide 14-15"},{"id":"SB032","l":"L1","t":"ESG and value","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"The EU introduces stricter energy rules for buildings. A property firm owns many old, inefficient offices. How is its value hit?","o":[["Lower rents and higher costs","Inefficient buildings lose tenants and value, and need costly upgrades."],["Higher dividends forced by law","Energy rules do not set dividends."],["No effect on buildings","Tangible assets can become stranded when regulation changes."],["A lower tax rate","Taxes are not changed by the standard."]],"c":[0],"es":"Regulation → lower revenues, higher capex, write-downs: a stranded-asset risk.","ed":"This is the cash flow channel of Lecture 9: revenues (rents, vacancy), costs and capex (retrofits) and asset values. Banks feel it too through collateral (Lecture 11), which is why energy-efficient mortgages and green leases exist (Lectures 10-11).","kt":"Stranded asset: an asset that loses value earlier than expected because of regulation, technology or market shifts.","src":"L1 slide 27 · Bok s. 291 (10.3)"},{"id":"SB033","l":"L1","t":"Value versus values","f":"m","d":5,"p":"H","sc":"none","s":"Which statement fits both Starks' value/values idea and the SF 1.0-3.0 stages?","o":[["Values investors never accept lower returns","Starks shows values and impact investors may have a measurable willingness to pay (accept lower returns)."],["Any exclusion list means SF 3.0","Exclusion is SF 1.0 in the typology; SF 3.0 is positive selection (inclusion lists, impact)."],["A traditional investor is already at SF 2.0","This is finance as usual; the textbook stresses that externalities are not priced by markets."],["Lower returns for impact: SF 3.0 and values","SF 3.0 optimises SEV subject to a minimum financial value; Starks places impact investors at the values end and notes they may accept lower returns."]],"c":[3],"es":"SF 3.0 + accepting lower returns for impact = values; ESG integration for risk/return = value.","ed":"Starks classifies investors by motivation (values = preferences, value = risk and return), while the SF typology classifies by objective function (what is maximised and what is a constraint). They line up loosely: impact investing that optimises SEV subject to a fair return is SF 3.0 and values-driven; ESG integration that prices material risks is SF 2.0-style risk-based practice and can be purely value-driven; exclusion is SF 1.0 and can serve either motive. The lesson from both: look at the objective and motive, not just the label. Also true, but not offered as an option here: An investor who integrates material ESG risks into cash-flow forecasts purely to improve risk-adjusted returns is value-motivated, even though the strategy is labelled ESG.","kt":"","src":"Starks s. 1839-1841 · Bok s. 20 (Table 1.3) · L9 slide 29"},{"id":"SB034","l":"L1","t":"Sustainable development","f":"m","d":1,"p":"M","sc":"none","s":"The Brundtland Report (1987) defines sustainable development as development that:","o":[["puts nature above all other goals","The concept integrates economic, social and environmental aspects."],["stops using non-renewable resources","Sustainable development is about staying within regenerative capacity, not zero use."],["maximises GDP growth while keeping inflation low","Brundtland explicitly broadens development beyond growth."],["meets today's needs without hurting future ones","This is the Brundtland definition quoted in the textbook."]],"c":[3],"es":"Meeting present needs without compromising future generations' ability to meet theirs.","ed":"The Brundtland Commission, chaired by former Norwegian Prime Minister Gro Harlem Brundtland, stresses that environment and development are inseparable and that sustainability is about the future. The textbook's own definition is that current and future generations have the resources needed (food, water, health care, energy) without stressing Earth system processes.","kt":"","src":"Bok s. 6 (1.1)"},{"id":"SB035","l":"L1","t":"SF 1.0, 2.0 and 3.0","f":"m","d":5,"p":"M","sc":"constructed_scenario","s":"A pension fund first excludes coal, but still maximises financial return. Later it puts carbon prices in its forecasts and aims to maximise integrated value. What are these two steps?","o":[["SF 2.0, then finance as usual","Exclusion is SF 1.0; internalising carbon costs is the core of SF 2.0, not finance as usual."],["Both are SF 3.0","SF 3.0 maximises SEV subject to a minimum financial value; here financial value is still maximised."],["Neither changes the goal","Exclusion changes the constraint set; carbon prices mainly change expected cash flows."],["SF 1.0, then SF 2.0","Exclusions are the SEV >= SEVmin constraint of SF 1.0; pricing carbon in forecasts moves towards integrated value (SF 2.0)."]],"c":[3],"es":"Exclusion tightens the SF 1.0 constraint (SEVmin); pricing externalities into forecasts is a step towards SF 2.0.","ed":"The textbook notes the framework is dynamic: NGOs push investors to raise the minimum level by expanding exclusions, and regulation or taxation of externalities shifts weight towards the social-environmental component. The three objective functions differ in what is maximised and what is a constraint. SF 1.0 maximises FV subject to SEV >= SEVmin (exclusion lists). SF 2.0 maximises integrated value subject to SEV not worsening. SF 3.0 maximises SEV subject to a minimum (fair) financial value. The same structure appears on Lecture 9, slide 29 (risk/return optimisation, exclusionary screening, ESG integration, impact investing).","kt":"","src":"Bok s. 22 (Box 1.3) · L9 slide 29"},{"id":"TR01","l":"L1","t":"Real options","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A shipping firm plans to buy a ship now, but a cleaner engine may arrive in two to three years. Which tool fits this choice?","o":[["Beta estimation","Beta measures systematic risk; it says nothing about the value of waiting."],["Agency theory","Agency problems are not the issue here; the issue is investment timing under uncertainty."],["Real options","The lecture uses exactly this case: waiting has value when new technology may cut emissions and fuel costs."],["Negative screening","Screening is an investor portfolio strategy, not a corporate timing decision."]],"c":[2],"es":"Waiting has option value when green technology may arrive soon.","ed":"Standard NPV treats the decision as now-or-never. With transition risk (new rules, new engines), the option to defer can be worth more than investing today. The same logic appears in Lecture 9: optionality is one way sustainability enters valuation.","kt":"Real option: the right, but not the obligation, to take an action later (e.g. defer, expand, abandon) once more is known.","src":"Opptak L1 ca. 65 min · Opptak L9 ca. 18 min"},{"id":"TR02","l":"L1","t":"Planetary boundaries and the doughnut","f":"t","d":3,"p":"H","sc":"none","s":"True or false: The lecturer argues that developing countries should make the same fast, deep emission cuts as rich countries.","o":[["True","Incorrect. She stresses that many people still live below the social foundation, and that polluting may be the least costly way for poorer countries to meet basic needs; we should design strategies rather than \"just point fingers\"."],["False","Correct. She stresses that many people still live below the social foundation, and that polluting may be the least costly way for poorer countries to meet basic needs; we should design strategies rather than \"just point fingers\"."]],"c":[1],"es":"False: the shortfall side matters too; one-size-fits-all cuts ignore basic needs.","ed":"The doughnut has two boundaries. Policy that only targets overshoot can push people further into shortfall. This links to the just transition idea in Lecture 13: the costs of decarbonising must be shared fairly.","kt":"Social foundation: the inner ring of the doughnut; falling below it means people lack basic needs (shortfall).","src":"Opptak L1 ca. 79 min"},{"id":"TR03","l":"L1","t":"Drivers of sustainable finance","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"With no law requiring it, a milk producer loses customers to a rival that has cut its emissions. Which driver of sustainable finance is this?","o":[["Regulation","The scenario states that no law requires the change."],["Physical climate damage","Nothing in the case concerns physical damage."],["Modigliani-Miller","MM concerns capital structure, not demand."],["Client demand","Consumers rewarding the greener rival (and boycotting others) is the client-demand driver."]],"c":[3],"es":"Customers switching to greener products = client demand.","ed":"The lecture names three drivers: materiality (climate and pollution hurt firms), client demand (consumers, employees and investors want sustainable products, and may boycott), and regulation (mainly EU rules). Even a purely profit-driven firm responds to the second and third.","kt":"","src":"Opptak L1 ca. 77 min"},{"id":"EX03","l":"L2","t":"Exam sample: consequentialism","f":"t","d":2,"p":"H","sc":"none","s":"Is utilitarianism classified as a non-consequentialist ethical theory?","o":[["Yes","Feil. Utilitarianism er consequentialist: den bedømmer handlinger ut fra konsekvensene (total nytte)."],["No","Riktig. Utilitarianism er consequentialist: den bedømmer handlinger ut fra konsekvensene (total nytte)."]],"c":[1],"es":"Nei: utilitarianism = consequentialist.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- Consequentialist (resultatet teller): ethical egoism, utilitarianism.\n- Non-consequentialist (prinsippet teller): ethics of duty (Kant), rights, justice.","kt":"Consequentialist vs non-consequentialist theories.","src":"L2 slide 9 · Crane s. 17","k":1,"x":1},{"id":"CX009","l":"L2","t":"Normative vs descriptive ethics","f":"m","d":2,"p":"H","sc":"none","s":"A descriptive (not normative) ethics question is:","o":[["Should firms ever accept child labour in supply chains?","'Should' = normativ."],["Why do employees break rules when under pressure?","Den beskriver hvordan folk faktisk oppfører seg."],["Is it morally wrong to mislead a firm's investors?","Den spør hva som er rett eller galt, altså normativ."],["What would a fair wage for workers be?","Den spør hva som er rettferdig, altså normativ."]],"c":[1],"es":"Descriptive = hvordan folk faktisk handler.","ed":"Normative teorier (Kant, utilitarianism) sier hva man bør gjøre. Descriptive teorier (CMD, moral intensity) forklarer hvorfor folk handler som de gjør.","kt":"","src":"L2 slide 7 · L2 slide 12 · Crane s. 53","k":1},{"id":"CX010","l":"L2","t":"Utilitarianism","f":"t","d":2,"p":"H","sc":"none","s":"Can utilitarianism justify harming a small group if the total benefit for everyone is larger?","o":[["Yes","Riktig. Utilitarianism ser på summen. Blir summen positiv, kan skade på noen godtas."],["No","Feil. Utilitarianism ser på summen. Blir summen positiv, kan skade på noen godtas."]],"c":[0],"es":"Ja: summen avgjør.","ed":"Dette er en klassisk kritikk av utilitarianism: minoriteter kan bli ofret for flertallets nytte. Rights og Kant setter grenser for dette.","kt":"","src":"L2 slide 9 · Crane s. 17","k":1},{"id":"CX011","l":"L2","t":"Kant's ethics of duty","f":"t","d":2,"p":"H","sc":"none","s":"Does Kant's ethics allow using people merely as a means if the outcome is good enough?","o":[["Yes","Feil. Kant sier at mennesker aldri skal brukes bare som et middel, uansett resultat."],["No","Riktig. Kant sier at mennesker aldri skal brukes bare som et middel, uansett resultat."]],"c":[1],"es":"Nei: aldri 'merely as a means'.","ed":"Kant er non-consequentialist: handlingen bedømmes ut fra plikt og prinsipp, ikke resultatet. To tester: universalisability og humanity (ikke bare et middel).","kt":"","src":"L2 slide 9 · Crane s. 17 · Crane s. 18","k":1},{"id":"CX012","l":"L2","t":"Ethical egoism","f":"m","d":2,"p":"H","sc":"none","s":"Ethical egoism is classified as:","o":[["As a form of virtue ethics","Virtue ethics handler om karakter, ikke eget utfall."],["As a form of discourse ethics","Discourse ethics handler om dialog."],["As a non-consequentialist theory","Egoism ser på resultatet for en selv, så den er consequentialist."],["As a consequentialist theory","Den bedømmer handlinger ut fra konsekvensene for en selv."]],"c":[3],"es":"Egoism og utilitarianism er begge consequentialist.","ed":"Forskjellen mellom de to consequentialist-teoriene: egoism ser på konsekvensene for meg, utilitarianism ser på konsekvensene for alle.","kt":"","src":"Opptak L2 ca. 33 min","k":1},{"id":"CX013","l":"L2","t":"Rights and justice","f":"m","d":2,"p":"H","sc":"none","s":"The ethical theory that focuses on how benefits and burdens are distributed is:","o":[["Ethical egoism","Egoism ser bare på eget beste."],["Justice","Justice = rettferdig fordeling."],["Virtue ethics","Virtue ethics handler om karakter."],["Rights","Rights handler om hver enkelts grunnleggende rettigheter."]],"c":[1],"es":"Fordeling = justice.","ed":"Justice og rights er begge non-consequentialist. Rights handler om hver enkelts grunnleggende rettigheter, justice om rettferdig fordeling.","kt":"","src":"L2 slide 9 · Crane s. 26 · Crane s. 27","k":1},{"id":"CX014","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"H","sc":"none","s":"Virtue ethics asks:","o":[["What would a person of good character do?","Virtue ethics = karakter og integritet."],["Could my rule be followed by everyone?","Det er Kant (universalisability)."],["Which action gives the most total happiness?","Det er utilitarianism."],["What can all parties agree on in dialogue?","Det er discourse ethics."]],"c":[0],"es":"Virtue = karakter.","ed":"Huskeliste:\n- Utilitarianism: størst sum?\n- Kant: kan alle gjøre det?\n- Virtue: hva ville et godt menneske gjort?\n- Care: tar det vare på relasjonene?\n- Discourse: kan alle enes i åpen dialog?","kt":"","src":"L2 slide 10 · Crane s. 31","k":1},{"id":"CX015","l":"L2","t":"Alternative ethical theories","f":"m","d":2,"p":"H","sc":"none","s":"The ethical theory that focuses on relationships and the needs of specific people is:","o":[["Kantian ethics","Kant handler om universelle plikter."],["Discourse ethics","Discourse handler om åpen dialog."],["Utilitarianism","Utilitarianism handler om total nytte."],["Ethic of care","Care = relasjoner og empati."]],"c":[3],"es":"Relasjoner = ethic of care.","ed":"Ethic of care ser den konkrete situasjonen og menneskene i den, i stedet for abstrakte regler som Kant.","kt":"","src":"L2 slide 10 · Crane s. 31","k":1},{"id":"CX016","l":"L2","t":"Absolutism and relativism","f":"m","d":2,"p":"H","sc":"none","s":"Saying that whether bribery is wrong depends entirely on local culture is:","o":[["Ethical absolutism","Absolutism: samme regler overalt."],["Ethical pluralism","Pluralism er mellomtingen boka anbefaler."],["Ethical relativism","Moral avhenger av kultur = relativism."],["Ethical egoism","Egoism handler om eget beste."]],"c":[2],"es":"'Kommer an på kulturen' = relativism.","ed":"Absolutism: universelle regler. Relativism: avhenger av kultur. Boka anbefaler en mellomting (pluralism).","kt":"","src":"L2 slide 7 · Crane s. 4 · Crane s. 3","k":1},{"id":"CX017","l":"L2","t":"Cognitive moral development","f":"m","d":2,"p":"H","sc":"short","s":"An employee who refuses to pay a bribe because it breaks her own principles, even though her boss wants it, is at the:","o":[["Moral muteness","Moral muteness er å unngå moralsk språk, ikke et CMD-nivå."],["Pre-conventional level","Pre-conventional handler om egen fordel eller straff."],["Post-conventional level","Hun følger egne prinsipper, også mot gruppen og sjefen."],["Conventional level","Conventional ville betydd å følge det sjefen og gruppen forventer."]],"c":[2],"es":"Egne prinsipper mot gruppepress = post-conventional.","ed":"Kohlberg:\n- Pre-conventional: hva gagner meg?\n- Conventional: hva forventer andre?\n- Post-conventional: hva sier mine prinsipper?","kt":"","src":"L2 slide 16-17 · Crane s. 64 · Crane s. 65","k":1},{"id":"CX018","l":"L2","t":"Moral intensity","f":"m","d":2,"p":"H","sc":"none","s":"According to Jones, an issue feels MORE morally intense when:","o":[["The harm is large and happens soon","Magnitude og temporal immediacy øker moral intensity."],["The harm affects distant strangers","Lav proximity gir lavere intensitet."],["The harm lies far in the future","Skade langt frem i tid føles mindre intens."],["The harm is unlikely to happen","Lav probability of effect gir lavere intensitet."]],"c":[0],"es":"Stor, snart, sannsynlig, nær = høy intensitet.","ed":"Seks faktorer: magnitude, social consensus, probability of effect, temporal immediacy, proximity, concentration of effect. Dette forklarer også hvorfor klima er vanskelig: skaden er langt frem og ofte langt unna.","kt":"","src":"L2 slide 20 · Crane s. 76","k":1},{"id":"SB036","l":"L2","t":"Normative vs descriptive ethics","f":"m","d":1,"p":"H","sc":"none","s":"The difference between normative and descriptive ethical theories is that:","o":[["Normative is for people; descriptive is for firms","Both can be applied to individuals and organisations; the difference is prescription versus explanation."],["Normative describes; descriptive tells what to do","This reverses the two: normative prescribes, descriptive explains actual behaviour."],["Normative comes from religion; descriptive comes from philosophy","Crane et al. distinguish religious from philosophical sources of normative ethics; that is not the normative/descriptive split."],["Normative: what is right; descriptive: what people do","Normative = rules and principles that determine right and wrong; descriptive = how decisions are actually made and what influences them."]],"c":[3],"es":"Normative = what ought to be done; descriptive = what people actually do and why.","ed":"Normative ethical theories are rules, guidelines, principles and approaches that determine right and wrong (e.g. utilitarianism, Kantian duty, virtue ethics). Descriptive ethical theories describe how ethical decisions are actually made in business and explain which individual and situational factors influence them. Crane et al. stress that descriptive theory also helps managers find points of leverage for improving ethical decision-making.","kt":"","src":"L2 slide 7 · L2 slide 12 · Crane s. 53"},{"id":"SB037","l":"L2","t":"Absolutism and relativism","f":"m","d":2,"p":"H","sc":"none","s":"A manager says that whether small bribes to officials are wrong depends only on loca
