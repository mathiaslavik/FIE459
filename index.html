?","o":[["Stop thinking about sustainability","The point is integration, not abandonment."],["ESG is part of normal analysis","ESG becomes integrated rather than a separate label."],["Only ESG funds should think long-term","The quote says all investing should consider them."],["Leave ESG to rating agencies","The lecture stresses in-house, integrated analysis."]],"c":[1],"es":"Long-term, material ESG factors are simply part of good investing.","ed":"The slide contrasts hype (\"ESG = excess return\", greenwashing, disclosure avalanche) with open questions (financial materiality, credible transition plans, real-world outcomes). The conclusion echoes the textbook's SF 2.0: ESG integration through fundamental analysis rather than labels. It also connects to Brooks' \"greenhushing\" and to Starks' \"value vs values\" distinction.","kt":"","src":"Folketrygdfondet s. 26 · Folketrygdfondet s. 27"},{"id":"SB469","l":"GUEST","t":"Folketrygdfondet","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Folketrygdfondet's expectations to companies cover only climate, since climate is the only material ESG topic for Norwegian firms.","o":[["True","Incorrect. The expectations also cover strategy and capital structure, anti-corruption, human and labour rights, nature, remuneration and bond issuance."],["False","Correct. The expectations also cover strategy and capital structure, anti-corruption, human and labour rights, nature, remuneration and bond issuance."]],"c":[1],"es":"False: expectations cover a broad set of governance, social and environmental topics.","ed":"As the largest institutional investor on Oslo Børs, Folketrygdfondet publishes expectations (updated December 2025) on strategy, capital structure and financial targets, anti-corruption, human and labour rights, climate, nature and ecosystems, executive and board pay, and bond issuance (including issuer and lead manager roles). Companies and other shareholders look to its views.","kt":"","src":"Folketrygdfondet s. 19"},{"id":"SB470","l":"GUEST","t":"Fondsfinans","f":"m","d":2,"p":"H","sc":"none","s":"How does Melanie Brooks (Fondsfinans) separate \"ESG\" from \"sustainability\"?","o":[["ESG is product impact; sustainability is governance","This reverses the distinction."],["ESG: how it runs; sustainability: what it sells","Every company has ESG considerations; there is no \"ESG company\"."],["Sustainability is relative; ESG is absolute","ESG performance is usually scored relative to industry peers."],["They mean the same","The slide warns they are not necessarily the same."]],"c":[1],"es":"ESG = operations and management (often peer-relative); sustainability = contribution of products/services to outcomes (SDGs, Paris, taxonomy).","ed":"This matches Table 8.1 in the textbook (operations vs products focus) and the critique that industry-relative ESG ratings can rate an oil major highly. A company can be well run (good ESG) without being \"sustainable\" in what it sells, and vice versa.","kt":"","src":"Fondsfinans s. 6 · Bok s. 212 (Table 8.1)"},{"id":"SB471","l":"GUEST","t":"Fondsfinans","f":"m","d":2,"p":"M","sc":"none","s":"Brooks describes a move from \"greenwashing\" to \"greenwishing\" and \"greenhushing\". Greenhushing means:","o":[["Firms say less","Stricter scrutiny makes firms quieter to avoid accusations."],["Firms exaggerate green claims","That is greenwashing."],["Regulators ban green claims","Greenhushing is a firm behaviour, not a regulatory ban."],["Firms set unrealistic goals","That is closer to greenwishing."]],"c":[0],"es":"Greenhushing = under-communicating sustainability efforts to avoid scrutiny.","ed":"As regulations multiplied (868 ESG regulations globally by 2022, 60% in Europe) and greenwashing accusations rose, some firms and funds moved to greenhushing. The SFDR mass reclassification from Article 9 to Article 8 (Lecture 8) is a related phenomenon. Greenhushing reduces transparency and can hide genuine progress.","kt":"","src":"Fondsfinans s. 9 · Fondsfinans s. 10 · L8 slide 26"},{"id":"SB472","l":"GUEST","t":"Fondsfinans","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: A manager whose mandate requires ESG integration but who ignores material ESG risks can face outflows, reputation damage and legal trouble, even with good returns.","o":[["True","Correct. The asset owner/mandate perspective: breaching mandate requirements creates outflow, reputational and legal risk regardless of short-term returns."],["False","Incorrect. The asset owner/mandate perspective: breaching mandate requirements creates outflow, reputational and legal risk regardless of short-term returns."]],"c":[0],"es":"True: mandate breaches carry outflow, reputational and legal risk.","ed":"Brooks lists three perspectives: financial (material ESG can but does not always improve returns), mandate, and regulatory (licence to operate). The DWS fine shows the legal side of mis-stating ESG practices.","kt":"Investment mandate: the contract setting the objectives, constraints and requirements an asset manager must follow for a client.","src":"Fondsfinans s. 12"},{"id":"SB473","l":"GUEST","t":"Fondsfinans","f":"t","d":3,"p":"M","sc":"none","s":"True or false: According to NBIM (quoted by Brooks), risk-based divestments since 2012 have cut equity returns by several percentage points.","o":[["True","Incorrect. NBIM reports risk-based divestments INCREASED cumulative return by 0.64 percentage points (about 0.02 pp per year), with climate and human rights divestments contributing 0.30 and 0.16 pp."],["False","Correct. NBIM reports risk-based divestments INCREASED cumulative return by 0.64 percentage points (about 0.02 pp per year), with climate and human rights divestments contributing 0.30 and 0.16 pp."]],"c":[1],"es":"False: risk-based divestments added about 0.64 pp cumulatively.","ed":"The effect is positive but small, consistent with the view that divesting firms with unpriced or unacceptable ESG risk need not hurt returns. Combined with the cost of ESG controversies (BofA/RepRisk), it supports managing ESG risk. Note the debate in Lecture 9 on whether divestment changes real-world outcomes.","kt":"","src":"Fondsfinans s. 15 · L9 slide 33"},{"id":"SB474","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"H","sc":"none","s":"Which weakness of \"off the shelf\" ESG ratings does Brooks highlight (\"Aggregate Confusion\")?","o":[["They favour small emerging market firms","The bias favours large companies and developed markets."],["They are audited and forward-looking","Data are mostly self-reported, not standardised and backward-looking."],["They measure real outcomes precisely","The link between ESG scores and sustainability is insufficient."],["Different providers disagree a lot","Also listed: self-reported data, opaque methods, large-cap bias, weak link to sustainability."]],"c":[3],"es":"Ratings: self-reported, backward-looking data; opaque methods; large-cap/DM bias; low correlation; weak link to sustainability.","ed":"This matches Lecture 7 (Kotsantonis: disagreement rises with information) and the textbook's design limitations of ratings (Lecture 8). Brooks recommends more granular sources (company filings, media, NGOs, regulators, specialist data providers) to understand what a company does, how, when and where.","kt":"","src":"Fondsfinans s. 16 · Fondsfinans s. 17 · L7 slide 37"},{"id":"SB475","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"H","sc":"short","s":"A chip maker uses lots of water in a drought area. Its water use harms local farmers today, and water shortages could stop its production later. Which concept fits?","o":[["Accounting materiality","Accounting materiality ignores impacts on society."],["Not material","Unpriced resources are exactly what can become material."],["Only financial materiality","The example includes impact and changes over time."],["Double and dynamic","Impact on society and financial impact on the firm, changing over time."]],"c":[3],"es":"Double = firm→society and society→firm; dynamic = materiality changes over time.","ed":"Brooks distinguishes financial materiality (how ESG affects the company), impact materiality (what the company does to society and the environment) and double and dynamic materiality (both directions, changing over time as new factors emerge). Water stress is her example of a double material risk. This links to GRI vs SASB (Lecture 6) and CSRD (PwC).","kt":"","src":"Fondsfinans s. 19 · Fondsfinans s. 20 · L6 slide 53"},{"id":"SB476","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"M","sc":"none","s":"Which question should you ask before choosing active ownership as an ESG approach (Brooks)?","o":[["Can engagement replace knowledge of the firm?","Company- and issue-specific knowledge is required."],["Information or change?","One of seven considerations on page 24."],["Can you avoid managers?","Access to management is needed, not avoided."],["Is the issue immaterial?","Engagement should focus on material, meaningful issues."]],"c":[1],"es":"Consider: goal (information vs change), market and access, realism, knowledge, receptiveness, success markers and resources to follow up.","ed":"Brooks warns against box-checking engagement. Investors should ask whether the market allows meaningful engagement, whether they have access (alone or in a group), whether they are realistic about influence, whether they have knowledge, whether the company is receptive, and what success looks like with resources to follow up. She also notes one can be a passive investor but an active owner.","kt":"","src":"Fondsfinans s. 24 · Fondsfinans s. 22"},{"id":"SB477","l":"GUEST","t":"Fondsfinans","f":"t","d":2,"p":"L","sc":"none","s":"True or false: Brooks says there is no one-size-fits-all ESG approach; investors should start by asking what they want to achieve and what resources they have.","o":[["True","Correct. Page 21 makes exactly this point."],["False","Incorrect. Page 21 makes exactly this point."]],"c":[0],"es":"True: the right approach depends on goals and resources.","ed":"Different objectives lead to different strategies (screening, integration, tilts, engagement, impact). This mirrors Lecture 9's objective functions (max FV, max FV s.t. SEV, max IV, max SEV s.t. FV) and the textbook's Table 8.3 on suitability per investing style.","kt":"","src":"Fondsfinans s. 21 · L9 slide 29"},{"id":"SB478","l":"GUEST","t":"PwC","f":"m","d":2,"p":"H","sc":"none","s":"According to PwC, which principle decides what firms report under the CSRD and ESRS?","o":[["Only emissions","ESRS cover environment, social and governance topics."],["Double materiality","Companies report impacts, risks and opportunities (IROs) assessed by double materiality."],["Only financial materiality","CSRD requires impact materiality as well."],["Any framework the firm likes","ESRS are mandatory standards with a standardised structure."]],"c":[1],"es":"CSRD/ESRS: double materiality assessment of impacts, risks and opportunities; standardised sustainability statement.","ed":"The management report moves from vague statements to a standardised sustainability statement: general information (ESRS 2), environmental information (incl. Taxonomy Article 8 disclosures, E1 climate, E5 resource use), social (S1 own workforce, S2 value-chain workers, S4 consumers) and governance (G1 business conduct). Each topic includes IRO management and metrics and targets. Reports require assurance.","kt":"","src":"PwC s. 29 · PwC s. 32"},{"id":"SB479","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"short","s":"94% of investors think corporate reports contain unsupported sustainability claims. Which CSRD feature addresses this most directly?","o":[["Only photos and stories","Unverifiable stories are the problem."],["Free choice of framework","Free choice reduces comparability."],["Mandatory external assurance","Assurance verifies claims, building trust."],["No reporting for large firms","That would reduce information."]],"c":[2],"es":"External assurance builds trust in sustainability claims.","ed":"Assurance plus standardised ESRS data points aim to make sustainability information as reliable as financial reporting. PwC notes immature processes and systems still make errors more likely than in financial reporting.","kt":"Assurance: independent third-party verification of reported information (limited or reasonable assurance).","src":"PwC s. 30 · PwC s. 38 · PwC s. 46"},{"id":"SB480","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"short","s":"The EU Omnibus package cuts the number of firms that must report under the CSRD. What is the trade-off for investors and banks?","o":[["No trade-off","Out-of-scope firms are not required to report."],["It bans voluntary reporting","Firms can still report voluntarily."],["It raises costs for all firms","The aim is to reduce costs."],["Lower costs, less reliable data","Fewer firms report, so ESG data for many borrowers and holdings will be thinner."]],"c":[3],"es":"Cheaper for firms, but thinner, less comparable data for users.","ed":"Banks still need ESG data for EBA Pillar 3 and credit risk, so they may ask smaller clients directly or rely on voluntary standards. This illustrates the tension between reporting burden and decision-useful information.","kt":"CSRD scope: the set of companies legally required to publish sustainability statements under ESRS.","src":"PwC s. 40 · PwC s. 41 · L11 slide 31"},{"id":"SB481","l":"GUEST","t":"PwC","f":"t","d":2,"p":"L","sc":"none","s":"True or false: PwC says sustainability reporting has a lower risk of errors than financial reporting, because its data come from mature IT systems.","o":[["True","Incorrect. PwC says immature processes and weak technology support mean a GREATER inherent risk, with manual spreadsheets, fragmented systems and unclear indicator definitions."],["False","Correct. PwC says immature processes and weak technology support mean a GREATER inherent risk, with manual spreadsheets, fragmented systems and unclear indicator definitions."]],"c":[1],"es":"False: immature processes and weak systems increase inherent risk.","ed":"Pitfalls include manual spreadsheets, fragmented systems, many contributors with decentralised responsibility, weak internal controls, unclear definitions, poor master data control, limited documentation and different measurement methods across borders. Best practice: consistent financial and sustainability reporting, focus on the big picture and material matters, critical use of digital tools and multidisciplinary teams.","kt":"","src":"PwC s. 46 · PwC s. 47"},{"id":"SB482","l":"GUEST","t":"PwC","f":"m","d":3,"p":"M","sc":"none","s":"PwC says \"It's really not about the reporting...\" What is the main message?","o":[["Reports have no value","PwC finds firms that use the reporting process to inform business operations get the most value."],["Reporting should support strategy","PwC links strategy (\"design\"), transformation (\"make it real\") and reporting (\"keep it real\")."],["Only compliance matters","Compliance is the minimum, not the goal."],["Keep sustainability out of strategy","PwC argues sustainability should be integrated into the core strategy."]],"c":[1],"es":"Reporting is a means: integrate sustainability in strategy and use data for monitoring and steering.","ed":"PwC shows a progression from reporting (what happened?) to monitoring (what happens now?) to steering (what will happen?), with value added rising along the way. Sustainability integrated into core strategy, specific targets and credible climate transition plans (e.g. Maersk) replace \"fluffy\" targets. This echoes the textbook's integrated thinking (Lecture 7) and LTVC (Lecture 6).","kt":"","src":"PwC s. 13 · PwC s. 23 · PwC s. 24 · PwC s. 27"},{"id":"SB483","l":"GUEST","t":"PwC","f":"m","d":3,"p":"L","sc":"none","s":"Which statement does PwC call a climate MYTH?","o":[["\"Impacts can come through operations and supply chains\"","PwC presents this as fact."],["\"Disaster losses were about $417bn in 2024\"","This is cited as a fact."],["\"A firm's carbon footprint decides its physical risk\"","PwC says footprint is irrelevant to physical risk exposure."],["\"Physical impacts will worsen for decades anyway\"","PwC presents this as fact, not myth."]],"c":[2],"es":"Myths: \"it's ages away\", \"it will happen elsewhere\", \"technology will solve it\", \"financial impact will be immaterial\", \"footprint = risk exposure\".","ed":"PwC stresses that climate change has already happened, impacts will worsen non-linearly, and financial effects hit balance sheets and P&L through operations, supply chains and markets. A low-emission firm can still be highly exposed to physical risk - the same footprint-vs-risk distinction as the textbook's aluminium example (Lecture 9).","kt":"","src":"PwC s. 16 · Bok s. 223 (8.2.2)"},{"id":"SB484","l":"GUEST","t":"Guest lectures synthesis","f":"m","d":4,"p":"H","sc":"none","s":"What is the common thread across the Folketrygdfondet, Fondsfinans and PwC guest lectures?","o":[["ESG always beats the market","Folketrygdfondet and Brooks warn against such claims."],["Material ESG beats labels","All three stress materiality, integration and data quality over labels."],["Reporting is just compliance","PwC argues the opposite."],["ESG ratings are enough for decisions","Brooks and the textbook stress rating weaknesses."]],"c":[1],"es":"Common thread: materiality, integration in analysis and strategy, credible data - not labels.","ed":"Folketrygdfondet integrates material ESG into company analysis and ownership to maximise return; Brooks warns about ratings, greenhushing and the need for clear objectives; PwC shows CSRD forces structured double materiality assessments but that value comes from using data for strategy. Together they illustrate the move from SF 1.0 labels to SF 2.0 integration described in the textbook.","kt":"","src":"Folketrygdfondet s. 26 · Fondsfinans s. 16 · Fondsfinans s. 21 · PwC s. 13"},{"id":"SB485","l":"GUEST","t":"Fondsfinans","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A fund owns a solar equipment maker accused of forced labour in its supply chain. What should the manager do first (Brooks)?","o":[["Sell at once","Divestment is one option, chosen after assessment."],["Praise the firm publicly","Not a risk-management step."],["Ignore it","A green product does not remove S risks."],["Assess how material it is","Then choose: do nothing, reduce/divest, or engage to make a difference."]],"c":[3],"es":"Assess first, then manage (nothing / reduce / engage) and disclose.","ed":"Brooks' guide: decide what you screen for, identify and assess the risk (severity, materiality, market pricing, desired outcome), manage it, and disclose results. Green companies can still have material social risks, as solar supply chains show.","kt":"Desired outcome: what the investor wants to achieve - reduce financial risk, reduce reputational risk, or \"make a difference\" (MAD).","src":"Fondsfinans s. 23 · Fondsfinans s. 24"},{"id":"SB486","l":"GUEST","t":"Folketrygdfondet","f":"m","d":3,"p":"L","sc":"short","s":"Folketrygdfondet has beaten its benchmark over many years. Why does the long-run result matter more than one year for judging its ESG strategy?","o":[["One year proves skill","One year is too short to judge."],["Change the benchmark every year","Stable benchmarks make performance comparable."],["One year is just noise","Long horizons are needed to separate skill from luck."],["Excess returns do not matter","Value added versus the benchmark is the key test."]],"c":[2],"es":"Judge active, long-term strategies over long horizons.","ed":"This mirrors the textbook's critique of short evaluation horizons (Lecture 8) and supports alternative performance measures such as absolute and multi-year targets.","kt":"Excess return (active return): portfolio return minus benchmark return.","src":"Folketrygdfondet s. 8 · Folketrygdfondet s. 11 · Bok s. 195 (7.3.5)"},{"id":"EX02","l":"L13","t":"Exam sample: backcasting","f":"t","d":2,"p":"H","sc":"none","s":"Does backcasting start from a desired future end-state and work backwards to define the pathway?","o":[["Yes","Riktig. Backcasting starter med målet (f.eks. netto null i 2050) og jobber bakover for å finne stegene dit."],["No","Feil. Backcasting starter med målet (f.eks. netto null i 2050) og jobber bakover for å finne stegene dit."]],"c":[0],"es":"Ja: start i ønsket fremtid, jobb bakover.","ed":"Dette er en av foreleserens egne eksempeloppgaver.\n- Forecasting: start i dag og spå hva som skjer.\n- Backcasting: bestem hvor du vil være, og planlegg bakover hva som må skje.\nBackcasting er et verktøy i transition management (forelesning 13).","kt":"Backcasting: planlegging bakover fra et ønsket fremtidig mål.","src":"L13 slide 13-16 · Bok s. 354 (12.1.1) · Bok s. 359 (12.2) · Bok s. 361 (12.3)","k":1,"x":1},{"id":"CX097","l":"L13","t":"Coalitions","f":"m","d":2,"p":"H","sc":"none","s":"According to Ostrom, a coalition that governs a common resource well needs:","o":[["Monitoring and sanctions","Uten kontroll og konsekvenser blir det free riding."],["Full government ownership","Ostrom viser nettopp at fellesskap kan styre uten staten."],["No formal rules","Ostrom vektlegger klare regler."],["As many members as possible","Store koalisjoner er ofte mindre ambisiøse."]],"c":[0],"es":"Monitoring + sanctions mot free riding.","ed":"Ostroms prinsipper: klare grenser, medlemsregler, felles beslutninger, overvåking, sanksjoner, konfliktløsning. Mange klimakoalisjoner mangler håndheving.","kt":"","src":"L13 slide 6-7 · Bok s. 111 (4.3.1) · Bok s. 112 (Table 4.3) · Bok s. 113 (4.3.1)","k":1},{"id":"CX098","l":"L13","t":"Coalitions","f":"m","d":2,"p":"H","sc":"none","s":"In sustainable finance coalitions, size and ambition are related in that:","o":[["Larger ones tend to be less ambitious","Mange medlemmer krever lette krav."],["Only small ones have principles","Store koalisjoner har også prinsipper, bare svakere."],["Size and ambition are unrelated","Boka finner en tydelig sammenheng."],["Larger ones are more ambitious","Det er motsatt."]],"c":[0],"es":"Stor koalisjon = lavere ambisjon.","ed":"For å få med mange medlemmer må kravene være lette. GIIN og GABV er ambisiøse, men små.","kt":"","src":"L13 slide 3-9 · Bok s. 113 (4.3.1)","k":1},{"id":"CX099","l":"L13","t":"Role of players","f":"t","d":2,"p":"H","sc":"none","s":"Do short election cycles make it harder for governments to pursue long-term climate goals?","o":[["Yes","Riktig. Politikere må vinne valg om få år, mens klimatiltak virker over tiår."],["No","Feil. Politikere må vinne valg om få år, mens klimatiltak virker over tiår."]],"c":[0],"es":"Ja: valgsykluser = kort horisont.","ed":"Ligner tragedy of the horizon: kostnadene merkes nå, gevinstene kommer senere. Derfor trengs også investorer, banker og koalisjoner.","kt":"","src":"L13 slide 8-9 · Bok s. 84 (Table 3.1)","k":1},{"id":"CX100","l":"L13","t":"Government policy","f":"m","d":2,"p":"H","sc":"none","s":"The 'green premium' is:","o":[["The extra cost of going green","F.eks. at grønt stål koster 25 % mer enn vanlig stål."],["The lower yield on green bonds","Det er greenium, ikke green premium."],["A tax on fossil fuels","En karbonavgift kan krympe green premium, men er ikke det samme."],["A subsidy paid to green producers","Det er en subsidie."]],"c":[0],"es":"Green premium = merkostnad ved det grønne. Greenium = lavere yield på grønne obligasjoner.","ed":"En gradvis høyere karbonpris gjør det fossile dyrere og krymper green premium. Det kalles å 'level the playing field'.","kt":"","src":"L13 slide 11-12 · L3 slide 19","k":1},{"id":"CX101","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"none","s":"One motive for joining a sustainability coalition is:","o":[["Members no longer report emissions","Rapporteringsplikten gjelder fortsatt."],["Higher success in joint engagement","Når investorer engasjerer sammen, lykkes de oftere."],["Members are exempt from regulation","Medlemskap gir ikke unntak fra lover."],["Members pay lower corporate taxes","Medlemskap gir ingen skattefordel."]],"c":[1],"es":"Collective engagement er ett av seks motiver.","ed":"Seks motiver (slide 4):\n- Collective advocacy: lobbe sammen overfor myndighetene.\n- Reputation: bli sett som en leder.\n- Peer effect: konkurrentene er med.\n- Outside pressure: press fra kunder, investorer, NGO-er.\n- Risk avoidance: unngå stranded assets.\n- Collective engagement: høyere suksessrate i engagement.","kt":"","src":"L13 slide 4","k":1},{"id":"CX102","l":"L13","t":"Coordinated engagement","f":"m","d":2,"p":"H","sc":"none","s":"Dimson, Karakaş and Li (2020) find that an effective engagement strategy is:","o":[["Leaving dialogue to proxy advisors","Det er ikke strategien de studerer."],["Selling the shares before engaging","Da mister du stemmen din."],["Each investor engaging alone in secret","Studien handler nettopp om samarbeid."],["Lead investor plus supporters","To nivåer: én leder dialogen, de andre støtter."]],"c":[3],"es":"Lead investor + supporting investors = effektiv coordinated engagement.","ed":"Lead-rollen tas oftest av en investor med stor eierandel i et hjemlandsselskap. Suksessen er høyest når lederen er innenlandsk og støttespillerne er internasjonale.","kt":"","src":"L13 slide 5","k":1},{"id":"CX103","l":"L13","t":"Why government policies matter","f":"t","d":2,"p":"H","sc":"none","s":"Is a lack of information, trained staff or incentives an example of a non-market barrier to decarbonisation?","o":[["Yes","Riktig. Det er barrierer som ikke handler om pris, og der riktig politikk kan gjøre stor forskjell."],["No","Feil. Det er barrierer som ikke handler om pris, og der riktig politikk kan gjøre stor forskjell."]],"c":[0],"es":"Ja: non-market barriers.","ed":"Foreleserens liste over hvorfor politikk betyr noe: mind the investment gap, level the playing field, overcome non-market barriers, stay up to date, plan for a just transition, do the hard stuff too, work on technology, policy and markets at the same time.","kt":"","src":"L13 slide 11","k":1},{"id":"CX104","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"The three levers that must be pulled at the same time to get to zero are:","o":[["Equity, bonds and loans","Det er finansieringsformer."],["Environment, social and governance","Det er ESG, ikke de tre spakene."],["Taxes, subsidies and bans","Det er bare politikkverktøy."],["Technology, policy and markets","Alle tre må dras samtidig og i samme retning."]],"c":[3],"es":"Tre spaker: technology, policy, markets.","ed":"Poenget er at én spak alene ikke er nok: ny teknologi trenger politikk (f.eks. karbonpris) og markeder som tar den i bruk.","kt":"","src":"L13 slide 11-12","k":1},{"id":"CX105","l":"L13","t":"Government policy","f":"m","d":2,"p":"H","sc":"none","s":"Planning for a 'just transition' aims to:","o":[["Delay all climate policy until 2050","Just transition handler om hvordan, ikke om å utsette."],["Make polluters pay every cost at once","Det er ikke kjernen i just transition."],["Give tax breaks to oil companies","Det er motsatt av poenget."],["Support communities hit by the shift","F.eks. kullregioner som mister arbeidsplasser."]],"c":[3],"es":"Just transition = støtte til de som rammes av omstillingen.","ed":"Staten kan gi finansiering og teknisk hjelp, og koble sammen lokalsamfunn med like problemer så de kan dele det som virker.","kt":"","src":"L13 slide 12 · PwC s. 47","k":1},{"id":"SB487","l":"L13","t":"Institutional investors","f":"m","d":3,"p":"M","sc":"short","s":"Climate Action 100+ lets hundreds of investors engage the biggest emitters together. Why are such coalitions more effective than one investor alone?","o":[["No monitoring is needed","Effective coalitions need monitoring and sanctions."],["Single investors may not engage","They are not banned."],["Coalitions can force firms by law","They rely on influence, not legal power."],["Pooled ownership gives leverage","Dimson, Karakaş and Li find collaboration increases engagement success."]],"c":[3],"es":"Pooling stakes increases leverage and success rates.","ed":"Institutional investors own about 65% of developed-market equity, so coordinated action is powerful. But coalitions face free riding and exits: several large managers left Climate Action 100+ in 2024 amid political pressure.","kt":"Collective engagement: several investors coordinating dialogue with a company to increase their influence.","src":"L13 slide 4-5 · Bok s. 111 (4.3.1) · Bok s. 104 (Table 4.1)"},{"id":"SB488","l":"L13","t":"System approach","f":"m","d":2,"p":"H","sc":"none","s":"How does Ostrom (1990) suggest governing shared resources such as the atmosphere?","o":[["Only through taxes","Ostrom looks beyond centralised regulation."],["Only through private property","She looks beyond private property rights too."],["Self-governing groups","With graduated sanctions and dispute resolution."],["By letting markets fix it","That leads to the tragedy of the commons."]],"c":[2],"es":"Voluntary coalitions with own rules, monitoring, graduated sanctions and conflict resolution.","ed":"The tragedy of the commons arises when individuals deplete a shared resource. Standard remedies are taxation, regulation or property rights, but a purely regulatory approach to carbon has been elusive. Ostrom shows communities can govern commons through coalitions with clear boundaries, rules made with those affected, monitoring and sanctions. The Paris Agreement is a country-level coalition; PRI or the Equator Principles are private ones.","kt":"","src":"L13 slide 3-9 · Bok s. 104 (4.2) · Bok s. 105 (4.2)"},{"id":"SB489","l":"L13","t":"System approach","f":"m","d":3,"p":"H","sc":"none","s":"McElroy's sustainability quotient is SP = actual impact / normative impact. For carbon, when is a firm sustainable?","o":[["When SP ≤ 1","For ecological quotients SP ≤ 1 is sustainable, SP > 1 unsustainable."],["When SP > 1","This is unsustainable for ecological quotients."],["When its ESG rating is above average","Ratings measure the numerator only, without system thresholds."],["When emissions fall each year","Improvement alone says nothing about the threshold."]],"c":[0],"es":"Ecological: SP ≤ 1 sustainable; social: SP ≥ 1 sustainable. Impact is judged against system thresholds.","ed":"The innovation is relating a company's actual impact (numerator) to a normative impact derived from system thresholds such as a carbon budget (denominator). ESG ratings and integrated reports measure only the numerator (Lecture 7). For social quotients (e.g. living wages), SP ≥ 1 is sustainable. Thurm et al. call this context-based sustainability (Reporting 3.0).","kt":"","src":"Bok s. 105 (4.2) · Bok s. 168 (6.3.3)"},{"id":"SB490","l":"L13","t":"Role of players","f":"m","d":3,"p":"H","sc":"short","s":"Norway's government faces elections every four years but must cut emissions over decades. Which threat to government does this show?","o":[["A short horizon","Table 3.1 gives governments a horizon of up to four years and lists \"dealing with future generations\" as a threat."],["Marking to market","That is a threat for investors."],["Single-issue campaigns","That is a threat for civil society."],["Poverty and fear of change","These are threats listed for households."]],"c":[0],"es":"Government horizon ≈ election cycle → hard to serve future generations.","ed":"Governments have the strongest tools (taxation, regulation, carbon pricing) but short horizons, policy differences and free riding between countries limit them. That is why the lecture stresses supranational coalitions (UN/COP, IPCC, Paris) and private coalitions as complements.","kt":"Table 3.1: each player (government, civil society, corporates, investors, households) has a sphere of influence, horizon, mechanisms, opportunities and threats.","src":"L13 slide 8-9 · Bok s. 84 (Table 3.1)"},{"id":"SB491","l":"L13","t":"Coalitions","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"A new investor alliance covers 60% of Nordic assets and has ambitious goals, but no reporting and no consequences for missing targets. What is the main weakness?","o":[["The goals are too ambitious","Ambition is a strength if enforced."],["No checks or sanctions","Monitoring and graduated sanctions are key design principles."],["It has too many members","High coverage (clear boundaries) is a strength."],["It is not run by the government","Ostrom shows self-governed coalitions can work."]],"c":[1],"es":"Without monitoring and sanctions, coalitions invite free riding.","ed":"The textbook finds enforcement is the weak spot of most sustainable finance coalitions; only WBCSD can expel members. Reporting alone already gives incentives, but sanctions are more effective.","kt":"Ostrom's design principles: clear boundaries, rules restricting use, collective choice, monitoring, graduated sanctions, conflict resolution.","src":"L13 slide 6-7 · Bok s. 111 (4.3.1) · Bok s. 112 (Table 4.3) · Bok s. 113 (4.3.1)"},{"id":"SB492","l":"L13","t":"Coalitions","f":"m","d":3,"p":"H","sc":"none","s":"How does the size of sustainable finance coalitions relate to their ambition?","o":[["No link","The textbook finds a clear inverse relationship."],["Larger is more ambitious","The largest are the least ambitious."],["All are SF 3.0","Most are SF 1.0/2.0."],["Larger is less ambitious","Larger coalitions sit between SF 1.0 and 2.0."]],"c":[3],"es":"Bigger coalitions → lower ambition (SF 1.0/2.0); SF 3.0 coalitions (GIIN, GABV) → tiny coverage.","ed":"Coalitions covering 20-40% of their sector include social and environmental factors but do not prioritise them over profit. SF 3.0 coalitions put people and planet first with finance as a viability constraint, but cover less than 1%. A positive dynamic: members tend to tighten principles over successive versions. PRI and WBCSD have well-defined, monitored principles, closer to SF 2.0.","kt":"","src":"L13 slide 3-9 · Bok s. 113 (4.3.1)"},{"id":"SB493","l":"L13","t":"Coalitions","f":"m","d":2,"p":"M","sc":"none","s":"Which is a reason for joining a sustainable finance coalition?","o":[["Joint engagement","Dimson, Karakaş and Li show collaboration increases success."],["Escaping regulation","Private and public initiatives reinforce each other."],["Avoiding monitoring","Effective coalitions require monitoring."],["Higher short-term profits","Coalitions have a long-term focus."]],"c":[0],"es":"Peer effects, outside pressure, reputation, risk avoidance (stranded assets), collective advocacy, collective engagement.","ed":"Members may be intrinsically or instrumentally motivated to pursue LTVC. Joining can avoid competitive disadvantage (peers), respond to NGO and consumer pressure, build reputation (sometimes just marketing), avoid stranded-asset risk, lobby governments to reduce policy uncertainty, and engage collectively. The main risk is free riding: enjoying benefits without following the rules.","kt":"","src":"L13 slide 3-9 · Bok s. 110 (4.3.1) · Bok s. 111 (4.3.1)"},{"id":"SB494","l":"L13","t":"Coalitions","f":"m","d":3,"p":"H","sc":"none","s":"Using Ostrom's principles, what is a clear weak spot of many sustainable finance coalitions?","o":[["Weak enforcement and few sanctions","Only WBCSD can expel members and has a (partial) conflict mechanism."],["Too many members from poor countries","Members come from North America, Europe and Asia."],["No principles at all","Several, like PRI and WBCSD, have well-defined principles."],["Too strict sanctions","Sanctions are mostly absent."]],"c":[0],"es":"Six criteria: boundaries, membership rules, collective choice, monitoring, sanctions/rewards, conflict resolution. Enforcement is the weak spot.","ed":"Monitoring varies - the Equator Principles Association leaves monitoring to members and does not verify content, while WBCSD reviews and benchmarks members' sustainability reports. Reporting itself is a powerful incentive, but sanctions are more effective; most coalitions have none or only for their board. Coalitions should also avoid quarterly benchmarking to allow long-term solutions to develop.","kt":"","src":"L13 slide 3-9 · Bok s. 111 (4.3.1) · Bok s. 113 (4.3.1) · Bok s. 114 (4.3.1)"},{"id":"SB495","l":"L13","t":"Government policy","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Green steel costs 25% more than normal steel (its \"green premium\"). Which policy best \"levels the playing field\"?","o":[["Banning steel imports","Not the mechanism described."],["Cutting R&D funding","The lecture calls for more R&D on hard-to-abate sectors."],["A rising carbon price","A carbon price closes the green premium by pricing the externality."],["Ignoring emissions for now","Without a price signal, the green premium persists."]],"c":[2],"es":"Carbon pricing levels the playing field and shrinks green premiums.","ed":"The slides list: mind the investment gap, level the playing field (carbon price), overcome non-market barriers, keep policies up to date, plan a just transition, do the hard stuff (R&D), and pull technology, policy and market levers together. Lower green premiums also improve green firms' value drivers.","kt":"Green premium: the extra cost of choosing a zero-carbon option over a fossil one.","src":"L13 slide 11-12 · L3 slide 19"},{"id":"SB496","l":"L13","t":"Coalitions","f":"m","d":2,"p":"L","sc":"none","s":"How do private coalitions and government regulation relate?","o":[["Coalitions make rules unnecessary","The textbook calls for both in parallel."],["They support each other","Public endorsement can in turn strengthen private coalitions."],["Coalitions should fight regulation","Collective advocacy aims to clarify and support sustainable policy."],["Rules always weaken coalitions","The textbook sees complementarity."]],"c":[1],"es":"Private coalitions and public rules are complements.","ed":"The chapter recommends research on effective coalitions in parallel with regulatory initiatives addressing externalities. Examples of the interplay: voluntary Brazilian Green Protocol followed by central bank rules (Lecture 11); TCFD (a private-led task force) feeding into mandatory ESRS and ISSB standards.","kt":"","src":"L13 slide 3-9 · Bok s. 111 (4.3.1) · Bok s. 114 (4.4)"},{"id":"SB497","l":"L13","t":"Transition dynamics","f":"m","d":2,"p":"H","sc":"none","s":"According to the x-curve (Loorbach et al.), how do transitions happen?","o":[["Through one decision that replaces everything","Transitions take decades and are iterative."],["Through small, smooth improvements","Incremental optimisation is what the incumbent regime does; transitions are non-linear."],["Only through collapse","Build-up of a new regime happens in parallel."],["The new grows while the old breaks down","Experimentation, acceleration and institutionalisation vs destabilisation and phase-out."]],"c":[3],"es":"X-curve: build-up (experimentation → acceleration → institutionalisation) and breakdown (optimisation → destabilisation → phase-out) over decades.","ed":"Incumbent regimes optimise path-dependently while change agents experiment with alternatives. Pressure destabilises the regime, alternatives accelerate, the transition becomes chaotic and disruptive, and new combinations form a new regime while non-transforming elements are phased out. In finance, applying ESG ratings (screening, best-in-class) is incremental optimisation within the old regime; fundamental integrated analysis and engagement are transformative experiments.","kt":"","src":"Bok s. 352 (12.1) · Bok s. 352 (Figure 12.1) · Bok s. 353 (12.1)"},{"id":"SB498","l":"L13","t":"Transition dynamics","f":"m","d":3,"p":"H","sc":"none","s":"Which practice is a small (incremental) change within today's financial system, not a transformation?","o":[["Optimising integrated value","This is the new regime's guiding principle."],["Focused portfolios for long-term value","This is a transformative experiment."],["Using ESG ratings to screen","These optimise within a regime still based on market benchmarks."],["Integrated investment and engagement teams","This is described as the new regime."]],"c":[2],"es":"Incremental: ratings-based screening within benchmark thinking. Transformative: integrated value, fundamental analysis, integrated engagement.","ed":"In the incumbent regime, maximising financial return subject to risk remains the objective, sometimes with a moral overlay (no fur or tobacco). These incremental changes are not durable and open space for alternatives. The new regime optimises integrated value (financial, social, environmental) subject to integrated risk, with engagement as part of the investment process.","kt":"","src":"Bok s. 353 (12.1) · Bok s. 356 (12.1.1.1)"},{"id":"SB499","l":"L13","t":"Transition management","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Backcasting starts from today and extends current trends forward to see where we end up in 2050.","o":[["True","Incorrect. That is forecasting. Backcasting starts from a desired long-term vision and works backwards to pathways, stepping stones and concrete short-term actions."],["False","Correct. That is forecasting. Backcasting starts from a desired long-term vision and works backwards to pathways, stepping stones and concrete short-term actions."]],"c":[1],"es":"False: backcasting starts from the desired future and works back to today's actions.","ed":"Transition governance moves from vision (strategic) to transition agenda and pathways with stepping stones (tactical), concrete actions and experiments (operational), and monitoring (reflexive). Backcasting is the move from long-term thinking to short-term action; it is used in the transition arena process together with problem structuring and envisioning.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (Figure 12.2) · Bok s. 354 (12.1.1)"},{"id":"SB500","l":"L13","t":"Transition management","f":"m","d":2,"p":"H","sc":"none","s":"What is the \"new vision\" for the financial sector in chapter 12?","o":[["Finance long-term value","Using finance's allocation role to steer the corporate sector."],["Fund green projects only with subsidies","The textbook criticises a project-based, subsidy-dependent approach as too narrow."],["Maximise return with some exclusions","This is the incumbent regime."],["Replace private finance with state banks","Not the textbook's vision."]],"c":[0],"es":"New vision: invest, lend and engage for LTVC aligned with the SDGs by 2030; guiding norm = optimise integrated value.","ed":"Corporates play a key role through their products (SDG contributions) and production processes. The financial sector should allocate capital to positive-impact companies and divest from or stop lending to negative-impact ones. Rebooting finance from managing financial value to managing integrated value avoids subsidy-seeking, project-by-project approaches.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (12.1.1.1) · Bok s. 355 (12.1.1.1) · Bok s. 356 (12.1.1.1)"},{"id":"SB501","l":"L13","t":"Transition management","f":"m","d":3,"p":"M","sc":"none","s":"In Loorbach's transition management, which tool works at the STRATEGIC level?","o":[["Transition experiments","Experiments are operational."],["Transition agendas","Agendas are tactical."],["Transition arenas","Example: the TCFD, which brought investors and companies together."],["Monitoring and evaluation","Monitoring is reflexive."]],"c":[2],"es":"Strategic: transition arenas. Tactical: scenarios and agenda (e.g. PRI, FCLTGlobal). Operational: experiments. Reflexive: monitoring.","ed":"Transition arenas involve selective participation by transformative actors (front-runners, radical outsiders) who structure problems and develop visions; examples are the TCFD, the Natural Capital Coalition and Reporting 3.0. At the tactical level, coalitions align goals and push for structural and regulatory change. Experiments (e.g. allocating 5-10% of portfolios to SDG themes) test new practices; monitoring feeds learning back into the process.","kt":"","src":"L13 slide 13-16 · Bok s. 359 (Figure 12.4) · Bok s. 359 (12.2) · Bok s. 360 (12.2)"},{"id":"SB502","l":"L13","t":"Transition management","f":"m","d":2,"p":"M","sc":"none","s":"Which is a TRUE experiment in a new system, not just improving the old one?","o":[["Adding an ESG screen to an index fund","This only scratches the surface within the current regime."],["A small SDG-themed allocation","Described as true experiments in the new regime."],["Publishing a CSR report","This is the silo approach of the old regime."],["Quarterly benchmarking","This is incumbent-regime practice."]],"c":[1],"es":"Experiments: SDG-themed allocations, front-runners with concentrated, engaged portfolios (Alecta), green bonds (Amundi), impact loans (VBBs).","ed":"Financial institutions are \"tiptoeing\" into SF: first applying ESG ratings (scratching the surface), then allocating small parts to SDG themes (true experiments), and a few front-runners doing fundamental analysis and engagement with concentrated holdings. Better information (integrated reporting, TCFD, SDG-linked data) and better investor-company dialogue support these experiments.","kt":"","src":"L13 slide 13-16 · Bok s. 357 (12.1.1.3) · Bok s. 358 (12.1.1.3)"},{"id":"SB503","l":"L13","t":"Government policy","f":"m","d":3,"p":"M","sc":"short","s":"Coal regions like Poland's Silesia face job losses as coal is phased out. Which policy fits a \"just transition\"?","o":[["Keep the mines open forever","This blocks the transition."],["Phase out and retrain","A just transition shares the costs fairly and helps affected communities adapt."],["Leave workers to charity","The lecture gives governments a role through funding and advice."],["Close the mines overnight","This ignores the social costs a just transition addresses."]],"c":[1],"es":"Just transition = support affected communities while decarbonising.","ed":"Without a just transition, opposition can slow climate policy. PwC also stresses that \"a just transition is our common goal\". For investors, social acceptance is part of the policy risk in transition scenarios.","kt":"Just transition: moving to a low-carbon economy in a way that is fair to affected workers and communities.","src":"L13 slide 12 · PwC s. 47"},{"id":"SB504","l":"L13","t":"Role of players","f":"m","d":2,"p":"M","sc":"short","s":"Greenpeace runs a media campaign against a bank that finances an oil pipeline. Which player and tool is this?","o":[["Investors","Greenpeace is not a lender."],["Civil society","NGOs act through debate, media and social pressure."],["Households","This is an organised NGO campaign, not household consumption."],["Government","Greenpeace has no power to tax."]],"c":[1],"es":"NGO campaign = civil society, via media and public voice.","ed":"Civil society's strengths are agenda setting and stimulating citizenship of companies and investors; its threats are single-issue focus and fragmentation. Such campaigns can raise reputational risk for financiers (Equator Principles, Dakota Access Pipeline).","kt":"Civil society: NGOs, media and citizens' groups that influence through public debate, campaigns and social pressure.","src":"L13 slide 9 · Bok s. 300 (Box 10.3)"},{"id":"SB505","l":"L13","t":"Government policy","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Technology, policy and markets must all be pulled at the same time; using only one (e.g. R&D subsidies) is unlikely to be enough.","o":[["True","Correct. The slide says the three levers must be pulled together to wean economies off fossil fuels."],["False","Incorrect. The slide says the three levers must be pulled together to wean economies off fossil fuels."]],"c":[0],"es":"True: the levers reinforce each other.","ed":"R&D lowers future green premiums, carbon prices create demand, and markets scale up solutions (helping innovators across the \"valley of death\"). The investment gap needs public and private finance together.","kt":"Policy mix: combining technology support (R&D), policy (prices, regulation) and market development to drive a transition.","src":"L13 slide 11-12"},{"id":"SB506","l":"L13","t":"Role of players","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A pension fund judges its managers quarterly, invests through several layers of external managers, and must mark illiquid assets to market. Which threat does it face?","o":[["Low trust in government","This is listed for households."],["A long investment chain","Listed as an investor threat (see also Lecture 8)."],["Short election cycles","This is the government's time horizon in the table, not an investor threat."],["Single-issue campaigns","This is a civil society threat."]],"c":[1],"es":"Quarterly benchmarking and long chains undermine investors' long-term role.","ed":"This ties Lecture 13 back to Lecture 8: the six conditions for LTVC (long horizons, concentration, engagement, real-economy performance, aligned mandates, short chains) are answers to exactly these threats. Also true, but not offered as an option here: Short-termism from monthly/quarterly benchmarking.","kt":"Investor mechanisms (Table 3.1): investment strategy, lending strategy and engagement; threats include short-termism, long investment chains, marking to market and supervisory treatment of illiquid investments.","src":"L13 slide 9 · L8 slide 72 · Bok s. 202 (Figure 7.6)"},{"id":"SB507","l":"L13","t":"Transition management","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: A bank that tests impact lending on 5% of its loans, monitors the results and scales up if it works is running a transition experiment.","o":[["True","Correct. Experiments at the operational level are monitored (reflexive level) and the lessons feed back into vision and agenda."],["False","Incorrect. Experiments at the operational level are monitored (reflexive level) and the lessons feed back into vision and agenda."]],"c":[0],"es":"True: experiment → monitor → scale is the transition management loop.","ed":"Loorbach's framework links strategic arenas, tactical agendas, operational experiments and reflexive monitoring. Allocating 5-10% of portfolios to SDG themes is the textbook's own example of a true experiment in the new regime.","kt":"Transition experiments: small-scale trials of alternative practices that, if successful, are scaled up and institutionalised.","src":"L13 slide 14-16 · Bok s. 357 (12.1.1.3) · Bok s. 359 (12.2)"},{"id":"SB508","l":"L13","t":"Role of players","f":"m","d":2,"p":"M","sc":"none","s":"Why does the course stress global coalitions like the IPCC, COP and the Paris Agreement, not just national policy?","o":[["Countries cannot affect emissions","They set taxes, regulation and carbon prices."],["They replace private coalitions","Public and private coalitions complement each other."],["The IPCC sets carbon taxes","The IPCC assesses science; it does not set taxes."],["Climate is a global commons","Supranational coalitions build shared understanding and coordinate action."]],"c":[3],"es":"Global commons → coordination via supranational coalitions.","ed":"The slide lists the roles of governments: understanding challenges (research), forming supranational coalitions, setting priorities, laws, taxation, carbon pricing, and monitoring and sanctioning deviations. Free riding between countries is the classic threat (Table 3.1).","kt":"IPCC: the UN body assessing climate science; it informs policy but does not set binding rules.","src":"L13 slide 8 · L13 slide 10"},{"id":"SB509","l":"L13","t":"Transition synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A pension fund wants to move from SF 1.0 toward SF 2.0-3.0. Which steps follow transition management?","o":[["Vision, backcast, experiment","Vision → agenda/pathways → experiments → monitoring, per Loorbach."],["Wait for regulators","The textbook expects private front-runners to lead alongside regulation."],["Add more exclusions each year","This is incremental optimisation within the old regime."],["Sell everything and buy impact funds","Transitions are iterative; abrupt moves ignore learning and scale constraints (impact funds are small)."]],"c":[0],"es":"Vision (LTVC/SDGs) → backcasting → pathways and coalitions → experiments → monitoring and scaling.","ed":"The fund would formulate a vision (optimise integrated value, contribute to the SDGs), backcast to pathways (e.g. growing concentrated, fundamental, engaged mandates; joining coalitions such as PRI), run experiments (an SDG-themed sleeve, integrated investment-engagement teams), and monitor results to scale up. Cultural change (leadership, education, intrinsic motivation) is needed for this to last.","kt":"","src":"L13 slide 13-16 · Bok s. 354 (12.1.1) · Bok s. 359 (12.2) · Bok s. 361 (12.3)"},{"id":"SB510","l":"L13","t":"Integrated thinking","f":"t","d":3,"p":"M","sc":"constructed_scenario","s":"True or false: When portfolio managers themselves lead engagement on material ESG issues, instead of a separate ESG team, engagement becomes a line function, as the textbook recommends.","o":[["True","Correct. The textbook recommends integrated teams that both decide on investments and engage with companies."],["False","Incorrect. The textbook recommends integrated teams that both decide on investments and engage with companies."]],"c":[0],"es":"True: engagement becomes part of the investment process.","ed":"Separate ESG teams often lack knowledge of the investment case and engage on immaterial issues (Lecture 8). Folketrygdfondet, where portfolio managers sit in nomination committees, is a practical example of integrated engagement.","kt":"Line function vs staff function: line functions make the core decisions (investing, lending); staff functions advise or support from the side.","src":"Bok s. 361 (12.3) · Bok s. 362 (12.3) · Folketrygdfondet s. 24"},{"id":"L13S01","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"A Norwegian bank joins a net-zero banking alliance mainly because its competitors have already joined. Which motive is this?","o":[["Collective advocacy","Collective advocacy is lobbying jointly on policy issues."],["Peer effect","Membership of peers pushes firms to join to avoid a competitive disadvantage."],["Collective engagement","Collective engagement is about raising the success rate of engagements."],["Risk avoidance","Risk avoidance is about avoiding stranded assets."]],"c":[1],"es":"Joining because peers have joined = peer effect.","ed":"Slide 4 lists six motives: collective advocacy (lobbying on policy), reputation (being seen as a leader), peer effect (peers are members), outside pressure (consumers, investors, NGOs), risk avoidance (stranded assets) and collective engagement (higher success rates).","kt":"Peer effect: joining because competitors have joined, to avoid a competitive disadvantage.","src":"L13 slide 4"},{"id":"L13S02","l":"L13","t":"Motives to join a coalition","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"An asset manager joins an investor coalition mainly to lobby governments together for a higher carbon price. Which motive is this?","o":[["Reputation","Reputation is about being identified as a sustainability leader."],["Outside pressure","Outside pressure comes from consumers, investors or NGOs pushing the firm."],["Peer effect","Peer effect is joining because competitors have joined."],["Collective advocacy","Lobbying jointly on policy-related issues is collective advocacy."]],"c":[3],"es":"Joint lobbying on policy = collective advocacy.","ed":"Collective advocacy uses the coalition as a single voice towards policymakers. It differs from collective engagement, which targets companies rather than governments.","kt":"","src":"L13 slide 4"},{"id":"L13S03","l":"L13","t":"Coordinated engagement","f":"m","d":2,"p":"H","sc":"none","s":"Which engagement strategy do Dimson, Karakaş and Li (2020) find effective?","o":[["Delegating all dialogue to proxy advisors","Proxy advisors are not the engagement strategy studied."],["Each investor engaging alone and confidentially","The paper is about collaboration; the 2015 paper also finds collaboration raises success rates."],["A lead investor backed by supporting investors","They find a two-tier strategy, combining lead investors with supporting investors, achieves the engagement goals and improves target performance."],["Divesting first and engaging afterwards","Divested investors lose their voice; this is not the strategy studied."]],"c":[2],"es":"Two-tier strategy: lead investors + supporting investors.","ed":"The 2015 paper (Active ownership) finds successful engagements are followed by positive abnormal returns and that collaboration among activists raises the success rate of E/S engagements. The 2020 paper shows how coordination works best: one or a few investors lead the dialogue, others support.","kt":"Coordinated engagement: several investors engaging a company together through a coalition.","src":"L13 slide 5"},{"id":"L13S04","l":"L13","t":"Coordinated engagement","f":"m","d":3,"p":"H","sc":"none","s":"When is an investor more likely to lead a joint engagement (Dimson, Karakaş and Li, 2020)?","o":[["When it plans to sell soon","An investor about to exit has little reason to lead dialogue."],["When it has never met the firm","The paper links leadership to stake size and home market, not lack of contact."],["Small stake, foreign target","This is the opposite of the finding."],["Larger stake, domestic target","Investors lead more often when they hold a higher stake in the target and the target is domestic."]],"c":[3],"es":"Bigger stake + domestic target = more likely to lead.","ed":"Leading costs time and effort, so the investor with most at stake and best local access tends to lead. Success is also higher when lead investors are domestic, supporting investors are international, and the coalition is influential.","kt":"","src":"L13 slide 5"},{"id":"L13S05","l":"L13","t":"Coordinated engagement","f":"t","d":3,"p":"H","sc":"none","s":"Do joint engagements succeed more often when the lead investors are domestic and the supporting investors are international?","o":[["Yes","Correct. Domestic leads bring local knowledge and access; international supporters add weight. Success rates are also higher when the coalition is influential."],["No","Incorrect. Domestic leads bring local knowledge and access; international supporters add weight. Success rates are also higher when the coalition is influential."]],"c":[0],"es":"Yes: domestic lead + international support works best.","ed":"This complements Dimson et al. (2015): collaboration raises the success rate of environmental and social engagements, and successful engagements are followed by positive abnormal returns.","kt":"","src":"L13 slide 5"},{"id":"L13S06","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"Which policy priority says that a lack of information, skilled staff or incentives can block decarbonisation?","o":[["Mind the investment gap","That is about government financing where new zero-carbon technologies are needed."],["Plan for a just transition","That is about supporting communities hit by the transition."],["Overcome non-market barriers","These barriers are not about prices, and the right government policies can make a big difference."],["Level the playing field","That is about raising the carbon price to shrink Green Premiums."]],"c":[2],"es":"Lack of information, skills or incentives = non-market barriers.","ed":"Slides 11-12 list seven priorities: mind the investment gap, level the playing field, overcome non-market barriers, stay up to date, plan for a just transition, do the hard stuff too, and work on technology, policy and markets at the same time.","kt":"","src":"L13 slide 11"},{"id":"L13S07","l":"L13","t":"Why government policies matter","f":"m","d":3,"p":"H","sc":"none","s":"The \"Stay up to date\" point warns that:","o":[["Old government rules can block decarbonisation","Sometimes the barrier is outdated policy, not consumers or markets."],["Carbon prices should be frozen at current levels","The lecture argues for progressively raising the carbon price."],["ESG ratings must be updated every year","The point is about government policy, not ratings."],["Firms must report their emissions every quarter","Reporting frequency is not the point."]],"c":[0],"es":"Outdated policies can be the barrier.","ed":"Example: building codes or energy market rules written for a fossil system can make low-carbon solutions harder to adopt. Governments must update their own rules, not only add new ones.","kt":"","src":"L13 slide 11"},{"id":"L13S08","l":"L13","t":"Why government policies matter","f":"m","d":2,"p":"H","sc":"none","s":"\"Mind the investment gap\" calls for:","o":[["Cutting public research so markets decide","The lecture argues for more public R&D, not less."],["Raising interest rates to slow investment","The aim is to close the gap, not to slow investment."],["Public funding for new zero-carbon tech","Private capital alone will not fund the invention of new zero-carbon technologies."],["Banning private investment in energy","Private investment is needed too."]],"c":[2],"es":"Governments must help fund new zero-carbon technologies.","ed":"Early-stage, high-risk technologies often fail to attract private capital. Government policy and financing can close this gap, especially where the technology does not exist yet.","kt":"","src":"L13 slide 11"},{"id":"L13S09","l":"L13","t":"What each of us can do","f":"m","d":3,"p":"H","sc":"none","s":"Employers should \"help early-stage innovators get across the valley of death\". The valley of death is:","o":[["Climate damage concentrated in poor countries","That is about physical risk and justice."],["The funding gap from lab to market","Many new technologies die between a working prototype and a profitable product, because funding dries up."],["The fall in share prices after an IPO","That is not the meaning used here."],["Job losses in regions that depend on coal","That is the just transition issue."]],"c":[1],"es":"Valley of death = funding gap from lab to market.","ed":"Employers can help by being early adopters, buying from young firms and connecting with government-funded research. This links to the investment gap and to SF 3.0 instruments such as impact and venture investing.","kt":"Valley of death: the stage where a new technology has been shown to work but cannot yet attract enough funding to scale.","src":"L13 slide 18"},{"id":"L13S10","l":"L13","t":"Role of players","f":"m","d":2,"p":"H","sc":"none","s":"Which task does the lecture give to governments?","o":[["Writing firms' sustainability reports","Firms prepare their own reports."],["Producing commercial ESG ratings","Ratings are produced by private data providers."],["Choosing which stocks pension funds buy","Investment choices are left to investors."],["Setting taxation and carbon pricing","Slide 8 lists laws and regulations, taxation, carbon pricing, and monitoring and sanctioning deviations."]],"c":[3],"es":"Governments: research, priorities, laws, taxation, carbon pricing, monitoring and sanctions.","ed":"Governments also form supranational coalitions (IPCC, UN, OECD, the Paris Agreement) to understand and act on global challenges. Private coalitions often lack sanctions, which is one reason regulation still matters.","kt":"","src":"L13 slide 8"},{"id":"TR60","l":"L13","t":"Coalitions","f":"m","d":3,"p":"M","sc":"none","s":"What goes wrong if a coalition lets almost anyone become a member?","o":[["Membership then means little","Too broad boundaries make membership meaningless as a signal."],["It becomes an SF 3.0 network","Breadth does not change the coalition's SF type."],["Almost nobody can join","That is the problem of boundaries that are too narrow."],["Members are fined","Most coalitions are voluntary and rarely have sanctions."]],"c":[0],"es":"Too broad = meaningless; too narrow = nobody qualifies.","ed":"Design principles (from Ostrom, via the textbook): clear boundaries, membership rules, collective choice, monitoring, sanctions and rewards, conflict resolution. In practice sanctions are rare, since most coalitions are voluntary.","kt":"","src":"Opptak L12 ca. 54 min"},{"id":"TR61","l":"L13","t":"Coalitions","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"An asset manager joins a climate coalition mainly so its engagement with big emitters carries more weight. Which motive is this?","o":[["Reputation","Reputation links to signalling, not the EMH."],["Risk avoidance","The aim described is influence, not avoiding hidden-quality risk."],["Outside pressure","No external pressure is described here."],["Collective engagement","Coordinated engagement raises success rates (Dimson et al.)."]],"c":[3],"es":"Joining to engage together = collective engagement.","ed":"Motives in the lecture: collective advocacy and engagement (link: coordinated engagement papers), reputation and peer effects (link: signalling, like green bonds), outside pressure (consumers, investors, NGOs), and risk avoidance (link: integrating E and S into risk management).","kt":"","src":"Opptak L12 ca. 51 min"},{"id":"TR62","l":"L13","t":"Transition management","f":"m","d":3,"p":"M","sc":"none","s":"In the transition management interview, what is the biggest challenge for transitions?","o":[["Inventing new technology","The speaker says superior technologies often already exist."],["Changing institutions and culture","\"Technology is the least of our problems\" in many areas."],["One global plan","Transition management builds on small experiments."],["Raising interest rates","Monetary policy is not discussed."]],"c":[1],"es":"The hard part is institutional and behavioural change.","ed":"Transitions combine bottom-up experiments that scale up with the destabilisation of the dominant regime (e.g. fossil energy). Transition management uses backcasting: envision the future, then work backwards to stepping stones and concrete actions today.","kt":"","src":"Opptak L12 ca. 60 min · Opptak L12 ca. 64 min"}]</script>
<script>
(function(){
const BANK = JSON.parse(document.getElementById('bank').textContent);
const BYID = Object.fromEntries(BANK.map(q => [q.id, q]));
const LECS = [['L1','Introduction'],['L2','Business ethics'],['L3','Externalities'],['L4','Shareholder vs stakeholder'],['L5','Governance'],['L6','Business models'],['L7','Metrics and reporting'],['L8','Investing for LTVC'],['L9','ESG integration and asset prices'],['L10','Non-equity asset classes'],['L11','Banking'],['L12','Insurance'],['L13','Coalitions and transition'],['GUEST','Guest lectures']];
const LECNAME = Object.fromEntries(LECS);
const ICON = {
  practice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h6"/></svg>',
  exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
  wrong:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  flagged:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
const MODES = [
  ['practice','Practice','Answer and see the explanation right away'],
  ['exam','Exam','No answers until you submit'],
  ['wrong','Review mistakes','Questions you last got wrong'],
  ['flagged','Flagged','Questions you have flagged']];
const FMTS = [['m','Multiple choice'],['t','True/false · Yes/no']];
const SCN = {short:'Case', extended_course_case:'Course case', constructed_scenario:'Scenario'};
const STORE = 'fie459-progress-v1';
const EXAM = new Date(2026, 11, 16);

// ---------- storage (per browser) ----------
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && s.p) return s; }catch(e){} return {p:{}, flags:[], set:null}; }
let DB = load();
let FLAGS = new Set(DB.flags || []);
function save(){ try{ DB.flags=[...FLAGS]; localStorage.setItem(STORE, JSON.stringify(DB)); }catch(e){} }
function rec(id, ok){ const r = DB.p[id] || {n:0,k:0,last:0}; r.n++; if(ok) r.k++; r.last = ok?1:-1; DB.p[id]=r; save(); }

// ---------- settings ----------
const S = Object.assign({mode:'practice', lecs:LECS.map(l=>l[0]), fmts:['m','t'], prio:'all', count:20, smart:true, sec:'core'}, DB.set || {});
if(!S.sec) S.sec='core';
function inSec(q){ return S.sec==='core' ? !!q.k : !q.k; }
function saveSet(){ DB.set = S; save(); }

// ---------- helpers ----------
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){ const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='on') for(const ev in v) e.addEventListener(ev, v[ev]);
    else if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else e.setAttribute(k, v===true?'':v); }
  for(const c of kids.flat()) if(c!=null && c!==false) e.append(c instanceof Node ? c : document.createTextNode(c));
  return e;
}
const app = document.getElementById('app');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function setNav(v){ document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.view===v))); }
function sameSet(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }
function fmtTime(s){ const m=Math.floor(s/60), ss=s%60; return (m>=60? Math.floor(m/60)+':'+String(m%60).padStart(2,'0') : m)+':'+String(ss).padStart(2,'0'); }
function lecStats(l){ const qs=BANK.filter(q=>q.l===l && inSec(q)); let seen=0,k=0,w=0; for(const q of qs){const r=DB.p[q.id]; if(r){seen++; if(r.last>0)k++; else w++;}} return {n:qs.length,seen,k,w}; }
function lecLabel(id){ return id==='GUEST' ? 'Guest' : id; }
function daysLeft(){ const t=new Date(); t.setHours(0,0,0,0); return Math.max(0, Math.round((EXAM - t)/864e5)); }
function ring(pct, size){
  const r=54, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function bar(k, w, n){ return h('span',{class:'bar'}, h('i',{class:'k',style:`width:${n?k/n*100:0}%`}), h('i',{class:'w',style:`width:${n?w/n*100:0}%`})); }
function tfText(o){ return o[0]; }
function isYN(q){ return q.f==='t' && q.o[0][0]==='Yes'; }
function keyFor(q, pos){ return q.f==='t' ? (isYN(q) ? (pos?'N':'Y') : (pos?'F':'T')) : String.fromCharCode(65+pos); }

function pool(){
  return BANK.filter(q => inSec(q) && S.lecs.includes(q.l) && (S.fmts.includes(q.f)||!S.fmts.some(f=>f==='m'||f==='t')) && (S.sec==='core' || S.prio==='all' || q.p==='H')
    && (S.sec==='core' || !S.trOnly || q.id.startsWith('TR'))
    && (S.mode!=='wrong' || (DB.p[q.id] && DB.p[q.id].last<0))
    && (S.mode!=='flagged' || FLAGS.has(q.id)));
}

// ---------- setup view ----------
function renderSetup(){
  setNav('setup'); stopTimer(); clearSes(); SES = null; app.replaceChildren();
  const SQ = BANK.filter(inSec), all = SQ.map(q=>DB.p[q.id]).filter(Boolean), seen = all.length, lastOk = all.filter(r=>r.last>0).length, lastBad = seen-lastOk;
  const pct = SQ.length ? lastOk/SQ.length : 0;
  app.append(h('div',{class:'stack'},
    h('div',null, h('h1',{text:'Train for the exam'}),
      h('p',{class:'lead', text: S.sec==='core'
        ? `Core ${SQ.length}: the most likely exam topics, written like the lecturer's sample questions, with the exam mix of about 4 multiple choice to 1 yes/no. Includes the three sample questions. Explanations in Norwegian, key terms in English.`
        : `${SQ.length} questions from every lecture, the textbook and the guest lectures. Single-answer multiple choice and true/false, just like the exam, with an explanation and source for every answer.`})),
    block('Question set', h('div',{class:'seg sec', role:'group'}, [['core','Core '+BANK.filter(q=>q.k).length,'Basics first · Norwegian explanations'],['full','Full bank','Exam-style · '+BANK.filter(q=>!q.k).length+' questions']].map(([k,t,d]) =>
      h('button',{id:'sec-'+k,'aria-pressed':String(S.sec===k), on:{click:()=>{S.sec=k; saveSet(); renderSetup();}}},
        h('b',{text:t}), h('span',{class:'d',text:d}))))),
    h('div',{class:'panel dash'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'mastered'})))),
      h('div',{class:'tiles'},
        h('div',{class:'tile exam'}, h('b',{text:String(daysLeft())}), h('span',{text:'days to exam · 16 Dec'})),
        h('div',{class:'tile'}, h('b',{text:`${seen}`}), h('span',{text:`of ${SQ.length} seen`})),
        h('div',{class:'tile'}, h('b',{text:`${lastBad}`}), h('span',{text:'to review'})),
        h('div',{class:'tile'}, h('b',{text:`${FLAGS.size}`}), h('span',{text:'flagged'})))),
    block('Mode', h('div',{class:'seg', role:'group'}, MODES.map(([k,t,d]) =>
      h('button',{id:'mode-'+k,'aria-pressed':String(S.mode===k), on:{click:()=>{S.mode=k; saveSet(); renderSetup();}}},
        h('span',{class:'ic', html:ICON[k]}), h('b',{text:t}), h('span',{class:'d',text:d}))))),
    block('Lectures', [
      h('div',{class:'lecs'}, LECS.map(([id,name]) => { const st=lecStats(id);
        return h('button',{class:'lec', id:'lec-'+id, 'aria-pressed':String(S.lecs.includes(id)), title:`${st.k} correct, ${st.w} wrong last time, of ${st.n}`,
          on:{click:()=>{ S.lecs = S.lecs.includes(id)? S.lecs.filter(x=>x!==id) : [...S.lecs,id]; saveSet(); renderSetup(); }}},
          h('span',{class:'code',text:lecLabel(id)}), h('span',{class:'name',text:name}), h('span',{class:'n',text:`${st.seen}/${st.n}`}),
          bar(st.k, st.w, st.n)); })),
      h('div',{class:'row'},
        h('button',{class:'linkbtn', id:'lec-all', on:{click:()=>{S.lecs=LECS.map(l=>l[0]); saveSet(); renderSetup();}}, text:'Select all'}),
        h('button',{class:'linkbtn', id:'lec-none', on:{click:()=>{S.lecs=[]; saveSet(); renderSetup();}}, text:'Clear all'}))]),
    block('Question type', h('div',{class:'row'}, FMTS.map(([k,t]) => chip('fmt-'+k, t, S.fmts.includes(k), ()=>{ S.fmts = S.fmts.includes(k)? S.fmts.filter(x=>x!==k):[...S.fmts,k]; }))),
      S.sec==='core' ? null : h('div',{class:'row'}, chip('prio-all','All priorities',S.prio==='all',()=>S.prio='all'), chip('prio-h','High priority only',S.prio==='H',()=>S.prio='H'), chip('tr-only','New from lecture recordings',!!S.trOnly,()=>S.trOnly=!S.trOnly))),
    block('Number of questions', h('div',{class:'row'}, [10,20,40,80,0].map(n => chip('count-'+n, n?String(n):'All', S.count===n, ()=>S.count=n)),
      S.mode==='practice' ? chip('smart','Unseen and wrong first', S.smart, ()=>S.smart=!S.smart) : null)),
    startBar()
  ));
}
function block(label, ...kids){ return h('section',{class:'block'}, h('p',{class:'label',text:label}), ...kids); }
function chip(id, text, on, fn){ return h('button',{class:'chip', id, 'aria-pressed':String(on), on:{click:()=>{fn(); saveSet(); renderSetup();}}, text}); }
function startBar(){
  const p = pool(), n = S.count ? Math.min(S.count, p.length) : p.length;
  const msg = p.length ? [h('b',{text:String(n)}), ` questions of ${p.length} available`]
    : [S.mode==='wrong' ? 'No mistakes to review yet.' : S.mode==='flagged' ? 'You have not flagged any questions yet.' : 'No questions match your filters.'];
  return h('div',{class:'startbar'}, h('span',{class:'info'}, msg),
    h('button',{class:'primary', id:'start', disabled:!p.length, on:{click:()=>startSession(p, n)}, text: S.mode==='exam' ? 'Start exam' : 'Start'}));
}

// ---------- session ----------
let SES = null, timer = null;
const SESKEY = 'fie459-session-v1';
function persistSes(){ try{ if(SES) localStorage.setItem(SESKEY, JSON.stringify(SES)); }catch(e){} }
function clearSes(){ try{ localStorage.removeItem(SESKEY); }catch(e){} }
function fixSes(s){ // a saved session can predate a bank update (e.g. a yes/no question that became multiple choice)
  if(!s || !s.items) return s;
  s.items = s.items.filter(x=>BYID[x.id]);
  for(const x of s.items){ const q=BYID[x.id];
    if(!x.order || x.order.length!==q.o.length || x.order.some(i=>i>=q.o.length)){
      x.order = (q.f==='t' || q.x) ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i)); x.chosen=[]; x.done=false; x.ok=false; } }
  if(!s.items.length) return null; if(s.i>=s.items.length) s.i=s.items.length-1; return s; }
function loadSes(){ try{ const s = JSON.parse(localStorage.getItem(SESKEY)); if(s && s.items && s.items.length && s.items.some(x=>BYID[x.id])) return s; }catch(e){} return null; }
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
function startSession(p, n){
  let list = shuffle(p);
  if(S.mode==='practice' && S.smart){ const w = q => { const r=DB.p[q.id]; return !r?1 : r.last<0?0 : 2; }; list.sort((a,b)=>w(a)-w(b)); }
  list = list.slice(0, n);
  SES = { exam:S.mode==='exam', i:0, t0:Date.now(), confirm:false,
    items: list.map(q => ({ id:q.id, order: (q.f==='t' || q.x) ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i)), chosen:[], done:false, ok:false })) };
  stopTimer(); timer = setInterval(tick, 1000);
  renderQuestion(); window.scrollTo(0,0);
}
function tick(){ const el=document.getElementById('clock'); if(el && SES) el.textContent = fmtTime(Math.floor((Date.now()-SES.t0)/1000)); }

function renderQuestion(){
  persistSes();
  setNav(''); app.replaceChildren();
  const it = SES.items[SES.i], q = BYID[it.id], ms = q.f==='s', N = SES.items.length;
  const answered = SES.items.filter(x=> SES.exam ? x.chosen.length : x.done).length;
  const correct = SES.items.filter(x=>x.done&&x.ok).length;
  const need = ms ? q.c.length : 1;

  const top = h('div',{class:'qtop'},
    h('span',{class:'pos',text:`${SES.i+1} / ${N}`}),
    h('span',{class:'track'}, h('i',{style:`width:${answered/N*100}%`})),
    h('span',{class:'stat'}, SES.exam ? '' : `${correct} correct · `, h('span',{id:'clock',text:fmtTime(Math.floor((Date.now()-SES.t0)/1000))})));

  const meta = h('div',{class:'meta'},
    h('span',{class:'lecid',text:q.l==='GUEST'?'Guest lecture':q.l+' · '+LECNAME[q.l]}),
    h('span',{text:q.t}), SCN[q.sc] ? h('span',{class:'tag',text:SCN[q.sc]}) : null, h('span',{class:'qid',text:q.id}));

  const opts = h('div',{class:'opts', role: ms?'group':'radiogroup'});
  it.order.forEach((oi, pos) => {
    const o = q.o[oi], sel = it.chosen.includes(oi);
    let cls = 'opt';
    const reveal = it.done && !SES.exam;
    if(reveal){ if(q.c.includes(oi)) cls+=' right'; else if(sel) cls+=' wrong'; }
    const showWhy = reveal && (sel || q.c.includes(oi));
    opts.append(h('button',{class:cls, id:`opt-${pos}`, 'aria-pressed':String(sel), disabled:reveal,
        on:{click:()=>choose(oi)}},
      h('span',{class:'key',text: keyFor(q,pos)}),
      h('span',null, q.f==='t' ? tfText(o) : o[0], showWhy ? h('span',{class:'why',text:o[1]}) : null)));
  });

  const card = h('div',{class:'card'}, meta, h('p',{class:'stem',text:q.s}), opts);
  if(it.done && !SES.exam) card.append(feedback(q, it));
