ording to the textbook?","o":[["The two largest agencies agree almost perfectly.","Howard (2016) finds a correlation of only 26% between the two largest agencies."],["They are \"industry neutral\" and based mainly on operations, so even tobacco or coal firms can score very highly.","Listed in section 7.2.1."],["Each analyst covers only a few companies, making ratings too expensive.","The problem is the opposite: as many as 70 stocks per analyst."],["They are based on too much proprietary data from site visits.","They rely on reported data and policies, which are only a fraction of what is needed."]],"c":[1],"es":"Limitations: little materiality focus, reliance on reported data, industry neutrality, too many stocks per analyst → size bias, intuitively wrong ratings, low agreement.","ed":"ESG ratings try to be too many things to too many people. They rely on reported data and policies, are industry neutral and operations-focused, and analysts cover up to 70 stocks. Results: size bias, coal and tobacco \"leaders\", and material problems cancelled out by immaterial positives (Volkswagen, Toshiba). Correlation between the two largest providers was only 26% (Howard, 2016). Ratings are like valuation multiples: quick but imprecise shortcuts, better at portfolio level than company level, and a starting point for analysis. Also correct: They have little focus on material issues, so a fatal material issue can be offset by high scores on immaterial items.","kt":"","src":"L8 slide 73 · Bok s. 187 (7.2) · Bok s. 187 (7.2.1) · Bok s. 188 (7.2.1)"},{"id":"SB303","l":"L8","t":"ESG ratings limitations","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook's \"current state of play\", how do investors' uses of ESG ratings map onto the sustainable finance typology?","o":[["Positive screening with ratings is SF 2.0, because it uses ESG data.","Because of ratings' design limitations it is labelled SF 1.5."],["All rating-based strategies are SF 3.0, since ratings capture impact.","SF 3.0 requires optimising impact; ratings do not capture this."],["Exclusion is SF 1.0, positive screening SF 1.5, integration SF 2.0.","Section 7.2.2 uses this labelling."],["Negative screening is SF 3.0, because exclusion has the largest impact.","Exclusion is the most basic stage, SF 1.0."]],"c":[2],"es":"About half use ratings only for exclusion (SF 1.0); half for positive screening (SF 1.5); full integration = SF 2.0.","ed":"Among institutional ESG investors, about half use ESG ratings only for negative screening (excluding very negative externalities, SF 1.0), and half for positive screening such as best-in-class and thematic (labelled SF 1.5 due to rating limitations). Investors still rely on tracking errors and benchmarks; ratings are just added. Full ESG integration via fundamental analysis and engagement is SF 2.0; SF 3.0 would put impact first.","kt":"","src":"Bok s. 189 (7.2.2) · L1 slide 30"},{"id":"SB304","l":"L8","t":"Active investment approach","f":"m","d":4,"p":"H","sc":"none","s":"Why does the textbook argue that transition preparedness analysis is \"impossible with a passive investment approach and nearly impossible with a quant approach\"?","o":[["Transition preparedness is fully captured by ESG ratings, which passive funds already use.","Ratings are of limited use for preparedness."],["Quant approaches always outperform fundamental analysis on ESG, making preparedness analysis unnecessary.","Quant ESG mainly tracks short-term ESG momentum and is complementary."],["Materiality is company specific, so preparedness needs an expert judgement call.","Preparedness can so far only be assessed diagnostically by a fundamental analyst."],["Passive and quant funds are legally banned from using ESG data in portfolio construction.","No such ban exists."]],"c":[2],"es":"Preparedness requires company-level, expert, diagnostic judgement; scalable metrics do not yet exist.","ed":"True sustainable investing means investing in transition, so investors must know whether a company's business model can adapt to a sustainable economy. Lacking objective and scalable metrics, this needs fundamental analysts using new tools and data (externalities, governance, behaviour). Figure 7.2 shows the workflow: identify material issues → assess qualitatively and quantitatively → estimate financial impact (e.g. human capital → margin advantage). Few analysts do this, which creates alpha opportunities. Cremers and Pareek: high active share plus patience (>2 years holding) outperform by over 2% per year.","kt":"","src":"Bok s. 190 (7.3.2) · Bok s. 191 (Figure 7.2) · Bok s. 191 (7.3.2)"},{"id":"SB305","l":"L8","t":"Active investment approach","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Citing Statman (2004), the textbook argues that a portfolio needs at least 1,000 stocks to eliminate most idiosyncratic risk, so concentrated portfolios are always poorly diversified.","o":[["True","Incorrect. Statman shows that 50 to 100 stocks eliminate most idiosyncratic risk; benefits beyond 100 are small and exhausted beyond 300."],["False","Correct. Statman shows that 50 to 100 stocks eliminate most idiosyncratic risk; benefits beyond 100 are small and exhausted beyond 300."]],"c":[1],"es":"False: 50-100 stocks suffice; diversification across asset classes matters more.","ed":"Figure 7.4 shows diminishing benefits of diversification. Diversification gains come mainly from allocation across asset classes, so a concentrated portfolio within each class is fine. Excess diversification has costs: less selectiveness, less knowledge of and engagement with holdings, and a free-rider problem in monitoring management. Choi et al. (2017) find concentrated strategies by skilled investors earn excess risk-adjusted returns, consistent with information advantage theory.","kt":"","src":"Bok s. 193 (7.3.3) · Bok s. 193 (Figure 7.4) · Bok s. 194 (7.3.3)"},{"id":"SB306","l":"L8","t":"Active investment approach","f":"m","d":2,"p":"M","sc":"none","s":"According to the textbook, how does excessive diversification create a free-rider problem?","o":[["Diversified investors free-ride on the CAPM, which sets prices for them.","The free-rider problem concerns monitoring of corporate managements."],["With tiny stakes, no investor has enough incentive to monitor.","Small percentage stakes mean few investors have sufficient incentive to monitor."],["Diversified investors receive dividends without paying taxes.","Taxation is unrelated to the monitoring problem."],["Index funds can borrow at the risk-free rate, unlike other investors, and lever up.","Unrelated to free-riding in monitoring."]],"c":[1],"es":"Small stakes → weak incentives to monitor → everybody free-rides on others' monitoring.","ed":"Monitoring is costly and its benefits are shared by all shareholders, so with small stakes the private benefit is below the cost. Widely diversified portfolios therefore lead to inadequate monitoring of corporate management on aggregate. Concentrated, active portfolios with larger stakes (e.g. Alecta, often among the largest shareholders) make engagement worthwhile. This mirrors Lecture 5 on blockholders and monitoring.","kt":"","src":"Bok s. 194 (7.3.3) · Bok s. 205 (Box 7.3) · L5 slide 9"},{"id":"SB307","l":"L8","t":"Alternative performance measures","f":"m","d":3,"p":"M","sc":"none","s":"Instead of measuring a fund only against a single market benchmark, which alternative does the textbook propose?","o":[["Earnings per share of the portfolio companies","EPS is the traditional value indicator in Table 7.1."],["A range of indices (e.g. sector indices) instead of one","First alternative in section 7.3.5."],["The number of trades executed per year","Trading activity is not a performance measure."],["Daily tracking error against the MSCI World only","This is the traditional approach the textbook criticises."]],"c":[1],"es":"Alternatives: a range of indices, a peer group of comparable funds, and an absolute return target.","ed":"Relative benchmarking reduces funds to a few backward-looking metrics that encourage shortcuts. Using a range of indices, a peer group (Table 7.3: the fund beats 20% of peers over one year but 80% over three and five years) and an absolute return target (Table 7.4: 7% p.a., consistent with Jordà et al.'s long-run equity return) gives a wider context. The absolute target is tougher: the fund needs years to recover from -34.5% in 2008. Non-financial performance should also be measured (KPIs, externality valuation, SDG contribution). Also correct: An absolute return target, possibly corrected for an absolute risk metric.","kt":"","src":"Bok s. 195 (7.3.5) · Bok s. 196 (Table 7.3) · Bok s. 196 (Table 7.4)"},{"id":"SB308","l":"L8","t":"Alternative performance measures","f":"m","d":4,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A mining company sells its underground mines in a developing country, and its group-wide lost time injury frequency rate (LTIFR) falls sharply. What does the textbook say about interpreting this?","o":[["The fall proves that safety management at the remaining mines improved.","The improvement comes from portfolio composition, not from better conditions."],["The fall may reflect the changed asset mix; alone it does not show safer remaining mines.","The textbook uses exactly this divestment example."],["Safety KPIs are irrelevant for mining companies.","Safety is highly material in mining."],["LTIFR is fully comparable across firms and time, so the result is reliable.","KPIs are hard to compare across firms and over time."]],"c":[1],"es":"Single KPIs can change through boundary shifts; they are narrow, hard to compare and need expert interpretation.","ed":"Limitations of specific KPIs: (1) each is too narrow for a holistic view; (2) they are hard to compare across companies and industries and over time (boundaries change, e.g. divesting high-LTIFR units); (3) they may not measure what matters (scope 1-3 omit avoided emissions, e.g. Novozymes' 76 million tons); (4) it is unclear whether good KPI performance is sufficient for a sustainable model. Externality valuation (True Price, KPMG True Value) is more holistic but slow and allows netting of pluses and minuses.","kt":"","src":"Bok s. 197 (7.3.6.1) · Bok s. 198 (7.3.6.1)"},{"id":"SB309","l":"L8","t":"Alternative performance measures","f":"m","d":3,"p":"M","sc":"none","s":"KPMG's True Value methodology (Box 7.2) has three steps. Which ordering is correct?","o":[["Set an SDG target → buy carbon offsets → publish a sustainability report","Not the True Value steps."],["True earnings → earnings at risk → value-creating business cases","These are the three steps in Box 7.2."],["Calculate beta → estimate tracking error → compute the information ratio","These are traditional performance metrics."],["Exclude polluting firms → rank remaining firms → invest in the top quartile","This describes screening."]],"c":[1],"es":"1) True earnings bridge (material externalities); 2) earnings at risk from regulation, stakeholders, markets; 3) value-creating business cases with True Value NPV.","ed":"KPMG argues the gap between corporate and societal value is closing as externalities are internalised via regulation and standards, stakeholder action and market dynamics. Step 1 quantifies material externalities in a \"true earnings bridge\"; step 2 assesses earnings at risk using scenario analysis; step 3 builds business cases whose True Value NPV includes future returns from internalised externalities, compared via a marginal True Value curve. The textbook uses \"integrated value\" for the same idea.","kt":"","src":"Bok s. 199 (Box 7.2) · Bok s. 198 (7.3.6.2) · L3 slide 17"},{"id":"SB310","l":"L8","t":"SDG tagging","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"Constructed scenario: A fund tags its holdings: a hospital operator (+SDG 3), a coal miner (−SDG 13), and a bank (neutral). What can the fund learn from this simple tagging?","o":[["Nothing, because SDGs cannot be applied to companies","The approach maps companies to SDGs."],["Exact measurement of each company's impact in tonnes and lives","Tagging is qualitative, not precise measurement."],["A rough view of SDG exposure and transition preparedness, even with poor data","Schramade argues tagging works even with limited data."],["The companies' credit ratings","Tagging is about SDG exposure, not credit risk."]],"c":[2],"es":"Tagging gives a rough but useful view of SDG exposure.","ed":"Roughly 20% of companies are SDG positive, 20% negative and 60% neutral. Tagging helps identify which holdings need engagement and which align with transition themes, and is a first step towards impact measurement.","kt":"SDG tagging: marking holdings as positive, neutral or negative for each SDG to estimate a portfolio's exposure.","src":"Bok s. 200 (7.3.6.3)"},{"id":"SB311","l":"L8","t":"Conditions for LTVC","f":"m","d":2,"p":"H","sc":"none","s":"The textbook (based on De Jong et al., 2017) lists six conditions for investing for long-term value creation. Which is among them?","o":[["Keep the investment chain short","This is condition 6 in Figure 7.6."],["Outsource engagement to proxy advisors","Condition 3 calls for effective engagement linked to investment analysis."],["Minimise tracking error against a broad market index","A tight tracking error prevents the deviations needed for LTVC."],["Evaluate managers on quarterly relative returns","Condition 4 calls for performance analysis of value added in the real economy."]],"c":[0],"es":"1 long horizons; 2 active, concentrated portfolios; 3 effective engagement; 4 performance analysis of real value added; 5 long-term mandate alignment; 6 short chains.","ed":"The conditions reinforce each other: long horizons (5+ years intended holding), active management of concentrated portfolios (enables fundamental ESG analysis and is necessary for engagement), effective engagement behind the scenes and by voting, performance analysis based on value added in the real economy (financial, social, environmental), long-term alignment of mandates with incentives and investment beliefs, and short investment chains (each extra party adds complexity and shortens accountability periods). Also correct: Long-term alignment of the mandates of asset owners and asset managers.","kt":"","src":"Bok s. 202 (7.4) · Bok s. 202 (Figure 7.6) · Bok s. 204 (7.4.5) · Bok s. 204 (7.4.6) · L8 slide 74"},{"id":"SB312","l":"L8","t":"Conditions for LTVC","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"Box 7.3 describes Swedish pension fund Alecta: a 15-20 year perspective, about 104 listed holdings, in-house analysis with a sustainability review before each investment, often among the largest shareholders, and total costs of 0.09% of AUM. Which conclusion does the case support?","o":[["Long-term investors must outsource all analysis to rating agencies.","Alecta relies on independent in-house analysis."],["A concentrated portfolio of 104 stocks cannot be adequately diversified.","Statman shows 50-100 stocks remove most idiosyncratic risk."],["Concentrated in-house investing can be cheap and engaged.","Cutting external managers and consultants kept costs at 0.09% while enabling dialogue."],["Active management is always more expensive than index investing.","Alecta's costs are very low because it cut out external managers and consultants."]],"c":[2],"es":"Alecta shows LTVC conditions in practice: long horizon, concentration, in-house analysis, engagement, short chain, low costs.","ed":"Alecta (€81bn AUM in 2016) focuses on absolute return and risk over five-year averages, reviews sustainability before each investment, and as a large shareholder engages closely. Its short chain (no external managers or consultants) both aligns incentives and cuts costs (investment management costs 0.02%). Returns 2012-16 averaged 9.1% p.a. This contrasts with NBIM's near-index approach in Box 7.1.","kt":"","src":"Bok s. 205 (Box 7.3) · Bok s. 204 (7.4.6)"},{"id":"SB313","l":"L8","t":"Ideal investment chain","f":"m","d":4,"p":"M","sc":"none","s":"Figure 7.5 contrasts the ideal and the often-observed investment chain. How does it describe a typical (\"often\") investee company?","o":[["Tenure horizon; maximises EPS; short-term pay without claw-backs.","This is the \"often\" column for the investee company."],["Horizon of a quarter; hires many asset managers and consultants.","This describes a typical asset owner."],["Horizon of decades; maximises integrated value; pay aligned with LTVC; integrated reporting.","This is the \"ideally\" column."],["Many small holdings close to the benchmark; proxy voting unrelated to investment decisions.","This describes a typical asset manager."]],"c":[0],"es":"Often: tenure horizon, EPS focus, short-term pay, traditional reporting. Ideally: decades, IV = FV + SV + EV, aligned pay, IR.","ed":"Ideally, the asset owner has a decades-long horizon, maximises IV, is simple and flat, uses few managers and nuanced metrics; the asset manager has a horizon of years, concentrated portfolios and engagement on all holdings linked to investment decisions; the company balances long-term and short-run execution, aligns pay with LTVC and reports in an integrated way. In practice, horizons are quarterly, chains bureaucratic and metrics narrow. The HLEG (2018) recommends including sustainability in fiduciary duty.","kt":"","src":"Bok s. 200 (7.3.7) · Bok s. 201 (Figure 7.5)"},{"id":"SB314","l":"L8","t":"UN PRI","f":"m","d":2,"p":"M","sc":"none","s":"Which of the following is one of the six UN Principles for Responsible Investment (PRI)?","o":[["We will guarantee beneficiaries returns above the market index.","The principles concern ESG incorporation, not return guarantees."],["We will only invest in Article 9 funds under the EU SFDR.","SFDR categories are not part of the PRI."],["We will be active owners and incorporate ESG into ownership.","This is PRI principle 2."],["We will divest from all companies with any fossil fuel exposure.","The PRI does not mandate blanket divestment."]],"c":[2],"es":"PRI: incorporate ESG in analysis; active ownership; seek disclosure; promote the principles; collaborate; report on progress.","ed":"The six PRI principles commit signatories to (1) incorporate ESG issues into investment analysis and decisions; (2) be active owners; (3) seek appropriate ESG disclosure from investees; (4) promote acceptance and implementation in the industry; (5) work together to enhance effectiveness; (6) report on activities and progress. Slide 76 states the PRI's mission: a sustainable global financial system, encouraged through adoption of the principles, good governance and addressing obstacles in market practices, structures and regulation.","kt":"","src":"L8 slide 75-76"},{"id":"SB315","l":"L8","t":"Integrated LTVC investing","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A pension fund tracks a broad ESG-screened index with a 0.5% tracking error limit, evaluates its external manager quarterly, votes using proxy advisor recommendations, and reports its portfolio's average ESG rating. Which change would move it MOST towards investing for LTVC as defined in the textbook?","o":[["Run a concentrated mandate with fundamental ESG analysis and engagement.","This addresses conditions 1-6: horizon, concentration, engagement, performance, alignment and chain length."],["Switch to a different ESG rating provider whose methodology gives the portfolio higher average scores.","Ratings are imprecise shortcuts; changing provider does not change the approach."],["Tighten the tracking error limit to 0.1% to reduce risk.","This makes the portfolio even more passive."],["Add more external managers to diversify manager risk.","This lengthens the investment chain (condition 6)."]],"c":[0],"es":"LTVC needs long horizons, concentrated active portfolios, real engagement, real-economy performance analysis, aligned mandates and short chains.","ed":"The starting situation is SF 1.0-1.5: a screened passive index (exclusions), tight tracking error, quarterly evaluation, proxy-advisor voting and rating-based reporting. Each element conflicts with the textbook's conditions. A concentrated in-house mandate with fundamental ESG analysis (transition preparedness), engagement integrated with investment cases, multi-year and absolute or real-economy performance measures and fewer intermediaries moves it towards SF 2.0. The trade-off: more cost and active risk, which the Alecta case suggests can be managed.","kt":"","src":"Bok s. 180 (Table 7.1) · Bok s. 202 (Figure 7.6) · Bok s. 186 (Box 7.1) · Bok s. 205 (Box 7.3) · L8 slide 71-74"},{"id":"SB316","l":"L8","t":"Investment chain","f":"m","d":3,"p":"M","sc":"short","s":"NBIM manages the Norwegian oil fund partly through external mandates (e.g. with large global asset managers). Applying the textbook, what risk does each extra link in such a chain create?","o":[["Lower diversification of the fund","Mandates can increase diversification."],["Guaranteed underperformance","Chains create risks, not guaranteed underperformance."],["No risk, because all parties share the same goals","Goals and incentives are rarely fully aligned."],["Diverging horizons and incentives, plus loss of information","Each principal-agent link can shorten horizons and lose information."]],"c":[3],"es":"More links → more agency problems, shorter horizons, lost information.","ed":"The remedy is aligned, long-term mandates and short chains (conditions 5 and 6 for LTVC). Alecta shows a short, in-house chain can be both low-cost and engaged.","kt":"Investment chain: the sequence of parties between the ultimate saver and the company (beneficiaries, asset owner, asset managers, companies).","src":"L8 slide 72 · Bok s. 185 (7.1.4) · Bok s. 204 (7.4.6)"},{"id":"SB317","l":"L8","t":"Financing lifecycle","f":"m","d":4,"p":"M","sc":"short","s":"Swedish battery maker Northvolt raised billions in equity and debt from investors and banks for its giga-factories, but filed for bankruptcy in 2024-25 after production problems. What does the case illustrate about financing the green transition?","o":[["Green growth firms carry high execution risk, so a green label does not cut credit risk.","Technology and scale-up risk remain, whatever the climate benefit."],["Green projects cannot default.","Northvolt shows they can."],["Only public equity can finance green technology.","Northvolt was privately financed with equity and debt."],["Banks should never finance new technologies.","The lesson is to price and structure the risk, not to avoid it entirely."]],"c":[0],"es":"Green ≠ low risk: execution risk dominates in scale-ups.","ed":"The textbook notes green projects are not necessarily safer (technology uncertainty), which is why it opposes lower capital weights for green loans (Lecture 11). Investors need fundamental analysis of business models, not labels.","kt":"Execution (scale-up) risk: the risk that a firm cannot turn a technology into reliable, profitable large-scale production.","src":"L8 slide 12 · Bok s. 301 (10.4.5)"},{"id":"TR31","l":"L8","t":"Double materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A cement producer emits heavily (harming the climate), and rising EU carbon prices are squeezing its margins. How do the two parts of double materiality map onto this case?","o":[["Only financial materiality applies, since emissions are an externality","Externalities are exactly what impact materiality captures."],["Neither applies, because cement is a necessary product","Necessity does not remove material impacts or risks."],["Impact: carbon costs hurt its results; financial: its emissions harm the climate","The two labels are reversed."],["Impact: emissions harm climate; financial: carbon costs hit results","Both directions are present: firm → environment and environment/policy → firm."]],"c":[3],"es":"Impact = firm on world; financial = world on firm.","ed":"The lecturer stresses the loop: a firm's impact on environment and society can feed back into its financial performance (e.g. via carbon pricing, regulation, customers). CSRD/ESRS reporting uses double materiality; SASB uses mainly financial materiality.","kt":"Double materiality: an issue is material if the firm affects people/environment (impact) or the issue affects the firm's value (financial), or both.","src":"Opptak L8 ca. 65 min · Opptak L1 ca. 80 min"},{"id":"TR32","l":"L8","t":"Portfolio theory with sustainability","f":"m","d":3,"p":"M","sc":"none","s":"An investor adds a limit on portfolio carbon emissions to the standard mean-variance problem. According to Lecture 8, what happens in the static model?","o":[["Diversification becomes impossible","Diversification is still possible within the allowed assets."],["The feasible set grows, so the Sharpe ratio must rise","A constraint can only remove options, never add them."],["The efficient frontier is unchanged, because emissions are not risk","The emission constraint removes some portfolios."],["The feasible set shrinks; Sharpe ratio is equal or lower","Adding a constraint cannot improve the optimum; high-return polluters drop out."]],"c":[3],"es":"Extra constraint → smaller feasible set → Sharpe ratio not higher.","ed":"This is the SF 1.0 view: maximise return subject to risk AND emission limits. The lecturer adds a caveat: in the long run, if physical and transition risks hit polluters, the green portfolio may not underperform.","kt":"","src":"Opptak L8 ca. 13 min · Opptak L8 ca. 17 min"},{"id":"TR33","l":"L8","t":"Asset manager materiality","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: An asset manager has large holdings in weapons producers. Which of the following is also a material sustainability issue for the asset manager itself?","o":[["The material issues of its weapons holdings","An investor's material issues include those of its portfolio companies."],["None, since asset managers only face fee and cost issues","The lecture says investors inherit their holdings' material issues."],["Only whether its funds beat their benchmark this year","Performance is a financial outcome, not the material issue in question."],["Only the energy use of its own offices","Own operations are a minor part of an asset manager's impact."]],"c":[0],"es":"Investors inherit the material issues of their holdings.","ed":"SASB lists direct issues for asset managers (product labelling and greenwashing, employee diversity, systemic risk, business ethics), but the lecturer stresses the indirect ones from the portfolio. Materiality matrices also differ between institutions (e.g. UBS vs Santander), so analysis must be firm-specific.","kt":"","src":"Opptak L8 ca. 37 min · Opptak L8 ca. 39 min"},{"id":"TR34","l":"L8","t":"Financing life cycle","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: Two NHH students have a promising idea for carbon-capture technology but no revenue yet. Which financing sources fit their stage best, according to Lecture 8?","o":[["A seasoned equity offering on Oslo Børs","Seasoned offerings are for already-listed firms."],["A syndicated bank loan based on its cash flows","There are no cash flows to lend against yet."],["Own savings, family and friends, and grants","Pre-revenue ideas rely on savings, \"family, friends and fools\" and public grants."],["A large corporate bond issue","Bond markets require scale and a track record."]],"c":[2],"es":"Pre-revenue: savings, FFF and grants; later angels, VC, then M&A or IPO.","ed":"Sequence in the lecture: research grants and own funds → government grants → angel investors and venture capital (once running) → M&A or IPO as exit → seasoned equity offerings and bonds. Impact investing is mostly done through private equity at these earlier stages.","kt":"","src":"Opptak L8 ca. 22 min"},{"id":"TR35","l":"L8","t":"SRI strategies","f":"m","d":2,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A fund removes the whole oil and gas sector, then in every remaining sector keeps only firms whose emissions per unit of output are better than the sector average. Which combination is this?","o":[["Thematic investing, followed by impact investing","No single theme or measured impact intent is described."],["Negative screening, then best-in-class","Sector exclusion is negative screening; within-sector ranking is best-in-class."],["ESG integration, followed by portfolio tilting","No valuation adjustments are described."],["Norms-based screening, followed by stewardship","No international norms or engagement are involved."]],"c":[1],"es":"Excluding a sector = negative; ranking within a sector = best-in-class.","ed":"The lecturer expects these two to be combined in practice. She also advises using concrete metrics (emissions, specific KPIs) rather than overall ESG scores, given rating divergence.","kt":"","src":"Opptak L8 ca. 31 min · Opptak L8 ca. 36 min"},{"id":"TR36","l":"L8","t":"Passive investing and governance","f":"m","d":3,"p":"H","sc":"none","s":"Why does Lecture 8 say that \"exit\" is mainly a governance tool for active investors, even though index funds also sell shares?","o":[["Their sales follow index rules, not firm conduct","Their trades follow index rules, so they send no signal about the firm's behaviour."],["Index funds have no voting rights","Passive funds can and do vote; voting is open to them."],["Exit is ineffective for all investors","Exit can discipline managers when used by active investors."],["Index funds are legally barred from ever selling shares","They do sell, e.g. when firms leave the index."]],"c":[0],"es":"Passive sales track the index, so they carry no disciplinary message.","ed":"Active investors can use engagement, voting and exit; passive investors mainly voting. With the shift to passive investing (supported by CAPM and efficient markets), a key sustainability lever weakens: this is one of the barriers to integrating sustainability.","kt":"","src":"Opptak L8 ca. 77 min · Opptak L8 ca. 78 min"},{"id":"TR37","l":"L8","t":"ESG integration","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: Analyst A drops all fossil fuel firms because she dislikes them. Analyst B keeps them but lowers forecast cash flows for expected carbon costs and stranded assets. Which describes B?","o":[["ESG integration","B analyses how ESG issues affect cash flows and value."],["Impact investing with measurable outcomes","B is not targeting a measured social or environmental outcome."],["Norms-based screening against UN conventions","No international norms are applied."],["Negative screening based on personal values","That describes Analyst A."]],"c":[0],"es":"Adjusting forecasts for material ESG issues = ESG integration.","ed":"BlackRock's description used in the lecture: ESG integration uses financially material ESG information to identify risks and opportunities, and is not just a values-based exercise. Starks would call A a values investor and B a value investor.","kt":"","src":"Opptak L8 ca. 52 min"},{"id":"TR38","l":"L8","t":"Impact investing","f":"t","d":2,"p":"H","sc":"none","s":"True or false: Because impact investing (SF 3.0) puts social and environmental outcomes first, an impact fund may accept running persistently at a loss.","o":[["True","Incorrect. The lecturer stresses impact investing is not charity: there is still a required (lower) financial return, entering as a constraint."],["False","Correct. The lecturer stresses impact investing is not charity: there is still a required (lower) financial return, entering as a constraint."]],"c":[1],"es":"False: impact investing still needs a financial return.","ed":"Key features: intentional, measurable positive impact alongside a financial return. Financial return is a constraint (lower bound) rather than the objective. It is mostly done through private equity, but can also use fixed income and public equity.","kt":"","src":"Opptak L8 ca. 67 min · Opptak L9 ca. 85 min"},{"id":"SB318","l":"L9","t":"Channels from ESG to value","f":"m","d":3,"p":"H","sc":"short","s":"After buying Monsanto in 2018, Bayer agreed in 2020 to pay about USD 10 billion to settle US lawsuits claiming the weedkiller Roundup caused cancer, and its share price fell sharply. Through which channel did this ESG issue mainly hit value?","o":[["Only the cost of capital, with no effect on cash flows","The settlements are cash costs."],["Cash flows: litigation costs and liabilities","Settlements are direct cash outflows (a liability for past externalities)."],["Neither: legal costs are not ESG-related","Product safety and health impacts are material S issues."],["Higher revenues from Roundup sales","Litigation reduced, not raised, value."]],"c":[1],"es":"Litigation = cash flow channel (liabilities for past externalities).","ed":"The NorSIF guide lists \"liabilities for past externalities\" as a separate valuation element. Due diligence before M&A should assess such product and legal risks; the reputational hit may also raise risk premia (cost of capital channel).","kt":"Cash flow channel: ESG affects value through revenues, costs (incl. litigation), capex and stranded assets.","src":"L9 slide 3 · L9 slide 11"},{"id":"SB319","l":"L9","t":"Valuation methods","f":"m","d":2,"p":"H","sc":"none","s":"Why does the textbook prefer an absolute (DCF) valuation over a relative (multiples) valuation for ESG integration?","o":[["A DCF makes assumptions explicit; multiples rely on peer pricing.","Multiples rely on correct peer pricing and imply the same assumptions while giving a false sense of objectivity."],["A DCF does not require any forecasts, so it is more objective.","A DCF relies heavily on forecasts of cash flows and the cost of capital."],["Multiples cannot be calculated for listed companies with positive earnings.","Multiples are easy to compute when EPS is positive; the issue is what they assume."],["Regulators prohibit the use of P/E ratios in equity research reports.","No such prohibition exists."]],"c":[0],"es":"DCF: explicit, adjustable assumptions on value drivers. Multiples: depend on comparables being fairly priced and comparable.","ed":"With relative valuation, P = EPS x (P/E of peers) - e.g. Unilever with EPS €2.8 and peer P/E 20 is valued at €56. But peers may be mispriced, and true comparables are rare. A DCF values the firm as the present value of free cash flows at the WACC; assumptions on growth, margins, capex and cost of capital are explicit, so an analyst can state precisely where they disagree with the market - exactly what ESG integration requires. Risk: analysts simply extrapolate recent history.","kt":"","src":"L9 slide 4 · Bok s. 214 (8.1.2) · Bok s. 218 (8.1.2)"},{"id":"SB320","l":"L9","t":"DCF valuation","f":"m","d":2,"p":"H","sc":"none","s":"In the DCF approach in Lecture 9 (McKinsey steps) and Table 8.2, how do you move from enterprise value to equity value?","o":[["Add net debt to enterprise value, because debt also finances the assets.","Debt is a claim of other financiers and must be subtracted."],["Discount enterprise value again at the cost of equity.","Discounting is already done when computing enterprise value."],["Multiply enterprise value by the equity share of the WACC.","Equity value is a residual, not a WACC-weighted share."],["Subtract net debt and other non-equity claims from it.","Enterprise value is the value to all financiers; equity holders are residual claimants."]],"c":[3],"es":"Equity value = enterprise value − net debt (and other non-equity claims such as pensions, leases, options).","ed":"FCF = cash from operations − investment (NOPLAT + depreciation − capex − increase in NWC). Discounting FCFs at the WACC gives enterprise value, the value to all financiers. Subtracting net debt and other non-equity claims gives equity value; divide by shares outstanding for a fair price (Table 8.2: EV 13,798 − net debt 1,328 = 12,470; /213 shares = 58.5 vs a market price of 60.2). FCF is preferred to earnings because earnings are easier to manipulate via accruals.","kt":"","src":"L9 slide 5 · Bok s. 215 (8.1.2) · Bok s. 217 (Table 8.2)"},{"id":"SB321","l":"L9","t":"DCF valuation","f":"t","d":3,"p":"M","sc":"none","s":"True or false: In the simplified valuation formula V0 = FCF1 / (WACC − g), raising the assumed perpetual growth rate g while keeping the WACC constant lowers the value of the firm.","o":[["True","Incorrect. A higher g shrinks the denominator (WACC − g), so value rises; the formula is very sensitive when g approaches the WACC."],["False","Correct. A higher g shrinks the denominator (WACC − g), so value rises; the formula is very sensitive when g approaches the WACC."]],"c":[1],"es":"False: higher g → smaller (WACC − g) → higher value.","ed":"Koller, Goedhart and Wessels simplify the DCF to V0 = FCF1/(WACC − g). Small changes in g or WACC move value a lot, which is why the textbook appendix (slide 8) asks for sensitivities of ±1% in growth, margins and cost of capital, and what value drivers the current share price implies. ESG can affect both: durable competitive advantages support growth and margins, while risk perceptions affect the WACC.","kt":"","src":"Bok s. 215 (8.1.2) · L9 slide 8"},{"id":"SB322","l":"L9","t":"DCF valuation","f":"m","d":3,"p":"M","sc":"none","s":"In the textbook's example based on Table 8.2, an analyst uses the same assumptions as the consensus except one: because of a stronger belief in the company's competitive position, the EBIT margin is 16% instead of 12%. What happens to fair value?","o":[["It falls, because higher margins increase taxes.","Taxes rise, but after-tax cash flows still rise."],["It rises by exactly 4%, the change in margin.","A 4 percentage point margin change is a one-third increase in EBIT, with a much larger value effect."],["It is unchanged, because margins do not enter the DCF.","Margins drive EBIT, NOPLAT and FCF."],["It rises by far more than 4%, because higher margins lift every future cash flow.","The textbook reports a 35% higher fair value."]],"c":[3],"es":"12% → 16% EBIT margin raises fair value by about 35%.","ed":"A DCF lets the analyst be explicit about where they disagree with the market. Here only the margin assumption changes, yet fair value rises about 35%. This is the logic of the value driver adjustment (VDA) approach: if a material ESG competency gives a real competitive advantage, it should show up in value driver assumptions (growth, margins, capital), with potentially large valuation effects.","kt":"","src":"Bok s. 218 (8.1.2)"},{"id":"SB323","l":"L9","t":"Value drivers","f":"m","d":2,"p":"H","sc":"none","s":"According to the textbook, where does the link between sustainability and value drivers typically come in?","o":[["Sustainability only affects the terminal growth rate, never explicit-period forecasts.","It can affect all value drivers in all periods."],["Sustainability matters only for companies in the energy sector.","Material issues exist in every industry, though they differ."],["Material ESG intangibles often drive growth, margins and capital.","E.g. a miner with better stakeholder management has fewer delays and lower costs."],["ESG ratings should simply be added to the share price as a premium.","Integration works through value drivers, not a bolt-on premium."]],"c":[2],"es":"Material ESG intangibles (human, intellectual, social capital) underlie the value drivers.","ed":"Koller et al. split value into sales (volume, price), margins (by cost type) and capital (cost of capital and uses: capex, working capital). Behind these are sources of competitive advantage, often intangibles on material ESG issues. Example: a miner good at managing local stakeholders and safety has lower costs; a miner with low costs from ignoring safety and paying poorly has a temporary advantage with a high risk of disruption, which should be reflected in its cost of capital. Slide 6 lists sales growth, margins, capex and cost of capital.","kt":"","src":"L9 slide 6 · Bok s. 218 (8.1.2)"},{"id":"SB324","l":"L9","t":"Why sustainability matters","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook argues that business models are the \"missing link\" between ESG and finance, and that because this link is poorly recognised, material ESG issues tend not to be properly priced - creating opportunities for superior performance.","o":[["True","Correct. Section 8.2 makes both points (Figures 8.2 and 8.3)."],["False","Incorrect. Section 8.2 makes both points (Figures 8.2 and 8.3)."]],"c":[0],"es":"True: business models link ESG to value drivers; poor recognition leaves material issues mispriced.","ed":"Figure 8.3 runs from company purpose, products and stakeholders, through material sustainability issues, to competitive positions and business models, to value drivers. Financial analysts and ESG analysts both study business models only casually, so they miss the link. Shareholder value is typically the outcome of satisfying customers and other stakeholders. Since material issues are not well priced, ESG analysis is a natural extension of fundamental analysis and a source of alpha (consistent with the AMH).","kt":"","src":"Bok s. 219 (8.2) · Bok s. 219 (Figure 8.3) · Bok s. 220 (8.2)"},{"id":"SB325","l":"L9","t":"ESG integration in valuation","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"In the CESGA example on Lecture 9 (slides 9-10), ESG adjustments (litigation, tax, market share, battery capex) give an enterprise value of 882,379. The firm has cash of 40,000 and debt of 600,000 (all in thousands), and 20 million shares outstanding. What is the intrinsic equity value, and what does it imply versus the unadjusted share value of 20?","o":[["882,379; equity value equals enterprise value","Equity value requires adjusting for cash and debt, and ESG lowered the price."],["242,379; about 12 per share","Cash must be added, not subtracted."],["322,379; about 16 per share","882,379 + 40,000 − 600,000 = 322,379, giving 16 per share."],["1,522,379; about 76 per share, far above 20","Debt must be subtracted and cash added, not the reverse."]],"c":[2],"es":"Equity = EV + cash − debt = 882,379 + 40,000 − 600,000 = 322,379 → 16 per share vs 20 without ESG.","ed":"The CESGA example adjusts cash flows for (S) lower revenues in years 1-3 from litigation and reputational damage over poor employee treatment, (G) additional taxes due to tax avoidance, (E) higher market share in years 4-5 from better products, and (E) extra capex for better batteries. The terminal value uses CF(1+g)/(r − g). Net effect: a significantly lower share price (16 vs 20), showing how material E, S and G issues move value through specific cash flow lines.","kt":"","src":"L9 slide 9-10"},{"id":"SB326","l":"L9","t":"ESG integration in valuation","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In the CESGA DCF example (Lecture 9), which adjustment is correctly matched with their ESG pillar?","o":[["Higher market share in years 4-5 due to better products - Social","Labelled E: driven by environmentally better products."],["A higher terminal growth rate because of good governance - Social","No such adjustment is in the example."],["Lower debt because of the litigation case - Environmental","No such adjustment is made."],["Additional taxes due to tax avoidance - Governance","Labelled G on slide 9."]],"c":[3],"es":"S: litigation/reputation → revenues; G: tax avoidance → taxes; E: better products → market share; E: battery capex.","ed":"ESG integration is concrete when each material issue is mapped to a specific line in the cash flow model: revenues (S litigation, E market share), taxes (G tax avoidance) and capex (E batteries). The textbook's VDA approach does the same at the level of value drivers. Governance issues are often reflected in the cost of capital, and innovation issues in growth and margins. Also correct: Lower operating revenues in years 1-3 due to litigation over bad employee treatment - Social.","kt":"","src":"L9 slide 9-10 · Bok s. 231 (8.3.1.1)"},{"id":"SB327","l":"L9","t":"Materiality analysis","f":"m","d":2,"p":"H","sc":"none","s":"The materiality table in the textbook appendix (Lecture 9, slide 7) asks three things about each of a company's most material ESG factors. Which set is correct?","o":[["Its ESG rating, its weight in the index, and its share price reaction","Ratings and index weights are not the columns."],["Its carbon footprint, water use and waste only","Material issues are not limited to environmental footprints."],["Performance, competitive edge, and value driver impact","These are the three columns."],["The number of news articles, NGO campaigns and lawsuits about it","Controversy counts are not the framework."]],"c":[2],"es":"For each material factor: (i) performance, (ii) competitive edge or disadvantage, (iii) impact on value drivers.","ed":"The appendix workflow (8.1A-8.10A) moves from business model and competitive position, through value drivers, management quality, sustainability (materiality table), strategy, forecasts of growth, margins, capex and cost of capital, to valuation (fair value vs price, sensitivities, implied value drivers) and an investment conclusion. The materiality table is the bridge from ESG to the forecast.","kt":"","src":"L9 slide 7-8 · Bok s. 249 (Appendix)"},{"id":"SB328","l":"L9","t":"Value driver adjustment","f":"m","d":2,"p":"H","sc":"none","s":"Which is a step of the value driver adjustment (VDA) approach to ESG integration (Schramade; Vanderlugt)?","o":[["Hold the stock for exactly 12 months to measure alpha","Not a VDA step."],["Replace the DCF with a P/E multiple based on ESG peers","VDA works inside fundamental valuation, typically a DCF."],["Identify and focus on the most material issues","This is step 1 of the VDA approach."],["Delegate voting to a proxy advisor","Step 4 is an active dialogue by the analyst or portfolio manager."]],"c":[2],"es":"VDA: 1 identify material issues; 2 analyse the company's performance vs peers; 3 adjust value drivers; 4 active dialogue.","ed":"Step 1 uses an industry materiality analysis (likelihood vs size of impact), adjusted for company specifics (safety matters more in manual gold mining than mechanised iron ore). Step 2 assesses performance absolutely and relative to peers to find competitive (dis)advantages. Step 3 makes deliberate, often significant adjustments (raising margins from 20% to 23% can move the target price ~15%, from HOLD to BUY). Step 4 uses the insights to ask meaningful questions, improving disclosure and the investor's understanding. Few analysts take step 3. Also correct: Quantify competitive advantages to adjust value driver assumptions.","kt":"","src":"Bok s. 229 (8.3.1.1) · Bok s. 230 (8.3.1.1)"},{"id":"SB329","l":"L9","t":"Value driver adjustment","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"In the KUKA case (Box 8.1), an analyst makes modest adjustments for ESG strengths: a bit higher growth and margins and a slightly lower cost of capital. Why does the target price rise substantially?","o":[["Small changes compound over all future cash flows and the discount rate.","Growth, margins and the cost of capital all lift value at once."],["Because ESG strengths are added as a fixed bonus to the share price.","VDA works through value drivers, not a fixed bonus."],["It does not rise; ESG adjustments cancel out.","All three adjustments push value up."],["Because a lower cost of capital lowers value.","A lower cost of capital raises value."]],"c":[0],"es":"Several small driver changes compound into a large valuation effect.","ed":"This is why the VDA approach can turn a HOLD into a BUY, and why analysts must justify adjustments with evidence on material issues. Innovation adjusts growth and margins; capital management or governance adjusts the cost of capital.","kt":"Value driver adjustment (VDA): changing growth, margin or cost-of-capital assumptions to reflect ESG-based competitive (dis)advantages.","src":"Bok s. 231 (Box 8.1)"},{"id":"SB330","l":"L9","t":"Value driver adjustment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: According to the textbook, value driver adjustments on corporate governance are mostly made to sales growth and margins, while adjustments on innovation mostly concern the cost of capital.","o":[["True","Incorrect. It is the reverse: innovation VDAs tend to adjust sales growth and margins, governance VDAs mostly adjust the cost of capital."],["False","Correct. It is the reverse: innovation VDAs tend to adjust sales growth and margins, governance VDAs mostly adjust the cost of capital."]],"c":[1],"es":"False: innovation → growth and margins; governance → cost of capital.","ed":"VDAs can be made on any ESG issue, but innovation, corporate governance, environmental management and supply chain management are most frequent. Innovation shows up in growth and margins (Novozymes, KUKA); governance affects the risk investors face and thus the discount rate (KUKA's capital management −100 bps). The target price is only an intermediate step towards an investment decision.","kt":"","src":"Bok s. 231 (8.3.1.1)"},{"id":"SB331","l":"L9","t":"Cost of capital channel","f":"m","d":3,"p":"H","sc":"none","s":"Lecture 9 (slide 12) lists evidence on the cost of capital channel. Which finding is correctly attributed?","o":[["El Ghoul et al. (2011): firms with better CSR scores have a lower implied cost of equity.","First bullet on slide 12."],["El Ghoul et al. (2011): tobacco and nuclear firms have a lower cost of equity.","Operating in these sin industries increases the cost of equity."],["Dhaliwal et al. (2011): initiating CSR disclosure raises the cost of capital for strong CSR performers.","They find a reduction in the cost of capital for strong performers that initiate disclosure."],["Cheng et al. (2014): only governance, not social or environmental performance, reduces capital constraints.","Both social and environmental dimensions drive the relationship."]],"c":[0],"es":"Better ESG → lower implied cost of equity, cheaper financing, better access to finance, more debt capacity.","ed":"El Ghoul et al. find lower implied cost of equity for better CSR scores (employee relations, environment, product strategy) and higher cost for tobacco and nuclear. Dhaliwal et al. find strong CSR performers that start CSR disclosure enjoy a lower cost of capital. Cheng et al. find better stakeholder engagement and transparency reduce capital constraints. Sharfman and Fernando find better environmental risk management lowers the cost of capital and shifts financing from equity to debt. Slide 13 adds lower bond spreads for higher MSCI ESG scores. Also correct: Cheng, Ioannou and Serafeim (2014): superior CSR performance gives better access to finance.","kt":"","src":"L9 slide 12 · Bok s. 220 (8.2.1.1) · Bok s. 221 (8.2.1.1)"},{"id":"SB332","l":"L9","t":"Cost of capital channel","f":"t","d":4,"p":"M","sc":"short","s":"True or false: The chart showing lower bond spreads for companies with higher MSCI ESG scores does not by itself prove that improving ESG lowers a firm's cost of capital, because high-ESG firms also tend to be larger and financially stronger.","o":[["True","Correct. Correlation is not causation: size, profitability and governance quality can drive both ESG scores and spreads."],["False","Incorrect. Correlation is not causation: size, profitability and governance quality can drive both ESG scores and spreads."]],"c":[0],"es":"True: confounders like size and quality may explain the link.","ed":"Studies such as El Ghoul et al. control for firm characteristics and still find a link, but analysts should be careful with simple charts. Also note: a lower cost of capital means lower expected returns for investors (hence the question mark next to \"ESG stocks outperform\").","kt":"Confounding variable: a factor (e.g. firm size) that drives both the supposed cause and the effect, creating a misleading correlation.","src":"L9 slide 13 · L9 slide 12"},{"id":"SB333","l":"L9","t":"Green vs brown returns","f":"m","d":3,"p":"H","sc":"none","s":"According to Lecture 9 (Pástor, Stambaugh and Taylor), why should green assets have LOWER expected returns than brown assets?","o":[["Green firms are smaller and therefore always riskier than brown firms.","Higher risk would imply higher, not lower, expected returns."],["Regulators cap the returns that green firms are allowed to earn.","No such regulation exists."],["Green firms pay higher dividends, so their capital gains must be lower.","The argument is about tastes and hedging, not payout policy."],["Green tastes raise prices, and green assets hedge climate risk.","Slide 15: a taste premium and a risk (hedging) premium both lower expected returns."]],"c":[3],"es":"Taste premium (higher demand → higher prices) + hedging value against climate risk → lower expected returns for green.","ed":"\"taste premium\": investors derive utility from holding green assets, so demand bids up prices and lowers expected returns. \"Risk premium\": green assets are better hedges against climate risk, so investors accept lower returns. Brown assets must offer higher expected returns to be held. But realised returns can differ: when green demand shifts unexpectedly (investors or consumers, e.g. via regulation), green assets can outperform - until a correction.","kt":"","src":"L9 slide 14-16"},{"id":"SB334","l":"L9","t":"Green vs brown returns","f":"m","d":4,"p":"H","sc":"none","s":"Pástor, Stambaugh and Taylor find that a green-minus-brown (GMB) portfolio earned a cumulative 174% in recent years. How do they interpret this?","o":[["It proves that green stocks have permanently higher expected returns than brown stocks.","They estimate lower expected returns for green assets, consistent with theory."],["It shows that brown stocks are riskier and thus earned more.","Brown stocks underperformed in the period."],["It is explained entirely by green firms' higher dividend payments.","The driver is climate concern shocks."],["It reflects unexpected rises in climate concern, not high expected returns.","Their counterfactual purges climate concern shocks; GMB becomes essentially flat."]],"c":[3],"es":"High realised green returns came from unexpected shifts in climate concerns, not high expected returns.","ed":"GMB had a monthly Sharpe ratio of 0.33, above the market's 0.3 in the period. Using a measure of climate concerns, they compute counterfactual returns without unexpected concern shocks: GMB becomes essentially flat. Similarly, German green bonds outperformed their non-green twins as the greenium widened. Lesson: do not extrapolate past green outperformance; theory and their ex-post estimates point to lower expected returns for green assets.","kt":"","src":"L9 slide 14 · L9 slide 17-18"},{"id":"SB335","l":"L9","t":"Green vs brown returns","f":"m","d":4,"p":"H","sc":"short","s":"When the US Inflation Reduction Act (2022) unexpectedly offered large subsidies for clean energy, many US clean-energy stocks jumped. According to Pástor, Stambaugh and Taylor, how should an investor interpret this jump?","o":[["As a one-off repricing from a demand shock, not higher future expected returns","Unexpected green shifts raise realised returns now; expected returns stay lower afterwards."],["As a reason to expect the same jump every year","Unexpected shocks cannot be expected to repeat."],["As evidence that subsidies have no effect on prices","Prices reacted strongly."],["As proof green stocks always earn higher expected returns","Theory implies lower expected returns for green assets."]],"c":[0],"es":"Policy surprise → one-time repricing; future expected returns are not higher.","ed":"The consumer/regulatory channel (higher green profits) and investor-demand channel both create unexpected green outperformance. Once priced, green stocks offer lower expected returns, consistent with the taste and hedging premia.","kt":"Realised vs expected return: realised returns include surprises; expected returns are what investors anticipate given risk and tastes.","src":"L9 slide 15-16 · L9 slide 18"},{"id":"SB336","l":"L9","t":"Asset pricing models","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A utility evaluates a solar park. A manager argues: \"Because the project is green, we should use a much lower discount rate than for our other projects.\" What is the most defensible response from Lecture 9?","o":[["Ignore the discount rate and choose the project with the highest revenue.","NPV requires discounting cash flows at an appropriate rate."],["Use the highest rate in the company to be conservative.","The rate should match the project's risk, not be arbitrary."],["Agree: green projects always deserve a zero discount rate.","Green projects still carry risk and an opportunity cost of capital."],["Use a rate reflecting the project's systematic risk; put green effects in cash flows.","The discount rate reflects risk; cash flow effects belong in the forecast."]],"c":[3],"es":"Discount at a risk-based rate; model green benefits explicitly in cash flows.","ed":"A lower rate is justified only if risk (e.g. regulated, contracted revenues) is lower or investors accept lower returns (greenium). Arbitrary \"green discounts\" hide assumptions; scenario analysis is more transparent.","kt":"Cost of capital: the return investors require for a project's risk; in CAPM/APT it depends on exposure to systematic risk factors.","src":"L9 slide 19 · L9 slide 21"},{"id":"SB337","l":"L9","t":"Asset pricing models","f":"m","d":3,"p":"H","sc":"none","s":"In the arbitrage pricing theory on Lecture 9, slide 21, E(Ri) = Rf + Σ βi,λ (RM,λ − Rf). What is βi,λ?","o":[["The weight of the asset in the market portfolio, based on market capitalisation.","That is a portfolio weight, not a factor loading."],["The asset's sensitivity to systematic factor λ.","The slide calls it the \"sensitivity\" to a risk factor."],["The asset's idiosyncratic risk, which is fully priced.","Idiosyncratic risk is diversifiable and not priced."],["The risk-free rate adjusted for inflation.","Rf is separate in the formula."]],"c":[1],"es":"β = factor loading (sensitivity); (RM,λ − Rf) = premium on an undiversifiable factor.","ed":"The APT generalises the CAPM to several systematic, undiversifiable risk factors (e.g. size, value, momentum). Each factor earns a premium; an asset's expected return depends on its exposure to each. Harvey, Liu and Zhu (2016) document a \"factor zoo\" of hundreds of proposed factors, so a new ESG factor needs strong justification. The question is whether ESG is such a priced, systematic factor.","kt":"","src":"L9 slide 21 · L9 slide 23"},{"id":"SB338","l":"L9","t":"Is ESG a risk factor","f":"m","d":4,"p":"H","sc":"none","s":"Research Affiliates (Lecture 9) set three criteria for a factor and test long-short ESG strategies (2009-2020). What do they conclude?","o":[["ESG is a robust factor in all regions with a significant premium of about 5% per year.","The tested alphas are small and insignificant."],["There is no robust evidence of an ESG return premium in their tests or the literature.","None of the long-short ESG alphas are statistically significant; studies find ESG both adds to and detracts from returns."],["Governance has a large significant positive premium in both the US and Europe.","Governance strategies show negative raw returns and insignificant alphas."],["ESG meets all three criteria because it has been studied for over a century.","There is little agreement on robustness across definitions and geographies."]],"c":[1],"es":"Factor criteria: deep literature, robust across definitions, robust across geographies. ESG fails the robustness tests.","ed":"A factor should be grounded in a long, deep literature and be robust across definitions and geographies. Long-short ESG, E, S and G strategies in the US and Europe show small, insignificant CAPM alphas. Some studies find ESG adds to returns (Clark, Feiner and Viehs; Friede, Busch and Bassen; Khan, Serafeim and Yoon), others that it detracts (Brammer et al.; Fabozzi et al.; Hong and Kacperczyk). There is also no convincing risk-based or behavioural explanation. Measurement (rating disagreement) is a major challenge.","kt":"","src":"L9 slide 22 · L9 slide 24 · L9 slide 26"},{"id":"SB339","l":"L9","t":"Is ESG a risk factor","f":"t","d":4,"p":"H","sc":"none","s":"True or false: Bolton and Kacperczyk (2021) find that stocks of firms with higher total carbon emissions earn LOWER returns, consistent with investors not caring about carbon risk.","o":[["True","Incorrect. They find higher-emission firms earn HIGHER returns (a carbon premium), consistent with investors demanding compensation for carbon risk exposure."],["False","Correct. They find higher-emission firms earn HIGHER returns (a carbon premium), consistent with investors demanding compensation for carbon risk exposure."]],"c":[1],"es":"False: higher emissions → higher returns (carbon premium), i.e. investors demand compensation.","ed":"Controlling for size, book-to-market and other predictors, firms with higher total CO2 emissions (and higher growth in emissions) earn higher returns; the premium is not explained by unexpected profitability or known risk factors. Institutional investors also screen on emission intensity in a few salient industries. This fits the risk-premium logic of Pástor et al. (brown assets need higher expected returns), but the debate continues - e.g. whether the premium reflects risk or the size of firms.","kt":"","src":"L9 slide 27 · L9 slide 15"},{"id":"SB340","l":"L9","t":"Is ESG a risk factor","f":"m","d":4,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: Two analysts agree that high-ESG stocks have earned lower returns than low-ESG stocks. Analyst A says high-ESG stocks are less risky; analyst B says they are overpriced. What is the key difference between the two explanations?","o":[["A implies a fair lower expected return; B implies mispricing that may correct.","Risk explanations mean lower required returns in equilibrium; mispricing means α < 0 that arbitrage could remove."],["A implies high-ESG stocks should be shorted for profit.","If lower returns compensate for lower risk, there is no free profit."],["There is no difference; both imply the same future.","Risk-based returns persist; mispricing should disappear."],["B implies high-ESG stocks have higher beta.","Overpricing concerns alpha, not beta."]],"c":[0],"es":"Risk → persistent lower expected return; mispricing → temporary alpha.","ed":"Practitioners most often believe high-ESG firms have lower beta (a risk view). Academically the question is unresolved: Bolton and Kacperczyk find a carbon premium, Pástor et al. stress taste and hedging premia, and Research Affiliates find no robust ESG factor.","kt":"Risk explanation: lower expected return compensates for lower (systematic) risk. Mispricing: price deviates from fair value (α ≠ 0) and should eventually correct.","src":"L9 slide 24-25 · L9 slide 20 · L9 slide 27"},{"id":"SB341","l":"L9","t":"Evidence: sustainability and value","f":"m","d":3,"p":"M","sc":"short","s":"Lins, Servaes and Tamayo (2017) find that firms with high social capital (high CSR ratings) outperformed during the 2008-09 crisis. What mechanism do they propose?","o":[["CSR firms were all in defensive sectors like utilities.","The effect is not just a sector effect."],["High-CSR firms had no debt at all.","The explanation is trust, not zero leverage."],["Governments bailed out only high-CSR firms.","No such targeted bailout explains the result."],["Trust built with stakeholders pays off when trust in markets collapses.","Stakeholders and investors stick with trusted firms in a crisis."]],"c":[3],"es":"Social capital works like insurance when trust collapses.","ed":"This is the \"resilience\" argument for ESG: investments in stakeholder trust look costly in good times but protect value in bad times. Relevant for bank stress, pandemics or scandals in a peer's industry.","kt":"Social capital: trust and goodwill built with employees, customers, suppliers and investors through responsible behaviour.","src":"Bok s. 221 (8.2.1.1)"},{"id":"SB342","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"M","sc":"none","s":"The European Centre for Corporate Engagement (2016) finds that in developed markets, firms with IMPROVING sustainability ratings outperform, while firms with already HIGH ratings do not. Why, according to the textbook?","o":[["High ratings are stable and no longer news; improvements are.","Static high levels are already priced; changes are news."],["Rating agencies deliberately inflate ratings of poor performers.","Not the textbook's explanation."],["High-rated firms are always overpriced bubbles that crash.","The finding is no outperformance, not crashes."],["Improving firms are always smaller, so they earn a size premium.","The explanation offered is about information, not size."]],"c":[0],"es":"Levels are priced; changes (ESG momentum) carry news.","ed":"Ratings are rather static, so their levels are unlikely to affect returns; changes are more promising. In emerging markets, both improving and high-rated firms outperform, attributed to lower market efficiency and more recent interest in sustainability - consistent with the AMH. Khan, Serafeim and Yoon's results are also based on changes in material ESG performance. Quant ESG strategies often exploit this ESG momentum.","kt":"","src":"Bok s. 222 (8.2.1.2) · Bok s. 232 (8.3.1.2)"},{"id":"SB343","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"H","sc":"none","s":"The textbook explains why evidence linking ESG directly to INVESTOR performance is weak, even though ESG and corporate performance are linked. Which explanation does it give?","o":[["Investors always fully price ESG information immediately.","The textbook argues markets tend to ignore ESG information."],["All SRI funds use the same strategy, so results must be identical.","Strategies differ greatly and matter for results."],["Sin stocks have unique return properties that cannot be replicated.","Blitz and Fabozzi show their risk-return properties can be replicated without sin exposure."],["Older studies mix in ethical funds that give up return by drastically narrowing their universe.","Derwall, Koedijk and Ter Horst find ethical funds underperform while ESG-integrated funds do not."]],"c":[3],"es":"Weak investor link: ethical funds' constrained universes, and a chain of steps (value drivers, stock performance, investor approach) that dilutes direct tests.","ed":"Friede, Busch and Bassen's meta-study finds a well-established link between ESG and corporate financial performance, but a weaker one with investment performance. Hong and Kacperczyk find SRI funds underperform by avoiding sin stocks, but Blitz and Fabozzi show the sin premium can be replicated. Derwall et al. find ethical (values-driven) funds underperform while ESG-integrated (value-driven) funds do not. Studying the chain step by step (Figure 8.4) reveals stronger relations. And if many funds exploit the same information, alpha disappears (AMH). Also correct: Going directly from ESG performance to investor performance skips intermediate steps, an incomplete model.","kt":"","src":"Bok s. 222 (8.2.1.3) · Bok s. 223 (Figure 8.4)"},{"id":"SB344","l":"L9","t":"Evidence: sustainability and value","f":"t","d":3,"p":"M","sc":"none","s":"True or false: According to the textbook, a high carbon footprint always means a high exposure to carbon risk; for example, an aluminium producer will always lose from a higher carbon price.","o":[["True","Incorrect. Schramade's aluminium example shows a high-footprint firm can benefit from higher carbon prices because aluminium provides light-weighting solutions and producers can source clean energy."],["False","Correct. Schramade's aluminium example shows a high-footprint firm can benefit from higher carbon prices because aluminium provides light-weighting solutions and producers can source clean energy."]],"c":[1],"es":"False: footprint ≠ risk; aluminium can have positive carbon exposure.","ed":"Environmental research often focuses on carbon and waste footprints, but footprints are not the same as climate risk. Aluminium production is energy intensive but reduces emissions in aerospace and cars through lighter vehicles, and producers can switch to clean energy. Further evidence: eco-efficient firms earn higher returns (Derwall et al., 2005); GHG disclosure and efficiency earned abnormal returns of up to 13% p.a. in 2005-09 (Liesen et al.), suggesting carbon information was inefficiently priced.","kt":"","src":"Bok s. 223 (8.2.2) · Bok s. 224 (8.2.2)"},{"id":"SB345","l":"L9","t":"Evidence: sustainability and value","f":"m","d":4,"p":"L","sc":"none","s":"Edmans, Li and Zhang (2017) extend the employee satisfaction evidence internationally. What do they find?","o":[["Employee satisfaction predicts negative returns in the US and UK.","The relation is positive in flexible labour markets."],["Employee satisfaction predicts positive abnormal returns equally in all countries.","The effect depends on labour market flexibility."],["Employee satisfaction matters only in Germany.","Germany, with low flexibility, shows no effect."],["It predicts returns in flexible labour markets, not rigid ones.","Where hiring and firing are easy, satisfaction is a costlier, more valuable differentiator."]],"c":[3],"es":"Positive link in flexible labour markets (US, UK), not in rigid ones (Germany).","ed":"Edmans (2011, 2012) finds firms with higher employee satisfaction earn better returns, valuations and earnings surprises. Internationally, the effect holds in flexible labour markets, where satisfaction helps recruit, retain and motivate, but not where legal protections already set high minimum standards. S also correlates with G: employees at founder-run firms report higher satisfaction (Huang et al.). Evidence on S is thinner than on E because data are more problematic.","kt":"","src":"Bok s. 224 (8.2.3) · Bok s. 225 (8.2.3)"},{"id":"SB346","l":"L9","t":"Evidence: sustainability and value","f":"m","d":3,"p":"M","sc":"none","s":"Grewal, Serafeim and Yoon (2016) study ESG shareholder proposals. What do they find?","o":[["Proposals have no effect on corporate ESG performance.","They improve performance on the focal issue."],["They work without majority support; material ones add value.","Proposals on immaterial issues are associated with subsequent declines in value."],["Proposals only work when they obtain majority support.","They are effective even without majority support."],["All proposals, material or not, increase firm value equally.","Immaterial proposals are associated with value declines."]],"c":[1],"es":"Proposals work even without a majority; material → value up, immaterial → value down.","ed":"Firms seem to focus on immaterial issues when there are agency problems, low awareness of materiality, or to divert attention from poor performance on material issues. Related: Dimson, Karakaş and Li find successful engagements are followed by positive abnormal returns; McCahery, Sautner and Starks find long-term investors intervene more. Institutional investors now own about 75% of equity, increasing engagement.","kt":"","src":"Bok s. 225 (8.2.5) · Bok s. 226 (8.2.5)"},{"id":"SB347","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"H","sc":"none","s":"Lecture 9 (slide 29) maps investment approaches to objective functions. Which mapping is correct?","o":[["Exclusion: max FV s.t. SEV_min; integration: max IV; impact: max SEV s.t. FV_min","This is the mapping on slide 29 and in Table 8.1."],["Exclusion: max SEV s.t. FV ≥ min; integration: max FV; impact: max IV","The mapping is scrambled."],["Impact investing: max FV; exclusionary screening: max IV","Impact puts SEV first; exclusion keeps FV as the goal."],["All three approaches maximise FV with no constraints, like traditional optimisation.","Only traditional risk/return optimisation maximises FV alone."]],"c":[0],"es":"Risk/return: max FV. Exclusion (SF 1.0): max FV s.t. SEV_min. Integration (SF 2.0): max IV. Impact (SF 3.0): max SEV s.t. FV_min.","ed":"Summary of Table 8.1: exclusionary screening (SF 1.0) has financial return as first criterion, uses ratings as its foundation, focuses on operations, and drops the worst companies from a very large universe. ESG integration (SF 2.0) maximises integrated value, uses ratings as part of the data, considers operations and products, and drops the worst 20-30%. Impact investing (SF 3.0) puts positive S + E impact first, has no ratings available, considers products first, and invests only in the best 10-30%.","kt":"","src":"L9 slide 29 · Bok s. 212 (Table 8.1)"},{"id":"SB348","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"M","sc":"none","s":"According to Table 8.1, which statement about ESG approaches in equity investing is correct?","o":[["Ratings are the foundation of impact investing.","For impact investing, ratings are \"not available\"; they are the foundation of exclusion."],["Exclusionary screening invests only in the very best S and E performers.","That is impact investing; exclusion keeps a very large universe."],["Impact investing's first criterion is financial return.","Its first criterion is impact (positive S + E)."],["Impact equity investing considers products first, then operations.","Row \"Products versus operations\" in Table 8.1."]],"c":[3],"es":"Exclusion: operations focus, very large universe; integration: operations + products, worst 20-30% out; impact: products first, best 10-30% only.","ed":"The further one moves from SF 1.0 to 3.0, the more the analysis shifts from operations (how a firm produces) to products (what it produces and their impact), and the smaller the investable universe. Ratings, which mostly measure operations, are central to exclusion but not available for measuring product impact. Also correct: ESG integration drops the worst S and E performers but keeps most of the universe.","kt":"","src":"Bok s. 212 (Table 8.1)"},{"id":"SB349","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"H","sc":"none","s":"According to Table 8.3 (Lecture 9, slide 35), how suitable is ESG integration for fundamental, quant and passive equity investing?","o":[["High for all three, since ESG scores are widely available.","Only fundamental investing can integrate ESG into valuation."],["Low for fundamental, high for quant and passive.","The ranking is reversed."],["High for fundamental, very low for quant, none for passive.","ESG integration needs fundamental analysis."],["Medium-high for all three, because ESG integration can be done on scores.","That describes exclusionary screening, not integration."]],"c":[2],"es":"Fundamental: high for all six methods. Passive: only exclusion is really credible. Integration: high / very low / not at all.","ed":"Summary of Table 8.3: exclusionary screening - high, medium-high, medium-high (can be done on scores); best-in-class - high, medium, medium-low; thematic - high, medium, low; active ownership - high, low, low (fundamental analysis needed, can be bought externally with loss of quality); impact - high, very low, very low; ESG integration - high, very low, not at all. Fundamental investing allows analysis of business models and transition preparedness; quant is backward looking and cannot handle regime change; passive relies on indices built on ratings.","kt":"","src":"L9 slide 34-35 · Bok s. 228 (Table 8.3) · Bok s. 228 (8.3.1)"},{"id":"SB350","l":"L9","t":"ESG in portfolio management","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook argues that a major problem of quant equity investing for ESG is that it is backward looking, based on historical patterns, so it cannot deal well with regime changes such as rising carbon prices or the demise of the fossil fuel industry.","o":[["True","Correct. Section 8.3.1.2 makes this argument, while noting quant can be complementary (quantamental)."],["False","Incorrect. Section 8.3.1.2 makes this argument, while noting quant can be complementary (quantamental)."]],"c":[0],"es":"True: quant relies on history and struggles with regime change.","ed":"Quant strategies select stocks by factor exposures (growth, value, size, momentum) using rules based on historically profitable patterns. ESG scores can be used as a quasi-factor (best-in-class) or for exclusion; smart beta ESG combines passive costs with factor tilts. Melas et al. find ESG scores correlate with size, quality and low volatility. But quant cannot anticipate situations that have not happened yet. \"Quantamental\" hybrids, like chess player plus computer, may be strongest.","kt":"","src":"Bok s. 232 (8.3.1.2) · Bok s. 233 (8.3.1.2)"},{"id":"SB351","l":"L9","t":"ESG in portfolio management","f":"m","d":4,"p":"H","sc":"none","s":"Andersson, Bolton and Samama (2016) construct a low-carbon index with about 50% lower carbon footprint than its benchmark while minimising tracking error. Why do they call it a \"free option on carbon\"?","o":[["The index excludes all companies, so it carries no risk at all.","It selects low-carbon firms within each sector and stays close to the benchmark."],["It tracks the benchmark until carbon is priced, then should outperform it.","While mitigation is pending it earns the benchmark return; once carbon is priced it should outperform."],["It guarantees outperformance from the first day.","Outperformance is expected only once carbon is (expected to be) priced."],["Investors receive a call option on carbon credits free of charge from the index provider.","It is a metaphor, not a derivative contract."]],"c":[1],"es":"Low tracking error now (no cost), upside when carbon gets priced = free option.","ed":"By selecting low-carbon firms within each sector (best-in-class) and minimising tracking error, passive investors can halve the carbon footprint at no extra cost. This also suggests climate risk was not yet priced (consistent with the AMH). Passive ESG is a crude but useful improvement over mainstream passive (SF 1.0): it can exclude the worst industries and tilt to green revenues, but selectiveness and engagement remain limited, and voting usually follows proxy advisors.","kt":"","src":"Bok s. 233 (Box 8.2) · Bok s. 233 (8.3.1.3) · Bok s. 234 (8.3.1.3)"},{"id":"SB352","l":"L9","t":"ESG in portfolio management","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A fund only applies negative screening and calls itself \"fully ESG integrated\". Based on Lecture 9 and the textbook, what is the best critique?","o":[["Exclusion shrinks the universe but does not put material ESG into valuation.","Integration means ESG enters forecasts, value drivers or discount rates."],["Exclusion always produces the highest returns.","Professionals see integration and positive screening as more useful for returns."],["Negative screening is the most advanced form of ESG integration.","Exclusion is SF 1.0; integration is SF 2.0."],["Screening and integration are the same thing.","Eurosif defines integration as explicit inclusion of ESG in financial analysis."]],"c":[0],"es":"Screening ≠ integration; integration needs ESG in the valuation.","ed":"The textbook notes negative screening is the most used but least valued method among professionals, who see more merit in full integration and positive screening. Many funds label universe reduction as \"integration\", which is misleading.","kt":"ESG integration: explicit consideration of material ESG factors alongside financial factors in valuing and selecting securities.","src":"L9 slide 31 · L9 slide 37 · Bok s. 228 (8.3.1.1)"},{"id":"SB353","l":"L9","t":"Engagement and divestment","f":"m","d":3,"p":"M","sc":"none","s":"G
