ses taste/risk premia with cash flows."],["Assume past green returns will repeat","Pástor et al. show these returns came from unexpected concern shocks."],["Adjust value drivers","Fundamental integration via value drivers; mispricing yields alpha only when information gets priced (AMH)."],["Exclude the utility","Exclusion ignores the firm-specific competitive advantage identified."]],"c":[2],"es":"Put the view in the value drivers and scenarios; profit comes from repricing, while green expected returns are lower in equilibrium.","ed":"Lecture 9 separates cash flows from discount rates. A firm-specific competitive edge on a material ESG issue belongs in value driver assumptions (VDA) and carbon price scenarios. If the market currently ignores it, the stock is underpriced (α > 0) and should outperform as information is priced (AMH, Pástor et al.'s unexpected shifts). In equilibrium, though, green assets carry lower expected returns (taste and hedge premia), so once the view is priced, future expected returns fall. Past green outperformance should not be extrapolated.","kt":"","src":"L9 slide 3-10 · L9 slide 14-18 · L9 slide 20 · Bok s. 230 (8.3.1.1)"},{"id":"SB361","l":"L9","t":"ESG integration synthesis","f":"m","d":3,"p":"L","sc":"none","s":"The NorSIF guide to ESG valuation adds something beyond cash flows and the cost of capital. What?","o":[["Past \"sins\"","Listed among the guide's chapters, together with scenarios, optionality and modified objective functions."],["A ban on scenarios","Scenarios are one of the guide's chapters."],["A buy list","It is a methodological guide, not a stock list."],["Using only P/E multiples","The guide focuses on fundamental (DCF-type) valuation."]],"c":[0],"es":"NorSIF guide: cash flow channel, cost of capital channel, systematic risk adjustments, scenarios, optionality, past-externality liabilities, modified objective functions (purpose).","ed":"Beyond adjusting cash flows and discount rates, the guide covers systematic risk adjustments, scenarios (e.g. carbon price paths), optionality (e.g. the free option on carbon), liabilities for past externalities (clean-up, litigation for past harm - the \"sins\") and modified objective functions reflecting company purpose. These map onto the textbook's broader integrated value perspective.","kt":"","src":"L9 slide 11"},{"id":"SB362","l":"L9","t":"Equity basics","f":"m","d":2,"p":"M","sc":"none","s":"Why does sustainability matter more to equity investors than to most other investors?","o":[["They are liable for company debts","Limited liability means shareholders can lose at most their investment."],["Equity has a fixed return","That describes debt more than equity."],["They are residual claimants","Equity holders are paid after debt holders and are most exposed to business model success or failure."],["Only they read sustainability reports","Not the argument."]],"c":[2],"es":"Equity = residual claim (an option on the firm): most exposed to material ESG issues that can make or break business models.","ed":"Equity holders receive income only after debt holders; in effect equity is an option on the company (Black and Scholes). Material sustainability issues can make or break business models, so equity holders have strong incentives to help firms achieve LTVC. Bondholders face asymmetric (mainly downside) exposure, which is why Lecture 10 focuses on downside ESG risks in bonds.","kt":"","src":"Bok s. 211 (Overview) · Bok s. 215 (8.1.2)"},{"id":"TR39","l":"L9","t":"ESG integration in valuation","f":"t","d":3,"p":"H","sc":"none","s":"True or false: The lecturer recommends putting ESG mainly into the cash flows, not the WACC, because the evidence on ESG and the cost of capital is unclear.","o":[["True","Correct. She says ESG clearly affects cash flows, while academics and practitioners have not agreed on whether it lowers the cost of capital."],["False","Incorrect. She says ESG clearly affects cash flows, while academics and practitioners have not agreed on whether it lowers the cost of capital."]],"c":[0],"es":"True: adjust cash flows; leave WACC alone.","ed":"Cash flow effects: revenue (green demand, boycotts), margins, capex, taxes and stranded assets. On the cost of capital side, some studies find lower costs for better CSR firms, but the evidence conflicts. Adjusting both risks double counting.","kt":"","src":"Opptak L9 ca. 16 min · Opptak L9 ca. 36 min · Opptak L9 ca. 69 min"},{"id":"TR40","l":"L9","t":"Stranded assets","f":"m","d":2,"p":"M","sc":"constructed_scenario","s":"A German coal plant built for 40 years must close after 20 because of a new law. What kind of stranded asset is this?","o":[["Not stranded at all","Stranded means it has lost its economic value even if it still exists."],["Physical-risk stranded","Physical risk would be e.g. a plant destroyed by flooding."],["A gain for the firm","Losing 20 years of expected cash flows is a value loss."],["Transition-risk stranded","Policy change cut the plant's useful life."]],"c":[3],"es":"Policy-driven early closure = transition-risk stranding.","ed":"Stranded assets lower forecast free cash flows. Physical example from the lecture: a plant in a flood-prone area that is flooded and unusable. Both types should be reflected in DCF assumptions and scenario analysis.","kt":"","src":"Opptak L9 ca. 10 min"},{"id":"TR41","l":"L9","t":"Relative valuation","f":"m","d":3,"p":"M","sc":"extended_course_case","s":"An analyst values Oatly using the P/E of Alpro, which sells soy, almond and oat drinks. Why does the course question this?","o":[["Alpro does not sell dairy alternatives","It is, which is why it seems a natural peer."],["Peers are never used","Relative valuation is based on peers by definition."],["P/E cannot be used for food firms","Multiples are widely used; the issue is peer choice."],["Different sustainability risks","Peers must share material exposures for multiples to be comparable."]],"c":[3],"es":"Peers need similar material sustainability exposures.","ed":"Oatly's water claims scandal, for example, may not apply to soy milk. Relative valuation assumes similar risk and growth; sustainability issues add another dimension to check when choosing peers.","kt":"","src":"Opptak L9 ca. 14 min"},{"id":"TR42","l":"L9","t":"ESG as a risk factor","f":"m","d":4,"p":"H","sc":"none","s":"Why does the lecturer doubt that child labour risk can be a priced risk factor, while she is less sure about climate change?","o":[["Factors only exist for bonds, not equities","Factor models (e.g. Fama-French) are mainly equity models."],["Child labour is a governance issue, and only E issues are priced","The argument is about diversifiability, not the E/S/G label."],["Child labour risk is diversifiable; climate risk may not be","Only non-diversifiable risks earn a risk premium."],["Climate change has no effect on asset prices","She suggests climate might be systematic, as all firms are exposed."]],"c":[2],"es":"Diversifiable = not a factor; climate may be systematic.","ed":"A proper factor should be grounded in literature, robust across definitions and robust across geographies. ESG scores fail the second test because ratings diverge. Research now studies specific measures, e.g. Bolton and Kacperczyk's carbon premium, though whether it is risk or mispricing is debated.","kt":"","src":"Opptak L9 ca. 59 min · Opptak L9 ca. 68 min"},{"id":"TR43","l":"L9","t":"Exclusion vs engagement","f":"m","d":3,"p":"M","sc":"none","s":"Oil and gas firms are among the biggest filers of green patents. What does this support?","o":[["Oil firms are green firms","Patents do not erase their large current emissions."],["Exclusion may miss innovators","It supports engagement and the \"washing machine\" view over blanket exclusion."],["Oil firms have no transition risk","They still face substantial transition risk."],["Exclusion is the only consistent strategy","The evidence is used to question that view."]],"c":[1],"es":"Brown firms can be key green innovators, so exclusion has costs.","ed":"The washing machine idea (Gollier and Pouget): hold brown firms and push them to change, rather than leaving them \"dirty\" in someone else's portfolio. The lecturer leaves the debate open; there is no single right answer.","kt":"","src":"Opptak L9 ca. 82 min"},{"id":"CX077","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"A green bond is defined by the fact that:","o":[["It carries no credit risk","Samme kredittrisiko som utstederens andre obligasjoner."],["Its proceeds fund green projects","Use of proceeds øremerket grønne prosjekter."],["Its coupon depends on KPIs","Det er en sustainability-linked bond."],["Only governments may issue it","Selskaper utsteder også green bonds."]],"c":[1],"es":"Green bond = øremerket.","ed":"Foreleser sa at sustainability bonds helt sikkert kommer på eksamen. Fire typer:\n- Green bond: grønne prosjekter.\n- Social bond: sosiale prosjekter.\n- Sustainability bond: blanding av grønt og sosialt.\n- Sustainability-linked bond: fri bruk, kupong knyttet til KPI-er.","kt":"","src":"L10 slide 9-10 · Bok s. 273 (9.4.1)","k":1},{"id":"CX078","l":"L10","t":"Social bonds","f":"m","d":2,"p":"H","sc":"none","s":"The project that fits a social bond best is:","o":[["A share buyback programme","Det er ikke et sosialt prosjekt."],["Building affordable housing","Sosialt formål = social bond."],["Building a wind farm","Det er et grønt prosjekt (green bond)."],["Any corporate purpose, with a KPI-linked coupon","Det er en sustainability-linked bond."]],"c":[1],"es":"Sosiale prosjekter = social bond.","ed":"Social bonds fungerer som green bonds (use of proceeds), men pengene går til boliger, helse, utdanning eller arbeidsplasser.","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min","k":1},{"id":"CX079","l":"L10","t":"Sustainability bonds","f":"m","d":2,"p":"H","sc":"none","s":"A bond that finances a MIX of green and social projects is a:","o":[["Sustainability-linked bond","SLB har ingen øremerking, men KPI-kupong."],["Social bond","Social bond er bare sosialt."],["Green bond","Green bond er bare grønt."],["Sustainability bond","Grønt + sosialt, øremerket."]],"c":[3],"es":"Grønt + sosialt = sustainability bond.","ed":"Sustainability bond = øremerket (use of proceeds). Sustainability-linked bond = KPI-knyttet kupong.","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min","k":1},{"id":"CX080","l":"L10","t":"Sustainability-linked bonds","f":"m","d":2,"p":"H","sc":"none","s":"If the issuer of a sustainability-linked bond misses its target, typically:","o":[["It turns into a green bond","Det skjer ikke."],["The bond must be repaid at once","Det skjer ikke."],["The coupon rises","Typisk step-up: renten øker, f.eks. 0,25 prosentpoeng."],["Nothing at all happens","Da ville det ikke vært noe insentiv."]],"c":[2],"es":"Bommer på målet → høyere kupong.","ed":"Eksempel: Enel (2019), første store SLB. Risiko: lette mål kan gi greenwashing.","kt":"","src":"L10 slide 9 · L10 slide 24 · L11 slide 25","k":1},{"id":"CX081","l":"L10","t":"Sustainability-linked instruments","f":"m","d":2,"p":"H","sc":"none","s":"The key difference between a green bond and a sustainability-linked bond is:","o":[["Short maturity vs long maturity bonds","Løpetid er ikke forskjellen."],["Government issuer vs company issuer","Begge kan utstedes av både stater og selskaper."],["Fixed coupon vs no coupon","Begge betaler kupong."],["Use of proceeds vs KPI-linked terms","Green: hva pengene brukes til. SLB: om selskapet når målene."]],"c":[3],"es":"Green = øremerket. SLB = KPI.","ed":"SLB gir insentiv til å forbedre hele selskapet. Green bond finansierer bestemte prosjekter.","kt":"","src":"L10 slide 9 · L10 slide 24","k":1},{"id":"CX082","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"Compared with a conventional bond from the same issuer, a green bond's credit risk is:","o":[["About the same","Hele selskapet står bak. Pengene er øremerket, ikke ring-fenced."],["Higher","Det er ingen grunn til høyere risiko."],["Lower","Det grønne prosjektet er ikke skilt ut fra resten."],["Zero, the project secures it","Selskapet kan fortsatt gå konkurs."]],"c":[0],"es":"Samme utsteder = samme kredittrisiko.","ed":"Earmarked ≠ ring-fenced. Går selskapet konkurs, taper du på green bonden akkurat som på en vanlig obligasjon.","kt":"","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)","k":1},{"id":"CX083","l":"L10","t":"Green bonds","f":"t","d":2,"p":"H","sc":"none","s":"Is the greenium mainly explained by green bonds being less risky?","o":[["Yes","Feil. Risikoen er den samme. Greenium skyldes at etterspørselen etter grønne obligasjoner er større enn tilbudet."],["No","Riktig. Risikoen er den samme. Greenium skyldes at etterspørselen etter grønne obligasjoner er større enn tilbudet."]],"c":[1],"es":"Nei: greenium = etterspørsel, ikke lavere risiko.","ed":"Greenium er som regel liten, noen få basispunkter.","kt":"","src":"Bok s. 275 (9.4.1) · L9 slide 14","k":1},{"id":"CX084","l":"L10","t":"Bonds vs equity","f":"m","d":2,"p":"H","sc":"none","s":"Bond investors focus mostly on downside ESG risk because:","o":[["ESG never causes defaults","ESG kan øke default risk."],["They vote at general meetings","Obligasjonseiere har normalt ikke stemmerett."],["Bonds have unlimited upside","Det er aksjer som har det."],["Their upside is capped","De får maks renter og hovedstol, men kan tape ved konkurs."]],"c":[3],"es":"Begrenset oppside → fokus på nedside.","ed":"Derfor bryr obligasjonseiere seg mest om nedsiden: ESG-risiko som kan føre til konkurs (default risk).","kt":"","src":"L10 slide 3 · Bok s. 258 (9.1.5) · Bok s. 259 (9.2)","k":1},{"id":"SB363","l":"L10","t":"Bonds vs equity","f":"m","d":2,"p":"H","sc":"none","s":"Looking at debt and equity payoffs, why do bond investors focus mainly on downside ESG risk?","o":[["Their upside is capped","Debt holders receive min(asset value, D); equity holders receive max(asset value − D, 0)."],["They get all the upside","That describes equity holders, whose payoff is like a call option."],["Their payoff never depends on the firm's value","Below D, bondholders' payoff falls with asset value."],["Their votes protect them from losses","Bondholders typically have no voting power except in bankruptcy."]],"c":[0],"es":"Debt payoff = min(V, D): limited upside, full downside → ESG matters as tail/default risk.","ed":"Owning equity is like a call option on the firm (Merton, 1974): unlimited upside, limited downside. Bondholders have limited upside and bear the downside. Hence equity holders may like volatility while bondholders suffer from it, creating agency conflicts (underinvestment/debt overhang, risk shifting). In fixed income ESG analysis the focus is therefore on risks (tail events that can trigger default or downgrades) rather than opportunities, except perhaps in high yield. VW's CDS spread jumped from 75.5 to 299.5 bps after dieselgate.","kt":"","src":"L10 slide 3 · Bok s. 258 (9.1.5) · Bok s. 259 (9.2)"},{"id":"SB364","l":"L10","t":"Bond valuation","f":"m","d":2,"p":"H","sc":"none","s":"Which is a driver of CORPORATE (not sovereign) bond value?","o":[["External debt","Listed under sovereign bonds."],["Loss given default","Listed under corporate bonds."],["GDP per capita","Listed under sovereign bonds."],["Default history of the country","Listed under sovereign bonds."]],"c":[1],"es":"Sovereign: GDP, growth, GDP per capita, inflation, external debt, default history. Corporate: default risk, LGD, liquidity, credit migration.","ed":"Cantor and Packer find sovereign ratings and borrowing costs are explained by per capita income, GDP growth, inflation, external debt, economic development and default history. Corporate bonds carry more default and liquidity risk; spreads reflect default probability, loss given default, liquidity and the risk of rating migration (Fisher; Cohan). ESG enters as an additional driver of these credit risk indicators (Figure 9.2: ESG factors → factors influencing creditworthiness → credit risk indicators). Also true, but not offered as an option here: Credit migration risk.","kt":"","src":"L10 slide 4 · Bok s. 256 (9.1.3.1) · Bok s. 256 (9.1.3.2)"},{"id":"SB365","l":"L10","t":"Bond valuation","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Longer bonds have higher duration and so react more to interest rate changes, which is one reason the yield curve usually slopes upwards.","o":[["True","Correct. Section 9.1.3: more of a long bond's cash flows lie far in the future, so its price is more sensitive to yields; this exposure carries a risk premium."],["False","Incorrect. Section 9.1.3: more of a long bond's cash flows lie far in the future, so its price is more sensitive to yields; this exposure carries a risk premium."]],"c":[0],"es":"True: longer maturity → higher duration → more rate risk → upward-sloping yield curve.","ed":"A bond's price is the present value of its coupons and face value; the yield to maturity is its IRR. Prices and yields move inversely, so bonds trade at a premium, at a discount or at par. Duration measures price sensitivity to rates. Insurers and pension funds hold large bond portfolios to hedge interest rate risk on long-term liabilities (Lecture 12).","kt":"","src":"Bok s. 254 (9.1.3) · Bok s. 256 (9.1.3)"},{"id":"SB366","l":"L10","t":"Bond valuation","f":"m","d":3,"p":"M","sc":"none","s":"Bond X has a higher yield to maturity than bond Z. What can you say about expected returns?","o":[["Bond Z must be close to default","Lower yield does not imply default."],["Both earn the risk-free rate","Risky bonds carry spreads reflecting default and liquidity risk."],["X always has the higher expected return","A higher YTM may simply reflect higher default risk."],["Not necessarily higher for X","Expected payments are lower than promised payments when default is possible."]],"c":[3],"es":"YTM = promised return; expected return < YTM when default is possible.","ed":"The credit spread (corporate yield minus Treasury yield) reflects default and liquidity risk. Fisher (1959) finds default risk is the prime determinant of spreads, liquidity the second. Because the YTM is calculated on promised payments, a higher YTM does not mean a higher expected return. ESG analysis can improve estimates of default probability and loss given default, the core of fixed income risk.","kt":"","src":"Bok s. 257 (9.1.3.2)"},{"id":"SB367","l":"L10","t":"Credit ratings","f":"m","d":2,"p":"M","sc":"none","s":"How does S&P describe the role of ESG in its credit ratings?","o":[["ESG matters; the question is how","S&P considers ESG within business risk, financial risk and management and governance."],["ESG is 90% of every rating","ESG is integrated within the broader framework, not a fixed 90% weight."],["ESG is excluded","S&P explicitly considers them within its rating factors."],["ESG is used only for country ratings","S&P considers ESG for corporates, e.g. climate risk in 717 rating cases."]],"c":[0],"es":"ESG enters ratings through business risk (competitive position), financial risk (cash flow/leverage) and management/governance.","ed":"S&P's corporate rating framework combines country and industry risk, competitive position, cash flow/leverage and modifiers (diversification, capital structure, financial policy, liquidity, management/governance). Wilkins (S&P) reports climate risk affected 717 rating cases over two years, mostly oil refining and utilities. Moody's says ESG is reflected holistically but impact is not always clear-cut. The textbook is sceptical: integration is still in its infancy and statements may be self-serving. Ratings are paid by issuers - a conflict of interest.","kt":"","src":"L10 slide 5 · L10 slide 7 · Bok s. 257 (9.1.4) · Bok s. 271 (9.3.3) · Bok s. 272 (9.3.3)"},{"id":"SB368","l":"L10","t":"Credit ratings","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Attig et al. (2013) find that rating agencies give LOWER credit ratings to firms with good social performance.","o":[["True","Incorrect. They find agencies award relatively HIGH ratings to firms with good social performance; CSR conveys non-financial information used by rating agencies."],["False","Correct. They find agencies award relatively HIGH ratings to firms with good social performance; CSR conveys non-financial information used by rating agencies."]],"c":[1],"es":"False: good social performance → relatively higher credit ratings.","ed":"CSR strengths and concerns related to primary stakeholder management (community relations, diversity, employee relations, environmental performance, product characteristics) matter most for creditworthiness. Related: Polbennikov et al. find high-ESG corporate bonds have slightly lower spreads and modest outperformance; Bauer and Hann find good environmental management lowers spreads (up to 64 bp); Bauer, Derwall and Hann find employee relations explain 22-42% of spreads.","kt":"","src":"L10 slide 6 · Bok s. 263 (9.2.2) · Bok s. 264 (9.2.2)"},{"id":"SB369","l":"L10","t":"Relevance of sustainability to bonds","f":"m","d":3,"p":"H","sc":"none","s":"Which ESG factor matters MOSTLY for sovereign (country) bonds?","o":[["Climate change and pollution","These are relevant to both corporate and sovereign bonds."],["Corruption and rule of law","Listed under mostly sovereign governance factors."],["Product stewardship","This is mostly corporate."],["Diversity and employee relations","These are mostly corporate."]],"c":[1],"es":"Both: climate, biodiversity, pollution, human rights, health & safety, financial policy. Sovereign: disasters, political freedoms, demographics, corruption, rule of law. Corporate: product stewardship, diversity, shareholder rights, board.","ed":"Many factors, especially environmental ones, matter for both corporate and sovereign issuers. Sovereign-specific factors include natural disasters, land system change, political freedoms, demographic change, employment, poverty, trust, crime, food security, institutional strength, corruption, regime stability, rule of law and regulatory effectiveness. Corporate-specific ones include product stewardship, product responsibility, diversity, employee and community relations, shareholder rights, incentives, audit, board expertise and independent directors. The environmental side is better developed in data and impact products (green bonds) than the social side. Also true, but not offered as an option here: Demographic change and trust in society/institutions (social).","kt":"","src":"L10 slide 8 · Bok s. 260 (Table 9.1) · Bok s. 261 (9.2)"},{"id":"SB370","l":"L10","t":"Sovereign bonds and ESG","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A country with an investment-grade rating sees more corruption, weaker rule of law and social unrest, while GDP growth is still fine. What should a bond analyst expect?","o":[["Only shareholders are affected","Sovereign bondholders bear default risk directly."],["Higher credit risk","Corruption and weak institutions are strongly linked to worse ratings."],["Lower spreads","Instability raises risk premia."],["No effect; only GDP matters","Governance has driven sovereign credit for centuries."]],"c":[1],"es":"Weakening governance → higher sovereign credit risk.","ed":"Country ESG scores correlate strongly with credit ratings, and corruption was a key factor in the eurozone crisis. ESG rankings such as RobecoSAM's claim to pick up problems earlier than credit ratings, which is valuable for investors less dependent on agencies.","kt":"Sovereign credit risk: the risk that a government fails to pay its debt; driven by economic, fiscal and institutional (governance) factors.","src":"Bok s. 261 (9.2.1) · Bok s. 263 (9.2.1) · L10 slide 8"},{"id":"SB371","l":"L10","t":"Sovereign bonds and ESG","f":"t","d":3,"p":"L","sc":"short","s":"True or false: Country sustainability rankings give governance the largest weight, so they partly overlap with credit ratings.","o":[["True","Correct. Governance dominates the ranking, and credit ratings also weigh institutions, corruption and policy quality, so there is overlap; E and S add extra information."],["False","Incorrect. Governance dominates the ranking, and credit ratings also weigh institutions, corruption and policy quality, so there is overlap; E and S add extra information."]],"c":[0],"es":"True: governance-heavy rankings overlap with credit ratings.","ed":"The added value lies in environmental and social indicators and in faster updates. Nordic countries lead such rankings. Robeco uses ranking changes in a rules-based way to adjust sovereign bond weights.","kt":"Country sustainability ranking: a score of countries on environmental, social and governance indicators, used e.g. to tilt sovereign bond portfolios.","src":"Bok s. 265 (9.3.1) · Bok s. 267 (Table 9.2)"},{"id":"SB372","l":"L10","t":"Sovereign bonds and ESG","f":"t","d":3,"p":"L","sc":"none","s":"True or false: Promised pensions and health costs that may not be affordable (e.g. in Japan and Italy) are a sovereign credit risk.","o":[["True","Correct. Section 9.2 elaborates on this factor, which the authors added to Table 9.1."],["False","Incorrect. Section 9.2 elaborates on this factor, which the authors added to Table 9.1."]],"c":[0],"es":"True: unfunded social promises are a sovereign credit risk.","ed":"Implicit liabilities are promises by politicians that may not be sustainably affordable. High unfunded pension obligations (Japan, Italy, and to a lesser extent the US, France and Germany) can weaken creditworthiness. Demographic change (ageing) interacts with this, which is why RobecoSAM includes ageing (10%) and age-related policies.","kt":"","src":"Bok s. 261 (9.2) · Bok s. 267 (Table 9.2)"},{"id":"SB373","l":"L10","t":"Corporate bonds and ESG","f":"m","d":4,"p":"M","sc":"none","s":"The link between environmental performance and bond yields gets weaker for higher-quality bonds (Schneider, 2011). Why?","o":[["They matter most near default","For high-quality bonds, environmental liabilities rarely threaten repayment."],["Those investors do not read reports","The explanation lies in payoff structure, not investor attention."],["Good issuers have no liabilities","They can, but liabilities are less likely to cause default."],["Safe bonds are exempt from environmental rules","Regulation does not depend on bond ratings."]],"c":[0],"es":"Bondholders care about ESG mainly when it raises default risk, which matters most for weaker credits.","ed":"In chemicals and pulp and paper, poor environmental performers face future compliance and clean-up liabilities large enough to drive firms into bankruptcy, and bondholders' claims may be subordinated to environmental liabilities. Because bondholders only lose when the firm cannot pay, ESG risk is most relevant near default - consistent with the non-linear payoff on slide 3. The corporate bond market is also heavily exposed to carbon risk through energy, utilities and leveraged banks.","kt":"","src":"Bok s. 264 (9.2.2) · L10 slide 3"},{"id":"SB374","l":"L10","t":"Corporate bonds and ESG","f":"m","d":3,"p":"M","sc":"none","s":"How can ESG lower a firm's cost of debt?","o":[["Environmental claims never come first","Clean-up liabilities can subordinate bondholders' claims."],["Bondholders get all the upside","Bondholders mainly care about downside risk."],["Takeover defences protect bondholders","The evidence links more anti-takeover mechanisms to a higher cost of debt."],["Better governance protects lenders","Better monitoring lowers credit risk."]],"c":[3],"es":"Stable cash flows and good governance reduce default risk → lower spreads.","ed":"Bondholders care about the probability and severity of default. Employee relations, governance and environmental management all affect these. The effect is strongest for weaker credits because of the non-linear bond payoff. Also true, but not offered as an option here: Good employee relations make cash flows more stable and help firms get worker concessions in distress.","kt":"Cost of debt: the interest rate a company pays on borrowing, which rises with default risk and loss given default.","src":"Bok s. 264 (9.2.2) · Bok s. 265 (9.2.2) · L10 slide 3"},{"id":"SB375","l":"L10","t":"Sustainability-linked bonds","f":"m","d":3,"p":"H","sc":"short","s":"In 2019 Enel issued a bond for general purposes, but the coupon rises by 0.25% if it misses its renewable energy target. How does it differ from a green bond?","o":[["It is ring-fenced","Neither SLBs nor green bonds are ring-fenced."],["The money must go to renewable projects","That describes a green (use-of-proceeds) bond."],["The coupon depends on targets","Incentives work through pricing, not earmarking."],["It has no link to sustainability","The coupon depends on a sustainability target."]],"c":[2],"es":"SLB: KPI-linked coupon; green bond: earmarked proceeds.","ed":"SLBs let companies without enough green projects signal commitment at firm level. Credibility depends on ambitious, material KPIs and a meaningful penalty; critics note small step-ups and easy targets. Same logic as sustainability-linked loans and derivatives.","kt":"Sustainability-linked bond (SLB): a general-purpose bond whose financial terms (usually the coupon) change depending on whether the issuer meets sustainability performance targets.","src":"L10 slide 9 · L10 slide 24 · L11 slide 25"},{"id":"SB376","l":"L10","t":"ESG integration in bonds","f":"m","d":3,"p":"M","sc":"none","s":"Why is engagement harder for bond investors?","o":[["Firms are not allowed to talk to bondholders","No such prohibition exists."],["There is nothing to discuss","Bonds are heterogeneous in maturity and seniority."],["They are not owners","She stresses that it is all about downside risk and preserving capital."],["They have majority votes","Bondholders have no voting rights outside bankruptcy."]],"c":[2],"es":"Not owners, heterogeneous illiquid OTC instruments, hard to identify holders, engagement less institutionalised.","ed":"Bondholders focus on downside and capital preservation, creating conflicts with shareholders that ESG specialists often misunderstand. Bonds come in many maturities and seniorities with small, expensive-to-trade markets, so investors buy and hold. Engagement works best at (re)issuance, and \"the carrot works better than the stick\". She suggests tying management pay to bond metrics like CDS spreads. Slide 12 nevertheless lists the refinancing need as a lever for bond investors. Also true, but not offered as an option here: Bonds trade over the counter, so firms struggle to identify their bondholders after issuance.","kt":"","src":"Bok s. 270 (Box 9.1) · Bok s. 271 (Box 9.1) · L10 slide 12"},{"id":"SB377","l":"L10","t":"Relevance of bonds to sustainability","f":"m","d":3,"p":"H","sc":"none","s":"Bondholders cannot vote. Which lever do they still have?","o":[["Bonds cannot be shorted","The slide lists shorting \"bad\" bonds as a lever."],["Bond markets are small","Bond markets are larger than equity markets."],["Firms must refinance often","The need to refinance gives bond investors recurring influence."],["They can replace the board at any time","Bondholders have no voting rights at AGMs."]],"c":[2],"es":"Levers: refinancing need, market size (> equities), shorting \"bad\" bonds, engagement, signalling (green bonds).","ed":"Bonds mature, so issuers return to the market and must satisfy investors' conditions. The bond market ($92 trillion in 2016 vs $70 trillion listed equity) is larger than equity markets, so moving bond capital matters. Investors can short \"bad\" bonds (the Adani short-seller attack forced capex cuts and bond buybacks). Engagement is possible, especially pre-issuance, and green bonds allow firms to signal commitment (Flammer, 2021).","kt":"","src":"L10 slide 12 · Bok s. 253 (9.1)"},{"id":"SB378","l":"L10","t":"Green bonds","f":"m","d":2,"p":"H","sc":"none","s":"Which is one of the four core parts of the Green Bond Principles?","o":[["A lower guaranteed coupon than normal bonds","Pricing is not part of the principles."],["An AAA rating","Not required; most green bonds are investment grade but not necessarily AAA."],["Reporting on use of proceeds","This is component 4 of the GBP."],["ECB approval","Not a component of the voluntary principles."]],"c":[2],"es":"1 use of proceeds; 2 project evaluation and selection; 3 management of proceeds; 4 reporting.","ed":"(1) proceeds exclusively for green projects, described in legal documentation; (2) the issuer communicates environmental objectives, how projects qualify and eligibility criteria; (3) net proceeds credited to a sub-account and tracked; (4) mandatory reporting on use of proceeds. ICMA also has Social Bond Principles (same four components), Sustainability Bond Guidelines and Sustainability-Linked Bond Principles; the EU has a regulated European Green Bond Standard. Also true, but not offered as an option here: Management of proceeds (credited to a sub-account, tracked and verified).","kt":"","src":"L10 slide 9-10 · Bok s. 273 (9.4.1)"},{"id":"SB379","l":"L10","t":"Green bonds","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Green bonds are ring-fenced, so repayment depends only on the green project's cash flows, not on the issuer's overall credit.","o":[["True","Incorrect. Green bonds are earmarked but NOT ring-fenced; they carry the same credit risk as the issuer's other bonds with the same conditions."],["False","Correct. Green bonds are earmarked but NOT ring-fenced; they carry the same credit risk as the issuer's other bonds with the same conditions."]],"c":[1],"es":"False: earmarked, not ring-fenced → same credit risk as the issuer's conventional bonds.","ed":"Unless the project makes up all the issuer's assets, green bond payments are not tied to the project. In theory, there should therefore be no price difference with comparable conventional bonds. Morgan Stanley (121 bonds) finds similar spreads; Zerbib finds a small negative premium (\"greenium\") of about 8 bp, suggesting excess demand for green bonds. Social bonds share this feature.","kt":"","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)"},{"id":"SB380","l":"L10","t":"Green bonds","f":"m","d":3,"p":"H","sc":"none","s":"Green bonds yield slightly less than similar normal bonds from the same issuer. Why?","o":[["They are less liquid","Lower liquidity would raise, not lower, yields; the study controls for liquidity."],["Their issuers never default","Same issuer, same default risk."],["Demand is higher than supply","Credit risk is the same, so the lower yield reflects demand for the label."],["They are ring-fenced from the issuer","Green bonds are earmarked, not ring-fenced."]],"c":[2],"es":"The greenium is small and reflects demand, not lower risk.","ed":"Because the greenium is small, issuers gain modestly cheaper funding and investors give up little return. Other studies find similar spreads to conventional bonds once the market grows. Remember the sign and the reason, not the exact basis points.","kt":"Greenium: the yield discount on a green bond versus a comparable conventional bond.","src":"Bok s. 275 (9.4.1) · L9 slide 14"},{"id":"SB381","l":"L10","t":"Green bonds","f":"m","d":3,"p":"H","sc":"none","s":"What does Flammer (2021) find around green bond issues?","o":[["Prices rise; the environment improves","Consistent with credible signalling of environmental commitment."],["Share prices fall","Investors respond positively, especially to first-time and certified issues."],["Emissions rise","Emissions fall and environmental ratings rise."],["They mainly attract short-term hedge funds","Ownership by long-term and green investors increases."]],"c":[0],"es":"Positive announcement returns (esp. first-time, certified), better environmental performance, more long-term/green owners → signalling.","ed":"The stock market responds positively to green bond announcements, more so for first-time issuers and third-party certified bonds. After issuance, environmental ratings rise and CO2 emissions fall, and ownership by long-term and green investors increases. Flammer interprets this as signalling: issuing a (certified) green bond credibly signals commitment to the environment. It contrasts with the view that green bonds are mere relabelling.","kt":"","src":"L10 slide 13"},{"id":"SB382","l":"L10","t":"Green bonds","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: If a green bond and a normal bond from the same issuer have the same terms, the default risk is the same, so a lower green yield is a price for the label.","o":[["True","Correct. Green bonds are earmarked but not ring-fenced, so credit risk is the same; the \"greenium\" reflects demand."],["False","Incorrect. Green bonds are earmarked but not ring-fenced, so credit risk is the same; the \"greenium\" reflects demand."]],"c":[0],"es":"True: same credit risk; the greenium reflects demand for the label.","ed":"Zerbib estimates a small greenium (about 8 bp). Investors may still prefer the green bond for impact reporting, signalling (Flammer) or mandate reasons, but should not think it is safer.","kt":"Greenium: the lower yield (higher price) investors accept on a green bond versus a comparable conventional bond.","src":"Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1)"},{"id":"SB383","l":"L10","t":"Green bonds","f":"m","d":3,"p":"M","sc":"short","s":"Poland gets about 80% of its energy from coal but issues a green bond. Which challenge does this show?","o":[["Coal countries cannot issue bonds","No such bar exists."],["Judging the issuer's credibility","The textbook calls this a dilemma for investors in sovereign green bonds."],["Countries cannot issue green bonds","Several sovereigns (Indonesia, Poland, France) have issued green bonds."],["Country green bonds are always ring-fenced","They are earmarked, not ring-fenced."]],"c":[1],"es":"Green label on projects vs brown overall profile → investors must assess credibility.","ed":"Challenges include the lack of agreement on what is green (Chinese guidelines are less strict than the GBP's 95% green proceeds), the need for better investor communication, unsuitability for complex transactions (Renewi used bank finance for its merger), and reputational risk (Unilever's £250m green bond was excluded from a green bond index). Sovereign issuers with coal-heavy energy systems raise credibility questions; the EU Green Bond Standard and taxonomy aim to tighten definitions.","kt":"","src":"Bok s. 276 (9.4.2) · Bok s. 273 (9.4.1)"},{"id":"SB384","l":"L10","t":"Social bonds","f":"m","d":3,"p":"M","sc":"none","s":"How does a social impact bond (SIB) differ from a social bond?","o":[["A SIB is ring-fenced","Neither statement is the distinction drawn."],["A SIB pays only if goals are met","The textbook notes SIBs are not really bonds."],["A social bond is a donation, not a bond","This reverses the definitions; social bonds are regular bonds with earmarked proceeds."],["There is no difference","The textbook warns they are often confused."]],"c":[1],"es":"Social bond = earmarked regular bond (SBP four components); SIB = outcome-based payment contract.","ed":"Social bonds finance eligible social projects (affordable infrastructure, access to essential services, affordable housing, employment, food security, socioeconomic advancement) for target populations (people below the poverty line, marginalised, vulnerable groups, unemployed). They follow the same four components as the GBP and carry the issuer's credit risk. SIBs pay investors back plus a return only if a social outcome is achieved (Peterborough: £5m to reduce reoffending). Social bonds are criticised as complex and bureaucratic, and social results are hard to measure.","kt":"","src":"Bok s. 276 (9.4.3) · Bok s. 277 (9.4.3)"},{"id":"SB385","l":"L10","t":"Sustainability-linked instruments","f":"t","d":3,"p":"H","sc":"none","s":"True or false: Like a green bond, a sustainability-linked bond must use its money only for green or social projects.","o":[["True","Incorrect. Sustainability-linked bonds are general-purpose: their terms (typically the coupon) change depending on whether the issuer meets predefined sustainability KPIs, rather than restricting use of proceeds."],["False","Correct. Sustainability-linked bonds are general-purpose: their terms (typically the coupon) change depending on whether the issuer meets predefined sustainability KPIs, rather than restricting use of proceeds."]],"c":[1],"es":"False: SLBs link terms (coupon) to issuer KPIs; proceeds are not earmarked.","ed":"ICMA distinguishes use-of-proceeds instruments (green bonds, social bonds, sustainability bonds combining both) from sustainability-linked bonds, which tie financial characteristics to issuer-level sustainability performance targets (e.g. a coupon step-up if an emissions KPI is missed). The same logic underlies sustainability-linked loans and derivatives (slide 24). The credibility of SLBs depends on ambitious, material KPIs and meaningful penalties.","kt":"","src":"L10 slide 9 · L10 slide 24"},{"id":"SB386","l":"L10","t":"Non-equity asset classes","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A real estate fund owns offices with energy label F. The city will ban renting out buildings below C from 2030. What should the fund do?","o":[["Raise rents","Tenants will avoid buildings that will become unlettable."],["Sell at any price now","Retrofitting may create more value than a fire sale."],["Plan upgrades","ESG belongs in ownership, valuation and exit planning."],["Wait until 2030 and see","Waiting raises stranding risk and lowers exit value."]],"c":[2],"es":"Retrofit and reprice: manage stranding risk across the investment cycle.","ed":"Lecture 10's real estate cycle covers deal sourcing, investment decision, ownership and sale. Split incentives with tenants complicate retrofits; green leases can help. Banks see the same risk through mortgage collateral (Lecture 11).","kt":"Energy Performance Certificate (EPC): a rating of a building's energy efficiency; minimum standards can make low-rated buildings unlettable.","src":"L10 slide 18-19 · L10 slide 14"},{"id":"SB387","l":"L10","t":"Real estate","f":"m","d":3,"p":"M","sc":"none","s":"In which stage of the real estate cycle do you manage ESG for the building, use property managers and engage with tenants?","o":[["Investment decision","This stage communicates material issues to the investment committee and assesses valuation impact."],["Deal sourcing","Deal sourcing is about identifying material ESG issues in screening and due diligence."],["Sale","The sale stage is about adding value when the asset is sold."],["Ownership","This is the ownership stage."]],"c":[3],"es":"Deal sourcing → investment decision → ownership (asset management, tenants) → sale.","ed":"In real estate, ESG enters deal sourcing (material issues in screening, due diligence, new developments and renovations), the investment decision (impact on valuation), ownership (asset management, property managers, tenant engagement) and sale (realising added value). UNPRI's framework adds green certification targets, minimum standards for developments, and working with occupiers on split incentives (owners pay for efficiency, tenants get lower bills).","kt":"","src":"L10 slide 18-19"},{"id":"SB388","l":"L10","t":"Real estate","f":"t","d":3,"p":"M","sc":"none","s":"True or false: \"Split incentives\" in real estate: owners pay for energy upgrades but tenants get the lower bills, so too little is invested.","o":[["True","Correct. Slide 19 recommends working with occupiers to address split incentives, e.g. through green lease clauses."],["False","Incorrect. Slide 19 recommends working with occupiers to address split incentives, e.g. through green lease clauses."]],"c":[0],"es":"True: owner pays, tenant benefits → under-investment.","ed":"Split incentives are a principal-agent problem. Solutions include green leases that share costs and savings, tenant engagement and minimum standards. Certifications such as BREEAM (UK) and LEED (US), and green building councils (World GBC, Norwegian Grønn Byggallianse), help signal building quality. Green buildings contribute to several SDGs (health, energy, cities, climate).","kt":"","src":"L10 slide 19-20 · L10 slide 17"},{"id":"SB389","l":"L10","t":"Credit ratings and ESG","f":"m","d":3,"p":"M","sc":"short","s":"After a short-seller report in 2023, Adani's bond prices fell sharply, and Adani cut investment and bought back bonds. Which bond market lever is this?","o":[["Green bond rules","The pressure came from market pricing, not earmarking."],["Issuing new shares","The example concerns bond markets."],["Bondholders' votes at the AGM","Bondholders normally have no AGM votes."],["Short selling and repricing","The slide lists shorting of bad bonds as a lever; falling prices raised funding costs."]],"c":[3],"es":"Short selling pushed bond prices down, raising funding costs and forcing a response.","ed":"Slide 12 lists maturity/refinancing, market size, shorting \"bad\" bonds, engagement and signalling as levers. Governance concerns (G) translated into credit pricing - consistent with evidence that governance is the most documented ESG factor in bonds.","kt":"Refinancing need: because bonds mature, issuers must return to investors, who can demand higher spreads or refuse to roll over debt.","src":"L10 slide 12 · Bok s. 265 (9.2.2)"},{"id":"SB390","l":"L10","t":"Derivatives","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"An EU aluminium producer fears rising carbon prices will squeeze margins. Which instrument hedges this best?","o":[["Buying carbon allowance futures","Emissions trading derivatives lock in the carbon cost."],["Buying cat bonds","Cat bonds transfer natural catastrophe risk, not carbon price risk."],["Buying green power certificates","RECs certify renewable power, not EU ETS compliance costs."],["Issuing a social bond","Social bonds fund social projects; they do not hedge carbon prices."]],"c":[0],"es":"Hedge carbon price risk with emission allowance futures.","ed":"Hedging reduces cash flow volatility but does not cut emissions; the long-term solution is abatement (e.g. green power), which also lowers transition risk in valuations.","kt":"Emission allowance futures: contracts to buy EU ETS allowances at a fixed price in the future, hedging carbon cost risk.","src":"L10 slide 23"},{"id":"SB391","l":"L10","t":"Derivatives","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"SBM Offshore's 2019 interest rate swap with ING was linked to ESG. How?","o":[["The amount doubled if emissions rose","The mechanism adjusts the spread, not the notional."],["The bank gave money to charity","That describes Siemens Gamesa's swap with HSBC."],["A rate linked to its ESG score","The spread adjusts with SBM's ESG performance."],["The swap was cancelled if targets were missed","Missing the target triggers a penalty spread, not cancellation."]],"c":[2],"es":"SBM: ±5-10 bp on the fixed rate tied to ESG score. Siemens Gamesa: fixed rate unchanged; charitable donation tied to rating changes.","ed":"Sustainability-linked derivatives embed incentives in hedging instruments. SBM Offshore pays less (5-10 bp) if it meets its ESG score target and more if not. Italo (Natixis, 2020) combined a sustainability-linked loan and swap with KPI-linked incentives. Siemens Gamesa's HSBC swap keeps the fixed rate but triggers donations: HSBC donates if the ESG rating improves, Siemens Gamesa if it declines. Credibility depends on KPI ambition and the size of incentives; small spread changes may have limited effect.","kt":"","src":"L10 slide 24"},{"id":"SB392","l":"L10","t":"Bonds and agency costs","f":"m","d":3,"p":"M","sc":"none","s":"What is the debt overhang (underinvestment) problem (Myers, 1977)?","o":[["Firms without debt cannot raise equity","Unrelated to debt overhang."],["Bondholders block investments","Bondholders typically have no voting rights."],["Too many safe projects","Shareholders tend towards too little or too risky investment, not excessive safety."],["Owners skip good projects","Shareholders only invest if returns are high enough to leave them a residual."]],"c":[3],"es":"Debt overhang: positive-NPV projects foregone because payoffs accrue to creditors; risk shifting: negative-NPV gambles benefiting equity.","ed":"With high leverage, new equity-financed investments mostly benefit bondholders, so shareholders underinvest. With internal capital, shareholders may instead prefer risky all-or-nothing projects (risk shifting, Galai and Masulis). Covenants (restrictions on investments, dividends, new financing) limit these conflicts but create monitoring and bonding costs. Since bondholders rely on delegated monitoring and have little control, ESG red flags matter. Banks (Lecture 11) monitor more directly.","kt":"","src":"Bok s. 258 (9.1.5) · Bok s. 259 (9.1.5)"},{"id":"SB393","l":"L10","t":"Commodities and supply chains","f":"t","d":3,"p":"L","sc":"short","s":"True or false: The EU Deforestation Regulation (postponed) will require firms selling cocoa, coffee, palm oil or soy in the EU to prove it is deforestation-free, so traceability matters for chocolate makers.","o":[["True","Correct. Once applied, the regulation requires due diligence and traceability for listed commodities, turning deforestation risk into a compliance and market-access issue."],["False","Incorrect. Once applied, the regulation requires due diligence and traceability for listed commodities, turning deforestation risk into a compliance and market-access issue."]],"c":[0],"es":"True: traceability becomes material for cocoa-based firms.","ed":"Like the Swiss Platform for Sustainable Cocoa, regulation and industry initiatives internalise externalities (deforestation, child labour). Investors can engage on traceability or face exposure to fines, lost market access and reputational damage.","kt":"Supply-chain traceability: the ability to track a product's origin back to the farm or plot, needed to prove it is deforestation-free.","src":"L10 slide 22 · L3 slide 17"},{"id":"SB394","l":"L10","t":"Bonds synthesis","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"A BBB chemicals firm with weak environmental management issues a normal and a green bond with the same terms; the green bond yields 8 bp less. An investor worries about clean-up costs. What is the best reasoning?","o":[["Same risk; check clean-up costs","Green bonds are not ring-fenced; ESG matters for credit risk, especially for weaker credits."],["Ignore the environment","Clean-up liabilities can drive default, and bondholders bear downside risk."],["Buy the green bond; it is safer","Green bonds are earmarked, not ring-fenced."],["Buy the normal bond; green bonds default more","Default risk is the same for both bonds of the same issuer."]],"c":[0],"es":"Same issuer → same credit risk; the label changes yield (greenium), not risk. ESG analysis must focus on default risk.","ed":"The investor's main question is credit risk. Schneider shows environmental liabilities matter most for weaker credits and can subordinate bondholders' claims, so a BBB chemicals issuer with weak environmental management deserves careful analysis. The green label does not reduce this risk; the 8 bp lower yield is a greenium paid for the label. If the investor values the use-of-proceeds impact and signalling (Flammer), the green bond may still be preferred - but only after the credit decision is sound.","kt":"","src":"Bok s. 264 (9.2.2) · Bok s. 274 (9.4.1) · Bok s. 275 (9.4.1) · L10 slide 3 · L10 slide 13"},{"id":"SB395","l":"L10","t":"Bonds basics","f":"m","d":1,"p":"L","sc":"none","s":"Which statement about bond types is correct?","o":[["Supranational bonds are issued by cities","Supranationals are issued by bodies like the World Bank or EIB."],["Unsecured bonds are repaid first","Secured bondholders have priority over pledged assets."],["Secured bonds have collateral","Secured bonds (structured products) pledge specific assets."],["Bank loans trade on exchanges","Bank loans are private debt."]],"c":[2],"es":"Government: supranational, sovereign, municipal. Corporate: secured (collateral) vs unsecured (senior, subordinated).","ed":"Government bonds include supranationals (World Bank, EIB - the first green bond issuer in 2007), sovereigns and municipals. Corporate bonds are split into financial and non-financial issuers and into secured (mortgage bonds, asset-backed securities, central in the 2008-09 crisis) and unsecured (senior before subordinated). Bonds can include call provisions, sinking funds or conversion into equity.","kt":"","src":"Bok s. 254 (9.1.2) · Bok s. 254 (Figure 9.1) · Bok s. 255 (9.1.2)"},{"id":"SB396","l":"L10","t":"Corporate bonds and ESG","f":"t","d":3,"p":"M","sc":"short","s":"True or false: Since bondholders do not share the upside, a sudden ESG scandal like Volkswagen's dieselgate does not matter to them unless the firm defaults at once.","o":[["True","Incorrect. Scandals raise default risk and credit spreads (VW's CDS spread jumped sharply), lowering bond prices even without default."],["False","Correct. Scandals raise default risk and credit spreads (VW's CDS spread jumped sharply), lowering bond prices even without default."]],"c":[1],"es":"False: ESG scandals raise credit risk and spreads immediately.","ed":"ESG issues create tail risks in going-concern and default scenarios (Hanson et al.). Bond prices fall when default probability or loss given default rises, so bondholders care about ESG downside even without upside.","kt":"CDS spread: the price of insuring against a company's default; it rises when perceived credit risk rises.","src":"Bok s. 259 (9.2) · L10 slide 3"},{"id":"TR44","l":"L10","t":"Debt and equity payoffs","f":"m","d":3,"p":"H","sc":"none","s":"With debt D outstanding, the payoff to EQUITY holders looks like:","o":[["A risk-free bond","Equity is the riskiest, residual claim."],["A forward contract","A forward has symmetric payoffs, unlike limited-liability equity."],["A put option","A put pays when value falls below the strike; that relates to debt."],["A call option","Shareholders get max(V − D, 0): unlimited upside, limited downside."]],"c":[3],"es":"Equity = call on firm assets; debt = risk-free debt minus a put.","ed":"This explains asset substitution: like call holders, shareholders gain from higher risk, while creditors (short the put) lose. Green and sustainability bonds change the information and incentives around this basic payoff structure.","kt":"Debt as an option: debt payoff = min(V, D), i.e. a risk-free payment of D minus a put option on the firm's assets.","src":"Opptak L10 ca. 10 min · Opptak L10 ca. 13 min"},{"id":"TR45","l":"L10","t":"Bond risks","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"A utility is downgraded after an ESG scandal but will still pay all coupons. Which bondholder loses most?","o":[["Shareholders only","Downgrades directly reprice the bonds."],["Nobody","Fixed coupons mean the price must fall to raise the yield."],["One who sells early","Credit migration causes a mark-to-market loss realised only on sale."],["One who holds to maturity","If the issuer pays, the hold-to-maturity investor loses nothing."]],"c":[2],"es":"Downgrade → price falls → loss if you sell before maturity.","ed":"Corporate bond risks: default risk, loss given default, liquidity risk and credit migration risk. Sovereign bonds add GDP growth, inflation, external debt and default history. ESG factors feed into ratings through these channels.","kt":"","src":"Opptak L10 ca. 19 min"},{"id":"TR46","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A shipping firm's bond can fund anything, but the coupon rises by 0.25% if it fails to cut emissions by 30% by 2030. This is a:","o":[["Catastrophe bond","Cat bonds transfer insurance risk from natural disasters."],["Social bond","A social bond earmarks proceeds for social projects."],["Green bond","A green bond earmarks proceeds for specified green projects."],["Sustainability-linked","SLBs tie terms to a KPI target; proceeds are not earmarked."]],"c":[3],"es":"Any use of funds + KPI-linked coupon = sustainability-linked bond.","ed":"Green, social and sustainability bonds are use-of-proceeds bonds: issuers state the projects, keep proceeds tracked (often in a separate account) and report, which lowers information asymmetry. SLBs instead set targets; the risk is greenwashing via easy, self-measured targets, partly checked by market discipline and certification.","kt":"","src":"Opptak L10 ca. 30 min · Opptak L10 ca. 34 min"},{"id":"TR47","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"M","sc":"none","s":"Why is there room for greenwashing in sustainability-linked bonds, and what limits it?","o":[["Green projects are rarely checked","SLB proceeds are not earmarked at all."],["Firms set their own targets","Market discipline and external certification check weak targets."],["Regulators set targets that are too strict","Targets are set by the issuer."],["SLBs pay no coupon","SLBs pay coupons, with step-ups if targets are missed."]],"c":[1],"es":"Self-set, self-measured targets → greenwashing risk; markets push back.","ed":"A 5% emissions cut the firm would make anyway is a weak target. If investors see this, demand falls and issuance gets harder. In the EU, voluntary principles (ICMA) are complemented by the mandatory-style European Green Bond Standard for green bonds.","kt":"","src":"Opptak L10 ca. 35 min"},{"id":"TR48","l":"L10","t":"Sustainability bonds","f":"m","d":3,"p":"M","sc":"none","s":"After issuing green bonds, firms improve environmentally and attract more long-term investors. Which mechanism does this support?","o":[["Greenwashing","Improvement after issuance argues against pure greenwashing."],["Signalling","Green bond issuance works as a costly, credible signal."],["Short-selling pressure","Short-selling is a different bond-market lever."],["Separate cash reserves","The finding is about environmental performance and investor base."]],"c":[1],"es":"Green bonds act as a credible signal of commitment.","ed":"Other bond levers in the lecture: refinancing (firms must return to the market at maturity), market size (bond markets are larger than equity), short-selling (e.g. Adani) and engagement. Green loans work the same way as a signal.","kt":"","src":"Opptak L10 ca. 39 min · Opptak L10 ca. 41 min"},{"id":"TR49","l":"L10","t":"Blended finance","f":"m","d":3,"p":"M","sc":"none","s":"Private investors often avoid green infrastructure in developing countries. How does blended finance help?","o":[["Investors accept zero return","It improves risk-return so private investors can still earn a return."],["Public money takes some risk","Government backing lowers perceived physical, legal and institutional risks."],["It only works in rich countries","It is mainly used in emerging and developing markets."],["It bans private investors","The aim is to attract private capital, not exclude it."]],"c":[1],"es":"Public risk-sharing unlocks private capital for public-good-like projects.","ed":"Infrastructure has public-good features: the builder bears the cost, but benefits are shared, so private investment falls short. Blended finance (e.g. guarantees, first-loss capital) fixes the risk-return gap. Development finance institutions such as Norfund play this role.","kt":"","src":"Opptak L10 ca. 57 min"},{"id":"CX085","l":"L11","t":"Information asymmetry in banking","f":"m","d":2,"p":"H","sc":"short","s":"When a bank raises its rate for everyone because it cannot tell good from bad borrowers, the borrowers most likely to drop out are:","o":[["Only government borrowers","Det handler om bedriftslån."],["The riskiest borrowers","De har mest å tjene på å bli."],["The safest borrowers","De synes renten er for høy for deres lave risiko."],["None of them","Noen vil reagere på høyere rente."]],"c":[2],"es":"Adverse selection: de gode forsvinner, de dårlige blir.","ed":"Foreleser har sagt at adverse selection kommer på eksamen. Bankens løsning er screening før lånet gis.","kt":"","src":"Opptak L11 ca. 8 min · Opptak L5 ca. 17 min","k":1},{"id":"CX086","l":"L11","t":"Adverse selection","f":"t","d":2,"p":"H","sc":"none","s":"Is moral hazard a problem that arises before the contract is signed?","o":[["Yes","Feil. Moral hazard skjer etter avtalen. Adverse selection skjer før."],["No","Riktig. Moral hazard skjer etter avtalen. Adverse selection skjer før."]],"c":[1],"es":"Nei: moral hazard = etter avtalen.","ed":"Adverse selection: skjult informasjon før avtalen ('hvem er du?'). Moral hazard: skjult handling etter avtalen ('hva gjør du nå?').","kt":"","src":"L5 slide 10-13 · L11 slide 7","k":1},{"id":"CX087","l":"L11","t":"Risk-based lending","f":"m","d":2,"p":"H","sc":"short","s":"Collateral consisting of polluted land mainly increases:","o":[["The dividend yield","Det er et aksjebegrep."],["The liquidity coverage ratio","Det er et bankregulatorisk mål, ikke et lån-parameter."],["Loss given default (LGD)","Forurenset tomt er verdt mindre som sikkerhet, så tapet ved mislighold øker."],["The risk-free rate","Den er lik for alle."]],"c":[2],"es":"Dårligere sikkerhet = høyere LGD.","ed":"Expected loss = PD × LGD × EAD. ESG-risiko kan øke både PD (sannsynlighet for mislighold) og LGD (tap hvis det skjer).","kt":"","src":"Bok s. 292 (10.4) · Bok s. 293 (Table 10.3) · Bok s. 294 (10.4) · Bok s. 291 (10.3)","k":1},{"id":"CX088","l":"L11","t":"Sustainability approaches in banking","f":"m","d":2,"p":"H","sc":"none","s":"A bank that lends only to viable projects with positive impact, like Triodos, is an example of:","o":[["Investment banking","Det handler om rådgivning og emisjoner."],["Risk-based banking (SF 1.0)","Risk-based bruker ESG til å prise risiko."],["Value-based banking (SF 3.0)","Impact først = value-based."],["Shadow banking","Det er noe helt annet."]],"c":[2],"es":"Impact-utlån = value-based = SF 3.0.","ed":"Risk-based banking (SF 1.0 og 2.0) bruker ESG til å prise risiko. Value-based banking låner ut for å skape positiv effekt.","kt":"","src":"Opptak L11 ca. 32 min · Opptak L11 ca. 40 min","k":1},{"id":"CX089","l":"L11","t":"Sustainable loans","f":"m","d":2,"p":"H","sc":"none","s":"A sustainability-linked loan differs from a green loan in that:","o":[["Only governments are allowed to take it","Selskaper tar SLL."],["It must be used for a green project","Det er green loan."],["It is interest-free for the borrower","SLL har vanlig rente."],["Its rate depends on the borrower's targets","SLL: renten følger KPI-er, pengene kan brukes fritt."]],"c":[3],"es":"SLL = KPI-knyttet rente.","ed":"Samme logikk som for obligasjoner: green loan = øremerket, SLL = knyttet til KPI-er.","kt":"","src":"L11 slide 23-25 · Bok s. 295 (Box 10.1)","k":1},{"id":"CX090","l":"L11","t":"Bank risks","f":"m","d":2,"p":"H","sc":"none","s":"Climate transition risk reaches a bank with low own emissions mainly:","o":[["It cannot affect a bank's balance sheet","Banker er sterkt eksponert via utlånene."],["Only through reputational damage","Hovedkanalen er kredittrisiko."],["Through the bank's own electricity bill","Det er en liten kostnad."],["Via borrowers' default risk and collateral","Låntakernes risiko blir bankens kredittrisiko."]],"c":[3],"es":"Kundenes klimarisiko = bankens kredittrisiko.","ed":"Store lån til olje og gass kan gi tap hvis strengere klimapolitikk gjør låntakerne mindre lønnsomme.","kt":"","src":"L11 slide 10 · L11 slide 14 · L11 slide 31","k":1},{"id":"SB397","l":"L11","t":"Bank business model","f":"m","d":3,"p":"M","sc":"short","s":"Silicon Valley Bank failed in 2023 after rising rates cut the value of its long-term bonds and depositors pulled out money fast. Which bank risks does this show?","o":[["Interest rate risk","Long assets funded by runnable short-term deposits."],["Insurance risk","SVB was a bank, not an insurer."],["Physical climate risk","Not the cause of the failure."],["Credit risk from emissions","The trigger was rates and deposit flight, not borrower defaults."]],"c":[0],"es":"Maturity mismatch → interest rate + liquidity risk.","ed":"The case is a governance (G) issue too: weak risk management and a concentrated depositor base. It reminds us that ESG integration in banking includes governance and risk culture, not just environmental lending.","kt":"Maturity transformation: using short-term deposits to fund long-term loans or bonds; it creates interest rate and liquidity (run) risk.","src":"L11 slide 9 · L11 slide 10"},{"id":"SB398","l":"L11","t":"Role of banks","f":"m","d":2,"p":"H","sc":"none","s":"Which is part of a bank's monitoring role?","o":[["Voting at borrowers' AGMs","Banks monitor as lenders, not as voting shareholders."],["Screening before lending","First element of monitoring."],["Issuing ESG ratings","This is done by ESG rating agencies."],["Guaranteeing all deposits itself","Deposit insurance is a public scheme, not part of monitoring."]],"c":[1],"es":"Monitoring = screening (adverse selection) + preventing opportunism (moral hazard) + costly state verification.","ed":"Asymmetric information lies at the core of banking. Banks screen before lending, monitor during the loan to prevent moral hazard, and audit defaulting borrowers. They have a comparative advantage (Diamond, 1984) through economies of scale and low delegation costs. Unlike market investors, who face a free-rider problem because trading reveals information, banks can keep information from long-run relationships (checking accounts, factoring). This also lets them analyse sector-wide sustainability trends and spread best practices. Also true, but not offered as an option here: Auditing borrowers that fail to meet their obligations (costly state verification).","kt":"","src":"L11 slide 7 · Bok s. 285 (10.1.3) · Bok s. 286 (10.1.3)"},{"id":"SB399","l":"L11","t":"Role of banks","f":"m","d":3,"p":"M","sc":"none","s":"When do firms usually choose a bank loan over a bond?","o":[["When uncertainty is lowest","The safest, large firms with track records tend to use bond markets."],["When it wants no monitoring","Bank lending involves more, not less, monitoring."],["When cash flows are uncertain","With low asymmetric information firms borrow in markets; as it rises, banks come into play."],["Only when it is large and listed","Large listed firms often use bond markets; small firms depend on banks."]],"c":[2],"es":"Low information asymmetry → bond markets; moderate → banks; too high → no finance. Small firms → banks.","ed":"Large, well-capitalised firms with published track records finance themselves in markets; smaller, newer firms turn to banks because banks can request information and intervene, and the fixed costs of market entry are too high for small firms. When uncertainty is too high, a firm cannot get finance at all (circular start-ups often face this). Bank credit is large relative to equity in Europe and Asia (slide 3: Germany, China, Norway), while the US is equity-heavy.","kt":"","src":"Bok s. 286 (10.1.3) · L11 slide 3 · Bok s. 291 (Figure 10.3)"},{"id":"SB400","l":"L11","t":"Bank business model","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"A bank lends to a firm whose factory sits on polluted land. Under the risk-based approach, how should this affect the loan?","o":[["A higher deposit rate for the bank","Deposit rates are not set by one borrower's profile."],["No change","Contamination is an economic sustainability criterion with large credit effects."],["A lower rate","Contaminated land is weaker collateral."],["A higher interest rate","Clean-up and liability costs raise default risk and lower recoveries."]],"c":[3],"es":"ESG risks raise PD and LGD → higher risk premium.","ed":"The contracted loan rate exceeds the expected loan rate because some borrowers default. Including ESG factors improves default prediction and links pricing to sustainability (nudging: higher rates for ESG concerns).","kt":"Expected loss = probability of default (PD) × loss given default (LGD) × exposure; the risk premium must cover it.","src":"Bok s. 284 (10.1.1) · Bok s. 292 (10.4) · Bok s. 293 (Table 10.3)"},{"id":"SB401","l":"L11","t":"Bank risks","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: A bank with a small office footprint but big loans to oil and gas firms is still exposed to climate transition risk.","o":[["True","Correct. A bank's credit risk includes the risks its counterparties face; transition risk at borrowers becomes the bank's credit risk."],["False","Incorrect. A bank's credit risk includes the risks its counterparties face; transition risk at borrowers becomes the bank's credit risk."]],"c":[0],"es":"True: borrowers' transition risk becomes the bank's credit risk.","ed":"This is why EBA Pillar 3 requires disclosure of exposures to carbon-related sectors and why \"the bank's indirect material issues are its credits and investments\" (slide 14).","kt":"Financed emissions: emissions of the companies and projects a bank lends to or invests in (part of its scope 3).","src":"L11 slide 10 · L11 slide 14 · L11 slide 31"},{"id":"SB402","l":"L11","t":"Material issues in banking","f":"m","d":3,"p":"M","sc":"short","s":"Which event matches a SASB material issue for banks?","o":[["Office paper use - systemic risk","Paper use is immaterial and not systemic risk."],["Branch water use - a core issue","Not a material issue for banks."],["A cyber attack - affordability","This is data security."],["Fake accounts - business ethics","Misconduct in sales practices."]],"c":[3],"es":"Financial crime and mis-selling = business ethics issues, highly material for banks.","ed":"Both scandals led to large fines, CEO departures and lasting reputational damage, showing why governance and ethics are often the most material ESG issues for banks. Also true, but not offered as an option here: Danske Bank's Estonian branch money-laundering scandal (about EUR 200bn of suspicious flows) - business ethics.","kt":"SASB commercial banks: data security, access and affordability, product design (ESG in credit), business ethics, systemic risk management.","src":"L11 slide 12"},{"id":"SB403","l":"L11","t":"Material issues","f":"m","d":4,"p":"M","sc":"extended_course_case","s":"Deutsche Bank ranks data privacy and customer satisfaction highest, and climate change low, in its materiality matrix. What is the critique?","o":[["Climate does not matter for banks","The point is that financed impacts make climate highly relevant."],["Its biggest issues are in its loans","Slide 14: \"The bank's indirect material issues: credits and investments!\""],["Data privacy is the only issue","Data privacy is important but not the only issue."],["Banks should not publish materiality matrices","The slide refines what banks should consider material, not whether to report."]],"c":[1],"es":"Look through the bank to its loan book: financed emissions and human rights risks can be its largest material issues.","ed":"Matrices based on a bank's own operations and stakeholder perceptions can understate issues that arise through financing - climate risk in loan books, human rights in project finance. Handelsbanken explicitly lists \"the bank's indirect impact\" (responsible credits and investments) as one of six material topics. Regulators now require banks to disclose exposure to carbon-related sectors and physical risks (EBA Pillar 3), and the FT (slide 32) reports banks increased fossil fuel finance in 2024.","kt":"","src":"L11 slide 13-14 · Bok s. 289 (10.2.2) · L11 slide 31-32"},{"id":"SB404","l":"L11","t":"Banks and society","f":"m","d":3,"p":"L","sc":"short","s":"More bank branches in India led to better household health years later (Cramer). Why?","o":[["Branches reduce pollution","Not the mechanism."],["Credit helps pay for care","Financial access smooths consumption and funds health investments."],["Banks offer medical care","Banks provide finance, not treatment."],["A government health programme","The study exploits the branch expansion policy itself."]],"c":[1],"es":"Financial access → savings, credit, income → health investment.","ed":"This is the social side of banking's material issues (\"access and affordability\") and the rationale for microfinance and microinsurance (SF 3.0).","kt":"Financial inclusion: access to useful and affordable financial services (savings, credit, payments, insurance).","src":"L11 slide 15 · L11 slide 12"},{"id":"SB405","l":"L11","t":"Banks and society","f":"t","d":3,"p":"M","sc":"none","s":"True or false: Norwegian savings banks in communities with high social capital were LESS likely to survive after deregulation.","o":[["True","Incorrect. They find savings banks in high social capital communities were MORE likely to survive; social capital improves the efficiency of stakeholder governance. No similar effect exists for commercial banks."],["False","Correct. They find savings banks in high social capital communities were MORE likely to survive; social capital improves the efficiency of stakeholder governance. No similar effect exists for commercial banks."]],"c":[1],"es":"False: high social capital → higher survival for stakeholder-governed savings banks.","ed":"Savings banks are collectively governed by stakeholders. Where social capital is high, they raise more deposits locally, distribute more surplus to altruistic purposes and keep locally focused branch networks. The textbook adds that banks with the strongest shareholder-oriented governance performed worse in the financial crisis, and that banks reliant on interbank funding and high leverage were most vulnerable (Kotz and Schmidt).","kt":"","src":"L11 slide 16 · Bok s. 287 (10.2)"},{"id":"SB406","l":"L11","t":"Risk-based vs value-based banking","f":"m","d":2,"p":"H","sc":"none","s":"How do sustainable lending approaches fit the SF stages?","o":[["ESG integration is SF 3.0","Integration into the risk premium is SF 2.0."],["1.0-2.0 risk-based; 3.0 value-based","This is the table on slide 18."],["Exclusion is value-based","The mapping is reversed."],["All three are value-based","SF 1.0 and 2.0 are risk based."]],"c":[1],"es":"SF 1.0 exclusion (risk), SF 2.0 ESG in risk premium (risk), SF 3.0 impact lending/microfinance (value).","ed":"In the risk-based approach, ESG factors enter credit risk assessment: SF 1.0 puts unsustainable firms on an exclusion list to avoid reputational risk; SF 2.0 includes social and environmental risks in the risk premium. In the value-based approach (SF 3.0), banks primarily lend to projects with positive social or environmental impact, and stakeholders (depositors, client-investors) care about ESG for non-monetary reasons.","kt":"","src":"L11 slide 18 · Bok s. 292 (Table 10.2) · Bok s. 292 (10.3.1)"},{"id":"SB407","l":"L11","t":"Risk-based lending","f":"m","d":3,"p":"H","sc":"short","s":"A chemicals firm's plant sits on polluted land. Which credit risk parameters can this affect?","o":[["Only the deposit rate","Deposit rates are not driven by a single borrower's ESG profile."],["Only fee income","The effect runs through expected loan losses."],["None","Contaminated sites are classified as an economic sustainability criterion because of their large financial impact."],["Both PD and LGD","Clean-up costs and liability risks can raise default risk and reduce recoveries."]],"c":[3],"es":"ESG risks raise PD and/or LGD → higher expected loss → higher risk premium.","ed":"In Equation 10.1, ESG risks affect p (default probability) and 1 − λ (loss given default). Weber, Scholz and Michalik rank contaminated sites and toxic waste as economic criteria because of their impact on profits and likely high LGD (clean-up, liability). Integrating sustainability criteria improved the ability of a credit rating system to predict defaults by nearly 5%. Sustainability also affects collateral values: energy-efficient buildings keep their value, inefficient ones and combustion-engine cars may not.","kt":"","src":"Bok s. 292 (10.4) · Bok s. 293 (Table 10.3) · Bok s. 294 (10.4) · Bok s. 291 (10.3)"},{"id":"SB408","l":"L11","t":"Risk-based lending","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Weber (2010) concludes that sustainability criteria cannot predict how a borrower will perform.","o":[["True","Incorrect. Weber concludes the opposite: sustainability criteria can predict financial performance and improve the predictive validity of credit ratings."],["False","Correct. Weber concludes the opposite: sustainability criteria can predict financial performance and improve the predictive validity of credit ratings."]],"c":[1],"es":"False: sustainability criteria improve the predictive validity of credit ratings.","ed":"Weber shows that a firm's sustainability influences its creditworthiness as part of its financial performance. The textbook reports that integrating economic, environmental and social criteria (Table 10.3) improved default prediction by nearly 5%. Chava (2014) finds banks charge higher rates to firms with environmental concerns, and lower rates to firms with environmentally beneficial products.","kt":"","src":"L11 slide 20 · Bok s. 294 (10.4) · Bok s. 299 (10.4.3)"},{"id":"SB409","l":"L11","t":"Risk-based lending","f":"m","d":3,"p":"M","sc":"none","s":"The Sustainability Credit Score System models three paths for a firm. Which?","o":[["Start-up, growth, maturity","These are lifecycle stages, not sustainability paths."],["Business as usual, sustainable, future","The three development stages allow forward-looking assessment."],["Investment grade, high yield, default","These are credit rating categories."],["Exclusion, integration, impact","These are SF approaches, not development paths."]],"c":[1],"es":"Steps: industry analysis → BAU / sustainable / future-sustainable paths → material issues and vulnerabilities → weights → combined score (0-1).","ed":"The system analyses the industry (outlook, life cycle, value chain, regulation, innovation), develops three paths, defines variables in six sustainability dimensions, identifies material issues plus vulnerabilities and opportunities, formulates 30 questions and weights them into a score between 0 and 1. It is forward looking, but there is not yet hard evidence that it reduces defaults. ING's €1bn Philips facility (2017) linked the interest rate to Philips' Sustainalytics-assessed sustainability performance.","kt":"","src":"L11 slide 19 · Bok s. 294 (10.4) · Bok s. 295 (Box 10.1)"},{"id":"SB410","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"H","sc":"none","s":"How do values-based banks compare with the biggest global banks (2006-15)?","o":[["The same returns and risk","Volatility differs markedly."],["Lower returns and more debt","VBBs have higher ROA and lower leverage."],["Much higher returns, but more risk","VBB ROE is slightly lower, with lower volatility."],["Similar returns, more stable","VBBs are more stable and more real-economy focused."]],"c":[3],"es":"VBB vs G-SIB: ROA 0.65% vs 0.53%; ROE 8.3% vs 8.7%; SD ROE 4.9% vs 7.7%; loans/assets 77% vs 42%.","ed":"VBBs aim to deliver economic, social and environmental impact. They are more involved in the real economy (loans/assets 76.8% vs 41.6%; deposits/assets 81.7% vs 52.2%), have more equity relative to assets (8.1% vs 7.3%), and deliver more stable returns. Slightly lower ROE combined with lower leverage implies a higher ROA. This supports the textbook's claim that sustainable banking need not sacrifice financial performance.","kt":"","src":"L11 slide 22 · Bok s. 287 (10.2) · Bok s. 288 (Table 10.1)"},{"id":"SB411","l":"L11","t":"Values-based banking","f":"m","d":3,"p":"L","sc":"constructed_scenario","s":"Bank X is very profitable but lends mostly to speculation. Bank Y is less profitable but lends to renewables, social housing and small firms. Which scores higher on the GABV scorecard?","o":[["Y: real-economy lending","Impact-oriented and real-economy len
