i årsrapporten.","ed":"Slide 4: TCFD (Task Force on Climate-related Financial Disclosures) er for investorer og selskaper, dekker klimarelatert rapportering og governance, og rapporteres i den vanlige årsrapporten. CDP er en egen nettplattform for utslipp, vann, skog og leverandørkjede. Husk: TCFD = klima i årsrapporten.\n\nForkortelser: TCFD = Task Force on Climate-related Financial Disclosures (rammeverk for klimarisiko-rapportering); CDP = tidligere Carbon Disclosure Project (plattform for klimarapportering).","kt":"","src":"L7 slide 4"},{"id":"DF056","l":"L7","t":"CDP","f":"m","d":1,"p":"H","sc":"none","s":"CDP collects data on:","o":[["Emissions, water and forests, on its own platform","Correct: CDP is a carbon disclosure platform covering these topics."],["Credit ratings of countries and their government bonds","Incorrect: that is rating agencies."],["Board pay in banks","Incorrect: not CDP."],["Stock prices of green firms","Incorrect: not CDP."]],"c":[0],"es":"CDP = plattform for utslipp, vann, skog og leverandørkjede.","ed":"Slide 4: CDP (tidligere Carbon Disclosure Project) samler data fra investorer, selskaper, byer og regioner om klimagassutslipp, vann, skog og leverandørkjede, på sin egen nettplattform. Den er tilpasset TCFD. Husk: CDP = egen plattform.\n\nForkortelser: TCFD = Task Force on Climate-related Financial Disclosures (rammeverk for klimarisiko-rapportering); CDP = tidligere Carbon Disclosure Project (plattform for klimarapportering).","kt":"","src":"L7 slide 4"},{"id":"DF057","l":"L7","t":"Six capitals","f":"m","d":1,"p":"H","sc":"none","s":"Which is one of the six capitals in integrated reporting (<IR>)?","o":[["Political capital","Incorrect: not one of the six."],["Brand capital","Incorrect: brand falls under intellectual capital."],["Venture capital","Incorrect: that is a type of financing."],["Natural capital","Correct: the six capitals are financial, manufactured, intellectual, human, social and relationship, and natural."]],"c":[3],"es":"Seks capitals: financial, manufactured, intellectual, human, social & relationship, natural.","ed":"Slide 10: integrated reporting bruker seks kapitaler: financial, manufactured (bygg, maskiner), intellectual (patenter, merkevare), human (kompetanse), social and relationship (tillit, relasjoner) og natural (natur, ressurser). Husk: F-M-I-H-S-N.\n\nForkortelser: IR = Integrated Reporting (integrert rapport om hvordan firmaet skaper verdi).","kt":"","src":"L7 slide 10"},{"id":"DF058","l":"L7","t":"EU Taxonomy","f":"m","d":1,"p":"H","sc":"none","s":"The EU Taxonomy is:","o":[["A tax on polluting firms","Incorrect: despite the name, it is not a tax."],["A rating of EU countries","Incorrect: it classifies activities, not countries."],["Definitions of which activities are sustainable","Correct: it gives common definitions to guide investment and prevent greenwashing."],["A list of sectors that EU investors are banned from","Incorrect: it does not ban anything."]],"c":[2],"es":"EU Taxonomy = definisjoner av hvilke aktiviteter som er bærekraftige.","ed":"Slide 21: EU Taxonomy gir felles definisjoner av hvilke økonomiske aktiviteter som er miljømessig bærekraftige. Mål: nå EUs klimamål, beskytte investorer mot greenwashing, hjelpe firmaer å bli grønnere og flytte kapital dit den trengs. Husk: taxonomy = klassifisering, ikke skatt.","kt":"","src":"L7 slide 21"},{"id":"DF059","l":"L7","t":"CSRD","f":"m","d":1,"p":"H","sc":"none","s":"The CSRD replaced the NFRD and:","o":[["Only applies to banks","Incorrect: it applies to companies broadly."],["Covers many more companies (about 50,000)","Correct: CSRD expands mandatory sustainability reporting from about 12,000 to 50,000 firms."],["Made sustainability reporting voluntary for all firms","Incorrect: it is mandatory."],["Covers only climate","Incorrect: it covers E, S and G."]],"c":[1],"es":"CSRD erstattet NFRD og dekker ca. 50 000 selskaper.","ed":"Slide 20: Non-Financial Reporting Directive (NFRD) dekket ca. 12 000 selskaper. Den er erstattet av Corporate Sustainability Reporting Directive (CSRD), som dekker ca. 50 000. SFDR gjelder forvaltere, pensjonsfond og forsikringsselskaper. Husk: CSRD = obligatorisk og bredere.\n\nForkortelser: CSRD = Corporate Sustainability Reporting Directive (EUs lov om bærekraftsrapportering); SFDR = Sustainable Finance Disclosure Regulation (EU-regler som deler fond i Article 6/8/9).","kt":"","src":"L7 slide 20"},{"id":"DF060","l":"L7","t":"Voluntary vs mandatory reporting","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Research finds that a fully voluntary CSR approach makes greenwashing easier.","o":[["True","Correct. The slide says purely voluntary CSR helps greenwashing spread, and suggests mixing voluntary and mandatory rules."],["False","Incorrect. The slide says purely voluntary CSR helps greenwashing spread, and suggests mixing voluntary and mandatory rules."]],"c":[0],"es":"Sant. Helt frivillig = mer greenwashing.","ed":"Slide 26: forskningen finner at en helt frivillig CSR-tilnærming gjør det lettere å spre greenwashing. Forslaget er en kombinasjon av frivillige og obligatoriske elementer. Husk: frivillig alene er ikke nok.\n\nForkortelser: CSR = Corporate Social Responsibility (firmaets samfunnsansvar).","kt":"","src":"L7 slide 26"},{"id":"DF061","l":"L7","t":"ESG rating disagreement","f":"m","d":1,"p":"H","sc":"none","s":"What happens to disagreement between ESG data providers as more public information becomes available?","o":[["It disappears","Incorrect: the finding is the opposite."],["It stays the same","Incorrect: it changes."],["It only falls for large firms","Incorrect: not the finding."],["It increases","Correct: Kotsantonis finds disagreement rises with more public information."]],"c":[3],"es":"Mer info = mer uenighet mellom ESG-leverandører.","ed":"Slide 37: ESG-ratinger varierer fordi selskaper rapporterer ulikt, benchmarking (sammenligningsgruppe) betyr mye, og leverandørene er svært uenige. Overraskende nok øker uenigheten jo mer offentlig informasjon som finnes (Kotsantonis 2019). Husk: mer data ≠ mer enighet.","kt":"","src":"L7 slide 37"},{"id":"DF062","l":"L8","t":"Efficient frontier","f":"m","d":1,"p":"H","sc":"none","s":"The efficient frontier shows:","o":[["All possible portfolios","Incorrect: that is the feasible set."],["The lowest return for each risk level","Incorrect: that is the opposite."],["The highest expected return for each level of risk","Correct: it is the set of portfolios with maximum return for a given risk (Markowitz)."],["Which stocks have the best ESG scores in each sector","Incorrect: that would be an ESG ranking."]],"c":[2],"es":"Efficient frontier = høyest forventet avkastning for hvert risikonivå.","ed":"Slide 5–6: feasible set er alle mulige porteføljer; efficient set (frontier) er de som gir maks forventet avkastning for gitt risiko (Markowitz 1952). Med ESG legges en ekstra betingelse til (f.eks. utslippsgrense). Husk: frontier = beste avveining.","kt":"","src":"L8 slide 6"},{"id":"DF063","l":"L8","t":"Investment chain","f":"m","d":1,"p":"H","sc":"none","s":"In the investment chain, an asset manager is:","o":[["The entity that owns the financial assets","Incorrect: that is the asset owner."],["The one managing a portfolio for the asset owner","Correct: the manager oversees assets for the owner."],["The person who holds a share of the owner's assets","Incorrect: that is the beneficiary."],["The company the money is invested in","Incorrect: that is the investee firm."]],"c":[1],"es":"Asset manager forvalter porteføljen for asset owner.","ed":"Slide 14: investeringskjeden: beneficiaries/clients (f.eks. pensjonssparere) eier en andel hos asset owner (f.eks. pensjonsfond), som setter forvaltningen ut til asset managers (fondsforvaltere), som investerer i selskaper. Husk: owner eier, manager forvalter.","kt":"","src":"L8 slide 14"},{"id":"DF064","l":"L8","t":"SFDR Article 8","f":"m","d":1,"p":"H","sc":"none","s":"An SFDR Article 8 fund is one that:","o":[["Promotes environmental or social characteristics","Correct: Article 8 funds promote E or S characteristics among other goals."],["Has sustainable investment as its main objective","Incorrect: that is Article 9."],["Has no sustainability focus","Incorrect: that is Article 6."],["Must invest only in green bonds","Incorrect: not the rule."]],"c":[0],"es":"Article 8 = fremmer E/S-egenskaper.","ed":"Slide 24–26: Article 8 (\"light green\") fremmer miljø- eller sosiale egenskaper, ofte med exclusions, ESG integration og engagement. Article 9 (\"dark green\") har bærekraftig investering som mål, ofte thematic/impact. Mange fond ble nylig flyttet fra 9 til 8 for å unngå greenwashing-anklager. Husk: 8 = fremmer, 9 = mål.\n\nForkortelser: SFDR = Sustainable Finance Disclosure Regulation (EU-regler som deler fond i Article 6/8/9).","kt":"","src":"L8 slide 24"},{"id":"DF065","l":"L8","t":"SRI","f":"m","d":1,"p":"H","sc":"none","s":"SRI is an investment strategy that:","o":[["Considers only financial return","Incorrect: that is traditional investing."],["Gives up all financial return to maximise social good","Incorrect: that is charity."],["Only buys government bonds","Incorrect: SRI covers many asset classes."],["Considers both return and social or environmental good","Correct: this is the slide's definition of SRI."]],"c":[3],"es":"SRI = både avkastning og samfunnsnytte.","ed":"Slide 29: SRI (sustainable and responsible investing) vurderer både finansiell avkastning og sosial/miljømessig nytte for å skape positiv endring. Den unngår ofte \"sin\"-bransjer og brukes i mange aktivaklasser: aksjer, obligasjoner, eiendom, infrastruktur, råvarer. Husk: SRI = penger + godt.\n\nForkortelser: SRI = Socially Responsible Investing (ansvarlig investering).","kt":"","src":"L8 slide 29"},{"id":"DF066","l":"L8","t":"Negative screening","f":"m","d":1,"p":"H","sc":"none","s":"Negative screening means:","o":[["Selecting the best ESG firms in each sector","Incorrect: that is positive/best-in-class screening."],["Picking firms that benefit from a trend","Incorrect: that is thematic investing."],["Excluding investments using \"undesirable\" ESG criteria","Correct: it applies rules that rule out certain investments."],["Voting at company meetings to change company behaviour","Incorrect: that is stewardship."]],"c":[2],"es":"Negative screening = utelukke basert på uønskede ESG-kriterier.","ed":"Slide 43: negative screening bruker regler basert på \"undesirable\" ESG-kriterier for å bestemme hva som ikke er tillatt, ut fra etikk eller for å unngå risiko (f.eks. tobakk, stranded fossil assets). Husk: negative = ut.","kt":"","src":"L8 slide 43"},{"id":"DF067","l":"L8","t":"Best-in-class screening","f":"m","d":1,"p":"H","sc":"none","s":"Best-in-class screening means:","o":[["Excluding whole sectors","Incorrect: that is negative screening."],["Picking the top ESG firms in each sector","Correct: it selects the top ESG performers in each industry."],["Investing in a long-term theme like clean water","Incorrect: that is thematic investing."],["Measuring social impact","Incorrect: that is impact investing."]],"c":[1],"es":"Best-in-class = de beste på ESG i hver sektor.","ed":"Slide 45: positive/best-in-class screening velger bare selskaper som passerer en ESG-rangering innen hver sektor eller bransje, ofte basert på ESG-ratinger. Ingen sektor utelukkes helt. Husk: best i klassen = topp i hver sektor.","kt":"","src":"L8 slide 45"},{"id":"DF068","l":"L8","t":"Thematic investing","f":"m","d":1,"p":"H","sc":"none","s":"Thematic investing means:","o":[["Choosing assets that gain from long-term trends","Correct: it is a top-down choice of firms tied to a sustainability theme."],["Excluding sin stocks","Incorrect: that is negative screening."],["Ranking firms within each sector","Incorrect: that is best-in-class."],["Engaging with firms to change their behaviour on ESG issues","Incorrect: that is stewardship."]],"c":[0],"es":"Thematic = investere i et tema/trend, f.eks. rent vann.","ed":"Slide 48: thematic investing bygger en portefølje top-down av selskaper som ventes å tjene på bestemte trender, f.eks. clean tech, bærekraftig landbruk eller klimatiltak. Eksempel: et SDG 6-fond for rent vann. Husk: tema = trend.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger).","kt":"","src":"L8 slide 48"},{"id":"DF069","l":"L8","t":"ESG integration","f":"m","d":1,"p":"H","sc":"none","s":"ESG integration means:","o":[["Excluding all firms with low ESG ratings from the portfolio","Incorrect: that is screening."],["Giving money to charities","Incorrect: that is philanthropy."],["Only reporting ESG data","Incorrect: reporting is not integration."],["Using material ESG information in the investment analysis","Correct: ESG inputs go into cash flow forecasts or cost of capital."]],"c":[3],"es":"ESG integration = material ESG-info inn i analysen.","ed":"Slide 53: ESG integration betyr å finne ESG-informasjon, vurdere om den er material, og bruke den i analysen, f.eks. i kontantstrømprognoser eller kapitalkostnad. Husk: ESG inn i tallene.","kt":"","src":"L8 slide 53"},{"id":"DF070","l":"L8","t":"Stewardship","f":"m","d":1,"p":"H","sc":"none","s":"Stewardship means:","o":[["Selling all risky stocks","Incorrect: that is exit/divestment."],["Managing a firm's own staff","Incorrect: that is HR."],["Using investor rights to protect long-term value","Correct: this is the slide's definition of stewardship."],["Buying only cheap index funds that follow the market","Incorrect: that is passive investing."]],"c":[2],"es":"Stewardship = bruke eierrettigheter for langsiktig verdi.","ed":"Slide 56: stewardship er bruk av investorrettigheter og innflytelse for å beskytte og øke langsiktig verdi for kunder og begunstigede, inkludert felles økonomiske, sosiale og miljømessige verdier. Eksempel: LGIM og Glencore (dialog → forslag → salg). Husk: stewardship = aktivt eierskap.","kt":"","src":"L8 slide 56"},{"id":"DF071","l":"L8","t":"Impact investing","f":"m","d":1,"p":"H","sc":"none","s":"Impact investing is:","o":[["Donating money with no return","Incorrect: impact investing is not charity."],["Investing for measured impact plus a return","Correct: intention, measurement and financial return define impact investing."],["Excluding fossil fuel firms","Incorrect: that is negative screening."],["Investing in firms with high ESG ratings from MSCI","Incorrect: ratings do not measure impact."]],"c":[1],"es":"Impact investing = målbar positiv effekt + finansiell avkastning.","ed":"Slide 61: impact investing er investering med intensjon om positiv, målbar sosial eller miljømessig effekt ved siden av finansiell avkastning, og effekten måles aktivt. Ofte via private equity med konsentrert eierskap og lang horisont. Husk: intention + measurement + return.\n\nForkortelser: MSCI = stor leverandør av indekser og ESG-ratinger.","kt":"","src":"L8 slide 61"},{"id":"DF072","l":"L8","t":"Passive investors and exit","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Passive index investors can use exit (\"Wall Street Walk\") as a governance tool.","o":[["True","Incorrect. Passive investors must hold the index, so they cannot use exit; they can still vote."],["False","Correct. Passive investors must hold the index, so they cannot use exit; they can still vote."]],"c":[1],"es":"Usant. Passive investorer kan ikke selge (exit).","ed":"Slide 71: aktive investorer kan bruke voting, engagement og exit. Passive investorer kan stemme, men exit (selge, \"Wall Street Walk\") er ikke mulig fordi de må eie hele indeksen. Engagement er usikkert. Husk: passiv = ingen exit.","kt":"","src":"L8 slide 71"},{"id":"DF073","l":"L9","t":"Cash flow channel","f":"m","d":1,"p":"H","sc":"none","s":"Through the cash flow channel, ESG affects firm value via:","o":[["Only the discount rate used to value the firm","Incorrect: that is the cost of capital channel."],["The number of shares","Incorrect: not part of the channel."],["The firm's ESG rating only","Incorrect: ratings are not a cash flow item."],["Revenues, costs, capex and stranded assets","Correct: these are the items listed under the cash flow channel."]],"c":[3],"es":"Cash flow channel: inntekter, kostnader, investeringer, stranded assets.","ed":"Slide 3: ESG påvirker firmaverdien gjennom to kanaler. Cash flow channel: inntekter, kostnader (inkl. søksmål), capex og stranded assets. Cost of capital channel: diskonteringsrenten. Husk: to kanaler, kontantstrøm og kapitalkostnad.","kt":"","src":"L9 slide 3"},{"id":"DF074","l":"L9","t":"Relative vs absolute valuation","f":"m","d":1,"p":"H","sc":"none","s":"A DCF model is an example of:","o":[["Relative valuation","Incorrect: relative valuation uses multiples and peers, like P/E."],["Credit rating","Incorrect: that is a rating."],["Absolute valuation","Correct: a DCF values the firm from its own discounted cash flows."],["Negative screening","Incorrect: that is an investment strategy."]],"c":[2],"es":"DCF = absolute valuation. Multiples = relative.","ed":"Slide 4: relative valuation bruker multipler som P/E sammenlignet med peers. Absolute valuation (DCF) diskonterer firmaets egne fremtidige kontantstrømmer med WACC. DCF gjør det lettere å legge inn ESG-effekter. Husk: absolutt = egne kontantstrømmer.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad); DCF = Discounted Cash Flow (verdsettelse ved å diskontere fremtidige kontantstrømmer).","kt":"","src":"L9 slide 4"},{"id":"DF075","l":"L9","t":"WACC","f":"m","d":1,"p":"H","sc":"none","s":"WACC is:","o":[["The rate of return the firm earns on its cash only","Incorrect: not the definition."],["A blended return for all sources of capital","Correct: it combines the cost of equity and debt."],["The growth rate of sales","Incorrect: that is g."],["The firm's tax rate","Incorrect: tax is separate."]],"c":[1],"es":"WACC = vektet kapitalkostnad for egenkapital og gjeld.","ed":"Slide 5 (McKinsey): WACC er en blandet avkastningsrate for alle kapitalkilder (egenkapital og gjeld). Den brukes til å diskontere fri kontantstrøm i en DCF. Husk: WACC = snittprisen på kapital.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad); DCF = Discounted Cash Flow (verdsettelse ved å diskontere fremtidige kontantstrømmer).","kt":"","src":"L9 slide 5"},{"id":"DF076","l":"L9","t":"Enterprise to equity value","f":"m","d":1,"p":"H","sc":"none","s":"To go from enterprise value to equity value, you:","o":[["Subtract non-equity claims like debt","Correct: equity value = enterprise value minus debt and other non-equity claims."],["Add the debt","Incorrect: debt must be subtracted."],["Multiply the enterprise value by the P/E ratio","Incorrect: that is relative valuation."],["Divide by WACC","Incorrect: not the step."]],"c":[0],"es":"Equity value = enterprise value − gjeld (og andre ikke-egenkapitalkrav).","ed":"Slide 5 steg 5: fra enterprise value til equity value trekker man fra krav som ikke er egenkapital: gjeld, pensjonsforpliktelser, leasing, ansatteopsjoner. I CESGA-eksempelet legges også kontanter til. Husk: EV − gjeld + kontanter = equity.\n\nForkortelser: WACC = Weighted Average Cost of Capital (vektet kapitalkostnad); EV = Enterprise Value (verdien for alle kapitalgivere).","kt":"","src":"L9 slide 5"},{"id":"DF077","l":"L9","t":"Taste premium","f":"m","d":1,"p":"H","sc":"none","s":"The \"taste premium\" means green assets have lower expected returns because:","o":[["Green firms are riskier, so investors demand more","Incorrect: more risk would mean higher returns."],["Green firms pay no dividends","Incorrect: not the reason."],["Governments tax green assets","Incorrect: not the reason."],["Investors like green, so prices rise","Correct: higher demand raises prices and lowers expected returns."]],"c":[3],"es":"Taste premium = investorer liker grønt → høyere pris → lavere avkastning.","ed":"Slide 15: grønne aktiva bør ha lavere forventet avkastning av to grunner. Taste premium: investorer liker grønt, prisen stiger og avkastningen faller. Risk premium: grønne aktiva er en bedre sikring mot klimarisiko. Men realisert avkastning kan bli høy hvis etterspørselen skifter uventet. Husk: smak + sikring = lavere forventet avkastning.","kt":"","src":"L9 slide 15"},{"id":"DF078","l":"L9","t":"CAPM and alpha","f":"m","d":1,"p":"H","sc":"none","s":"Under CAPM, an asset with expected return below the security market line (α < 0) is:","o":[["Underpriced","Incorrect: underpriced assets lie above the SML."],["Risk-free","Incorrect: not related."],["Overpriced","Correct: its return is too low for its risk, so its price is too high."],["Fairly priced","Incorrect: fair price lies on the SML."]],"c":[2],"es":"Under SML (α < 0) = overpriset.","ed":"Slide 20: CAPM sier E(Ra) = Rf + β(E(Rm) − Rf). Hvis forventet avkastning er for lav gitt risikoen (α < 0), er aksjen overpriset. Prisen faller til avkastningen er tilbake på SML. Husk: under linjen = for dyr.\n\nForkortelser: SML = Security Market Line (linjen for krav til avkastning gitt beta); CAPM = Capital Asset Pricing Model.","kt":"","src":"L9 slide 20"},{"id":"DF079","l":"L9","t":"Systematic risk","f":"m","d":1,"p":"H","sc":"none","s":"In APT, a risk factor that earns a premium must be:","o":[["Specific to one firm","Incorrect: firm-specific risk can be diversified away."],["Systematic (cannot be diversified away)","Correct: only undiversifiable risk earns a premium."],["Linked to the firm's ESG ratings and scores","Incorrect: not required."],["Set by regulators","Incorrect: not the definition."]],"c":[1],"es":"Risikopremie bare for systematisk (udiversifiserbar) risiko.","ed":"Slide 21: i APT avhenger forventet avkastning av flere systematiske risikofaktorer λ. β er hvor følsom aksjen er for faktoren. Faktoren må være udiversifiserbar for å gi premie. Spørsmålet i L9 er om ESG er en slik faktor. Husk: bare systematisk risiko prises.\n\nForkortelser: APT = Arbitrage Pricing Theory (flerfaktormodell).","kt":"","src":"L9 slide 21"},{"id":"DF080","l":"L9","t":"ESG as a risk factor","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Research agrees that ESG is a robust risk factor that earns a return premium.","o":[["True","Incorrect. There is little agreement: some studies find ESG adds to returns, others that it detracts."],["False","Correct. There is little agreement: some studies find ESG adds to returns, others that it detracts."]],"c":[1],"es":"Usant. Ingen enighet om ESG som robust faktor.","ed":"Slide 26: en faktor bør ha bred akademisk støtte og være robust på tvers av definisjoner og land. For ESG er det lite enighet: noen studier finner at ESG øker avkastningen, andre at den senker den. Slide 27: \"There is still an ongoing debate in academia!\". Husk: ESG-faktor = uavklart.","kt":"","src":"L9 slide 26"},{"id":"DF081","l":"L9","t":"Strategies and objectives","f":"m","d":1,"p":"H","sc":"none","s":"In Schoenmaker and Schramade's framework, ESG integration aims to:","o":[["Maximise financial value only","Incorrect: that is risk/return optimisation."],["Maximise FV subject to a minimum SEV","Incorrect: that is exclusionary screening."],["Maximise SEV subject to a minimum FV","Incorrect: that is impact investing."],["Maximise integrated value (FV + SEV)","Correct: ESG integration maximises IV = financial + social-environmental value."]],"c":[3],"es":"ESG integration = maks IV = FV + SEV.","ed":"Slide 29: fire mål: risk/return optimisation (maks FV), exclusionary screening (maks FV gitt minimum SEV), ESG integration (maks IV = FV + SEV), impact investing (maks SEV gitt minimum FV). Husk: screening = 1.0, integration = 2.0, impact = 3.0.\n\nForkortelser: IV = Integrated Value (F + S + E); SEV = Social and Environmental Value (S + E).","kt":"","src":"L9 slide 29"},{"id":"DF082","l":"L9","t":"GIIN impact criteria","f":"m","d":1,"p":"H","sc":"none","s":"Which is one of GIIN's impact investing criteria?","o":[["Zero financial return","Incorrect: return expectations are required (\"not charity\")."],["Only public equity","Incorrect: impact spans many asset classes."],["Impact measurement","Correct: GIIN lists intentionality, return expectations, range of returns and asset classes, and impact measurement."],["A top ESG rating","Incorrect: not a criterion."]],"c":[2],"es":"GIIN: intentionality, return, range, measurement.","ed":"Slide 36: GIIN (Global Impact Investing Network) har fire kriterier: intentionality (vil gjøre verden bedre), return expectations (ikke veldedighet), range of return expectations and asset classes, og impact measurement. Husk: intention + measurement, ikke charity.\n\nForkortelser: GIIN = Global Impact Investing Network.","kt":"","src":"L9 slide 36"},{"id":"DF083","l":"L10","t":"Debt vs equity payoff","f":"m","d":1,"p":"H","sc":"none","s":"Debt holders' payoff is:","o":[["Unlimited if the firm does well","Incorrect: that describes equity holders."],["Capped at the face value D","Correct: debt holders get at most D, so they have downside but no upside."],["Always zero","Incorrect: they are paid up to D."],["The same as equity holders'","Incorrect: the payoffs differ."]],"c":[1],"es":"Gjeld: maks D (ingen oppside). Egenkapital: alt over D.","ed":"Slide 3: debt holders (obligasjoner og lån) får min(verdi, D): de får maks pålydende og bærer nedsiden. Equity holders får max(verdi − D, 0): ubegrenset oppside, som en call option. Derfor bryr kreditorer seg mest om nedside-risiko. Husk: gjeld = tak, aksje = opsjon.","kt":"","src":"L10 slide 3"},{"id":"DF084","l":"L10","t":"Bond valuation drivers","f":"m","d":1,"p":"H","sc":"none","s":"Which is a driver of corporate bond value?","o":[["Loss given default","Correct: corporate bonds depend on default risk, loss given default, liquidity and credit migration."],["GDP per capita","Incorrect: that is a sovereign bond driver."],["External debt of a country","Incorrect: that is a sovereign driver."],["Country default history","Incorrect: that is a sovereign driver."]],"c":[0],"es":"Selskapsobligasjon: default risk, LGD, likviditet, credit migration.","ed":"Slide 4: statsobligasjoner drives av BNP, vekst, BNP per innbygger, inflasjon, utenlandsgjeld og historikk. Selskapsobligasjoner drives av default risk, loss given default, liquidity risk og credit migration risk. Husk: land = makro, selskap = kreditt.\n\nForkortelser: GDP = Gross Domestic Product (BNP); LGD = Loss Given Default (tap ved mislighold).","kt":"","src":"L10 slide 4"},{"id":"DF085","l":"L10","t":"Green Bond Principles","f":"m","d":1,"p":"H","sc":"none","s":"Under the Green Bond Principles, \"use of proceeds\" means:","o":[["The coupon depends on ESG targets","Incorrect: that is a sustainability-linked bond."],["The bond is backed by the green project only","Incorrect: green bonds are not ring-fenced."],["Investors get a tax break","Incorrect: not part of the principles."],["The money raised goes only to green projects","Correct: proceeds must be used exclusively for green projects."]],"c":[3],"es":"Use of proceeds = pengene går bare til grønne prosjekter.","ed":"Slide 10: Green Bond Principles har fire kjernedeler: use of proceeds (kun grønne prosjekter), process for project evaluation and selection, management of proceeds (egen konto, sporet) og reporting (obligatorisk om bruken). Husk: bruk, vurdering, forvaltning, rapport.","kt":"","src":"L10 slide 10"},{"id":"DF086","l":"L10","t":"Bond labels","f":"m","d":1,"p":"H","sc":"none","s":"A bond where the coupon is tied to the issuer meeting sustainability targets is a:","o":[["Green bond","Incorrect: green bonds earmark money for green projects."],["Social bond","Incorrect: social bonds earmark money for social projects."],["Sustainability-linked bond","Correct: SLB terms depend on meeting KPIs, while the money can be used freely."],["Catastrophe bond tied to disaster losses","Incorrect: cat bonds transfer disaster risk."]],"c":[2],"es":"SLB = kupong knyttet til bærekraftsmål.","ed":"Slide 9 lister prinsippene fra ICMA: Green Bond Principles, Social Bond Principles, Sustainability Bond Guidelines og Sustainability-Linked Bond Principles. Green/social/sustainability bonds øremerker pengene; SLB knytter vilkårene (kupong) til KPI-mål. Husk: øremerket vs mål.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLB = Sustainability-Linked Bond (obligasjon der kupongen avhenger av bærekraftsmål).","kt":"","src":"L10 slide 9"},{"id":"DF087","l":"L10","t":"Green bond signalling","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Flammer (2021) finds that issuing green bonds works as a credible signal of environmental commitment.","o":[["True","Correct. Stock prices rise and environmental performance improves after issuance, consistent with signalling."],["False","Incorrect. Stock prices rise and environmental performance improves after issuance, consistent with signalling."]],"c":[0],"es":"Sant. Green bonds = troverdig signal.","ed":"Slide 13: investorer reagerer positivt på green bond-utstedelse (særlig første gang og med sertifisering), og utstederne får bedre miljøratinger, lavere utslipp og flere langsiktige og grønne eiere etterpå. Det støtter signalling. Husk: grønn obligasjon = signal.","kt":"","src":"L10 slide 13"},{"id":"DF088","l":"L10","t":"Bond market leverage","f":"m","d":1,"p":"H","sc":"none","s":"Why can bond investors push firms on sustainability?","o":[["Firms must refinance their debt regularly","Correct: maturity and refinancing needs give bondholders influence."],["Bondholders vote at every AGM","Incorrect: bondholders usually do not vote."],["Bonds give unlimited upside","Incorrect: bond payoffs are capped."],["Bond markets are smaller than equity markets","Incorrect: they are larger."]],"c":[0],"es":"Refinansiering gir obligasjonseiere makt.","ed":"Slide 12: obligasjoner er relevante for bærekraft fordi firmaer må refinansiere når lånet forfaller, markedet er større enn aksjemarkedet, man kan shorte \"dårlige\" obligasjoner, og det gir rom for engagement og signalling. Eksempel: Adani etter short-angrepet. Husk: forfall = påvirkning.\n\nForkortelser: AGM = Annual General Meeting (generalforsamling).","kt":"","src":"L10 slide 12"},{"id":"DF089","l":"L10","t":"Real estate cycle","f":"m","d":1,"p":"H","sc":"none","s":"In the real estate investment cycle, working with tenants on ESG belongs to the:","o":[["Deal sourcing stage","Incorrect: that is screening and due diligence."],["Investment decision stage","Incorrect: that is presenting to the committee."],["Sale stage","Incorrect: that is adding value at exit."],["Ownership stage","Correct: ownership includes managing the asset, property managers and tenant engagement."]],"c":[3],"es":"Leietaker-samarbeid = ownership-fasen.","ed":"Slide 18: eiendomssyklusen: deal sourcing (finn material ESG-issues i screening og due diligence), investment decision (presenter for investeringskomiteen), ownership (ESG i driften, eksterne forvaltere, engasjement med leietakere) og sale (verdiøkning ved salg). Husk: drift = ownership.","kt":"","src":"L10 slide 18"},{"id":"DF090","l":"L11","t":"Role of banks","f":"m","d":1,"p":"H","sc":"none","s":"A main role of banks is to:","o":[["Set the country's interest rate","Incorrect: that is the central bank."],["Insure people and firms against natural disasters","Incorrect: that is insurance."],["Screen borrowers and monitor them","Correct: banks screen ex-ante and monitor ex-post."],["Run stock exchanges","Incorrect: not a bank role."]],"c":[2],"es":"Banker screener før lån og overvåker etterpå.","ed":"Slide 6–7: banker finansierer økonomien, særlig små og mellomstore bedrifter. De screener før lån (mot adverse selection) og overvåker etterpå (mot moral hazard). Lånene finansieres med innskudd, og profitten kommer fra spreaden mellom utlåns- og innskuddsrente. Husk: screen + monitor.","kt":"","src":"L11 slide 6"},{"id":"DF091","l":"L11","t":"Bank balance sheet","f":"m","d":1,"p":"H","sc":"none","s":"A bank typically funds long-term loans with:","o":[["Mostly equity","Incorrect: banks have thin equity."],["Short-term deposits","Correct: banks provide long-term loans funded by short-term deposits."],["Insurance premiums paid by customers","Incorrect: that is insurers."],["Government grants","Incorrect: not the main funding."]],"c":[1],"es":"Lange lån finansiert med korte innskudd.","ed":"Slide 9: bankens balanse: eiendeler er mest lån; gjeld er mest innskudd, med tynn egenkapital. P&L: + renteinntekter + gebyrer − rentekostnader − tap på lån − kostnader. \"Banks provide long-term loans funded by short-term deposits\", som gir likviditetsrisiko. Husk: innskudd = gjeld, lån = eiendel.","kt":"","src":"L11 slide 9"},{"id":"DF092","l":"L11","t":"Credit risk","f":"m","d":1,"p":"H","sc":"none","s":"Credit risk is:","o":[["The risk that a borrower defaults","Correct: credit risk is counterparty default risk."],["The risk that depositors withdraw money","Incorrect: that is liquidity risk."],["The risk of a cyber attack","Incorrect: that is operational risk."],["The risk of bad press","Incorrect: that is reputational risk."]],"c":[0],"es":"Credit risk = risikoen for at låntakeren ikke betaler.","ed":"Slide 10: bankrisikoer: makro/markedsrisiko, credit risk (motparten misligholder; indirekte alle risikoer kunden har), liquidity risk (innskytere tar ut penger), operasjonell, omdømme- og politisk risiko. Husk: kundens ESG-risiko blir bankens credit risk.","kt":"","src":"L11 slide 10"},{"id":"DF093","l":"L11","t":"Risk-based vs value-based banking","f":"m","d":1,"p":"H","sc":"none","s":"Value-based banking (SF 3.0) means:","o":[["Excluding risky sectors","Incorrect: that is SF 1.0, risk based."],["Adding ESG risks to the risk premium on each loan","Incorrect: that is SF 2.0, still risk based."],["Lending only to large firms","Incorrect: not the definition."],["Lending with impact first, like microfinance","Correct: the table puts impact lending and microfinance under SF 3.0, value based."]],"c":[3],"es":"Value-based = SF 3.0 = impact lending og microfinance.","ed":"Slide 18: SF 1.0 i banking = exclusion (risk based). SF 2.0 = ESG integrert i kredittrisikostyringen, synlig i risikopremien (risk based). SF 3.0 = impact lending og microfinance (value based). Husk: 1.0–2.0 = risk, 3.0 = value.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L11 slide 18"},{"id":"DF094","l":"L11","t":"Green loans vs SLLs","f":"m","d":1,"p":"H","sc":"none","s":"A sustainability-linked loan (SLL) is a loan where:","o":[["The money must go to clearly defined green projects","Incorrect: that is a green loan."],["There is no interest","Incorrect: SLLs carry interest."],["The interest rate is linked to ESG scores or KPIs","Correct: SLL proceeds can be used freely, but the rate depends on sustainability improvement."],["Only governments can borrow","Incorrect: SLLs are used by firms in many sectors."]],"c":[2],"es":"SLL = renten knyttet til ESG-score/KPI.","ed":"Slide 24–25: green loans: pengene spores og brukes til grønne prosjekter. Sustainability-linked loans: pengene kan brukes fritt, men renten knyttes til forbedring i ESG-score eller KPI-er. Husk: green = prosjekt, SLL = mål.\n\nForkortelser: KPI = Key Performance Indicator (målbart nøkkeltall); SLL = Sustainability-Linked Loan (lån der renten avhenger av bærekraftsmål).","kt":"","src":"L11 slide 24"},{"id":"DF095","l":"L11","t":"Equator Principles","f":"m","d":1,"p":"H","sc":"none","s":"The Equator Principles are:","o":[["EU law on bank capital","Incorrect: that is banking regulation."],["A benchmark for E&S risk in projects","Correct: they are a voluntary industry benchmark for project finance."],["UN goals for ending poverty and hunger in poor countries","Incorrect: that is the SDGs."],["A credit rating method","Incorrect: not the definition."]],"c":[1],"es":"Equator Principles = rammeverk for miljø- og sosial risiko i prosjektfinans.","ed":"Slide 26: Equator Principles er en bransjestandard for å vurdere og håndtere miljø- og sosial risiko i prosjekter, med blant annet risikokategorisering, miljøvurdering, stakeholder engagement, klagemekanisme og uavhengig gjennomgang. Foreleser: detaljer testes ikke, men kjenn til dem. Husk: Equator = prosjektfinans.\n\nForkortelser: SDG = Sustainable Development Goals (FNs 17 bærekraftsmål, f.eks. SDG 2 = zero hunger); E&S = Environmental and Social (miljø og sosialt).","kt":"","src":"L11 slide 26"},{"id":"DF096","l":"L11","t":"Green Asset Ratio","f":"m","d":1,"p":"H","sc":"none","s":"The Green Asset Ratio (GAR) shows:","o":[["The share of loans aligned with the EU Taxonomy","Correct: GAR measures taxonomy-aligned assets."],["The bank's own carbon emissions per employee per year","Incorrect: not GAR."],["The interest on green deposits","Incorrect: not GAR."],["The number of green branches","Incorrect: not GAR."]],"c":[0],"es":"GAR = andel taxonomy-tilpassede eiendeler i banken.","ed":"Slide 30–31: under EBA Pillar 3 må børsnoterte banker rapportere ESG-risiko, inkludert Green Asset Ratio: andelen eksponeringer i aktiviteter som oppfyller EU Taxonomy og bidrar til klimatiltak eller -tilpasning. Husk: GAR bygger på taxonomy.\n\nForkortelser: GAR = Green Asset Ratio (andel grønne lån etter EU Taxonomy).","kt":"","src":"L11 slide 31"},{"id":"DF097","l":"L12","t":"Role of insurers","f":"m","d":1,"p":"H","sc":"none","s":"Insurers reduce the impact of risk mainly by:","o":[["Lending money to firms","Incorrect: that is banks."],["Setting carbon prices","Incorrect: that is governments."],["Buying only safe government bonds with the premiums","Incorrect: that is just one asset choice."],["Pooling the risks of many clients","Correct: pooling spreads the financial impact of risks across clients."]],"c":[3],"es":"Forsikring = pooling av risiko fra mange kunder.","ed":"Slide 6: forsikringens rolle er risk transfer, risk pricing og risk management. Ved å samle mange kunders risiko i en pool spres den økonomiske virkningen. Life insurance (død, uførhet, pensjon) er stabilt; non-life (naturkatastrofer, brann, ulykker) er vanskeligere å modellere. Husk: pool = spre risiko.","kt":"","src":"L12 slide 6"},{"id":"DF098","l":"L12","t":"Technical provisions","f":"m","d":1,"p":"H","sc":"none","s":"On an insurer's balance sheet, technical provisions cover:","o":[["Unexpected claims","Incorrect: equity covers unexpected claims."],["Staff salaries","Incorrect: those are expenses."],["Expected claims","Correct: technical provisions cover expected claims; equity covers unexpected claims."],["Dividends","Incorrect: not provisions."]],"c":[2],"es":"Technical provisions = forventede krav.","ed":"Slide 8: forsikringsselskapets gjeldsside består av technical provisions (dekker forventede krav) og egenkapital (dekker uventede krav). Eiendelssiden viser at forsikringsselskaper også er store kapitalforvaltere. P&L: + premie + investeringsinntekt − krav − kostnader. Husk: forventet = avsetning, uventet = egenkapital.","kt":"","src":"L12 slide 8"},{"id":"DF099","l":"L12","t":"Catastrophe modelling","f":"m","d":1,"p":"H","sc":"none","s":"Catastrophe modelling is used to:","o":[["Set the interest rate on loans","Incorrect: that is credit pricing."],["Estimate losses from floods, storms and quakes","Correct: cat models estimate potential losses from catastrophic events."],["Score ESG ratings","Incorrect: not cat modelling."],["Value a listed firm with a discounted cash flow model","Incorrect: that is equity valuation."]],"c":[1],"es":"Cat modelling = anslå tap fra naturkatastrofer.","ed":"Slide 13 og 15: risk modeling bruker matematiske modeller for å anslå tap. Scenario analysis ser på mange mulige utfall. Catastrophe modelling anslår tap fra jordskjelv, orkaner, flom osv., med delene hazard, vulnerability, exposure, financial loss og platform. Husk: cat model = katastrofer.","kt":"","src":"L12 slide 13"},{"id":"DF100","l":"L12","t":"Expected vs unexpected loss","f":"m","d":1,"p":"H","sc":"none","s":"In a loss distribution, unexpected loss is:","o":[["Loss above the expected loss, up to the confidence level","Correct: UL runs from the mean (EL) up to the VaR quantile."],["The average loss","Incorrect: that is expected loss."],["A loss that never happens","Incorrect: unexpected losses do happen."],["A loss that is covered by the technical provisions","Incorrect: provisions cover expected loss."]],"c":[0],"es":"Unexpected loss = tap over snittet opp til konfidensnivået.","ed":"Slide 16: expected loss (EL) er snittet. Unexpected loss (UL) er tap over EL opp til konfidensnivået (VaR). Halen utenfor er de mest ekstreme tapene. Koblet til balansen: EL dekkes av technical provisions, UL av egenkapital. Husk: EL = avsetning, UL = egenkapital.","kt":"","src":"L12 slide 16"},{"id":"DF101","l":"L12","t":"Catastrophe bonds","f":"m","d":1,"p":"H","sc":"none","s":"A catastrophe bond is a bond that:","o":[["Pays a higher coupon to investors after a disaster happens","Incorrect: payments are reduced, not increased."],["Funds only green projects","Incorrect: that is a green bond."],["Is backed by the government","Incorrect: not the definition."],["Lets the issuer skip payments after a disaster","Correct: investors bear the disaster risk in exchange for a higher yield."]],"c":[3],"es":"Cat bond = utsteder kan stoppe betaling hvis katastrofe skjer.","ed":"Slide 18: katastrofer er for store for ett forsikringsselskap, så risikoen deles med reforsikring, offentlige ordninger (f.eks. US National Flood Insurance Programme) og catastrophe bonds: obligasjoner der utsteder kan hoppe over eller utsette betalinger ved et katastrofetap. Husk: cat bond = investor tar katastroferisiko.","kt":"","src":"L12 slide 18"},{"id":"DF102","l":"L12","t":"Solvency II","f":"t","d":1,"p":"H","sc":"none","s":"True or false: Solvency II is EU insurance regulation that mainly focuses on capital requirements.","o":[["True","Correct. Solvency II harmonises EU insurance rules with a primary focus on capital requirements."],["False","Incorrect. Solvency II harmonises EU insurance rules with a primary focus on capital requirements."]],"c":[0],"es":"Sant. Solvency II = kapitalkrav for forsikring.","ed":"Slide 25: Solvency II er EUs regelverk for forsikring med hovedfokus på kapitalkrav; fra august 2022 integrerer det bærekraftsrisiko i risikostyring. Insurance Distribution Directive (IDD) regulerer hvordan produkter lages og selges, og krever nå at bærekraft tas med i rådgivningen. Husk: Solvency II = kapital, IDD = salg.\n\nForkortelser: IDD = Insurance Distribution Directive (EU-regler for salg av forsikring).","kt":"","src":"L12 slide 25"},{"id":"DF103","l":"L12","t":"Microinsurance","f":"m","d":1,"p":"H","sc":"none","s":"Microinsurance is:","o":[["Insurance for very small risks in rich countries","Incorrect: the target is low-income people."],["Protection for low-income people and small firms","Correct: it covers health and property risks for poor households."],["Small loans to entrepreneurs","Incorrect: that is microcredit."],["Insurance only for large firms with many employees","Incorrect: the opposite."]],"c":[1],"es":"Microinsurance = forsikring for lavinntektsfolk og småbedrifter.","ed":"Slide 27: microinsurance gir finansiell beskyttelse til lavinntektsfolk og mikrobedrifter mot helse- og eiendomsrisiko (f.eks. avlingsforsikring). Det hjelper dem å tåle sjokk og unngå fattigdomsfellen. Tilbydere: kommersielle selskaper, samvirker, mikrofinansinstitusjoner. Husk: lite premie, stor beskyttelse.","kt":"","src":"L12 slide 27"},{"id":"DF104","l":"L13","t":"Coalition motives","f":"m","d":1,"p":"H","sc":"none","s":"Joining a coalition because competitors have joined is called:","o":[["Peer effect","Correct: membership of peers pushes firms to join to avoid a competitive disadvantage."],["Collective advocacy","Incorrect: that is lobbying on policy together."],["Risk avoidance","Incorrect: that is avoiding stranded assets."],["Outside pressure","Incorrect: that comes from consumers, investors or NGOs."]],"c":[0],"es":"Peer effect = bli med fordi konkurrentene er med.","ed":"Slide 4: seks motiver for å bli med i en koalisjon: collective advocacy (lobbye sammen), reputation (bli sett som leder), peer effect (konkurrentene er med), outside pressure (kunder, investorer, NGO-er), risk avoidance (unngå stranded assets) og collective engagement (høyere suksessrate i engagement). Husk: peer = gjør som de andre.\n\nForkortelser: NGO = Non-Governmental Organisation (frivillig organisasjon, f.eks. Greenpeace).","kt":"","src":"L13 slide 4"},{"id":"DF105","l":"L13","t":"Coalition design","f":"m","d":1,"p":"H","sc":"none","s":"According to Ostrom's design principles, an effective coalition needs:","o":[["As many members as possible","Incorrect: clear boundaries matter, not size."],["No rules for members","Incorrect: membership rules are required."],["Government ownership","Incorrect: not a design principle."],["Monitoring and sanctions","Correct: monitoring, sanctions and rewards are among the six design principles."]],"c":[3],"es":"Ostrom: klare grenser, regler, felles valg, overvåking, sanksjoner, konfliktløsning.","ed":"Slide 6 (basert på Ostrom 1990): seks designprinsipper: 1 klare grenser, 2 medlemsregler (SF 1.0–3.0-ambisjon), 3 collective choice arrangements, 4 monitoring, 5 sanctions and rewards, 6 conflict resolution. Mange finanskoalisjoner mangler overvåking og sanksjoner. Husk: uten sanksjoner = svakt.\n\nForkortelser: SF = Sustainable Finance (SF 1.0 / 2.0 / 3.0 = trinnene i læreboka).","kt":"","src":"L13 slide 6"},{"id":"DF106","l":"L13","t":"Green premium","f":"m","d":1,"p":"H","sc":"none","s":"The \"green premium\" is:","o":[["A bonus paid to green investors","Incorrect: not the definition."],["The higher return that green stocks earned in recent years","Incorrect: not the definition here."],["The extra cost of the clean option","Correct: governments can shrink it by pricing carbon."],["A subsidy for fossil fuels","Incorrect: the opposite."]],"c":[2],"es":"Green premium = merkostnaden ved det grønne alternativet.","ed":"Slide 11 (Gates): green premium er hvor mye dyrere det rene alternativet er enn det fossile. \"Level the playing field\": ved å øke karbonprisen gradvis kan myndighetene gjøre det skitne dyrere og redusere green premium. Husk: karbonpris lukker green premium.","kt":"","src":"L13 slide 11"},{"id":"DF107","l":"L13","t":"Backcasting","f":"m","d":1,"p":"H","sc":"none","s":"Backcasting means:","o":[["Extending today's trends into the future","Incorrect: that is forecasting."],["Starting from a future goal and working back","Correct: describe the 2050 vision, create pathways, then set concrete actions now."],["Looking at past performance to predict the future","Incorrect: that is historical analysis."],["Testing the worst case","Incorrect: that is stress testing."]],"c":[1],"es":"Backcasting = fra fremtidig visjon tilbake til dagens tiltak.","ed":"Slide 14 (Loorbach 2010): backcasting har tre steg: 1 beskriv visjonen (f.eks. 2050), 2 lag veier med delmål, 3 formuler konkrete tiltak i dag. Forecasting gjør det motsatte. Husk: back = baklengs fra målet.","kt":"","src":"L13 slide 14"},{"id":"DF108","l":"L13","t":"Just transition","f":"m","d":1,"p":"H","sc":"none","s":"A \"just transition\" means:","o":[["Helping workers and communities hurt by the shift","Correct: governments plan funding and support for affected communities."],["Moving to zero emissions as fast as possible at any cost","Incorrect: that ignores fairness."],["Letting courts decide climate policy instead of governments","Incorrect: not the meaning."],["Only rich countries cutting emissions","Incorrect: not the definition."]],"c":[0],"es":"Just transition = hjelpe arbeidere og lokalsamfunn som rammes.","ed":"Slide 12: \"Plan for a just transition\": myndighetene kan hjelpe lokalsamfunn som rammes av overgangen med finansiering, teknisk råd og erfaringsdeling. Målet er at kostnadene fordeles rettferdig. Husk: just = rettferdig.","kt":"","src":"L13 slide 12"},{"id":"DF109","l":"L13","t":"Technology, policy, markets","f":"t","d":1,"p":"H","sc":"none","s":"True or false: The slides say technology, policy and markets must be worked on at the same time.","o":[["True","Correct. They are three levers that must be pulled together and in the same direction."],["False","Incorrect. They are three levers that must be pulled together and in the same direction."]],"c":[0],"es":"Sant. Tre spaker samtidig.","ed":"Slide 12: markeder, teknologi og politikk er som tre spaker som må trekkes samtidig og i samme retning for å komme bort fra fossilt. Husk: alle tre på en gang.","kt":"","src":"L13 slide 12"},{"id":"DF110","l":"L13","t":"Valley of death","f":"m","d":1,"p":"H","sc":"none","s":"The \"valley of death\" is:","o":[["A long period of falling stock prices in green energy","Incorrect: not the meaning."],["The last stage of a firm's life","Incorrect: not the meaning."],["The gap between research and a product that sells","Correct: early innovators often fail to get funding between lab and market."],["A region hit by climate change","Incorrect: not the meaning."]],"c":[2],"es":"Valley of death = gapet mellom forskning og marked.","ed":"Slide 18: \"help early-stage innovators get across the valley of death\". Det er fasen der en teknologi virker i lab, men ikke er lønnsom ennå: for sen for forskningsmidler og for tidlig for vanlige investorer. Husk: lab → marked.","kt":"","src":"L13 slide 18"}]</script>

  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
const MODES = [
  ['practice','Practice','Answer and see the explanation right away'],
  ['exam','Exam','No answers until you submit'],
  ['wrong','Review mistakes','Questions you last got wrong'],
  ['flagged','Flagged','Questions you have flagged']];
const FMTS = [['m','Multiple choice'],['t','True/false · Yes/no']];
const SCN = {short:'Case', extended_course_case:'Course case', constructed_scenario:'Scenario'};
const STORE = 'fie459-progress-v1';
const EXAM = new Date(2026, 11, 16);

// ---------- storage (per browser) ----------
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && s.p) return s; }catch(e){} return {p:{}, flags:[], set:null}; }
let DB = load();
let FLAGS = new Set(DB.flags || []);
function save(){ try{ DB.flags=[...FLAGS]; localStorage.setItem(STORE, JSON.stringify(DB)); }catch(e){} }
function rec(id, ok){ const r = DB.p[id] || {n:0,k:0,last:0}; r.n++; if(ok) r.k++; r.last = ok?1:-1; DB.p[id]=r; save(); }

// ---------- settings ----------
const S = Object.assign({mode:'practice', lecs:LECS.map(l=>l[0]), fmts:['m','t'], prio:'all', count:20, smart:true, sec:'core'}, DB.set || {});
if(!S.sec) S.sec='core';
function inSec(q){ return S.sec==='core' ? !!q.k : S.sec==='extra' ? (!q.k && !!q.e) : (!q.k && !q.e); }
function saveSet(){ DB.set = S; save(); }

// ---------- helpers ----------
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){ const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='on') for(const ev in v) e.addEventListener(ev, v[ev]);
    else if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else e.setAttribute(k, v===true?'':v); }
  for(const c of kids.flat()) if(c!=null && c!==false) e.append(c instanceof Node ? c : document.createTextNode(c));
  return e;
}
const app = document.getElementById('app');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function setNav(v){ document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.view===v))); }
function sameSet(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }
function fmtTime(s){ const m=Math.floor(s/60), ss=s%60; return (m>=60? Math.floor(m/60)+':'+String(m%60).padStart(2,'0') : m)+':'+String(ss).padStart(2,'0'); }
function lecStats(l){ const qs=BANK.filter(q=>q.l===l && inSec(q)); let seen=0,k=0,w=0; for(const q of qs){const r=DB.p[q.id]; if(r){seen++; if(r.last>0)k++; else w++;}} return {n:qs.length,seen,k,w}; }
function lecLabel(id){ return id==='GUEST' ? 'Guest' : id; }
function daysLeft(){ const t=new Date(); t.setHours(0,0,0,0); return Math.max(0, Math.round((EXAM - t)/864e5)); }
function ring(pct, size){
  const r=54, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function bar(k, w, n){ return h('span',{class:'bar'}, h('i',{class:'k',style:`width:${n?k/n*100:0}%`}), h('i',{class:'w',style:`width:${n?w/n*100:0}%`})); }
function tfText(o){ return o[0]; }
function isYN(q){ return q.f==='t' && q.o[0][0]==='Yes'; }
function keyFor(q, pos){ return q.f==='t' ? (isYN(q) ? (pos?'N':'Y') : (pos?'F':'T')) : String.fromCharCode(65+pos); }

function pool(){
  return BANK.filter(q => inSec(q) && S.lecs.includes(q.l) && (S.fmts.includes(q.f)||!S.fmts.some(f=>f==='m'||f==='t')) && (S.sec==='core' || S.prio==='all' || q.p==='H')
    && (S.sec==='core' || !S.trOnly || q.id.startsWith('TR'))
    && (S.mode!=='wrong' || (DB.p[q.id] && DB.p[q.id].last<0))
    && (S.mode!=='flagged' || FLAGS.has(q.id)));
}

// ---------- setup view ----------
function renderSetup(){
  setNav('setup'); stopTimer(); clearSes(); SES = null; app.replaceChildren();
  const SQ = BANK.filter(inSec), all = SQ.map(q=>DB.p[q.id]).filter(Boolean), seen = all.length, lastOk = all.filter(r=>r.last>0).length, lastBad = seen-lastOk;
  const pct = SQ.length ? lastOk/SQ.length : 0;
  app.append(h('div',{class:'stack'},
    h('div',null, h('h1',{text:'Train for the exam'}),
      h('p',{class:'lead', text: S.sec==='core'
        ? `Core ${SQ.length}: the most likely exam topics, written like the lecturer's sample questions, with the exam mix of about 4 multiple choice to 1 yes/no. Includes the three sample questions. Explanations in Norwegian, key terms in English.`
        : S.sec==='extra'
        ? `Extra ${SQ.length}: questions from the textbook and guest lectures that go beyond the slides. Use these after the main bank.`

    block('Question set', h('div',{class:'seg sec', role:'group'}, [['core','Core '+BANK.filter(q=>q.k).length,'Basics first · Norwegian explanations'],['full','Full bank','Slides first · '+BANK.filter(q=>!q.k&&!q.e).length+' questions'],['extra','Extra (book)','Beyond the slides · '+BANK.filter(q=>q.e).length]].map(([k,t,d]) =>
      h('button',{id:'sec-'+k,'aria-pressed':String(S.sec===k), on:{click:()=>{S.sec=k; saveSet(); renderSetup();}}},
        h('b',{text:t}), h('span',{class:'d',text:d}))))),
    h('div',{class:'panel dash'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'mastered'})))),
      h('div',{class:'tiles'},
        h('div',{class:'tile exam'}, h('b',{text:String(daysLeft())}), h('span',{text:'days to exam · 16 Dec'})),
        h('div',{class:'tile'}, h('b',{text:`${seen}`}), h('span',{text:`of ${SQ.length} seen`})),
        h('div',{class:'tile'}, h('b',{text:`${lastBad}`}), h('span',{text:'to review'})),
        h('div',{class:'tile'}, h('b',{text:`${FLAGS.size}`}), h('span',{text:'flagged'})))),
    block('Mode', h('div',{class:'seg', role:'group'}, MODES.map(([k,t,d]) =>
      h('button',{id:'mode-'+k,'aria-pressed':String(S.mode===k), on:{click:()=>{S.mode=k; saveSet(); renderSetup();}}},
        h('span',{class:'ic', html:ICON[k]}), h('b',{text:t}), h('span',{class:'d',text:d}))))),
    block('Lectures', [
      h('div',{class:'lecs'}, LECS.map(([id,name]) => { const st=lecStats(id);
        return h('button',{class:'lec', id:'lec-'+id, 'aria-pressed':String(S.lecs.includes(id)), title:`${st.k} correct, ${st.w} wrong last time, of ${st.n}`,
          on:{click:()=>{ S.lecs = S.lecs.includes(id)? S.lecs.filter(x=>x!==id) : [...S.lecs,id]; saveSet(); renderSetup(); }}},
          h('span',{class:'code',text:lecLabel(id)}), h('span',{class:'name',text:name}), h('span',{class:'n',text:`${st.seen}/${st.n}`}),
          bar(st.k, st.w, st.n)); })),
      h('div',{class:'row'},
        h('button',{class:'linkbtn', id:'lec-all', on:{click:()=>{S.lecs=LECS.map(l=>l[0]); saveSet(); renderSetup();}}, text:'Select all'}),
        h('button',{class:'linkbtn', id:'lec-none', on:{click:()=>{S.lecs=[]; saveSet(); renderSetup();}}, text:'Clear all'}))]),
    block('Question type', h('div',{class:'row'}, FMTS.map(([k,t]) => chip('fmt-'+k, t, S.fmts.includes(k), ()=>{ S.fmts = S.fmts.includes(k)? S.fmts.filter(x=>x!==k):[...S.fmts,k]; }))),
      S.sec==='core' ? null : h('div',{class:'row'}, chip('prio-all','All priorities',S.prio==='all',()=>S.prio='all'), chip('prio-h','High priority only',S.prio==='H',()=>S.prio='H'), chip('tr-only','New from lecture recordings',!!S.trOnly,()=>S.trOnly=!S.trOnly))),
    block('Number of questions', h('div',{class:'row'}, [10,20,40,80,0].map(n => chip('count-'+n, n?String(n):'All', S.count===n, ()=>S.count=n)),
      S.mode==='practice' ? chip('smart','Unseen and wrong first', S.smart, ()=>S.smart=!S.smart) : null)),
    startBar()
  ));
}
function block(label, ...kids){ return h('section',{class:'block'}, h('p',{class:'label',text:label}), ...kids); }
function chip(id, text, on, fn){ return h('button',{class:'chip', id, 'aria-pressed':String(on), on:{click:()=>{fn(); saveSet(); renderSetup();}}, text}); }
function startBar(){
  const p = pool(), n = S.count ? Math.min(S.count, p.length) : p.length;
  const msg = p.length ? [h('b',{text:String(n)}), ` questions of ${p.length} available`]
    : [S.mode==='wrong' ? 'No mistakes to review yet.' : S.mode==='flagged' ? 'You have not flagged any questions yet.' : 'No questions match your filters.'];
  return h('div',{class:'startbar'}, h('span',{class:'info'}, msg),
    h('button',{class:'primary', id:'start', disabled:!p.length, on:{click:()=>startSession(p, n)}, text: S.mode==='exam' ? 'Start exam' : 'Start'}));
}

// ---------- session ----------
let SES = null, timer = null;
const SESKEY = 'fie459-session-v1';
function persistSes(){ try{ if(SES) localStorage.setItem(SESKEY, JSON.stringify(SES)); }catch(e){} }
function clearSes(){ try{ localStorage.removeItem(SESKEY); }catch(e){} }
function fixSes(s){ // a saved session can predate a bank update (e.g. a yes/no question that became multiple choice)
  if(!s || !s.items) return s;
  s.items = s.items.filter(x=>BYID[x.id]);
  for(const x of s.items){ const q=BYID[x.id];
    if(!x.order || x.order.length!==q.o.length || x.order.some(i=>i>=q.o.length)){
      x.order = (q.f==='t' || q.x) ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i)); x.chosen=[]; x.done=false; x.ok=false; } }
  if(!s.items.length) return null; if(s.i>=s.items.length) s.i=s.items.length-1; return s; }
function loadSes(){ try{ const s = JSON.parse(localStorage.getItem(SESKEY)); if(s && s.items && s.items.length && s.items.some(x=>BYID[x.id])) return s; }catch(e){} return null; }
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
function startSession(p, n){
  let list = shuffle(p);
  if(S.mode==='practice' && S.smart){ const w = q => { const r=DB.p[q.id]; return !r?1 : r.last<0?0 : 2; }; list.sort((a,b)=>w(a)-w(b)); }
  list = list.slice(0, n);
  SES = { exam:S.mode==='exam', i:0, t0:Date.now(), confirm:false,
    items: list.map(q => ({ id:q.id, order: (q.f==='t' || q.x) ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i)), chosen:[], done:false, ok:false })) };
  stopTimer(); timer = setInterval(tick, 1000);
  renderQuestion(); window.scrollTo(0,0);
}
function tick(){ const el=document.getElementById('clock'); if(el && SES) el.textContent = fmtTime(Math.floor((Date.now()-SES.t0)/1000)); }

function renderQuestion(){
  persistSes();
  setNav(''); app.replaceChildren();
  const it = SES.items[SES.i], q = BYID[it.id], ms = q.f==='s', N = SES.items.length;
  const answered = SES.items.filter(x=> SES.exam ? x.chosen.length : x.done).length;
  const correct = SES.items.filter(x=>x.done&&x.ok).length;
  const need = ms ? q.c.length : 1;

  const top = h('div',{class:'qtop'},
    h('span',{class:'pos',text:`${SES.i+1} / ${N}`}),
    h('span',{class:'track'}, h('i',{style:`width:${answered/N*100}%`})),
    h('span',{class:'stat'}, SES.exam ? '' : `${correct} correct · `, h('span',{id:'clock',text:fmtTime(Math.floor((Date.now()-SES.t0)/1000))})));

  const meta = h('div',{class:'meta'},
    h('span',{class:'lecid',text:q.l==='GUEST'?'Guest lecture':q.l+' · '+LECNAME[q.l]}),
    h('span',{text:q.t}), SCN[q.sc] ? h('span',{class:'tag',text:SCN[q.sc]}) : null, h('span',{class:'qid',text:q.id}));

  const opts = h('div',{class:'opts', role: ms?'group':'radiogroup'});
  it.order.forEach((oi, pos) => {
    const o = q.o[oi], sel = it.chosen.includes(oi);
    let cls = 'opt';
    const reveal = it.done && !SES.exam;
    if(reveal){ if(q.c.includes(oi)) cls+=' right'; else if(sel) cls+=' wrong'; }
    const showWhy = reveal && (sel || q.c.includes(oi));
    opts.append(h('button',{class:cls, id:`opt-${pos}`, 'aria-pressed':String(sel), disabled:reveal,
        on:{click:()=>choose(oi)}},
      h('span',{class:'key',text: keyFor(q,pos)}),
      h('span',null, q.f==='t' ? tfText(o) : o[0], showWhy ? h('span',{class:'why',text:o[1]}) : null)));
  });

  const card = h('div',{class:'card'}, meta, h('p',{class:'stem',text:q.s}), opts);
  if(it.done && !SES.exam) card.append(feedback(q, it));

  const acts = h('div',{class:'actions'});
  const left = h('div',{class:'left'},
    h('button',{class:'ghost flag', id:'flag', 'aria-pressed':String(FLAGS.has(q.id)), on:{click:()=>{ FLAGS.has(q.id)?FLAGS.delete(q.id):FLAGS.add(q.id); save(); renderQuestion(); }}, text: FLAGS.has(q.id)?'Flagged':'Flag'}),
    h('button',{class:'ghost', id:'quit', on:{click:()=> SES.exam ? finish() : (SES.items.some(x=>x.done) ? finish() : renderSetup())}, text:'Quit'}));
  let main;
  if(SES.exam){
    main = h('div',{class:'left'},
      SES.i>0 ? h('button',{class:'ghost', id:'prev', on:{click:()=>{SES.i--; renderQuestion();}}, text:'Back'}) : null,
      SES.i<N-1 ? h('button',{class:'primary', id:'next', on:{click:()=>{SES.i++; renderQuestion();}}, text:'Next'})
               : h('button',{class:'primary', id:'submit', on:{click:askSubmit}, text:'Submit'}));
  } else if(!it.done){
    main = h('button',{class:'primary', id:'answer', disabled: it.chosen.length!==need, on:{click:answer}, text:'Check answer'});
  } else {
    main = h('button',{class:'primary', id:'next', on:{click:next}, text: SES.i<N-1 ? 'Next' : 'See results'});
  }
  acts.append(left, main);

  app.append(top, card, acts);
  if(SES.exam){
    if(SES.confirm){ const un = SES.items.filter(x=>!x.chosen.length).length;
      app.append(h('div',{class:'confirm'}, h('span',{text: un ? `${un} questions unanswered. Submit anyway?` : 'Submit the exam?'}),
        h('div',{class:'left'}, h('button',{class:'ghost',id:'cancel-submit',on:{click:()=>{SES.confirm=false; renderQuestion();}},text:'Keep going'}), h('button',{class:'primary',id:'confirm-submit',on:{click:finish},text:'Submit'})))); }
    app.append(h('div',{class:'grid', 'aria-label':'Jump to question'}, SES.items.map((x,k)=> h('button',{
      class:[x.chosen.length?'ans':'', FLAGS.has(x.id)?'fl':'', k===SES.i?'cur':''].join(' '), id:'jump-'+k, 'aria-label':`Question ${k+1}`,
      on:{click:()=>{SES.i=k; renderQuestion();}}, text:String(k+1)}))));
  }
  app.append(h('p',{class:'kbd', text: q.f==='t' ? (isYN(q)?'Keyboard: Y/N or 1–2 to choose, Enter to continue.':'Keyboard: T/F or 1–2 to choose, Enter to continue.') : `Keyboard: 1–${q.o.length} or A–${String.fromCharCode(64+q.o.length)} to choose, Enter to continue.`}));
}
function explain(q){
  return [q.kt ? h('div',{class:'kt'}, h('b',{text:'Key terms: '}), q.kt) : null, h('p',{style:'margin:0;white-space:pre-line',text:q.ed}), h('p',{class:'src',text:'Source: '+q.src})];
}
function feedback(q, it){
  const box = h('div',{style:'display:grid;gap:14px'},
    h('div',{class:'verdict '+(it.ok?'ok':'bad')}, h('span',{class:'vi', html: it.ok?ICON.ok:ICON.bad}), h('b',{text: it.ok ? 'Correct' : 'Not quite'}), h('span',{text:q.es})));
  box.append(h('details',{class:'deep', open: !it.ok}, h('summary',{text:'Full explanation'}), h('div',{class:'body'}, explain(q))));
  return box;
}
function choose(oi){
  const it = SES.items[SES.i], q = BYID[it.id];
  if(it.done && !SES.exam) return;
  if(q.f==='s'){ it.chosen = it.chosen.includes(oi) ? it.chosen.filter(x=>x!==oi) : (it.chosen.length < q.c.length ? [...it.chosen, oi] : it.chosen); }
  else it.chosen = [oi];
  renderQuestion();
}
function grade(it){ const q=BYID[it.id]; it.ok = sameSet(it.chosen, q.c); it.done = true; }
function answer(){ const it=SES.items[SES.i]; grade(it); rec(it.id, it.ok); renderQuestion(); }
function next(){ if(SES.i < SES.items.length-1){ SES.i++; renderQuestion(); window.scrollTo(0,0); } else finish(); }
function askSubmit(){ SES.confirm = true; renderQuestion(); }
function finish(){
  stopTimer();
  clearSes();
  if(SES.exam){ for(const it of SES.items){ grade(it); if(it.chosen.length) rec(it.id, it.ok); else it.skip=true; } }
  else SES.items = SES.items.filter(x=>x.done);
  renderResults();
}

// ---------- results ----------
function renderResults(){
  setNav(''); app.replaceChildren(); window.scrollTo(0,0);
  const done = SES.items.filter(x=>x.done && !x.skip), ok = done.filter(x=>x.ok), N = SES.items.length;
  const pct = done.length ? ok.length/done.length : 0;
  const secs = Math.floor((Date.now()-SES.t0)/1000);
  const byLec = {};
  for(const it of done){ const l=BYID[it.id].l; byLec[l]=byLec[l]||{n:0,k:0}; byLec[l].n++; if(it.ok) byLec[l].k++; }
  const wrong = SES.items.filter(x=>x.done && !x.ok);

  app.append(h('div',{class:'stack'},
    h('div',{class:'panel hero'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'correct'})))),
      h('div',null, h('p',{class:'label',text: SES.exam?'Exam submitted':'Round complete'}),
        h('h1',{text: pct>=.8?'Strong work':pct>=.6?'Good progress':'Keep going'}),
        h('p',{class:'of',text:`${ok.length} of ${done.length} correct${done.length<N?` · ${N-done.length} unanswered`:''} · ${fmtTime(secs)}`}))),
    Object.keys(byLec).length>1 ? block('By lecture', h('div',{class:'panel tablewrap'}, h('table',null,
      h('thead',null,h('tr',null,h('th',{text:'Lecture'}),h('th',{text:'Correct'}),h('th',{text:''}))),
      h('tbody',null, LECS.filter(([id])=>byLec[id]).map(([id,name])=>{ const b=byLec[id]; return h('tr',null,
        h('td',{text:lecLabel(id)+' '+name}), h('td',{class:'num',text:`${b.k}/${b.n}`}),
        h('td',null, bar(b.k, b.n-b.k, b.n))); })))) ) : null,
    block(wrong.length ? `Mistakes (${wrong.length})` : 'Review', wrong.length ? h('div',{class:'review'}, wrong.map(reviewItem)) : h('p',{class:'empty',text: SES.exam && !done.length ? 'No questions were answered.' : 'Everything correct this round.'})),
    h('div',{class:'row'},
      wrong.length ? h('button',{class:'primary', id:'retry-wrong', on:{click:()=>startSession(wrong.map(x=>BYID[x.id]), wrong.length)}, text:'Practise these mistakes'}) : null,
      h('button',{class:'ghost', id:'new-round', on:{click:renderSetup}, text:'New round'}))
  ));
}
function reviewItem(it){
  const q = BYID[it.id];
  return h('details',null,
    h('summary',null, h('span',{class:'m',text:q.id}), h('span',{text:q.s})),
    h('div',{class:'inner'},
      h('div',{class:'opts'}, it.order.map((oi,pos)=>{ const o=q.o[oi], sel=it.chosen.includes(oi), r=q.c.includes(oi);
        return h('div',{class:'opt'+(r?' right':sel?' wrong':'')}, h('span',{class:'key',text:keyFor(q,pos)}),
          h('span',null, q.f==='t'?tfText(o):o[0], (r||sel)?h('span',{class:'why',text:o[1]}):null)); })),
      h('div',{class:'verdict bad plain'}, h('span',{text:q.es})),
      explain(q)));
}

// ---------- progress ----------
let resetAsk = false;
function renderProgress(){
  setNav('progress'); stopTimer(); app.replaceChildren();
  const all = Object.values(DB.p), seen = all.length, lastOk = all.filter(r=>r.last>0).length;
  const pct = lastOk/BANK.length;
  app.append(h('div',{class:'stack'},
    h('div',{class:'panel hero'},
      h('div',{class:'ring'}, h('div',{html:ring(pct)}), h('div',{class:'num'}, h('div',null, h('b',{text:Math.round(pct*100)+'%'}), h('span',{text:'mastered'})))),
      h('div',null, h('h1',{text:'Progress'}),
        h('p',{class:'of',text:`${lastOk} of ${BANK.length} correct last time · ${seen} seen · ${FLAGS.size} flagged`}),
        h('p',{class:'of',style:'margin-top:6px;font-size:12.5px',text:'Saved on this device only. "Mastered" counts questions where your last answer was correct.'}))),
    block('By lecture', h('div',{class:'panel tablewrap'}, h('table',null,
      h('thead',null,h('tr',null,h('th',{text:'Lecture'}),h('th',{text:'Seen'}),h('th',{text:'Right'}),h('th',{text:'Wrong'}),h('th',{text:''}))),
      h('tbody',null, LECS.map(([id,name])=>{ const s=lecStats(id); return h('tr',null,
        h('td',{text:lecLabel(id)+' '+name}), h('td',{class:'num',text:`${s.seen}/${s.n}`}), h('td',{class:'num',text:String(s.k)}), h('td',{class:'num',text:String(s.w)}),
        h('td',null, bar(s.k, s.w, s.n))); }))))),
    block('Reset', resetAsk
      ? h('div',{class:'confirm'}, h('span',{text:'Delete all progress and flags?'}), h('div',{class:'left'},
          h('button',{class:'ghost',id:'reset-cancel',on:{click:()=>{resetAsk=false; renderProgress();}},text:'Cancel'}),
          h('button',{class:'primary',id:'reset-yes',on:{click:()=>{DB.p={}; FLAGS=new Set(); save(); resetAsk=false; renderProgress();}},text:'Delete'})))
      : h('div',null, h('button',{class:'ghost',id:'reset',on:{click:()=>{resetAsk=true; renderProgress();}},text:'Reset progress'})))
  ));
}

// ---------- keyboard & nav ----------
document.addEventListener('keydown', e => {
  if(!SES || !document.querySelector('.card') || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = SES.items[SES.i], q = BYID[it.id], k = e.key.toLowerCase();
  let pos = -1;
  if(/^[1-6]$/.test(k)) pos = +k-1;
  else if(q.f==='t' && (k==='t'||k==='f'||k==='y'||k==='n')) pos = (k==='t'||k==='y')?0:1;
  else if(q.f!=='t' && /^[a-f]$/.test(k)) pos = k.charCodeAt(0)-97;
  if(pos>=0 && pos<it.order.length){ e.preventDefault(); choose(it.order[pos]); return; }
  if(e.key==='Enter'){ const b = document.getElementById('answer') || document.getElementById('next'); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
});
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => b.dataset.view==='progress' ? renderProgress() : renderSetup()));
document.getElementById('home').addEventListener('click', () => { if(!document.querySelector('.card')) renderSetup(); });
function boot(data){
  const saved = fixSes((data && data.SES) || loadSes());
  if(saved){ SES = saved; stopTimer(); timer = setInterval(tick, 1000); renderQuestion(); }
  else renderSetup();
}
if(window.claude && window.claude.hot){ try{ window.claude.hot.snapshot(() => ({SES: (document.querySelector('.card') ? SES : null)})); }catch(e){} }
if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(boot); } else { boot(window.claude && window.claude.hot ? window.claude.hot.data : null); }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
