"ed":"Shareholders are residual, non-contractual claimants. (1) Contracts with stakeholders are incomplete, so in unforeseen circumstances shareholder interests override others. (2) Public policy: stakeholders may lobby for protection, but major externalities (environment, outsourced social issues) are not fully covered. (3) Business ethics: a narrow focus can justify cutting costs and accepting small risks of disasters, especially since limited liability and directors' liability insurance cap the downside. Shapira and Zingales show deterrence often fails because firms control the information. Also correct: Contractual issues: contracts cannot cover all future circumstances, including externalities (incomplete contracts).","kt":"","src":"Bok s. 80 (3.2.1) · Bok s. 81 (3.2.1) · L5 slide 24"},{"id":"SB144","l":"L4","t":"Stakeholder model","f":"m","d":4,"p":"L","sc":"none","s":"According to Magill, Quinzii and Rochet (2015), as summarised in the textbook, why does a competitive equilibrium with shareholder value maximisation lead to a problem for large firms?","o":[["Large firms overinvest in safety because regulators require it.","The model predicts underinvestment, not overinvestment."],["Competition eliminates all externalities in equilibrium.","The model shows externalities persist."],["Large firms take too little risk because shareholders are too risk-averse.","The issue is externalities on stakeholders, not shareholder risk aversion."],["Risks hitting workers and consumers are not internalised, so prevention is underfunded.","Shareholders do not internalise the externalities on workers and consumers, leading to underinvestment in prevention."]],"c":[3],"es":"Shareholders ignore externalities on workers and consumers, so firms underinvest in risk prevention.","ed":"Magill, Quinzii and Rochet propose a \"stakeholder equilibrium\": instruct managers to maximise the total welfare of stakeholders, implemented by creating new property rights (employee and consumer rights) and maximising the value of these rights plus shareholder value. The textbook links this to integrated value and integrated reporting (six capitals) as a practical language for such trade-offs.","kt":"","src":"Bok s. 82 (3.2.3)"},{"id":"SB145","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":5,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A large index fund manager believes its fiduciary duty is to maximise the market value of portfolio firms, and always votes for the most profitable option, even though many of its clients would prefer firms to avoid harmful but profitable activities. What would Hart and Zingales recommend?","o":[["Find out what its investors prefer and vote accordingly.","They propose company and asset managers pursue policies consistent with investors' preferences, and see the belief in a value-only fiduciary duty as a source of amoral drift."],["Keep voting for the most profitable option, because fiduciary duty legally requires market value maximisation.","Hart and Zingales call this belief mistaken and a source of amoral drift."],["Sell all shares in firms with harmful activities, since voting has no influence.","In their model voting is precisely the channel through which preferences matter; divestment alone does not change the action."],["Delegate all votes to the firms' managers, who know the business best.","That removes shareholders' preferences from the decision entirely."]],"c":[0],"es":"Asset managers should vote in line with their investors' (prosocial) preferences, not mechanically for value.","ed":"Hart and Zingales argue asset managers, as delegates of ultimate investors, should pursue policies consistent with those investors' preferences. Large index funds hold many firms and vote on many proposals, so their voting policy matters greatly. The belief that fiduciary duty demands pure value maximisation feeds the amoral drift. This ties to the textbook's call to clarify fiduciary duty (High-Level Expert Group: understand beneficiaries' sustainability preferences) and to Lecture 8, where passive investors can still use voice (voting) even though they cannot exit.","kt":"","src":"Hart & Zingales s. 1 · Hart & Zingales s. 11-12 · Bok s. 86 (3.3.1) · L8 slide 71"},{"id":"SB146","l":"L4","t":"Business Roundtable statement","f":"t","d":3,"p":"M","sc":"none","s":"True or false: One criticism of the Business Roundtable statement shown in Lecture 4 is that some signatories finance major fossil fuel development, making it hard to reconcile their commitment to stakeholders with being major financiers of climate change.","o":[["True","Correct. Slide 16 quotes Sanford Lewis, an attorney advising shareholder petitioners, making exactly this point."],["False","Incorrect. Slide 16 quotes Sanford Lewis, an attorney advising shareholder petitioners, making exactly this point."]],"c":[0],"es":"True: critics saw a gap between the pledge and signatories' fossil fuel financing.","ed":"Critics argued the statement was not backed by action (signatories did not change governance or behaviour), some questioned its legal basis, and others saw it as increasing agency problems. The fossil fuel financing criticism links to Lecture 11, where banks increased fossil fuel finance in 2024 despite climate commitments (\"banks have shown their true colours\").","kt":"","src":"L4 slide 14-16 · L11 slide 32"},{"id":"SB147","l":"L4","t":"Shareholder theory","f":"m","d":2,"p":"M","sc":"none","s":"Why are shareholders described as \"residual, non-contractual claimants\" in the textbook?","o":[["They have no right to any cash flows of the firm.","They have a right to the residual cash flows."],["They have a fixed contractual return that cannot vary with performance.","That describes debt; equity returns are residual and variable."],["They are paid only after all contractual claims have been met.","Residual claimants receive what is left after contractual claims, which motivates the shareholder model."],["They are paid before creditors because they own the firm.","Creditors have contractual priority; shareholders come last."]],"c":[2],"es":"Shareholders get what remains after all contractual claims are paid.","ed":"Jensen and Meckling describe shareholders as residual claimants: they receive the leftover after creditors, employees, customers and government are paid under their contracts. The shareholder model argues that maximising this residual maximises total value, provided contracts protect other stakeholders. The challenge is that contracts are incomplete and externalities are not contracted at all, which is the core of the stakeholder critique.","kt":"","src":"Bok s. 80 (3.2.1)"},{"id":"SB148","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":3,"p":"H","sc":"none","s":"How does the textbook map the corporate objective debate onto the SF typology?","o":[["Refined shareholder value is SF 1.0; stakeholder value is SF 2.0.","Box 1.3, 1.4 and 1.5 formalise these objective functions."],["All three stages are identical in practice, so the typology has no implications for governance.","Lecture 5 discusses different governance challenges for each model."],["Stakeholder value is SF 1.0 because it uses exclusion lists.","Exclusion lists belong to SF 1.0; stakeholder value is SF 2.0."],["Shareholder value maximisation is SF 3.0 because it creates the most value for society.","Pure shareholder value is finance as usual."]],"c":[0],"es":"Refined shareholder value = SF 1.0; stakeholder/integrated value = SF 2.0; common good = SF 3.0.","ed":"The textbook links governance models to its typology. Finance as usual maximises shareholder value; refined shareholder value (enlightened value maximisation) maximises F subject to S and E constraints (SF 1.0); the stakeholder model optimises integrated value (SF 2.0); separate non-financial KPIs with financial value as a constraint come closer to SF 3.0. Lecture 5 lists challenges for each: unaccountability and measurement for SF 1.0, balancing interests and agency costs for SF 2.0.","kt":"","src":"Bok s. 82 (3.2.2) · Bok s. 83 (3.2.3) · L5 slide 27-28"},{"id":"SB149","l":"L4","t":"Shareholder welfare vs market value","f":"t","d":4,"p":"L","sc":"none","s":"True or false: According to Hart and Zingales, a founder who wants her company to stay \"clean\" after going public can make hostile takeovers easy, for example with a non-staggered board, because takeovers protect clean strategies.","o":[["True","Incorrect. Making takeovers easy helps a founder who wants dirty (amoral drift). To protect clean, a founder can use a staggered board or a dual-class structure retaining voting control."],["False","Correct. Making takeovers easy helps a founder who wants dirty (amoral drift). To protect clean, a founder can use a staggered board or a dual-class structure retaining voting control."]],"c":[1],"es":"False: easy takeovers favour dirty; staggered boards or dual-class shares protect clean.","ed":"Because of the amoral drift, an unfettered market for corporate control pushes firms towards the dirty, more profitable action. A founder wanting dirty should make takeovers easy; one wanting clean can adopt a staggered board or dual-class shares (as Google and Facebook did) to keep control. But such defences entrench management, which conflicts with Lecture 5's good governance practice of avoiding dual-class shares - another trade-off between accountability and stakeholder commitment, as in the Unilever/Kraft Heinz case.","kt":"","src":"Hart & Zingales s. 13-14 · L5 slide 19 · Bok s. 85 (3.3.1)"},{"id":"SB150","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"In 2017 Kraft Heinz offered $143 billion for Unilever. How does the textbook interpret this aborted takeover?","o":[["As an example of SF 3.0 impact investing by Kraft Heinz.","Kraft Heinz is the shareholder-model company."],["As a clash between a shareholder model (SF 1.0) and a stakeholder model (SF 2.0).","Box 3.2 contrasts Kraft Heinz's shareholder model with Unilever's stakeholder model under Paul Polman."],["As proof that hostile takeovers always succeed against stakeholder-oriented firms.","The bid was dropped; Warren Buffett did not approve a hostile takeover."],["As a merger of equals between two stakeholder-oriented firms with identical business models.","The firms had radically different business models and cultures."]],"c":[1],"es":"Shareholder model (Kraft Heinz, SF 1.0) vs stakeholder model (Unilever, SF 2.0); the bid was abandoned.","ed":"Kraft Heinz relied on debt-financed deals and aggressive cost cutting to expand margins and repay debt; Unilever balanced profitability with social and environmental sustainability and had a strong emerging market presence. Without protection, financial considerations would always dominate, biasing firms towards SF 1.0. The textbook proposes a societal cost-benefit test of takeovers: approval only if integrated value improves, with fairness opinions and possibly a takeover panel or court. Hart and Zingales' amoral drift gives the theory behind this concern.","kt":"","src":"Bok s. 85 (3.3.1) · Bok s. 86 (Box 3.2) · Hart & Zingales s. 11"},{"id":"SB151","l":"L4","t":"Shareholder vs stakeholder model","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook proposes that a takeover or merger should only be approved if a societal cost-benefit test shows that the integrated value (financial, social and environmental) of the combined company improves compared with the stand-alone companies.","o":[["True","Correct. Section 3.3.1 proposes exactly this test, with an independent fairness opinion and review by a court or takeover panel."],["False","Incorrect. Section 3.3.1 proposes exactly this test, with an independent fairness opinion and review by a court or takeover panel."]],"c":[0],"es":"True: approve only if integrated value improves, verified by an independent fairness opinion.","ed":"The test uses the integrated value methodology from Chapter 2. Management of both firms would calculate the combined integrated value; an independent advisor gives a fairness opinion; a court or takeover panel approves only if integrated value improves. The textbook admits it is administratively cumbersome and information-hungry, which again stresses the importance of integrated reporting (Lecture 7).","kt":"","src":"Bok s. 85 (3.3.1) · Bok s. 86 (3.3.1)"},{"id":"SB152","l":"L4","t":"Purpose of the firm","f":"m","d":5,"p":"M","sc":"none","s":"Lecture 4 opens with: \"On whose behalf should a company be run? Can it be run on behalf of multiple parties?\" Which answer is consistent with the theories covered?","o":[["A firm can be run for shareholders while still reflecting their non-financial preferences, as Hart and Zingales propose.","Shareholder welfare includes prosocial preferences, implemented for example through voting."],["The question is irrelevant because firms' decisions never affect anyone but shareholders.","Externalities, employees and supply chains show decisions affect many parties."],["A firm can only be run for one party, because corporate law forbids considering anyone else.","The business judgement rule allows directors to consider stakeholders; several countries mandate employee board seats."],["Shareholder value maximisation always automatically maximises the welfare of all stakeholders.","Externalities and incomplete contracts mean this is not automatic."]],"c":[0],"es":"Multiple principals need a balancing rule to avoid agency costs; shareholder welfare can include non-financial preferences.","ed":"The debate has three poles: Friedman (market value for shareholders), Hart and Zingales (welfare of shareholders, including prosocial preferences, via voting) and Freeman (all stakeholders). Critics of stakeholderism stress the difficulty of balancing interests and holding managers accountable; supporters point to incomplete contracts and externalities. Edmans offers a bridge: growing the pie reduces conflicts. Legal systems differ: Delaware frames duties towards shareholders, while Germany and Norway build employees into boards. Also correct: Running a firm for multiple parties is possible but needs a way to weigh conflicting interests; otherwise agency costs may rise.","kt":"","src":"L4 slide 4-5 · L4 slide 20-21 · L4 slide 31 · L4 slide 19"},{"id":"SB153","l":"L4","t":"Shareholder vs stakeholder model","f":"m","d":3,"p":"M","sc":"none","s":"According to Liang and Renneboog (2017), as summarised in the textbook, why do firms in civil law countries tend to have higher ESG scores than firms in common law countries?","o":[["Civil law countries have more dispersed ownership and active takeover markets.","Dispersed ownership and active takeover markets are typical of common law countries."],["ESG rating agencies are all located in civil law countries and favour local firms.","The explanation offered is legal origin and social control, not rater bias."],["Common law countries ban ESG reporting, so their scores are mechanically lower.","No such ban exists."],["Civil law embeds social preferences in ex ante rules and is more stakeholder-oriented.","Rule-based mechanisms restricting firm behaviour ex ante are more prevalent in civil law countries."]],"c":[3],"es":"Civil law: ex ante rules embedding stakeholder preferences; common law: shareholder primacy and ex post judicial settlement.","ed":"Legal origin, interpreted as systems of social control of economic life, helps explain cross-country variation in ESG. Civil law countries (mainland Europe) rely more on rules restricting firm behaviour ex ante and are more stakeholder-oriented; common law countries (UK, US) emphasise shareholder primacy and ex post judicial settlement. Starks reports similar regional patterns in ESG fund assets and E scores.","kt":"","src":"Bok s. 84 (3.3) · Bok s. 85 (3.3) · Starks s. 1849-1851"},{"id":"SB154","l":"L4","t":"Shareholder welfare vs market value","f":"m","d":3,"p":"L","sc":"none","s":"Hart and Zingales review strands of the literature on firm objectives. One strand notes that shareholders hold diversified portfolios. What is the concern raised there?","o":[["Diversified shareholders never vote, so managers become fully entrenched.","This is not the concern described."],["Diversified shareholders always prefer high wages for workers.","High-wage preferences come from shareholders who are also employees, a different strand."],["Firms may exploit joint monopoly power without any agreement, weakening antitrust.","With common ownership, coordination failures may be avoided, but joint monopoly power can be exploited."],["Diversification forces each firm to invest only in clean technology.","Not the argument made."]],"c":[2],"es":"Common ownership can lead firms to soften competition and exploit joint monopoly power.","ed":"Hart and Zingales locate their work among four strands: (1) incomplete markets and imperfect competition make value maximisation not unanimously approved (e.g. a GM shareholder who buys cars); (2) diversified shareholders care about total portfolio value, which may reduce coordination failures but enable tacit collusion; (3) stakeholder relations under incomplete contracts; (4) corporate social responsibility, closest to their paper.","kt":"","src":"Hart & Zingales s. 5-6"},{"id":"SB155","l":"L4","t":"Purpose","f":"t","d":3,"p":"H","sc":"constructed_scenario","s":"True or false: According to Edmans' \"grow the pie\" view, a firm that raises profits by cutting supplier payments below sustainable levels is creating value, because the investors' slice of the pie grows.","o":[["True","Incorrect. Edmans distinguishes growing the pie (creating value for society and investors) from splitting it differently; squeezing suppliers redistributes value and may shrink the pie over time."],["False","Correct. Edmans distinguishes growing the pie (creating value for society and investors) from splitting it differently; squeezing suppliers redistributes value and may shrink the pie over time."]],"c":[1],"es":"False: that is pie-splitting, not pie-growing.","ed":"Edmans' tests for an investment include the multiplication principle (does it create more value for society than it costs?), comparative advantage and materiality. Squeezing suppliers can backfire through lower quality, supply disruptions and reputational damage.","kt":"Pie-growing mentality (Edmans): create value for society through excellence, and profits follow as a by-product; pie-splitting takes value from one stakeholder to give it to another.","src":"L4 slide 22 · L4 slide 23"},{"id":"TR13","l":"L4","t":"Shareholder vs stakeholder value","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: Two overlapping manufacturers merge in a country with strong employment protection, where closing duplicate plants is costly. According to the evidence in Lecture 4, how does the market tend to react to such deals?","o":[["No reaction, because labour law is irrelevant to merger value","Labour protection directly affects the cost of restructuring."],["Higher returns, because regulators approve such deals faster","Approval speed is not the mechanism discussed."],["Lower announcement returns, because synergies from layoffs are harder to realise","Strong labour rights protect workers (stakeholders) but cut expected synergy gains for shareholders."],["Higher announcement returns, because protected workers are always more productive","The evidence cited points to lower, not higher, returns."]],"c":[2],"es":"Stronger worker protection → harder restructuring → lower deal returns.","ed":"This is a clean case of shareholder vs stakeholder value: the same rule that protects employees reduces the value shareholders can capture from a horizontal merger. It shows why a single \"stakeholder value\" objective is hard to define.","kt":"","src":"Opptak L4 ca. 33 min"},{"id":"TR14","l":"L4","t":"Critique of stakeholderism","f":"m","d":4,"p":"H","sc":"none","s":"Lecture 4 describes managers giving some workers preferential employment contracts, so the workers side with them against an unwanted takeover bid. Which criticism of stakeholderism does this illustrate?","o":[["It requires firms to report under the CSRD","Reporting rules are unrelated to this mechanism."],["It can shield managers from shareholder accountability","Workers become allies that help managers keep their jobs; this is the entrenchment risk."],["It forces managers to maximise short-term share prices at any cost","The case is about managers resisting shareholder pressure, not obeying it."],["It makes takeovers more likely, because workers welcome new owners","In the example the workers help block the takeover."]],"c":[1],"es":"\"Serving stakeholders\" can disguise managerial entrenchment.","ed":"Bebchuk and Tallarita argue stakeholderism mostly serves managers. Jensen adds that with many objectives, managers can justify almost any decision. The lecture's Bergen-office example is the same pattern: a self-serving choice dressed up as serving the region.","kt":"","src":"Opptak L4 ca. 32 min"},{"id":"TR15","l":"L4","t":"Conflicts among stakeholders","f":"m","d":3,"p":"M","sc":"short","s":"Antitrust authorities break up a price cartel. Consumers gain from lower prices, but research shows the firms then lay off workers to restore profits. What does this case show about stakeholder value maximisation?","o":[["Shareholders always bear the full cost of illegal behaviour","The lecture notes workers, not shareholders, paid much of the price."],["Antitrust policy has no effect on employees","The research shows layoffs follow cartel investigations."],["Consumers and employees always benefit together","The case shows their interests diverging."],["Stakeholder interests can conflict with each other","Consumers gain while employees lose: there is no single \"stakeholder value\" to maximise."]],"c":[3],"es":"Helping one stakeholder group can hurt another.","ed":"This is why Jensen calls stakeholder maximisation ill-defined: with conflicting groups, any decision can be defended. In SF 2.0 (integrated value) this trade-off has to be made explicit, which raises measurement and accountability problems.","kt":"","src":"Opptak L4 ca. 29 min · Opptak L5 ca. 49 min"},{"id":"TR16","l":"L4","t":"Legal view on corporate purpose","f":"m","d":3,"p":"H","sc":"none","s":"Lawyers quoted in Lecture 4 argue that the 2019 Business Roundtable statement may not even be necessary. Why?","o":[["Delaware law already requires directors to maximise the welfare of all stakeholders.","Fiduciary duties (care and loyalty) are owed to shareholders, not all stakeholders."],["The statement was legally binding on all US firms.","It was a voluntary, non-binding declaration."],["Shareholders cannot sue directors under US law.","They can sue, which is why the business judgment rule matters."],["The business judgment rule already protects good-faith decisions.","Courts presume directors acted in good faith for shareholders, so managers already have room to consider stakeholders."]],"c":[3],"es":"Managers already have legal leeway via the business judgment rule.","ed":"The lecture gives both legal views: strictly, under Delaware law, putting stakeholders before shareholders could breach fiduciary duty; but in practice the business judgment rule (plus D&O insurance) protects good-faith choices, so the statement adds little.","kt":"Business judgment rule: courts presume directors made decisions in good faith, with due care and in the company's interest, unless shown otherwise.","src":"Opptak L4 ca. 38 min · Opptak L4 ca. 41 min"},{"id":"TR17","l":"L4","t":"Business Roundtable 2019","f":"m","d":3,"p":"H","sc":"short","s":"One month after Jeff Bezos signed the 2019 Business Roundtable stakeholder statement, Amazon-owned Whole Foods cut health insurance for part-time staff. Which criticism of the statement does this support best?","o":[["Stakeholder pledges always reduce firm value","The case says nothing about firm value."],["A non-binding pledge may be mostly publicity","Senator Warren called it a publicity stunt and proposed binding rules instead."],["Health insurance is a governance issue, not a social issue","Employee benefits are a social (S) issue."],["Part-time workers are not stakeholders under Freeman's theory","Employees are core stakeholders in Freeman's list."]],"c":[1],"es":"Voluntary, unenforced pledges invite doubts about real change.","ed":"Critics noted signatories like Goldman Sachs and BlackRock kept financing fossil fuel expansion. Warren's proposed Accountable Capitalism Act would have made stakeholder duties binding: workers electing 40% of board members, limits on directors selling shares, and 75% approval for political spending.","kt":"","src":"Opptak L4 ca. 20 min · Opptak L4 ca. 23 min"},{"id":"TR18","l":"L4","t":"Stakeholder governance","f":"m","d":2,"p":"M","sc":"none","s":"Under the Norwegian Companies Act, employees in firms with more than 30 employees can elect board representatives. How does Lecture 4 present this kind of rule?","o":[["As an example of a dual-class share structure","Dual-class shares give some shareholders extra votes; this is about employees."],["As a way to increase shareholders' control over managers","It gives employees, not shareholders, more say."],["As a rule only found in the United States","The lecture contrasts European laws (Germany, Norway, Sweden) with the US."],["As a binding way to give employees board voice","It makes stakeholder voice legally enforceable, unlike voluntary pledges."]],"c":[3],"es":"Employee board seats make stakeholder voice binding.","ed":"Germany goes further, with up to half of supervisory board seats for workers in large firms. Such codetermination contrasts with the US, where the BRT pledge was voluntary and the Accountable Capitalism Act was only proposed.","kt":"","src":"Opptak L4 ca. 25 min"},{"id":"TR19","l":"L4","t":"CSR and performance","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A very profitable firm uses its spare cash to fund community projects and better staff benefits. A struggling firm in the same sector does none of this. Which idea from Lecture 4 does this pattern fit?","o":[["Doing good by doing well: profits create slack","Causality runs from financial performance to CSR."],["Ethical relativism: right and wrong depend on the industry","This is an ethical theory, not a link between CSR and profits."],["Doing well by doing good: CSR causes higher profits through reputation","That runs the other way, from CSR to performance."],["Delegated philanthropy: investors ask the firm to donate for them","Nothing indicates investors asked for this."]],"c":[0],"es":"Slack from profits funds CSR = doing good by doing well.","ed":"Both directions have evidence. \"Doing well by doing good\": treating employees well shows up in stock returns (Edmans). \"Doing good by doing well\": only profitable firms have resources to spare. A correlation between CSR and profits alone cannot tell you which story is true.","kt":"","src":"Opptak L4 ca. 14 min"},{"id":"SB156","l":"L5","t":"Corporate governance","f":"m","d":1,"p":"H","sc":"none","s":"According to Lecture 5, where do corporate governance issues fundamentally come from?","o":[["Government regulation that forces firms to report quarterly.","Quarterly reporting is a source of short-termism, not the origin of governance problems."],["The separation of ownership and control (principal-agent problem).","Slide 7: governance issues arise from the separation of ownership (principals) and control (agents)."],["Shareholders having more information than managers about the business.","It is the agent (manager) who usually has superior information."],["The fact that firms are too small to have professional managers.","Governance problems are typical of large firms with professional managers and dispersed owners."]],"c":[1],"es":"Governance problems stem from separating ownership and control (principal-agent problem).","ed":"Owners (principals) delegate decision authority to managers (agents). Agency costs are the costs principals incur to make agents act in their interest. Problems arise because the agent has superior information and expertise, can choose behaviour after the contract is set and conceal outcomes, and cannot be monitored efficiently or costlessly. Corporate governance is the system of controls, regulation and incentives designed to minimise agency costs without unduly burdening managers with risk.","kt":"","src":"L5 slide 7-8 · L5 slide 14"},{"id":"SB157","l":"L5","t":"Agency problems","f":"m","d":3,"p":"H","sc":"short","s":"After two Boeing 737 MAX crashes (2018-19), investigations pointed to a culture that prioritised cost cutting, speed to market and share buybacks over engineering safety. Which governance lesson from Lecture 5 fits best?","o":[["Safety is an immaterial issue for aircraft manufacturers.","Product safety is highly material for aerospace."],["Short-term financial focus can misalign management with long-term value.","Short-termism and weak board oversight of safety destroyed value."],["Share buybacks always increase long-term firm value.","Buybacks can crowd out investment and do not guarantee value."],["Board oversight is irrelevant when a firm has a strong brand.","The case shows boards must oversee material risks."]],"c":[1],"es":"Short-termism + weak oversight of a material issue (safety) destroyed long-term value.","ed":"Boeing lost tens of billions in costs and market value, and the board later created a safety committee. In course terms: misaligned incentives, weak board expertise on a material issue, and the \"tragedy of the horizon\" between short-term metrics and long-term risk.","kt":"Short-termism: favouring near-term earnings or share price over long-term value creation, e.g. by under-investing.","src":"L5 slide 5 · L5 slide 19"},{"id":"SB158","l":"L5","t":"Adverse selection","f":"t","d":2,"p":"M","sc":"none","s":"True or false: Adverse selection occurs after a transaction, when a party changes its behaviour because someone else bears the risk, as when a borrower takes on riskier projects after receiving a loan.","o":[["True","Incorrect. That describes moral hazard. Adverse selection occurs before the transaction: hidden information is exploited, e.g. the borrowers most likely to produce bad outcomes are the ones most likely to seek loans."],["False","Correct. That describes moral hazard. Adverse selection occurs before the transaction: hidden information is exploited, e.g. the borrowers most likely to produce bad outcomes are the ones most likely to seek loans."]],"c":[1],"es":"False: that is moral hazard; adverse selection is about hidden information before the transaction.","ed":"Adverse selection (ex ante) - asymmetric information is exploited before the deal, as in Akerlof's \"lemons\" market where sellers of bad cars are most eager to sell, or riskier borrowers most eager to borrow. Moral hazard (ex post) - after the deal, behaviour changes when risks are borne by others; examples are debt overhang and asset substitution. Banks address adverse selection by screening and moral hazard by monitoring (Lecture 11).","kt":"","src":"L5 slide 10-13 · L11 slide 7"},{"id":"SB159","l":"L5","t":"Moral hazard","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A highly indebted firm's shareholders push management to swap a safe project for a very risky one, because they gain most of the upside while creditors bear most of the downside. Which concept from Lecture 5 is this?","o":[["Asset substitution (moral hazard)","Shifting to riskier assets after borrowing, at creditors' expense, is asset substitution."],["The tragedy of the horizon","That refers to costs now and benefits in the future, not risk-shifting."],["Adverse selection in the lemons market","There is no hidden information before the deal; behaviour changes after it."],["Tunnelling by a controlling shareholder","Tunnelling diverts assets to a controlling shareholder at minority shareholders' expense."]],"c":[0],"es":"Swapping to riskier assets after borrowing is asset substitution, a moral hazard problem.","ed":"Equity holders have a call-option-like payoff on firm assets (Lecture 10: equity holders get max(V - D, 0), debt holders min(V, D)). With high leverage they benefit from more risk, while creditors bear the losses: asset substitution. Debt overhang is the related problem where shareholders reject positive-NPV projects because gains would mostly go to creditors. Both arise after the contract is written.","kt":"","src":"L5 slide 13 · L10 slide 3"},{"id":"SB160","l":"L5","t":"Purpose of corporate governance","f":"t","d":2,"p":"M","sc":"short","s":"True or false: A board that ignores repeated audit committee warnings about weak internal controls fails the OECD purpose of corporate governance, which is to build trust, transparency and accountability that support long-term investment and stability.","o":[["True","Correct. The OECD principles see governance as building an environment of trust, transparency and accountability; ignoring control weaknesses undermines exactly that."],["False","Incorrect. The OECD principles see governance as building an environment of trust, transparency and accountability; ignoring control weaknesses undermines exactly that."]],"c":[0],"es":"True: ignoring control warnings undermines trust and accountability.","ed":"Wirecard is a real example of what happens when boards, auditors and supervisors fail to act on warnings. Good governance supports long-term investment, financial stability and business integrity.","kt":"Corporate governance: the system of rules, practices and processes by which a company is directed and controlled, balancing the interests of stakeholders.","src":"L5 slide 8"},{"id":"SB161","l":"L5","t":"Voice and exit","f":"m","d":2,"p":"H","sc":"none","s":"According to Lecture 5, how does \"exit\" work as a governance mechanism?","o":[["Regulators remove a company's licence to operate.","This is not a shareholder mechanism."],["Selling shares lowers the price; the threat of selling disciplines managers ex ante.","Slide 17: exit hurts managers ex post; the threat induces value maximisation ex ante."],["Shareholders vote managers out at the annual general meeting.","Voting is a form of voice, not exit."],["Investors talk privately with management to change company policy.","Engagement (\"jawboning\") is voice."]],"c":[1],"es":"Exit = selling shares; its threat disciplines managers ex ante.","ed":"Shareholders have two direct mechanisms. Voice: voting at shareholder meetings and engagement with companies. Exit: selling shares (\"Wall Street walk\"), which lowers the share price and hurts managers ex post; the threat of exit induces value maximisation ex ante. Lecture 8 notes that passive investors can vote but cannot exit, and the textbook argues divestment alone has limited effect because others buy the shares.","kt":"","src":"L5 slide 17 · L8 slide 71 · Bok s. 89 (3.3.4)"},{"id":"SB162","l":"L5","t":"Good governance practices","f":"m","d":3,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A listed company's CEO also chairs the board, five of seven directors are former executives, the audit firm has served for 25 years, and pay is based on annual revenue growth. Which change best reflects good governance practice?","o":[["Separate the CEO and chair roles and add independent directors.","Independence strengthens monitoring of management."],["Make revenue growth the only performance metric.","Growth-only pay encourages value-destroying expansion."],["Extend the audit firm's tenure to 35 years for continuity.","Very long tenure threatens auditor independence; rotation is good practice."],["Appoint more former executives to increase industry knowledge.","This weakens independence further."]],"c":[0],"es":"Independent oversight and long-term incentives are core good governance practices.","ed":"Other practices in the lecture include board diversity, transparency, shareholder rights and oversight of sustainability. Evidence (Gompers et al.) links stronger governance to higher valuations, and strong G often drives strong S and E. Also correct: Link pay to long-term, risk-adjusted value and material ESG targets.","kt":"Board independence: directors without ties to management who can monitor and challenge executives.","src":"L5 slide 19 · Bok s. 135 (5.3.3)"},{"id":"SB163","l":"L5","t":"Governance of sustainability","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: A Norwegian salmon farmer's board has no member with biology or environmental expertise, despite sea lice and escapes being its most material risks. What is the most relevant governance improvement?","o":[["Focus the board only on quarterly earnings.","This ignores the material drivers of long-term value."],["Delegate all environmental issues to the marketing department.","Material risks need board-level oversight, not just communications."],["Add board expertise and oversight on the material environmental risks.","Boards need competence to oversee the issues that drive value."],["Stop reporting on sea lice to avoid negative attention.","Hiding material risks undermines trust and can raise the cost of capital."]],"c":[2],"es":"Board competence and oversight should match the firm's most material issues.","ed":"Good governance of sustainability helps manage risks, seize opportunities and build trust with investors and regulators. For a salmon farmer, biology and licence-to-operate issues are directly linked to volumes, costs and licences.","kt":"Materiality: issues that can substantially affect a company's value (financial) or its impact on society (impact materiality).","src":"L5 slide 20 · L6 slide 51"},{"id":"SB164","l":"L5","t":"Nestlé and Cargill child labour case","f":"m","d":4,"p":"H","sc":"extended_course_case","s":"Lecture 5 case: Nestlé, Cargill and others were sued in the US over forced child labour on cocoa plantations; a judge found plaintiffs lacked standing because they could not show a \"traceable connection\" to specific plantations. Which statement applies the lecture's framework correctly?","o":[["Good governance practices such as whistleblowing procedures and anti-corruption policies are irrelevant to supply chain abuses.","Compliance policies, board oversight and due diligence are exactly the practices that can prevent such cases."],["Shareholders can respond through voice (voting, engagement on supply chain due diligence) or exit (selling the shares).","These are the direct governance mechanisms on slide 17."],["Under the shareholder model, managers are legally required to use child labour if it is cheaper.","No legal duty requires illegal or unethical practices; the shareholder model can, however, create incentives to cut corners."],["Because the plaintiffs lacked standing, the case has no possible effect on the companies' financial value.","Reputational damage, litigation costs, consumer reactions and regulatory risk can still affect value."]],"c":[1],"es":"Incentive: cheap inputs with externalised, hard-to-trace harm; response: voice or exit; value effects remain despite the ruling.","ed":"The discussion follows five questions: incentives for abuses (cost savings, weak traceability and limited liability), shareholder mechanisms (voice and exit), preventive practices (board oversight, compliance, due diligence, whistleblowing), effects on financial value (reputation, litigation, consumers, regulation, cost of capital) and governance challenges under the shareholder model (narrow focus enabling morally dubious decisions) and the stakeholder model (balancing interests, accountability). Courts' reluctance to assign liability shows why public policy alone does not fully internalise such externalities. Also correct: Firms may tolerate abuses because cheap inputs raise short-term profits while harms fall on distant third parties who cannot easily sue.","kt":"","src":"L5 slide 3-6 · L5 slide 16-22 · L5 slide 24"},{"id":"SB165","l":"L5","t":"Finance as usual","f":"m","d":3,"p":"M","sc":"none","s":"According to Lecture 5, which set of forces pushes towards maintaining the status quo rather than internalising externalities?","o":[["Integrated reporting, long vesting periods, and clawback provisions","These are remedies against short-termism."],["Green bonds, impact investing, and microfinance","These are SF 3.0 instruments promoting change."],["Incumbent lobbying, agency problems and investor biases","These three forces are listed on slide 25."],["Climate litigation, carbon taxes, and investor coalitions","These push towards change, not the status quo."]],"c":[2],"es":"Status-quo forces: incumbent lobbying, agency problems, and investor biases (chasing returns, herding).","ed":"Moving from understanding externalities to acting on them is hard because incumbents lobby to protect the value of existing assets (e.g. oil industry vs electric cars in California, Global Climate Coalition), agency problems persist between companies and investors, and investors herd and chase returns, extrapolating the past. Climate change litigation (slide 25) is a growing counter-force. Investors can engage to stop lobbying and, failing that, exclude lobbying companies.","kt":"","src":"L5 slide 25 · Bok s. 78 (3.1.2)"},{"id":"SB166","l":"L5","t":"Market efficiency","f":"m","d":3,"p":"H","sc":"none","s":"Why can the adaptive markets hypothesis (Lo) explain that carbon risk is not yet fully priced, while the efficient markets hypothesis cannot?","o":[["Under EMH, prices are set by regulators rather than investors.","EMH is about prices reflecting information, not regulation."],["Under AMH, efficiency depends on how many investor groups analyse a risk.","If only a few groups examine a new risk such as carbon, prices may not fully reflect it."],["AMH assumes investors have rational expectations and maximise expected utility.","AMH replaces this neoclassical assumption with an evolutionary model."],["Under AMH, all relevant information is always incorporated into prices immediately and without bias.","That is the EMH claim."]],"c":[1],"es":"AMH: market efficiency depends on the number and nature of participant groups; new risks studied by few are under-priced.","ed":"The EMH (Fama 1970) says prices incorporate all relevant information and on average reflect long-term fundamental value, which reinforces the share price as the central performance measure. The AMH (Lo) sees efficiency as the outcome of individuals adapting to a changing environment: prices reflect as much information as the number and nature of distinct groups of participants allow. New risks (e.g. carbon) examined by few investors may be under-priced, as Hong, Li and Xu and Andersson, Bolton and Samama suggest.","kt":"","src":"L5 slide 26 · Bok s. 90 (3.4) · Bok s. 91 (3.4)"},{"id":"SB167","l":"L5","t":"Market efficiency","f":"t","d":2,"p":"M","sc":"none","s":"True or false: If markets were fully efficient as the EMH states, active investors could not systematically benefit from superior ESG insights, which would suggest that everyone should invest passively.","o":[["True","Correct. Lecture 8 (slide 68) states that under the EMH it is impossible to benefit from superior insights, which suggests passive investing; this is presented as a barrier to sustainability integration."],["False","Incorrect. Lecture 8 (slide 68) states that under the EMH it is impossible to benefit from superior insights, which suggests passive investing; this is presented as a barrier to sustainability integration."]],"c":[0],"es":"True: under EMH, superior insight cannot be exploited, so passive investing would be optimal.","ed":"The EMH makes the stock price the central performance measure and implies no benefit from active analysis. This is a barrier to integrating sustainability, because ESG integration and engagement require fundamental, active analysis (Table 8.3), and passive investors cannot exit. The AMH offers an alternative view in which new risks may be mispriced, creating a role for long-term, informed investors.","kt":"","src":"L8 slide 68 · L5 slide 26 · Bok s. 95 (3.5)"},{"id":"SB168","l":"L5","t":"SF 1.0 and SF 2.0 governance challenges","f":"m","d":3,"p":"H","sc":"none","s":"Lecture 5 lists governance challenges for the refined shareholder model (SF 1.0) and the stakeholder model (SF 2.0). Which statement is correct?","o":[["Both models assume externalities are fully priced by markets.","Neither does; that is why S and E are added."],["A challenge of both models is how to measure social and environmental value.","Measurement appears on both slide 27 and slide 28."],["The refined shareholder model has no challenges because it uses a single objective.","Slide 27 lists several challenges, including unresolved conflicts of interest."],["The stakeholder model makes it easier to hold managers accountable than the shareholder model.","The concern is the opposite: subjectivity reduces accountability."]],"c":[1],"es":"SF 1.0: unaccountable on multiple goals, unresolved conflicts, measurement; SF 2.0: balancing interests, subjectivity and agency costs, measurement.","ed":"Slide 27 (SF 1.0) - leaves managers unaccountable when optimising several objectives, fails to resolve many shareholder-stakeholder conflicts, and raises the question of how to measure S and E value. Slide 28 (SF 2.0) - how to balance all stakeholders' interests, increased subjectivity that may raise agency costs, and how to measure integrated value. The lecture's summary: focusing on stakeholder value can create shareholder value, but defining the objective as stakeholder value can increase agency costs (moral hazard, greenwashing). Also correct: A challenge of the stakeholder model (SF 2.0) is increased subjectivity, which can increase agency costs.","kt":"","src":"L5 slide 27-28 · L5 slide 45"},{"id":"SB169","l":"L5","t":"Sustainable governance guidelines","f":"m","d":3,"p":"M","sc":"constructed_scenario","s":"Constructed scenario: An asset manager markets an \"ESG\" fund but pays portfolio managers bonuses based only on one-year returns versus the index. Which governance principle from the course is most at odds with this?","o":[["Maximising diversification across thousands of stocks","Diversification is not the issue here."],["Excluding all sin stocks","The issue is incentives, not exclusions."],["Aligning incentives with long-term value creation","One-year relative bonuses encourage short-termism."],["Reporting returns in local currency","Irrelevant to the governance problem."]],"c":[2],"es":"Short-term bonuses conflict with long-term value creation.","ed":"The textbook argues that horizons shorten along the investment chain when each party is judged on short-term metrics (Lecture 8). An \"ESG\" label combined with one-year incentives is a recipe for \"say one thing, do another\".","kt":"Long-term incentive alignment: pay and evaluation horizons that match the long-term goals of clients and beneficiaries.","src":"L5 slide 25 · Bok s. 187 (7.1.4)"},{"id":"SB170","l":"L5","t":"Short-termism","f":"t","d":2,"p":"H","sc":"none","s":"True or false: The \"tragedy of the horizon\" (Carney, 2015) refers to the situation where the costs of sustainable action are borne now, while the social and environmental benefits arise in the future.","o":[["True","Correct. This is the textbook's key-concept definition."],["False","Incorrect. This is the textbook's key-concept definition."]],"c":[0],"es":"True: costs now, benefits later - and short horizons discount the future.","ed":"Because the impacts of economic activity on society and especially the environment are felt in the long term, and managers and investors work to short horizons, long-term benefits are heavily (myopically) discounted. Practices that reinforce short-termism: quarterly reporting, annual-result-based variable pay, monthly/quarterly benchmarking of fund managers, marking-to-market, and supervisory treatment favouring liquid assets.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 98 (Key concepts) · L5 slide 29"},{"id":"SB171","l":"L5","t":"Short-termism","f":"m","d":2,"p":"H","sc":"none","s":"Which practice does the textbook identify as reinforcing short-termism?","o":[["Integrated reporting covering six capitals","Integrated reporting is proposed to lengthen horizons and attract long-term investors."],["Deferred bonuses contingent on long-term results","Deferral is a remedy that spreads pay over future periods."],["Buy-and-hold investment in infrastructure","Buy-and-hold is long-term; supervisory bias against it is the problem."],["Quarterly financial reporting by companies","High reporting frequency pushes managers to defend the share price each quarter."]],"c":[3],"es":"Quarterly reporting, annual-based variable pay, short benchmarking, marking-to-market and supervisory treatment reinforce short-termism.","ed":"The textbook lists five practices: quarterly financial reporting, variable pay based on annual results, monthly/quarterly benchmarking, marking-to-market, and supervisory treatment of illiquid investments. A common theme is the EMH, which elevates the share price as the performance measure. Remedies: less frequent reporting with long-term metrics, deferred pay and clawbacks, longer evaluation periods, less reliance on marking-to-market for long-lived illiquid assets, and allowing buy-and-hold. Also correct: Monthly or quarterly benchmarking of fund managers' performance.","kt":"","src":"Bok s. 90 (3.4) · Bok s. 77 (Table 3.1)"},{"id":"SB172","l":"L5","t":"Short-termism","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook, what is the trade-off in reducing financial reporting frequency (e.g. moving away from quarterly reporting)?","o":[["There is no trade-off: less frequent reporting improves both incentives and information.","Less frequent reporting gives the market less information."],["Less frequent reporting would eliminate the need to disclose any material information.","Timely publication of material information remains important."],["Managers would face more pressure, because fewer reports make each one more important.","The textbook argues pressure falls with lower frequency."],["Managers face less share-price pressure and can choose better long-term projects, but markets get less information.","Gigler et al.: infrequent reports can improve project selection though they provide less information to capital markets."]],"c":[3],"es":"Less frequent reporting reduces myopic pressure but gives markets less information.","ed":"Most firms see quarterly earnings as the key metric for outsiders (Graham, Harvey and Rajgopal). High reporting frequency pushes managers to sustain the share price, inducing myopic investment choices. Less frequent reports can give better project-selection incentives, but provide less information; timely disclosure of material events remains necessary. Barton and Wiseman propose longer-term metrics (10-year economic value added, R&D efficiency, multi-year returns), and integrated reporting broadens what is reported.","kt":"","src":"Bok s. 91 (3.4.1)"},{"id":"SB173","l":"L5","t":"Executive compensation","f":"m","d":3,"p":"H","sc":"none","s":"Which pay design feature does the textbook describe as allowing an employer to take back money already paid out, for example when later losses show that executives were overpaid?","o":[["An annual cash bonus based on EBIT","Annual EBIT bonuses are a source of short-termism, not a recovery mechanism."],["A clawback provision","Clawbacks recover pay already disbursed, sometimes with a penalty."],["A longer vesting period","Longer vesting delays when equity can be sold; it does not recover past payments."],["A deferred reward","Deferral delays payment and makes it contingent on later events, but does not take back what was paid."]],"c":[1],"es":"Clawbacks recover pay already disbursed; deferral and longer vesting delay pay.","ed":"Bonuses based on annual results or stock options reinforce short-termism (Edmans, Fang and Lewellen). Remedies: the deferred reward principle (spread pay over current and future periods, contingent on later outcomes such as completion of a strategy), longer vesting or lock-up periods for equity, even after retirement, and clawback provisions (activated for fraud, accounting errors or later losses revealing excess pay). Lecture 5 adds the idea of paying CEOs with shares they must hold after leaving.","kt":"","src":"Bok s. 92 (3.4.2) · L5 slide 29"},{"id":"SB174","l":"L5","t":"ESG-linked executive pay","f":"m","d":3,"p":"H","sc":"none","s":"Lecture 5 discusses linking executive compensation to climate or ESG performance. Which concern or finding is presented?","o":[["There is only a weak correlation between ESG pay and ESG performance, and it is not causal.","Slide 36: weak correlation, not causal."],["Linking pay to ESG has been shown to cause large improvements in emissions in all firms.","The slide stresses the correlation is weak and not causal."],["ESG pay metrics are typically fully transparent and quantitative.","Lack of transparency and vague discretionary measures are criticisms."],["ESG pay is irrelevant because executives cannot influence sustainability performance.","The rationale for ESG pay is precisely that executives influence it; the issue is design."]],"c":[0],"es":"ESG pay is weakly (non-causally) related to ESG performance; targets are often short-term, vague and opaque.","ed":"The textbook's guideline 1 suggests sustainability indicators in executive contracts. Lecture 5 shows practice (PwC 2021 survey) and its problems: concentration on tactical short-term targets, vague discretionary measures mixed with qualitative goals, lack of transparency, and only a weak, non-causal link between ESG pay and ESG performance. Better design: strategic, measurable, long-term targets, as in Starbucks' move to a three-year modifier on equity awards. Also correct: ESG targets often focus on tactical, short-term goals such as operational efficiency rather than strategic goals like emissions reductions.","kt":"","src":"L5 slide 31-38 · Bok s. 87 (3.3.2)"},{"id":"SB175","l":"L5","t":"ESG-linked executive pay","f":"t","d":3,"p":"M","sc":"extended_course_case","s":"True or false: Starbucks removed sustainability from its short-term annual bonus and introduced it as a three-year modifier of executives' performance-based equity awards, shifting sustainability incentives from short-term to long-term compensation.","o":[["True","Correct. This is stated on Lecture 5, slide 44."],["False","Incorrect. This is stated on Lecture 5, slide 44."]],"c":[0],"es":"True: Starbucks moved sustainability from the annual bonus to a three-year equity modifier.","ed":"The change addresses the concern that ESG targets in annual bonuses tend to be short-term and tactical. Linking sustainability to multi-year equity awards aligns it with the deferred reward principle and lengthens executives' horizons, consistent with the textbook's guideline 2 (lengthening executive horizons).","kt":"","src":"L5 slide 39-44 · Bok s. 92 (3.4.2)"},{"id":"SB176","l":"L5","t":"Corporate governance models","f":"m","d":3,"p":"M","sc":"none","s":"According to the textbook, which governance problem is typical of mainland European and Asian firms with controlling shareholders?","o":[["Dispersed shareholders failing to monitor managers, which leads to frequent hostile takeovers.","Dispersed ownership and active takeover markets are typical of Anglo-Saxon countries."],["Tunnelling of assets by a controlling shareholder at minority holders' expense.","Controlling shareholders can expropriate minority shareholders, e.g. by shifting assets within a business group."],["Managers being replaced too quickly through hostile takeovers.","Takeover markets are less active in civil law countries; management is more entrenched."],["Shareholders having too much accountability over managers through quarterly benchmarking.","This is not the governance problem associated with controlling shareholders."]],"c":[1],"es":"With controlling shareholders, the key agency conflict is with minority shareholders (tunnelling).","ed":"Anglo-Saxon (common law) countries have dispersed shareholders, active stock markets and a market for corporate control; the classic agency problem is shareholders vs managers, solved by limited-term contracts, performance pay and takeovers - but with a risk of short-termism. Mainland Europe and Asia have more controlling shareholders (families, the state); the agency problem shifts to controlling vs minority shareholders, e.g. tunnelling, requiring minority protection. Management is more entrenched and intervention in underperformers can be delayed.","kt":"","src":"Bok s. 84 (3.3)"},{"id":"SB177","l":"L5","t":"Governance mechanisms for sustainability","f":"m","d":3,"p":"M","sc":"none","s":"The textbook lists governance mechanisms that can embed sustainability. Which is among them?","o":[["Widening the audit committee's remit to integrated reports, or creating a sustainability committee","Non-executive/supervisory board monitoring."],["Abolishing loan covenants so creditors have no influence","The textbook notes integrated balance sheets change covenant ratios; creditors remain relevant."],["Discouraging long-term, prosocial investors from holding the shares","The textbook suggests attracting long-term investors (Knauer and Serafeim)."],["Banning integrated reporting to keep reports simple","Integrated reporting is promoted, not banned."]],"c":[0],"es":"Executive contracts, type of shareholders, creditors (covenants) and board monitoring can embed sustainability.","ed":"Summary of section 3.3.2: (1) executive contracts and compensation with sustainability KPIs; (2) type of shareholders - prosocial (Hart and Zingales) and long-term investors attracted by integrated thinking and reporting; (3) creditors - integrated balance sheets change ratios such as debt-to-equity used in covenants; (4) non-executive/supervisory board monitoring, e.g. through the audit committee or a separate sustainability committee. The textbook notes that legally the difference between shareholder and stakeholder models may matter less than in theory (business judgement rule). Also correct: Including sustainability KPIs (e.g. a sustainability index ranking or integrated P&L) in executive contracts and pay.","kt":"","src":"Bok s. 87 (3.3.2) · Bok s. 88 (3.3.2)"},{"id":"SB178","l":"L5","t":"Organisational forms","f":"m","d":3,"p":"L","sc":"none","s":"According to the textbook, what is a major drawback of the cooperative as an organisational form?","o":[["It forces managers to maximise market value for outside shareholders.","Cooperatives work for members' mutual benefit, not outside shareholders."],["It cannot raise equity beyond its members, limiting growth.","Lack of access to external equity can become a constraint when the cooperative grows or makes losses."],["It cannot align the interests of customers or suppliers with the company.","Alignment of major stakeholders with the firm is the cooperative's strength."],["It is a private certification with no legal status, issued by B Lab.","That describes the B corporation certification."]],"c":[1],"es":"Cooperatives align members' interests but cannot raise external equity.","ed":"Summary of section 3.3.3: private companies (private equity) can intervene directly and scale up via institutional money; cooperatives align customers or suppliers with the firm but cannot raise external equity; B corporations are privately certified (by B Lab) without legal status, unlike US benefit corporations; social enterprises and foundations put impact first but lack external shareholder pressure; governmental organisations serve the public good but may lack efficiency and depend on public budgets.","kt":"","src":"Bok s. 88 (3.3.3) · Bok s. 89 (3.3.3)"},{"id":"SB179","l":"L5","t":"Investor engagement","f":"t","d":3,"p":"H","sc":"short","s":"True or false: According to McCahery, Sautner and Starks (2016), long-term institutional investors tend to prefer engaging privately with management before using exit (selling), and they intervene more intensively than short-term investors.","o":[["True","Correct. They find behind-the-scenes engagement is widespread and long-term investors intervene more; exit is often a last resort."],["False","Incorrect. They find behind-the-scenes engagement is widespread and long-term investors intervene more; exit is often a last resort."]],"c":[0],"es":"True: long-term investors favour voice and intervene more.","ed":"LGIM's engagement with Glencore (Lecture 8) is a real example of escalation from voice to exit. Passive investors cannot exit, which makes their voice the main lever.","kt":"Voice vs exit: voice = engagement and voting to change a firm; exit = selling the shares (\"Wall Street walk\").","src":"Bok s. 199 (8.2.5) · L8 slide 58 · L8 slide 71"},{"id":"SB180","l":"L5","t":"Engagement","f":"m","d":3,"p":"H","sc":"none","s":"According to the textbook, why does divestment (\"exit\") have limited impact compared with engagement (\"voice\")?","o":[["Divested shares are cancelled, reducing the firm's cost of capital.","Divested shares are sold to others, not cancelled."],["Another investor buys the shares; engagement targets policy directly.","Section 3.3.4 refers back to 1.4.1: divestment has limited impact because others buy the shares."],["Divestment is illegal for institutional investors in the EU under current fiduciary rules.","Divestment is legal and widely used."],["Engagement guarantees that firms will always change their behaviour.","Engagement can fail; escalation (e.g. LGIM and Glencore) may end in divestment."]],"c":[1],"es":"Sold shares find another owner; voice can change firm policy directly.","ed":"When an investor sells, another investor (possibly one who does not care) becomes the owner, and the price effect is modest (Heinkel, Kraus and Zechner). Engagement (dialogue, voting, shareholder proposals) aims to change firm behaviour directly and is used more by long-term investors. In practice they are combined: engage first, escalate, and divest if engagement fails, as LGIM did with Glencore (Lecture 8). The Gollier and Pouget \"washing machine\" idea (Lecture 9) shows how a large activist can profit by turning irresponsible firms responsible.","kt":"","src":"Bok s. 89 (3.3.4) · Bok s. 21 (1.4.1) · L8 slide 58 · L9 slide 32"},{"id":"SB181","l":"L5","t":"Marking-to-market","f":"m","d":4,"p":"L","sc":"none","s":"According to Plantin, Sapra and Shin (2008), as summarised in the textbook, for which type of claims is the damage from marking-to-market greatest?","o":[["Long-lived, illiquid, senior claims such as bank loans","For these, price distortions from illiquidity outweigh the benefits of timely market signals."],["Short-lived, liquid and junior claims, such as traded stocks","For junior assets in liquid markets, marking-to-market is superior to historical cost."],["All claims equally, so historical cost is always better","The textbook says marking to market is better for liquid junior assets like stocks."],["Cash and central bank reserves","These have no meaningful mark-to-market distortion."]],"c":[0],"es":"Marking-to-market harms most for long-lived, illiquid, senior claims (e.g. bank loans).","ed":"In illiquid markets, others' sales depress observed prices beyond fundamentals; under mark-to-market this hurts holders, and short-horizon investors pre-emptively sell, amplifying price falls (endogenous volatility), especially in crises. Historical cost, however, ignores real value changes. Hence: mark-to-market for liquid junior assets (stocks), amortised cost for long-lived, illiquid, senior assets (bank loans, insurance liabilities). The point matters for long-term sustainable investments that are illiquid.","kt":"","src":"Bok s. 93 (3.4.4) · Bok s. 94 (3.4.4)"},{"id":"SB182","l":"L5","t":"Supervisory treatment","f":"t","d":3,"p":"M","sc":"none","s":"True or false: According to the textbook, supervisory rules that impose higher capital charges on illiquid private investments than on liquid listed assets can discourage long-horizon environmental projects such as land restoration or infrastructure.","o":[["True","Correct. Section 3.4.5 explains that liquid assets carry low capital charges while private and direct investments carry higher ones, disadvantaging long-horizon projects that cannot be measured frequently."],["False","Incorrect. Section 3.4.5 explains that liquid assets carry low capital charges while private and direct investments carry higher ones, disadvantaging long-horizon projects that cannot be measured frequently."]],"c":[0],"es":"True: liquidity-biased capital charges penalise long-term, illiquid sustainable projects.","ed":"Supervisory treatment based on marking-to-market, liquidity and efficient markets favours listed, liquid assets. Environmental projects (land restoration ~20 years, energy, roads, coastal defence) are long-horizon and illiquid. The textbook suggests assessing such projects over their full cycle (e.g. with scenario analysis) when institutions hold them to maturity, reducing the illiquidity surcharge. Guideline 5 thus calls for allowing buy-and-hold investments.","kt":"","src":"Bok s. 94 (3.4.5) · L5 slide 30"},{"id":"SB183","l":"L5","t":"Short-termism","f":"m","d":2,"p":"L","sc":"none","s":"What evidence of short-termism in UK and US stock prices does the textbook cite (Davies et al., 2014)?","o":[["Prices discounted distant future cash flows too heavily (myopia).","This suggests significant myopia."],["Stock prices perfectly reflect long-term fundamentals with no bias.","The evidence points to a myopic bias."],["Stock prices put too much weight on distant future dividends.","Under-discounting would indicate the opposite of myopia."],["Myopia exists only in emerging markets, not in the UK and US.","The evidence concerns UK and US stock prices."]],"c":[0],"es":"Prices over-discounted future dividends by 5-10% (myopia).","ed":"Excessive (myopic) discounting means long-term cash flows, where many sustainability benefits lie, get too little weight in prices. Combined with the tragedy of the horizon, this supports the textbook's incentive-compatible remedies: long-term pay structures, less reliance on marking-to-market and longer evaluation horizons.","kt":"","src":"Bok s. 94 (3.4.5)"},{"id":"SB184","l":"L5","t":"Behavioural biases","f":"m","d":2,"p":"L","sc":"none","s":"According to the textbook, what is an example of collaborative consumption?","o":[["Choosing a car mainly to outdo neighbours.","This is competitive consumption driven by status."],["Buying a new phone model before the old one reaches the end of its technical lifetime.","This is an example of overconsumption."],["The sharing economy (shared access to cars, bikes or homes).","Collaborative consumption mutualises access to goods and services."],["Holding expensive celebrations to signal status.","This is competitive consumption."]],"c":[2],"es":"Collaborative consumption = sharing economy (shared access instead of individual ownership).","ed":"Competitive consumption (status-driven, e.g. expensive cars and celebrations) and conformist consumption drive overuse of underpriced natural capital. Dasgupta and Ehrlich estimate that if 6.2 billion people in poorer countries consumed like the 1.3 billion in rich countries, at least two more Earths would be needed. Collaborative consumption (sharing cars, bikes, homes via platforms) can reduce resource use; nudging can help communities coordinate on less resource-intensive behaviour.","kt":"","src":"Bok s. 75 (3.1.1) · Bok s. 76 (3.1.1)"},{"id":"SB185","l":"L5","t":"Corporate scandals","f":"t","d":2,"p":"M","sc":"none","s":"True or false: The textbook argues that corporate scandals such as Enron (US), Volkswagen (Europe) and Olympus (Japan) show that one regional corporate governance model is superior, because scandals only happen in Anglo-Saxon countries.","o":[["True","Incorrect. The textbook states there is no superior corporate governance model: scandals happen in all major regions, revealing classic agency problems."],["False","Correct. The textbook states there is no superior corporate governance model: scandals happen in all major regions, revealing classic agency problems."]],"c":[1],"es":"False: scandals occur in all regions; no governance model is superior.","ed":"Summary of Box 3.1: Enron used accounting loopholes and special purpose entities to hide debt and inflate performance; Volkswagen used defeat devices to cheat US emissions tests; Olympus concealed $1.5 billion of losses for years. All three show managers boosting profits and hiding problems - classic agency problems - under different governance systems. This motivates the governance mechanisms in section 3.3.","kt":"","src":"Bok s. 78 (3.1.2) · Bok s. 79 (Box 3.1)"},{"id":"SB186","l":"L5","t":"Players in sustainability","f":"m","d":3,"p":"M","sc":"none","s":"According to Table 3.1 in the textbook, which statement about the horizon of sustainability players is correct?","o":[["Investors always have a long-term horizon because of quarterly benchmarking.","Investors range from short to long term; quarterly benchmarking is a threat, not a source of long horizons."],["Governments have horizons of up to four years (election cycle).","Table 3.1 lists government horizon as up to four years."],["Households have no role because they cannot influence corporations.","Households steer corporates and investments through buying decisions and votes."],["Corporates have the shortest horizon of all players, below one quarter.","Corporates are listed with medium- to long-term horizons."]],"c":[1],"es":"Government horizon is up to four years; investors range from short to long term; corporates and civil society medium to long term.","ed":"Summary of Table 3.1: government (country/global, up to four years, taxation and regulation; threats: shortfall, free-riding, dealing with future generations), civil society (debate, medium to long term, NGOs' public voice), corporates (value chain, medium to long term; threats: short-termism, lobbying, relocating production), investors (short to long term, investment and lending strategy, engagement; threats: short-termism, long investment chains, marking to market), households (consumption, short to long term; threats: poverty, aversion to change).","kt":"","src":"Bok s. 77 (Table 3.1)"},{"id":"SB187","l":"L5","t":"Fiduciary duty","f":"m","d":3,"p":"M","sc":"none","s":"What does the EU High-Level Expert Group on Sustainable Finance recommend about fiduciary duty, according to the textbook?","o":[["Limit fiduciary duty to maximising short-term returns relative to a benchmark.","The clarification broadens the duty to sustainability factors."],["Clarify that it includes sustainability factors and beneficiaries' preferences.","The clarified duty requires incorporating sustainability factors and proactively understanding beneficiaries' sustainability preferences."],["Remove fiduciary duty so that asset managers can follow their own values.","The recommendation clarifies, not removes, fiduciary duty."],["Apply fiduciary duty only to banks and not to pension funds.","It targets institutional investors and their asset managers."]],"c":[1],"es":"Fiduciary duty should explicitly include sustainability factors and beneficiaries' sustainability preferences.","ed":"Fiduciary duty sets out what financial institutions owe their beneficiaries (loyalty, prudence, transparency). The HLEG recommends clarifying in EU directives that sustainability factors must be incorporated in investment strategy, risk management, asset allocation, governance and stewardship, and that all participants in the investment chain proactively seek to understand beneficiaries' sustainability preferences and disclose effects. This echoes Hart and Zingales' call for asset managers to follow investors' preferences.","kt":"","src":"Bok s. 86 (3.3.1) · Bok s. 97 (Key concepts)"},{"id":"SB188","l":"L5","t":"Short-termism","f":"t","d":3,"p":"M","sc":"none","s":"True or false: The textbook argues that performance evaluation of fund managers should be aligned with the time horizon of the investment strategy, for example using three- or five-year moving averages instead of quarterly benchmarking.","o":[["True","Correct. Section 3.4.3 recommends aligning evaluation with the strategy's horizon and refers to Chapter 7's three- or five-year moving averages."],["False","Incorrect. Section 3.4.3 recommends aligning evaluation with the strategy's horizon and refers to Chapter 7's three- or five-year moving averages."]],"c":[0],"es":"True: evaluate long-term strategies over long horizons (e.g. 3-5 years).","ed":"Quarterly relative performance monitoring makes fund managers short-termist (Baker), and passive strategies mean fewer shareholders know any firm's fundamentals. Aligning evaluation with the investment horizon facilitates engagement. Edmans adds that intended holding periods differ from observed ones: a long-term investor may still sell early on new long-term information.","kt":"","src":"Bok s. 92 (3.4.3) · Bok s. 93 (3.4.3)"},{"id":"SB189","l":"L5","t":"Governance summary","f":"m","d":4,"p":"H","sc":"none","s":"Which statement best captures the conclusion of Lecture 5 (slide 45)?","o":[["Stakeholder value maximisation always reduces agency costs and should replace shareholder protection.","The slide warns that it can increase agency costs."],["Corporate governance is irrelevant to sustainability because ESG is a marketing issue.","The lecture shows governance is central to sustainability."],["Stakeholder focus can create value, but a stakeholder objective may raise agency costs.","This combines the three points on the summary slide."],["Shareholder value maximisation fully internalises externalities, so no change in governance is needed.","The lecture stresses that externalities are not fully internalised."]],"c":[2],"es":"Stakeholder focus can create shareholder value, but a stakeholder objective risks higher agency costs; rethink governance to protect shareholders.","ed":"Summary of slide 45: (1) focusing on stakeholder value can help create shareholder value, e.g. firms internalising externalities ex ante; (2) defining the firm's objective as stakeholder value maximisation can increase agency costs by increasing subjectivity and room for manipulation (moral hazard, greenwashing); (3) the transition requires careful rethinking of governance to ensure shareholder protection. This mirrors Jensen's critique and the textbook's guidelines.","kt":"","src":"L5 slide 45 · L5 slide 27-28"},{"id":"SB190","l":"L5","t":"Forces for change","f":"m","d":3,"p":"M","sc":"short","s":"Climate cases such as Milieudefensie v Shell (2021) and lawsuits against oil majors over climate damages have multiplied. How should a governance-focused investor interpret this trend?","o":[["As a reason to stop all engagement with companies.","Litigation risk is a reason to engage on transition plans."],["As a force for change raising the legal risk of inaction.","Litigation makes externalities and governance failures financially material."],["As proof that all oil companies will go bankrupt soon.","Litigation increases risk but does not imply certain bankruptcy."],["As irrelevant, since courts cannot affect companies.","Court orders and damages can affect strategy and value."]],"c":[1],"es":"Litigation is a force for change that makes inaction costly.","ed":"Lecture 5 contrasts forces that maintain the status quo (short-termism, incentives) with forces for change (litigation, regulation, investor pressure). Investors can ask boards how they manage legal climate risk and whether transition plans are credible.","kt":"Climate litigation: legal action against firms or governments over climate change, e.g. demanding emission cuts or damages.","src":"L5 slide 40 · L3 slide 20"},{"id":"SB191","l":"L5","t":"Governance models","f":"m","d":3,"p":"M","sc":"none","s":"The textbook says the challenge is to \"combine the best of both worlds\". Which statement describes the strengths being combined?","o":[["The shareholder model's long-term horizon free from short-term pressure","The shareholder model is criticised for focusing too heavily on short-term shareholder interests."],["The stakeholder model's broad approach that incorporates all interests","The stakeholder model's strength is its breadth."],["The stakeholder model's strong takeover market that disciplines managers","Takeover discipline is weaker in stakeholder/civil law systems."],["Defences such as priority shares that increase market discipline","Takeover defences reduce market discipline and may lower the share price."]],"c":[1],"es":"Combine shareholder-model accountability (takeovers, removal) with the stakeholder model's breadth.","ed":"The shareholder model offers accountability (limited-term contracts, performance pay, takeovers after underperformance) but can focus too heavily on short-term shareholder interests. The stakeholder model incorporates all interests but entrenches management. General takeover defences (certified or priority shares) reduce market discipline and may lower the share price, so the textbook instead proposes a societal cost-benefit test for takeovers based on integrated value. Also correct: The shareholder model's accountability, with removal of management or a takeover possible after structural underperformance.","kt":"","src":"Bok s. 84 (3.3) · Bok s. 85 (3.3.1)"},{"id":"SB192","l":"L5","t":"Integrated reporting and investor base","f":"m","d":3,"p":"M","sc":"none","s":"According to Knauer and Serafeim (2014), as cited in the textbook, how can companies attract long-term investors?","o":[["By committing to integrated thinking and integrated reporting.","Firms need not take their investor base as given; integrated reporting attracts long-term investors."],["By issuing quarterly earnings guidance and beating it each quarter.","This would attract short-term investors."],["By paying executives large annual cash bonuses tied to the share price.","This reinforces short-termism."],["By listing on as many exchanges as possible to maximise trading volume.","Trading volume is not the mechanism discussed."]],"c":[0],"es":"Integrated thinking and reporting credibly signal long-term commitment and attract long-term investors.","ed":"A company is not stuck with its investor base. By adopting integrated thinking and reporting, top leadership credibly communicates its commitment to long-term value creation and strong stakeholder relationships, which attracts investors with longer horizons and better aligns incentives with the strategy. This is guideline 2's point that integrated reporting increases transparency and accountability.","kt":"","src":"Bok s. 92 (3.4.1) · Bok s. 87 (3.3.2)"},{"id":"SB193","l":"L5","t":"Governance of sustainability","f":"m","d":5,"p":"H","sc":"constructed_scenario","s":"Constructed scenario: A listed mining company wants to make its board accountable for cutting emissions over the next ten years without encouraging greenwashing. Which measure is most consistent with Lectures 5 and 7?","o":[["Switch to quarterly emissions targets to keep management focused.","Quarterly targets reinforce short-termism for a ten-year goal."],["Reward the CEO with an annual cash bonus for \"improving sustainability\" as judged by the CEO.","Vague, discretionary, short-term targets are exactly the criticised design."],["Tie part of executive pay to audited, quantitative emission reductions measured over several years, with deferral and clawback.","Strategic, measurable, long
